csb[1] = "In the first year of Darius the Mede, I stood up to strengthen and protect him.)";
csb[2] = "Now I will tell you the truth. &quot;Three more kings will arise in Persia, and the fourth will be far richer than the others. By the power he gains through his riches, he will stir up everyone against the kingdom of Greece.";
csb[3] = "&quot;Then a warrior king will arise; he will rule a vast realm and do whatever he wants.";
csb[4] = "&quot;But as soon as he is established, his kingdom will be broken up and divided to the four winds of heaven, but not to his descendants; it will not be the same kingdom that he ruled, because his kingdom will be uprooted and will go to others besides them.";
csb[5] = "&quot;The king of the South will grow powerful, but one of his commanders will grow more powerful and will rule a kingdom greater than his.";
csb[6] = "&quot;After some years they will form an alliance, and the daughter of the king of the South will go to the king of the North to seal the agreement. She will not retain power, and his strength will not endure. She will be given up, together with her entourage, her father, and the one who supported her during those times.";
csb[7] = "&quot;In the place of the king of the South, one from her family will rise up, come against the army, and enter the fortress of the king of the North. He will take action against them and triumph.";
csb[8] = "&quot;He will take even their gods captive to Egypt, with their metal images and their precious articles of silver and gold. For some years he will stay away from the king of the North,";
csb[9] = "&quot;who will enter the kingdom of the king of the South and then return to his own land.";
csb[10] = "&quot;His sons will mobilize for war and assemble a large number of armed forces. They will advance, sweeping through like a flood, and will again wage war as far as his fortress.";
csb[11] = "&quot;Infuriated, the king of the South will march out to fight with the king of the North, who will raise a large army, but they will be handed over to his enemy.";
csb[12] = "&quot;When the army is carried off, he will become arrogant and cause tens of thousands to fall, but he will not triumph.";
csb[13] = "&quot;The king of the North will again raise a multitude larger than the first. After some years he will advance with a great army and many supplies.";
csb[14] = "&quot;In those times many will rise up against the king of the South. Violent ones among your own people will assert themselves to fulfill a vision, but they will fail.";
csb[15] = "&quot;Then the king of the North will come, build up a siege ramp, and capture a well-fortified city. The forces of the South will not stand; even their select troops will not be able to resist.";
csb[16] = "&quot;The king of the North who comes against him will do whatever he wants, and no one can oppose him. He will establish himself in the beautiful land with total destruction in his hand.";
csb[17] = "&quot;He will resolve to come with the force of his whole kingdom and will reach an agreement with him. He will give him a daughter in marriage to destroy it, but she will not stand with him or support him.";
csb[18] = "&quot;Then he will turn his attention to the coasts and islands and capture many. But a commander will put an end to his taunting; instead, he will turn his taunts against him.";
csb[19] = "&quot;He will turn his attention back to the fortresses of his own land, but he will stumble, fall, and be no more.";
csb[20] = "&quot;In his place one will arise who will send out a tax collector for the glory of the kingdom; but within a few days he will be broken, though not in anger or in battle.";
csb[21] = "&quot;In his place a despised person will arise; royal honors will not be given to him, but he will come during a time of peace and seize the kingdom by intrigue.";
csb[22] = "&quot;A flood of forces will be swept away before him; they will be broken, as well as the covenant prince.";
csb[23] = "&quot;After an alliance is made with him, he will act deceitfully. He will rise to power with a small nation.";
csb[24] = "&quot;During a time of peace, he will come into the richest parts of the province and do what his fathers and predecessors never did. He will lavish plunder, loot, and wealth on his followers, and he will make plans against fortified cities, but only for a time.";
csb[25] = "&quot;With a large army he will stir up his power and his courage against the king of the South. The king of the South will prepare for battle with an extremely large and powerful army, but he will not succeed, because plots will be made against him.";
csb[26] = "&quot;Those who eat his provisions will destroy him; his army will be swept away, and many will fall slain.";
csb[27] = "&quot;The two kings, whose hearts are bent on evil, will speak lies at the same table but to no avail, for still the end will come at the appointed time.";
csb[28] = "&quot;The king of the North will return to his land with great wealth, but his heart will be set against the holy covenant; he will take action, then return to his own land.";
csb[29] = "&quot;At the appointed time he will come again to the South, but this time will not be like the first.";
csb[30] = "&quot;Ships of Kittim will come against him, and being intimidated, he will withdraw. Then he will rage against the holy covenant and take action. On his return, he will favor those who abandon the holy covenant.";
csb[31] = "&quot;His forces will rise up and desecrate the temple fortress. They will abolish the regular sacrifice and set up the abomination of desolation.";
csb[32] = "&quot;With flattery he will corrupt those who act wickedly toward the covenant, but the people who know their God will be strong and take action.";
csb[33] = "&quot;Those who have insight among the people will give understanding to many, yet they will fall by the sword and flame, and be captured and plundered for a time.";
csb[34] = "&quot;When they fall, they will be helped by some, but many others will join them insincerely.";
csb[35] = "&quot;Some of those who have insight will fall so that they may be refined, purified, and cleansed until the time of the end, for it will still come at the appointed time.";
csb[36] = "&quot;Then the king will do whatever he wants. He will exalt and magnify himself above every god, and he will say outrageous things against the God of gods. He will be successful until the time of wrath is completed, because what has been decreed will be accomplished.";
csb[37] = "&quot;He will not show regard for the gods of his fathers, the god desired by women, or for any other god, because he will magnify himself above all.";
csb[38] = "&quot;Instead, he will honor a god of fortresses -- a god his fathers did not know -- with gold, silver, precious stones, and riches.";
csb[39] = "&quot;He will deal with the strongest fortresses with the help of a foreign god. He will greatly honor those who acknowledge him, making them rulers over many and distributing land as a reward.";
csb[40] = "&quot;At the time of the end, the king of the South will engage him in battle, but the king of the North will storm against him with chariots, horsemen, and many ships. He will invade countries and sweep through them like a flood.";
csb[41] = "&quot;He will also invade the beautiful land, and many will fall. But these will escape from his power: Edom, Moab, and the prominent people of the Ammonites.";
csb[42] = "&quot;He will extend his power against the countries, and not even the land of Egypt will escape.";
csb[43] = "&quot;He will get control over the hidden treasures of gold and silver and over all the riches of Egypt. The Libyans and Cushites will also be in submission.";
csb[44] = "&quot;But reports from the east and the north will terrify him, and he will go out with great fury to annihilate and completely destroy many.";
csb[45] = "&quot;He will pitch his royal tents between the sea and the beautiful holy mountain, but he will meet his end with no one to help him.";
kjv[1] = "Also I in the first year of Darius the Mede, [even] I, stood to confirm and to strengthen him.";
rsv[1] = "And as for me, in the first year of Darius the Mede, I stood up to confirm and strengthen him.";
asv[1] = "And as for me, in the first year of Darius the Mede, I stood up to confirm and strengthen him.";
yng[1] = "`And I, in the first year of Darius the Mede, my standing [is] for a strengthener, and for a stronghold to him;";
dby[1] = "And I, in the first year of Darius the Mede, I stood to confirm and to strengthen him.";
web[1] = "Also I, in the first year of Darius the Mede, [even] I, stood to confirm and to strengthen him.";
hnv[1] = "&quot;As for me, in the first year of Daryavesh the Madian, I stood up to confirm and strengthen him.";
vul[1] = "Ego autem ab anno primo Darii Medi stabam ut confortaretur, et roboraretur.";
kjv[2] = "And now will I shew thee the truth. Behold, there shall stand up yet three kings in Persia; and the fourth shall be far richer than [they] all: and by his strength through his riches he shall stir up all against the realm of Grecia.";
rsv[2] = "&quot;And now I will show you the truth. Behold, three more kings shall arise in Persia; and a fourth shall be far richer than all of them; and when he has become strong through his riches, he shall stir up all against the kingdom of Greece.";
asv[2] = "And now will I show thee the truth. Behold, there shall stand up yet three kings in Persia; and the fourth shall be far richer than they all: and when he is waxed strong through his riches, he shall stir up all against the realm of Greece.";
yng[2] = "and, now, truth I declare to thee, Lo, yet three kings are standing for Persia, and the fourth doth become far richer than all, and according to his strength by his riches he stirreth up the whole, with the kingdom of Javan.";
dby[2] = "And now will I declare unto thee the truth. Behold, there shall stand up yet three kings in Persia; and the fourth shall enrich himself with great riches more than all; and when he hath become strong through his riches, he shall stir up all against the realm of Greece.";
web[2] = "And now will I show thee the truth. Behold, there shall stand up yet three kings in Persia; and the fourth shall be far richer than [they] all: and by his strength through his riches he shall stir up all against the realm of Grecia.";
hnv[2] = "Now will I show you the truth. Behold, there shall stand up yet three kings in Paras; and the fourth shall be far richer than they all: and when he has grown strong through his riches, he shall stir up all against the realm of Yavan.";
vul[2] = "Et nunc veritatem annunciabo tibi. Ecce adhuc tres reges stabunt in Perside, et quartus ditabitur opibus nimiis super omnes: et cum invaluerit divitiis suis, concitabit omnes adversum regnum Graeciae.";
kjv[3] = "And a mighty king shall stand up, that shall rule with great dominion, and do according to his will.";
rsv[3] = "Then a mighty king shall arise, who shall rule with great dominion and do according to his will.";
asv[3] = "And a mighty king shall stand up, that shall rule with great dominion, and do according to his will.";
yng[3] = "And a mighty king hath stood, and he hath ruled a great dominion, and hath done according to his will;";
dby[3] = "And a mighty king shall stand up that shall rule with great dominion, and do according to his will.";
web[3] = "And a mighty king shall stand up, that shall rule with great dominion, and do according to his will.";
hnv[3] = "A mighty king shall stand up, who shall rule with great dominion, and do according to his will.";
vul[3] = "Surget vero rex fortis, et dominabitur potestate multa: et faciet quod placuerit ei.";
kjv[4] = "And when he shall stand up, his kingdom shall be broken, and shall be divided toward the four winds of heaven; and not to his posterity, nor according to his dominion which he ruled: for his kingdom shall be plucked up, even for others beside those.";
rsv[4] = "And when he has arisen, his kingdom shall be broken and divided toward the four winds of heaven, but not to his posterity, nor according to the dominion with which he ruled; for his kingdom shall be plucked up and go to others besides these.";
asv[4] = "And when he shall stand up, his kingdom shall be broken, and shall be divided toward the four winds of heaven, but not to his posterity, nor according to his dominion wherewith he ruled; for his kingdom shall be plucked up, even for others besides these.";
yng[4] = "and according to his standing is his kingdom broken, and divided to the four winds of the heavens, and not to his posterity, nor according to his dominion that he ruled, for his kingdom is plucked up -- and for others apart from these.";
dby[4] = "And when he shall stand up, his kingdom shall be broken, and shall be divided toward the four winds of the heavens; but not to his posterity, nor according to his dominion wherewith he ruled; for his kingdom shall be plucked up, even for others beside these.";

vul[4] = "Et cum steterit, conteretur regnum eius, et dividetur in quattuor ventos caeli: sed non in posteros eius, neque secundum potentiam illius, qua dominatus est. lacerabitur enim regnum eius etiam in externos, exceptis his.";
kjv[5] = "And the king of the south shall be strong, and [one] of his princes; and he shall be strong above him, and have dominion; his dominion [shall be] a great dominion.";
rsv[5] = "&quot;Then the king of the south shall be strong, but one of his princes shall be stronger than he and his dominion shall be a great dominion.";
asv[5] = "And the king of the south shall be strong, and [one] of his princes; and he shall be strong above him, and have dominion; his dominion shall be a great dominion.";
yng[5] = "`And a king of the south -- even of his princes -- doth become strong, and doth prevail against him, and hath ruled; a great dominion [is] his dominion.";
dby[5] = "And the king of the south, who is one of his princes, shall be strong; but [another] shall be stronger than he, and have dominion: his dominion shall be a great dominion.";
web[5] = "And the king of the south shall be strong, and [one] of his princes; and he shall be strong above him, and have dominion; his dominion [shall be] a great dominion.";
hnv[5] = "The king of the south shall be strong, and [one] of his princes; and he shall be strong above him, and have dominion; his dominion shall be a great dominion.";

kjv[6] = "And in the end of years they shall join themselves together; for the king\'s daughter of the south shall come to the king of the north to make an agreement: but she shall not retain the power of the arm; neither shall he stand, nor his arm: but she shall be given up, and they that brought her, and he that begat her, and he that strengthened her in [these] times.";
rsv[6] = "After some years they shall make an alliance, and the daughter of the king of the south shall come to the king of the north to make peace; but she shall not retain the strength of her arm, and he and his offspring shall not endure; but she shall be given up, and her attendants, her child, and he who got possession of her.";
asv[6] = "And at the end of years they shall join themselves together; and the daughter of the king of the south shall come to the king of the north to make an agreement: but she shall not retain the strength of her arm; neither shall he stand, nor his arm; but she shall be given up, and they that brought her, and he that begat her, and he that strengthened her in those times.";
yng[6] = "`And at the end of years they do join themselves together, and a daughter of the king of the south doth come in unto the king of the north to do upright things; and she doth not retain the power of the arm; and he doth not stand, nor his arm; and she is given up, she, and those bringing her in, and her child, and he who is strengthening her in [these] times.";
dby[6] = "And after the course of years they shall join affinity; and the king\'s daughter of the south shall come to the king of the north to make equitable conditions: but she shall not retain the strength of her arm; neither shall he stand, nor his arm; and she shall be given up, she and they that brought her, and he that begat her, and he that strengthened her in [those] times.";
web[6] = "And in the end of years they shall join themselves together; for the king\'s daughter of the south shall come to the king of the north to make an agreement: but she shall not retain the power of the arm; neither shall he stand, nor his arm: but she shall be given up, and they that brought her, and he that begat her, and he that strengthened her in [these] times.";
hnv[6] = "At the end of years they shall join themselves together; and the daughter of the king of the south shall come to the king of the north to make an agreement: but she shall not retain the strength of her arm; neither shall he stand, nor his arm; but she shall be given up, and those who brought her, and he who became the father of her, and he who strengthened her in those times.";
vul[6] = "Et post finem annorum foederabuntur: filiaque regis Austri veniet ad regem Aquilonis facere amicitiam, et non obtinebit fortitudinem brachii, nec stabit semen eius: et tradetur ipsa, et qui adduxerunt eam, adolescentes eius, et qui confortabant eam in temporibus.";
kjv[7] = "But out of a branch of her roots shall [one] stand up in his estate, which shall come with an army, and shall enter into the fortress of the king of the north, and shall deal against them, and shall prevail:";
rsv[7] = "&quot;In those times a branch from her roots shall arise in his place; he shall come against the army and enter the fortress of the king of the north, and he shall deal with them and shall prevail.";
asv[7] = "But out of a shoot from her roots shall one stand up in his place, who shall come unto the army, and shall enter into the fortress of the king of the north, and shall deal against them, and shall prevail.";
yng[7] = "`And [one] hath stood up from a branch of her roots, [in] his station, and he cometh in unto the bulwark, yea, he cometh into a stronghold of the king of the south, and hath wrought against them, and hath done mightily;";
dby[7] = "But out of a shoot from her roots shall one stand up in his place, who shall come to the army, and shall enter into the fortress of the king of the north, and shall deal against them, and shew himself mighty.";
web[7] = "But out of a branch of her roots shall [one] stand up in his estate, who shall come with an army, and shall enter into the fortress of the king of the north, and shall deal against them, and shall prevail:";
hnv[7] = "But out of a shoot from her roots shall one stand up in his place, who shall come to the army, and shall enter into the fortress of the king of the north, and shall deal against them, and shall prevail.";
vul[7] = "Et stabit de germine radicum eius plantatio: et veniet cum exercitu, et ingredietur provinciam regis Aquilonis: et abutetur eis, et obtinebit.";
kjv[8] = "And shall also carry captives into Egypt their gods, with their princes, [and] with their precious vessels of silver and of gold; and he shall continue [more] years than the king of the north.";
rsv[8] = "He shall also carry off to Egypt their gods with their molten images and with their precious vessels of silver and of gold; and for some years he shall refrain from attacking the king of the north.";
asv[8] = "And also their gods, with their molten images, [and] with their goodly vessels of silver and of gold, shall he carry captive into Egypt; and he shall refrain some years from the king of the north.";
yng[8] = "and also their gods, with their princes, with their desirable vessels of silver and gold, into captivity he bringeth [into] Egypt; and he doth stand more years than the king of the north.";
dby[8] = "He shall also carry captive into Egypt their gods, with their princes, and their precious vessels of silver and of gold; and he shall subsist for more years than the king of the north;";
web[8] = "And shall also carry captives into Egypt their gods, with their princes, [and] with their precious vessels of silver and of gold; and he shall continue [more] years than the king of the north.";
hnv[8] = "Also their gods, with their molten images, [and] with their goodly vessels of silver and of gold, shall he carry captive into Mitzrayim; and he shall refrain some years from the king of the north.";
vul[8] = "Insuper et deos eorum, et sculptilia, vasa quoque pretiosa argenti, et auri captiva ducet in Aegyptum: ipse praevalebit adversus regem Aquilonis.";

asv[10] = "And his sons shall war, and shall assemble a multitude of great forces, which shall come on, and overflow, and pass through; and they shall return and war, even to his fortress.";
yng[10] = "and his sons stir themselves up, and have gathered a multitude of great forces, and he hath certainly come in, and overflowed, and passed through, and he turneth back, and they stir themselves up unto his stronghold.";
dby[10] = "And his sons shall be stirred up, and shall assemble a multitude of great forces; and one shall certainly come, and overflow, and pass through; and he shall return and carry the war even to his fortress.";
web[10] = "But his sons shall be stirred up, and shall assemble a multitude of great forces: and [one] shall certainly come, and overflow, and pass through: then shall he return, and be stirred up, [even] to his fortress.";
hnv[10] = "His sons shall war, and shall assemble a multitude of great forces, which shall come on, and overflow, and pass through; and they shall return and war, even to his fortress.";
vul[10] = "Filii autem eius provocabuntur, et congregabunt multitudinem exercituum plurimorum: et veniet properans, et inundans: et revertetur, et concitabitur, et congredietur cum robere eius.";

dby[11] = "And the king of the south shall be enraged, and shall come forth and fight with him, with the king of the north, who shall set forth a great multitude, but the multitude shall be given into his hand.";
web[11] = "And the king of the south shall be moved with wrath, and shall come forth and fight with him, [even] with the king of the north: and he shall set forth a great multitude; but the multitude shall be given into his hand.";

asv[12] = "And the multitude shall be lifted up, and his heart shall be exalted; and he shall cast down tens of thousands, but he shall not prevail.";
yng[12] = "and he hath carried away the multitude, his heart is high, and he hath caused myriads to fall, and he doth not become strong.";
dby[12] = "And when the multitude shall have been taken away, his heart shall be exalted; and he shall cast down myriads; but he shall not prevail.";

hnv[12] = "The multitude shall be lifted up, and his heart shall be exalted; and he shall cast down tens of thousands, but he shall not prevail.";

asv[13] = "And the king of the north shall return, and shall set forth a multitude greater than the former; and he shall come on at the end of the times, [even of] years, with a great army and with much substance.";
yng[13] = "`And the king of the north hath turned back, and hath caused a multitude to stand, greater than the first, and at the end of the times a second time he doth certainly come in with a great force, and with much substance;";
dby[13] = "For the king of the north shall return, and shall set forth a multitude greater than the former; and shall certainly come at the end of the times of years with a great army and with much substance.";
web[13] = "For the king of the north shall return, and shall set forth a multitude greater than the former, and shall certainly come after certain years with a great army and with much riches.";
hnv[13] = "The king of the north shall return, and shall set forth a multitude greater than the former; and he shall come on at the end of the times, [even of] years, with a great army and with much substance.";
vul[13] = "Convertetur enim rex Aquilonis, et praeparabit multitudinem multo maiorem quam prius: et in fine temporum, annorumque veniet properans cum exercitu magno, et opibus nimiis.";
kjv[14] = "And in those times there shall many stand up against the king of the south: also the robbers of thy people shall exalt themselves to establish the vision; but they shall fall.";
rsv[14] = "&quot;In those times many shall rise against the king of the south; and the men of violence among your own people shall lift themselves up in order to fulfil the vision; but they shall fail.";
asv[14] = "And in those times there shall many stand up against the king of the south: also the children of the violent among thy people shall lift themselves up to establish the vision; but they shall fall.";
yng[14] = "and in those times many do stand up against the king of the south, and sons of the destroyers of thy people do lift themselves up to establish the vision -- and they have stumbled.";

web[14] = "And in those times there shall many stand up against the king of the south: also the robbers of thy people shall exalt themselves to establish the vision; but they shall fall.";
hnv[14] = "In those times there shall many stand up against the king of the south: also the children of the violent among your people shall lift themselves up to establish the vision; but they shall fall.";
vul[14] = "(t) Et in temporibus illis multi consurgent adversus regem Austri: filii quoque praevaricatorum populi tui extollentur ut impleant visionem, et corruent.";
kjv[15] = "So the king of the north shall come, and cast up a mount, and take the most fenced cities: and the arms of the south shall not withstand, neither his chosen people, neither [shall there be any] strength to withstand.";
rsv[15] = "Then the king of the north shall come and throw up siegeworks, and take a well-fortified city. And the forces of the south shall not stand, or even his picked troops, for there shall be no strength to stand.";
asv[15] = "So the king of the north shall come, and cast up a mound, and take a well-fortified city: and the forces of the south shall not stand, neither his chosen people, neither shall there be any strength to stand.";
yng[15] = "`And the king of the north cometh in, and poureth out a mount, and hath captured fenced cities; and the arms of the south do not stand, nor the people of his choice, yea, there is no power to stand.";
dby[15] = "And the king of the north shall come, and cast up a mound, and take the well-fenced city; and the arms of the south shall not withstand, neither his chosen people, for there shall be no strength to withstand.";
web[15] = "So the king of the north shall come, and cast up a mount, and take the most fortified cities: and the arms of the south shall not withstand, neither his chosen people, neither [shall there be any] strength to withstand.";
hnv[15] = "So the king of the north shall come, and cast up a mound, and take a well-fortified city: and the forces of the south shall not stand, neither his chosen people, neither shall there be any strength to stand.";
vul[15] = "Et venit rex Aquilonis, et comportabit aggerem, et capiet urbes munitissimas: et brachia Austri non sustinebunt, et consurgent electi eius ad resistendum, et non erit fortitudo.";
kjv[16] = "But he that cometh against him shall do according to his own will, and none shall stand before him: and he shall stand in the glorious land, which by his hand shall be consumed.";
rsv[16] = "But he who comes against him shall do according to his own will, and none shall stand before him; and he shall stand in the glorious land, and all of it shall be in his power.";
asv[16] = "But he that cometh against him shall do according to his own will, and none shall stand before him; and he shall stand in the glorious land, and in his hand shall be destruction.";
yng[16] = "And he who is coming unto him doth according to his will, and there is none standing before him; and he standeth in the desirable land, and [it is] wholly in his hand.";
dby[16] = "And he that cometh against him shall do according to his own will, and none shall stand before him; and he shall stand in the land of beauty, and destruction shall be in his hand.";
web[16] = "But he that cometh against him shall do according to his own will, and none shall stand before him: and he shall stand in the glorious land, which by his hand shall be consumed.";
hnv[16] = "But he who comes against him shall do according to his own will, and none shall stand before him; and he shall stand in the glorious land, and in his hand shall be destruction.";
vul[16] = "Et faciet veniens super eum iuxta placitum suum, et non erit qui stet contra faciem eius: et stabit in terra inclyta, et consumetur in manu eius.";
kjv[17] = "He shall also set his face to enter with the strength of his whole kingdom, and upright ones with him; thus shall he do: and he shall give him the daughter of women, corrupting her: but she shall not stand [on his side], neither be for him.";
rsv[17] = "He shall set his face to come with the strength of his whole kingdom, and he shall bring terms of peace and perform them. He shall give him the daughter of women to destroy the kingdom; but it shall not stand or be to his advantage.";
asv[17] = "And he shall set his face to come with the strength of his whole kingdom, and with him equitable conditions; and he shall perform them: and he shall give him the daughter of women, to corrupt her; but she shall not stand, neither be for him.";
yng[17] = "And he setteth his face to go in with the strength of his whole kingdom, and upright ones with him; and he hath wrought, and the daughter of women he giveth to him, to corrupt her; and she doth not stand, nor is for him.";
dby[17] = "And he shall set his face to come with the strength of his whole kingdom, and upright ones with him; and he shall practise; and he shall give him the daughter of women, to corrupt her; but she shall not stand, neither shall she be for him.";
web[17] = "He shall also set his face to enter with the strength of his whole kingdom, and upright ones with him; thus shall he do: and he shall give him the daughter of women, corrupting her: but she shall not stand [on his side], neither be for him.";
hnv[17] = "He shall set his face to come with the strength of his whole kingdom, and with him equitable conditions; and he shall perform them: and he shall give him the daughter of women, to corrupt her; but she shall not stand, neither be for him.";
vul[17] = "Et ponet faciem suam ut veniat ad tenendum universum regnum eius, et recta faciet cum eo: et filiam feminarum dabit ei, ut evertat illud: et non stabit, nec illius erit.";
kjv[18] = "After this shall he turn his face unto the isles, and shall take many: but a prince for his own behalf shall cause the reproach offered by him to cease; without his own reproach he shall cause [it] to turn upon him.";
rsv[18] = "Afterward he shall turn his face to the coastlands, and shall take many of them; but a commander shall put an end to his insolence; indeed he shall turn his insolence back upon him.";
asv[18] = "After this shall he turn his face unto the isles, and shall take many: but a prince shall cause the reproach offered by him to cease; yea, moreover, he shall cause his reproach to turn upon him.";
yng[18] = "`And he turneth back his face to the isles, and hath captured many; and a prince hath caused his reproach of himself to cease; without his reproach he turneth [it] back to him.";
dby[18] = "And he shall turn his face unto the isles, and shall take many; but a captain for his own behalf shall cause the reproach offered by him to cease: he shall turn it upon him, without reproach for himself.";
web[18] = "After this shall he turn his face to the isles, and shall take many: but a prince for his own behalf shall cause the reproach offered by him to cease; without his own reproach he shall cause [it] to turn upon him.";
hnv[18] = "After this shall he turn his face to the isles, and shall take many: but a prince shall cause the reproach offered by him to cease; yes, moreover, he shall cause his reproach to turn on him.";
vul[18] = "Et convertet faciem suam ad insulas, et capiet multas: et cessare faciet principem opprobrii sui, et opprobrium eius convertetur in eum.";
kjv[19] = "Then he shall turn his face toward the fort of his own land: but he shall stumble and fall, and not be found.";
rsv[19] = "Then he shall turn his face back toward the fortresses of his own land; but he shall stumble and fall, and shall not be found.";
asv[19] = "Then he shall turn his face toward the fortresses of his own land; but he shall stumble and fall, and shall not be found.";
yng[19] = "And he turneth back his face to the strongholds of his land, and hath stumbled and fallen, and is not found.";
dby[19] = "And he shall turn his face toward the fortresses of his own land; and he shall stumble and fall, and not be found.";
web[19] = "Then he shall turn his face towards the fort of his own land: but he shall stumble and fall, and not be found.";
hnv[19] = "Then he shall turn his face toward the fortresses of his own land; but he shall stumble and fall, and shall not be found.";
vul[19] = "Et convertet faciem suam ad imperium terrae suae, et impinget, et corruet, et non invenietur.";
kjv[20] = "Then shall stand up in his estate a raiser of taxes [in] the glory of the kingdom: but within few days he shall be destroyed, neither in anger, nor in battle.";
rsv[20] = "&quot;Then shall arise in his place one who shall send an exactor of tribute through the glory of the kingdom; but within a few days he shall be broken, neither in anger nor in battle.";
asv[20] = "Then shall stand up in his place one that shall cause an exactor to pass through the glory of the kingdom; but within few days he shall be destroyed, neither in anger, nor in battle.";
yng[20] = "`And stood up on his station hath [one] causing an exactor to pass over the honour of the kingdom, and in a few days he is destroyed, and not in anger, nor in battle.";
dby[20] = "And in his place shall one stand up who shall cause the exactor to pass through the glory of the kingdom; but in a few days he shall be broken, neither in anger nor in battle.";
web[20] = "Then shall stand up in his estate a raiser of taxes [in] the glory of the kingdom: but within few days he shall be destroyed, neither in anger, nor in battle.";
hnv[20] = "Then shall stand up in his place one who shall cause a tax collector to pass through the kingdom to maintain its glory; but within few days he shall be destroyed, neither in anger, nor in battle.";
vul[20] = "Et stabit in loco eius vilissimus, et indignus decore regio: et in paucis diebus conteretur, non in furore, nec in praelio.";
kjv[21] = "And in his estate shall stand up a vile person, to whom they shall not give the honour of the kingdom: but he shall come in peaceably, and obtain the kingdom by flatteries.";
rsv[21] = "In his place shall arise a contemptible person to whom royal majesty has not been given; he shall come in without warning and obtain the kingdom by flatteries.";
asv[21] = "And in his place shall stand up a contemptible person, to whom they had not given the honor of the kingdom: but he shall come in time of security, and shall obtain the kingdom by flatteries.";
yng[21] = "`And stood up on his station hath a despicable one, and they have not given unto him the honour of the kingdom, and he hath come in quietly, and hath strengthened the kingdom by flatteries.";
dby[21] = "And in his place shall stand up a vile person, to whom they shall not give the honour of the kingdom; but he shall come in peaceably and obtain the kingdom by flatteries.";
web[21] = "And in his estate shall stand up a vile person, to whom they shall not give the honor of the kingdom: but he shall come in peaceably, and obtain the kingdom by flatteries.";
hnv[21] = "In his place shall stand up a contemptible person, to whom they had not given the honor of the kingdom: but he shall come in time of security, and shall obtain the kingdom by flatteries.";
vul[21] = "Et stabit in loco eius despectus, et non tribuetur ei honor regius: et veniet clam, et obtinebit regnum in fraudulentia.";
kjv[22] = "And with the arms of a flood shall they be overflown from before him, and shall be broken; yea, also the prince of the covenant.";
rsv[22] = "Armies shall be utterly swept away before him and broken, and the prince of the covenant also.";
asv[22] = "And the overwhelming forces shall be overwhelmed from before him, and shall be broken; yea, also the prince of the covenant.";
yng[22] = "And the arms of the flood are overflowed from before him, and are broken; and also the leader of the covenant.";
dby[22] = "And the overflowing forces shall be overflowed from before him, and shall be broken: yea, also the prince of the covenant.";
web[22] = "And with the arms of a flood shall they be overflowed from before him, and shall be broken; yes, also the prince of the covenant.";
hnv[22] = "The overwhelming forces shall be overwhelmed from before him, and shall be broken; yes, also the prince of the covenant.";
vul[22] = "Et brachia pugnantis expugnabuntur a facie eius, et conterentur: insuper et dux foederis.";
kjv[23] = "And after the league [made] with him he shall work deceitfully: for he shall come up, and shall become strong with a small people.";
rsv[23] = "And from the time that an alliance is made with him he shall act deceitfully; and he shall become strong with a small people.";
asv[23] = "And after the league made with him he shall work deceitfully; for he shall come up, and shall become strong, with a small people.";
yng[23] = "And after they join themselves unto him, he worketh deceit, and hath increased, and hath been strong by a few of the nation.";
dby[23] = "And after the league made with him he shall work deceitfully, and he shall come up, and shall become strong with a small people.";
web[23] = "And after the league [made] with him he shall work deceitfully: for he shall come up, and shall become strong with a small people.";
hnv[23] = " After the league made with him he shall work deceitfully; for he shall come up, and shall become strong, with a small people.";
vul[23] = "Et post amicitias, cum eo faciet dolum: et ascendet, et superabit in modico populo.";
kjv[24] = "He shall enter peaceably even upon the fattest places of the province; and he shall do [that] which his fathers have not done, nor his fathers\' fathers; he shall scatter among them the prey, and spoil, and riches: [yea], and he shall forecast his devices against the strong holds, even for a time.";
rsv[24] = "Without warning he shall come into the richest parts of the province; and he shall do what neither his fathers nor his fathers\' fathers have done, scattering among them plunder, spoil, and goods. He shall devise plans against strongholds, but only for a time.";
asv[24] = "In time of security shall he come even upon the fattest places of the province; and he shall do that which his fathers have not done, nor his fathers\' fathers; he shall scatter among them prey, and spoil, and substance: yea, he shall devise his devices against the strongholds, even for a time.";
yng[24] = "Peaceably even into the fertile places of the province He cometh, and he hath done that which his fathers did not, nor his fathers\' fathers; prey, and spoil, and substance, to them he scattereth, and against fenced places he deviseth his devices, even for a time.";
dby[24] = "In time of peace shall he enter even into the fattest places of the province; and he shall do that which his fathers have not done, nor his fathers\' fathers: he shall scatter among them prey, and spoil, and substance, and he shall plan his devices against the fortified places, even for a time.";
web[24] = "He shall enter peaceably even upon the fattest places of the province; and he shall do [that] which his fathers have not done, nor his fathers\' fathers; he shall scatter among them the prey, and spoil, and riches: [yes], and he shall forecast his devices against the strong holds, even for a time.";
hnv[24] = "In time of security shall he come even on the fattest places of the province; and he shall do that which his fathers have not done, nor his fathers\' fathers; he shall scatter among them prey, and spoil, and substance: yes, he shall devise his devices against the strongholds, even for a time.";
vul[24] = "Et abundantes, et uberes urbes ingredietur: et faciet quae non fecerunt patres eius, et patres patrum eius: rapinas, et praedam, et divinitas eorum dissipabit, et contra firmissimas cogitationes inibit: et hoc usque ad tempus.";
kjv[25] = "And he shall stir up his power and his courage against the king of the south with a great army; and the king of the south shall be stirred up to battle with a very great and mighty army; but he shall not stand: for they shall forecast devices against him.";
rsv[25] = "And he shall stir up his power and his courage against the king of the south with a great army; and the king of the south shall wage war with an exceedingly great and mighty army; but he shall not stand, for plots shall be devised against him.";
asv[25] = "And he shall stir up his power and his courage against the king of the south with a great army; and the king of the south shall war in battle with an exceeding great and mighty army; but he shall not stand; for they shall devise devices against him.";
yng[25] = "`And he stirreth up his power and his heart against the king of the south with a great force, and the king of the south stirreth himself up to battle with a very great and mighty force, and standeth not, for they devise devices against him,";
dby[25] = "And he shall stir up his power and his courage against the king of the south with a great army; and the king of the south shall engage in battle with an exceeding great and mighty army; but he shall not stand, for they shall plan devices against him.";
web[25] = "And he shall stir up his power and his courage against the king of the south with a great army; and the king of the south shall be stirred up to battle with a very great and mighty army; but he shall not stand: for they shall forecast devices against him.";
hnv[25] = "He shall stir up his power and his courage against the king of the south with a great army; and the king of the south shall war in battle with an exceeding great and mighty army; but he shall not stand; for they shall devise devices against him.";
vul[25] = "Et concitabitur fortitudo eius, et cor eius adversum regem Austri in exercitu magno: et rex Austri provocabitur ad bellum multis auxiliis, et fortibus nimis: et non stabunt, quia inibunt adversus eum consilia.";
kjv[26] = "Yea, they that feed of the portion of his meat shall destroy him, and his army shall overflow: and many shall fall down slain.";
rsv[26] = "Even those who eat his rich food shall be his undoing; his army shall be swept away, and many shall fall down slain.";
asv[26] = "Yea, they that eat of his dainties shall destroy him, and his army shall overflow; and many shall fall down slain.";
yng[26] = "and those eating his portion of food destroy him, and his force overfloweth, and fallen have many wounded.";
dby[26] = "And they that eat of his delicate food shall break him, and his army shall be dissolved; and many shall fall down slain.";
web[26] = "Yes, they that feed of the portion of his provisions shall destroy him, and his army shall overflow: and many shall fall down slain.";
hnv[26] = "Yes, they who eat of his dainties shall destroy him, and his army shall overflow; and many shall fall down slain.";
vul[26] = "Et comedentes panem cum eo, conterent illum, exercitusque eius opprimetur: et cadent interfecti plurimi.";
kjv[27] = "And both these kings\' hearts [shall be] to do mischief, and they shall speak lies at one table; but it shall not prosper: for yet the end [shall be] at the time appointed.";
rsv[27] = "And as for the two kings, their minds shall be bent on mischief; they shall speak lies at the same table, but to no avail; for the end is yet to be at the time appointed.";
asv[27] = "And as for both these kings, their hearts shall be to do mischief, and they shall speak lies at one table: but it shall not prosper; for yet the end shall be at the time appointed.";
yng[27] = "`And both of the kings\' hearts [are] to do evil, and at one table they speak lies, and it doth not prosper, for yet the end [is] at a time appointed.";
dby[27] = "And both these kings\' hearts [shall meditate] mischief, and they shall speak lies at one table; but it shall not prosper; for yet the end shall be at the time appointed.";
web[27] = "And both these kings hearts [shall be] to do mischief, and they shall speak lies at one table; but it shall not prosper: for yet the end [shall be] at the time appointed.";
hnv[27] = "As for both these kings, their hearts shall be to do mischief, and they shall speak lies at one table: but it shall not prosper; for yet the end shall be at the time appointed.";
vul[27] = "Duorum quoque regnum cor erit ut malefaciant, et ad mensam unam mendacium loquentur, et non proficient: quia adhuc finis in aliud tempus.";
kjv[28] = "Then shall he return into his land with great riches; and his heart [shall be] against the holy covenant; and he shall do [exploits], and return to his own land.";
rsv[28] = "And he shall return to his land with great substance, but his heart shall be set against the holy covenant. And he shall work his will, and return to his own land.";
asv[28] = "Then shall he return into his land with great substance; and his heart [shall be] against the holy covenant; and he shall do [his pleasure], and return to his own land.";
yng[28] = "And he turneth back [to] his land with great substance, and his heart [is] against the holy covenant, and he hath wrought, and turned back to his land.";
dby[28] = "And he shall return into his land with great substance; and his heart shall be against the holy covenant; and he shall practise, and return to his own land.";
web[28] = "Then shall he return into his land with great riches; and his heart [shall be] against the holy covenant; and he shall do [exploits], and return to his own land.";
hnv[28] = "Then shall he return into his land with great substance; and his heart [shall be] against the holy covenant; and he shall do [his pleasure], and return to his own land.";
vul[28] = "Et revertetur in terram suam cum opibus multis: et cor eius adversum testamentum sanctum, et faciet, et revertetur in terram suam.";
kjv[29] = "At the time appointed he shall return, and come toward the south; but it shall not be as the former, or as the latter.";
rsv[29] = "&quot;At the time appointed he shall return and come into the south; but it shall not be this time as it was before.";
asv[29] = "At the time appointed he shall return, and come into the south; but it shall not be in the latter time as it was in the former.";
yng[29] = "At the appointed time he turneth back, and hath come against the south, and it is not as the former, and as the latter.";
dby[29] = "At the set time he shall return, and come towards the south; but not as the former time shall be the latter;";
web[29] = "At the time appointed he shall return, and come towards the south; but it shall not be as the former, or as the latter.";
hnv[29] = "At the time appointed he shall return, and come into the south; but it shall not be in the latter time as it was in the former.";
vul[29] = "Statuto tempore revertetur, et veniet ad Austrum: et non erit priori simile novissimum.";
kjv[30] = "For the ships of Chittim shall come against him: therefore he shall be grieved, and return, and have indignation against the holy covenant: so shall he do; he shall even return, and have intelligence with them that forsake the holy covenant.";
rsv[30] = "For ships of Kittim shall come against him, and he shall be afraid and withdraw, and shall turn back and be enraged and take action against the holy covenant. He shall turn back and give heed to those who forsake the holy covenant.";
asv[30] = "For ships of Kittim shall come against him; therefore he shall be grieved, and shall return, and have indignation against the holy covenant, and shall do [his pleasure]: he shall even return, and have regard unto them that forsake the holy covenant.";
yng[30] = "And ships of Chittim have come in against him, and he hath been pained, and hath turned back, and hath been insolent toward the holy covenant, and hath wrought, and turned back, and he understandeth concerning those forsaking the holy covenant.";
dby[30] = "for ships of Chittim shall come against him; and he shall be grieved, and return, and have indignation against the holy covenant; and will practise; and he shall return and direct his attention to those that forsake the holy covenant.";
web[30] = "For the ships of Chittim shall come against him: therefore he shall be grieved, and return, and have indignation against the holy covenant: so shall he do; he shall even return, and have intelligence with them that forsake the holy covenant.";
hnv[30] = "For ships of Kittim shall come against him; therefore he shall be grieved, and shall return, and have indignation against the holy covenant, and shall do [his pleasure]: he shall even return, and have regard to those who forsake the holy covenant.";
vul[30] = "Et veniet super eum Trieres, et Romani: et percutietur, et revertetur, et indignabitur contra testamentum sanctuarii, et faciet: reverteturque et cogitabit adversum eos, qui dereliquerunt testamentum sanctuarii.";
kjv[31] = "And arms shall stand on his part, and they shall pollute the sanctuary of strength, and shall take away the daily [sacrifice], and they shall place the abomination that maketh desolate.";
rsv[31] = "Forces from him shall appear and profane the temple and fortress, and shall take away the continual burnt offering. And they shall set up the abomination that makes desolate.";
asv[31] = "And forces shall stand on his part, and they shall profane the sanctuary, even the fortress, and shall take away the continual [burnt-offering], and they shall set up the abomination that maketh desolate.";
yng[31] = "And strong ones out of him stand up, and have polluted the sanctuary, the stronghold, and have turned aside the continual [sacrifice], and appointed the desolating abomination.";
dby[31] = "And forces shall stand on his part, and they shall profane the sanctuary, the fortress, and shall take away the continual [sacrifice], and they shall place the abomination that maketh desolate.";
web[31] = "And arms shall stand on his part, and they shall pollute the sanctuary of strength, and shall take away the daily [sacrifice], and they shall place the abomination that maketh desolate.";
hnv[31] = "Forces shall stand on his part, and they shall profane the sanctuary, even the fortress, and shall take away the continual [burnt offering], and they shall set up the abomination that makes desolate.";
vul[31] = "Et brachia ex eo stabunt, et polluent sanctuarium fortitudinis, et auferent iuge sacrificium: et dabunt abominationem in desolationem.";
kjv[32] = "And such as do wickedly against the covenant shall he corrupt by flatteries: but the people that do know their God shall be strong, and do [exploits].";
rsv[32] = "He shall seduce with flattery those who violate the covenant; but the people who know their God shall stand firm and take action.";
asv[32] = "And such as do wickedly against the covenant shall he pervert by flatteries; but the people that know their God shall be strong, and do [exploits].";
yng[32] = "And those acting wickedly [against] the covenant, he defileth by flatteries; and the people knowing their God are strong, and have wrought.";
dby[32] = "And such as do wickedly against the covenant shall he pervert by flatteries; but the people that know their God shall be strong, and shall act.";
web[32] = "And such as do wickedly against the covenant shall he corrupt by flatteries: but the people that know their God shall be strong, and do [exploits].";
hnv[32] = "Such as do wickedly against the covenant shall he pervert by flatteries; but the people who know their God shall be strong, and do [exploits].";
vul[32] = "Et impii in testamentum simulabunt fraudulenter: populus autem sciens Deum suum, obtinebit, et faciet.";
kjv[33] = "And they that understand among the people shall instruct many: yet they shall fall by the sword, and by flame, by captivity, and by spoil, [many] days.";
rsv[33] = "And those among the people who are wise shall make many understand, though they shall fall by sword and flame, by captivity and plunder, for some days.";
asv[33] = "And they that are wise among the people shall instruct many; yet they shall fall by the sword and by flame, by captivity and by spoil, [many] days.";
yng[33] = "And the teachers of the people give understanding to many; and they have stumbled by sword, and by flame, by captivity, and by spoil -- days.";
dby[33] = "And they that are wise among the people shall instruct the many; and they shall fall by the sword, and by flame, by captivity, and by spoil, [many] days.";
web[33] = "And they that understand among the people shall instruct many: yet they shall fall by the sword, and by flame, by captivity, and by spoil, [many] days.";
hnv[33] = "Those who are wise among the people shall instruct many; yet they shall fall by the sword and by flame, by captivity and by spoil, [many] days.";
vul[33] = "Et docti in populo docebunt plurimos: et ruent in gladio, et in flamma, et in captivitate, et in rapina dierum.";
kjv[34] = "Now when they shall fall, they shall be holpen with a little help: but many shall cleave to them with flatteries.";
rsv[34] = "When they fall, they shall receive a little help. And many shall join themselves to them with flattery;";
asv[34] = "Now when they shall fall, they shall be helped with a little help; but many shall join themselves unto them with flatteries.";
yng[34] = "And in their stumbling, they are helped -- a little help, and joined to them have been many with flatteries.";
dby[34] = "And when they fall, they shall be helped with a little help; but many shall cleave to them with flatteries.";
web[34] = "Now when they shall fall, they shall be assisted with a little help: but many shall cleave to them with flatteries.";
hnv[34] = "Now when they shall fall, they shall be helped with a little help; but many shall join themselves to them with flatteries.";
vul[34] = "Cumque corruerint, sublevabuntur auxilio parvulo: et applicabuntur eis plurimi fraudulenter.";
kjv[35] = "And [some] of them of understanding shall fall, to try them, and to purge, and to make [them] white, [even] to the time of the end: because [it is] yet for a time appointed.";
rsv[35] = "and some of those who are wise shall fall, to refine and to cleanse them and to make them white, until the time of the end, for it is yet for the time appointed.";
asv[35] = "And some of them that are wise shall fall, to refine them, and to purify, and to make them white, even to the time of the end; because it is yet for the time appointed.";
yng[35] = "And some of the teachers do stumble for refining by them, and for purifying, and for making white -- till the end of the time, for [it is] yet for a time appointed.";
dby[35] = "And [some] of the wise shall fall, to try them, and to purge and to make them white, to the time of the end: for it shall yet be for the time appointed.";
web[35] = "And [some] of them of understanding shall fall, to try them, and to purge, and to make [them] white, [even] to the time of the end: because [it is] yet for a time appointed.";
hnv[35] = "Some of those who are wise shall fall, to refine them, and to purify, and to make them white, even to the time of the end; because it is yet for the time appointed.";
vul[35] = "Et de eruditis ruent, ut conflentur, et eligantur, et dealbentur usque ad tempus praefinitum: quia adhuc aliud tempus erit.";
kjv[36] = "And the king shall do according to his will; and he shall exalt himself, and magnify himself above every god, and shall speak marvellous things against the God of gods, and shall prosper till the indignation be accomplished: for that that is determined shall be done.";
rsv[36] = "&quot;And the king shall do according to his will; he shall exalt himself and magnify himself above every god, and shall speak astonishing things against the God of gods. He shall prosper till the indignation is accomplished; for what is determined shall be done.";
asv[36] = "And the king shall do according to his will; and he shall exalt himself, and magnify himself above every god, and shall speak marvellous things against the God of gods; and he shall prosper till the indignation be accomplished; for that which is determined shall be done.";
yng[36] = "`And the king hath done according to his will, and exalteth himself, and magnifieth himself against every god, and against the God of gods he speaketh wonderful things, and hath prospered till the indignation hath been completed, for that which is determined hath been done.";
dby[36] = "And the king shall do according to his will; and he shall exalt himself, and magnify himself above every god, and speak monstrous things against the God of gods; and he shall prosper until the indignation be accomplished: for that which is determined shall be done.";
web[36] = "And the king shall do according to his will; and he shall exalt himself, and magnify himself above every god, and shall speak marvelous things against the God of gods, and shall prosper till the indignation be accomplished: for that which is determined shall be done.";
hnv[36] = "The king shall do according to his will; and he shall exalt himself, and magnify himself above every god, and shall speak marvelous things against the God of gods; and he shall prosper until the indignation be accomplished; for that which is determined shall be done.";
vul[36] = "Et faciet iuxta voluntatem suam rex, et elevabitur, et magnificabitur adversus omnem deum: et adversus Deum deorum loquetur magnifica, et dirigetur, donec compleatur iracundia: perpetrata quippe est definitio.";
kjv[37] = "Neither shall he regard the God of his fathers, nor the desire of women, nor regard any god: for he shall magnify himself above all.";
rsv[37] = "He shall give no heed to the gods of his fathers, or to the one beloved by women; he shall not give heed to any other god, for he shall magnify himself above all.";
asv[37] = "Neither shall he regard the gods of his fathers, nor the desire of women, nor regard any god; for he shall magnify himself above all.";
yng[37] = "And unto the God of his fathers he doth not attend, nor to the desire of women, yea, to any god he doth not attend, for against all he magnifieth himself.";
dby[37] = "And he will not regard the God of his fathers, nor the desire of women; nor regard any god: for he will magnify himself above all.";
web[37] = "Neither shall he regard the God of his fathers, nor the desire of women, nor regard any god: for he shall magnify himself above all.";
hnv[37] = "Neither shall he regard the gods of his fathers, nor the desire of women, nor regard any god; for he shall magnify himself above all.";
vul[37] = "Et Deum patrum suorum non reputabit: et erit in concupiscentiis feminarum, nec quemquam deorum curabit: quia adversum universa consurget.";
kjv[38] = "But in his estate shall he honour the God of forces: and a god whom his fathers knew not shall he honour with gold, and silver, and with precious stones, and pleasant things.";
rsv[38] = "He shall honor the god of fortresses instead of these; a god whom his fathers did not know he shall honor with gold and silver, with precious stones and costly gifts.";
asv[38] = "But in his place shall he honor the god of fortresses; and a god whom his fathers knew not shall he honor with gold, and silver, and with precious stones and pleasant things.";
yng[38] = "And to the god of strongholds, on his station, he giveth honour; yea, to a god whom his fathers knew not he giveth honour, with gold, and with silver, and with precious stone, and with desirable things.";
dby[38] = "And in his place will he honour the god of fortresses; and a god whom his fathers knew not will he honour with gold and silver, and with precious stones and pleasant things.";
web[38] = "But in his estate shall he honor the God of forces: and a god whom his fathers knew not shall he honor with gold, and silver, and with precious stones, and pleasant things.";
hnv[38] = "But in his place shall he honor the god of fortresses; and a god whom his fathers didn\'t know shall he honor with gold, and silver, and with precious stones, and pleasant things.";
vul[38] = "Deum autem Maozim in loco suo venerabitur: et Deum, quem ignoraverunt patres eius, colet auro, et argento, et lapide pretioso, rebusque pretiosis.";
kjv[39] = "Thus shall he do in the most strong holds with a strange god, whom he shall acknowledge [and] increase with glory: and he shall cause them to rule over many, and shall divide the land for gain.";
rsv[39] = "He shall deal with the strongest fortresses by the help of a foreign god; those who acknowledge him he shall magnify with honor. He shall make them rulers over many and shall divide the land for a price.";
asv[39] = "And he shall deal with the strongest fortresses by the help of a foreign god: whosoever acknowledgeth [him] he will increase with glory; and he shall cause them to rule over many, and shall divide the land for a price.";
yng[39] = "And he hath dealt in the fortresses of the strongholds with a strange god whom he hath acknowledged; he multiplieth honour, and hath caused them to rule over many, and the ground he apportioneth at a price.";
dby[39] = "And he will practise in the strongholds of fortresses with a strange god: whoso acknowledgeth him will he increase with glory; and he shall cause them to rule over the many, and shall divide the land [to them] for a reward.";
web[39] = "Thus shall he do in the most strong holds with a strange god, whom he shall acknowledge [and] increase with glory: and he shall cause them to rule over many, and shall divide the land for gain.";
hnv[39] = "He shall deal with the strongest fortresses by the help of a foreign god: whoever acknowledges [him] he will increase with glory; and he shall cause them to rule over many, and shall divide the land for a price.";
vul[39] = "Et faciet ut muniat Maozim cum Deo alieno, quem cognovit, et multiplicabit gloriam, et dabit eis potestatem in multis, et terram dividet gratuito.";
kjv[40] = "And at the time of the end shall the king of the south push at him: and the king of the north shall come against him like a whirlwind, with chariots, and with horsemen, and with many ships; and he shall enter into the countries, and shall overflow and pass over.";
rsv[40] = "&quot;At the time of the end the king of the south shall attack him; but the king of the north shall rush upon him like a whirlwind, with chariots and horsemen, and with many ships; and he shall come into countries and shall overflow and pass through.";
asv[40] = "And at the time of the end shall the king of the south contend with him; and the king of the north shall come against him like a whirlwind, with chariots, and with horsemen, and with many ships; and he shall enter into the countries, and shall overflow and pass through.";
yng[40] = "`And at the time of the end, push himself forward with him doth a king of the south, and storm against him doth a king of the north, with chariot, and with horsemen, and with many ships; and he hath come in to the lands, and hath overflowed, and passed over,";
dby[40] = "And at the time of the end shall the king of the south push at him; and the king of the north shall come against him like a whirlwind, with chariots, and with horsemen, and with many ships; and he shall enter into the countries, and overflow and pass through.";
web[40] = "And at the time of the end shall the king of the south push at him: and the king of the north shall come against him like a whirlwind, with chariots, and with horsemen, and with many ships; and he shall enter into the countries, and shall overflow and pass over.";
hnv[40] = "At the time of the end shall the king of the south contend with him; and the king of the north shall come against him like a whirlwind, with chariots, and with horsemen, and with many ships; and he shall enter into the countries, and shall overflow and pass through.";
vul[40] = "Et in tempore praefinito praeliabitur adversus eum rex Austri, et quasi tempestas veniet contra illum rex Aquilonis in curribus, et in equitibus, et in classe magna, et ingredietur terras, et conteret, et pertransiet.";
kjv[41] = "He shall enter also into the glorious land, and many [countries] shall be overthrown: but these shall escape out of his hand, [even] Edom, and Moab, and the chief of the children of Ammon.";
rsv[41] = "He shall come into the glorious land. And tens of thousands shall fall, but these shall be delivered out of his hand: Edom and Moab and the main part of the Ammonites.";
asv[41] = "He shall enter also into the glorious land, and many [countries] shall be overthrown; but these shall be delivered out of his hand: Edom, and Moab, and the chief of the children of Ammon.";
yng[41] = "and hath come into the desirable land, and many do stumble, and these escape from his hand: Edom, and Moab, and the chief of the sons of Ammon.";
dby[41] = "And he shall enter into the land of beauty, and many [countries] shall be overthrown; but these shall escape out of his hand: Edom, and Moab, and the chief of the children of Ammon.";
web[41] = "He shall enter also into the glorious land, and many [countries] shall be overthrown: but these shall escape out of his hand, [even] Edom, and Moab, and the chief of the children of Ammon.";
hnv[41] = "He shall enter also into the glorious land, and many [countries] shall be overthrown; but these shall be delivered out of his hand: Edom, and Mo\'av, and the chief of the children of `Ammon.";
vul[41] = "Et introibit in terram gloriosam, et multae corruent: hae autem solae salvabuntur de manu eius, Edom, et Moab, et principium filiorum Ammon.";
kjv[42] = "He shall stretch forth his hand also upon the countries: and the land of Egypt shall not escape.";
rsv[42] = "He shall stretch out his hand against the countries, and the land of Egypt shall not escape.";
asv[42] = "He shall stretch forth his hand also upon the countries; and the land of Egypt shall not escape.";
yng[42] = "`And he sendeth forth his hand upon the lands, and the land of Egypt is not for an escape;";
dby[42] = "And he shall stretch forth his hand upon the countries; and the land of Egypt shall not escape.";
web[42] = "He shall stretch forth his hand also upon the countries: and the land of Egypt shall not escape.";
hnv[42] = "He shall stretch forth his hand also on the countries; and the land of Mitzrayim shall not escape.";
vul[42] = "Et mittet manum suam in terras: et Terra Aegypti non effugiet.";
kjv[43] = "But he shall have power over the treasures of gold and of silver, and over all the precious things of Egypt: and the Libyans and the Ethiopians [shall be] at his steps.";
rsv[43] = "He shall become ruler of the treasures of gold and of silver, and all the precious things of Egypt; and the Libyans and the Ethiopians shall follow in his train.";
asv[43] = "But he shall have power over the treasures of gold and of silver, and over all the precious things of Egypt; and the Libyans and the Ethiopians shall be at his steps.";
yng[43] = "and he hath ruled over treasures of gold and of silver, and over all the desirable things of Egypt, and Lubim and Cushim [are] at his steps.";
dby[43] = "And he shall have power over the treasures of gold and of silver, and over all the precious things of Egypt; and the Libyans and the Ethiopians shall be at his steps.";
web[43] = "But he shall have power over the treasures of gold and of silver, and over all the precious things of Egypt: and the Libyans and the Cushites [shall be] at his steps.";
hnv[43] = "But he shall have power over the treasures of gold and of silver, and over all the precious things of Mitzrayim; and the Lubbians and the Kushim shall be at his steps.";
vul[43] = "Et dominabitur thesaurorum auri, et argenti, et in omnibus pretiosis Aegypti: per Libyam quoque, et Aethiopiam transibit.";
kjv[44] = "But tidings out of the east and out of the north shall trouble him: therefore he shall go forth with great fury to destroy, and utterly to make away many.";
rsv[44] = "But tidings from the east and the north shall alarm him, and he shall go forth with great fury to exterminate and utterly destroy many.";
asv[44] = "But tidings out of the east and out of the north shall trouble him; and he shall go forth with great fury to destroy and utterly to sweep away many.";
yng[44] = "`And reports trouble him out of the east and out of the north, and he hath gone forth in great fury to destroy, and to devote many to destruction;";
dby[44] = "But tidings out of the east and out of the north shall trouble him; and he shall go forth with great fury to exterminate, and utterly to destroy many.";
web[44] = "But tidings out of the east and out of the north shall trouble him: therefore he shall go forth with great fury to destroy, and utterly to make away many.";
hnv[44] = "But news out of the east and out of the north shall trouble him; and he shall go forth with great fury to destroy and utterly to sweep away many.";
vul[44] = "Et fama turbabit eum ab Oriente et ab Aquilone: et veniet in multitudine magna ut conterat et interficiat plurimos.";
kjv[45] = "And he shall plant the tabernacles of his palace between the seas in the glorious holy mountain; yet he shall come to his end, and none shall help him.";
rsv[45] = "And he shall pitch his palatial tents between the sea and the glorious holy mountain; yet he shall come to his end, with none to help him.";
asv[45] = "And he shall plant the tents of his palace between the sea and the glorious holy mountain; yet he shall come to his end, and none shall help him.";
yng[45] = "and he planteth the tents of his palace between the seas and the holy desirable mountain, and hath come unto his end, and there is no helper to him.";
dby[45] = "And he shall plant the tents of his palace between the sea and the mountain of holy beauty; and he shall come to his end, and there shall be none to help him.";
web[45] = "And he shall plant the tabernacles of his palace between the seas in the glorious holy mountain: yet he shall come to his end, and none shall help him.";
hnv[45] = "He shall plant the tents of his palace between the sea and the glorious holy mountain; yet he shall come to his end, and none shall help him.";
vul[45] = "Et figet tabernaculum suum Apadno inter maria, super montem inclytum et sanctum: et veniet usque ad summitatem eius, et nemo auxiliabitur ei.";
