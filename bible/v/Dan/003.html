csb[1] = "King Nebuchadnezzar made a gold statue, ninety feet high and nine feet wide. He set it up on the plain of Dura in the province of Babylon.";
csb[2] = "King Nebuchadnezzar sent word to assemble the satraps, prefects, governors, advisers, treasurers, judges, magistrates, and all the rulers of the provinces to attend the dedication of the statue King Nebuchadnezzar had set up.";
csb[3] = "So the satraps, prefects, governors, advisers, treasurers, judges, magistrates, and all the rulers of the provinces assembled for the dedication of the statue the king had set up. Then they stood before the statue Nebuchadnezzar had set up.";
csb[4] = "A herald loudly proclaimed, &quot;People of every nation and language, you are commanded:";
csb[5] = "&quot;When you hear the sound of the horn, flute, zither, lyre, harp, drum, and every kind of music, you are to fall facedown and worship the gold statue that King Nebuchadnezzar has set up.";
csb[6] = "&quot;But whoever does not fall down and worship will immediately be thrown into a furnace of blazing fire.&quot;";
csb[7] = "Therefore, when all the people heard the sound of the horn, flute, zither, lyre, harp, and every kind of music, people of every nation and language fell down and worshiped the gold statue that King Nebuchadnezzar had set up.";
csb[8] = "Some Chaldeans took this occasion to come forward and maliciously accuse the Jews.";
csb[9] = "They said to King Nebuchadnezzar, &quot;May the king live forever.";
csb[10] = "&quot;You as king have issued a decree that everyone who hears the sound of the horn, flute, zither, lyre, harp, drum, and every kind of music must fall down and worship the gold statue.";
csb[11] = "&quot;Whoever does not fall down and worship will be thrown into a furnace of blazing fire.";
csb[12] = "&quot;There are some Jews you have appointed to manage the province of Babylon: Shadrach, Meshach, and Abednego. These men have ignored you, the king; they do not serve your gods or worship the gold statue you have set up.&quot;";
csb[13] = "Then in a furious rage Nebuchadnezzar gave orders to bring in Shadrach, Meshach, and Abednego. So these men were brought before the king.";
csb[14] = "Nebuchadnezzar asked them, &quot;Shadrach, Meshach, and Abednego, is it true that you don\'t serve my gods or worship the gold statue I have set up?";
csb[15] = "&quot;Now if you\'re ready, when you hear the sound of the horn, flute, zither, lyre, harp, drum, and every kind of music, fall down and worship the statue I made. But if you don\'t worship it, you will immediately be thrown into a furnace of blazing fire -- and who is the god who can rescue you from my power? &quot;";
csb[16] = "Shadrach, Meshach, and Abednego replied to the king, &quot;Nebuchadnezzar, we don\'t need to give you an answer to this question.";
csb[17] = "&quot;If the God we serve exists, then he can rescue us from the furnace of blazing fire, and he can rescue us from the power of you, the king.";
csb[18] = "&quot;But even if he does not rescue us, we want you as king to know that we will not serve your gods or worship the gold statue you set up.&quot;";
csb[19] = "Then Nebuchadnezzar was filled with rage, and the expression on his face changed toward Shadrach, Meshach, and Abednego. He gave orders to heat the furnace seven times more than was customary,";
csb[20] = "and he commanded some of the best soldiers in his army to tie up Shadrach, Meshach, and Abednego and throw them into the furnace of blazing fire.";
csb[21] = "So these men, in their trousers, robes, head coverings, and other clothes, were tied up and thrown into the furnace of blazing fire.";
csb[22] = "Since the king\'s command was so urgent and the furnace extremely hot, the raging flames killed those men who carried Shadrach, Meshach, and Abednego up.";
csb[23] = "And these three men, Shadrach, Meshach, and Abednego fell, bound, into the furnace of blazing fire.";
csb[24] = "Then King Nebuchadnezzar jumped up in alarm. He said to his advisers, &quot;Didn\'t we throw three men, bound, into the fire? &quot; &quot;Yes, of course, Your Majesty,&quot; they replied to the king.";
csb[25] = "He exclaimed, &quot;Look! I see four men, not tied, walking around in the fire unharmed; and the fourth looks like a son of the gods.&quot;";
csb[26] = "Nebuchadnezzar then approached the door of the furnace of blazing fire and called: &quot;Shadrach, Meshach, and Abednego, you servants of the Most High God -- come out! &quot; So Shadrach, Meshach, and Abednego came out of the fire.";
csb[27] = "When the satraps, prefects, governors, and the king\'s advisers gathered around, they saw that the fire had no effect on the bodies of these men: not a hair of their heads was singed, their robes were unaffected, and there was no smell of fire on them.";
csb[28] = "Nebuchadnezzar exclaimed, &quot;Praise to the God of Shadrach, Meshach, and Abednego! He sent his angel and rescued his servants who trusted in him. They violated the king\'s command and risked their lives rather than serve or worship any god except their own God.";
csb[29] = "&quot;Therefore I issue a decree that anyone of any people, nation, or language who says anything offensive against the God of Shadrach, Meshach, and Abednego will be torn limb from limb and his house made a garbage dump. For there is no other god who is able to deliver like this.&quot;";
csb[30] = "Then the king rewarded Shadrach, Meshach, and Abednego in the province of Babylon.";
kjv[1] = "Nebuchadnezzar the king made an image of gold, whose height [was] threescore cubits, [and] the breadth thereof six cubits: he set it up in the plain of Dura, in the province of Babylon.";
rsv[1] = "King Nebuchadnez\'zar made an image of gold, whose height was sixty cubits and its breadth six cubits. He set it up on the plain of Dura, in the province of Babylon.";
asv[1] = "Nebuchadnezzar the king made an image of gold, whose height was threescore cubits, and the breadth thereof six cubits: he set it up in the plain of Dura, in the province of Babylon.";
yng[1] = "Nebuchadnezzar the king hath made an image of gold, its height sixty cubits, its breadth six cubits; he hath raised it up in the valley of Dura, in the province of Babylon;";
dby[1] = "Nebuchadnezzar the king made an image of gold, whose height was sixty cubits, [and] its breadth six cubits; he set it up in the plain of Dura, in the province of Babylon.";
web[1] = "Nebuchadnezzar the king made an image of gold, whose hight [was] sixty cubits, [and] the breadth of it six cubits: he set it up in the plain of Dura, in the province of Babylon.";
hnv[1] = "Nevukhadnetztzar the king made an image of gold, whose height was sixty cubits, and the breadth of it six cubits: he set it up in the plain of Dura, in the province of Bavel.";
vul[1] = "Nabuchodonosor rex fecit statuam auream altitudine cubitorum sexaginta, latitudine cubitorum sex, et statuit eam in campo Dura provinciae Babylonis.";
kjv[2] = "Then Nebuchadnezzar the king sent to gather together the princes, the governors, and the captains, the judges, the treasurers, the counsellors, the sheriffs, and all the rulers of the provinces, to come to the dedication of the image which Nebuchadnezzar the king had set up.";
rsv[2] = "Then King Nebuchadnez\'zar sent to assemble the satraps, the prefects, and the governors, the counselors, the treasurers, the justices, the magistrates, and all the officials of the provinces to come to the dedication of the image which King Nebuchadnez\'zar had set up.";
asv[2] = "Then Nebuchadnezzar the king sent to gather together the satraps, the deputies, and the governors, the judges, the treasurers, the counsellors, the sheriffs, and all the rulers of the provinces, to come to the dedication of the image which Nebuchadnezzar the king had set up.";
yng[2] = "and Nebuchadnezzar the king hath sent to gather the satraps, the prefects, and the governors, the honourable judges, the treasurers, the counsellors, the sheriffs, and all the rulers of the province, to come to the dedication of the image that Nebuchadnezzar the king hath raised up.";
dby[2] = "And Nebuchadnezzar the king sent to gather together the satraps, the prefects, and the governors, the judges, the treasurers, the counsellors, the justices, and all the rulers of the provinces, to come to the dedication of the image that Nebuchadnezzar the king had set up.";
web[2] = "Then Nebuchadnezzar the king sent to convene the princes, the governors, and the captains, the judges, the treasurers, the counselors, the sherifs, and all the rulers of the provinces, to come to the dedication of the image which Nebuchadnezzar the king had set up.";
hnv[2] = "Then Nevukhadnetztzar the king sent to gather together the satraps, the deputies, and the governors, the judges, the treasurers, the counselors, the sheriffs, and all the rulers of the provinces, to come to the dedication of the image which Nevukhadnetztzar the king had set up.";
vul[2] = "Itaque Nabuchodonosor rex misit ad congregandos satrapas, magistratus, et iudices, duces, et tyrannos, et praefectos, omnesque principes regionum, ut convenirent ad dedicationem statuae, quam erexerat Nabuchodonosor rex.";
kjv[3] = "Then the princes, the governors, and captains, the judges, the treasurers, the counsellors, the sheriffs, and all the rulers of the provinces, were gathered together unto the dedication of the image that Nebuchadnezzar the king had set up; and they stood before the image that Nebuchadnezzar had set up.";
rsv[3] = "Then the satraps, the prefects, and the governors, the counselors, the treasurers, the justices, the magistrates, and all the officials of the provinces, were assembled for the dedication of the image that King Nebuchadnez\'zar had set up; and they stood before the image that Nebuchadnez\'zar had set up.";
asv[3] = "Then the satraps, the deputies, and the governors, the judges, the treasurers, the counsellors, the sheriffs, and all the rulers of the provinces, were gathered together unto the dedication of the image that Nebuchadnezzar the king had set up; and they stood before the image that Nebuchadnezzar had set up.";
yng[3] = "Then are gathered the satraps, the prefects, and the governors, the honourable judges, the treasurers, the counsellors, the sheriffs, and all the rulers of the province, to the dedication of the image that Nebuchadnezzar the king hath raised up: and they are standing before the image that Nebuchadnezzar hath raised up.";
dby[3] = "Then the satraps, the prefects, and the governors, the judges, the treasurers, the counsellors, the justices, and all the rulers of the provinces, were gathered together unto the dedication of the image that Nebuchadnezzar the king had set up; and they stood before the image that Nebuchadnezzar had set up.";

kjv[7] = "Therefore at that time, when all the people heard the sound of the cornet, flute, harp, sackbut, psaltery, and all kinds of musick, all the people, the nations, and the languages, fell down [and] worshipped the golden image that Nebuchadnezzar the king had set up.";
rsv[7] = "Therefore, as soon as all the peoples heard the sound of the horn, pipe, lyre, trigon, harp, bagpipe, and every kind of music, all the peoples, nations, and languages fell down and worshiped the golden image which King Nebuchadnez\'zar had set up.";
asv[7] = "Therefore at that time, when all the peoples heard the sound of the cornet, flute, harp, sackbut, psaltery, and all kinds of music, all the peoples, the nations, and the languages, fell down and worshipped the golden image that Nebuchadnezzar the king had set up.";
yng[7] = "Therefore at that time, when all the peoples are hearing the voice of the cornet, the flute, the harp, the sackbut, the psaltery, and all kinds of music, falling down are all the peoples, nations and languages, doing obeisance to the golden image that Nebuchadnezzar the king hath raised up.";
dby[7] = "Therefore at that time when all the peoples heard the sound of the cornet, pipe, lute, sambuca, psaltery, and all kinds of music, all the peoples, the nations, and the languages fell down [and] worshipped the golden image that Nebuchadnezzar the king had set up.";
web[7] = "Therefore at that time, when all the people heard the sound of the cornet, flute, harp, sackbut, psaltery, and all kinds of music, all the people, the nations, and the languages, fell down [and] worshiped the golden image that Nebuchadnezzar the king had set up.";
hnv[7] = "Therefore at that time, when all the peoples heard the sound of the horn, flute, zither, lyre, harp, pipe, and all kinds of music, all the peoples, the nations, and the languages, fell down and worshiped the golden image that Nevukhadnetztzar the king had set up.";
vul[7] = "Post haec igitur statim ut audierunt omnes populi sonitum tubae, fistulae, et citharae, sambucae, et psalterii, et symphoniae, et omnis generis musicorum: cadentes omnes populi, tribus, et linguae adoraverunt statuam auream, quam constituerat Nabuchodonosor rex.";

hnv[8] = "Therefore at that time certain Kasdim came near, and brought accusation against the Yehudim.";
vul[8] = "Statimque in ipso tempore accedentes viri Chaldaei accusaverunt Iudaeos:";

kjv[12] = "There are certain Jews whom thou hast set over the affairs of the province of Babylon, Shadrach, Meshach, and Abednego; these men, O king, have not regarded thee: they serve not thy gods, nor worship the golden image which thou hast set up.";
rsv[12] = "There are certain Jews whom you have appointed over the affairs of the province of Babylon: Shadrach, Meshach, and Abed\'nego. These men, O king, pay no heed to you; they do not serve your gods or worship the golden image which you have set up.&quot;";
asv[12] = "There are certain Jews whom thou hast appointed over the affairs of the province of Babylon: Shadrach, Meshach, and Abed-nego; these men, O king, have not regarded thee: they serve not thy gods, nor worship the golden image which thou hast set up.";
yng[12] = "There are certain Jews whom thou hast appointed over the work of the province of Babylon -- Shadrach, Meshach, and Abed-Nego, these men have not made of thee, O king, [any] regard; thy gods they are not serving, and to the golden image thou hast raised up -- are not making obeisance.\'";
dby[12] = "There are certain Jews whom thou hast appointed over the administration of the province of Babylon: Shadrach, Meshach, and Abed-nego: these men, O king, regard thee not; they serve not thy gods, nor worship the golden image that thou hast set up.";
web[12] = "There are certain Jews whom thou hast set over the affairs of the province of Babylon, Shadrach, Meshach, and Abed-nego; these men, O king, have not regarded thee: they serve not thy gods, nor worship the golden image which thou hast set up.";
hnv[12] = "There are certain Yehudim whom you have appointed over the affairs of the province of Bavel: Shadrakh, Meshakh, and `Aved-Nego; these men, O king, have not regarded you: they don\'t serve your gods, nor worship the golden image which you have set up.";
vul[12] = "Sunt ergo viri Iudaei, quos constituisti super opera regionis Babylonis, Sidrach, Misach, et Abdenago: viri isti contempserunt, rex, decretum tuum: deos tuos non colunt, et statuam auream, quam erexisti, non adorant.";
kjv[13] = "Then Nebuchadnezzar in [his] rage and fury commanded to bring Shadrach, Meshach, and Abednego. Then they brought these men before the king.";
rsv[13] = "Then Nebuchadnez\'zar in furious rage commanded that Shadrach, Meshach, and Abed\'nego be brought. Then they brought these men before the king.";
asv[13] = "Then Nebuchadnezzar in [his] rage and fury commanded to bring Shadrach, Meshach, and Abed-nego. Then they brought these men before the king.";
yng[13] = "Then Nebuchadnezzar, in anger and fury, hath said to bring in Shadrach, Meshach, and Abed-Nego. Then these men have been brought in before the king.";
dby[13] = "Then Nebuchadnezzar in rage and fury commanded to bring Shadrach, Meshach, and Abed-nego. Then were these men brought before the king.";
web[13] = "Then Nebuchadnezzar in [his] rage and fury commanded to bring Shadrach, Meshach, and Abed-nego. Then they brought these men before the king.";
hnv[13] = "Then Nevukhadnetztzar in [his] rage and fury commanded to bring Shadrakh, Meshakh, and `Aved-Nego. Then they brought these men before the king.";
vul[13] = "Tunc Nabuchodonosor in furore, et in ira praecepit ut adducerentur Sidrach, Misach, et Abdenago: qui confestim adducti sunt in conspectu regis.";
kjv[14] = "Nebuchadnezzar spake and said unto them, [Is it] true, O Shadrach, Meshach, and Abednego, do not ye serve my gods, nor worship the golden image which I have set up?";
rsv[14] = "Nebuchadnez\'zar said to them, &quot;Is it true, O Shadrach, Meshach, and Abed\'nego, that you do not serve my gods or worship the golden image which I have set up?";
asv[14] = "Nebuchadnezzar answered and said unto them, Is it of purpose, O Shadrach, Meshach, and Abed-nego, that ye serve not my god, nor worship the golden image which I have set up?";
yng[14] = "Nebuchadnezzar hath answered and said to them, `Is [it] a laid plan, O Shadrach, Meshach, and Abed-Nego -- my gods ye are not serving, and to the golden image that I have raised up ye are not doing obeisance?";
dby[14] = "Nebuchadnezzar spoke and said unto them, Is it of purpose, Shadrach, Meshach, and Abed-nego, that ye serve not my god, nor worship the golden image that I have set up?";

hnv[14] = "Nevukhadnetztzar answered them, Is it on purpose, Shadrakh, Meshakh, and `Aved-Nego, that you don\'t serve my god, nor worship the golden image which I have set up?";
vul[14] = "Pronunciansque Nabuchodonosor rex, ait eis: Verene Sidrach, Misach, et Abdenago deos meos non colitis, et statuam auream, quam constitui, non adoratis?";
kjv[15] = "Now if ye be ready that at what time ye hear the sound of the cornet, flute, harp, sackbut, psaltery, and dulcimer, and all kinds of musick, ye fall down and worship the image which I have made; [well]: but if ye worship not, ye shall be cast the same hour into the midst of a burning fiery furnace; and who [is] that God that shall deliver you out of my hands?";
rsv[15] = "Now if you are ready when you hear the sound of the horn, pipe, lyre, trigon, harp, bagpipe, and every kind of music, to fall down and worship the image which I have made, well and good; but if you do not worship, you shall immediately be cast into a burning fiery furnace; and who is the god that will deliver you out of my hands?&quot;";
asv[15] = "Now if ye be ready that at what time ye hear the sound of the cornet, flute, harp, sackbut, psaltery, and dulcimer, and all kinds of music, ye fall down and worship the image which I have made, [well]: but if ye worship not, ye shall be cast the same hour into the midst of a burning fiery furnace; and who is that god that shall deliver you out of my hands?";
yng[15] = "Now, lo, ye are ready, so that at the time that ye hear the voice of the cornet, the flute, the harp, the sackbut, the psaltery, and the symphony, and all kinds of music, ye fall down and do obeisance to the image that I have made! -- and lo, ye do no obeisance -- in that hour ye are cast into the midst of a burning fiery furnace; who is that God who doth deliver you out of my hands?\'";
dby[15] = "Now if ye be ready at the time that ye hear the sound of the cornet, pipe, lute, sambuca, psaltery, and bagpipe, and all kinds of music, to fall down and worship the image that I have made, [well]: but if ye worship not, ye shall be cast that same hour into the midst of a burning fiery furnace: and who is the God that shall deliver you out of my hands?";
web[15] = "Now if ye be ready that at what time ye hear the sound of the cornet, flute, harp, sackbut, psaltery, and dulcimer, and all kinds of music, ye fall down and worship the image which I have made; [well]: but if ye worship not, ye shall be cast the same hour into the midst of a burning fiery furnace; and who [is] that God that shall deliver you out of my hands?";
hnv[15] = "Now if you are ready whenever you hear the sound of the horn, flute, zither, lyre, harp, pipe, and all kinds of music to you fall down and worship the image which I have made, [well]: but if you don\'t worship, you shall be cast the same hour into the midst of a burning fiery furnace; and who is that god that shall deliver you out of my hands?";
vul[15] = "Nunc ergo si estis parati, quacumque hora audieritis sonitum tubae, fistulae, citharae, sambucae, et psalterii, et symphoniae, omnisque generis musicorum, prosternite vos, et adorate statuam, quam feci: quod si non adoraveritis, eadem hora mittemini in fornacem ignis ardentis: et quis est Deus, qui eripiet vos de manu mea?";
kjv[16] = "Shadrach, Meshach, and Abednego, answered and said to the king, O Nebuchadnezzar, we [are] not careful to answer thee in this matter.";
rsv[16] = "Shadrach, Meshach, and Abed\'nego answered the king, &quot;O Nebuchadnez\'zar, we have no need to answer you in this matter.";
asv[16] = "Shadrach, Meshach, and Abed-nego answered and said to the king, O Nebuchadnezzar, we have no need to answer thee in this matter.";
yng[16] = "Shadrach, Meshach, and Abed-Nego have answered, yea, they are saying to the king Nebuchadnezzar, `We have no need concerning this matter to answer thee.";
dby[16] = "Shadrach, Meshach, and Abed-nego answered and said to the king, O Nebuchadnezzar, we have no need to answer thee in this matter.";
web[16] = "Shadrach, Meshach, and Abed-nego, answered and said to the king, O Nebuchadnezzar, we [are] not careful to answer thee in this matter.";
hnv[16] = "Shadrakh, Meshakh, and `Aved-Nego answered the king, Nevukhadnetztzar, we have no need to answer you in this matter.";
vul[16] = "Respondentes Sidrach, Misach, et Abdenago, dixerunt regi Nabuchodonosor: Non oportet nos de hac re respondere tibi.";
kjv[17] = "If it be [so], our God whom we serve is able to deliver us from the burning fiery furnace, and he will deliver [us] out of thine hand, O king.";
rsv[17] = "If it be so, our God whom we serve is able to deliver us from the burning fiery furnace; and he will deliver us out of your hand, O king.";
asv[17] = "If it be [so], our God whom we serve is able to deliver us from the burning fiery furnace; and he will deliver us out of thy hand, O king.";
yng[17] = "Lo, it is; our God whom we are serving, is able to deliver us from a burning fiery furnace; and from thy hand, O king, He doth deliver.";
dby[17] = "If it be [so], our God whom we serve is able to deliver us from the burning fiery furnace, and he will deliver [us] out of thy hand, O king.";
web[17] = "If it is [so], our God whom we serve is able to deliver us from the burning fiery furnace, and he will deliver [us] out of thy hand, O king.";
hnv[17] = "If it be [so], our God whom we serve is able to deliver us from the burning fiery furnace; and he will deliver us out of your hand, O king.";
vul[17] = "Ecce enim Deus noster, quem colimus, potest eripere nos de camino ignis ardentis, et de manibus tuis, o rex, liberare.";
kjv[18] = "But if not, be it known unto thee, O king, that we will not serve thy gods, nor worship the golden image which thou hast set up.";
rsv[18] = "But if not, be it known to you, O king, that we will not serve your gods or worship the golden image which you have set up.&quot;";
asv[18] = "But if not, be it known unto thee, O king, that we will not serve thy gods, nor worship the golden image which thou hast set up.";
yng[18] = "And lo -- not! be it known to thee, O king, that thy gods we are not serving, and to the golden image thou hast raised up we do no obeisance.\'";
dby[18] = "But if not, be it known unto thee, O king, that we will not serve thy gods, nor worship the golden image that thou hast set up.";
web[18] = "But if not, be it known to thee, O king, that we will not serve thy gods, nor worship the golden image which thou hast set up.";
hnv[18] = "But if not, be it known to you, O king, that we will not serve your gods, nor worship the golden image which you have set up.";
vul[18] = "Quod si noluerit, notum sit tibi, rex, quia deos tuos non colimus, et statuam auream, quam erexisti, non adoramus.";
kjv[19] = "Then was Nebuchadnezzar full of fury, and the form of his visage was changed against Shadrach, Meshach, and Abednego: [therefore] he spake, and commanded that they should heat the furnace one seven times more than it was wont to be heated.";
rsv[19] = "Then Nebuchadnez\'zar was full of fury, and the expression of his face was changed against Shadrach, Meshach, and Abed\'nego. He ordered the furnace heated seven times more than it was wont to be heated.";
asv[19] = "Then was Nebuchadnezzar full of fury, and the form of his visage was changed against Shadrach, Meshach, and Abed-nego: [therefore] he spake, and commanded that they should heat the furnace seven times more than it was wont to be heated.";
yng[19] = "Then Nebuchadnezzar hath been full of fury, and the expression of his face hath been changed concerning Shadrach, Meshach, and Abed-Nego; he answered and said to heat the furnace seven times above that which it is seen to be heated;";
dby[19] = "Then was Nebuchadnezzar full of fury, and the form of his visage was changed against Shadrach, Meshach, and Abed-nego. He spoke, and commanded that they should heat the furnace seven times more than it was wont to be heated.";
web[19] = "Then was Nebuchadnezzar full of fury, and the form of his visage was changed against Shadrach, Meshach, and Abed-nego: [therefore] he spoke, and commanded that they should heat the furnace seven times more than it was wont to be heated.";
hnv[19] = "Then was Nevukhadnetztzar full of fury, and the form of his visage was changed against Shadrakh, Meshakh, and `Aved-Nego: [therefore] he spoke, and commanded that they should heat the furnace seven times more than it was wont to be heated.";
vul[19] = "Tunc Nabuchodonosor repletus est furore: et aspectus faciei illius immutatus est super Sidrach, Misach, et Abdenago, et praecepit ut succenderetur fornax septuplum quam succendi consueverat.";
kjv[20] = "And he commanded the most mighty men that [were] in his army to bind Shadrach, Meshach, and Abednego, [and] to cast [them] into the burning fiery furnace.";
rsv[20] = "And he ordered certain mighty men of his army to bind Shadrach, Meshach, and Abed\'nego, and to cast them into the burning fiery furnace.";
asv[20] = "And he commanded certain mighty men that were in his army to bind Shadrach, Meshach, and Abed-nego, [and] to cast them into the burning fiery furnace.";
yng[20] = "and to certain mighty men who [are] in his force he hath said to bind Shadrach, Meshach, and Abed-Nego, to cast into the burning fiery furnace.";
dby[20] = "And he commanded the most mighty men that were in his army to bind Shadrach, Meshach, and Abed-nego, and cast them into the burning fiery furnace.";
web[20] = "And he commanded the most mighty men that [were] in his army to bind Shadrach, Meshach, and Abed-nego, [and] to cast [them] into the burning fiery furnace.";
hnv[20] = "He commanded certain mighty men who were in his army to bind Shadrakh, Meshakh, and `Aved-Nego, [and] to cast them into the burning fiery furnace.";
vul[20] = "Et viris fortissimis de exercitu suo iussit ut ligatis pedibus Sidrach, Misach, et Abdenago mitterent eos in fornacem ignis ardentis.";
kjv[21] = "Then these men were bound in their coats, their hosen, and their hats, and their [other] garments, and were cast into the midst of the burning fiery furnace.";
rsv[21] = "Then these men were bound in their mantles, their tunics, their hats, and their other garments, and they were cast into the burning fiery furnace.";
asv[21] = "Then these men were bound in their hosen, their tunics, and their mantles, and their [other] garments, and were cast into the midst of the burning fiery furnace.";
yng[21] = "Then these men have been bound in their coats, their tunics, and their turbans, and their clothing, and have been cast into the midst of the burning fiery furnace.";
dby[21] = "Then these men were bound in their hosen, their tunics, and their cloaks, and their garments, and were cast into the midst of the burning fiery furnace.";
web[21] = "Then these men were bound in their coats, their hose, and their hats, and their [other] garments, and were cast into the midst of the burning fiery furnace.";
hnv[21] = "Then these men were bound in their pants, their tunics, and their mantles, and their [other] garments, and were cast into the midst of the burning fiery furnace.";
vul[21] = "Et confestim viri illi vincti cum braccis suis, et tiaris, et calceamentis, et vestibus missi sunt in medium fornacis ignis ardentis.";
kjv[22] = "Therefore because the king\'s commandment was urgent, and the furnace exceeding hot, the flame of the fire slew those men that took up Shadrach, Meshach, and Abednego.";
rsv[22] = "Because the king\'s order was strict and the furnace very hot, the flame of the fire slew those men who took up Shadrach, Meshach, and Abed\'nego.";
asv[22] = "Therefore because the king\'s commandment was urgent, and the furnace exceeding hot, the flame of the fire slew those men that took up Shadrach, Meshach, and Abed-nego.";
yng[22] = "Therefore, because that the word of the king is urgent, and the furnace heated exceedingly, those men who have taken up Shadrach, Meshach, and Abed-Nego -- killed them hath the spark of the fire.";
dby[22] = "Forasmuch as the king\'s commandment was rigorous, and the furnace exceeding hot, the flame of the fire slew those men that had taken up Shadrach, Meshach, and Abed-nego.";
web[22] = "Therefore because the king\'s commandment was urgent, and the furnace exceeding hot, the flame of the fire killed those men that took up Shadrach, Meshach, and Abed-nego.";
hnv[22] = "Therefore because the king\'s mitzvah was urgent, and the furnace exceeding hot, the flame of the fire killed those men who took up Shadrakh, Meshakh, and `Aved-Nego.";
vul[22] = "nam iussio regis urgebat: fornax autem succensa erat nimis. Porro viros illos, qui miserant Sidrach, Misach, et Abdenago, interfecit flamma ignis.";
kjv[23] = "And these three men, Shadrach, Meshach, and Abednego, fell down bound into the midst of the burning fiery furnace.";
rsv[23] = "And these three men, Shadrach, Meshach, and Abed\'nego, fell bound into the burning fiery furnace.";
asv[23] = "And these three men, Shadrach, Meshach, and Abed-nego, fell down bound into the midst of the burning fiery furnace.";
yng[23] = "And these three men, Shadrach, Meshach, and Abed-Nego, have fallen down in the midst of the burning fiery furnace -- bound.";
dby[23] = "And these three men, Shadrach, Meshach, and Abed-nego, fell down bound into the midst of the burning fiery furnace.";
web[23] = "And these three men, Shadrach, Meshach, and Abed-nego, fell down bound into the midst of the burning fiery furnace.";
hnv[23] = "These three men, Shadrakh, Meshakh, and `Aved-Nego, fell down bound into the midst of the burning fiery furnace.";
vul[23] = "Viri autem hi tres, id est, Sidrach, Misach, et Abdenago, ceciderunt in medio camino ignis ardentis, colligati.";
kjv[24] = "Then Nebuchadnezzar the king was astonied, and rose up in haste, [and] spake, and said unto his counsellors, Did not we cast three men bound into the midst of the fire? They answered and said unto the king, True, O king.";
rsv[24] = "Then King Nebuchadnez\'zar was astonished and rose up in haste. He said to his counselors, &quot;Did we not cast three men bound into the fire?&quot; They answered the king, &quot;True, O king.&quot;";
asv[24] = "Then Nebuchadnezzar the king was astonished, and rose up in haste: he spake and said unto his counsellors, Did not we cast three men bound into the midst of the fire? They answered and said unto the king, True, O king.";
yng[24] = "Then Nebuchadnezzar the king hath been astonished, and hath risen in haste; he hath answered and said to his counsellors, `Have we not cast three men into the midst of the fire -- bound?\' They have answered and are saying to the king, `Certainly, O king.\'";
dby[24] = "Then Nebuchadnezzar the king was astonied, and rose up in haste; he spoke and said unto his counsellors, Did not we cast three men bound into the midst of the fire? They answered and said to the king, True, O king.";
web[24] = "Then Nebuchadnezzar the king was astonished, and rose up in haste, [and] spoke, and said to his counselors, Did we not cast three men bound into the midst of the fire? They answered and said to the king, True, O king.";
hnv[24] = " Then Nevukhadnetztzar the king was astonished, and rose up in haste: he spoke and said to his counselors, Didn\'t we cast three men bound into the midst of the fire? They answered the king, True, O king.";
vul[24] = "(Vulgate 3:91) Tunc Nabuchodonosor rex obstupuit, et surrexit propere, et ait optimatibus suis: Nonne tres viros misimus in medium ignis compeditos? Qui respondentes regi, dixerunt: Vere rex.";
kjv[25] = "He answered and said, Lo, I see four men loose, walking in the midst of the fire, and they have no hurt; and the form of the fourth is like the Son of God.";
rsv[25] = "He answered, &quot;But I see four men loose, walking in the midst of the fire, and they are not hurt; and the appearance of the fourth is like a son of the gods.&quot;";
asv[25] = "He answered and said, Lo, I see four men loose, walking in the midst of the fire, and they have no hurt; and the aspect of the fourth is like a son of the gods.";
yng[25] = "He answered and hath said, `Lo, I am seeing four men loose, walking in the midst of the fire, and they have no hurt; and the appearance of the fourth [is] like to a son of the gods.\'";
dby[25] = "He answered and said, Lo, I see four men loose, walking in the midst of the fire, and they have no hurt; and the appearance of the fourth is like a son of God.";
web[25] = "He answered and said, Lo, I see four men loose, walking in the midst of the fire, and they have no hurt: and the form of the fourth is like the son of God.";
hnv[25] = "He answered, Look, I see four men loose, walking in the midst of the fire, and they have no hurt; and the aspect of the fourth is like a son of the gods.";
vul[25] = "(Vulgate 3:92) Respondit, et ait: Ecce ego video quattuor viros solutos, et ambulantes in medio ignis, et nihil corruptionis in eis est, et species quarti similis filio Dei.";
kjv[26] = "Then Nebuchadnezzar came near to the mouth of the burning fiery furnace, [and] spake, and said, Shadrach, Meshach, and Abednego, ye servants of the most high God, come forth, and come [hither]. Then Shadrach, Meshach, and Abednego, came forth of the midst of the fire.";
rsv[26] = "Then Nebuchadnez\'zar came near to the door of the burning fiery furnace and said, &quot;Shadrach, Meshach, and Abed\'nego, servants of the Most High God, come forth, and come here!&quot; Then Shadrach, Meshach, and Abed\'nego came out from the fire.";
asv[26] = "Then Nebuchadnezzar came near to the mouth of the burning fiery furnace: he spake and said, Shadrach, Meshach, and Abed-nego, ye servants of the Most High God, come forth, and come hither. Then Shadrach, Meshach, and Abed-nego came forth out of the midst of the fire.";
yng[26] = "Then Nebuchadnezzar hath drawn near to the gate of the burning fiery furnace; he hath answered and said, `Shadrach, Meshach, and Abed-Nego, servants of God Most High come forth, yea, come;\' then come forth do Shadrach, Meshach, and Abed-Nego, from the midst of the fire;";
dby[26] = "Then Nebuchadnezzar came near to the opening of the burning fiery furnace; he spoke and said, Shadrach, Meshach, and Abed-nego, ye servants of the Most High God, come forth, and come [hither]. Then Shadrach, Meshach, and Abed-nego came forth from the midst of the fire.";
web[26] = "Then Nebuchadnezzar came near to the mouth of the burning fiery furnace, [and] spoke, and said, Shadrach, Meshach, and Abed-nego, ye servants of the most high God, come forth, and come [hither]. Then Shadrach, Meshach, and Abed-nego, came forth from the midst of the fire.";
hnv[26] = "Then Nevukhadnetztzar came near to the mouth of the burning fiery furnace: he spoke and said, Shadrakh, Meshakh, and `Aved-Nego, you servants of Ha`Elyon God, come forth, and come here. Then Shadrakh, Meshakh, and `Aved-Nego came forth out of the midst of the fire.";
vul[26] = "(Vulgate 3:93) Tunc accessit Nabuchodonosor ad ostium fornacis ignis ardentis, et ait: Sidrach, Misach, et Abdenago servi Dei excelsi, egredimini, et venite. Statimque egressi sunt Sidrach, Misach, et Abdenago de medio ignis.";
kjv[27] = "And the princes, governors, and captains, and the king\'s counsellors, being gathered together, saw these men, upon whose bodies the fire had no power, nor was an hair of their head singed, neither were their coats changed, nor the smell of fire had passed on them.";
rsv[27] = "And the satraps, the prefects, the governors, and the king\'s counselors gathered together and saw that the fire had not had any power over the bodies of those men; the hair of their heads was not singed, their mantles were not harmed, and no smell of fire had come upon them.";
asv[27] = "And the satraps, the deputies, and the governors, and the king\'s counsellors, being gathered together, saw these men, that the fire had no power upon their bodies, nor was the hair of their head singed, neither were their hosen changed, nor had the smell of fire passed on them.";
yng[27] = "and gathered together, the satraps, the prefects, and the governors, and the counsellors of the king, are seeing these men, that the fire hath no power over their bodies, and the hair of their head hath not been singed, and their coats have not changed, and the smell of fire hath not passed on them.";
dby[27] = "And the satraps, the prefects, and the governors, and the king\'s counsellors, being gathered together, saw these men, upon whose bodies the fire had had no power, nor was the hair of their head singed, neither were their hosen changed, nor had the smell of fire passed on them.";
web[27] = "And the princes, governors, and captains, and the king\'s counselors, being assembled, saw these men, upon whose bodies the fire had no power, nor was a hair of their head singed, neither were their coats changed, nor had the smell of fire passed upon them.";
hnv[27] = "The satraps, the deputies, and the governors, and the king\'s counselors, being gathered together, saw these men, that the fire had no power on their bodies, nor was the hair of their head singed, neither were their pants changed, nor had the smell of fire passed on them.";
vul[27] = "(Vulgate 3:94) Et congregati satrapae et magistratus, et iudices, et potentes regis contemplabantur viros illos, quoniam nihil potestatis habuisset ignis in corporibus eorum, et capillus capitis eorum non esset adustus, et sarabala eorum non fuissent immutata, et odor ignis non transisset per eos.";
kjv[28] = "[Then] Nebuchadnezzar spake, and said, Blessed [be] the God of Shadrach, Meshach, and Abednego, who hath sent his angel, and delivered his servants that trusted in him, and have changed the king\'s word, and yielded their bodies, that they might not serve nor worship any god, except their own God.";
rsv[28] = "Nebuchadnez\'zar said, &quot;Blessed be the God of Shadrach, Meshach, and Abed\'nego, who has sent his angel and delivered his servants, who trusted in him, and set at nought the king\'s command, and yielded up their bodies rather than serve and worship any god except their own God.";
asv[28] = "Nebuchadnezzar spake and said, Blessed be the God of Shadrach, Meshach, and Abed-nego, who hath sent his angel, and delivered his servants that trusted in him, and have changed the king\'s word, and have yielded their bodies, that they might not serve nor worship any god, except their own God.";
yng[28] = "Nebuchadnezzar hath answered and hath said, `Blessed [is] the God of Shadrach, Meshach, and Abed-Nego, who hath sent His messenger, and hath delivered His servants who trusted on Him, and the word of the king changed, and gave up their bodies that they might not serve nor do obeisance to any god except to their own God.";
dby[28] = "Nebuchadnezzar spoke and said, Blessed be the God of Shadrach, Meshach, and Abed-nego, who hath sent his angel, and delivered his servants who trusted in him, and who changed the king\'s word, and yielded their bodies, that they might not serve nor worship any god, except their own God!";
web[28] = "[Then] Nebuchadnezzar spoke, and said, Blessed [be] the God of Shadrach, Meshach, and Abed-nego, who hath sent his angel, and delivered his servants that trusted in him, and have changed the king\'s word, and yielded their bodies, that they might not serve nor worship any god, except their own God.";
hnv[28] = "Nevukhadnetztzar spoke and said, Blessed be the God of Shadrakh, Meshakh, and `Aved-Nego, who has sent his angel, and delivered his servants who trusted in him, and have changed the king\'s word, and have yielded their bodies, that they might not serve nor worship any god, except their own God.";
vul[28] = "(Vulgate 3:95) Et erumpens Nabuchodonosor, ait: Benedictus Deus eorum, Sidrach videlicet, Misach, et Abdenago, qui misit angelum suum, et eruit servos suos, qui crediderunt in eum: et verbum regis immutaverunt, et tradiderunt corpora sua ne servirent, et ne adorarent omnem deum, excepto Deo suo.";
kjv[29] = "Therefore I make a decree, That every people, nation, and language, which speak any thing amiss against the God of Shadrach, Meshach, and Abednego, shall be cut in pieces, and their houses shall be made a dunghill: because there is no other God that can deliver after this sort.";
rsv[29] = "Therefore I make a decree: Any people, nation, or language that speaks anything against the God of Shadrach, Meshach, and Abed\'nego shall be torn limb from limb, and their houses laid in ruins; for there is no other god who is able to deliver in this way.&quot;";
asv[29] = "Therefore I make a decree, that every people, nation, and language, which speak anything amiss against the God of Shadrach, Meshach, and Abed-nego, shall be cut in pieces, and their houses shall be made a dunghill; because there is no other god that is able to deliver after this sort.";
yng[29] = "And by me a decree is made, that any people, nation, and language, that doth speak erroneously concerning the God of Shadrach, Meshach, and Abed-Nego, pieces he is made, and its house is made a dunghill, because that there is no other god who is able thus to deliver.\'";
dby[29] = "Therefore I make a decree, that in every people, nation, and language, he who shall speak anything amiss against the God of Shadrach, Meshach, and Abed-nego, shall be cut in pieces, and his house shall be made a dunghill: because there is no other God that is able to deliver after this sort.";
web[29] = "Therefore I make a decree, that every people, nation, and language, which speak any thing amiss against the God of Shadrach, Meshach, and Abed-nego, shall be cut in pieces, and their houses shall be made a dunghill: because there is no other god that can deliver after this sort.";
hnv[29] = "Therefore I make a decree, that every people, nation, and language, which speak anything amiss against the God of Shadrakh, Meshakh, and `Aved-Nego, shall be cut in pieces, and their houses shall be made a dunghill; because there is no other god who is able to deliver after this sort.";
vul[29] = "(Vulgate 3:96) A me ergo positum est hoc decretum, ut omnis populus, tribus, et lingua, quaecumque locuta fuerit blasphemiam contra Deum Sidrach, Misach, et Abdenago, dispereat, et domus eius vastetur: neque enim est alius Deus, qui possit ita salvare.";
kjv[30] = "Then the king promoted Shadrach, Meshach, and Abednego, in the province of Babylon.";
rsv[30] = "Then the king promoted Shadrach, Meshach, and Abed\'nego in the province of Babylon.";
asv[30] = "Then the king promoted Shadrach, Meshach, and Abed-nego in the province of Babylon.";
yng[30] = "Then the king hath caused Shadrach, Meshach, and Abed-Nego, to prosper in the province of Babylon.";
dby[30] = "Then the king promoted Shadrach, Meshach, and Abed-nego in the province of Babylon.";
web[30] = "Then the king promoted Shadrach, Meshach, and Abed-nego, in the province of Babylon.";
hnv[30] = "Then the king promoted Shadrakh, Meshakh, and `Aved-Nego in the province of Bavel.";
vul[30] = "(Vulgate 3:97) Tunc rex promovit Sidrach, Misach, et Abdenago in provincia Babylonis.";
