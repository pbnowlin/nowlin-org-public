csb[1] = "Darius decided to appoint 120 satraps over the kingdom, stationed throughout the realm,";
csb[2] = "and over them three administrators, including Daniel. These satraps would be accountable to them so that the king would not be defrauded.";
csb[3] = "Daniel distinguished himself above the administrators and satraps because he had an extraordinary spirit, so the king planned to set him over the whole realm.";
csb[4] = "The administrators and satraps, therefore, kept trying to find a charge against Daniel regarding the kingdom. But they could find no charge or corruption, for he was trustworthy, and no negligence or corruption was found in him.";
csb[5] = "Then these men said, &quot;We will never find any charge against this Daniel unless we find something against him concerning the law of his God.&quot;";
csb[6] = "So the administrators and satraps went together to the king and said to him, &quot;May King Darius live forever.";
csb[7] = "&quot;All the administrators of the kingdom, the prefects, satraps, advisers, and governors have agreed that the king should establish an ordinance and enforce an edict that for thirty days, anyone who petitions any god or man except you, the king, will be thrown into the lions\' den.";
csb[8] = "&quot;Therefore, Your Majesty, establish the edict and sign the document so that, as a law of the Medes and Persians, it is irrevocable and cannot be changed.&quot;";
csb[9] = "So King Darius signed the written edict.";
csb[10] = "When Daniel learned that the document had been signed, he went into his house. The windows in its upstairs room opened toward Jerusalem, and three times a day he got down on his knees, prayed, and gave thanks to his God, just as he had done before.";
csb[11] = "Then these men went as a group and found Daniel petitioning and imploring his God.";
csb[12] = "So they approached the king and asked about his edict: &quot;Didn\'t you sign an edict that for thirty days any person who petitions any god or man except you, the king, will be thrown into the lions\' den? &quot; The king answered, &quot;As a law of the Medes and Persians, the order stands and is irrevocable.&quot;";
csb[13] = "Then they replied to the king, &quot;Daniel, one of the Judean exiles, has ignored you, the king, and the edict you signed, for he prays three times a day.&quot;";
csb[14] = "As soon as the king heard this, he was very displeased; he set his mind on rescuing Daniel and made every effort until sundown to deliver him.";
csb[15] = "Then these men went together to the king and said to him, &quot;You know, Your Majesty, that it is a law of the Medes and Persians that no edict or ordinance the king establishes can be changed.&quot;";
csb[16] = "So the king gave the order, and they brought Daniel and threw him into the lions\' den. The king said to Daniel, &quot;May your God, whom you continually serve, rescue you! &quot;";
csb[17] = "A stone was brought and placed over the mouth of the den. The king sealed it with his own signet ring and with the signet rings of his nobles, so that nothing in regard to Daniel could be changed.";
csb[18] = "Then the king went to his palace and spent the night fasting. No diversions were brought to him, and he could not sleep.";
csb[19] = "At the first light of dawn the king got up and hurried to the lions\' den.";
csb[20] = "When he reached the den, he cried out in anguish to Daniel. &quot;Daniel, servant of the living God,&quot; the king said, &quot;has your God, whom you continually serve, been able to rescue you from the lions? &quot;";
csb[21] = "Then Daniel spoke with the king: &quot;May the king live forever.";
csb[22] = "&quot;My God sent his angel and shut the lions\' mouths; and they haven\'t harmed me, for I was found innocent before him. And also before you, Your Majesty, I have not done harm.&quot;";
csb[23] = "The king was overjoyed and gave orders to take Daniel out of the den. When Daniel was brought up from the den, he was found to be unharmed, for he trusted in his God.";
csb[24] = "The king then gave the command, and those men who had maliciously accused Daniel were brought and thrown into the lions\' den -- they, their children, and their wives. They had not reached the bottom of the den before the lions overpowered them and crushed all their bones.";
csb[25] = "Then King Darius wrote to those of every people, nation, and language who live on the whole earth: &quot;May your prosperity abound.";
csb[26] = "&quot;I issue a decree that in all my royal dominion, people must tremble in fear before the God of Daniel: For he is the living God, and he endures forever; his kingdom will never be destroyed, and his dominion has no end.";
csb[27] = "&quot;He rescues and delivers; he performs signs and wonders in the heavens and on the earth, for he has rescued Daniel from the power of the lions.&quot;";
csb[28] = "So Daniel prospered during the reign of Darius and the reign of Cyrus the Persian.";
kjv[1] = "It pleased Darius to set over the kingdom an hundred and twenty princes, which should be over the whole kingdom;";
rsv[1] = "It pleased Darius to set over the kingdom a hundred and twenty satraps, to be throughout the whole kingdom;";
asv[1] = "It pleased Darius to set over the kingdom a hundred and twenty satraps, who should be throughout the whole kingdom;";
yng[1] = "It hath been good before Darius, and he hath established over the kingdom satraps -- a hundred and twenty -- that they may be throughout the whole kingdom,";
dby[1] = "It pleased Darius to set over the kingdom a hundred and twenty satraps, who should be in all the kingdom;";
web[1] = "It pleased Darius to set over the kingdom a hundred and twenty princes, who should be over the whole kingdom;";
hnv[1] = "It pleased Daryavesh to set over the kingdom one hundred twenty satraps, who should be throughout the whole kingdom;";
vul[1] = "Placuit Dario, et constituit super regnum satrapas centum viginti ut essent in toto regno suo.";
kjv[2] = "And over these three presidents; of whom Daniel [was] first: that the princes might give accounts unto them, and the king should have no damage.";
rsv[2] = "and over them three presidents, of whom Daniel was one, to whom these satraps should give account, so that the king might suffer no loss.";
asv[2] = "and over them three presidents, of whom Daniel was one; that these satraps might give account unto them, and that the king should have no damage.";
yng[2] = "and higher than they three presidents, of whom Daniel [is] first, that these satraps may give to them an account, and the king have no loss.";
dby[2] = "and over these, three presidents -- of whom Daniel was one -- to whom these satraps should render account, and that the king should suffer no loss.";
web[2] = "And over these three presidents; of whom Daniel [was] first: that the princes might give accounts to them, and the king should have no damage.";
hnv[2] = "and over them three presidents, of whom Daniyel was one; that these satraps might give account to them, and that the king should have no damage.";
vul[2] = "Et super eos principes tres, ex quibus Daniel unus erat: ut satrapae illis redderent rationem, et rex non sustineret molestiam.";
kjv[3] = "Then this Daniel was preferred above the presidents and princes, because an excellent spirit [was] in him; and the king thought to set him over the whole realm.";
rsv[3] = "Then this Daniel became distinguished above all the other presidents and satraps, because an excellent spirit was in him; and the king planned to set him over the whole kingdom.";
asv[3] = "Then this Daniel was distinguished above the presidents and the satraps, because an excellent spirit was in him; and the king thought to set him over the whole realm.";
yng[3] = "Then this Daniel hath been overseer over the presidents and satraps, because that an excellent spirit [is] in him, and the king hath thought to establish him over the whole kingdom.";
dby[3] = "Now this Daniel surpassed the presidents and the satraps, because an excellent spirit was in him; and the king thought to appoint him over the whole realm.";
web[3] = "Then this Daniel was preferred above the presidents and princes, because an excellent spirit [was] in him; and the king thought to set him over the whole realm.";
hnv[3] = "Then this Daniyel was distinguished above the presidents and the satraps, because an excellent spirit was in him; and the king thought to set him over the whole realm.";
vul[3] = "Igitur Daniel superabat omnes principes, et satrapas: quia spiritus Dei amplior erat in illo.";
kjv[4] = "Then the presidents and princes sought to find occasion against Daniel concerning the kingdom; but they could find none occasion nor fault; forasmuch as he [was] faithful, neither was there any error or fault found in him.";
rsv[4] = "Then the presidents and the satraps sought to find a ground for complaint against Daniel with regard to the kingdom; but they could find no ground for complaint or any fault, because he was faithful, and no error or fault was found in him.";
asv[4] = "Then the presidents and the satraps sought to find occasion against Daniel as touching the kingdom; but they could find no occasion nor fault, forasmuch as he was faithful, neither was there any error or fault found in him.";
yng[4] = "Then the presidents and satraps have been seeking to find a cause of complaint against Daniel concerning the kingdom, and any cause of complaint and corruption they are not able to find, because that he [is] faithful, and any error and corruption have not been found in him.";
dby[4] = "Then the presidents and the satraps sought to find a pretext against Daniel with respect to the kingdom; but they could not find any pretext or fault; inasmuch as he was faithful, neither was there any error or fault found in him.";
web[4] = "Then the presidents and princes sought to find occasion against Daniel concerning the kingdom; but they could find no occasion nor fault; forasmuch as he [was] faithful, neither was there any error or fault found in him.";
hnv[4] = "Then the presidents and the satraps sought to find occasion against Daniyel as touching the kingdom; but they could find no occasion nor fault, because he was faithful, neither was there any error or fault found in him.";
vul[4] = "Porro rex cogitabat constituere eum super omne regnum: unde principes, et satrapae quaerebant occasionem ut invenirent Danieli ex latere regis: nullamque causam, et suspicionem reperire potuerunt, eo quod fidelis esset, et omnis culpa, et suspicio non inveniretur in eo.";
kjv[5] = "Then said these men, We shall not find any occasion against this Daniel, except we find [it] against him concerning the law of his God.";
rsv[5] = "Then these men said, &quot;We shall not find any ground for complaint against this Daniel unless we find it in connection with the law of his God.&quot;";
asv[5] = "Then said these men, We shall not find any occasion against this Daniel, except we find it against him concerning the law of his God.";
yng[5] = "Then these men are saying, `We do not find against this Daniel any cause of complaint, except we have found [it] against him in the law of his God.\'";
dby[5] = "Then said these men, We shall not find any pretext against this Daniel, unless we find [it] against him touching the law of his God.";
web[5] = "Then said these men, We shall not find any occasion against this Daniel, except we find [it] against him concerning the law of his God.";
hnv[5] = "Then said these men, We shall not find any occasion against this Daniyel, except we find it against him concerning the law of his God.";
vul[5] = "Dixerunt ergo viri illi: Non inveniemus Danieli huic aliquam occasionem, nisi forte in lege Dei sui.";
kjv[6] = "Then these presidents and princes assembled together to the king, and said thus unto him, King Darius, live for ever.";
rsv[6] = "Then these presidents and satraps came by agreement to the king and said to him, &quot;O King Darius, live for ever!";
asv[6] = "Then these presidents and satraps assembled together to the king, and said thus unto him, King Darius, live for ever.";
yng[6] = "Then these presidents and satraps have assembled near the king, and thus they are saying to him: `O king Darius, to the ages live!";
dby[6] = "Then these presidents and satraps came in a body to the king, and said thus unto him: King Darius, live for ever!";
web[6] = "Then these presidents and princes assembled to the king, and said thus to him, King Darius, live for ever.";
hnv[6] = "Then these presidents and satraps assembled together to the king, and said thus to him, King Daryavesh, live forever.";
vul[6] = "Tunc principes, et satrapae surripuerunt regi, et sic locuti sunt ei: Dari rex in aeternum vive:";
kjv[7] = "All the presidents of the kingdom, the governors, and the princes, the counsellors, and the captains, have consulted together to establish a royal statute, and to make a firm decree, that whosoever shall ask a petition of any God or man for thirty days, save of thee, O king, he shall be cast into the den of lions.";
rsv[7] = "All the presidents of the kingdom, the prefects and the satraps, the counselors and the governors are agreed that the king should establish an ordinance and enforce an interdict, that whoever makes petition to any god or man for thirty days, except to you, O king, shall be cast into the den of lions.";
asv[7] = "All the presidents of the kingdom, the deputies and the satraps, the counsellors and the governors, have consulted together to establish a royal statute, and to make a strong interdict, that whosoever shall ask a petition of any god or man for thirty days, save of thee, O king, he shall be cast into the den of lions.";
yng[7] = "Taken counsel have all the presidents of the kingdom, the prefects, and the satraps, the counsellors, and the governors, to establish a royal statute, and to strengthen an interdict, that any who seeketh a petition from any god and man until thirty days, save of thee, O king, is cast into a den of lions.";
dby[7] = "All the presidents of the kingdom, the prefects, and the satraps, the counsellors, and the governors have consulted together to establish a royal statute, and to make a firm decree, that whosoever shall ask a petition of any god or man for thirty days, except of thee, O king, he shall be cast into the den of lions.";
web[7] = "All the presidents of the kingdom, the governors, and the princes, the counselors, and the captains, have consulted together to establish a royal statute, and to make a firm decree, that whoever shall ask a petition of any God or man for thirty days, save of thee, O king, he shall be cast into the den of lions.";
hnv[7] = "All the presidents of the kingdom, the deputies and the satraps, the counselors and the governors, have consulted together to establish a royal statute, and to make a strong interdict, that whoever shall ask a petition of any god or man for thirty days, save of you, O king, he shall be cast into the den of lions.";
vul[7] = "consilium inierunt omnes principes regni tui, magistratus, et satrapae, senatores, et iudices ut decretum imperatorium exeat, et edictum: Ut omnis, qui petierit aliquam petitionem a quocumque deo, et homine usque ad triginta dies, nisi a te rex, mittatur in lacum leonum.";
kjv[8] = "Now, O king, establish the decree, and sign the writing, that it be not changed, according to the law of the Medes and Persians, which altereth not.";
rsv[8] = "Now, O king, establish the interdict and sign the document, so that it cannot be changed, according to the law of the Medes and the Persians, which cannot be revoked.&quot;";
asv[8] = "Now, O king, establish the interdict, and sign the writing, that it be not changed, according to the law of the Medes and Persians, which altereth not.";
yng[8] = "Now, O king, thou dost establish the interdict, and sign the writing, that it is not to be changed, as a law of Media and Persia, that doth not pass away.\'";
dby[8] = "Now, O king, establish the decree, and sign the writing, that it be not changed, according to the law of the Medes and Persians, which may not be revoked.";
web[8] = "Now, O king, establish the decree, and sign the writing, that it may not be changed, according to the law of the Medes and Persians, which altereth not.";
hnv[8] = "Now, O king, establish the interdict, and sign the writing, that it not be changed, according to the law of the Madai and Paras, which doesn\'t alter.";
vul[8] = "Nunc itaque rex confirma sententiam, et scribe decretum: ut non immutetur quod statutum est a Medis et Persis, nec praevaricari cuiquam liceat.";
kjv[9] = "Wherefore king Darius signed the writing and the decree.";
rsv[9] = "Therefore King Darius signed the document and interdict.";
asv[9] = "Wherefore king Darius signed the writing and the interdict.";
yng[9] = "Therefore king Darius hath signed the writing and interdict.";
dby[9] = "Therefore king Darius signed the writing and the decree.";
web[9] = "Wherefore king Darius signed the writing and the decree.";
hnv[9] = "Therefore king Daryavesh signed the writing and the interdict.";
vul[9] = "Porro rex Darius proposuit edictum, et statuit.";
kjv[10] = "Now when Daniel knew that the writing was signed, he went into his house; and his windows being open in his chamber toward Jerusalem, he kneeled upon his knees three times a day, and prayed, and gave thanks before his God, as he did aforetime.";
rsv[10] = "When Daniel knew that the document had been signed, he went to his house where he had windows in his upper chamber open toward Jerusalem; and he got down upon his knees three times a day and prayed and gave thanks before his God, as he had done previously.";
asv[10] = "And when Daniel knew that the writing was signed, he went into his house (now his windows were open in his chamber toward Jerusalem) and he kneeled upon his knees three times a day, and prayed, and gave thanks before his God, as he did aforetime.";
yng[10] = "And Daniel, when he hath known that the writing is signed, hath gone up to his house, and the window being opened for him, in his upper chamber, over-against Jerusalem, three times in a day he is kneeling on his knees, and praying, and confessing before his God, because that he was doing [it] before this.";
dby[10] = "And when Daniel knew that the writing was signed, he went into his house; and, his windows being open in his upper chamber toward Jerusalem, he kneeled on his knees three times a day, and prayed and gave thanks before his God, as he did aforetime.";
web[10] = "Now when Daniel knew that the writing was signed, he went into his house; and his windows being open in his chamber towards Jerusalem, he kneeled upon his knees three times a day, and prayed, and gave thanks before his God, as he did before.";
hnv[10] = "When Daniyel knew that the writing was signed, he went into his house (now his windows were open in his chamber toward Yerushalayim) and he kneeled on his knees three times a day, and prayed, and gave thanks before his God, as he did before.";
vul[10] = "Quod cum Daniel comperisset, id est, constitutam legem, ingressus est domum suam: et fenestris apertis in coenaculo suo contra Ierusalem tribus temporibus in die flectebat genua sua, et adorabat, confitebaturque coram Deo suo sicut et ante facere consueverat.";
kjv[11] = "Then these men assembled, and found Daniel praying and making supplication before his God.";
rsv[11] = "Then these men came by agreement and found Daniel making petition and supplication before his God.";
asv[11] = "Then these men assembled together, and found Daniel making petition and supplication before his God.";
yng[11] = "Then these men have assembled, and found Daniel praying and entreating grace before his God;";
dby[11] = "But those men came in a body, and found Daniel praying and making supplication before his God.";
web[11] = "Then these men assembled, and found Daniel praying and making supplication before his God.";
hnv[11] = "Then these men assembled together, and found Daniyel making petition and supplication before his God.";
vul[11] = "Viri ergo illi curiosius inquirentes invenerunt Danielem orantem, et obscerantem Deum suum.";
kjv[12] = "Then they came near, and spake before the king concerning the king\'s decree; Hast thou not signed a decree, that every man that shall ask [a petition] of any God or man within thirty days, save of thee, O king, shall be cast into the den of lions? The king answered and said, The thing [is] true, according to the law of the Medes and Persians, which altereth not.";
rsv[12] = "Then they came near and said before the king, concerning the interdict, &quot;O king! Did you not sign an interdict, that any man who makes petition to any god or man within thirty days except to you, O king, shall be cast into the den of lions?&quot; The king answered, &quot;The thing stands fast, according to the law of the Medes and Persians, which cannot be revoked.&quot;";
asv[12] = "Then they came near, and spake before the king concerning the king\'s interdict: Hast thou not signed an interdict, that every man that shall make petition unto any god or man within thirty days, save unto thee, O king, shall be cast into the den of lions? The king answered and said, The thing is true, according to the law of the Medes and Persians, which altereth not.";
yng[12] = "then they have come near, yea, they are saying before the king concerning the king\'s interdict: `Hast thou not signed an interdict, that any man who seeketh from any god and man until thirty days, save of thee, O king, is cast into a den of lions?\' Answered hath the king, and said, `The thing [is] certain as a law of Media and Persia, that doth not pass away.\'";
dby[12] = "Then they came near, and spoke before the king concerning the king\'s decree: Hast thou not signed a decree, that every man that shall ask [anything] of any god or man within thirty days, except of thee, O king, shall be cast into the den of lions? The king answered and said, The thing is true, according to the law of the Medes and Persians, which may not be revoked.";
web[12] = "Then they came near, and spoke before the king concerning the king\'s decree; Hast thou not signed a decree, that every man that shall ask [a petition] of any God or man within thirty days, save of thee, O king, shall be cast into the den of lions? The king answered and said, The thing [is] true, according to the law of the Medes and Persians, which altereth not.";
hnv[12] = "Then they came near, and spoke before the king concerning the king\'s interdict: Haven\'t you signed an interdict, that every man who shall make petition to any god or man within thirty days, save to you, O king, shall be cast into the den of lions? The king answered, The thing is true, according to the law of the Madai and Paras, which doesn\'t alter.";
vul[12] = "Et accedentes locuti sunt regi super edicto: Rex numquid non constituisti, ut omnis homo, qui rogaret quemquam de diis, et hominibus usque ad dies triginta, nisi te, rex, mitteretur in lacum leonum? Ad quos respondens rex, ait: verus est sermo iuxta decretum Medorum, atque Persarum, quod praevaricari non licet.";
kjv[13] = "Then answered they and said before the king, That Daniel, which [is] of the children of the captivity of Judah, regardeth not thee, O king, nor the decree that thou hast signed, but maketh his petition three times a day.";
rsv[13] = "Then they answered before the king, &quot;That Daniel, who is one of the exiles from Judah, pays no heed to you, O king, or the interdict you have signed, but makes his petition three times a day.&quot;";
asv[13] = "Then answered they and said before the king, That Daniel, who is of the children of the captivity of Judah, regardeth not thee, O king, nor the interdict that thou hast signed, but maketh his petition three times a day.";
yng[13] = "Then they have answered, yea, they are saying before the king, that, `Daniel, who [is] of the sons of the Removed of Judah, hath not placed on thee, O king, [any] regard, nor on the interdict that thou hast signed, and three times in a day he is seeking his petition.\'";
dby[13] = "Then they answered and said before the king, That Daniel, who is of the children of the captivity of Judah, regardeth not thee, O king, nor the decree that thou hast signed, but maketh his petition three times a day.";
web[13] = "Then they answered and said before the king, That Daniel, who [is] of the children of the captivity of Judah, regardeth not thee, O king, nor the decree that thou hast signed, but maketh his petition three times a day.";
hnv[13] = "Then answered they and said before the king, That Daniyel, who is of the children of the captivity of Yehudah, doesn\'t regard you, O king, nor the interdict that you have signed, but makes his petition three times a day.";
vul[13] = "Tunc respondentes dixerunt coram rege: Daniel de filiis captivitatis Iuda, non curavit de lege tua, et de edicto, quod constituisti: sed tribus temporibus per diem orat obsecratione sua.";
kjv[14] = "Then the king, when he heard [these] words, was sore displeased with himself, and set [his] heart on Daniel to deliver him: and he laboured till the going down of the sun to deliver him.";
rsv[14] = "Then the king, when he heard these words, was much distressed, and set his mind to deliver Daniel; and he labored till the sun went down to rescue him.";
asv[14] = "Then the king, when he heard these words, was sore displeased, and set his heart on Daniel to deliver him; and he labored till the going down of the sun to rescue him.";
yng[14] = "Then the king, when he hath heard the matter, is greatly displeased at himself, and on Daniel he hath set the heart to deliver him, and till the going up of the sun he was arranging to deliver him.";
dby[14] = "Then the king, when he heard these words, was sore distressed thereby, and set his heart on Daniel to save him; and he laboured till the going down of the sun to deliver him.";
web[14] = "Then the king, when he heard [these] words, was much displeased with himself, and set [his] heart on Daniel to deliver him: and he labored till the setting of the sun to deliver him.";
hnv[14] = " Then the king, when he heard these words, was sore displeased, and set his heart on Daniyel to deliver him; and he labored until the going down of the sun to rescue him.";
vul[14] = "Quod verbum cum audisset rex, satis contristatus est: et pro Daniele posuit cor ut liberaret eum, et usque ad occasum solis laborabat ut erueret illum.";
kjv[15] = "Then these men assembled unto the king, and said unto the king, Know, O king, that the law of the Medes and Persians [is], That no decree nor statute which the king establisheth may be changed.";
rsv[15] = "Then these men came by agreement to the king, and said to the king, &quot;Know, O king, that it is a law of the Medes and Persians that no interdict or ordinance which the king establishes can be changed.&quot;";
asv[15] = "Then these men assembled together unto the king, and said unto the king, Know, O king, that it is a law of the Medes and Persians, that no interdict nor statute which the king establisheth may be changed.";
yng[15] = "Then these men have assembled near the king, and are saying to the king, `know, O king, that the law of Media and Persia [is]: That any interdict and statute that the king doth establish is not to be changed.\'";
dby[15] = "Then these men came in a body unto the king, and said unto the king, Know, O king, that the law of the Medes and Persians is, That no decree nor statute which the king establisheth may be changed.";
web[15] = "Then these men assembled to the king, and said to the king, Know, O king, that the law of the Medes and Persians [is], That no decree nor statute which the king establisheth may be changed.";
hnv[15] = "Then these men assembled together to the king, and said to the king, Know, O king, that it is a law of the Madai and Paras, that no interdict nor statute which the king establishes may be changed.";
vul[15] = "Viri autem illi intelligentes regem dixerunt ei: Scito rex, quia lex Medorum, atque Persarum est ut omne decretum, quod constituerit rex, non liceat immutari.";
kjv[16] = "Then the king commanded, and they brought Daniel, and cast [him] into the den of lions. [Now] the king spake and said unto Daniel, Thy God whom thou servest continually, he will deliver thee.";
rsv[16] = "Then the king commanded, and Daniel was brought and cast into the den of lions. The king said to Daniel, &quot;May your God, whom you serve continually, deliver you!&quot;";
asv[16] = "Then the king commanded, and they brought Daniel, and cast him into the den of lions. [Now] the king spake and said unto Daniel, Thy God whom thou servest continually, he will deliver thee.";
yng[16] = "Then the king hath said, and they have brought Daniel, and have cast [him] into a den of lions. The king hath answered and said to Daniel, `Thy God, whom thou art serving continually, Himself doth deliver thee.\'";
dby[16] = "Then the king commanded, and they brought Daniel, and cast [him] into the den of lions. The king spoke and said unto Daniel, Thy God whom thou servest continually, he will save thee.";
web[16] = "Then the king commanded, and they brought Daniel, and cast [him] into the den of lions. [Now] the king spoke and said to Daniel, Thy God whom thou servest continually, he will deliver thee.";
hnv[16] = "Then the king commanded, and they brought Daniyel, and cast him into the den of lions. [Now] the king spoke and said to Daniyel, Your God whom you serve continually, he will deliver you.";
vul[16] = "Tunc rex praecepit: et adduxerunt Danielem, et miserunt eum in lacum leonum. Dixitque rex Danieli: Deus tuus, quem colis semper, ipse liberabit te.";
kjv[17] = "And a stone was brought, and laid upon the mouth of the den; and the king sealed it with his own signet, and with the signet of his lords; that the purpose might not be changed concerning Daniel.";
rsv[17] = "And a stone was brought and laid upon the mouth of the den, and the king sealed it with his own signet and with the signet of his lords, that nothing might be changed concerning Daniel.";
asv[17] = "And a stone was brought, and laid upon the mouth of the den; and the king sealed it with his own signet, and with the signet of his lords; that nothing might be changed concerning Daniel.";
yng[17] = "And a stone hath been brought and placed at the mouth of the den, and the king hath sealed it with his signet, and with the signet of his great men, that the purpose be not changed concerning Daniel.";
dby[17] = "And a stone was brought, and laid upon the mouth of the den; and the king sealed it with his own signet, and with the signet of his nobles, that the purpose might not be changed concerning Daniel.";
web[17] = "And a stone was brought, and laid upon the mouth of the den; and the king sealed it with his own signet, and with the signet of his lords; that the purpose might not be changed concerning Daniel.";
hnv[17] = "A stone was brought, and laid on the mouth of the den; and the king sealed it with his own signet, and with the signet of his lords; that nothing might be changed concerning Daniyel.";
vul[17] = "Allatusque est lapis unus, et positus est super os laci: quem obsignavit rex annulo suo, et annulo optimatum suorum, nequid fieret contra Danielem.";
kjv[18] = "Then the king went to his palace, and passed the night fasting: neither were instruments of musick brought before him: and his sleep went from him.";
rsv[18] = "Then the king went to his palace, and spent the night fasting; no diversions were brought to him, and sleep fled from him.";
asv[18] = "Then the king went to his palace, and passed the night fasting; neither were instruments of music brought before him: and his sleep fled from him.";
yng[18] = "Then hath the king gone to his palace, and he hath passed the night fasting, and dahavan have not been brought up before him, and his sleep hath fled [from] off him.";
dby[18] = "Then the king went to his palace, and passed the night fasting; neither were concubines brought before him; and his sleep fled from him.";
web[18] = "Then the king went to his palace, and passed the night fasting: neither were instruments of music brought before him: and his sleep went from him.";
hnv[18] = " Then the king went to his palace, and passed the night fasting; neither were instruments of music brought before him: and his sleep fled from him.";
vul[18] = "Et abiit rex in domum suam, et dormivit incoenatus, cibique non sunt allati coram eo, insuper et somnus recessit ab eo.";
kjv[19] = "Then the king arose very early in the morning, and went in haste unto the den of lions.";
rsv[19] = "Then, at break of day, the king arose and went in haste to the den of lions.";
asv[19] = "Then the king arose very early in the morning, and went in haste unto the den of lions.";
yng[19] = "Then doth the king rise in the early morning, at the light, and in haste to the den of lions he hath gone;";
dby[19] = "Then the king arose with the light at break of day, and went in haste unto the den of lions.";
web[19] = "Then the king arose very early in the morning, and went in haste to the den of lions.";
hnv[19] = "Then the king arose very early in the morning, and went in haste to the den of lions.";
vul[19] = "Tunc rex primo diluculo consurgens, festinus ad lacum leonum perrexit:";
kjv[20] = "And when he came to the den, he cried with a lamentable voice unto Daniel: [and] the king spake and said to Daniel, O Daniel, servant of the living God, is thy God, whom thou servest continually, able to deliver thee from the lions?";
rsv[20] = "When he came near to the den where Daniel was, he cried out in a tone of anguish and said to Daniel, &quot;O Daniel, servant of the living God, has your God, whom you serve continually, been able to deliver you from the lions?&quot;";
asv[20] = "And when he came near unto the den to Daniel, he cried with a lamentable voice; the king spake and said to Daniel, O Daniel, servant of the living God, is thy God, whom thou servest continually, able to deliver thee from the lions?";
yng[20] = "and at his coming near to the den, to Daniel, with a grieved voice, he crieth. The king hath answered and said to Daniel, O Daniel, servant of the living God, thy God, whom thou art serving continually, is He able to deliver thee from the lions?\'";
dby[20] = "And when he came near unto the den, he cried with a mournful voice unto Daniel: the king spoke and said unto Daniel, O Daniel, servant of the living God, hath thy God whom thou servest continually been able to save thee from the lions?";
web[20] = "And when he came to the den, he cried with a lamentable voice to Daniel: [and] the king spoke and said to Daniel, O Daniel, servant of the living God, is thy God, whom thou servest continually, able to deliver thee from the lions?";
hnv[20] = "When he came near to the den to Daniyel, he cried with a lamentable voice; the king spoke and said to Daniyel, Daniyel, servant of the living God, is your God, whom you serve continually, able to deliver you from the lions?";
vul[20] = "appropinquansque lacui, Danielem voce lacrymabili inclamavit, et affatus est eum: Daniel serve Dei viventis, Deus tuus, cui tu servis semper, putasne valuit te liberare a leonibus?";
kjv[21] = "Then said Daniel unto the king, O king, live for ever.";
rsv[21] = "Then Daniel said to the king, &quot;O king, live for ever!";
asv[21] = "Then said Daniel unto the king, O king, live for ever.";
yng[21] = "Then Daniel hath spoken with the king: `O king, to the ages live:";
dby[21] = "Then Daniel spoke unto the king, O king, live for ever!";
web[21] = "Then said Daniel to the king, O king, live for ever.";
hnv[21] = "Then said Daniyel to the king, O king, live forever.";
vul[21] = "Et Daniel regi respondens ait: Rex in aeternum vive:";
kjv[22] = "My God hath sent his angel, and hath shut the lions\' mouths, that they have not hurt me: forasmuch as before him innocency was found in me; and also before thee, O king, have I done no hurt.";
rsv[22] = "My God sent his angel and shut the lions\' mouths, and they have not hurt me, because I was found blameless before him; and also before you, O king, I have done no wrong.&quot;";
asv[22] = "My God hath sent his angel, and hath shut the lions\' mouths, and they have not hurt me; forasmuch as before him innocency was found in me; and also before thee, O king, have I done no hurt.";
yng[22] = "my God hath sent His messenger, and hath shut the lions\' mouths, and they have not injured me: because that before Him purity hath been found in me; and also before thee, O king, injury I have not done.\'";
dby[22] = "My God hath sent his angel, and hath shut the lions\' mouths, that they have not hurt me; forasmuch as before him innocence was found in me; and also before thee, O king, have I done no hurt.";
web[22] = "My God hath sent his angel, and hath shut the lions\' mouths, that they have not hurt me: forasmuch as before him innocence was found in me; and also before thee, O king, have I done no hurt.";
hnv[22] = "My God has sent his angel, and has shut the lions\' mouths, and they have not hurt me; because as before him innocence was found in me; and also before you, O king, have I done no hurt.";
vul[22] = "(h) Deus meus misit angelum suum, et conclusit ora leonum, et non nocuerunt mihi: quia coram eo iustitia inventa est in me: sed et coram te, rex, delictum non feci.";
kjv[23] = "Then was the king exceeding glad for him, and commanded that they should take Daniel up out of the den. So Daniel was taken up out of the den, and no manner of hurt was found upon him, because he believed in his God.";
rsv[23] = "Then the king was exceedingly glad, and commanded that Daniel be taken up out of the den. So Daniel was taken up out of the den, and no kind of hurt was found upon him, because he had trusted in his God.";
asv[23] = "Then was the king exceeding glad, and commanded that they should take Daniel up out of the den. So Daniel was taken up out of the den, and no manner of hurt was found upon him, because he had trusted in his God.";
yng[23] = "Then was the king very glad for him, and he hath commanded Daniel to be taken up out of the den, and Daniel hath been taken up out of the den, and no injury hath been found in him, because he hath believed in his God.";
dby[23] = "Thereupon was the king exceeding glad, and commanded that they should take Daniel up out of the den. So Daniel was taken up out of the den, and no manner of hurt was found upon him, because he believed in his God.";
web[23] = "Then was the king exceeding glad for him, and commanded that they should take Daniel out of the den. So Daniel was taken out of the den, and no manner of hurt was found upon him, because he believed in his God.";
hnv[23] = "Then was the king exceeding glad, and commanded that they should take Daniyel up out of the den. So Daniyel was taken up out of the den, and no manner of hurt was found on him, because he had trusted in his God.";
vul[23] = "Tunc vehementer rex gavisus est super eo, et Danielem praecepit educi de lacu: eductusque est Daniel de lacu, et nulla laesio inventa est in eo, quia credidit Deo suo.";
kjv[24] = "And the king commanded, and they brought those men which had accused Daniel, and they cast [them] into the den of lions, them, their children, and their wives; and the lions had the mastery of them, and brake all their bones in pieces or ever they came at the bottom of the den.";
rsv[24] = "And the king commanded, and those men who had accused Daniel were brought and cast into the den of lions--they, their children, and their wives; and before they reached the bottom of the den the lions overpowered them and broke all their bones in pieces.";
asv[24] = "And the king commanded, and they brought those men that had accused Daniel, and they cast them into the den of lions, them, their children, and their wives; and the lions had the mastery of them, and brake all their bones in pieces, before they came to the bottom of the den.";
yng[24] = "And the king hath said, and they have brought those men who had accused Daniel, and to the den of lions they have cast them, they, their sons, and their wives; and they have not come to the lower part of the den till that the lions have power over them, and all their bones they have broken small.";
dby[24] = "And the king commanded, and they brought those men who had accused Daniel, and cast them into the den of lions, them, their children, and their wives; and the lions had the mastery of them, and broke all their bones in pieces ere they came to the bottom of the den.";
web[24] = "And the king commanded, and they brought those men who had accused Daniel, and they cast [them] into the den of lions, them, their children, and their wives; and the lions had the mastery of them, and broke all their bones in pieces before they came to the bottom of the den.";
hnv[24] = "The king commanded, and they brought those men who had accused Daniyel, and they cast them into the den of lions, them, their children, and their wives; and the lions had the mastery of them, and broke all their bones in pieces, before they came to the bottom of the den.";
vul[24] = "Iubente autem rege, adducti sunt viri illi, qui accusaverant Danielem: et in lacum leonum missi sunt, ipsi, et filii, et uxores eorum: et non pervenerunt usque ad pavimentum laci, donec arriperent eos leones, et omnia ossa eorum comminuerunt.";
kjv[25] = "Then king Darius wrote unto all people, nations, and languages, that dwell in all the earth; Peace be multiplied unto you.";
rsv[25] = "Then King Darius wrote to all the peoples, nations, and languages that dwell in all the earth: &quot;Peace be multiplied to you.";
asv[25] = "Then king Darius wrote unto all the peoples, nations, and languages, that dwell in all the earth: Peace be multiplied unto you.";
yng[25] = "Then Darius the king hath written to all the peoples, nations, and languages, who are dwelling in all the land: `Your peace be great!";
dby[25] = "Then king Darius wrote unto all peoples, nations, and languages, that dwell in all the earth: Peace be multiplied unto you.";
web[25] = "Then king Darius wrote to all people, nations, and languages, that dwell in all the earth; Peace be multiplied to you.";
hnv[25] = "Then king Daryavesh wrote to all the peoples, nations, and languages, who dwell in all the eretz: Shalom be multiplied to you.";
vul[25] = "Tunc Darius rex scripsit universis populis, tribubus, et linguis habitantibus in universa terra: PAX vobis multiplicetur.";
kjv[26] = "I make a decree, That in every dominion of my kingdom men tremble and fear before the God of Daniel: for he [is] the living God, and stedfast for ever, and his kingdom [that] which shall not be destroyed, and his dominion [shall be even] unto the end.";
rsv[26] = "I make a decree, that in all my royal dominion men tremble and fear before the God of Daniel, for he is the living God, enduring for ever; his kingdom shall never be destroyed, and his dominion shall be to the end.";
asv[26] = "I make a decree, that in all the dominion of my kingdom men tremble and fear before the God of Daniel; for he is the living God, and stedfast for ever, And his kingdom that which shall not be destroyed; and his dominion shall be even unto the end.";
yng[26] = "From before me is made a decree, that in every dominion of my kingdom they are trembling and fearing before the God of Daniel, for He [is] the living God, and abiding to the ages, and His kingdom that which [is] not destroyed, and His dominion [is] unto the end.";
dby[26] = "I make a decree, That in every dominion of my kingdom men tremble and fear before the God of Daniel; for he is the living God, and steadfast for ever, and his kingdom [that] which shall not be destroyed, and his dominion shall be even unto the end.";
web[26] = "I make a decree, That in every dominion of my kingdom men tremble and fear before the God of Daniel: for he [is] the living God, and steadfast for ever, and his kingdom [that] which shall not be destroyed, and his dominion [shall be even] to the end.";
hnv[26] = "I make a decree, that in all the dominion of my kingdom men tremble and fear before the God of Daniyel; for he is the living God, and steadfast forever, His kingdom that which shall not be destroyed; and his dominion shall be even to the end.";
vul[26] = "A me constitutum est decretum, ut in universo imperio, et regno meo tremiscant, et paveant Deum Danielis. ipse est enim Deus vivens, et aeternus in saecula: et regnum eius non dissipabitur, et potestas eius usque in aeternum.";
kjv[27] = "He delivereth and rescueth, and he worketh signs and wonders in heaven and in earth, who hath delivered Daniel from the power of the lions.";
rsv[27] = "He delivers and rescues, he works signs and wonders in heaven and on earth, he who has saved Daniel from the power of the lions.&quot;";
asv[27] = "He delivereth and rescueth, and he worketh signs and wonders in heaven and in earth, who hath delivered Daniel from the power of the lions.";
yng[27] = "A deliverer, and rescuer, and doer of signs and wonders in the heavens and in earth [is] He who hath delivered Daniel from the paw of the lions.\'";
dby[27] = "He saveth and delivereth, and he worketh signs and wonders in the heavens and on the earth: who hath saved Daniel from the power of the lions.";
web[27] = "He delivereth and rescueth, and he worketh signs and wonders in heaven and on earth, who hath delivered Daniel from the power of the lions.";
hnv[27] = "He delivers and rescues, and he works signs and wonders in heaven and in eretz, who has delivered Daniyel from the power of the lions.";
vul[27] = "Ipse liberator, atque salvator, faciens signa, et mirabilia in caelo, et in terra: qui liberavit Danielem de lacu leonum.";
kjv[28] = "So this Daniel prospered in the reign of Darius, and in the reign of Cyrus the Persian.";
rsv[28] = "So this Daniel prospered during the reign of Darius and the reign of Cyrus the Persian.";
asv[28] = "So this Daniel prospered in the reign of Darius, and in the reign of Cyrus the Persian.";
yng[28] = "And this Daniel hath prospered in the reign of Darius, and in the reign of Cyrus the Persian.";
dby[28] = "And this Daniel prospered in the reign of Darius, and in the reign of Cyrus the Persian.";
web[28] = "So this Daniel prospered in the reign of Darius, and in the reign of Cyrus the Persian.";
hnv[28] = "So this Daniyel prospered in the reign of Daryavesh, and in the reign of Koresh the Parsian.";
vul[28] = "(i) Porro Daniel perseveravit usque ad regnum Darii, regnumque Cyri Persae.";
