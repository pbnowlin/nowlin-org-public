csb[1] = "In the second year of his reign, Nebuchadnezzar had dreams that troubled him, and sleep deserted him.";
csb[2] = "So the king gave orders to summon the magicians, mediums, sorcerers, and Chaldeans to tell the king his dreams. When they came and stood before the king,";
csb[3] = "he said to them, &quot;I have had a dream and am anxious to understand it.&quot;";
csb[4] = "The Chaldeans spoke to the king (Aramaic begins here): &quot;May the king live forever. Tell your servants the dream, and we will give the interpretation.&quot;";
csb[5] = "The king replied to the Chaldeans, &quot;My word is final: If you don\'t tell me the dream and its interpretation, you will be torn limb from limb, and your houses will be made a garbage dump.";
csb[6] = "&quot;But if you make the dream and its interpretation known to me, you\'ll receive gifts, a reward, and great honor from me. So make the dream and its interpretation known to me.&quot;";
csb[7] = "They answered a second time, &quot;May the king tell the dream to his servants, and we will make known the interpretation.&quot;";
csb[8] = "The king replied, &quot;I know for certain you are trying to gain some time, because you see that my word is final.";
csb[9] = "&quot;If you don\'t tell me the dream, there is one decree for you. You have conspired to tell me something false or fraudulent until the situation changes. So tell me the dream and I will know you can give me its interpretation.&quot;";
csb[10] = "The Chaldeans answered the king, &quot;No one on earth can make known what the king requests. Consequently, no king, however great and powerful, has ever asked anything like this of any magician, medium, or Chaldean.";
csb[11] = "&quot;What the king is asking is so difficult that no one can make it known to him except the gods, whose dwelling is not with mortals.&quot;";
csb[12] = "Because of this, the king became violently angry and gave orders to destroy all the wise men of Babylon.";
csb[13] = "The decree was issued that the wise men were to be executed, and they searched for Daniel and his friends, to execute them.";
csb[14] = "Then Daniel responded with tact and discretion to Arioch, the captain of the king\'s guard, who had gone out to execute the wise men of Babylon.";
csb[15] = "He asked Arioch, the king\'s officer, &quot;Why is the decree from the king so harsh? &quot; Then Arioch explained the situation to Daniel.";
csb[16] = "So Daniel went and asked the king to give him some time, so that he could give the king the interpretation.";
csb[17] = "Then Daniel went to his house and told his friends Hananiah, Mishael, and Azariah about the matter,";
csb[18] = "urging them to ask the God of the heavens for mercy concerning this mystery, so Daniel and his friends would not be destroyed with the rest of Babylon\'s wise men.";
csb[19] = "The mystery was then revealed to Daniel in a vision at night, and Daniel praised the God of the heavens";
csb[20] = "and declared: May the name of God be praised forever and ever, for wisdom and power belong to him.";
csb[21] = "He changes the times and seasons; he removes kings and establishes kings. He gives wisdom to the wise and knowledge to those who have understanding.";
csb[22] = "He reveals the deep and hidden things; he knows what is in the darkness, and light dwells with him.";
csb[23] = "I offer thanks and praise to you, God of my fathers, because you have given me wisdom and power. And now you have let me know what we asked of you, for you have let us know the king\'s mystery.";
csb[24] = "Therefore Daniel went to Arioch, whom the king had assigned to destroy the wise men of Babylon. He came and said to him, &quot;Don\'t destroy the wise men of Babylon! Bring me before the king, and I will give him the interpretation.&quot;";
csb[25] = "Then Arioch quickly brought Daniel before the king and said to him, &quot;I have found a man among the Judean exiles who can let the king know the interpretation.&quot;";
csb[26] = "The king said in reply to Daniel, whose name was Belteshazzar, &quot;Are you able to tell me the dream I had and its interpretation? &quot;";
csb[27] = "Daniel answered the king: &quot;No wise man, medium, magician, or diviner is able to make known to the king the mystery he asked about.";
csb[28] = "&quot;But there is a God in heaven who reveals mysteries, and he has let King Nebuchadnezzar know what will happen in the last days. Your dream and the visions that came into your mind as you lay in bed were these:";
csb[29] = "&quot;Your Majesty, while you were in your bed, thoughts came to your mind about what will happen in the future. The revealer of mysteries has let you know what will happen.";
csb[30] = "&quot;As for me, this mystery has been revealed to me, not because I have more wisdom than anyone living, but in order that the interpretation might be made known to the king, and that you may understand the thoughts of your mind.";
csb[31] = "&quot;Your Majesty, as you were watching, suddenly a colossal statue appeared. That statue, tall and dazzling, was standing in front of you, and its appearance was terrifying.";
csb[32] = "&quot;The head of the statue was pure gold, its chest and arms were silver, its stomach and thighs were bronze,";
csb[33] = "&quot;its legs were iron, and its feet were partly iron and partly fired clay.";
csb[34] = "&quot;As you were watching, a stone broke off without a hand touching it, struck the statue on its feet of iron and fired clay, and crushed them.";
csb[35] = "&quot;Then the iron, the fired clay, the bronze, the silver, and the gold were shattered and became like chaff from the summer threshing floors. The wind carried them away, and not a trace of them could be found. But the stone that struck the statue became a great mountain and filled the whole earth.";
csb[36] = "&quot;This was the dream; now we will tell the king its interpretation.";
csb[37] = "&quot;Your Majesty, you are king of kings. The God of the heavens has given you sovereignty, power, strength, and glory.";
csb[38] = "&quot;Wherever people live -- or wild animals, or birds of the sky -- he has handed them over to you and made you ruler over them all. You are the head of gold.";
csb[39] = "&quot;After you, there will arise another kingdom, inferior to yours, and then another, a third kingdom, of bronze, which will rule the whole earth.";
csb[40] = "&quot;A fourth kingdom will be as strong as iron; for iron crushes and shatters everything, and like iron that smashes, it will crush and smash all the others.";
csb[41] = "&quot;You saw the feet and toes, partly of a potter\'s fired clay and partly of iron -- it will be a divided kingdom, though some of the strength of iron will be in it. You saw the iron mixed with clay,";
csb[42] = "&quot;and that the toes of the feet were partly iron and partly fired clay -- part of the kingdom will be strong, and part will be brittle.";
csb[43] = "&quot;You saw the iron mixed with clay -- the peoples will mix with one another but will not hold together, just as iron does not mix with fired clay.";
csb[44] = "&quot;In the days of those kings, the God of the heavens will set up a kingdom that will never be destroyed, and this kingdom will not be left to another people. It will crush all these kingdoms and bring them to an end, but will itself endure forever.";
csb[45] = "&quot;You saw a stone break off from the mountain without a hand touching it, and it crushed the iron, bronze, fired clay, silver, and gold. The great God has told the king what will happen in the future. The dream is certain, and its interpretation reliable.&quot;";
csb[46] = "Then King Nebuchadnezzar fell facedown, worshiped Daniel, and gave orders to present an offering and incense to him.";
csb[47] = "The king said to Daniel, &quot;Your God is indeed God of gods, Lord of kings, and a revealer of mysteries, since you were able to reveal this mystery.&quot;";
csb[48] = "Then the king promoted Daniel and gave him many generous gifts. He made him ruler over the entire province of Babylon and chief governor over all the wise men of Babylon.";
csb[49] = "At Daniel\'s request, the king appointed Shadrach, Meshach, and Abednego to manage the province of Babylon. But Daniel remained at the king\'s court.";
kjv[1] = "And in the second year of the reign of Nebuchadnezzar Nebuchadnezzar dreamed dreams, wherewith his spirit was troubled, and his sleep brake from him.";
kjv[2] = "Then the king commanded to call the magicians, and the astrologers, and the sorcerers, and the Chaldeans, for to shew the king his dreams. So they came and stood before the king.";
kjv[3] = "And the king said unto them, I have dreamed a dream, and my spirit was troubled to know the dream.";
kjv[4] = "Then spake the Chaldeans to the king in Syriack, O king, live for ever: tell thy servants the dream, and we will shew the interpretation.";
kjv[5] = "The king answered and said to the Chaldeans, The thing is gone from me: if ye will not make known unto me the dream, with the interpretation thereof, ye shall be cut in pieces, and your houses shall be made a dunghill.";
kjv[6] = "But if ye shew the dream, and the interpretation thereof, ye shall receive of me gifts and rewards and great honour: therefore shew me the dream, and the interpretation thereof.";
kjv[7] = "They answered again and said, Let the king tell his servants the dream, and we will shew the interpretation of it.";
kjv[8] = "The king answered and said, I know of certainty that ye would gain the time, because ye see the thing is gone from me.";
kjv[9] = "But if ye will not make known unto me the dream, [there is but] one decree for you: for ye have prepared lying and corrupt words to speak before me, till the time be changed: therefore tell me the dream, and I shall know that ye can shew me the interpretation thereof.";
kjv[10] = "The Chaldeans answered before the king, and said, There is not a man upon the earth that can shew the king\'s matter: therefore [there is] no king, lord, nor ruler, [that] asked such things at any magician, or astrologer, or Chaldean.";
kjv[11] = "And [it is] a rare thing that the king requireth, and there is none other that can shew it before the king, except the gods, whose dwelling is not with flesh.";
kjv[12] = "For this cause the king was angry and very furious, and commanded to destroy all the wise [men] of Babylon.";
kjv[13] = "And the decree went forth that the wise [men] should be slain; and they sought Daniel and his fellows to be slain.";
kjv[14] = "Then Daniel answered with counsel and wisdom to Arioch the captain of the king\'s guard, which was gone forth to slay the wise [men] of Babylon:";
kjv[15] = "He answered and said to Arioch the king\'s captain, Why [is] the decree [so] hasty from the king? Then Arioch made the thing known to Daniel.";
kjv[16] = "Then Daniel went in, and desired of the king that he would give him time, and that he would shew the king the interpretation.";
kjv[17] = "Then Daniel went to his house, and made the thing known to Hananiah, Mishael, and Azariah, his companions:";
kjv[18] = "That they would desire mercies of the God of heaven concerning this secret; that Daniel and his fellows should not perish with the rest of the wise [men] of Babylon.";
kjv[19] = "Then was the secret revealed unto Daniel in a night vision. Then Daniel blessed the God of heaven.";
kjv[20] = "Daniel answered and said, Blessed be the name of God for ever and ever: for wisdom and might are his:";
kjv[21] = "And he changeth the times and the seasons: he removeth kings, and setteth up kings: he giveth wisdom unto the wise, and knowledge to them that know understanding:";
kjv[22] = "He revealeth the deep and secret things: he knoweth what [is] in the darkness, and the light dwelleth with him.";
kjv[23] = "I thank thee, and praise thee, O thou God of my fathers, who hast given me wisdom and might, and hast made known unto me now what we desired of thee: for thou hast [now] made known unto us the king\'s matter.";
kjv[24] = "Therefore Daniel went in unto Arioch, whom the king had ordained to destroy the wise [men] of Babylon: he went and said thus unto him; Destroy not the wise [men] of Babylon: bring me in before the king, and I will shew unto the king the interpretation.";
kjv[25] = "Then Arioch brought in Daniel before the king in haste, and said thus unto him, I have found a man of the captives of Judah, that will make known unto the king the interpretation.";
kjv[26] = "The king answered and said to Daniel, whose name [was] Belteshazzar, Art thou able to make known unto me the dream which I have seen, and the interpretation thereof?";
kjv[27] = "Daniel answered in the presence of the king, and said, The secret which the king hath demanded cannot the wise [men], the astrologers, the magicians, the soothsayers, shew unto the king;";
kjv[28] = "But there is a God in heaven that revealeth secrets, and maketh known to the king Nebuchadnezzar what shall be in the latter days. Thy dream, and the visions of thy head upon thy bed, are these;";
kjv[29] = "As for thee, O king, thy thoughts came [into thy mind] upon thy bed, what should come to pass hereafter: and he that revealeth secrets maketh known to thee what shall come to pass.";
kjv[30] = "But as for me, this secret is not revealed to me for [any] wisdom that I have more than any living, but for [their] sakes that shall make known the interpretation to the king, and that thou mightest know the thoughts of thy heart.";
kjv[31] = "Thou, O king, sawest, and behold a great image. This great image, whose brightness [was] excellent, stood before thee; and the form thereof [was] terrible.";
kjv[32] = "This image\'s head [was] of fine gold, his breast and his arms of silver, his belly and his thighs of brass,";
kjv[33] = "His legs of iron, his feet part of iron and part of clay.";
kjv[34] = "Thou sawest till that a stone was cut out without hands, which smote the image upon his feet [that were] of iron and clay, and brake them to pieces.";
kjv[35] = "Then was the iron, the clay, the brass, the silver, and the gold, broken to pieces together, and became like the chaff of the summer threshingfloors; and the wind carried them away, that no place was found for them: and the stone that smote the image became a great mountain, and filled the whole earth.";
kjv[36] = "This [is] the dream; and we will tell the interpretation thereof before the king.";
kjv[37] = "Thou, O king, [art] a king of kings: for the God of heaven hath given thee a kingdom, power, and strength, and glory.";
kjv[38] = "And wheresoever the children of men dwell, the beasts of the field and the fowls of the heaven hath he given into thine hand, and hath made thee ruler over them all. Thou [art] this head of gold.";
kjv[39] = "And after thee shall arise another kingdom inferior to thee, and another third kingdom of brass, which shall bear rule over all the earth.";
kjv[40] = "And the fourth kingdom shall be strong as iron: forasmuch as iron breaketh in pieces and subdueth all [things]: and as iron that breaketh all these, shall it break in pieces and bruise.";
kjv[41] = "And whereas thou sawest the feet and toes, part of potters\' clay, and part of iron, the kingdom shall be divided; but there shall be in it of the strength of the iron, forasmuch as thou sawest the iron mixed with miry clay.";
kjv[42] = "And [as] the toes of the feet [were] part of iron, and part of clay, [so] the kingdom shall be partly strong, and partly broken.";
kjv[43] = "And whereas thou sawest iron mixed with miry clay, they shall mingle themselves with the seed of men: but they shall not cleave one to another, even as iron is not mixed with clay.";
kjv[44] = "And in the days of these kings shall the God of heaven set up a kingdom, which shall never be destroyed: and the kingdom shall not be left to other people, [but] it shall break in pieces and consume all these kingdoms, and it shall stand for ever.";
kjv[45] = "Forasmuch as thou sawest that the stone was cut out of the mountain without hands, and that it brake in pieces the iron, the brass, the clay, the silver, and the gold; the great God hath made known to the king what shall come to pass hereafter: and the dream [is] certain, and the interpretation thereof sure.";
kjv[46] = "Then the king Nebuchadnezzar fell upon his face, and worshipped Daniel, and commanded that they should offer an oblation and sweet odours unto him.";
kjv[47] = "The king answered unto Daniel, and said, Of a truth [it is], that your God [is] a God of gods, and a Lord of kings, and a revealer of secrets, seeing thou couldest reveal this secret.";
kjv[48] = "Then the king made Daniel a great man, and gave him many great gifts, and made him ruler over the whole province of Babylon, and chief of the governors over all the wise [men] of Babylon.";
kjv[49] = "Then Daniel requested of the king, and he set Shadrach, Meshach, and Abednego, over the affairs of the province of Babylon: but Daniel [sat] in the gate of the king.";
rsv[1] = "In the second year of the reign of Nebuchadnez\'zar, Nebuchadnez\'zar had dreams; and his spirit was troubled, and his sleep left him.";
asv[1] = "And in the second year of the reign of Nebuchadnezzar, Nebuchadnezzar dreamed dreams; and his spirit was troubled, and his sleep went from him.";
yng[1] = "And in the second year of the reign of Nebuchadnezzar, dreamed hath Nebuchadnezzar dreams, and his spirit doth move itself, and his sleep hath been against him;";
dby[1] = "And in the second year of the reign of Nebuchadnezzar, Nebuchadnezzar dreamed dreams, and his spirit was troubled, and his sleep went from him.";
web[1] = "And in the second year of the reign of Nebuchadnezzar, Nebuchadnezzar dreamed dreams, with which his spirit was troubled, and his sleep broke from him.";
hnv[1] = "In the second year of the reign of Nevukhadnetztzar, Nevukhadnetztzar dreamed dreams; and his spirit was troubled, and his sleep went from him.";
vul[1] = "In anno secundo regni Nabuchodonosor vidit Nabuchodonosor somnium, et conterritus est spiritus eius, et somnium eius fugit ab eo.";
rsv[2] = "Then the king commanded that the magicians, the enchanters, the sorcerers, and the Chalde\'ans be summoned, to tell the king his dreams. So they came in and stood before the king.";
asv[2] = "Then the king commanded to call the magicians, and the enchanters, and the sorcerers, and the Chaldeans, to tell the king his dreams. So they came in and stood before the king.";
yng[2] = "and the king saith to call for scribes, and for enchanters, and for sorcerers, and for Chaldeans, to declare to the king his dreams. And they come in and stand before the king;";
dby[2] = "And the king commanded to call the scribes, and the magicians, and the sorcerers, and the Chaldeans, to shew the king his dreams; and they came and stood before the king.";
web[2] = "Then the king commanded to call the magicians, and the astrologers, and the sorcerers, and the Chaldeans, to show the king his dream. So they came and stood before the king.";
hnv[2] = "Then the king commanded to call the magicians, and the enchanters, and the sorcerers, and the Kasdim, to tell the king his dreams. So they came in and stood before the king.";
vul[2] = "Praecepit autem rex, ut convocarentur arioli, et magi, et malefici, et Chaldaei: ut indicarent regi somnia sua: qui cum venissent, steterunt coram rege.";
rsv[3] = "And the king said to them, &quot;I had a dream, and my spirit is troubled to know the dream.&quot;";
asv[3] = "And the king said unto them, I have dreamed a dream, and my spirit is troubled to know the dream.";
yng[3] = "and the king saith to them, `A dream I have dreamed, and moved is my spirit to know the dream.\'";
dby[3] = "And the king said unto them, I have dreamed a dream, and my spirit is troubled to know the dream.";
web[3] = "And the king said to them, I have dreamed a dream, and my spirit was troubled to know the dream.";
hnv[3] = "The king said to them, I have dreamed a dream, and my spirit is troubled to know the dream.";
vul[3] = "Et dixit ad eos rex: Vidi somnium: et mente confusus ignoro quid viderim.";
rsv[4] = "Then the Chalde\'ans said to the king, &quot;O king, live for ever! Tell your servants the dream, and we will show the interpretation.&quot;";
asv[4] = "Then spake the Chaldeans to the king in the Syrian language, O king, live for ever: tell thy servants the dream, and we will show the interpretation.";
yng[4] = "And the Chaldeans speak to the king [in] Aramaean, `O king, to the ages live, tell the dream to thy servants, and the interpretation we do shew.\'";
dby[4] = "And the Chaldeans spoke to the king in Aramaic, O king, live for ever! tell thy servants the dream, and we will shew the interpretation.";
web[4] = "Then the Chaldeans spoke to the king in Syriac, O king, live for ever: tell thy servants the dream, and we will show the interpretation.";
hnv[4] = "Then spoke the Kasdim to the king in the Arammian language, O king, live forever: tell your servants the dream, and we will show the interpretation.";
vul[4] = "Responderuntque Chaldaei regi Syriace: Rex in sempiternum vive: dic somnium servis tuis, et interpretationem eius indicabimus.";
rsv[5] = "The king answered the Chalde\'ans, &quot;The word from me is sure: if you do not make known to me the dream and its interpretation, you shall be torn limb from limb, and your houses shall be laid in ruins.";
asv[5] = "The king answered and said to the Chaldeans, The thing is gone from me: if ye make not known unto me the dream and the interpretation thereof, ye shall be cut in pieces, and your houses shall be made a dunghill.";
yng[5] = "The king hath answered and said to the Chaldeans, `The thing from me is gone; if ye do not cause me to know the dream and its interpretation, pieces ye are made, and your houses are made dunghills;";
dby[5] = "The king answered and said to the Chaldeans, The command is gone forth from me: If ye do not make known unto me the dream, and its interpretation, ye shall be cut in pieces, and your houses shall be made a dunghill.";
web[5] = "The king answered and said to the Chaldeans, The thing is gone from me: if ye will not make known to me the dream, with the interpretation of it, ye shall be cut in pieces, and your houses shall be made a dunghill.";
hnv[5] = "The king answered the Kasdim, The thing is gone from me: if you don\'t make known to me the dream and the interpretation of it, you shall be cut in pieces, and your houses shall be made a dunghill.";
vul[5] = "Et respondens rex ait Chaldaeis: Sermo recessit a me: nisi indicaveritis mihi somnium, et coniecturam eius, peribitis vos, et domus vestrae publicabuntur.";
rsv[6] = "But if you show the dream and its interpretation, you shall receive from me gifts and rewards and great honor. Therefore show me the dream and its interpretation.&quot;";
asv[6] = "But if ye show the dream and the interpretation thereof, ye shall receive of me gifts and rewards and great honor: therefore show me the dream and the interpretation thereof.";
yng[6] = "and if the dream and its interpretation ye do shew, gifts, and fee, and great glory ye receive from before me, therefore the dream and its interpretation shew ye me.\'";
dby[6] = "But if ye shew the dream and its interpretation, ye shall receive of me gifts and rewards and great honour; therefore shew me the dream and its interpretation.";
web[6] = "But if ye shall show the dream, and the interpretation of it, ye shall receive of me gifts and rewards and great honor: therefore show me the dream, and the interpretation of it.";
hnv[6] = "But if you show the dream and the interpretation of it, you shall receive of me gifts and rewards and great honor: therefore show me the dream and the interpretation of it.";
vul[6] = "Si autem somnium, et coniecturam eius narraveritis, praemia, et dona, et honorem multum accipietis a me: somnium igitur, et interpretationem eius indicate mihi.";
rsv[7] = "They answered a second time, &quot;Let the king tell his servants the dream, and we will show its interpretation.&quot;";
asv[7] = "They answered the second time and said, Let the king tell his servants the dream, and we will show the interpretation.";
yng[7] = "They have answered a second time, and are saying, `Let the king tell the dream to his servants, and the interpretation we do shew.";
dby[7] = "They answered the second time and said, Let the king tell his servants the dream, and we will shew the interpretation.";
web[7] = "They answered again and said, Let the king tell his servants the dream, and we will show the interpretation of it.";
hnv[7] = "They answered the second time and said, Let the king tell his servants the dream, and we will show the interpretation.";
vul[7] = "Responderunt secundo, atque dixerunt: Rex somnium dicat servis suis, et interpretationem illius indicabimus.";
rsv[8] = "The king answered, &quot;I know with certainty that you are trying to gain time, because you see that the word from me is sure";
asv[8] = "The king answered and said, I know of a certainty that ye would gain time, because ye see the thing is gone from me.";
yng[8] = "The king hath answered and said, `Of a truth I know that time ye are gaining, because that ye have seen that the thing is gone from me,";
dby[8] = "The king answered and said, I know of a certainty that ye would gain time, because ye see the word is gone forth from me;";
web[8] = "The king answered and said, I know of certainty that ye would gain the time, because ye see the thing is gone from me.";
hnv[8] = "The king answered, I know of a certainty that you would gain time, because you see the thing is gone from me.";
vul[8] = "Respondit rex, et ait: Certe novi quod tempus redimitis, scientes quod recesserit a me sermo.";
rsv[9] = "that if you do not make the dream known to me, there is but one sentence for you. You have agreed to speak lying and corrupt words before me till the times change. Therefore tell me the dream, and I shall know that you can show me its interpretation.&quot;";
asv[9] = "But if ye make not known unto me the dream, there is but one law for you; for ye have prepared lying and corrupt words to speak before me, till the time be changed: therefore tell me the dream, and I shall know that ye can show me the interpretation thereof.";
yng[9] = "[so] that, if the dream ye do not cause me to know -- one is your sentence, seeing a word lying and corrupt ye have prepared to speak before me, till that the time is changed, therefore the dream tell ye to me, then do I know that its interpretation ye do shew me.\'";
dby[9] = "but if ye do not make known unto me the dream, there is but one decree for you; for ye have prepared lying and corrupt words to speak before me, till the time be changed: therefore tell me the dream, and I shall know that ye can shew me its interpretation.";
web[9] = "But if ye will not make known to me the dream, [there is but] one decree for you: for ye have prepared lying and corrupt words to speak before me, till the time be changed: therefore tell me the dream, and I shall know that ye can show me the interpretation of it.";
hnv[9] = "But if you don\'t make known to me the dream, there is but one law for you; for you have prepared lying and corrupt words to speak before me, until the time be changed: therefore tell me the dream, and I shall know that you can show me the interpretation of it.";
vul[9] = "Si ergo somnium non indicaveritis mihi, una est de vobis sententia, quod interpretationem quoque fallacem, et deceptione plenam composueritis, ut loquamini mihi donec tempus pertranseat. Somnium itaque dicite mihi, ut sciam quod interpretationem quoque eius veram loquamini.";
rsv[10] = "The Chalde\'ans answered the king, &quot;There is not a man on earth who can meet the king\'s demand; for no great and powerful king has asked such a thing of any magician or enchanter or Chalde\'an.";
asv[10] = "The Chaldeans answered before the king, and said, There is not a man upon the earth that can show the king\'s matter, forasmuch as no king, lord, or ruler, hath asked such a thing of any magician, or enchanter, or Chaldean.";
yng[10] = "The Chaldeans have answered before the king, and are saying, `There is not a man on the earth who is able to shew the king\'s matter; therefore, no king, chief, and ruler, hath asked such a thing as this of any scribe, and enchanter, and Chaldean;";
dby[10] = "The Chaldeans answered before the king and said, There is not a man upon the earth that can shew the king\'s matter; therefore there is no king, however great and powerful, that hath asked such a thing of any scribe, or magician, or Chaldean.";
web[10] = "The Chaldeans answered before the king, and said, There is not a man upon the earth that can show the king\'s matter: therefore [there is] no king, lord, nor ruler, [that] hath asked such things of any magician, or astrologer, or Chaldean.";
hnv[10] = "The Kasdim answered before the king, and said, There is not a man on the eretz who can show the king\'s matter, because no king, lord, or ruler, has asked such a thing of any magician, or enchanter, or Kasdai.";
vul[10] = "Respondentes ergo Chaldaei coram rege, dixerunt: Non est homo super terram, qui sermonem tuum, rex, possit implere: sed neque regum quisquam magnus et potens verbum huiuscemodi sciscitatur ab omni ariolo, et mago, et Chaldaeo.";
rsv[11] = "The thing that the king asks is difficult, and none can show it to the king except the gods, whose dwelling is not with flesh.&quot;";
asv[11] = "And it is a rare thing that the king requireth, and there is no other that can show it before the king, except the gods, whose dwelling is not with flesh.";
yng[11] = "and the thing that the king is asking [is] precious, and others are there not that do shew it before the king, save the gods, whose dwelling is not with flesh.\'";
dby[11] = "For the thing that the king demandeth is extraordinary, and there is none other that can shew it before the king, except the gods, whose dwelling is not with flesh.";
web[11] = "And [it is] a rare thing that the king requireth, and there is no other that can show it before the king, except the gods, whose dwelling is not with flesh.";
hnv[11] = "It is a rare thing that the king requires, and there is no other who can show it before the king, except the gods, whose dwelling is not with flesh.";
vul[11] = "Sermo enim, quem tu quaeris, rex, gravis est: nec reperietur quisquam, qui indicet illum in conspectu regis: exceptis diis, quorum non est cum hominibus conversatio.";
rsv[12] = "Because of this the king was angry and very furious, and commanded that all the wise men of Babylon be destroyed.";
asv[12] = "For this cause the king was angry and very furious, and commanded to destroy all the wise men of Babylon.";
yng[12] = "Therefore the king hath been angry and very wroth, and hath said to destroy all the wise men of Babylon;";
dby[12] = "For this cause the king was irritated and very wroth, and commanded to destroy all the wise men of Babylon.";
web[12] = "For this cause the king was angry and very furious, and commanded to destroy all the wise [men] of Babylon.";
hnv[12] = "For this cause the king was angry and very furious, and commanded to destroy all the wise men of Bavel.";
vul[12] = "Quo audito, rex in furore, et in ira magna praecepit ut perirent omnes sapientes Babylonis.";
rsv[13] = "So the decree went forth that the wise men were to be slain, and they sought Daniel and his companions, to slay them.";
asv[13] = "So the decree went forth, and the wise men were to be slain; and they sought Daniel and his companions to be slain.";
yng[13] = "And the sentence hath gone forth, and the wise men are being slain, and they have sought Daniel and his companions to be slain.";
dby[13] = "And the decree went forth that the wise men were to be slain; and they sought Daniel and his companions to slay them.";
web[13] = "And the decree went forth that the wise [men] should be slain; and they sought Daniel and his fellows to be slain.";
hnv[13] = "So the decree went forth, and the wise men were to be slain; and they sought Daniyel and his companions to be slain.";
vul[13] = "Et egressa sententia, sapientes interficiebantur: quaerebanturque Daniel, et socii eius, ut perirent.";
rsv[14] = "Then Daniel replied with prudence and discretion to Ar\'i-och, the captain of the king\'s guard, who had gone out to slay the wise men of Babylon;";
asv[14] = "Then Daniel returned answer with counsel and prudence to Arioch the captain of the king\'s guard, who was gone forth to slay the wise men of Babylon;";
yng[14] = "Then Daniel hath replied [with] counsel and discretion to Arioch chief of the executioners of the king, who hath gone forth to slay the wise men of Babylon.";
dby[14] = "Then Daniel answered with counsel and prudence to Arioch the chief of the king\'s bodyguard, who had gone forth to slay the wise men of Babylon:";
web[14] = "Then Daniel answered with counsel and wisdom to Arioch the captain of the king\'s guard, who had gone forth to slay the wise [men] of Babylon:";
hnv[14] = "Then Daniyel returned answer with counsel and prudence to Aryokh the captain of the king\'s guard, who was gone forth to kill the wise men of Bavel;";
vul[14] = "Tunc Daniel requisivit de lege, atque sententia ab Arioch principe militiae regis, qui egressus fuerat ad interficiendos sapientes Babylonis.";
rsv[15] = "he said to Ar\'i-och, the king\'s captain, &quot;Why is the decree of the king so severe?&quot; Then Ar\'i-och made the matter known to Daniel.";
asv[15] = "he answered and said to Arioch the king\'s captain, Wherefore is the decree so urgent from the king? Then Arioch made the thing known to Daniel.";
yng[15] = "He hath answered and said to Arioch the king\'s captain, `Wherefore [is] the sentence so urgent from before the king?\' Then Arioch hath made the thing known to Daniel,";
dby[15] = "he answered and said to Arioch the king\'s captain, Why is the decree so rigorous from the king? Then Arioch made the thing known to Daniel.";
web[15] = "He answered and said to Arioch the king\'s captain, Why [is] the decree [so] hasty from the king? Then Arioch made the thing known to Daniel.";
hnv[15] = "he answered Aryokh the king\'s captain, Why is the decree so urgent from the king? Then Aryokh made the thing known to Daniyel.";
vul[15] = "Et interrogavit eum, qui a rege potestatem acceperat, quam ob causam tam crudelis sententia a facie regis esset egressa. Cum ergo rem indicasset Arioch Danieli,";
rsv[16] = "And Daniel went in and besought the king to appoint him a time, that he might show to the king the interpretation.";
asv[16] = "And Daniel went in, and desired of the king that he would appoint him a time, and he would show the king the interpretation.";
yng[16] = "and Daniel hath gone up, and sought of the king that he would give him time to shew the interpretation to the king.";
dby[16] = "And Daniel went in, and requested of the king that he would give him time, that he might shew the king the interpretation.";
web[16] = "Then Daniel went in, and desired of the king that he would give him time, and that he would show the king the interpretation.";
hnv[16] = "Daniyel went in, and desired of the king that he would appoint him a time, and he would show the king the interpretation.";
vul[16] = "Daniel ingressus rogavit regem ut tempus daret sibi ad solutionem indicandam regi.";
rsv[17] = "Then Daniel went to his house and made the matter known to Hanani\'ah, Mish\'a-el, and Azari\'ah, his companions,";
asv[17] = "Then Daniel went to his house, and made the thing known to Hananiah, Mishael, and Azariah, his companions:";
yng[17] = "Then Daniel to his house hath gone, and to Hananiah, Mishael, and Azariah, his companions, he hath made the thing known,";
dby[17] = "Then Daniel went to his house, and made the thing known to Hananiah, Mishael, and Azariah, his companions;";
web[17] = "Then Daniel went to his house, and made the thing known to Hananiah, Mishael, and Azariah, his companions:";
hnv[17] = "Then Daniyel went to his house, and made the thing known to Hananyah, Misha\'el, and `Azaryah, his companions:";
vul[17] = "Et ingressus est domum suam, Ananiaeque et Misaeli, et Azariae sociis suis indicavit negotium:";
rsv[18] = "and told them to seek mercy of the God of heaven concerning this mystery, so that Daniel and his companions might not perish with the rest of the wise men of Babylon.";
asv[18] = "that they would desire mercies of the God of heaven concerning this secret; that Daniel and his companions should not perish with the rest of the wise men of Babylon.";
yng[18] = "and to seek mercies from before the God of the heavens concerning this secret, that they destroy not Daniel and his companions with the rest of the wise men of Babylon.";
dby[18] = "that they would desire mercies of the God of the heavens concerning this secret; that Daniel and his companions should not perish with the rest of the wise men of Babylon.";
web[18] = "That they would desire mercies of the God of heaven concerning this secret; that Daniel and his companions should not perish with the rest of the wise [men] of Babylon.";
hnv[18] = "that they would desire mercies of the God of heaven concerning this secret; that Daniyel and his companions should nor perish with the rest of the wise men of Bavel.";
vul[18] = "ut quaererent misericordiam a facie Dei caeli super sacramento isto, et non perirent Daniel, et socii eius cum ceteris sapientibus Babylonis.";
rsv[19] = "Then the mystery was revealed to Daniel in a vision of the night. Then Daniel blessed the God of heaven.";
asv[19] = "Then was the secret revealed unto Daniel in a vision of the night. Then Daniel blessed the God of heaven.";
yng[19] = "Then to Daniel, in a vision of the night, the secret hath been revealed. Then hath Daniel blessed the God of the heavens.";
dby[19] = "Then was the secret revealed unto Daniel in a night vision. Then Daniel blessed the God of the heavens.";
web[19] = "Then was the secret revealed to Daniel in a night vision. Then Daniel blessed the God of heaven.";
hnv[19] = "Then was the secret revealed to Daniyel in a vision of the night. Then Daniyel blessed the God of heaven.";
vul[19] = "Tunc Danieli mysterium per visionem nocte revelatum est: et benedixit Daniel Deum caeli,";
rsv[20] = "Daniel said: &quot;Blessed be the name of God for ever and ever. to whom belong wisdom and might.";
asv[20] = "Daniel answered and said, Blessed be the name of God for ever and ever; for wisdom and might are his.";
yng[20] = "Daniel hath answered and said, `Let the name of God be blessed from age even unto age, for wisdom and might -- for they are His.";
dby[20] = "Daniel answered and said, Blessed be the name of God for ever and ever; For wisdom and might are his.";
web[20] = "Daniel answered and said, Blessed be the name of God for ever and ever: for wisdom and might are his:";
hnv[20] = " Daniyel answered, Blessed be the name of God forever and ever; for wisdom and might are his.";
vul[20] = "et locutus ait: Sit nomen Domini benedictum a saeculo et usque in saeculum: quia sapientia et fortitudo eius sunt.";
rsv[21] = "He changes times and seasons; he removes kings and sets up kings; he gives wisdom to the wise and knowledge to those who have understanding;";
asv[21] = "And he changeth the times and the seasons; he removeth kings, and setteth up kings; he giveth wisdom unto the wise, and knowledge to them that have understanding;";
yng[21] = "And He is changing times and seasons, He is causing kings to pass away, and He is raising up kings; He is giving wisdom to the wise, and knowledge to those possessing understanding.";
dby[21] = "And it is he that changeth times and seasons; He deposeth kings, and setteth up kings; He giveth wisdom to the wise, And knowledge to them that know understanding.";
web[21] = "And he changeth the times and the seasons; he removeth kings, and setteth up kings; he giveth wisdom to the wise, and knowledge to them that know understanding:";
hnv[21] = "He changes the times and the seasons; he removes kings, and sets up kings; he gives wisdom to the wise, and knowledge to those who have understanding;";
vul[21] = "Et ipse mutat tempora, et aetates: transfert regna, atque constituit: dat sapientiam sapientibus, et scientiam intelligentibus disciplinam:";
rsv[22] = "he reveals deep and mysterious things; he knows what is in the darkness, and the light dwells with him.";
asv[22] = "he revealeth the deep and secret things; he knoweth what is in the darkness, and the light dwelleth with him.";
yng[22] = "He is revealing deep and hidden things; He hath known what [is] in darkness, and light with Him hath dwelt.";
dby[22] = "It is he that revealeth the deep and secret things; He knoweth what is in the darkness, and the light dwelleth with him.";
web[22] = "He revealeth the deep and secret things: he knoweth what [is] in the darkness, and the light dwelleth with him.";
hnv[22] = "he reveals the deep and secret things; he knows what is in the darkness, and the light dwells with him.";
vul[22] = "Ipse revelat profunda, et abscondita, et novit in tenebris constituta: et lux cum eo est.";
rsv[23] = "To thee, O God of my fathers, I give thanks and praise, for thou hast given me wisdom and strength, and hast now made known to me what we asked of thee, for thou hast made known to us the king\'s matter.&quot;";
asv[23] = "I thank thee, and praise thee, O thou God of my fathers, who hast given me wisdom and might, and hast now made known unto me what we desired of thee; for thou hast made known unto us the king\'s matter.";
yng[23] = "Thee, O God of my fathers, I am thanking and praising, for wisdom and might Thou hast given to me; and now, Thou hast caused me to know that which we have sought from Thee, for the king\'s matter Thou hast caused us to know.\'";
dby[23] = "I thank thee, and I praise thee, O God of my fathers, Who hast given me wisdom and might, And hast made known unto me already what we desired of thee; For thou hast made known unto us the king\'s matter.";
web[23] = "I thank thee, and praise thee, O thou God of my fathers, who hast given me wisdom and might, and hast made known to me now what we desired of thee: for thou hast [now] made known to us the king\'s matter.";
hnv[23] = "I thank you, and praise you, you God of my fathers, who have given me wisdom and might, and have now made known to me what we desired of you; for you have made known to us the king\'s matter.";
vul[23] = "Tibi Deus patrum nostrorum confiteor, teque laudo: quia sapientiam, et fortitudinem dedisti mihi: et nunc ostendisti mihi quae rogavimus te, quia sermonem regis aperuisti nobis.";
rsv[24] = "Therefore Daniel went in to Ar\'i-och, whom the king had appointed to destroy the wise men of Babylon; he went and said thus to him, &quot;Do not destroy the wise men of Babylon; bring me in before the king, and I will show the king the interpretation.&quot;";
asv[24] = "Therefore Daniel went in unto Arioch, whom the king had appointed to destroy the wise men of Babylon; he went and said thus unto him: Destroy not the wise men of Babylon; bring me in before the king, and I will show unto the king the interpretation.";
yng[24] = "Therefore Daniel hath gone up unto Arioch, whom the king hath appointed to destroy the wise men of Babylon; he hath gone, and thus hath said to him, `The wise men of Babylon thou dost not destroy, bring me up before the king, and the interpretation to the king I do shew.\'";
dby[24] = "Therefore Daniel went in unto Arioch, whom the king had appointed to destroy the wise men of Babylon; he went and said thus unto him: Destroy not the wise men of Babylon; bring me in before the king, and I will shew unto the king the interpretation.";
web[24] = "Therefore Daniel went into Arioch, whom the king had ordained to destroy the wise [men] of Babylon: he went and said thus to him; Destroy not the wise [men] of Babylon: bring me in before the king, and I will show to the king the interpretation.";
hnv[24] = "Therefore Daniyel went in to Aryokh, whom the king had appointed to destroy the wise men of Bavel; he went and said thus to him: Don\'t destroy the wise men of Bavel; bring me in before the king, and I will show to the king the interpretation.";
vul[24] = "Post haec Daniel ingressus ad Arioch, quem constituerat rex ut perderet sapientes Babylonis, sic ei locutus est: Sapientes Babylonis ne perdas: introduc me in conspectu regis, et solutionem regi narrabo.";
rsv[25] = "Then Ar\'i-och brought in Daniel before the king in haste, and said thus to him: &quot;I have found among the exiles from Judah a man who can make known to the king the interpretation.&quot;";
asv[25] = "Then Arioch brought in Daniel before the king in haste, and said thus unto him, I have found a man of the children of the captivity of Judah, that will make known unto the king the interpretation.";
yng[25] = "Then Arioch in haste hath brought up Daniel before the king, and thus hath said to him -- `I have found a man of the sons of the Removed of Judah, who the interpretation to the king doth make known.\'";
dby[25] = "Then Arioch brought in Daniel before the king in haste, and said thus unto him: I have found a man of the sons of the captivity of Judah that will make known unto the king the interpretation.";
web[25] = "Then Arioch brought in Daniel before the king in haste, and said thus to him, I have found a man of the captives of Judah, that will make known to the king the interpretation.";
hnv[25] = "Then Aryokh brought in Daniyel before the king in haste, and said thus to him, I have found a man of the children of the captivity of Yehudah, who will make known to the king the interpretation.";
vul[25] = "Tunc Arioch festinus introduxit Danielem ad regem, et dixit ei: Inveni hominem de filiis transmigrationis Iuda, qui solutionem regi annunciet.";
rsv[26] = "The king said to Daniel, whose name was Belteshaz\'zar, &quot;Are you able to make known to me the dream that I have seen and its interpretation?&quot;";
asv[26] = "The king answered and said to Daniel, whose name was Belteshazzar, Art thou able to make known unto me the dream which I have seen, and the interpretation thereof?";
yng[26] = "The king hath answered and said to Daniel, whose name [is] Belteshazzar, `Art thou able to cause me to know the dream that I have seen, and its interpretation?\'";
dby[26] = "The king answered and said unto Daniel, whose name was Belteshazzar, Art thou able to make known unto me the dream that I have seen, and its interpretation?";
web[26] = "The king answered and said to Daniel, whose name [was] Belteshazzar, Art thou able to make known to me the dream which I have seen, and the interpretation of it?";
hnv[26] = "The king answered Daniyel, whose name was Belteshatztzar, Are you able to make known to me the dream which I have seen, and the interpretation of it?";
vul[26] = "Respondit rex, et dixit Danieli, cuius nomen erat Baltassar: Putasne vere potes mihi indicare somnium, quod vidi, et interpretationem eius?";
rsv[27] = "Daniel answered the king, &quot;No wise men, enchanters, magicians, or astrologers can show to the king the mystery which the king has asked,";
asv[27] = "Daniel answered before the king, and said, The secret which the king hath demanded can neither wise men, enchanters, magicians, nor soothsayers, show unto the king;";
yng[27] = "Daniel hath answered before the king and said, `The secret that the king is asking, the wise men, the enchanters, the scribes, the soothsayers, are not able to shew to the king;";
dby[27] = "Daniel answered in the presence of the king and said, The secret that the king hath demanded cannot the wise men, the magicians, the scribes, the astrologers, shew unto the king;";
web[27] = "Daniel answered in the presence of the king, and said, The secret which the king hath demanded, the wise [men], the astrologers, the magicians, the sooth-sayers, cannot show to the king;";
hnv[27] = " Daniyel answered before the king, and said, The secret which the king has demanded can neither wise men, enchanters, magicians, nor soothsayers, show to the king;";
vul[27] = "Et respondens Daniel coram rege, ait: Mysterium, quod rex interrogat, sapientes, magi, arioli, et aruspices nequeunt indicare regi:";
rsv[28] = "but there is a God in heaven who reveals mysteries, and he has made known to King Nebuchadnez\'zar what will be in the latter days. Your dream and the visions of your head as you lay in bed are these:";
asv[28] = "but there is a God in heaven that revealeth secrets, and he hath made known to the king Nebuchadnezzar what shall be in the latter days. Thy dream, and the visions of thy head upon thy bed, are these:";
yng[28] = "but there is a God in the heavens, a revealer of secrets, and He hath made known to king Nebuchadnezzar that which [is] to be in the latter end of the days. `Thy dream and the visions of thy head on thy bed are these:";
dby[28] = "but there is a God in the heavens, who revealeth secrets, and maketh known to king Nebuchadnezzar what shall be at the end of days. Thy dream, and the visions of thy head upon thy bed are these:";
web[28] = "But there is a God in heaven that revealeth secrets, and maketh known to the king Nebuchadnezzar what shall be in the latter days. Thy dream, and the visions of thy head upon thy bed, are these;";
hnv[28] = "but there is a God in heaven who reveals secrets, and he has made known to the king Nevukhadnetztzar what shall be in the latter days. Your dream, and the visions of your head on your bed, are these:";
vul[28] = "Sed est Deus in caelo revelans mysteria, qui indicavit tibi rex Nabuchodonosor, quae ventura sunt in novissimis temporibus. Somnium tuum, et visiones capitis tui in cubili tuo huiuscemodi sunt:";
rsv[29] = "To you, O king, as you lay in bed came thoughts of what would be hereafter, and he who reveals mysteries made known to you what is to be.";
asv[29] = "as for thee, O king, thy thoughts came [into thy mind] upon thy bed, what should come to pass hereafter; and he that revealeth secrets hath made known to thee what shall come to pass.";
yng[29] = "Thou, O king, thy thoughts on thy bed have come up [concerning] that which [is] to be after this, and the Revealer of secrets hath caused thee to know that which [is] to be.";
dby[29] = "-- as for thee, O king, thy thoughts arose upon thy bed, what should come to pass hereafter; and he that revealeth secrets hath made known to thee what shall come to pass.";
web[29] = "As for thee, O king, thy thoughts came [into thy mind] upon thy bed, what should come to pass hereafter: and he that revealeth secrets maketh known to thee what shall come to pass.";
hnv[29] = "as for you, O king, your thoughts came [into your mind] on your bed, what should happen hereafter; and he who reveals secrets has made known to you what shall happen.";
vul[29] = "Tu rex cogitare coepisti in strato tuo, quid esset futurum post haec: et qui revelat mysteria, ostendit tibi quae ventura sunt.";
rsv[30] = "But as for me, not because of any wisdom that I have more than all the living has this mystery been revealed to me, but in order that the interpretation may be made known to the king, and that you may know the thoughts of your mind.";
asv[30] = "But as for me, this secret is not revealed to me for any wisdom that I have more than any living, but to the intent that the interpretation may be made known to the king, and that thou mayest know the thoughts of thy heart.";
yng[30] = "As to me -- not for [any] wisdom that is in me above any living hath this secret been revealed to me; but for the intent that the interpretation to the king they make known, and the thoughts of thy heart thou dost know.";
dby[30] = "And as for me, this secret is revealed to me, not by [any] wisdom that I have more than any living, but to the intent that the interpretation should be made known to the king, and that thou mightest know the thoughts of thy heart.";
web[30] = "But as for me, this secret is not revealed to me for [any] wisdom that I have more than any living, but for [their] sakes that shall make known the interpretation to the king, and that thou mayest know the thoughts of thy heart.";
hnv[30] = "But as for me, this secret is not revealed to me for any wisdom that I have more than any living, but to the intent that the interpretation may be made known to the king, and that you may know the thoughts of your heart.";
vul[30] = "Mihi quoque non in sapientia, quae est in me plus quam in cunctis viventibus, sacramentum hoc revelatum est: sed ut interpretatio regi manifesta fieret, et cogitationes mentis tuae scires.";
rsv[31] = "&quot;You saw, O king, and behold, a great image. This image, mighty and of exceeding brightness, stood before you, and its appearance was frightening.";
asv[31] = "Thou, O king, sawest, and, behold, a great image. This image, which was mighty, and whose brightness was excellent, stood before thee; and the aspect thereof was terrible.";
yng[31] = "`Thou, O king, wast looking, and lo, a certain great image. This image [is] mighty, and its brightness excellent; it is standing over-against thee, and its appearance [is] terrible.";
dby[31] = "Thou, O king, sawest, and behold, a great image. This image was mighty and its brightness excellent; it stood before thee, and its appearance was terrible.";
web[31] = "Thou, O king, sawest, and behold a great image. This great image, whose brightness [was] excellent, stood before thee; and its form [was] terrible.";
hnv[31] = "You, O king, saw, and, behold, a great image. This image, which was mighty, and whose brightness was excellent, stood before you; and the aspect of it was awesome.";
vul[31] = "Tu rex videbas, et ecce quasi statua una grandis: statua illa magna, et statura sublimis stabat contra te, et intuitus eius erat terribilis.";
rsv[32] = "The head of this image was of fine gold, its breast and arms of silver, its belly and thighs of bronze,";
asv[32] = "As for this image, its head was of fine gold, its breast and its arms of silver, its belly and its thighs of brass,";
yng[32] = "This image! its head [is] of good gold, its breasts and its arms of silver, its belly and its thighs of brass;";
dby[32] = "This image\'s head was of fine gold, its breast and its arms of silver, its belly and its thighs of brass,";
web[32] = "The head of this image [was] of fine gold, his breast and his arms of silver, his belly and his thighs of brass,";
hnv[32] = "As for this image, its head was of fine gold, its breast and its arms of silver, its belly and its thighs of brass,";
vul[32] = "Huius statuae caput ex auro optimo erat, pectus autem et brachia de argento, porro venter, et femora ex aere.";
rsv[33] = "its legs of iron, its feet partly of iron and partly of clay.";
asv[33] = "its legs of iron, its feet part of iron, and part of clay.";
yng[33] = "its legs of iron, its feet, part of them of iron, and part of them of clay.";
dby[33] = "its legs of iron, its feet part of iron and part of clay.";
web[33] = "His legs of iron, his feet part of iron and part of clay.";
hnv[33] = "its legs of iron, its feet part of iron, and part of clay.";
vul[33] = "tibiae autem ferreae, pedum quaedam pars erat ferrea, quaedam autem fictilis.";
rsv[34] = "As you looked, a stone was cut out by no human hand, and it smote the image on its feet of iron and clay, and broke them in pieces;";
asv[34] = "Thou sawest till that a stone was cut out without hands, which smote the image upon its feet that were of iron and clay, and brake them in pieces.";
yng[34] = "Thou wast looking till that a stone hath been cut out without hands, and it hath smitten the image on its feet, that [are] of iron and of clay, and it hath broken them small;";
dby[34] = "Thou sawest till a stone was cut out without hands; and it smote the image upon its feet of iron and clay, and broke them to pieces.";
web[34] = "Thou sawest till a stone was cut out without hands, which smote the image upon his feet [that were] of iron and clay, and broke them to pieces.";
hnv[34] = "You saw until a stone was cut out without hands, which struck the image on its feet that were of iron and clay, and broke them in pieces.";
vul[34] = "Videbas ita, donec abscissus est lapis de monte sine manibus: et percussit statuam in pedibus eius ferreis, et fictilibus, et comminuit eos.";
rsv[35] = "then the iron, the clay, the bronze, the silver, and the gold, all together were broken in pieces, and became like the chaff of the summer threshing floors; and the wind carried them away, so that not a trace of them could be found. But the stone that struck the image became a great mountain and filled the whole earth.";
asv[35] = "Then was the iron, the clay, the brass, the silver, and the gold, broken in pieces together, and became like the chaff of the summer threshing-floors; and the wind carried them away, so that no place was found for them: and the stone that smote the image became a great mountain, and filled the whole earth.";
yng[35] = "then broken small together have been the iron, the clay, the brass, the silver, and the gold, and they have been as chaff from the summer threshing-floor, and carried them away hath the wind, and no place hath been found for them: and the stone that smote the image hath become a great mountain, and hath filled all the land.";
dby[35] = "Then was the iron, the clay, the brass, the silver, and the gold broken in pieces together, and they became like the chaff of the summer threshing-floors; and the wind carried them away, and no place was found for them. And the stone that smote the image became a great mountain, and filled the whole earth.";
web[35] = "Then was the iron, the clay, the brass, the silver, and the gold, broken to pieces together, and became like the chaff of the summer threshing-floors; and the wind carried them away, that no place was found for them: and the stone that smote the image became a great mountain, and filled the whole earth.";
hnv[35] = "Then was the iron, the clay, the brass, the silver, and the gold, broken in pieces together, and became like the chaff of the summer threshing floors; and the wind carried them away, so that no place was found for them: and the stone that struck the image became a great mountain, and filled the whole eretz.";
vul[35] = "Tunc contrita sunt pariter ferrum, testa, aes, argentum, et aurum, et redacta quasi in favillam aestivae areae, quae rapta sunt vento: nullusque locus inventus est eis: lapis autem, qui percusserat statuam, factus est mons magnus, et implevit universam terram.";
rsv[36] = "&quot;This was the dream; now we will tell the king its interpretation.";
asv[36] = "This is the dream; and we will tell the interpretation thereof before the king.";
yng[36] = "This [is] the dream, and its interpretation we do tell before the king.";
dby[36] = "This is the dream; and we will tell the interpretation of it before the king.";
web[36] = "This [is] the dream; and we will tell the interpretation of it before the king.";
hnv[36] = " This is the dream; and we will tell the interpretation of it before the king.";
vul[36] = "hoc est somnium. Interpretationem quoque eius dicemus coram te, rex.";
rsv[37] = "You, O king, the king of kings, to whom the God of heaven has given the kingdom, the power, and the might, and the glory,";
asv[37] = "Thou, O king, art king of kings, unto whom the God of heaven hath given the kingdom, the power, and the strength, and the glory;";
yng[37] = "`Thou, O king, art a king of kings, for the God of the heavens a kingdom, strength, and might, and glory, hath given to thee;";
dby[37] = "Thou, O king, art a king of kings, unto whom the God of the heavens hath given the kingdom, the power, and the strength, and the glory;";
web[37] = "Thou, O king, [art] a king of kings: for the God of heaven hath given thee a kingdom, power, and strength, and glory.";
hnv[37] = "You, O king, are king of kings, to whom the God of heaven has given the kingdom, the power, and the strength, and the glory;";
vul[37] = "Tu rex regum es: et Deus caeli, regnum, et fortitudinem, et imperium, et gloriam dedit tibi:";
rsv[38] = "and into whose hand he has given, wherever they dwell, the sons of men, the beasts of the field, and the birds of the air, making you rule over them all--you are the head of gold.";
asv[38] = "and wheresoever the children of men dwell, the beasts of the field and the birds of the heavens hath he given into thy hand, and hath made thee to rule over them all: thou art the head of gold.";
yng[38] = "and whithersoever sons of men are dwelling, the beast of the field, and the fowl of the heavens, He hath given into thy hand, and hath caused thee to rule over them all; thou [art] this head of gold.";
dby[38] = "and wheresoever the children of men, the beasts of the field, and the fowl of the heavens dwell, he hath given them into thy hand, and hath made thee ruler over them all: thou art this head of gold.";
web[38] = "And wherever the children of men dwell, the beasts of the field and the fowls of the heaven hath he given into thy hand, and hath made thee ruler over them all. Thou [art] this head of gold.";
hnv[38] = "and wherever the children of men dwell, the animals of the field and the birds of the sky has he given into your hand, and has made you to rule over them all: you are the head of gold.";
vul[38] = "et omnia, in quibus habitant filii hominum, et bestiae agri: volucres quoque caeli dedit in manu tua, et sub ditione tua universa constituit: tu es ergo caput aureum.";
rsv[39] = "After you shall arise another kingdom inferior to you, and yet a third kingdom of bronze, which shall rule over all the earth.";
asv[39] = "And after thee shall arise another kingdom inferior to thee; and another third kingdom of brass, which shall bear rule over all the earth.";
yng[39] = "And after thee doth rise up another kingdom lower than those, and another third kingdom of brass, that doth rule overall the earth.";
dby[39] = "And after thee shall arise another kingdom inferior to thee; then another third kingdom of brass, which shall bear rule over all the earth.";
web[39] = "And after thee shall arise another kingdom inferior to thee, and another third kingdom of brass, which shall bear rule over all the earth.";
hnv[39] = "After you shall arise another kingdom inferior to you; and another third kingdom of brass, which shall bear rule over all the eretz.";
vul[39] = "Et post te consurget regnum aliud minus te argenteum: et regnum tertium aliud aereum, quod imperabit universae terrae.";
rsv[40] = "And there shall be a fourth kingdom, strong as iron, because iron breaks to pieces and shatters all things; and like iron which crushes, it shall break and crush all these.";
asv[40] = "And the fourth kingdom shall be strong as iron, forasmuch as iron breaketh in pieces and subdueth all things; and as iron that crusheth all these, shall it break in pieces and crush.";
yng[40] = "And the fourth kingdom is strong as iron, because that iron is breaking small, and making feeble, all [things], even as iron that is breaking all these, it beateth small and breaketh.";
dby[40] = "And the fourth kingdom shall be strong as iron: forasmuch as iron breaketh in pieces and subdueth everything, and as iron that breaketh all these, so shall it break in pieces and bruise.";
web[40] = "And the fourth kingdom shall be strong as iron: forasmuch as iron breaketh in pieces and subdueth all [things]: and as iron that breaketh all these, shall it break in pieces and bruise.";
hnv[40] = "The fourth kingdom shall be strong as iron, because iron breaks in pieces and subdues all things; and as iron that crushes all these, shall it break in pieces and crush.";
vul[40] = "Et regnum quartum erit velut ferrum. quomodo ferrum comminuit, et domat omnia, sic comminuet, et conteret omnia haec.";
rsv[41] = "And as you saw the feet and toes partly of potter\'s clay and partly of iron, it shall be a divided kingdom; but some of the firmness of iron shall be in it, just as you saw iron mixed with the miry clay.";
asv[41] = "And whereas thou sawest the feet and toes, part of potters\' clay, and part of iron, it shall be a divided kingdom; but there shall be in it of the strength of the iron, forasmuch as thou sawest the iron mixed with miry clay.";
yng[41] = "As to that which thou hast seen: the feet and toes, part of them potter\'s clay, and part of them iron, the kingdom is divided: and some of the standing of the iron [is] to be in it, because that thou hast seen the iron mixed with miry clay.";
dby[41] = "And whereas thou sawest the feet and toes, part of potter\'s clay, and part of iron, the kingdom shall be divided; but there shall be in it of the strength of the iron, forasmuch as thou sawest the iron mixed with miry clay.";
web[41] = "And whereas thou sawest the feet and toes, part of potter\'s clay, and part of iron, the kingdom shall be divided; but there shall be in it of the strength of the iron, forasmuch as thou sawest the iron mixed with the miry clay.";
hnv[41] = "Whereas you saw the feet and toes, part of potters\' clay, and part of iron, it shall be a divided kingdom; but there shall be in it of the strength of the iron, because you saw the iron mixed with miry clay.";
vul[41] = "Porro quia vidisti pedum, et digitorum partem testae figuli, et partem ferream: regnum divisum erit, quod tamen de plantario ferri orietur, secundum quod vidisti ferrum mistum testae ex luto.";
rsv[42] = "And as the toes of the feet were partly iron and partly clay, so the kingdom shall be partly strong and partly brittle.";
asv[42] = "And as the toes of the feet were part of iron, and part of clay, so the kingdom shall be partly strong, and partly broken.";
yng[42] = "As to the toes of the feet, part of them iron, and part of them clay: some part of the kingdom is strong, and some part of it is brittle.";
dby[42] = "And [as] the toes of the feet were part of iron and part of clay, the kingdom shall be partly strong and partly fragile.";
web[42] = "And [as] the toes of the feet [were] part of iron, and part of clay, [so] the kingdom shall be partly strong, and partly broken.";
hnv[42] = "As the toes of the feet were part of iron, and part of clay, so the kingdom shall be partly strong, and partly broken.";
vul[42] = "Et digitos pedum ex parte ferreos, et ex parte fictiles: ex parte regnum erit solidum, et ex parte contritum.";
rsv[43] = "As you saw the iron mixed with miry clay, so they will mix with one another in marriage, but they will not hold together, just as iron does not mix with clay.";
asv[43] = "And whereas thou sawest the iron mixed with miry clay, they shall mingle themselves with the seed of men; but they shall not cleave one to another, even as iron doth not mingle with clay.";
yng[43] = "Because thou hast seen iron mixed with miry clay, they are mixing themselves with the seed of men: and they are not adhering one with another, even as iron is not mixed with clay.";
dby[43] = "And whereas thou sawest the iron mixed with miry clay, they shall mingle themselves with the seed of men; but they shall not cleave one to another, even as iron doth not mingle with clay.";
web[43] = "And whereas thou sawest iron mixed with miry clay, they shall mingle themselves with the seed of men: but they shall not cleave one to another, even as iron is not mixed with clay.";
hnv[43] = "Whereas you saw the iron mixed with miry clay, they shall mingle themselves with the seed of men; but they shall not cling to one another, even as iron does not mingle with clay.";
vul[43] = "Quod autem vidisti ferrum mistum testae ex luto, commiscebuntur quidem humano semine, sed non adhaerebunt sibi, sicut ferrum misceri non potest testae.";
rsv[44] = "And in the days of those kings the God of heaven will set up a kingdom which shall never be destroyed, nor shall its sovereignty be left to another people. It shall break in pieces all these kingdoms and bring them to an end, and it shall stand for ever;";
asv[44] = "And in the days of those kings shall the God of heaven set up a kingdom which shall never be destroyed, nor shall the sovereignty thereof be left to another people; but it shall break in pieces and consume all these kingdoms, and it shall stand for ever.";
yng[44] = "`And in the days of these kings raise up doth the God of the heavens a kingdom that is not destroyed -- to the age, and its kingdom to another people is not left: it beateth small and endeth all these kingdoms, and it standeth to the age.";
dby[44] = "And in the days of these kings shall the God of the heavens set up a kingdom which shall never be destroyed; and the sovereignty thereof shall not be left to another people: it shall break in pieces and consume all these kingdoms, but itself shall stand for ever.";
web[44] = "And in the days of these kings shall the God of heaven set up a kingdom, which shall never be destroyed: and the kingdom shall not be left to other people, [but] it shall break in pieces and consume all these kingdoms, and it shall stand for ever.";
hnv[44] = "In the days of those kings shall the God of heaven set up a kingdom which shall never be destroyed, nor shall the sovereignty of it be left to another people; but it shall break in pieces and consume all these kingdoms, and it shall stand forever.";
vul[44] = "In diebus autem regnorum illorum suscitabit Deus caeli regnum, quod in aeternum non dissipabitur, et regnum eius alteri populo non tradetur: comminuet autem, et consumet universa regna haec: et ipsum stabit in aeternum.";
rsv[45] = "just as you saw that a stone was cut from a mountain by no human hand, and that it broke in pieces the iron, the bronze, the clay, the silver, and the gold. A great God has made known to the king what shall be hereafter. The dream is certain, and its interpretation sure.&quot;";
asv[45] = "Forasmuch as thou sawest that a stone was cut out of the mountain without hands, and that it brake in pieces the iron, the brass, the clay, the silver, and the gold; the great God hath made known to the king what shall come to pass hereafter: and the dream is certain, and the interpretation thereof sure.";
yng[45] = "Because that thou hast seen that out of the mountain cut hath been a stone without hands, and it hath beaten small the iron, the brass, the clay, the silver, and the gold; the great God hath made known to the king that which [is] to be after this; and the dream [is] true, and its interpretation stedfast.";
dby[45] = "Forasmuch as thou sawest that a stone was cut out of the mountain without hands, and that it broke in pieces the iron, the brass, the clay, the silver, and the gold, -- the great God hath made known to the king what shall come to pass hereafter. And the dream is certain, and the interpretation of it sure.";
web[45] = "Forasmuch as thou sawest that the stone was cut out of the mountain, without hands, and that it broke in pieces the iron, the brass, the clay, the silver, and the gold; the great God hath made known to the king what shall come to pass hereafter: and the dream [is] certain, and the interpretation of it sure.";
hnv[45] = "Because you saw that a stone was cut out of the mountain without hands, and that it broke in pieces the iron, the brass, the clay, the silver, and the gold; the great God has made known to the king what shall happen hereafter: and the dream is certain, and the interpretation of it sure.";
vul[45] = "Secundum quod vidisti, quod de monte abscissus est lapis sine manibus, et comminuit testam, et ferrum, et aes, et argentum, et aurum, Deus magnus ostendit regi quae ventura sunt postea. et verum est somnium, et fidelis interpretatio eius.";
rsv[46] = "Then King Nebuchadnez\'zar fell upon his face, and did homage to Daniel, and commanded that an offering and incense be offered up to him.";
asv[46] = "Then the king Nebuchadnezzar fell upon his face, and worshipped Daniel, and commanded that they should offer an oblation and sweet odors unto him.";
yng[46] = "Then hath king Nebuchadnezzar fallen on his face, and to Daniel he hath done obeisance, and present, and sweet things, he hath said to pour out to him.";
dby[46] = "Then king Nebuchadnezzar fell on his face and worshipped Daniel, and commanded that they should offer an oblation and sweet odours unto him.";
web[46] = "Then the king Nebuchadnezzar fell upon his face, and worshiped Daniel, and commanded that they should offer an oblation and sweet odors to him.";
hnv[46] = "Then the king Nevukhadnetztzar fell on his face, and worshiped Daniyel, and commanded that they should offer an offering and sweet odors to him.";
vul[46] = "Tunc rex Nabuchodonosor cecidit in faciem suam, et Danielem adoravit, et hostias, et incensum praecepit ut sacrificarent ei.";
rsv[47] = "The king said to Daniel, &quot;Truly, your God is God of gods and Lord of kings, and a revealer of mysteries, for you have been able to reveal this mystery.&quot;";
asv[47] = "The king answered unto Daniel, and said, Of a truth your God is the God of gods, and the Lord of kings, and a revealer of secrets, seeing thou hast been able to reveal this secret.";
yng[47] = "The king hath answered Daniel and said, `Of a truth [it is] that your God is a God of gods, and a Lord of kings, and a revealer of secrets, since thou hast been able to reveal this secret.\'";
dby[47] = "The king answered Daniel and said, Of a truth it is that your God is the God of gods, and the Lord of kings, and a revealer of secrets, because thou wast able to reveal this secret.";
web[47] = "The king answered to Daniel, and said, Of a truth [it is], that your God [is] a God of gods, and a Lord of kings, and a revealer of secrets, seeing thou couldst reveal this secret.";
hnv[47] = "The king answered to Daniyel, and said, Of a truth your God is the God of gods, and the Lord of kings, and a revealer of secrets, seeing you have been able to reveal this secret.";
vul[47] = "Loquens ergo rex, ait Danieli: Vere Deus vester Deus deorum est, et Dominus regum, et revelans mysteria: quoniam tu potuisti aperire hoc sacramentum.";
rsv[48] = "Then the king gave Daniel high honors and many great gifts, and made him ruler over the whole province of Babylon, and chief prefect over all the wise men of Babylon.";
asv[48] = "Then the king made Daniel great, and gave him many great gifts, and made him to rule over the whole province of Babylon, and to be chief governor over all the wise men of Babylon.";
yng[48] = "Then the king hath made Daniel great, and many great gifts he hath given to him, and hath caused him to rule over all the province of Babylon, and chief of the perfects over all the wise men of Babylon.";
dby[48] = "Then the king made Daniel great, and gave him many great gifts, and made him ruler over the whole province of Babylon, and chief of the governors over all the wise men of Babylon.";
web[48] = "Then the king made Daniel a great man, and gave him many great gifts, and made him ruler over the whole province of Babylon, and chief of the governors over all the wise [men] of Babylon.";
hnv[48] = "Then the king made Daniyel great, and gave him many great gifts, and made him to rule over the whole province of Bavel, and to be chief governor over all the wise men of Bavel.";
vul[48] = "Tunc rex Danielem in sublime extulit, et munera multa, et magna dedit ei: et constituit eum principem super omnes provincias Babylonis: et praefectum magistratuum super cunctos sapientes Babylonis.";
rsv[49] = "Daniel made request of the king, and he appointed Shadrach, Meshach, and Abed\'nego over the affairs of the province of Babylon; but Daniel remained at the king\'s court.";
asv[49] = "And Daniel requested of the king, and he appointed Shadrach, Meshach, and Abed-nego, over the affairs of the province of Babylon: but Daniel was in the gate of the king.";
yng[49] = "And Daniel hath sought from the king, and he hath appointed over the work of the province of Babylon, Shadrach, Meshach, and Abed-Nego, and Daniel [is] in the gate of the king.";
dby[49] = "And Daniel requested of the king, and he appointed Shadrach, Meshach, and Abed-nego over the administration of the province of Babylon. And Daniel was in the gate of the king.";
web[49] = "Then Daniel requested of the king, and he set Shadrach, Meshach, and Abed-nego, over the affairs of the province of Babylon: but Daniel [sat] in the gate of the king.";
hnv[49] = "Daniyel requested of the king, and he appointed Shadrakh, Meshakh, and `Aved-Nego, over the affairs of the province of Bavel: but Daniyel was in the gate of the king.";
vul[49] = "Daniel autem postulavit a rege: et constituit super opera provinciae Babylonis, Sidrach, Misach, et Abdenago: Ipse autem Daniel erat in foribus regis.";
</script>
