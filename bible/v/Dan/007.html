csb[1] = "In the first year of King Belshazzar of Babylon, Daniel had a dream with visions in his mind as he was lying in his bed. He wrote down the dream, and here is the summary of his account.";
csb[2] = "Daniel said, &quot;In my vision at night I was watching, and suddenly the four winds of heaven stirred up the great sea.";
csb[3] = "&quot;Four huge beasts came up from the sea, each different from the other.";
csb[4] = "&quot;The first was like a lion but had eagle\'s wings. I continued watching until its wings were torn off. It was lifted up from the ground, set on its feet like a man, and given a human mind.";
csb[5] = "&quot;Suddenly, another beast appeared, a second one, that looked like a bear. It was raised up on one side, with three ribs in its mouth between its teeth. It was told, \'Get up! Gorge yourself on flesh.\'";
csb[6] = "&quot;After this, while I was watching, suddenly another beast appeared. It was like a leopard with four wings of a bird on its back. It had four heads, and it was given dominion.";
csb[7] = "&quot;After this, while I was watching in the night visions, suddenly a fourth beast appeared, frightening and dreadful, and incredibly strong, with large iron teeth. It devoured and crushed, and it trampled with its feet whatever was left. It was different from all the beasts before it, and it had ten horns.";
csb[8] = "&quot;While I was considering the horns, suddenly another horn, a little one, came up among them, and three of the first horns were uprooted before it. And suddenly in this horn there were eyes like the eyes of a human and a mouth that was speaking arrogantly.";
csb[9] = "&quot;As I kept watching, thrones were set in place, and the Ancient of Days took his seat. His clothing was white like snow, and the hair of his head like whitest wool. His throne was flaming fire; its wheels were blazing fire.";
csb[10] = "&quot;A river of fire was flowing, coming out from his presence. Thousands upon thousands served him; ten thousand times ten thousand stood before him. The court was convened, and the books were opened.";
csb[11] = "&quot;I watched, then, because of the sound of the arrogant words the horn was speaking. As I continued watching, the beast was killed and its body destroyed and given over to the burning fire.";
csb[12] = "&quot;As for the rest of the beasts, their dominion was removed, but an extension of life was granted to them for a certain period of time.";
csb[13] = "&quot;I continued watching in the night visions, and suddenly one like a son of man was coming with the clouds of heaven. He approached the Ancient of Days and was escorted before him.";
csb[14] = "&quot;He was given dominion, and glory, and a kingdom; so that those of every people, nation, and language should serve him. His dominion is an everlasting dominion that will not pass away, and his kingdom is one that will not be destroyed.";
csb[15] = "&quot;As for me, Daniel, my spirit was deeply distressed within me, and the visions in my mind terrified me.";
csb[16] = "&quot;I approached one of those who were standing by and asked him to clarify all this. So he let me know the interpretation of these things:";
csb[17] = "&quot;\'These huge beasts, four in number, are four kings who will rise from the earth.";
csb[18] = "&quot;But the holy ones of the Most High will receive the kingdom and possess it forever, yes, forever and ever.\'";
csb[19] = "&quot;Then I wanted to be clear about the fourth beast, the one different from all the others, extremely terrifying, with iron teeth and bronze claws, devouring, crushing, and trampling with its feet whatever was left.";
csb[20] = "&quot;I also wanted to know about the ten horns on its head and about the other horn that came up, before which three fell -- the horn that had eyes, and a mouth that spoke arrogantly, and that looked bigger than the others.";
csb[21] = "&quot;As I was watching, this horn waged war against the holy ones and was prevailing over them";
csb[22] = "&quot;until the Ancient of Days arrived and a judgment was given in favor of the holy ones of the Most High, for the time had come, and the holy ones took possession of the kingdom.";
csb[23] = "&quot;This is what he said: \'The fourth beast will be a fourth kingdom on the earth, different from all the other kingdoms. It will devour the whole earth, trample it down, and crush it.";
csb[24] = "&quot;The ten horns are ten kings who will rise from this kingdom. Another king, different from the previous ones, will rise after them and subdue three kings.";
csb[25] = "&quot;He will speak words against the Most High and oppress the holy ones of the Most High. He will intend to change religious festivals and laws, and the holy ones will be handed over to him for a time, times, and half a time.";
csb[26] = "&quot;But the court will convene, and his dominion will be taken away, to be completely destroyed forever.";
csb[27] = "&quot;The kingdom, dominion, and greatness of the kingdoms under all of heaven will be given to the people, the holy ones of the Most High. His kingdom will be an everlasting kingdom, and all rulers will serve and obey him.\'";
csb[28] = "&quot;This is the end of the account. As for me, Daniel, my thoughts terrified me greatly, and my face turned pale, but I kept the matter to myself.&quot;";
kjv[1] = "In the first year of Belshazzar king of Babylon Daniel had a dream and visions of his head upon his bed: then he wrote the dream, [and] told the sum of the matters.";
rsv[1] = "In the first year of Belshaz\'zar king of Babylon, Daniel had a dream and visions of his head as he lay in his bed. Then he wrote down the dream, and told the sum of the matter.";
asv[1] = "In the first year of Belshazzar king of Babylon Daniel had a dream and visions of his head upon his bed: then he wrote the dream and told the sum of the matters.";
yng[1] = "In the first year of Belshazzar king of Babylon, Daniel hath seen a dream, and the visions of his head on his bed, then the dream he hath written, the chief of the things he hath said.";
dby[1] = "In the first year of Belshazzar king of Babylon, Daniel saw a dream and visions of his head upon his bed: then he wrote the dream; he told the sum of the matters.";

vul[1] = "Anno primo Baltassar regis Babylonis, Daniel somnium vidit: visio autem capitis eius in cubili suo: et somnium scribens, brevi sermone comprehendit: summatimque perstringens, ait:";
kjv[2] = "Daniel spake and said, I saw in my vision by night, and, behold, the four winds of the heaven strove upon the great sea.";
rsv[2] = "Daniel said, &quot;I saw in my vision by night, and behold, the four winds of heaven were stirring up the great sea.";
asv[2] = "Daniel spake and said, I saw in my vision by night, and, behold, the four winds of heaven brake forth upon the great sea.";
yng[2] = "Answered hath Daniel and said, `I was seeing in my vision by night, and lo, the four winds of the heavens are coming forth to the great sea;";
dby[2] = "Daniel spoke and said, I saw in my vision by night, and behold, the four winds of the heavens broke forth upon the great sea.";
web[2] = "Daniel spoke and said, I saw in my vision by night, and behold, the four winds of heaven strove upon the great sea.";
hnv[2] = "Daniyel spoke and said, I saw in my vision by night, and, behold, the four winds of the sky broke forth on the great sea.";
vul[2] = "Videbam in visione mea nocte, et ecce quattuor venti caeli pugnabant in mari magno.";
kjv[3] = "And four great beasts came up from the sea, diverse one from another.";
rsv[3] = "And four great beasts came up out of the sea, different from one another.";
asv[3] = "And four great beasts came up from the sea, diverse one from another.";
yng[3] = "and four great beasts are coming up from the sea, diverse one from another.";
dby[3] = "And four great beasts came up from the sea, different one from another.";
web[3] = "And four great beasts came up from the sea, diverse one from another.";
hnv[3] = "Four great animals came up from the sea, diverse one from another.";
vul[3] = "Et quattuor bestiae grandes ascendebant de mari diversae inter se.";
kjv[4] = "The first [was] like a lion, and had eagle\'s wings: I beheld till the wings thereof were plucked, and it was lifted up from the earth, and made stand upon the feet as a man, and a man\'s heart was given to it.";
rsv[4] = "The first was like a lion and had eagles\' wings. Then as I looked its wings were plucked off, and it was lifted up from the ground and made to stand upon two feet like a man; and the mind of a man was given to it.";
asv[4] = "The first was like a lion, and had eagle\'s wings: I beheld till the wings thereof were plucked, and it was lifted up from the earth, and made to stand upon two feet as a man; and a man\'s heart was given to it.";
yng[4] = "The first [is] like a lion, and it hath an eagle\'s wings. I was seeing till that its wings have been plucked, and it hath been lifted up from the earth, and on feet as a man it hath been caused to stand, and a heart of man is given to it.";
dby[4] = "The first was like a lion, and had eagle\'s wings: I beheld till its wings were plucked; and it was lifted up from the earth, and made to stand upon two feet as a man, and a man\'s heart was given to it.";

vul[4] = "Prima quasi leaena, et alas habebat aquilae: aspiciebam donec evulsae sunt alae eius, et sublata est de terra, et super pedes quasi homo stetit; et cor hominis datum est ei.";
kjv[5] = "And behold another beast, a second, like to a bear, and it raised up itself on one side, and [it had] three ribs in the mouth of it between the teeth of it: and they said thus unto it, Arise, devour much flesh.";
rsv[5] = "And behold, another beast, a second one, like a bear. It was raised up on one side; it had three ribs in its mouth between its teeth; and it was told, \'Arise, devour much flesh.\'";
asv[5] = "And, behold, another beast, a second, like to a bear; and it was raised up on one side, and three ribs were in its mouth between its teeth: and they said thus unto it, Arise, devour much flesh.";
yng[5] = "And lo, another beast, a second, like to a bear, and to the same authority it hath been raised, and three ribs [are] in its mouth, between its teeth, and thus they are saying to it, Rise, consume much flesh.";
dby[5] = "And behold, another beast, a second, like unto a bear, and it raised up itself on one side; and [it had] three ribs in its mouth between its teeth; and they said thus unto it: Arise, devour much flesh.";

hnv[5] = "Behold, another animal, a second, like a bear; and it was raised up on one side, and three ribs were in its mouth between its teeth: and they said thus to it, Arise, devour much flesh.";

kjv[7] = "After this I saw in the night visions, and behold a fourth beast, dreadful and terrible, and strong exceedingly; and it had great iron teeth: it devoured and brake in pieces, and stamped the residue with the feet of it: and it [was] diverse from all the beasts that [were] before it; and it had ten horns.";
rsv[7] = "After this I saw in the night visions, and behold, a fourth beast, terrible and dreadful and exceedingly strong; and it had great iron teeth; it devoured and broke in pieces, and stamped the residue with its feet. It was different from all the beasts that were before it; and it had ten horns.";
asv[7] = "After this I saw in the night-visions, and, behold, a fourth beast, terrible and powerful, and strong exceedingly; and it had great iron teeth; it devoured and brake in pieces, and stamped the residue with its feet: and it was diverse from all the beasts that were before it; and it had ten horns.";
yng[7] = "`After this I was seeing in the visions of the night, and lo, a fourth beast, terrible and fearful, and exceedingly strong; and it hath iron teeth very great, it hath consumed, yea, it doth break small, and the remnant with its feet it hath trampled; and it [is] diverse from all the beasts that [are] before it; and it hath ten horns.";
dby[7] = "After this I saw in the night visions, and behold, a fourth beast, dreadful and terrible, and exceeding strong; and it had great iron teeth: it devoured and broke in pieces, and stamped the rest with its feet; and it was different from all the beasts that were before it; and it had ten horns.";
web[7] = "After this I saw in the night visions, and behold a fourth beast, dreadful and terrible, and strong exceedingly; and it had great iron teeth: it devoured and broke in pieces, and stamped the residue with its feet: and it [was] diverse from all the beasts that [were] before it; and it had ten horns.";
hnv[7] = "After this I saw in the night-visions, and, behold, a fourth animal, awesome and powerful, and strong exceedingly; and it had great iron teeth; it devoured and broke in pieces, and stamped the residue with its feet: and it was diverse from all the animals that were before it; and it had ten horns.";
vul[7] = "Post haec aspiciebam in visione noctis, et ecce bestia quarta terribilis, atque mirabilis, et fortis nimis, dentes ferreos habebat magnos, comedens atque comminuens, et reliqua pedibus suis conculcans: dissimilis autem erat ceteris bestiis, quas videram ante eam, et habebat cornua decem.";
kjv[8] = "I considered the horns, and, behold, there came up among them another little horn, before whom there were three of the first horns plucked up by the roots: and, behold, in this horn [were] eyes like the eyes of man, and a mouth speaking great things.";
rsv[8] = "I considered the horns, and behold, there came up among them another horn, a little one, before which three of the first horns were plucked up by the roots; and behold, in this horn were eyes like the eyes of a man, and a mouth speaking great things.";
asv[8] = "I considered the horns, and, behold, there came up among them another horn, a little one, before which three of the first horns were plucked up by the roots: and, behold, in this horn were eyes like the eyes of a man, and a mouth speaking great things.";
yng[8] = "`I was considering about the horns, and lo, another horn, a little one, hath come up between them, and three of the first horns have been eradicated from before it, and lo, eyes as the eyes of man [are] in this horn, and a mouth speaking great things.";
dby[8] = "I considered the horns, and behold, there came up among them another, a little horn, before which three of the first horns were plucked up by the roots; and behold, in this horn were eyes like the eyes of a man, and a mouth speaking great things.";
web[8] = "I considered the horns, and behold, there came up among them another little horn, before whom there were three of the first horns plucked up by the roots: and behold, in this horn [were] eyes like the eyes of a man, and a mouth speaking great things.";
hnv[8] = "I considered the horns, and, behold, there came up among them another horn, a little one, before which three of the first horns were plucked up by the roots: and, behold, in this horn were eyes like the eyes of a man, and a mouth speaking great things.";
vul[8] = "Considerabam cornua, et ecce cornu aliud parvulum ortum est de medio eorum: et tria de cornibus primis evulsa sunt a facie eius: et ecce oculi, quasi oculi hominis erant in cornu isto, et os loquens ingentia.";
kjv[9] = "I beheld till the thrones were cast down, and the Ancient of days did sit, whose garment [was] white as snow, and the hair of his head like the pure wool: his throne [was like] the fiery flame, [and] his wheels [as] burning fire.";
rsv[9] = "As I looked, thrones were placed and one that was ancient of days took his seat; his raiment was white as snow, and the hair of his head like pure wool; his throne was fiery flames, its wheels were burning fire.";
asv[9] = "I beheld till thrones were placed, and one that was ancient of days did sit: his raiment was white as snow, and the hair of his head like pure wool; his throne was fiery flames, [and] the wheels thereof burning fire.";
yng[9] = "`I was seeing till that thrones have been thrown down, and the Ancient of Days is seated, His garment as snow [is] white, and the hair of his head [is] as pure wool, His throne flames of fire, its wheels burning fire.";
dby[9] = "I beheld till thrones were set, and the Ancient of days did sit: his raiment was white as snow, and the hair of his head like pure wool; his throne was flames of fire, [and] its wheels burning fire.";
web[9] = "I beheld till the thrones were cast down, and the Ancient of days did sit, whose garment [was] white as snow, and the hair of his head like the pure wool: his throne [was like] the fiery flame, [and] his wheels [as] burning fire.";
hnv[9] = "I saw until thrones were placed, and one who was ancient of days sat: his clothing was white as snow, and the hair of his head like pure wool; his throne was fiery flames, [and] the wheels of it burning fire.";
vul[9] = "Aspiciebam donec throni positi sunt, et antiquus dierum sedit: vestimentum eius candidum quasi nix, et capilli capitis eius quasi lana munda: thronus eius flammae ignis: rotae eius ignis accensus.";
kjv[10] = "A fiery stream issued and came forth from before him: thousand thousands ministered unto him, and ten thousand times ten thousand stood before him: the judgment was set, and the books were opened.";
rsv[10] = "A stream of fire issued and came forth from before him; a thousand thousands served him, and ten thousand times ten thousand stood before him; the court sat in judgment, and the books were opened.";
asv[10] = "A fiery stream issued and came forth from before him: thousands of thousands ministered unto him, and ten thousand times ten thousand stood before him: the judgment was set, and the books were opened.";
yng[10] = "A flood of fire is proceeding and coming forth from before Him, a thousand thousands do serve Him, and a myriad of myriads before Him do rise up, the Judge is seated, and the books have been opened.";
dby[10] = "A stream of fire issued and came forth from before him; thousand thousands ministered unto him, and ten thousand times ten thousand stood before him: the judgment was set, and the books were opened.";
web[10] = "A fiery stream issued and came forth from before him: thousand thousands ministered to him, and ten thousand times ten thousand stood before him: the judgment was set and the books were opened.";
hnv[10] = "A fiery stream issued and came forth from before him: thousands of thousands ministered to him, and ten thousand times ten thousand stood before him: the judgment was set, and the books were opened.";
vul[10] = "Fluvius igneus, rapidusque egrediebatur a facie eius. (j) millia millium ministrabant ei, et decies millies centena millia assistebant ei: iudicium sedit, et libri aperti sunt.";
kjv[11] = "I beheld then because of the voice of the great words which the horn spake: I beheld [even] till the beast was slain, and his body destroyed, and given to the burning flame.";
rsv[11] = "I looked then because of the sound of the great words which the horn was speaking. And as I looked, the beast was slain, and its body destroyed and given over to be burned with fire.";
asv[11] = "I beheld at that time because of the voice of the great words which the horn spake; I beheld even till the beast was slain, and its body destroyed, and it was given to be burned with fire.";
yng[11] = "`I was seeing, then, because of the voice of the great words that the horn is speaking, I was seeing till that the beast is slain, and his body hath been destroyed, and given to the burning fire;";
dby[11] = "I beheld therefore, because of the voice of the great words that the horn spoke; I beheld till the beast was slain, and its body destroyed, and it was given up to be burned with fire.";
web[11] = "I beheld then because of the voice of the great words which the horn spoke: I beheld [even] till the beast was slain, and his body destroyed, and given to the burning flame.";
hnv[11] = "I saw at that time because of the voice of the great words which the horn spoke; I saw even until the animal was slain, and its body destroyed, and it was given to be burned with fire.";
vul[11] = "Aspiciebam propter vocem sermonum grandium, quos cornu illud loquebatur: et vidi quoniam interfecta esset bestia, et perisset corpus eius, et traditum esset ad comburendum igni:";
kjv[12] = "As concerning the rest of the beasts, they had their dominion taken away: yet their lives were prolonged for a season and time.";
rsv[12] = "As for the rest of the beasts, their dominion was taken away, but their lives were prolonged for a season and a time.";
asv[12] = "And as for the rest of the beasts, their dominion was taken away: yet their lives were prolonged for a season and a time.";
yng[12] = "and the rest of the beasts have caused their dominion to pass away, and a prolongation in life is given to them, till a season and a time.";
dby[12] = "As for the rest of the beasts, their dominion was taken away; but their lives were prolonged for a season and a time.";
web[12] = "As concerning the rest of the beasts, they had their dominion taken away: yet their lives were prolonged for a season and time.";
hnv[12] = "As for the rest of the animals, their dominion was taken away: yet their lives were prolonged for a season and a time.";
vul[12] = "aliarum quoque bestiarum ablata esset potestas, et tempora vitae constituta essent eis usque ad tempus, et tempus.";
kjv[13] = "I saw in the night visions, and, behold, [one] like the Son of man came with the clouds of heaven, and came to the Ancient of days, and they brought him near before him.";
rsv[13] = "I saw in the night visions, and behold, with the clouds of heaven there came one like a son of man, and he came to the Ancient of Days and was presented before him.";
asv[13] = "I saw in the night-visions, and, behold, there came with the clouds of heaven one like unto a son of man, and he came even to the ancient of days, and they brought him near before him.";
yng[13] = "`I was seeing in the visions of the night, and lo, with the clouds of the heavens as a son of man was [one] coming, and unto the Ancient of Days he hath come, and before Him they have brought him near.";
dby[13] = "I saw in the night visions, and behold, there came with the clouds of heaven [one] like a son of man, and he came up even to the Ancient of days, and they brought him near before him.";
web[13] = "I saw in the night visions, and behold, [one] like the son of man came with the clouds of heaven, and came to the Ancient of days, and they brought him near before him.";
hnv[13] = "I saw in the night-visions, and, behold, there came with the clouds of the sky one like a son of man, and he came even to the ancient of days, and they brought him near before him.";
vul[13] = "Aspiciebam ergo in visione noctis, et ecce cum nubibus caeli quasi filius hominis veniebat, et usque ad antiquum dierum pervenit: et in conspectu eius obtulerunt eum.";
kjv[14] = "And there was given him dominion, and glory, and a kingdom, that all people, nations, and languages, should serve him: his dominion [is] an everlasting dominion, which shall not pass away, and his kingdom [that] which shall not be destroyed.";
rsv[14] = "And to him was given dominion and glory and kingdom, that all peoples, nations, and languages should serve him; his dominion is an everlasting dominion, which shall not pass away, and his kingdom one that shall not be destroyed.";
asv[14] = "And there was given him dominion, and glory, and a kingdom, that all the peoples, nations, and languages should serve him: his dominion is an everlasting dominion, which shall not pass away, and his kingdom that which shall not be destroyed.";
yng[14] = "And to him is given dominion, and glory, and a kingdom, and all peoples, nations, and languages do serve him, his dominion [is] a dominion age-during, that passeth not away, and his kingdom that which is not destroyed.";
dby[14] = "And there was given him dominion, and glory, and a kingdom, that all peoples, nations, and languages should serve him: his dominion is an everlasting dominion, which shall not pass away, and his kingdom [that] which shall not be destroyed.";
web[14] = "And there was given him dominion, and glory, and a kingdom, that all people, nations, and languages, should serve him: his dominion [is] an everlasting dominion, which shall not pass away, and his kingdom [that] which shall not be destroyed.";
hnv[14] = "There was given him dominion, and glory, and a kingdom, that all the peoples, nations, and languages should serve him: his dominion is an everlasting dominion, which shall not pass away, and his kingdom that which shall not be destroyed.";
vul[14] = "Et dedit ei potestatem, et honorem, et regnum: et omnes populi, tribus, et linguae ipsi servient: (k) potestas eius, potestas aeterna, quae non auferetur: et regnum eius, quod non corrumpetur.";
kjv[15] = "I Daniel was grieved in my spirit in the midst of [my] body, and the visions of my head troubled me.";
rsv[15] = "&quot;As for me, Daniel, my spirit within me was anxious and the visions of my head alarmed me.";
asv[15] = "As for me, Daniel, my spirit was grieved in the midst of my body, and the visions of my head troubled me.";
yng[15] = "`Pierced hath been my spirit -- I, Daniel -- in the midst of the sheath, and the visions of my head trouble me;";
dby[15] = "As for me Daniel, my spirit was grieved in the midst of my body, and the visions of my head troubled me.";
web[15] = "I Daniel was grieved in my spirit in the midst of [my] body, and the visions of my head troubled me.";
hnv[15] = "As for me, Daniyel, my spirit was grieved in the midst of my body, and the visions of my head troubled me.";
vul[15] = "Horruit spiritus meus, ego Daniel territus sum in his, et visiones capitis mei conturbaverunt me.";
kjv[16] = "I came near unto one of them that stood by, and asked him the truth of all this. So he told me, and made me know the interpretation of the things.";
rsv[16] = "I approached one of those who stood there and asked him the truth concerning all this. So he told me, and made known to me the interpretation of the things.";
asv[16] = "I came near unto one of them that stood by, and asked him the truth concerning all this. So he told me, and made me know the interpretation of the things.";
yng[16] = "I have drawn near unto one of those standing, and the certainty I seek from him of all this; and he hath said to me, yea, the interpretation of the things he hath caused me to know:";
dby[16] = "I came near unto one of them that stood by, and asked him the certainty of all this. And he told me, and made me know the interpretation of the things:";
web[16] = "I came near to one of them that stood by, and asked him the truth of all this. So he told me, and made me know the interpretation of the things.";
hnv[16] = "I came near to one of those who stood by, and asked him the truth concerning all this. So he told me, and made me know the interpretation of the things.";
vul[16] = "Accessi ad unum de assistentibus, et veritatem quaerebam ab eo de omnibus his. Qui dixit mihi interpretationem sermonum, et docuit me:";
kjv[17] = "These great beasts, which are four, [are] four kings, [which] shall arise out of the earth.";
rsv[17] = "\'These four great beasts are four kings who shall arise out of the earth.";
asv[17] = "These great beasts, which are four, are four kings, that shall arise out of the earth.";
yng[17] = "`These great beasts, that [are] four, [are] four kings, they rise up from the earth;";
dby[17] = "These great beasts, which are four, are four kings, [that] shall arise out of the earth.";
web[17] = "These great beasts, which are four, [are] four kings, [which] shall arise out of the earth.";
hnv[17] = "These great animals, which are four, are four kings, who shall arise out of the eretz.";
vul[17] = "Hae quattuor bestiae magnae: quattuor sunt regna, quae consurgent de terra.";
kjv[18] = "But the saints of the most High shall take the kingdom, and possess the kingdom for ever, even for ever and ever.";
rsv[18] = "But the saints of the Most High shall receive the kingdom, and possess the kingdom for ever, for ever and ever.\'";
asv[18] = "But the saints of the Most High shall receive the kingdom, and possess the kingdom for ever, even for ever and ever.";
yng[18] = "and receive the kingdom do the saints of the Most High, and they strengthen the kingdom unto the age, even unto the age of the ages.";
dby[18] = "But the saints of the most high [places] shall receive the kingdom, and they shall possess the kingdom for ever, even to the ages of ages.";
web[18] = "But the saints of the most High shall take the kingdom, and possess the kingdom for ever, even for ever and ever.";
hnv[18] = "But the holy ones of Ha`Elyon shall receive the kingdom, and possess the kingdom forever, even forever and ever.";
vul[18] = "Suscipient autem regnum sancti Dei altissimi: et obtinebunt regnum usque in saeculum, et saeculum saeculorum.";
kjv[19] = "Then I would know the truth of the fourth beast, which was diverse from all the others, exceeding dreadful, whose teeth [were of] iron, and his nails [of] brass; [which] devoured, brake in pieces, and stamped the residue with his feet;";
rsv[19] = "&quot;Then I desired to know the truth concerning the fourth beast, which was different from all the rest, exceedingly terrible, with its teeth of iron and claws of bronze; and which devoured and broke in pieces, and stamped the residue with its feet;";
asv[19] = "Then I desired to know the truth concerning the fourth beast, which was diverse from all of them, exceeding terrible, whose teeth were of iron, and its nails of brass; which devoured, brake in pieces, and stamped the residue with its feet;";
yng[19] = "`Then I wished for certainty concerning the fourth beast, that was diverse from them all, fearful exceedingly; its teeth of iron, and its nails of brass, it hath devoured, it doth break small, and the remnant with its feet it hath trampled;";
dby[19] = "Then I desired to know the certainty concerning the fourth beast, which was different from them all, exceeding dreadful, whose teeth were of iron, and its nails of brass; which devoured, broke in pieces, and stamped the rest with its feet;";
web[19] = "Then I would know the truth of the fourth beast, which was diverse from all the others, exceeding dreadful, whose teeth [were of] iron, and his nails [of] brass; [which] devoured, broke in pieces, and stamped the residue with his feet;";
hnv[19] = "Then I desired to know the truth concerning the fourth animal, which was diverse from all of them, exceedingly terrible, whose teeth were of iron, and its nails of brass; which devoured, broke in pieces, and stamped the residue with its feet;";
vul[19] = "Post hoc volui diligenter discere de bestia quarta, quae erat dissimilis valde ab omnibus, et terribilis nimis: dentes et ungues eius ferrei: comedebat, et comminuebat, et reliqua pedibus suis conculcabat:";
kjv[20] = "And of the ten horns that [were] in his head, and [of] the other which came up, and before whom three fell; even [of] that horn that had eyes, and a mouth that spake very great things, whose look [was] more stout than his fellows.";
rsv[20] = "and concerning the ten horns that were on its head, and the other horn which came up and before which three of them fell, the horn which had eyes and a mouth that spoke great things, and which seemed greater than its fellows.";
asv[20] = "and concerning the ten horns that were on its head, and the other [horn] which came up, and before which three fell, even that horn that had eyes, and a mouth that spake great things, whose look was more stout than its fellows.";
yng[20] = "and concerning the ten horns that [are] in its heads, and of the other that came up, and before which three have fallen, even of that horn that hath eyes, and a mouth speaking great things, and whose appearance [is] great above its companions.";
dby[20] = "and concerning the ten horns that were in its head, and the other that came up, and before which three fell: even that horn that had eyes, and a mouth speaking great things, and whose look was more imposing than its fellows.";
web[20] = "And of the ten horns that [were] in his head, and [of] the other which came up, and before whom three fell; even [of] that horn that had eyes, and a mouth that spoke very great things, whose look [was] more stout than his fellows.";
hnv[20] = "and concerning the ten horns that were on its head, and the other [horn] which came up, and before which three fell, even that horn that had eyes, and a mouth that spoke great things, whose look was more stout than its fellows.";
vul[20] = "et de cornibus decem, quae habebat in capite: et de alio, quod ortum fuerat, ante quod ceciderant tria cornua: et de cornu illo, quod habebat oculos, et os loquens grandia, et maius erat ceteris.";
kjv[21] = "I beheld, and the same horn made war with the saints, and prevailed against them;";
rsv[21] = "As I looked, this horn made war with the saints, and prevailed over them,";
asv[21] = "I beheld, and the same horn made war with the saints, and prevailed against them;";
yng[21] = "`I was seeing, and this horn is making war with the saints, and hath prevailed over them,";
dby[21] = "I beheld, and that horn made war with the saints, and prevailed over them;";
web[21] = "I beheld, and the same horn made war with the saints, and prevailed against them;";
hnv[21] = "I saw, and the same horn made war with the holy ones, and prevailed against them;";
vul[21] = "Aspiciebam, et ecce cornu illud faciebat bellum adversus sanctos, et praevalebat eis,";
kjv[22] = "Until the Ancient of days came, and judgment was given to the saints of the most High; and the time came that the saints possessed the kingdom.";
rsv[22] = "until the Ancient of Days came, and judgment was given for the saints of the Most High, and the time came when the saints received the kingdom.";
asv[22] = "until the ancient of days came, and judgment was given to the saints of the Most High, and the time came that the saints possessed the kingdom.";
yng[22] = "till that the Ancient of Days hath come, and judgment is given to the saints of the Most High, and the time hath come, and the saints have strengthened the kingdom.";
dby[22] = "until the Ancient of days came, and judgment was given to the saints of the most high [places]; and the appointed time arrived, and the saints possessed the kingdom.";
web[22] = "Until the Ancient of days came, and judgment was given to the saints of the most High; and the time came that the saints possessed the kingdom.";
hnv[22] = "until the ancient of days came, and judgment was given to the holy ones of Ha`Elyon, and the time came that the holy ones possessed the kingdom.";
vul[22] = "donec venit antiquus dierum, et iudicium dedit sanctis Excelsi, et tempus advenit, et regnum obtinuerunt sancti.";
kjv[23] = "Thus he said, The fourth beast shall be the fourth kingdom upon earth, which shall be diverse from all kingdoms, and shall devour the whole earth, and shall tread it down, and break it in pieces.";
rsv[23] = "&quot;Thus he said: \'As for the fourth beast, there shall be a fourth kingdom on earth, which shall be different from all the kingdoms, and it shall devour the whole earth, and trample it down, and break it to pieces.";
asv[23] = "Thus he said, The fourth beast shall be a fourth kingdom upon earth, which shall be diverse from all the kingdoms, and shall devour the whole earth, and shall tread it down, and break it in pieces.";
yng[23] = "`Thus he said: The fourth beast is the fourth kingdom in the earth, that is diverse from all kingdoms, and it consumeth all the earth, and treadeth it down, and breaketh it small.";
dby[23] = "He said thus: The fourth beast shall be a fourth kingdom upon the earth, which shall be different from all the kingdoms, and shall devour the whole earth, and shall tread it down, and break it in pieces.";
web[23] = "Thus he said, The fourth beast shall be the fourth kingdom upon earth, which shall be diverse from all kingdoms, and shall devour the whole earth, and shall tread it down, and break it in pieces.";
hnv[23] = "Thus he said, The fourth animal shall be a fourth kingdom on eretz, which shall be diverse from all the kingdoms, and shall devour the whole eretz, and shall tread it down, and break it in pieces.";
vul[23] = "Et sic ait: Bestia quarta, regnum quartum erit in terra, quod maius erit omnibus regnis, et devorabit universam terram, et conculcabit, et comminuet eam.";
kjv[24] = "And the ten horns out of this kingdom [are] ten kings [that] shall arise: and another shall rise after them; and he shall be diverse from the first, and he shall subdue three kings.";
rsv[24] = "As for the ten horns, out of this kingdom ten kings shall arise, and another shall arise after them; he shall be different from the former ones, and shall put down three kings.";
asv[24] = "And as for the ten horns, out of this kingdom shall ten kings arise: and another shall arise after them; and he shall be diverse from the former, and he shall put down three kings.";
yng[24] = "And the ten horns out of the kingdom [are] ten kings, they rise, and another doth rise after them, and it is diverse from the former, and three kings it humbleth;";
dby[24] = "And as to the ten horns, out of this kingdom shall arise ten kings; and another shall arise after them; and he shall be different from the former, and he shall subdue three kings.";
web[24] = "And the ten horns out of this kingdom [are] ten kings [that] shall arise: and another shall rise after them; and he shall be diverse from the first, and he shall subdue three kings.";
hnv[24] = "As for the ten horns, out of this kingdom shall ten kings arise: and another shall arise after them; and he shall be diverse from the former, and he shall put down three kings.";
vul[24] = "Porro cornua decem ipsius regni, decem reges erunt: et alius consurget post eos, et ipse potentior erit prioribus, et tres reges humiliabit.";
kjv[25] = "And he shall speak [great] words against the most High, and shall wear out the saints of the most High, and think to change times and laws: and they shall be given into his hand until a time and times and the dividing of time.";
rsv[25] = "He shall speak words against the Most High, and shall wear out the saints of the Most High, and shall think to change the times and the law; and they shall be given into his hand for a time, two times, and half a time.";
asv[25] = "And he shall speak words against the Most High, and shall wear out the saints of the Most High; and he shall think to change the times and the law; and they shall be given into his hand until a time and times and half a time.";
yng[25] = "and words as an adversary of the Most High it doth speak, and the saints of the Most High it doth wear out, and it hopeth to change seasons and law; and they are given into its hand, till a time, and times, and a division of a time.";
dby[25] = "And he shall speak words against the Most High, and shall wear out the saints of the most high [places], and think to change seasons and the law; and they shall be given into his hand until a time and times and a half time.";
web[25] = "And he shall speak [great] words against the most High, and shall wear out the saints of the most High, and think to change times and laws: and they shall be given into his hand until a time and times and the dividing of time.";
hnv[25] = "He shall speak words against Ha`Elyon, and shall wear out the holy ones of Ha`Elyon; and he shall think to change the times and the law; and they shall be given into his hand until a time and times and half a time.";
vul[25] = "Et sermones contra Excelsum loquetur, et sanctos Altissimi conteret: et putabit quod possit mutare tempora, et leges, et tradentur in manu eius usque ad tempus, et tempora, et dimidium temporis.";
kjv[26] = "But the judgment shall sit, and they shall take away his dominion, to consume and to destroy [it] unto the end.";
rsv[26] = "But the court shall sit in judgment, and his dominion shall be taken away, to be consumed and destroyed to the end.";
asv[26] = "But the judgment shall be set, and they shall take away his dominion, to consume and to destroy it unto the end.";
yng[26] = "`And the Judge is seated, and its dominion they cause to pass away, to cut off, and to destroy -- unto the end;";
dby[26] = "And the judgment shall sit, and they shall take away his dominion, to consume and to destroy it unto the end.";
web[26] = "But the judgment shall sit, and they shall take away his dominion to consume and to destroy [it] to the end.";
hnv[26] = "But the judgment shall be set, and they shall take away his dominion, to consume and to destroy it to the end.";
vul[26] = "Et iudicium sedebit ut auferatur potentia, et conteratur, et dispereat usque in finem.";
kjv[27] = "And the kingdom and dominion, and the greatness of the kingdom under the whole heaven, shall be given to the people of the saints of the most High, whose kingdom [is] an everlasting kingdom, and all dominions shall serve and obey him.";
rsv[27] = "And the kingdom and the dominion and the greatness of the kingdoms under the whole heaven shall be given to the people of the saints of the Most High; their kingdom shall be an everlasting kingdom, and all dominions shall serve and obey them.\'";
asv[27] = "And the kingdom and the dominion, and the greatness of the kingdoms under the whole heaven, shall be given to the people of the saints of the Most High: his kingdom is an everlasting kingdom, and all dominions shall serve and obey him.";
yng[27] = "and the kingdom, and the dominion, even the greatness of the kingdom under the whole heavens, is given to the people -- the saints of the Most High, His kingdom [is] a kingdom age-during, and all dominions do serve and obey Him.";
dby[27] = "But the kingdom and the dominion, and the greatness of the kingdoms under the whole heavens, shall be given to the people of the saints of the most high [places]. His kingdom is an everlasting kingdom, and all dominions shall serve and obey him.";
web[27] = "And the kingdom and dominion, and the greatness of the kingdom under the whole heaven, shall be given to the people of the saints of the most High, whose kingdom [is] an everlasting kingdom, and all dominions shall serve and obey him.";
hnv[27] = "The kingdom and the dominion, and the greatness of the kingdoms under the whole the sky, shall be given to the people of the holy ones of Ha`Elyon: his kingdom is an everlasting kingdom, and all dominions shall serve and obey him.";
vul[27] = "Regnum autem, et potestas, et magnitudo regni, quae est subter omne caelum, detur populo sanctorum Altissimi: cuius regnum, regnum sempiternum est, et omnes reges servient ei, et obedient.";
kjv[28] = "Hitherto [is] the end of the matter. As for me Daniel, my cogitations much troubled me, and my countenance changed in me: but I kept the matter in my heart.";
rsv[28] = "&quot;Here is the end of the matter. As for me, Daniel, my thoughts greatly alarmed me, and my color changed; but I kept the matter in my mind.&quot;";
asv[28] = "Here is the end of the matter. As for me, Daniel, my thoughts much troubled me, and my countenance was changed in me: but I kept the matter in my heart.";
yng[28] = "`Hitherto [is] the end of the matter. I, Daniel, greatly do my thoughts trouble me, and my countenance is changed on me, and the matter in my heart I have kept.";
dby[28] = "So far is the end of the matter. As for me Daniel, my thoughts much troubled me, and my countenance was changed in me; but I kept the matter in my heart.";
web[28] = "Hitherto [is] the end of the matter. As for me Daniel, my cogitations much troubled me, and my countenance changed in me: but I kept the matter in my heart.";
hnv[28] = "Here is the end of the matter. As for me, Daniyel, my thoughts much troubled me, and my face was changed in me: but I kept the matter in my heart.";
vul[28] = "Hucusque finis verbi. Ego Daniel multum cogitationibus meis conturbabar, et facies mea mutata est in me: verbum autem in corde meo conservavi.";
