dby[7] = "And your father has mocked me, and has changed my wages ten times; but God suffered him not to hurt me.";
web[7] = "And your father hath deceived me, and changed my wages ten times: but God suffered him not to hurt me.";
hnv[7] = "Your father has deceived me, and changed my wages ten times, but God didn\'t allow him to hurt me.";

dby[12] = "And he said, Lift up now thine eyes, and see: all the rams that leap upon the flock are ringstraked, speckled, and spotted; for I have seen all that Laban does to thee.";

rsv[18] = "and he drove away all his cattle, all his livestock which he had gained, the cattle in his possession which he had acquired in Paddan-aram, to go to the land of Canaan to his father Isaac.";

dby[19] = "And Laban had gone to shear his sheep. And Rachel stole the teraphim that [belonged] to her father.";
web[19] = "And Laban went to shear his sheep; and Rachel had stolen the images that [were] her father\'s.";
hnv[19] = "Now Lavan had gone to shear his sheep: and Rachel stole the terafim that were her father\'s.";

asv[20] = "And Jacob stole away unawares to Laban the Syrian, in that he told him not that he fled.";

dby[20] = "And Jacob deceived Laban the Syrian, in that he did not tell him that he fled.";

hnv[21] = "So he fled with all that he had. He rose up, passed over the River, and set his face toward the mountain of Gil`ad.";

rsv[22] = "When it was told Laban on the third day that Jacob had fled,";
asv[22] = "And it was told Laban on the third day that Jacob was fled.";
yng[22] = "And it is told to Laban on the third day that Jacob hath fled,";

asv[23] = "And he took his brethren with him, and pursued after him seven days\' journey; and he overtook him in the mountain of Gilead.";
yng[23] = "and he taketh his brethren with him, and pursueth after him a journey of seven days, and overtaketh him in the mount of Gilead.";
dby[23] = "And he took his brethren with him, and pursued after him seven days\' journey, and overtook him on mount Gilead.";
web[23] = "And he took his brethren with him, and pursued after him seven days\' journey: and they overtook him in the mount Gilead.";
hnv[23] = "He took his relatives with him, and pursued after him seven days\' journey. He overtook him in the mountain of Gil`ad.";

asv[24] = "And God came to Laban the Syrian in a dream of the night, and said unto him, Take heed to thyself that thou speak not to Jacob either good or bad.";
yng[24] = "And God cometh in unto Laban the Aramaean in a dream of the night, and saith to him, `Take heed to thyself lest thou speak with Jacob from good unto evil.\'";
dby[24] = "And God came to Laban the Syrian in a dream by night, and said to him, Take care thou speak not to Jacob either good or bad.";
web[24] = "And God came to Laban, the Syrian, in a dream by night, and said to him, Take heed that thou speak not to Jacob either good or bad.";
hnv[24] = "God came to Lavan, the Arammian, in a dream of the night, and said to him, &quot;Take heed to yourself that you don\'t speak to Ya`akov either good or bad.&quot;";
vul[24] = "viditque in somnis dicentem sibi Dominum cave ne quicquam aspere loquaris contra Iacob";
kjv[25] = "And Laban answered and said unto Jacob, [These] daughters [are] my daughters, and [these] children [are] my children, and [these] cattle [are] my cattle, and all that thou seest [is] mine: and what can I do this day unto these my daughters, or unto their children which they have born?";
rsv[25] = "And Laban overtook Jacob. Now Jacob had pitched his tent in the hill country, and Laban with his kinsmen encamped in the hill country of Gilead.";
asv[25] = "And Laban came up with Jacob. Now Jacob had pitched his tent in the mountain: and Laban with his brethren encamped in the mountain of Gilead.";
yng[25] = "And Laban overtaketh Jacob; and Jacob hath fixed his tent in the mount; and Laban with his brethren have fixed [theirs] in the mount of Gilead.";
dby[25] = "And Laban came up with Jacob; and Jacob had pitched his tent on the mountain; Laban also with his brethren pitched on mount Gilead.";
web[25] = "Then Laban overtook Jacob. Now Jacob had pitched his tent in the mount: and Laban, with his brethren, pitched in the mount of Gilead.";
hnv[25] = "Lavan caught up with Ya`akov. Now Ya`akov had pitched his tent in the mountain, and Lavan with his relatives encamped in the mountain of Gil`ad.";
vul[25] = "iamque Iacob extenderat in monte tabernaculum cum ille consecutus eum cum fratribus suis in eodem monte Galaad fixit tentorium";
kjv[26] = "Now therefore come thou, let us make a covenant, I and thou; and let it be for a witness between me and thee.";
rsv[26] = "And Laban said to Jacob, &quot;What have you done, that you have cheated me, and carried away my daughters like captives of the sword?";
asv[26] = "And Laban said to Jacob, What hast thou done, that thou hast stolen away unawares to me, and carried away my daughters as captives of the sword?";
yng[26] = "And Laban saith to Jacob, `What hast thou done that thou dost deceive my heart, and lead away my daughters as captives of the sword?";
dby[26] = "And Laban said to Jacob, What hast thou done, that thou hast deceived me, and hast carried away my daughters as captives of war?";
web[26] = "And Laban said to Jacob, What hast thou done, that thou hast stolen away unawares to me, and carried away my daughters, as captives [taken] with the sword?";
hnv[26] = "Lavan said to Ya`akov, &quot;What have you done, that you have deceived me, and carried away my daughters like captives of the sword?";
vul[26] = "et dixit ad Iacob quare ita egisti ut clam me abigeres filias meas quasi captivas gladio";
kjv[27] = "And Jacob took a stone, and set it up [for] a pillar.";
rsv[27] = "Why did you flee secretly, and cheat me, and did not tell me, so that I might have sent you away with mirth and songs, with tambourine and lyre?";
asv[27] = "Wherefore didst thou flee secretly, and steal away from me, and didst not tell me, that I might have sent thee away with mirth and with songs, with tabret and with harp;";
yng[27] = "Why hast thou hidden thyself to flee, and deceivest me, and hast not declared to me, and I send thee away with joy and with songs, with tabret and with harp,";
dby[27] = "Why didst thou flee away covertly, and steal away from me, and didst not tell me, that I might have conducted thee with mirth and with songs, with tambour and with harp;";
web[27] = "Why didst thou flee away secretly, and steal away from me, and didst not tell me, that I might have sent thee away with mirth, and with songs, with tabret, and with harp?";
hnv[27] = "Why did you flee secretly, and deceive me, and didn\'t tell me, that I might have sent you away with mirth and with songs, with tambourine and with harp;";
vul[27] = "cur ignorante me fugere voluisti nec indicare mihi ut prosequerer te cum gaudio et canticis et tympanis et cithara";
kjv[28] = "And Jacob said unto his brethren, Gather stones; and they took stones, and made an heap: and they did eat there upon the heap.";
rsv[28] = "And why did you not permit me to kiss my sons and my daughters farewell? Now you have done foolishly.";
asv[28] = "and didst not suffer me to kiss my sons and my daughters? now hast thou done foolishly.";
yng[28] = "and hast not suffered me to kiss my sons and my daughters? -- now thou hast acted foolishly in doing [so];";
dby[28] = "and hast not suffered me to kiss my sons and my daughters? Now thou hast acted foolishly.";
web[28] = "And hast not suffered me to kiss my sons, and my daughters? thou hast now done foolishly in [so] doing.";
hnv[28] = "and didn\'t allow me to kiss my sons and my daughters? Now have you done foolishly.";
vul[28] = "non es passus ut oscularer filios meos ac filias stulte operatus es et nunc";
kjv[29] = "And Laban called it Jegarsahadutha: but Jacob called it Galeed.";
rsv[29] = "It is in my power to do you harm; but the God of your father spoke to me last night, saying, \'Take heed that you speak to Jacob neither good nor bad.\'";
asv[29] = "It is in the power of my hand to do you hurt: but the God of your father spake unto me yesternight, saying, Take heed to thyself that thou speak not to Jacob either good or bad.";
yng[29] = "my hand is to God to do evil with you, but the God of your father yesternight hath spoken unto me, saying, Take heed to thyself from speaking with Jacob from good unto evil.";
dby[29] = "It would be in the power of my hand to do you hurt; but the God of your father spoke to me last night, saying, Take care that thou speak not to Jacob either good or bad.";
web[29] = "It is in the power of my hand to do you hurt: but the God of your father spoke to me yesternight, saying, Take thou heed that thou speak not to Jacob either good or bad.";
hnv[29] = "It is in the power of my hand to hurt you, but the God of your father spoke to me last night, saying, \'Take heed to yourself that you don\'t speak to Ya`akov either good or bad.\'";
vul[29] = "valet quidem manus mea reddere tibi malum sed Deus patris vestri heri dixit mihi cave ne loquaris cum Iacob quicquam durius";
kjv[30] = "And Laban said, This heap [is] a witness between me and thee this day. Therefore was the name of it called Galeed;";
rsv[30] = "And now you have gone away because you longed greatly for your father\'s house, but why did you steal my gods?&quot;";
asv[30] = "And now, [though] thou wouldest needs be gone, because thou sore longedst after thy father\'s house, [yet] wherefore hast thou stolen my gods?";
yng[30] = "`And now, thou hast certainly gone, because thou hast been very desirous for the house of thy father; why hast thou stolen my gods?\'";
dby[30] = "And now that thou must needs be gone, because thou greatly longedst after thy father\'s house, why hast thou stolen my gods?";
web[30] = "And now, [though] thou wouldest needs be gone, because thou didst earnestly long after thy father\'s house; [yet] why hast thou stolen my gods?";
hnv[30] = "Now, you want to be gone, because you sore longed after your father\'s house, but why have you stolen my gods?&quot;";
vul[30] = "esto ad tuos ire cupiebas et desiderio tibi erat domus patris tui cur furatus es deos meos";
kjv[31] = "And Mizpah; for he said, The LORD watch between me and thee, when we are absent one from another.";
rsv[31] = "Jacob answered Laban, &quot;Because I was afraid, for I thought that you would take your daughters from me by force.";
asv[31] = "And Jacob answered and said to Laban, Because I was afraid: for I said, Lest thou shouldest take thy daughters from me by force.";
yng[31] = "And Jacob answereth and saith to Laban, `Because I was afraid, for I said, Lest thou take violently away thy daughters from me;";
dby[31] = "And Jacob answered and said to Laban, I was afraid; for I said, Lest thou shouldest take by force thy daughters from me.";
web[31] = "And Jacob answered and said to Laban, Because I was afraid: for I said, It may be thou wouldest take thy daughters from me by force.";
hnv[31] = "Ya`akov answered Lavan, &quot;Because I was afraid, for I said, \'Lest you should take your daughters from me by force.\'";
vul[31] = "respondit Iacob quod inscio te profectus sum timui ne violenter auferres filias tuas";
kjv[32] = "If thou shalt afflict my daughters, or if thou shalt take [other] wives beside my daughters, no man [is] with us; see, God [is] witness betwixt me and thee.";
rsv[32] = "Any one with whom you find your gods shall not live. In the presence of our kinsmen point out what I have that is yours, and take it.&quot; Now Jacob did not know that Rachel had stolen them.";
asv[32] = "With whomsoever thou findest thy gods, he shall not live: before our brethren discern thou what is thine with me, and take it to thee. For Jacob knew not that Rachel had stolen them.";
yng[32] = "with whomsoever thou findest thy gods -- he doth not live; before our brethren discern for thyself what [is] with me, and take to thyself:\' and Jacob hath not known that Rachel hath stolen them.";
dby[32] = "With whomsoever thou findest thy gods, he shall not live. Before our brethren discern what is thine with me, and take [it] to thee. But Jacob did not know that Rachel had stolen them.";
web[32] = "With whomsoever thou findest thy gods, let him not live: before our brethren discern thou what [is] thine with me, and take [it] to thee: for Jacob knew not that Rachel had stolen them.";
hnv[32] = "With whoever you find your gods, he shall not live. Before our relatives, discern what is yours with me, and take it.&quot; For Ya`akov didn\'t know that Rachel had stolen them.";
vul[32] = "quod autem furti arguis apud quemcumque inveneris deos tuos necetur coram fratribus nostris scrutare quicquid tuorum apud me inveneris et aufer haec dicens ignorabat quod Rahel furata esset idola";
kjv[33] = "And Laban said to Jacob, Behold this heap, and behold [this] pillar, which I have cast betwixt me and thee;";
rsv[33] = "So Laban went into Jacob\'s tent, and into Leah\'s tent, and into the tent of the two maidservants, but he did not find them. And he went out of Leah\'s tent, and entered Rachel\'s.";
asv[33] = "And Laban went into Jacob\'s tent, and into Leah\'s tent, and into the tent of the two maid-servants; but he found them not. And he went out of Leah\'s tent, and entered into Rachel\'s tent.";
yng[33] = "And Laban goeth into the tent of Jacob, and into the tent of Leah, and into the tent of the two handmaidens, and hath not found; and he goeth out from the tent of Leah, and goeth into the tent of Rachel.";
dby[33] = "And Laban went into Jacob\'s tent, and into Leah\'s tent, and into the two handmaids\' tents, and found nothing; and he went out of Leah\'s tent, and entered into Rachel\'s tent.";
web[33] = "And Laban went into Jacob\'s tent, and into Leah\'s tent, and into the two maid-servants\' tents; but he found [them] not. Then he went out of Leah\'s tent, and entered into Rachel\'s tent.";
hnv[33] = "Lavan went into Ya`akov\'s tent, into Le\'ah\'s tent, and into the tent of the two maid-servants; but he didn\'t find them. He went out of Le\'ah\'s tent, and entered into Rachel\'s tent.";
vul[33] = "ingressus itaque Laban tabernaculum Iacob et Liae et utriusque famulae non invenit cumque intrasset tentorium Rahelis";
kjv[34] = "This heap [be] witness, and [this] pillar [be] witness, that I will not pass over this heap to thee, and that thou shalt not pass over this heap and this pillar unto me, for harm.";
rsv[34] = "Now Rachel had taken the household gods and put them in the camel\'s saddle, and sat upon them. Laban felt all about the tent, but did not find them.";
asv[34] = "Now Rachel had taken the teraphim, and put them in the camel\'s saddle, and sat upon them. And Laban felt about all the tent, but found them not.";
yng[34] = "And Rachel hath taken the teraphim, and putteth them in the furniture of the camel, and sitteth upon them; and Laban feeleth all the tent, and hath not found;";
dby[34] = "Now Rachel had taken the teraphim and put them under the camel\'s saddle; and she sat upon them. And Laban explored all the tent, but found nothing.";
web[34] = "Now Rachel had taken the images, and put them in the camel\'s furniture, and sat upon them. And Laban searched all the tent, but found [them] not.";
hnv[34] = "Now Rachel had taken the terafim, put them in the camel\'s saddle, and sat on them. Lavan felt about all the tent, but didn\'t find them.";
vul[34] = "illa festinans abscondit idola subter stramen cameli et sedit desuper scrutantique omne tentorium et nihil invenienti";
kjv[35] = "The God of Abraham, and the God of Nahor, the God of their father, judge betwixt us. And Jacob sware by the fear of his father Isaac.";
rsv[35] = "And she said to her father, &quot;Let not my lord be angry that I cannot rise before you, for the way of women is upon me.&quot; So he searched, but did not find the household gods.";
asv[35] = "And she said to her father, Let not my lord be angry that I cannot rise up before thee; for the manner of women is upon me. And he searched, but found not the teraphim.";
yng[35] = "and she saith unto her father, `Let it not be displeasing in the eyes of my lord that I am not able to rise at thy presence, for the way of women [is] on me;\' and he searcheth, and hath not found the teraphim.";
dby[35] = "And she said to her father, Let it not be an occasion of anger in the eyes of my lord that I cannot rise up before thee, for it is with me after the manner of women. And he searched carefully, but did not find the teraphim.";
web[35] = "And she said to her father, Let it not displease my lord that I cannot rise up before thee; for the custom of women [is] upon me. And he searched, but found not the images.";
hnv[35] = "She said to her father, &quot;Don\'t let my lord be angry that I can\'t rise up before you; for the manner of women is on me.&quot; He searched, but didn\'t find the terafim.";
vul[35] = "ait ne irascatur dominus meus quod coram te adsurgere nequeo quia iuxta consuetudinem feminarum nunc accidit mihi sic delusa sollicitudo quaerentis est";
kjv[36] = "Then Jacob offered sacrifice upon the mount, and called his brethren to eat bread: and they did eat bread, and tarried all night in the mount.";
rsv[36] = "Then Jacob became angry, and upbraided Laban; Jacob said to Laban, &quot;What is my offense? What is my sin, that you have hotly pursued me?";
asv[36] = "And Jacob was wroth, and chode with Laban: and Jacob answered and said to Laban, What is my trespass? what is my sin, that thou hast hotly pursued after me?";
yng[36] = "And it is displeasing to Jacob, and he striveth with Laban; and Jacob answereth and saith to Laban, `What [is] my transgression? what my sin, that thou hast burned after me?";
dby[36] = "And Jacob was angry, and he disputed with Laban. And Jacob answered and said to Laban, What is my fault, what my sin, that thou hast so hotly pursued after me?";
web[36] = "And Jacob was wroth, and chid with Laban: and Jacob answered, and said to Laban, What [is] my trespass? what [is] my sin, that thou hast so eagerly pursued after me?";
hnv[36] = "Ya`akov was angry, and argued with Lavan. Ya`akov answered Lavan, &quot;What is my trespass? What is my sin, that you have hotly pursued after me?";
vul[36] = "tumensque Iacob cum iurgio ait quam ob culpam meam et ob quod peccatum sic exarsisti post me";
kjv[37] = "And early in the morning Laban rose up, and kissed his sons and his daughters, and blessed them: and Laban departed, and returned unto his place.";
rsv[37] = "Although you have felt through all my goods, what have you found of all your household goods? Set it here before my kinsmen and your kinsmen, that they may decide between us two.";
asv[37] = "Whereas thou hast felt about all my stuff, what hast thou found of all thy household stuff? Set it here before my brethren and thy brethren, that they may judge betwixt us two.";
yng[37] = "for thou hast felt all my vessels: what hast thou found of all the vessels of thy house? set here before my brethren, and thy brethren, and they decide between us both.";
dby[37] = "Whereas thou hast explored all my baggage, what hast thou found of all thy household stuff? Set [it] here before my brethren and thy brethren, and let them decide between us both.";
web[37] = "Whereas thou hast searched all my stuff, what hast thou found of all thy household-stuff? set [it] here before my brethren, and thy brethren, that they may judge betwixt us both.";
hnv[37] = "Now that you have felt around in all my stuff, what have you found of all your household stuff? Set it here before my relatives and your relatives, that they may judge between us two.";
vul[37] = "et scrutatus es omnem supellectilem meam quid invenisti de cuncta substantia domus tuae pone hic coram fratribus meis et fratribus tuis et iudicent inter me et te";
kjv[38] = "And he heard the words of Laban\'s sons, saying, Jacob hath taken away all that [was] our father\'s; and of [that] which [was] our father\'s hath he gotten all this glory.";
rsv[38] = "These twenty years I have been with you; your ewes and your she-goats have not miscarried, and I have not eaten the rams of your flocks.";
asv[38] = "These twenty years have I been with thee; thy ewes and thy she-goats have not cast their young, and the rams of thy flocks have I not eaten.";
yng[38] = "`These twenty years I [am] with thee: thy ewes and thy she-goats have not miscarried, and the rams of thy flock I have not eaten;";
dby[38] = "These twenty years have I been with thee: thy ewes and thy she-goats have not cast their young, and the rams of thy flock I have not eaten.";
web[38] = "These twenty years [have] I [been] with thee: thy ewes and thy she-goats have not cast their young, and the rams of thy flock have I not eaten.";
hnv[38] = "These twenty years have I been with you. Your ewes and your female goats have not cast their young, and I haven\'t eaten the rams of your flocks.";
vul[38] = "idcirco viginti annis fui tecum oves tuae et caprae steriles non fuerunt arietes gregis tui non comedi";
kjv[39] = "And Jacob beheld the countenance of Laban, and, behold, it [was] not toward him as before.";
rsv[39] = "That which was torn by wild beasts I did not bring to you; I bore the loss of it myself; of my hand you required it, whether stolen by day or stolen by night.";
asv[39] = "That which was torn of beasts I brought not unto thee; I bare the loss of it; of my hand didst thou require it, whether stolen by day or stolen by night.";
yng[39] = "the torn I have not brought in unto thee -- I, I repay it -- from my hand thou dost seek it; I have been deceived by day, and I have been deceived by night;";
dby[39] = "What was torn I have not brought to thee; I had to bear the loss of it: of my hand hast thou required it, [whether] stolen by day or stolen by night.";
web[39] = "That which was torn by beasts, I brought not to thee; I bore the loss of it; of my hand didst thou require it, [whether] stolen by day, or stolen by night.";
hnv[39] = "That which was torn of animals, I didn\'t bring to you. I bore the loss of it. Of my hand you required it, whether stolen by day or stolen by night.";
vul[39] = "nec captum a bestia ostendi tibi ego damnum omne reddebam quicquid furto perierat a me exigebas";
kjv[40] = "And the LORD said unto Jacob, Return unto the land of thy fathers, and to thy kindred; and I will be with thee.";
rsv[40] = "Thus I was; by day the heat consumed me, and the cold by night, and my sleep fled from my eyes.";
asv[40] = "Thus I was; in the day the drought consumed me, and the frost by night; and my sleep fled from mine eyes.";
yng[40] = "I have been [thus]: in the day consumed me hath drought, and frost by night, and wander doth my sleep from mine eyes.";
dby[40] = "Thus it was with me: in the day the heat consumed me, and the frost by night; and my sleep fled from mine eyes.";
web[40] = "[Thus] I was; in the day the drouth consumed me, and the frost by night; and my sleep departed from my eyes.";
hnv[40] = "Thus I was; in the day the drought consumed me, and the frost by night; and my sleep fled from my eyes.";
vul[40] = "die noctuque aestu urebar et gelu fugiebat somnus ab oculis meis";
kjv[41] = "And Jacob sent and called Rachel and Leah to the field unto his flock,";
rsv[41] = "These twenty years I have been in your house; I served you fourteen years for your two daughters, and six years for your flock, and you have changed my wages ten times.";
asv[41] = "These twenty years have I been in thy house; I served thee fourteen years for thy two daughters, and six years for thy flock: and thou hast changed my wages ten times.";
yng[41] = "`This [is] to me twenty years in thy house: I have served thee fourteen years for thy two daughters, and six years for thy flock; and thou changest my hire ten times;";
dby[41] = "I have been these twenty years in thy house: I have served thee fourteen years for thy two daughters, and six years for thy flock; and thou hast changed my wages ten times.";
web[41] = "Thus have I been twenty years in thy house: I served thee fourteen years for thy two daughters, and six years for thy cattle: and thou hast changed my wages ten times.";
hnv[41] = "These twenty years have I been in your house. I served you fourteen years for your two daughters, and six years for your flock, and you have changed my wages ten times.";
vul[41] = "sic per viginti annos in domo tua servivi tibi quattuordecim pro filiabus et sex pro gregibus tuis inmutasti quoque mercedem meam decem vicibus";
kjv[42] = "And said unto them, I see your father\'s countenance, that it [is] not toward me as before; but the God of my father hath been with me.";
rsv[42] = "If the God of my father, the God of Abraham and the Fear of Isaac, had not been on my side, surely now you would have sent me away empty-handed. God saw my affliction and the labor of my hands, and rebuked you last night.&quot;";
asv[42] = "Except the God of my father, the God of Abraham, and the Fear of Isaac, had been with me, surely now hadst thou sent me away empty. God hath seen mine affliction and the labor of my hands, and rebuked thee yesternight.";
yng[42] = "unless the God of my father, the God of Abraham, and the Fear of Isaac, had been for me, surely now empty thou hadst sent me away; mine affliction and the labour of my hands hath God seen, and reproveth yesternight.\'";
dby[42] = "Had not the God of my father, the God of Abraham, and the fear of Isaac, been with me, it is certain thou wouldest have sent me away now empty. God has looked upon my affliction and the labour of my hands, and has judged last night.";
web[42] = "Except the God of my father, the God of Abraham, and the fear of Isaac had been with me, surely thou hadst now sent me away empty. God hath seen my affliction, and the labor of my hands, and rebuked [thee] yesternight.";
hnv[42] = "Unless the God of my father, the God of Avraham, and the fear of Yitzchak, had been with me, surely now you would have sent me away empty. God has seen my affliction and the labor of my hands, and rebuked you last night.&quot;";
vul[42] = "nisi Deus patris mei Abraham et Timor Isaac adfuisset mihi forsitan modo nudum me dimisisses adflictionem meam et laborem manuum mearum respexit Deus et arguit te heri";
kjv[43] = "And ye know that with all my power I have served your father.";
rsv[43] = "Then Laban answered and said to Jacob, &quot;The daughters are my daughters, the children are my children, the flocks are my flocks, and all that you see is mine. But what can I do this day to these my daughters, or to their children whom they have borne?";
asv[43] = "And Laban answered and said unto Jacob, The daughters are my daughters, and the children are my children, and the flocks are my flocks, and all that thou seest is mine: and what can I do this day unto these my daughters, or unto their children whom they have borne?";
yng[43] = "And Laban answereth and saith unto Jacob, `The daughters [are] my daughters, and the sons my sons, and the flock my flock, and all that thou art seeing [is] mine; and to my daughters -- what do I to these to-day, or to their sons whom they have born?";
dby[43] = "And Laban answered and said to Jacob, The daughters are my daughters, and the sons are my sons, and the flock is my flock, and all that thou seest is mine; but as for my daughters, what can I do this day to them, or to their sons whom they have brought forth?";
web[43] = "And Laban answered, and said to Jacob, [These] daughters [are] my daughters, and [these] children [are] my children, and [these] cattle [are] my cattle, and all that thou seest [is] mine; and what can I do this day to these my daughters, or to their children which they have borne?";
hnv[43] = "Lavan answered Ya`akov, &quot;The daughters are my daughters, the children are my children, the flocks are my flocks, and all that you see is mine: and what can I do this day to these my daughters, or to their children whom they have borne?";
vul[43] = "respondit ei Laban filiae et filii et greges tui et omnia quae cernis mea sunt quid possum facere filiis et nepotibus meis";
kjv[44] = "And your father hath deceived me, and changed my wages ten times; but God suffered him not to hurt me.";
rsv[44] = "Come now, let us make a covenant, you and I; and let it be a witness between you and me.&quot;";
asv[44] = "And now come, let us make a covenant, I and thou; and let it be for a witness between me and thee.";
yng[44] = "and now, come, let us make a covenant, I and thou, and it hath been for a witness between me and thee.\'";
dby[44] = "And now, come, let us make a covenant, I and thou; and let it be a witness between me and thee.";
web[44] = "Now therefore come thou, let us make a covenant, I and thou; and let it be for a witness between me and thee.";
hnv[44] = "Now come, let us make a covenant, you and I; and let it be for a witness between me and you.&quot;";
vul[44] = "veni ergo et ineamus foedus ut sit testimonium inter me et te";
kjv[45] = "If he said thus, The speckled shall be thy wages; then all the cattle bare speckled: and if he said thus, The ringstraked shall be thy hire; then bare all the cattle ringstraked.";
rsv[45] = "So Jacob took a stone, and set it up as a pillar.";
asv[45] = "And Jacob took a stone, and set it up for a pillar.";
yng[45] = "And Jacob taketh a stone, and lifteth it up [for] a standing pillar;";
dby[45] = "And Jacob took a stone, and set it up [for] a pillar.";
web[45] = "And Jacob took a stone, and set it up [for] a pillar.";
hnv[45] = "Ya`akov took a stone, and set it up for a pillar.";
vul[45] = "tulit itaque Iacob lapidem et erexit illum in titulum";
kjv[46] = "Thus God hath taken away the cattle of your father, and given [them] to me.";
rsv[46] = "And Jacob said to his kinsmen, &quot;Gather stones,&quot; and they took stones, and made a heap; and they ate there by the heap.";
asv[46] = "And Jacob said unto his brethren, Gather stones; and they took stones, and made a heap: and they did eat there by the heap.";
yng[46] = "and Jacob saith to his brethren, `Gather stones,\' and they take stones, and make a heap; and they eat there on the heap;";
dby[46] = "And Jacob said to his brethren, Gather stones. And they took stones, and made a heap, and ate there upon the heap.";
web[46] = "And Jacob said to his brethren, Gather stones; and they took stones, and made a heap: and they ate there upon the heap.";
hnv[46] = " Ya`akov said to his relatives, &quot;Gather stones.&quot; They took stones, and made a heap. They ate there by the heap.";

rsv[47] = "Laban called it Je\'gar-sahadu\'tha: but Jacob called it Galeed.";
asv[47] = "And Laban called it Jegar-saha-dutha: but Jacob called it Galeed.";
yng[47] = "and Laban calleth it Jegar-Sahadutha; and Jacob hath called it Galeed.";
dby[47] = "And Laban called it Jegar-sahadutha, and Jacob called it Galeed.";

hnv[47] = "Lavan called it Yegar-Sahaduta, but Ya`akov called it Gal`ed.";

kjv[48] = "And the angel of God spake unto me in a dream, [saying], Jacob: And I said, Here [am] I.";
rsv[48] = "Laban said, &quot;This heap is a witness between you and me today.&quot; Therefore he named it Galeed,";
asv[48] = "And Laban said, This heap is witness between me and thee this day. Therefore was the name of it called Galeed:";
yng[48] = "And Laban saith, `This heap [is] witness between me and thee to-day;\' therefore hath he called its name Galeed;";
dby[48] = "And Laban said, This heap is a witness between me and thee this day. Therefore was the name of it called Galeed,";

kjv[49] = "And he said, Lift up now thine eyes, and see, all the rams which leap upon the cattle [are] ringstraked, speckled, and grisled: for I have seen all that Laban doeth unto thee.";
rsv[49] = "and the pillar Mizpah, for he said, &quot;The LORD watch between you and me, when we are absent one from the other.";
asv[49] = "and Mizpah, for he said, Jehovah watch between me and thee, when we are absent one from another.";
yng[49] = "Mizpah also, for he said, `Jehovah doth watch between me and thee, for we are hidden one from another;";
dby[49] = "-- and Mizpah; for he said, Let Jehovah watch between me and thee, when we shall be hidden one from another:";
web[49] = "And Mizpah; for he said, The LORD watch between me and thee, when we are absent one from another.";
hnv[49] = "and Mitzpah, for he said, &quot;The LORD watch between me and you, when we are absent one from another.";

kjv[50] = "I [am] the God of Bethel, where thou anointedst the pillar, [and] where thou vowedst a vow unto me: now arise, get thee out from this land, and return unto the land of thy kindred.";
rsv[50] = "If you ill-treat my daughters, or if you take wives besides my daughters, although no man is with us, remember, God is witness between you and me.&quot;";
asv[50] = "If thou shalt afflict my daughters, and if thou shalt take wives besides my daughters, no man is with us; see, God is witness betwixt me and thee.";
yng[50] = "if thou afflict my daughters, or take wives beside my daughters -- there is no man with us -- see, God [is] witness between me and thee.\'";
dby[50] = "if thou shouldest afflict my daughters, or if thou shouldest take wives besides my daughters, -- no man is with us; see, God is witness between me and thee!";
web[50] = "If thou shalt afflict my daughters, or if thou shalt take [other] wives besides my daughters; no man [is] with us; See, God [is] witness betwixt me and thee.";
hnv[50] = "If you will afflict my daughters, and if you will take wives besides my daughters, no man is with us; behold, God is witness between me and you.&quot;";
vul[50] = "si adflixeris filias meas et si introduxeris uxores alias super eas nullus sermonis nostri testis est absque Deo qui praesens respicit";
kjv[51] = "And Rachel and Leah answered and said unto him, [Is there] yet any portion or inheritance for us in our father\'s house?";
rsv[51] = "Then Laban said to Jacob, &quot;See this heap and the pillar, which I have set between you and me.";
asv[51] = "And Laban said to Jacob, Behold this heap, and behold the pillar, which I have set betwixt me and thee.";
yng[51] = "And Laban saith to Jacob, `Lo, this heap, and lo, the standing pillar which I have cast between me and thee;";
dby[51] = "And Laban said to Jacob, Behold this heap, and behold the pillar which I have set up between me and thee:";
web[51] = "And Laban said to Jacob, Behold this heap, and behold [this] pillar, which I have cast betwixt me and thee;";
hnv[51] = "Lavan said to Ya`akov, &quot;See this heap, and see the pillar, which I have set between me and you.";
vul[51] = "dixitque rursus ad Iacob en tumulus hic et lapis quem erexi inter me et te";
kjv[52] = "Are we not counted of him strangers? for he hath sold us, and hath quite devoured also our money.";
rsv[52] = "This heap is a witness, and the pillar is a witness, that I will not pass over this heap to you, and you will not pass over this heap and this pillar to me, for harm.";
asv[52] = "This heap be witness, and the pillar be witness, that I will not pass over this heap to thee, and that thou shalt not pass over this heap and this pillar unto me, for harm.";
yng[52] = "this heap [is] witness, and the standing pillar [is] witness, that I do not pass over this heap unto thee, and that thou dost not pass over this heap and this standing pillar unto me -- for evil;";
dby[52] = "[let] this heap be witness, and the pillar a witness, that neither I pass this heap [to go] to thee, nor thou pass this heap and this pillar [to come] to me, for harm.";
web[52] = "This heap [be] witness, and [this] pillar [be] witness, that I will not pass over this heap to thee, and that thou shalt not pass over this heap and this pillar to me, for harm.";
hnv[52] = "May this heap be a witness, and the pillar be a witness, that I will not pass over this heap to you, and that you will not pass over this heap and this pillar to me, for harm.";
vul[52] = "testis erit tumulus inquam iste et lapis sint in testimonio si aut ego transiero illum pergens ad te aut tu praeterieris malum mihi cogitans";
kjv[53] = "For all the riches which God hath taken from our father, that [is] ours, and our children\'s: now then, whatsoever God hath said unto thee, do.";
rsv[53] = "The God of Abraham and the God of Nahor, the God of their father, judge between us.&quot; So Jacob swore by the Fear of his father Isaac,";
asv[53] = "The God of Abraham, and the God of Nahor, the God of their father, judge betwixt us. And Jacob sware by the Fear of his father Isaac.";
yng[53] = "the God of Abraham and the God of Nahor, doth judge between us -- the God of their father,\' and Jacob sweareth by the Fear of his father Isaac.";
dby[53] = "The God of Abraham, and the God of Nahor, the God of their father, judge between us! And Jacob swore by the fear of his father Isaac.";
web[53] = "The God of Abraham, and the God of Nahor, the God of their father, judge betwixt us. And Jacob swore by the fear of his father Isaac.";
hnv[53] = " The God of Avraham, and the God of Nachor, the God of their father, judge between us.&quot; Then Ya`akov swore by the fear of his father, Yitzchak.";
vul[53] = "Deus Abraham et Deus Nahor iudicet inter nos Deus patris eorum iuravit Iacob per Timorem patris sui Isaac";
kjv[54] = "Then Jacob rose up, and set his sons and his wives upon camels;";
rsv[54] = "and Jacob offered a sacrifice on the mountain and called his kinsmen to eat bread; and they ate bread and tarried all night on the mountain.";
asv[54] = "And Jacob offered a sacrifice in the mountain, and called his brethren to eat bread: and they did eat bread, and tarried all night in the mountain.";
yng[54] = "And Jacob sacrificeth a sacrifice in the mount, and calleth to his brethren to eat bread, and they eat bread, and lodge in the mount;";
dby[54] = "And Jacob offered a sacrifice upon the mountain, and invited his brethren to eat bread: and they ate bread, and lodged on the mountain.";
web[54] = "Then Jacob offered sacrifice upon the mount, and called his brethren to eat bread: and they ate bread, and tarried all night in the mount.";
hnv[54] = "Ya`akov offered a sacrifice in the mountain, and called his relatives to eat bread. They ate bread, and stayed all night in the mountain.";
vul[54] = "immolatisque victimis in monte vocavit fratres suos ut ederent panem qui cum comedissent manserunt ibi";
kjv[55] = "And he carried away all his cattle, and all his goods which he had gotten, the cattle of his getting, which he had gotten in Padanaram, for to go to Isaac his father in the land of Canaan.";
rsv[55] = "Early in the morning Laban arose, and kissed his grandchildren and his daughters and blessed them; then he departed and returned home.";
asv[55] = "And early in the morning Laban rose up, and kissed his sons and his daughters, and blessed them: and Laban departed, and returned unto his place.";
yng[55] = "and Laban riseth early in the morning, and kisseth his sons and his daughters, and blesseth them; and Laban goeth on, and turneth back to his place.";
dby[55] = "And Laban rose early in the morning, and kissed his sons and his daughters, and blessed them; and Laban went and returned to his place.";
web[55] = "And early in the morning Laban arose, and kissed his sons and his daughters, and blessed them: and Laban departed, and returned to his place.";
hnv[55] = "Early in the morning, Lavan rose up, and kissed his sons and his daughters, and blessed them. Lavan departed and returned to his place.";
vul[55] = "Laban vero de nocte consurgens osculatus est filios et filias suas et benedixit illis reversus in locum suum";
csb[1] = "Now Jacob heard what Laban\'s sons were saying: &quot;Jacob has taken all that was our father\'s and has built this wealth from what belonged to our father.&quot;";
csb[2] = "And Jacob saw from Laban\'s face that his attitude toward him was not the same as before.";
csb[3] = "The LORD said to him, &quot;Go back to the land of your fathers and to your family, and I will be with you.&quot;";
csb[4] = "Jacob had Rachel and Leah called to the field where his flocks were.";
csb[5] = "He said to them, &quot;I can see from your father\'s face that his attitude toward me is not the same as before, but the God of my father has been with me.";
csb[6] = "&quot;You know that with all my strength I have served your father";
csb[7] = "&quot;and that he has cheated me and changed my wages ten times. But God has not let him harm me.";
csb[8] = "&quot;If he said, \'The spotted sheep will be your wages,\' then all the sheep were born spotted. If he said, \'The streaked sheep will be your wages,\' then all the sheep were born streaked.";
csb[9] = "&quot;God has taken away your father\'s herds and given them to me.";
csb[10] = "&quot;When the flocks were breeding, I saw in a dream that the streaked, spotted, and speckled males were mating with the females.";
csb[11] = "&quot;In that dream the angel of God said to me, \'Jacob! \' and I said, \'Here I am.\'";
csb[12] = "&quot;And he said, \'Look up and see: all the males that are mating with the flocks are streaked, spotted, and speckled, for I have seen all that Laban has been doing to you.";
csb[13] = "&quot;I am the God of Bethel, where you poured oil on the stone marker and made a solemn vow to me. Get up, leave this land, and return to your native land.\' &quot;";
csb[14] = "Then Rachel and Leah answered him, &quot;Do we have any portion or inheritance in our father\'s family?";
csb[15] = "&quot;Are we not regarded by him as outsiders? For he has sold us and has certainly spent our purchase price.";
csb[16] = "&quot;In fact, all the wealth that God has taken away from our father belongs to us and to our children. So do whatever God has said to you.&quot;";
csb[17] = "So Jacob got up and put his children and wives on the camels.";
csb[18] = "He took all the livestock and possessions he had acquired in Paddan-aram, and he drove his herds to go to the land of Canaan, to his father Isaac.";
csb[19] = "When Laban had gone to shear his sheep, Rachel stole her father\'s household idols.";
csb[20] = "And Jacob deceived Laban the Aramean, not telling him that he was fleeing.";
csb[21] = "He fled with all his possessions, crossed the Euphrates, and headed for the hill country of Gilead.";
csb[22] = "On the third day Laban was told that Jacob had fled.";
csb[23] = "So he took his relatives with him, pursued Jacob for seven days, and overtook him in the hill country of Gilead.";
csb[24] = "But God came to Laban the Aramean in a dream at night. &quot;Watch yourself! &quot; God warned him. &quot;Don\'t say anything to Jacob, either good or bad.&quot;";
csb[25] = "When Laban overtook Jacob, Jacob had pitched his tent in the hill country, and Laban and his relatives also pitched their tents in the hill country of Gilead.";
csb[26] = "Laban said to Jacob, &quot;What have you done? You have deceived me and taken my daughters away like prisoners of war!";
csb[27] = "&quot;Why did you secretly flee from me, deceive me, and not tell me? I would have sent you away with joy and singing, with tambourines and lyres,";
csb[28] = "&quot;but you didn\'t even let me kiss my grandchildren and my daughters. You have acted foolishly.";
csb[29] = "&quot;I could do you great harm, but last night the God of your father said to me: \'Watch yourself! Don\'t say anything to Jacob, either good or bad.\'";
csb[30] = "&quot;Now you have gone off because you long for your father\'s family -- but why have you stolen my gods? &quot;";
csb[31] = "Jacob answered, &quot;I was afraid, for I thought you would take your daughters from me by force.";
csb[32] = "&quot;If you find your gods with anyone here, he will not live! Before our relatives, point out anything that is yours and take it.&quot; Jacob did not know that Rachel had stolen the idols.";
csb[33] = "So Laban went into Jacob\'s tent, Leah\'s tent, and the tents of the two concubines, but he found nothing. When he left Leah\'s tent, he went into Rachel\'s tent.";
csb[34] = "Now Rachel had taken Laban\'s household idols, put them in the saddlebag of the camel, and sat on them. Laban searched the whole tent but found nothing.";
csb[35] = "She said to her father, &quot;Don\'t be angry, my lord, that I cannot stand up in your presence; I am having my period.&quot; So Laban searched, but could not find the household idols.";
csb[36] = "Then Jacob became incensed and brought charges against Laban. &quot;What is my crime? &quot; he said to Laban. &quot;What is my sin, that you have pursued me?";
csb[37] = "&quot;You\'ve searched all my possessions! Have you found anything of yours? Put it here before my relatives and yours, and let them decide between the two of us.";
csb[38] = "&quot;I\'ve been with you these twenty years. Your ewes and female goats have not miscarried, and I have not eaten the rams from your flock.";
csb[39] = "&quot;I did not bring you any of the flock torn by wild beasts; I myself bore the loss. You demanded payment from me for what was stolen by day or by night.";
csb[40] = "&quot;There I was -- the heat consumed me by day and the frost by night, and sleep fled from my eyes.";
csb[41] = "&quot;For twenty years in your household I served you -- fourteen years for your two daughters and six years for your flocks -- and you have changed my wages ten times!";
csb[42] = "&quot;If the God of my father, the God of Abraham, the Fear of Isaac, had not been with me, certainly now you would have sent me off empty-handed. But God has seen my affliction and my hard work, and he issued his verdict last night.&quot;";
csb[43] = "Then Laban answered Jacob, &quot;The daughters are my daughters; the sons, my sons; and the flocks, my flocks! Everything you see is mine! But what can I do today for these daughters of mine or for the children they have borne?";
csb[44] = "&quot;Come now, let\'s make a covenant, you and I. Let it be a witness between the two of us.&quot;";
csb[45] = "So Jacob picked out a stone and set it up as a marker.";
csb[46] = "Then Jacob said to his relatives, &quot;Gather stones.&quot; And they took stones and made a mound, then ate there by the mound.";
csb[47] = "Laban named the mound Jegar-sahadutha, but Jacob named it Galeed.";
csb[48] = "Then Laban said, &quot;This mound is a witness between you and me today.&quot; Therefore the place was called Galeed";
csb[49] = "and also Mizpah, for he said, &quot;May the LORD watch between you and me when we are out of each other\'s sight.";
csb[50] = "&quot;If you mistreat my daughters or take other wives, though no one is with us, understand that God will be a witness between you and me.&quot;";
csb[51] = "Laban also said to Jacob, &quot;Look at this mound and the marker I have set up between you and me.";
csb[52] = "&quot;This mound is a witness and the marker is a witness that I will not pass beyond this mound to you, and you will not pass beyond this mound and this marker to do me harm.";
csb[53] = "&quot;The God of Abraham, and the gods of Nahor -- the gods of their father -- will judge between us.&quot; And Jacob swore by the Fear of his father Isaac.";
csb[54] = "Then Jacob offered a sacrifice on the mountain and invited his relatives to eat a meal. So they ate a meal and spent the night on the mountain.";
csb[55] = "Laban got up early in the morning, kissed his grandchildren and daughters, and blessed them. Then Laban left to return home.";
</script>
