csb[1] = "These are the family records of Esau (that is, Edom).";
csb[2] = "Esau took his wives from the Canaanite women: Adah daughter of Elon the Hethite, Oholibamah daughter of Anah and granddaughter of Zibeon the Hivite,";
csb[3] = "and Basemath daughter of Ishmael and sister of Nebaioth.";
csb[4] = "Adah bore Eliphaz to Esau, Basemath bore Reuel,";
csb[5] = "and Oholibamah bore Jeush, Jalam, and Korah. These were Esau\'s sons, who were born to him in the land of Canaan.";
csb[6] = "Esau took his wives, sons, daughters, and all the people of his household, as well as his herds, all his livestock, and all the property he had acquired in Canaan; he went to a land away from his brother Jacob.";
csb[7] = "For their possessions were too many for them to live together, and because of their herds, the land where they stayed could not support them.";
csb[8] = "So Esau (that is, Edom) lived in the mountains of Seir.";
csb[9] = "These are the family records of Esau, father of the Edomites in the mountains of Seir.";
csb[10] = "These are the names of Esau\'s sons: Eliphaz son of Esau\'s wife Adah, and Reuel son of Esau\'s wife Basemath.";
csb[11] = "The sons of Eliphaz were Teman, Omar, Zepho, Gatam, and Kenaz.";
csb[12] = "Timna, a concubine of Esau\'s son Eliphaz, bore Amalek to Eliphaz. These are the sons of Esau\'s wife Adah.";
csb[13] = "These are Reuel\'s sons: Nahath, Zerah, Shammah, and Mizzah. These are the sons of Esau\'s wife Basemath.";
csb[14] = "These are the sons of Esau\'s wife Oholibamah daughter of Anah and granddaughter of Zibeon: She bore Jeush, Jalam, and Korah to Edom.";
csb[15] = "These are the chiefs among Esau\'s sons: the sons of Eliphaz, Esau\'s firstborn: chief Teman, chief Omar, chief Zepho, chief Kenaz,";
csb[16] = "chief Korah, chief Gatam, and chief Amalek. These are the chiefs descended from Eliphaz in the land of Edom. These are the sons of Adah.";
csb[17] = "These are the sons of Reuel, Esau\'s son: chief Nahath, chief Zerah, chief Shammah, and chief Mizzah. These are the chiefs descended from Reuel in the land of Edom. These are the sons of Esau\'s wife Basemath.";
csb[18] = "These are the sons of Esau\'s wife Oholibamah: chief Jeush, chief Jalam, and chief Korah. These are the chiefs descended from Esau\'s wife Oholibamah daughter of Anah.";
csb[19] = "These are the sons of Esau (that is, Edom), and these are their chiefs.";
csb[20] = "These are the sons of Seir the Horite, the inhabitants of the land: Lotan, Shobal, Zibeon, Anah,";
csb[21] = "Dishon, Ezer, and Dishan. These are the chiefs among the Horites, the sons of Seir, in the land of Edom.";
csb[22] = "The sons of Lotan were Hori and Heman. Timna was Lotan\'s sister.";
csb[23] = "These are Shobal\'s sons: Alvan, Manahath, Ebal, Shepho, and Onam.";
csb[24] = "These are Zibeon\'s sons: Aiah and Anah. This was the Anah who found the hot springs in the wilderness while he was pasturing the donkeys of his father Zibeon.";
csb[25] = "These are the children of Anah: Dishon and Oholibamah daughter of Anah.";
csb[26] = "These are Dishon\'s sons: Hemdan, Eshban, Ithran, and Cheran.";
csb[27] = "These are Ezer\'s sons: Bilhan, Zaavan, and Akan.";
csb[28] = "These are Dishan\'s sons: Uz and Aran.";
csb[29] = "These are the chiefs among the Horites: chief Lotan, chief Shobal, chief Zibeon, chief Anah,";
csb[30] = "chief Dishon, chief Ezer, and chief Dishan. These are the chiefs among the Horites, clan by clan, in the land of Seir.";
csb[31] = "These are the kings who reigned in the land of Edom before any king reigned over the Israelites:";
csb[32] = "Bela son of Beor reigned in Edom; the name of his city was Dinhabah.";
csb[33] = "When Bela died, Jobab son of Zerah from Bozrah reigned in his place.";
csb[34] = "When Jobab died, Husham from the land of the Temanites reigned in his place.";
csb[35] = "When Husham died, Hadad son of Bedad reigned in his place. He defeated Midian in the field of Moab; the name of his city was Avith.";
csb[36] = "When Hadad died, Samlah from Masrekah reigned in his place.";
csb[37] = "When Samlah died, Shaul from Rehoboth on the Euphrates River reigned in his place.";
csb[38] = "When Shaul died, Baal-hanan son of Achbor reigned in his place.";
csb[39] = "When Baal-hanan son of Achbor died, Hadar reigned in his place. His city was Pau, and his wife\'s name was Mehetabel daughter of Matred daughter of Me-zahab.";
csb[40] = "These are the names of Esau\'s chiefs, according to their families and their localities, by their names: chief Timna, chief Alvah, chief Jetheth,";
csb[41] = "chief Oholibamah, chief Elah, chief Pinon,";
csb[42] = "chief Kenaz, chief Teman, chief Mibzar,";
csb[43] = "chief Magdiel, and chief Iram. These are Edom\'s chiefs, according to their settlements in the land they possessed. Esau was father of the Edomites.";
