csb[1] = "After these events, the word of the LORD came to Abram in a vision: Do not be afraid, Abram. I am your shield; your reward will be very great.";
csb[2] = "But Abram said, &quot;Lord GOD, what can you give me, since I am childless and the heir of my house is Eliezer of Damascus? &quot;";
csb[3] = "Abram continued, &quot;Look, you have given me no offspring, so a slave born in my house will be my heir.&quot;";
csb[4] = "Now the word of the LORD came to him: &quot;This one will not be your heir; instead, one who comes from your own body will be your heir.&quot;";
csb[5] = "He took him outside and said, &quot;Look at the sky and count the stars, if you are able to count them.&quot; Then he said to him, &quot;Your offspring will be that numerous.&quot;";
csb[6] = "Abram believed the LORD, and he credited it to him as righteousness.";
csb[7] = "He also said to him, &quot;I am the LORD who brought you from Ur of the Chaldeans to give you this land to possess.&quot;";
csb[8] = "But he said, &quot;Lord GOD, how can I know that I will possess it? &quot;";
csb[9] = "He said to him, &quot;Bring me a three-year-old cow, a three-year-old female goat, a three-year-old ram, a turtledove, and a young pigeon.&quot;";
csb[10] = "So he brought all these to him, cut them in half, and laid the pieces opposite each other, but he did not cut the birds in half.";
csb[11] = "Birds of prey came down on the carcasses, but Abram drove them away.";
csb[12] = "As the sun was setting, a deep sleep came over Abram, and suddenly great terror and darkness descended on him.";
csb[13] = "Then the LORD said to Abram, &quot;Know this for certain: Your offspring will be resident aliens for four hundred years in a land that does not belong to them and will be enslaved and oppressed.";
csb[14] = "&quot;However, I will judge the nation they serve, and afterward they will go out with many possessions.";
csb[15] = "&quot;But you will go to your fathers in peace and be buried at a good old age.";
csb[16] = "&quot;In the fourth generation they will return here, for the iniquity of the Amorites has not yet reached its full measure.&quot;";
csb[17] = "When the sun had set and it was dark, a smoking fire pot and a flaming torch appeared and passed between the divided animals.";
