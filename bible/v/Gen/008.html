csb[1] = "God remembered Noah, as well as all the wildlife and all the livestock that were with him in the ark. God caused a wind to pass over the earth, and the water began to subside.";
csb[2] = "The sources of the watery depths and the floodgates of the sky were closed, and the rain from the sky stopped.";
csb[3] = "The water steadily receded from the earth, and by the end of 150 days the water had decreased significantly.";
csb[4] = "The ark came to rest in the seventh month, on the seventeenth day of the month, on the mountains of Ararat.";
csb[5] = "The water continued to recede until the tenth month; in the tenth month, on the first day of the month, the tops of the mountains were visible.";

csb[8] = "Then he sent out a dove to see whether the water on the earth\'s surface had gone down,";
csb[9] = "but the dove found no resting place for its foot. It returned to him in the ark because water covered the surface of the whole earth. He reached out and brought it into the ark to himself.";
csb[10] = "So Noah waited seven more days and sent out the dove from the ark again.";
csb[11] = "When the dove came to him at evening, there was a plucked olive leaf in its beak. So Noah knew that the water on the earth\'s surface had gone down.";
csb[12] = "After he had waited another seven days, he sent out the dove, but it did not return to him again.";
csb[13] = "In the six hundred and first year, in the first month, on the first day of the month, the water that had covered the earth was dried up. Then Noah removed the ark\'s cover and saw that the surface of the ground was drying.";
csb[14] = "By the twenty-seventh day of the second month, the earth was dry.";
csb[15] = "Then God spoke to Noah,";
csb[16] = "&quot;Come out of the ark, you, your wife, your sons, and your sons\' wives with you.";
csb[17] = "&quot;Bring out all the living creatures that are with you -- birds, livestock, those that crawl on the earth -- and they will spread over the earth and be fruitful and multiply on the earth.&quot;";
csb[18] = "So Noah, along with his sons, his wife, and his sons\' wives, came out.";
csb[19] = "All the animals, all the creatures that crawl, and all the flying creatures -- everything that moves on the earth -- came out of the ark by their families.";
csb[20] = "Then Noah built an altar to the LORD. He took some of every kind of clean animal and every kind of clean bird and offered burnt offerings on the altar.";
csb[21] = "When the LORD smelled the pleasing aroma, he said to himself, &quot;I will never again curse the ground because of human beings, even though the inclination of the human heart is evil from youth onward. And I will never again strike down every living thing as I have done.";
csb[22] = "&quot;As long as the earth endures, seedtime and harvest, cold and heat, summer and winter, and day and night will not cease.&quot;";
</script>
