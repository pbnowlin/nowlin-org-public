kjv[7] = "And they said, The man asked us straitly of our state, and of our kindred, saying, [Is] your father yet alive? have ye [another] brother? and we told him according to the tenor of these words: could we certainly know that he would say, Bring your brother down?";
rsv[7] = "They replied, &quot;The man questioned us carefully about ourselves and our kindred, saying, \'Is your father still alive? Have you another brother?\' What we told him was in answer to these questions; could we in any way know that he would say, \'Bring your brother down\'?&quot;";
asv[7] = "And they said, The man asked straitly concerning ourselves, and concerning our kindred, saying, Is your father yet alive? have ye [another] brother? and we told him according to the tenor of these words: could we in any wise know that he would say, Bring your brother down?";
yng[7] = "and they say, `The man asked diligently concerning us, and concerning our kindred, saying, Is your father yet alive? have ye a brother? and we declare to him according to the tenor of these things; do we certainly know that he will say, Bring down your brother?\'";
dby[7] = "And they said, The man asked very closely after us, and after our kindred, saying, Is your father yet alive? have ye a brother? And we told him according to the tenor of these words. Could we at all know that he would say, Bring your brother down?";
web[7] = "And they said, The man asked us strictly concerning our state, and our kindred, saying, [Is] your father yet alive? have ye [another] brother? and we told him according to the tenor of these words: Could we certainly know that he would say, Bring your brother down?";
hnv[7] = "They said, &quot;The man asked directly concerning ourselves, and concerning our relatives, saying, \'Is your father still alive? Have you another brother?\' We just answered his questions. Is there any way we could know that he would say, \'Bring your brother down?\'&quot;";
vul[7] = "at illi responderunt interrogavit nos homo per ordinem nostram progeniem si pater viveret si haberemus fratrem et nos respondimus ei consequenter iuxta id quod fuerat sciscitatus numquid scire poteramus quod dicturus esset adducite vobiscum fratrem vestrum";

kjv[18] = "And the men were afraid, because they were brought into Joseph\'s house; and they said, Because of the money that was returned in our sacks at the first time are we brought in; that he may seek occasion against us, and fall upon us, and take us for bondmen, and our asses.";
rsv[18] = "And the men were afraid because they were brought to Joseph\'s house, and they said, &quot;It is because of the money, which was replaced in our sacks the first time, that we are brought in, so that he may seek occasion against us and fall upon us, to make slaves of us and seize our asses.&quot;";
asv[18] = "And the men were afraid, because they were brought to Joseph\'s house; and they said, Because of the money that was returned in our sacks at the first time are we brought in; that he may seek occasion against us, and fall upon us, and take us for bondmen, and our asses.";
yng[18] = "and the men are afraid because they have been brought into the house of Joseph, and they say, `For the matter of the money which was put back in our bags at the commencement are we brought in -- to roll himself upon us, and to throw himself on us, and to take us for servants -- our asses also.\'";
dby[18] = "And the men were afraid because they were brought into Joseph\'s house, and said, Because of the money that was returned to us in our sacks at the beginning are we brought in, that he may turn against us, and fall upon us and take us for bondmen, and our asses.";
web[18] = "And the men were afraid, because they were brought into Joseph\'s house; and they said, Because of the money that was returned in our sacks at the first time, are we brought in; that he may seek occasion against us, and fall upon us, and take us for bond-men, and our asses.";
hnv[18] = "The men were afraid, because they were brought to Yosef\'s house; and they said, &quot;Because of the money that was returned in our sacks at the first time are we brought in; that he may seek occasion against us, and fall on us, and take us for bondservants, along with our donkeys.&quot;";
vul[18] = "ibique exterriti dixerunt mutuo propter pecuniam quam rettulimus prius in saccis nostris introducti sumus ut devolvat in nos calumniam et violenter subiciat servituti et nos et asinos nostros";

kjv[23] = "And he said, Peace [be] to you, fear not: your God, and the God of your father, hath given you treasure in your sacks: I had your money. And he brought Simeon out unto them.";

kjv[24] = "And the man brought the men into Joseph\'s house, and gave [them] water, and they washed their feet; and he gave their asses provender.";

hnv[28] = "They said, &quot;Your servant, our father, is well. He is still alive.&quot; They bowed the head, and did homage.";

yng[29] = "And he lifteth up his eyes, and seeth Benjamin his brother, his mother\'s son, and saith, `Is this your young brother, of whom ye have spoken unto me?\' and he saith, `God favour thee, my son.\'";

vul[29] = "adtollens autem oculos Ioseph vidit Beniamin fratrem suum uterinum et ait iste est frater vester parvulus de quo dixeratis mihi et rursum Deus inquit misereatur tui fili mi";

asv[30] = "And Joseph made haste; for his heart yearned over his brother: and he sought where to weep; and he entered into his chamber, and wept there.";
yng[30] = "And Joseph hasteth, for his bowels have been moved for his brother, and he seeketh to weep, and entereth the inner chamber, and weepeth there;";
dby[30] = "And Joseph made haste, for his bowels burned for his brother; and he sought [a place] to weep, and he went into the chamber, and wept there.";
web[30] = "And Joseph made haste; for his bowels yearned towards his brother: and he sought [where] to weep; and he entered into [his] chamber, and wept there.";
hnv[30] = "Yosef made haste; for his heart yearned over his brother: and he sought a place to weep; and he entered into his room, and wept there.";

asv[32] = "And they set on for him by himself, and for them by themselves, and for the Egyptians, that did eat with him, by themselves: because the Egyptians might not eat bread with the Hebrews; for that is an abomination unto the Egyptians.";
yng[32] = "And they place for him by himself, and for them by themselves, and for the Egyptians who are eating with him by themselves: for the Egyptians are unable to eat bread with the Hebrews, for it [is] an abomination to the Egyptians.";
dby[32] = "And they set on for him by himself, and for them by themselves, and for the Egyptians who ate with him by themselves; because the Egyptians might not eat bread with the Hebrews, for that is an abomination unto the Egyptians.";

asv[33] = "And they sat before him, the first-born according to his birthright, and the youngest according to his youth: and the men marvelled one with another.";
yng[33] = "And they sit before him, the first-born according to his birthright, and the young one according to his youth, and the men wonder one at another;";
dby[33] = "And they sat before him, the firstborn according to his birthright, and the youngest according to his youth; and the men marvelled one at another.";
web[33] = "And they sat before him, the first-born according to his birth-right, and the youngest according to his youth: and the men wondered one at another.";
hnv[33] = "They sat before him, the firstborn according to his birthright, and the youngest according to his youth, and the men marveled one with another.";

kjv[34] = "And he took [and sent] messes unto them from before him: but Benjamin\'s mess was five times so much as any of theirs. And they drank, and were merry with him.";
rsv[34] = "Portions were taken to them from Joseph\'s table, but Benjamin\'s portion was five times as much as any of theirs. So they drank and were merry with him.";
asv[34] = "And he took [and sent] messes unto them from before him: but Benjamin\'s mess was five times so much as any of theirs. And they drank, and were merry with him.";
yng[34] = "and he lifteth up gifts from before him unto them, and the gift of Benjamin is five hands more than the gifts of all of them; and they drink, yea, they drink abundantly with him.";
dby[34] = "And he had portions carried to them from before him. And Benjamin\'s portion was five times greater than the portions of them all. And they drank, and made merry with him.";
web[34] = "And he took [and sent] messes to them from before him: but Benjamin\'s mess was five times so much as any of theirs. And they drank, and were merry with him.";

csb[1] = "Now the famine in the land was severe.";
csb[2] = "When they had used up the grain they had brought back from Egypt, their father said to them, &quot;Go back and buy us a little food.&quot;";
csb[3] = "But Judah said to him, &quot;The man specifically warned us: \'You will not see me again unless your brother is with you.\'";
csb[4] = "&quot;If you will send our brother with us, we will go down and buy food for you.";
csb[5] = "&quot;But if you will not send him, we will not go, for the man said to us, \'You will not see me again unless your brother is with you.\' &quot;";
csb[6] = "&quot;Why have you caused me so much trouble? &quot; Israel asked. &quot;Why did you tell the man that you had another brother? &quot;";
csb[7] = "They answered, &quot;The man kept asking about us and our family: \'Is your father still alive? Do you have another brother? \' And we answered him accordingly. How could we know that he would say, \'Bring your brother here\'? &quot;";
csb[8] = "Then Judah said to his father Israel, &quot;Send the boy with me. We will be on our way so that we may live and not die -- neither we, nor you, nor our dependents.";
csb[9] = "&quot;I will be responsible for him. You can hold me personally accountable! If I do not bring him back to you and set him before you, I will be guilty before you forever.";
csb[10] = "&quot;If we had not delayed, we could have come back twice by now.&quot;";
csb[11] = "Then their father Israel said to them, &quot;If it must be so, then do this: Put some of the best products of the land in your packs and take them down to the man as a gift -- a little balsam and a little honey, aromatic gum and resin, pistachios and almonds.";
csb[12] = "&quot;Take twice as much silver with you. Return the silver that was returned to you in the top of your bags. Perhaps it was a mistake.";
csb[13] = "&quot;Take your brother also, and go back at once to the man.";
csb[14] = "&quot;May God Almighty cause the man to be merciful to you so that he will release your other brother and Benjamin to you. As for me, if I am deprived of my sons, then I am deprived.&quot;";
csb[15] = "The men took this gift, double the amount of silver, and Benjamin. They immediately went down to Egypt and stood before Joseph.";
csb[16] = "When Joseph saw Benjamin with them, he said to his steward, &quot;Take the men to my house. Slaughter an animal and prepare it, for they will eat with me at noon.&quot;";
csb[17] = "The man did as Joseph had said and brought them to Joseph\'s house.";
csb[18] = "But the men were afraid because they were taken to Joseph\'s house. They said, &quot;We have been brought here because of the silver that was returned in our bags the first time. They intend to overpower us, seize us, make us slaves, and take our donkeys.&quot;";
csb[19] = "So they approached Joseph\'s steward and spoke to him at the doorway of the house.";
csb[20] = "They said, &quot;My lord, we really did come down here the first time only to buy food.";
csb[21] = "&quot;When we came to the place where we lodged for the night and opened our bags of grain, each one\'s silver was at the top of his bag! It was the full amount of our silver, and we have brought it back with us.";
csb[22] = "&quot;We have brought additional silver with us to buy food. We don\'t know who put our silver in the bags.&quot;";
csb[23] = "Then the steward said, &quot;May you be well. Don\'t be afraid. Your God and the God of your father must have put treasure in your bags. I received your silver.&quot; Then he brought Simeon out to them.";
csb[24] = "The steward brought the men into Joseph\'s house, gave them water to wash their feet, and got feed for their donkeys.";
csb[25] = "Since the men had heard that they were going to eat a meal there, they prepared their gift for Joseph\'s arrival at noon.";
csb[26] = "When Joseph came home, they brought him the gift they had carried into the house, and they bowed to the ground before him.";
csb[27] = "He asked if they were well, and he said, &quot;How is your elderly father that you told me about? Is he still alive? &quot;";
csb[28] = "They answered, &quot;Your servant our father is well. He is still alive.&quot; And they knelt low and paid homage to him.";
csb[29] = "When he looked up and saw his brother Benjamin, his mother\'s son, he asked, &quot;Is this your youngest brother that you told me about? &quot; Then he said, &quot;May God be gracious to you, my son.&quot;";
csb[30] = "Joseph hurried out because he was overcome with emotion for his brother, and he was about to weep. He went into an inner room and wept there.";
csb[31] = "Then he washed his face and came out. Regaining his composure, he said, &quot;Serve the meal.&quot;";
csb[32] = "They served him by himself, his brothers by themselves, and the Egyptians who were eating with him by themselves, because Egyptians could not eat with Hebrews, since that is detestable to them.";
csb[33] = "They were seated before him in order by age, from the firstborn to the youngest. The men looked at each other in astonishment.";
csb[34] = "Portions were served to them from Joseph\'s table, and Benjamin\'s portion was five times larger than any of theirs. They drank and became drunk with Joseph.";
