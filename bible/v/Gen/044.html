vul[23] = "et dixisti servis tuis nisi venerit frater vester minimus vobiscum non videbitis amplius faciem meam";
kjv[24] = "And it came to pass when we came up unto thy servant my father, we told him the words of my lord.";
rsv[24] = "When we went back to your servant my father we told him the words of my lord.";
asv[24] = "And it came to pass when we came up unto thy servant my father, we told him the words of my lord.";
yng[24] = "`And it cometh to pass, that we have come up unto thy servant my father, that we declare to him the words of my lord;";
dby[24] = "And it came to pass when we came up to thy servant my father, we told him the words of my lord.";
web[24] = "And it came to pass, when we came to thy servant, my father, we told him the words of my lord.";
hnv[24] = "It happened when we came up to your servant my father, we told him the words of my lord.";
vul[24] = "cum ergo ascendissemus ad famulum tuum patrem nostrum narravimus ei omnia quae locutus est dominus meus";
kjv[25] = "And our father said, Go again, [and] buy us a little food.";
rsv[25] = "And when our father said, \'Go again, buy us a little food,\'";
asv[25] = "And our father said, Go again, buy us a little food.";
yng[25] = "and our father saith, Turn back, buy for us a little food,";
dby[25] = "And our father said, Go again, buy us a little food.";
web[25] = "And our father said, Go again; buy us a little food.";
hnv[25] = "Our father said, \'Go again, buy us a little food.\'";
vul[25] = "et dixit pater noster revertimini et emite nobis parum tritici";
kjv[26] = "And we said, We cannot go down: if our youngest brother be with us, then will we go down: for we may not see the man\'s face, except our youngest brother [be] with us.";
rsv[26] = "we said, \'We cannot go down. If our youngest brother goes with us, then we will go down; for we cannot see the man\'s face unless our youngest brother is with us.\'";
asv[26] = "And we said, We cannot go down: if our youngest brother be with us, then will we go down; for we may not see the man\'s face, except our youngest brother be with us.";
yng[26] = "and we say, We are not able to go down; if our young brother is with us, then we have gone down; for we are not able to see the man\'s face, and our young brother not with us.";
dby[26] = "But we said, We cannot go down: if our youngest brother be with us, then will we go down; for we cannot see the man\'s face unless our youngest brother is with us.";
web[26] = "And we said, We cannot go down: if our youngest brother shall be with us, then will we go down; for we may not see the man\'s face, except our youngest brother shall [be] with us.";
hnv[26] = "We said, \'We can\'t go down. If our youngest brother is with us, then will we go down: for we may not see the man\'s face, unless our youngest brother is with us.\'";
vul[26] = "cui diximus ire non possumus si frater noster minimus descendet nobiscum proficiscemur simul alioquin illo absente non audemus videre faciem viri";
kjv[27] = "And thy servant my father said unto us, Ye know that my wife bare me two [sons]:";
rsv[27] = "Then your servant my father said to us, \'You know that my wife bore me two sons;";
asv[27] = "And thy servant my father said unto us, Ye know that my wife bare me two sons:";
yng[27] = "`And thy servant my father saith unto us, Ye -- ye have known that two did my wife bare to me,";
dby[27] = "And thy servant my father said to us, Ye know that my wife bore me two [sons];";
web[27] = "And thy servant my father, said to us, Ye know that my wife bore me two [sons]:";
hnv[27] = "Your servant, my father, said to us, \'You know that my wife bore me two sons:";
vul[27] = "atque ille respondit vos scitis quod duos genuerit mihi uxor mea";
kjv[28] = "And the one went out from me, and I said, Surely he is torn in pieces; and I saw him not since:";
rsv[28] = "one left me, and I said, Surely he has been torn to pieces; and I have never seen him since.";
asv[28] = "and the one went out from me, and I said, Surely he is torn in pieces; and I have not seen him since:";
yng[28] = "and the one goeth out from me, and I say, Surely he is torn -- torn! and I have not seen him since;";
dby[28] = "and the one went out from me, and I said, He must certainly have been torn in pieces; and I have not seen him [again] hitherto.";
web[28] = "And the one went out from me, and I said, Surely he is torn in pieces; and I have not seen him since:";
hnv[28] = "and the one went out from me, and I said, &quot;Surely he is torn in pieces;&quot; and I haven\'t seen him since.";
vul[28] = "egressus est unus et dixistis bestia devoravit eum et hucusque non conparet";
kjv[29] = "And if ye take this also from me, and mischief befall him, ye shall bring down my gray hairs with sorrow to the grave.";
rsv[29] = "If you take this one also from me, and harm befalls him, you will bring down my gray hairs in sorrow to Sheol.\'";
asv[29] = "and if ye take this one also from me, and harm befall him, ye will bring down my gray hairs with sorrow to Sheol.";
yng[29] = "when ye have taken also this from my presence, and mischief hath met him, then ye have brought down my grey hairs with evil to sheol.";
dby[29] = "And if ye take this one also from me, and mischief should befall him, ye will bring down my grey hairs with misery to Sheol.";
web[29] = "And if ye take this also from me, and mischief shall befall him, ye will bring down my gray hairs with sorrow to the grave.";
hnv[29] = "If you take this one also from me, and harm happens to him, you will bring down my gray hairs with sorrow to She\'ol.\'";
vul[29] = "si tuleritis et istum et aliquid ei in via contigerit deducetis canos meos cum maerore ad inferos";
kjv[30] = "Now therefore when I come to thy servant my father, and the lad [be] not with us; seeing that his life is bound up in the lad\'s life;";
rsv[30] = "Now therefore, when I come to your servant my father, and the lad is not with us, then, as his life is bound up in the lad\'s life,";
asv[30] = "Now therefore when I come to thy servant my father, and the lad is not with us; seeing that his life is bound up in the lad\'s life;";
yng[30] = "`And now, at my coming in unto thy servant my father, and the youth not with us (and his soul is bound up in his soul),";
dby[30] = "And now, when I come to thy servant my father, and the lad is not with us, -- seeing that his life is bound up with his life,";
web[30] = "Now therefore, when I come to thy servant my father, and the lad is not with us; (seeing that his life is bound up in the lad\'s life)";
hnv[30] = "Now therefore when I come to your servant my father, and the boy is not with us; seeing that his life is bound up in the boy\'s life;";
vul[30] = "igitur si intravero ad servum tuum patrem nostrum et puer defuerit cum anima illius ex huius anima pendeat";
kjv[31] = "It shall come to pass, when he seeth that the lad [is] not [with us], that he will die: and thy servants shall bring down the gray hairs of thy servant our father with sorrow to the grave.";
rsv[31] = "when he sees that the lad is not with us, he will die; and your servants will bring down the gray hairs of your servant our father with sorrow to Sheol.";
asv[31] = "it will come to pass, when he seeth that the lad is not [with us], that he will die: and thy servants will bring down the gray hairs of thy servant our father with sorrow to Sheol.";
yng[31] = "then it hath come to pass when he seeth that the youth is not, that he hath died, and thy servants have brought down the grey hairs of thy servant our father with sorrow to sheol;";
dby[31] = "it will come to pass when he sees that the lad is not [there], that he will die; and thy servants will bring down the grey hairs of thy servant our father with sorrow to Sheol.";
web[31] = "It shall come to pass, when he seeth that the lad [is] not [with us], that he will die: and thy servants will bring down the gray hairs of thy servant our father, with sorrow to the grave.";
hnv[31] = "it will happen, when he sees that the boy is no more, that he will die. Your servants will bring down the gray hairs of your servant, our father, with sorrow to She\'ol.";
vul[31] = "videritque eum non esse nobiscum morietur et deducent famuli tui canos eius cum dolore ad inferos";
kjv[32] = "For thy servant became surety for the lad unto my father, saying, If I bring him not unto thee, then I shall bear the blame to my father for ever.";
rsv[32] = "For your servant became surety for the lad to my father, saying, \'If I do not bring him back to you, then I shall bear the blame in the sight of my father all my life.\'";
asv[32] = "For thy servant became surety for the lad unto my father, saying, If I bring him not unto thee, then shall I bear the blame to my father for ever.";
yng[32] = "for thy servant obtained the youth by surety from my father, saying, If I bring him not in unto thee -- then I have sinned against my father all the days.";
dby[32] = "For thy servant became surety for the lad to my father, saying, If I bring him not to thee, then I shall be guilty toward my father all my days.";
web[32] = "For thy servant became surety for the lad to my father, saying, If I bring him not to thee, then I will bear the blame to my father for ever.";
hnv[32] = "For your servant became collateral for the boy to my father, saying, \'If I don\'t bring him to you, then I will bear the blame to my father forever.\'";
vul[32] = "ego proprie servus tuus qui in meam hunc recepi fidem et spopondi dicens nisi reduxero eum peccati reus ero in patrem meum omni tempore";
kjv[33] = "Now therefore, I pray thee, let thy servant abide instead of the lad a bondman to my lord; and let the lad go up with his brethren.";
rsv[33] = "Now therefore, let your servant, I pray you, remain instead of the lad as a slave to my lord; and let the lad go back with his brothers.";
asv[33] = "Now therefore, let thy servant, I pray thee, abide instead of the lad a bondman to my lord; and let the lad go up with his brethren.";
yng[33] = "`And now, let thy servant, I pray thee, abide instead of the youth a servant to my lord, and the youth goeth up with his brethren,";
dby[33] = "And now, let thy servant stay, I pray thee, instead of the lad a bondman to my lord, and let the lad go up with his brethren;";
web[33] = "Now therefore, I pray thee, let thy servant abide instead of the lad, a bond-man to my lord; and let the lad return with his brethren.";
hnv[33] = "Now therefore, please let your servant stay instead of the boy, a bondservant to my lord; and let the boy go up with his brothers.";
vul[33] = "manebo itaque servus tuus pro puero in ministerium domini mei et puer ascendat cum fratribus suis";
kjv[34] = "For how shall I go up to my father, and the lad [be] not with me? lest peradventure I see the evil that shall come on my father.";
rsv[34] = "For how can I go back to my father if the lad is not with me? I fear to see the evil that would come upon my father.&quot;";
asv[34] = "For how shall I go up to my father, if the lad be not with me? lest I see the evil that shall come on my father.";
yng[34] = "for how do I go up unto my father, and the youth not with me? lest I look on the evil which doth find my father.\'";
dby[34] = "for how should I go up to my father if the lad were not with me? -- lest I see the evil that would come on my father.";
web[34] = "For how shall I return to my father, and the lad [be] not with me? lest perhaps I see the evil that shall come on my father.";
hnv[34] = "For how will I go up to my father, if the boy isn\'t with me? Lest I see the evil that will come on my father.&quot;";
vul[34] = "non enim possum redire ad patrem absente puero ne calamitatis quae oppressura est patrem meum testis adsistam";
csb[1] = "Joseph commanded his steward, &quot;Fill the men\'s bags with as much food as they can carry, and put each one\'s silver at the top of his bag.";
csb[2] = "&quot;Put my cup, the silver one, at the top of the youngest one\'s bag, along with the silver for his grain.&quot; So he did as Joseph told him.";
csb[3] = "At morning light, the men were sent off with their donkeys.";
csb[4] = "They had not gone very far from the city when Joseph said to his steward, &quot;Get up. Pursue the men, and when you overtake them, say to them, \'Why have you repaid evil for good?";
csb[5] = "&quot;Isn\'t this the cup that my master drinks from and uses for divination? What you have done is wrong! \' &quot;";
csb[6] = "When he overtook them, he said these words to them.";
csb[7] = "They said to him, &quot;Why does my lord say these things? Your servants could not possibly do such a thing.";
csb[8] = "&quot;We even brought back to you from the land of Canaan the silver we found at the top of our bags. How could we steal silver or gold from your master\'s house?";
csb[9] = "&quot;If it is found with one of us, your servants, he must die, and the rest of us will become my lord\'s slaves.&quot;";
csb[10] = "The steward replied, &quot;What you have said is right, but only the one who is found to have it will be my slave, and the rest of you will be blameless.&quot;";
csb[11] = "So each one quickly lowered his sack to the ground and opened it.";
csb[12] = "The steward searched, beginning with the oldest and ending with the youngest, and the cup was found in Benjamin\'s sack.";
csb[13] = "Then they tore their clothes, and each one loaded his donkey and returned to the city.";
csb[14] = "When Judah and his brothers reached Joseph\'s house, he was still there. They fell to the ground before him.";
csb[15] = "&quot;What is this you have done? &quot; Joseph said to them. &quot;Didn\'t you know that a man like me could uncover the truth by divination? &quot;";
csb[16] = "&quot;What can we say to my lord? &quot; Judah replied. &quot;How can we plead? How can we justify ourselves? God has exposed your servants\' iniquity. We are now my lord\'s slaves -- both we and the one in whose possession the cup was found.&quot;";
csb[17] = "Then Joseph said, &quot;I swear that I will not do this. The man in whose possession the cup was found will be my slave. The rest of you can go in peace to your father.&quot;";
csb[18] = "But Judah approached him and said, &quot;My lord, please let your servant speak personally to my lord. Do not be angry with your servant, for you are like Pharaoh.";
csb[19] = "&quot;My lord asked his servants, \'Do you have a father or a brother? \'";
csb[20] = "&quot;and we answered my lord, \'We have an elderly father and a younger brother, the child of his old age. The boy\'s brother is dead. He is the only one of his mother\'s sons left, and his father loves him.\'";
csb[21] = "&quot;Then you said to your servants, \'Bring him to me so that I can see him.\'";
csb[22] = "&quot;But we said to my lord, \'The boy cannot leave his father. If he were to leave, his father would die.\'";
csb[23] = "&quot;Then you said to your servants, \'If your younger brother does not come down with you, you will not see me again.\'";
csb[24] = "&quot;This is what happened when we went back to your servant my father: We reported to him the words of my lord.";
csb[25] = "&quot;But our father said, \'Go again, and buy us a little food.\'";
csb[26] = "&quot;We told him, \'We cannot go down unless our younger brother goes with us. If our younger brother isn\'t with us, we cannot see the man.\'";
csb[27] = "&quot;Your servant my father said to us, \'You know that my wife bore me two sons.";
csb[28] = "&quot;One is gone from me -- I said he must have been torn to pieces -- and I have never seen him again.";
csb[29] = "&quot;If you also take this one from me and anything happens to him, you will bring my gray hairs down to Sheol in sorrow.\'";
csb[30] = "&quot;So if I come to your servant my father and the boy is not with us -- his life is wrapped up with the boy\'s life --";
csb[31] = "&quot;when he sees that the boy is not with us, he will die. Then your servants will have brought the gray hairs of your servant our father down to Sheol in sorrow.";
csb[32] = "&quot;Your servant became accountable to my father for the boy, saying, \'If I do not return him to you, I will always bear the guilt for sinning against you, my father.\'";
csb[33] = "&quot;Now please let your servant remain here as my lord\'s slave, in place of the boy. Let him go back with his brothers.";
csb[34] = "&quot;For how can I go back to my father without the boy? I could not bear to see the grief that would overwhelm my father.&quot;";
