yng[2] = "they have made war with Bera king of Sodom, and with Birsha king of Gomorrah, Shinab king of Admah, and Shemeber king of Zeboim, and the king of Bela, which [is] Zoar.";
dby[2] = "[that] they made war with Bera the king of Sodom, and with Birsha the king of Gomorrah, Shinab the king of Admah, and Shemeber the king of Zeboim, and the king of Bela, which is Zoar.";

asv[3] = "All these joined together in the vale of Siddim (the same is the Salt Sea).";
yng[3] = "All these have been joined together unto the valley of Siddim, which [is] the Salt Sea;";
dby[3] = "All these were joined in the vale of Siddim, which is the salt sea.";
web[3] = "All these were joined together in the vale of Siddim, which is the salt sea.";
hnv[3] = "All these joined together in the valley of Siddim (the same is the Salt Sea).";
vul[3] = "omnes hii convenerunt in vallem Silvestrem quae nunc est mare Salis";
kjv[4] = "Twelve years they served Chedorlaomer, and in the thirteenth year they rebelled.";
rsv[4] = "Twelve years they had served Ched-or-lao\'mer, but in the thirteenth year they rebelled.";
asv[4] = "Twelve years they served Chedorlaomer, and in the thirteenth year they rebelled.";
yng[4] = "twelve years they served Chedorlaomer, and the thirteenth year they rebelled.";
dby[4] = "Twelve years had they served Chedorlaomer; and in the thirteenth year they rebelled.";
web[4] = "Twelve years they served Chedorlaomer, and in the thirteenth year they rebelled.";
hnv[4] = "Twelve years they served Kedorla`omer, and in the thirteenth year, they rebelled.";
vul[4] = "duodecim enim annis servierant Chodorlahomor et tertiodecimo anno recesserunt ab eo";
kjv[5] = "And in the fourteenth year came Chedorlaomer, and the kings that [were] with him, and smote the Rephaims in Ashteroth Karnaim, and the Zuzims in Ham, and the Emims in Shaveh Kiriathaim,";
rsv[5] = "In the fourteenth year Ched-or-lao\'mer and the kings who were with him came and subdued the Reph\'aim in Ash\'teroth-karna\'im, the Zuzim in Ham, the Emim in Sha\'veh-kiriatha\'im,";
asv[5] = "And in the fourteenth year came Chedorlaomer, and the kings that were with him, and smote the Rephaim in Ashteroth-karnaim, and the Zuzim in Ham, and the Emim in Shaveh-kiriathaim,";
yng[5] = "And in the fourteenth year came Chedorlaomer, and the kings who [are] with him, and they smite the Rephaim in Ashteroth Karnaim, and the Zuzim in Ham, and the Emim in Shaveh Kiriathaim,";
dby[5] = "And in the fourteenth year came Chedorlaomer and the kings that were with him, and smote the Rephaim in Ashteroth-karnaim, and the Zuzim in Ham, and the Emim in Shaveh-Kirjathaim,";
web[5] = "And in the fourteenth year came Chedorlaomer, and the kings that [were] with him, and smote the Rephaims in Ashteroth Karnaim, and the Zuzims in Ham, and the Emins in Shaveh Kiriathaim,";
hnv[5] = "In the fourteenth year Kedorla`omer came, and the kings who were with him, and struck the Refa\'im in `Ashterot-Karnayim, and the Zuzim in Ham, and the Emim in Shaveh-kiriathaim,";
vul[5] = "igitur anno quartodecimo venit Chodorlahomor et reges qui erant cum eo percusseruntque Rafaim in Astharothcarnaim et Zuzim cum eis et Emim in Savecariathaim";
kjv[6] = "And the Horites in their mount Seir, unto Elparan, which [is] by the wilderness.";
rsv[6] = "and the Horites in their Mount Se\'ir as far as El-paran on the border of the wilderness;";
asv[6] = "and the Horites in their mount Seir, unto El-paran, which is by the wilderness.";
yng[6] = "and the Horites in their mount Seir, unto El-Paran, which [is] by the wilderness;";
dby[6] = "and the Horites on their mount Seir, to El-Paran, which is by the wilderness.";
web[6] = "And the Horites in their mount Seir, to El-paran, which [is] by the wilderness.";
hnv[6] = "and the Hori in their Mount Se`ir, to El-Paran, which is by the wilderness.";
vul[6] = "et Chorreos in montibus Seir usque ad campestria Pharan quae est in solitudine";
kjv[7] = "And they returned, and came to Enmishpat, which [is] Kadesh, and smote all the country of the Amalekites, and also the Amorites, that dwelt in Hazezontamar.";

yng[7] = "and they turn back and come in unto En-Mishpat, which [is] Kadesh, and smite the whole field of the Amalekite, and also the Amorite who is dwelling in Hazezon-Tamar.";
dby[7] = "And they returned, and came to En-mishpat, which is Kadesh, and smote all the country of the Amalekites, and also the Amorites that dwelt at Hazazon-Tamar.";

hnv[7] = "They returned, and came to En-mishpat (the same is Kadesh), and struck all the country of the `Amaleki, and also the Amori, that lived in Hatzatzon-Tamar.";

kjv[8] = "And there went out the king of Sodom, and the king of Gomorrah, and the king of Admah, and the king of Zeboiim, and the king of Bela (the same [is] Zoar;) and they joined battle with them in the vale of Siddim;";
rsv[8] = "Then the king of Sodom, the king of Gomor\'rah, the king of Admah, the king of Zeboi\'im, and the king of Bela (that is, Zo\'ar) went out, and they joined battle in the Valley of Siddim";
asv[8] = "And there went out the king of Sodom, and the king of Gomorrah, and the king of Admah, and the king of Zeboiim, and the king of Bela (the same is Zoar); and they set the battle in array against them in the vale of Siddim;";
yng[8] = "And the king of Sodom goeth out, and the king of Gomorrah, and the king of Admah, and the king of Zeboim, and the king of Bela, which [is] Zoar; and they set the battle in array with them in the valley of Siddim,";
dby[8] = "And the king of Sodom and the king of Gomorrah, and the king of Admah, and the king of Zeboim, and the king of Bela, which is Zoar, went out, and they joined battle with them in the vale of Siddim,";
web[8] = "And there went out the king of Sodom, and the king of Gomorrah, and the king of Admah, and the king of Zeboiim, and the king of Bela, (the same [is] Zoar;) and they joined battle with them in the vale of Siddim;";
hnv[8] = " There went out the king of Sedom, and the king of `Amorah, and the king of Admah, and the king of Tzevoyim, and the king of Bela (the same is Tzo`ar); and they set the battle in array against them in the valley of Siddim;";
vul[8] = "et egressi sunt rex Sodomorum et rex Gomorrae rexque Adamae et rex Seboim necnon et rex Balae quae est Segor et direxerunt contra eos aciem in valle Silvestri";
kjv[9] = "With Chedorlaomer the king of Elam, and with Tidal king of nations, and Amraphel king of Shinar, and Arioch king of Ellasar; four kings with five.";

asv[9] = "against Chedorlaomer king of Elam, and Tidal king of Goiim, and Amraphel king of Shinar, and Arioch king of Ellasar; four kings against the five.";
yng[9] = "with Chedorlaomer king of Elam, and Tidal king of Goyim, and Amraphel king of Shinar, and Arioch king of Ellasar; four kings with the five.";
dby[9] = "with Chedorlaomer the king of Elam, and Tidal the king of nations, and Amraphel the king of Shinar, and Arioch the king of Ellasar -- four kings with the five.";
web[9] = "With Chedorlaomer the king of Elam, and with Tidal king of nations, and Amraphel king of Shinar, and Arioch king of Ellasar; four kings with five.";
hnv[9] = "against Kedorla`omer king of `Elam, and Tid`al king of Goyim, and Amrafel king of Shin`ar, and Aryokh king of Ellasar; four kings against the five.";
vul[9] = "scilicet adversum Chodorlahomor regem Aelamitarum et Thadal regem Gentium et Amrafel regem Sennaar et Arioch regem Ponti quattuor reges adversus quinque";

asv[10] = "Now the vale of Siddim was full of slime pits; and the kings of Sodom and Gomorrah fled, and they fell there, and they that remained fled to the mountain.";
yng[10] = "And the valley of Siddim [is] full of bitumen-pits; and the kings of Sodom and Gomorrah flee, and fall there, and those left have fled to the mountain.";
dby[10] = "And the vale of Siddim was full of pits of asphalt. And the kings of Sodom and Gomorrah fled, and fell there: and they that remained fled to the mountain.";
web[10] = "And the vale of Siddim [was full of] slime-pits; and the kings of Sodom and Gomorrah fled, and fell there: and they that remained fled to the mountain.";

kjv[11] = "And they took all the goods of Sodom and Gomorrah, and all their victuals, and went their way.";
rsv[11] = "So the enemy took all the goods of Sodom and Gomor\'rah, and all their provisions, and went their way;";
asv[11] = "And they took all the goods of Sodom and Gomorrah, and all their victuals, and went their way.";
yng[11] = "And they take the whole substance of Sodom and Gomorrah, and the whole of their food, and go away;";
dby[11] = "And they took all the property of Sodom and Gomorrah, and all their victuals, and departed.";
web[11] = "And they took all the goods of Sodom and Gomorrah, and all their provisions, and went their way.";
hnv[11] = "They took all the goods of Sedom and `Amorah, and all their victuals, and went their way.";
vul[11] = "tulerunt autem omnem substantiam Sodomorum et Gomorrae et universa quae ad cibum pertinent et abierunt";
kjv[12] = "And they took Lot, Abram\'s brother\'s son, who dwelt in Sodom, and his goods, and departed.";

yng[12] = "and they take Lot, Abram\'s brother\'s son (seeing he is dwelling in Sodom), and his substance, and go away.";
dby[12] = "And they took Lot and his property, Abram\'s brother\'s son, and departed. For he dwelt in Sodom.";
web[12] = "And they took Lot, Abram\'s brother\'s son, who dwelt in Sodom, and his goods, and departed.";
hnv[12] = "They took Lot, Avram\'s brother\'s son, who lived in Sedom, and his goods, and departed.";
vul[12] = "necnon et Loth et substantiam eius filium fratris Abram qui habitabat in Sodomis";
kjv[13] = "And there came one that had escaped, and told Abram the Hebrew; for he dwelt in the plain of Mamre the Amorite, brother of Eshcol, and brother of Aner: and these [were] confederate with Abram.";
rsv[13] = "Then one who had escaped came, and told Abram the Hebrew, who was living by the oaks of Mamre the Amorite, brother of Eshcol and of Aner; these were allies of Abram.";
asv[13] = "And there came one that had escaped, and told Abram the Hebrew: now he dwelt by the oaks of Mamre, the Amorite, brother of Eshcol, and brother of Aner; and these were confederate with Abram.";
yng[13] = "And one who is escaping cometh and declareth to Abram the Hebrew, and he is dwelling among the oaks of Mamre the Amorite, brother of Eshcol, and brother of Aner, and they [are] Abram\'s allies.";
dby[13] = "And one who had escaped came and told Abram the Hebrew. And he dwelt by the oaks of Mamre the Amorite, the brother of Eshcol, and the brother of Aner. And these were Abram\'s allies.";
web[13] = "And there came one that had escaped, and told Abram the Hebrew; for he dwelt in the plain of Mamre the Amorite, brother of Eshcol, and brother of Aner: and these [were] confederate with Abram.";
hnv[13] = "One who had escaped came and told Avram, the Hebrew. Now he lived by the oaks of Mamre, the Amori, brother of Eshkol, and brother of `Aner; and these were allies of Avram.";
vul[13] = "et ecce unus qui evaserat nuntiavit Abram Hebraeo qui habitabat in convalle Mambre Amorrei fratris Eschol et fratris Aner hii enim pepigerant foedus cum Abram";
kjv[14] = "And when Abram heard that his brother was taken captive, he armed his trained [servants], born in his own house, three hundred and eighteen, and pursued [them] unto Dan.";
rsv[14] = "When Abram heard that his kinsman had been taken captive, he led forth his trained men, born in his house, three hundred and eighteen of them, and went in pursuit as far as Dan.";
asv[14] = "And when Abram heard that his brother was taken captive, he led forth his trained men, born in his house, three hundred and eighteen, and pursued as far as Dan.";
yng[14] = "And Abram heareth that his brother hath been taken captive, and he draweth out his trained domestics, three hundred and eighteen, and pursueth unto Dan.";
dby[14] = "And Abram heard that his brother was taken captive; and he led out his trained [servants], born in his house, three hundred and eighteen, and pursued [them] as far as Dan.";
web[14] = "And when Abram heard that his brother was taken captive, he armed his trained [servants], born in his own house, three hundred and eighteen, and pursued [them] to Dan.";
hnv[14] = "When Avram heard that his relative was taken captive, he led forth his trained men, born in his house, three hundred and eighteen, and pursued as far as Dan.";

asv[15] = "And he divided himself against them by night, he and his servants, and smote them, and pursued them unto Hobah, which is on the left hand of Damascus.";
yng[15] = "And he divideth himself against them by night, he and his servants, and smiteth them, and pursueth them unto Hobah, which [is] at the left of Damascus;";
dby[15] = "And he divided himself against them by night, he and his servants, and smote them, and pursued them as far as Hobah, which is to the left of Damascus.";
web[15] = "And he divided himself against them, he and his servants by night, and smote them, and pursued them to Hobah, which [is] on the left hand of Damascus.";
hnv[15] = "He divided himself against them by night, he and his servants, and struck them, and pursued them to Hovah, which is on the left hand of Dammesek.";
vul[15] = "et divisis sociis inruit super eos nocte percussitque eos et persecutus est usque Hoba quae est ad levam Damasci";

rsv[16] = "Then he brought back all the goods, and also brought back his kinsman Lot with his goods, and the women and the people.";
asv[16] = "And he brought back all the goods, and also brought back his brother Lot, and his goods, and the women also, and the people.";
yng[16] = "and he bringeth back the whole of the substance, and also Lot his brother and his substance hath he brought back, and also the women and the people.";
dby[16] = "And he brought back all the property, and brought again his brother Lot and his property, and the women also, and the people.";
web[16] = "And he brought back all the goods, and also brought again his brother Lot, and his goods, and the women also, and the people.";
hnv[16] = "He brought back all the goods, and also brought back his relative, Lot, and his goods, and the women also, and the people.";
vul[16] = "reduxitque omnem substantiam et Loth fratrem suum cum substantia illius mulieres quoque et populum";

rsv[17] = "After his return from the defeat of Ched-or-lao\'mer and the kings who were with him, the king of Sodom went out to meet him at the Valley of Shaveh (that is, the King\'s Valley).";
asv[17] = "And the king of Sodom went out to meet him, after his return from the slaughter of Chedorlaomer and the kings that were with him, at the vale of Shaveh (the same is the King\'s Vale).";
yng[17] = "And the king of Sodom goeth out to meet him (after his turning back from the smiting of Chedorlaomer, and of the kings who [are] with him), unto the valley of Shaveh, which [is] the king\'s valley.";
dby[17] = "And the king of Sodom went out to meet him after he had returned from smiting Chedorlaomer, and the kings that were with him, into the valley of Shaveh, which is the king\'s valley.";
web[17] = "And the king of Sodom went out to meet him after his return from the slaughter of Chedorlaomer, and of the kings that [were] with him, at the valley of Shaveh, which [is] the king\'s dale.";
hnv[17] = "The king of Sedom went out to meet him, after his return from the slaughter of Kedorla`omer and the kings who were with him, at the valley of Shaveh (the same is the King\'s Valley).";
vul[17] = "egressus est autem rex Sodomorum in occursum eius postquam reversus est a caede Chodorlahomor et regum qui cum eo erant in valle Save quae est vallis Regis";
kjv[18] = "And Melchizedek king of Salem brought forth bread and wine: and he [was] the priest of the most high God.";
rsv[18] = "And Mel-chiz\'edek king of Salem brought out bread and wine; he was priest of God Most High.";
asv[18] = "And Melchizedek king of Salem brought forth bread and wine: and he was priest of God Most High.";
yng[18] = "And Melchizedek king of Salem hath brought out bread and wine, and he [is] priest of God Most High;";
dby[18] = "And Melchisedec king of Salem brought out bread and wine. And he was priest of the Most High God.";
web[18] = "And Melchisedek, king of Salem, brought forth bread and wine: and he [was] the priest of the most high God.";
hnv[18] = " Malki-Tzedek king of Shalem brought forth bread and wine: and he was Kohen of El `Elyon.";
vul[18] = "at vero Melchisedech rex Salem proferens panem et vinum erat enim sacerdos Dei altissimi";

rsv[19] = "And he blessed him and said, &quot;Blessed be Abram by God Most High, maker of heaven and earth;";
asv[19] = "And he blessed him, and said, Blessed be Abram of God Most High, possessor of heaven and earth:";
yng[19] = "and he blesseth him, and saith, `Blessed [is] Abram to God Most High, possessing heaven and earth;";
dby[19] = "And he blessed him, and said, Blessed be Abram of the Most High God, possessor of heavens and earth.";
web[19] = "And he blessed him, and said, Blessed [be] Abram of the most high God, possessor of heaven and earth:";
hnv[19] = "He blessed him, and said, &quot;Blessed be Avram of El `Elyon, possessor of heaven and eretz:";
vul[19] = "benedixit ei et ait benedictus Abram Deo excelso qui creavit caelum et terram";

rsv[20] = "and blessed be God Most High, who has delivered your enemies into your hand!&quot; And Abram gave him a tenth of everything.";
asv[20] = "and blessed be God Most High, who hath delivered thine enemies into thy hand. And he gave him a tenth of all.";
yng[20] = "and blessed [is] God Most High, who hath delivered thine adversaries into thy hand;\' and he giveth to him a tenth of all.";
dby[20] = "And blessed be the Most High God, who has delivered thine enemies into thy hand. And he gave him the tenth of all.";
web[20] = "And blessed be the most high God, who hath delivered thy enemies into thy hand. And he gave him tithes of all.";
hnv[20] = "and blessed be El `Elyon, who has delivered your enemies into your hand.&quot; Avram gave him a tenth of all.";
vul[20] = "et benedictus Deus excelsus quo protegente hostes in manibus tuis sunt et dedit ei decimas ex omnibus";
kjv[21] = "And the king of Sodom said unto Abram, Give me the persons, and take the goods to thyself.";

asv[21] = "And the king of Sodom said unto Abram, Give me the persons, and take the goods to thyself.";
yng[21] = "And the king of Sodom saith unto Abram, `Give to me the persons, and the substance take to thyself,\'";
dby[21] = "And the king of Sodom said to Abram, Give me the souls, and take the property for thyself.";

csb[1] = "In those days King Amraphel of Shinar, King Arioch of Ellasar, King Chedorlaomer of Elam, and King Tidal of Goiim";
csb[2] = "waged war against King Bera of Sodom, King Birsha of Gomorrah, King Shinab of Admah, and King Shemeber of Zeboiim, as well as the king of Bela (that is, Zoar).";
csb[3] = "All of these came as allies to the Siddim Valley (that is, the Dead Sea).";
csb[4] = "They were subject to Chedorlaomer for twelve years, but in the thirteenth year they rebelled.";
csb[5] = "In the fourteenth year Chedorlaomer and the kings who were with him came and defeated the Rephaim in Ashteroth-karnaim, the Zuzim in Ham, the Emim in Shaveh-kiriathaim,";
csb[6] = "and the Horites in the mountains of Seir, as far as El-paran by the wilderness.";
csb[7] = "Then they came back to invade En-mishpat (that is, Kadesh), and they defeated the whole territory of the Amalekites, as well as the Amorites who lived in Hazazon-tamar.";
csb[8] = "Then the king of Sodom, the king of Gomorrah, the king of Admah, the king of Zeboiim, and the king of Bela (that is, Zoar) went out and lined up for battle in the Siddim Valley";
csb[9] = "against King Chedorlaomer of Elam, King Tidal of Goiim, King Amraphel of Shinar, and King Arioch of Ellasar -- four kings against five.";
csb[10] = "Now the Siddim Valley contained many asphalt pits, and as the kings of Sodom and Gomorrah fled, some fell into them, but the rest fled to the mountains.";
csb[11] = "The four kings took all the goods of Sodom and Gomorrah and all their food and went on.";
csb[12] = "They also took Abram\'s nephew Lot and his possessions, for he was living in Sodom, and they went on.";
csb[13] = "One of the survivors came and told Abram the Hebrew, who lived near the oaks belonging to Mamre the Amorite, the brother of Eshcol and the brother of Aner. They were bound by a treaty with Abram.";
csb[14] = "When Abram heard that his relative had been taken prisoner, he assembled his 318 trained men, born in his household, and they went in pursuit as far as Dan.";
csb[15] = "And he and his servants deployed against them by night, defeated them, and pursued them as far as Hobah to the north of Damascus.";
csb[16] = "He brought back all the goods and also his relative Lot and his goods, as well as the women and the other people.";
csb[17] = "After Abram returned from defeating Chedorlaomer and the kings who were with him, the king of Sodom went out to meet him in the Shaveh Valley (that is, the King\'s Valley).";
csb[18] = "Melchizedek, king of Salem, brought out bread and wine; he was a priest to God Most High.";
csb[19] = "He blessed him and said: Abram is blessed by God Most High, Creator of heaven and earth,";
csb[20] = "and blessed be God Most High who has handed over your enemies to you. And Abram gave him a tenth of everything.";
csb[21] = "Then the king of Sodom said to Abram, &quot;Give me the people, but take the possessions for yourself.&quot;";
csb[22] = "But Abram said to the king of Sodom, &quot;I have raised my hand in an oath to the LORD, God Most High, Creator of heaven and earth,";
csb[23] = "&quot;that I will not take a thread or sandal strap or anything that belongs to you, so you can never say, \'I made Abram rich.\'";
csb[24] = "&quot;I will take nothing except what the servants have eaten. But as for the share of the men who came with me -- Aner, Eshcol, and Mamre -- they can take their share.&quot;";
