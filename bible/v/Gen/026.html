csb[1] = "There was another famine in the land in addition to the one that had occurred in Abraham\'s time. And Isaac went to Abimelech, king of the Philistines, at Gerar.";
csb[2] = "The LORD appeared to him and said, &quot;Do not go down to Egypt. Live in the land that I tell you about;";
csb[3] = "&quot;stay in this land as an alien, and I will be with you and bless you. For I will give all these lands to you and your offspring, and I will confirm the oath that I swore to your father Abraham.";
csb[4] = "&quot;I will make your offspring as numerous as the stars of the sky, I will give your offspring all these lands, and all the nations of the earth will be blessed by your offspring,";
csb[5] = "&quot;because Abraham listened to me and kept my mandate, my commands, my statutes, and my instructions.&quot;";
csb[6] = "So Isaac settled in Gerar.";
csb[7] = "When the men of the place asked about his wife, he said, &quot;She is my sister,&quot; for he was afraid to say &quot;my wife,&quot; thinking, &quot;The men of the place will kill me on account of Rebekah, for she is a beautiful woman.&quot;";
csb[8] = "When Isaac had been there for some time, Abimelech king of the Philistines looked down from the window and was surprised to see Isaac caressing his wife Rebekah.";
csb[9] = "Abimelech sent for Isaac and said, &quot;So she is really your wife! How could you say, \'She is my sister\'? &quot; Isaac answered him, &quot;Because I thought I might die on account of her.&quot;";
csb[10] = "Then Abimelech said, &quot;What is this you\'ve done to us? One of the people could easily have slept with your wife, and you would have brought guilt on us.&quot;";
csb[11] = "So Abimelech warned all the people, &quot;Whoever harms this man or his wife will certainly be put to death.&quot;";
csb[12] = "Isaac sowed seed in that land, and in that year he reaped a hundred times what was sown. The LORD blessed him,";
csb[13] = "and the man became rich and kept getting richer until he was very wealthy.";
csb[14] = "He had flocks of sheep, herds of cattle, and many slaves, and the Philistines were envious of him.";
csb[15] = "Philistines stopped up all the wells that his father\'s servants had dug in the days of his father Abraham, filling them with dirt.";
csb[16] = "And Abimelech said to Isaac, &quot;Leave us, for you are much too powerful for us.&quot;";
csb[17] = "So Isaac left there, camped in the Gerar Valley, and lived there.";
csb[18] = "Isaac reopened the wells that had been dug in the days of his father Abraham and that the Philistines had stopped up after Abraham died. He gave them the same names his father had given them.";
csb[19] = "Then Isaac\'s servants dug in the valley and found a well of spring water there.";
csb[20] = "But the herdsmen of Gerar quarreled with Isaac\'s herdsmen and said, &quot;The water is ours! &quot; So he named the well Esek because they argued with him.";
csb[21] = "Then they dug another well and quarreled over that one also, so he named it Sitnah.";
csb[22] = "He moved from there and dug another, and they did not quarrel over it. He named it Rehoboth and said, &quot;For now the LORD has made space for us, and we will be fruitful in the land.&quot;";
csb[23] = "From there he went up to Beer-sheba,";
csb[24] = "and the LORD appeared to him that night and said, &quot;I am the God of your father Abraham. Do not be afraid, for I am with you. I will bless you and multiply your offspring because of my servant Abraham.&quot;";
csb[25] = "So he built an altar there, called on the name of the LORD, and pitched his tent there. Isaac\'s servants also dug a well there.";
csb[26] = "Now Abimelech came to him from Gerar with Ahuzzath his adviser and Phicol the commander of his army.";
csb[27] = "Isaac said to them, &quot;Why have you come to me? You hated me and sent me away from you.&quot;";
csb[28] = "They replied, &quot;We have clearly seen how the LORD has been with you. We think there should be an oath between two parties -- between us and you. Let us make a covenant with you:";
csb[29] = "&quot;You will not harm us, just as we have not harmed you but have done only what was good to you, sending you away in peace. You are now blessed by the LORD .&quot;";
csb[30] = "So he prepared a banquet for them, and they ate and drank.";
csb[31] = "They got up early in the morning and swore an oath to each other. Isaac sent them on their way, and they left him in peace.";
csb[32] = "On that same day Isaac\'s servants came to tell him about the well they had dug, saying to him, &quot;We have found water! &quot;";
csb[33] = "He called it Sheba. Therefore the name of the city is still Beer-sheba today.";
csb[34] = "When Esau was forty years old, he took as his wives Judith daughter of Beeri the Hethite, and Basemath daughter of Elon the Hethite.";
csb[35] = "They made life bitter for Isaac and Rebekah.";
