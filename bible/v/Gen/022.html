csb[1] = "After these things God tested Abraham and said to him, &quot;Abraham! &quot; &quot;Here I am,&quot; he answered.";
csb[2] = "&quot;Take your son,&quot; he said, &quot;your only son Isaac, whom you love, go to the land of Moriah, and offer him there as a burnt offering on one of the mountains I will tell you about.&quot;";
csb[3] = "So Abraham got up early in the morning, saddled his donkey, and took with him two of his young men and his son Isaac. He split wood for a burnt offering and set out to go to the place God had told him about.";
csb[4] = "On the third day Abraham looked up and saw the place in the distance.";
csb[5] = "Then Abraham said to his young men, &quot;Stay here with the donkey. The boy and I will go over there to worship; then we\'ll come back to you.&quot;";
csb[6] = "Abraham took the wood for the burnt offering and laid it on his son Isaac. In his hand he took the fire and the knife, and the two of them walked on together.";
csb[7] = "Then Isaac spoke to his father Abraham and said, &quot;My father.&quot; And he replied, &quot;Here I am, my son.&quot; Isaac said, &quot;The fire and the wood are here, but where is the lamb for the burnt offering? &quot;";
csb[8] = "Abraham answered, &quot;God himself will provide the lamb for the burnt offering, my son.&quot; Then the two of them walked on together.";
csb[9] = "When they arrived at the place that God had told him about, Abraham built the altar there and arranged the wood. He bound his son Isaac and placed him on the altar on top of the wood.";
csb[10] = "Then Abraham reached out and took the knife to slaughter his son.";
csb[11] = "But the angel of the LORD called to him from heaven and said, &quot;Abraham, Abraham! &quot; He replied, &quot;Here I am.&quot;";
csb[12] = "Then he said, &quot;Do not lay a hand on the boy or do anything to him. For now I know that you fear God, since you have not withheld your only son from me.&quot;";
csb[13] = "Abraham looked up and saw a ram caught in the thicket by its horns. So Abraham went and took the ram and offered it as a burnt offering in place of his son.";
csb[14] = "And Abraham named that place The LORD Will Provide, so today it is said: &quot;It will be provided on the LORD\'s mountain.&quot;";
csb[15] = "Then the angel of the LORD called to Abraham a second time from heaven";
csb[16] = "and said, &quot;By myself I have sworn,&quot; this is the LORD\'s declaration: &quot;Because you have done this thing and have not withheld your only son,";
csb[17] = "&quot;I will indeed bless you and make your offspring as numerous as the stars of the sky and the sand on the seashore. Your offspring will possess the city gates of their enemies.";
csb[18] = "&quot;And all the nations of the earth will be blessed by your offspring because you have obeyed my command.&quot;";
csb[19] = "Abraham went back to his young men, and they got up and went together to Beer-sheba. And Abraham settled in Beer-sheba.";
csb[20] = "Now after these things Abraham was told, &quot;Milcah also has borne sons to your brother Nahor:";
csb[21] = "&quot;Uz his firstborn, his brother Buz, Kemuel the father of Aram,";
csb[22] = "&quot;Chesed, Hazo, Pildash, Jidlaph, and Bethuel.&quot;";
csb[23] = "And Bethuel fathered Rebekah. Milcah bore these eight to Nahor, Abraham\'s brother.";
csb[24] = "His concubine, whose name was Reumah, also bore Tebah, Gaham, Tahash, and Maacah.";
