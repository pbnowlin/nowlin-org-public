csb[1] = "When mankind began to multiply on the earth and daughters were born to them,";
csb[2] = "the sons of God saw that the daughters of mankind were beautiful, and they took any they chose as wives for themselves.";
csb[3] = "And the LORD said, &quot;My Spirit will not remain with mankind forever, because they are corrupt. Their days will be 120 years.&quot;";
csb[4] = "The Nephilim were on the earth both in those days and afterward, when the sons of God came to the daughters of mankind, who bore children to them. They were the powerful men of old, the famous men.";
csb[5] = "When the LORD saw that human wickedness was widespread on the earth and that every inclination of the human mind was nothing but evil all the time,";
csb[6] = "the LORD regretted that he had made man on the earth, and he was deeply grieved.";
csb[7] = "Then the LORD said, &quot;I will wipe mankind, whom I created, off the face of the earth, together with the animals, creatures that crawl, and birds of the sky -- for I regret that I made them.&quot;";
csb[8] = "Noah, however, found favor with the LORD.";
csb[9] = "These are the family records of Noah. Noah was a righteous man, blameless among his contemporaries; Noah walked with God.";
csb[10] = "And Noah fathered three sons: Shem, Ham, and Japheth.";
csb[11] = "Now the earth was corrupt in God\'s sight, and the earth was filled with wickedness.";

csb[13] = "Then God said to Noah, &quot;I have decided to put an end to every creature, for the earth is filled with wickedness because of them; therefore I am going to destroy them along with the earth.";
csb[14] = "&quot;Make yourself an ark of gopher wood. Make rooms in the ark, and cover it with pitch inside and outside.";
csb[15] = "&quot;This is how you are to make it\: The ark will be 450 feet long, 75 feet wide, and 45 feet high.";
csb[16] = "&quot;You are to make a roof, finishing the sides of the ark to within eighteen inches of the roof. You are to put a door in the side of the ark. Make it with lower, middle, and upper decks.";
csb[17] = "&quot;Understand that I am bringing a flood -- floodwaters on the earth to destroy every creature under heaven with the breath of life in it. Everything on earth will perish.";
csb[18] = "&quot;But I will establish my covenant with you, and you will enter the ark with your sons, your wife, and your sons\' wives.";
csb[19] = "&quot;You are also to bring into the ark two of all the living creatures, male and female, to keep them alive with you.";
csb[20] = "&quot;Two of everything -- from the birds according to their kinds, from the livestock according to their kinds, and from the animals that crawl on the ground according to their kinds -- will come to you so that you can keep them alive.";
csb[21] = "&quot;Take with you every kind of food that is eaten\; gather it as food for you and for them.&quot;";
csb[22] = "And Noah did this. He did everything that God had commanded him.";
</script>
