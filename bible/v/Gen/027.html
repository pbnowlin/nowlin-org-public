kjv[45] = "Until thy brother\'s anger turn away from thee, and he forget [that] which thou hast done to him: then I will send, and fetch thee from thence: why should I be deprived also of you both in one day?";
rsv[45] = "until your brother\'s anger turns away, and he forgets what you have done to him; then I will send, and fetch you from there. Why should I be bereft of you both in one day?&quot;";
asv[45] = "until thy brother\'s anger turn away from thee, and he forget that which thou hast done to him: then I will send, and fetch thee from thence: why should I be bereaved of you both in one day?";
yng[45] = "till thy brother\'s anger turn back from thee, and he hath forgotten that which thou hast done to him, and I have sent and taken thee from thence; why am I bereaved even of you both the same day?\'";
dby[45] = "until thy brother\'s anger turn away from thee, and he forget what thou hast done to him; then I will send and fetch thee thence. Why should I be bereaved even of you both in one day?";
web[45] = "Till thy brother\'s anger shall turn away from thee, and he shall forget [that] which thou hast done to him: then I will send, and bring thee from thence. Why should I be deprived also of you both in one day?";
hnv[45] = "until your brother\'s anger turn away from you, and he forgets what you have done to him. Then I will send, and get you from there. Why should I be bereaved of you both in one day?&quot;";
vul[45] = "et cesset indignatio eius obliviscaturque eorum quae fecisti in eum postea mittam et adducam te inde huc cur utroque orbabor filio in una die";
kjv[46] = "And Rebekah said to Isaac, I am weary of my life because of the daughters of Heth: if Jacob take a wife of the daughters of Heth, such as these [which are] of the daughters of the land, what good shall my life do me?";
rsv[46] = "Then Rebekah said to Isaac, &quot;I am weary of my life because of the Hittite women. If Jacob marries one of the Hittite women such as these, one of the women of the land, what good will my life be to me?&quot;";
asv[46] = "And Rebekah said to Isaac, I am weary of my life because of the daughters of Heth: if Jacob take a wife of the daughters of Heth, such as these, of the daughters of the land, what good shall my life do me?";
yng[46] = "And Rebekah saith unto Isaac, `I have been disgusted with my life because of the presence of the daughters of Heth; if Jacob take a wife of the daughters of Heth, like these -- from the daughters of the land -- why do I live?\'";
dby[46] = "And Rebecca said to Isaac, I am weary of my life because of the daughters of Heth. If Jacob take a wife of the daughters of Heth, such as these, of the daughters of the land, what good should my life do me?";
web[46] = "And Rebekah said to Isaac, I am weary of my life, because of the daughters of Heth: if Jacob shall take a wife of the daughters of Heth, such as these [who are] of the daughters of the land, what good will my life do me?";
hnv[46] = "Rivka said to Yitzchak, &quot;I am weary of my life because of the daughters of Het. If Ya`akov takes a wife of the daughters of Het, such as these, of the daughters of the land, what good will my life do me?&quot;";
vul[46] = "dixit quoque Rebecca ad Isaac taedet me vitae meae propter filias Heth si acceperit Iacob uxorem de stirpe huius terrae nolo vivere";
csb[1] = "When Isaac was old and his eyes were so weak that he could not see, he called his older son Esau and said to him, &quot;My son.&quot; And he answered, &quot;Here I am.&quot;";
csb[2] = "He said, &quot;Look, I am old and do not know the day of my death.";
csb[3] = "&quot;So now take your hunting gear, your quiver and bow, and go out in the field to hunt some game for me.";
csb[4] = "&quot;Then make me a delicious meal that I love and bring it to me to eat, so that I can bless you before I die.&quot;";
csb[5] = "Now Rebekah was listening to what Isaac said to his son Esau. So while Esau went to the field to hunt some game to bring in,";
csb[6] = "Rebekah said to her son Jacob, &quot;Listen! I heard your father talking with your brother Esau. He said,";
csb[7] = "&quot;\'Bring me game and make a delicious meal for me to eat so that I can bless you in the LORD\'s presence before I die.\'";
csb[8] = "&quot;Now, my son, listen to me and do what I tell you.";
csb[9] = "&quot;Go to the flock and bring me two choice young goats, and I will make them into a delicious meal for your father -- the kind he loves.";
csb[10] = "&quot;Then take it to your father to eat so that he may bless you before he dies.&quot;";
csb[11] = "Jacob answered Rebekah his mother, &quot;Look, my brother Esau is a hairy man, but I am a man with smooth skin.";
csb[12] = "&quot;Suppose my father touches me. Then I will be revealed to him as a deceiver and bring a curse rather than a blessing on myself.&quot;";
csb[13] = "His mother said to him, &quot;Your curse be on me, my son. Just obey me and go get them for me.&quot;";
csb[14] = "So he went and got the goats and brought them to his mother, and his mother made the delicious food his father loved.";
csb[15] = "Then Rebekah took the best clothes of her older son Esau, which were in the house, and had her younger son Jacob wear them.";
csb[16] = "She put the skins of the young goats on his hands and the smooth part of his neck.";
csb[17] = "Then she handed the delicious food and the bread she had made to her son Jacob.";
csb[18] = "When he came to his father, he said, &quot;My father.&quot; And he answered, &quot;Here I am. Who are you, my son? &quot;";
csb[19] = "Jacob replied to his father, &quot;I am Esau, your firstborn. I have done as you told me. Please sit up and eat some of my game so that you may bless me.&quot;";
csb[20] = "But Isaac said to his son, &quot;How did you ever find it so quickly, my son? &quot; He replied, &quot;Because the LORD your God made it happen for me.&quot;";
csb[21] = "Then Isaac said to Jacob, &quot;Please come closer so I can touch you, my son. Are you really my son Esau or not? &quot;";
csb[22] = "So Jacob came closer to his father Isaac. When he touched him, he said, &quot;The voice is the voice of Jacob, but the hands are the hands of Esau.&quot;";
csb[23] = "He did not recognize him, because his hands were hairy like those of his brother Esau; so he blessed him.";
csb[24] = "Again he asked, &quot;Are you really my son Esau? &quot; And he replied, &quot;I am.&quot;";
csb[25] = "Then he said, &quot;Bring it closer to me, and let me eat some of my son\'s game so that I can bless you.&quot; Jacob brought it closer to him, and he ate; he brought him wine, and he drank.";
csb[26] = "Then his father Isaac said to him, &quot;Please come closer and kiss me, my son.&quot;";
csb[27] = "So he came closer and kissed him. When Isaac smelled his clothes, he blessed him and said: Ah, the smell of my son is like the smell of a field that the LORD has blessed.";
csb[28] = "May God give to you -- from the dew of the sky and from the richness of the land -- an abundance of grain and new wine.";
csb[29] = "May peoples serve you and nations bow in worship to you. Be master over your relatives; may your mother\'s sons bow in worship to you. Those who curse you will be cursed, and those who bless you will be blessed.";
csb[30] = "As soon as Isaac had finished blessing Jacob and Jacob had left the presence of his father Isaac, his brother Esau arrived from his hunting.";
csb[31] = "He had also made some delicious food and brought it to his father. He said to his father, &quot;Let my father get up and eat some of his son\'s game, so that you may bless me.&quot;";
csb[32] = "But his father Isaac said to him, &quot;Who are you? &quot; He answered, &quot;I am Esau your firstborn son.&quot;";
csb[33] = "Isaac began to tremble uncontrollably. &quot;Who was it then,&quot; he said, &quot;who hunted game and brought it to me? I ate it all before you came in, and I blessed him. Indeed, he will be blessed! &quot;";
csb[34] = "When Esau heard his father\'s words, he cried out with a loud and bitter cry and said to his father, &quot;Bless me too, my father! &quot;";
csb[35] = "But he replied, &quot;Your brother came deceitfully and took your blessing.&quot;";
csb[36] = "So he said, &quot;Isn\'t he rightly named Jacob? For he has cheated me twice now. He took my birthright, and look, now he has taken my blessing.&quot; Then he asked, &quot;Haven\'t you saved a blessing for me? &quot;";
csb[37] = "But Isaac answered Esau, &quot;Look, I have made him a master over you, have given him all of his relatives as his servants, and have sustained him with grain and new wine. What then can I do for you, my son? &quot;";
csb[38] = "Esau said to his father, &quot;Do you have only one blessing, my father? Bless me too, my father! &quot; And Esau wept loudly.";
csb[39] = "His father Isaac answered him, Look, your dwelling place will be away from the richness of the land, away from the dew of the sky above.";
csb[40] = "You will live by your sword, and you will serve your brother. But when you rebel, you will break his yoke from your neck.";
csb[41] = "Esau held a grudge against Jacob because of the blessing his father had given him. And Esau determined in his heart: &quot;The days of mourning for my father are approaching; then I will kill my brother Jacob.&quot;";
csb[42] = "When the words of her older son Esau were reported to Rebekah, she summoned her younger son Jacob and said to him, &quot;Listen, your brother Esau is consoling himself by planning to kill you.";
csb[43] = "&quot;So now, my son, listen to me. Flee at once to my brother Laban in Haran,";
csb[44] = "&quot;and stay with him for a few days until your brother\'s anger subsides --";
csb[45] = "&quot;until your brother\'s rage turns away from you and he forgets what you have done to him. Then I will send for you and bring you back from there. Why should I lose you both in one day? &quot;";
csb[46] = "So Rebekah said to Isaac, &quot;I\'m sick of my life because of these Hethite girls. If Jacob marries someone from around here, like these Hethite girls, what good is my life? &quot;";
</script>
