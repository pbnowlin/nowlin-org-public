dby[26] = "The blessings of thy father surpass the blessings of my ancestors, Unto the bounds of the everlasting hills: They shall be on the head of Joseph, And on the crown of the head of him that was separated from his brethren.";

hnv[26] = "The blessings of your father Have prevailed above the blessings of the ancient mountains, Above the bounty of the age-old hills. They will be on the head of Yosef, On the crown of the head of him who is separated from his brothers.";

kjv[33] = "And when Jacob had made an end of commanding his sons, he gathered up his feet into the bed, and yielded up the ghost, and was gathered unto his people.";

asv[33] = "And when Jacob made an end of charging his sons, he gathered up his feet into the bed, and yielded up the ghost, and was gathered unto his people.";

csb[1] = "Then Jacob called his sons and said, &quot;Gather around, and I will tell you what will happen to you in the days to come.";
csb[2] = "&quot;Come together and listen, sons of Jacob; listen to your father Israel:";
csb[3] = "&quot;Reuben, you are my firstborn, my strength and the firstfruits of my virility, excelling in prominence, excelling in power.";
csb[4] = "&quot;Turbulent as water, you will not excel, because you got into your father\'s bed and you defiled it -- he got into my bed.";
csb[5] = "&quot;Simeon and Levi are brothers; their knives are vicious weapons.";
csb[6] = "&quot;May I never enter their council; may I never join their assembly. For in their anger they kill men, and on a whim they hamstring oxen.";
csb[7] = "&quot;Their anger is cursed, for it is strong, and their fury, for it is cruel! I will disperse them throughout Jacob and scatter them throughout Israel.";
csb[8] = "&quot;Judah, your brothers will praise you. Your hand will be on the necks of your enemies; your father\'s sons will bow down to you.";
csb[9] = "&quot;Judah is a young lion -- my son, you return from the kill. He crouches; he lies down like a lion or a lioness -- who dares to rouse him?";
csb[10] = "&quot;The scepter will not depart from Judah or the staff from between his feet until he whose right it is comes and the obedience of the peoples belongs to him.";
csb[11] = "&quot;He ties his donkey to a vine, and the colt of his donkey to the choice vine. He washes his clothes in wine and his robes in the blood of grapes.";
csb[12] = "&quot;His eyes are darker than wine, and his teeth are whiter than milk.";
csb[13] = "&quot;Zebulun will live by the seashore and will be a harbor for ships, and his territory will be next to Sidon.";
csb[14] = "&quot;Issachar is a strong donkey lying down between the saddlebags.";
csb[15] = "&quot;He saw that his resting place was good and that the land was pleasant, so he leaned his shoulder to bear a load and became a forced laborer.";
csb[16] = "&quot;Dan will judge his people as one of the tribes of Israel.";
csb[17] = "&quot;Dan will be a snake by the road, a viper beside the path, that bites the horses\' heels so that its rider falls backward.";
csb[18] = "&quot;I wait for your salvation, LORD .";
csb[19] = "&quot;Gad will be attacked by raiders, but he will attack their heels.";
csb[20] = "&quot;Asher\'s food will be rich, and he will produce royal delicacies.";
csb[21] = "&quot;Naphtali is a doe set free that bears beautiful fawns.";
csb[22] = "&quot;Joseph is a fruitful vine, a fruitful vine beside a spring; its branches climb over the wall.";
csb[23] = "&quot;The archers attacked him, shot at him, and were hostile toward him.";
csb[24] = "&quot;Yet his bow remained steady, and his strong arms were made agile by the hands of the Mighty One of Jacob, by the name of the Shepherd, the Rock of Israel,";
csb[25] = "&quot;by the God of your father who helps you, and by the Almighty who blesses you with blessings of the heavens above, blessings of the deep that lies below, and blessings of the breasts and the womb.";
csb[26] = "&quot;The blessings of your father excel the blessings of my ancestors and the bounty of the ancient hills. May they rest on the head of Joseph, on the brow of the prince of his brothers.";
csb[27] = "&quot;Benjamin is a wolf; he tears his prey. In the morning he devours the prey, and in the evening he divides the plunder.&quot;";
csb[28] = "These are the tribes of Israel, twelve in all, and this is what their father said to them. He blessed them, and he blessed each one with a suitable blessing.";
csb[29] = "Then he commanded them: &quot;I am about to be gathered to my people. Bury me with my fathers in the cave in the field of Ephron the Hethite.";
csb[30] = "&quot;The cave is in the field of Machpelah near Mamre, in the land of Canaan. This is the field Abraham purchased from Ephron the Hethite as burial property.";
csb[31] = "&quot;Abraham and his wife Sarah are buried there, Isaac and his wife Rebekah are buried there, and I buried Leah there.";
csb[32] = "&quot;The field and the cave in it were purchased from the Hethites.&quot;";
csb[33] = "When Jacob had finished giving charges to his sons, he drew his feet into the bed, took his last breath, and was gathered to his people.";
