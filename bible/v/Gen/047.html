kjv[1] = "Then Joseph came and told Pharaoh, and said, My father and my brethren, and their flocks, and their herds, and all that they have, are come out of the land of Canaan; and, behold, they [are] in the land of Goshen.";
rsv[1] = "So Joseph went in and told Pharaoh, &quot;My father and my brothers, with their flocks and herds and all that they possess, have come from the land of Canaan; they are now in the land of Goshen.&quot;";
asv[1] = "Then Joseph went in and told Pharaoh, and said, My father and my brethren, and their flocks, and their herds, and all that they have, are come out of the land of Canaan; and, behold, they are in the land of Goshen.";
yng[1] = "And Joseph cometh, and declareth to Pharaoh, and saith, `My father, and my brethren, and their flock, and their herd, and all they have, have come from the land of Canaan, and lo, they [are] in the land of Goshen.\'";
dby[1] = "And Joseph came and told Pharaoh and said, My father and my brethren, and their sheep and their cattle, and all that they have, are come out of the land of Canaan; and behold, they are in the land of Goshen.";
web[1] = "Then Joseph came and told Pharaoh, and said, My father and my brethren, and their flocks, and their herds, and all that they have, have come from the land of Canaan; and behold, they [are] in the land of Goshen.";

vul[1] = "ingressus ergo Ioseph nuntiavit Pharaoni dicens pater meus et fratres oves eorum et armenta et cuncta quae possident venerunt de terra Chanaan et ecce consistunt in terra Gessen";

web[2] = "And he took some of his brethren, [even] five men, and presented them to Pharaoh.";

vul[2] = "extremos quoque fratrum suorum quinque viros statuit coram rege";
kjv[3] = "And Pharaoh said unto his brethren, What [is] your occupation? And they said unto Pharaoh, Thy servants [are] shepherds, both we, [and] also our fathers.";
rsv[3] = "Pharaoh said to his brothers, &quot;What is your occupation?&quot; And they said to Pharaoh, &quot;Your servants are shepherds, as our fathers were.&quot;";
asv[3] = "And Pharaoh said unto his brethren, What is your occupation? And they said unto Pharaoh, Thy servants are shepherds, both we, and our fathers.";
yng[3] = "and Pharaoh saith unto his brethren, `What [are] your works?\' and they say unto Pharaoh, `Thy servants [are] feeders of a flock, both we and our fathers;\'";
dby[3] = "And Pharaoh said to his brethren, What is your occupation? And they said to Pharaoh, Thy servants are shepherds, both we and our fathers.";
web[3] = "And Pharaoh said to his brethren, What [is] your occupation? And they said to Pharaoh, Thy servants [are] shepherds, both we, [and] also our fathers.";
hnv[3] = "Par`oh said to his brothers, &quot;What is your occupation?&quot; They said to Par`oh, &quot;Your servants are shepherds, both we, and our fathers.&quot;";
vul[3] = "quos ille interrogavit quid habetis operis responderunt pastores ovium sumus servi tui et nos et patres nostri";
kjv[4] = "They said moreover unto Pharaoh, For to sojourn in the land are we come; for thy servants have no pasture for their flocks; for the famine [is] sore in the land of Canaan: now therefore, we pray thee, let thy servants dwell in the land of Goshen.";
rsv[4] = "They said to Pharaoh, &quot;We have come to sojourn in the land; for there is no pasture for your servants\' flocks, for the famine is severe in the land of Canaan; and now, we pray you, let your servants dwell in the land of Goshen.&quot;";
asv[4] = "And they said unto Pharaoh, To sojourn in the land are we come; for there is no pasture for thy servants\' flocks; for the famine is sore in the land of Canaan: now therefore, we pray thee, let thy servants dwell in the land of Goshen.";
yng[4] = "and they say unto Pharaoh, `To sojourn in the land we have come, for there is no pasture for the flock which thy servants have, for grievous [is] the famine in the land of Canaan; and now, let thy servants, we pray thee, dwell in the land of Goshen.\'";
dby[4] = "And they said to Pharaoh, To sojourn in the land are we come; for there is no pasture for the sheep that thy servants have, for the famine is grievous in the land of Canaan; and now, we pray thee, let thy servants dwell in the land of Goshen.";
web[4] = "They said moreover to Pharaoh, We have come to sojourn in the land: for thy servants have no pasture for their flocks, for the famine [is] severe in the land of Canaan: now therefore, we pray thee, let thy servants dwell in the land of Goshen.";
hnv[4] = "They said to Par`oh, &quot;We have come to live as foreigners in the land, for there is no pasture for your servants\' flocks. For the famine is severe in the land of Kana`an. Now therefore, please let your servants dwell in the land of Goshen.&quot;";
vul[4] = "ad peregrinandum in terra tua venimus quoniam non est herba gregibus servorum tuorum ingravescente fame in regione Chanaan petimusque ut esse nos iubeas servos tuos in terra Gessen";
kjv[5] = "And Pharaoh spake unto Joseph, saying, Thy father and thy brethren are come unto thee:";
rsv[5] = "Then Pharaoh said to Joseph, &quot;Your father and your brothers have come to you.";
asv[5] = "And Pharaoh spake unto Joseph, saying, Thy father and thy brethren are come unto thee:";
yng[5] = "And Pharaoh speaketh unto Joseph, saying, `Thy father and thy brethren have come unto thee:";
dby[5] = "And Pharaoh spoke to Joseph, saying, Thy father and thy brethren are come to thee.";
web[5] = "And Pharaoh spoke to Joseph, saying, Thy father and thy brethren have come to thee:";
hnv[5] = "Par`oh spoke to Yosef, saying, &quot;Your father and your brothers have come to you.";
vul[5] = "dixit itaque rex ad Ioseph pater tuus et fratres tui venerunt ad te";
kjv[6] = "The land of Egypt [is] before thee; in the best of the land make thy father and brethren to dwell; in the land of Goshen let them dwell: and if thou knowest [any] men of activity among them, then make them rulers over my cattle.";
rsv[6] = "The land of Egypt is before you; settle your father and your brothers in the best of the land; let them dwell in the land of Goshen; and if you know any able men among them, put them in charge of my cattle.&quot;";
asv[6] = "the land of Egypt is before thee; in the best of the land make thy father and thy brethren to dwell; in the land of Goshen let them dwell: and if thou knowest any able men among them, then make them rulers over my cattle.";
yng[6] = "the land of Egypt is before thee; in the best of the land cause thy father and thy brethren to dwell -- they dwell in the land of Goshen, and if thou hast known, and there are among them men of ability, then thou hast set them heads over the cattle I have.\'";
dby[6] = "The land of Egypt is before thee; in the best of the land settle thy father and thy brethren: let them dwell in the land of Goshen. And if thou knowest men of activity among them, then set them as overseers of cattle over what I have.";
web[6] = "The land of Egypt [is] before thee; in the best of the land make thy father and brethren to dwell; in the land of Goshen let them dwell; and if thou knowest [any] men of activity among them, then make them rulers over my cattle.";
hnv[6] = "The land of Mitzrayim is before you. Make your father and your brothers dwell in the best of the land. Let them dwell in the land of Goshen. If you know any able men among them, then put them in charge of my cattle.&quot;";
vul[6] = "terra Aegypti in conspectu tuo est in optimo loco fac habitare eos et trade eis terram Gessen quod si nosti esse in eis viros industrios constitue illos magistros pecorum meorum";
kjv[7] = "And Joseph brought in Jacob his father, and set him before Pharaoh: and Jacob blessed Pharaoh.";
rsv[7] = "Then Joseph brought in Jacob his father, and set him before Pharaoh, and Jacob blessed Pharaoh.";
asv[7] = "And Joseph brought in Jacob his father, and set him before Pharaoh: and Jacob blessed Pharaoh.";

dby[7] = "And Joseph brought Jacob his father, and set him before Pharaoh. And Jacob blessed Pharaoh.";

dby[8] = "And Pharaoh said to Jacob, How many are the days of the years of thy life?";
web[8] = "And Pharaoh said to Jacob, How old [art] thou?";
hnv[8] = "Par`oh said to Ya`akov, &quot;How many are the days of the years of your life?&quot;";
vul[8] = "et interrogatus ab eo quot sunt dies annorum vitae tuae";
kjv[9] = "And Jacob said unto Pharaoh, The days of the years of my pilgrimage [are] an hundred and thirty years: few and evil have the days of the years of my life been, and have not attained unto the days of the years of the life of my fathers in the days of their pilgrimage.";
rsv[9] = "And Jacob said to Pharaoh, &quot;The days of the years of my sojourning are a hundred and thirty years; few and evil have been the days of the years of my life, and they have not attained to the days of the years of the life of my fathers in the days of their sojourning.&quot;";
asv[9] = "And Jacob said unto Pharaoh, The days of the years of my pilgrimage are a hundred and thirty years: few and evil have been the days of the years of my life, and they have not attained unto the days of the years of the life of my fathers in the days of their pilgrimage.";
yng[9] = "And Jacob saith unto Pharaoh, `The days of the years of my sojournings [are] an hundred and thirty years; few and evil have been the days of the years of my life, and they have not reached the days of the years of the life of my fathers, in the days of their sojournings.\'";
dby[9] = "And Jacob said to Pharaoh, The days of the years of my sojourning are a hundred and thirty years. Few and evil have been the days of the years of my life, and they do not attain to the days of the years of the life of my fathers, in the days of their sojourning.";
web[9] = "And Jacob said to Pharaoh, The days of the years of my pilgrimage [are] a hundred and thirty years: few and evil have been the days of the years of my life, nor have they attained to the days of the years of the life of my fathers in the days of their pilgrimage.";
hnv[9] = "Ya`akov said to Par`oh, &quot;The days of the years of my pilgrimage are one hundred thirty years. Few and evil have been the days of the years of my life, and they have not attained to the days of the years of the life of my fathers in the days of their pilgrimage.&quot;";
vul[9] = "respondit dies peregrinationis vitae meae centum triginta annorum sunt parvi et mali et non pervenerunt usque ad dies patrum meorum quibus peregrinati sunt";

web[12] = "And Joseph nourished his father, and his brethren, and all his father\'s household, with bread according to [their] families.";
hnv[12] = "Yosef nourished his father, his brothers, and all of his father\'s household, with bread, according to their families.";

asv[13] = "And there was no bread in all the land; for the famine was very sore, so that the land of Egypt and the land of Canaan fainted by reason of the famine.";
yng[13] = "And there is no bread in all the land, for the famine [is] very grievous, and the land of Egypt and the land of Canaan are feeble because of the famine;";
dby[13] = "And there was no bread in all the land; for the famine was very grievous; and the land of Egypt and the land of Canaan were exhausted through the famine.";

rsv[14] = "And Joseph gathered up all the money that was found in the land of Egypt and in the land of Canaan, for the grain which they bought; and Joseph brought the money into Pharaoh\'s house.";
asv[14] = "And Joseph gathered up all the money that was found in the land of Egypt, and in the land of Canaan, for the grain which they bought: and Joseph brought the money into Pharaoh\'s house.";
yng[14] = "and Joseph gathereth all the silver that is found in the land of Egypt, and in the land of Canaan, for the corn that they are buying, and Joseph bringeth the silver into the house of Pharaoh.";
dby[14] = "And Joseph gathered up all the money that was found in the land of Egypt, and in the land of Canaan, for the grain which they bought; and Joseph brought the money into Pharaoh\'s house.";
web[14] = "And Joseph gathered all the money that was found in the land of Egypt, and in the land of Canaan, for the corn which they bought: and Joseph brought the money into Pharaoh\'s house.";
hnv[14] = "Yosef gathered up all the money that was found in the land of Mitzrayim, and in the land of Kana`an, for the grain which they bought: and Yosef brought the money into Par`oh\'s house.";

kjv[15] = "And when money failed in the land of Egypt, and in the land of Canaan, all the Egyptians came unto Joseph, and said, Give us bread: for why should we die in thy presence? for the money faileth.";
rsv[15] = "And when the money was all spent in the land of Egypt and in the land of Canaan, all the Egyptians came to Joseph, and said, &quot;Give us food; why should we die before your eyes? For our money is gone.&quot;";
asv[15] = "And when the money was all spent in the land of Egypt, and in the land of Canaan, all the Egyptians came unto Joseph, and said, Give us bread: for why should we die in thy presence? for [our] money faileth.";
yng[15] = "And the silver is consumed out of the land of Egypt, and out of the land of Canaan, and all the Egyptians come in unto Joseph, saying, `Give to us bread -- why do we die before thee, though the money hath ceased?\'";
dby[15] = "And when money came to an end in the land of Egypt and in the land of Canaan, all the Egyptians came to Joseph, saying, Give us bread! for why should we die before thee? for [our] money is all gone.";
web[15] = "And when money failed in the land of Egypt, and in the land of Canaan, all the Egyptians came to Joseph, and said, Give us bread: for why should we die in thy presence: for the money faileth.";
hnv[15] = "When the money was all spent in the land of Mitzrayim, and in the land of Kana`an, all the Mitzrim came to Yosef, and said, &quot;Give us bread, for why should we die in your presence? For our money fails.&quot;";
vul[15] = "cumque defecisset emptoris pretium venit cuncta Aegyptus ad Ioseph dicens da nobis panes quare morimur coram te deficiente pecunia";
kjv[16] = "And Joseph said, Give your cattle; and I will give you for your cattle, if money fail.";
rsv[16] = "And Joseph answered, &quot;Give your cattle, and I will give you food in exchange for your cattle, if your money is gone.&quot;";
asv[16] = "And Joseph said, Give your cattle; and I will give you for your cattle, if money fail.";
yng[16] = "and Joseph saith, `Give your cattle; and I give to you for your cattle, if the money hath ceased.\'";
dby[16] = "And Joseph said, Give your cattle, and I will give you for your cattle, if [your] money be all gone.";
web[16] = "And Joseph said, Give your cattle; and I will give you for your cattle, if money hath failed.";
hnv[16] = "Yosef said, &quot;Give your cattle; and I will give you food for your cattle, if money fails.&quot;";
vul[16] = "quibus ille respondit adducite pecora vestra et dabo vobis pro eis cibos si pretium non habetis";
kjv[17] = "And they brought their cattle unto Joseph: and Joseph gave them bread [in exchange] for horses, and for the flocks, and for the cattle of the herds, and for the asses: and he fed them with bread for all their cattle for that year.";
rsv[17] = "So they brought their cattle to Joseph; and Joseph gave them food in exchange for the horses, the flocks, the herds, and the asses: and he supplied them with food in exchange for all their cattle that year.";
asv[17] = "And they brought their cattle unto Joseph; and Joseph gave them bread in exchange for the horses, and for the flocks, and for the herds, and for the asses: and he fed them with bread in exchange for all their cattle for that year.";
yng[17] = "And they bring in their cattle unto Joseph, and Joseph giveth to them bread, for the horses, and for the cattle of the flock, and for the cattle of the herd, and for the asses; and he tendeth them with bread, for all their cattle, during that year.";
dby[17] = "And they brought their cattle to Joseph; and Joseph gave them bread for horses, and for flocks of sheep, and for herds of cattle, and for asses; and he fed them with bread for all their cattle that year.";
web[17] = "And they brought their cattle to Joseph: and Joseph gave them bread [in exchange] for horses, and for the flocks, and for the cattle of the herds, and for the asses; and he fed them with bread, for all their cattle, for that year.";
hnv[17] = "They brought their cattle to Yosef, and Yosef gave them bread in exchange for the horses, and for the flocks, and for the herds, and for the donkeys: and he fed them with bread in exchange for all their cattle for that year.";
vul[17] = "quae cum adduxissent dedit eis alimenta pro equis et ovibus et bubus et asinis sustentavitque eos illo anno pro commutatione pecorum";
kjv[18] = "When that year was ended, they came unto him the second year, and said unto him, We will not hide [it] from my lord, how that our money is spent; my lord also hath our herds of cattle; there is not ought left in the sight of my lord, but our bodies, and our lands:";
rsv[18] = "And when that year was ended, they came to him the following year, and said to him, &quot;We will not hide from my lord that our money is all spent; and the herds of cattle are my lord\'s; there is nothing left in the sight of my lord but our bodies and our lands.";
asv[18] = "And when that year was ended, they came unto him the second year, and said unto him, We will not hide from my lord, how that our money is all spent; and the herds of cattle are my lord\'s; there is nought left in the sight of my lord, but our bodies, and our lands:";
yng[18] = "And that year is finished, and they come in unto him on the second year, and say to him, `We do not hide from my lord, that since the money hath been finished, and possession of the cattle [is] unto my lord, there hath not been left before my lord save our bodies, and our ground;";
dby[18] = "And that year ended; and they came to him the second year, and said to him, We will not hide [it] from my lord that since [our] money is come to an end, and the herds of cattle are in the possession of my lord, nothing is left before my lord but our bodies and our land.";
web[18] = "When that year was ended, they came to him the second year, and said to him, We will not hide from my lord, how that our money is spent; my lord also hath our herds of cattle; there is not aught left in the sight of my lord, but our bodies and our lands:";
hnv[18] = "When that year was ended, they came to him the second year, and said to him, &quot;We will not hide from my lord how our money is all spent, and the herds of cattle are my lord\'s. There is nothing left in the sight of my lord, but our bodies, and our lands.";
vul[18] = "veneruntque anno secundo et dixerunt ei non celamus dominum nostrum quod deficiente pecunia pecora simul defecerint nec clam te est quod absque corporibus et terra nihil habeamus";
kjv[19] = "Wherefore shall we die before thine eyes, both we and our land? buy us and our land for bread, and we and our land will be servants unto Pharaoh: and give [us] seed, that we may live, and not die, that the land be not desolate.";
rsv[19] = "Why should we die before your eyes, both we and our land? Buy us and our land for food, and we with our land will be slaves to Pharaoh; and give us seed, that we may live, and not die, and that the land may not be desolate.&quot;";
asv[19] = "wherefore should we die before thine eyes, both we and our land? buy us and our land for bread, and we and our land will be servants unto Pharaoh: and give us seed, that we may live, and not die, and that the land be not desolate.";
yng[19] = "why do we die before thine eyes, both we and our ground? buy us and our ground for bread, and we and our ground are servants to Pharaoh; and give seed, and we live, and die not, and the ground is not desolate.\'";
dby[19] = "Why should we die before thine eyes, both we and our land? Buy us and our land for bread, and we and our land will be bondmen to Pharaoh; and give seed, that we may live, and not die, and that the land be not desolate.";
web[19] = "Why shall we die before thy eyes, both we and our land? buy us and our land for bread, and we and our land will be servants to Pharaoh: and give [us] seed, that we may live, and not die, that the land be not desolate.";
hnv[19] = "Why should we die before your eyes, both we and our land? Buy us and our land for bread, and we and our land will be servants to Par`oh. Give us seed, that we may live, and not die, and that the land won\'t be desolate.&quot;";
vul[19] = "cur ergo morimur te vidente et nos et terra nostra tui erimus eme nos in servitutem regiam et praebe semina ne pereunte cultore redigatur terra in solitudinem";
kjv[20] = "And Joseph bought all the land of Egypt for Pharaoh; for the Egyptians sold every man his field, because the famine prevailed over them: so the land became Pharaoh\'s.";
rsv[20] = "So Joseph bought all the land of Egypt for Pharaoh; for all the Egyptians sold their fields, because the famine was severe upon them. The land became Pharaoh\'s;";
asv[20] = "So Joseph bought all the land of Egypt for Pharaoh; for the Egyptians sold every man his field, because the famine was sore upon them: and the land became Pharaoh\'s.";
yng[20] = "And Joseph buyeth all the ground of Egypt for Pharaoh, for the Egyptians have sold each his field, for the famine hath been severe upon them, and the land becometh Pharaoh\'s;";
dby[20] = "And Joseph bought all the soil of Egypt for Pharaoh; for the Egyptians sold every man his field, because the famine prevailed over them; and the land became Pharaoh\'s.";
web[20] = "And Joseph bought all the land of Egypt for Pharaoh; for the Egyptians sold every man his field, because the famine prevailed over them: so the land became Pharaoh\'s.";
hnv[20] = "So Yosef bought all the land of Mitzrayim for Par`oh, for the Mitzrim sold every man his field, because the famine was severe on them, and the land became Par`oh\'s.";
vul[20] = "emit igitur Ioseph omnem terram Aegypti vendentibus singulis possessiones suas prae magnitudine famis subiecitque eam Pharaoni";
kjv[21] = "And as for the people, he removed them to cities from [one] end of the borders of Egypt even to the [other] end thereof.";
rsv[21] = "and as for the people, he made slaves of them from one end of Egypt to the other.";
asv[21] = "And as for the people, he removed them to the cities from one end of the border of Egypt even to the other end thereof.";
yng[21] = "as to the people he hath removed them to cities from the [one] end of the border of Egypt even unto its [other] end.";
dby[21] = "And as for the people, he removed them into the cities, from [one] end of the borders of Egypt even to the [other] end of it.";
web[21] = "And as for the people, he removed them to cities from [one] end of the borders of Egypt even to the [other] end thereof.";
hnv[21] = "As for the people, he moved them to the cities from one end of the border of Mitzrayim even to the other end of it.";
vul[21] = "et cunctos populos eius a novissimis terminis Aegypti usque ad extremos fines eius";
kjv[22] = "Only the land of the priests bought he not; for the priests had a portion [assigned them] of Pharaoh, and did eat their portion which Pharaoh gave them: wherefore they sold not their lands.";
rsv[22] = "Only the land of the priests he did not buy; for the priests had a fixed allowance from Pharaoh, and lived on the allowance which Pharaoh gave them; therefore they did not sell their land.";
asv[22] = "Only the land of the priests bought he not: for the priests had a portion from Pharaoh, and did eat their portion which Pharaoh gave them; wherefore they sold not their land.";
yng[22] = "Only the ground of the priests he hath not bought, for the priests have a portion from Pharaoh, and they have eaten their portion which Pharaoh hath given to them, therefore they have not sold their ground.";
dby[22] = "Only the land of the priests he did not buy; for the priests had an assigned portion from Pharaoh, and ate their assigned portion which Pharaoh had given them; so they did not sell their land.";
web[22] = "Only the land of the priests bought he not; for the priests had a portion [assigned them] by Pharaoh, and ate their portion which Pharaoh gave them: wherefore they sold not their lands.";
hnv[22] = "Only he didn\'t buy the land of the Kohanim, for the Kohanim had a portion from Par`oh, and ate their portion which Par`oh gave them. That is why they didn\'t sell their land.";
vul[22] = "praeter terram sacerdotum quae a rege tradita fuerat eis quibus et statuta cibaria ex horreis publicis praebebantur et idcirco non sunt conpulsi vendere possessiones suas";
kjv[23] = "Then Joseph said unto the people, Behold, I have bought you this day and your land for Pharaoh: lo, [here is] seed for you, and ye shall sow the land.";
rsv[23] = "Then Joseph said to the people, &quot;Behold, I have this day bought you and your land for Pharaoh. Now here is seed for you, and you shall sow the land.";
asv[23] = "Then Joseph said unto the people, Behold, I have bought you this day and your land for Pharaoh: lo, here is seed for you, and ye shall sow the land.";
yng[23] = "And Joseph saith unto the people, `Lo, I have bought you to-day and your ground for Pharaoh; lo, seed for you, and ye have sown the ground,";
dby[23] = "And Joseph said to the people, Behold, I have bought you this day and your land for Pharaoh: lo, here is seed for you, and sow the land.";
web[23] = "Then Joseph said to the people, Behold, I have bought you this day and your land for Pharaoh: lo, [here is] seed for you, and ye shall sow the land.";
hnv[23] = "Then Yosef said to the people, &quot;Behold, I have bought you and your land today for Par`oh. Behold, here is seed for you, and you shall sow the land.";
vul[23] = "dixit ergo Ioseph ad populos en ut cernitis et vos et terram vestram Pharao possidet accipite semina et serite agros";
kjv[24] = "And it shall come to pass in the increase, that ye shall give the fifth [part] unto Pharaoh, and four parts shall be your own, for seed of the field, and for your food, and for them of your households, and for food for your little ones.";
rsv[24] = "And at the harvests you shall give a fifth to Pharaoh, and four fifths shall be your own, as seed for the field and as food for yourselves and your households, and as food for your little ones.&quot;";
asv[24] = "And it shall come to pass at the ingatherings, that ye shall give a fifth unto Pharaoh, and four parts shall be your own, for seed of the field, and for your food, and for them of your households, and for food for your little ones.";
yng[24] = "and it hath come to pass in the increases, that ye have given a fifth to Pharaoh, and four of the parts are for yourselves, for seed of the field, and for your food, and for those who [are] in your houses, and for food for your infants.\'";
dby[24] = "And it shall come to pass in the increase that ye shall give the fifth to Pharaoh, and the four parts shall be your own, for seed of the field, and for your food, and for them of your households, and for food for your little ones.";
web[24] = "And it shall come to pass in the increase, that ye shall give the fifth [part] to Pharaoh, and four parts shall be your own, for seed of the field, and for your food, and for them of your households, and for food for your little ones.";
hnv[24] = "It will happen at the harvests, that you shall give a fifth to Par`oh, and four parts will be your own, for seed of the field, for your food, for them of your households, and for food for your little ones.&quot;";
vul[24] = "ut fruges habere possitis quintam partem regi dabitis quattuor reliquas permitto vobis in sementem et in cibos famulis et liberis vestris";
kjv[25] = "And they said, Thou hast saved our lives: let us find grace in the sight of my lord, and we will be Pharaoh\'s servants.";
rsv[25] = "And they said, &quot;You have saved our lives; may it please my lord, we will be slaves to Pharaoh.&quot;";
asv[25] = "And they said, Thou hast saved our lives: let us find favor in the sight of my lord, and we will be Pharaoh\'s servants.";
yng[25] = "And they say, `Thou hast revived us; we find grace in the eyes of my lord, and have been servants to Pharaoh;\'";
dby[25] = "And they said, Thou hast saved us alive. Let us find favour in the eyes of my lord, and we will be Pharaoh\'s bondmen.";
web[25] = "And they said, Thou hast saved our lives: let us find grace in the sight of my lord, and we will be Pharaoh\'s servants.";
hnv[25] = "They said, &quot;You have saved our lives! Let us find favor in the sight of my lord, and we will be Par`oh\'s servants.&quot;";
vul[25] = "qui responderunt salus nostra in manu tua est respiciat nos tantum dominus noster et laeti serviemus regi";
kjv[26] = "And Joseph made it a law over the land of Egypt unto this day, [that] Pharaoh should have the fifth [part]; except the land of the priests only, [which] became not Pharaoh\'s.";
rsv[26] = "So Joseph made it a statute concerning the land of Egypt, and it stands to this day, that Pharaoh should have the fifth; the land of the priests alone did not become Pharaoh\'s.";
asv[26] = "And Joseph made it a statute concerning the land of Egypt unto this day, that Pharaoh should have the fifth; only the land of the priests alone became not Pharaoh\'s.";
yng[26] = "and Joseph setteth it for a statute unto this day, concerning the ground of Egypt, [that] Pharaoh hath a fifth; only the ground of the priests alone hath not become Pharaoh\'s.";
dby[26] = "And Joseph made it a law over the land of Egypt to this day, [that] the fifth should be for Pharaoh, except the land of the priests: theirs alone did not become Pharaoh\'s.";
web[26] = "And Joseph made it a law over the land of Egypt to this day, [that] Pharaoh should have the fifth [part]; except the land of the priests only, [which] became not Pharaoh\'s.";
hnv[26] = "Yosef made it a statute concerning the land of Mitzrayim to this day, that Par`oh should have the fifth. Only the land of the Kohanim alone didn\'t become Par`oh\'s.";
vul[26] = "ex eo tempore usque in praesentem diem in universa terra Aegypti regibus quinta pars solvitur et factum est quasi in legem absque terra sacerdotali quae libera ab hac condicione fuit";
kjv[27] = "And Israel dwelt in the land of Egypt, in the country of Goshen; and they had possessions therein, and grew, and multiplied exceedingly.";
rsv[27] = "Thus Israel dwelt in the land of Egypt, in the land of Goshen; and they gained possessions in it, and were fruitful and multiplied exceedingly.";
asv[27] = "And Israel dwelt in the land of Egypt, in the land of Goshen; and they gat them possessions therein, and were fruitful, and multiplied exceedingly.";
yng[27] = "And Israel dwelleth in the land of Egypt, in the land of Goshen, and they have possession in it, and are fruitful, and multiply exceedingly;";
dby[27] = "And Israel dwelt in the land of Egypt, in the land of Goshen; and they had possessions in it, and were fruitful and multiplied exceedingly.";
web[27] = "And Israel dwelt in the land of Egypt, in the country of Goshen; and they had possessions in it and grew, and multiplied exceedingly.";
hnv[27] = "Yisra\'el lived in the land of Mitzrayim, in the land of Goshen; and they got themselves possessions therein, and were fruitful, and multiplied exceedingly.";
vul[27] = "habitavit ergo Israhel in Aegypto id est in terra Gessen et possedit eam auctusque est et multiplicatus nimis";
kjv[28] = "And Jacob lived in the land of Egypt seventeen years: so the whole age of Jacob was an hundred forty and seven years.";
rsv[28] = "And Jacob lived in the land of Egypt seventeen years; so the days of Jacob, the years of his life, were a hundred and forty-seven years.";
asv[28] = "And Jacob lived in the land of Egypt seventeen years: so the days of Jacob, the years of his life, were a hundred forty and seven years.";
yng[28] = "and Jacob liveth in the land of Egypt seventeen years, and the days of Jacob, the years of his life, are an hundred and forty and seven years.";
dby[28] = "And Jacob lived in the land of Egypt seventeen years; and the days of Jacob, the years of his life, were a hundred and forty-seven years.";
web[28] = "And Jacob lived in the land of Egypt seventeen years: so the whole age of Jacob was a hundred and forty seven years.";
hnv[28] = "Ya`akov lived in the land of Mitzrayim seventeen years. So the days of Ya`akov, the years of his life, were one hundred forty-seven years.";
vul[28] = "et vixit in ea decem et septem annis factique sunt omnes dies vitae illius centum quadraginta septem annorum";
kjv[29] = "And the time drew nigh that Israel must die: and he called his son Joseph, and said unto him, If now I have found grace in thy sight, put, I pray thee, thy hand under my thigh, and deal kindly and truly with me; bury me not, I pray thee, in Egypt:";
rsv[29] = "And when the time drew near that Israel must die, he called his son Joseph and said to him, &quot;If now I have found favor in your sight, put your hand under my thigh, and promise to deal loyally and truly with me. Do not bury me in Egypt,";
asv[29] = "And the time drew near that Israel must die: and he called his son Joseph, and said unto him, If now I have found favor in thy sight, put, I pray thee, thy hand under my thigh, and deal kindly and truly with me: bury me not, I pray thee, in Egypt;";
yng[29] = "And the days of Israel are near to die, and he calleth for his son, for Joseph, and saith to him, `If, I pray thee, I have found grace in thine eyes, put, I pray thee, thy hand under my thigh, and thou hast done with me kindness and truth; bury me not, I pray thee, in Egypt,";
dby[29] = "And the days of Israel approached that he should die. And he called his son Joseph, and said to him, If now I have found favour in thine eyes, put, I pray thee, thy hand under my thigh, and deal kindly and truly with me: bury me not, I pray thee, in Egypt;";
web[29] = "And the time drew nigh that Israel must die: and he called his son Joseph, and said to him, If now I have found grace in thy sight, put, I pray thee, thy hand under my thigh, and deal kindly and truly with me; bury me not, I pray thee, in Egypt:";
hnv[29] = "The time drew near that Yisra\'el must die, and he called his son Yosef, and said to him, &quot;If now I have found favor in your sight, please put your hand under my thigh, and deal kindly and truly with me. Please don\'t bury me in Mitzrayim,";
vul[29] = "cumque adpropinquare cerneret mortis diem vocavit filium suum Ioseph et dixit ad eum si inveni gratiam in conspectu tuo pone manum sub femore meo et facies mihi misericordiam et veritatem ut non sepelias me in Aegypto";
kjv[30] = "But I will lie with my fathers, and thou shalt carry me out of Egypt, and bury me in their buryingplace. And he said, I will do as thou hast said.";
rsv[30] = "but let me lie with my fathers; carry me out of Egypt and bury me in their burying place.&quot; He answered, &quot;I will do as you have said.&quot;";
asv[30] = "but when I sleep with my fathers, thou shalt carry me out of Egypt, and bury me in their burying-place. And he said, I will do as thou hast said.";
yng[30] = "and I have lain with my fathers, and thou hast borne me out of Egypt, and buried me in their burying-place.\' And he saith, `I -- I do according to thy word;\'";
dby[30] = "but when I shall lie with my fathers, thou shalt carry me out of Egypt, and bury me in their sepulchre. And he said, I will do according to thy word.";
web[30] = "But I will lie with my fathers, and thou shalt carry me out of Egypt, and bury me in their burying-place. And he said, I will do as thou hast said.";
hnv[30] = "but when I sleep with my fathers, you shall carry me out of Mitzrayim, and bury me in their burying place.&quot; He said, &quot;I will do as you have said.&quot;";
vul[30] = "sed dormiam cum patribus meis et auferas me de hac terra condasque in sepulchro maiorum cui respondit Ioseph ego faciam quod iussisti";
kjv[31] = "And he said, Swear unto me. And he sware unto him. And Israel bowed himself upon the bed\'s head.";
rsv[31] = "And he said, &quot;Swear to me&quot;; and he swore to him. Then Israel bowed himself upon the head of his bed.";
asv[31] = "And he said, Swear unto me: and he sware unto him. And Israel bowed himself upon the bed\'s head.";
yng[31] = "and he saith, `Swear to me;\' and he sweareth to him, and Israel boweth himself on the head of the bed.";
dby[31] = "And he said, Swear to me; and he swore to him. And Israel worshipped on the bed\'s head.";
web[31] = "And he said, Swear to me: and he swore to him. And Israel bowed himself upon the bed\'s head.";
hnv[31] = "He said, &quot;Swear to me,&quot; and he swore to him. Yisra\'el bowed himself on the bed\'s head.";
vul[31] = "et ille iura ergo inquit mihi quo iurante adoravit Israhel Deum conversus ad lectuli caput";
csb[1] = "So Joseph went and informed Pharaoh: &quot;My father and my brothers, with their flocks and herds and all that they own, have come from the land of Canaan and are now in the land of Goshen.&quot;";
csb[2] = "He took five of his brothers and presented them to Pharaoh.";
csb[3] = "And Pharaoh asked his brothers, &quot;What is your occupation? &quot; They said to Pharaoh, &quot;Your servants, both we and our fathers, are shepherds.&quot;";
csb[4] = "And they said to Pharaoh, &quot;We have come to stay in the land for a while because there is no grazing land for your servants\' sheep, since the famine in the land of Canaan has been severe. So now, please let your servants settle in the land of Goshen.&quot;";
csb[5] = "Then Pharaoh said to Joseph, &quot;Now that your father and brothers have come to you,";
csb[6] = "&quot;the land of Egypt is open before you; settle your father and brothers in the best part of the land. They can live in the land of Goshen. If you know of any capable men among them, put them in charge of my livestock.&quot;";
csb[7] = "Joseph then brought his father Jacob and presented him to Pharaoh, and Jacob blessed Pharaoh.";
csb[8] = "Pharaoh said to Jacob, &quot;How many years have you lived? &quot;";
csb[9] = "Jacob said to Pharaoh, &quot;My pilgrimage has lasted 130 years. My years have been few and hard, and they have not reached the years of my fathers during their pilgrimages.&quot;";
csb[10] = "So Jacob blessed Pharaoh and departed from Pharaoh\'s presence.";
csb[11] = "Then Joseph settled his father and brothers in the land of Egypt and gave them property in the best part of the land, the land of Rameses, as Pharaoh had commanded.";
csb[12] = "And Joseph provided his father, his brothers, and all his father\'s family with food for their dependents.";
csb[13] = "But there was no food in the entire region, for the famine was very severe. The land of Egypt and the land of Canaan were exhausted by the famine.";
csb[14] = "Joseph collected all the silver to be found in the land of Egypt and the land of Canaan in exchange for the grain they were purchasing, and he brought the silver to Pharaoh\'s palace.";
csb[15] = "When the silver from the land of Egypt and the land of Canaan was gone, all the Egyptians came to Joseph and said, &quot;Give us food. Why should we die here in front of you? The silver is gone! &quot;";
csb[16] = "But Joseph said, &quot;Give me your livestock. Since the silver is gone, I will give you food in exchange for your livestock.&quot;";
csb[17] = "So they brought their livestock to Joseph, and he gave them food in exchange for the horses, the flocks of sheep, the herds of cattle, and the donkeys. That year he provided them with food in exchange for all their livestock.";
csb[18] = "When that year was over, they came the next year and said to him, &quot;We cannot hide from our lord that the silver is gone and that all our livestock belongs to our lord. There is nothing left for our lord except our bodies and our land.";
csb[19] = "&quot;Why should we die here in front of you -- both us and our land? Buy us and our land in exchange for food. Then we with our land will become Pharaoh\'s slaves. Give us seed so that we can live and not die, and so that the land won\'t become desolate.&quot;";
csb[20] = "In this way, Joseph acquired all the land in Egypt for Pharaoh, because every Egyptian sold his field since the famine was so severe for them. The land became Pharaoh\'s,";
csb[21] = "and Joseph moved the people to the cities from one end of Egypt to the other.";
csb[22] = "The only land he did not acquire belonged to the priests, for they had an allowance from Pharaoh. They ate from their allowance that Pharaoh gave them; therefore they did not sell their land.";
csb[23] = "Joseph said to the people, &quot;Understand today that I have acquired you and your land for Pharaoh. Here is seed for you. Sow it in the land.";
csb[24] = "&quot;At harvest, you are to give a fifth of it to Pharaoh, and four-fifths will be yours as seed for the field and as food for yourselves, your households, and your dependents.&quot;";
csb[25] = "&quot;You have saved our lives,&quot; they said. &quot;We have found favor with our lord and will be Pharaoh\'s slaves.&quot;";
csb[26] = "So Joseph made it a law, still in effect today in the land of Egypt, that a fifth of the produce belongs to Pharaoh. Only the priests\' land does not belong to Pharaoh.";
csb[27] = "Israel settled in the land of Egypt, in the region of Goshen. They acquired property in it and became fruitful and very numerous.";
csb[28] = "Now Jacob lived in the land of Egypt 17 years, and his life span was 147 years.";
csb[29] = "When the time approached for him to die, he called his son Joseph and said to him, &quot;If I have found favor with you, put your hand under my thigh and promise me that you will deal with me in kindness and faithfulness. Do not bury me in Egypt.";
csb[30] = "&quot;When I rest with my fathers, carry me away from Egypt and bury me in their burial place.&quot; Joseph answered, &quot;I will do what you have asked.&quot;";
csb[31] = "And Jacob said, &quot;Swear to me.&quot; So Joseph swore to him. Then Israel bowed in thanks at the head of his bed.";
</script>
