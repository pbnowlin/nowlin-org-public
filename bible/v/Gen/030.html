kjv[27] = "And Laban said unto him, I pray thee, if I have found favour in thine eyes, [tarry: for] I have learned by experience that the LORD hath blessed me for thy sake.";
rsv[27] = "But Laban said to him, &quot;If you will allow me to say so, I have learned by divination that the LORD has blessed me because of you;";
asv[27] = "And Laban said unto him, If now I have found favor in thine eyes, [tarry]: [for] I have divined that Jehovah hath blessed me for thy sake.";
yng[27] = "And Laban saith unto him, `If, I pray thee, I have found grace in thine eyes -- I have observed diligently that Jehovah doth bless me for thy sake.\'";
dby[27] = "And Laban said to him, I pray thee, if I have found favour in thine eyes -- I have discovered that Jehovah has blessed me for thy sake.";
web[27] = "And Laban said to him, I pray thee, if I have found favor in thine eyes, [tarry: for] I have learned by experience, that the LORD hath blessed me for thy sake.";
hnv[27] = "Lavan said to him, &quot;If now I have found favor in your eyes, stay here, for I have divined that the LORD has blessed me for your sake.&quot;";
vul[27] = "ait ei Laban inveniam gratiam in conspectu tuo experimento didici quod benedixerit mihi Deus propter te";
kjv[28] = "And he said, Appoint me thy wages, and I will give [it].";
rsv[28] = "name your wages, and I will give it.&quot;";
asv[28] = "And he said, Appoint me thy wages, and I will give it.";
yng[28] = "He saith also, `Define thy hire to me, and I give.\'";
dby[28] = "And he said, Appoint to me thy wages, and I will give it.";
web[28] = "And he said, Appoint me thy wages, and I will give [it].";
hnv[28] = "He said, &quot;Appoint me your wages, and I will give it.&quot;";
vul[28] = "constitue mercedem tuam quam dem tibi";
kjv[29] = "And he said unto him, Thou knowest how I have served thee, and how thy cattle was with me.";
rsv[29] = "Jacob said to him, &quot;You yourself know how I have served you, and how your cattle have fared with me.";
asv[29] = "And he said unto him, Thou knowest how I have served thee, and how thy cattle have fared with me.";
yng[29] = "And he saith unto him, `Thou -- thou hast known that which I have served thee [in], and that which thy substance was with me;";
dby[29] = "And he said to him, Thou knowest how I have served thee, and what thy cattle has become with me.";
web[29] = "And he said to him, Thou knowest how I have served thee, and how thy cattle were with me.";
hnv[29] = "He said to him, &quot;You know how I have served you, and how your cattle have fared with me.";
vul[29] = "at ille respondit tu nosti quomodo servierim tibi et quanta in manibus meis fuerit possessio tua";
kjv[30] = "For [it was] little which thou hadst before I [came], and it is [now] increased unto a multitude; and the LORD hath blessed thee since my coming: and now when shall I provide for mine own house also?";
rsv[30] = "For you had little before I came, and it has increased abundantly; and the LORD has blessed you wherever I turned. But now when shall I provide for my own household also?&quot;";
asv[30] = "For it was little which thou hadst before I came, and it hath increased unto a multitude; and Jehovah hath blessed thee whithersoever I turned: and now when shall I provide for mine own house also?";
yng[30] = "for [it is] little which thou hast had at my appearance, and it breaketh forth into a multitude, and Jehovah blesseth thee at my coming; and now, when do I make, I also, for mine own house?\'";
dby[30] = "For it was little that thou hadst before me, and it is increased to a multitude, and Jehovah has blessed thee from the time I came; and now, when shall I also provide for my house?";
web[30] = "For [it was] little which thou hadst before I [came], and it is [now] increased to a multitude; and the LORD hath blessed thee since my coming: and now when shall I provide for my own house also?";
hnv[30] = "For it was little which you had before I came, and it has increased to a multitude. The LORD has blessed you wherever I turned. Now when will I provide for my own house also?&quot;";
vul[30] = "modicum habuisti antequam venirem et nunc dives effectus es benedixitque tibi Dominus ad introitum meum iustum est igitur ut aliquando provideam etiam domui meae";
kjv[31] = "And he said, What shall I give thee? And Jacob said, Thou shalt not give me any thing: if thou wilt do this thing for me, I will again feed [and] keep thy flock:";
rsv[31] = "He said, &quot;What shall I give you?&quot; Jacob said, &quot;You shall not give me anything; if you will do this for me, I will again feed your flock and keep it:";
asv[31] = "And he said, What shall I give thee? And Jacob said, Thou shalt not give me aught: if thou wilt do this thing for me, I will again feed thy flock and keep it.";
yng[31] = "And he saith, `What do I give to thee?\' And Jacob saith, `Thou dost not give me anything; if thou do for me this thing, I turn back; I have delight; thy flock I watch;";
dby[31] = "And he said, What shall I give thee? And Jacob said, Thou shalt not give me anything. If thou doest this for me, I will again feed [and] keep thy flock:";
web[31] = "And he said, What shall I give thee? And Jacob said, Thou shalt not give me any thing; if thou wilt do this thing for me, I will again feed [and] keep thy flock:";
hnv[31] = "He said, &quot;What shall I give you?&quot; Ya`akov said, &quot;You shall not give me anything. If you will do this thing for me, I will again feed your flock and keep it.";
vul[31] = "dixitque Laban quid dabo tibi at ille ait nihil volo sed si feceris quod postulo iterum pascam et custodiam pecora tua";
kjv[32] = "I will pass through all thy flock to day, removing from thence all the speckled and spotted cattle, and all the brown cattle among the sheep, and the spotted and speckled among the goats: and [of such] shall be my hire.";
rsv[32] = "let me pass through all your flock today, removing from it every speckled and spotted sheep and every black lamb, and the spotted and speckled among the goats; and such shall be my wages.";
asv[32] = "I will pass through all thy flock to-day, removing from thence every speckled and spotted one, and every black one among the sheep, and the spotted and speckled among the goats: and [of such] shall be my hire.";
yng[32] = "I pass through all thy flock to-day to turn aside from thence every sheep speckled and spotted, and every brown sheep among the lambs, and speckled and spotted among the goats -- and it hath been my hire;";
dby[32] = "I will pass through all thy flock to-day, to remove thence all the speckled and spotted sheep, and all the brown lambs, and the spotted and speckled among the goats; and [that] shall be my hire.";
web[32] = "I will pass through all thy flock to-day, removing from thence all the speckled and spotted cattle, and all the brown cattle among the sheep, and the spotted and speckled among the goats: and [of such] shall be my hire.";
hnv[32] = "I will pass through all your flock today, removing from there every speckled and spotted one, and every black one among the sheep, and the spotted and speckled among the goats. This will be my hire.";
vul[32] = "gyra omnes greges tuos et separa cunctas oves varias et sparso vellere et quodcumque furvum et maculosum variumque fuerit tam in ovibus quam in capris erit merces mea";
kjv[33] = "So shall my righteousness answer for me in time to come, when it shall come for my hire before thy face: every one that [is] not speckled and spotted among the goats, and brown among the sheep, that shall be counted stolen with me.";
rsv[33] = "So my honesty will answer for me later, when you come to look into my wages with you. Every one that is not speckled and spotted among the goats and black among the lambs, if found with me, shall be counted stolen.&quot;";
asv[33] = "So shall my righteousness answer for me hereafter, when thou shalt come concerning my hire that is before thee: every one that is not speckled and spotted among the goats, and black among the sheep, that, [if found] with me, shall be counted stolen.";
yng[33] = "and my righteousness hath answered for me in the day to come, when it cometh in for my hire before thy face; -- every one which is not speckled and spotted among [my] goats, and brown among [my] lambs -- it is stolen with me.\'";
dby[33] = "And my righteousness shall answer for me hereafter, when thou comest about my hire, before thy face: all that is not speckled and spotted among the goats, and brown among the lambs, let that be stolen with me.";
web[33] = "So shall my righteousness answer for me in time to come, when it shall come for my hire before thy face: every one that [is] not speckled and spotted among the goats, and brown among the sheep, that shall be accounted stolen with me.";
hnv[33] = "So my righteousness will answer for me hereafter, when you come concerning my hire that is before you. Everyone that is not speckled and spotted among the goats, and black among the sheep, that might be with me, will be counted stolen.&quot;";
vul[33] = "respondebitque mihi cras iustitia mea quando placiti tempus advenerit coram te et omnia quae non fuerint varia et maculosa et furva tam in ovibus quam in capris furti me arguent";
kjv[34] = "And Laban said, Behold, I would it might be according to thy word.";
rsv[34] = "Laban said, &quot;Good! Let it be as you have said.&quot;";
asv[34] = "And Laban said, Behold, I would it might be according to thy word.";
yng[34] = "And Laban saith, `Lo, O that it were according to thy word;\'";
dby[34] = "And Laban said, Well, let it be according to thy word.";
web[34] = "And Laban said, Behold, I would it might be according to thy word.";
hnv[34] = "Lavan said, &quot;Behold, I desire it to be according to your word.&quot;";
vul[34] = "dixit Laban gratum habeo quod petis";
kjv[35] = "And he removed that day the he goats that were ringstraked and spotted, and all the she goats that were speckled and spotted, [and] every one that had [some] white in it, and all the brown among the sheep, and gave [them] into the hand of his sons.";
rsv[35] = "But that day Laban removed the he-goats that were striped and spotted, and all the she-goats that were speckled and spotted, every one that had white on it, and every lamb that was black, and put them in charge of his sons;";
asv[35] = "And he removed that day the he-goats that were ringstreaked and spotted, and all the she-goats that were speckled and spotted, every one that had white in it, and all the black ones among the sheep, and gave them into the hand of his sons;";
yng[35] = "and he turneth aside during that day the ring-straked and the spotted he-goats, and all the speckled and the spotted she-goats, every one that [hath] white in it, and every brown one among the lambs, and he giveth into the hand of his sons,";
dby[35] = "And he removed that day the he-goats that were ringstraked and spotted, and all the she-goats that were speckled and spotted, every one that had white in it, and all the brown among the lambs, and gave [them] into the hand of his sons.";
web[35] = "And he removed that day the he-goats that were ring-streaked and spotted, and all the she-goats that were speckled and spotted; every one that had [some] white in it, and all the brown among the sheep, and gave [them] into the hands of his sons.";
hnv[35] = "That day, he removed the male goats that were streaked and spotted, and all the female goats that were speckled and spotted, every one that had white in it, and all the black ones among the sheep, and gave them into the hand of his sons.";
vul[35] = "et separavit in die illo capras et oves hircos et arietes varios atque maculosos cunctum autem gregem unicolorem id est albi et nigri velleris tradidit in manu filiorum suorum";
kjv[36] = "And he set three days\' journey betwixt himself and Jacob: and Jacob fed the rest of Laban\'s flocks.";
rsv[36] = "and he set a distance of three days\' journey between himself and Jacob; and Jacob fed the rest of Laban\'s flock.";
asv[36] = "and he set three days\' journey betwixt himself and Jacob: and Jacob fed the rest of Laban\'s flocks.";
yng[36] = "and setteth a journey of three days between himself and Jacob; and Jacob is feeding the rest of the flock of Laban.";
dby[36] = "And he put three days\' journey between himself and Jacob. And Jacob fed the rest of Laban\'s flock.";
web[36] = "And he set three days\' journey between himself and Jacob: and Jacob fed the rest of Laban\'s flocks.";
hnv[36] = "He set three days\' journey between himself and Ya`akov, and Ya`akov fed the rest of Lavan\'s flocks.";
vul[36] = "et posuit spatium itineris inter se et generum dierum trium qui pascebat reliquos greges eius";
kjv[37] = "And Jacob took him rods of green poplar, and of the hazel and chesnut tree; and pilled white strakes in them, and made the white appear which [was] in the rods.";
rsv[37] = "Then Jacob took fresh rods of poplar and almond and plane, and peeled white streaks in them, exposing the white of the rods.";
asv[37] = "And Jacob took him rods of fresh poplar, and of the almond and of the plane-tree; and peeled white streaks in them, and made the white appear which was in the rods.";
yng[37] = "And Jacob taketh to himself a rod of fresh poplar, and of the hazel and chesnut, and doth peel in them white peelings, making bare the white that [is] on the rods,";
dby[37] = "And Jacob took fresh rods of white poplar, almond-tree, and maple; and peeled off white stripes in them, uncovering the white which was on the rods.";
web[37] = "And Jacob took to him rods of green poplar, and of the hazel and chesnut-tree; and peeled white streaks in them, and made the white appear which [was] in the rods.";
hnv[37] = "Ya`akov took to himself rods of fresh poplar, almond, plane tree, peeled white streaks in them, and made the white appear which was in the rods.";
vul[37] = "tollens ergo Iacob virgas populeas virides et amigdalinas et ex platanis ex parte decorticavit eas detractisque corticibus in his quae spoliata fuerant candor apparuit illa vero quae integra erant viridia permanserunt atque in hunc modum color effectus est varius";
kjv[38] = "And he set the rods which he had pilled before the flocks in the gutters in the watering troughs when the flocks came to drink, that they should conceive when they came to drink.";
rsv[38] = "He set the rods which he had peeled in front of the flocks in the runnels, that is, the watering troughs, where the flocks came to drink. And since they bred when they came to drink,";
asv[38] = "And he set the rods which he had peeled over against the flocks in the gutters in the watering-troughs where the flocks came to drink; and they conceived when they came to drink.";
yng[38] = "and setteth up the rods which he hath peeled in the gutters in the watering troughs (when the flock cometh in to drink), over-against the flock, that they may conceive in their coming in to drink;";
dby[38] = "And he set the rods which he had peeled before the flock, in the troughs at the watering-places where the flock came to drink, and they were ardent when they came to drink.";
web[38] = "And he set the rods, which he had peeled, before the flocks in the gutters in the watering-troughs, when the flocks came to drink, that they should conceive when they came to drink.";
hnv[38] = "He set the rods which he had peeled opposite the flocks in the gutters in the watering-troughs where the flocks came to drink. They conceived when they came to drink.";
vul[38] = "posuitque eas in canalibus ubi effundebatur aqua ut cum venissent greges ad bibendum ante oculos haberent virgas et in aspectu earum conciperent";
kjv[39] = "And the flocks conceived before the rods, and brought forth cattle ringstraked, speckled, and spotted.";
rsv[39] = "the flocks bred in front of the rods and so the flocks brought forth striped, speckled, and spotted.";
asv[39] = "And the flocks conceived before the rods, and the flocks brought forth ringstreaked, speckled, and spotted.";
yng[39] = "and the flocks conceive at the rods, and the flock beareth ring-straked, speckled, and spotted ones.";
dby[39] = "And the flock was ardent before the rods; and the flock brought forth ringstraked, speckled, and spotted.";
web[39] = "And the flocks conceived before the rods, and brought forth cattle ring-streaked, speckled, and spotted.";
hnv[39] = "The flocks conceived before the rods, and the flocks brought forth streaked, speckled, and spotted.";
vul[39] = "factumque est ut in ipso calore coitus oves intuerentur virgas et parerent maculosa et varia et diverso colore respersa";
kjv[40] = "And Jacob did separate the lambs, and set the faces of the flocks toward the ringstraked, and all the brown in the flock of Laban; and he put his own flocks by themselves, and put them not unto Laban\'s cattle.";
rsv[40] = "And Jacob separated the lambs, and set the faces of the flocks toward the striped and all the black in the flock of Laban; and he put his own droves apart, and did not put them with Laban\'s flock.";
asv[40] = "And Jacob separated the lambs, and set the faces of the flocks toward the ringstreaked and all the black in the flock of Laban: and he put his own droves apart, and put them not unto Laban\'s flock.";
yng[40] = "And the lambs hath Jacob parted, and he putteth the face of the flock towards the ring-straked, also all the brown in the flock of Laban, and he setteth his own droves by themselves, and hath not set them near Laban\'s flock.";
dby[40] = "And Jacob separated the lambs, and set the faces of the flock toward the ringstraked, and all the brown in the flock of Laban; and he made himself separate flocks, and did not put them with Laban\'s flock.";
web[40] = "And Jacob separated the lambs, and set the faces of the flocks towards the ring-streaked, and all the brown in the flock of Laban: and he put his own flocks by themselves, and put them not with Laban\'s cattle.";
hnv[40] = "Ya`akov separated the lambs, and set the faces of the flocks toward the streaked and all the black in the flock of Lavan: and he put his own droves apart, and didn\'t put them into Lavan\'s flock.";
vul[40] = "divisitque gregem Iacob et posuit virgas ante oculos arietum erant autem alba quaeque et nigra Laban cetera vero Iacob separatis inter se gregibus";
kjv[41] = "And it came to pass, whensoever the stronger cattle did conceive, that Jacob laid the rods before the eyes of the cattle in the gutters, that they might conceive among the rods.";
rsv[41] = "Whenever the stronger of the flock were breeding Jacob laid the rods in the runnels before the eyes of the flock, that they might breed among the rods,";
asv[41] = "And it came to pass, whensoever the stronger of the flock did conceive, that Jacob laid the rods before the eyes of the flock in the gutters, that they might conceive among the rods;";
yng[41] = "And it hath come to pass whenever the strong ones of the flock conceive, that Jacob set the rods before the eyes of the flock in the gutters, to cause them to conceive by the rods,";
dby[41] = "And it came to pass whensoever the strong cattle were ardent, that Jacob laid the rods before the eyes of the flock in the gutters, that they might become ardent among the rods;";
web[41] = "And it came to pass, whenever the stronger cattle conceived, that Jacob laid the rods before the eyes of the cattle in the gutters, that they might conceive among the rods.";
hnv[41] = "It happened, whenever the stronger of the flock conceived, that Ya`akov laid the rods before the eyes of the flock in the gutters, that they might conceive among the rods;";
vul[41] = "igitur quando primo tempore ascendebantur oves ponebat Iacob virgas in canalibus aquarum ante oculos arietum et ovium ut in earum contemplatione conciperent";
kjv[42] = "But when the cattle were feeble, he put [them] not in: so the feebler were Laban\'s, and the stronger Jacob\'s.";
rsv[42] = "but for the feebler of the flock he did not lay them there; so the feebler were Laban\'s, and the stronger Jacob\'s.";
asv[42] = "but when the flock were feeble, he put them not in: so the feebler were Laban\'s, and the stronger Jacob\'s.";
yng[42] = "and when the flock is feeble, he doth not set [them]; and the feeble ones have been Laban\'s, and the strong ones Jacob\'s.";
dby[42] = "but when the sheep were feeble, he put [them] not in; so the feeble were Laban\'s, and the strong Jacob\'s.";
web[42] = "But when the cattle were feeble, he put [them] not in: so the feebler were Laban\'s, and the stronger Jacob\'s.";
hnv[42] = "but when the flock were feeble, he didn\'t put them in. So the feebler were Lavan\'s, and the stronger Ya`akov\'s.";
vul[42] = "quando vero serotina admissura erat et conceptus extremus non ponebat eas factaque sunt ea quae erant serotina Laban et quae primi temporis Iacob";
kjv[43] = "And the man increased exceedingly, and had much cattle, and maidservants, and menservants, and camels, and asses.";
rsv[43] = "Thus the man grew exceedingly rich, and had large flocks, maidservants and menservants, and camels and asses.";
asv[43] = "And the man increased exceedingly, and had large flocks, and maid-servants and men-servants, and camels and asses.";
yng[43] = "And the man increaseth very exceedingly, and hath many flocks, and maid-servants, and men-servants, and camels, and asses.";
dby[43] = "And the man increased very, very much, and had much cattle, and bondwomen, and bondmen, and camels, and asses.";
web[43] = "And the man increased exceedingly, and had many cattle, and maid-servants, and men-servants, and camels, and asses.";
hnv[43] = "The man increased exceedingly, and had large flocks, maid-servants and men-servants, and camels and donkeys.";
vul[43] = "ditatusque est homo ultra modum et habuit greges multos ancillas et servos camelos et asinos";
csb[1] = "When Rachel saw that she was not bearing Jacob any children, she envied her sister. &quot;Give me sons, or I will die! &quot; she said to Jacob.";
csb[2] = "Jacob became angry with Rachel and said, &quot;Am I in God\'s place, who has withheld offspring from you? &quot;";
csb[3] = "Then she said, &quot;Here is my maid Bilhah. Go sleep with her, and she\'ll bear children for me so that through her I too can build a family.&quot;";
csb[4] = "So Rachel gave her slave Bilhah to Jacob as a wife, and he slept with her.";
csb[5] = "Bilhah conceived and bore Jacob a son.";
csb[6] = "Rachel said, &quot;God has vindicated me; yes, he has heard me and given me a son,&quot; so she named him Dan.";
csb[7] = "Rachel\'s slave Bilhah conceived again and bore Jacob a second son.";
csb[8] = "Rachel said, &quot;In my wrestlings with God, I have wrestled with my sister and won,&quot; and she named him Naphtali.";
csb[9] = "When Leah saw that she had stopped having children, she took her slave Zilpah and gave her to Jacob as a wife.";
csb[10] = "Leah\'s slave Zilpah bore Jacob a son.";
csb[11] = "Then Leah said, &quot;What good fortune! &quot; and she named him Gad.";
csb[12] = "When Leah\'s slave Zilpah bore Jacob a second son,";
csb[13] = "Leah said, &quot;I am happy that the women call me happy,&quot; so she named him Asher.";
csb[14] = "Reuben went out during the wheat harvest and found some mandrakes in the field. When he brought them to his mother Leah, Rachel asked, &quot;Please give me some of your son\'s mandrakes.&quot;";
csb[15] = "But Leah replied to her, &quot;Isn\'t it enough that you have taken my husband? Now you also want to take my son\'s mandrakes? &quot; &quot;Well then,&quot; Rachel said, &quot;he can sleep with you tonight in exchange for your son\'s mandrakes.&quot;";
csb[16] = "When Jacob came in from the field that evening, Leah went out to meet him and said, &quot;You must come with me, for I have hired you with my son\'s mandrakes.&quot; So Jacob slept with her that night.";
csb[17] = "God listened to Leah, and she conceived and bore Jacob a fifth son.";
csb[18] = "Leah said, &quot;God has rewarded me for giving my slave to my husband,&quot; and she named him Issachar.";
csb[19] = "Then Leah conceived again and bore Jacob a sixth son.";
csb[20] = "&quot;God has given me a good gift,&quot; Leah said. &quot;This time my husband will honor me because I have borne six sons for him,&quot; and she named him Zebulun.";
csb[21] = "Later, Leah bore a daughter and named her Dinah.";
csb[22] = "Then God remembered Rachel. He listened to her and opened her womb.";
csb[23] = "She conceived and bore a son, and she said, &quot;God has taken away my disgrace.&quot;";
csb[24] = "She named him Joseph and said, &quot;May the LORD add another son to me.&quot;";
csb[25] = "After Rachel gave birth to Joseph, Jacob said to Laban, &quot;Send me on my way so that I can return to my homeland.";
csb[26] = "&quot;Give me my wives and my children that I have worked for, and let me go. You know how hard I have worked for you.&quot;";
csb[27] = "But Laban said to him, &quot;If I have found favor with you, stay. I have learned by divination that the LORD has blessed me because of you.&quot;";
csb[28] = "Then Laban said, &quot;Name your wages, and I will pay them.&quot;";
csb[29] = "So Jacob said to him, &quot;You know how I have served you and how your herds have fared with me.";
csb[30] = "&quot;For you had very little before I came, but now your wealth has increased. The LORD has blessed you because of me. And now, when will I also do something for my own family? &quot;";
csb[31] = "Laban asked, &quot;What should I give you? &quot; And Jacob said, &quot;You don\'t need to give me anything. If you do this one thing for me, I will continue to shepherd and keep your flock.";
csb[32] = "&quot;Let me go through all your sheep today and remove every sheep that is speckled or spotted, every dark-colored sheep among the lambs, and the spotted and speckled among the female goats. Such will be my wages.";
csb[33] = "&quot;In the future when you come to check on my wages, my honesty will testify for me. If I have any female goats that are not speckled or spotted, or any lambs that are not black, they will be considered stolen.&quot;";
csb[34] = "&quot;Good,&quot; said Laban. &quot;Let it be as you have said.&quot;";
csb[35] = "That day Laban removed the streaked and spotted male goats and all the speckled and spotted female goats -- every one that had any white on it -- and every dark-colored one among the lambs, and he placed his sons in charge of them.";
csb[36] = "He put a three-day journey between himself and Jacob. Jacob, meanwhile, was shepherding the rest of Laban\'s flock.";
csb[37] = "Jacob then took branches of fresh poplar, almond, and plane wood, and peeled the bark, exposing white stripes on the branches.";
csb[38] = "He set the peeled branches in the troughs in front of the sheep -- in the water channels where the sheep came to drink. And the sheep bred when they came to drink.";
csb[39] = "The flocks bred in front of the branches and bore streaked, speckled, and spotted young.";
csb[40] = "Jacob separated the lambs and made the flocks face the streaked sheep and the completely dark sheep in Laban\'s flocks. Then he set his own stock apart and didn\'t put them with Laban\'s sheep.";
csb[41] = "Whenever the stronger of the flock were breeding, Jacob placed the branches in the troughs, in full view of the flocks, and they would breed in front of the branches.";
csb[42] = "As for the weaklings of the flocks, he did not put out the branches. So it turned out that the weak sheep belonged to Laban and the stronger ones to Jacob.";
csb[43] = "And the man became very rich. He had many flocks, female and male slaves, and camels and donkeys.";
