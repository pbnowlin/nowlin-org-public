kjv[4] = "And give thee the blessing of Abraham, to thee, and to thy seed with thee; that thou mayest inherit the land wherein thou art a stranger, which God gave unto Abraham.";

csb[1] = "So Isaac summoned Jacob, blessed him, and commanded him, &quot;Do not marry a Canaanite girl.";
csb[2] = "&quot;Go at once to Paddan-aram, to the house of Bethuel, your mother\'s father. Marry one of the daughters of Laban, your mother\'s brother.";
csb[3] = "&quot;May God Almighty bless you and make you fruitful and multiply you so that you become an assembly of peoples.";
csb[4] = "&quot;May God give you and your offspring the blessing of Abraham so that you may possess the land where you live as a foreigner, the land God gave to Abraham.&quot;";
csb[5] = "So Isaac sent Jacob to Paddan-aram, to Laban son of Bethuel the Aramean, the brother of Rebekah, the mother of Jacob and Esau.";
csb[6] = "Esau noticed that Isaac blessed Jacob and sent him to Paddan-aram to get a wife there. When he blessed him, Isaac commanded Jacob, &quot;Do not marry a Canaanite girl.&quot;";
csb[7] = "And Jacob listened to his father and mother and went to Paddan-aram.";
csb[8] = "Esau realized that his father Isaac disapproved of the Canaanite women,";
csb[9] = "so Esau went to Ishmael and married, in addition to his other wives, Mahalath daughter of Ishmael, Abraham\'s son. She was the sister of Nebaioth.";
csb[10] = "Jacob left Beer-sheba and went toward Haran.";
csb[11] = "He reached a certain place and spent the night there because the sun had set. He took one of the stones from the place, put it there at his head, and lay down in that place.";
csb[12] = "And he dreamed: A stairway was set on the ground with its top reaching the sky, and God\'s angels were going up and down on it.";
csb[13] = "The LORD was standing there beside him, saying, &quot;I am the LORD, the God of your father Abraham and the God of Isaac. I will give you and your offspring the land on which you are lying.";
csb[14] = "&quot;Your offspring will be like the dust of the earth, and you will spread out toward the west, the east, the north, and the south. All the peoples on earth will be blessed through you and your offspring.";
csb[15] = "&quot;Look, I am with you and will watch over you wherever you go. I will bring you back to this land, for I will not leave you until I have done what I have promised you.&quot;";
csb[16] = "When Jacob awoke from his sleep, he said, &quot;Surely the LORD is in this place, and I did not know it.&quot;";
csb[17] = "He was afraid and said, &quot;What an awesome place this is! This is none other than the house of God. This is the gate of heaven.&quot;";
csb[18] = "Early in the morning Jacob took the stone that was near his head and set it up as a marker. He poured oil on top of it";
csb[19] = "and named the place Bethel, though previously the city was named Luz.";
csb[20] = "Then Jacob made a vow: &quot;If God will be with me and watch over me during this journey I\'m making, if he provides me with food to eat and clothing to wear,";
csb[21] = "&quot;and if I return safely to my father\'s family, then the LORD will be my God.";
csb[22] = "&quot;This stone that I have set up as a marker will be God\'s house, and I will give to you a tenth of all that you give me.&quot;";
</script>
