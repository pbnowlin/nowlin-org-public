kjv[28] = "And God blessed them, and God said unto them, Be fruitful, and multiply, and replenish the earth, and subdue it: and have dominion over the fish of the sea, and over the fowl of the air, and over every living thing that moveth upon the earth.";

asv[28] = "And God blessed them: and God said unto them, Be fruitful, and multiply, and replenish the earth, and subdue it; and have dominion over the fish of the sea, and over the birds of the heavens, and over every living thing that moveth upon the earth.";
yng[28] = "And God blesseth them, and God saith to them, `Be fruitful, and multiply, and fill the earth, and subdue it, and rule over fish of the sea, and over fowl of the heavens, and over every living thing that is creeping upon the earth.\'";

vul[28] = "benedixitque illis Deus et ait crescite et multiplicamini et replete terram et subicite eam et dominamini piscibus maris et volatilibus caeli et universis animantibus quae moventur super terram";
kjv[29] = "And God said, Behold, I have given you every herb bearing seed, which [is] upon the face of all the earth, and every tree, in the which [is] the fruit of a tree yielding seed; to you it shall be for meat.";
rsv[29] = "And God said, &quot;Behold, I have given you every plant yielding seed which is upon the face of all the earth, and every tree with seed in its fruit; you shall have them for food.";
asv[29] = "And God said, Behold, I have given you every herb yielding seed, which is upon the face of all the earth, and every tree, in which is the fruit of a tree yielding seed; to you it shall be for food:";
yng[29] = "And God saith, `Lo, I have given to you every herb sowing seed, which [is] upon the face of all the earth, and every tree in which [is] the fruit of a tree sowing seed, to you it is for food;";
dby[29] = "And God said, Behold, I have given you every herb producing seed that is on the whole earth, and every tree in which is the fruit of a tree producing seed: it shall be food for you;";
web[29] = "And God said, Behold, I have given you every herb bearing seed, which [is] upon the face of all the earth, and every tree, in which [is] the fruit of a tree yielding seed; to you it shall be for food.";
hnv[29] = "God said, &quot;Behold, I have given you every herb yielding seed, which is on the surface of all the eretz, and every tree, which bears fruit yielding seed. It will be your food.";
vul[29] = "dixitque Deus ecce dedi vobis omnem herbam adferentem semen super terram et universa ligna quae habent in semet ipsis sementem generis sui ut sint vobis in escam";
kjv[30] = "And to every beast of the earth, and to every fowl of the air, and to every thing that creepeth upon the earth, wherein [there is] life, [I have given] every green herb for meat: and it was so.";
rsv[30] = "And to every beast of the earth, and to every bird of the air, and to everything that creeps on the earth, everything that has the breath of life, I have given every green plant for food.&quot; And it was so.";
asv[30] = "and to every beast of the earth, and to every bird of the heavens, and to everything that creepeth upon the earth, wherein there is life, [I have given] every green herb for food: and it was so.";
yng[30] = "and to every beast of the earth, and to every fowl of the heavens, and to every creeping thing on the earth, in which [is] breath of life, every green herb [is] for food:\' and it is so.";
dby[30] = "and to every animal of the earth, and to every fowl of the heavens, and to everything that creepeth on the earth, in which is a living soul, every green herb for food. And it was so.";
web[30] = "And to every beast of the earth, and to every fowl of the air, and to every animal that creepeth upon the earth, in which [is] life, [I have given] every green herb for food: and it was so.";
hnv[30] = "To every animal of the eretz, and to every bird of the sky, and to everything that creeps on the eretz, in which there is life, I have given every green herb for food.&quot; And it was so.";
vul[30] = "et cunctis animantibus terrae omnique volucri caeli et universis quae moventur in terra et in quibus est anima vivens ut habeant ad vescendum et factum est ita";
kjv[31] = "And God saw every thing that he had made, and, behold, [it was] very good. And the evening and the morning were the sixth day.";
rsv[31] = "And God saw everything that he had made, and behold, it was very good. And there was evening and there was morning, a sixth day.";
asv[31] = "And God saw everything that he had made, and, behold, it was very good. And there was evening and there was morning, the sixth day.";
yng[31] = "And God seeth all that He hath done, and lo, very good; and there is an evening, and there is a morning -- day the sixth.";
dby[31] = "And God saw everything that he had made, and behold it was very good. And there was evening, and there was morning -- the sixth day.";
web[31] = "And God saw every thing that he had made, and behold, [it was] very good. And the evening and the morning were the sixth day.";
hnv[31] = "God saw everything that he had made, and, behold, it was very good. There was evening and there was morning, the sixth day.";
vul[31] = "viditque Deus cuncta quae fecit et erant valde bona et factum est vespere et mane dies sextus";
csb[1] = "In the beginning God created the heavens and the earth.";
csb[2] = "Now the earth was formless and empty, darkness covered the surface of the watery depths, and the Spirit of God was hovering over the surface of the waters.";
csb[3] = "Then God said, &quot;Let there be light,&quot; and there was light.";
csb[4] = "God saw that the light was good, and God separated the light from the darkness.";
csb[5] = "God called the light &quot;day,&quot; and the darkness he called &quot;night.&quot; There was an evening, and there was a morning: one day.";
csb[6] = "Then God said, &quot;Let there be an expanse between the waters, separating water from water.&quot;";
csb[7] = "So God made the expanse and separated the water under the expanse from the water above the expanse. And it was so.";
csb[8] = "God called the expanse &quot;sky.&quot; Evening came and then morning: the second day.";
csb[9] = "Then God said, &quot;Let the water under the sky be gathered into one place, and let the dry land appear.&quot; And it was so.";
csb[10] = "God called the dry land &quot;earth,&quot; and the gathering of the water he called &quot;seas.&quot; And God saw that it was good.";
csb[11] = "Then God said, &quot;Let the earth produce vegetation: seed-bearing plants and fruit trees on the earth bearing fruit with seed in it according to their kinds.&quot; And it was so.";
csb[12] = "The earth produced vegetation: seed-bearing plants according to their kinds and trees bearing fruit with seed in it according to their kinds. And God saw that it was good.";
csb[13] = "Evening came and then morning: the third day.";
csb[14] = "Then God said, &quot;Let there be lights in the expanse of the sky to separate the day from the night. They will serve as signs for seasons and for days and years.";
csb[15] = "&quot;They will be lights in the expanse of the sky to provide light on the earth.&quot; And it was so.";
csb[16] = "God made the two great lights -- the greater light to rule over the day and the lesser light to rule over the night -- as well as the stars.";
csb[17] = "God placed them in the expanse of the sky to provide light on the earth,";
csb[18] = "to rule the day and the night, and to separate light from darkness. And God saw that it was good.";
csb[19] = "Evening came and then morning: the fourth day.";
csb[20] = "Then God said, &quot;Let the water swarm with living creatures, and let birds fly above the earth across the expanse of the sky.&quot;";
csb[21] = "So God created the large sea-creatures and every living creature that moves and swarms in the water, according to their kinds. He also created every winged creature according to its kind. And God saw that it was good.";
csb[22] = "God blessed them: &quot;Be fruitful, multiply, and fill the waters of the seas, and let the birds multiply on the earth.&quot;";
csb[23] = "Evening came and then morning: the fifth day.";
csb[24] = "Then God said, &quot;Let the earth produce living creatures according to their kinds: livestock, creatures that crawl, and the wildlife of the earth according to their kinds.&quot; And it was so.";
csb[25] = "So God made the wildlife of the earth according to their kinds, the livestock according to their kinds, and all the creatures that crawl on the ground according to their kinds. And God saw that it was good.";
csb[26] = "Then God said, &quot;Let us make man in our image, according to our likeness. They will rule the fish of the sea, the birds of the sky, the livestock, the whole earth, and the creatures that crawl on the earth.&quot;";
csb[27] = "So God created man in his own image; he created him in the image of God; he created them male and female.";
csb[28] = "God blessed them, and God said to them, &quot;Be fruitful, multiply, fill the earth, and subdue it. Rule the fish of the sea, the birds of the sky, and every creature that crawls on the earth.&quot;";
csb[29] = "God also said, &quot;Look, I have given you every seed-bearing plant on the surface of the entire earth and every tree whose fruit contains seed. This will be food for you,";
csb[30] = "&quot;for all the wildlife of the earth, for every bird of the sky, and for every creature that crawls on the earth -- everything having the breath of life in it -- I have given every green plant for food.&quot; And it was so.";
csb[31] = "God saw all that he had made, and it was very good indeed. Evening came and then morning: the sixth day.";
