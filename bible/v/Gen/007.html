csb[1] = "Then the LORD said to Noah, &quot;Enter the ark, you and all your household, for I have seen that you alone are righteous before me in this generation.";
csb[2] = "&quot;You are to take with you seven pairs, a male and its female, of all the clean animals, and two of the animals that are not clean, a male and its female,";
csb[3] = "&quot;and seven pairs, male and female, of the birds of the sky -- in order to keep offspring alive throughout the earth.";
csb[4] = "&quot;Seven days from now I will make it rain on the earth forty days and forty nights, and every living thing I have made I will wipe off the face of the earth.&quot;";
csb[5] = "And Noah did everything that the LORD commanded him.";
csb[6] = "Noah was six hundred years old when the flood came and water covered the earth.";
csb[7] = "So Noah, his sons, his wife, and his sons\' wives entered the ark because of the floodwaters.";
csb[8] = "From the clean animals, unclean animals, birds, and every creature that crawls on the ground,";
csb[9] = "two of each, male and female, came to Noah and entered the ark, just as God had commanded him.";
csb[10] = "Seven days later the floodwaters came on the earth.";
csb[11] = "In the six hundredth year of Noah\'s life, in the second month, on the seventeenth day of the month, on that day all the sources of the vast watery depths burst open, the floodgates of the sky were opened,";
csb[12] = "and the rain fell on the earth forty days and forty nights.";
csb[13] = "On that same day Noah along with his sons Shem, Ham, and Japheth, Noah\'s wife, and his three sons\' wives entered the ark with him.";
csb[14] = "They entered it with all the wildlife according to their kinds, all livestock according to their kinds, all the creatures that crawl on the earth according to their kinds, every flying creature -- all the birds and every winged creature -- according to their kinds.";
csb[15] = "Two of every creature that has the breath of life in it came to Noah and entered the ark.";
csb[16] = "Those that entered, male and female of every creature, entered just as God had commanded him. Then the LORD shut him in.";
csb[17] = "The flood continued for forty days on the earth; the water increased and lifted up the ark so that it rose above the earth.";
csb[18] = "The water surged and increased greatly on the earth, and the ark floated on the surface of the water.";
csb[19] = "Then the water surged even higher on the earth, and all the high mountains under the whole sky were covered.";
csb[20] = "The mountains were covered as the water surged above them more than twenty feet.";
csb[21] = "Every creature perished -- those that crawl on the earth, birds, livestock, wildlife, and those that swarm on the earth, as well as all mankind.";
csb[22] = "Everything with the breath of the spirit of life in its nostrils -- everything on dry land died.";
csb[23] = "He wiped out every living thing that was on the face of the earth, from mankind to livestock, to creatures that crawl, to the birds of the sky, and they were wiped off the earth. Only Noah was left, and those that were with him in the ark.";
csb[24] = "And the water surged on the earth 150 days.";
</script>
