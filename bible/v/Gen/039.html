kjv[23] = "The keeper of the prison looked not to any thing [that was] under his hand; because the LORD was with him, and [that] which he did, the LORD made [it] to prosper.";
rsv[23] = "the keeper of the prison paid no heed to anything that was in Joseph\'s care, because the LORD was with him; and whatever he did, the LORD made it prosper.";
asv[23] = "The keeper of the prison looked not to anything that was under his hand, because Jehovah was with him; and that which he did, Jehovah made it to prosper.";
yng[23] = "the chief of the round-house seeth not anything under his hand, because Jehovah [is] with him, and that which he is doing Jehovah is causing to prosper.";
dby[23] = "The chief of the tower-house looked not to anything under his hand, because Jehovah was with him; and what he did, Jehovah made it prosper.";
web[23] = "The keeper of the prison looked not to any thing [that was] under his hand; because the LORD was with him: and [that] which he did the LORD made [it] to prosper.";
hnv[23] = "The keeper of the prison didn\'t look after anything that was under his hand, because the LORD was with him; and that which he did, the LORD made it prosper.";
vul[23] = "nec noverat aliquid cunctis ei creditis Dominus enim erat cum illo et omnia eius opera dirigebat";
csb[1] = "Now Joseph had been taken to Egypt. An Egyptian named Potiphar, an officer of Pharaoh and the captain of the guards, bought him from the Ishmaelites who had brought him there.";
csb[2] = "The LORD was with Joseph, and he became a successful man, serving in the household of his Egyptian master.";
csb[3] = "When his master saw that the LORD was with him and that the LORD made everything he did successful,";
csb[4] = "Joseph found favor with his master and became his personal attendant. Potiphar also put him in charge of his household and placed all that he owned under his authority.";
csb[5] = "From the time that he put him in charge of his household and of all that he owned, the LORD blessed the Egyptian\'s house because of Joseph. The LORD\'s blessing was on all that he owned, in his house and in his fields.";
csb[6] = "He left all that he owned under Joseph\'s authority; he did not concern himself with anything except the food he ate. Now Joseph was well-built and handsome.";
csb[7] = "After some time his master\'s wife looked longingly at Joseph and said, &quot;Sleep with me.&quot;";
csb[8] = "But he refused. &quot;Look,&quot; he said to his master\'s wife, &quot;with me here my master does not concern himself with anything in his house, and he has put all that he owns under my authority.";
csb[9] = "&quot;No one in this house is greater than I am. He has withheld nothing from me except you, because you are his wife. So how could I do this immense evil, and how could I sin against God? &quot;";
csb[10] = "Although she spoke to Joseph day after day, he refused to go to bed with her.";
csb[11] = "Now one day he went into the house to do his work, and none of the household servants were there.";
csb[12] = "She grabbed him by his garment and said, &quot;Sleep with me! &quot; But leaving his garment in her hand, he escaped and ran outside.";
csb[13] = "When she saw that he had left his garment with her and had run outside,";
csb[14] = "she called her household servants. &quot;Look,&quot; she said to them, &quot;my husband brought a Hebrew man to make fools of us. He came to me so he could sleep with me, and I screamed as loud as I could.";
csb[15] = "&quot;When he heard me screaming for help, he left his garment beside me and ran outside.&quot;";
csb[16] = "She put Joseph\'s garment beside her until his master came home.";
csb[17] = "Then she told him the same story: &quot;The Hebrew slave you brought to us came to make a fool of me,";
csb[18] = "&quot;but when I screamed for help, he left his garment beside me and ran outside.&quot;";
csb[19] = "When his master heard the story his wife told him -- &quot;These are the things your slave did to me&quot; -- he was furious";
csb[20] = "and had him thrown into prison, where the king\'s prisoners were confined. So Joseph was there in prison.";
csb[21] = "But the LORD was with Joseph and extended kindness to him. He granted him favor with the prison warden.";
csb[22] = "The warden put all the prisoners who were in the prison under Joseph\'s authority, and he was responsible for everything that was done there.";
csb[23] = "The warden did not bother with anything under Joseph\'s authority, because the LORD was with him, and the LORD made everything that he did successful.";
</script>
