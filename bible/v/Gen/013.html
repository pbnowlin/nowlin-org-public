csb[1] = "Abram went up from Egypt to the Negev -- he, his wife, and all he had, and Lot with him.";
csb[2] = "Abram was very rich in livestock, silver, and gold.";
csb[3] = "He went by stages from the Negev to Bethel, to the place between Bethel and Ai where his tent had formerly been,";
csb[4] = "to the site where he had built the altar. And Abram called on the name of the LORD there.";
csb[5] = "Now Lot, who was traveling with Abram, also had flocks, herds, and tents.";
csb[6] = "But the land was unable to support them as long as they stayed together, for they had so many possessions that they could not stay together,";
csb[7] = "and there was quarreling between the herdsmen of Abram\'s livestock and the herdsmen of Lot\'s livestock. (At that time the Canaanites and the Perizzites were living in the land.)";
csb[8] = "So Abram said to Lot, &quot;Please, let\'s not have quarreling between you and me, or between your herdsmen and my herdsmen, since we are relatives.";
csb[9] = "&quot;Isn\'t the whole land before you? Separate from me: if you go to the left, I will go to the right; if you go to the right, I will go to the left.&quot;";
csb[10] = "Lot looked out and saw that the entire plain of the Jordan as far as Zoar was well watered everywhere like the LORD\'s garden and the land of Egypt. (This was before the LORD destroyed Sodom and Gomorrah.)";
csb[11] = "So Lot chose the entire plain of the Jordan for himself. Then Lot journeyed eastward, and they separated from each other.";
csb[12] = "Abram lived in the land of Canaan, but Lot lived in the cities on the plain and set up his tent near Sodom.";
csb[13] = "(Now the men of Sodom were evil, sinning immensely against the LORD.)";
csb[14] = "After Lot had separated from him, the LORD said to Abram, &quot;Look from the place where you are. Look north and south, east and west,";
csb[15] = "&quot;for I will give you and your offspring forever all the land that you see.";
csb[16] = "&quot;I will make your offspring like the dust of the earth, so that if anyone could count the dust of the earth, then your offspring could be counted.";
csb[17] = "&quot;Get up and walk around the land, through its length and width, for I will give it to you.&quot;";
csb[18] = "So Abram moved his tent and went to live near the oaks of Mamre at Hebron, where he built an altar to the LORD.";
