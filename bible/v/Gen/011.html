yng[29] = "And Abram and Nahor take to themselves wives; the name of Abram\'s wife [is] Sarai, and the name of Nahor\'s wife [is] Milcah, daughter of Haran, father of Milcah, and father of Iscah.";
dby[29] = "And Abram and Nahor took wives: the name of Abram\'s wife was Sarai; and the name of Nahor\'s wife, Milcah, a daughter of Haran, the father of Milcah and the father of Iscah.";

kjv[31] = "And Terah took Abram his son, and Lot the son of Haran his son\'s son, and Sarai his daughter in law, his son Abram\'s wife; and they went forth with them from Ur of the Chaldees, to go into the land of Canaan; and they came unto Haran, and dwelt there.";
rsv[31] = "Terah took Abram his son and Lot the son of Haran, his grandson, and Sar\'ai his daughter-in-law, his son Abram\'s wife, and they went forth together from Ur of the Chalde\'ans to go into the land of Canaan; but when they came to Haran, they settled there.";
asv[31] = "And Terah took Abram his son, and Lot the son of Haran, his son\'s son, and Sarai his daughter-in-law, his son Abram\'s wife; and they went forth with them from Ur of the Chaldees, to go into the land of Canaan; and they came unto Haran, and dwelt there.";
yng[31] = "And Terah taketh Abram his son, and Lot, son of Haran, his son\'s son, and Sarai his daughter-in-law, wife of Abram his son, and they go out with them from Ur of the Chaldees, to go towards the land of Canaan; and they come unto Charan, and dwell there.";
dby[31] = "And Terah took Abram his son, and Lot the son of Haran his son\'s son, and Sarai his daughter-in-law, his son Abram\'s wife; and they went forth together out of Ur of the Chaldeans, to go into the land of Canaan, and came as far as Haran, and dwelt there.";
web[31] = "And Terah took Abram his son, and Lot the son of Haran his son\'s son, and Sarai his daughter-in-law, his son Abram\'s wife; and they went forth with them from Ur of the Chaldees, to go into the land of Canaan; and they came to Haran, and dwelt there.";
hnv[31] = "Terach took Avram his son, Lot the son of Haran, his son\'s son, and Sarai his daughter-in-law, his son Avram\'s wife. They went forth from Ur of the Kasdim, to go into the land of Kana`an. They came to Haran, and lived there.";
vul[31] = "tulit itaque Thare Abram filium suum et Loth filium Aran filium filii sui et Sarai nurum suam uxorem Abram filii sui et eduxit eos de Ur Chaldeorum ut irent in terram Chanaan veneruntque usque Haran et habitaverunt ibi";
kjv[32] = "And the days of Terah were two hundred and five years: and Terah died in Haran.";
rsv[32] = "The days of Terah were two hundred and five years; and Terah died in Haran.";
asv[32] = "And the days of Terah were two hundred and five years: and Terah died in Haran.";
yng[32] = "And the days of Terah are two hundred and five years, and Terah dieth in Charan.";
dby[32] = "And the days of Terah were two hundred and five years; and Terah died in Haran.";
web[32] = "And the days of Terah were two hundred and five years: and Terah died in Haran.";

csb[1] = "The whole earth had the same language and vocabulary.";
csb[2] = "As people migrated from the east, they found a valley in the land of Shinar and settled there.";
csb[3] = "They said to each other, &quot;Come, let us make oven-fired bricks.&quot; (They used brick for stone and asphalt for mortar.)";
csb[4] = "And they said, &quot;Come, let us build ourselves a city and a tower with its top in the sky. Let us make a name for ourselves; otherwise, we will be scattered throughout the earth.&quot;";
csb[5] = "Then the LORD came down to look over the city and the tower that the humans were building.";
csb[6] = "The LORD said, &quot;If they have begun to do this as one people all having the same language, then nothing they plan to do will be impossible for them.";
csb[7] = "&quot;Come, let\'s go down there and confuse their language so that they will not understand one another\'s speech.&quot;";
csb[8] = "So from there the LORD scattered them throughout the earth, and they stopped building the city.";
csb[9] = "Therefore it is called Babylon, for there the LORD confused the language of the whole earth, and from there the LORD scattered them throughout the earth.";
csb[10] = "These are the family records of Shem. Shem lived 100 years and fathered Arpachshad two years after the flood.";
csb[11] = "After he fathered Arpachshad, Shem lived 500 years and fathered other sons and daughters.";
csb[12] = "Arpachshad lived 35 years and fathered Shelah.";
csb[13] = "After he fathered Shelah, Arpachshad lived 403 years and fathered other sons and daughters.";
csb[14] = "Shelah lived 30 years and fathered Eber.";
csb[15] = "After he fathered Eber, Shelah lived 403 years and fathered other sons and daughters.";
csb[16] = "Eber lived 34 years and fathered Peleg.";
csb[17] = "After he fathered Peleg, Eber lived 430 years and fathered other sons and daughters.";
csb[18] = "Peleg lived 30 years and fathered Reu.";
csb[19] = "After he fathered Reu, Peleg lived 209 years and fathered other sons and daughters.";
csb[20] = "Reu lived 32 years and fathered Serug.";
csb[21] = "After he fathered Serug, Reu lived 207 years and fathered other sons and daughters.";
csb[22] = "Serug lived 30 years and fathered Nahor.";
csb[23] = "After he fathered Nahor, Serug lived 200 years and fathered other sons and daughters.";
csb[24] = "Nahor lived 29 years and fathered Terah.";
csb[25] = "After he fathered Terah, Nahor lived 119 years and fathered other sons and daughters.";
csb[26] = "Terah lived 70 years and fathered Abram, Nahor, and Haran.";
csb[27] = "These are the family records of Terah. Terah fathered Abram, Nahor, and Haran, and Haran fathered Lot.";
csb[28] = "Haran died in his native land, in Ur of the Chaldeans, during his father Terah\'s lifetime.";
csb[29] = "Abram and Nahor took wives: Abram\'s wife was named Sarai, and Nahor\'s wife was named Milcah. She was the daughter of Haran, the father of both Milcah and Iscah.";
csb[30] = "Sarai was unable to conceive; she did not have a child.";
csb[31] = "Terah took his son Abram, his grandson Lot (Haran\'s son), and his daughter-in-law Sarai, his son Abram\'s wife, and they set out together from Ur of the Chaldeans to go to the land of Canaan. But when they came to Haran, they settled there.";
csb[32] = "Terah lived 205 years and died in Haran.";
