kjv[7] = "And as for me, when I came from Padan, Rachel died by me in the land of Canaan in the way, when yet [there was] but a little way to come unto Ephrath: and I buried her there in the way of Ephrath; the same [is] Bethlehem.";

vul[7] = "mihi enim quando veniebam de Mesopotamiam mortua est Rahel in terra Chanaan in ipso itinere eratque vernum tempus et ingrediebar Ephratam et sepelivi eam iuxta viam Ephratae quae alio nomine appellatur Bethleem";

hnv[20] = "He blessed them that day, saying, &quot;In you will Yisra\'el bless, saying, \'God make you as Efrayim and as Menashsheh\'&quot; He set Efrayim before Menashsheh.";
vul[20] = "benedixitque eis in ipso tempore dicens in te benedicetur Israhel atque dicetur faciat tibi Deus sicut Ephraim et sicut Manasse constituitque Ephraim ante Manassen";
kjv[21] = "And Israel said unto Joseph, Behold, I die: but God shall be with you, and bring you again unto the land of your fathers.";
rsv[21] = "Then Israel said to Joseph, &quot;Behold, I am about to die, but God will be with you, and will bring you again to the land of your fathers.";
asv[21] = "And Israel said unto Joseph, Behold, I die: but God will be with you, and bring you again unto the land of your fathers.";
yng[21] = "And Israel saith unto Joseph, `Lo, I am dying, and God hath been with you, and hath brought you back unto the land of your fathers;";
dby[21] = "And Israel said to Joseph, Behold, I die; and God will be with you, and bring you again to the land of your fathers.";
web[21] = "And Israel said to Joseph, Behold, I die; but God shall be with you, and bring you again to the land of your fathers.";
hnv[21] = "Yisra\'el said to Yosef, &quot;Behold, I am dying, but God will be with you, and bring you again to the land of your fathers.";
vul[21] = "et ait ad Ioseph filium suum en ego morior et erit Deus vobiscum reducetque vos ad terram patrum vestrorum";
kjv[22] = "Moreover I have given to thee one portion above thy brethren, which I took out of the hand of the Amorite with my sword and with my bow.";
rsv[22] = "Moreover I have given to you rather than to your brothers one mountain slope which I took from the hand of the Amorites with my sword and with my bow.&quot;";
asv[22] = "Moreover I have given to thee one portion above thy brethren, which I took out of the hand of the Amorite with my sword and with my bow.";
yng[22] = "and I -- I have given to thee one portion above thy brethren, which I have taken out of the hand of the Amorite by my sword and by my bow.\'";
dby[22] = "And *I* have given to thee one tract [of land] above thy brethren, which I took out of the hand of the Amorite with my sword and with my bow.";
web[22] = "Moreover I have given to thee one portion above thy brethren, which I took out of the hand of the Amorite with my sword and with my bow.";
hnv[22] = "Moreover I have given to you one portion above your brothers, which I took out of the hand of the Amori with my sword and with my bow.&quot;";
vul[22] = "do tibi partem unam extra fratres tuos quam tuli de manu Amorrei in gladio et arcu meo";
csb[1] = "Some time after this, Joseph was told, &quot;Your father is weaker.&quot; So he set out with his two sons, Manasseh and Ephraim.";
csb[2] = "When Jacob was told, &quot;Your son Joseph has come to you,&quot; Israel summoned his strength and sat up in bed.";
csb[3] = "Jacob said to Joseph, &quot;God Almighty appeared to me at Luz in the land of Canaan and blessed me.";
csb[4] = "&quot;He said to me, \'I will make you fruitful and numerous; I will make many nations come from you, and I will give this land as a permanent possession to your future descendants.\'";
csb[5] = "&quot;Your two sons born to you in the land of Egypt before I came to you in Egypt are now mine. Ephraim and Manasseh belong to me just as Reuben and Simeon do.";
csb[6] = "&quot;Children born to you after them will be yours and will be recorded under the names of their brothers with regard to their inheritance.";
csb[7] = "&quot;When I was returning from Paddan, to my sorrow Rachel died along the way, some distance from Ephrath in the land of Canaan. I buried her there along the way to Ephrath&quot; (that is, Bethlehem).";
csb[8] = "When Israel saw Joseph\'s sons, he said, &quot;Who are these? &quot;";
csb[9] = "And Joseph said to his father, &quot;They are my sons God has given me here.&quot; So Israel said, &quot;Bring them to me and I will bless them.&quot;";
csb[10] = "Now his eyesight was poor because of old age; he could hardly see. Joseph brought them to him, and he kissed and embraced them.";
csb[11] = "Israel said to Joseph, &quot;I never expected to see your face again, but now God has even let me see your offspring.&quot;";
csb[12] = "Then Joseph took them from his father\'s knees and bowed with his face to the ground.";
csb[13] = "Then Joseph took them both -- with his right hand Ephraim toward Israel\'s left, and with his left hand Manasseh toward Israel\'s right -- and brought them to Israel.";
csb[14] = "But Israel stretched out his right hand and put it on the head of Ephraim, the younger, and crossing his hands, put his left on Manasseh\'s head, although Manasseh was the firstborn.";
csb[15] = "Then he blessed Joseph and said: The God before whom my fathers Abraham and Isaac walked, the God who has been my shepherd all my life to this day,";
csb[16] = "the angel who has redeemed me from all harm -- may he bless these boys. And may they be called by my name and the names of my fathers Abraham and Isaac, and may they grow to be numerous within the land.";
csb[17] = "When Joseph saw that his father had placed his right hand on Ephraim\'s head, he thought it was a mistake and took his father\'s hand to move it from Ephraim\'s head to Manasseh\'s.";
csb[18] = "Joseph said to his father, &quot;Not that way, my father! This one is the firstborn. Put your right hand on his head.&quot;";
csb[19] = "But his father refused and said, &quot;I know, my son, I know! He too will become a tribe, and he too will be great; nevertheless, his younger brother will be greater than he, and his offspring will become a populous nation.&quot;";
csb[20] = "So he blessed them that day, putting Ephraim before Manasseh when he said, &quot;The nation Israel will invoke blessings by you, saying, \'May God make you like Ephraim and Manasseh.\' &quot;";
csb[21] = "Israel said to Joseph, &quot;Look, I am about to die, but God will be with you and will bring you back to the land of your fathers.";
csb[22] = "&quot;Over and above what I am giving your brothers, I am giving you the one mountain slope that I took from the Amorites with my sword and bow.&quot;";
</script>
