dby[30] = "And he said, That thou take the seven ewe-lambs of my hand, that they may be a witness to me that I have dug this well.";

csb[1] = "The LORD came to Sarah as he had said, and the LORD did for Sarah what he had promised.";
csb[2] = "Sarah became pregnant and bore a son to Abraham in his old age, at the appointed time God had told him.";
csb[3] = "Abraham named his son who was born to him -- the one Sarah bore to him -- Isaac.";
csb[4] = "When his son Isaac was eight days old, Abraham circumcised him, as God had commanded him.";
csb[5] = "Abraham was a hundred years old when his son Isaac was born to him.";
csb[6] = "Sarah said, &quot;God has made me laugh, and everyone who hears will laugh with me.&quot;";
csb[7] = "She also said, &quot;Who would have told Abraham that Sarah would nurse children? Yet I have borne a son for him in his old age.&quot;";
csb[8] = "The child grew and was weaned, and Abraham held a great feast on the day Isaac was weaned.";
csb[9] = "But Sarah saw the son mocking -- the one Hagar the Egyptian had borne to Abraham.";
csb[10] = "So she said to Abraham, &quot;Drive out this slave with her son, for the son of this slave will not be a coheir with my son Isaac! &quot;";
csb[11] = "This was very distressing to Abraham because of his son.";
csb[12] = "But God said to Abraham, &quot;Do not be distressed about the boy and about your slave. Whatever Sarah says to you, listen to her, because your offspring will be traced through Isaac,";
csb[13] = "&quot;and I will also make a nation of the slave\'s son because he is your offspring.&quot;";
csb[14] = "Early in the morning Abraham got up, took bread and a waterskin, put them on Hagar\'s shoulders, and sent her and the boy away. She left and wandered in the Wilderness of Beer-sheba.";
csb[15] = "When the water in the skin was gone, she left the boy under one of the bushes";
csb[16] = "and went and sat at a distance, about a bowshot away, for she said, &quot;I can\'t bear to watch the boy die! &quot; While she sat at a distance, she wept loudly.";
csb[17] = "God heard the boy crying, and the angel of God called to Hagar from heaven and said to her, &quot;What\'s wrong, Hagar? Don\'t be afraid, for God has heard the boy crying from the place where he is.";
csb[18] = "&quot;Get up, help the boy up, and grasp his hand, for I will make him a great nation.&quot;";
csb[19] = "Then God opened her eyes, and she saw a well. So she went and filled the waterskin and gave the boy a drink.";
csb[20] = "God was with the boy, and he grew; he settled in the wilderness and became an archer.";
csb[21] = "He settled in the Wilderness of Paran, and his mother got a wife for him from the land of Egypt.";
csb[22] = "At that time Abimelech, accompanied by Phicol the commander of his army, said to Abraham, &quot;God is with you in everything you do.";
csb[23] = "&quot;Swear to me by God here and now, that you will not break an agreement with me or with my children and descendants. As I have been loyal to you, so you will be loyal to me and to the country where you are a resident alien.&quot;";
csb[24] = "And Abraham said, &quot;I swear it.&quot;";
csb[25] = "But Abraham complained to Abimelech because of the well that Abimelech\'s servants had seized.";
csb[26] = "Abimelech replied, &quot;I don\'t know who did this thing. You didn\'t report anything to me, so I hadn\'t heard about it until today.&quot;";
csb[27] = "Abraham took flocks and herds and gave them to Abimelech, and the two of them made a covenant.";
csb[28] = "Abraham separated seven ewe lambs from the flock.";
csb[29] = "And Abimelech said to Abraham, &quot;Why have you separated these seven ewe lambs? &quot;";
csb[30] = "He replied, &quot;You are to accept the seven ewe lambs from me so that this act will serve as my witness that I dug this well.&quot;";
csb[31] = "Therefore that place was called Beer-sheba because it was there that the two of them swore an oath.";
csb[32] = "After they had made a covenant at Beer-sheba, Abimelech and Phicol, the commander of his army, left and returned to the land of the Philistines.";
csb[33] = "Abraham planted a tamarisk tree in Beer-sheba, and there he called on the name of the LORD, the Everlasting God.";
csb[34] = "And Abraham lived as an alien in the land of the Philistines for many days.";
