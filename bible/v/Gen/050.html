kjv[5] = "My father made me swear, saying, Lo, I die: in my grave which I have digged for me in the land of Canaan, there shalt thou bury me. Now therefore let me go up, I pray thee, and bury my father, and I will come again.";

asv[5] = "My father made me swear, saying, Lo, I die: in my grave which I have digged for me in the land of Canaan, there shalt thou bury me. Now therefore let me go up, I pray thee, and bury my father, and I will come again.";
yng[5] = "My father caused me to swear, saying, Lo, I am dying; in my burying-place which I have prepared for myself in the land of Canaan, there dost thou bury me; and now, let me go up, I pray thee, and bury my father, and return;\'";
dby[5] = "My father made me swear, saying, Behold, I die; in my grave which I have dug myself in the land of Canaan, there shalt thou bury me. And now, let me go up, I pray thee, that I may bury my father; and I will come again.";
web[5] = "My father made me swear, saying, Lo, I die: in my grave which I have digged for me in the land of Canaan, there shalt thou bury me. Now therefore let me go, I pray thee, and bury my father, and I will come again.";
hnv[5] = "\'My father made me swear, saying, &quot;Behold, I am dying. Bury me in my grave which I have dug for myself in the land of Kana`an.&quot; Now therefore, please let me go up and bury my father, and I will come again.\'&quot;";
vul[5] = "eo quod pater meus adiuraverit me dicens en morior in sepulchro meo quod fodi mihi in terra Chanaan sepelies me ascendam igitur et sepeliam patrem meum ac revertar";

vul[6] = "dixitque ei Pharao ascende et sepeli patrem tuum sicut adiuratus es";

yng[10] = "And they come unto the threshing-floor of Atad, which [is] beyond the Jordan, and they lament there, a lamentation great and very grievous; and he maketh for his father a mourning seven days,";
dby[10] = "And they came to the threshing-floor of Atad, which is beyond the Jordan; and there they lamented with a great and very grievous lamentation; and he made a mourning for his father of seven days.";

kjv[11] = "And when the inhabitants of the land, the Canaanites, saw the mourning in the floor of Atad, they said, This [is] a grievous mourning to the Egyptians: wherefore the name of it was called Abelmizraim, which [is] beyond Jordan.";
rsv[11] = "When the inhabitants of the land, the Canaanites, saw the mourning on the threshing floor of Atad, they said, &quot;This is a grievous mourning to the Egyptians.&quot; Therefore the place was named A\'bel-mizraim; it is beyond the Jordan.";
asv[11] = "And when the inhabitants of the land, the Canaanites, saw the mourning in the floor of Atad, they said, This is a grievous mourning to the Egyptians: wherefore the name of it was called Abel-mizraim, which is beyond the Jordan.";
yng[11] = "and the inhabitant of the land, the Canaanite, see the mourning in the threshing-floor of Atad, and say, `A grievous mourning [is] this to the Egyptians;\' therefore hath [one] called its name `The mourning of the Egyptians,\' which [is] beyond the Jordan.";
dby[11] = "And the inhabitants of the land, the Canaanites, saw the mourning at the threshing-floor of Atad, and they said, This is a grievous mourning of the Egyptians. Therefore the name of it was called Abel-Mizraim, which is beyond the Jordan.";
web[11] = "And when the inhabitants of the land, the Canaanites, saw the mourning in the floor of Atad, they said, This [is] a grievous mourning to the Egyptians: wherefore the name of it was called Abel-mizraim, which [is] beyond Jordan.";
hnv[11] = "When the inhabitants of the land, the Kana`anim, saw the mourning in the floor of Atad, they said, &quot;This is a grievous mourning by the Mitzrim.&quot; Therefore, the name of it was called Avel-Mitzrayim, which is beyond the Yarden.";
vul[11] = "quod cum vidissent habitatores terrae Chanaan dixerunt planctus magnus est iste Aegyptiis et idcirco appellaverunt nomen loci illius Planctus Aegypti";

yng[13] = "and his sons bear him away to the land of Canaan, and bury him in the cave of the field of Machpelah, which Abraham bought with the field for a possession of a burying-place, from Ephron the Hittite, on the front of Mamre.";

kjv[14] = "And Joseph returned into Egypt, he, and his brethren, and all that went up with him to bury his father, after he had buried his father.";

asv[14] = "And Joseph returned into Egypt, he, and his brethren, and all that went up with him to bury his father, after he had buried his father.";

dby[14] = "And, after he had buried his father, Joseph returned to Egypt, he and his brethren, and all that had gone up with him to bury his father.";
web[14] = "And Joseph returned to Egypt, he and his brethren, and all that went up with him to bury his father, after he had buried his father.";
hnv[14] = "Yosef returned into Mitzrayim -- he, and his brothers, and all that went up with him to bury his father, after he had buried his father.";
vul[14] = "reversusque est Ioseph in Aegyptum cum fratribus suis et omni comitatu sepulto patre";
kjv[15] = "And when Joseph\'s brethren saw that their father was dead, they said, Joseph will peradventure hate us, and will certainly requite us all the evil which we did unto him.";
rsv[15] = "When Joseph\'s brothers saw that their father was dead, they said, &quot;It may be that Joseph will hate us and pay us back for all the evil which we did to him.&quot;";
asv[15] = "And when Joseph\'s brethren saw that their father was dead, they said, It may be that Joseph will hate us, and will fully requite us all the evil which we did unto him.";
yng[15] = "And the brethren of Joseph see that their father is dead, and say, `Peradventure Joseph doth hate us, and doth certainly return to us all the evil which we did with him.\'";
dby[15] = "And when Joseph\'s brethren saw that their father was dead, they said, If now Joseph should be hostile to us, and should indeed requite us all the evil that we did to him!";
web[15] = "And when Joseph\'s brethren saw that their father was dead, they said, Joseph will perhaps hate us, and will certainly requite us all the evil which we did to him.";
hnv[15] = "When Yosef\'s brothers saw that their father was dead, they said, &quot;It may be that Yosef will hate us, and will fully pay us back for all of the evil which we did to him.";
vul[15] = "quo mortuo timentes fratres eius et mutuo conloquentes ne forte memor sit iniuriae quam passus est et reddat nobis malum omne quod fecimus";

web[16] = "And they sent messengers to Joseph, saying, Thy father commanded before he died, saying,";
hnv[16] = "They sent a message to Yosef, saying, &quot;Your father commanded before he died, saying,";
vul[16] = "mandaverunt ei pater tuus praecepit nobis antequam moreretur";
kjv[17] = "So shall ye say unto Joseph, Forgive, I pray thee now, the trespass of thy brethren, and their sin; for they did unto thee evil: and now, we pray thee, forgive the trespass of the servants of the God of thy father. And Joseph wept when they spake unto him.";
rsv[17] = "\'Say to Joseph, Forgive, I pray you, the transgression of your brothers and their sin, because they did evil to you.\' And now, we pray you, forgive the transgression of the servants of the God of your father.&quot; Joseph wept when they spoke to him.";
asv[17] = "So shall ye say unto Joseph, Forgive, I pray thee now, the transgression of thy brethren, and their sin, for that they did unto thee evil. And now, we pray thee, forgive the transgression of the servants of the God of thy father. And Joseph wept when they spake unto him.";
yng[17] = "Thus ye do say to Joseph, I pray thee, bear, I pray thee, with the transgression of thy brethren, and their sin, for they have done thee evil; and now, bear, we pray thee, with the transgression of the servants of the God of thy father;\' and Joseph weepeth in their speaking unto him.";
dby[17] = "Thus shall ye speak to Joseph: Oh forgive, I pray thee, the transgression of thy brethren, and their sin! for they did evil to thee. And now, we pray thee, forgive the transgression of the servants of the God of thy father. And Joseph wept when they spoke to him.";
web[17] = "So shall ye say to Joseph, Forgive, I pray thee now, the trespass of thy brethren, and their sin; for they did to thee evil: and now, we pray thee, forgive the trespass of the servants of the God of thy father. And Joseph wept when they spoke to him.";
hnv[17] = " &quot;So you shall tell Yosef, \'Now please forgive the disobedience of your brothers, and their sin, because they did evil to you.\' Now, please forgive the disobedience of the servants of the God of your father.&quot; Yosef wept when they spoke to him.";
vul[17] = "ut haec tibi verbis illius diceremus obsecro ut obliviscaris sceleris fratrum tuorum et peccati atque malitiae quam exercuerunt in te nos quoque oramus ut servis Dei patris tui dimittas iniquitatem hanc quibus auditis flevit Ioseph";
kjv[18] = "And his brethren also went and fell down before his face; and they said, Behold, we [be] thy servants.";
rsv[18] = "His brothers also came and fell down before him, and said, &quot;Behold, we are your servants.&quot;";
asv[18] = "And his brethren also went and fell down before his face; and they said, Behold, we are thy servants.";
yng[18] = "And his brethren also go and fall before him, and say, `Lo, we [are] to thee for servants.\'";
dby[18] = "And his brethren also went and fell down before his face, and said, Behold, we are thy bondmen.";
web[18] = "And his brethren also went and fell down before his face: and they said, Behold, we [are] thy servants.";
hnv[18] = "His brothers also went and fell down before his face; and they said, &quot;Behold, we are your servants.&quot;";
vul[18] = "veneruntque ad eum fratres sui et proni in terram dixerunt servi tui sumus";
kjv[19] = "And Joseph said unto them, Fear not: for [am] I in the place of God?";
rsv[19] = "But Joseph said to them, &quot;Fear not, for am I in the place of God?";

yng[19] = "And Joseph saith unto them, `Fear not, for [am] I in the place of God?";
dby[19] = "And Joseph said to them, Fear not: am I then in the place of God?";
web[19] = "And Joseph said to them, Fear not: for [am] I in the place of God?";
hnv[19] = "Yosef said to them, &quot;Don\'t be afraid, for am I in the place of God?";
vul[19] = "quibus ille respondit nolite timere num Dei possumus rennuere voluntatem";
kjv[20] = "But as for you, ye thought evil against me; [but] God meant it unto good, to bring to pass, as [it is] this day, to save much people alive.";
rsv[20] = "As for you, you meant evil against me; but God meant it for good, to bring it about that many people should be kept alive, as they are today.";
asv[20] = "And as for you, ye meant evil against me; but God meant it for good, to bring to pass, as it is this day, to save much people alive.";
yng[20] = "As for you, ye devised against me evil -- God devised it for good, in order to do as [at] this day, to keep alive a numerous people;";
dby[20] = "Ye indeed meant evil against me: God meant it for good, in order that he might do as [it is] this day, to save a great people alive.";
web[20] = "But as for you, ye thought evil against me; [but] God meant it for good, to bring to pass, as [it is] this day, to save many people alive.";
hnv[20] = "As for you, you meant evil against me, but God meant it for good, to bring to pass, as it is this day, to save many people alive.";
vul[20] = "vos cogitastis de me malum et Deus vertit illud in bonum ut exaltaret me sicut inpraesentiarum cernitis et salvos faceret multos populos";

rsv[21] = "So do not fear; I will provide for you and your little ones.&quot; Thus he reassured them and comforted them.";
asv[21] = "Now therefore fear ye not: I will nourish you, and your little ones. And he comforted them, and spake kindly unto them.";
yng[21] = "and now, fear not: I do nourish you and your infants;\' and he comforteth them, and speaketh unto their heart.";
dby[21] = "And now, fear not: I will maintain you and your little ones. And he comforted them, and spoke consolingly to them.";
web[21] = "Now therefore fear ye not: I will nourish you, and your little ones. And he comforted them, and spoke kindly to them.";
hnv[21] = "Now therefore don\'t be afraid. I will nourish you and your little ones.&quot; He comforted them, and spoke kindly to them.";
vul[21] = "nolite metuere ego pascam vos et parvulos vestros consolatusque est eos et blande ac leniter est locutus";
kjv[22] = "And Joseph dwelt in Egypt, he, and his father\'s house: and Joseph lived an hundred and ten years.";
rsv[22] = "So Joseph dwelt in Egypt, he and his father\'s house; and Joseph lived a hundred and ten years.";
asv[22] = "And Joseph dwelt in Egypt, he, and his father\'s house: and Joseph lived a hundred and ten years.";
yng[22] = "And Joseph dwelleth in Egypt, he and the house of his father, and Joseph liveth a hundred and ten years,";
dby[22] = "And Joseph dwelt in Egypt, he and his father\'s house; and Joseph lived a hundred and ten years.";
web[22] = "And Joseph dwelt in Egypt, he, and his father\'s house: and Joseph lived a hundred and ten years.";
hnv[22] = "Yosef lived in Mitzrayim, he, and his father\'s house. Yosef lived one hundred ten years.";
vul[22] = "[Vulgate 50:22a] et habitavit in Aegypto cum omni domo patris sui vixitque centum decem annis";
kjv[23] = "And Joseph saw Ephraim\'s children of the third [generation]: the children also of Machir the son of Manasseh were brought up upon Joseph\'s knees.";
rsv[23] = "And Joseph saw E\'phraim\'s children of the third generation; the children also of Machir the son of Manas\'seh were born upon Joseph\'s knees.";
asv[23] = "And Joseph saw Ephraim\'s children of the third generation: the children also of Machir the son of Manasseh were born upon Joseph\'s knees.";
yng[23] = "and Joseph looketh on Ephraim\'s sons of the third [generation]; sons also of Machir, son of Manasseh, have been born on the knees of Joseph.";
dby[23] = "And Joseph saw Ephraim\'s children of the third [generation]; the sons also of Machir the son of Manasseh were born on Joseph\'s knees.";
web[23] = "And Joseph saw Ephraim\'s children of the third [generation]: the children also of Machir, the son of Manasseh, were brought up upon Joseph\'s knees.";
hnv[23] = "Yosef saw Efrayim\'s children to the third generation. The children also of Makhir, the son of Menashsheh, were born on Yosef\'s knees.";
vul[23] = "[Vulgate 50:22b] et vidit Ephraim filios usque ad tertiam generationem filii quoque Machir filii Manasse nati sunt in genibus Ioseph";
kjv[24] = "And Joseph said unto his brethren, I die: and God will surely visit you, and bring you out of this land unto the land which he sware to Abraham, to Isaac, and to Jacob.";
rsv[24] = "And Joseph said to his brothers, &quot;I am about to die; but God will visit you, and bring you up out of this land to the land which he swore to Abraham, to Isaac, and to Jacob.&quot;";
asv[24] = "And Joseph said unto his brethren, I die; but God will surely visit you, and bring you up out of this land unto the land which he sware to Abraham, to Isaac, and to Jacob.";
yng[24] = "And Joseph saith unto his brethren, `I am dying, and God doth certainly inspect you, and hath caused you to go up from this land, unto the land which He hath sworn to Abraham, to Isaac, and to Jacob.\'";
dby[24] = "And Joseph said to his brethren, I die; and God will certainly visit you, and bring you up out of this land, into the land that he swore unto Abraham, to Isaac, and to Jacob.";
web[24] = "And Joseph said to his brethren, I die: and God will surely visit you, and bring you out of this land, to the land which he swore to Abraham, to Isaac, and to Jacob.";
hnv[24] = "Yosef said to his brothers, &quot;I am dying, but God will surely visit you, and bring you up out of this land to the land which he swore to Avraham, to Yitzchak, and to Ya`akov.&quot;";
vul[24] = "[Vulgate 50:23] quibus transactis locutus est fratribus suis post mortem meam Deus visitabit vos et ascendere faciet de terra ista ad terram quam iuravit Abraham Isaac et Iacob";
kjv[25] = "And Joseph took an oath of the children of Israel, saying, God will surely visit you, and ye shall carry up my bones from hence.";
rsv[25] = "Then Joseph took an oath of the sons of Israel, saying, &quot;God will visit you, and you shall carry up my bones from here.&quot;";
asv[25] = "And Joseph took an oath of the children of Israel, saying, God will surely visit you, and ye shall carry up my bones from hence.";
yng[25] = "And Joseph causeth the sons of Israel to swear, saying, `God doth certainly inspect you, and ye have brought up my bones from this [place].\'";
dby[25] = "And Joseph took an oath of the children of Israel, saying, God will certainly visit you; and ye shall carry up my bones hence.";
web[25] = "And Joseph took an oath of the children of Israel, saying, God will surely visit you, and ye shall carry up my bones from hence.";
hnv[25] = "Yosef took an oath of the children of Yisra\'el, saying, &quot;God will surely visit you, and you shall carry up my bones from here.&quot;";
vul[25] = "[Vulgate 50:24] cumque adiurasset eos atque dixisset Deus visitabit vos asportate vobiscum ossa mea de loco isto";
kjv[26] = "So Joseph died, [being] an hundred and ten years old: and they embalmed him, and he was put in a coffin in Egypt.";
rsv[26] = "So Joseph died, being a hundred and ten years old; and they embalmed him, and he was put in a coffin in Egypt.";
asv[26] = "So Joseph died, being a hundred and ten years old: and they embalmed him, and he was put in a coffin in Egypt.";
yng[26] = "And Joseph dieth, a son of an hundred and ten years, and they embalm him, and he is put into a coffin in Egypt.";
dby[26] = "And Joseph died, a hundred and ten years old; and they embalmed him; and he was put in a coffin in Egypt.";
web[26] = "So Joseph died, [being] a hundred and ten years old: and they embalmed him, and he was put in a coffin in Egypt.";
hnv[26] = "So Yosef died, being one hundred ten years old, and they embalmed him, and he was put in a coffin in Mitzrayim.";
vul[26] = "[Vulgate 50:25] mortuus est expletis centum decem vitae suae annis et conditus aromatibus repositus est in loculo in Aegypto";
csb[1] = "Then Joseph, leaning over his father\'s face, wept and kissed him.";
csb[2] = "He commanded his servants who were physicians to embalm his father. So they embalmed Israel.";
csb[3] = "They took forty days to complete this, for embalming takes that long, and the Egyptians mourned for him seventy days.";
csb[4] = "When the days of mourning were over, Joseph said to Pharaoh\'s household, &quot;If I have found favor with you, please tell Pharaoh that";
csb[5] = "&quot;my father made me take an oath, saying, \'I am about to die. You must bury me there in the tomb that I made for myself in the land of Canaan.\' Now let me go and bury my father. Then I will return.&quot;";
csb[6] = "So Pharaoh said, &quot;Go and bury your father in keeping with your oath.&quot;";
csb[7] = "Then Joseph went to bury his father, and all Pharaoh\'s servants, the elders of his household, and all the elders of the land of Egypt went with him,";
csb[8] = "along with all Joseph\'s family, his brothers, and his father\'s family. Only their dependents, their flocks, and their herds were left in the land of Goshen.";
csb[9] = "Horses and chariots went up with him; it was a very impressive procession.";
csb[10] = "When they reached the threshing floor of Atad, which is across the Jordan, they lamented and wept loudly, and Joseph mourned seven days for his father.";
csb[11] = "When the Canaanite inhabitants of the land saw the mourning at the threshing floor of Atad, they said, &quot;This is a solemn mourning on the part of the Egyptians.&quot; Therefore the place is named Abel-mizraim. It is across the Jordan.";
csb[12] = "So Jacob\'s sons did for him what he had commanded them.";
csb[13] = "They carried him to the land of Canaan and buried him in the cave at Machpelah in the field near Mamre, which Abraham had purchased as burial property from Ephron the Hethite.";
csb[14] = "After Joseph buried his father, he returned to Egypt with his brothers and all who had gone with him to bury his father.";
csb[15] = "When Joseph\'s brothers saw that their father was dead, they said to one another, &quot;If Joseph is holding a grudge against us, he will certainly repay us for all the suffering we caused him.&quot;";
csb[16] = "So they sent this message to Joseph, &quot;Before he died your father gave a command:";
csb[17] = "&quot;\'Say this to Joseph: Please forgive your brothers\' transgression and their sin -- the suffering they caused you.\' Therefore, please forgive the transgression of the servants of the God of your father.&quot; Joseph wept when their message came to him.";
csb[18] = "His brothers also came to him, bowed down before him, and said, &quot;We are your slaves! &quot;";
csb[19] = "But Joseph said to them, &quot;Don\'t be afraid. Am I in the place of God?";
csb[20] = "&quot;You planned evil against me; God planned it for good to bring about the present result -- the survival of many people.";
csb[21] = "&quot;Therefore don\'t be afraid. I will take care of you and your children.&quot; And he comforted them and spoke kindly to them.";
csb[22] = "Joseph and his father\'s family remained in Egypt. Joseph lived 110 years.";
csb[23] = "He saw Ephraim\'s sons to the third generation; the sons of Manasseh\'s son Machir were recognized by Joseph.";
csb[24] = "Joseph said to his brothers, &quot;I am about to die, but God will certainly come to your aid and bring you up from this land to the land he swore to give to Abraham, Isaac, and Jacob.&quot;";
csb[25] = "So Joseph made the sons of Israel take an oath: &quot;When God comes to your aid, you are to carry my bones up from here.&quot;";
csb[26] = "Joseph died at the age of 110. They embalmed him and placed him in a coffin in Egypt.";</script>
