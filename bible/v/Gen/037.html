kjv[2] = "And he said, I seek my brethren: tell me, I pray thee, where they feed [their flocks].";
rsv[2] = "This is the history of the family of Jacob. Joseph, being seventeen years old, was shepherding the flock with his brothers; he was a lad with the sons of Bilhah and Zilpah, his father\'s wives; and Joseph brought an ill report of them to their father.";
asv[2] = "These are the generations of Jacob. Joseph, being seventeen years old, was feeding the flock with his brethren; and he was a lad with the sons of Bilhah, and with the sons of Zilpah, his father\'s wives: and Joseph brought the evil report of them unto their father.";
yng[2] = "These [are] births of Jacob: Joseph, a son of seventeen years, hath been enjoying himself with his brethren among the flock, (and he [is] a youth,) with the sons of Bilhah, and with the sons of Zilpah, his father\'s wives, and Joseph bringeth in an account of their evil unto their father.";
dby[2] = "These are the generations of Jacob. Joseph, being seventeen years old, fed the flock with his brethren; and he was doing service with the sons of Bilhah, and with the sons of Zilpah, his father\'s wives. And Joseph brought to his father an evil report of them.";
web[2] = "These [are] the generations of Jacob. Joseph [being] seventeen years old, was feeding the flock with his brethren, and the lad [was] with the sons of Bilhah, and with the sons of Zilpah, his father\'s wives: and Joseph brought to his father their evil report.";
hnv[2] = "This is the history of the generations of Ya`akov. Yosef, being seventeen years old, was feeding the flock with his brothers. He was a boy with the sons of Bilhah and Zilpah, his father\'s wives. Yosef brought an evil report of them to their father.";
vul[2] = "et hae sunt generationes eius Ioseph cum sedecim esset annorum pascebat gregem cum fratribus suis adhuc puer et erat cum filiis Balae et Zelphae uxorum patris sui accusavitque fratres suos apud patrem crimine pessimo";
kjv[3] = "And the man said, They are departed hence; for I heard them say, Let us go to Dothan. And Joseph went after his brethren, and found them in Dothan.";
rsv[3] = "Now Israel loved Joseph more than any other of his children, because he was the son of his old age; and he made him a long robe with sleeves.";
asv[3] = "Now Israel loved Joseph more than all his children, because he was the son of his old age: and he made him a coat of many colors.";
yng[3] = "And Israel hath loved Joseph more than any of his sons, for he [is] a son of his old age, and hath made for him a long coat;";
dby[3] = "And Israel loved Joseph more than all his sons, because he was son of his old age; and he made him a vest of many colours.";
web[3] = "Now Israel loved Joseph more than all his children, because he [was] the son of his old age: and he made him a coat of [many] colors.";
hnv[3] = "Now Yisra\'el loved Yosef more than all his children, because he was the son of his old age, and he made him a coat of many colors.";
vul[3] = "Israhel autem diligebat Ioseph super omnes filios suos eo quod in senectute genuisset eum fecitque ei tunicam polymitam";

hnv[4] = "His brothers saw that their father loved him more than all his brothers, and they hated him, and couldn\'t speak peaceably to him.";

rsv[23] = "So when Joseph came to his brothers, they stripped him of his robe, the long robe with sleeves that he wore;";
asv[23] = "And it came to pass, when Joseph was come unto his brethren, that they stripped Joseph of his coat, the coat of many colors that was on him;";
yng[23] = "And it cometh to pass, when Joseph hath come unto his brethren, that they strip Joseph of his coat, the long coat which [is] upon him,";
dby[23] = "And it came to pass when Joseph came to his brethren, that they stripped Joseph of his vest, the vest of many colours, which he had on;";
web[23] = "And it came to pass when Joseph had come to his brethren, that they stripped Joseph of his coat, [his] coat of [many] colors that [was] on him.";
hnv[23] = "It happened, when Yosef came to his brothers, that they stripped Yosef of his coat, the coat of many colors that was on him;";
vul[23] = "confestim igitur ut pervenit ad fratres nudaverunt eum tunica talari et polymita";
kjv[24] = "These [are] the generations of Jacob. Joseph, [being] seventeen years old, was feeding the flock with his brethren; and the lad [was] with the sons of Bilhah, and with the sons of Zilpah, his father\'s wives: and Joseph brought unto his father their evil report.";
rsv[24] = "and they took him and cast him into a pit. The pit was empty, there was no water in it.";
asv[24] = "and they took him, and cast him into the pit: and the pit was empty, there was no water in it.";
yng[24] = "and take him and cast him into the pit, and the pit [is] empty, there is no water in it.";
dby[24] = "and they took him and cast him into the pit; now the pit was empty -- there was no water in it.";
web[24] = "And they took him, and cast him into a pit: and the pit [was] empty; [there was] no water in it.";
hnv[24] = "and they took him, and threw him into the pit. The pit was empty. There was no water in it.";
vul[24] = "miseruntque in cisternam quae non habebat aquam";
kjv[25] = "Now Israel loved Joseph more than all his children, because he [was] the son of his old age: and he made him a coat of [many] colours.";
rsv[25] = "Then they sat down to eat; and looking up they saw a caravan of Ish\'maelites coming from Gilead, with their camels bearing gum, balm, and myrrh, on their way to carry it down to Egypt.";
asv[25] = "And they sat down to eat bread: and they lifted up their eyes and looked, and, behold, a caravan of Ishmaelites was coming from Gilead, with their camels bearing spicery and balm and myrrh, going to carry it down to Egypt.";
yng[25] = "And they sit down to eat bread, and they lift up their eyes, and look, and lo, a company of Ishmaelites coming from Gilead, and their camels bearing spices, and balm, and myrrh, going to take [them] down to Egypt.";
dby[25] = "And they sat down to eat bread; and they lifted up their eyes and looked, and behold, a caravan of Ishmaelites came from Gilead; and their camels bore tragacanth, and balsam, and ladanum -- going to carry [it] down to Egypt.";
web[25] = "And they sat down to eat bread: and they lifted up their eyes and looked, and behold, a company of Ishmaelites came from Gilead, with their camels bearing spicery, and balm, and myrrh, going to carry [them] down to Egypt.";
hnv[25] = "They sat down to eat bread, and they lifted up their eyes and looked, and saw a caravan of Yishme`elim was coming from Gil`ad, with their camels bearing spices and balm and myrrh, going to carry it down to Mitzrayim.";
vul[25] = "et sedentes ut comederent panem viderunt viatores Ismahelitas venire de Galaad et camelos eorum portare aromata et resinam et stacten in Aegyptum";
kjv[26] = "And when his brethren saw that their father loved him more than all his brethren, they hated him, and could not speak peaceably unto him.";
rsv[26] = "Then Judah said to his brothers, &quot;What profit is it if we slay our brother and conceal his blood?";
asv[26] = "And Judah said unto his brethren, What profit is it if we slay our brother and conceal his blood?";
yng[26] = "And Judah saith unto his brethren, `What gain when we slay our brother, and have concealed his blood?";
dby[26] = "And Judah said to his brethren, What profit is it that we kill our brother and secrete his blood?";
web[26] = "And Judah said to his brethren, What profit [is it] if we slay our brother, and conceal his blood.";
hnv[26] = "Yehudah said to his brothers, &quot;What profit is it if we kill our brother and conceal his blood?";
vul[26] = "dixit ergo Iudas fratribus suis quid nobis prodest si occiderimus fratrem nostrum et celaverimus sanguinem ipsius";
kjv[27] = "And Joseph dreamed a dream, and he told [it] his brethren: and they hated him yet the more.";
rsv[27] = "Come, let us sell him to the Ish\'maelites, and let not our hand be upon him, for he is our brother, our own flesh.&quot; And his brothers heeded him.";
asv[27] = "Come, and let us sell him to the Ishmaelites, and let not our hand be upon him; for he is our brother, our flesh. And his brethren hearkened unto him.";
yng[27] = "Come, and we sell him to the Ishmaelites, and our hands are not on him, for he [is] our brother -- our flesh;\' and his brethren hearken.";
dby[27] = "Come and let us sell him to the Ishmaelites; but let not our hand be upon him; for he is our brother, our flesh. And his brethren hearkened [to him].";
web[27] = "Come, and let us sell him to the Ishmaelites, and let not our hand be upon him; for he [is] our brother, our flesh: and his brethren were content.";
hnv[27] = "Come, and let\'s sell him to the Yishme`elim, and not let our hand be on him; for he is our brother, our flesh.&quot; His brothers listened to him.";
vul[27] = "melius est ut vendatur Ismahelitis et manus nostrae non polluantur frater enim et caro nostra est adquieverunt fratres sermonibus eius";
kjv[28] = "And he said unto them, Hear, I pray you, this dream which I have dreamed:";
rsv[28] = "Then Mid\'ianite traders passed by; and they drew Joseph up and lifted him out of the pit, and sold him to the Ish\'maelites for twenty shekels of silver; and they took Joseph to Egypt.";
asv[28] = "And there passed by Midianites, merchantmen; and they drew and lifted up Joseph out of the pit, and sold Joseph to the Ishmaelites for twenty pieces of silver. And they brought Joseph into Egypt.";
yng[28] = "And Midianite merchantmen pass by and they draw out and bring up Joseph out of the pit, and sell Joseph to the Ishmaelites for twenty silverlings, and they bring Joseph into Egypt.";
dby[28] = "And Midianitish men, merchants, passed by; and they drew and lifted up Joseph out of the pit, and sold Joseph to the Ishmaelites for twenty silver-pieces; and they brought Joseph to Egypt.";
web[28] = "Then there passed by Midianites, merchants; and they drew and lifted Joseph out of the pit, and sold Joseph to the Ishmaelites for twenty [pieces] of silver: and they brought Joseph into Egypt.";
hnv[28] = " Midyanim who were merchants passed by, and they drew and lifted up Yosef out of the pit, and sold Yosef to the Yishme`elim for twenty pieces of silver. They brought Yosef into Mitzrayim.";
vul[28] = "et praetereuntibus Madianitis negotiatoribus extrahentes eum de cisterna vendiderunt Ismahelitis viginti argenteis qui duxerunt eum in Aegyptum";
kjv[29] = "For, behold, we [were] binding sheaves in the field, and, lo, my sheaf arose, and also stood upright; and, behold, your sheaves stood round about, and made obeisance to my sheaf.";
rsv[29] = "When Reuben returned to the pit and saw that Joseph was not in the pit, he rent his clothes";
asv[29] = "And Reuben returned unto the pit; and, behold, Joseph was not in the pit; and he rent his clothes.";
yng[29] = "And Reuben returneth unto the pit, and lo, Joseph is not in the pit, and he rendeth his garments,";
dby[29] = "And Reuben returned to the pit, and behold, Joseph [was] not in the pit; and he rent his garments,";
web[29] = "And Reuben returned to the pit; and behold, Joseph [was] not in the pit: and he rent his clothes.";
hnv[29] = "Re\'uven returned to the pit; and saw that Yosef wasn\'t in the pit; and he tore his clothes.";
vul[29] = "reversusque Ruben ad cisternam non invenit puerum";
kjv[30] = "And his brethren said to him, Shalt thou indeed reign over us? or shalt thou indeed have dominion over us? And they hated him yet the more for his dreams, and for his words.";
rsv[30] = "and returned to his brothers, and said, &quot;The lad is gone; and I, where shall I go?&quot;";
asv[30] = "And he returned unto his brethren, and said, The child is not; and I, whither shall I go?";
yng[30] = "and he returneth unto his brethren, and saith, `The lad is not, and I -- whither am I going?\'";
dby[30] = "and returned to his brethren, and said, The child is not; and I, where shall I go?";
web[30] = "And he returned to his brethren, and said, The child [is] not: and I, whither shall I go?";
hnv[30] = "He returned to his brothers, and said, &quot;The child is no more; and I, where will I go?&quot;";
vul[30] = "et scissis vestibus pergens ad fratres ait puer non conparet et ego quo ibo";
kjv[31] = "And he dreamed yet another dream, and told it his brethren, and said, Behold, I have dreamed a dream more; and, behold, the sun and the moon and the eleven stars made obeisance to me.";
rsv[31] = "Then they took Joseph\'s robe, and killed a goat, and dipped the robe in the blood;";
asv[31] = "And they took Joseph\'s coat, and killed a he-goat, and dipped the coat in the blood;";
yng[31] = "And they take the coat of Joseph, and slaughter a kid of the goats, and dip the coat in the blood,";
dby[31] = "And they took Joseph\'s vest, and slaughtered a buck of the goats, and dipped the vest in the blood;";
web[31] = "And they took Joseph\'s coat, and killed a kid of the goats, and dipped the coat in the blood:";
hnv[31] = "They took Yosef\'s coat, and killed a male goat, and dipped the coat in the blood.";
vul[31] = "tulerunt autem tunicam eius et in sanguinem hedi quem occiderant tinxerunt";
kjv[32] = "And he told [it] to his father, and to his brethren: and his father rebuked him, and said unto him, What [is] this dream that thou hast dreamed? Shall I and thy mother and thy brethren indeed come to bow down ourselves to thee to the earth?";
rsv[32] = "and they sent the long robe with sleeves and brought it to their father, and said, &quot;This we have found; see now whether it is your son\'s robe or not.&quot;";
asv[32] = "and they sent the coat of many colors, and they brought it to their father, and said, This have we found: know now whether it is thy son\'s coat or not.";
yng[32] = "and send the long coat, and they bring [it] in unto their father, and say, `This have we found; discern, we pray thee, whether it [is] thy son\'s coat or not?\'";
dby[32] = "and they sent the vest of many colours and had it carried to their father, and said, This have we found: discern now whether it is thy son\'s vest or not.";
web[32] = "And they sent the coat of [many] colors, and they brought [it] to their father; and said, This have we found: know now whether it [is] thy son\'s coat or not.";
hnv[32] = "They took the coat of many colors, and they brought it to their father, and said, &quot;We have found this. Examine it, now, whether it is your son\'s coat or not.&quot;";
vul[32] = "mittentes qui ferrent ad patrem et dicerent hanc invenimus vide utrum tunica filii tui sit an non";
kjv[33] = "And his brethren envied him; but his father observed the saying.";
rsv[33] = "And he recognized it, and said, &quot;It is my son\'s robe; a wild beast has devoured him; Joseph is without doubt torn to pieces.&quot;";
asv[33] = "And he knew it, and said, It is my son\'s coat: an evil beast hath devoured him; Joseph is without doubt torn in pieces.";
yng[33] = "And he discerneth it, and saith, `My son\'s coat! an evil beast hath devoured him; torn -- torn is Joseph!\'";
dby[33] = "And he discerned it, and said, [It is] my son\'s vest! an evil beast has devoured him: Joseph is without doubt rent in pieces!";
web[33] = "And he knew it, and said, [It is] my son\'s coat; an evil beast hath devoured him: Joseph is without doubt rent in pieces.";
hnv[33] = "He recognized it, and said, &quot;It is my son\'s coat. An evil animal has devoured him. Yosef is without doubt torn in pieces.&quot;";
vul[33] = "quam cum agnovisset pater ait tunica filii mei est fera pessima comedit eum bestia devoravit Ioseph";
kjv[34] = "And his brethren went to feed their father\'s flock in Shechem.";
rsv[34] = "Then Jacob rent his garments, and put sackcloth upon his loins, and mourned for his son many days.";
asv[34] = "And Jacob rent his garments, and put sackcloth upon his loins, and mourned for his son many days.";
yng[34] = "And Jacob rendeth his raiment, and putteth sackcloth on his loins, and becometh a mourner for his son many days,";
dby[34] = "And Jacob rent his clothes, and put sackcloth on his loins, and mourned for his son many days.";
web[34] = "And Jacob rent his clothes, and put sackcloth on his loins, and mourned for his son many days.";
hnv[34] = "Ya`akov tore his clothes, and put sackcloth on his loins, and mourned for his son many days.";
vul[34] = "scissisque vestibus indutus est cilicio lugens filium multo tempore";
kjv[35] = "And Israel said unto Joseph, Do not thy brethren feed [the flock] in Shechem? come, and I will send thee unto them. And he said to him, Here [am I].";
rsv[35] = "All his sons and all his daughters rose up to comfort him; but he refused to be comforted, and said, &quot;No, I shall go down to Sheol to my son, mourning.&quot; Thus his father wept for him.";
asv[35] = "And all his sons and all his daughters rose up to comfort him; but he refused to be comforted; and he said, For I will go down to Sheol to my son mourning. And his father wept for him.";
yng[35] = "and all his sons and all his daughters rise to comfort him, and he refuseth to comfort himself, and saith, `For -- I go down mourning unto my son, to Sheol,\' and his father weepeth for him.";
dby[35] = "And all his sons and all his daughters rose up to comfort him, but he refused to be comforted, and said, For I will go down to my son into Sheol mourning. Thus his father wept for him.";
web[35] = "And all his sons and all his daughters rose up to comfort him; but he refused to be comforted; and he said, For I will go down into the grave to my son mourning: Thus his father wept for him.";
hnv[35] = "All his sons and all his daughters rose up to comfort him; but he refused to be comforted. He said, &quot;For I will go down to She\'ol to my son mourning.&quot; His father wept for him.";
vul[35] = "congregatis autem cunctis liberis eius ut lenirent dolorem patris noluit consolationem recipere et ait descendam ad filium meum lugens in infernum et illo perseverante in fletu";
kjv[36] = "And he said to him, Go, I pray thee, see whether it be well with thy brethren, and well with the flocks; and bring me word again. So he sent him out of the vale of Hebron, and he came to Shechem.";
rsv[36] = "Meanwhile the Mid\'ianites had sold him in Egypt to Pot\'i-phar, an officer of Pharaoh, the captain of the guard.";
asv[36] = "And the Midianites sold him into Egypt unto Potiphar, an officer of Pharaoh\'s, the captain of the guard.";
yng[36] = "And the Medanites have sold him unto Egypt, to Potiphar, a eunuch of Pharaoh, head of the executioners.";
dby[36] = "And the Midianites sold him into Egypt, to Potiphar, a chamberlain of Pharaoh, the captain of the life-guard.";
web[36] = "And the Midianites sold him into Egypt to Potiphar, an officer of Pharaoh\'s, [and] captain of the guard.";
hnv[36] = "The Midyanim sold him into Mitzrayim to Potifar, an officer of Par`oh\'s, the captain of the guard.";
vul[36] = "Madianei vendiderunt Ioseph in Aegypto Putiphar eunucho Pharaonis magistro militiae";
csb[1] = "Jacob lived in the land where his father had stayed, the land of Canaan.";
csb[2] = "These are the family records of Jacob. At seventeen years of age, Joseph tended sheep with his brothers. The young man was working with the sons of Bilhah and Zilpah, his father\'s wives, and he brought a bad report about them to their father.";
csb[3] = "Now Israel loved Joseph more than his other sons because Joseph was a son born to him in his old age, and he made a robe of many colors for him.";
csb[4] = "When his brothers saw that their father loved him more than all his brothers, they hated him and could not bring themselves to speak peaceably to him.";
csb[5] = "Then Joseph had a dream. When he told it to his brothers, they hated him even more.";
csb[6] = "He said to them, &quot;Listen to this dream I had:";
csb[7] = "&quot;There we were, binding sheaves of grain in the field. Suddenly my sheaf stood up, and your sheaves gathered around it and bowed down to my sheaf.&quot;";
csb[8] = "&quot;Are you really going to reign over us? &quot; his brothers asked him. &quot;Are you really going to rule us? &quot; So they hated him even more because of his dream and what he had said.";
csb[9] = "Then he had another dream and told it to his brothers. &quot;Look,&quot; he said, &quot;I had another dream, and this time the sun, moon, and eleven stars were bowing down to me.&quot;";
csb[10] = "He told his father and brothers, and his father rebuked him. &quot;What kind of dream is this that you have had? &quot; he said. &quot;Am I and your mother and your brothers really going to come and bow down to the ground before you? &quot;";
csb[11] = "His brothers were jealous of him, but his father kept the matter in mind.";
csb[12] = "His brothers had gone to pasture their father\'s flocks at Shechem.";
csb[13] = "Israel said to Joseph, &quot;Your brothers, you know, are pasturing the flocks at Shechem. Get ready. I\'m sending you to them.&quot; &quot;I\'m ready,&quot; Joseph replied.";
csb[14] = "Then Israel said to him, &quot;Go and see how your brothers and the flocks are doing, and bring word back to me.&quot; So he sent him from the Hebron Valley, and he went to Shechem.";
csb[15] = "A man found him there, wandering in the field, and asked him, &quot;What are you looking for? &quot;";
csb[16] = "&quot;I\'m looking for my brothers,&quot; Joseph said. &quot;Can you tell me where they are pasturing their flocks? &quot;";
csb[17] = "&quot;They\'ve moved on from here,&quot; the man said. &quot;I heard them say, \'Let\'s go to Dothan.\' &quot; So Joseph set out after his brothers and found them at Dothan.";
csb[18] = "They saw him in the distance, and before he had reached them, they plotted to kill him.";
csb[19] = "They said to one another, &quot;Oh, look, here comes that dream expert!";
csb[20] = "&quot;So now, come on, let\'s kill him and throw him into one of the pits. We can say that a vicious animal ate him. Then we\'ll see what becomes of his dreams! &quot;";
csb[21] = "When Reuben heard this, he tried to save him from them. He said, &quot;Let\'s not take his life.&quot;";
csb[22] = "Reuben also said to them, &quot;Don\'t shed blood. Throw him into this pit in the wilderness, but don\'t lay a hand on him&quot; -- intending to rescue him from them and return him to his father.";
csb[23] = "When Joseph came to his brothers, they stripped off Joseph\'s robe, the robe of many colors that he had on.";
csb[24] = "Then they took him and threw him into the pit. The pit was empty, without water.";
csb[25] = "They sat down to eat a meal, and when they looked up, there was a caravan of Ishmaelites coming from Gilead. Their camels were carrying aromatic gum, balsam, and resin, going down to Egypt.";
csb[26] = "Judah said to his brothers, &quot;What do we gain if we kill our brother and cover up his blood?";
csb[27] = "&quot;Come on, let\'s sell him to the Ishmaelites and not lay a hand on him, for he is our brother, our own flesh,&quot; and his brothers agreed.";
csb[28] = "When Midianite traders passed by, his brothers pulled Joseph out of the pit and sold him for twenty pieces of silver to the Ishmaelites, who took Joseph to Egypt.";
csb[29] = "When Reuben returned to the pit and saw that Joseph was not there, he tore his clothes.";
csb[30] = "He went back to his brothers and said, &quot;The boy is gone! What am I going to do? &quot;";
csb[31] = "So they took Joseph\'s robe, slaughtered a male goat, and dipped the robe in its blood.";
csb[32] = "They sent the robe of many colors to their father and said, &quot;We found this. Examine it. Is it your son\'s robe or not? &quot;";
csb[33] = "His father recognized it. &quot;It is my son\'s robe,&quot; he said. &quot;A vicious animal has devoured him. Joseph has been torn to pieces! &quot;";
csb[34] = "Then Jacob tore his clothes, put sackcloth around his waist, and mourned for his son many days.";
csb[35] = "All his sons and daughters tried to comfort him, but he refused to be comforted. &quot;No,&quot; he said. &quot;I will go down to Sheol to my son, mourning.&quot; And his father wept for him.";
csb[36] = "Meanwhile, the Midianites sold Joseph in Egypt to Potiphar, an officer of Pharaoh and the captain of the guards.";
