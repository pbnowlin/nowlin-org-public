hnv[25] = " These are the sons of Bilhah, whom Lavan gave to Rachel, his daughter, and these she bore to Ya`akov: all the souls were seven.";
vul[25] = "hii filii Balae quam dedit Laban Raheli filiae suae et hos genuit Iacob omnes animae septem";
kjv[26] = "All the souls that came with Jacob into Egypt, which came out of his loins, besides Jacob\'s sons\' wives, all the souls [were] threescore and six;";
rsv[26] = "All the persons belonging to Jacob who came into Egypt, who were his own offspring, not including Jacob\'s sons\' wives, were sixty-six persons in all;";
asv[26] = "All the souls that came with Jacob into Egypt, that came out of his loins, besides Jacob\'s sons\' wives, all the souls were threescore and six;";
yng[26] = "All the persons who are coming to Jacob to Egypt, coming out of his thigh, apart from the wives of Jacob\'s sons, all the persons [are] sixty and six.";
dby[26] = "All the souls that came with Jacob to Egypt, that had come out of his loins, besides Jacob\'s sons\' wives: all the souls were sixty-six.";
web[26] = "All the souls that came with Jacob into Egypt, who came out of his loins, besides Jacob\'s sons\' wives, all the souls [were] sixty and six.";
hnv[26] = "All the souls who came with Ya`akov into Mitzrayim, who were his direct descendants, besides Ya`akov\'s sons\' wives, all the souls were sixty-six.";
vul[26] = "cunctae animae quae ingressae sunt cum Iacob in Aegyptum et egressae de femore illius absque uxoribus filiorum sexaginta sex";
kjv[27] = "And the sons of Joseph, which were born him in Egypt, [were] two souls: all the souls of the house of Jacob, which came into Egypt, [were] threescore and ten.";
rsv[27] = "and the sons of Joseph, who were born to him in Egypt, were two; all the persons of the house of Jacob, that came into Egypt, were seventy.";
asv[27] = "and the sons of Joseph, who were born to him in Egypt, were two souls: all the souls of the house of Jacob, that came into Egypt, were threescore and ten.";
yng[27] = "And the sons of Joseph who have been born to him in Egypt [are] two persons. All the persons of the house of Jacob who are coming into Egypt [are] seventy.";
dby[27] = "And the sons of Joseph who were born to him in Egypt, were two souls. All the souls of the house of Jacob that came to Egypt were seventy.";
web[27] = "And the sons of Joseph who were born to him in Egypt, [were] two souls: all the souls of the house of Jacob, who came into Egypt, [were] seventy.";
hnv[27] = "The sons of Yosef, who were born to him in Mitzrayim, were two souls. All the souls of the house of Ya`akov, who came into Mitzrayim, were seventy.";
vul[27] = "filii autem Ioseph qui nati sunt ei in terra Aegypti animae duae omnis anima domus Iacob quae ingressa est Aegyptum fuere septuaginta";
kjv[28] = "And he sent Judah before him unto Joseph, to direct his face unto Goshen; and they came into the land of Goshen.";
rsv[28] = "He sent Judah before him to Joseph, to appear before him in Goshen; and they came into the land of Goshen.";
asv[28] = "And he sent Judah before him unto Joseph, to show the way before him unto Goshen; and they came into the land of Goshen.";
yng[28] = "And Judah he hath sent before him unto Joseph, to direct before him to Goshen, and they come into the land of Goshen;";
dby[28] = "And he sent Judah before him to Joseph, to give notice before he came to Goshen. And they came into the land of Goshen.";
web[28] = "And he sent Judah before him to Joseph, to direct his face to Goshen; and they came into the land of Goshen.";
hnv[28] = "He sent Yehudah before him to Yosef, to show the way before him to Goshen, and they came into the land of Goshen.";
vul[28] = "misit autem Iudam ante se ad Ioseph ut nuntiaret ei et ille occurreret in Gessen";
kjv[29] = "And Joseph made ready his chariot, and went up to meet Israel his father, to Goshen, and presented himself unto him; and he fell on his neck, and wept on his neck a good while.";
rsv[29] = "Then Joseph made ready his chariot and went up to meet Israel his father in Goshen; and he presented himself to him, and fell on his neck, and wept on his neck a good while.";
asv[29] = "And Joseph made ready his chariot, and went up to meet Israel his father, to Goshen; and he presented himself unto him, and fell on his neck, and wept on his neck a good while.";
yng[29] = "and Joseph harnesseth his chariot, and goeth up to meet Israel his father, to Goshen, and appeareth unto him, and falleth on his neck, and weepeth on his neck again;";
dby[29] = "Then Joseph yoked his chariot, and went up to meet Israel his father, to Goshen, and he presented himself to him; and he fell on his neck, and wept on his neck a good while.";
web[29] = "And Joseph made ready his chariot, and went to meet Israel his father to Goshen; and presented himself to him: and he fell on his neck, and wept on his neck a good while.";
hnv[29] = "Yosef made ready his chariot, and went up to meet Yisra\'el, his father, in Goshen. He presented himself to him, and fell on his neck, and wept on his neck a good while.";
vul[29] = "quo cum pervenisset iuncto Ioseph curru suo ascendit obviam patri ad eundem locum vidensque eum inruit super collum eius et inter amplexus flevit";
kjv[30] = "And Israel said unto Joseph, Now let me die, since I have seen thy face, because thou [art] yet alive.";
rsv[30] = "Israel said to Joseph, &quot;Now let me die, since I have seen your face and know that you are still alive.&quot;";
asv[30] = "And Israel said unto Joseph, Now let me die, since I have seen thy face, that thou art yet alive.";
yng[30] = "and Israel saith unto Joseph, `Let me die this time, after my seeing thy face, for thou [art] yet alive.\'";
dby[30] = "And Israel said to Joseph, Now let me die, after I have seen thy face, since thou still livest.";
web[30] = "And Israel said to Joseph, Now let me die, since I have seen thy face, because thou [art] yet alive.";
hnv[30] = "Yisra\'el said to Yosef, &quot;Now let me die, since I have seen your face, that you are still alive.&quot;";
vul[30] = "dixitque pater ad Ioseph iam laetus moriar quia vidi faciem tuam et superstitem te relinquo";
kjv[31] = "And Joseph said unto his brethren, and unto his father\'s house, I will go up, and shew Pharaoh, and say unto him, My brethren, and my father\'s house, which [were] in the land of Canaan, are come unto me;";
rsv[31] = "Joseph said to his brothers and to his father\'s household, &quot;I will go up and tell Pharaoh, and will say to him, \'My brothers and my father\'s household, who were in the land of Canaan, have come to me;";
asv[31] = "And Joseph said unto his brethren, and unto his father\'s house, I will go up, and tell Pharaoh, and will say unto him, My brethren, and my father\'s house, who were in the land of Canaan, are come unto me;";
yng[31] = "And Joseph saith unto his brethren, and unto the house of his father, `I go up, and declare to Pharaoh, and say unto him, My brethren, and the house of my father who [are] in the land of Canaan have come in unto me;";
dby[31] = "And Joseph said to his brethren and to his father\'s house, I will go up, and tell Pharaoh, and say to him, My brethren and my father\'s house, who were in the land of Canaan, are come to me;";
web[31] = "And Joseph said to his brethren, and to his father\'s house, I will go up, and show Pharaoh, and say to him, My brethren, and my father\'s house, who [were] in the land of Canaan are come to me.";
hnv[31] = "Yosef said to his brothers, and to his father\'s house, &quot;I will go up, and speak with Par`oh, and will tell him, \'My brothers, and my father\'s house, who were in the land of Kana`an, have come to me.";
vul[31] = "et ille locutus est ad fratres et ad omnem domum patris sui ascendam et nuntiabo Pharaoni dicamque ei fratres mei et domus patris mei qui erant in terra Chanaan venerunt ad me";
kjv[32] = "And the men [are] shepherds, for their trade hath been to feed cattle; and they have brought their flocks, and their herds, and all that they have.";
rsv[32] = "and the men are shepherds, for they have been keepers of cattle; and they have brought their flocks, and their herds, and all that they have.\'";
asv[32] = "and the men are shepherds, for they have been keepers of cattle; and they have brought their flocks, and their herds, and all that they have.";
yng[32] = "and the men [are] feeders of a flock, for they have been men of cattle; and their flock, and their herd, and all that they have, they have brought.\'";
dby[32] = "and the men are shepherds, for they have been occupied with cattle; and they have brought their sheep, and their cattle, and all that they have.";
web[32] = "And the men [are] shepherds, for their employment hath been to feed cattle; and they have brought their flocks, and their herds, and all that they have.";
hnv[32] = "These men are shepherds, for they have been keepers of cattle, and they have brought their flocks, and their herds, and all that they have.\'";
vul[32] = "et sunt viri pastores ovium curamque habent alendorum gregum pecora sua et armenta et omnia quae habere potuerunt adduxerunt secum";
kjv[33] = "And it shall come to pass, when Pharaoh shall call you, and shall say, What [is] your occupation?";
rsv[33] = "When Pharaoh calls you, and says, \'What is your occupation?\'";
asv[33] = "And it shall come to pass, when Pharaoh shall call you, and shall say, What is your occupation?";
yng[33] = "`And it hath come to pass when Pharaoh calleth for you, and hath said, What [are] your works?";
dby[33] = "And it shall come to pass that when Pharaoh shall call you and say, What is your occupation?";
web[33] = "And it shall come to pass, when Pharaoh shall call you, and shall say, What [is] your occupation?";
hnv[33] = "It will happen, when Par`oh summons you, and will say, \'What is your occupation?\'";
vul[33] = "cumque vocaverit vos et dixerit quod est opus vestrum";
kjv[34] = "That ye shall say, Thy servants\' trade hath been about cattle from our youth even until now, both we, [and] also our fathers: that ye may dwell in the land of Goshen; for every shepherd [is] an abomination unto the Egyptians.";
rsv[34] = "you shall say, \'Your servants have been keepers of cattle from our youth even until now, both we and our fathers,\' in order that you may dwell in the land of Goshen; for every shepherd is an abomination to the Egyptians.&quot;";
asv[34] = "that ye shall say, Thy servants have been keepers of cattle from our youth even until now, both we, and our fathers: that ye may dwell in the land of Goshen; for every shepherd is an abomination unto the Egyptians.";
yng[34] = "that ye have said, Thy servants have been men of cattle from our youth, even until now, both we and our fathers, -- in order that ye may dwell in the land of Goshen, for the abomination of the Egyptians is every one feeding a flock.\'";
dby[34] = "then ye shall say, Thy servants are men that have been occupied with cattle from our youth even until now, both we and our fathers; in order that ye may dwell in the land of Goshen; for every shepherd is an abomination to the Egyptians.";
web[34] = "That ye shall say, The occupation of thy servants hath been about cattle from our youth even until now, both we, [and] also our fathers: that ye may dwell in the land of Goshen; for every shepherd [is] an abomination to the Egyptians.";
hnv[34] = "that you shall say, \'Your servants have been keepers of cattle from our youth even until now, both we, and our fathers:\' that you may dwell in the land of Goshen; for every shepherd is an abomination to the Mitzrim.&quot;";
vul[34] = "respondebitis viri pastores sumus servi tui ab infantia nostra usque in praesens et nos et patres nostri haec autem dicetis ut habitare possitis in terra Gessen quia detestantur Aegyptii omnes pastores ovium";
csb[1] = "Israel set out with all that he had and came to Beer-sheba, and he offered sacrifices to the God of his father Isaac.";
csb[2] = "That night God spoke to Israel in a vision: &quot;Jacob, Jacob! &quot; he said. And Jacob replied, &quot;Here I am.&quot;";
csb[3] = "God said, &quot;I am God, the God of your father. Do not be afraid to go down to Egypt, for I will make you into a great nation there.";
csb[4] = "&quot;I will go down with you to Egypt, and I will also bring you back. Joseph will close your eyes when you die.&quot;";
csb[5] = "Jacob left Beer-sheba. The sons of Israel took their father Jacob in the wagons Pharaoh had sent to carry him, along with their dependents and their wives.";
csb[6] = "They also took their cattle and possessions they had acquired in the land of Canaan. Then Jacob and all his offspring with him came to Egypt.";
csb[7] = "His sons and grandsons, his daughters and granddaughters, indeed all his offspring, he brought with him to Egypt.";
csb[8] = "These are the names of the sons of Israel who came to Egypt -- &#x2009;Jacob and his sons: Jacob\'s firstborn: Reuben.";
csb[9] = "Reuben\'s sons: Hanoch, Pallu, Hezron, and Carmi.";
csb[10] = "Simeon\'s sons: Jemuel, Jamin, Ohad, Jachin, Zohar, and Shaul, the son of a Canaanite woman.";
csb[11] = "Levi\'s sons: Gershon, Kohath, and Merari.";
csb[12] = "Judah\'s sons: Er, Onan, Shelah, Perez, and Zerah; but Er and Onan died in the land of Canaan. The sons of Perez were Hezron and Hamul.";
csb[13] = "Issachar\'s sons: Tola, Puvah, Jashub, and Shimron.";
csb[14] = "Zebulun\'s sons: Sered, Elon, and Jahleel.";
csb[15] = "These were Leah\'s sons born to Jacob in Paddan-aram, as well as his daughter Dinah. The total number of persons: thirty-three.";
csb[16] = "Gad\'s sons: Ziphion, Haggi, Shuni, Ezbon, Eri, Arodi, and Areli.";
csb[17] = "Asher\'s sons: Imnah, Ishvah, Ishvi, Beriah, and their sister Serah. Beriah\'s sons were Heber and Malchiel.";
csb[18] = "These were the sons of Zilpah -- whom Laban gave to his daughter Leah -- that she bore to Jacob: sixteen persons.";
csb[19] = "The sons of Jacob\'s wife Rachel: Joseph and Benjamin.";
csb[20] = "Manasseh and Ephraim were born to Joseph in the land of Egypt. They were born to him by Asenath daughter of Potiphera, a priest at On.";
csb[21] = "Benjamin\'s sons: Bela, Becher, Ashbel, Gera, Naaman, Ehi, Rosh, Muppim, Huppim, and Ard.";
csb[22] = "These were Rachel\'s sons who were born to Jacob: fourteen persons.";
csb[23] = "Dan\'s son: Hushim.";
csb[24] = "Naphtali\'s sons: Jahzeel, Guni, Jezer, and Shillem.";
csb[25] = "These were the sons of Bilhah, whom Laban gave to his daughter Rachel. She bore to Jacob: seven persons.";
csb[26] = "The total number of persons belonging to Jacob -- his direct descendants, not including the wives of Jacob\'s sons -- who came to Egypt: sixty-six.";
csb[27] = "And Joseph\'s sons who were born to him in Egypt: two persons. All those of Jacob\'s household who came to Egypt: seventy persons.";
csb[28] = "Now Jacob had sent Judah ahead of him to Joseph to prepare for his arrival at Goshen. When they came to the land of Goshen,";
csb[29] = "Joseph hitched the horses to his chariot and went up to Goshen to meet his father Israel. Joseph presented himself to him, threw his arms around him, and wept for a long time.";
csb[30] = "Then Israel said to Joseph, &quot;I\'m ready to die now because I have seen your face and you are still alive! &quot;";
csb[31] = "Joseph said to his brothers and to his father\'s family, &quot;I will go up and inform Pharaoh, telling him, \'My brothers and my father\'s family, who were in the land of Canaan, have come to me.";
csb[32] = "&quot;The men are shepherds; they also raise livestock. They have brought their flocks and herds and all that they have.\'";
csb[33] = "&quot;When Pharaoh addresses you and asks, \'What is your occupation? \'";
csb[34] = "&quot;you are to say, \'Your servants, both we and our fathers, have raised livestock from our youth until now.\' Then you will be allowed to settle in the land of Goshen, since all shepherds are detestable to Egyptians.&quot;";
