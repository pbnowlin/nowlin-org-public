csb[1] = "The LORD said to Abram: Go out from your land, your relatives, and your father\'s house to the land that I will show you.";
csb[2] = "I will make you into a great nation, I will bless you, I will make your name great, and you will be a blessing.";
csb[3] = "I will bless those who bless you, I will curse anyone who treats you with contempt, and all the peoples on earth will be blessed through you.";
csb[4] = "So Abram went, as the LORD had told him, and Lot went with him. Abram was seventy-five years old when he left Haran.";
csb[5] = "He took his wife Sarai, his nephew Lot, all the possessions they had accumulated, and the people they had acquired in Haran, and they set out for the land of Canaan. When they came to the land of Canaan,";
csb[6] = "Abram passed through the land to the site of Shechem, at the oak of Moreh. (At that time the Canaanites were in the land.)";
csb[7] = "The LORD appeared to Abram and said, &quot;To your offspring I will give this land.&quot; So he built an altar there to the LORD who had appeared to him.";
csb[8] = "From there he moved on to the hill country east of Bethel and pitched his tent, with Bethel on the west and Ai on the east. He built an altar to the LORD there, and he called on the name of the LORD.";
csb[9] = "Then Abram journeyed by stages to the Negev.";
csb[10] = "There was a famine in the land, so Abram went down to Egypt to stay there for a while because the famine in the land was severe.";
csb[11] = "When he was about to enter Egypt, he said to his wife Sarai, &quot;Look, I know what a beautiful woman you are.";
csb[12] = "&quot;When the Egyptians see you, they will say, \'This is his wife.\' They will kill me but let you live.";
csb[13] = "&quot;Please say you\'re my sister so it will go well for me because of you, and my life will be spared on your account.&quot;";
csb[14] = "When Abram entered Egypt, the Egyptians saw that the woman was very beautiful.";
csb[15] = "Pharaoh\'s officials saw her and praised her to Pharaoh, so the woman was taken to Pharaoh\'s household.";
csb[16] = "He treated Abram well because of her, and Abram acquired flocks and herds, male and female donkeys, male and female slaves, and camels.";
csb[17] = "But the LORD struck Pharaoh and his household with severe plagues because of Abram\'s wife Sarai.";
csb[18] = "So Pharaoh sent for Abram and said, &quot;What have you done to me? Why didn\'t you tell me she was your wife?";
csb[19] = "&quot;Why did you say, \'She\'s my sister,\' so that I took her as my wife? Now, here is your wife. Take her and go! &quot;";
csb[20] = "Then Pharaoh gave his men orders about him, and they sent him away with his wife and all he had.";
