csb[1] = "Jacob resumed his journey and went to the eastern country.";
csb[2] = "He looked and saw a well in a field. Three flocks of sheep were lying there beside it because the sheep were watered from this well. But a large stone covered the opening of the well.";
csb[3] = "The shepherds would roll the stone from the opening of the well and water the sheep when all the flocks were gathered there. Then they would return the stone to its place over the well\'s opening.";
csb[4] = "Jacob asked the men at the well, &quot;My brothers! Where are you from? &quot; &quot;We\'re from Haran,&quot; they answered.";
csb[5] = "&quot;Do you know Laban grandson of Nahor? &quot; Jacob asked them. They answered, &quot;We know him.&quot;";
csb[6] = "&quot;Is he well? &quot; Jacob asked. &quot;Yes,&quot; they said, &quot;and here is his daughter Rachel, coming with his sheep.&quot;";
csb[7] = "Then Jacob said, &quot;Look, it is still broad daylight. It\'s not time for the animals to be gathered. Water the flock, then go out and let them graze.&quot;";
csb[8] = "But they replied, &quot;We can\'t until all the flocks have been gathered and the stone is rolled from the well\'s opening. Then we will water the sheep.&quot;";
csb[9] = "While he was still speaking with them, Rachel came with her father\'s sheep, for she was a shepherdess.";
csb[10] = "As soon as Jacob saw his uncle Laban\'s daughter Rachel with his sheep, he went up and rolled the stone from the opening and watered his uncle Laban\'s sheep.";
csb[11] = "Then Jacob kissed Rachel and wept loudly.";
csb[12] = "He told Rachel that he was her father\'s relative, Rebekah\'s son. She ran and told her father.";
csb[13] = "When Laban heard the news about his sister\'s son Jacob, he ran to meet him, hugged him, and kissed him. Then he took him to his house, and Jacob told him all that had happened.";
csb[14] = "Laban said to him, &quot;Yes, you are my own flesh and blood.&quot; After Jacob had stayed with him a month,";
csb[15] = "Laban said to him, &quot;Just because you\'re my relative, should you work for me for nothing? Tell me what your wages should be.&quot;";
csb[16] = "Now Laban had two daughters: the older was named Leah, and the younger was named Rachel.";
csb[17] = "Leah had tender eyes, but Rachel was shapely and beautiful.";
csb[18] = "Jacob loved Rachel, so he answered Laban, &quot;I\'ll work for you seven years for your younger daughter Rachel.&quot;";
csb[19] = "Laban replied, &quot;Better that I give her to you than to some other man. Stay with me.&quot;";
csb[20] = "So Jacob worked seven years for Rachel, and they seemed like only a few days to him because of his love for her.";
csb[21] = "Then Jacob said to Laban, &quot;Since my time is complete, give me my wife, so I can sleep with her.&quot;";
csb[22] = "So Laban invited all the men of the place and sponsored a feast.";
csb[23] = "That evening, Laban took his daughter Leah and gave her to Jacob, and he slept with her.";
csb[24] = "And Laban gave his slave Zilpah to his daughter Leah as her slave.";
csb[25] = "When morning came, there was Leah! So he said to Laban, &quot;What is this you have done to me? Wasn\'t it for Rachel that I worked for you? Why have you deceived me? &quot;";
csb[26] = "Laban answered, &quot;It is not the custom in this place to give the younger daughter in marriage before the firstborn.";
csb[27] = "&quot;Complete this week of wedding celebration, and we will also give you this younger one in return for working yet another seven years for me.&quot;";
csb[28] = "And Jacob did just that. He finished the week of celebration, and Laban gave him his daughter Rachel as his wife.";
csb[29] = "And Laban gave his slave Bilhah to his daughter Rachel as her slave.";
csb[30] = "Jacob slept with Rachel also, and indeed, he loved Rachel more than Leah. And he worked for Laban another seven years.";
csb[31] = "When the LORD saw that Leah was unloved, he opened her womb; but Rachel was unable to conceive.";
csb[32] = "Leah conceived, gave birth to a son, and named him Reuben, for she said, &quot;The LORD has seen my affliction; surely my husband will love me now.&quot;";
csb[33] = "She conceived again, gave birth to a son, and said, &quot;The LORD heard that I am unloved and has given me this son also.&quot; So she named him Simeon.";
csb[34] = "She conceived again, gave birth to a son, and said, &quot;At last, my husband will become attached to me because I have borne three sons for him.&quot; Therefore he was named Levi.";
csb[35] = "And she conceived again, gave birth to a son, and said, &quot;This time I will praise the LORD.&quot; Therefore she named him Judah. Then Leah stopped having children.";
