csb[1] = "Now Jacob looked up and saw Esau coming toward him with four hundred men. So he divided the children among Leah, Rachel, and the two slave women.";
csb[2] = "He put the slaves and their children first, Leah and her children next, and Rachel and Joseph last.";
csb[3] = "He himself went on ahead and bowed to the ground seven times until he approached his brother.";
csb[4] = "But Esau ran to meet him, hugged him, threw his arms around him, and kissed him. Then they wept.";
csb[5] = "When Esau looked up and saw the women and children, he asked, &quot;Who are these with you? &quot; He answered, &quot;The children God has graciously given your servant.&quot;";
csb[6] = "Then the slaves and their children approached him and bowed down.";
csb[7] = "Leah and her children also approached and bowed down, and then Joseph and Rachel approached and bowed down.";
csb[8] = "So Esau said, &quot;What do you mean by this whole procession I met? &quot; &quot;To find favor with you, my lord,&quot; he answered.";
csb[9] = "&quot;I have enough, my brother,&quot; Esau replied. &quot;Keep what you have.&quot;";
csb[10] = "But Jacob said, &quot;No, please! If I have found favor with you, take this gift from me. For indeed, I have seen your face, and it is like seeing God\'s face, since you have accepted me.";
csb[11] = "&quot;Please take my present that was brought to you, because God has been gracious to me and I have everything I need.&quot; So Jacob urged him until he accepted.";
csb[12] = "Then Esau said, &quot;Let\'s move on, and I\'ll go ahead of you.&quot;";
csb[13] = "Jacob replied, &quot;My lord knows that the children are weak, and I have nursing flocks and herds. If they are driven hard for one day, the whole herd will die.";
csb[14] = "&quot;Let my lord go ahead of his servant. I will continue on slowly, at a pace suited to the livestock and the children, until I come to my lord at Seir.&quot;";
csb[15] = "Esau said, &quot;Let me leave some of my people with you.&quot; But he replied, &quot;Why do that? Please indulge me, my lord.&quot;";
csb[16] = "That day Esau started on his way back to Seir,";
csb[17] = "but Jacob went to Succoth. He built a house for himself and shelters for his livestock; that is why the place was called Succoth.";
csb[18] = "After Jacob came from Paddan-aram, he arrived safely at Shechem in the land of Canaan and camped in front of the city.";
csb[19] = "He purchased a section of the field where he had pitched his tent from the sons of Hamor, Shechem\'s father, for a hundred pieces of silver.";
csb[20] = "And he set up an altar there and called it God, the God of Israel.";
