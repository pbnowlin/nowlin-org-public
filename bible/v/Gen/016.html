csb[1] = "Abram\'s wife Sarai had not borne any children for him, but she owned an Egyptian slave named Hagar.";
csb[2] = "Sarai said to Abram, &quot;Since the LORD has prevented me from bearing children, go to my slave; perhaps through her I can build a family.&quot; And Abram agreed to what Sarai said.";
csb[3] = "So Abram\'s wife Sarai took Hagar, her Egyptian slave, and gave her to her husband Abram as a wife for him. This happened after Abram had lived in the land of Canaan ten years.";
csb[4] = "He slept with Hagar, and she became pregnant. When she saw that she was pregnant, her mistress became contemptible to her.";
csb[5] = "Then Sarai said to Abram, &quot;You are responsible for my suffering! I put my slave in your arms, and when she saw that she was pregnant, I became contemptible to her. May the LORD judge between me and you.&quot;";
csb[6] = "Abram replied to Sarai, &quot;Here, your slave is in your hands; do whatever you want with her.&quot; Then Sarai mistreated her so much that she ran away from her.";
csb[7] = "The angel of the LORD found her by a spring in the wilderness, the spring on the way to Shur.";
csb[8] = "He said, &quot;Hagar, slave of Sarai, where have you come from and where are you going? &quot; She replied, &quot;I\'m running away from my mistress Sarai.&quot;";
csb[9] = "The angel of the LORD said to her, &quot;Go back to your mistress and submit to her authority.&quot;";
csb[10] = "The angel of the LORD said to her, &quot;I will greatly multiply your offspring, and they will be too many to count.&quot;";
csb[11] = "The angel of the LORD said to her, &quot;You have conceived and will have a son. You will name him Ishmael, for the LORD has heard your cry of affliction.";
csb[12] = "&quot;This man will be like a wild donkey. His hand will be against everyone, and everyone\'s hand will be against him; he will settle near all his relatives.&quot;";
csb[13] = "So she named the LORD who spoke to her: &quot;You are El-roi,&quot; for she said, &quot;In this place, have I actually seen the one who sees me? &quot;";
csb[14] = "That is why the well is called Beer-lahai-roi. It is between Kadesh and Bered.";
csb[15] = "So Hagar gave birth to Abram\'s son, and Abram named his son (whom Hagar bore) Ishmael.";
csb[16] = "Abram was eighty-six years old when Hagar bore Ishmael to him.";
