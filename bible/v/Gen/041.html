asv[50] = "And unto Joseph were born two sons before the year of famine came, whom Asenath, the daughter of Potiphera priest of On, bare unto him.";
yng[50] = "And to Joseph were born two sons before the year of famine cometh, whom Asenath daughter of Poti-Pherah, priest of On, hath borne to him,";
dby[50] = "And to Joseph were born two sons before the year of famine came, whom Asnath the daughter of Potipherah the priest in On bore to him.";
web[50] = "And to Joseph were born two sons before the years of famine came: which Asenath the daughter of Poti-pherah priest of On bore to him.";
hnv[50] = "To Yosef were born two sons before the year of famine came, whom Asenat, the daughter of Potiphera Kohen of On, bore to him.";
vul[50] = "nati sunt autem Ioseph filii duo antequam veniret fames quos ei peperit Aseneth filia Putiphare sacerdotis Heliopoleos";
kjv[51] = "And Joseph called the name of the firstborn Manasseh: For God, [said he], hath made me forget all my toil, and all my father\'s house.";
rsv[51] = "Joseph called the name of the first-born Manas\'seh, &quot;For,&quot; he said, &quot;God has made me forget all my hardship and all my father\'s house.&quot;";
asv[51] = "And Joseph called the name of the first-born Manasseh: For, [said he], God hath made me forget all my toil, and all my father\'s house.";
yng[51] = "and Joseph calleth the name of the first-born Manasseh: `for, God hath made me to forget all my labour, and all the house of my father;\'";
dby[51] = "And Joseph called the name of the firstborn Manasseh -- For God has made me forget all my toil, and all my father\'s house.";
web[51] = "And Joseph called the name of the first-born Manasseh: For God, [said he], hath made me forget all my toil, and all my father\'s house.";
hnv[51] = "Yosef called the name of the firstborn Menashsheh, &quot;For,&quot; he said, &quot;God has made me forget all my toil, and all my father\'s house.&quot;";
vul[51] = "vocavitque nomen primogeniti Manasse dicens oblivisci me fecit Deus omnium laborum meorum et domum patris mei";
kjv[52] = "And the name of the second called he Ephraim: For God hath caused me to be fruitful in the land of my affliction.";
rsv[52] = "The name of the second he called E\'phraim, &quot;For God has made me fruitful in the land of my affliction.&quot;";
asv[52] = "And the name of the second called he Ephraim: For God hath made me fruitful in the land of my affliction.";
yng[52] = "and the name of the second he hath called Ephraim: `for, God hath caused me to be fruitful in the land of mine affliction.\'";
dby[52] = "And the name of the second he called Ephraim -- For God has caused me to be fruitful in the land of my affliction.";
web[52] = "And the name of the second called he Ephraim: for God hath caused me to be fruitful in the land of my affliction.";
hnv[52] = "The name of the second, he called Efrayim: &quot;For God has made me fruitful in the land of my affliction.&quot;";
vul[52] = "nomen quoque secundi appellavit Ephraim dicens crescere me fecit Deus in terra paupertatis meae";
kjv[53] = "And the seven years of plenteousness, that was in the land of Egypt, were ended.";
rsv[53] = "The seven years of plenty that prevailed in the land of Egypt came to an end;";
asv[53] = "And the seven years of plenty, that was in the land of Egypt, came to an end.";
yng[53] = "And the seven years of plenty are completed which have been in the land of Egypt,";
dby[53] = "And the seven years of plenty that were in the land of Egypt were ended;";
web[53] = "And the seven years of plenteousness that was in the land of Egypt, were ended.";
hnv[53] = "The seven years of plenty, that was in the land of Mitzrayim, came to an end.";
vul[53] = "igitur transactis septem annis ubertatis qui fuerant in Aegypto";
kjv[54] = "And the seven years of dearth began to come, according as Joseph had said: and the dearth was in all lands; but in all the land of Egypt there was bread.";
rsv[54] = "and the seven years of famine began to come, as Joseph had said. There was famine in all lands; but in all the land of Egypt there was bread.";
asv[54] = "And the seven years of famine began to come, according as Joseph had said: and there was famine in all lands; but in all the land of Egypt there was bread.";
yng[54] = "and the seven years of famine begin to come, as Joseph said, and famine is in all the lands, but in all the land of Egypt hath been bread;";
dby[54] = "and the seven years of the dearth began to come, according as Joseph had said. And there was dearth in all lands; but in all the land of Egypt there was bread.";
web[54] = "And the seven years of dearth began to come, according as Joseph had said: and the dearth was in all lands; but in all the land of Egypt there was bread.";
hnv[54] = "The seven years of famine began to come, just as Yosef had said. There was famine in all lands, but in all the land of Mitzrayim there was bread.";
vul[54] = "coeperunt venire septem anni inopiae quos praedixerat Ioseph et in universo orbe fames praevaluit in cuncta autem terra Aegypti erat panis";
kjv[55] = "And when all the land of Egypt was famished, the people cried to Pharaoh for bread: and Pharaoh said unto all the Egyptians, Go unto Joseph; what he saith to you, do.";
rsv[55] = "When all the land of Egypt was famished, the people cried to Pharaoh for bread; and Pharaoh said to all the Egyptians, &quot;Go to Joseph; what he says to you, do.&quot;";
asv[55] = "And when all the land of Egypt was famished, the people cried to Pharaoh for bread: and Pharaoh said unto all the Egyptians, Go unto Joseph; what he saith to you, do.";
yng[55] = "and all the land of Egypt is famished, and the people crieth unto Pharaoh for bread, and Pharaoh saith to all the Egyptians, `Go unto Joseph; that which he saith to you -- do.\'";
dby[55] = "And all the land of Egypt suffered from the dearth. And the people cried to Pharaoh for bread; and Pharaoh said to all the Egyptians, Go to Joseph: what he says to you, that do.";
web[55] = "And when all the land of Egypt was famished, the people cried to Pharaoh for bread: and Pharaoh said to all the Egyptians, Go to Joseph; what he saith to you, do.";
hnv[55] = "When all the land of Mitzrayim was famished, the people cried to Par`oh for bread, and Par`oh said to all the Mitzrim, &quot;Go to Yosef. What he says to you, do.&quot;";
vul[55] = "qua esuriente clamavit populus ad Pharaonem alimenta petens quibus ille respondit ite ad Ioseph et quicquid vobis dixerit facite";
kjv[56] = "And the famine was over all the face of the earth: And Joseph opened all the storehouses, and sold unto the Egyptians; and the famine waxed sore in the land of Egypt.";
rsv[56] = "So when the famine had spread over all the land, Joseph opened all the storehouses, and sold to the Egyptians, for the famine was severe in the land of Egypt.";
asv[56] = "And the famine was over all the face of the earth: and Joseph opened all the store-houses, and sold unto the Egyptians; and the famine was sore in the land of Egypt.";
yng[56] = "And the famine has been over all the face of the land, and Joseph openeth all [places] which have [corn] in them, and selleth to the Egyptians; and the famine is severe in the land of Egypt,";
dby[56] = "And the famine was on all the earth. And Joseph opened every place in which there was [provision], and sold grain to the Egyptians; and the famine was grievous in the land of Egypt.";
web[56] = "And the famine was over all the face of the earth; and Joseph opened all the store-houses, and sold to the Egyptians; and the famine became severe in the land of Egypt.";
hnv[56] = "The famine was over all the surface of the eretz. Yosef opened all the store-houses, and sold to the Mitzrim. The famine was severe in the land of Mitzrayim.";
vul[56] = "crescebat autem cotidie fames in omni terra aperuitque Ioseph universa horrea et vendebat Aegyptiis nam et illos oppresserat fames";
kjv[57] = "And all countries came into Egypt to Joseph for to buy [corn]; because that the famine was [so] sore in all lands.";
rsv[57] = "Moreover, all the earth came to Egypt to Joseph to buy grain, because the famine was severe over all the earth.";
asv[57] = "And all countries came into Egypt to Joseph to buy grain, because the famine was sore in all the earth.";
yng[57] = "and all the earth hath come to Egypt, to buy, unto Joseph, for the famine was severe in all the earth.";
dby[57] = "And all countries came into Egypt to Joseph, to buy [grain], because the famine was grievous on the whole earth.";
web[57] = "And all countries came into Egypt to Joseph to buy [corn]; because the famine was distressing in all lands.";
hnv[57] = "All countries came into Mitzrayim, to Yosef, to buy grain, because the famine was severe in all the eretz.";
vul[57] = "omnesque provinciae veniebant in Aegyptum ut emerent escas et malum inopiae temperarent";
csb[1] = "At the end of two years Pharaoh had a dream: He was standing beside the Nile,";
csb[2] = "when seven healthy-looking, well-fed cows came up from the Nile and began to graze among the reeds.";
csb[3] = "After them, seven other cows, sickly and thin, came up from the Nile and stood beside those cows along the bank of the Nile.";
csb[4] = "The sickly, thin cows ate the healthy, well-fed cows. Then Pharaoh woke up.";
csb[5] = "He fell asleep and dreamed a second time: Seven heads of grain, plump and good, came up on one stalk.";
csb[6] = "After them, seven heads of grain, thin and scorched by the east wind, sprouted up.";
csb[7] = "The thin heads of grain swallowed up the seven plump, full ones. Then Pharaoh woke up, and it was only a dream.";
csb[8] = "When morning came, he was troubled, so he summoned all the magicians of Egypt and all its wise men. Pharaoh told them his dreams, but no one could interpret them for him.";
csb[9] = "Then the chief cupbearer said to Pharaoh, &quot;Today I remember my faults.";
csb[10] = "&quot;Pharaoh was angry with his servants, and he put me and the chief baker in the custody of the captain of the guards.";
csb[11] = "&quot;He and I had dreams on the same night; each dream had its own meaning.";
csb[12] = "&quot;Now a young Hebrew, a slave of the captain of the guards, was with us there. We told him our dreams, he interpreted our dreams for us, and each had its own interpretation.";
csb[13] = "&quot;It turned out just the way he interpreted them to us: I was restored to my position, and the other man was hanged.&quot;";
csb[14] = "Then Pharaoh sent for Joseph, and they quickly brought him from the dungeon. He shaved, changed his clothes, and went to Pharaoh.";
csb[15] = "Pharaoh said to Joseph, &quot;I have had a dream, and no one can interpret it. But I have heard it said about you that you can hear a dream and interpret it.&quot;";
csb[16] = "&quot;I am not able to,&quot; Joseph answered Pharaoh. &quot;It is God who will give Pharaoh a favorable answer.&quot;";
csb[17] = "So Pharaoh said to Joseph: &quot;In my dream I was standing on the bank of the Nile,";
csb[18] = "&quot;when seven well-fed, healthy-looking cows came up from the Nile and grazed among the reeds.";
csb[19] = "&quot;After them, seven other cows -- weak, very sickly, and thin -- came up. I\'ve never seen such sickly ones as these in all the land of Egypt.";
csb[20] = "&quot;Then the thin, sickly cows ate the first seven well-fed cows.";
csb[21] = "&quot;When they had devoured them, you could not tell that they had devoured them; their appearance was as bad as it had been before. Then I woke up.";
csb[22] = "&quot;In my dream I also saw seven heads of grain, full and good, coming up on one stalk.";
csb[23] = "&quot;After them, seven heads of grain -- withered, thin, and scorched by the east wind -- sprouted up.";
csb[24] = "&quot;The thin heads of grain swallowed the seven good ones. I told this to the magicians, but no one can tell me what it means.&quot;";
csb[25] = "Then Joseph said to Pharaoh, &quot;Pharaoh\'s dreams mean the same thing. God has revealed to Pharaoh what he is about to do.";
csb[26] = "&quot;The seven good cows are seven years, and the seven good heads are seven years. The dreams mean the same thing.";
csb[27] = "&quot;The seven thin, sickly cows that came up after them are seven years, and the seven worthless, scorched heads of grain are seven years of famine.";
csb[28] = "&quot;It is just as I told Pharaoh: God has shown Pharaoh what he is about to do.";
csb[29] = "&quot;Seven years of great abundance are coming throughout the land of Egypt.";
csb[30] = "&quot;After them, seven years of famine will take place, and all the abundance in the land of Egypt will be forgotten. The famine will devastate the land.";
csb[31] = "&quot;The abundance in the land will not be remembered because of the famine that follows it, for the famine will be very severe.";
csb[32] = "&quot;Since the dream was given twice to Pharaoh, it means that the matter has been determined by God, and he will carry it out soon.";
csb[33] = "&quot;So now, let Pharaoh look for a discerning and wise man and set him over the land of Egypt.";
csb[34] = "&quot;Let Pharaoh do this: Let him appoint overseers over the land and take a fifth of the harvest of the land of Egypt during the seven years of abundance.";
csb[35] = "&quot;Let them gather all the excess food during these good years that are coming. Under Pharaoh\'s authority, store the grain in the cities, so they may preserve it as food.";
csb[36] = "&quot;The food will be a reserve for the land during the seven years of famine that will take place in the land of Egypt. Then the country will not be wiped out by the famine.&quot;";
csb[37] = "The proposal pleased Pharaoh and all his servants,";
csb[38] = "and he said to them, &quot;Can we find anyone like this, a man who has God\'s spirit in him? &quot;";
csb[39] = "So Pharaoh said to Joseph, &quot;Since God has made all this known to you, there is no one as discerning and wise as you are.";
csb[40] = "&quot;You will be over my house, and all my people will obey your commands. Only I, as king, will be greater than you.&quot;";
csb[41] = "Pharaoh also said to Joseph, &quot;See, I am placing you over all the land of Egypt.&quot;";
csb[42] = "Pharaoh removed his signet ring from his hand and put it on Joseph\'s hand, clothed him with fine linen garments, and placed a gold chain around his neck.";
csb[43] = "He had Joseph ride in his second chariot, and servants called out before him, &quot;Make way! &quot; So he placed him over all the land of Egypt.";
csb[44] = "Pharaoh said to Joseph, &quot;I am Pharaoh and no one will be able to raise his hand or foot in all the land of Egypt without your permission.&quot;";
csb[45] = "Pharaoh gave Joseph the name Zaphenath-paneah and gave him a wife, Asenath daughter of Potiphera, priest at On. And Joseph went throughout the land of Egypt.";
csb[46] = "Joseph was thirty years old when he entered the service of Pharaoh king of Egypt. Joseph left Pharaoh\'s presence and traveled throughout the land of Egypt.";
csb[47] = "During the seven years of abundance the land produced outstanding harvests.";
csb[48] = "Joseph gathered all the excess food in the land of Egypt during the seven years and put it in the cities. He put the food in every city from the fields around it.";
csb[49] = "So Joseph stored up grain in such abundance -- like the sand of the sea -- that he stopped measuring it because it was beyond measure.";
csb[50] = "Two sons were born to Joseph before the years of famine arrived. Asenath daughter of Potiphera, priest at On, bore them to him.";
csb[51] = "Joseph named the firstborn Manasseh and said, &quot;God has made me forget all my hardship and my whole family.&quot;";
csb[52] = "And the second son he named Ephraim and said, &quot;God has made me fruitful in the land of my affliction.&quot;";
csb[53] = "Then the seven years of abundance in the land of Egypt came to an end,";
csb[54] = "and the seven years of famine began, just as Joseph had said. There was famine in every land, but in the whole land of Egypt there was food.";
csb[55] = "When the whole land of Egypt was stricken with famine, the people cried out to Pharaoh for food. Pharaoh told all Egypt, &quot;Go to Joseph and do whatever he tells you.&quot;";
csb[56] = "Now the famine had spread across the whole region, so Joseph opened all the storehouses and sold grain to the Egyptians, for the famine was severe in the land of Egypt.";
csb[57] = "Every land came to Joseph in Egypt to buy grain, for the famine was severe in every land.";
