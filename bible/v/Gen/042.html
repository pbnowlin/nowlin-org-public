yng[25] = "And Joseph commandeth, and they fill their vessels [with] corn, also to put back the money of each unto his sack, and to give to them provision for the way; and one doth to them so.";
dby[25] = "And Joseph gave orders to fill their vessels with corn, and to restore every man\'s money into his sack, and to give them provision for the way. And thus did they to them.";
web[25] = "Then Joseph commanded to fill their sacks with corn, and to restore every man\'s money into his sack, and to give them provision for the way: and thus did he to them.";

kjv[27] = "And they knew not that Joseph understood [them]; for he spake unto them by an interpreter.";

asv[27] = "And as one of them opened his sack to give his ass provender in the lodging-place, he espied his money; and, behold, it was in the mouth of his sack.";
yng[27] = "and the one openeth his sack to give provender to his ass at a lodging-place, and he seeth his money, and lo, it [is] in the mouth of his bag,";
dby[27] = "And one of them opened his sack to give his ass food in the inn, and saw his money, and behold, it was in the mouth of his sack.";

hnv[27] = "As one of them opened his sack to give his donkey food in the lodging-place, he saw his money. Behold, it was in the mouth of his sack.";

kjv[28] = "And he turned himself about from them, and wept; and returned to them again, and communed with them, and took from them Simeon, and bound him before their eyes.";
rsv[28] = "and he said to his brothers, &quot;My money has been put back; here it is in the mouth of my sack!&quot; At this their hearts failed them, and they turned trembling to one another, saying, &quot;What is this that God has done to us?&quot;";
asv[28] = "And he said unto his brethren, My money is restored; and, lo, it is even in my sack: and their heart failed them, and they turned trembling one to another, saying, What is this that God hath done unto us?";
yng[28] = "and he saith unto his brethren, `My money hath been put back, and also, lo, in my bag:\' and their heart goeth out, and they tremble, one to another saying, `What [is] this God hath done to us!\'";

web[28] = "And he said to his brethren, My money is restored; and see [it is] even in my sack: and their heart failed [them], and they were afraid, saying one to another, What [is] this [that] God hath done to us?";

rsv[34] = "Bring your youngest brother to me; then I shall know that you are not spies but honest men, and I will deliver to you your brother, and you shall trade in the land.\'&quot;";

dby[34] = "and bring your youngest brother to me, and I shall know that ye are not spies, but are honest. Your brother will I give up to you; and ye may trade in the land.";
web[34] = "And bring your youngest brother to me: then shall I know that ye [are] no spies, but [that] ye [are] true [men]: then will I deliver to you your brother, and ye shall traffick in the land.";

kjv[35] = "And we said unto him, We [are] true [men]; we are no spies:";

dby[35] = "And it came to pass as they emptied their sacks, that behold, every man had his bundle of money in his sack; and they saw their bundles of money, they and their father, and were afraid.";
web[35] = "And it came to pass as they emptied their sacks, that behold, every man\'s bundle of money [was] in his sack; and when they and their father saw the bundles of money, they were afraid.";
hnv[35] = "It happened as they emptied their sacks, that behold, every man\'s bundle of money was in his sack. When they and their father saw their bundles of money, they were afraid.";

kjv[36] = "We [be] twelve brethren, sons of our father; one [is] not, and the youngest [is] this day with our father in the land of Canaan.";
rsv[36] = "And Jacob their father said to them, &quot;You have bereaved me of my children: Joseph is no more, and Simeon is no more, and now you would take Benjamin; all this has come upon me.&quot;";
asv[36] = "And Jacob their father said unto them, Me have ye bereaved of my children: Joseph is not, and Simeon is not, and ye will take Benjamin away: all these things are against me.";
yng[36] = "and Jacob their father saith unto them, `Me ye have bereaved; Joseph is not, and Simeon is not, and Benjamin ye take -- against me have been all these.\'";
dby[36] = "And Jacob their father said to them, Ye have bereaved me of children: Joseph is not, and Simeon is not, and ye will take Benjamin! All these things are against me.";
web[36] = "And Jacob their father said to them, Me have ye bereaved: Joseph [is] not, and Simeon [is] not, and ye will take Benjamin [away]: all these things are against me.";
hnv[36] = "Ya`akov, their father, said to them, &quot;You have bereaved me of my children! Yosef is no more, Shim`on is no more, and you want to take Binyamin away. All these things are against me.&quot;";
vul[36] = "dixit pater Iacob absque liberis me esse fecistis Ioseph non est super Symeon tenetur in vinculis Beniamin auferetis in me haec mala omnia reciderunt";
kjv[37] = "And the man, the lord of the country, said unto us, Hereby shall I know that ye [are] true [men]; leave one of your brethren [here] with me, and take [food for] the famine of your households, and be gone:";
rsv[37] = "Then Reuben said to his father, &quot;Slay my two sons if I do not bring him back to you; put him in my hands, and I will bring him back to you.&quot;";
asv[37] = "And Reuben spake unto his father, saying, Slay my two sons, if I bring him not to thee: deliver him into my hand, and I will bring him to thee again.";
yng[37] = "And Reuben speaketh unto his father, saying, `My two sons thou dost put to death, if I bring him not in unto thee; give him into my hand, and I -- I bring him back unto thee;\'";
dby[37] = "And Reuben spoke to his father, saying, Slay my two sons if I bring him not back to thee: give him into my hand, and I will bring him to thee again.";
web[37] = "And Reuben spoke to his father, saying, Slay my two sons, if I bring him not to thee: deliver him into my hand, and I will bring him to thee again.";
hnv[37] = "Re\'uven spoke to his father, saying, &quot;Kill my two sons, if I don\'t bring him to you. Deliver him into my hand, and I will bring him to you again.&quot;";
vul[37] = "cui respondit Ruben duos filios meos interfice si non reduxero illum tibi trade in manu mea et ego eum restituam";
kjv[38] = "And bring your youngest brother unto me: then shall I know that ye [are] no spies, but [that] ye [are] true [men: so] will I deliver you your brother, and ye shall traffick in the land.";
rsv[38] = "But he said, &quot;My son shall not go down with you, for his brother is dead, and he only is left. If harm should befall him on the journey that you are to make, you would bring down my gray hairs with sorrow to Sheol.&quot;";
asv[38] = "And he said, My son shall not go down with you; for his brother is dead, and he only is left: if harm befall him by the way in which ye go, then will ye bring down my gray hairs with sorrow to Sheol.";
yng[38] = "and he saith, `My son doth not go down with you, for his brother [is] dead, and he by himself is left; when mischief hath met him in the way in which ye go, then ye have brought down my grey hairs in sorrow to sheol.\'";
dby[38] = "But he said, My son shall not go down with you, for his brother is dead, and he alone is left; and if mischief should befall him by the way in which ye go, then would ye bring down my grey hairs with sorrow to Sheol.";
web[38] = "And he said, My son shall not go down with you; for his brother is dead, and he is left alone: if mischief shall befall him by the way in which ye go, then will ye bring down my gray hairs with sorrow to the grave.";
hnv[38] = "He said, &quot;My son shall not go down with you; for his brother is dead, and he only is left. If harm happens to him by the way in which you go, then you will bring down my gray hairs with sorrow to She\'ol.&quot;";
vul[38] = "at ille non descendet inquit filius meus vobiscum frater eius mortuus est ipse solus remansit si quid ei adversi acciderit in terra ad quam pergitis deducetis canos meos cum dolore ad inferos";
csb[1] = "When Jacob learned that there was grain in Egypt, he said to his sons, &quot;Why do you keep looking at each other?";
csb[2] = "&quot;Listen,&quot; he went on, &quot;I have heard there is grain in Egypt. Go down there and buy some for us so that we will live and not die.&quot;";
csb[3] = "So ten of Joseph\'s brothers went down to buy grain from Egypt.";
csb[4] = "But Jacob did not send Joseph\'s brother Benjamin with his brothers, for he thought, &quot;Something might happen to him.&quot;";
csb[5] = "The sons of Israel were among those who came to buy grain, for the famine was in the land of Canaan.";
csb[6] = "Joseph was in charge of the country; he sold grain to all its people. His brothers came and bowed down before him with their faces to the ground.";
csb[7] = "When Joseph saw his brothers, he recognized them, but he treated them like strangers and spoke harshly to them. &quot;Where do you come from? &quot; he asked. &quot;From the land of Canaan to buy food,&quot; they replied.";
csb[8] = "Although Joseph recognized his brothers, they did not recognize him.";
csb[9] = "Joseph remembered his dreams about them and said to them, &quot;You are spies. You have come to see the weakness of the land.&quot;";
csb[10] = "&quot;No, my lord. Your servants have come to buy food,&quot; they said.";
csb[11] = "&quot;We are all sons of one man. We are honest; your servants are not spies.&quot;";
csb[12] = "&quot;No,&quot; he said to them. &quot;You have come to see the weakness of the land.&quot;";
csb[13] = "But they replied, &quot;We, your servants, were twelve brothers, the sons of one man in the land of Canaan. The youngest is now with our father, and one is no longer living.&quot;";
csb[14] = "Then Joseph said to them, &quot;I have spoken: \'You are spies! \'";
csb[15] = "&quot;This is how you will be tested: As surely as Pharaoh lives, you will not leave this place unless your youngest brother comes here.";
csb[16] = "&quot;Send one from among you to get your brother. The rest of you will be imprisoned so that your words can be tested to see if they are true. If they are not, then as surely as Pharaoh lives, you are spies! &quot;";
csb[17] = "So Joseph imprisoned them together for three days.";
csb[18] = "On the third day Joseph said to them, &quot;I fear God -- do this and you will live.";
csb[19] = "&quot;If you are honest, let one of you be confined to the guardhouse, while the rest of you go and take grain to relieve the hunger of your households.";
csb[20] = "&quot;Bring your youngest brother to me so that your words can be confirmed; then you won\'t die.&quot; And they consented to this.";
csb[21] = "Then they said to each other, &quot;Obviously, we are being punished for what we did to our brother. We saw his deep distress when he pleaded with us, but we would not listen. That is why this trouble has come to us.&quot;";
csb[22] = "But Reuben replied: &quot;Didn\'t I tell you not to harm the boy? But you wouldn\'t listen. Now we must account for his blood! &quot;";
csb[23] = "They did not realize that Joseph understood them, since there was an interpreter between them.";
csb[24] = "He turned away from them and wept. When he turned back and spoke to them, he took Simeon from them and had him bound before their eyes.";
csb[25] = "Joseph then gave orders to fill their containers with grain, return each man\'s silver to his sack, and give them provisions for their journey. This order was carried out.";
csb[26] = "They loaded the grain on their donkeys and left there.";
csb[27] = "At the place where they lodged for the night, one of them opened his sack to get feed for his donkey, and he saw his silver there at the top of his bag.";
csb[28] = "He said to his brothers, &quot;My silver has been returned! It\'s here in my bag.&quot; Their hearts sank. Trembling, they turned to one another and said, &quot;What is this that God has done to us? &quot;";
csb[29] = "When they reached their father Jacob in the land of Canaan, they told him all that had happened to them:";
csb[30] = "&quot;The man who is the lord of the country spoke harshly to us and accused us of spying on the country.";
csb[31] = "&quot;But we told him: We are honest and not spies.";
csb[32] = "&quot;We were twelve brothers, sons of the same father. One is no longer living, and the youngest is now with our father in the land of Canaan.";
csb[33] = "&quot;The man who is the lord of the country said to us, \'This is how I will know if you are honest: Leave one brother with me, take food to relieve the hunger of your households, and go.";
csb[34] = "&quot;Bring back your youngest brother to me, and I will know that you are not spies but honest men. I will then give your brother back to you, and you can trade in the country.\' &quot;";
csb[35] = "As they began emptying their sacks, there in each man\'s sack was his bag of silver! When they and their father saw their bags of silver, they were afraid.";
csb[36] = "Their father Jacob said to them, &quot;It\'s me that you make childless. Joseph is gone, and Simeon is gone. Now you want to take Benjamin. Everything happens to me! &quot;";
csb[37] = "Then Reuben said to his father, &quot;You can kill my two sons if I don\'t bring him back to you. Put him in my care, and I will return him to you.&quot;";
csb[38] = "But Jacob answered, &quot;My son will not go down with you, for his brother is dead and he alone is left. If anything happens to him on your journey, you will bring my gray hairs down to Sheol in sorrow.&quot;";
</script>
