csb[1] = "From there Abraham traveled to the region of the Negev and settled between Kadesh and Shur. While he was staying in Gerar,";
csb[2] = "Abraham said about his wife Sarah, &quot;She is my sister.&quot; So King Abimelech of Gerar had Sarah brought to him.";
csb[3] = "But God came to Abimelech in a dream by night and said to him, &quot;You are about to die because of the woman you have taken, for she is a married woman.&quot;";
csb[4] = "Now Abimelech had not approached her, so he said, &quot;Lord, would you destroy a nation even though it is innocent?";
csb[5] = "&quot;Didn\'t he himself say to me, \'She is my sister\'? And she herself said, \'He is my brother.\' I did this with a clear conscience and clean hands.&quot;";
csb[6] = "Then God said to him in the dream, &quot;Yes, I know that you did this with a clear conscience. I have also kept you from sinning against me. Therefore I have not let you touch her.";
csb[7] = "&quot;Now return the man\'s wife, for he is a prophet, and he will pray for you and you will live. But if you do not return her, know that you will certainly die, you and all who are yours.&quot;";
csb[8] = "Early in the morning Abimelech got up, called all his servants together, and personally told them all these things, and the men were terrified.";
csb[9] = "Then Abimelech called Abraham in and said to him, &quot;What have you done to us? How did I sin against you that you have brought such enormous guilt on me and on my kingdom? You have done things to me that should never be done.&quot;";
csb[10] = "Abimelech also asked Abraham, &quot;What made you do this? &quot;";
csb[11] = "Abraham replied, &quot;I thought, \'There is absolutely no fear of God in this place. They will kill me because of my wife.\'";
csb[12] = "&quot;Besides, she really is my sister, the daughter of my father though not the daughter of my mother, and she became my wife.";
csb[13] = "&quot;So when God had me wander from my father\'s house, I said to her: Show your loyalty to me wherever we go and say about me: \'He\'s my brother.\' &quot;";
csb[14] = "Then Abimelech took flocks and herds and male and female slaves, gave them to Abraham, and returned his wife Sarah to him.";
csb[15] = "Abimelech said, &quot;Look, my land is before you. Settle wherever you want.&quot;";
csb[16] = "And he said to Sarah, &quot;Look, I am giving your brother one thousand pieces of silver. It is a verification of your honor to all who are with you. You are fully vindicated.&quot;";
csb[17] = "Then Abraham prayed to God, and God healed Abimelech, his wife, and his female slaves so that they could bear children,";
csb[18] = "for the LORD had completely closed all the wombs in Abimelech\'s household on account of Sarah, Abraham\'s wife.";
