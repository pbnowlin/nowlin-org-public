yng[32] = "And Noah is a son of five hundred years, and Noah begetteth Shem, Ham, and Japheth.";
dby[32] = "And Noah was five hundred years old, and Noah begot Shem, Ham, and Japheth.";
web[32] = "And Noah was five hundred years old: and Noah begat Shem, Ham, and Japheth.";
hnv[32] = "Noach was five hundred years old, and Noach became the father of Shem, Ham, and Yefet.";
vul[32] = "Noe vero cum quingentorum esset annorum genuit Sem et Ham et Iafeth";
csb[1] = "This is the document containing the family records of Adam. On the day that God created man, he made him in the likeness of God\;";
csb[2] = "he created them male and female. When they were created, he blessed them and called them mankind.";
csb[3] = "Adam was 130 years old when he fathered a son in his likeness, according to his image, and named him Seth.";
csb[4] = "Adam lived 800 years after he fathered Seth, and he fathered other sons and daughters.";
csb[5] = "So Adam\'s life lasted 930 years; then he died.";
csb[6] = "Seth was 105 years old when he fathered Enosh.";
csb[7] = "Seth lived 807 years after he fathered Enosh, and he fathered other sons and daughters.";
csb[8] = "So Seth\'s life lasted 912 years; then he died.";
csb[9] = "Enosh was 90 years old when he fathered Kenan.";
csb[10] = "Enosh lived 815 years after he fathered Kenan, and he fathered other sons and daughters.";
csb[11] = "So Enosh\'s life lasted 905 years; then he died.";
csb[12] = "Kenan was 70 years old when he fathered Mahalalel.";
csb[13] = "Kenan lived 840 years after he fathered Mahalalel, and he fathered other sons and daughters.";
csb[14] = "So Kenan\'s life lasted 910 years; then he died.";
csb[15] = "Mahalalel was 65 years old when he fathered Jared.";
csb[16] = "Mahalalel lived 830 years after he fathered Jared, and he fathered other sons and daughters.";
csb[17] = "So Mahalalel\'s life lasted 895 years; then he died.";
csb[18] = "Jared was 162 years old when he fathered Enoch.";
csb[19] = "Jared lived 800 years after he fathered Enoch, and he fathered other sons and daughters.";
csb[20] = "So Jared\'s life lasted 962 years; then he died.";
csb[21] = "Enoch was 65 years old when he fathered Methuselah.";
csb[22] = "And after he fathered Methuselah, Enoch walked with God 300 years and fathered other sons and daughters.";
csb[23] = "So Enoch\'s life lasted 365 years.";
csb[24] = "Enoch walked with God; then he was not there because God took him.";
csb[25] = "Methuselah was 187 years old when he fathered Lamech.";
csb[26] = "Methuselah lived 782 years after he fathered Lamech, and he fathered other sons and daughters.";
csb[27] = "So Methuselah\'s life lasted 969 years; then he died.";
csb[28] = "Lamech was 182 years old when he fathered a son.";
csb[29] = "And he named him Noah, saying, &quot;This one will bring us relief from the agonizing labor of our hands, caused by the ground the LORD has cursed.&quot;";
csb[30] = "Lamech lived 595 years after he fathered Noah, and he fathered other sons and daughters.";
