csb[1] = "The two angels entered Sodom in the evening as Lot was sitting in Sodom\'s gateway. When Lot saw them, he got up to meet them. He bowed with his face to the ground";
csb[2] = "and said, &quot;My lords, turn aside to your servant\'s house, wash your feet, and spend the night. Then you can get up early and go on your way.&quot; &quot;No,&quot; they said. &quot;We would rather spend the night in the square.&quot;";
csb[3] = "But he urged them so strongly that they followed him and went into his house. He prepared a feast and baked unleavened bread for them, and they ate.";
csb[4] = "Before they went to bed, the men of the city of Sodom, both young and old, the whole population, surrounded the house.";
csb[5] = "They called out to Lot and said, &quot;Where are the men who came to you tonight? Send them out to us so we can have sex with them! &quot;";
csb[6] = "Lot went out to them at the entrance and shut the door behind him.";
csb[7] = "He said, &quot;Don\'t do this evil, my brothers.";
csb[8] = "&quot;Look, I\'ve got two daughters who haven\'t been intimate with a man. I\'ll bring them out to you, and you can do whatever you want to them. However, don\'t do anything to these men, because they have come under the protection of my roof.&quot;";
csb[9] = "&quot;Get out of the way! &quot; they said, adding, &quot;This one came here as an alien, but he\'s acting like a judge! Now we\'ll do more harm to you than to them.&quot; They put pressure on Lot and came up to break down the door.";
csb[10] = "But the angels reached out, brought Lot into the house with them, and shut the door.";
csb[11] = "They struck the men who were at the entrance of the house, both young and old, with blindness so that they were unable to find the entrance.";
csb[12] = "Then the angels said to Lot, &quot;Do you have anyone else here: a son-in-law, your sons and daughters, or anyone else in the city who belongs to you? Get them out of this place,";
csb[13] = "&quot;for we are about to destroy this place because the outcry against its people is so great before the LORD, that the LORD has sent us to destroy it.&quot;";
csb[14] = "So Lot went out and spoke to his sons-in-law, who were going to marry his daughters. &quot;Get up,&quot; he said. &quot;Get out of this place, for the LORD is about to destroy the city! &quot; But his sons-in-law thought he was joking.";
csb[15] = "At daybreak the angels urged Lot on: &quot;Get up! Take your wife and your two daughters who are here, or you will be swept away in the punishment of the city.&quot;";
csb[16] = "But he hesitated. Because of the LORD\'s compassion for him, the men grabbed his hand, his wife\'s hand, and the hands of his two daughters. They brought him out and left him outside the city.";
csb[17] = "As soon as the angels got them outside, one of them said, &quot;Run for your lives! Don\'t look back and don\'t stop anywhere on the plain! Run to the mountains, or you will be swept away! &quot;";
csb[18] = "But Lot said to them, &quot;No, my lords -- please.";
csb[19] = "&quot;Your servant has indeed found favor with you, and you have shown me great kindness by saving my life. But I can\'t run to the mountains; the disaster will overtake me, and I will die.";
csb[20] = "&quot;Look, this town is close enough for me to flee to. It is a small place. Please let me run to it -- it\'s only a small place, isn\'t it? -- so that I can survive.&quot;";
csb[21] = "And he said to him, &quot;All right, I\'ll grant your request about this matter too and will not demolish the town you mentioned.";
csb[22] = "&quot;Hurry up! Run to it, for I cannot do anything until you get there.&quot; Therefore the name of the city is Zoar.";
csb[23] = "The sun had risen over the land when Lot reached Zoar.";
csb[24] = "Then out of the sky the LORD rained on Sodom and Gomorrah burning sulfur from the LORD.";
csb[25] = "He demolished these cities, the entire plain, all the inhabitants of the cities, and whatever grew on the ground.";
csb[26] = "But Lot\'s wife looked back and became a pillar of salt.";
csb[27] = "Early in the morning Abraham went to the place where he had stood before the LORD.";
csb[28] = "He looked down toward Sodom and Gomorrah and all the land of the plain, and he saw that smoke was going up from the land like the smoke of a furnace.";
csb[29] = "So it was, when God destroyed the cities of the plain, he remembered Abraham and brought Lot out of the middle of the upheaval when he demolished the cities where Lot had lived.";
csb[30] = "Lot departed from Zoar and lived in the mountains along with his two daughters, because he was afraid to live in Zoar. Instead, he and his two daughters lived in a cave.";
csb[31] = "Then the firstborn said to the younger, &quot;Our father is old, and there is no man in the land to sleep with us as is the custom of all the land.";
csb[32] = "&quot;Come, let\'s get our father to drink wine so that we can sleep with him and preserve our father\'s line.&quot;";
csb[33] = "So they got their father to drink wine that night, and the firstborn came and slept with her father; he did not know when she lay down or when she got up.";
csb[34] = "The next day the firstborn said to the younger, &quot;Look, I slept with my father last night. Let\'s get him to drink wine again tonight so you can go sleep with him and we can preserve our father\'s line.&quot;";
csb[35] = "That night they again got their father to drink wine, and the younger went and slept with him; he did not know when she lay down or when she got up.";
csb[36] = "So both of Lot\'s daughters became pregnant by their father.";
csb[37] = "The firstborn gave birth to a son and named him Moab. He is the father of the Moabites of today.";
csb[38] = "The younger also gave birth to a son, and she named him Ben-ammi. He is the father of the Ammonites of today.";
