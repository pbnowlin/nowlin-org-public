dby[23] = "And to his father he sent this: ten asses laden with the good things of Egypt, and ten she-asses laden with corn and bread, and food for his father by the way.";

hnv[23] = "To his father, he sent after this manner: ten donkeys loaded with the good things of Mitzrayim, and ten female donkeys loaded with grain and bread and provision for his father by the way.";
vul[23] = "tantundem pecuniae et vestium mittens patri suo addens eis asinos decem qui subveherent ex omnibus divitiis Aegypti et totidem asinas triticum in itinere panesque portantes";
kjv[24] = "And he fell upon his brother Benjamin\'s neck, and wept; and Benjamin wept upon his neck.";
rsv[24] = "Then he sent his brothers away, and as they departed, he said to them, &quot;Do not quarrel on the way.&quot;";
asv[24] = "So he sent his brethren away, and they departed: and he said unto them, See that ye fall not out by the way.";
yng[24] = "And he sendeth his brethren away, and they go; and he saith unto them, `Be not angry in the way.\'";
dby[24] = "And he sent his brethren away, and they departed. And he said to them, Do not quarrel on the way.";
web[24] = "So he sent his brethren away, and they departed: and he said to them, See that ye contend not by the way.";
hnv[24] = " So he sent his brothers away, and they departed. He said to them, &quot;See that you don\'t quarrel on the way.&quot;";
vul[24] = "dimisit ergo fratres suos et proficiscentibus ait ne irascamini in via";
kjv[25] = "Moreover he kissed all his brethren, and wept upon them: and after that his brethren talked with him.";
rsv[25] = "So they went up out of Egypt, and came to the land of Canaan to their father Jacob.";
asv[25] = "And they went up out of Egypt, and came into the land of Canaan unto Jacob their father.";
yng[25] = "And they go up out of Egypt, and come in to the land of Canaan, unto Jacob their father,";
dby[25] = "And they went up out of Egypt, and came into the land of Canaan to Jacob their father.";
web[25] = "And they went up from Egypt, and came into the land of Canaan, to Jacob their father,";
hnv[25] = "They went up out of Mitzrayim, and came into the land of Kana`an, to Ya`akov their father.";
vul[25] = "qui ascendentes ex Aegypto venerunt in terram Chanaan ad patrem suum Iacob";
kjv[26] = "And the fame thereof was heard in Pharaoh\'s house, saying, Joseph\'s brethren are come: and it pleased Pharaoh well, and his servants.";
rsv[26] = "And they told him, &quot;Joseph is still alive, and he is ruler over all the land of Egypt.&quot; And his heart fainted, for he did not believe them.";
asv[26] = "And they told him, saying, Joseph is yet alive, and he is ruler over all the land of Egypt. And his heart fainted, for he believed them not.";
yng[26] = "and they declare to him, saying, `Joseph [is] yet alive,\' and that he [is] ruler over all the land of Egypt; and his heart ceaseth, for he hath not given credence to them.";
dby[26] = "And they told him, saying, Joseph is still alive, and he is governor over all the land of Egypt. And his heart fainted, for he did not believe them.";
web[26] = "And told him, saying, Joseph [is] yet alive, and he [is] governor over all the land of Egypt. And Jacob\'s heart fainted, for he believed them not.";
hnv[26] = "They told him, saying, &quot;Yosef is still alive, and he is ruler over all the land of Mitzrayim.&quot; His heart fainted, for he didn\'t believe them.";
vul[26] = "et nuntiaverunt ei dicentes Ioseph vivit et ipse dominatur in omni terra Aegypti quo audito quasi de gravi somno evigilans tamen non credebat eis";
kjv[27] = "And Pharaoh said unto Joseph, Say unto thy brethren, This do ye; lade your beasts, and go, get you unto the land of Canaan;";
rsv[27] = "But when they told him all the words of Joseph, which he had said to them, and when he saw the wagons which Joseph had sent to carry him, the spirit of their father Jacob revived;";
asv[27] = "And they told him all the words of Joseph, which he had said unto them: and when he saw the wagons which Joseph had sent to carry him, the spirit of Jacob their father revived:";
yng[27] = "And they speak unto him all the words of Joseph, which he hath spoken unto them, and he seeth the waggons which Joseph hath sent to bear him away, and live doth the spirit of Jacob their father;";
dby[27] = "And they spoke to him all the words of Joseph, which he had spoken to them. And he saw the waggons that Joseph had sent to carry him. And the spirit of Jacob their father revived.";
web[27] = "And they told him all the words of Joseph, which he had said to them: and when he saw the wagons which Joseph had sent to carry him, the spirit of Jacob their father revived:";
hnv[27] = "They told him all the words of Yosef, which he had said to them. When he saw the wagons which Yosef had sent to carry him, the spirit of Ya`akov, their father, revived.";
vul[27] = "illi contra referebant omnem ordinem rei cumque vidisset plaustra et universa quae miserat revixit spiritus eius";
kjv[28] = "And take your father and your households, and come unto me: and I will give you the good of the land of Egypt, and ye shall eat the fat of the land.";
rsv[28] = "and Israel said, &quot;It is enough; Joseph my son is still alive; I will go and see him before I die.&quot;";
asv[28] = "and Israel said, It is enough; Joseph my son is yet alive: I will go and see him before I die.";
yng[28] = "and Israel saith, `Enough! Joseph my son [is] yet alive; I go and see him before I die.\'";
dby[28] = "And Israel said, It is enough: Joseph my son is yet alive; I will go and see him before I die.";
web[28] = "And Israel said, [It is] enough; Joseph my son [is] yet alive: I will go and see him before I die.";
hnv[28] = "Yisra\'el said, &quot;It is enough. Yosef my son is still alive. I will go and see him before I die.&quot;";
vul[28] = "et ait sufficit mihi si adhuc Ioseph filius meus vivit vadam et videbo illum antequam moriar";
csb[1] = "Joseph could no longer keep his composure in front of all his attendants, so he called out, &quot;Send everyone away from me! &quot; No one was with him when he revealed his identity to his brothers.";
csb[2] = "But he wept so loudly that the Egyptians heard it, and also Pharaoh\'s household heard it.";
csb[3] = "Joseph said to his brothers, &quot;I am Joseph! Is my father still living? &quot; But they could not answer him because they were terrified in his presence.";
csb[4] = "Then Joseph said to his brothers, &quot;Please, come near me,&quot; and they came near. &quot;I am Joseph, your brother,&quot; he said, &quot;the one you sold into Egypt.";
csb[5] = "&quot;And now don\'t be grieved or angry with yourselves for selling me here, because God sent me ahead of you to preserve life.";
csb[6] = "&quot;For the famine has been in the land these two years, and there will be five more years without plowing or harvesting.";
csb[7] = "&quot;God sent me ahead of you to establish you as a remnant within the land and to keep you alive by a great deliverance.";
csb[8] = "&quot;Therefore it was not you who sent me here, but God. He has made me a father to Pharaoh, lord of his entire household, and ruler over all the land of Egypt.";
csb[9] = "&quot;Return quickly to my father and say to him, \'This is what your son Joseph says: &quot;God has made me lord of all Egypt. Come down to me without delay.";
csb[10] = "&quot;You can settle in the land of Goshen and be near me -- you, your children, and your grandchildren, your flocks, your herds, and all you have.";
csb[11] = "&quot;There I will sustain you, for there will be five more years of famine. Otherwise, you, your household, and everything you have will become destitute.&quot; \'";
csb[12] = "Look! Your eyes and the eyes of my brother Benjamin can see that I\'m the one speaking to you.";
csb[13] = "Tell my father about all my glory in Egypt and about all you have seen. And bring my father here quickly.&quot;";
csb[14] = "Then Joseph threw his arms around his brother Benjamin and wept, and Benjamin wept on his shoulder.";
csb[15] = "Joseph kissed each of his brothers as he wept, and afterward his brothers talked with him.";
csb[16] = "When the news reached Pharaoh\'s palace, &quot;Joseph\'s brothers have come,&quot; Pharaoh and his servants were pleased.";
csb[17] = "Pharaoh said to Joseph, &quot;Tell your brothers, \'Do this: Load your animals and go on back to the land of Canaan.";
csb[18] = "&quot;Get your father and your families, and come back to me. I will give you the best of the land of Egypt, and you can eat from the richness of the land.\'";
csb[19] = "&quot;You are also commanded to tell them, \'Do this: Take wagons from the land of Egypt for your dependents and your wives and bring your father here.";
csb[20] = "&quot;Do not be concerned about your belongings, for the best of all the land of Egypt is yours.\' &quot;";
csb[21] = "The sons of Israel did this. Joseph gave them wagons as Pharaoh had commanded, and he gave them provisions for the journey.";
csb[22] = "He gave each of the brothers changes of clothes, but he gave Benjamin three hundred pieces of silver and five changes of clothes.";
csb[23] = "He sent his father the following: ten donkeys carrying the best products of Egypt and ten female donkeys carrying grain, food, and provisions for his father on the journey.";
csb[24] = "So Joseph sent his brothers on their way, and as they were leaving, he said to them, &quot;Don\'t argue on the way.&quot;";
csb[25] = "So they went up from Egypt and came to their father Jacob in the land of Canaan.";
csb[26] = "They said, &quot;Joseph is still alive, and he is ruler over all the land of Egypt! &quot; Jacob was stunned, for he did not believe them.";
csb[27] = "But when they told Jacob all that Joseph had said to them, and when he saw the wagons that Joseph had sent to transport him, the spirit of their father Jacob revived.";
csb[28] = "Then Israel said, &quot;Enough! My son Joseph is still alive. I will go to see him before I die.&quot;";
