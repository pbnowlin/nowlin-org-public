csb[1] = "God blessed Noah and his sons and said to them, &quot;Be fruitful and multiply and fill the earth.";
csb[2] = "&quot;The fear and terror of you will be in every living creature on the earth, every bird of the sky, every creature that crawls on the ground, and all the fish of the sea. They are placed under your authority.";
csb[3] = "&quot;Every creature that lives and moves will be food for you; as I gave the green plants, I have given you everything.";
csb[4] = "&quot;However, you must not eat meat with its lifeblood in it.";
csb[5] = "&quot;And I will require a penalty for your lifeblood; I will require it from any animal and from any human; if someone murders a fellow human, I will require that person\'s life.";
csb[6] = "&quot;Whoever sheds human blood, by humans his blood will be shed, for God made humans in his image.";
csb[7] = "&quot;But you, be fruitful and multiply; spread out over the earth and multiply on it.&quot;";
csb[8] = "Then God said to Noah and his sons with him,";
csb[9] = "&quot;Understand that I am establishing my covenant with you and your descendants after you,";
csb[10] = "&quot;and with every living creature that is with you -- birds, livestock, and all wildlife of the earth that are with you -- all the animals of the earth that came out of the ark.";
csb[11] = "&quot;I establish my covenant with you that never again will every creature be wiped out by floodwaters; there will never again be a flood to destroy the earth.&quot;";
csb[12] = "And God said, &quot;This is the sign of the covenant I am making between me and you and every living creature with you, a covenant for all future generations:";
csb[13] = "&quot;I have placed my bow in the clouds, and it will be a sign of the covenant between me and the earth.";
csb[14] = "&quot;Whenever I form clouds over the earth and the bow appears in the clouds,";
csb[15] = "&quot;I will remember my covenant between me and you and all the living creatures: water will never again become a flood to destroy every creature.";
csb[16] = "&quot;The bow will be in the clouds, and I will look at it and remember the permanent covenant between God and all the living creatures on earth.&quot;";
csb[17] = "God said to Noah, &quot;This is the sign of the covenant that I have established between me and every creature on earth.&quot;";
csb[18] = "Noah\'s sons who came out of the ark were Shem, Ham, and Japheth. Ham was the father of Canaan.";
csb[19] = "These three were Noah\'s sons, and from them the whole earth was populated.";
csb[20] = "Noah, as a man of the soil, began by planting a vineyard.";
csb[21] = "He drank some of the wine, became drunk, and uncovered himself inside his tent.";
csb[22] = "Ham, the father of Canaan, saw his father naked and told his two brothers outside.";
csb[23] = "Then Shem and Japheth took a cloak and placed it over both their shoulders, and walking backward, they covered their father\'s nakedness. Their faces were turned away, and they did not see their father naked.";
csb[24] = "When Noah awoke from his drinking and learned what his youngest son had done to him,";
csb[25] = "he said: Canaan is cursed. He will be the lowest of slaves to his brothers.";
csb[26] = "He also said: Blessed be the LORD, the God of Shem; Let Canaan be Shem\'s slave.";
csb[27] = "Let God extend Japheth; let Japheth dwell in the tents of Shem; let Canaan be Shem\'s slave.";
csb[28] = "Now Noah lived 350 years after the flood.";
csb[29] = "So Noah\'s life lasted 950 years; then he died.";
