rsv[32] = "These are the families of the sons of Noah, according to their genealogies, in their nations; and from these the nations spread abroad on the earth after the flood.";

csb[1] = "These are the family records of Noah\'s sons, Shem, Ham, and Japheth. They also had sons after the flood.";
csb[2] = "Japheth\'s sons: Gomer, Magog, Madai, Javan, Tubal, Meshech, and Tiras.";
csb[3] = "Gomer\'s sons: Ashkenaz, Riphath, and Togarmah.";
csb[4] = "And Javan\'s sons: Elishah, Tarshish, Kittim, and Dodanim.";
csb[5] = "From these descendants, the peoples of the coasts and islands spread out into their lands according to their clans in their nations, each with its own language.";
csb[6] = "Ham\'s sons: Cush, Mizraim, Put, and Canaan.";
csb[7] = "Cush\'s sons: Seba, Havilah, Sabtah, Raamah, and Sabteca. And Raamah\'s sons: Sheba and Dedan.";
csb[8] = "Cush fathered Nimrod, who began to be powerful in the land.";
csb[9] = "He was a powerful hunter in the sight of the LORD. That is why it is said, &quot;Like Nimrod, a powerful hunter in the sight of the LORD.&quot;";
csb[10] = "His kingdom started with Babylon, Erech, Accad, and Calneh, in the land of Shinar.";
csb[11] = "From that land he went to Assyria and built Nineveh, Rehoboth-ir, Calah,";
csb[12] = "and Resen, between Nineveh and the great city Calah.";
csb[13] = "Mizraim fathered the people of Lud, Anam, Lehab, Naphtuh,";
csb[14] = "Pathrus, Casluh (the Philistines came from them), and Caphtor.";
csb[15] = "Canaan fathered Sidon his firstborn and Heth,";
csb[16] = "as well as the Jebusites, the Amorites, the Girgashites,";
csb[17] = "the Hivites, the Arkites, the Sinites,";
csb[18] = "the Arvadites, the Zemarites, and the Hamathites. Afterward the Canaanite clans scattered.";
csb[19] = "The Canaanite border went from Sidon going toward Gerar as far as Gaza, and going toward Sodom, Gomorrah, Admah, and Zeboiim as far as Lasha.";
csb[20] = "These are Ham\'s sons by their clans, according to their languages, in their lands and their nations.";
csb[21] = "And Shem, Japheth\'s older brother, also had sons. Shem was the father of all the sons of Eber.";
csb[22] = "Shem\'s sons were Elam, Asshur, Arpachshad, Lud, and Aram.";
csb[23] = "Aram\'s sons: Uz, Hul, Gether, and Mash.";
csb[24] = "Arpachshad fathered Shelah, and Shelah fathered Eber.";
csb[25] = "Eber had two sons. One was named Peleg, for during his days the earth was divided; his brother was named Joktan.";
csb[26] = "And Joktan fathered Almodad, Sheleph, Hazarmaveth, Jerah,";
csb[27] = "Hadoram, Uzal, Diklah,";
csb[28] = "Obal, Abimael, Sheba,";
csb[29] = "Ophir, Havilah, and Jobab. All these were Joktan\'s sons.";
csb[30] = "Their settlements extended from Mesha to Sephar, the eastern hill country.";
csb[31] = "These are Shem\'s sons by their clans, according to their languages, in their lands and their nations.";
csb[32] = "These are the clans of Noah\'s sons, according to their family records, in their nations. The nations on earth spread out from these after the flood.";
