asv[24] = "And Jacob was left alone; and there wrestled a man with him until the breaking of the day.";
yng[24] = "And Jacob is left alone, and one wrestleth with him till the ascending of the dawn;";
dby[24] = "And Jacob remained alone; and a man wrestled with him until the rising of the dawn.";
web[24] = "And Jacob was left alone; and there wrestled a man with him, until the breaking of the day.";

asv[25] = "And when he saw that he prevailed not against him, he touched the hollow of his thigh; and the hollow of Jacob\'s thigh was strained, as he wrestled with him.";
yng[25] = "and he seeth that he is not able for him, and he cometh against the hollow of his thigh, and the hollow of Jacob\'s thigh is disjointed in his wrestling with him;";
dby[25] = "And when he saw that he did not prevail against him, he touched the joint of his thigh; and the joint of Jacob\'s thigh was dislocated as he wrestled with him.";
web[25] = "And when he saw that he prevailed not against him, he touched the hollow of his thigh: and the hollow of Jacob\'s thigh was out of joint, as he wrestled with him.";
hnv[25] = "When he saw that he didn\'t prevail against him, he touched the hollow of his thigh, and the hollow of Ya`akov\'s thigh was strained, as he wrestled.";

kjv[26] = "And he said, Let me go, for the day breaketh. And he said, I will not let thee go, except thou bless me.";
rsv[26] = "Then he said, &quot;Let me go, for the day is breaking.&quot; But Jacob said, &quot;I will not let you go, unless you bless me.&quot;";
asv[26] = "And he said, Let me go, for the day breaketh. And he said, I will not let thee go, except thou bless me.";
yng[26] = "and he saith, `Send me away, for the dawn hath ascended:\' and he saith, `I send thee not away, except thou hast blessed me.\'";
dby[26] = "And he said, Let me go, for the dawn ariseth. And he said, I will not let thee go except thou bless me.";
web[26] = "And he said, Let me go, for the day breaketh; And he said, I will not let thee go, except thou bless me.";
hnv[26] = "The man said, &quot;Let me go, for the day breaks.&quot; Ya`akov said, &quot;I won\'t let you go, unless you bless me.&quot;";
vul[26] = "dixitque ad eum dimitte me iam enim ascendit aurora respondit non dimittam te nisi benedixeris mihi";
kjv[27] = "And he said unto him, What [is] thy name? And he said, Jacob.";
rsv[27] = "And he said to him, &quot;What is your name?&quot; And he said, &quot;Jacob.&quot;";
asv[27] = "And he said unto him, What is thy name? And he said, Jacob.";
yng[27] = "And he saith unto him, `What [is] thy name?\' and he saith, `Jacob.\'";
dby[27] = "And he said to him, What is thy name? And he said, Jacob.";
web[27] = "And he said to him, What [is] thy name? And he said, Jacob.";
hnv[27] = "He said to him, &quot;What is your name?&quot; He said, &quot;Ya`akov.&quot;";
vul[27] = "ait ergo quod nomen est tibi respondit Iacob";
kjv[28] = "And he said, Thy name shall be called no more Jacob, but Israel: for as a prince hast thou power with God and with men, and hast prevailed.";
rsv[28] = "Then he said, &quot;Your name shall no more be called Jacob, but Israel, for you have striven with God and with men, and have prevailed.&quot;";
asv[28] = "And he said, Thy name shall be called no more Jacob, but Israel: for thou hast striven with God and with men, and hast prevailed.";
yng[28] = "And he saith, `Thy name is no more called Jacob, but Israel; for thou hast been a prince with God and with men, and dost prevail.\'";
dby[28] = "And he said, Thy name shall not henceforth be called Jacob, but Israel; for thou hast wrestled with God, and with men, and hast prevailed.";
web[28] = "And he said, Thy name shall be called no more Jacob, but Israel: for as a prince hast thou power with God, and with men, and hast prevailed.";
hnv[28] = "He said, &quot;Your name will no longer be called \'Ya`akov,\' but, \'Yisra\'el,\' for you have fought with God and with men, and have prevailed.&quot;";
vul[28] = "at ille nequaquam inquit Iacob appellabitur nomen tuum sed Israhel quoniam si contra Deum fortis fuisti quanto magis contra homines praevalebis";
kjv[29] = "And Jacob asked [him], and said, Tell [me], I pray thee, thy name. And he said, Wherefore [is] it [that] thou dost ask after my name? And he blessed him there.";
rsv[29] = "Then Jacob asked him, &quot;Tell me, I pray, your name.&quot; But he said, &quot;Why is it that you ask my name?&quot; And there he blessed him.";
asv[29] = "And Jacob asked him, and said, Tell me, I pray thee, thy name. And he said, Wherefore is it that thou dost ask after my name? And he blessed him there.";
yng[29] = "And Jacob asketh, and saith, `Declare, I pray thee, thy name;\' and he saith, `Why [is] this, thou askest for My name?\' and He blesseth him there.";
dby[29] = "And Jacob asked and said, Tell [me], I pray thee, thy name. And he said, How is it that thou askest after my name? And he blessed him there.";
web[29] = "And Jacob asked [him], and said, Tell [me], I pray thee, thy name: And he said, why [is] it [that] thou dost ask after my name? and he blessed him there.";
hnv[29] = "Ya`akov asked him, &quot;Please tell me your name.&quot; He said, &quot;Why is it that you ask what my name is?&quot; He blessed him there.";
vul[29] = "interrogavit eum Iacob dic mihi quo appellaris nomine respondit cur quaeris nomen meum et benedixit ei in eodem loco";
kjv[30] = "And Jacob called the name of the place Peniel: for I have seen God face to face, and my life is preserved.";

asv[30] = "And Jacob called the name of the place Peniel: for, [said he], I have seen God face to face, and my life is preserved.";
yng[30] = "And Jacob calleth the name of the place Peniel: for `I have seen God face unto face, and my life is delivered;\'";
dby[30] = "And Jacob called the name of the place Peniel -- For I have seen God face to face, and my life has been preserved.";
web[30] = "And Jacob called the name of the place Peniel: for I have seen God face to face, and my life is preserved.";
hnv[30] = "Ya`akov called the name of the place Peni\'el: for, he said, &quot;I have seen God face to face, and my life is preserved.&quot;";
vul[30] = "vocavitque Iacob nomen loci illius Phanuhel dicens vidi Deum facie ad faciem et salva facta est anima mea";

rsv[31] = "The sun rose upon him as he passed Penu\'el, limping because of his thigh.";
asv[31] = "And the sun rose upon him as he passed over Penuel, and he limped upon his thigh.";
yng[31] = "and the sun riseth on him when he hath passed over Penuel, and he is halting on his thigh;";
dby[31] = "And as he passed over Peniel, the sun rose upon him; and he limped upon his hip.";
web[31] = "And as he passed over Penuel the sun rose upon him, and he halted upon his thigh.";
hnv[31] = "The sun rose on him as he passed over Peni\'el, and he limped because of his thigh.";
vul[31] = "ortusque est ei statim sol postquam transgressus est Phanuhel ipse vero claudicabat pede";
kjv[32] = "Therefore the children of Israel eat not [of] the sinew which shrank, which [is] upon the hollow of the thigh, unto this day: because he touched the hollow of Jacob\'s thigh in the sinew that shrank.";
rsv[32] = "Therefore to this day the Israelites do not eat the sinew of the hip which is upon the hollow of the thigh, because he touched the hollow of Jacob\'s thigh on the sinew of the hip.";
asv[32] = "Therefore the children of Israel eat not the sinew of the hip which is upon the hollow of the thigh, unto this day: because he touched the hollow of Jacob\'s thigh in the sinew of the hip.";
yng[32] = "therefore the sons of Israel do not eat the sinew which shrank, which [is] on the hollow of the thigh, unto this day, because He came against the hollow of Jacob\'s thigh, against the sinew which shrank.";
dby[32] = "Therefore the children of Israel do not eat of the sinew that is over the joint of the thigh, to this day; because he touched the joint of Jacob\'s thigh -- the sinew.";
web[32] = "Therefore the children of Israel eat not [of] the sinew which shrunk, which [is] upon the hollow of the thigh, to this day; because he touched the hollow of Jacob\'s thigh in the sinew that shrunk.";
hnv[32] = "Therefore the children of Yisra\'el don\'t eat the sinew of the hip, which is on the hollow of the thigh, to this day, because he touched the hollow of Ya`akov\'s thigh in the sinew of the hip.";
vul[32] = "quam ob causam non comedunt filii Israhel nervum qui emarcuit in femore Iacob usque in praesentem diem eo quod tetigerit nervum femoris eius et obstipuerit";
csb[1] = "Jacob went on his way, and God\'s angels met him.";
csb[2] = "When he saw them, Jacob said, &quot;This is God\'s camp.&quot; So he called that place Mahanaim.";
csb[3] = "Jacob sent messengers ahead of him to his brother Esau in the land of Seir, the territory of Edom.";
csb[4] = "He commanded them, &quot;You are to say to my lord Esau, \'This is what your servant Jacob says. I have been staying with Laban and have been delayed until now.";
csb[5] = "&quot;I have oxen, donkeys, flocks, and male and female slaves. I have sent this message to inform my lord, in order to seek your favor.\' &quot;";
csb[6] = "When the messengers returned to Jacob, they said, &quot;We went to your brother Esau; he is coming to meet you -- and he has four hundred men with him.&quot;";
csb[7] = "Jacob was greatly afraid and distressed; he divided the people with him into two camps, along with the flocks, herds, and camels.";
csb[8] = "He thought, &quot;If Esau comes to one camp and attacks it, the remaining one can escape.&quot;";
csb[9] = "Then Jacob said, &quot;God of my father Abraham and God of my father Isaac, the LORD who said to me, \'Go back to your land and to your family, and I will cause you to prosper,\'";
csb[10] = "&quot;I am unworthy of all the kindness and faithfulness you have shown your servant. Indeed, I crossed over the Jordan with my staff, and now I have become two camps.";
csb[11] = "&quot;Please rescue me from my brother Esau, for I am afraid of him; otherwise, he may come and attack me, the mothers, and their children.";
csb[12] = "&quot;You have said, \'I will cause you to prosper, and I will make your offspring like the sand of the sea, too numerous to be counted.\' &quot;";
csb[13] = "He spent the night there and took part of what he had brought with him as a gift for his brother Esau:";
csb[14] = "two hundred female goats, twenty male goats, two hundred ewes, twenty rams,";
csb[15] = "thirty milk camels with their young, forty cows, ten bulls, twenty female donkeys, and ten male donkeys.";
csb[16] = "He entrusted them to his slaves as separate herds and said to them, &quot;Go on ahead of me, and leave some distance between the herds.&quot;";
csb[17] = "And he told the first one: &quot;When my brother Esau meets you and asks, \'Who do you belong to? Where are you going? And whose animals are these ahead of you? \'";
csb[18] = "&quot;then tell him, \'They belong to your servant Jacob. They are a gift sent to my lord Esau. And look, he is behind us.\' &quot;";
csb[19] = "He also told the second one, the third, and everyone who was walking behind the animals, &quot;Say the same thing to Esau when you find him.";
csb[20] = "&quot;You are also to say, \'Look, your servant Jacob is right behind us.\' &quot; For he thought, &quot;I want to appease Esau with the gift that is going ahead of me. After that, I can face him, and perhaps he will forgive me.&quot;";
csb[21] = "So the gift was sent on ahead of him while he remained in the camp that night.";
csb[22] = "During the night Jacob got up and took his two wives, his two slave women, and his eleven sons, and crossed the ford of Jabbok.";
csb[23] = "He took them and sent them across the stream, along with all his possessions.";
csb[24] = "Jacob was left alone, and a man wrestled with him until daybreak.";
csb[25] = "When the man saw that he could not defeat him, he struck Jacob\'s hip socket as they wrestled and dislocated his hip.";
csb[26] = "Then he said to Jacob, &quot;Let me go, for it is daybreak.&quot; But Jacob said, &quot;I will not let you go unless you bless me.&quot;";
csb[27] = "&quot;What is your name? &quot; the man asked. &quot;Jacob,&quot; he replied.";
csb[28] = "&quot;Your name will no longer be Jacob,&quot; he said. &quot;It will be Israel because you have struggled with God and with men and have prevailed.&quot;";
csb[29] = "Then Jacob asked him, &quot;Please tell me your name.&quot; But he answered, &quot;Why do you ask my name? &quot; And he blessed him there.";
csb[30] = "Jacob then named the place Peniel, &quot;For I have seen God face to face,&quot; he said, &quot;yet my life has been spared.&quot;";
csb[31] = "The sun shone on him as he passed by Penuel -- limping because of his hip.";
csb[32] = "That is why, still today, the Israelites don\'t eat the thigh muscle that is at the hip socket: because he struck Jacob\'s hip socket at the thigh muscle.";
