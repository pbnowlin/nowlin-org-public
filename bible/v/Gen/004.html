vul[23] = "dixitque Lamech uxoribus suis Adae et Sellae audite vocem meam uxores Lamech auscultate sermonem meum quoniam occidi virum in vulnus meum et adulescentulum in livorem meum";
rsv[24] = "If Cain is avenged sevenfold, truly Lamech seventy-sevenfold.&quot;";
asv[24] = "If Cain shall be avenged sevenfold, Truly Lamech seventy and sevenfold. ";
yng[24] = "For sevenfold is required for Cain, And for Lamech seventy and sevenfold.\'";
dby[24] = "If Cain shall be avenged seven-fold; Lemech seventy and seven fold.";
web[24] = "If Cain shall be avenged seven-fold, truly Lamech seventy and seven-fold.";
hnv[24] = "If Kayin will be avenged seven times, Truly Lamekh seventy-seven times.";
vul[24] = "septuplum ultio dabitur de Cain de Lamech vero septuagies septies";
rsv[25] = "And Adam knew his wife again, and she bore a son and called his name Seth, for she said, &quot;God has appointed for me another child instead of Abel, for Cain slew him.&quot;";
asv[25] = "And Adam knew his wife again; and she bare a son, and called his name Seth: For, [said she], God hath appointed me another seed instead of Abel; for Cain slew him.";
yng[25] = "And Adam again knoweth his wife, and she beareth a son, and calleth his name Seth, `for God hath appointed for me another seed instead of Abel:\' for Cain had slain him.";
dby[25] = "And Adam knew his wife again, and she bore a son, and called his name Seth: ... For God has appointed me another seed instead of Abel, because Cain has slain him.";
web[25] = "And Adam knew his wife again, and she bore a son, and called his name Seth: For God, [said she], hath appointed me another seed instead of Abel, whom Cain slew.";
hnv[25] = "Adam knew his wife again. She gave birth to a son, and named him Shet. For, she said, &quot;God has appointed me another child instead of Hevel, for Kayin killed him.&quot;";
vul[25] = "cognovit quoque adhuc Adam uxorem suam et peperit filium vocavitque nomen eius Seth dicens posuit mihi Deus semen aliud pro Abel quem occidit Cain";
rsv[26] = "To Seth also a son was born, and he called his name Enosh. At that time men began to call upon the name of the LORD.";
asv[26] = "And to Seth, to him also there was born a son; and he called his name Enosh. Then began men to call upon the name of Jehovah.";
yng[26] = "And to Seth, to him also a son hath been born, and he calleth his name Enos; then a beginning was made of preaching in the name of Jehovah.";
dby[26] = "And to Seth, to him also was born a son; and he called his name Enosh. Then people began to call on the name of Jehovah.";
web[26] = "And to Seth, to him also there was born a son; and he called his name Enos: then began men to call upon the name of the LORD.";
hnv[26] = "There was also born a son to Shet, and he named him Enosh. Then men began to call on the LORD\'s name.";
vul[26] = "sed et Seth natus est filius quem vocavit Enos iste coepit invocare nomen Domini";
csb[1] = "The man was intimate with his wife Eve, and she conceived and gave birth to Cain. She said, &quot;I have had a male child with the LORD\'s help.&quot;";
csb[2] = "She also gave birth to his brother Abel. Now Abel became a shepherd of flocks, but Cain worked the ground.";
csb[3] = "In the course of time Cain presented some of the land\'s produce as an offering to the LORD.";
csb[4] = "And Abel also presented an offering -- some of the firstborn of his flock and their fat portions. The LORD had regard for Abel and his offering,";
csb[5] = "but he did not have regard for Cain and his offering. Cain was furious, and he looked despondent.";
csb[6] = "Then the LORD said to Cain, &quot;Why are you furious? And why do you look despondent?";
csb[7] = "&quot;If you do what is right, won\'t you be accepted? But if you do not do what is right, sin is crouching at the door. Its desire is for you, but you must rule over it.&quot;";
csb[8] = "Cain said to his brother Abel, &quot;Let\'s go out to the field.&quot; And while they were in the field, Cain attacked his brother Abel and killed him.";
csb[9] = "Then the LORD said to Cain, &quot;Where is your brother Abel? &quot; &quot;I don\'t know,&quot; he replied. &quot;Am I my brother\'s guardian? &quot;";
csb[10] = "Then he said, &quot;What have you done? Your brother\'s blood cries out to me from the ground!";
csb[11] = "&quot;So now you are cursed, alienated from the ground that opened its mouth to receive your brother\'s blood you have shed.";
csb[12] = "&quot;If you work the ground, it will never again give you its yield. You will be a restless wanderer on the earth.&quot;";
csb[13] = "But Cain answered the LORD, &quot;My punishment is too great to bear!";
csb[14] = "&quot;Since you are banishing me today from the face of the earth, and I must hide from your presence and become a restless wanderer on the earth, whoever finds me will kill me.&quot;";
csb[15] = "Then the LORD replied to him, &quot;In that case, whoever kills Cain will suffer vengeance seven times over.&quot; And he placed a mark on Cain so that whoever found him would not kill him.";
csb[16] = "Then Cain went out from the LORD\'s presence and lived in the land of Nod, east of Eden.";
csb[17] = "Cain was intimate with his wife, and she conceived and gave birth to Enoch. Then Cain became the builder of a city, and he named the city Enoch after his son.";
csb[18] = "Irad was born to Enoch, Irad fathered Mehujael, Mehujael fathered Methushael, and Methushael fathered Lamech.";
csb[19] = "Lamech took two wives for himself, one named Adah and the other named Zillah.";
csb[20] = "Adah bore Jabal; he was the father of the nomadic herdsmen.";
csb[21] = "His brother was named Jubal; he was the father of all who play the lyre and the flute.";
csb[22] = "Zillah bore Tubal-cain, who made all kinds of bronze and iron tools. Tubal-cain\'s sister was Naamah.";
csb[23] = "Lamech said to his wives: Adah and Zillah, hear my voice; wives of Lamech, pay attention to my words. For I killed a man for wounding me, a young man for striking me.";
csb[24] = "If Cain is to be avenged seven times over, then for Lamech it will be seventy-seven times!";
csb[25] = "Adam was intimate with his wife again, and she gave birth to a son and named him Seth, for she said, &quot;God has given me another child in place of Abel, since Cain killed him.&quot;";
csb[26] = "A son was born to Seth also, and he named him Enosh. At that time people began to call on the name of the LORD.";
</script>
