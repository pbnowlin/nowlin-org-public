kjv[7] = "And the man wondering at her held his peace, to wit whether the LORD had made his journey prosperous or not.";
rsv[7] = "The LORD, the God of heaven, who took me from my father\'s house and from the land of my birth, and who spoke to me and swore to me, \'To your descendants I will give this land,\' he will send his angel before you, and you shall take a wife for my son from there.";
asv[7] = "Jehovah, the God of heaven, who took me from my father\'s house, and from the land of my nativity, and who spake unto me, and who sware unto me, saying, Unto thy seed will I give this land; he will send his angel before thee, and thou shalt take a wife for my son from thence.";
yng[7] = "Jehovah, God of the heavens, who hath taken me from the house of my father, and from the land of my birth, and who hath spoken to me, and who hath sworn to me, saying, To thy seed I give this land, He doth send His messenger before thee, and thou hast taken a wife for my son from thence;";
dby[7] = "Jehovah the God of the heavens, who took me out of my father\'s house, and out of the land of my nativity, and who has spoken to me, and who has sworn to me, saying, Unto thy seed will I give this land -- he will send his angel before thee, that thou mayest take a wife for my son thence.";
web[7] = "The LORD God of heaven, who took me from my father\'s house, and from the land of my kindred, and who spoke to me, and who swore to me, saying, To thy seed I will give this land: he will send his angel before thee, and thou shalt take a wife for my son from thence.";
hnv[7] = "The LORD, the God of heaven, who took me from my father\'s house, and from the land of my birth, who spoke to me, and who swore to me, saying, \'To your descendants I will give this land.\' He will send his angel before you, and you shall take a wife for my son from there.";
vul[7] = "Dominus Deus caeli qui tulit me de domo patris mei et de terra nativitatis meae qui locutus est mihi et iuravit dicens semini tuo dabo terram hanc ipse mittet angelum suum coram te et accipies inde uxorem filio meo";
kjv[8] = "And it came to pass, as the camels had done drinking, that the man took a golden earring of half a shekel weight, and two bracelets for her hands of ten [shekels] weight of gold;";
rsv[8] = "But if the woman is not willing to follow you, then you will be free from this oath of mine; only you must not take my son back there.&quot;";
asv[8] = "And if the woman be not willing to follow thee, then thou shalt be clear from this my oath; only thou shalt not bring my son thither again.";
yng[8] = "and if the woman be not willing to come after thee, then thou hast been acquitted from this mine oath: only my son thou dost not cause to turn back thither.\'";
dby[8] = "And if the woman be not willing to follow thee, then thou shalt be quit of this my oath: only, bring not my son thither again.";
web[8] = "And if the woman shall not be willing to follow thee, then thou shalt be clear from this my oath; only bring not my son thither again.";
hnv[8] = "If the woman isn\'t willing to follow you, then you shall be clear from this my oath. Only you shall not bring my son there again.&quot;";

kjv[10] = "And she said unto him, I [am] the daughter of Bethuel the son of Milcah, which she bare unto Nahor.";

kjv[11] = "She said moreover unto him, We have both straw and provender enough, and room to lodge in.";

yng[11] = "and he causeth the camels to kneel at the outside of the city, at the well of water, at even-time, at the time of the coming out of the women who draw water.";
dby[11] = "And he made the camels kneel down outside the city by a well of water, at the time of the evening, when the women came out to draw [water].";

kjv[12] = "And the man bowed down his head, and worshipped the LORD.";

kjv[13] = "And he said, Blessed [be] the LORD God of my master Abraham, who hath not left destitute my master of his mercy and his truth: I [being] in the way, the LORD led me to the house of my master\'s brethren.";

dby[13] = "Behold, I stand [here] by the well of water, and the daughters of the men of the city come out to draw water.";
web[13] = "Behold, I stand [here] by the well of water; and the daughters of the men of the city come out to draw water:";
hnv[13] = "Behold, I am standing by the spring of water. The daughters of the men of the city are coming out to draw water.";

kjv[14] = "And the damsel ran, and told [them of] her mother\'s house these things.";
rsv[14] = "Let the maiden to whom I shall say, \'Pray let down your jar that I may drink,\' and who shall say, \'Drink, and I will water your camels\'--let her be the one whom thou hast appointed for thy servant Isaac. By this I shall know that thou hast shown steadfast love to my master.&quot;";
asv[14] = "and let it come to pass, that the damsel to whom I shall say, Let down thy pitcher, I pray thee, that I may drink; and she shall say, Drink, and I will give thy camels drink also: let the same be she that thou hast appointed for thy servant Isaac; and thereby shall I know that thou hast showed kindness unto my master.";
yng[14] = "and it hath been, the young person unto whom I say, Incline, I pray thee, thy pitcher, and I drink, and she hath said, Drink, and I water also thy camels) -- her Thou hast decided for Thy servant, for Isaac; and by it I know that Thou hast done kindness with my lord.\'";
dby[14] = "And let it come to pass, [that] the maiden to whom I shall say, Let down thy pitcher, I pray thee, that I may drink, and who will say, Drink, and I will give thy camels drink also, be she whom thou hast appointed for thy servant Isaac; and hereby I shall know that thou hast dealt kindly with my master.";
web[14] = "And let it come to pass, that the damsel to whom I shall say, Let down thy pitcher, I pray thee, that I may drink; and she shall say, Drink, and I will give thy camels drink also: [let the same be] she [that] thou hast appointed for thy servant Isaac; and by that shall I know that thou hast shown kindness to my master.";
hnv[14] = "Let it happen, that the young lady to whom I will say, \'Please let down your pitcher, that I may drink.\' She will say, \'Drink, and I will also give your camels a drink.\' Let the same be she who you have appointed for your servant Yitzchak. Thereby will I know that you have shown kindness to my master.&quot;";
vul[14] = "igitur puella cui ego dixero inclina hydriam tuam ut bibam et illa responderit bibe quin et camelis tuis dabo potum ipsa est quam praeparasti servo tuo Isaac et per hoc intellegam quod feceris misericordiam cum domino meo";
kjv[15] = "And Rebekah had a brother, and his name [was] Laban: and Laban ran out unto the man, unto the well.";

dby[15] = "And it came to pass before he had ended speaking, that behold, Rebecca came out, who was born to Bethuel, son of Milcah the wife of Nahor, Abraham\'s brother; and [she had] her pitcher upon her shoulder.";

kjv[16] = "And it came to pass, when he saw the earring and bracelets upon his sister\'s hands, and when he heard the words of Rebekah his sister, saying, Thus spake the man unto me; that he came unto the man; and, behold, he stood by the camels at the well.";

dby[16] = "And the maiden was very fair in countenance; a virgin, and no man had known her. And she went down to the well, and filled her pitcher, and came up.";
web[16] = "And the damsel [was] very fair to look upon, a virgin, neither had any man known her: and she went down to the well, and filled her pitcher, and came up.";
hnv[16] = " The young lady was very beautiful to look at, a virgin, neither had any man known her. She went down to the spring, filled her pitcher, and came up.";

yng[17] = "And the servant runneth to meet her, and saith, `Let me swallow, I pray thee, a little water from thy pitcher;\'";
dby[17] = "And the servant ran to meet her, and said, Let me, I pray thee, sip a little water out of thy pitcher.";
web[17] = "And the servant ran to meet her, and said, Let me, I pray thee, drink a little water from thy pitcher.";
hnv[17] = "The servant ran to meet her, and said, &quot;Please give me a drink, a little water from your pitcher.&quot;";
vul[17] = "occurritque ei servus et ait pauxillum mihi ad sorbendum praebe aquae de hydria tua";

rsv[18] = "She said, &quot;Drink, my lord&quot;; and she quickly let down her jar upon her hand, and gave him a drink.";
asv[18] = "And she said, Drink, my lord: and she hasted, and let down her pitcher upon her hand, and gave him drink.";
yng[18] = "and she saith, `Drink, my lord;\' and she hasteth, and letteth down her pitcher upon her hand, and giveth him drink.";

web[18] = "And she said, Drink, my lord. And she hasted, and let down her pitcher upon her hand, and gave him drink.";
hnv[18] = "She said, &quot;Drink, my lord.&quot; She hurried, and let down her pitcher on her hand, and gave him drink.";
vul[18] = "quae respondit bibe domine mi celeriterque deposuit hydriam super ulnam suam et dedit ei potum";

asv[19] = "And when she had done giving him drink, she said, I will draw for thy camels also, until they have done drinking.";

web[19] = "And when she had done giving him drink, she said, I will draw [water] for thy camels also, till they have done drinking.";
hnv[19] = "When she had done giving him drink, she said, &quot;I will also draw for your camels, until they have done drinking.&quot;";
vul[19] = "cumque ille bibisset adiecit quin et camelis tuis hauriam aquam donec cuncti bibant";

asv[20] = "And she hasted, and emptied her pitcher into the trough, and ran again unto the well to draw, and drew for all his camels.";

rsv[21] = "The man gazed at her in silence to learn whether the LORD had prospered his journey or not.";
asv[21] = "And the man looked stedfastly on her, holding his peace, to know whether Jehovah had made his journey prosperous or not.";
yng[21] = "And the man, wondering at her, remaineth silent, to know whether Jehovah hath made his way prosperous or not.";
dby[21] = "And the man was astonished at her, remaining silent, to know whether Jehovah had made his journey prosperous or not.";
web[21] = "And the man, wondering at her, held his peace, to know whether the LORD had made his journey prosperous, or not.";
hnv[21] = "The man looked steadfastly at her, holding his shalom, to know whether the LORD had made his journey prosperous or not.";
vul[21] = "ille autem contemplabatur eam tacitus scire volens utrum prosperum fecisset iter suum Dominus an non";

rsv[22] = "When the camels had done drinking, the man took a gold ring weighing a half shekel, and two bracelets for her arms weighing ten gold shekels,";

dby[23] = "and said, Whose daughter art thou? tell me, I pray thee. Is there room [in] thy father\'s house for us to lodge?";
web[23] = "And said, Whose daughter [art] thou? tell me, I pray thee: is there room [in] thy father\'s house for us to lodge in?";

web[24] = "And she said to him, I [am] the daughter of Bethuel the son of Milcah, whom she bore to Nahor.";

web[25] = "She said moreover to him, We have both straw and provender enough, and room to lodge in.";

hnv[26] = "The man bowed his head, and worshiped the LORD.";

rsv[27] = "and said, &quot;Blessed be the LORD, the God of my master Abraham, who has not forsaken his steadfast love and his faithfulness toward my master. As for me, the LORD has led me in the way to the house of my master\'s kinsmen.&quot;";

yng[27] = "and saith, `Blessed [is] Jehovah, God of my lord Abraham, who hath not left off His kindness and His truth with my lord; -- I [being] in the way, Jehovah hath led me to the house of my lord\'s brethren.\'";
dby[27] = "and said, Blessed be Jehovah, God of my master Abraham, who has not withdrawn his loving-kindness and his faithfulness from my master; I being in the way, Jehovah has led me to the house of my master\'s brethren.";

dby[28] = "And the maiden ran and told these things to her mother\'s house.";
web[28] = "And the damsel ran, and told these things to her mother\'s house.";
hnv[28] = "The young lady ran, and told her mother\'s house about these words.";

kjv[29] = "Behold, I stand by the well of water; and it shall come to pass, that when the virgin cometh forth to draw [water], and I say to her, Give me, I pray thee, a little water of thy pitcher to drink;";

kjv[30] = "And she say to me, Both drink thou, and I will also draw for thy camels: [let] the same [be] the woman whom the LORD hath appointed out for my master\'s son.";
rsv[30] = "When he saw the ring, and the bracelets on his sister\'s arms, and when he heard the words of Rebekah his sister, &quot;Thus the man spoke to me,&quot; he went to the man; and behold, he was standing by the camels at the spring.";
asv[30] = "And it came to pass, when he saw the ring, and the bracelets upon his sister\'s hands, and when he heard the words of Rebekah his sister, saying, Thus spake the man unto me; that he came unto the man; and, behold, he was standing by the camels at the fountain.";
yng[30] = "yea, it cometh to pass, when he seeth the ring, and the bracelets on the hands of his sister, and when he heareth the words of Rebekah his sister, saying, `Thus hath the man spoken unto me,\' that he cometh in unto the man, and lo, he is standing by the camels by the fountain.";
dby[30] = "And it came to pass when he saw the ring and the bracelets on his sister\'s hand, and when he heard the words of Rebecca his sister, saying, Thus spoke the man to me -- that he came to the man, and behold, he was standing by the camels, by the well.";
web[30] = "And it came to pass when he saw the ear-ring and bracelets upon his sister\'s hands, and when he heard the words of Rebekah his sister, saying, Thus spoke the man to me; that he came to the man; and behold, he stood by the camels at the well.";
hnv[30] = "It happened, when he saw the ring, and the bracelets on his sister\'s hands, and when he heard the words of Rivka his sister, saying, &quot;This is what the man said to me,&quot; that he came to the man. Behold, he was standing by the camels at the spring.";
vul[30] = "cumque vidisset inaures et armillas in manibus sororis suae et audisset cuncta verba referentis haec locutus est mihi homo venit ad virum qui stabat iuxta camelos et propter fontem aquae";
kjv[31] = "And before I had done speaking in mine heart, behold, Rebekah came forth with her pitcher on her shoulder; and she went down unto the well, and drew [water]: and I said unto her, Let me drink, I pray thee.";
rsv[31] = "He said, &quot;Come in, O blessed of the LORD; why do you stand outside? For I have prepared the house and a place for the camels.&quot;";
asv[31] = "And he said, Come in, thou blessed of Jehovah; wherefore standest thou without? for I have prepared the house, and room for the camels.";
yng[31] = "And he saith, `Come in, O blessed one of Jehovah, why standest thou without, and I -- I have prepared the house and place for the camels!\'";
dby[31] = "And he said, Come in, blessed of Jehovah! why standest thou outside? for I have prepared the house, and room for the camels.";
web[31] = "And he said, Come in, thou blessed of the LORD; why standest thou without? for I have prepared the house, and room for the camels.";
hnv[31] = "He said, &quot;Come in, you blessed of the LORD. Why do you stand outside? For I have prepared the house, and room for the camels.&quot;";

yng[32] = "And he bringeth in the man into the house, and looseth the camels, and giveth straw and provender for the camels, and water to wash his feet, and the feet of the men who [are] with him:";
dby[32] = "And the man came into the house; and he ungirded the camels, and gave the camels straw and provender, and water to wash his feet, and the feet of the men who were with him.";
web[32] = "And the man came into the house: and he ungirded his camels, and gave straw and provender for the camels, and water to wash his feet, and the men\'s feet that [were] with him.";

asv[33] = "And there was set food before him to eat: but he said, I will not eat, until I have told mine errand. And he said, Speak on.";

yng[34] = "And he saith, `I [am] Abraham\'s servant;";
dby[34] = "And he said, I am Abraham\'s servant.";
web[34] = "And he said, I [am] Abraham\'s servant.";
hnv[34] = "He said, &quot;I am Avraham\'s servant.";

dby[35] = "And Jehovah has blessed my master greatly, and he is become great; and he has given him sheep and cattle, and silver and gold, and bondmen and bondwomen, and camels and asses.";

asv[36] = "And Sarah my master\'s wife bare a son to my master when she was old: and unto him hath he given all that he hath.";

rsv[39] = "I said to my master, \'Perhaps the woman will not follow me.\'";
asv[39] = "And I said unto my master, Peradventure the woman will not follow me.";
yng[39] = "`And I say unto my lord, It may be the woman doth not come after me;";
dby[39] = "And I said to my master, Perhaps the woman will not follow me?";
web[39] = "And I said to my master, It may be the woman will not follow me.";
hnv[39] = "I said to my master, \'What if the woman will not follow me?\'";

asv[40] = "And he said unto me, Jehovah, before whom I walk, will send his angel with thee, and prosper thy way; and thou shalt take a wife for my son of my kindred, and of my father\'s house:";
yng[40] = "and he saith unto me, Jehovah, before whom I have walked habitually, doth send His messenger with thee, and hath prospered thy way, and thou hast taken a wife for my son from my family, and from the house of my father;";
dby[40] = "And he said to me, Jehovah, before whom I have walked, will send his angel with thee, and prosper thy way, that thou mayest take a wife for my son of my family, and out of my father\'s house.";

hnv[40] = "He said to me, \'The LORD, before whom I walk, will send his angel with you, and prosper your way. You shall take a wife for my son of my relatives, and of my father\'s house.";

rsv[41] = "then you will be free from my oath, when you come to my kindred; and if they will not give her to you, you will be free from my oath.\'";
asv[41] = "then shalt thou be clear from my oath, when thou comest to my kindred; and if they give her not to thee, thou shalt be clear from my oath.";
yng[41] = "then art thou acquitted from my oath, when thou comest unto my family, and if they give not [one] to thee; then thou hast been acquitted from my oath.";
dby[41] = "Then shalt thou be quit of my oath, when thou shalt have come to my family. And if they give thee not [one], thou shalt be quit of my oath.";
web[41] = "Then shalt thou be clear from [this] my oath, when thou comest to my kindred; and if they give not thee [one], thou shalt be clear from my oath.";
hnv[41] = "Then will you be clear from my oath, when you come to my relatives. If they don\'t give her to you, you shall be clear from my oath.\'";

yng[42] = "`And I come to-day unto the fountain, and I say, Jehovah, God of my lord Abraham, if Thou art, I pray Thee, making prosperous my way in which I am going --";
dby[42] = "And I came this day to the well, and said, Jehovah, God of my master Abraham, if now thou wilt prosper my way on which I go,";
web[42] = "And I came this day to the well, and said, O LORD God of my master Abraham, if now thou dost prosper my way which I go:";
hnv[42] = "I came this day to the spring, and said, \'The LORD, the God of my master Avraham, if now you do prosper my way which I go.";

rsv[43] = "behold, I am standing by the spring of water; let the young woman who comes out to draw, to whom I shall say, &quot;Pray give me a little water from your jar to drink,&quot;";
asv[43] = "behold, I am standing by the fountain of water; and let it come to pass, that the maiden that cometh forth to draw, to whom I shall say, Give me, I pray thee, a little water from thy pitcher to drink;";
yng[43] = "(lo, I am standing by the fountain of water), then the virgin who is coming out to draw, and I have said unto her, Let me drink, I pray thee, a little water from thy pitcher,";

hnv[43] = "Behold, I am standing by the spring of water. Let it happen, that the almah who comes forth to draw, to whom I will say, Give me, I pray you, a little water from your pitcher to drink.";

yng[44] = "and she hath said unto me, Both drink thou, and also for thy camels I draw -- she is the woman whom Jehovah hath decided for my lord\'s son.";
dby[44] = "and she shall say to me, Both drink thou, and I will also draw for thy camels -- that she should be the woman whom Jehovah hath appointed for my master\'s son.";
web[44] = "And she saith to me, Both drink thou, and I will also draw for thy camels: [let] the same [be] the woman whom the LORD hath pointed out for my master\'s son.";
hnv[44] = "She will tell me, &quot;Drink, and I will also draw for your camels.&quot; Let the same be the woman whom the LORD has appointed for my master\'s son.\'";
vul[44] = "et dixerit mihi et tu bibe et camelis tuis hauriam ipsa est mulier quam praeparavit Dominus filio domini mei";
kjv[45] = "And they sent away Rebekah their sister, and her nurse, and Abraham\'s servant, and his men.";
rsv[45] = "&quot;Before I had done speaking in my heart, behold, Rebekah came out with her water jar on her shoulder; and she went down to the spring, and drew. I said to her, \'Pray let me drink.\'";
asv[45] = "And before I had done speaking in my heart, behold, Rebekah came forth with her pitcher on her shoulder; and she went down unto the fountain, and drew: and I said unto her, Let me drink, I pray thee.";
yng[45] = "`Before I finish speaking unto my heart, then lo, Rebekah is coming out, and her pitcher on her shoulder, and she goeth down to the fountain, and draweth; and I say unto her, Let me drink, I pray thee,";
dby[45] = "Before I ended speaking in my heart, behold, Rebecca came forth with her pitcher on her shoulder, and went down to the well, and drew [water]; and I said to her, Give me, I pray thee, to drink.";
web[45] = "And before I had done speaking in my heart, behold, Rebekah came forth with her pitcher on her shoulder; and she went down to the well, and drew [water]: and I said to her, Let me drink, I pray thee.";
hnv[45] = "Before I had done speaking in my heart, behold, Rivka came forth with her pitcher on her shoulder. She went down to the spring, and drew. I said to her, \'Please let me drink.\'";
vul[45] = "dum haec mecum tacitus volverem apparuit Rebecca veniens cum hydria quam portabat in scapula descenditque ad fontem et hausit aquam et aio ad eam da mihi paululum bibere";
kjv[46] = "And they blessed Rebekah, and said unto her, Thou [art] our sister, be thou [the mother] of thousands of millions, and let thy seed possess the gate of those which hate them.";
rsv[46] = "She quickly let down her jar from her shoulder, and said, \'Drink, and I will give your camels drink also.\' So I drank, and she gave the camels drink also.";
asv[46] = "And she made haste, and let down her pitcher from her shoulder, and said, Drink, and I will give thy camels drink also: so I drank, and she made the camels drink also.";
yng[46] = "and she hasteth and letteth down her pitcher from off her and saith, Drink, and thy camels also I water; and I drink, and the camels also she hath watered.";
dby[46] = "And she hasted and let down her pitcher from her [shoulder], and said, Drink, and I will give thy camels drink also. And I drank; and she gave the camels drink also.";
web[46] = "And she made haste, and let down her pitcher from her [shoulder], and said, Drink, and I will give thy camels drink also: so I drank, and she made the camels drink also.";
hnv[46] = "She hurried and let down her pitcher from her shoulder, and said, \'Drink, and I will also give your camels a drink.\' So I drank, and she made the camels drink also.";
vul[46] = "quae festina deposuit hydriam de umero et dixit mihi et tu bibe et camelis tuis potum tribuam bibi et adaquavit camelos";
kjv[47] = "And Rebekah arose, and her damsels, and they rode upon the camels, and followed the man: and the servant took Rebekah, and went his way.";
rsv[47] = "Then I asked her, \'Whose daughter are you?\' She said, The daughter of Bethu\'el, Nahor\'s son, whom Milcah bore to him.\' So I put the ring on her nose, and the bracelets on her arms.";
asv[47] = "And I asked her, and said, Whose daughter art thou? And she said, The daughter of Bethuel, Nahor\'s son, whom Milcah bare unto him: and I put the ring upon her nose, and the bracelets upon her hands.";
yng[47] = "`And I ask her, and say, Whose daughter [art] thou? and she saith, Daughter of Bethuel, son of Nahor, whom Milcah hath borne to him, and I put the ring on her nose, and the bracelets on her hands,";
dby[47] = "And I asked her, and said, Whose daughter art thou? And she said, The daughter of Bethuel, Nahor\'s son, whom Milcah bore to him. And I put the ring on her nose, and the bracelets on her hands.";
web[47] = "And I asked her, and said, Whose daughter [art] thou? And she said, The daughter of Bethuel, Nahor\'s son, whom Milcah bore to him: and I put the ear-ring upon her face, and the bracelets upon her hands.";
hnv[47] = "I asked her, and said, \'Whose daughter are you?\' She said, \'The daughter of Betu\'el, Nachor\'s son, whom Milkah bare to him.\' I put the ring on her nose, and the bracelets on her hands.";
vul[47] = "interrogavique eam et dixi cuius es filia quae respondit filia Bathuelis sum filii Nahor quem peperit illi Melcha suspendi itaque inaures ad ornandam faciem eius et armillas posui in manibus";
kjv[48] = "And Isaac came from the way of the well Lahairoi; for he dwelt in the south country.";
rsv[48] = "Then I bowed my head and worshiped the LORD, and blessed the LORD, the God of my master Abraham, who had led me by the right way to take the daughter of my master\'s kinsman for his son.";
asv[48] = "And I bowed my head, and worshipped Jehovah, and blessed Jehovah, the God of my master Abraham, who had led me in the right way to take my master\'s brother\'s daughter for his son.";
yng[48] = "and I bow, and do obeisance before Jehovah, and I bless Jehovah, God of my lord Abraham, who hath led me in the true way to receive the daughter of my lord\'s brother for his son.";
dby[48] = "And I stooped, and bowed down before Jehovah; and I blessed Jehovah, God of my master Abraham, who has led me the right way to take my master\'s brother\'s daughter for his son.";
web[48] = "And I bowed my head, and worshipped the LORD, and blessed the LORD God of my master Abraham, who had led me in the right way to take my master\'s brother\'s daughter for his son.";
hnv[48] = "I bowed my head, and worshiped the LORD, and blessed the LORD, the God of my master Avraham, who had led me in the right way to take my master\'s brother\'s daughter for his son.";
vul[48] = "pronusque adoravi Dominum benedicens Domino Deo domini mei Abraham qui perduxisset me recto itinere ut sumerem filiam fratris domini mei filio eius";
kjv[49] = "And Isaac went out to meditate in the field at the eventide: and he lifted up his eyes, and saw, and, behold, the camels [were] coming.";
rsv[49] = "Now then, if you will deal loyally and truly with my master, tell me; and if not, tell me; that I may turn to the right hand or to the left.&quot;";
asv[49] = "And now if ye will deal kindly and truly with my master, tell me: and if not, tell me; that I may turn to the right hand, or to the left.";
yng[49] = "`And now, if ye are dealing kindly and truly with my lord, declare to me; and if not, declare to me; and I turn unto the right or unto the left.\'";
dby[49] = "And now, if ye will deal kindly and truly with my master, tell me; and if not, tell me; and I will turn to the right hand or to the left.";
web[49] = "And now if you will deal kindly and truly with my master, tell me; and if not, tell me; that I may turn to the right hand, or to the left.";
hnv[49] = "Now if you will deal kindly and truly with my master, tell me. If not, tell me. That I may turn to the right hand, or to the left.&quot;";
vul[49] = "quam ob rem si facitis misericordiam et veritatem cum domino meo indicate mihi sin autem aliud placet et hoc dicite ut vadam ad dextram sive ad sinistram";
kjv[50] = "And Abraham was old, [and] well stricken in age: and the LORD had blessed Abraham in all things.";
rsv[50] = "Then Laban and Bethu\'el answered, &quot;The thing comes from the LORD; we cannot speak to you bad or good.";
asv[50] = "Then Laban and Bethuel answered and said, The thing proceedeth from Jehovah: we cannot speak unto thee bad or good.";
yng[50] = "And Laban answereth -- Bethuel also -- and they say, `The thing hath gone out from Jehovah; we are not able to speak unto thee bad or good;";
dby[50] = "And Laban and Bethuel answered and said, The thing proceeds from Jehovah: we cannot speak to thee bad or good.";
web[50] = "Then Laban and Bethuel answered, and said, The thing proceedeth from the LORD: we cannot speak to thee bad or good.";
hnv[50] = "Then Lavan and Betu\'el answered, &quot;The thing proceeds from the LORD. We can\'t speak to you bad or good.";
vul[50] = "responderunt Laban et Bathuel a Domino egressus est sermo non possumus extra placitum eius quicquam aliud tecum loqui";
kjv[51] = "And Abraham said unto his eldest servant of his house, that ruled over all that he had, Put, I pray thee, thy hand under my thigh:";
rsv[51] = "Behold, Rebekah is before you, take her and go, and let her be the wife of your master\'s son, as the LORD has spoken.&quot;";
asv[51] = "Behold, Rebekah is before thee, take her, and go, and let her be thy master\'s son\'s wife, as Jehovah hath spoken.";
yng[51] = "lo, Rebekah [is] before thee, take and go, and she is a wife to thy lord\'s son, as Jehovah hath spoken.\'";
dby[51] = "Behold, Rebecca is before thee: take [her], and go away; and let her be wife of thy master\'s son, as Jehovah has said.";
web[51] = "Behold, Rebekah [is] before thee, take [her], and go, and let her be thy master\'s son\'s wife, as the LORD hath spoken.";
hnv[51] = "Behold, Rivka is before you, take her, and go, and let her be your master\'s son\'s wife, as the LORD has spoken.&quot;";
vul[51] = "en Rebecca coram te est tolle eam et proficiscere et sit uxor filii domini tui sicut locutus est Dominus";
kjv[52] = "And I will make thee swear by the LORD, the God of heaven, and the God of the earth, that thou shalt not take a wife unto my son of the daughters of the Canaanites, among whom I dwell:";
rsv[52] = "When Abraham\'s servant heard their words, he bowed himself to the earth before the LORD.";
asv[52] = "And it came to pass, that, when Abraham\'s servant heard their words, he bowed himself down to the earth unto Jehovah.";
yng[52] = "And it cometh to pass, when the servant of Abraham hath heard their words, that he boweth himself towards the earth before Jehovah;";
dby[52] = "And it came to pass, when Abraham\'s servant heard their words, that he bowed down to the earth before Jehovah.";
web[52] = "And it came to pass, that when Abraham\'s servant heard their words, he worshipped the LORD, [bowing himself] to the earth.";
hnv[52] = "It happened that when Avraham\'s servant heard their words, he bowed himself down to the eretz to the LORD.";
vul[52] = "quod cum audisset puer Abraham adoravit in terra Dominum";
kjv[53] = "But thou shalt go unto my country, and to my kindred, and take a wife unto my son Isaac.";
rsv[53] = "And the servant brought forth jewelry of silver and of gold, and raiment, and gave them to Rebekah; he also gave to her brother and to her mother costly ornaments.";
asv[53] = "And the servant brought forth jewels of silver, and jewels of gold, and raiment, and gave them to Rebekah: he gave also to her brother and to her mother precious things.";
yng[53] = "and the servant taketh out vessels of silver, and vessels of gold, and garments, and giveth to Rebekah; precious things also he hath given to her brother and to her mother.";
dby[53] = "And the servant brought forth silver articles, and gold articles, and clothing, and he gave [them] to Rebecca; and he gave to her brother, and to her mother, precious things.";
web[53] = "And the servant brought forth jewels of silver, and jewels of gold, and raiment, and gave [them] to Rebekah: He gave also to her brother and to her mother precious things.";
hnv[53] = "The servant brought forth jewels of silver, and jewels of gold, and clothing, and gave them to Rivka. He gave also to her brother and to her mother precious things.";
vul[53] = "prolatisque vasis argenteis et aureis ac vestibus dedit ea Rebeccae pro munere fratribus quoque eius et matri dona obtulit";
kjv[54] = "And the servant said unto him, Peradventure the woman will not be willing to follow me unto this land: must I needs bring thy son again unto the land from whence thou camest?";
rsv[54] = "And he and the men who were with him ate and drank, and they spent the night there. When they arose in the morning, he said, &quot;Send me back to my master.&quot;";
asv[54] = "And they did eat and drink, he and the men that were with him, and tarried all night; and they rose up in the morning, and he said, Send me away unto my master.";
yng[54] = "And they eat and drink, he and the men who [are] with him, and lodge all night; and they rise in the morning, and he saith, `Send me to my lord;\'";
dby[54] = "And they ate and drank, he and the men that were with him, and lodged. And they rose up in the morning; and he said, Send me away to my master.";
web[54] = "And they ate and drank, he and the men that [were] with him, and tarried all night; and they rose in the morning, and he said, Send me away to my master.";
hnv[54] = "They ate and drank, he and the men who were with him, and stayed all night. They rose up in the morning, and he said, &quot;Send me away to my master.&quot;";
vul[54] = "initoque convivio vescentes pariter et bibentes manserunt ibi surgens autem mane locutus est puer dimittite me ut vadam ad dominum meum";
kjv[55] = "And Abraham said unto him, Beware thou that thou bring not my son thither again.";
rsv[55] = "Her brother and her mother said, &quot;Let the maiden remain with us a while, at least ten days; after that she may go.&quot;";
asv[55] = "And her brother and her mother said, Let the damsel abide with us [a few] days, at the least ten; after that she shall go.";
yng[55] = "and her brother saith -- her mother also -- `Let the young person abide with us a week or ten days, afterwards doth she go.\'";
dby[55] = "And her brother and her mother said, Let the maiden abide with us [some] days, or [say] ten; after that she shall go.";
web[55] = "And her brother and her mother said, Let the damsel abide with us [a few] days, at the least ten; after that she shall go.";
hnv[55] = "Her brother and her mother said, &quot;Let the young lady stay with us a few days, at least ten. After that she will go.&quot;";
vul[55] = "responderunt fratres eius et mater maneat puella saltem decem dies apud nos et postea proficiscetur";
kjv[56] = "The LORD God of heaven, which took me from my father\'s house, and from the land of my kindred, and which spake unto me, and that sware unto me, saying, Unto thy seed will I give this land; he shall send his angel before thee, and thou shalt take a wife unto my son from thence.";
rsv[56] = "But he said to them, &quot;Do not delay me, since the LORD has prospered my way; let me go that I may go to my master.&quot;";
asv[56] = "And he said unto them, Hinder me not, seeing Jehovah hath prospered my way; send me away that I may go to my master.";
yng[56] = "And he saith unto them, `Do not delay me, seeing Jehovah hath prospered my way; send me away, and I go to my lord;\'";
dby[56] = "And he said to them, Do not hinder me, seeing Jehovah has prospered my way: send me away, and I will go to my master.";
web[56] = "And he said to them, Hinder me not, seeing the LORD hath prospered my way: send me away, that I may go to my master.";
hnv[56] = "He said to them, &quot;Don\'t hinder me, seeing the LORD has prospered my way. Send me away that I may go to my master.&quot;";
vul[56] = "nolite ait me retinere quia Dominus direxit viam meam dimittite me ut pergam ad dominum meum";
kjv[57] = "And if the woman will not be willing to follow thee, then thou shalt be clear from this my oath: only bring not my son thither again.";
rsv[57] = "They said, &quot;We will call the maiden, and ask her.&quot;";
asv[57] = "And they said, We will call the damsel, and inquire at her mouth.";
yng[57] = "and they say, `Let us call for the young person, and ask at her mouth;\'";
dby[57] = "And they said, Let us call the maiden and inquire at her mouth.";
web[57] = "And they said, We will call the damsel, and inquire at her mouth.";
hnv[57] = "They said, &quot;We will call the young lady, and ask her.&quot;";
vul[57] = "dixerunt vocemus puellam et quaeramus ipsius voluntatem";
kjv[58] = "And the servant put his hand under the thigh of Abraham his master, and sware to him concerning that matter.";
rsv[58] = "And they called Rebekah, and said to her, &quot;Will you go with this man?&quot; She said, &quot;I will go.&quot;";
asv[58] = "And they called Rebekah, and said unto her, Wilt thou go with this man? And she said, I will go.";
yng[58] = "and they call for Rebekah, and say unto her, `Dost thou go with this man?\' and she saith, `I go.\'";
dby[58] = "And they called Rebecca and said to her, Wilt thou go with this man? And she said, I will go.";
web[58] = "And they called Rebekah, and said to her, Wilt thou go with this man? And she said, I will go.";
hnv[58] = "They called Rivka, and said to her, &quot;Will you go with this man?&quot; She said, &quot;I will go.&quot;";
vul[58] = "cumque vocata venisset sciscitati sunt vis ire cum homine isto quae ait vadam";
kjv[59] = "And the servant took ten camels of the camels of his master, and departed; for all the goods of his master [were] in his hand: and he arose, and went to Mesopotamia, unto the city of Nahor.";
rsv[59] = "So they sent away Rebekah their sister and her nurse, and Abraham\'s servant and his men.";
asv[59] = "And they sent away Rebekah their sister, and her nurse, and Abraham\'s servant, and his men.";
yng[59] = "And they send away Rebekah their sister, and her nurse, and Abraham\'s servant, and his men;";
dby[59] = "And they sent away Rebecca their sister, and her nurse, and Abraham\'s servant, and his men.";
web[59] = "And they sent away Rebekah their sister, and her nurse, and Abraham\'s servant, and his men.";
hnv[59] = "They sent away Rivka, their sister, with her nurse, Avraham\'s servant, and his men.";
vul[59] = "dimiserunt ergo eam et nutricem illius servumque Abraham et comites eius";
kjv[60] = "And he made his camels to kneel down without the city by a well of water at the time of the evening, [even] the time that women go out to draw [water].";
rsv[60] = "And they blessed Rebekah, and said to her, &quot;Our sister, be the mother of thousands of ten thousands; and may your descendants possess the gate of those who hate them!&quot;";
asv[60] = "And they blessed Rebekah, and said unto her, Our sister, be thou [the mother] of thousands of ten thousands, and let thy seed possess the gate of those that hate them.";
yng[60] = "and they bless Rebekah, and say to her, `Thou [art] our sister; become thou thousands of myriads, and thy seed doth possess the gate of those hating it.\'";
dby[60] = "And they blessed Rebecca, and said to her, Thou art our sister; mayest thou become thousands of tens of thousands; and may thy seed possess the gate of their enemies!";
web[60] = "And they blessed Rebekah, and said to her, Thou [art] our sister, be thou [the mother] of thousands of millions, and let thy seed possess the gate of those who hate them.";
hnv[60] = "They blessed Rivka, and said to her, &quot;Our sister, may you be the mother of thousands of ten thousands, and let your seed possess the gate of those who hate them.&quot;";
vul[60] = "inprecantes prospera sorori suae atque dicentes soror nostra es crescas in mille milia et possideat semen tuum portas inimicorum suorum";
kjv[61] = "And he said, O LORD God of my master Abraham, I pray thee, send me good speed this day, and shew kindness unto my master Abraham.";
rsv[61] = "Then Rebekah and her maids arose, and rode upon the camels and followed the man; thus the servant took Rebekah, and went his way.";
asv[61] = "And Rebekah arose, and her damsels, and they rode upon the camels, and followed the man: and the servant took Rebekah, and went his way.";
yng[61] = "And Rebekah and her young women arise, and ride on the camels, and go after the man; and the servant taketh Rebekah and goeth.";
dby[61] = "And Rebecca arose, and her maids, and they rode upon the camels, and followed the man. And the servant took Rebecca, and went away.";
web[61] = "And Rebekah arose, and her damsels, and they rode upon the camels, and followed the man: and the servant took Rebekah, and went his way.";
hnv[61] = "Rivka arose with her ladies. They rode on the camels, and followed the man. The servant took Rivka, and went his way.";
vul[61] = "igitur Rebecca et puellae illius ascensis camelis secutae sunt virum qui festinus revertebatur ad dominum suum";
kjv[62] = "Behold, I stand [here] by the well of water; and the daughters of the men of the city come out to draw water:";
rsv[62] = "Now Isaac had come from Beer-la\'hai-roi, and was dwelling in the Negeb.";
asv[62] = "And Isaac came from the way of Beer-lahai-roi; for he dwelt in the land of the South.";
yng[62] = "And Isaac hath come in from the entrance of the Well of the Living One, my Beholder; and he is dwelling in the land of the south,";
dby[62] = "And Isaac had just returned from Beer-lahai-roi; for he was dwelling in the south country.";
web[62] = "And Isaac came from the way of the well Lahai-roi; for he dwelt in the south country.";
hnv[62] = " Yitzchak came from the way of Be\'er-Lachai-Ro\'i. For he lived in the land of the South.";
vul[62] = "eo tempore Isaac deambulabat per viam quae ducit ad puteum cuius nomen est Viventis et videntis habitabat enim in terra australi";
kjv[63] = "And let it come to pass, that the damsel to whom I shall say, Let down thy pitcher, I pray thee, that I may drink; and she shall say, Drink, and I will give thy camels drink also: [let the same be] she [that] thou hast appointed for thy servant Isaac; and thereby shall I know that thou hast shewed kindness unto my master.";
rsv[63] = "And Isaac went out to meditate in the field in the evening; and he lifted up his eyes and looked, and behold, there were camels coming.";
asv[63] = "And Isaac went out to meditate in the field at the eventide: and he lifted up his eyes, and saw, and, behold, there were camels coming.";
yng[63] = "and Isaac goeth out to meditate in the field, at the turning of the evening, and he lifteth up his eyes, and looketh, and lo, camels are coming.";
dby[63] = "And Isaac had gone out to meditate in the fields toward the beginning of evening. And he lifted up his eyes and saw, and behold, camels were coming.";
web[63] = "And Isaac went out to meditate in the field at evening: and he lifted up his eyes, and saw, and behold, the camels [were] coming.";
hnv[63] = "Yitzchak went out to meditate in the field at the evening. He lifted up his eyes, and saw, and, behold, there were camels coming.";
vul[63] = "et egressus fuerat ad meditandum in agro inclinata iam die cumque levasset oculos vidit camelos venientes procul";
kjv[64] = "And Rebekah lifted up her eyes, and when she saw Isaac, she lighted off the camel.";
rsv[64] = "And Rebekah lifted up her eyes, and when she saw Isaac, she alighted from the camel,";
asv[64] = "And Rebekah lifted up her eyes, and when she saw Isaac, she alighted from the camel.";
yng[64] = "And Rebekah lifteth up her eyes, and seeth Isaac, and alighteth from off the camel;";
dby[64] = "And Rebecca lifted up her eyes and saw Isaac, and she sprang off the camel.";
web[64] = "And Rebekah lifted up her eyes, and when she saw Isaac, she alighted from the camel.";
hnv[64] = "Rivka lifted up her eyes, and when she saw Yitzchak, she dismounted from the camel.";
vul[64] = "Rebecca quoque conspecto Isaac descendit de camelo";
kjv[65] = "For she [had] said unto the servant, What man [is] this that walketh in the field to meet us? And the servant [had] said, It [is] my master: therefore she took a vail, and covered herself.";
rsv[65] = "and said to the servant, &quot;Who is the man yonder, walking in the field to meet us?&quot; The servant said, &quot;It is my master.&quot; So she took her veil and covered herself.";
asv[65] = "And she said unto the servant, What man is this that walketh in the field to meet us? And the servant said, It is my master: and she took her veil, and covered herself.";
yng[65] = "and she saith unto the servant, `Who [is] this man who is walking in the field to meet us?\' and the servant saith, `It [is] my lord;\' and she taketh the veil, and covereth herself.";
dby[65] = "And she had said to the servant, Who is the man that is walking in the fields to meet us? And the servant said, That is my master! Then she took the veil, and covered herself.";
web[65] = "For she [had] said to the servant, What man [is] this that walketh in the field to meet us? And the servant [had] said, It [is] my master: therefore she took a vail and covered herself.";
hnv[65] = "She said to the servant, &quot;Who is the man who is walking in the field to meet us?&quot; The servant said, &quot;It is my master.&quot; She took her veil, and covered herself.";
vul[65] = "et ait ad puerum quis est ille homo qui venit per agrum in occursum nobis dixit ei ipse est dominus meus at illa tollens cito pallium operuit se";
kjv[66] = "And the servant told Isaac all things that he had done.";
rsv[66] = "And the servant told Isaac all the things that he had done.";
asv[66] = "And the servant told Isaac all the things that he had done.";
yng[66] = "And the servant recounteth to Isaac all the things that he hath done,";
dby[66] = "And the servant told Isaac all things that he had done.";
web[66] = "And the servant told Isaac all things that he had done.";
hnv[66] = "The servant told Yitzchak all the things that he had done.";
vul[66] = "servus autem cuncta quae gesserat narravit Isaac";
kjv[67] = "And Isaac brought her into his mother Sarah\'s tent, and took Rebekah, and she became his wife; and he loved her: and Isaac was comforted after his mother\'s [death].";
rsv[67] = "Then Isaac brought her into the tent, and took Rebekah, and she became his wife; and he loved her. So Isaac was comforted after his mother\'s death.";
asv[67] = "And Isaac brought her into his mother Sarah\'s tent, and took Rebekah, and she became his wife; and he loved her. And Isaac was comforted after his mother\'s death.";
yng[67] = "and Isaac bringeth her in unto the tent of Sarah his mother, and he taketh Rebekah, and she becometh his wife, and he loveth her, and Isaac is comforted after [the death of] his mother.";
dby[67] = "And Isaac led her into his mother Sarah\'s tent; and he took Rebecca, and she became his wife, and he loved her. And Isaac was comforted after [the death of] his mother.";
web[67] = "And Isaac brought her into his mother Sarah\'s tent, and took Rebekah, and she became his wife; and he loved her: and Isaac was comforted after his mother\'s [death].";
hnv[67] = "Yitzchak brought her into his mother Sarah\'s tent, and took Rivka, and she became his wife. He loved her. Yitzchak was comforted after his mother\'s death.";
vul[67] = "qui introduxit eam in tabernaculum Sarrae matris suae et accepit uxorem et in tantum dilexit ut dolorem qui ex morte matris acciderat temperaret";
csb[1] = "Abraham was now old, getting on in years, and the LORD had blessed him in everything.";
csb[2] = "Abraham said to his servant, the elder of his household who managed all he owned, &quot;Place your hand under my thigh,";
csb[3] = "&quot;and I will have you swear by the LORD, God of heaven and God of earth, that you will not take a wife for my son from the daughters of the Canaanites among whom I live,";
csb[4] = "&quot;but will go to my land and my family to take a wife for my son Isaac.&quot;";
csb[5] = "The servant said to him, &quot;Suppose the woman is unwilling to follow me to this land? Should I have your son go back to the land you came from? &quot;";
csb[6] = "Abraham answered him, &quot;Make sure that you don\'t take my son back there.";
csb[7] = "&quot;The LORD, the God of heaven, who took me from my father\'s house and from my native land, who spoke to me and swore to me, \'I will give this land to your offspring\' -- he will send his angel before you, and you can take a wife for my son from there.";
csb[8] = "&quot;If the woman is unwilling to follow you, then you are free from this oath to me, but don\'t let my son go back there.&quot;";
csb[9] = "So the servant placed his hand under his master Abraham\'s thigh and swore an oath to him concerning this matter.";
csb[10] = "The servant took ten of his master\'s camels, and with all kinds of his master\'s goods in hand, he went to Aram-naharaim, to Nahor\'s town.";
csb[11] = "At evening, the time when women went out to draw water, he made the camels kneel beside a well outside the town.";
csb[12] = "&quot;LORD, God of my master Abraham,&quot; he prayed, &quot;make this happen for me today, and show kindness to my master Abraham.";
csb[13] = "&quot;I am standing here at the spring where the daughters of the men of the town are coming out to draw water.";
csb[14] = "&quot;Let the girl to whom I say, \'Please lower your water jug so that I may drink,\' and who responds, \'Drink, and I\'ll water your camels also\' -- let her be the one you have appointed for your servant Isaac. By this I will know that you have shown kindness to my master.&quot;";
csb[15] = "Before he had finished speaking, there was Rebekah -- daughter of Bethuel son of Milcah, the wife of Abraham\'s brother Nahor -- coming with a jug on her shoulder.";
csb[16] = "Now the girl was very beautiful, a virgin -- no man had been intimate with her. She went down to the spring, filled her jug, and came up.";
csb[17] = "Then the servant ran to meet her and said, &quot;Please let me have a little water from your jug.&quot;";
csb[18] = "She replied, &quot;Drink, my lord.&quot; She quickly lowered her jug to her hand and gave him a drink.";
csb[19] = "When she had finished giving him a drink, she said, &quot;I\'ll also draw water for your camels until they have had enough to drink.&quot;";
csb[20] = "She quickly emptied her jug into the trough and hurried to the well again to draw water. She drew water for all his camels";
csb[21] = "while the man silently watched her to see whether or not the LORD had made his journey a success.";
csb[22] = "As the camels finished drinking, the man took a gold ring weighing half a shekel, and for her wrists two bracelets weighing ten shekels of gold.";
csb[23] = "&quot;Whose daughter are you? &quot; he asked. &quot;Please tell me, is there room in your father\'s house for us to spend the night? &quot;";
csb[24] = "She answered him, &quot;I am the daughter of Bethuel son of Milcah, whom she bore to Nahor.&quot;";
csb[25] = "She also said to him, &quot;We have plenty of straw and feed and a place to spend the night.&quot;";
csb[26] = "Then the man knelt low, worshiped the LORD,";
csb[27] = "and said, &quot;Blessed be the LORD, the God of my master Abraham, who has not withheld his kindness and faithfulness from my master. As for me, the LORD has led me on the journey to the house of my master\'s relatives.&quot;";
csb[28] = "The girl ran and told her mother\'s household about these things.";
csb[29] = "Now Rebekah had a brother named Laban, and Laban ran out to the man at the spring.";
csb[30] = "As soon as he had seen the ring and the bracelets on his sister\'s wrists, and when he had heard his sister Rebekah\'s words -- &quot;The man said this to me! &quot; -- he went to the man. He was standing there by the camels at the spring.";
csb[31] = "Laban said, &quot;Come, you who are blessed by the LORD. Why are you standing out here? I have prepared the house and a place for the camels.&quot;";
csb[32] = "So the man came to the house, and the camels were unloaded. Straw and feed were given to the camels, and water was brought to wash his feet and the feet of the men with him.";
csb[33] = "A meal was set before him, but he said, &quot;I will not eat until I have said what I have to say.&quot; So Laban said, &quot;Please speak.&quot;";
csb[34] = "&quot;I am Abraham\'s servant,&quot; he said.";
csb[35] = "&quot;The LORD has greatly blessed my master, and he has become rich. He has given him flocks and herds, silver and gold, male and female slaves, and camels and donkeys.";
csb[36] = "&quot;Sarah, my master\'s wife, bore a son to my master in her old age, and he has given him everything he owns.";
csb[37] = "&quot;My master put me under this oath: \'You will not take a wife for my son from the daughters of the Canaanites in whose land I live";
csb[38] = "&quot;but will go to my father\'s family and to my clan to take a wife for my son.\'";
csb[39] = "&quot;But I said to my master, \'Suppose the woman will not come back with me? \'";
csb[40] = "&quot;He said to me, \'The LORD before whom I have walked will send his angel with you and make your journey a success, and you will take a wife for my son from my clan and from my father\'s family.";
csb[41] = "&quot;Then you will be free from my oath if you go to my family and they do not give her to you -- you will be free from my oath.\'";
csb[42] = "&quot;Today when I came to the spring, I prayed: LORD, God of my master Abraham, if only you will make my journey successful!";
csb[43] = "&quot;I am standing here at a spring. Let the young woman who comes out to draw water, and I say to her, \'Please let me drink a little water from your jug,\'";
csb[44] = "&quot;and who responds to me, \'Drink, and I\'ll draw water for your camels also\' -- let her be the woman the LORD has appointed for my master\'s son.";
csb[45] = "&quot;Before I had finished praying silently, there was Rebekah coming with her jug on her shoulder, and she went down to the spring and drew water. So I said to her, \'Please let me have a drink.\'";
csb[46] = "&quot;She quickly lowered her jug from her shoulder and said, \'Drink, and I\'ll water your camels also.\' So I drank, and she also watered the camels.";
csb[47] = "&quot;Then I asked her, \'Whose daughter are you? \' She responded, \'The daughter of Bethuel son of Nahor, whom Milcah bore to him.\' So I put the ring on her nose and the bracelets on her wrists.";
csb[48] = "&quot;Then I knelt low, worshiped the LORD, and blessed the LORD, the God of my master Abraham, who guided me on the right way to take the granddaughter of my master\'s brother for his son.";
csb[49] = "&quot;Now, if you are going to show kindness and faithfulness to my master, tell me; if not, tell me, and I will go elsewhere.&quot;";
csb[50] = "Laban and Bethuel answered, &quot;This is from the LORD; we have no choice in the matter.";
csb[51] = "&quot;Rebekah is here in front of you. Take her and go, and let her be a wife for your master\'s son, just as the LORD has spoken.&quot;";
csb[52] = "When Abraham\'s servant heard their words, he bowed to the ground before the LORD.";
csb[53] = "Then he brought out objects of silver and gold, and garments, and gave them to Rebekah. He also gave precious gifts to her brother and her mother.";
csb[54] = "Then he and the men with him ate and drank and spent the night. When they got up in the morning, he said, &quot;Send me to my master.&quot;";
csb[55] = "But her brother and mother said, &quot;Let the girl stay with us for about ten days. Then she can go.&quot;";
csb[56] = "But he responded to them, &quot;Do not delay me, since the LORD has made my journey a success. Send me away so that I may go to my master.&quot;";
csb[57] = "So they said, &quot;Let\'s call the girl and ask her opinion.&quot;";
csb[58] = "They called Rebekah and said to her, &quot;Will you go with this man? &quot; She replied, &quot;I will go.&quot;";
csb[59] = "So they sent away their sister Rebekah with the one who had nursed and raised her, and Abraham\'s servant and his men.";
csb[60] = "They blessed Rebekah, saying to her: Our sister, may you become thousands upon ten thousands. May your offspring possess the city gates of their enemies.";
csb[61] = "Then Rebekah and her female servants got up, mounted the camels, and followed the man. So the servant took Rebekah and left.";
csb[62] = "Now Isaac was returning from Beer-lahai-roi, for he was living in the Negev region.";
csb[63] = "In the early evening Isaac went out to walk in the field, and looking up he saw camels coming.";
csb[64] = "Rebekah looked up, and when she saw Isaac, she got down from her camel";
csb[65] = "and asked the servant, &quot;Who is that man in the field coming to meet us? &quot; The servant answered, &quot;It is my master.&quot; So she took her veil and covered herself.";
csb[66] = "Then the servant told Isaac everything he had done.";
csb[67] = "And Isaac brought her into the tent of his mother Sarah and took Rebekah to be his wife. Isaac loved her, and he was comforted after his mother\'s death.";
</script>
