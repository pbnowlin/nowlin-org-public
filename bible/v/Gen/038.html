dby[8] = "Then Judah said to Onan, Go in to thy brother\'s wife, and fulfil to her the brother-in-law\'s duty, and raise up seed to thy brother.";

kjv[11] = "Then said Judah to Tamar his daughter in law, Remain a widow at thy father\'s house, till Shelah my son be grown: for he said, Lest peradventure he die also, as his brethren [did]. And Tamar went and dwelt in her father\'s house.";
rsv[11] = "Then Judah said to Tamar his daughter-in-law, &quot;Remain a widow in your father\'s house, till Shelah my son grows up&quot;--for he feared that he would die, like his brothers. So Tamar went and dwelt in her father\'s house.";
asv[11] = "Then said Judah to Tamar his daughter-in-law, Remain a widow in thy father\'s house, till Shelah my son be grown up; for he said, Lest he also die, like his brethren. And Tamar went and dwelt in her father\'s house.";
yng[11] = "And Judah saith to Tamar his daughter-in-law, `Abide a widow at thy father\'s house, till Shelah my son groweth up;\' for he said, `Lest he die -- even he -- like his brethren;\' and Tamar goeth and dwelleth at her father\'s house.";
dby[11] = "And Judah said to Tamar his daughter-in-law, Remain a widow in thy father\'s house, until Shelah my son is grown; for he said, Lest he die also, as his brethren. And Tamar went and remained in her father\'s house.";
web[11] = "Then said Judah to Tamar his daughter-in-law, Remain a widow at thy father\'s house, till Shelah my son shall be grown; (for he said, Lest perhaps he die also as his brethren [did]:) and Tamar went and dwelt in her father\'s house.";
hnv[11] = "Then Yehudah said to Tamar, his daughter-in-law, &quot;Remain a widow in your father\'s house, until Shelach, my son, is grown up;&quot; for he said, &quot;Lest he also die, like his brothers.&quot; Tamar went and lived in her father\'s house.";
vul[11] = "quam ob rem dixit Iudas Thamar nurui suae esto vidua in domo patris tui donec crescat Sela filius meus timebat enim ne et ipse moreretur sicut fratres eius quae abiit et habitavit in domo patris sui";
kjv[12] = "And in process of time the daughter of Shuah Judah\'s wife died; and Judah was comforted, and went up unto his sheepshearers to Timnath, he and his friend Hirah the Adullamite.";
rsv[12] = "In course of time the wife of Judah, Shua\'s daughter, died; and when Judah was comforted, he went up to Timnah to his sheepshearers, he and his friend Hirah the Adullamite.";
asv[12] = "And in process of time Shua\'s daughter, the wife of Judah, died; and Judah was comforted, and went up unto his sheep-shearers to Timnah, he and his friend Hirah the Adullamite.";
yng[12] = "And the days are multiplied, and the daughter of Shuah, Judah\'s wife, dieth; and Judah is comforted, and goeth up unto his sheep-shearers, he and Hirah his friend the Adullamite, to Timnath.";
dby[12] = "And as the days were multiplied, Judah\'s wife, the daughter of Shua, died. And Judah was comforted, and he went up to his sheep-shearers, to Timnah, he and his friend Hirah the Adullamite.";
web[12] = "And in process of time, the daughter of Shuah Judah\'s wife died: and Judah was comforted, and went up to his sheep-shearers to Timnath, he and his friend Hirah the Adullamite.";
hnv[12] = "After many days, Shu`a\'s daughter, the wife of Yehudah, died. Yehudah was comforted, and went up to his sheep-shearers to Timnah, he and his friend Hirah, the `Adullami.";
vul[12] = "evolutis autem multis diebus mortua est filia Suae uxor Iudae qui post luctum consolatione suscepta ascendebat ad tonsores ovium suarum ipse et Hiras opilio gregis Odollamita in Thamnas";
kjv[13] = "And it was told Tamar, saying, Behold thy father in law goeth up to Timnath to shear his sheep.";
rsv[13] = "And when Tamar was told, &quot;Your father-in-law is going up to Timnah to shear his sheep,&quot;";
asv[13] = "And it was told Tamar, saying, Behold, thy father-in-law goeth up to Timnah to shear his sheep.";
yng[13] = "And it is declared to Tamar, saying, `Lo, thy husband\'s father is going up to Timnath to shear his flock;\'";
dby[13] = "And it was told Tamar, saying, Behold thy father-in-law is going up to Timnah to shear his sheep.";
web[13] = "And it was told to Tamar, saying, Behold, thy father-in-law goeth up to Timnath, to shear his sheep.";
hnv[13] = "It was told Tamar, saying, &quot;Behold, your father-in-law is going up to Timnah to shear his sheep.&quot;";
vul[13] = "nuntiatumque est Thamar quod socer illius ascenderet in Thamnas ad tondendas oves";
kjv[14] = "And she put her widow\'s garments off from her, and covered her with a vail, and wrapped herself, and sat in an open place, which [is] by the way to Timnath; for she saw that Shelah was grown, and she was not given unto him to wife.";
rsv[14] = "she put off her widow\'s garments, and put on a veil, wrapping herself up, and sat at the entrance to Enaim, which is on the road to Timnah; for she saw that Shelah was grown up, and she had not been given to him in marriage.";
asv[14] = "And she put off from her the garments of her widowhood, and covered herself with her veil, and wrapped herself, and sat in the gate of Enaim, which is by the way to Timnah; for she saw that Shelah was grown up, and she was not given unto him to wife.";
yng[14] = "and she turneth aside the garments of her widowhood from off her, and covereth herself with a vail, and wrappeth herself up, and sitteth in the opening of Enayim, which [is] by the way to Timnath, for she hath seen that Shelah hath grown up, and she hath not been given to him for a wife.";
dby[14] = "And she put the garments of her widowhood off from her, and covered herself with a veil, and wrapped herself, and sat in the entry of Enaim, which is on the way to Timnah; for she saw that Shelah was grown, and she was not given to him as wife.";
web[14] = "And she put off from her, her widow\'s garments, and covered her with a vail, and wrapped herself, and sat in an open place, which [is] by the way to Timnath: for she saw that Shelah was grown, and she was not given to him for a wife.";
hnv[14] = "She took off of her the garments of her widowhood, and covered herself with her veil, and wrapped herself, and sat in the gate of `Enayim, which is by the way to Timnah; for she saw that Shelach was grown up, and she wasn\'t given to him as a wife.";
vul[14] = "quae depositis viduitatis vestibus adsumpsit theristrum et mutato habitu sedit in bivio itineris quod ducit Thamnam eo quod crevisset Sela et non eum accepisset maritum";
kjv[15] = "When Judah saw her, he thought her [to be] an harlot; because she had covered her face.";
rsv[15] = "When Judah saw her, he thought her to be a harlot, for she had covered her face.";
asv[15] = "When Judah saw her, he thought her to be a harlot; for she had covered her face.";
yng[15] = "And Judah seeth her, and reckoneth her for a harlot, for she hath covered her face,";
dby[15] = "And Judah saw her, and took her for a harlot; because she had covered her face.";
web[15] = "When Judah saw her, he thought her [to be] a harlot; because she had covered her face.";
hnv[15] = "When Yehudah saw her, he thought that she was a prostitute, for she had covered her face.";
vul[15] = "quam cum vidisset Iudas suspicatus est esse meretricem operuerat enim vultum suum ne cognosceretur";
kjv[16] = "And he turned unto her by the way, and said, Go to, I pray thee, let me come in unto thee; (for he knew not that she [was] his daughter in law.) And she said, What wilt thou give me, that thou mayest come in unto me?";
rsv[16] = "He went over to her at the road side, and said, &quot;Come, let me come in to you,&quot; for he did not know that she was his daughter-in-law. She said, &quot;What will you give me, that you may come in to me?&quot;";
asv[16] = "And he turned unto her by the way, and said, Come, I pray thee, let me come in unto thee: for he knew not that she was his daughter-in-law. And she said, What wilt thou give me, that thou mayest come in unto me?";
yng[16] = "and he turneth aside unto her by the way, and saith, `Come, I pray thee, let me come in unto thee,\' (for he hath not known that she [is] his daughter-in-law); and she saith, `What dost thou give to me, that thou mayest come in unto me?\'";
dby[16] = "And he turned aside to her by the way, and said, Come, I pray thee, let me go in to thee; for he did not know that she was his daughter-in-law. And she said, What wilt thou give me, that thou mayest come in to me?";
web[16] = "And he turned to her by the way, and said, Come, I pray thee, let me have access to thee; (for he knew not that she [was] his daughter-in-law:) and she said, What wilt thou give me, that thou mayst have access to me?";
hnv[16] = "He turned to her by the way, and said, &quot;Please come, let me come in to you:&quot; for he didn\'t know that she was his daughter-in-law. She said, &quot;What will you give me, that you may come in to me?&quot;";
vul[16] = "ingrediensque ad eam ait dimitte me ut coeam tecum nesciebat enim quod nurus sua esset qua respondente quid mihi dabis ut fruaris concubitu meo";
kjv[17] = "And he said, I will send [thee] a kid from the flock. And she said, Wilt thou give [me] a pledge, till thou send [it]?";
rsv[17] = "He answered, &quot;I will send you a kid from the flock.&quot; And she said, &quot;Will you give me a pledge, till you send it?&quot;";
asv[17] = "And he said, I will send thee a kid of the goats from the flock. And she said, Wilt thou give me a pledge, till thou send it?";
yng[17] = "and he saith, `I -- I send a kid of the goats from the flock.\' And she saith, `Dost thou give a pledge till thou send [it]?\'";
dby[17] = "And he said, I will send [thee] a kid of the goats from the flock. And she said, Wilt thou give [me] a pledge, until thou send it?";
web[17] = "And he said, I will send [thee] a kid from the flock: and she said, Wilt thou give [me] a pledge, till thou sendest [it]?";
hnv[17] = "He said, &quot;I will send you a kid of the goats from the flock.&quot; She said, &quot;Will you give me a pledge, until you send it?&quot;";
vul[17] = "dixit mittam tibi hedum de gregibus rursum illa dicente patiar quod vis si dederis mihi arrabonem donec mittas quod polliceris";
kjv[18] = "And he said, What pledge shall I give thee? And she said, Thy signet, and thy bracelets, and thy staff that [is] in thine hand. And he gave [it] her, and came in unto her, and she conceived by him.";
rsv[18] = "He said, &quot;What pledge shall I give you?&quot; She replied, &quot;Your signet and your cord, and your staff that is in your hand.&quot; So he gave them to her, and went in to her, and she conceived by him.";
asv[18] = "And he said, What pledge shall I give thee? And she said, Thy signet and thy cord, and thy staff that is in thy hand. And he gave them to her, and came in unto her, and she conceived by him.";
yng[18] = "and he saith, `What [is] the pledge that I give to thee?\' and she saith, `Thy seal, and thy ribbon, and thy staff which [is] in thy hand;\' and he giveth to her, and goeth in unto her, and she conceiveth to him;";
dby[18] = "And he said, What pledge shall I give thee? And she said, Thy signet, and thy lace, and thy staff which is in thy hand. And he gave [it] her, and went in to her; and she conceived by him.";
web[18] = "And he said, What pledge shall I give thee? and she said, Thy signet, and thy bracelets, and thy staff that [is] in thy hand: and he gave [them to] her, and came in to her, and she conceived by him.";
hnv[18] = "He said, &quot;What pledge will I give you?&quot; She said, &quot;Your signet and your cord, and your staff that is in your hand.&quot; He gave them to her, and came in to her, and she conceived by him.";
vul[18] = "ait Iudas quid vis tibi pro arrabone dari respondit anulum tuum et armillam et baculum quem manu tenes ad unum igitur coitum concepit mulier";
kjv[19] = "And she arose, and went away, and laid by her vail from her, and put on the garments of her widowhood.";
rsv[19] = "Then she arose and went away, and taking off her veil she put on the garments of her widowhood.";
asv[19] = "And she arose, and went away, and put off her veil from her, and put on the garments of her widowhood.";
yng[19] = "and she riseth, and goeth, and turneth aside her vail from off her, and putteth on the garments of her widowhood.";
dby[19] = "And she arose and went away; and she laid by her veil from her, and put on the garments of her widowhood.";
web[19] = "And she arose and went her way and laid by her vail from her, and put on the garments of her widowhood.";
hnv[19] = "She arose, and went away, and put off her veil from her, and put on the garments of her widowhood.";
vul[19] = "et surgens abiit depositoque habitu quem adsumpserat induta est viduitatis vestibus";
kjv[20] = "And Judah sent the kid by the hand of his friend the Adullamite, to receive [his] pledge from the woman\'s hand: but he found her not.";
rsv[20] = "When Judah sent the kid by his friend the Adullamite, to receive the pledge from the woman\'s hand, he could not find her.";
asv[20] = "And Judah sent the kid of the goats by the hand of his friend the Adullamite, to receive the pledge from the woman\'s hand: but he found her not.";
yng[20] = "And Judah sendeth the kid of the goats by the hand of his friend the Adullamite, to receive the pledge from the hand of the woman, and he hath not found her.";
dby[20] = "And Judah sent the kid of the goats by the hand of his friend the Adullamite, to receive the pledge from the woman\'s hand; but he found her not.";
web[20] = "And Judah sent the kid by the hand of his friend the Adullamite, to receive [his] pledge from the woman\'s hand: but he found her not.";
hnv[20] = "Yehudah sent the kid of the goats by the hand of his friend, the `Adullami, to receive the pledge from the woman\'s hand, but he didn\'t find her.";
vul[20] = "misit autem Iudas hedum per pastorem suum Odollamitem ut reciperet pignus quod dederat mulieri qui cum non invenisset eam";
kjv[21] = "Then he asked the men of that place, saying, Where [is] the harlot, that [was] openly by the way side? And they said, There was no harlot in this [place].";
rsv[21] = "And he asked the men of the place, &quot;Where is the harlot who was at Enaim by the wayside?&quot; And they said, &quot;No harlot has been here.&quot;";
asv[21] = "Then he asked the men of her place, saying, Where is the prostitute, that was at Enaim by the wayside? And they said, There hath been no prostitute here.";
yng[21] = "And he asketh the men of her place, saying, `Where [is] the separated one -- she in Enayim, by the way?\' and they say, `There hath not been in this [place] a separated one.\'";
dby[21] = "And he asked the men of her place, saying, Where is the prostitute that was at Enaim, by the way-side? And they said, There was no prostitute here.";
web[21] = "Then he asked the men of that place, saying, where [is] the harlot that [was] openly by the way-side? and they said, There was no harlot in this [place].";
hnv[21] = "Then he asked the men of her place, saying, &quot;Where is the prostitute, that was at `Enayim by the road?&quot; They said, &quot;There has been no prostitute here.&quot;";
vul[21] = "interrogavit homines loci illius ubi est mulier quae sedebat in bivio respondentibus cunctis non fuit in loco isto meretrix";
kjv[22] = "And he returned to Judah, and said, I cannot find her; and also the men of the place said, [that] there was no harlot in this [place].";
rsv[22] = "So he returned to Judah, and said, &quot;I have not found her; and also the men of the place said, \'No harlot has been here.\'&quot;";
asv[22] = "And he returned to Judah, and said, I have not found her; and also the men of the place said, There hath been no prostitute here.";
yng[22] = "And he turneth back unto Judah, and saith, `I have not found her; and the men of the place also have said, There hath not been in this [place] a separated one,\'";
dby[22] = "And he returned to Judah, and said, I have not found her; and also the men of the place said, No prostitute has been here.";
web[22] = "And he returned to Judah, and said, I cannot find her; and also the men of the place said, [that] there was no harlot in this [place].";

rsv[23] = "And Judah replied, &quot;Let her keep the things as her own, lest we be laughed at; you see, I sent this kid, and you could not find her.&quot;";
asv[23] = "And Judah said, Let her take it to her, lest we be put to shame: behold, I sent this kid, and thou hast not found her.";
yng[23] = "and Judah saith, `Let her take to herself, lest we become despised; lo, I sent this kid, and thou hast not found her.\'";

kjv[24] = "And it came to pass about three months after, that it was told Judah, saying, Tamar thy daughter in law hath played the harlot; and also, behold, she [is] with child by whoredom. And Judah said, Bring her forth, and let her be burnt.";
rsv[24] = "About three months later Judah was told, &quot;Tamar your daughter-in-law has played the harlot; and moreover she is with child by harlotry.&quot; And Judah said, &quot;Bring her out, and let her be burned.&quot;";
asv[24] = "And it came to pass about three months after, that it was told Judah, saying, Tamar thy daughter-in-law hath played the harlot; and moreover, behold, she is with child by whoredom. And Judah said, Bring her forth, and let her be burnt.";
yng[24] = "And it cometh to pass about three months [after], that it is declared to Judah, saying, `Tamar thy daughter-in-law hath committed fornication; and also, lo, she hath conceived by fornication:\' and Judah saith, `Bring her out -- and she is burnt.\'";
dby[24] = "And it came to pass about three months after, that it was told Judah, saying, Tamar thy daughter-in-law has committed fornication, and behold, she is also with child by fornication. And Judah said, Bring her forth, that she may be burned.";
web[24] = "And it came to pass about three months after, that it was told to Judah, saying, Tamar thy daughter-in-law hath played the harlot; and also, behold she [is] with child by lewdness: and Judah said, Bring her forth, and let her be burnt.";
hnv[24] = "It happened about three months later, that it was told Yehudah, saying, &quot;Tamar, your daughter-in-law, has played the prostitute; and moreover, behold, she is with child by prostitution.&quot; Yehudah said, &quot;Bring her forth, and let her be burnt.&quot;";
vul[24] = "ecce autem post tres menses nuntiaverunt Iudae dicentes fornicata est Thamar nurus tua et videtur uterus illius intumescere dixit Iudas producite eam ut conburatur";
kjv[25] = "When she [was] brought forth, she sent to her father in law, saying, By the man, whose these [are, am] I with child: and she said, Discern, I pray thee, whose [are] these, the signet, and bracelets, and staff.";
rsv[25] = "As she was being brought out, she sent word to her father-in-law, &quot;By the man to whom these belong, I am with child.&quot; And she said, &quot;Mark, I pray you, whose these are, the signet and the cord and the staff.&quot;";
asv[25] = "When she was brought forth, she sent to her father-in-law, saying, By the man, whose these are, am I with child: and she said, Discern, I pray thee, whose are these, the signet, and the cords, and the staff.";
yng[25] = "She is brought out, and she hath sent unto her husband\'s father, saying, `To a man whose these [are], I [am] pregnant;\' and she saith, `Discern, I pray thee, whose [are] these -- the seal, and the ribbons, and the staff.\'";
dby[25] = "When she was brought forth, she sent to her father-in-law, saying, By the man to whom these [belong] am I with child; and she said, Acknowledge, I pray thee, whose are this signet, and this lace, and this staff.";
web[25] = "When she [was] brought forth, she sent to her father-in-law, saying, By the man whose these [are], am I with child: and she said, Discern, I pray thee, whose [are] these, the signet, and bracelets, and staff.";
hnv[25] = "When she was brought forth, she sent to her father-in-law, saying, &quot;By the man, whose these are, I am with child.&quot; She also said, &quot;Please discern whose are these - the signet, and the cords, and the staff.&quot;";
vul[25] = "quae cum educeretur ad poenam misit ad socerum suum dicens de viro cuius haec sunt concepi cognosce cuius sit anulus et armilla et baculus";
kjv[26] = "And Judah acknowledged [them], and said, She hath been more righteous than I; because that I gave her not to Shelah my son. And he knew her again no more.";
rsv[26] = "Then Judah acknowledged them and said, &quot;She is more righteous than I, inasmuch as I did not give her to my son Shelah.&quot; And he did not lie with her again.";
asv[26] = "And Judah acknowledged them, and said, She is more righteous than I, forasmuch as I gave her not to Shelah my son. And he knew her again no more.";
yng[26] = "And Judah discerneth and saith, `She hath been more righteous than I, because that I did not give her to Shelah my son;\' and he hath not added to know her again.";
dby[26] = "And Judah acknowledged [them], and said, She is more righteous than I, because I have not given her to Shelah my son. And he knew her again no more.";

hnv[26] = "Yehudah acknowledged them, and said, &quot;She is more righteous than I, because I didn\'t give her to Shelach, my son.&quot; He knew her again no more.";
vul[26] = "qui agnitis muneribus ait iustior me est quia non tradidi eam Sela filio meo attamen ultra non cognovit illam";
kjv[27] = "And it came to pass in the time of her travail, that, behold, twins [were] in her womb.";
rsv[27] = "When the time of her delivery came, there were twins in her womb.";
asv[27] = "And it came to pass in the time of her travail, that, behold, twins were in her womb.";
yng[27] = "And it cometh to pass in the time of her bearing, that lo, twins [are] in her womb;";
dby[27] = "And it came to pass at the time of her delivery, that behold, twins were in her womb.";
web[27] = "And it came to pass in the time of her travail, that behold, twins [were] in her womb.";
hnv[27] = "It happened in the time of her travail, that behold, twins were in her womb.";
vul[27] = "instante autem partu apparuerunt gemini in utero atque in ipsa effusione infantum unus protulit manum in qua obsetrix ligavit coccinum dicens";
kjv[28] = "And it came to pass, when she travailed, that [the one] put out [his] hand: and the midwife took and bound upon his hand a scarlet thread, saying, This came out first.";
rsv[28] = "And when she was in labor, one put out a hand; and the midwife took and bound on his hand a scarlet thread, saying, &quot;This came out first.&quot;";
asv[28] = "And it came to pass, when she travailed, that one put out a hand: and the midwife took and bound upon his hand a scarlet thread, saying, This came out first.";
yng[28] = "and it cometh to pass in her bearing, that [one] giveth out a hand, and the midwife taketh and bindeth on his hand a scarlet thread, saying, `This hath come out first.\'";
dby[28] = "And it came to pass when she brought forth, that one stretched out [his] hand, and the midwife took it and bound round his hand a scarlet thread, saying, This came out first.";
web[28] = "And it came to pass when she travailed, that [the one] put out [his] hand; and the midwife took and bound upon his hand a scarlet thread, saying, This came out first.";

kjv[29] = "And it came to pass, as he drew back his hand, that, behold, his brother came out: and she said, How hast thou broken forth? [this] breach [be] upon thee: therefore his name was called Pharez.";
rsv[29] = "But as he drew back his hand, behold, his brother came out; and she said, &quot;What a breach you have made for yourself!&quot; Therefore his name was called Perez.";
asv[29] = "And it came to pass, as he drew back his hand, that, behold, his brother came out: and she said, Wherefore hast thou made a breach for thyself? Therefore his name was called Perez.";
yng[29] = "And it cometh to pass as he draweth back his hand, that lo, his brother hath come out, and she saith, `What! thou hast broken forth -- on thee [is] the breach;\' and he calleth his name Pharez;";
dby[29] = "And it came to pass as he drew back his hand, that behold, his brother came out; and she said, How hast thou broken forth! on thee be the breach! And they called his name Pherez.";
web[29] = "And it came to pass as he drew back his hand, that behold, his brother came out; and she said, How hast thou broken forth? [this] breach [be] upon thee: therefore his name was called Pharez.";
hnv[29] = "It happened, as he drew back his hand, that behold, his brother came out, and she said, &quot;Why have you made a breach for yourself?&quot; Therefore his name was called Peretz.";

dby[30] = "And afterwards came out his brother, round whose hand was the scarlet thread; and they called his name Zerah.";
web[30] = "And afterwards came out his brother that had the scarlet thread upon his hand; and his name was called Zarah.";
hnv[30] = "Afterward his brother came out, that had the scarlet thread on his hand, and his name was called Zerach.";

csb[1] = "At that time Judah left his brothers and settled near an Adullamite named Hirah.";
csb[2] = "There Judah saw the daughter of a Canaanite named Shua; he took her as a wife and slept with her.";
csb[3] = "She conceived and gave birth to a son, and he named him Er.";
csb[4] = "She conceived again, gave birth to a son, and named him Onan.";
csb[5] = "She gave birth to another son and named him Shelah. It was at Chezib that she gave birth to him.";
csb[6] = "Judah got a wife for Er, his firstborn, and her name was Tamar.";
csb[7] = "Now Er, Judah\'s firstborn, was evil in the LORD\'s sight, and the LORD put him to death.";
csb[8] = "Then Judah said to Onan, &quot;Sleep with your brother\'s wife. Perform your duty as her brother-in-law and produce offspring for your brother.&quot;";
csb[9] = "But Onan knew that the offspring would not be his, so whenever he slept with his brother\'s wife, he released his semen on the ground so that he would not produce offspring for his brother.";
csb[10] = "What he did was evil in the LORD\'s sight, so he put him to death also.";
csb[11] = "Then Judah said to his daughter-in-law Tamar, &quot;Remain a widow in your father\'s house until my son Shelah grows up.&quot; For he thought, &quot;He might die too, like his brothers.&quot; So Tamar went to live in her father\'s house.";
csb[12] = "After a long time Judah\'s wife, the daughter of Shua, died. When Judah had finished mourning, he and his friend Hirah the Adullamite went up to Timnah to his sheepshearers.";
csb[13] = "Tamar was told, &quot;Your father-in-law is going up to Timnah to shear his sheep.&quot;";
csb[14] = "So she took off her widow\'s clothes, veiled her face, covered herself, and sat at the entrance to Enaim, which is on the way to Timnah. For she saw that, though Shelah had grown up, she had not been given to him as a wife.";
csb[15] = "When Judah saw her, he thought she was a prostitute, for she had covered her face.";
csb[16] = "He went over to her and said, &quot;Come, let me sleep with you,&quot; for he did not know that she was his daughter-in-law. She said, &quot;What will you give me for sleeping with me? &quot;";
csb[17] = "&quot;I will send you a young goat from my flock,&quot; he replied. But she said, &quot;Only if you leave something with me until you send it.&quot;";
csb[18] = "&quot;What should I give you? &quot; he asked. She answered, &quot;Your signet ring, your cord, and the staff in your hand.&quot; So he gave them to her and slept with her, and she became pregnant by him.";
csb[19] = "She got up and left, then removed her veil and put her widow\'s clothes back on.";
csb[20] = "When Judah sent the young goat by his friend the Adullamite in order to get back the items he had left with the woman, he could not find her.";
csb[21] = "He asked the men of the place, &quot;Where is the cult prostitute who was beside the road at Enaim? &quot; &quot;There has been no cult prostitute here,&quot; they answered.";
csb[22] = "So the Adullamite returned to Judah, saying, &quot;I couldn\'t find her, and besides, the men of the place said, \'There has been no cult prostitute here.\' &quot;";
csb[23] = "Judah replied, &quot;Let her keep the items for herself; otherwise we will become a laughingstock. After all, I did send this young goat, but you couldn\'t find her.&quot;";
csb[24] = "About three months later Judah was told, &quot;Your daughter-in-law, Tamar, has been acting like a prostitute, and now she is pregnant.&quot; &quot;Bring her out,&quot; Judah said, &quot;and let her be burned to death! &quot;";
csb[25] = "As she was being brought out, she sent her father-in-law this message: &quot;I am pregnant by the man to whom these items belong.&quot; And she added, &quot;Examine them. Whose signet ring, cord, and staff are these? &quot;";
csb[26] = "Judah recognized them and said, &quot;She is more in the right than I, since I did not give her to my son Shelah.&quot; And he did not know her intimately again.";
csb[27] = "When the time came for her to give birth, there were twins in her womb.";
csb[28] = "As she was giving birth, one of them put out his hand, and the midwife took it and tied a scarlet thread around it, announcing, &quot;This one came out first.&quot;";
csb[29] = "But then he pulled his hand back, out came his brother, and she said, &quot;What a breakout you have made for yourself! &quot; So he was named Perez.";
csb[30] = "Then his brother, who had the scarlet thread tied to his hand, came out, and was named Zerah.";
