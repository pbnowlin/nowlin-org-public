hnv[25] = "The first came out red all over, like a hairy garment. They named him Esav.";

kjv[26] = "And after that came his brother out, and his hand took hold on Esau\'s heel; and his name was called Jacob: and Isaac [was] threescore years old when she bare them.";
rsv[26] = "Afterward his brother came forth, and his hand had taken hold of Esau\'s heel; so his name was called Jacob. Isaac was sixty years old when she bore them.";
asv[26] = "And after that came forth his brother, and his hand had hold on Esau\'s heel; and his name was called Jacob: and Isaac was threescore years old when she bare them.";
yng[26] = "and afterwards hath his brother come out, and his hand is taking hold on Esau\'s heel, and one calleth his name Jacob; and Isaac [is] a son of sixty years in her bearing them.";
dby[26] = "And after that came his brother out; and his hand took hold of Esau\'s heel; and his name was called Jacob. And Isaac was sixty years old when they were born.";
web[26] = "And after that his brother was born, and his hand took hold on Esau\'s heel; and his name was called Jacob: and Isaac [was] sixty years old when she bore them.";
hnv[26] = "After that, his brother came out, and his hand had hold on Esav\'s heel. He was named Ya`akov. Yitzchak was sixty years old when she bore them.";
vul[26] = "sexagenarius erat Isaac quando nati sunt parvuli";
kjv[27] = "And the boys grew: and Esau was a cunning hunter, a man of the field; and Jacob [was] a plain man, dwelling in tents.";
rsv[27] = "When the boys grew up, Esau was a skilful hunter, a man of the field, while Jacob was a quiet man, dwelling in tents.";
asv[27] = "And the boys grew: and Esau was a skilful hunter, a man of the field; and Jacob was a quiet man, dwelling in tents.";
yng[27] = "And the youths grew, and Esau is a man acquainted [with] hunting, a man of the field; and Jacob [is] a plain man, inhabiting tents;";
dby[27] = "And the boys grew, and Esau became a man skilled in hunting, a man of the field; and Jacob was a homely man, dwelling in tents.";
web[27] = "And the boys grew: and Esau was a skillful hunter, a man of the field; and Jacob [was] a plain man dwelling in tents.";
hnv[27] = "The boys grew. Esav was a skillful hunter, a man of the field. Ya`akov was a quiet man, living in tents.";
vul[27] = "quibus adultis factus est Esau vir gnarus venandi et homo agricola Iacob autem vir simplex habitabat in tabernaculis";
kjv[28] = "And Isaac loved Esau, because he did eat of [his] venison: but Rebekah loved Jacob.";
rsv[28] = "Isaac loved Esau, because he ate of his game; but Rebekah loved Jacob.";
asv[28] = "Now Isaac loved Esau, because he did eat of his venison: and Rebekah loved Jacob.";
yng[28] = "and Isaac loveth Esau, for [his] hunting [is] in his mouth; and Rebekah is loving Jacob.";
dby[28] = "And Isaac loved Esau, because venison was to his taste; and Rebecca loved Jacob.";
web[28] = "And Isaac loved Esau, because he ate of [his] venison: but Rebekah loved Jacob.";
hnv[28] = "Now Yitzchak loved Esav, because he ate his venison. Rivka loved Ya`akov.";
vul[28] = "Isaac amabat Esau eo quod de venationibus illius vesceretur et Rebecca diligebat Iacob";
kjv[29] = "And Jacob sod pottage: and Esau came from the field, and he [was] faint:";
rsv[29] = "Once when Jacob was boiling pottage, Esau came in from the field, and he was famished.";
asv[29] = "And Jacob boiled pottage: and Esau came in from the field, and he was faint:";
yng[29] = "And Jacob boileth pottage, and Esau cometh in from the field, and he [is] weary;";
dby[29] = "And Jacob had cooked a dish; and Esau came from the field, and he was faint.";
web[29] = "And Jacob boiled pottage: and Esau came from the field, and he [was] faint.";
hnv[29] = " Ya`akov boiled stew. Esav came in from the field, and he was famished.";
vul[29] = "coxit autem Iacob pulmentum ad quem cum venisset Esau de agro lassus";
kjv[30] = "And Esau said to Jacob, Feed me, I pray thee, with that same red [pottage]; for I [am] faint: therefore was his name called Edom.";
rsv[30] = "And Esau said to Jacob, &quot;Let me eat some of that red pottage, for I am famished!&quot; (Therefore his name was called Edom.)";
asv[30] = "and Esau said to Jacob, Feed me, I pray thee, with that same red [pottage]; for I am faint: therefore was his name called Edom.";
yng[30] = "and Esau saith unto Jacob, `Let me eat, I pray thee, some of this red red thing, for I [am] weary;\' therefore hath [one] called his name Edom [Red];";
dby[30] = "And Esau said to Jacob, Feed me, I pray thee, with the red -- the red thing there, for I am faint. Therefore was his name called Edom.";
web[30] = "And Esau said to Jacob, Feed me, I pray thee, with that same red [pottage]; for I [am] faint: therefore was his name called Edom.";
hnv[30] = "Esav said to Ya`akov, &quot;Please feed me with that same red stew, for I am famished.&quot; Therefore his name was called Edom.";
vul[30] = "ait da mihi de coctione hac rufa quia oppido lassus sum quam ob causam vocatum est nomen eius Edom";
kjv[31] = "And Jacob said, Sell me this day thy birthright.";
rsv[31] = "Jacob said, &quot;First sell me your birthright.&quot;";
asv[31] = "And Jacob said, Sell me first thy birthright.";
yng[31] = "and Jacob saith, `Sell to-day thy birthright to me.\'";
dby[31] = "And Jacob said, Sell me now thy birthright.";
web[31] = "And Jacob said, Sell to me this day thy birth-right.";
hnv[31] = "Ya`akov said, &quot;First, sell me your birthright.&quot;";
vul[31] = "cui dixit Iacob vende mihi primogenita tua";
kjv[32] = "And Esau said, Behold, I [am] at the point to die: and what profit shall this birthright do to me?";
rsv[32] = "Esau said, &quot;I am about to die; of what use is a birthright to me?&quot;";
asv[32] = "And Esau said, Behold, I am about to die: and what profit shall the birthright do to me?";
yng[32] = "And Esau saith, `Lo, I am going to die, and what is this to me -- birthright?\'";
dby[32] = "And Esau said, Behold, I am going to die, and of what use can the birthright be to me?";
web[32] = "And Esau said, Behold, I [am] at the point to die: and what profit shall this birth-right bring to me?";
hnv[32] = "Esav said, &quot;Behold, I am about to die. What good is the birthright to me?&quot;";
vul[32] = "ille respondit en morior quid mihi proderunt primogenita";
kjv[33] = "And Jacob said, Swear to me this day; and he sware unto him: and he sold his birthright unto Jacob.";
rsv[33] = "Jacob said, &quot;Swear to me first.&quot; So he swore to him, and sold his birthright to Jacob.";
asv[33] = "And Jacob said, Swear to me first; and he sware unto him: and he sold his birthright unto Jacob.";
yng[33] = "and Jacob saith, `Swear to me to-day:\' and he sweareth to him, and selleth his birthright to Jacob;";
dby[33] = "And Jacob said, Swear unto me now. And he swore unto him, and sold his birthright to Jacob.";
web[33] = "And Jacob said, Swear to me this day; and he swore to him: and he sold his birth-right to Jacob.";
hnv[33] = "Ya`akov said, &quot;Swear to me first.&quot; He swore to him. He sold his birthright to Ya`akov.";
vul[33] = "ait Iacob iura ergo mihi iuravit Esau et vendidit primogenita";
kjv[34] = "Then Jacob gave Esau bread and pottage of lentiles; and he did eat and drink, and rose up, and went his way: thus Esau despised [his] birthright.";
rsv[34] = "Then Jacob gave Esau bread and pottage of lentils, and he ate and drank, and rose and went his way. Thus Esau despised his birthright.";
asv[34] = "And Jacob gave Esau bread and pottage of lentils; and he did eat and drink, and rose up, and went his way: so Esau despised his birthright.";
yng[34] = "and Jacob hath given to Esau bread and pottage of lentiles, and he eateth, and drinketh, and riseth, and goeth; and Esau despiseth the birthright.";
dby[34] = "And Jacob gave Esau bread and the dish of lentils; and he ate and drank, and rose up and went away. Thus Esau despised the birthright.";
web[34] = "Then Jacob gave Esau bread and pottage of lentiles; and he ate and drank, and rose and went his way: thus Esau despised [his] birth-right.";
hnv[34] = "Ya`akov gave Esav bread and stew of lentils. He ate and drank, rose up, and went his way. So Esav despised his birthright.";
vul[34] = "et sic accepto pane et lentis edulio comedit et bibit et abiit parvipendens quod primogenita vendidisset";
csb[1] = "Abraham had taken another wife, whose name was Keturah,";
csb[2] = "and she bore him Zimran, Jokshan, Medan, Midian, Ishbak, and Shuah.";
csb[3] = "Jokshan fathered Sheba and Dedan. Dedan\'s sons were the Asshurim, Letushim, and Leummim.";
csb[4] = "And Midian\'s sons were Ephah, Epher, Hanoch, Abida, and Eldaah. All these were sons of Keturah.";
csb[5] = "Abraham gave everything he owned to Isaac.";
csb[6] = "But Abraham gave gifts to the sons of his concubines, and while he was still alive he sent them eastward, away from his son Isaac, to the land of the East.";
csb[7] = "This is the length of Abraham\'s life: 175 years.";
csb[8] = "He took his last breath and died at a good old age, old and contented, and he was gathered to his people.";
csb[9] = "His sons Isaac and Ishmael buried him in the cave of Machpelah near Mamre, in the field of Ephron son of Zohar the Hethite.";
csb[10] = "This was the field that Abraham bought from the Hethites. Abraham was buried there with his wife Sarah.";
csb[11] = "After Abraham\'s death, God blessed his son Isaac, who lived near Beer-lahai-roi.";
csb[12] = "These are the family records of Abraham\'s son Ishmael, whom Hagar the Egyptian, Sarah\'s slave, bore to Abraham.";
csb[13] = "These are the names of Ishmael\'s sons; their names according to the family records are Nebaioth, Ishmael\'s firstborn, then Kedar, Adbeel, Mibsam,";
csb[14] = "Mishma, Dumah, Massa,";
csb[15] = "Hadad, Tema, Jetur, Naphish, and Kedemah.";
csb[16] = "These are Ishmael\'s sons, and these are their names by their settlements and encampments: twelve leaders of their clans.";
csb[17] = "This is the length of Ishmael\'s life: 137 years. He took his last breath and died, and was gathered to his people.";
csb[18] = "And they settled from Havilah to Shur, which is opposite Egypt as you go toward Asshur. He stayed near all his relatives.";
csb[19] = "These are the family records of Isaac son of Abraham. Abraham fathered Isaac.";
csb[20] = "Isaac was forty years old when he took as his wife Rebekah daughter of Bethuel the Aramean from Paddan-aram and sister of Laban the Aramean.";
csb[21] = "Isaac prayed to the LORD on behalf of his wife because she was childless. The LORD was receptive to his prayer, and his wife Rebekah conceived.";
csb[22] = "But the children inside her struggled with each other, and she said, &quot;Why is this happening to me? &quot; So she went to inquire of the LORD .";
csb[23] = "And the LORD said to her: Two nations are in your womb; two peoples will come from you and be separated. One people will be stronger than the other, and the older will serve the younger.";
csb[24] = "When her time came to give birth, there were indeed twins in her womb.";
csb[25] = "The first one came out red-looking, covered with hair like a fur coat, and they named him Esau.";
csb[26] = "After this, his brother came out grasping Esau\'s heel with his hand. So he was named Jacob. Isaac was sixty years old when they were born.";
csb[27] = "When the boys grew up, Esau became an expert hunter, an outdoorsman, but Jacob was a quiet man who stayed at home.";
csb[28] = "Isaac loved Esau because he had a taste for wild game, but Rebekah loved Jacob.";
csb[29] = "Once when Jacob was cooking a stew, Esau came in from the field exhausted.";
csb[30] = "He said to Jacob, &quot;Let me eat some of that red stuff, because I\'m exhausted.&quot; That is why he was also named Edom.";
csb[31] = "Jacob replied, &quot;First sell me your birthright.&quot;";
csb[32] = "&quot;Look,&quot; said Esau, &quot;I\'m about to die, so what good is a birthright to me? &quot;";
csb[33] = "Jacob said, &quot;Swear to me first.&quot; So he swore to Jacob and sold his birthright to him.";
csb[34] = "Then Jacob gave bread and lentil stew to Esau; he ate, drank, got up, and went away. So Esau despised his birthright.";
