csb[5] = "The king of Egypt\'s cupbearer and baker, who were confined in the prison, each had a dream. Both had a dream on the same night, and each dream had its own meaning.";
csb[6] = "When Joseph came to them in the morning, he saw that they looked distraught.";
csb[7] = "So he asked Pharaoh\'s officers who were in custody with him in his master\'s house, &quot;Why do you look so sad today? &quot;";
csb[8] = "&quot;We had dreams,&quot; they said to him, &quot;but there is no one to interpret them.&quot; Then Joseph said to them, &quot;Don\'t interpretations belong to God? Tell me your dreams.&quot;";
csb[9] = "So the chief cupbearer told his dream to Joseph: &quot;In my dream there was a vine in front of me.";
csb[10] = "&quot;On the vine were three branches. As soon as it budded, its blossoms came out and its clusters ripened into grapes.";
csb[11] = "&quot;Pharaoh\'s cup was in my hand, and I took the grapes, squeezed them into Pharaoh\'s cup, and placed the cup in Pharaoh\'s hand.&quot;";
csb[12] = "&quot;This is its interpretation,&quot; Joseph said to him. &quot;The three branches are three days.";
csb[13] = "&quot;In just three days Pharaoh will lift up your head and restore you to your position. You will put Pharaoh\'s cup in his hand the way you used to when you were his cupbearer.";
csb[14] = "&quot;But when all goes well for you, remember that I was with you. Please show kindness to me by mentioning me to Pharaoh, and get me out of this prison.";
csb[15] = "&quot;For I was kidnapped from the land of the Hebrews, and even here I have done nothing that they should put me in the dungeon.&quot;";
csb[16] = "When the chief baker saw that the interpretation was positive, he said to Joseph, &quot;I also had a dream. Three baskets of white bread were on my head.";
csb[17] = "&quot;In the top basket were all sorts of baked goods for Pharaoh, but the birds were eating them out of the basket on my head.&quot;";
csb[18] = "&quot;This is its interpretation,&quot; Joseph replied. &quot;The three baskets are three days.";
csb[19] = "&quot;In just three days Pharaoh will lift up your head -- from off you -- and hang you on a tree. Then the birds will eat the flesh from your body.&quot;";
csb[20] = "On the third day, which was Pharaoh\'s birthday, he gave a feast for all his servants. He elevated the chief cupbearer and the chief baker among his servants.";
csb[21] = "Pharaoh restored the chief cupbearer to his position as cupbearer, and he placed the cup in Pharaoh\'s hand.";
csb[22] = "But Pharaoh hanged the chief baker, just as Joseph had explained to them.";
csb[23] = "Yet the chief cupbearer did not remember Joseph; he forgot him.";
</script>
