csb[1] = "Now Sarah lived 127 years; these were all the years of her life.";
csb[2] = "Sarah died in Kiriath-arba (that is, Hebron) in the land of Canaan, and Abraham went to mourn for Sarah and to weep for her.";
csb[3] = "Then Abraham got up from beside his dead wife and spoke to the Hethites:";
csb[4] = "&quot;I am an alien residing among you. Give me burial property among you so that I can bury my dead.&quot;";
csb[5] = "The Hethites replied to Abraham,";
csb[6] = "&quot;Listen to us, my lord. You are a prince of God among us. Bury your dead in our finest burial place. None of us will withhold from you his burial place for burying your dead.&quot;";
csb[7] = "Then Abraham rose and bowed down to the Hethites, the people of the land.";
csb[8] = "He said to them, &quot;If you are willing for me to bury my dead, listen to me and ask Ephron son of Zohar on my behalf";
csb[9] = "&quot;to give me the cave of Machpelah that belongs to him; it is at the end of his field. Let him give it to me in your presence, for the full price, as burial property.&quot;";
csb[10] = "Ephron was sitting among the Hethites. So in the hearing of all the Hethites who came to the gate of his city, Ephron the Hethite answered Abraham:";
csb[11] = "&quot;No, my lord. Listen to me. I give you the field, and I give you the cave that is in it. I give it to you in the sight of my people. Bury your dead.&quot;";
csb[12] = "Abraham bowed down to the people of the land";
csb[13] = "and said to Ephron in the hearing of the people of the land, &quot;Listen to me, if you please. Let me pay the price of the field. Accept it from me, and let me bury my dead there.&quot;";
csb[14] = "Ephron answered Abraham and said to him,";
csb[15] = "&quot;My lord, listen to me. Land worth four hundred shekels of silver -- what is that between you and me? Bury your dead.&quot;";
csb[16] = "Abraham agreed with Ephron, and Abraham weighed out to Ephron the silver that he had agreed to in the hearing of the Hethites: four hundred standard shekels of silver.";
csb[17] = "So Ephron\'s field at Machpelah near Mamre -- the field with its cave and all the trees anywhere within the boundaries of the field -- became";
csb[18] = "Abraham\'s possession in the sight of all the Hethites who came to the gate of his city.";
csb[19] = "After this, Abraham buried his wife Sarah in the cave of the field at Machpelah near Mamre (that is, Hebron) in the land of Canaan.";
csb[20] = "The field with its cave passed from the Hethites to Abraham as burial property.";
