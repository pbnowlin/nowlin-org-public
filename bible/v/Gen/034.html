kjv[25] = "And it came to pass on the third day, when they were sore, that two of the sons of Jacob, Simeon and Levi, Dinah\'s brethren, took each man his sword, and came upon the city boldly, and slew all the males.";
rsv[25] = "On the third day, when they were sore, two of the sons of Jacob, Simeon and Levi, Dinah\'s brothers, took their swords and came upon the city unawares, and killed all the males.";
asv[25] = "And it came to pass on the third day, when they were sore, that two of the sons of Jacob, Simeon and Levi, Dinah\'s brethren, took each man his sword, and came upon the city unawares, and slew all the males.";
yng[25] = "And it cometh to pass, on the third day, in their being pained, that two of the sons of Jacob, Simeon and Levi, Dinah\'s brethren, take each his sword, and come in against the city confidently, and slay every male;";
dby[25] = "And it came to pass on the third day, when they were sore, that two of the sons of Jacob, Simeon and Levi, Dinah\'s brethren, took each his sword, and came upon the city boldly, and slew all the males.";
web[25] = "And it came to pass on the third day, when they were sore, that two of the sons of Jacob, Simeon and Levi, Dinah\'s brethren, took each man his sword, and came upon the city boldly, and slew all the males.";
hnv[25] = "It happened on the third day, when they were sore, that two of Ya`akov\'s sons, Shim`on and Levi, Dinah\'s brothers, each took his sword, came upon the unsuspecting city, and killed all the males.";
vul[25] = "et ecce die tertio quando gravissimus vulnerum dolor est arreptis duo Iacob filii Symeon et Levi fratres Dinae gladiis ingressi sunt urbem confidenter interfectisque omnibus masculis";
kjv[26] = "And they slew Hamor and Shechem his son with the edge of the sword, and took Dinah out of Shechem\'s house, and went out.";
rsv[26] = "They slew Hamor and his son Shechem with the sword, and took Dinah out of Shechem\'s house, and went away.";
asv[26] = "And they slew Hamor and Shechem his son with the edge of the sword, and took Dinah out of Shechem\'s house, and went forth.";
yng[26] = "and Hamor, and Shechem his son, they have slain by the mouth of the sword, and they take Dinah out of Shechem\'s house, and go out.";
dby[26] = "And Hamor and Shechem his son they slew with the edge of the sword; and took Dinah out of Shechem\'s house; and went out.";
web[26] = "And they slew Hamor and Shechem his son with the edge of the sword, and took Dinah out of Shechem\'s house, and went out.";
hnv[26] = "They killed Hamor and Shekhem, his son, with the edge of the sword, and took Dinah out of Shekhem\'s house, and went away.";
vul[26] = "Emor et Sychem pariter necaverunt tollentes Dinam de domo Sychem sororem suam";
kjv[27] = "The sons of Jacob came upon the slain, and spoiled the city, because they had defiled their sister.";
rsv[27] = "And the sons of Jacob came upon the slain, and plundered the city, because their sister had been defiled;";
asv[27] = "The sons of Jacob came upon the slain, and plundered the city, because they had defiled their sister.";
yng[27] = "Jacob\'s sons have come in upon the wounded, and they spoil the city, because they had defiled their sister;";
dby[27] = "The sons of Jacob came upon the slain, and plundered the city, because they had defiled their sister.";
web[27] = "The sons of Jacob came upon the slain, and spoiled the city; because they had defiled their sister.";
hnv[27] = "Ya`akov\'s sons came on the dead, and plundered the city, because they had defiled their sister.";
vul[27] = "quibus egressis inruerunt super occisos ceteri filii Iacob et depopulati sunt urbem in ultionem stupri";
kjv[28] = "They took their sheep, and their oxen, and their asses, and that which [was] in the city, and that which [was] in the field,";
rsv[28] = "they took their flocks and their herds, their asses, and whatever was in the city and in the field;";
asv[28] = "They took their flocks and their herds and their asses, and that which was in the city, and that which was in the field;";
yng[28] = "their flock and their herd, and their asses, and that which [is] in the city, and that which [is] in the field, have they taken;";
dby[28] = "Their sheep, and their oxen, and their asses, and what [was] in the city, and what [was] in the field they took;";
web[28] = "They took their sheep, and their oxen, and their asses, and that which [was] in the city, and that which [was] in the field.";
hnv[28] = "They took their flocks, their herds, their donkeys, that which was in the city, that which was in the field;";
vul[28] = "oves eorum et armenta et asinos cunctaque vastantes quae in domibus et in agris erant";
kjv[29] = "And all their wealth, and all their little ones, and their wives took they captive, and spoiled even all that [was] in the house.";
rsv[29] = "all their wealth, all their little ones and their wives, all that was in the houses, they captured and made their prey.";
asv[29] = "and all their wealth, and all their little ones and their wives, took they captive and made a prey, even all that was in the house.";
yng[29] = "and all their wealth, and all their infants, and their wives they have taken captive, and they spoil also all that [is] in the house.";
dby[29] = "and all their goods, and all their little ones, and their wives took they captive, and plundered them, and all that was in the houses.";
web[29] = "And all their wealth, and all their little ones, and their wives they took captive, and spoiled even all that [was] in the house.";
hnv[29] = "and all their wealth. They took captive all their little ones and their wives, and took as plunder everything that was in the house.";
vul[29] = "parvulos quoque et uxores eorum duxere captivas";
kjv[30] = "And Jacob said to Simeon and Levi, Ye have troubled me to make me to stink among the inhabitants of the land, among the Canaanites and the Perizzites: and I [being] few in number, they shall gather themselves together against me, and slay me; and I shall be destroyed, I and my house.";
rsv[30] = "Then Jacob said to Simeon and Levi, &quot;You have brought trouble on me by making me odious to the inhabitants of the land, the Canaanites and the Per\'izzites; my numbers are few, and if they gather themselves against me and attack me, I shall be destroyed, both I and my household.&quot;";
asv[30] = "And Jacob said to Simeon and Levi, Ye have troubled me, to make me odious to the inhabitants of the land, among the Canaanites and the Perizzites: and, I being few in number, they will gather themselves together against me and smite me; and I shall be destroyed, I and my house.";
yng[30] = "And Jacob saith unto Simeon and unto Levi, `Ye have troubled me, by causing me to stink among the inhabitants of the land, among the Canaanite, and among the Perizzite: and I [am] few in number, and they have been gathered against me, and have smitten me, and I have been destroyed, I and my house.\'";
dby[30] = "And Jacob said to Simeon and Levi, Ye have troubled me, in that ye make me odious among the inhabitants of the land -- among the Canaanites and the Perizzites; and I am few men in number, and they will gather themselves against me and smite me, and I shall be destroyed, I and my house.";
web[30] = "And Jacob said to Simeon and Levi, Ye have troubled me to make me odious among the inhabitants of the land, among the Canaanites, and the Perizzites: and I [being] few in number, they will assemble themselves against me, and slay me, and I shall be destroyed, I and my house.";
hnv[30] = "Ya`akov said to Shim`on and Levi, &quot;You have troubled me, to make me odious to the inhabitants of the land, among the Kana`anim and the Perizzi. I am few in number. They will gather themselves together against me and strike me, and I will be destroyed, I and my house.&quot;";
vul[30] = "quibus patratis audacter Iacob dixit ad Symeon et Levi turbastis me et odiosum fecistis Chananeis et Ferezeis habitatoribus terrae huius nos pauci sumus illi congregati percutient me et delebor ego et domus mea";
kjv[31] = "And they said, Should he deal with our sister as with an harlot?";
rsv[31] = "But they said, &quot;Should he treat our sister as a harlot?&quot;";
asv[31] = "And they said, Should he deal with our sister as with a harlot?";
yng[31] = "And they say, `As a harlot doth he make our sister?\'";
dby[31] = "And they said, Should people deal with our sister as with a harlot?";
web[31] = "And they said, Should he deal with our sister, as with a harlot?";
hnv[31] = "They said, &quot;Should he deal with our sister as with a prostitute?&quot;";
vul[31] = "responderunt numquid ut scorto abuti debuere sorore nostra";
csb[1] = "Leah\'s daughter Dinah, whom Leah bore to Jacob, went out to see some of the young women of the area.";
csb[2] = "When Shechem -- son of Hamor the Hivite, who was the region\'s chieftain -- saw her, he took her and raped her.";
csb[3] = "He became infatuated with Jacob\'s daughter Dinah. He loved the young girl and spoke tenderly to her.";
csb[4] = "&quot;Get me this girl as a wife,&quot; he told his father.";
csb[5] = "Jacob heard that Shechem had defiled his daughter Dinah, but since his sons were with his livestock in the field, he remained silent until they returned.";
csb[6] = "Meanwhile, Shechem\'s father Hamor came to speak with Jacob.";
csb[7] = "Jacob\'s sons returned from the field when they heard about the incident and were deeply grieved and very angry. For Shechem had committed an outrage against Israel by raping Jacob\'s daughter, and such a thing should not be done.";
csb[8] = "Hamor said to Jacob\'s sons, &quot;My son Shechem has his heart set on your daughter. Please give her to him as a wife.";
csb[9] = "&quot;Intermarry with us; give your daughters to us, and take our daughters for yourselves.";
csb[10] = "&quot;Live with us. The land is before you. Settle here, move about, and acquire property in it.&quot;";
csb[11] = "Then Shechem said to Dinah\'s father and brothers, &quot;Grant me this favor, and I\'ll give you whatever you say.";
csb[12] = "&quot;Demand of me a high compensation and gift; I\'ll give you whatever you ask me. Just give the girl to be my wife! &quot;";
csb[13] = "But Jacob\'s sons answered Shechem and his father Hamor deceitfully because he had defiled their sister Dinah.";
csb[14] = "&quot;We cannot do this thing,&quot; they said to them. &quot;Giving our sister to an uncircumcised man is a disgrace to us.";
csb[15] = "&quot;We will agree with you only on this condition: if all your males are circumcised as we are.";
csb[16] = "&quot;Then we will give you our daughters, take your daughters for ourselves, live with you, and become one people.";
csb[17] = "&quot;But if you will not listen to us and be circumcised, then we will take our daughter and go.&quot;";
csb[18] = "Their words seemed good to Hamor and his son Shechem.";
csb[19] = "The young man did not delay doing this, because he was delighted with Jacob\'s daughter. Now he was the most important in all his father\'s family.";
csb[20] = "So Hamor and his son Shechem went to the gate of their city and spoke to the men of their city.";
csb[21] = "&quot;These men are peaceful toward us,&quot; they said. &quot;Let them live in our land and move about in it, for indeed, the region is large enough for them. Let us take their daughters as our wives and give our daughters to them.";
csb[22] = "&quot;But the men will agree to live with us and be one people only on this condition: if all our men are circumcised as they are.";
csb[23] = "&quot;Won\'t their livestock, their possessions, and all their animals become ours? Only let us agree with them, and they will live with us.&quot;";
csb[24] = "All the men who had come to the city gates listened to Hamor and his son Shechem, and all those men were circumcised.";
csb[25] = "On the third day, when they were still in pain, two of Jacob\'s sons, Simeon and Levi, Dinah\'s brothers, took their swords, went into the unsuspecting city, and killed every male.";
csb[26] = "They killed Hamor and his son Shechem with their swords, took Dinah from Shechem\'s house, and went away.";
csb[27] = "Jacob\'s sons came to the slaughter and plundered the city because their sister had been defiled.";
csb[28] = "They took their flocks, herds, donkeys, and whatever was in the city and in the field.";
csb[29] = "They captured all their possessions, dependents, and wives and plundered everything in the houses.";
csb[30] = "Then Jacob said to Simeon and Levi, &quot;You have brought trouble on me, making me odious to the inhabitants of the land, the Canaanites and the Perizzites. We are few in number; if they unite against me and attack me, I and my household will be destroyed.&quot;";
csb[31] = "But they answered, &quot;Should he treat our sister like a prostitute? &quot;";
</script>
