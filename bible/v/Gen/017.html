csb[1] = "When Abram was ninety-nine years old, the LORD appeared to him, saying, &quot;I am God Almighty. Live in my presence and be blameless.";
csb[2] = "&quot;I will set up my covenant between me and you, and I will multiply you greatly.&quot;";
csb[3] = "Then Abram fell facedown and God spoke with him:";
csb[4] = "&quot;As for me, here is my covenant with you: You will become the father of many nations.";
csb[5] = "&quot;Your name will no longer be Abram; your name will be Abraham, for I will make you the father of many nations.";
csb[6] = "&quot;I will make you extremely fruitful and will make nations and kings come from you.";
csb[7] = "&quot;I will confirm my covenant that is between me and you and your future offspring throughout their generations. It is a permanent covenant to be your God and the God of your offspring after you.";
csb[8] = "&quot;And to you and your future offspring I will give the land where you are residing -- all the land of Canaan -- as a permanent possession, and I will be their God.&quot;";
csb[9] = "God also said to Abraham, &quot;As for you, you and your offspring after you throughout their generations are to keep my covenant.";
csb[10] = "&quot;This is my covenant between me and you and your offspring after you, which you are to keep: Every one of your males must be circumcised.";
csb[11] = "&quot;You must circumcise the flesh of your foreskin to serve as a sign of the covenant between me and you.";
csb[12] = "&quot;Throughout your generations, every male among you is to be circumcised at eight days old -- every male born in your household or purchased from any foreigner and not your offspring.";
csb[13] = "&quot;Whether born in your household or purchased, he must be circumcised. My covenant will be marked in your flesh as a permanent covenant.";
csb[14] = "&quot;If any male is not circumcised in the flesh of his foreskin, that man will be cut off from his people; he has broken my covenant.&quot;";
csb[15] = "God said to Abraham, &quot;As for your wife Sarai, do not call her Sarai, for Sarah will be her name.";
csb[16] = "&quot;I will bless her; indeed, I will give you a son by her. I will bless her, and she will produce nations; kings of peoples will come from her.&quot;";
csb[17] = "Abraham fell facedown. Then he laughed and said to himself, &quot;Can a child be born to a hundred-year-old man? Can Sarah, a ninety-year-old woman, give birth? &quot;";
csb[18] = "So Abraham said to God, &quot;If only Ishmael were acceptable to you! &quot;";
csb[19] = "But God said, &quot;No. Your wife Sarah will bear you a son, and you will name him Isaac. I will confirm my covenant with him as a permanent covenant for his future offspring.";
csb[20] = "&quot;As for Ishmael, I have heard you. I will certainly bless him; I will make him fruitful and will multiply him greatly. He will father twelve tribal leaders, and I will make him into a great nation.";
csb[21] = "&quot;But I will confirm my covenant with Isaac, whom Sarah will bear to you at this time next year.&quot;";
csb[22] = "When he finished talking with him, God withdrew from Abraham.";
csb[23] = "So Abraham took his son Ishmael and those born in his household or purchased -- every male among the members of Abraham\'s household -- and he circumcised the flesh of their foreskin on that very day, just as God had said to him.";
