web[22] = "And the LORD God said, Behold, the man hath become as one of us, to know good and evil. And now, lest he should put forth his hand, and take also of the tree of life, and eat, and live for ever:";
hnv[22] = "The LORD God said, &quot;Behold, the man has become like one of us, knowing good and evil. Now, lest he put forth his hand, and also take of the tree of life, and eat, and live forever...&quot;";
vul[22] = "et ait ecce Adam factus est quasi unus ex nobis sciens bonum et malum nunc ergo ne forte mittat manum suam et sumat etiam de ligno vitae et comedat et vivat in aeternum";
kjv[23] = "Therefore the LORD God sent him forth from the garden of Eden, to till the ground from whence he was taken.";
rsv[23] = "therefore the LORD God sent him forth from the garden of Eden, to till the ground from which he was taken.";
asv[23] = "therefore Jehovah God sent him forth from the garden of Eden, to till the ground from whence he was taken.";
yng[23] = "Jehovah God sendeth him forth from the garden of Eden to serve the ground from which he hath been taken;";
dby[23] = "Therefore Jehovah Elohim sent him forth from the garden of Eden, to till the ground from which he was taken.";
web[23] = "Therefore the LORD God sent him forth from the garden of Eden, to till the ground from which he was taken.";
hnv[23] = " Therefore the LORD God sent him forth from the garden of `Eden, to till the ground from whence he was taken.";
vul[23] = "emisit eum Dominus Deus de paradiso voluptatis ut operaretur terram de qua sumptus est";
kjv[24] = "So he drove out the man; and he placed at the east of the garden of Eden Cherubims, and a flaming sword which turned every way, to keep the way of the tree of life.";
rsv[24] = "He drove out the man; and at the east of the garden of Eden he placed the cherubim, and a flaming sword which turned every way, to guard the way to the tree of life.";
asv[24] = "So he drove out the man; and he placed at the east of the garden of Eden the Cherubim, and the flame of a sword which turned every way, to keep the way of the tree of life.";
yng[24] = "yea, he casteth out the man, and causeth to dwell at the east of the garden of Eden the cherubs and the flame of the sword which is turning itself round to guard the way of the tree of life.";
dby[24] = "And he drove out Man; and he set the Cherubim, and the flame of the flashing sword, toward the east of the garden of Eden, to guard the way to the tree of life.";
web[24] = "So he drove out the man: and he placed at the east of the garden of Eden Cherubim, and a flaming sword which turned every way, to keep the way of the tree of life.";
hnv[24] = "So he drove out the man; and he placed Keruvs at the east of the garden of `Eden, and the flame of a sword which turned every way, to guard the way to the tree of life.";
vul[24] = "eiecitque Adam et conlocavit ante paradisum voluptatis cherubin et flammeum gladium atque versatilem ad custodiendam viam ligni vitae";
csb[1] = "Now the serpent was the most cunning of all the wild animals that the LORD God had made. He said to the woman, &quot;Did God really say, \'You can\'t eat from any tree in the garden\'? &quot;";
csb[2] = "The woman said to the serpent, &quot;We may eat the fruit from the trees in the garden.";
csb[3] = "&quot;But about the fruit of the tree in the middle of the garden, God said, \'You must not eat it or touch it, or you will die.\' &quot;";
csb[4] = "&quot;No! You will not die,&quot; the serpent said to the woman.";
csb[5] = "&quot;In fact, God knows that when you eat it your eyes will be opened and you will be like God, knowing good and evil.&quot;";
csb[6] = "The woman saw that the tree was good for food and delightful to look at, and that it was desirable for obtaining wisdom. So she took some of its fruit and ate it; she also gave some to her husband, who was with her, and he ate it.";
csb[7] = "Then the eyes of both of them were opened, and they knew they were naked; so they sewed fig leaves together and made coverings for themselves.";
csb[8] = "Then the man and his wife heard the sound of the LORD God walking in the garden at the time of the evening breeze, and they hid from the LORD God among the trees of the garden.";
csb[9] = "So the LORD God called out to the man and said to him, &quot;Where are you? &quot;";
csb[10] = "And he said, &quot;I heard you in the garden, and I was afraid because I was naked, so I hid.&quot;";
csb[11] = "Then he asked, &quot;Who told you that you were naked? Did you eat from the tree that I commanded you not to eat from? &quot;";
csb[12] = "The man replied, &quot;The woman you gave to be with me -- she gave me some fruit from the tree, and I ate.&quot;";
csb[13] = "So the LORD God asked the woman, &quot;What is this you have done? &quot; And the woman said, &quot;The serpent deceived me, and I ate.&quot;";
csb[14] = "So the LORD God said to the serpent: Because you have done this, you are cursed more than any livestock and more than any wild animal. You will move on your belly and eat dust all the days of your life.";
csb[15] = "I will put hostility between you and the woman, and between your offspring and her offspring. He will strike your head, and you will strike his heel.";
csb[16] = "He said to the woman: I will intensify your labor pains; you will bear children with painful effort. Your desire will be for your husband, yet he will rule over you.";
csb[17] = "And he said to the man, &quot;Because you listened to your wife and ate from the tree about which I commanded you, \'Do not eat from it\': The ground is cursed because of you. You will eat from it by means of painful labor all the days of your life.";
csb[18] = "&quot;It will produce thorns and thistles for you, and you will eat the plants of the field.";
csb[19] = "&quot;You will eat bread by the sweat of your brow until you return to the ground, since you were taken from it. For you are dust, and you will return to dust.&quot;";
csb[20] = "The man named his wife Eve because she was the mother of all the living.";
csb[21] = "The LORD God made clothing from skins for the man and his wife, and he clothed them.";
csb[22] = "The LORD God said, &quot;Since the man has become like one of us, knowing good and evil, he must not reach out, take from the tree of life, eat, and live forever.&quot;";
csb[23] = "So the LORD God sent him away from the garden of Eden to work the ground from which he was taken.";
csb[24] = "He drove the man out and stationed the cherubim and the flaming, whirling sword east of the garden of Eden to guard the way to the tree of life.";
</script>
