rsv[25] = "Far be it from thee to do such a thing, to slay the righteous with the wicked, so that the righteous fare as the wicked! Far be that from thee! Shall not the Judge of all the earth do right?&quot;";
asv[25] = "That be far from thee to do after this manner, to slay the righteous with the wicked, that so the righteous should be as the wicked; that be far from thee: shall not the Judge of all the earth do right?";
yng[25] = "Far be it from Thee to do according to this thing, to put to death the righteous with the wicked; that it hath been -- as the righteous so the wicked -- far be it from Thee; doth the Judge of all the earth not do justice?\'";
dby[25] = "Far be it from thee to do so, to slay the righteous with the wicked, that the righteous should be as the wicked -- far be it from thee! Will not the Judge of all the earth do right?";
web[25] = "That be far from thee to do after this manner, to slay the righteous with the wicked: and that the righteous should be as the wicked, that be far from thee: Shall not the Judge of all the earth do right?";
hnv[25] = "Be it far from you to do things like that, to kill the righteous with the wicked, that so the righteous should be as the wicked. May that be far from you. Shouldn\'t the Judge of all the eretz do right?&quot;";
vul[25] = "absit a te ut rem hanc facias et occidas iustum cum impio fiatque iustus sicut impius non est hoc tuum qui iudicas omnem terram nequaquam facies iudicium";
kjv[26] = "And the LORD said, If I find in Sodom fifty righteous within the city, then I will spare all the place for their sakes.";
rsv[26] = "And the LORD said, &quot;If I find at Sodom fifty righteous in the city, I will spare the whole place for their sake.&quot;";
asv[26] = "And Jehovah said, If I find in Sodom fifty righteous within the city, then I will spare all the place for their sake.";
yng[26] = "And Jehovah saith, `If I find in Sodom fifty righteous in the midst of the city, then have I borne with all the place for their sake.\'";

rsv[27] = "Abraham answered, &quot;Behold, I have taken upon myself to speak to the Lord, I who am but dust and ashes.";

yng[27] = "And Abraham answereth and saith, `Lo, I pray thee, I have willed to speak unto the Lord, and I -- dust and ashes;";

web[27] = "And Abraham answered and said, Behold now, I, who [am] dust and ashes, have taken upon me to speak to the Lord.";
hnv[27] = " Avraham answered, &quot;See now, I have taken it on myself to speak to the Lord, who am but dust and ashes.";

kjv[28] = "Peradventure there shall lack five of the fifty righteous: wilt thou destroy all the city for [lack of] five? And he said, If I find there forty and five, I will not destroy [it].";
rsv[28] = "Suppose five of the fifty righteous are lacking? Wilt thou destroy the whole city for lack of five?&quot; And he said, &quot;I will not destroy it if I find forty-five there.&quot;";
asv[28] = "peradventure there shall lack five of the fifty righteous: wilt thou destroy all the city for lack of five? And he said, I will not destroy it, if I find there forty and five.";
yng[28] = "peradventure there are lacking five of the fifty righteous -- dost Thou destroy for five the whole of the city?\' and He saith, `I destroy [it] not, if I find there forty and five.\'";
dby[28] = "Perhaps there may want five of the fifty righteous: wilt thou destroy all the city on account of the five? And he said, If I shall find forty-five there, I will not destroy [it].";
web[28] = "Peradventure there will lack five of the fifty righteous: wilt thou destroy all the city for [lack of] five? And he said, If I find there forty and five, I will not destroy [it].";
hnv[28] = "What if there will lack five of the fifty righteous? Will you destroy all the city for lack of five?&quot; He said, &quot;I will not destroy it, if I find forty-five there.&quot;";
vul[28] = "quid si minus quinquaginta iustis quinque fuerint delebis propter quinque universam urbem et ait non delebo si invenero ibi quadraginta quinque";

rsv[29] = "Again he spoke to him, and said, &quot;Suppose forty are found there.&quot; He answered, &quot;For the sake of forty I will not do it.&quot;";
asv[29] = "And he spake unto him yet again, and said, Peradventure there shall be forty found there. And he said, I will not do it for the forty\'s sake.";
yng[29] = "And he addeth again to speak unto Him and saith, `Peradventure there are found there forty?\' and He saith, `I do [it] not, because of the forty.\'";
dby[29] = "And he continued yet to speak with him, and said, Perhaps there may be forty found there. And he said, I will not do it for the forty\'s sake.";
web[29] = "And he spoke to him yet again, and said, Peradventure there will be forty found there. And he said, I will not do [it] for forty\'s sake.";

rsv[30] = "Then he said, &quot;Oh let not the Lord be angry, and I will speak. Suppose thirty are found there.&quot; He answered, &quot;I will not do it, if I find thirty there.&quot;";
asv[30] = "And he said, Oh let not the Lord be angry, and I will speak: peradventure there shall thirty be found there. And he said, I will not do it, if I find thirty there.";
yng[30] = "And he saith, `Let it not be, I Pray thee, displeasing to the Lord, and I speak: peradventure there are found there thirty?\' and He saith, `I do [it] not, if I find there thirty.\'";
dby[30] = "And he said, Oh, let not the Lord be angry that I speak! Perhaps there may be thirty found there. And he said, I will not do it if I find thirty there.";
web[30] = "And he said, Oh, let not the Lord be angry, and I will speak: Peradventure there will thirty be found there. And he said, I will not do [it], if I find thirty there.";
hnv[30] = "He said, &quot;Oh don\'t let the Lord be angry, and I will speak. What if there are thirty found there?&quot; He said, &quot;I will not do it, if I find thirty there.&quot;";

rsv[31] = "He said, &quot;Behold, I have taken upon myself to speak to the Lord. Suppose twenty are found there.&quot; He answered, &quot;For the sake of twenty I will not destroy it.&quot;";
asv[31] = "And he said, Behold now, I have taken upon me to speak unto the Lord: peradventure there shall be twenty found there. And he said, I will not destroy it for the twenty\'s sake.";
yng[31] = "And he saith, `Lo, I pray thee, I have willed to speak unto the Lord: peradventure there are found there twenty?\' and He saith, `I do not destroy [it], because of the twenty.\'";
dby[31] = "And he said, Behold now, I have ventured to speak with the Lord. Perhaps there may be twenty found there. And he said, I will not destroy [it] for the twenty\'s sake.";

hnv[31] = "He said, &quot;See now, I have taken it on myself to speak to the Lord. What if there are twenty found there?&quot; He said, &quot;I will not destroy it for the twenty\'s sake.&quot;";

rsv[32] = "Then he said, &quot;Oh let not the Lord be angry, and I will speak again but this once. Suppose ten are found there.&quot; He answered, &quot;For the sake of ten I will not destroy it.&quot;";
asv[32] = "And he said, Oh let not the Lord be angry, and I will speak yet but this once: peradventure ten shall be found there. And he said, I will not destroy it for the ten\'s sake.";
yng[32] = "And he saith, `Let it not be, I pray Thee, displeasing to the Lord, and I speak only this time: peradventure there are found there ten?\' and He saith, `I do not destroy [it], because of the ten.\'";

rsv[33] = "And the LORD went his way, when he had finished speaking to Abraham; and Abraham returned to his place.";
asv[33] = "And Jehovah went his way, as soon as he had left off communing with Abraham: and Abraham returned unto his place.";

dby[33] = "And Jehovah went away when he had ended speaking to Abraham; and Abraham returned to his place.";

csb[1] = "The LORD appeared to Abraham at the oaks of Mamre while he was sitting at the entrance of his tent during the heat of the day.";
csb[2] = "He looked up, and he saw three men standing near him. When he saw them, he ran from the entrance of the tent to meet them, bowed to the ground,";
csb[3] = "and said, &quot;My lord, if I have found favor with you, please do not go on past your servant.";
csb[4] = "&quot;Let a little water be brought, that you may wash your feet and rest yourselves under the tree.";
csb[5] = "&quot;I will bring a bit of bread so that you may strengthen yourselves. This is why you have passed your servant\'s way. Later, you can continue on.&quot; &quot;Yes,&quot; they replied, &quot;do as you have said.&quot;";
csb[6] = "So Abraham hurried into the tent and said to Sarah, &quot;Quick! Knead three measures of fine flour and make bread.&quot;";
csb[7] = "Abraham ran to the herd and got a tender, choice calf. He gave it to a young man, who hurried to prepare it.";
csb[8] = "Then Abraham took curds and milk, as well as the calf that he had prepared, and set them before the men. He served them as they ate under the tree.";
csb[9] = "&quot;Where is your wife Sarah? &quot; they asked him. &quot;There, in the tent,&quot; he answered.";
csb[10] = "The LORD said, &quot;I will certainly come back to you in about a year\'s time, and your wife Sarah will have a son! &quot; Now Sarah was listening at the entrance of the tent behind him.";
csb[11] = "Abraham and Sarah were old and getting on in years. Sarah had passed the age of childbearing.";
csb[12] = "So she laughed to herself: &quot;After I am worn out and my lord is old, will I have delight? &quot;";
csb[13] = "But the LORD asked Abraham, &quot;Why did Sarah laugh, saying, \'Can I really have a baby when I\'m old? \'";
csb[14] = "&quot;Is anything impossible for the LORD? At the appointed time I will come back to you, and in about a year she will have a son.&quot;";
csb[15] = "Sarah denied it. &quot;I did not laugh,&quot; she said, because she was afraid. But he replied, &quot;No, you did laugh.&quot;";
csb[16] = "The men got up from there and looked out over Sodom, and Abraham was walking with them to see them off.";
csb[17] = "Then the LORD said, &quot;Should I hide what I am about to do from Abraham?";
csb[18] = "&quot;Abraham is to become a great and powerful nation, and all the nations of the earth will be blessed through him.";
csb[19] = "&quot;For I have chosen him so that he will command his children and his house after him to keep the way of the LORD by doing what is right and just. This is how the LORD will fulfill to Abraham what he promised him.&quot;";
csb[20] = "Then the LORD said, &quot;The outcry against Sodom and Gomorrah is immense, and their sin is extremely serious.";
csb[21] = "&quot;I will go down to see if what they have done justifies the cry that has come up to me. If not, I will find out.&quot;";
csb[22] = "The men turned from there and went toward Sodom while Abraham remained standing before the LORD.";
csb[23] = "Abraham stepped forward and said, &quot;Will you really sweep away the righteous with the wicked?";
csb[24] = "&quot;What if there are fifty righteous people in the city? Will you really sweep it away instead of sparing the place for the sake of the fifty righteous people who are in it?";
csb[25] = "&quot;You could not possibly do such a thing: to kill the righteous with the wicked, treating the righteous and the wicked alike. You could not possibly do that! Won\'t the Judge of the whole earth do what is just? &quot;";
csb[26] = "The LORD said, &quot;If I find fifty righteous people in the city of Sodom, I will spare the whole place for their sake.&quot;";
csb[27] = "Then Abraham answered, &quot;Since I have ventured to speak to my lord -- even though I am dust and ashes --";
csb[28] = "&quot;suppose the fifty righteous lack five. Will you destroy the whole city for lack of five? &quot; He replied, &quot;I will not destroy it if I find forty-five there.&quot;";
csb[29] = "Then he spoke to him again, &quot;Suppose forty are found there? &quot; He answered, &quot;I will not do it on account of forty.&quot;";
csb[30] = "Then he said, &quot;Let my lord not be angry, and I will speak further. Suppose thirty are found there? &quot; He answered, &quot;I will not do it if I find thirty there.&quot;";
csb[31] = "Then he said, &quot;Since I have ventured to speak to my lord, suppose twenty are found there? &quot; He replied, &quot;I will not destroy it on account of twenty.&quot;";
csb[32] = "Then he said, &quot;Let my lord not be angry, and I will speak one more time. Suppose ten are found there? &quot; He answered, &quot;I will not destroy it on account of ten.&quot;";
csb[33] = "When the LORD had finished speaking with Abraham, he departed, and Abraham returned to his place.";
