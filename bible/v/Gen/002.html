web[25] = "And they were both naked, the man and his wife, and were not ashamed.";
hnv[25] = "They were both naked, the man and his wife, and were not ashamed.";
vul[25] = "erant autem uterque nudi Adam scilicet et uxor eius et non erubescebant";
csb[1] = "So the heavens and the earth and everything in them were completed.";
csb[2] = "On the seventh day God had completed his work that he had done, and he rested on the seventh day from all his work that he had done.";
csb[3] = "God blessed the seventh day and declared it holy, for on it he rested from all his work of creation.";
csb[4] = "These are the records of the heavens and the earth, concerning their creation. At the time that the LORD God made the earth and the heavens,";
csb[5] = "no shrub of the field had yet grown on the land, and no plant of the field had yet sprouted, for the LORD God had not made it rain on the land, and there was no man to work the ground.";
csb[6] = "But mist would come up from the earth and water all the ground.";
csb[7] = "Then the LORD God formed the man out of the dust from the ground and breathed the breath of life into his nostrils, and the man became a living being.";
csb[8] = "The LORD God planted a garden in Eden, in the east, and there he placed the man he had formed.";
csb[9] = "The LORD God caused to grow out of the ground every tree pleasing in appearance and good for food, including the tree of life in the middle of the garden, as well as the tree of the knowledge of good and evil.";
csb[10] = "A river went out from Eden to water the garden. From there it divided and became the source of four rivers.";
csb[11] = "The name of the first is Pishon, which flows through the entire land of Havilah, where there is gold.";
csb[12] = "Gold from that land is pure; bdellium and onyx are also there.";
csb[13] = "The name of the second river is Gihon, which flows through the entire land of Cush.";
csb[14] = "The name of the third river is Tigris, which runs east of Assyria. And the fourth river is the Euphrates.";
csb[15] = "The LORD God took the man and placed him in the garden of Eden to work it and watch over it.";
csb[16] = "And the LORD God commanded the man, &quot;You are free to eat from any tree of the garden,";
csb[17] = "&quot;but you must not eat from the tree of the knowledge of good and evil, for on the day you eat from it, you will certainly die.&quot;";
csb[18] = "Then the LORD God said, &quot;It is not good for the man to be alone. I will make a helper corresponding to him.&quot;";
csb[19] = "The LORD God formed out of the ground every wild animal and every bird of the sky, and brought each to the man to see what he would call it. And whatever the man called a living creature, that was its name.";
csb[20] = "The man gave names to all the livestock, to the birds of the sky, and to every wild animal; but for the man no helper was found corresponding to him.";
csb[21] = "So the LORD God caused a deep sleep to come over the man, and he slept. God took one of his ribs and closed the flesh at that place.";
csb[22] = "Then the LORD God made the rib he had taken from the man into a woman and brought her to the man.";
csb[23] = "And the man said: This one, at last, is bone of my bone and flesh of my flesh; this one will be called &quot;woman,&quot; for she was taken from man.";
csb[24] = "This is why a man leaves his father and mother and bonds with his wife, and they become one flesh.";
csb[25] = "Both the man and his wife were naked, yet felt no shame.";
</script>
