csb[1] = "Paul, an apostle of Christ Jesus by God\'s will, for the sake of the promise of life in Christ Jesus:";
csb[2] = "To Timothy, my dearly loved son. Grace, mercy, and peace from God the Father and Christ Jesus our Lord.";
csb[3] = "I thank God, whom I serve with a clear conscience as my ancestors did, when I constantly remember you in my prayers night and day.";
csb[4] = "Remembering your tears, I long to see you so that I may be filled with joy.";
csb[5] = "I recall your sincere faith that first lived in your grandmother Lois and in your mother Eunice and now, I am convinced, is in you also.";
csb[6] = "Therefore, I remind you to rekindle the gift of God that is in you through the laying on of my hands.";
csb[7] = "For God has not given us a spirit of fear, but one of power, love, and sound judgment.";
csb[8] = "So don\'t be ashamed of the testimony about our Lord, or of me his prisoner. Instead, share in suffering for the gospel, relying on the power of God.";
csb[9] = "He has saved us and called us with a holy calling, not according to our works, but according to his own purpose and grace, which was given to us in Christ Jesus before time began.";
csb[10] = "This has now been made evident through the appearing of our Savior Christ Jesus, who has abolished death and has brought life and immortality to light through the gospel.";
csb[11] = "For this gospel I was appointed a herald, apostle, and teacher,";
csb[12] = "and that is why I suffer these things. But I am not ashamed, because I know whom I have believed and am persuaded that he is able to guard what has been entrusted to me until that day.";
csb[13] = "Hold on to the pattern of sound teaching that you have heard from me, in the faith and love that are in Christ Jesus.";
csb[14] = "Guard the good deposit through the Holy Spirit who lives in us.";
csb[15] = "You know that all those in the province of Asia have deserted me, including Phygelus and Hermogenes.";
csb[16] = "May the Lord grant mercy to the household of Onesiphorus, because he often refreshed me and was not ashamed of my chains.";
csb[17] = "On the contrary, when he was in Rome, he diligently searched for me and found me.";
csb[18] = "May the Lord grant that he obtain mercy from him on that day. You know very well how much he ministered at Ephesus.";
