csb[1] = "I solemnly charge you before God and Christ Jesus, who is going to judge the living and the dead, and because of his appearing and his kingdom:";
csb[2] = "Preach the word; be ready in season and out of season; rebuke, correct, and encourage with great patience and teaching.";
csb[3] = "For the time will come when people will not tolerate sound doctrine, but according to their own desires, will multiply teachers for themselves because they have an itch to hear what they want to hear.";
csb[4] = "They will turn away from hearing the truth and will turn aside to myths.";
csb[5] = "But as for you, exercise self-control in everything, endure hardship, do the work of an evangelist, fulfill your ministry.";
csb[6] = "For I am already being poured out as a drink offering, and the time for my departure is close.";
csb[7] = "I have fought the good fight, I have finished the race, I have kept the faith.";
csb[8] = "There is reserved for me the crown of righteousness, which the Lord, the righteous Judge, will give me on that day, and not only to me, but to all those who have loved his appearing.";
csb[9] = "Make every effort to come to me soon,";
csb[10] = "because Demas has deserted me, since he loved this present world, and has gone to Thessalonica. Crescens has gone to Galatia, Titus to Dalmatia.";
csb[11] = "Only Luke is with me. Bring Mark with you, for he is useful to me in the ministry.";
csb[12] = "I have sent Tychicus to Ephesus.";
csb[13] = "When you come, bring the cloak I left in Troas with Carpus, as well as the scrolls, especially the parchments.";
csb[14] = "Alexander the coppersmith did great harm to me. The Lord will repay him according to his works.";
csb[15] = "Watch out for him yourself because he strongly opposed our words.";
csb[16] = "At my first defense, no one stood by me, but everyone deserted me. May it not be counted against them.";
csb[17] = "But the Lord stood with me and strengthened me, so that I might fully preach the word and all the Gentiles might hear it. So I was rescued from the lion\'s mouth.";
csb[18] = "The Lord will rescue me from every evil work and will bring me safely into his heavenly kingdom. To him be the glory forever and ever! Amen.";
csb[19] = "Greet Prisca and Aquila, and the household of Onesiphorus.";
csb[20] = "Erastus has remained at Corinth; I left Trophimus sick at Miletus.";
csb[21] = "Make every effort to come before winter. Eubulus greets you, as do Pudens, Linus, Claudia, and all the brothers and sisters.";
csb[22] = "The Lord be with your spirit. Grace be with you all.";
