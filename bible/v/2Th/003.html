csb[1] = "In addition, brothers and sisters, pray for us that the word of the Lord may spread rapidly and be honored, just as it was with you,";
csb[2] = "and that we may be delivered from wicked and evil people, for not all have faith.";
csb[3] = "But the Lord is faithful; he will strengthen and guard you from the evil one.";
csb[4] = "We have confidence in the Lord about you, that you are doing and will continue to do what we command.";
csb[5] = "May the Lord direct your hearts to God\'s love and Christ\'s endurance.";
csb[6] = "Now we command you, brothers and sisters, in the name of our Lord Jesus Christ, to keep away from every brother or sister who is idle and does not live according to the tradition received from us.";
csb[7] = "For you yourselves know how you should imitate us: We were not idle among you;";
csb[8] = "we did not eat anyone\'s food free of charge; instead, we labored and toiled, working night and day, so that we would not be a burden to any of you.";
csb[9] = "It is not that we don\'t have the right to support, but we did it to make ourselves an example to you so that you would imitate us.";
csb[10] = "In fact, when we were with you, this is what we commanded you: &quot;If anyone isn\'t willing to work, he should not eat.&quot;";
csb[11] = "For we hear that there are some among you who are idle. They are not busy but busybodies.";
csb[12] = "Now we command and exhort such people by the Lord Jesus Christ to work quietly and provide for themselves.";
csb[13] = "But as for you, brothers and sisters, do not grow weary in doing good.";
csb[14] = "If anyone does not obey our instruction in this letter, take note of that person; don\'t associate with him, so that he may be ashamed.";
csb[15] = "Yet don\'t consider him as an enemy, but warn him as a brother.";
csb[16] = "May the Lord of peace himself give you peace always in every way. The Lord be with all of you.";
csb[17] = "I, Paul, am writing this greeting with my own hand, which is an authenticating mark in every letter; this is how I write.";
csb[18] = "The grace of our Lord Jesus Christ be with you all.";
kjv[1] = "Finally, brethren, pray for us, that the word of the Lord may have [free] course, and be glorified, even as [it is] with you:";
rsv[1] = "Finally, brethren, pray for us, that the word of the Lord may speed on and triumph, as it did among you,";
asv[1] = "Finally, brethren, pray for us, that the word of the Lord may run and be glorified, even as also [it is] with you;";
yng[1] = "As to the rest, pray ye, brethren, concerning us, that the word of the Lord may run and may be glorified, as also with you,";
dby[1] = "For the rest, brethren, pray for us, that the word of the Lord may run and be glorified, even as also with you;";
web[1] = "Finally, brethren, pray for us, that the word of the Lord may have [free] course, and be glorified, even as [it is] with you;";
hnv[1] = "Finally, brothers, pray for us, that the word of the Lord may spread rapidly and be glorified, even as also with you;";
vul[1] = "de cetero fratres orate pro nobis ut sermo Domini currat et clarificetur sicut et apud vos";
kjv[2] = "And that we may be delivered from unreasonable and wicked men: for all [men] have not faith.";
rsv[2] = "and that we may be delivered from wicked and evil men; for not all have faith.";
asv[2] = "and that we may be delivered from unreasonable and evil men; for all have not faith.";
yng[2] = "and that we may be delivered from the unreasonable and evil men, for the faith [is] not of all;";
dby[2] = "and that we may be delivered from bad and evil men, for faith [is] not [the portion] of all.";
web[2] = "And that we may be delivered from unreasonable and wicked men: for all [men] have not faith.";
hnv[2] = "and that we may be delivered from unreasonable and evil men; for not all have faith.";
vul[2] = "et ut liberemur ab inportunis et malis hominibus non enim omnium est fides";
kjv[3] = "But the Lord is faithful, who shall stablish you, and keep [you] from evil.";
rsv[3] = "But the Lord is faithful; he will strengthen you and guard you from evil.";
asv[3] = "But the Lord is faithful, who shall establish you, and guard you from the evil [one].";
yng[3] = "and stedfast is the Lord, who shall establish you, and shall guard [you] from the evil;";
dby[3] = "But the Lord is faithful, who shall establish you and keep [you] from evil.";
web[3] = "But the Lord is faithful, who will establish you, and keep [you] from evil.";
hnv[3] = "But the Lord is faithful, who will establish you, and guard you from the evil one.";
vul[3] = "fidelis autem Dominus est qui confirmabit vos et custodiet a malo";
kjv[4] = "And we have confidence in the Lord touching you, that ye both do and will do the things which we command you.";
rsv[4] = "And we have confidence in the Lord about you, that you are doing and will do the things which we command.";
asv[4] = "And we have confidence in the Lord touching you, that ye both do and will do the things which we command.";
yng[4] = "and we have confidence in the Lord touching you, that the things that we command you ye both do and will do;";
dby[4] = "But we trust in the Lord as to you, that the things which we enjoin, ye both do and will do.";
web[4] = "And we have confidence in the Lord concerning you, that ye both do and will do the things which we command you.";
hnv[4] = "We have confidence in the Lord concerning you, that you both do and will do the things we command.";
vul[4] = "confidimus autem de vobis in Domino quoniam quae praecipimus et facitis et facietis";
kjv[5] = "And the Lord direct your hearts into the love of God, and into the patient waiting for Christ.";
rsv[5] = "May the Lord direct your hearts to the love of God and to the steadfastness of Christ.";
asv[5] = "And the Lord direct your hearts into the love of God, and into the patience of Christ.";
yng[5] = "and the Lord direct your hearts to the love of God, and to the endurance of the Christ.";
dby[5] = "But the Lord direct your hearts into the love of God, and into the patience of the Christ.";
web[5] = "And the Lord direct your hearts into the love of God, and into the patient waiting for Christ.";
hnv[5] = "May the Lord direct your hearts into the love of God, and into the patience of Messiah.";
vul[5] = "Dominus autem dirigat corda vestra in caritate Dei et patientia Christi";
kjv[6] = "Now we command you, brethren, in the name of our Lord Jesus Christ, that ye withdraw yourselves from every brother that walketh disorderly, and not after the tradition which he received of us.";
rsv[6] = "Now we command you, brethren, in the name of our Lord Jesus Christ, that you keep away from any brother who is living in idleness and not in accord with the tradition that you received from us.";
asv[6] = "Now we command you, brethren, in the name of our Lord Jesus Christ, that ye withdraw yourselves from every brother that walketh disorderly, and not after the tradition which they received of us.";
yng[6] = "And we command you, brethren, in the name of our Lord Jesus Christ, to withdraw yourselves from every brother disorderly walking, and not after the deliverance that ye received from us,";
dby[6] = "Now we enjoin you, brethren, in the name of our Lord Jesus Christ, that ye withdraw from every brother walking disorderly and not according to the instruction which he received from us.";
web[6] = "Now we command you, brethren, in the name of our Lord Jesus Christ, that ye withdraw yourselves from every brother that walketh disorderly, and not after the tradition which he received from us.";
hnv[6] = "Now we command you, brothers, in the name of our Lord Yeshua the Messiah, that you withdraw yourselves from every brother who walks in rebellion, and not after the tradition which they received from us.";
vul[6] = "denuntiamus autem vobis fratres in nomine Domini nostri Iesu Christi ut subtrahatis vos ab omni fratre ambulante inordinate et non secundum traditionem quam acceperunt a nobis";
kjv[7] = "For yourselves know how ye ought to follow us: for we behaved not ourselves disorderly among you;";
rsv[7] = "For you yourselves know how you ought to imitate us; we were not idle when we were with you,";
asv[7] = "For yourselves know how ye ought to imitate us: for we behaved not ourselves disorderly among you;";
yng[7] = "for yourselves have known how it behoveth [you] to imitate us, because we did not act disorderly among you;";
dby[7] = "For ye know yourselves how ye ought to imitate us, because we have not walked disorderly among you;";
web[7] = "For yourselves know how ye ought to follow us: for we behaved not ourselves disorderly among you;";
hnv[7] = "For you know how you ought to imitate us. For we didn\'t behave ourselves rebelliously among you,";
vul[7] = "ipsi enim scitis quemadmodum oporteat imitari nos quoniam non inquieti fuimus inter vos";
kjv[8] = "Neither did we eat any man\'s bread for nought; but wrought with labour and travail night and day, that we might not be chargeable to any of you:";
rsv[8] = "we did not eat any one\'s bread without paying, but with toil and labor we worked night and day, that we might not burden any of you.";
asv[8] = "neither did we eat bread for nought at any man\'s hand, but in labor and travail, working night and day, that we might not burden any of you:";
yng[8] = "nor for nought did we eat bread of any one, but in labour and in travail, night and day working, not to be chargeable to any of you;";
dby[8] = "nor have we eaten bread from any one without cost; but in toil and hardship working night and day not to be chargeable to any one of you:";
web[8] = "Neither did we eat any man\'s bread for naught; but wrought with labor and toil night and day, that we might not be chargeable to any of you:";
hnv[8] = "neither did we eat bread from anyone\'s hand without paying for it, but in labor and travail worked night and day, that we might not burden any of you;";
vul[8] = "neque gratis panem manducavimus ab aliquo sed in labore et fatigatione nocte et die operantes ne quem vestrum gravaremus";
kjv[9] = "Not because we have not power, but to make ourselves an ensample unto you to follow us.";
rsv[9] = "It was not because we have not that right, but to give you in our conduct an example to imitate.";
asv[9] = "not because we have not the right, but to make ourselves an ensample unto you, that ye should imitate us.";
yng[9] = "not because we have not authority, but that ourselves a pattern we might give to you, to imitate us;";
dby[9] = "not that we have not the right, but that we might give ourselves as an example to you, in order to your imitating us.";
web[9] = "Not because we have not power, but to make ourselves a pattern to you to follow us.";
hnv[9] = "not because we don\'t have the right, but to make ourselves an example to you, that you should imitate us.";
vul[9] = "non quasi non habuerimus potestatem sed ut nosmet ipsos formam daremus vobis ad imitandum nos";
kjv[10] = "For even when we were with you, this we commanded you, that if any would not work, neither should he eat.";
rsv[10] = "For even when we were with you, we gave you this command: If any one will not work, let him not eat.";
asv[10] = "For even when we were with you, this we commanded you, If any will not work, neither let him eat.";
yng[10] = "for even when we were with you, this we did command you, that if any one is not willing to work, neither let him eat,";
dby[10] = "For also when we were with you we enjoined you this, that if any man does not like to work, neither let him eat.";
web[10] = "For even when we were with you, this we commanded you, that if any would not work, neither should he eat.";
hnv[10] = "For even when we were with you, we commanded you this: &quot;If anyone will not work, neither let him eat.&quot;";
vul[10] = "nam et cum essemus apud vos hoc denuntiabamus vobis quoniam si quis non vult operari nec manducet";
kjv[11] = "For we hear that there are some which walk among you disorderly, working not at all, but are busybodies.";
rsv[11] = "For we hear that some of you are living in idleness, mere busybodies, not doing any work.";
asv[11] = "For we hear of some that walk among you disorderly, that work not at all, but are busybodies.";
yng[11] = "for we hear of certain walking among you disorderly, nothing working, but over working,";
dby[11] = "For we hear that [there are] some walking among you disorderly, not working at all, but busybodies.";
web[11] = "For we hear that there are some who walk among you disorderly, working not at all, but are busy-bodies.";
hnv[11] = "For we hear of some who walk among you in rebellion, who don\'t work at all, but are busybodies.";
vul[11] = "audimus enim inter vos quosdam ambulare inquiete nihil operantes sed curiose agentes";
kjv[12] = "Now them that are such we command and exhort by our Lord Jesus Christ, that with quietness they work, and eat their own bread.";
rsv[12] = "Now such persons we command and exhort in the Lord Jesus Christ to do their work in quietness and to earn their own living.";
asv[12] = "Now them that are such we command and exhort in the Lord Jesus Christ, that with quietness they work, and eat their own bread.";
yng[12] = "and such we command and exhort through our Lord Jesus Christ, that with quietness working, their own bread they may eat;";
dby[12] = "Now such we enjoin and exhort in [the] Lord Jesus Christ, that working quietly they eat their own bread.";
web[12] = "Now them that are such we command and exhort by our Lord Jesus Christ, that with quietness they work, and eat their own bread.";
hnv[12] = "Now those who are that way, we command and exhort in the Lord Yeshua the Messiah, that with quietness they work, and eat their own bread.";
vul[12] = "his autem qui eiusmodi sunt denuntiamus et obsecramus in Domino Iesu Christo ut cum silentio operantes suum panem manducent";
kjv[13] = "But ye, brethren, be not weary in well doing.";
rsv[13] = "Brethren, do not be weary in well-doing.";
asv[13] = "But ye, brethren, be not weary in well-doing.";
yng[13] = "and ye, brethren, may ye not be weary doing well,";
dby[13] = "But *ye*, brethren, do not faint in well-doing.";
web[13] = "But ye, brethren, be not weary in well-doing.";
hnv[13] = "But you, brothers, don\'t be weary in doing well.";
vul[13] = "vos autem fratres nolite deficere benefacientes";
kjv[14] = "And if any man obey not our word by this epistle, note that man, and have no company with him, that he may be ashamed.";
rsv[14] = "If any one refuses to obey what we say in this letter, note that man, and have nothing to do with him, that he may be ashamed.";
asv[14] = "And if any man obeyeth not our word by this epistle, note that man, that ye have no company with him, to the end that he may be ashamed.";
yng[14] = "and if any one do not obey our word through the letter, this one note ye, and have no company with him, that he may be ashamed,";
dby[14] = "But if any one obey not our word by the letter, mark that man, and do not keep company with him, that he may be ashamed of himself;";
web[14] = "And if any man obeyeth not our word by this epistle, note that man, and have no company with him, that he may be ashamed.";
hnv[14] = "If any man doesn\'t obey our word in this letter, note that man, that you have no company with him, to the end that he may be ashamed.";
vul[14] = "quod si quis non oboedit verbo nostro per epistulam hunc notate et non commisceamini cum illo ut confundatur";
kjv[15] = "Yet count [him] not as an enemy, but admonish [him] as a brother.";
rsv[15] = "Do not look on him as an enemy, but warn him as a brother.";
asv[15] = "And [yet] count him not as an enemy, but admonish him as a brother.";
yng[15] = "and as an enemy count [him] not, but admonish ye [him] as a brother;";
dby[15] = "and do not esteem him as an enemy, but admonish [him] as a brother.";
web[15] = "Yet count [him] not as an enemy, but admonish [him] as a brother.";
hnv[15] = " Don\'t count him as an enemy, but admonish him as a brother.";
vul[15] = "et nolite quasi inimicum existimare sed corripite ut fratrem";
kjv[16] = "Now the Lord of peace himself give you peace always by all means. The Lord [be] with you all.";
rsv[16] = "Now may the Lord of peace himself give you peace at all times in all ways. The Lord be with you all.";
asv[16] = "Now the Lord of peace himself give you peace at all times in all ways. The Lord be with you all.";
yng[16] = "and may the Lord of the peace Himself give to you the peace always in every way; the Lord [is] with you all!";
dby[16] = "But the Lord of peace himself give you peace continually in every way. The Lord [be] with you all.";
web[16] = "Now the Lord of peace himself give you peace always by all means. The Lord [be] with you all.";
hnv[16] = "Now may the Lord of shalom himself give you shalom at all times in all ways. The Lord be with you all.";
vul[16] = "ipse autem Dominus pacis det vobis pacem sempiternam in omni loco Dominus cum omnibus vobis";
kjv[17] = "The salutation of Paul with mine own hand, which is the token in every epistle: so I write.";
rsv[17] = "I, Paul, write this greeting with my own hand. This is the mark in every letter of mine; it is the way I write.";
asv[17] = "The salutation of me Paul with mine own hand, which is the token in every epistle: so I write.";
yng[17] = "The salutation by the hand of me, Paul, which is a sign in every letter; thus I write;";
dby[17] = "The salutation by the hand of me, Paul, which is [the] mark in every letter; so I write.";
web[17] = "The salutation of Paul with my own hand, which is the token in every epistle: so I write.";
hnv[17] = "The greeting of me, Sha\'ul, with my own hand, which is the sign in every letter: this is how I write.";
vul[17] = "salutatio mea manu Pauli quod est signum in omni epistula ita scribo";

rsv[18] = "The grace of our Lord Jesus Christ be with you all.";
asv[18] = "The grace of our Lord Jesus Christ be with you all.";
yng[18] = "the grace of our Lord Jesus Christ [is] with you all! Amen.";
dby[18] = "The grace of our Lord Jesus Christ [be] with you all.";
web[18] = "The grace of our Lord Jesus Christ [be] with you all. Amen.";
