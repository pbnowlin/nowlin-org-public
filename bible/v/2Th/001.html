csb[1] = "Paul, Silvanus, and Timothy: To the church of the Thessalonians in God our Father and the Lord Jesus Christ.";
csb[2] = "Grace to you and peace from God our Father and the Lord Jesus Christ.";
csb[3] = "We ought to thank God always for you, brothers and sisters, and rightly so, since your faith is flourishing and the love each one of you has for one another is increasing.";
csb[4] = "Therefore, we ourselves boast about you among God\'s churches -- about your perseverance and faith in all the persecutions and afflictions that you are enduring.";
csb[5] = "It is clear evidence of God\'s righteous judgment that you will be counted worthy of God\'s kingdom, for which you also are suffering,";
csb[6] = "since it is just for God to repay with affliction those who afflict you";
csb[7] = "and to give relief to you who are afflicted, along with us. This will take place at the revelation of the Lord Jesus from heaven with his powerful angels,";
csb[8] = "when he takes vengeance with flaming fire on those who don\'t know God and on those who don\'t obey the gospel of our Lord Jesus.";
csb[9] = "They will pay the penalty of eternal destruction from the Lord\'s presence and from his glorious strength";
csb[10] = "on that day when he comes to be glorified by his saints and to be marveled at by all those who have believed, because our testimony among you was believed.";
csb[11] = "In view of this, we always pray for you that our God will make you worthy of his calling, and by his power fulfill your every desire to do good and your work produced by faith,";
csb[12] = "so that the name of our Lord Jesus will be glorified by you, and you by him, according to the grace of our God and the Lord Jesus Christ.";
