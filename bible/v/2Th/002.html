csb[1] = "Now concerning the coming of our Lord Jesus Christ and our being gathered to him: We ask you, brothers and sisters,";
csb[2] = "not to be easily upset or troubled, either by a prophecy or by a message or by a letter supposedly from us, alleging that the day of the Lord has come.";
csb[3] = "Don\'t let anyone deceive you in any way. For that day will not come unless the apostasy comes first and the man of lawlessness is revealed, the man doomed to destruction.";
csb[4] = "He opposes and exalts himself above every so-called god or object of worship, so that he sits in God\'s temple, proclaiming that he himself is God.";
csb[5] = "Don\'t you remember that when I was still with you I used to tell you about this?";
csb[6] = "And you know what currently restrains him, so that he will be revealed in his time.";
csb[7] = "For the mystery of lawlessness is already at work, but the one now restraining will do so until he is out of the way,";
csb[8] = "and then the lawless one will be revealed. The Lord Jesus will destroy him with the breath of his mouth and will bring him to nothing at the appearance of his coming.";
csb[9] = "The coming of the lawless one is based on Satan\'s working, with all kinds of false miracles, signs, and wonders,";
csb[10] = "and with every wicked deception among those who are perishing. They perish because they did not accept the love of the truth and so be saved.";
csb[11] = "For this reason God sends them a strong delusion so that they will believe the lie,";
csb[12] = "so that all will be condemned -- those who did not believe the truth but delighted in unrighteousness.";
csb[13] = "But we ought to thank God always for you, brothers and sisters loved by the Lord, because from the beginning God has chosen you for salvation through sanctification by the Spirit and through belief in the truth.";
csb[14] = "He called you to this through our gospel, so that you might obtain the glory of our Lord Jesus Christ.";
csb[15] = "So then, brothers and sisters, stand firm and hold to the traditions you were taught, whether by what we said or what we wrote.";
csb[16] = "May our Lord Jesus Christ himself and God our Father, who has loved us and given us eternal encouragement and good hope by grace,";
csb[17] = "encourage your hearts and strengthen you in every good work and word.";
