csb[1] = "Everyone who believes that Jesus is the Christ has been born of God, and everyone who loves the Father also loves the one born of him.";
csb[2] = "This is how we know that we love God\'s children: when we love God and obey his commands.";
csb[3] = "For this is what love for God is: to keep his commands. And his commands are not a burden,";
csb[4] = "because everyone who has been born of God conquers the world. This is the victory that has conquered the world: our faith.";
csb[5] = "Who is the one who conquers the world but the one who believes that Jesus is the Son of God?";
csb[6] = "Jesus Christ -- he is the one who came by water and blood, not by water only, but by water and by blood. And the Spirit is the one who testifies, because the Spirit is the truth.";
csb[7] = "For there are three that testify:";
csb[8] = "the Spirit, the water, and the blood -- and these three are in agreement.";
csb[9] = "If we accept human testimony, God\'s testimony is greater, because it is God\'s testimony that he has given about his Son.";
csb[10] = "The one who believes in the Son of God has this testimony within himself. The one who does not believe God has made him a liar, because he has not believed in the testimony God has given about his Son.";
csb[11] = "And this is the testimony: God has given us eternal life, and this life is in his Son.";
csb[12] = "The one who has the Son has life. The one who does not have the Son of God does not have life.";
csb[13] = "I have written these things to you who believe in the name of the Son of God so that you may know that you have eternal life.";
csb[14] = "This is the confidence we have before him: If we ask anything according to his will, he hears us.";
csb[15] = "And if we know that he hears whatever we ask, we know that we have what we have asked of him.";
csb[16] = "If anyone sees a fellow believer committing a sin that doesn\'t lead to death, he should ask, and God will give life to him -- to those who commit sin that doesn\'t lead to death. There is sin that leads to death. I am not saying he should pray about that.";
csb[17] = "All unrighteousness is sin, and there is sin that doesn\'t lead to death.";
csb[18] = "We know that everyone who has been born of God does not sin, but the one who is born of God keeps him, and the evil one does not touch him.";
csb[19] = "We know that we are of God, and the whole world is under the sway of the evil one.";
csb[20] = "And we know that the Son of God has come and has given us understanding so that we may know the true one. We are in the true one -- that is, in his Son Jesus Christ. He is the true God and eternal life.";
csb[21] = "Little children, guard yourselves from idols.";
asv[1] = "Whosoever believeth that Jesus is the Christ is begotten of God: and whosoever loveth him that begat loveth him also that is begotten of him.";
asv[2] = "Hereby we know that we love the children of God, when we love God and do his commandments.";
asv[3] = "For this is the love of God, that we keep his commandments: and his commandments are not grievous.";
asv[4] = "For whatsoever is begotten of God overcometh the world: and this is the victory that hath overcome the world, [even] our faith.";
asv[5] = "And who is he that overcometh the world, but he that believeth that Jesus is the Son of God?";
asv[6] = "This is he that came by water and blood, [even] Jesus Christ; not with the water only, but with the water and with the blood.";
asv[7] = "And it is the Spirit that beareth witness, because the Spirit is the truth.";
asv[8] = "For there are three who bear witness, the Spirit, and the water, and the blood: and the three agree in one.";
asv[9] = "If we receive the witness of men, the witness of God is greater: for the witness of God is this, that he hath borne witness concerning his Son.";
asv[10] = "He that believeth on the Son of God hath the witness in him: he that believeth not God hath made him a liar; because he hath not believed in the witness that God hath borne concerning his Son.";
asv[11] = "And the witness is this, that God gave unto us eternal life, and this life is in his Son.";
asv[12] = "He that hath the Son hath the life; he that hath not the Son of God hath not the life.";
asv[13] = "These things have I written unto you, that ye may know that ye have eternal life, [even] unto you that believe on the name of the Son of God.";
asv[14] = "And this is the boldness which we have toward him, that, if we ask anything according to his will, he heareth us:";
asv[15] = "and if we know that he heareth us whatsoever we ask, we know that we have the petitions which we have asked of him.";
asv[16] = "If any man see his brother sinning a sin not unto death, he shall ask, and [God] will give him life for them that sin not unto death. There is a sin unto death: not concerning this do I say that he should make request.";
asv[17] = "All unrighteousness is sin: and there is a sin not unto death.";
asv[18] = "We know that whosoever is begotten of God sinneth not; but he that was begotten of God keepeth himself, and the evil one toucheth him not.";
asv[19] = "We know that we are of God, and the whole world lieth in the evil one.";
asv[20] = "And we know that the Son of God is come, and hath given us an understanding, that we know him that is true, and we are in him that is true, [even] in his Son Jesus Christ. This is the true God, and eternal life.";
asv[21] = "[My] little children, guard yourselves from idols.";

hnv[1] = "Whoever believes that Yeshua is the Messiah is born of God. Whoever loves the father also loves the child who is born of him.";
hnv[2] = " By this we know that we love the children of God, when we love God and keep his mitzvot.";
hnv[3] = "For this is the love of God, that we keep his mitzvot. His mitzvot are not grievous.";
hnv[4] = "For whatever is born of God overcomes the world. This is the victory that has overcome the world: your faith.";
hnv[5] = "Who is he who overcomes the world, but he who believes that Yeshua is the Son of God?";
hnv[6] = "This is he who came by water and blood, Yeshua the Messiah; not with the water only, but with the water and the blood. It is the Spirit who bears witness, because the Spirit is the truth.";
hnv[7] = "For there are three who testify:";
hnv[8] = " the Spirit, and the water, and the blood; and the three agree as one.";
hnv[9] = "If we receive the witness of men, the witness of God is greater; for this is God\'s testimony which he has testified concerning his Son.";
hnv[10] = "He who believes in the Son of God has the testimony in himself. He who doesn\'t believe God has made him a liar, because he has not believed in the testimony that God has given concerning his Son.";
hnv[11] = " The testimony is this, that God gave to us eternal life, and this life is in his Son.";
hnv[12] = "He who has the Son has the life. He who doesn\'t have God\'s Son doesn\'t have the life.";
hnv[13] = "These things I have written to you who believe in the name of the Son of God, that you may know that you have eternal life, and that you may continue to believe in the name of the Son of God.";
hnv[14] = "This is the boldness which we have toward him, that, if we ask anything according to his will, he listens to us.";

hnv[16] = "If anyone sees his brother sinning a sin not leading to death, he shall ask, and God will give him life for those who sin not leading to death. There is a sin leading to death. I don\'t say that he should make a request concerning this.";
hnv[17] = "All unrighteousness is sin, and there is a sin not leading to death.";
hnv[18] = "We know that whoever is born of God doesn\'t sin, but he who was born of God keeps himself, and the evil one doesn\'t touch him.";

hnv[21] = "Little children, keep yourselves from idols.";
kjv[1] = "Whosoever believeth that Jesus is the Christ is born of God: and every one that loveth him that begat loveth him also that is begotten of him.";
kjv[2] = "By this we know that we love the children of God, when we love God, and keep his commandments.";
kjv[3] = "For this is the love of God, that we keep his commandments: and his commandments are not grievous.";
kjv[4] = "For whatsoever is born of God overcometh the world: and this is the victory that overcometh the world, [even] our faith.";
kjv[5] = "Who is he that overcometh the world, but he that believeth that Jesus is the Son of God?";
kjv[6] = "This is he that came by water and blood, [even] Jesus Christ; not by water only, but by water and blood. And it is the Spirit that beareth witness, because the Spirit is truth.";
kjv[7] = "For there are three that bear record in heaven, the Father, the Word, and the Holy Ghost: and these three are one.";
kjv[8] = "And there are three that bear witness in earth, the Spirit, and the water, and the blood: and these three agree in one.";
kjv[9] = "If we receive the witness of men, the witness of God is greater: for this is the witness of God which he hath testified of his Son.";
kjv[10] = "He that believeth on the Son of God hath the witness in himself: he that believeth not God hath made him a liar; because he believeth not the record that God gave of his Son.";
kjv[11] = "And this is the record, that God hath given to us eternal life, and this life is in his Son.";
kjv[12] = "He that hath the Son hath life; [and] he that hath not the Son of God hath not life.";
kjv[13] = "These things have I written unto you that believe on the name of the Son of God; that ye may know that ye have eternal life, and that ye may believe on the name of the Son of God.";
kjv[14] = "And this is the confidence that we have in him, that, if we ask any thing according to his will, he heareth us:";
kjv[15] = "And if we know that he hear us, whatsoever we ask, we know that we have the petitions that we desired of him.";
kjv[16] = "If any man see his brother sin a sin [which is] not unto death, he shall ask, and he shall give him life for them that sin not unto death. There is a sin unto death: I do not say that he shall pray for it.";
kjv[17] = "All unrighteousness is sin: and there is a sin not unto death.";
kjv[18] = "We know that whosoever is born of God sinneth not; but he that is begotten of God keepeth himself, and that wicked one toucheth him not.";
kjv[19] = "[And] we know that we are of God, and the whole world lieth in wickedness.";
kjv[20] = "And we know that the Son of God is come, and hath given us an understanding, that we may know him that is true, and we are in him that is true, [even] in his Son Jesus Christ. This is the true God, and eternal life.";
kjv[21] = "Little children, keep yourselves from idols. Amen.";
rsv[1] = "Every one who believes that Jesus is the Christ is a child of God, and every one who loves the parent loves the child.";
rsv[2] = "By this we know that we love the children of God, when we love God and obey his commandments.";
rsv[3] = "For this is the love of God, that we keep his commandments. And his commandments are not burdensome.";
rsv[4] = "For whatever is born of God overcomes the world; and this is the victory that overcomes the world, our faith.";
rsv[5] = "Who is it that overcomes the world but he who believes that Jesus is the Son of God?";
rsv[6] = "This is he who came by water and blood, Jesus Christ, not with the water only but with the water and the blood.";
rsv[7] = "And the Spirit is the witness, because the Spirit is the truth.";
rsv[8] = "There are three witnesses, the Spirit, the water, and the blood; and these three agree.";
rsv[9] = "If we receive the testimony of men, the testimony of God is greater; for this is the testimony of God that he has borne witness to his Son.";
rsv[10] = "He who believes in the Son of God has the testimony in himself. He who does not believe God has made him a liar, because he has not believed in the testimony that God has borne to his Son.";
rsv[11] = "And this is the testimony, that God gave us eternal life, and this life is in his Son.";
rsv[12] = "He who has the Son has life; he who has not the Son of God has not life.";
rsv[13] = "I write this to you who believe in the name of the Son of God, that you may know that you have eternal life.";
rsv[14] = "And this is the confidence which we have in him, that if we ask anything according to his will he hears us.";
rsv[15] = "And if we know that he hears us in whatever we ask, we know that we have obtained the requests made of him.";
rsv[16] = "If any one sees his brother committing what is not a mortal sin, he will ask, and God will give him life for those whose sin is not mortal. There is sin which is mortal; I do not say that one is to pray for that.";
rsv[17] = "All wrongdoing is sin, but there is sin which is not mortal.";
rsv[18] = "We know that any one born of God does not sin, but He who was born of God keeps him, and the evil one does not touch him.";
rsv[19] = "We know that we are of God, and the whole world is in the power of the evil one.";
rsv[20] = "And we know that the Son of God has come and has given us understanding, to know him who is true; and we are in him who is true, in his Son Jesus Christ. This is the true God and eternal life.";
rsv[21] = "Little children, keep yourselves from idols.";
vul[1] = "omnis qui credit quoniam Iesus est Christus ex Deo natus est et omnis qui diligit eum qui genuit diligit eum qui natus est ex eo";
vul[2] = "in hoc cognoscimus quoniam diligimus natos Dei cum Deum diligamus et mandata eius faciamus";
vul[3] = "haec est enim caritas Dei ut mandata eius custodiamus et mandata eius gravia non sunt";
vul[4] = "quoniam omne quod natum est ex Deo vincit mundum et haec est victoria quae vincit mundum fides nostra";
vul[5] = "quis est qui vincit mundum nisi qui credit quoniam Iesus est Filius Dei";
vul[6] = "hic est qui venit per aquam et sanguinem Iesus Christus non in aqua solum sed in aqua et sanguine et Spiritus est qui testificatur quoniam Christus est veritas";
vul[7] = "quia tres sunt qui testimonium dant";
vul[8] = "Spiritus et aqua et sanguis et tres unum sunt";
vul[9] = "si testimonium hominum accipimus testimonium Dei maius est quoniam hoc est testimonium Dei quod maius est quia testificatus est de Filio suo";
vul[10] = "qui credit in Filio Dei habet testimonium Dei in se qui non credit Filio mendacem facit eum quoniam non credidit in testimonio quod testificatus est Deus de Filio suo";
vul[11] = "et hoc est testimonium quoniam vitam aeternam dedit nobis Deus et haec vita in Filio eius est";
vul[12] = "qui habet Filium habet vitam qui non habet Filium Dei vitam non habet";
vul[13] = "haec scripsi vobis ut sciatis quoniam vitam habetis aeternam qui creditis in nomine Filii Dei";
vul[14] = "et haec est fiducia quam habemus ad eum quia quodcumque petierimus secundum voluntatem eius audit nos";
vul[15] = "et scimus quoniam audit nos quicquid petierimus scimus quoniam habemus petitiones quas postulavimus ab eo";
vul[16] = "qui scit fratrem suum peccare peccatum non ad mortem petet et dabit ei vitam peccantibus non ad mortem est peccatum ad mortem non pro illo dico ut roget";
vul[17] = "omnis iniquitas peccatum est et est peccatum non ad mortem";
vul[18] = "scimus quoniam omnis qui natus est ex Deo non peccat sed generatio Dei conservat eum et malignus non tangit eum";
vul[19] = "scimus quoniam ex Deo sumus et mundus totus in maligno positus est";
vul[20] = "et scimus quoniam Filius Dei venit et dedit nobis sensum ut cognoscamus verum Deum et simus in vero Filio eius hic est verus Deus et vita aeterna";
vul[21] = "filioli custodite vos a simulacris";

yng[1] = "Every one who is believing that Jesus is the Christ, of God he hath been begotten, and every one who is loving Him who did beget, doth love also him who is begotten of Him:";
yng[2] = "in this we know that we love the children of God, when we may love God, and His commands may keep;";
yng[3] = "for this is the love of God, that His commands we may keep, and His commands are not burdensome;";
yng[4] = "because every one who is begotten of God doth overcome the world, and this is the victory that did overcome the world -- our faith;";
yng[5] = "who is he who is overcoming the world, if not he who is believing that Jesus is the Son of God?";
yng[6] = "This one is he who did come through water and blood -- Jesus the Christ, not in the water only, but in the water and the blood; and the Spirit it is that is testifying, because the Spirit is the truth,";
yng[7] = "because three are who are testifying [in the heaven, the Father, the Word, and the Holy Spirit, and these -- the three -- are one;";
yng[8] = "and three are who are testifying in the earth], the Spirit, and the water, and the blood, and the three are into the one.";
yng[9] = "If the testimony of men we receive, the testimony of God is greater, because this is the testimony of God that He hath testified concerning His Son.";
yng[10] = "He who is believing in the Son of God, hath the testimony in himself; he who is not believing God, a liar hath made Him, because he hath not believed in the testimony that God hath testified concerning His Son;";
yng[11] = "and this is the testimony, that life age-during did God give to us, and this -- the life -- is in His Son;";
yng[12] = "he who is having the Son, hath the life; he who is not having the Son of God -- the life he hath not.";
yng[13] = "These things I did write to you who are believing in the name of the Son of God, that ye may know that life ye have age-during, and that ye may believe in the name of the Son of God.";
yng[14] = "And this is the boldness that we have toward Him, that if anything we may ask according to his will, He doth hear us,";
yng[15] = "and if we have known that He doth hear us, whatever we may ask, we have known that we have the requests that we have requested from Him.";
yng[16] = "If any one may see his brother sinning a sin not unto death, he shall ask, and He shall give to him life to those sinning not unto death; there is sin to death, not concerning it do I speak that he may beseech;";
yng[17] = "all unrighteousness is sin, and there is sin not unto death.";
yng[18] = "We have known that every one who hath been begotten of God doth not sin, but he who was begotten of God doth keep himself, and the evil one doth not touch him;";
yng[19] = "we have known that of God we are, and the whole world in the evil doth lie;";
yng[20] = "and we have known that the Son of God is come, and hath given us a mind, that we may know Him who is true, and we are in Him who is true, in His Son Jesus Christ; this one is the true God and the life age-during!";
yng[21] = "Little children, guard yourselves from the idols! Amen.";
