csb[1] = "Dear friends, do not believe every spirit, but test the spirits to see if they are from God, because many false prophets have gone out into the world.";
csb[2] = "This is how you know the Spirit of God: Every spirit that confesses that Jesus Christ has come in the flesh is from God,";
csb[3] = "but every spirit that does not confess Jesus is not from God. This is the spirit of the antichrist, which you have heard is coming; even now it is already in the world.";
csb[4] = "You are from God, little children, and you have conquered them, because the one who is in you is greater than the one who is in the world.";
csb[5] = "They are from the world. Therefore what they say is from the world, and the world listens to them.";
csb[6] = "We are from God. Anyone who knows God listens to us; anyone who is not from God does not listen to us. This is how we know the Spirit of truth and the spirit of deception.";
csb[7] = "Dear friends, let us love one another, because love is from God, and everyone who loves has been born of God and knows God.";
csb[8] = "The one who does not love does not know God, because God is love.";
csb[9] = "God\'s love was revealed among us in this way: God sent his one and only Son into the world so that we might live through him.";
csb[10] = "Love consists in this: not that we loved God, but that he loved us and sent his Son to be the atoning sacrifice for our sins.";
csb[11] = "Dear friends, if God loved us in this way, we also must love one another.";
csb[12] = "No one has ever seen God. If we love one another, God remains in us and his love is made complete in us.";
csb[13] = "This is how we know that we remain in him and he in us: He has given us of his Spirit.";
csb[14] = "And we have seen and we testify that the Father has sent his Son as the world\'s Savior.";
csb[15] = "Whoever confesses that Jesus is the Son of God -- God remains in him and he in God.";
csb[16] = "And we have come to know and to believe the love that God has for us. God is love, and the one who remains in love remains in God, and God remains in him.";
csb[17] = "In this, love is made complete with us so that we may have confidence in the day of judgment, because as he is, so also are we in this world.";
csb[18] = "There is no fear in love; instead, perfect love drives out fear, because fear involves punishment. So the one who fears is not complete in love.";
csb[19] = "We love because he first loved us.";
csb[20] = "If anyone says, &quot;I love God,&quot; and yet hates his brother or sister, he is a liar. For the person who does not love his brother or sister whom he has seen cannot love God whom he has not seen.";
csb[21] = "And we have this command from him: The one who loves God must also love his brother and sister.";
asv[1] = "Beloved, believe not every spirit, but prove the spirits, whether they are of God; because many false prophets are gone out into the world.";
asv[2] = "Hereby know ye the Spirit of God: every spirit that confesseth that Jesus Christ is come in the flesh is of God:";
asv[3] = "and every spirit that confesseth not Jesus is not of God: and this is the [spirit] of the antichrist, whereof ye have heard that it cometh; and now it is in the world already.";
asv[4] = "Ye are of God, [my] little children, and have overcome them: because greater is he that is in you than he that is in the world.";
asv[5] = "They are of the world: therefore speak they [as] of the world, and the world heareth them.";
asv[6] = "We are of God: he that knoweth God heareth us; he who is not of God heareth us not. By this we know the spirit of truth, and the spirit of error.";
asv[7] = "Beloved, let us love one another: for love is of God; and every one that loveth is begotten of God, and knoweth God.";
asv[8] = "He that loveth not knoweth not God; for God is love.";
asv[9] = "Herein was the love of God manifested in us, that God hath sent his only begotten Son into the world that we might live through him.";
asv[10] = "Herein is love, not that we loved God, but that he loved us, and sent his Son [to be] the propitiation for our sins.";
asv[11] = "Beloved, if God so loved us, we also ought to love one another.";
asv[12] = "No man hath beheld God at any time: if we love one another, God abideth in us, and his love is perfected in us:";
asv[13] = "hereby we know that we abide in him and he in us, because he hath given us of his Spirit.";
asv[14] = "And we have beheld and bear witness that the Father hath sent the Son [to be] the Saviour of the world.";
asv[15] = "Whosoever shall confess that Jesus is the Son of God, God abideth in him, and he in God.";
asv[16] = "And we know and have believed the love which God hath in us. God is love; and he that abideth in love abideth in God, and God abideth in him.";
asv[17] = "Herein is love made perfect with us, that we may have boldness in the day of judgment; because as he is, even so are we in this world.";
asv[18] = "There is no fear in love: but perfect love casteth out fear, because fear hath punishment; and he that feareth is not made perfect in love.";
asv[19] = "We love, because he first loved us.";
asv[20] = "If a man say, I love God, and hateth his brother, he is a liar: for he that loveth not his brother whom he hath seen, cannot love God whom he hath not seen.";
asv[21] = "And this commandment have we from him, that he who loveth God love his brother also.";

vul[1] = "carissimi nolite omni spiritui credere sed probate spiritus si ex Deo sint quoniam multi pseudoprophetae exierunt in mundum";
vul[2] = "in hoc cognoscitur Spiritus Dei omnis spiritus qui confitetur Iesum Christum in carne venisse ex Deo est";
vul[3] = "et omnis spiritus qui solvit Iesum ex Deo non est et hoc est antichristi quod audistis quoniam venit et nunc iam in mundo est";
vul[4] = "vos ex Deo estis filioli et vicistis eos quoniam maior est qui in vobis est quam qui in mundo";
vul[5] = "ipsi de mundo sunt ideo de mundo loquuntur et mundus eos audit";
vul[6] = "nos ex Deo sumus qui novit Deum audit nos qui non est ex Deo non audit nos in hoc cognoscimus Spiritum veritatis et spiritum erroris";
vul[7] = "carissimi diligamus invicem quoniam caritas ex Deo est et omnis qui diligit ex Deo natus est et cognoscit Deum";
vul[8] = "qui non diligit non novit Deum quoniam Deus caritas est";
vul[9] = "in hoc apparuit caritas Dei in nobis quoniam Filium suum unigenitum misit Deus in mundum ut vivamus per eum";
vul[10] = "in hoc est caritas non quasi nos dilexerimus Deum sed quoniam ipse dilexit nos et misit Filium suum propitiationem pro peccatis nostris";
vul[11] = "carissimi si sic Deus dilexit nos et nos debemus alterutrum diligere";
vul[12] = "Deum nemo vidit umquam si diligamus invicem Deus in nobis manet et caritas eius in nobis perfecta est";
vul[13] = "in hoc intellegimus quoniam in eo manemus et ipse in nobis quoniam de Spiritu suo dedit nobis";
vul[14] = "et nos vidimus et testificamur quoniam Pater misit Filium salvatorem mundi";
vul[15] = "quisque confessus fuerit quoniam Iesus est Filius Dei Deus in eo manet et ipse in Deo";
vul[16] = "et nos cognovimus et credidimus caritati quam habet Deus in nobis Deus caritas est et qui manet in caritate in Deo manet et Deus in eo";
vul[17] = "in hoc perfecta est caritas nobiscum ut fiduciam habeamus in die iudicii quia sicut ille est et nos sumus in hoc mundo";
vul[18] = "timor non est in caritate sed perfecta caritas foras mittit timorem quoniam timor poenam habet qui autem timet non est perfectus in caritate";
vul[19] = "nos ergo diligamus quoniam Deus prior dilexit nos";
vul[20] = "si quis dixerit quoniam diligo Deum et fratrem suum oderit mendax est qui enim non diligit fratrem suum quem vidit Deum quem non vidit quomodo potest diligere";
vul[21] = "et hoc mandatum habemus ab eo ut qui diligit Deum diligat et fratrem suum";

yng[18] = "fear is not in the love, but the perfect love doth cast out the fear, because the fear hath punishment, and he who is fearing hath not been made perfect in the love;";
yng[19] = "we -- we love him, because He -- He first loved us;";
