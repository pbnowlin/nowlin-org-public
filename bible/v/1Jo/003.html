csb[1] = "See what great love the Father has given us that we should be called God\'s children -- and we are! The reason the world does not know us is that it didn\'t know him.";
csb[2] = "Dear friends, we are God\'s children now, and what we will be has not yet been revealed. We know that when he appears, we will be like him because we will see him as he is.";
csb[3] = "And everyone who has this hope in him purifies himself just as he is pure.";
csb[4] = "Everyone who commits sin practices lawlessness; and sin is lawlessness.";
csb[5] = "You know that he was revealed so that he might take away sins, and there is no sin in him.";
csb[6] = "Everyone who remains in him does not sin; everyone who sins has not seen him or known him.";
csb[7] = "Children, let no one deceive you. The one who does what is right is righteous, just as he is righteous.";
csb[8] = "The one who commits sin is of the devil, for the devil has sinned from the beginning. The Son of God was revealed for this purpose: to destroy the devil\'s works.";
csb[9] = "Everyone who has been born of God does not sin, because his seed remains in him; he is not able to sin, because he has been born of God.";
csb[10] = "This is how God\'s children and the devil\'s children become obvious. Whoever does not do what is right is not of God, especially the one who does not love his brother or sister.";
csb[11] = "For this is the message you have heard from the beginning: We should love one another,";
csb[12] = "unlike Cain, who was of the evil one and murdered his brother. And why did he murder him? Because his deeds were evil, and his brother\'s were righteous.";
csb[13] = "Do not be surprised, brothers and sisters, if the world hates you.";
csb[14] = "We know that we have passed from death to life because we love our brothers and sisters. The one who does not love remains in death.";
csb[15] = "Everyone who hates his brother or sister is a murderer, and you know that no murderer has eternal life residing in him.";
csb[16] = "This is how we have come to know love: He laid down his life for us. We should also lay down our lives for our brothers and sisters.";
csb[17] = "If anyone has this world\'s goods and sees a fellow believer in need but withholds compassion from him -- how does God\'s love reside in him?";
csb[18] = "Little children, let us not love in word or speech, but in action and in truth.";
csb[19] = "This is how we will know that we belong to the truth and will reassure our hearts before him";
csb[20] = "whenever our hearts condemn us; for God is greater than our hearts, and he knows all things.";
csb[21] = "Dear friends, if our hearts don\'t condemn us, we have confidence before God";
csb[22] = "and receive whatever we ask from him because we keep his commands and do what is pleasing in his sight.";
csb[23] = "Now this is his command: that we believe in the name of his Son Jesus Christ, and love one another as he commanded us.";
csb[24] = "The one who keeps his commands remains in him, and he in him. And the way we know that he remains in us is from the Spirit he has given us.";
asv[1] = "Behold what manner of love the Father hath bestowed upon us, that we should be called children of God; and [such] we are. For this cause the world knoweth us not, because it knew him not.";
asv[2] = "Beloved, now are we children of God, and it is not yet made manifest what we shall be. We know that, if he shall be manifested, we shall be like him; for we shall see him even as he is.";
asv[3] = "And every one that hath this hope [set] on him purifieth himself, even as he is pure.";
asv[4] = "Every one that doeth sin doeth also lawlessness; and sin is lawlessness.";
asv[5] = "And ye know that he was manifested to take away sins; and in him is no sin.";
asv[6] = "Whosoever abideth in him sinneth not: whosoever sinneth hath not seen him, neither knoweth him.";
asv[7] = "[My] little children, let no man lead you astray: he that doeth righteousness is righteous, even as he is righteous:";
asv[8] = "he that doeth sin is of the devil; for the devil sinneth from the beginning. To this end was the Son of God manifested, that he might destroy the works of the devil.";
asv[9] = "Whosoever is begotten of God doeth no sin, because his seed abideth in him: and he cannot sin, because he is begotten of God.";
asv[10] = "In this the children of God are manifest, and the children of the devil: whosoever doeth not righteousness is not of God, neither he that loveth not his brother.";
asv[11] = "For this is the message which ye heard from the beginning, that we should love one another:";
asv[12] = "not as Cain was of the evil one, and slew his brother. And wherefore slew he him? Because his works were evil, and his brother\'s righteous.";
asv[13] = "Marvel not, brethren, if the world hateth you.";
asv[14] = "We know that we have passed out of death into life, because we love the brethren. He that loveth not abideth in death.";
asv[15] = "Whosoever hateth his brother is a murderer: and ye know that no murderer hath eternal life abiding in him.";
asv[16] = "Hereby know we love, because he laid down his life for us: and we ought to lay down our lives for the brethren.";
asv[17] = "But whoso hath the world\'s goods, and beholdeth his brother in need, and shutteth up his compassion from him, how doth the love of God abide in him?";
asv[18] = "[My] little children, let us not love in word, neither with the tongue; but in deed and truth.";
asv[19] = "Hereby shall we know that we are of the truth, and shall assure our heart before him:";
asv[20] = "because if our heart condemn us, God is greater than our heart, and knoweth all things.";
asv[21] = "Beloved, if our heart condemn us not, we have boldness toward God;";
asv[22] = "and whatsoever we ask we receive of him, because we keep his commandments and do the things that are pleasing in his sight.";
asv[23] = "And this is his commandment, that we should believe in the name of his Son Jesus Christ, and love one another, even as he gave us commandment.";
asv[24] = "And he that keepeth his commandments abideth in him, and he in him. And hereby we know that he abideth in us, by the Spirit which he gave us.";

rsv[1] = "See what love the Father has given us, that we should be called children of God; and so we are. The reason why the world does not know us is that it did not know him.";

vul[1] = "videte qualem caritatem dedit nobis Pater ut filii Dei nominemur et sumus propter hoc mundus non novit nos quia non novit eum";
vul[2] = "carissimi nunc filii Dei sumus et nondum apparuit quid erimus scimus quoniam cum apparuerit similes ei erimus quoniam videbimus eum sicuti est";
vul[3] = "et omnis qui habet spem hanc in eo sanctificat se sicut et ille sanctus est";
vul[4] = "omnis qui facit peccatum et iniquitatem facit et peccatum est iniquitas";
vul[5] = "et scitis quoniam ille apparuit ut peccata tolleret et peccatum in eo non est";
vul[6] = "omnis qui in eo manet non peccat omnis qui peccat non vidit eum nec cognovit eum";
vul[7] = "filioli nemo vos seducat qui facit iustitiam iustus est sicut et ille iustus est";
vul[8] = "qui facit peccatum ex diabolo est quoniam ab initio diabolus peccat in hoc apparuit Filius Dei ut dissolvat opera diaboli";
vul[9] = "omnis qui natus est ex Deo peccatum non facit quoniam semen ipsius in eo manet et non potest peccare quoniam ex Deo natus est";
vul[10] = "in hoc manifesti sunt filii Dei et filii diaboli omnis qui non est iustus non est de Deo et qui non diligit fratrem suum";
vul[11] = "quoniam haec est adnuntiatio quam audistis ab initio ut diligamus alterutrum";
vul[12] = "non sicut Cain ex maligno erat et occidit fratrem suum et propter quid occidit eum quoniam opera eius maligna erant fratris autem eius iusta";
vul[13] = "nolite mirari fratres si odit vos mundus";
vul[14] = "nos scimus quoniam translati sumus de morte in vitam quoniam diligimus fratres qui non diligit manet in morte";
vul[15] = "omnis qui odit fratrem suum homicida est et scitis quoniam omnis homicida non habet vitam aeternam in se manentem";
vul[16] = "in hoc cognovimus caritatem quoniam ille pro nobis animam suam posuit et nos debemus pro fratribus animas ponere";
vul[17] = "qui habuerit substantiam mundi et viderit fratrem suum necesse habere et clauserit viscera sua ab eo quomodo caritas Dei manet in eo";
vul[18] = "filioli non diligamus verbo nec lingua sed opere et veritate";
vul[19] = "in hoc cognoscimus quoniam ex veritate sumus et in conspectu eius suadeamus corda nostra";
vul[20] = "quoniam si reprehenderit nos cor maior est Deus corde nostro et novit omnia";
vul[21] = "carissimi si cor non reprehenderit nos fiduciam habemus ad Deum";
vul[22] = "et quodcumque petierimus accipiemus ab eo quoniam mandata eius custodimus et ea quae sunt placita coram eo facimus";
vul[23] = "et hoc est mandatum eius ut credamus in nomine Filii eius Iesu Christi et diligamus alterutrum sicut dedit mandatum nobis";
vul[24] = "et qui servat mandata eius in illo manet et ipse in eo et in hoc scimus quoniam manet in nobis de Spiritu quem nobis dedit";

yng[17] = "and whoever may have the goods of the world, and may view his brother having need, and may shut up his bowels from him -- how doth the love of God remain in him?";
yng[18] = "My little children, may we not love in word nor in tongue, but in word and in truth!";
yng[19] = "and in this we know that of the truth we are, and before Him we shall assure our hearts,";
yng[20] = "because if our heart may condemn -- because greater is God than our heart, and He doth know all things.";
yng[21] = "Beloved, if our heart may not condemn us, we have boldness toward God,";
yng[22] = "and whatever we may ask, we receive from Him, because His commands we keep, and the things pleasing before Him we do,";
yng[23] = "and this is His command, that we may believe in the name of His Son Jesus Christ, and may love one another, even as He did give command to us,";
yng[24] = "and he who is keeping His commands, in Him he doth remain, and He in him; and in this we know that He doth remain in us, from the Spirit that He gave us.";
</script>
