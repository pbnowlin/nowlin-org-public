csb[1] = "My little children, I am writing you these things so that you may not sin. But if anyone does sin, we have an advocate with the Father -- Jesus Christ the righteous one.";
csb[2] = "He himself is the atoning sacrifice for our sins, and not only for ours, but also for those of the whole world.";
csb[3] = "This is how we know that we know him: if we keep his commands.";
csb[4] = "The one who says, &quot;I have come to know him,&quot; and yet doesn\'t keep his commands, is a liar, and the truth is not in him.";
csb[5] = "But whoever keeps his word, truly in him the love of God is made complete. This is how we know we are in him:";
csb[6] = "The one who says he remains in him should walk just as he walked.";
csb[7] = "Dear friends, I am not writing you a new command but an old command that you have had from the beginning. The old command is the word you have heard.";
csb[8] = "Yet I am writing you a new command, which is true in him and in you, because the darkness is passing away and the true light is already shining.";
csb[9] = "The one who says he is in the light but hates his brother or sister is in the darkness until now.";
csb[10] = "The one who loves his brother or sister remains in the light, and there is no cause for stumbling in him.";
csb[11] = "But the one who hates his brother or sister is in the darkness, walks in the darkness, and doesn\'t know where he\'s going, because the darkness has blinded his eyes.";
csb[12] = "I am writing to you, little children, since your sins have been forgiven on account of his name.";
csb[13] = "I am writing to you, fathers, because you have come to know the one who is from the beginning. I am writing to you, young men, because you have conquered the evil one.";
csb[14] = "I have written to you, children, because you have come to know the Father. I have written to you, fathers, because you have come to know the one who is from the beginning. I have written to you, young men, because you are strong, God\'s word remains in you, and you have conquered the evil one.";
csb[15] = "Do not love the world or the things in the world. If anyone loves the world, the love of the Father is not in him.";
csb[16] = "For everything in the world -- the lust of the flesh, the lust of the eyes, and the pride in one\'s possessions -- is not from the Father, but is from the world.";
csb[17] = "And the world with its lust is passing away, but the one who does the will of God remains forever.";
csb[18] = "Children, it is the last hour. And as you have heard that antichrist is coming, even now many antichrists have come. By this we know that it is the last hour.";
csb[19] = "They went out from us, but they did not belong to us; for if they had belonged to us, they would have remained with us. However, they went out so that it might be made clear that none of them belongs to us.";
csb[20] = "But you have an anointing from the Holy One, and all of you know the truth.";
csb[21] = "I have not written to you because you don\'t know the truth, but because you do know it, and because no lie comes from the truth.";
csb[22] = "Who is the liar, if not the one who denies that Jesus is the Christ? This one is the antichrist: the one who denies the Father and the Son.";
csb[23] = "No one who denies the Son has the Father; he who confesses the Son has the Father as well.";
csb[24] = "What you have heard from the beginning is to remain in you. If what you have heard from the beginning remains in you, then you will remain in the Son and in the Father.";
csb[25] = "And this is the promise that he himself made to us: eternal life.";
csb[26] = "I have written these things to you concerning those who are trying to deceive you.";
csb[27] = "As for you, the anointing you received from him remains in you, and you don\'t need anyone to teach you. Instead, his anointing teaches you about all things and is true and is not a lie; just as it has taught you, remain in him.";
csb[28] = "So now, little children, remain in him so that when he appears we may have confidence and not be ashamed before him at his coming.";
csb[29] = "If you know that he is righteous, you know this as well: Everyone who does what is right has been born of him.";
asv[1] = "My little children, these things write I unto you that ye may not sin. And if any man sin, we have an Advocate with the Father, Jesus Christ the righteous:";
asv[2] = "and he is the propitiation for our sins; and not for ours only, but also for the whole world.";
asv[3] = "And hereby we know that we know him, if we keep his commandments.";
asv[4] = "He that saith, I know him, and keepeth not his commandments, is a liar, and the truth is not in him;";
asv[5] = "but whoso keepeth his word, in him verily hath the love of God been perfected. Hereby we know that we are in him:";
asv[6] = "he that saith he abideth in him ought himself also to walk even as he walked.";
asv[7] = "Beloved, no new commandment write I unto you, but an old commandment which ye had from the beginning: the old commandment is the word which ye heard.";

asv[9] = "He that saith he is in the light and hateth his brother, is in the darkness even until now.";
asv[10] = "He that loveth his brother abideth in the light, and there is no occasion of stumbling in him.";
asv[11] = "But he that hateth his brother is in the darkness, and walketh in the darkness, and knoweth not whither he goeth, because the darkness hath blinded his eyes.";
asv[12] = "I write unto you, [my] little children, because your sins are forgiven you for his name\'s sake.";
asv[13] = "I write unto you, fathers, because ye know him who is from the beginning. I write unto you, young men, because ye have overcome the evil one. I have written unto you, little children, because ye know the Father.";
asv[14] = "I have written unto you, fathers, because ye know him who is from the beginning. I have written unto you, young men, because ye are strong, and the word of God abideth in you, and ye have overcome the evil one.";
asv[15] = "Love not the world, neither the things that are in the world. If any man love the world, the love of the Father is not in him.";
asv[16] = "For all that is in the world, the lust of the flesh and the lust of the eyes and the vainglory of life, is not of the Father, but is of the world.";
asv[17] = "And the world passeth away, and the lust thereof: but he that doeth the will of God abideth for ever.";
asv[18] = "Little children, it is the last hour: and as ye heard that antichrist cometh, even now have there arisen many antichrists; whereby we know that it is the last hour.";
asv[19] = "They went out from us, but they were not of us; for if they had been of us, they would have continued with us: but [they went out], that they might be made manifest that they all are not of us.";
asv[20] = "And ye have an anointing from the Holy One, and ye know all things.";
asv[21] = "I have not written unto you because ye know not the truth, but because ye know it, and because no lie is of the truth.";
asv[22] = "Who is the liar but he that denieth that Jesus is the Christ? This is the antichrist, [even] he that denieth the Father and the Son.";
asv[23] = "Whosoever denieth the Son, the same hath not the Father: he that confesseth the Son hath the Father also.";
asv[24] = "As for you, let that abide in you which ye heard from the beginning. If that which ye heard from the beginning abide in you, ye also shall abide in the Son, and in the Father.";
asv[25] = "And this is the promise which he promised us, [even] the life eternal.";
asv[26] = "These things have I written unto you concerning them that would lead you astray.";
asv[27] = "And as for you, the anointing which ye received of him abideth in you, and ye need not that any one teach you; but as his anointing teacheth you concerning all things, and is true, and is no lie, and even as it taught you, ye abide in him.";
asv[28] = "And now, [my] little children, abide in him; that, if he shall be manifested, we may have boldness, and not be ashamed before him at his coming.";
asv[29] = "If ye know that he is righteous, ye know that every one also that doeth righteousness is begotten of him.";

kjv[1] = "My little children, these things write I unto you, that ye sin not. And if any man sin, we have an advocate with the Father, Jesus Christ the righteous:";
kjv[2] = "And he is the propitiation for our sins: and not for ours only, but also for [the sins of] the whole world.";
kjv[3] = "And hereby we do know that we know him, if we keep his commandments.";
kjv[4] = "He that saith, I know him, and keepeth not his commandments, is a liar, and the truth is not in him.";
kjv[5] = "But whoso keepeth his word, in him verily is the love of God perfected: hereby know we that we are in him.";
kjv[6] = "He that saith he abideth in him ought himself also so to walk, even as he walked.";
kjv[7] = "Brethren, I write no new commandment unto you, but an old commandment which ye had from the beginning. The old commandment is the word which ye have heard from the beginning.";
kjv[8] = "Again, a new commandment I write unto you, which thing is true in him and in you: because the darkness is past, and the true light now shineth.";
kjv[9] = "He that saith he is in the light, and hateth his brother, is in darkness even until now.";
kjv[10] = "He that loveth his brother abideth in the light, and there is none occasion of stumbling in him.";
kjv[11] = "But he that hateth his brother is in darkness, and walketh in darkness, and knoweth not whither he goeth, because that darkness hath blinded his eyes.";
kjv[12] = "I write unto you, little children, because your sins are forgiven you for his name\'s sake.";
kjv[13] = "I write unto you, fathers, because ye have known him [that is] from the beginning. I write unto you, young men, because ye have overcome the wicked one. I write unto you, little children, because ye have known the Father.";
kjv[14] = "I have written unto you, fathers, because ye have known him [that is] from the beginning. I have written unto you, young men, because ye are strong, and the word of God abideth in you, and ye have overcome the wicked one.";
kjv[15] = "Love not the world, neither the things [that are] in the world. If any man love the world, the love of the Father is not in him.";
kjv[16] = "For all that [is] in the world, the lust of the flesh, and the lust of the eyes, and the pride of life, is not of the Father, but is of the world.";
kjv[17] = "And the world passeth away, and the lust thereof: but he that doeth the will of God abideth for ever.";
kjv[18] = "Little children, it is the last time: and as ye have heard that antichrist shall come, even now are there many antichrists; whereby we know that it is the last time.";
kjv[19] = "They went out from us, but they were not of us; for if they had been of us, they would [no doubt] have continued with us: but [they went out], that they might be made manifest that they were not all of us.";
kjv[20] = "But ye have an unction from the Holy One, and ye know all things.";
kjv[21] = "I have not written unto you because ye know not the truth, but because ye know it, and that no lie is of the truth.";
kjv[22] = "Who is a liar but he that denieth that Jesus is the Christ? He is antichrist, that denieth the Father and the Son.";
kjv[23] = "Whosoever denieth the Son, the same hath not the Father: [(but) he that acknowledgeth the Son hath the Father also].";
kjv[24] = "Let that therefore abide in you, which ye have heard from the beginning. If that which ye have heard from the beginning shall remain in you, ye also shall continue in the Son, and in the Father.";
kjv[25] = "And this is the promise that he hath promised us, [even] eternal life.";
kjv[26] = "These [things] have I written unto you concerning them that seduce you.";
kjv[27] = "But the anointing which ye have received of him abideth in you, and ye need not that any man teach you: but as the same anointing teacheth you of all things, and is truth, and is no lie, and even as it hath taught you, ye shall abide in him.";
kjv[28] = "And now, little children, abide in him; that, when he shall appear, we may have confidence, and not be ashamed before him at his coming.";
kjv[29] = "If ye know that he is righteous, ye know that every one that doeth righteousness is born of him.";

vul[1] = "filioli mei haec scribo vobis ut non peccetis sed et si quis peccaverit advocatum habemus apud Patrem Iesum Christum iustum";
vul[2] = "et ipse est propitiatio pro peccatis nostris non pro nostris autem tantum sed etiam pro totius mundi";
vul[3] = "et in hoc scimus quoniam cognovimus eum si mandata eius observemus";
vul[4] = "qui dicit se nosse eum et mandata eius non custodit mendax est in hoc veritas non est";
vul[5] = "qui autem servat verbum eius vere in hoc caritas Dei perfecta est in hoc scimus quoniam in ipso sumus";
vul[6] = "qui dicit se in ipso manere debet sicut ille ambulavit et ipse ambulare";
vul[7] = "carissimi non mandatum novum scribo vobis sed mandatum vetus quod habuistis ab initio mandatum vetus est verbum quod audistis";
vul[8] = "iterum mandatum novum scribo vobis quod est verum et in ipso et in vobis quoniam tenebrae transeunt et lumen verum iam lucet";
vul[9] = "qui dicit se in luce esse et fratrem suum odit in tenebris est usque adhuc";
vul[10] = "qui diligit fratrem suum in lumine manet et scandalum in eo non est";
vul[11] = "qui autem odit fratrem suum in tenebris est et in tenebris ambulat et nescit quo eat quoniam tenebrae obcaecaverunt oculos eius";
vul[12] = "scribo vobis filioli quoniam remittuntur vobis peccata propter nomen eius";
vul[13] = "scribo vobis patres quoniam cognovistis eum qui ab initio est scribo vobis adulescentes quoniam vicistis malignum";
vul[14] = "scripsi vobis infantes quoniam cognovistis Patrem scripsi vobis patres quia cognovistis eum qui ab initio scripsi vobis adulescentes quia fortes estis et verbum Dei in vobis manet et vicistis malignum";
vul[15] = "nolite diligere mundum neque ea quae in mundo sunt si quis diligit mundum non est caritas Patris in eo";
vul[16] = "quoniam omne quod est in mundo concupiscentia carnis et concupiscentia oculorum est et superbia vitae quae non est ex Patre sed ex mundo est";
vul[17] = "et mundus transit et concupiscentia eius qui autem facit voluntatem Dei manet in aeternum";
vul[18] = "filioli novissima hora est et sicut audistis quia antichristus venit nunc antichristi multi facti sunt unde scimus quoniam novissima hora est";
vul[19] = "ex nobis prodierunt sed non erant ex nobis nam si fuissent ex nobis permansissent utique nobiscum sed ut manifesti sint quoniam non sunt omnes ex nobis";
vul[20] = "sed vos unctionem habetis a Sancto et nostis omnia";
vul[21] = "non scripsi vobis quasi ignorantibus veritatem sed quasi scientibus eam et quoniam omne mendacium ex veritate non est";
vul[22] = "quis est mendax nisi is qui negat quoniam Iesus non est Christus hic est antichristus qui negat Patrem et Filium";
vul[23] = "omnis qui negat Filium nec Patrem habet qui confitetur Filium et Patrem habet";
vul[24] = "vos quod audistis ab initio in vobis permaneat si in vobis permanserit quod ab initio audistis et vos in Filio et Patre manebitis";
vul[25] = "et haec est repromissio quam ipse pollicitus est nobis vitam aeternam";
vul[26] = "haec scripsi vobis de eis qui seducunt vos";
vul[27] = "et vos unctionem quam accepistis ab eo manet in vobis et non necesse habetis ut aliquis doceat vos sed sicut unctio eius docet vos de omnibus et verum est et non est mendacium et sicut docuit vos manete in eo";
vul[28] = "et nunc filioli manete in eo ut cum apparuerit habeamus fiduciam et non confundamur ab eo in adventu eius";
vul[29] = "si scitis quoniam iustus est scitote quoniam et omnis qui facit iustitiam ex ipso natus est";
web[1] = "My little children, these things I write to you, that ye sin not. And if any man sinneth, we have an advocate with the Father, Jesus Christ the righteous:";
web[2] = "And he is the propitiation for our sins: and not for ours only, but also for [the sins of] the whole world.";
web[3] = "And by this we do know that we know him, if we keep his commandments.";
web[4] = "He that saith, I know him, and keepeth not his commandments, is a liar, and the truth is not in him.";
web[5] = "But whoever keepeth his word, in him verily is the love of God perfected: by this we know that we are in him.";
web[6] = "He that saith he abideth in him, ought himself also so to walk, even as he walked.";
web[7] = "Brethren, I write no new commandment to you, but an old commandment which ye had from the beginning: The old commandment is the word which ye have heard from the beginning.";
web[8] = "Again, a new commandment I write to you, which thing is true in him and in you: because the darkness is past, and the true light now shineth.";
web[9] = "He that saith he is in the light, and hateth his brother, is in darkness even until now.";
web[10] = "He that loveth his brother abideth in the light, and there is no occasion of stumbling in him.";
web[11] = "But he that hateth his brother is in darkness, and walketh in darkness, and knoweth not whither he goeth, because darkness hath blinded his eyes.";
web[12] = "I write to you, little children, because your sins are forgiven you for his name\'s sake.";
web[13] = "I write to you, fathers, because ye have known him [that is] from the beginning. I write to you, young men, because ye have overcome the wicked one. I write to you, little children, because ye have known the Father.";
web[14] = "I have written to you, fathers, because ye have known him [that is] from the beginning. I have written to you, young men, because ye are strong, and the word of God abideth in you, and ye have overcome the wicked one.";
web[15] = "Love not the world, neither the things [that are] in the world. If any man loveth the world, the love of the Father is not in him.";
web[16] = "For all that [is] in the world, the lust of the flesh, and the lust of the eyes, and the pride of life, is not from the Father, but is from the world.";
web[17] = "And the world passeth away, and the lust of it: but he that doeth the will of God abideth for ever.";
web[18] = "Little children, it is the last time: and as ye have heard that antichrist cometh, even now are there many antichrists; by which we know that it is the last time.";
web[19] = "They went out from us, but they were not of us; for if they had been of us, they would [no doubt] have continued with us: but [they went out], that they might be made manifest that they were not all of us.";
web[20] = "But ye have an unction from the Holy One, and ye know all things.";
web[21] = "I have not written to you because ye know not the truth, but because ye know it, and that no lie is of the truth.";
web[22] = "Who is a liar but he that denieth that Jesus is the Christ? He is antichrist, that denieth the Father and the Son.";
web[23] = "Whoever denieth the Son, the same hath not the Father: [[but] he that acknowledgeth the Son hath the Father also].";
web[24] = "Let that therefore abide in you, which ye have heard from the beginning. If that which ye have heard from the beginning shall remain in you, ye also shall continue in the Son, and in the Father.";
web[25] = "And this is the promise that he hath promised us, [even] eternal life.";
web[26] = "These [things] have I written to you concerning them that seduce you.";
web[27] = "But the anointing which ye have received from him abideth in you, and ye need not that any man should teach you: but as the same anointing teacheth you concerning all things, and is truth, and is no lie, and even as it hath taught you, ye shall abide in him.";
web[28] = "And now, little children, abide in him; that when he shall appear, we may have confidence, and not be ashamed before him at his coming.";
web[29] = "If ye know that he is righteous ye know that every one that doeth righteousness is born of him.";
yng[1] = "My little children, these things I write to you, that ye may not sin: and if any one may sin, an advocate we have with the Father, Jesus Christ, a righteous one,";
yng[2] = "and he -- he is a propitiation for our sins, and not for ours only, but also for the whole world,";
yng[3] = "and in this we know that we have known him, if his commands we may keep;";
yng[4] = "he who is saying, `I have known him,\' and his command is not keeping, a liar he is, and in him the truth is not;";
yng[5] = "and whoever may keep his word, truly in him the love of God hath been perfected; in this we know that in him we are.";
yng[6] = "He who is saying in him he doth remain, ought according as he walked also himself so to walk.";
yng[7] = "Brethren, a new command I write not to you, but an old command, that ye had from the beginning -- the old command is the word that ye heard from the beginning;";
yng[8] = "again, a new command I write to you, which thing is true in him and in you, because the darkness doth pass away, and the true light doth now shine;";
yng[9] = "he who is saying, in the light he is, and his brother is hating, in the darkness he is till now;";
yng[10] = "he who is loving his brother, in the light he doth remain, and a stumbling-block in him there is not;";
yng[11] = "and he who is hating his brother, in the darkness he is, and in the darkness he doth walk, and he hath not known whither he doth go, because the darkness did blind his eyes.";
yng[12] = "I write to you, little children, because the sins have been forgiven you through his name;";
yng[13] = "I write to you, fathers, because ye have known him who [is] from the beginning; I write to you, young men, because ye have overcome the evil. I write to you, little youths, because ye have known the Father:";
yng[14] = "I did write to you, fathers, because ye have known him who [is] from the beginning; I did write to you, young men, because ye are strong, and the word of God in you doth remain, and ye have overcome the evil.";
yng[15] = "Love not ye the world, nor the things in the world; if any one doth love the world, the love of the Father is not in him,";
yng[16] = "because all that [is] in the world -- the desire of the flesh, and the desire of the eyes, and the ostentation of the life -- is not of the Father, but of the world,";
yng[17] = "and the world doth pass away, and the desire of it, and he who is doing the will of God, he doth remain -- to the age.";
yng[18] = "Little youths, it is the last hour; and even as ye heard that the antichrist doth come, even now antichrists have become many -- whence we know that it is the last hour;";
yng[19] = "out of us they went forth, but they were not of us, for if they had been of us, they would have remained with us; but -- that they might be manifested that they are not all of us.";
yng[20] = "And ye have an anointing from the Holy One, and have known all things;";
yng[21] = "I did not write to you because ye have not known the truth, but because ye have known it, and because no lie is of the truth.";
yng[22] = "Who is the liar, except he who is denying that Jesus is the Christ? this one is the antichrist who is denying the Father and the Son;";
yng[23] = "every one who is denying the Son, neither hath he the Father, [he who is confessing the Son hath the Father also.]";
yng[24] = "Ye, then, that which ye heard from the beginning, in you let it remain; if in you may remain that which from the beginning ye did hear, ye also in the Son and in the Father shall remain,";
yng[25] = "and this is the promise that He did promise us -- the life the age-during.";
yng[26] = "These things I did write to you concerning those leading you astray;";
yng[27] = "and you, the anointing that ye did receive from him, in you it doth remain, and ye have no need that any one may teach you, but as the same anointing doth teach you concerning all, and is true, and is not a lie, and even as was taught you, ye shall remain in him.";
yng[28] = "And now, little children, remain in him, that when he may be manifested, we may have boldness, and may not be ashamed before him, in his presence;";
yng[29] = "if ye know that he is righteous, know ye that every one doing the righteousness, of him hath been begotten.";
</script>
