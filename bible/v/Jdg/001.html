csb[1] = "After the death of Joshua, the Israelites inquired of the LORD, &quot;Who will be the first to fight for us against the Canaanites? &quot;";
csb[2] = "The LORD answered, &quot;Judah is to go. I have handed the land over to him.&quot;";
csb[3] = "Judah said to his brother Simeon, &quot;Come with me to my allotted territory, and let us fight against the Canaanites. I will also go with you to your allotted territory.&quot; So Simeon went with him.";
csb[4] = "When Judah attacked, the LORD handed the Canaanites and Perizzites over to them. They struck down ten thousand men in Bezek.";
csb[5] = "They found Adoni-bezek in Bezek, fought against him, and struck down the Canaanites and Perizzites.";
csb[6] = "When Adoni-bezek fled, they pursued him, caught him, and cut off his thumbs and big toes.";
csb[7] = "Adoni-bezek said, &quot;Seventy kings with their thumbs and big toes cut off used to pick up scraps under my table. God has repaid me for what I have done.&quot; They brought him to Jerusalem, and he died there.";
csb[8] = "The men of Judah fought against Jerusalem, captured it, put it to the sword, and set the city on fire.";
csb[9] = "Afterward, the men of Judah marched down to fight against the Canaanites who were living in the hill country, the Negev, and the Judean foothills.";
csb[10] = "Judah also marched against the Canaanites who were living in Hebron (Hebron was formerly named Kiriath-arba). They struck down Sheshai, Ahiman, and Talmai.";
csb[11] = "From there they marched against the residents of Debir (Debir was formerly named Kiriath-sepher).";
csb[12] = "Caleb said, &quot;Whoever attacks and captures Kiriath-sepher, I will give my daughter Achsah to him as a wife.&quot;";
csb[13] = "So Othniel son of Kenaz, Caleb\'s youngest brother, captured it, and Caleb gave his daughter Achsah to him as his wife.";
csb[14] = "When she arrived, she persuaded Othniel to ask her father for a field. As she got off her donkey, Caleb asked her, &quot;What do you want? &quot;";
csb[15] = "She answered him, &quot;Give me a blessing. Since you have given me land in the Negev, give me springs also.&quot; So Caleb gave her both the upper and lower springs.";
csb[16] = "The descendants of the Kenite, Moses\'s father-in-law, had gone up with the men of Judah from the City of Palms to the Wilderness of Judah, which was in the Negev of Arad. They went to live among the people.";
csb[17] = "Judah went with his brother Simeon, struck the Canaanites who were living in Zephath, and completely destroyed the town. So they named the town Hormah.";
csb[18] = "Judah captured Gaza and its territory, Ashkelon and its territory, and Ekron and its territory.";
csb[19] = "The LORD was with Judah and enabled them to take possession of the hill country, but they could not drive out the people who were living in the valley because those people had iron chariots.";
csb[20] = "Judah gave Hebron to Caleb, just as Moses had promised. Then Caleb drove out the three sons of Anak who lived there.";
csb[21] = "At the same time the Benjaminites did not drive out the Jebusites who were living in Jerusalem. The Jebusites have lived among the Benjaminites in Jerusalem to this day.";
csb[22] = "The house of Joseph also attacked Bethel, and the LORD was with them.";
csb[23] = "They sent spies to Bethel (the town was formerly named Luz).";
csb[24] = "The spies saw a man coming out of the town and said to him, &quot;Please show us how to get into town, and we will show you kindness.&quot;";
csb[25] = "When he showed them the way into the town, they put the town to the sword but released the man and his entire family.";
csb[26] = "Then the man went to the land of the Hittites, built a town, and named it Luz. That is its name still today.";
csb[27] = "At that time Manasseh failed to take possession of Beth-shean and Taanach and their surrounding villages, or the residents of Dor, Ibleam, and Megiddo and their surrounding villages; the Canaanites were determined to stay in this land.";
csb[28] = "When Israel became stronger, they made the Canaanites serve as forced labor but never drove them out completely.";
csb[29] = "At that time Ephraim failed to drive out the Canaanites who were living in Gezer, so the Canaanites have lived among them in Gezer.";
csb[30] = "Zebulun failed to drive out the residents of Kitron or the residents of Nahalol, so the Canaanites lived among them and served as forced labor.";
csb[31] = "Asher failed to drive out the residents of Acco or of Sidon, or Ahlab, Achzib, Helbah, Aphik, or Rehob.";
csb[32] = "The Asherites lived among the Canaanites who were living in the land, because they failed to drive them out.";
csb[33] = "Naphtali did not drive out the residents of Beth-shemesh or the residents of Beth-anath. They lived among the Canaanites who were living in the land, but the residents of Beth-shemesh and Beth-anath served as their forced labor.";
csb[34] = "The Amorites forced the Danites into the hill country and did not allow them to go down into the valley.";
csb[35] = "The Amorites were determined to stay in Har-heres, Aijalon, and Shaalbim. When the house of Joseph got the upper hand, the Amorites were made to serve as forced labor.";
csb[36] = "The territory of the Amorites extended from the Scorpions\' Ascent, that is from Sela upward.";

rsv[17] = "And Judah went with Simeon his brother, and they defeated the Canaanites who inhabited Zephath, and utterly destroyed it. So the name of the city was called Hormah.";
asv[17] = "And Judah went with Simeon his brother, and they smote the Canaanites that inhabited Zephath, and utterly destroyed it. And the name of the city was called Hormah.";
yng[17] = "And Judah goeth with Simeon his brother, and they smite the Canaanite inhabiting Zephath, and devote it; and [one] calleth the name of the city Hormah.";
dby[17] = "And Judah went with Simeon his brother, and they slew the Canaanites that inhabited Zephath, and utterly destroyed it; and they called the name of the city Hormah.";
web[17] = "And Judah went with Simeon his brother, and they slew the Canaanites that inhabited Zephath, and utterly destroyed it. And the name of the city was called Hormah.";
hnv[17] = " Yehudah went with Shim`on his brother, and they struck the Kana`anim who inhabited Tzefat, and utterly destroyed it. The name of the city was called Hormah.";
vul[17] = "abiit autem Iudas cum Symeone fratre suo et percusserunt simul Chananeum qui habitabat in Sephath et interfecerunt eum vocatumque est nomen urbis Horma id est anathema";
kjv[18] = "Also Judah took Gaza with the coast thereof, and Askelon with the coast thereof, and Ekron with the coast thereof.";
rsv[18] = "Judah also took Gaza with its territory, and Ash\'kelon with its territory, and Ekron with its territory.";
asv[18] = "Also Judah took Gaza with the border thereof, and Ashkelon with the border thereof, and Ekron with the border thereof.";
yng[18] = "And Judah captureth Gaza and its border, and Askelon and its border, and Ekron and its border;";
dby[18] = "And Judah took Gazah and its border, and Ashkelon and its border, and Ekron and its border.";
web[18] = "Also Judah took Gaza with its border, and Askelon with its border, and Ekron with its border.";
hnv[18] = "Also Yehudah took `Aza with the border of it, and Ashkelon with the border of it, and `Ekron with the border of it.";
vul[18] = "cepitque Iudas Gazam cum finibus suis et Ascalonem atque Accaron cum terminis suis";
kjv[19] = "And the LORD was with Judah; and he drave out [the inhabitants of] the mountain; but could not drive out the inhabitants of the valley, because they had chariots of iron.";
rsv[19] = "And the LORD was with Judah, and he took possession of the hill country, but he could not drive out the inhabitants of the plain, because they had chariots of iron.";
asv[19] = "And Jehovah was with Judah; and drove out [the inhabitants of] the hill-country; for he could not drive out the inhabitants of the valley, because they had chariots of iron.";
yng[19] = "and Jehovah is with Judah, and he occupieth the hill-country, but not to dispossess the inhabitants of the valley, for they have chariots of iron.";
dby[19] = "And Jehovah was with Judah; and he took possession of the hill-country, for he did not dispossess the inhabitants of the valley, because they had chariots of iron.";
web[19] = "And the LORD was with Judah; and he drove out [the inhabitants of] the mountain; but could not drive out the inhabitants of the valley, because they had chariots of iron.";
hnv[19] = "The LORD was with Yehudah; and drove out [the inhabitants of] the hill-country; for he could not drive out the inhabitants of the valley, because they had chariots of iron.";
vul[19] = "fuitque Dominus cum Iuda et montana possedit nec potuit delere habitatores vallis quia falcatis curribus abundabant";
kjv[20] = "And they gave Hebron unto Caleb, as Moses said: and he expelled thence the three sons of Anak.";
rsv[20] = "And Hebron was given to Caleb, as Moses had said; and he drove out from it the three sons of Anak.";
asv[20] = "And they gave Hebron unto Caleb, as Moses had spoken: and he drove out thence the three sons of Anak.";
yng[20] = "And they give to Caleb Hebron, as Moses hath spoken, and he dispossesseth thence the three sons of Anak.";
dby[20] = "And they gave to Caleb Hebron, as Moses had said; and he dispossessed from thence the three sons of Anak.";
web[20] = "And they gave Hebron to Caleb, as Moses said: and he expelled thence the three sons of Anak.";
hnv[20] = "They gave Hevron to Kalev, as Moshe had spoken: and he drove out there the three sons of `Anak.";
vul[20] = "dederuntque Chaleb Hebron sicut dixerat Moses qui delevit ex ea tres filios Enach";
kjv[21] = "And the children of Benjamin did not drive out the Jebusites that inhabited Jerusalem; but the Jebusites dwell with the children of Benjamin in Jerusalem unto this day.";
rsv[21] = "But the people of Benjamin did not drive out the Jeb\'usites who dwelt in Jerusalem; so the Jeb\'usites have dwelt with the people of Benjamin in Jerusalem to this day.";
asv[21] = "And the children of Benjamin did not drive out the Jebusites that inhabited Jerusalem; but the Jebusites dwell with the children of Benjamin in Jerusalem unto this day.";
yng[21] = "And the Jebusite, inhabiting Jerusalem, the sons of Benjamin have not dispossessed; and the Jebusite dwelleth with the sons of Benjamin, in Jerusalem, till this day.";
dby[21] = "And the children of Benjamin did not dispossess the Jebusites, the inhabitants of Jerusalem; but the Jebusites dwell with the children of Benjamin in Jerusalem to this day.";
web[21] = "And the children of Benjamin did not drive out the Jebusites that inhabited Jerusalem; but the Jebusites dwell with the children of Benjamin in Jerusalem to this day.";
hnv[21] = "The children of Binyamin did not drive out the Yevusi who inhabited Yerushalayim; but the Yevusi dwell with the children of Binyamin in Yerushalayim to this day.";
vul[21] = "Iebuseum autem habitatorem Hierusalem non deleverunt filii Beniamin habitavitque Iebuseus cum filiis Beniamin in Hierusalem usque in praesentem diem";
kjv[22] = "And the house of Joseph, they also went up against Bethel: and the LORD [was] with them.";
rsv[22] = "The house of Joseph also went up against Bethel; and the LORD was with them.";
asv[22] = "And the house of Joseph, they also went up against Beth-el; and Jehovah was with them.";
yng[22] = "And the house of Joseph go up -- even they -- to Beth-El, and Jehovah [is] with them;";
dby[22] = "And the house of Joseph, they also went up against Bethel; and Jehovah was with them.";
web[22] = "And the house of Joseph, they also went up against Beth-el: and the LORD [was] with them.";
hnv[22] = "The house of Yosef, they also went up against Beit-El; and the LORD was with them.";
vul[22] = "domus quoque Ioseph ascendit in Bethel fuitque Dominus cum eis";
kjv[23] = "And the house of Joseph sent to descry Bethel. (Now the name of the city before [was] Luz.)";
rsv[23] = "And the house of Joseph sent to spy out Bethel. (Now the name of the city was formerly Luz.)";
asv[23] = "And the house of Joseph sent to spy out Beth-el. (Now the name of the city beforetime was Luz.)";
yng[23] = "and the house of Joseph cause [men] to spy about Beth-El (and the name of the city formerly is Luz),";
dby[23] = "And the house of Joseph sent to search out Bethel; now the name of the city before was Luz.";
web[23] = "And the house of Joseph sent to explore Beth-el. Now the name of the city before [was] Luz.";
hnv[23] = "The house of Yosef sent to spy out Beit-El. (Now the name of the city before was Luz.)";
vul[23] = "nam cum obsiderent urbem quae prius Luza vocabatur";
kjv[24] = "And the spies saw a man come forth out of the city, and they said unto him, Shew us, we pray thee, the entrance into the city, and we will shew thee mercy.";
rsv[24] = "And the spies saw a man coming out of the city, and they said to him, &quot;Pray, show us the way into the city, and we will deal kindly with you.&quot;";
asv[24] = "And the watchers saw a man come forth out of the city, and they said unto him, Show us, we pray thee, the entrance into the city, and we will deal kindly with thee.";
yng[24] = "and the watchers see a man coming out from the city, and say to him, `Shew us, we pray thee, the entrance of the city, and we have done with thee kindness.\'";
dby[24] = "And the guards saw a man come forth out of the city, and said unto him, Shew us, we pray thee, how [we] may enter into the city, and we will shew thee kindness.";
web[24] = "And the spies saw a man coming out of the city, and they said to him, Show us, we pray thee, the entrance into the city, and we will show thee mercy.";
hnv[24] = "The watchers saw a man come forth out of the city, and they said to him, Show us, we pray you, the entrance into the city, and we will deal kindly with you.";
vul[24] = "viderunt hominem egredientem de civitate dixeruntque ad eum ostende nobis introitum civitatis et faciemus tecum misericordiam";
kjv[25] = "And when he shewed them the entrance into the city, they smote the city with the edge of the sword; but they let go the man and all his family.";
rsv[25] = "And he showed them the way into the city; and they smote the city with the edge of the sword, but they let the man and all his family go.";
asv[25] = "And he showed them the entrance into the city; and they smote the city with the edge of the sword; but they let the man go and all his family.";
yng[25] = "And he sheweth them the entrance of the city, and they smite the city by the mouth of the sword, and the man and all his family they have sent away;";
dby[25] = "And he shewed them how to enter into the city. And they smote the city with the edge of the sword; but they let go the man and all his family.";
web[25] = "And when he showed them the entrance into the city, they smote the city with the edge of the sword: but they let go the man and all his family.";
hnv[25] = "He shown them the entrance into the city; and they struck the city with the edge of the sword; but they let the man go and all his family.";
vul[25] = "qui cum ostendisset eis percusserunt urbem in ore gladii hominem autem illum et omnem cognationem eius dimiserunt";
kjv[26] = "And the man went into the land of the Hittites, and built a city, and called the name thereof Luz: which [is] the name thereof unto this day.";
rsv[26] = "And the man went to the land of the Hittites and built a city, and called its name Luz; that is its name to this day.";
asv[26] = "And the man went into the land of the Hittites, and built a city, and called the name thereof Luz, which is the name thereof unto this day.";
yng[26] = "and the man goeth to the land of the Hittites, and buildeth a city, and calleth its name Luz -- it [is] its name unto this day.";
dby[26] = "And the man went into the land of the Hittites, and built a city, and called its name Luz, which is its name to this day.";
web[26] = "And the man went into the land of the Hittites, and built a city, and called the name of it Luz: which [is] its name to this day.";
hnv[26] = "The man went into the land of the Hitti, and built a city, and called the name of it Luz, which is the name of it to this day.";
vul[26] = "qui dimissus abiit in terram Etthim et aedificavit ibi civitatem vocavitque eam Luzam quae ita appellatur usque in praesentem diem";
kjv[27] = "Neither did Manasseh drive out [the inhabitants of] Bethshean and her towns, nor Taanach and her towns, nor the inhabitants of Dor and her towns, nor the inhabitants of Ibleam and her towns, nor the inhabitants of Megiddo and her towns: but the Canaanites would dwell in that land.";
rsv[27] = "Manas\'seh did not drive out the inhabitants of Beth-she\'an and its villages, or Ta\'a-nach and its villages, or the inhabitants of Dor and its villages, or the inhabitants of Ibleam and its villages, or the inhabitants of Megid\'do and its villages; but the Canaanites persisted in dwelling in that land.";
asv[27] = "And Manasseh did not drive out [the inhabitants of] Beth-shean and its towns, nor [of] Taanach and its towns, nor the inhabitants of Dor and its towns, nor the inhabitants of Ibleam and its towns, nor the inhabitants of Megiddo and its towns; but the Canaanites would dwell in that land.";
yng[27] = "And Manasseh hath not occupied Beth-Shean and its towns, and Taanach and its towns, and the inhabitants of Dor and its towns, and the inhabitants of Iblaim and its towns, and the inhabitants of Megiddo and its towns, and the Canaanite is desirous to dwell in that land;";
dby[27] = "And Manasseh did not dispossess Beth-shean and its dependent villages, nor Taanach and its dependent villages, nor the inhabitants of Dor and its dependent villages, nor the inhabitants of Ibleam and its dependent villages, nor the inhabitants of Megiddo and its dependent villages; and the Canaanites would dwell in that land.";
web[27] = "Neither did Manasseh expel [the inhabitants of] Beth-shean and its towns, nor Tanach and its towns, nor the inhabitants of Dor and its towns, nor the inhabitants of Ibleam and its towns, nor the inhabitants of Megiddo and its towns; but the Canaanites would dwell in that land.";
hnv[27] = "Menashsheh did not drive out [the inhabitants of] Beth-shean and its towns, nor [of] Ta`nakh and its towns, nor the inhabitants of Dor and its towns, nor the inhabitants of Yivle`am and its towns, nor the inhabitants of Megiddo and its towns; but the Kana`anim would dwell in that land.";
vul[27] = "Manasses quoque non delevit Bethsan et Thanach cum viculis suis et habitatores Dor et Ieblaam et Mageddo cum viculis suis coepitque Chananeus habitare cum eis";
kjv[28] = "And it came to pass, when Israel was strong, that they put the Canaanites to tribute, and did not utterly drive them out.";
rsv[28] = "When Israel grew strong, they put the Canaanites to forced labor, but did not utterly drive them out.";
asv[28] = "And it came to pass, when Israel was waxed strong, that they put the Canaanites to taskwork, and did not utterly drive them out.";
yng[28] = "and it cometh to pass, when Israel hath been strong, that he setteth the Canaanite to tribute, and hath not utterly dispossessed it.";
dby[28] = "And it came to pass when Israel became strong, that they made the Canaanites tributary; but they did not utterly dispossess them.";
web[28] = "And it came to pass when Israel was strong, that they subjected the Canaanites to tribute, and did not utterly expel them.";
hnv[28] = "It happened, when Yisra\'el had grown strong, that they put the Kana`anim to forced labor, and did not utterly drive them out.";
vul[28] = "postquam autem confortatus est Israhel fecit eos tributarios et delere noluit";
kjv[29] = "Neither did Ephraim drive out the Canaanites that dwelt in Gezer; but the Canaanites dwelt in Gezer among them.";
rsv[29] = "And E\'phraim did not drive out the Canaanites who dwelt in Gezer; but the Canaanites dwelt in Gezer among them.";
asv[29] = "And Ephraim drove not out the Canaanites that dwelt in Gezer; but the Canaanites dwelt in Gezer among them.";
yng[29] = "And Ephraim hath not dispossessed the Canaanite who is dwelling in Gezer, and the Canaanite dwelleth in its midst, in Gezer.";
dby[29] = "And Ephraim did not dispossess the Canaanites that dwelt in Gezer; but the Canaanites dwelt among them in Gezer.";
web[29] = "Neither did Ephraim expel the Canaanites that dwelt in Gezer; but the Canaanites dwelt in Gezer among them.";
hnv[29] = " Efrayim didn\'t drive out the Kana`anim who lived in Gezer; but the Kana`anim lived in Gezer among them.";
vul[29] = "Ephraim etiam non interfecit Chananeum qui habitabat in Gazer sed habitavit cum eo";
kjv[30] = "Neither did Zebulun drive out the inhabitants of Kitron, nor the inhabitants of Nahalol; but the Canaanites dwelt among them, and became tributaries.";
rsv[30] = "Zeb\'ulun did not drive out the inhabitants of Kitron, or the inhabitants of Na\'halol; but the Canaanites dwelt among them, and became subject to forced labor.";
asv[30] = "Zebulun drove not out the inhabitants of Kitron, nor the inhabitants of Nahalol; but the Canaanites dwelt among them, and became subject to taskwork.";
yng[30] = "Zebulun hath not dispossessed the inhabitants of Kitron, and the inhabitants of Nahalol, and the Canaanite dwelleth in its midst, and they become tributary.";
dby[30] = "Zebulun did not dispossess the inhabitants of Kitron, nor the inhabitants of Nahalol; but the Canaanites dwelt among them, and became tributaries.";
web[30] = "Neither did Zebulun expel the inhabitants of Kitron, nor the inhabitants of Nahalol; but the Canaanites dwelt among them, and became tributaries.";
hnv[30] = "Zevulun didn\'t drive out the inhabitants of Kitron, nor the inhabitants of Nahalol; but the Kana`anim lived among them, and became subject to forced labor.";
vul[30] = "Zabulon non delevit habitatores Cetron et Naalon sed habitavit Chananeus in medio eius factusque est ei tributarius";
kjv[31] = "Neither did Asher drive out the inhabitants of Accho, nor the inhabitants of Zidon, nor of Ahlab, nor of Achzib, nor of Helbah, nor of Aphik, nor of Rehob:";
rsv[31] = "Asher did not drive out the inhabitants of Acco, or the inhabitants of Sidon, or of Ahlab, or of Achzib, or of Helbah, or of Aphik, or of Rehob;";
asv[31] = "Asher drove not out the inhabitants of Acco, nor the inhabitants of Sidon, nor of Ahlab, nor of Achzib, nor of Helbah, nor of Aphik, nor of Rehob;";
yng[31] = "Asher hath not dispossessed the inhabitants of Accho, and the inhabitants of Zidon, and Ahlab, and Achzib, and Helbah, and Aphik, and Rehob;";
dby[31] = "Asher did not dispossess the inhabitants of Accho, nor the inhabitants of Zidon, nor Ahlab, nor Achzib, nor Helbah, nor Aphik, nor Rehob;";
web[31] = "Neither did Asher expel the inhabitants of Accho, nor the inhabitants of Zidon, nor of Ahlab, nor of Achzib, nor of Helbah, nor of Aphik, nor of Rehob:";
hnv[31] = " Asher didn\'t drive out the inhabitants of `Akko, nor the inhabitants of Tzidon, nor of Achlav, nor of Akhziv, nor of Helbah, nor of Afik, nor of Rechov;";
vul[31] = "Aser quoque non delevit habitatores Achcho et Sidonis Alab et Achazib et Alba et Afec et Roob";
kjv[32] = "But the Asherites dwelt among the Canaanites, the inhabitants of the land: for they did not drive them out.";
rsv[32] = "but the Asherites dwelt among the Canaanites, the inhabitants of the land; for they did not drive them out.";
asv[32] = "but the Asherites dwelt among the Canaanites, the inhabitants of the land; for they did not drive them out.";
yng[32] = "and the Asherite dwelleth in the midst of the Canaanite, the inhabitants of the land, for it hath not dispossessed them.";
dby[32] = "and the Asherites dwelt among the Canaanites, the inhabitants of the land; for they did not dispossess them.";
web[32] = "But the Asherites dwelt among the Canaanites, the inhabitants of the land: for they did not expel them.";
hnv[32] = "but the Asheri lived among the Kana`anim, the inhabitants of the land; for they did not drive them out.";
vul[32] = "habitavitque in medio Chananei habitatoris illius terrae nec interfecit eum";
kjv[33] = "Neither did Naphtali drive out the inhabitants of Bethshemesh, nor the inhabitants of Bethanath; but he dwelt among the Canaanites, the inhabitants of the land: nevertheless the inhabitants of Bethshemesh and of Bethanath became tributaries unto them.";
rsv[33] = "Naph\'tali did not drive out the inhabitants of Beth-she\'mesh, or the inhabitants of Beth-anath, but dwelt among the Canaanites, the inhabitants of the land; nevertheless the inhabitants of Beth-she\'mesh and of Beth-anath became subject to forced labor for them.";
asv[33] = "Naphtali drove not out the inhabitants of Beth-shemesh, nor the inhabitants of Beth-anath; but he dwelt among the Canaanites, the inhabitants of the land: nevertheless the inhabitants of Beth-shemesh and of Beth-anath became subject to taskwork.";
yng[33] = "Naphtali hath not dispossessed the inhabitants of Beth-Shemesh, and the inhabitants of Beth-Anath, and he dwelleth in the midst of the Canaanite, the inhabitants of the land; and the inhabitants of Beth-Shemesh and of Beth-Anath have become tributary to them.";
dby[33] = "Naphtali did not dispossess the inhabitants of Beth-shemesh, nor the inhabitants of Beth-anath; and he dwelt among the Canaanites, the inhabitants of the land, but the inhabitants of Beth-shemesh and of Beth-anath became tributaries to them.";
web[33] = "Neither did Naphtali expel the inhabitants of Beth-shemesh, nor the inhabitants of Beth-anath; but he dwelt among the Canaanites, the inhabitants of the land: nevertheless, the inhabitants of Beth-shemesh and of Beth-anath became tributaries to them.";
hnv[33] = " Naftali didn\'t drive out the inhabitants of Beth-shemesh, nor the inhabitants of Beit-`Anat; but he lived among the Kana`anim, the inhabitants of the land: nevertheless the inhabitants of Beth-shemesh and of Beit-`Anat became subject to forced labor.";
vul[33] = "Nepthali non delevit habitatores Bethsemes et Bethanath et habitavit inter Chananeum habitatorem terrae fueruntque ei Bethsemitae et Bethanitae tributarii";
kjv[34] = "And the Amorites forced the children of Dan into the mountain: for they would not suffer them to come down to the valley:";
rsv[34] = "The Amorites pressed the Danites back into the hill country, for they did not allow them to come down to the plain;";
asv[34] = "And the Amorites forced the children of Dan into the hill-country; for they would not suffer them to come down to the valley;";
yng[34] = "And the Amorites press the sons of Dan to the mountain, for they have not suffered them to go down to the valley;";
dby[34] = "And the Amorites forced the children of Dan into the hill-country, for they would not suffer them to come down to the valley.";
web[34] = "And the Amorites forced the children of Dan to the mountain: for they would not suffer them to come down to the valley:";
hnv[34] = "The Amori forced the children of Dan into the hill-country; for they would not allow them to come down to the valley;";
vul[34] = "artavitque Amorreus filios Dan in monte nec dedit eis locum ut ad planiora descenderent";
kjv[35] = "But the Amorites would dwell in mount Heres in Aijalon, and in Shaalbim: yet the hand of the house of Joseph prevailed, so that they became tributaries.";
rsv[35] = "the Amorites persisted in dwelling in Har-heres, in Ai\'jalon, and in Sha-al\'bim, but the hand of the house of Joseph rested heavily upon them, and they became subject to forced labor.";
asv[35] = "but the Amorites would dwell in mount Heres, in Aijalon, and in Shaalbim: yet the hand of the house of Joseph prevailed, so that they became subject to taskwork.";
yng[35] = "and the Amorite is desirous to dwell in mount Heres, in Aijalon, and in Shaalbim, and the hand of the house of Joseph is heavy, and they become tributary;";
dby[35] = "And the Amorites would dwell on mount Heres, in Ajalon and in Shaalbim; but the hand of the house of Joseph prevailed, and they became tributaries.";
web[35] = "But the Amorites would dwell in mount Heres in Ajalon, and in Shaalbim: yet the hand of the house of Joseph prevailed, so that they became tributaries.";
hnv[35] = "but the Amori would dwell in Mount Heres, in Ayalon, and in Sha`alvim: yet the hand of the house of Yosef prevailed, so that they became subject to forced labor.";
vul[35] = "habitavitque in monte Hares quod interpretatur testaceo in Ahilon et Salabim et adgravata est manus domus Ioseph factusque est ei tributarius";
kjv[36] = "And the coast of the Amorites [was] from the going up to Akrabbim, from the rock, and upward.";
rsv[36] = "And the border of the Amorites ran from the ascent of Akrab\'bim, from Sela and upward.";
asv[36] = "And the border of the Amorites was from the ascent of Akrabbim, from the rock, and upward.";
yng[36] = "and the border of the Amorite [is] from the ascent of Akrabbim, from the rock and upward.";
dby[36] = "And the border of the Amorites was from the ascent of Akrabbim, from the rock, and upwards.";
web[36] = "And the border of the Amorites [was] from the ascent to Akrabbim, from the rock, and upward.";
hnv[36] = " The border of the Amori was from the ascent of `Akrabbim, from the rock, and upward.";
vul[36] = "fuit autem terminus Amorrei ab ascensu Scorpionis Petra et superiora loca";
