csb[1] = "In those days, when there was no king in Israel, a Levite staying in a remote part of the hill country of Ephraim acquired a woman from Bethlehem in Judah as his concubine.";
csb[2] = "But she was unfaithful to him and left him for her father\'s house in Bethlehem in Judah. She was there for four months.";
csb[3] = "Then her husband got up and followed her to speak kindly to her and bring her back. He had his servant with him and a pair of donkeys. So she brought him to her father\'s house, and when the girl\'s father saw him, he gladly welcomed him.";
csb[4] = "His father-in-law, the girl\'s father, detained him, and he stayed with him for three days. They ate, drank, and spent the nights there.";
csb[5] = "On the fourth day, they got up early in the morning and prepared to go, but the girl\'s father said to his son-in-law, &quot;Have something to eat to keep up your strength and then you can go.&quot;";
csb[6] = "So they sat down and the two of them ate and drank together. Then the girl\'s father said to the man, &quot;Please agree to stay overnight and enjoy yourself.&quot;";
csb[7] = "The man got up to go, but his father-in-law persuaded him, so he stayed and spent the night there again.";
csb[8] = "He got up early in the morning of the fifth day to leave, but the girl\'s father said to him, &quot;Please keep up your strength.&quot; So they waited until late afternoon and the two of them ate.";
csb[9] = "The man got up to go with his concubine and his servant, when his father-in-law, the girl\'s father, said to him, &quot;Look, night is coming. Please spend the night. See, the day is almost over. Spend the night here, enjoy yourself, then you can get up early tomorrow for your journey and go home.&quot;";
csb[10] = "But the man was unwilling to spend the night. He got up, departed, and arrived opposite Jebus (that is, Jerusalem). The man had his two saddled donkeys and his concubine with him.";
csb[11] = "When they were near Jebus and the day was almost gone, the servant said to his master, &quot;Please, why not let us stop at this Jebusite city and spend the night here? &quot;";
csb[12] = "But his master replied to him, &quot;We will not stop at a foreign city where there are no Israelites. Let\'s move on to Gibeah.&quot;";
csb[13] = "&quot;Come on,&quot; he said, &quot;let\'s try to reach one of these places and spend the night in Gibeah or Ramah.&quot;";
csb[14] = "So they continued on their journey, and the sun set as they neared Gibeah in Benjamin.";
csb[15] = "They stopped to go in and spend the night in Gibeah. The Levite went in and sat down in the city square, but no one took them into their home to spend the night.";
csb[16] = "In the evening, an old man came in from his work in the field. He was from the hill country of Ephraim, but he was residing in Gibeah where the people were Benjaminites.";
csb[17] = "When he looked up and saw the traveler in the city square, the old man asked, &quot;Where are you going, and where do you come from? &quot;";
csb[18] = "He answered him, &quot;We\'re traveling from Bethlehem in Judah to the remote hill country of Ephraim, where I am from. I went to Bethlehem in Judah, and now I\'m going to the house of the LORD. No one has taken me into his home,";
csb[19] = "&quot;although there\'s straw and feed for the donkeys, and I have bread and wine for me, my concubine, and the servant with us. There is nothing we lack.&quot;";
csb[20] = "&quot;Welcome! &quot; said the old man. &quot;I\'ll take care of everything you need. Only don\'t spend the night in the square.&quot;";
csb[21] = "So he brought him to his house and fed the donkeys. Then they washed their feet and ate and drank.";
csb[22] = "While they were enjoying themselves, all of a sudden, wicked men of the city surrounded the house and beat on the door. They said to the old man who was the owner of the house, &quot;Bring out the man who came to your house so we can have sex with him! &quot;";
csb[23] = "The owner of the house went out and said to them, &quot;Please don\'t do this evil, my brothers. After all, this man has come into my house. Don\'t commit this horrible outrage.";
csb[24] = "&quot;Here, let me bring out my virgin daughter and the man\'s concubine now. Abuse them and do whatever you want to them. But don\'t commit this outrageous thing against this man.&quot;";
csb[25] = "But the men would not listen to him, so the man seized his concubine and took her outside to them. They raped her and abused her all night until morning. At daybreak they let her go.";
csb[26] = "Early that morning, the woman made her way back, and as it was getting light, she collapsed at the doorway of the man\'s house where her master was.";
csb[27] = "When her master got up in the morning, opened the doors of the house, and went out to leave on his journey, there was the woman, his concubine, collapsed near the doorway of the house with her hands on the threshold.";
csb[28] = "&quot;Get up,&quot; he told her. &quot;Let\'s go.&quot; But there was no response. So the man put her on his donkey and set out for home.";
csb[29] = "When he entered his house, he picked up a knife, took hold of his concubine, cut her into twelve pieces, limb by limb, and then sent her throughout the territory of Israel.";
csb[30] = "Everyone who saw it said, &quot;Nothing like this has ever happened or has been seen since the day the Israelites came out of the land of Egypt until now. Think it over, discuss it, and speak up! &quot;";
kjv[1] = "And it came to pass in those days, when [there was] no king in Israel, that there was a certain Levite sojourning on the side of mount Ephraim, who took to him a concubine out of Bethlehemjudah.";
rsv[1] = "In those days, when there was no king in Israel, a certain Levite was sojourning in the remote parts of the hill country of E\'phraim, who took to himself a concubine from Bethlehem in Judah.";
asv[1] = "And it came to pass in those days, when there was no king in Israel, that there was a certain Levite sojourning on the farther side of the hill-country of Ephraim, who took to him a concubine out of Beth-lehem-judah.";
yng[1] = "And it cometh to pass, in those days, when there is no king in Israel, that there is a man a Levite, a sojourner in the sides of the hill-country of Ephraim, and he taketh to him a wife, a concubine, out of Beth-Lehem-Judah;";
dby[1] = "And it came to pass in those days, when there was no king in Israel, that a certain Levite, sojourning on the further side of mount Ephraim, took him a concubine out of Bethlehem-Judah.";
web[1] = "And it came to pass in those days, when [there was] no king in Israel, that there was a certain Levite dwelling on the side of mount Ephraim, who took to him a concubine out of Beth-lehem-judah.";
hnv[1] = "It happened in those days, when there was no king in Yisra\'el, that there was a certain Levite sojourning on the farther side of the hill-country of Efrayim, who took to him a concubine out of Beit-Lechem-Yehudah.";
vul[1] = "fuit quidam vir Levites habitans in latere montis Ephraim qui accepit uxorem de Bethleem Iuda";
kjv[2] = "And his concubine played the whore against him, and went away from him unto her father\'s house to Bethlehemjudah, and was there four whole months.";
rsv[2] = "And his concubine became angry with him, and she went away from him to her father\'s house at Bethlehem in Judah, and was there some four months.";
asv[2] = "And his concubine played the harlot against him, and went away from him unto her father\'s house to Beth-lehem-judah, and was there the space of four months.";
yng[2] = "and commit whoredom against him doth his concubine, and she goeth from him unto the house of her father, unto Beth-Lehem-Judah, and is there days -- four months.";
dby[2] = "And his concubine played the whore against him, and went away from him to her father\'s house to Bethlehem-Judah, and was there some time, -- four months.";
web[2] = "And his concubine played the harlot against him, and went away from him to her father\'s house to Beth-lehem-judah, and was there four whole months.";
hnv[2] = "His concubine played the prostitute against him, and went away from him to her father\'s house to Beit-Lechem-Yehudah, and was there the space of four months.";
vul[2] = "quae reliquit eum et reversa est in domum patris sui Bethleem mansitque apud eum quattuor mensibus";
kjv[3] = "And her husband arose, and went after her, to speak friendly unto her, [and] to bring her again, having his servant with him, and a couple of asses: and she brought him into her father\'s house: and when the father of the damsel saw him, he rejoiced to meet him.";
rsv[3] = "Then her husband arose and went after her, to speak kindly to her and bring her back. He had with him his servant and a couple of asses. And he came to her father\'s house; and when the girl\'s father saw him, he came with joy to meet him.";
asv[3] = "And her husband arose, and went after her, to speak kindly unto her, to bring her again, having his servant with him, and a couple of asses: and she brought him into her father\'s house; and when the father of the damsel saw him, he rejoiced to meet him.";
yng[3] = "And her husband riseth and goeth after her, to speak unto her heart, to bring her back, and his young man [is] with him, and a couple of asses; and she bringeth him into the house of her father, and the father of the young woman seeth him, and rejoiceth to meet him.";
dby[3] = "And her husband rose up and went after her, to speak kindly to her, to bring her again; and his servant was with him, and a couple of asses. And she brought him into her father\'s house; and when the father of the damsel saw him he rejoiced to meet him.";
web[3] = "And her husband arose, and went after her, to speak kindly to her, [and] to bring her again, having his servant with him, and a couple of asses: and she brought him into her father\'s house: and when the father of the damsel saw him, he rejoiced to meet him.";
hnv[3] = "Her husband arose, and went after her, to speak kindly to her, to bring her again, having his servant with him, and a couple of donkeys: and she brought him into her father\'s house; and when the father of the young lady saw him, he rejoiced to meet him.";
vul[3] = "secutusque est eam vir suus volens ei reconciliari atque blandiri et secum reducere habens in comitatu puerum et duos asinos quae suscepit eum et introduxit in domum patris sui quod cum audisset socer eius eumque vidisset occurrit ei laetus";
kjv[4] = "And his father in law, the damsel\'s father, retained him; and he abode with him three days: so they did eat and drink, and lodged there.";
rsv[4] = "And his father-in-law, the girl\'s father, made him stay, and he remained with him three days; so they ate and drank, and lodged there.";
asv[4] = "And his father-in-law, the damsel\'s father, retained him; and he abode with him three days: so they did eat and drink, and lodged there.";
yng[4] = "And keep hold on him doth his father-in-law, father of the young woman, and he abideth with him three days, and they eat and drink, and lodge there.";
dby[4] = "And his father-in-law, the damsel\'s father, retained him, and he abode with him three days; and they ate and drank, and lodged there.";
web[4] = "And his father-in-law, the damsel\'s father, retained him; and he abode with him three days: so they ate and drank, and lodged there.";
hnv[4] = "His father-in-law, the young lady\'s father, retained him; and he abode with him three days: so they ate and drink, and lodged there.";
vul[4] = "et amplexatus est hominem mansitque gener in domo soceri tribus diebus comedens cum eo et bibens familiariter";
kjv[5] = "And it came to pass on the fourth day, when they arose early in the morning, that he rose up to depart: and the damsel\'s father said unto his son in law, Comfort thine heart with a morsel of bread, and afterward go your way.";
rsv[5] = "And on the fourth day they arose early in the morning, and he prepared to go; but the girl\'s father said to his son-in-law, &quot;Strengthen your heart with a morsel of bread, and after that you may go.&quot;";
asv[5] = "And it came to pass on the fourth day, that they arose early in the morning, and he rose up to depart: and the damsel\'s father said unto his son-in-law, Strengthen thy heart with a morsel of bread, and afterward ye shall go your way.";
yng[5] = "And it cometh to pass, on the fourth day, that they rise early in the morning, and he riseth to go, and the father of the young woman saith unto his son-in-law, `Support thy heart with a morsel of bread, and afterward ye go on.\'";
dby[5] = "And it came to pass on the fourth day, that they arose early in the morning, and he rose up to depart; and the damsel\'s father said to his son-in-law, Refresh thy heart with a morsel of bread, and afterwards ye may go your way.";
web[5] = "And it came to pass on the fourth day, when they arose early in the morning, that he arose to depart: and the damsel\'s father said to his son-in-law, Comfort thy heart with a morsel of bread, and afterward depart.";
hnv[5] = "It happened on the fourth day, that they arose early in the morning, and he rose up to depart: and the young lady\'s father said to his son-in-law, Strengthen your heart with a morsel of bread, and afterward you shall go your way.";
vul[5] = "die autem quarto de nocte consurgens proficisci voluit quem tenuit socer et ait ad eum gusta prius pauxillum panis et conforta stomachum et sic proficisceris";
kjv[6] = "And they sat down, and did eat and drink both of them together: for the damsel\'s father had said unto the man, Be content, I pray thee, and tarry all night, and let thine heart be merry.";
rsv[6] = "So the two men sat and ate and drank together; and the girl\'s father said to the man, &quot;Be pleased to spend the night, and let your heart be merry.&quot;";
asv[6] = "So they sat down, and did eat and drink, both of them together: and the damsel\'s father said unto the man, Be pleased, I pray thee, to tarry all night, and let thy heart be merry.";
yng[6] = "And they sit and eat both of them together, and drink, and the father of the young woman saith unto the man, `Be willing, I pray thee, and lodge all night, and let thy heart be glad.\'";
dby[6] = "And they sat down, and ate and drank, both of them together. And the damsel\'s father said to the man, Be content, I pray thee, and pass the night, and let thy heart be glad.";
web[6] = "And they sat down, and ate and drank both of them together: for the damsel\'s father had said to the man, Be content, I pray thee, and tarry all night, and let thy heart be merry.";
hnv[6] = "So they sat down, and ate and drink, both of them together: and the young lady\'s father said to the man, Please be pleased to stay all night, and let your heart be merry.";

hnv[7] = "The man rose up to depart; but his father-in-law urged him, and he lodged there again.";

rsv[8] = "And on the fifth day he arose early in the morning to depart; and the girl\'s father said, &quot;Strengthen your heart, and tarry until the day declines.&quot; So they ate, both of them.";
asv[8] = "And he arose early in the morning on the fifth day to depart; and the damsel\'s father said, Strengthen thy heart, I pray thee, and tarry ye until the day declineth; and they did eat, both of them.";
yng[8] = "And he riseth early in the morning, on the fifth day, to go, and the father of the young woman saith, `Support, I pray thee, thy heart;\' and they have tarried till the turning of the day, and they eat, both of them.";
dby[8] = "And he arose early in the morning on the fifth day to depart; but the damsel\'s father said, Refresh thy heart, I pray thee. And they lingered until the afternoon, and they did eat both of them.";
web[8] = "And he arose early in the morning on the fifth day to depart: and the damsel\'s father said, Comfort thy heart, I pray thee. And they tarried until afternoon, and they ate both of them.";
hnv[8] = "He arose early in the morning on the fifth day to depart; and the young lady\'s father said, Please strengthen your heart and stay until the day declines; and they ate, both of them.";

kjv[9] = "And when the man rose up to depart, he, and his concubine, and his servant, his father in law, the damsel\'s father, said unto him, Behold, now the day draweth toward evening, I pray you tarry all night: behold, the day groweth to an end, lodge here, that thine heart may be merry; and to morrow get you early on your way, that thou mayest go home.";
rsv[9] = "And when the man and his concubine and his servant rose up to depart, his father-in-law, the girl\'s father, said to him, &quot;Behold, now the day has waned toward evening; pray tarry all night. Behold, the day draws to its close; lodge here and let your heart be merry; and tomorrow you shall arise early in the morning for your journey, and go home.&quot;";
asv[9] = "And when the man rose up to depart, he, and his concubine, and his servant, his father-in-law, the damsel\'s father, said unto him, Behold, now the day draweth toward evening, I pray you tarry all night: behold, the day groweth to an end, lodge here, that thy heart may be merry; and to-morrow get you early on your way, that thou mayest go home.";
yng[9] = "And the man riseth to go, he and his concubine, and his young man, and his father-in-law, father of the young woman, saith to him, `Lo, I pray thee, the day hath fallen toward evening, lodge all night, I pray thee; lo, the declining of the day! lodge here, and let thine heart be glad -- and ye have risen early to-morrow for your journey, and thou hast gone to thy tent.\'";
dby[9] = "And the man rose up to depart, he, and his concubine, and his servant; and his father-in-law, the damsel\'s father, said to him, Behold now, the day draws toward evening -- I pray you stay all night; behold, the day is declining, lodge here, and let thy heart be merry; and to-morrow get you early on your way, that thou mayest go to thy tent.";
web[9] = "And when the man arose to depart, he, and his concubine, and his servant, his father-in-law, the damsel\'s father, said to him, Behold now the day draweth towards evening, I pray you tarry all night: behold, the day is coming to an end, lodge here, that thy heart may be merry; and to-morrow get you early on your way, that thou mayest go home.";
hnv[9] = "When the man rose up to depart, he, and his concubine, and his servant, his father-in-law, the young lady\'s father, said to him, Behold, now the day draws toward evening, please stay all night: behold, the day grows to an end, lodge here, that your heart may be merry; and tomorrow get you early on your way, that you may go home.";
vul[9] = "surrexitque adulescens ut pergeret cum uxore sua et puero cui rursum locutus est socer considera quod dies ad occasum declivior sit et propinquet ad vesperum mane apud me etiam hodie et duc laetum diem et cras proficisceris ut vadas in domum tuam";

dby[10] = "But the man would not tarry the night; and he rose up and departed, and came opposite to Jebus, that is, Jerusalem; and there were with him two asses saddled, and his concubine was with him.";

vul[10] = "noluit gener adquiescere sermonibus eius sed statim perrexit et venit contra Iebus quae altero nomine vocabatur Hierusalem ducens secum duos asinos onustos et concubinam";

asv[14] = "So they passed on and went their way; and the sun went down upon them near to Gibeah, which belongeth to Benjamin.";

web[14] = "And they passed on and went their way; and the sun went down upon them [when they were] by Gibeah, which [belongeth] to Benjamin.";
hnv[14] = "So they passed on and went their way; and the sun went down on them near to Gevah, which belongs to Binyamin.";
vul[14] = "transierunt igitur Iebus et coeptum carpebant iter occubuitque eis sol iuxta Gabaa quae est in tribu Beniamin";
kjv[15] = "And they turned aside thither, to go in [and] to lodge in Gibeah: and when he went in, he sat him down in a street of the city: for [there was] no man that took them into his house to lodging.";
rsv[15] = "and they turned aside there, to go in and spend the night at Gib\'e-ah. And he went in and sat down in the open square of the city; for no man took them into his house to spend the night.";
asv[15] = "And they turned aside thither, to go in to lodge in Gibeah: and he went in, and sat him down in the street of the city; for there was no man that took them into his house to lodge.";
yng[15] = "and they turn aside there to go in to lodge in Gibeah, and he goeth in and sitteth in a broad place of the city, and there is no man gathering them into the house to lodge.";
dby[15] = "And they turned aside thither, to go in, to lodge in Gibeah. And he went in, and sat down in the open place of the city; and there was no one that received him into his house to pass the night.";
web[15] = "And they turned aside thither, to go in [and] to lodge in Gibeah: and when he went in, he sat down in a street of the city: for [there was] no man that took them into his house to lodge.";
hnv[15] = " They turned aside there, to go in to lodge in Gevah: and he went in, and sat him down in the street of the city; for there was no man who took them into his house to lodge.";
vul[15] = "deverteruntque ad eam ut manerent ibi quo cum intrassent sedebant in platea civitatis et nullus eos recipere volebat hospitio";
kjv[16] = "And, behold, there came an old man from his work out of the field at even, which [was] also of mount Ephraim; and he sojourned in Gibeah: but the men of the place [were] Benjamites.";
rsv[16] = "And behold, an old man was coming from his work in the field at evening; the man was from the hill country of E\'phraim, and he was sojourning in Gib\'e-ah; the men of the place were Benjaminites.";
asv[16] = "And, behold, there came an old man from his work out of the field at even: now the man was of the hill-country of Ephraim, and he sojourned in Gibeah; but the men of the place were Benjamites.";
yng[16] = "And lo, a man, an aged one, hath come from his work from the field in the evening, and the man [is] of the hill-country of Ephraim, and he [is] a sojourner in Gibeah, and the men of the place [are] Benjamites.";
dby[16] = "And behold, there came an old man from his work out of the field at even; and the man was of mount Ephraim, and he sojourned in Gibeah; but the men of the place were Benjaminites.";
web[16] = "And, behold, there came an old man from his work out of the field at evening, who [was] also of mount Ephraim; and he dwelt in Gibeah: but the men of the place [were] Benjaminites.";
hnv[16] = "Behold, there came an old man from his work out of the field at even: now the man was of the hill-country of Efrayim, and he sojourned in Gevah; but the men of the place were Binyamini.";
vul[16] = "et ecce apparuit homo senex revertens de agro et de opere suo vespere qui et ipse erat de monte Ephraim et peregrinus habitabat in Gabaa homines autem regionis illius erant filii Iemini";
kjv[17] = "And when he had lifted up his eyes, he saw a wayfaring man in the street of the city: and the old man said, Whither goest thou? and whence comest thou?";
rsv[17] = "And he lifted up his eyes, and saw the wayfarer in the open square of the city; and the old man said, &quot;Where are you going? and whence do you come?&quot;";
asv[17] = "And he lifted up his eyes, and saw the wayfaring man in the street of the city; and the old man said, Whither goest thou? and whence comest thou?";
yng[17] = "And he lifteth up his eyes, and seeth the man, the traveller, in a broad place of the city, and the aged man saith, `Whither goest thou? and whence comest thou?\'";
dby[17] = "And he lifted up his eyes, and saw the wayfaring man in the open place of the city; and the old man said, Whither goest thou? and whence comest thou?";
web[17] = "And when he had lifted up his eyes, he saw a way-faring man in the street of the city: and the old man said, Whither goest thou? and whence comest thou?";
hnv[17] = "He lifted up his eyes, and saw the wayfaring man in the street of the city; and the old man said, Where go you? and whence come you?";
vul[17] = "elevatisque oculis vidit senex sedentem hominem cum sarcinulis suis in platea civitatis et dixit ad eum unde venis et quo vadis";
kjv[18] = "And he said unto him, We [are] passing from Bethlehemjudah toward the side of mount Ephraim; from thence [am] I: and I went to Bethlehemjudah, but I [am now] going to the house of the LORD; and there [is] no man that receiveth me to house.";
rsv[18] = "And he said to him, &quot;We are passing from Bethlehem in Judah to the remote parts of the hill country of E\'phraim, from which I come. I went to Bethlehem in Judah; and I am going to my home; and nobody takes me into his house.";
asv[18] = "And he said unto him, We are passing from Beth-lehem-judah unto the farther side of the hill-country of Ephraim; from thence am I, and I went to Beth-lehem-judah: and I am [now] going to the house of Jehovah; and there is no man that taketh me into his house.";
yng[18] = "And he saith unto him, `We are passing over from Beth-Lehem-Judah unto the sides of the hill-country of Ephraim -- thence I [am], and I go unto Beth-Lehem-Judah; and to the house of Jehovah I am going, and there is no man gathering me into the house,";
dby[18] = "And he said to him, We are travelling from Bethlehem-Judah towards the further side of mount Ephraim; from thence am I; and I went to Bethlehem-Judah, and I have to do with the house of Jehovah; and there is no man that receives me into his house.";
web[18] = "And he said to him, We [are] passing from Beth-lehem-Judah towards the side of mount Ephraim; from thence [am] I: and I went to Beth-lehem-judah, but I [am now] going to the house of the LORD; and there [is] no man that receiveth me into [his] house.";
hnv[18] = "He said to him, We are passing from Beit-Lechem-Yehudah to the farther side of the hill-country of Efrayim; from there am I, and I went to Beit-Lechem-Yehudah: and I am [now] going to the house of the LORD; and there is no man who takes me into his house.";
vul[18] = "qui respondit ei profecti sumus de Bethleem Iuda et pergimus ad locum nostrum qui est in latere montis Ephraim unde ieramus Bethleem et nunc vadimus ad domum Dei nullusque nos sub tectum suum vult recipere";
kjv[19] = "Yet there is both straw and provender for our asses; and there is bread and wine also for me, and for thy handmaid, and for the young man [which is] with thy servants: [there is] no want of any thing.";
rsv[19] = "We have straw and provender for our asses, with bread and wine for me and your maidservant and the young man with your servants; there is no lack of anything.&quot;";
asv[19] = "Yet there is both straw and provender for our asses; and there is bread and wine also for me, and for thy handmaid, and for the young man that is with thy servants: there is no want of anything.";
yng[19] = "and both straw and provender are for our asses, and also bread and wine there are for me, and for thy handmaid, and for the young man with thy servants; there is no lack of anything.\'";
dby[19] = "And we have both straw and provender for our asses; and I have bread and wine also for me, and for thy handmaid, and for the young man with thy servants: there is no lack of anything.";
web[19] = "Yet there is both straw and provender for our asses; and there is bread and wine also for me, and for thy handmaid, and for the young man [which is] with thy servants: [there is] no want of any thing:";
hnv[19] = "Yet there is both straw and provender for our donkeys; and there is bread and wine also for me, and for your handmaid, and for the young man who is with your servants: there is no want of anything.";
vul[19] = "habentes paleas et faenum in asinorum pabulum et panem ac vinum in meos et ancillae tuae usus et pueri qui mecum est nulla re indigemus nisi hospitio";
kjv[20] = "And the old man said, Peace [be] with thee; howsoever [let] all thy wants [lie] upon me; only lodge not in the street.";
rsv[20] = "And the old man said, &quot;Peace be to you; I will care for all your wants; only, do not spend the night in the square.&quot;";
asv[20] = "And the old man said, Peace be unto thee; howsoever let all thy wants lie upon me; only lodge not in the street.";
yng[20] = "And the old man saith, `Peace to thee; only, all thy lack [is] on me, only in the broad place lodge not.\'";
dby[20] = "Then the old man said, Peace be with thee; only let all thy wants lie on me; but lodge not in the street.";
web[20] = "And the old man said, Peace [be] with thee; however, [let] all thy wants [lie] upon me; only lodge not in the street.";
hnv[20] = "The old man said, Shalom be to you; howsoever let all your wants lie on me; only don\'t lodge in the street.";
vul[20] = "cui respondit senex pax tecum sit ego praebebo omnia quae necessaria sunt tantum quaeso ne in platea maneas";
kjv[21] = "So he brought him into his house, and gave provender unto the asses: and they washed their feet, and did eat and drink.";
rsv[21] = "So he brought him into his house, and gave the asses provender; and they washed their feet, and ate and drank.";
asv[21] = "So he brought him into his house, and gave the asses fodder; and they washed their feet, and did eat and drink.";
yng[21] = "And he bringeth him in to his house, and mixeth [food] for the asses, and they wash their feet, and eat and drink.";
dby[21] = "And he brought him into his house, and gave the asses provender; and they washed their feet, and ate and drank.";
web[21] = "So he brought him into his house, and gave provender to the asses: and they washed their feet and ate and drank.";
hnv[21] = " So he brought him into his house, and gave the donkeys fodder; and they washed their feet, and ate and drink.";
vul[21] = "introduxitque eum in domum suam et pabulum asinis praebuit ac postquam laverunt pedes suos recepit eos in convivium";
kjv[22] = "[Now] as they were making their hearts merry, behold, the men of the city, certain sons of Belial, beset the house round about, [and] beat at the door, and spake to the master of the house, the old man, saying, Bring forth the man that came into thine house, that we may know him.";
rsv[22] = "As they were making their hearts merry, behold, the men of the city, base fellows, beset the house round about, beating on the door; and they said to the old man, the master of the house, &quot;Bring out the man who came into your house, that we may know him.&quot;";
asv[22] = "As they were making their hearts merry, behold, the men of the city, certain base fellows, beset the house round about, beating at the door; and they spake to the master of the house, the old man, saying, Bring forth the man that came into thy house, that we may know him.";
yng[22] = "They are making their heart glad, and lo, men of the city, men -- sons of worthlessness -- have gone round about the house, beating on the door, and they speak unto the old man, the master of the house, saying, `Bring out the man who hath come unto thine house, and we know him.\'";
dby[22] = "They were making their hearts merry, when behold, the men of the city, sons of Belial, surrounded the house, beating at the door; and they spoke to the master of the house, the old man, saying, Bring forth the man that came into thy house, that we may know him.";
web[22] = "[Now] as they were making their hearts merry, behold, the men of the city, certain sons of Belial, beset the house on all sides, [and] beat at the door, and spoke to the master of the house, the old man, saying, Bring forth the man that came into thy house, that we may know him.";
hnv[22] = "As they were making their hearts merry, behold, the men of the city, certain base fellows, beset the house round about, beating at the door; and they spoke to the master of the house, the old man, saying, Bring forth the man who came into your house, that we may know him.";
vul[22] = "illis epulantibus et post laborem itineris cibo ac potu reficientibus corpora venerunt viri civitatis illius filii Belial id est absque iugo et circumdantes domum senis fores pulsare coeperunt clamantes ad dominum domus atque dicentes educ virum qui ingressus est domum tuam ut abutamur eo";
kjv[23] = "And the man, the master of the house, went out unto them, and said unto them, Nay, my brethren, [nay], I pray you, do not [so] wickedly; seeing that this man is come into mine house, do not this folly.";
rsv[23] = "And the man, the master of the house, went out to them and said to them, &quot;No, my brethren, do not act so wickedly; seeing that this man has come into my house, do not do this vile thing.";
asv[23] = "And the man, the master of the house, went out unto them, and said unto them, Nay, my brethren, I pray you, do not so wickedly; seeing that this man is come into my house, do not this folly.";
yng[23] = "And the man, the master of the house, goeth out unto them, and saith unto them, `Nay, my brethren, do not evil, I pray you, after that this man hath come in unto my house, do not this folly;";
dby[23] = "And the man, the master of the house, went out to them, and said to them, No, my brethren, I pray you, do not wickedly; seeing that this man is come into my house, do not this villany.";
web[23] = "And the man, the master of the house, went out to them, and said to them, Nay, my brethren, [nay], I pray you, do not [so] wickedly; seeing that this man is come into my house, do not this folly.";
hnv[23] = "The man, the master of the house, went out to them, and said to them, No, my brothers, please don\'t act so wickedly; seeing that this man is come into my house, don\'t do this folly.";
vul[23] = "egressusque est ad eos senex et ait nolite fratres nolite facere malum hoc quia ingressus est homo hospitium meum et cessate ab hac stultitia";
kjv[24] = "Behold, [here is] my daughter a maiden, and his concubine; them I will bring out now, and humble ye them, and do with them what seemeth good unto you: but unto this man do not so vile a thing.";
rsv[24] = "Behold, here are my virgin daughter and his concubine; let me bring them out now. Ravish them and do with them what seems good to you; but against this man do not do so vile a thing.&quot;";
asv[24] = "Behold, here is my daughter a virgin, and his concubine; them I will bring out now, and humble ye them, and do with them what seemeth good unto you: but unto this man do not any such folly.";
yng[24] = "lo, my daughter, the virgin, and his concubine, let me bring them out, I pray you, and humble ye them, and do to them that which is good in your eyes, and to this man do not this foolish thing.\'";
dby[24] = "Behold, my daughter, who is a virgin, and his concubine; let me bring them out, and humble ye them, and do to them as is good in your sight; but to this man do not so vile a thing.";
web[24] = "Behold, [here] is my daughter, a maiden, and his concubine; them I will bring out now, and humble ye them, and do with them what seemeth good to you: but to this man do not so vile a thing.";
hnv[24] = "Behold, here is my daughter a virgin, and his concubine; them I will bring out now, and humble you them, and do with them what seems good to you: but to this man don\'t do any such folly.";
vul[24] = "habeo filiam virginem et hic homo habet concubinam educam eas ad vos ut humilietis eas et vestram libidinem conpleatis tantum obsecro ne scelus hoc contra naturam operemini in virum";
kjv[25] = "But the men would not hearken to him: so the man took his concubine, and brought her forth unto them; and they knew her, and abused her all the night until the morning: and when the day began to spring, they let her go.";
rsv[25] = "But the men would not listen to him. So the man seized his concubine, and put her out to them; and they knew her, and abused her all night until the morning. And as the dawn began to break, they let her go.";
asv[25] = "But the men would not hearken to him: so the man laid hold on his concubine, and brought her forth unto them; and they knew her, and abused her all the night until the morning: and when the day began to spring, they let her go.";
yng[25] = "And the men have not been willing to hearken to him, and the man taketh hold on his concubine, and bringeth [her] out unto them without, and they know her, and roll themselves upon her all the night, till the morning, and send her away in the ascending of the dawn;";
dby[25] = "But the men would not hearken to him; and the man took his concubine, and brought her forth to them; and they knew her, and abused her all the night until the morning; and let her go when the morning-dawn arose.";
web[25] = "But the men would not hearken to him: so the man took his concubine, and brought her forth to them; and they knew her, and abused her all the night until the morning: and when the day began to spring, they let her go.";
hnv[25] = "But the men wouldn\'t listen to him: so the man laid hold on his concubine, and brought her forth to them; and they knew her, and abused her all the night until the morning: and when the day began to spring, they let her go.";
vul[25] = "nolebant adquiescere sermonibus eius quod cernens homo eduxit ad eos concubinam suam et eis tradidit inludendam qua cum tota nocte abusi essent dimiserunt eam mane";
kjv[26] = "Then came the woman in the dawning of the day, and fell down at the door of the man\'s house where her lord [was], till it was light.";
rsv[26] = "And as morning appeared, the woman came and fell down at the door of the man\'s house where her master was, till it was light.";
asv[26] = "Then came the woman in the dawning of the day, and fell down at the door of the man\'s house where her lord was, till it was light.";
yng[26] = "and the woman cometh in at the turning of the morning, and falleth at the opening of the man\'s house, where her lord [is], till the light.";
dby[26] = "And the woman came at the dawning of the day, and fell down at the entrance of the man\'s house where her lord was, till it was light.";
web[26] = "Then came the woman in the dawning of the day, and fell down at the door of the man\'s house where her lord [was], till it was light.";
hnv[26] = "Then came the woman in the dawning of the day, and fell down at the door of the man\'s house where her lord was, until it was light.";
vul[26] = "at mulier recedentibus tenebris venit ad ostium domus ubi manebat dominus suus et ibi corruit";
kjv[27] = "And her lord rose up in the morning, and opened the doors of the house, and went out to go his way: and, behold, the woman his concubine was fallen down [at] the door of the house, and her hands [were] upon the threshold.";
rsv[27] = "And her master rose up in the morning, and when he opened the doors of the house and went out to go on his way, behold, there was his concubine lying at the door of the house, with her hands on the threshold.";
asv[27] = "And her lord rose up in the morning, and opened the doors of the house, and went out to go his way; and, behold, the woman his concubine was fallen down at the door of the house, with her hands upon the threshold.";
yng[27] = "And her lord riseth in the morning, and openeth the doors of the house, and goeth out to go on his way, and lo, the woman, his concubine, is fallen at the opening of the house, and her hands [are] on the threshold,";
dby[27] = "And her lord rose up in the morning, and opened the door of the house, and went out to go his way, and behold, there lay the woman his concubine at the entrance of the house, and her hands were upon the threshold.";
web[27] = "And her lord rose in the morning, and opened the doors of the house, and went out to go his way: and behold, the woman his concubine had fallen down [at] the door of the house, and her hands [were] upon the threshhold.";
hnv[27] = "Her lord rose up in the morning, and opened the doors of the house, and went out to go his way; and, behold, the woman his concubine was fallen down at the door of the house, with her hands on the threshold.";
vul[27] = "mane facto surrexit homo et aperuit ostium ut coeptam expleret viam et ecce concubina eius iacebat ante ostium sparsis in limine manibus";
kjv[28] = "And he said unto her, Up, and let us be going. But none answered. Then the man took her [up] upon an ass, and the man rose up, and gat him unto his place.";
rsv[28] = "He said to her, &quot;Get up, let us be going.&quot; But there was no answer. Then he put her upon the ass; and the man rose up and went away to his home.";
asv[28] = "And he said unto her, Up, and let us be going; but none answered: then he took her up upon the ass; and the man rose up, and gat him unto his place.";
yng[28] = "and he saith unto her, `Rise, and we go;\' and there is none answering, and he taketh her on the ass, and the man riseth and goeth to his place,";
dby[28] = "And he said to her, Up, and let us go; but no one answered. And he took her upon the ass; and the man rose up, and went to his place.";
web[28] = "And he said to her, Rise, and let us be going. But none answered. Then the man took her upon an ass, and the man rose, and went to his place.";
hnv[28] = "He said to her, Up, and let us be going; but none answered: then he took her up on the donkey; and the man rose up, and got him to his place.";
vul[28] = "cui ille putans eam quiescere loquebatur surge ut ambulemus qua nihil respondente intellegens quod erat tulit eam et inposuit asino reversusque est in domum suam";
kjv[29] = "And when he was come into his house, he took a knife, and laid hold on his concubine, and divided her, [together] with her bones, into twelve pieces, and sent her into all the coasts of Israel.";
rsv[29] = "And when he entered his house, he took a knife, and laying hold of his concubine he divided her, limb by limb, into twelve pieces, and sent her throughout all the territory of Israel.";
asv[29] = "And when he was come into his house, he took a knife, and laid hold on his concubine, and divided her, limb by limb, into twelve pieces, and sent her throughout all the borders of Israel.";
yng[29] = "and cometh in unto his house, and taketh the knife, and layeth hold on his concubine, and cutteth her in pieces to her bones -- into twelve pieces, and sendeth her into all the border of Israel.";
dby[29] = "And when he was come into his house, he took the knife, and laid hold on his concubine, and divided her, according to her bones, into twelve pieces, and sent her into all the borders of Israel.";
web[29] = "And when he was come into his house, he took a knife, and laid hold on his concubine, and divided her, with her bones, into twelve pieces, and sent her into all the borders of Israel.";
hnv[29] = "When he was come into his house, he took a knife, and laid hold on his concubine, and divided her, limb by limb, into twelve pieces, and sent her throughout all the borders of Yisra\'el.";
vul[29] = "quam cum esset ingressus arripuit gladium et cadaver uxoris cum ossibus suis in duodecim partes ac frusta concidens misit in omnes terminos Israhel";
kjv[30] = "And it was so, that all that saw it said, There was no such deed done nor seen from the day that the children of Israel came up out of the land of Egypt unto this day: consider of it, take advice, and speak [your minds].";
rsv[30] = "And all who saw it said, &quot;Such a thing has never happened or been seen from the day that the people of Israel came up out of the land of Egypt until this day; consider it, take counsel, and speak.&quot;";
asv[30] = "And it was so, that all that saw it said, There was no such deed done nor seen from the day that the children of Israel came up out of the land of Egypt unto this day: consider it, take counsel, and speak.";
yng[30] = "And it hath come to pass, every one who seeth hath said, `There hath not been -- yea, there hath not been seen like this, from the day of the coming up of the sons of Israel out of the land of Egypt till this day; set your [heart] upon it, take counsel, and speak.\'";
dby[30] = "And it came to pass that every one that saw it said, There was no such deed done nor seen from the day that the children of Israel came out of Egypt to this day. Think it over, advise, and speak.";
web[30] = "And it was so, that all that saw it, said, There hath been no such deed done nor seen from the day that the children of Israel came from the land of Egypt to this day: consider of it, take advice, and speak [your minds].";
hnv[30] = "It was so, that all who saw it said, There was no such deed done nor seen from the day that the children of Yisra\'el came up out of the land of Mitzrayim to this day: consider it, take counsel, and speak.";
vul[30] = "quod cum vidissent singuli conclamabant numquam res talis facta est in Israhel ex eo die quo ascenderunt patres nostri de Aegypto usque in praesens tempus ferte sententiam et in commune decernite quid facto opus sit";
</script>
