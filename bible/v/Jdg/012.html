csb[1] = "The men of Ephraim were called together and crossed the Jordan to Zaphon. They said to Jephthah, &quot;Why have you crossed over to fight against the Ammonites but didn\'t call us to go with you? We will burn your house with you in it! &quot;";
csb[2] = "Then Jephthah said to them, &quot;My people and I had a bitter conflict with the Ammonites. So I called for you, but you didn\'t deliver me from their power.";
csb[3] = "&quot;When I saw that you weren\'t going to deliver me, I took my life in my own hands and crossed over to the Ammonites, and the LORD handed them over to me. Why then have you come today to fight against me? &quot;";
csb[4] = "Then Jephthah gathered all of the men of Gilead. They fought and defeated Ephraim, because Ephraim had said, &quot;You Gileadites are Ephraimite fugitives in the territories of Ephraim and Manasseh.&quot;";
csb[5] = "The Gileadites captured the fords of the Jordan leading to Ephraim. Whenever a fugitive from Ephraim said, &quot;Let me cross over,&quot; the Gileadites asked him, &quot;Are you an Ephraimite? &quot; If he answered, &quot;No,&quot;";
csb[6] = "they told him, &quot;Please say Shibboleth.&quot; If he said, &quot;Sibboleth,&quot; because he could not pronounce it correctly, they seized him and executed him at the fords of the Jordan. At that time forty-two thousand from Ephraim died.";
csb[7] = "Jephthah judged Israel six years, and when he died, he was buried in one of the cities of Gilead.";
csb[8] = "Ibzan, who was from Bethlehem, judged Israel after Jephthah";
csb[9] = "and had thirty sons. He gave his thirty daughters in marriage to men outside the tribe and brought back thirty wives for his sons from outside the tribe. Ibzan judged Israel seven years,";
csb[10] = "and when he died, he was buried in Bethlehem.";
csb[11] = "Elon, who was from Zebulun, judged Israel after Ibzan. He judged Israel ten years,";
csb[12] = "and when he died, he was buried in Aijalon in the land of Zebulun.";
csb[13] = "After Elon, Abdon son of Hillel, who was from Pirathon, judged Israel.";
csb[14] = "He had forty sons and thirty grandsons, who rode on seventy donkeys. Abdon judged Israel eight years,";
csb[15] = "and when he died, he was buried in Pirathon in the land of Ephraim, in the hill country of the Amalekites.";
kjv[1] = "And the men of Ephraim gathered themselves together, and went northward, and said unto Jephthah, Wherefore passedst thou over to fight against the children of Ammon, and didst not call us to go with thee? we will burn thine house upon thee with fire.";
kjv[2] = "And Jephthah said unto them, I and my people were at great strife with the children of Ammon; and when I called you, ye delivered me not out of their hands.";
kjv[3] = "And when I saw that ye delivered [me] not, I put my life in my hands, and passed over against the children of Ammon, and the LORD delivered them into my hand: wherefore then are ye come up unto me this day, to fight against me?";
kjv[4] = "Then Jephthah gathered together all the men of Gilead, and fought with Ephraim: and the men of Gilead smote Ephraim, because they said, Ye Gileadites [are] fugitives of Ephraim among the Ephraimites, [and] among the Manassites.";
kjv[5] = "And the Gileadites took the passages of Jordan before the Ephraimites: and it was [so], that when those Ephraimites which were escaped said, Let me go over; that the men of Gilead said unto him, [Art] thou an Ephraimite? If he said, Nay;";
kjv[6] = "Then said they unto him, Say now Shibboleth: and he said Sibboleth: for he could not frame to pronounce [it] right. Then they took him, and slew him at the passages of Jordan: and there fell at that time of the Ephraimites forty and two thousand.";
kjv[7] = "And Jephthah judged Israel six years. Then died Jephthah the Gileadite, and was buried in [one of] the cities of Gilead.";
kjv[8] = "And after him Ibzan of Bethlehem judged Israel.";
kjv[9] = "And he had thirty sons, and thirty daughters, [whom] he sent abroad, and took in thirty daughters from abroad for his sons. And he judged Israel seven years.";
kjv[10] = "Then died Ibzan, and was buried at Bethlehem.";
kjv[11] = "And after him Elon, a Zebulonite, judged Israel; and he judged Israel ten years.";
kjv[12] = "And Elon the Zebulonite died, and was buried in Aijalon in the country of Zebulun.";
kjv[13] = "And after him Abdon the son of Hillel, a Pirathonite, judged Israel.";
kjv[14] = "And he had forty sons and thirty nephews, that rode on threescore and ten ass colts: and he judged Israel eight years.";
kjv[15] = "And Abdon the son of Hillel the Pirathonite died, and was buried in Pirathon in the land of Ephraim, in the mount of the Amalekites.";
rsv[1] = "The men of E\'phraim were called to arms, and they crossed to Zaphon and said to Jephthah, &quot;Why did you cross over to fight against the Ammonites, and did not call us to go with you? We will burn your house over you with fire.&quot;";
asv[1] = "And the men of Ephraim were gathered together, and passed northward; and they said unto Jephthah, Wherefore passedst thou over to fight against the children of Ammon, and didst not call us to go with thee? we will burn thy house upon thee with fire.";
yng[1] = "And the men of Ephraim are called together, and pass over northward, and say to Jephthah, `Wherefore has thou passed over to fight against the Bene-Ammon, and on us hast not called to go with thee? thy house we burn over thee with fire.\'";
dby[1] = "And the men of Ephraim were called together, and passed over northwards, and said to Jephthah, Why didst thou pass over to fight against the children of Ammon, and didst not call us to go with thee? We will burn thy house upon thee with fire.";
web[1] = "And the men of Ephraim assembled, and went northward, and said to Jephthah, Why didst thou pass over to fight against the children of Ammon, and didst not call us to go with thee; we will burn thy house upon thee with fire.";
hnv[1] = "The men of Efrayim were gathered together, and crossed Tzafon; and they said to Yiftach, Why did you pass over to fight against the children of `Ammon, and didn\'t call us to go with you? we will burn your house on you with fire.";
vul[1] = "ecce autem in Ephraim orta seditio est nam transeuntes contra aquilonem dixerunt ad Iepthae quare vadens ad pugnam contra filios Ammon vocare nos noluisti ut pergeremus tecum igitur incendimus domum tuam";
rsv[2] = "And Jephthah said to them, &quot;I and my people had a great feud with the Ammonites; and when I called you, you did not deliver me from their hand.";
asv[2] = "And Jephthah said unto them, I and my people were at great strife with the children of Ammon; and when I called you, ye saved me not out of their hand.";
yng[2] = "And Jephthah saith unto them, `A man of great strife I have been (I and my people) with the Bene-Ammon, and I call you, and ye have not saved me out of their hand,";
dby[2] = "And Jephthah said to them, I was at great strife, I and my people, with the children of Ammon; and I called you, but ye saved me not out of their hand.";

asv[3] = "And when I saw that ye saved me not, I put my life in my hand, and passed over against the children of Ammon, and Jehovah delivered them into my hand: wherefore then are ye come up unto me this day, to fight against me?";
yng[3] = "and I see that thou art not a saviour, and I put my life in my hand, and pass over unto the Bene-Ammon, and Jehovah giveth them into my hand -- and why have ye come up unto me this day to fight against me?\'";

rsv[4] = "Then Jephthah gathered all the men of Gilead and fought with E\'phraim; and the men of Gilead smote E\'phraim, because they said, &quot;You are fugitives of E\'phraim, you Gileadites, in the midst of E\'phraim and Manas\'seh.&quot;";
asv[4] = "Then Jephthah gathered together all the men of Gilead, and fought with Ephraim; and the men of Gilead smote Ephraim, because they said, Ye are fugitives of Ephraim, ye Gileadites, in the midst of Ephraim, [and] in the midst of Manasseh.";
yng[4] = "And Jephthah gathered all the men of Gilead, and fighteth with Ephraim, and the men of Gilead smite Ephraim, because they said, `Fugitives of Ephraim [are] ye Gileadites, in the midst of Ephraim -- in the midst of Manasseh.\'";
dby[4] = "And Jephthah gathered together all the men of Gilead, and fought with Ephraim; and the men of Gilead smote Ephraim, because they said, Ye, Gilead, ye are fugitives of Ephraim in the midst of Ephraim, [and] in the midst of Manasseh.";
web[4] = "Then Jephthah collected all the men of Gilead, and fought with Ephraim: and the men of Gilead smote Ephraim, because they said, Ye Gileadites [are] fugitives of Ephraim among the Ephraimites, [and] among the Manassites.";
hnv[4] = "Then Yiftach gathered together all the men of Gil`ad, and fought with Efrayim; and the men of Gil`ad struck Efrayim, because they said, You are fugitives of Efrayim, you Gil`adi, in the midst of Efrayim, [and] in the midst of Menashsheh.";
vul[4] = "vocatis itaque ad se cunctis viris Galaad pugnabat contra Ephraim percusseruntque viri Galaad Ephraim quia dixerat fugitivus est Galaad de Ephraim et habitat in medio Ephraim et Manasse";
rsv[5] = "And the Gileadites took the fords of the Jordan against the E\'phraimites. And when any of the fugitives of E\'phraim said, &quot;Let me go over,&quot; the men of Gilead said to him, &quot;Are you an E\'phraimite?&quot; When he said, &quot;No,&quot;";
asv[5] = "And the Gileadites took the fords of the Jordan against the Ephraimites. And it was so, that, when [any of] the fugitives of Ephraim said, Let me go over, the men of Gilead said unto him, Art thou an Ephraimite? If he said, Nay;";
yng[5] = "And Gilead captureth the passages of the Jordan to Ephraim, and it hath been, when [any of] the fugitives of Ephraim say, `Let me pass over,\' and the men of Gilead say to him, `An Ephramite thou?\' and he saith, `No;\'";
dby[5] = "And Gilead took the fords of the Jordan before Ephraim; and it came to pass that when the fugitives of Ephraim said, Let me go over, the men of Gilead said to him, Art thou an Ephraimite? and he said, No.";
web[5] = "And the Gileadites took the passages of Jordan before the Ephraimites: and it was [so], that when those Ephraimites who had escaped, said, Let me go over; that the men of Gilead said to him, [Art] thou an Ephraimite? If he said, No;";
hnv[5] = "The Gil`adi took the fords of the Yarden against the Efrayim. It was so, that when [any of] the fugitives of Efrayim said, Let me go over, the men of Gil`ad said to him, Are you an Efratite? If he said, No;";
vul[5] = "occupaveruntque Galaaditae vada Iordanis per quae Ephraim reversurus erat cumque venisset ad ea de Ephraim numero fugiens atque dixisset obsecro ut me transire permittas dicebant ei Galaaditae numquid Ephrateus es quo dicente non sum";
rsv[6] = "they said to him, &quot;Then say Shibboleth,&quot; and he said, &quot;Sibboleth,&quot; for he could not pronounce it right; then they seized him and slew him at the fords of the Jordan. And there fell at that time forty-two thousand of the E\'phraimites.";
asv[6] = "then said they unto him, Say now Shibboleth; and he said Sibboleth; for he could not frame to pronounce it right: then they laid hold on him, and slew him at the fords of the Jordan. And there fell at that time of Ephraim forty and two thousand.";
yng[6] = "that they say to him, `Say, I pray thee, Shibboleth;\' and he saith, `Sibboleth,\' and is not prepared to speak right -- and they seize him, and slaughter him at the passages of the Jordan, and there fall at that time, of Ephraim, forty and two chiefs.";
dby[6] = "Then they said to him, Say now Shibboleth! and he said, Sibboleth, and did not manage to pronounce [it] rightly. Then they took him, and slaughtered him at the fords of the Jordan. And there fell at that time of Ephraim forty-two thousand.";
web[6] = "Then said they to him, Say now Shibboleth: and he said Sibboleth: for he could not frame to pronounce [it] right. Then they took him, and slew him at the passages of Jordan. And there fell at that time of the Ephraimites forty and two thousand.";
hnv[6] = "then said they to him, Say now Shibbolet; and he said Sibboleth; for he couldn\'t manage to pronounce it right: then they laid hold on him, and killed him at the fords of the Yarden. There fell at that time of Efrayim forty-two thousand.";
vul[6] = "interrogabant eum dic ergo sebboleth quod interpretatur spica qui respondebat tebboleth eadem littera spicam exprimere non valens statimque adprehensum iugulabant in ipso Iordanis transitu et ceciderunt in illo tempore de Ephraim quadraginta duo milia";
