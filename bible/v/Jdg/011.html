csb[1] = "Jephthah the Gileadite was a valiant warrior, but he was the son of a prostitute, and Gilead was his father.";
csb[2] = "Gilead\'s wife bore him sons, and when they grew up, they drove Jephthah out and said to him, &quot;You will have no inheritance in our father\'s family, because you are the son of another woman.&quot;";
csb[3] = "So Jephthah fled from his brothers and lived in the land of Tob. Then some worthless men joined Jephthah and went on raids with him.";
csb[4] = "Some time later, the Ammonites fought against Israel.";
csb[5] = "When the Ammonites made war with Israel, the elders of Gilead went to get Jephthah from the land of Tob.";
csb[6] = "They said to him, &quot;Come, be our commander, and let\'s fight the Ammonites.&quot;";
csb[7] = "Jephthah replied to the elders of Gilead, &quot;Didn\'t you hate me and drive me out of my father\'s family? Why then have you come to me now when you\'re in trouble? &quot;";
csb[8] = "They answered Jephthah, &quot;That\'s true. But now we turn to you. Come with us, fight the Ammonites, and you will become leader of all the inhabitants of Gilead.&quot;";
csb[9] = "So Jephthah said to them, &quot;If you are bringing me back to fight the Ammonites and the LORD gives them to me, I will be your leader.&quot;";
csb[10] = "The elders of Gilead said to Jephthah, &quot;The LORD is our witness if we don\'t do as you say.&quot;";
csb[11] = "So Jephthah went with the elders of Gilead. The people made him their leader and commander, and Jephthah repeated all his terms in the presence of the LORD at Mizpah.";
csb[12] = "Jephthah sent messengers to the king of the Ammonites, asking, &quot;What do you have against me that you have come to fight me in my land? &quot;";
csb[13] = "The king of the Ammonites said to Jephthah\'s messengers, &quot;When Israel came from Egypt, they seized my land from the Arnon to the Jabbok and the Jordan. Now restore it peaceably.&quot;";
csb[14] = "Jephthah again sent messengers to the king of the Ammonites";
csb[15] = "to tell him, &quot;This is what Jephthah says: Israel did not take away the land of Moab or the land of the Ammonites.";
csb[16] = "&quot; But when they came from Egypt, Israel traveled through the wilderness to the Red Sea and came to Kadesh.";
csb[17] = "&quot;Israel sent messengers to the king of Edom, saying, \'Please let us travel through your land,\' but the king of Edom would not listen. They also sent messengers to the king of Moab, but he refused. So Israel stayed in Kadesh.";
csb[18] = "&quot;Then they traveled through the wilderness and around the lands of Edom and Moab. They came to the east side of the land of Moab and camped on the other side of the Arnon but did not enter into the territory of Moab, for the Arnon was the boundary of Moab.";
csb[19] = "&quot;Then Israel sent messengers to Sihon king of the Amorites, king of Heshbon. Israel said to him, \'Please let us travel through your land to our country,\'";
csb[20] = "&quot;but Sihon would not trust Israel to pass through his territory. Instead, Sihon gathered all his troops, camped at Jahaz, and fought with Israel.";
csb[21] = "&quot;Then the LORD God of Israel handed over Sihon and all his troops to Israel, and they defeated them. So Israel took possession of the entire land of the Amorites who lived in that country.";
csb[22] = "&quot;They took possession of all the territory of the Amorites from the Arnon to the Jabbok and from the wilderness to the Jordan.";
csb[23] = "&quot;The LORD God of Israel has now driven out the Amorites before his people Israel, and will you now force us out?";
csb[24] = "&quot;Isn\'t it true that you can have whatever your god Chemosh conquers for you, and we can have whatever the LORD our God conquers for us?";
csb[25] = "&quot;Now are you any better than Balak son of Zippor, king of Moab? Did he ever contend with Israel or fight against them?";
csb[26] = "&quot;While Israel lived three hundred years in Heshbon and Aroer and their surrounding villages, and in all the cities that are on the banks of the Arnon, why didn\'t you take them back at that time?";
csb[27] = "&quot;I have not sinned against you, but you are doing me wrong by fighting against me. Let the LORD who is the judge decide today between the Israelites and the Ammonites.&quot;";
csb[28] = "But the king of the Ammonites would not listen to Jephthah\'s message that he sent him.";
csb[29] = "The Spirit of the LORD came on Jephthah, who traveled through Gilead and Manasseh, and then through Mizpah of Gilead. He crossed over to the Ammonites from Mizpah of Gilead.";
csb[30] = "Jephthah made this vow to the LORD: &quot;If you in fact hand over the Ammonites to me,";
csb[31] = "&quot;whoever comes out the doors of my house to greet me when I return safely from the Ammonites will belong to the LORD, and I will offer that person as a burnt offering.&quot;";
csb[32] = "Jephthah crossed over to the Ammonites to fight against them, and the LORD handed them over to him.";
csb[33] = "He defeated twenty of their cities with a great slaughter from Aroer all the way to the entrance of Minnith and to Abel-keramim. So the Ammonites were subdued before the Israelites.";
csb[34] = "When Jephthah went to his home in Mizpah, there was his daughter, coming out to meet him with tambourines and dancing! She was his only child; he had no other son or daughter besides her.";
csb[35] = "When he saw her, he tore his clothes and said, &quot;No! Not my daughter! You have devastated me! You have brought great misery on me. I have given my word to the LORD and cannot take it back.&quot;";
csb[36] = "Then she said to him, &quot;My father, you have given your word to the LORD. Do to me as you have said, for the LORD brought vengeance on your enemies, the Ammonites.&quot;";
csb[37] = "She also said to her father, &quot;Let me do this one thing: Let me wander two months through the mountains with my friends and mourn my virginity.&quot;";
csb[38] = "&quot;Go,&quot; he said. And he sent her away two months. So she left with her friends and mourned her virginity as she wandered through the mountains.";
csb[39] = "At the end of two months, she returned to her father, and he kept the vow he had made about her. And she had never been intimate with a man. Now it became a custom in Israel";
csb[40] = "that four days each year the young women of Israel would commemorate the daughter of Jephthah the Gileadite.";

dby[16] = "But when they came up from Egypt, then Israel walked through the wilderness as far as the Red sea, and came to Kadesh.";
web[16] = "But when Israel came up from Egypt, and walked through the wilderness to the Red sea, and came to Kadesh;";
hnv[16] = " but when they came up from Mitzrayim, and Yisra\'el went through the wilderness to the Sea of Suf, and came to Kadesh;";
vul[16] = "sed quando de Aegypto conscenderunt ambulavit per solitudinem usque ad mare Rubrum et venit in Cades";
kjv[17] = "Then Israel sent messengers unto the king of Edom, saying, Let me, I pray thee, pass through thy land: but the king of Edom would not hearken [thereto]. And in like manner they sent unto the king of Moab: but he would not [consent]: and Israel abode in Kadesh.";
rsv[17] = "Israel then sent messengers to the king of Edom, saying, \'Let us pass, we pray, through your land\'; but the king of Edom would not listen. And they sent also to the king of Moab, but he would not consent. So Israel remained at Kadesh.";
asv[17] = "then Israel sent messengers unto the king of Edom, saying, Let me, I pray thee, pass through thy land; but the king of Edom hearkened not. And in like manner he sent unto the king of Moab; but he would not: and Israel abode in Kadesh.";
yng[17] = "and Israel sendeth messengers unto the king of Edom, saying, Let me pass over, I pray thee, through thy land, and the king of Edom hearkened not; and also unto the king of Moab hath [Israel] sent, and he hath not been willing; and Israel abideth in Kadesh,";
dby[17] = "And Israel sent messengers to the king of Edom, saying, Let me, I pray thee, pass through thy land; but the king of Edom would not hearken. And they also sent to the king of Moab; and he would not. And Israel abode in Kadesh.";
web[17] = "Then Israel sent messengers to the king of Edom, saying, Let me, I pray thee, pass through thy land: but the king of Edom would not hearken [to it]. And in like manner they sent to the king of Moab; but he would not [consent]. And Israel abode in Kadesh.";
hnv[17] = "then Yisra\'el sent messengers to the king of Edom, saying, Please let me pass through your land; but the king of Edom didn\'t listen. In the same way, he sent to the king of Mo\'av; but he would not: and Yisra\'el abode in Kadesh.";
vul[17] = "misitque nuntios ad regem Edom dicens dimitte ut transeam per terram tuam qui noluit adquiescere precibus eius misit quoque et ad regem Moab qui et ipse transitum praebere contempsit mansit itaque in Cades";
kjv[18] = "Then they went along through the wilderness, and compassed the land of Edom, and the land of Moab, and came by the east side of the land of Moab, and pitched on the other side of Arnon, but came not within the border of Moab: for Arnon [was] the border of Moab.";
rsv[18] = "Then they journeyed through the wilderness, and went around the land of Edom and the land of Moab, and arrived on the east side of the land of Moab, and camped on the other side of the Arnon; but they did not enter the territory of Moab, for the Arnon was the boundary of Moab.";
asv[18] = "Then they went through the wilderness, and went around the land of Edom, and the land of Moab, and came by the east side of the land of Moab, and they encamped on the other side of the Arnon; but they came not within the border of Moab, for the Arnon was the border of Moab.";
yng[18] = "and he goeth through the wilderness, and compasseth the land of Edom and the land of Moab, and cometh in at the rising of the sun of the land of Moab, and they encamp beyond Arnon, and have not come into the border of Moab, for Arnon [is] the border of Moab.";
dby[18] = "And they walked through the wilderness, and went round the land of Edom and the land of Moab, and came by the east of the land of Moab, and encamped beyond the Arnon, but came not within the border of Moab, for the Arnon is the border of Moab.";
web[18] = "Then they went along through the wilderness, and compassed the land of Edom, and the land of Moab, and came by the east side of the land of Moab, and pitched on the other side of Arnon, but came not within the border of Moab: for Arnon [was] the border of Moab.";
hnv[18] = "Then they went through the wilderness, and went around the land of Edom, and the land of Mo\'av, and came by the east side of the land of Mo\'av, and they encamped on the other side of the Arnon; but they didn\'t come within the border of Mo\'av, for the Arnon was the border of Mo\'av.";
vul[18] = "et circuivit ex latere terram Edom et terram Moab venitque contra orientalem plagam terrae Moab et castrametatus est trans Arnon nec voluit intrare terminos Moab Arnon quippe confinium est terrae Moab";
kjv[19] = "And Israel sent messengers unto Sihon king of the Amorites, the king of Heshbon; and Israel said unto him, Let us pass, we pray thee, through thy land into my place.";
rsv[19] = "Israel then sent messengers to Sihon king of the Amorites, king of Heshbon; and Israel said to him, \'Let us pass, we pray, through your land to our country.\'";
asv[19] = "And Israel sent messengers unto Sihon king of the Amorites, the king of Heshbon; and Israel said unto him, Let us pass, we pray thee, through thy land unto my place.";
yng[19] = "`And Israel sendeth messengers unto Sihon, king of the Amorite, king of Heshbon, and Israel saith to him, Let us pass over, we pray thee, through thy land, unto my place,";
dby[19] = "And Israel sent messengers to Sihon king of the Amorites, the king of Heshbon, and Israel said to him, Let us pass, we pray thee, through thy land unto my place.";
web[19] = "And Israel sent messengers to Sihon king of the Amorites, the king of Heshbon; and Israel said to him, Let us pass, we pray thee, through thy land to my place.";
hnv[19] = "Yisra\'el sent messengers to Sichon king of the Amori, the king of Heshbon; and Yisra\'el said to him, Let us pass, we pray you, through your land to my place.";
vul[19] = "misit itaque Israhel nuntios ad Seon regem Amorreorum qui habitabat in Esebon et dixerunt ei dimitte ut transeam per terram tuam usque ad fluvium";
kjv[20] = "But Sihon trusted not Israel to pass through his coast: but Sihon gathered all his people together, and pitched in Jahaz, and fought against Israel.";
rsv[20] = "But Sihon did not trust Israel to pass through his territory; so Sihon gathered all his people together, and encamped at Jahaz, and fought with Israel.";
asv[20] = "But Sihon trusted not Israel to pass through his border; but Sihon gathered all his people together, and encamped in Jahaz, and fought against Israel.";
yng[20] = "and Sihon hath not trusted Israel to pass over through his border, and Sihon gathereth all his people, and they encamp in Jahaz, and fight with Israel;";
dby[20] = "But Sihon trusted not Israel, to let him pass through his border, and Sihon gathered all his people, and they encamped in Jahzah; and he fought with Israel.";
web[20] = "But Sihon trusted not Israel to pass through his border: but Sihon collected all his people, and encamped in Jahaz, and fought against Israel.";
hnv[20] = "But Sichon didn\'t trust Yisra\'el to pass through his border; but Sichon gathered all his people together, and encamped in Yahatz, and fought against Yisra\'el.";
vul[20] = "qui et ipse Israhel verba despiciens non dimisit eum transire per terminos suos sed infinita multitudine congregata egressus est contra eum in Iassa et fortiter resistebat";
kjv[21] = "And the LORD God of Israel delivered Sihon and all his people into the hand of Israel, and they smote them: so Israel possessed all the land of the Amorites, the inhabitants of that country.";
rsv[21] = "And the LORD, the God of Israel, gave Sihon and all his people into the hand of Israel, and they defeated them; so Israel took possession of all the land of the Amorites, who inhabited that country.";
asv[21] = "And Jehovah, the God of Israel, delivered Sihon and all his people into the hand of Israel, and they smote them: so Israel possessed all the land of the Amorites, the inhabitants of that country.";
yng[21] = "and Jehovah, God of Israel, giveth Sihon and all his people into the hand of Israel, and they smite them, and Israel possesseth all the land of the Amorite, the inhabitant of that land,";
dby[21] = "And Jehovah the God of Israel gave Sihon and all his people into the hand of Israel, and they smote them; and Israel took possession of the whole land of the Amorites, who dwelt in that country.";
web[21] = "And the LORD God of Israel delivered Sihon and all his people into the hand of Israel, and they smote them: so Israel possessed all the land of the Amorites, the inhabitants of that country.";
hnv[21] = " The LORD, the God of Yisra\'el, delivered Sichon and all his people into the hand of Yisra\'el, and they struck them: so Yisra\'el possessed all the land of the Amori, the inhabitants of that country.";
vul[21] = "tradiditque eum Dominus in manu Israhel cum omni exercitu suo qui percussit eum et possedit omnem terram Amorrei habitatoris regionis illius";
kjv[22] = "And they possessed all the coasts of the Amorites, from Arnon even unto Jabbok, and from the wilderness even unto Jordan.";
rsv[22] = "And they took possession of all the territory of the Amorites from the Arnon to the Jabbok and from the wilderness to the Jordan.";
asv[22] = "And they possessed all the border of the Amorites, from the Arnon even unto the Jabbok, and from the wilderness even unto the Jordan.";
yng[22] = "and they possess all the border of the Amorite from Arnon, and unto the Jabbok, and from the wilderness, and unto the Jordan.";
dby[22] = "And they possessed all the borders of the Amorites, from the Arnon unto the Jabbok, and from the wilderness unto the Jordan.";
web[22] = "And they possessed all the borders of the Amorites, from Arnon even to Jabbok, and from the wilderness even to Jordan.";
hnv[22] = "They possessed all the border of the Amori, from the Arnon even to the Yabbok, and from the wilderness even to the Yarden.";
vul[22] = "et universos fines eius de Arnon usque Iaboc et de solitudine usque ad Iordanem";
kjv[23] = "So now the LORD God of Israel hath dispossessed the Amorites from before his people Israel, and shouldest thou possess it?";
rsv[23] = "So then the LORD, the God of Israel, dispossessed the Amorites from before his people Israel; and are you to take possession of them?";
asv[23] = "So now Jehovah, the God of Israel, hath dispossessed the Amorites from before his people Israel, and shouldest thou possess them?";
yng[23] = "`And now, Jehovah, God of Israel, hath dispossessed the Amorite from the presence of His people Israel, and thou wouldst possess it!";
dby[23] = "And now Jehovah the God of Israel has dispossessed the Amorites from before his people Israel, and shouldest thou take possession of it?";
web[23] = "So now the LORD God of Israel hath dispossessed the Amorites from before his people Israel, and shouldst thou possess it?";
hnv[23] = "So now the LORD, the God of Yisra\'el, has dispossessed the Amori from before his people Yisra\'el, and should you possess them?";
vul[23] = "Dominus ergo Deus Israhel subvertit Amorreum pugnante contra illum populo suo Israhel et tu nunc vis possidere terram eius";
kjv[24] = "Wilt not thou possess that which Chemosh thy god giveth thee to possess? So whomsoever the LORD our God shall drive out from before us, them will we possess.";
rsv[24] = "Will you not possess what Chemosh your god gives you to possess? And all that the LORD our God has dispossessed before us, we will possess.";
asv[24] = "Wilt not thou possess that which Chemosh thy god giveth thee to possess? So whomsoever Jehovah our God hath dispossessed from before us, them will we possess.";
yng[24] = "That which Chemosh thy god causeth thee to possess -- dost thou not possess it? and all that which Jehovah our God hath dispossessed from our presence, -- it we do possess.";
dby[24] = "Dost not thou possess what Chemosh thy god puts thee in possession of? and whatever Jehovah our God has dispossessed before us, that will we possess.";
web[24] = "Wilt not thou possess that which Chemosh thy god giveth thee to possess? So whomsoever the LORD our God shall drive out from before us, them will we possess.";
hnv[24] = "Won\'t you possess that which Kemosh your god gives you to possess? So whoever the LORD our God has dispossessed from before us, them will we possess.";
vul[24] = "nonne ea quae possedit Chamos deus tuus tibi iure debentur quae autem Dominus Deus noster victor obtinuit in nostram cedent possessionem";
kjv[25] = "And now [art] thou any thing better than Balak the son of Zippor, king of Moab? did he ever strive against Israel, or did he ever fight against them,";
rsv[25] = "Now are you any better than Balak the son of Zippor, king of Moab? Did he ever strive against Israel, or did he ever go to war with them?";
asv[25] = "And now art thou anything better than Balak the son of Zippor, king of Moab? did he ever strive against Israel, or did he ever fight against them?";
yng[25] = "`And now, [art] thou at all better than Balak son of Zippor, king of Moab? did he at all strive with Israel? did he at all fight against them?";
dby[25] = "And now art thou indeed better than Balak the son of Zippor, king of Moab? did he ever strive with Israel? did he ever fight against them?";
web[25] = "And now [art] thou any thing better than Balak the son of Zippor king of Moab? did he ever strive against Israel, or did he ever fight against them,";
hnv[25] = " Now are you anything better than Balak the son of Tzippor, king of Mo\'av? did he ever strive against Yisra\'el, or did he ever fight against them?";
vul[25] = "nisi forte melior es Balac filio Sepphor rege Moab aut docere potes quod iurgatus sit contra Israhel et pugnaverit contra eum";
kjv[26] = "While Israel dwelt in Heshbon and her towns, and in Aroer and her towns, and in all the cities that [be] along by the coasts of Arnon, three hundred years? why therefore did ye not recover [them] within that time?";
rsv[26] = "While Israel dwelt in Heshbon and its villages, and in Aro\'er and its villages, and in all the cities that are on the banks of the Arnon, three hundred years, why did you not recover them within that time?";
asv[26] = "While Israel dwelt in Heshbon and its towns, and in Aroer and its towns, and in all the cities that are along by the side of the Arnon, three hundred years; wherefore did ye not recover them within that time?";
yng[26] = "In Israel\'s dwelling in Heshbon and in its towns, and in Aroer and in its towns, and in all the cities which [are] by the sides of Arnon three hundred years -- and wherefore have ye not delivered them in that time?";
dby[26] = "While Israel dwelt in Heshbon and its dependent villages, and in Aroer and its dependent villages, and in all the cities that are along the banks of the Arnon, three hundred years -- why did ye not recover [them] within that time?";
web[26] = "While Israel dwelt in Heshbon and her towns, and in Aroer and her towns, and in all the cities that [are] along by the borders of Arnon, three hundred years? why therefore did ye not recover [them] within that time?";
hnv[26] = "While Yisra\'el lived in Heshbon and its towns, and in `Aro`er and its towns, and in all the cities that are along by the side of the Arnon, three hundred years; why didn\'t you recover them within that time?";
vul[26] = "quando habitavit in Esebon et viculis eius et in Aroer et villis illius vel in cunctis civitatibus iuxta Iordanem per trecentos annos quare tanto tempore nihil super hac repetitione temptastis";
kjv[27] = "Wherefore I have not sinned against thee, but thou doest me wrong to war against me: the LORD the Judge be judge this day between the children of Israel and the children of Ammon.";
rsv[27] = "I therefore have not sinned against you, and you do me wrong by making war on me; the LORD, the Judge, decide this day between the people of Israel and the people of Ammon.&quot;";
asv[27] = "I therefore have not sinned against thee, but thou doest me wrong to war against me: Jehovah, the Judge, be judge this day between the children of Israel and the children of Ammon.";
yng[27] = "And I -- I have not sinned against thee, and thou art doing with me evil -- to fight against me. Jehovah, the Judge, doth judge to-day between the sons of Israel and the sons of Ammon.\'";
dby[27] = "So I have not sinned against thee, but it is thou who doest me wrong in making war against me. Jehovah, the Judge, be judge this day between the children of Israel and the children of Ammon!";
web[27] = "Wherefore I have not sinned against thee, but thou doest me wrong to war against me: the LORD the Judge be judge this day between the children of Israel and the children of Ammon.";
hnv[27] = "I therefore have not sinned against you, but you do me wrong to war against me: the LORD, the Judge, be judge this day between the children of Yisra\'el and the children of `Ammon.";
vul[27] = "igitur non ego pecco in te sed tu contra me male agis indicens mihi bella non iusta iudicet Dominus arbiter huius diei inter Israhel et inter filios Ammon";
kjv[28] = "Howbeit the king of the children of Ammon hearkened not unto the words of Jephthah which he sent him.";
rsv[28] = "But the king of the Ammonites did not heed the message of Jephthah which he sent to him.";
asv[28] = "Howbeit the king of the children of Ammon hearkened not unto the words of Jephthah which he sent him.";
yng[28] = "And the king of the Bene-Ammon hath not hearkened unto the words of Jephthah which he sent unto him,";
dby[28] = "But the king of the children of Ammon hearkened not to the words of Jephthah that he had sent him.";
web[28] = "But, the king of the children of Ammon hearkened not to the words of Jephthah which he sent him.";
hnv[28] = "However the king of the children of `Ammon didn\'t listen to the words of Yiftach which he sent him.";
vul[28] = "noluitque adquiescere rex filiorum Ammon verbis Iepthae quae per nuntios mandaverat";
kjv[29] = "Then the Spirit of the LORD came upon Jephthah, and he passed over Gilead, and Manasseh, and passed over Mizpeh of Gilead, and from Mizpeh of Gilead he passed over [unto] the children of Ammon.";
rsv[29] = "Then the Spirit of the LORD came upon Jephthah, and he passed through Gilead and Manas\'seh, and passed on to Mizpah of Gilead, and from Mizpah of Gilead he passed on to the Ammonites.";
asv[29] = "Then the Spirit of Jehovah came upon Jephthah, and he passed over Gilead and Manasseh, and passed over Mizpeh of Gilead, and from Mizpeh of Gilead he passed over unto the children of Ammon.";
yng[29] = "and the Spirit of Jehovah is on Jephthah, and he passeth over Gilead and Manasseh, and passeth over Mizpeh of Gilead, and from Mizpeh of Gilead he hath passed over to the Bene-Ammon.";
dby[29] = "Then the Spirit of Jehovah came upon Jephthah, and he passed through Gilead and Manasseh, and passed to Mizpeh of Gilead, and from Mizpeh of Gilead he passed over to the children of Ammon.";
web[29] = "Then the Spirit of the LORD came upon Jephthah, and he passed over Gilead, and Manasseh, and passed over Mizpeh of Gilead, and from Mizpeh of Gilead he passed over [to] the children of Ammon.";
hnv[29] = "Then the Spirit of the LORD came on Yiftach, and he passed over Gil`ad and Menashsheh, and passed over Mitzpeh of Gil`ad, and from Mitzpeh of Gil`ad he passed over to the children of `Ammon.";
vul[29] = "factus est ergo super Iepthae spiritus Domini et circumiens Galaad et Manasse Maspha quoque Galaad et inde transiens ad filios Ammon";
kjv[30] = "And Jephthah vowed a vow unto the LORD, and said, If thou shalt without fail deliver the children of Ammon into mine hands,";
rsv[30] = "And Jephthah made a vow to the LORD, and said, &quot;If thou wilt give the Ammonites into my hand,";
asv[30] = "And Jephthah vowed a vow unto Jehovah, and said, If thou wilt indeed deliver the children of Ammon into my hand,";
yng[30] = "And Jephthah voweth a vow to Jehovah, and saith, `If Thou dost at all give the Bene-Ammon into my hand --";
dby[30] = "And Jephthah vowed a vow to Jehovah, and said, If thou wilt without fail give the children of Ammon into my hand,";
web[30] = "And Jephthah vowed a vow to the LORD, and said, If thou shalt without fail deliver the children of Ammon into my hands,";
hnv[30] = "Yiftach vowed a vow to the LORD, and said, If you will indeed deliver the children of `Ammon into my hand,";
vul[30] = "votum vovit Domino dicens si tradideris filios Ammon in manus meas";
kjv[31] = "Then it shall be, that whatsoever cometh forth of the doors of my house to meet me, when I return in peace from the children of Ammon, shall surely be the LORD\'S, and I will offer it up for a burnt offering.";
rsv[31] = "then whoever comes forth from the doors of my house to meet me, when I return victorious from the Ammonites, shall be the LORD\'s, and I will offer him up for a burnt offering.&quot;";
asv[31] = "then it shall be, that whatsoever cometh forth from the doors of my house to meet me, when I return in peace from the children of Ammon, it shall be Jehovah\'s, and I will offer it up for a burnt-offering.";
yng[31] = "then it hath been, that which at all cometh out from the doors of my house to meet me in my turning back in peace from the Bene-Ammon -- it hath been to Jehovah, or I have offered up for it -- a burnt-offering.\'";
dby[31] = "then shall that which cometh forth from the door of my house to meet me, when I return in peace from the children of Ammon, be Jehovah\'s, and I will offer it up for a burnt-offering.";
web[31] = "Then it shall be, that whatever cometh out of the doors of my house to meet me, when I return in peace from the children of Ammon, shall surely be the LORD\'S, and I will offer it for a burnt-offering.";
hnv[31] = "then it shall be, that whatever comes forth from the doors of my house to meet me, when I return in shalom from the children of `Ammon, it shall be the LORD\'s, and I will offer it up for a burnt offering.";
vul[31] = "quicumque primus fuerit egressus de foribus domus meae mihique occurrerit revertenti cum pace a filiis Ammon eum holocaustum offeram Domino";
kjv[32] = "So Jephthah passed over unto the children of Ammon to fight against them; and the LORD delivered them into his hands.";
rsv[32] = "So Jephthah crossed over to the Ammonites to fight against them; and the LORD gave them into his hand.";
asv[32] = "So Jephthah passed over unto the children of Ammon to fight against them; and Jehovah delivered them into his hand.";
yng[32] = "And Jephthah passeth over unto the Bene-Ammon to fight against them, and Jehovah giveth them into his hand,";
dby[32] = "And Jephthah passed over to the children of Ammon to fight against them; and Jehovah gave them into his hand.";
web[32] = "So Jephthah passed over to the children of Ammon to fight against them; and the LORD delivered them into his hands.";
hnv[32] = "So Yiftach passed over to the children of `Ammon to fight against them; and the LORD delivered them into his hand.";
vul[32] = "transivitque Iepthae ad filios Ammon ut pugnaret contra eos quos tradidit Dominus in manus eius";
kjv[33] = "And he smote them from Aroer, even till thou come to Minnith, [even] twenty cities, and unto the plain of the vineyards, with a very great slaughter. Thus the children of Ammon were subdued before the children of Israel.";
rsv[33] = "And he smote them from Aro\'er to the neighborhood of Minnith, twenty cities, and as far as Abel-keramim, with a very great slaughter. So the Ammonites were subdued before the people of Israel.";
asv[33] = "And he smote them from Aroer until thou come to Minnith, even twenty cities, and unto Abelcheramim, with a very great slaughter. So the children of Ammon were subdued before the children of Israel.";
yng[33] = "and he smiteth them from Aroer, and unto thy going in to Minnith, twenty cities, and unto the meadow of the vineyards -- a very great smiting; and the Bene-Ammon are humbled at the presence of the sons of Israel.";
dby[33] = "And he smote them from Aroer until thou come to Minnith, twenty cities, even unto Abel-Cheramim, with a very great slaughter; and the children of Ammon were subdued before the children of Israel.";
web[33] = "And he smote them from Aroer even till thou comest to Minnith, [even] twenty cities, and to the plain of the vineyards, with a very great slaughter. Thus the children of Ammon were subdued before the children of Israel.";
hnv[33] = " He struck them from `Aro`er until you come to Minnit, even twenty cities, and to Avel-Keramim, with a very great slaughter. So the children of `Ammon were subdued before the children of Yisra\'el.";
vul[33] = "percussitque ab Aroer usque dum venias in Mennith viginti civitates et usque ad Abel quae est vineis consita plaga magna nimis humiliatique sunt filii Ammon a filiis Israhel";
kjv[34] = "And Jephthah came to Mizpeh unto his house, and, behold, his daughter came out to meet him with timbrels and with dances: and she [was his] only child; beside her he had neither son nor daughter.";
rsv[34] = "Then Jephthah came to his home at Mizpah; and behold, his daughter came out to meet him with timbrels and with dances; she was his only child; beside her he had neither son nor daughter.";
asv[34] = "And Jephthah came to Mizpah unto his house; and, behold, his daughter came out to meet him with timbrels and with dances: and she was his only child; besides her he had neither son nor daughter.";
yng[34] = "And Jephthah cometh into Mizpeh, unto his house, and lo, his daughter is coming out to meet him with timbrels, and with choruses, and save her alone, he hath none, son or daughter.";
dby[34] = "And Jephthah came to Mizpah to his house, and behold, his daughter came out to meet him with tambours and with dances; and she was an only child: besides her he had neither son nor daughter.";
web[34] = "And Jephthah came to Mizpeh to his house, and behold, his daughter came out to meet him with timbrels and with dances: and she [was his] only child; beside her he had neither son nor daughter.";
hnv[34] = "Yiftach came to Mitzpah to his house; and, behold, his daughter came out to meet him with timbrels and with dances: and she was his only child; besides her he had neither son nor daughter.";
vul[34] = "revertenti autem Iepthae in Maspha domum suam occurrit unigenita filia cum tympanis et choris non enim habebat alios liberos";
kjv[35] = "And it came to pass, when he saw her, that he rent his clothes, and said, Alas, my daughter! thou hast brought me very low, and thou art one of them that trouble me: for I have opened my mouth unto the LORD, and I cannot go back.";
rsv[35] = "And when he saw her, he rent his clothes, and said, &quot;Alas, my daughter! you have brought me very low, and you have become the cause of great trouble to me; for I have opened my mouth to the LORD, and I cannot take back my vow.&quot;";
asv[35] = "And it came to pass, when he saw her, that he rent his clothes, and said, Alas, my daughter! thou hast brought me very low, and thou art one of them that trouble me; for I have opened my mouth unto Jehovah, and I cannot go back.";
