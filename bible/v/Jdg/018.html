csb[1] = "In those days, there was no king in Israel, and the Danite tribe was looking for territory to occupy. Up to that time no territory had been captured by them among the tribes of Israel.";
csb[2] = "So the Danites sent out five brave men from all their clans, from Zorah and Eshtaol, to scout out the land and explore it. They told them, &quot;Go and explore the land.&quot; They came to the hill country of Ephraim as far as the home of Micah and spent the night there.";
csb[3] = "While they were near Micah\'s home, they recognized the accent of the young Levite. So they went over to him and asked, &quot;Who brought you here? What are you doing in this place? What is keeping you here? &quot;";
csb[4] = "He told them, &quot;This is what Micah has done for me: He has hired me, and I became his priest.&quot;";
csb[5] = "Then they said to him, &quot;Please inquire of God for us to determine if we will have a successful journey.&quot;";
csb[6] = "The priest told them, &quot;Go in peace. The LORD is watching over the journey you are going on.&quot;";
csb[7] = "The five men left and came to Laish. They saw that the people who were there were living securely, in the same way as the Sidonians, quiet and unsuspecting. There was nothing lacking in the land and no oppressive ruler. They were far from the Sidonians, having no alliance with anyone.";
csb[8] = "When the men went back to their relatives at Zorah and Eshtaol, their relatives asked them, &quot;What did you find out? &quot;";
csb[9] = "They answered, &quot;Come on, let\'s attack them, for we have seen the land, and it is very good. Why wait? Don\'t hesitate to go and invade and take possession of the land!";
csb[10] = "&quot;When you get there, you will come to an unsuspecting people and a spacious land, for God has handed it over to you. It is a place where nothing on earth is lacking.&quot;";
csb[11] = "Six hundred Danites departed from Zorah and Eshtaol armed with weapons of war.";
csb[12] = "They went up and camped at Kiriath-jearim in Judah. This is why the place is still called the Camp of Dan today; it is west of Kiriath-jearim.";
csb[13] = "From there they traveled to the hill country of Ephraim and arrived at Micah\'s house.";
csb[14] = "The five men who had gone to scout out the land of Laish told their brothers, &quot;Did you know that there are an ephod, household gods, and a carved image and a silver idol in these houses? Now think about what you should do.&quot;";
csb[15] = "So they detoured there and went to the house of the young Levite at the home of Micah and greeted him.";
csb[16] = "The six hundred Danite men were standing by the entrance of the city gate, armed with their weapons of war.";
csb[17] = "Then the five men who had gone to scout out the land went in and took the carved image, the ephod, the household idols, and the silver idol, while the priest was standing by the entrance of the city gate with the six hundred men armed with weapons of war.";
csb[18] = "When they entered Micah\'s house and took the carved image, the ephod, the household idols, and the silver idol, the priest said to them, &quot;What are you doing? &quot;";
csb[19] = "They told him, &quot;Be quiet. Keep your mouth shut. Come with us and be a father and a priest to us. Is it better for you to be a priest for the house of one person or for you to be a priest for a tribe and family in Israel? &quot;";
csb[20] = "So the priest was pleased and took his ephod, household idols, and carved image, and went with the people.";
csb[21] = "They prepared to leave, putting their dependents, livestock, and possessions in front of them.";
csb[22] = "After they were some distance from Micah\'s house, the men who were in the houses near it were mustered and caught up with the Danites.";
csb[23] = "They called to the Danites, who turned to face them, and said to Micah, &quot;What\'s the matter with you that you mustered the men? &quot;";
csb[24] = "He said, &quot;You took the gods I had made and the priest, and went away. What do I have left? How can you say to me, \'What\'s the matter with you? \' &quot;";
csb[25] = "The Danites said to him, &quot;Don\'t raise your voice against us, or angry men will attack you, and you and your family will lose your lives.&quot;";
csb[26] = "The Danites went on their way, and Micah turned to go back home, because he saw that they were stronger than he was.";
csb[27] = "After they had taken the gods Micah had made and the priest that belonged to him, they went to Laish, to a quiet and unsuspecting people. They killed them with their swords and burned the city.";
csb[28] = "There was no one to rescue them because it was far from Sidon and they had no alliance with anyone. It was in a valley that belonged to Beth-rehob. They rebuilt the city and lived in it.";
csb[29] = "They named the city Dan, after the name of their ancestor Dan, who was born to Israel. The city was formerly named Laish.";
csb[30] = "The Danites set up the carved image for themselves. Jonathan son of Gershom, son of Moses, and his sons were priests for the Danite tribe until the time of the exile from the land.";
csb[31] = "So they set up for themselves Micah\'s carved image that he had made, and it was there as long as the house of God was in Shiloh.";
kjv[1] = "In those days [there was] no king in Israel: and in those days the tribe of the Danites sought them an inheritance to dwell in; for unto that day [all their] inheritance had not fallen unto them among the tribes of Israel.";
rsv[1] = "In those days there was no king in Israel. And in those days the tribe of the Danites was seeking for itself an inheritance to dwell in; for until then no inheritance among the tribes of Israel had fallen to them.";
asv[1] = "In those days there was no king in Israel: and in those days the tribe of the Danites sought them an inheritance to dwell in; for unto that day [their] inheritance had not fallen unto them among the tribes of Israel.";
yng[1] = "In those days there is no king in Israel, and in those days the tribe of the Danite is seeking for itself an inheritance to inhabit, for [that] hath not fallen to it unto that day in the midst of the tribes of Israel by inheritance.";
dby[1] = "In those days there was no king in Israel, and in those days the tribe of the Danites sought for themselves an inheritance to dwell in; for to that day [their lot] had not fallen to them for inheritance among the tribes of Israel.";
web[1] = "In those days [there was] no king in Israel: and in those days the tribe of the Danites sought for themselves an inheritance to dwell in; for to that day [all their] inheritance had not fallen to them among the tribes of Israel.";
hnv[1] = "In those days there was no king in Yisra\'el: and in those days the tribe of the Dani sought them an inheritance to dwell in; for to that day [their] inheritance had not fallen to them among the tribes of Yisra\'el.";
vul[1] = "in diebus illis non erat rex in Israhel et tribus Dan quaerebat possessionem sibi ut habitaret in ea usque ad illum enim diem inter ceteras tribus sortem non acceperat";
kjv[2] = "And the children of Dan sent of their family five men from their coasts, men of valour, from Zorah, and from Eshtaol, to spy out the land, and to search it; and they said unto them, Go, search the land: who when they came to mount Ephraim, to the house of Micah, they lodged there.";
rsv[2] = "So the Danites sent five able men from the whole number of their tribe, from Zorah and from Esh\'ta-ol, to spy out the land and to explore it; and they said to them, &quot;Go and explore the land.&quot; And they came to the hill country of E\'phraim, to the house of Micah, and lodged there.";
asv[2] = "And the children of Dan sent of their family five men from their whole number, men of valor, from Zorah, and from Eshtaol, to spy out the land, and to search it; and they said unto them, Go, search the land. And they came to the hill-country of Ephraim, unto the house of Micah, and lodged there.";
yng[2] = "And the sons of Dan send, out of their family, five men of them, men, sons of valour, from Zorah, and from Eshtaol, to traverse the land, and to search it, and they say unto them, `Go, search the land;\' and they come into the hill-country of Ephraim, unto the house of Micah, and lodge there.";
dby[2] = "And the children of Dan sent of their family five men of their whole number, men of valour, from Zoreah and from Eshtaol, to spy out the land, and to examine it; and they said to them, Go, examine the land. And they came to the hill-country of Ephraim, to the house of Micah, and lodged there.";
web[2] = "And the children of Dan sent of their family five men from their borders, men of valor, from Zorah, and from Eshtaol, to explore the land, and to search it; and they said to them, Go, search the land: who when they came to mount Ephraim, to the house of Micah, they lodged there.";
hnv[2] = "The children of Dan sent of their family five men from their whole number, men of valor, from Tzor`ah, and from Eshta\'ol, to spy out the land, and to search it; and they said to them, Go, search the land. They came to the hill-country of Efrayim, to the house of Mikhah, and lodged there.";
vul[2] = "miserunt igitur filii Dan stirpis et familiae suae quinque viros fortissimos de Saraa et Esthaol ut explorarent terram et diligenter inspicerent dixeruntque eis ite et considerate terram qui cum pergentes venissent in montem Ephraim et intrassent domum Micha requieverunt ibi";
kjv[3] = "When they [were] by the house of Micah, they knew the voice of the young man the Levite: and they turned in thither, and said unto him, Who brought thee hither? and what makest thou in this [place]? and what hast thou here?";
rsv[3] = "When they were by the house of Micah, they recognized the voice of the young Levite; and they turned aside and said to him, &quot;Who brought you here? What are you doing in this place? What is your business here?&quot;";
asv[3] = "When they were by the house of Micah, they knew the voice of the young man the Levite; and they turned aside thither, and said unto him, Who brought thee hither? and what doest thou in this place? and what hast thou here?";
yng[3] = "They [are] with the household of Micah, and they have discerned the voice of the young man, the Levite, and turn aside there, and say to him, `Who hath brought thee hither? and what art thou doing in this [place?] and what to thee here?\'";
dby[3] = "When they were by the house of Micah, they knew the voice of the young man, the Levite; and they turned in thither, and said to him, Who brought thee hither? and what doest thou in this [place]? and what hast thou here?";
web[3] = "When they [were] by the house of Micah, they knew the voice of the young man the Levite: and they turned in thither, and said to him, Who brought thee hither? and what makest thou in this [place]? and what hast thou here?";
hnv[3] = "When they were by the house of Mikhah, they knew the voice of the young man the Levite; and they turned aside there, and said to him, Who brought you here? and what do you in this place? and what have you here?";
vul[3] = "et agnoscentes vocem adulescentis Levitae utentesque illius diversorio dixerunt ad eum quis te huc adduxit quid hic agis quam ob causam huc venire voluisti";
kjv[4] = "And he said unto them, Thus and thus dealeth Micah with me, and hath hired me, and I am his priest.";
rsv[4] = "And he said to them, &quot;Thus and thus has Micah dealt with me: he has hired me, and I have become his priest.&quot;";
asv[4] = "And he said unto them, Thus and thus hath Micah dealt with me, and he hath hired me, and I am become his priest.";
yng[4] = "And he saith unto them, `Thus and thus hath Micah done to me; and he hireth me, and I am to him for a priest.\'";
dby[4] = "And he said to them, Thus and thus has Micah done to me; and he has hired me, and I am his priest.";
web[4] = "And he said to them, Thus and thus dealeth Micah with me, and hath hired me, and I am his priest.";
hnv[4] = "He said to them, Thus and thus has Mikhah dealt with me, and he has hired me, and I am become his Kohen.";
vul[4] = "qui respondit eis haec et haec praestitit mihi Michas et me mercede conduxit ut sim ei sacerdos";
kjv[5] = "And they said unto him, Ask counsel, we pray thee, of God, that we may know whether our way which we go shall be prosperous.";
rsv[5] = "And they said to him, &quot;Inquire of God, we pray thee, that we may know whether the journey on which we are setting out will succeed.&quot;";
asv[5] = "And they said unto him, Ask counsel, we pray thee, of God, that we may know whether our way which we go shall be prosperous.";
yng[5] = "And they say to him, `Ask, we pray thee, at God, and we know whether our way is prosperous on which we are going.\'";
dby[5] = "And they said to him, Inquire, we pray thee, of God, that we may know whether our way on which we go shall be prosperous.";
web[5] = "And they said to him, Ask counsel, we pray thee, of God, that we may know whether our way which we go shall be prosperous.";
hnv[5] = "They said to him, Ask counsel, we pray you, of God, that we may know whether our way which we go shall be prosperous.";
vul[5] = "rogaveruntque eum ut consuleret Dominum et scire possent an prospero itinere pergerent et res haberet effectum";
kjv[6] = "And the priest said unto them, Go in peace: before the LORD [is] your way wherein ye go.";
rsv[6] = "And the priest said to them, &quot;Go in peace. The journey on which you go is under the eye of the LORD.&quot;";
asv[6] = "And the priest said unto them, Go in peace: before Jehovah is your way wherein ye go.";
yng[6] = "And the priest saith to them, `Go in peace; over-against Jehovah [is] your way in which ye go.\'";
dby[6] = "And the priest said to them, Go in peace: before Jehovah is your way on which ye go.";
web[6] = "And the priest said to them, Go in peace: before the LORD [is] your way in which ye go.";
hnv[6] = "The Kohen said to them, Go in shalom: before the LORD is your way wherein you go.";
vul[6] = "qui respondit eis ite cum pace Dominus respicit viam vestram et iter quo pergitis";
kjv[7] = "Then the five men departed, and came to Laish, and saw the people that [were] therein, how they dwelt careless, after the manner of the Zidonians, quiet and secure; and [there was] no magistrate in the land, that might put [them] to shame in [any] thing; and they [were] far from the Zidonians, and had no business with [any] man.";
rsv[7] = "Then the five men departed, and came to La\'ish, and saw the people who were there, how they dwelt in security, after the manner of the Sido\'nians, quiet and unsuspecting, lacking nothing that is in the earth, and possessing wealth, and how they were far from the Sido\'nians and had no dealings with any one.";
asv[7] = "Then the five men departed, and came to Laish, and saw the people that were therein, how they dwelt in security, after the manner of the Sidonians, quiet and secure; for there was none in the land, possessing authority, that might put [them] to shame in anything, and they were far from the Sidonians, and had no dealings with any man.";
yng[7] = "And the five men go, and come in to Laish, and see the people which [is] in its midst, dwelling confidently, according to the custom of Zidonians, quiet and confident; and there is none putting to shame in the land in [any] thing, possessing restraint, and they [are] far off from the Zidonians, and have no word with [any] man.";
dby[7] = "And the five men departed, and came to Laish; and they saw the people that were therein, dwelling securely, after the manner of the Zidonians, quiet and secure; and no one was in the land who possessed authority, that might put [them] to shame in anything; and they were far from the Zidonians, and had nothing to do with [any] man.";
web[7] = "Then the five men departed, and came to Laish, and saw the people that [were] in it, how they dwelt careless, after the manner of the Zidonians, quiet and secure; and [there was] no magistrate in the land, that might put [them] to shame in [any] thing; and they [were] far from the Zidonians, and had no business with [any] man.";
hnv[7] = "Then the five men departed, and came to Layish, and saw the people who were therein, how they lived in security, after the manner of the Tzidonim, quiet and secure; for there was none in the land, possessing authority, that might put [them] to shame in anything, and they were far from the Tzidonim, and had no dealings with any man.";
vul[7] = "euntes itaque quinque viri venerunt Lais videruntque populum habitantem in ea absque ullo timore iuxta Sidoniorum consuetudinem securum et quietum nullo eis penitus resistente magnarumque opum et procul a Sidone atque a cunctis hominibus separatum";
kjv[8] = "And they came unto their brethren to Zorah and Eshtaol: and their brethren said unto them, What [say] ye?";
rsv[8] = "And when they came to their brethren at Zorah and Esh\'ta-ol, their brethren said to them, &quot;What do you report?&quot;";
asv[8] = "And they came unto their brethren to Zorah and Eshtaol: and their brethren said unto them, What [say] ye?";
yng[8] = "And they come in unto their brethren, at Zorah and Eshtaol, and their brethren say to them, `What -- ye?\'";
dby[8] = "-- And they came to their brethren at Zoreah and Eshtaol. And their brethren said to them, What [say] ye?";

hnv[8] = "They came to their brothers to Tzor`ah and Eshta\'ol: and their brothers said to them, What [say] you?";
vul[8] = "reversique ad fratres suos in Saraa et Esthaol et quid egissent sciscitantibus responderunt";
kjv[9] = "And they said, Arise, that we may go up against them: for we have seen the land, and, behold, it [is] very good: and [are] ye still? be not slothful to go, [and] to enter to possess the land.";
rsv[9] = "They said, &quot;Arise, and let us go up against them; for we have seen the land, and behold, it is very fertile. And will you do nothing? Do not be slow to go, and enter in and possess the land.";
asv[9] = "And they said, Arise, and let us go up against them; for we have seen the land, and, behold, it is very good: and are ye still? be not slothful to go and to enter in to possess the land.";
yng[9] = "And they say, `Rise, and we go up against them, for we have seen the land, and lo, very good; and ye are keeping silent! be not slothful to go -- to enter to possess the land.";
dby[9] = "And they said, Arise, and let us go up against them; for we have seen the land, and behold, it is very good; and ye are still! Be not slothful to go, to enter to take possession of the land.";
web[9] = "And they said, Arise, that we may go up against them: for we have seen the land, and behold, it [is] very good: and [are] ye still? be not slothful to go, [and] to enter to possess the land.";
hnv[9] = " They said, Arise, and let us go up against them; for we have seen the land, and, behold, it is very good: and are you still? don\'t be slothful to go and to enter in to possess the land.";
vul[9] = "surgite et ascendamus ad eos vidimus enim terram valde opulentam et uberem nolite neglegere nolite cessare eamus et possideamus eam nullus erit labor";
kjv[10] = "When ye go, ye shall come unto a people secure, and to a large land: for God hath given it into your hands; a place where [there is] no want of any thing that [is] in the earth.";
rsv[10] = "When you go, you will come to an unsuspecting people. The land is broad; yea, God has given it into your hands, a place where there is no lack of anything that is in the earth.&quot;";
asv[10] = "When ye go, ye shall come unto a people secure, and the land is large; for God hath given it into your hand, a place where there is no want of anything that is in the earth.";
yng[10] = "When ye go, ye come in unto a people confident, and the land [is] large on both hands, for God hath given it into your hand, a place where there is no lack of anything which [is] in the land.\'";
dby[10] = "When ye go in, ye shall come to a people secure, and the land is spacious in every direction; for God has given it into your hands; [it is] a place where there is no want of anything that is on the earth.";
web[10] = "When ye go, ye shall come to a people secure, and to a large land: for God hath given it into your hands; a place where [there] is no want of any thing that [is] on the earth.";
hnv[10] = "When you go, you shall come to a people secure, and the land is large; for God has given it into your hand, a place where there is no want of anything that is in the eretz.";
vul[10] = "intrabimus ad securos in regionem latissimam tradetque nobis Dominus locum in quo nullius rei est penuria eorum quae gignuntur in terra";

web[11] = "And there went from thence of the family of the Danites, out of Zorah and out of Eshtaol, six hundred men appointed with weapons of war.";

asv[12] = "And they went up, and encamped in Kiriath-jearim, in Judah: wherefore they called that place Mahaneh-dan, unto this day; behold, it is behind Kiriath-jearim.";
yng[12] = "And they go up and encamp in Kirjath-Jearim, in Judah, therefore they have called that place, `Camp of Dan,\' till this day; lo, behind Kirjath-Jearim.";
dby[12] = "And they went up and encamped in Kirjath-jearim, in Judah; therefore they call that place Mahaneh-Dan to this day: behold, it is behind Kirjath-jearim.";

asv[13] = "And they passed thence unto the hill-country of Ephraim, and came unto the house of Micah.";

kjv[14] = "Then answered the five men that went to spy out the country of Laish, and said unto their brethren, Do ye know that there is in these houses an ephod, and teraphim, and a graven image, and a molten image? now therefore consider what ye have to do.";
rsv[14] = "Then the five men who had gone to spy out the country of La\'ish said to their brethren, &quot;Do you know that in these houses there are an ephod, teraphim, a graven image, and a molten image? Now therefore consider what you will do.&quot;";
asv[14] = "Then answered the five men that went to spy out the country of Laish, and said unto their brethren, Do ye know that there is in these houses an ephod, and teraphim, and a graven image, and a molten image? now therefore consider what ye have to do.";
yng[14] = "And the five men, those going to traverse the land of Laish, answer and say unto their brethren, `Have ye known that there is in these houses an ephod, and teraphim, and graven image, and molten image? and now, know what ye do.\'";
dby[14] = "Then the five men that had gone to spy out the country of Laish spoke and said to their brethren, Do ye know that there is in these houses an ephod, and teraphim, and a graven image, and a molten image? And now ye know what to do.";
web[14] = "Then answered the five men that went to explore the country of Laish, and said to their brethren, Do ye know that there is in these houses an ephod, and teraphim, and a graven image, and a molten image? now therefore consider what ye have to do.";
hnv[14] = "Then the five men who went to spy out the country of Layish answered, and said to their brothers, Do you know that there is in these houses an efod, and terafim, and an engraved image, and a molten image? now therefore consider what you have to do.";
vul[14] = "dixerunt quinque viri qui prius missi fuerant ad considerandam terram Lais ceteris fratribus suis nostis quod in domibus istis sit ephod et therafin et sculptile atque conflatile videte quid vobis placeat";
kjv[15] = "And they turned thitherward, and came to the house of the young man the Levite, [even] unto the house of Micah, and saluted him.";
rsv[15] = "And they turned aside thither, and came to the house of the young Levite, at the home of Micah, and asked him of his welfare.";
asv[15] = "And they turned aside thither, and came to the house of the young man the Levite, even unto the house of Micah, and asked him of his welfare.";
yng[15] = "And they turn aside thither, and come in unto the house of the young man the Levite, the house of Micah, and ask of him of welfare, --";
dby[15] = "And they turned thither, and came to the house of the young man the Levite, the house of Micah, and inquired after his welfare.";
web[15] = "And they turned thitherward, and came to the house of the young man the Levite, [even] to the house of Micah, and saluted him.";
hnv[15] = "They turned aside there, and came to the house of the young man the Levite, even to the house of Mikhah, and asked him of his welfare.";
vul[15] = "et cum paululum declinassent ingressi sunt domum adulescentis Levitae qui erat in domo Micha salutaveruntque eum verbis pacificis";
kjv[16] = "And the six hundred men appointed with their weapons of war, which [were] of the children of Dan, stood by the entering of the gate.";
rsv[16] = "Now the six hundred men of the Danites, armed with their weapons of war, stood by the entrance of the gate;";
asv[16] = "And the six hundred men girt with their weapons of war, who were of the children of Dan, stood by the entrance of the gate.";
yng[16] = "(and the six hundred men girded with their weapons of war, who [are] of the sons of Dan, are standing at the opening of the gate), --";
dby[16] = "And the six hundred men of the children of Dan, girded with their weapons of war, stood at the entrance of the gate.";
web[16] = "And the six hundred men appointed with their weapons of war, who [were] of the children of Dan, stood by the entrance of the gate.";
hnv[16] = "The six hundred men girt with their weapons of war, who were of the children of Dan, stood by the entrance of the gate.";
vul[16] = "sescenti autem viri ita ut erant armati stabant ante ostium";
kjv[17] = "And the five men that went to spy out the land went up, [and] came in thither, [and] took the graven image, and the ephod, and the teraphim, and the molten image: and the priest stood in the entering of the gate with the six hundred men [that were] appointed with weapons of war.";
rsv[17] = "and the five men who had gone to spy out the land went up, and entered and took the graven image, the ephod, the teraphim, and the molten image, while the priest stood by the entrance of the gate with the six hundred men armed with weapons of war.";
asv[17] = "And the five men that went to spy out the land went up, and came in thither, and took the graven image, and the ephod, and the teraphim, and the molten image: and the priest stood by the entrance of the gate with the six hundred men girt with weapons of war.";
yng[17] = "yea, the five men, those going to traverse the land, go up -- they have come in thither -- they have taken the graven image, and the ephod, and the teraphim, and the molten image -- and the priest is standing at the opening of the gate, and the six hundred men who are girded with weapons of war --";
dby[17] = "And the five men that had gone to spy out the land went up, entered in thither, [and] took the graven image, and the ephod, and the teraphim, and the molten image; and the priest stood at the entrance of the gate with the six hundred men that were girded with weapons of war.";
web[17] = "And the five men that went to explore the land went up, [and] came in thither, [and] took the graven image, and the ephod, and the teraphim, and the molten image: and the priest stood in the entrance of the gate with the six hundred men [that were] appointed with weapons of war.";
hnv[17] = "The five men who went to spy out the land went up, and came in there, and took the engraved image, and the efod, and the terafim, and the molten image: and the Kohen stood by the entrance of the gate with the six hundred men girt with weapons of war.";
vul[17] = "at illi qui ingressi fuerant domum iuvenis sculptile et ephod et therafin atque conflatile tollere nitebantur et sacerdos stabat ante ostium sescentis viris fortissimis haut procul expectantibus";
kjv[18] = "And these went into Micah\'s house, and fetched the carved image, the ephod, and the teraphim, and the molten image. Then said the priest unto them, What do ye?";
rsv[18] = "And when these went into Micah\'s house and took the graven image, the ephod, the teraphim, and the molten image, the priest said to them, &quot;What are you doing?&quot;";
asv[18] = "And when these went into Micah\'s house, and fetched the graven image, the ephod, and the teraphim, and the molten image, the priest said unto them, What do ye?";
yng[18] = "yea, these have entered the house of Micah, and take the graven image, the ephod, and the teraphim, and the molten image; and the priest saith unto them, `What are ye doing?\'";
dby[18] = "And these came into Micah\'s house, and took the carved image, the ephod, and the teraphim, and the molten image. And the priest said to them, What do ye?";
web[18] = "And these went into Micah\'s house, and brought the carved image, the ephod, and the teraphim, and the molten image. Then said the priest to them, What do ye?";
hnv[18] = "When these went into Mikhah\'s house, and fetched the engraved image, the efod, and the terafim, and the molten image, the Kohen said to them, What do you?";
vul[18] = "tulerunt igitur qui intraverant sculptile ephod et idola atque conflatile quibus dixit sacerdos quid facitis";
kjv[19] = "And they said unto him, Hold thy peace, lay thine hand upon thy mouth, and go with us, and be to us a father and a priest: [is it] better for thee to be a priest unto the house of one man, or that thou be a priest unto a tribe and a family in Israel?";
rsv[19] = "And they said to him, &quot;Keep quiet, put your hand upon your mouth, and come with us, and be to us a father and a priest. Is it better for you to be priest to the house of one man, or to be priest to a tribe and family in Israel?&quot;";
asv[19] = "And they said unto him, Hold thy peace, lay thy hand upon thy mouth, and go with us, and be to us a father and a priest: is it better for thee to be priest unto the house of one man, or to be priest unto a tribe and a family in Israel?";
yng[19] = "and they say to him, `Keep silent, lay thy hand on thy mouth, and go with us, and be to us for a father and for a priest: is it better thy being a priest to the house of one man, or thy being priest to a tribe and to a family in Israel?\'";
dby[19] = "And they said to him, Hold thy peace, lay thy hand upon thy mouth, and go with us, and be to us a father and a priest. Is it better for thee to be a priest for the house of one man, or to be priest for a tribe and a family in Israel?";
web[19] = "And they said to him, Hold thy peace, lay thy hand upon thy mouth, and go with us, and be to us a father and a priest: [Is it] better for thee to be a priest to the house of one man, or that thou shouldst be a priest to a tribe and a family in Israel?";
hnv[19] = "They said to him, Hold your shalom, lay your hand on your mouth, and go with us, and be to us a father and a Kohen: is it better for you to be Kohen to the house of one man, or to be Kohen to a tribe and a family in Yisra\'el?";
vul[19] = "cui responderunt tace et pone digitum super os tuum venique nobiscum ut habeamus te patrem et sacerdotem quid tibi melius est ut sis sacerdos in domo unius viri an in una tribu et familia in Israhel";
kjv[20] = "And the priest\'s heart was glad, and he took the ephod, and the teraphim, and the graven image, and went in the midst of the people.";
rsv[20] = "And the priest\'s heart was glad; he took the ephod, and the teraphim, and the graven image, and went in the midst of the people.";
asv[20] = "And the priest\'s heart was glad, and he took the ephod, and the teraphim, and the graven image, and went in the midst of the people.";
yng[20] = "And the heart of the priest is glad, and he taketh the ephod, and the teraphim, and the graven image, and goeth into the midst of the people,";
dby[20] = "Then the priest\'s heart was glad, and he took the ephod, and the teraphim, and the graven image, and went in the midst of the people.";
web[20] = "And the priest\'s heart was glad, and he took the ephod, and the teraphim, and the graven image, and went in the midst of the people.";
hnv[20] = "The Kohen\'s heart was glad, and he took the efod, and the terafim, and the engraved image, and went in the midst of the people.";
vul[20] = "quod cum audisset adquievit sermonibus eorum et tulit ephod et idola ac sculptile et cum eis profectus est";
kjv[21] = "So they turned and departed, and put the little ones and the cattle and the carriage before them.";
rsv[21] = "So they turned and departed, putting the little ones and the cattle and the goods in front of them.";
asv[21] = "So they turned and departed, and put the little ones and the cattle and the goods before them.";
yng[21] = "and they turn and go, and put the infants, and the cattle, and the baggage, before them.";
dby[21] = "And they turned and departed, and put the little ones and the cattle and the baggage before them.";
web[21] = "So they turned and departed, and put the little ones, and the cattle, and the furniture before them.";
hnv[21] = "So they turned and departed, and put the little ones and the cattle and the goods before them.";
vul[21] = "qui cum pergerent et ante se ire fecissent parvulos et iumenta et omne quod erat pretiosum";
kjv[22] = "[And] when they were a good way from the house of Micah, the men that [were] in the houses near to Micah\'s house were gathered together, and overtook the children of Dan.";
rsv[22] = "When they were a good way from the home of Micah, the men who were in the houses near Micah\'s house were called out, and they overtook the Danites.";
asv[22] = "When they were a good way from the house of Micah, the men that were in the houses near to Micah\'s house were gathered together, and overtook the children of Dan.";
yng[22] = "They have been far off from the house of Micah -- and the men who [are] in the houses which [are] near the house of Micah have been called together, and overtake the sons of Dan,";
dby[22] = "They were already far from the house of Micah, when the men that were in the houses near to Micah\'s house were gathered together, and overtook the children of Dan.";
web[22] = "[And] when they were a good way from the house of Micah, the men that [were] in the houses near to Micah\'s house were collected, and overtook the children of Dan.";
hnv[22] = "When they were a good way from the house of Mikhah, the men who were in the houses near to Mikhah\'s house were gathered together, and overtook the children of Dan.";
vul[22] = "iamque a domo Michae essent procul viri qui habitabant in aedibus Michae conclamantes secuti sunt";
kjv[23] = "And they cried unto the children of Dan. And they turned their faces, and said unto Micah, What aileth thee, that thou comest with such a company?";
rsv[23] = "And they shouted to the Danites, who turned round and said to Micah, &quot;What ails you that you come with such a company?&quot;";
asv[23] = "And they cried unto the children of Dan. And they turned their faces, and said unto Micah, What aileth thee, that thou comest with such a company?";
yng[23] = "and call unto the sons of Dan, and they turn round their faces, and say to Micah, `What -- to thee that thou hast been called together?\'";
dby[23] = "And they cried to the children of Dan. And they turned their faces, and said to Micah, What aileth thee, that thou comest with such a company?";
web[23] = "And they cried to the children of Dan. And they turned their faces, and said to Micah, What aileth thee, that thou comest with such a company?";
hnv[23] = "They cried to the children of Dan. They turned their faces, and said to Mikhah, What ails you, that you come with such a company?";
vul[23] = "et post tergum clamare coeperunt qui cum respexissent dixerunt ad Micham quid tibi vis cur clamas";
kjv[24] = "And he said, Ye have taken away my gods which I made, and the priest, and ye are gone away: and what have I more? and what [is] this [that] ye say unto me, What aileth thee?";
rsv[24] = "And he said, &quot;You take my gods which I made, and the priest, and go away, and what have I left? How then do you ask me, \'What ails you?\'&quot;";
asv[24] = "And he said, ye have taken away my gods which I made, and the priest, and are gone away, and what have I more? and how then say ye unto me, What aileth thee?";
yng[24] = "And he saith, `My gods which I made ye have taken, and the priest, and ye go; and what to me more? and what [is] this ye say unto me, What -- to thee!\'";
dby[24] = "And he said, Ye have taken away my gods which I made, and the priest, and ye are gone away; and what have I more? and what is this that ye say to me, What aileth thee?";
web[24] = "And he said, Ye have taken away my gods which I made, and the priest, and ye have gone away: and what have I more? and what [is] this [that] ye say to me, What aileth thee?";
hnv[24] = "He said, you have taken away my gods which I made, and the Kohen, and are gone away, and what have I more? and how then say you to me, What ails you?";
vul[24] = "qui respondit deos meos quos mihi feci tulistis et sacerdotem et omnia quae habeo et dicitis quid tibi est";
kjv[25] = "And the children of Dan said unto him, Let not thy voice be heard among us, lest angry fellows run upon thee, and thou lose thy life, with the lives of thy household.";
rsv[25] = "And the Danites said to him, &quot;Do not let your voice be heard among us, lest angry fellows fall upon you, and you lose your life with the lives of your household.&quot;";
asv[25] = "And the children of Dan said unto him, Let not thy voice be heard among us, lest angry fellows fall upon you, and thou lose thy life, with the lives of thy household.";
yng[25] = "And the sons of Dan say unto him, `Let not thy voice be heard with us, lest men bitter in soul fall upon you, and thou hast gathered thy life, and the life of thy household;\'";
dby[25] = "And the children of Dan said to him, Let not thy voice be heard among us, lest men of exasperated spirit run upon you, and thou lose thy life and the lives of thy household.";
web[25] = "And the children of Dan said to him, Let not thy voice be heard among us, lest angry fellows rush upon thee, and thou lose thy life, with the lives of thy household.";
hnv[25] = "The children of Dan said to him, &quot;Don\'t let your voice be heard among us, lest angry fellows fall on you, and you lose your life, with the lives of your household.&quot;";
vul[25] = "dixeruntque ei filii Dan cave ne ultra loquaris ad nos et veniant ad te viri animo concitati et ipse cum omni domo tua pereas";
kjv[26] = "And the children of Dan went their way: and when Micah saw that they [were] too strong for him, he turned and went back unto his house.";
rsv[26] = "Then the Danites went their way; and when Micah saw that they were too strong for him, he turned and went back to his home.";
asv[26] = "And the children of Dan went their way: and when Micah saw that they were too strong for him, he turned and went back unto his house.";
yng[26] = "and the sons of Dan go on their way, and Micah seeth that they are stronger than he, and turneth, and goeth back unto his house.";
dby[26] = "And the children of Dan went their way; and Micah saw that they were too strong for him, and he turned and went back to his house.";
web[26] = "And the children of Dan departed: and when Micah saw that they [were] too strong for him, he turned and went back to his house.";
hnv[26] = " The children of Dan went their way: and when Mikhah saw that they were too strong for him, he turned and went back to his house.";
vul[26] = "et sic coepto itinere perrexerunt videns autem Micha quod fortiores se essent reversus est in domum suam";
kjv[27] = "And they took [the things] which Micah had made, and the priest which he had, and came unto Laish, unto a people [that were] at quiet and secure: and they smote them with the edge of the sword, and burnt the city with fire.";
rsv[27] = "And taking what Micah had made, and the priest who belonged to him, the Danites came to La\'ish, to a people quiet and unsuspecting, and smote them with the edge of the sword, and burned the city with fire.";
asv[27] = "And they took that which Micah had made, and the priest whom he had, and came unto Laish, unto a people quiet and secure, and smote them with the edge of the sword; and they burnt the city with fire.";
yng[27] = "And they have taken that which Micah had made, and the priest whom he had, and come in against Laish, against a people quiet and confident, and smite them by the mouth of the sword, and the city have burnt with fire,";
dby[27] = "And they took that which Micah had made, and the priest that he had had, and came upon Laish, upon a people quiet and secure; and they smote them with the edge of the sword, and burned the city with fire.";
web[27] = "And they took [the things] which Micah had made, and the priest which he had, and came to Laish, to a people [that were] at quiet and secure: and they smote them with the edge of the sword, and burnt the city with fire.";
hnv[27] = "They took that which Mikhah had made, and the Kohen whom he had, and came to Layish, to a people quiet and secure, and struck them with the edge of the sword; and they burnt the city with fire.";
vul[27] = "sescenti autem viri tulerunt sacerdotem et quae supra diximus veneruntque in Lais ad populum quiescentem atque securum et percusserunt eos in ore gladii urbemque incendio tradiderunt";
kjv[28] = "And [there was] no deliverer, because it [was] far from Zidon, and they had no business with [any] man; and it was in the valley that [lieth] by Bethrehob. And they built a city, and dwelt therein.";
rsv[28] = "And there was no deliverer because it was far from Sidon, and they had no dealings with any one. It was in the valley which belongs to Beth-rehob. And they rebuilt the city, and dwelt in it.";
asv[28] = "And there was no deliverer, because it was far from Sidon, and they had no dealings with any man; and it was in the valley that lieth by Beth-rehob. And they built the city, and dwelt therein.";
yng[28] = "and there is no deliverer, for it [is] far off from Zidon, and they have no word with [any] man, and it [is] in the valley which [is] by Beth-Rehob; and they build the city, and dwell in it,";
dby[28] = "And there was no deliverer, for it was far from Zidon, and they had nothing to do with [any] man; and it [lay] in the valley that is by Beth-rehob. And they built the city and dwelt therein.";
web[28] = "And [there was] no deliverer, because it [was] far from Zidon, and they had no business with [any] man; and it was in the valley that [lieth] by Beth-rehob. And they built a city and dwelt in it.";
hnv[28] = "There was no deliverer, because it was far from Tzidon, and they had no dealings with any man; and it was in the valley that lies by Beit-Rechov. They built the city, and lived therein.";
vul[28] = "nullo penitus ferente praesidium eo quod procul habitarent a Sidone et cum nullo hominum haberent quicquam societatis ac negotii erat autem civitas sita in regione Roob quam rursum extruentes habitaverunt in ea";
kjv[29] = "And they called the name of the city Dan, after the name of Dan their father, who was born unto Israel: howbeit the name of the city [was] Laish at the first.";
rsv[29] = "And they named the city Dan, after the name of Dan their ancestor, who was born to Israel; but the name of the city was La\'ish at the first.";
asv[29] = "And they called the name of the city Dan, after the name of Dan their father, who was born unto Israel: howbeit the name of the city was Laish at the first.";
yng[29] = "and call the name of the city Dan, by the name of Dan their father, who was born to Israel; and yet Laish [is] the name of the city at the first.";
dby[29] = "And they called the name of the city Dan, after the name of Dan their father, who was born to Israel; howbeit Laish was the name of the city at the first.";
web[29] = "And they called the name of the city Dan, after the name of Dan their father, who was born to Israel: but the name of the city [was] Laish at the first.";
hnv[29] = "They called the name of the city Dan, after the name of Dan their father, who was born to Yisra\'el: however the name of the city was Layish at the first.";
vul[29] = "vocato nomine civitatis Dan iuxta vocabulum patris sui quem genuerat Israhel quae prius Lais dicebatur";
kjv[30] = "And the children of Dan set up the graven image: and Jonathan, the son of Gershom, the son of Manasseh, he and his sons were priests to the tribe of Dan until the day of the captivity of the land.";
rsv[30] = "And the Danites set up the graven image for themselves; and Jonathan the son of Gershom, son of Moses, and his sons were priests to the tribe of the Danites until the day of the captivity of the land.";
asv[30] = "And the children of Dan set up for themselves the graven image; and Jonathan, the son of Gershom, the son of Moses, he and his sons were priests to the tribe of the Danites until the day of the captivity of the land.";
yng[30] = "And the sons of Dan raise up for themselves the graven image, and Jonathan son of Gershom, son of Manasseh, he and his sons have been priests to the tribe of the Danite, till the day of the removal of [the people] of the land.";
dby[30] = "And the children of Dan set up the graven image; and Jehonathan, the son of Gershom, the son of Moses; he and his sons were priests to the tribe of Dan until the day of the captivity of the land.";
web[30] = "And the children of Dan set up the graven image: and Jonathan, the son of Gershom, the son of Manasseh, he and his sons were priests to the tribe of Dan until the day of the captivity of the land.";
hnv[30] = "The children of Dan set up for themselves the engraved image: and Yonatan, the son of Gershom, the son of Moshe, he and his sons were Kohanim to the tribe of the Dani until the day of the captivity of the land.";
vul[30] = "posueruntque sibi sculptile et Ionathan filium Gersan filii Mosi ac filios eius sacerdotes in tribu Dan usque ad diem captivitatis suae";
kjv[31] = "And they set them up Micah\'s graven image, which he made, all the time that the house of God was in Shiloh.";
rsv[31] = "So they set up Micah\'s graven image which he made, as long as the house of God was at Shiloh.";
asv[31] = "So they set them up Micah\'s graven image which he made, all the time that the house of God was in Shiloh.";
yng[31] = "And they appoint for them the graven image of Micah, which he had made, all the days of the house of God being in Shiloh.";
dby[31] = "And they set up for themselves Micah\'s graven image, which he had made, all the time that the house of God was in Shiloh.";
web[31] = "And they set up for themselves Micah\'s graven image which he made, all the time that the house of God was in Shiloh.";
hnv[31] = "So they set them up Mikhah\'s engraved image which he made, all the time that the house of God was in Shiloh.";
vul[31] = "mansitque apud eos idolum Michae omni tempore quo fuit domus Dei in Silo in diebus illis non erat rex in Israhel";
