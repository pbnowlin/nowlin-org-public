csb[1] = "Samson went to Gaza, where he saw a prostitute and went to bed with her.";
csb[2] = "When the Gazites heard that Samson was there, they surrounded the place and waited in ambush for him all that night at the city gate. They kept quiet all night, saying, &quot;Let\'s wait until dawn; then we will kill him.&quot;";
csb[3] = "But Samson stayed in bed only until midnight. Then he got up, took hold of the doors of the city gate along with the two gateposts, and pulled them out, bar and all. He put them on his shoulders and took them to the top of the mountain overlooking Hebron.";
csb[4] = "Some time later, he fell in love with a woman named Delilah, who lived in the Sorek Valley.";
csb[5] = "The Philistine leaders went to her and said, &quot;Persuade him to tell you where his great strength comes from, so we can overpower him, tie him up, and make him helpless. Each of us will then give you 1,100 pieces of silver.&quot;";
csb[6] = "So Delilah said to Samson, &quot;Please tell me, where does your great strength come from? How could someone tie you up and make you helpless? &quot;";
csb[7] = "Samson told her, &quot;If they tie me up with seven fresh bowstrings that have not been dried, I will become weak and be like any other man.&quot;";
csb[8] = "The Philistine leaders brought her seven fresh bowstrings that had not been dried, and she tied him up with them.";
csb[9] = "While the men in ambush were waiting in her room, she called out to him, &quot;Samson, the Philistines are here! &quot; But he snapped the bowstrings as a strand of yarn snaps when it touches fire. The secret of his strength remained unknown.";
csb[10] = "Then Delilah said to Samson, &quot;You have mocked me and told me lies! Won\'t you please tell me how you can be tied up? &quot;";
csb[11] = "He told her, &quot;If they tie me up with new ropes that have never been used, I will become weak and be like any other man.&quot;";
csb[12] = "Delilah took new ropes, tied him up with them, and shouted, &quot;Samson, the Philistines are here! &quot; But while the men in ambush were waiting in her room, he snapped the ropes off his arms like a thread.";
csb[13] = "Then Delilah said to Samson, &quot;You have mocked me all along and told me lies! Tell me how you can be tied up.&quot; He told her, &quot;If you weave the seven braids on my head into the fabric on a loom -- &quot;";
csb[14] = "She fastened the braids with a pin and called to him, &quot;Samson, the Philistines are here! &quot; He awoke from his sleep and pulled out the pin, with the loom and the web.";
csb[15] = "&quot;How can you say, \'I love you,\' &quot; she told him, &quot;when your heart is not with me? This is the third time you have mocked me and not told me what makes your strength so great! &quot;";
csb[16] = "Because she nagged him day after day and pleaded with him until she wore him out,";
csb[17] = "he told her the whole truth and said to her, &quot;My hair has never been cut, because I am a Nazirite to God from birth. If I am shaved, my strength will leave me, and I will become weak and be like any other man.&quot;";
csb[18] = "When Delilah realized that he had told her the whole truth, she sent this message to the Philistine leaders: &quot;Come one more time, for he has told me the whole truth.&quot; The Philistine leaders came to her and brought the silver with them.";
csb[19] = "Then she let him fall asleep on her lap and called a man to shave off the seven braids on his head. In this way, she made him helpless, and his strength left him.";
csb[20] = "Then she cried, &quot;Samson, the Philistines are here! &quot; When he awoke from his sleep, he said, &quot;I will escape as I did before and shake myself free.&quot; But he did not know that the LORD had left him.";
csb[21] = "The Philistines seized him and gouged out his eyes. They brought him down to Gaza and bound him with bronze shackles, and he was forced to grind grain in the prison.";
csb[22] = "But his hair began to grow back after it had been shaved.";
csb[23] = "Now the Philistine leaders gathered together to offer a great sacrifice to their god Dagon. They rejoiced and said: Our god has handed over our enemy Samson to us.";
csb[24] = "When the people saw him, they praised their god and said: Our god has handed over to us our enemy who destroyed our land and who multiplied our dead.";
csb[25] = "When they were in good spirits, they said, &quot;Bring Samson here to entertain us.&quot; So they brought Samson from prison, and he entertained them. They had him stand between the pillars.";
csb[26] = "Samson said to the young man who was leading him by the hand, &quot;Lead me where I can feel the pillars supporting the temple, so I can lean against them.&quot;";
csb[27] = "The temple was full of men and women; all the leaders of the Philistines were there, and about three thousand men and women were on the roof watching Samson entertain them.";
csb[28] = "He called out to the LORD: &quot;Lord GOD, please remember me. Strengthen me, God, just once more. With one act of vengeance, let me pay back the Philistines for my two eyes.&quot;";
csb[29] = "Samson took hold of the two middle pillars supporting the temple and leaned against them, one on his right hand and the other on his left.";
csb[30] = "Samson said, &quot;Let me die with the Philistines.&quot; He pushed with all his might, and the temple fell on the leaders and all the people in it. And those he killed at his death were more than those he had killed in his life.";
csb[31] = "Then his brothers and all his father\'s family came down, carried him back, and buried him between Zorah and Eshtaol in the tomb of his father Manoah. So he judged Israel twenty years.";
kjv[1] = "Then went Samson to Gaza, and saw there an harlot, and went in unto her.";
rsv[1] = "Samson went to Gaza, and there he saw a harlot, and he went in to her.";
asv[1] = "And Samson went to Gaza, and saw there a harlot, and went in unto her.";
yng[1] = "And Samson goeth to Gaza, and seeth there a woman, a harlot, and goeth in unto her;";
dby[1] = "And Samson went to Gazah, and saw there a harlot, and went in to her.";
web[1] = "Then went Samson to Gaza, and saw there a harlot, and went in to her.";
hnv[1] = "Shimshon went to `Aza, and saw there a prostitute, and went in to her.";
vul[1] = "abiit quoque in Gazam et vidit ibi meretricem mulierem ingressusque est ad eam";
kjv[2] = "[And it was told] the Gazites, saying, Samson is come hither. And they compassed [him] in, and laid wait for him all night in the gate of the city, and were quiet all the night, saying, In the morning, when it is day, we shall kill him.";
rsv[2] = "The Gazites were told, &quot;Samson has come here,&quot; and they surrounded the place and lay in wait for him all night at the gate of the city. They kept quiet all night, saying, &quot;Let us wait till the light of the morning; then we will kill him.&quot;";
asv[2] = "[And it was told] the Gazites, saying, Samson is come hither. And they compassed him in, and laid wait for him all night in the gate of the city, and were quiet all the night, saying, [Let be] till morning light, then we will kill him.";
yng[2] = "[it is told] to the Gazathites, saying, `Samson hath come in hither;\' and they go round and lay wait for him all the night at the gate of the city, and keep themselves silent all the night, saying, `Till the light of the morning -- then we have slain him.\'";
dby[2] = "[And it was told] the Gazathites, saying, Samson is come hither. And they surrounded [him], and laid wait for him all night at the gate of the city, and were quiet all the night, saying, In the morning light we will kill him.";
web[2] = "[And it was told] the Gazites, saying, Samson is come hither. And they encompassed [him], and laid wait for him all night in the gate of the city, and were quiet all the night, saying, In the morning when it is day we shall kill him.";
hnv[2] = "[It was told] the `Azati, saying, Shimshon is come here. They compassed him in, and laid wait for him all night in the gate of the city, and were quiet all the night, saying, [Let be] until morning light, then we will kill him.";
vul[2] = "quod cum audissent Philisthim et percrebruisset apud eos intrasse urbem Samson circumdederunt eum positis in porta civitatis custodibus et ibi tota nocte cum silentio praestolantes ut facto mane exeuntem occiderent";
kjv[3] = "And Samson lay till midnight, and arose at midnight, and took the doors of the gate of the city, and the two posts, and went away with them, bar and all, and put [them] upon his shoulders, and carried them up to the top of an hill that [is] before Hebron.";
rsv[3] = "But Samson lay till midnight, and at midnight he arose and took hold of the doors of the gate of the city and the two posts, and pulled them up, bar and all, and put them on his shoulders and carried them to the top of the hill that is before Hebron.";
asv[3] = "And Samson lay till midnight, and arose at midnight, and laid hold of the doors of the gate of the city, and the two posts, and plucked them up, bar and all, and put them upon his shoulders, and carried them up to the top of the mountain that is before Hebron.";
yng[3] = "And Samson lieth down till the middle of the night, and riseth in the middle of the night, and layeth hold on the doors of the gate of the city, and on the two side posts, and removeth them with the bar, and putteth on his shoulders, and taketh them up unto the top of the hill, which [is] on the front of Hebron.";
dby[3] = "And Samson lay till midnight; and he arose at midnight, and seized the doors of the gate of the city, and the two posts, and tore them up with the bar, and put [them] upon his shoulders, and carried them up to the top of the mountain that is before Hebron.";
web[3] = "And Samson lay till midnight, and arose at midnight, and took the doors of the gate of the city, and the two posts, and went away with them, bar and all, and put [them] upon his shoulders, and carried them up to the top of a hill that [is] before Hebron.";
hnv[3] = "Shimshon lay until midnight, and arose at midnight, and laid hold of the doors of the gate of the city, and the two posts, and plucked them up, bar and all, and put them on his shoulders, and carried them up to the top of the mountain that is before Hevron.";
vul[3] = "dormivit autem Samson usque ad noctis medium et inde consurgens adprehendit ambas portae fores cum postibus suis et sera inpositasque umeris portavit ad verticem montis qui respicit Hebron";
kjv[4] = "And it came to pass afterward, that he loved a woman in the valley of Sorek, whose name [was] Delilah.";
rsv[4] = "After this he loved a woman in the valley of Sorek, whose name was Deli\'lah.";
asv[4] = "And it came to pass afterward, that he loved a woman in the valley of Sorek, whose name was Delilah.";
yng[4] = "And it cometh to pass afterwards that he loveth a woman in the valley of Sorek, and her name [is] Delilah,";
dby[4] = "And it came to pass afterwards that he loved a woman in the valley of Sorek, whose name was Delilah.";
web[4] = "And it came to pass afterward, that he loved a woman in the valley of Sorek, whose name [was] Delilah.";
hnv[4] = "It came to pass afterward, that he loved a woman in the valley of Sorek, whose name was Delilah.";
vul[4] = "post haec amavit mulierem quae habitabat in valle Sorech et vocabatur Dalila";
kjv[5] = "And the lords of the Philistines came up unto her, and said unto her, Entice him, and see wherein his great strength [lieth], and by what [means] we may prevail against him, that we may bind him to afflict him: and we will give thee every one of us eleven hundred [pieces] of silver.";
rsv[5] = "And the lords of the Philistines came to her and said to her, &quot;Entice him, and see wherein his great strength lies, and by what means we may overpower him, that we may bind him to subdue him; and we will each give you eleven hundred pieces of silver.&quot;";
asv[5] = "And the lords of the Philistines came up unto her, and said unto her, Entice him, and see wherein his great strength lieth, and by what means we may prevail against him, that we may bind him to afflict him: and we will give thee every one of us eleven hundred [pieces] of silver.";
yng[5] = "and the princes of the Philistines come up unto her, and say to her, `Entice him, and see wherein his great power [is], and wherein we are able for him -- and we have bound him to afflict him, and we -- we give to thee, each one, eleven hundred silverlings.\'";
dby[5] = "And the lords of the Philistines came up to her, and said to her, Persuade him, and see in what his great strength is, and with what we may prevail against him, that we may bind him to overpower him; and we will each give thee eleven hundred silver-pieces.";
web[5] = "And the lords of the Philistines came to her, and said to her, Entice him, and see in what his great strength [lieth], and by what [means] we may prevail against him, that we may bind him to afflict him: and we will give thee every one of us eleven hundred [pieces] of silver.";
hnv[5] = " The lords of the Pelishtim came up to her, and said to her, Entice him, and see in which his great strength lies, and by what means we may prevail against him, that we may bind him to afflict him: and we will each give you of us eleven hundred [pieces] of silver.";
vul[5] = "veneruntque ad eam principes Philisthinorum atque dixerunt decipe eum et disce ab illo in quo tantam habeat fortitudinem et quomodo eum superare valeamus et vinctum adfligere quod si feceris dabimus tibi singuli mille centum argenteos";
kjv[6] = "And Delilah said to Samson, Tell me, I pray thee, wherein thy great strength [lieth], and wherewith thou mightest be bound to afflict thee.";
rsv[6] = "And Deli\'lah said to Samson, &quot;Please tell me wherein your great strength lies, and how you might be bound, that one could subdue you.&quot;";
asv[6] = "And Delilah said to Samson, Tell me, I pray thee, wherein thy great strength lieth, and wherewith thou mightest be bound to afflict thee.";
yng[6] = "And Delilah saith unto Samson, `Declare, I pray thee, to me, wherein thy great power [is], and wherewith thou art bound, to afflict thee.\'";
dby[6] = "Then Delilah said to Samson, Tell me, I pray thee, in what is thy great strength, and with what thou mightest be bound to overpower thee.";
web[6] = "And Delilah said to Samson, Tell me, I pray thee, in what thy great strength [lieth], and with what thou mayest be bound to afflict thee.";
hnv[6] = "Delilah said to Shimshon, Tell me, Please, in which your great strength lies, and with which you might be bound to afflict you.";
vul[6] = "locuta est ergo Dalila ad Samson dic mihi obsecro in quo sit tua maxima fortitudo et quid sit quo ligatus erumpere nequeas";
kjv[7] = "And Samson said unto her, If they bind me with seven green withs that were never dried, then shall I be weak, and be as another man.";
rsv[7] = "And Samson said to her, &quot;If they bind me with seven fresh bowstrings which have not been dried, then I shall become weak, and be like any other man.&quot;";
asv[7] = "And Samson said unto her, If they bind me with seven green withes that were never dried, then shall I become weak, and be as another man.";
yng[7] = "And Samson saith unto her, `If they bind me with seven green withs which have not been dried, then I have been weak, and have been as one of the human race.\'";
dby[7] = "And Samson said to her, If they should bind me with seven fresh cords which have not been dried, then should I be weak, and be as another man.";
web[7] = "And Samson said to her, If they bind me with seven green withs, that were never dried, then shall I be weak, and be as another man.";
hnv[7] = "Shimshon said to her, If they bind me with seven green cords that were never dried, then shall I become weak, and be as another man.";
vul[7] = "cui respondit Samson si septem nervicis funibus necdum siccis et adhuc humentibus ligatus fuero infirmus ero ut ceteri homines";
kjv[8] = "Then the lords of the Philistines brought up to her seven green withs which had not been dried, and she bound him with them.";
rsv[8] = "Then the lords of the Philistines brought her seven fresh bowstrings which had not been dried, and she bound him with them.";
asv[8] = "Then the lords of the Philistines brought up to her seven green withes which had not been dried, and she bound him with them.";
yng[8] = "And the princes of the Philistines bring up to her seven green withs which have not been dried, and she bindeth him with them.";
dby[8] = "Then the lords of the Philistines brought up to her seven fresh cords which had not been dried, and she bound him with them.";
web[8] = "Then the lords of the Philistines brought to her seven green withs, which had not been dried, and she bound him with them.";
hnv[8] = "Then the lords of the Pelishtim brought up to her seven green cords which had not been dried, and she bound him with them.";
vul[8] = "adtuleruntque ad eam satrapae Philisthinorum septem funes ut dixerat quibus vinxit eum";
kjv[9] = "Now [there were] men lying in wait, abiding with her in the chamber. And she said unto him, The Philistines [be] upon thee, Samson. And he brake the withs, as a thread of tow is broken when it toucheth the fire. So his strength was not known.";
rsv[9] = "Now she had men lying in wait in an inner chamber. And she said to him, &quot;The Philistines are upon you, Samson!&quot; But he snapped the bowstrings, as a string of tow snaps when it touches the fire. So the secret of his strength was not known.";
asv[9] = "Now she had liers-in-wait abiding in the inner chamber. And she said unto him, The Philistines are upon thee, Samson. And he brake the withes, as a string of tow is broken when it toucheth the fire. So his strength was not known.";
yng[9] = "And the ambush is abiding with her in an inner chamber, and she saith unto him, `Philistines [are] upon thee, Samson;\' and he breaketh the withs as a thread of tow is broken in its smelling fire, and his power hath not been known.";
dby[9] = "Now she had liers in wait abiding in the chamber; and she said to him, The Philistines are upon thee, Samson! And he broke the cords, as a thread of tow is broken when it touches the fire; and his strength was not known.";
web[9] = "(Now [there were] men lying in wait, abiding with her in the chamber.) And she said to him, The Philistines [are] upon thee, Samson. And he broke the withs as a thread of tow is broken when it toucheth the fire. So his strength was not known.";
hnv[9] = "Now she had liers-in-wait abiding in the inner chamber. She said to him, The Pelishtim are on you, Shimshon. He broke the cords, as a string of tow is broken when it touches the fire. So his strength was not known.";
vul[9] = "latentibus apud se insidiis et in cubiculo finem rei expectantibus clamavitque ad eum Philisthim super te Samson qui rupit vincula quomodo si rumpat quis filum de stuppae tortum putamine cum odorem ignis acceperit et non est cognitum in quo esset fortitudo eius";
kjv[10] = "And Delilah said unto Samson, Behold, thou hast mocked me, and told me lies: now tell me, I pray thee, wherewith thou mightest be bound.";
rsv[10] = "And Deli\'lah said to Samson, &quot;Behold, you have mocked me, and told me lies; please tell me how you might be bound.&quot;";
asv[10] = "And Delilah said unto Samson, Behold, thou hast mocked me, and told me lies: now tell me, I pray thee, wherewith thou mightest be bound.";
yng[10] = "And Delilah saith unto Samson, `Lo, thou hast played upon me, and speakest unto me lies; now, declare, I pray thee, to me, wherewith thou art bound.\'";
dby[10] = "And Delilah said to Samson, Behold, thou hast mocked me and told me lies. Now tell me, I pray thee, with what thou mightest be bound.";
web[10] = "And Delilah said to Samson, Behold, thou hast mocked me, and told me lies: now tell me, I pray thee, with what thou mayest be bound.";
hnv[10] = "Delilah said to Shimshon, Behold, you have mocked me, and told me lies: now tell me, Please, with which you might be bound.";
vul[10] = "dixitque ad eum Dalila ecce inlusisti mihi et falsum locutus es saltim nunc indica quo ligari debeas";
kjv[11] = "And he said unto her, If they bind me fast with new ropes that never were occupied, then shall I be weak, and be as another man.";
rsv[11] = "And he said to her, &quot;If they bind me with new ropes that have not been used, then I shall become weak, and be like any other man.&quot;";
asv[11] = "And he said unto her, If they only bind me with new ropes wherewith no work hath been done, then shall I become weak, and be as another man.";
yng[11] = "And he saith unto her, `If they certainly bind me with thick bands, new ones, by which work hath not been done, then I have been weak, and have been as one of the human race.\'";
dby[11] = "And he said to her, If they should bind me fast with new ropes, with which no work has been done, then should I be weak, and be as another man.";
web[11] = "And he said to her, If they bind me fast with new ropes that never were used, then shall I be weak, and be as another man.";
hnv[11] = "He said to her, If they only bind me with new ropes with which no work has been done, then shall I become weak, and be as another man.";
vul[11] = "cui ille respondit si ligatus fuero novis funibus qui numquam fuerunt in opere infirmus ero et aliorum hominum similis";
kjv[12] = "Delilah therefore took new ropes, and bound him therewith, and said unto him, The Philistines [be] upon thee, Samson. And [there were] liers in wait abiding in the chamber. And he brake them from off his arms like a thread.";
rsv[12] = "So Deli\'lah took new ropes and bound him with them, and said to him, &quot;The Philistines are upon you, Samson!&quot; And the men lying in wait were in an inner chamber. But he snapped the ropes off his arms like a thread.";
asv[12] = "So Delilah took new ropes, and bound him therewith, and said unto him, The Philistines are upon thee, Samson. And the liers-in-wait were abiding in the inner chamber. And he brake them off his arms like a thread.";
yng[12] = "And Delilah taketh thick bands, new ones, and bindeth him with them, and saith unto him, `Philistines [are] upon thee, Samson;\' and the ambush is abiding in an inner chamber, and he breaketh them from off his arms as a thread.";
dby[12] = "And Delilah took new ropes, and bound him with them, and said to him, The Philistines are upon thee, Samson! Now there were liers in wait abiding in the chamber. And he broke them from off his arms like a thread.";
web[12] = "Delilah therefore took new ropes, and bound him with them, and said to him, The Philistines [are] upon thee, Samson. (And [there were] liers in wait abiding in the chamber.) And he broke them from off his arms like a thread.";
hnv[12] = "So Delilah took new ropes, and bound him therewith, and said to him, The Pelishtim are on you, Shimshon. The liers-in-wait were abiding in the inner chamber. He broke them off his arms like a thread.";
vul[12] = "quibus rursum Dalila vinxit eum et clamavit Philisthim super te Samson in cubiculo insidiis praeparatis qui ita rupit vincula quasi fila telarum";
kjv[13] = "And Delilah said unto Samson, Hitherto thou hast mocked me, and told me lies: tell me wherewith thou mightest be bound. And he said unto her, If thou weavest the seven locks of my head with the web.";
rsv[13] = "And Deli\'lah said to Samson, &quot;Until now you have mocked me, and told me lies; tell me how you might be bound.&quot; And he said to her, &quot;If you weave the seven locks of my head with the web and make it tight with the pin, then I shall become weak, and be like any other man.&quot;";
asv[13] = "And Delilah said unto Samson, Hitherto thou hast mocked me, and told me lies: tell me wherewith thou mightest be bound. And he said unto her, If thou weavest the seven locks of my head with the web.";
yng[13] = "And Delilah saith unto Samson, `Hitherto thou hast played upon me, and dost speak unto me lies; declare to me wherewith thou art bound.\' And he saith unto her, `If thou weavest the seven locks of my head with the web.\'";
dby[13] = "And Delilah said to Samson, Hitherto thou hast mocked me and told me lies. Tell me with what thou mightest be bound. And he said to her, If thou shouldest weave the seven locks of my head with the web.";
web[13] = "And Delilah said to Samson, hitherto thou hast mocked me, and told me lies: tell me with what thou mayest be bound. And he said to her, If thou weavest the seven locks of my head with the web.";
hnv[13] = "Delilah said to Shimshon, Hitherto you have mocked me, and told me lies: tell me with which you might be bound. He said to her, If you weave the seven locks of my head with the web.";
vul[13] = "dixitque Dalila rursum ad eum usquequo decipis me et falsum loqueris ostende quo vinciri debeas si inquit septem crines capitis mei cum licio plexueris et clavum his circumligatum terrae fixeris infirmus ero";
kjv[14] = "And she fastened [it] with the pin, and said unto him, The Philistines [be] upon thee, Samson. And he awaked out of his sleep, and went away with the pin of the beam, and with the web.";
rsv[14] = "So while he slept, Deli\'lah took the seven locks of his head and wove them into the web. And she made them tight with the pin, and said to him, &quot;The Philistines are upon you, Samson!&quot; But he awoke from his sleep, and pulled away the pin, the loom, and the web.";
asv[14] = "And she fastened it with the pin, and said unto him, The Philistines are upon thee, Samson. And he awaked out of his sleep, and plucked away the pin of the beam, and the web.";
yng[14] = "And she fixeth [it] with the pin, and saith unto him, `Philistines [are] upon thee, Samson;\' and he awaketh out of his sleep, and journeyeth with the pin of the weaving machine, and with the web.";
dby[14] = "And she fastened it with the pin, and said to him, The Philistines are upon thee, Samson! And he awoke out of his sleep, and tore out the pin of the beam, and the web.";
web[14] = "And she fastened [it] with the pin, and said to him, The Philistines [are] upon thee, Samson. And he awaked out of his sleep, and went away with the pin of the beam, and with the web.";
hnv[14] = "She fastened it with the pin, and said to him, The Pelishtim are on you, Shimshon. He awakened out of his sleep, and plucked away the pin of the beam, and the web.";
vul[14] = "quod cum fecisset Dalila dixit ad eum Philisthim super te Samson qui consurgens de somno extraxit clavum cum crinibus et licio";
kjv[15] = "And she said unto him, How canst thou say, I love thee, when thine heart [is] not with me? thou hast mocked me these three times, and hast not told me wherein thy great strength [lieth].";
rsv[15] = "And she said to him, &quot;How can you say, \'I love you,\' when your heart is not with me? You have mocked me these three times, and you have not told me wherein your great strength lies.&quot;";
asv[15] = "And she said unto him, How canst thou say, I love thee, when thy heart is not with me? thou hast mocked me these three times, and hast not told me wherein thy great strength lieth.";
yng[15] = "And she saith unto him, `How dost thou say, I have loved thee, and thy heart is not with me? these three times thou hast played upon me, and hast not declared to me wherein thy great power [is].\'";
dby[15] = "Then she said to him, How canst thou say, I love thee, when thy heart is not with me? these three times hast thou mocked me, and hast not told me in what is thy great strength.";
web[15] = "And she said to him, How canst thou say, I love thee, when thy heart [is] not with me? Thou hast mocked me these three times, and hast not told me in what thy great strength [lieth].";
hnv[15] = "She said to him, How can you say, I love you, when your heart is not with me? you have mocked me these three times, and have not told me in which your great strength lies.";
vul[15] = "dixitque ad eum Dalila quomodo dicis quod ames me cum animus tuus non sit mecum per tres vices mentitus es mihi et noluisti dicere in quo sit tua maxima fortitudo";
kjv[16] = "And it came to pass, when she pressed him daily with her words, and urged him, [so] that his soul was vexed unto death;";
rsv[16] = "And when she pressed him hard with her words day after day, and urged him, his soul was vexed to death.";
asv[16] = "And it came to pass, when she pressed him daily with her words, and urged him, that his soul was vexed unto death.";
yng[16] = "And it cometh to pass, because she distressed him with her words all the days, and doth urge him, and his soul is grieved to death,";
dby[16] = "And it came to pass when she pressed him daily with her words and urged him, that his soul was vexed unto death;";
web[16] = "And it came to pass when she pressed him daily with her words, and urged him, [so] that his soul was vexed to death;";
hnv[16] = "It happened, when she pressed him daily with her words, and urged him, that his soul was vexed to death.";
vul[16] = "cumque molesta ei esset et per multos dies iugiter adhereret spatium ad quietem non tribuens defecit anima eius et ad mortem usque lassata est";
kjv[17] = "That he told her all his heart, and said unto her, There hath not come a razor upon mine head; for I [have been] a Nazarite unto God from my mother\'s womb: if I be shaven, then my strength will go from me, and I shall become weak, and be like any [other] man.";
rsv[17] = "And he told her all his mind, and said to her, &quot;A razor has never come upon my head; for I have been a Nazirite to God from my mother\'s womb. If I be shaved, then my strength will leave me, and I shall become weak, and be like any other man.&quot;";
asv[17] = "And he told her all his heart, and said unto her, There hath not come a razor upon my head; for I have been a Nazirite unto God from my mother\'s womb: if I be shaven, then my strength will go from me, and I shall become weak, and be like any other man.";
yng[17] = "that he declareth to her all his heart, and saith to her, `A razor hath not gone up on my head, for a Nazarite to God I [am] from the womb of my mother; if I have been shaven, then hath my power turned aside from me, and I have been weak, and have been as any of the human race.\'";
dby[17] = "and he told her all his heart, and said to her, There has not come a razor upon my head; for I am a Nazarite of God from my mother\'s womb; if I should be shaven, then my strength would go from me, and I should be weak, and be like all mankind.";
web[17] = "That he told her all his heart, and said to her, There hath not come a razor upon my head; for I [have been] a Nazarite to God from my birth: if I be shaved, then my strength will go from me, and I shall become weak, and be like any [other] man.";
hnv[17] = "He told her all his heart, and said to her, &quot;No razor has ever come on my head; for I have been a Nazir to God from my mother\'s womb. If I am shaved, then my strength will go from me, and I will become weak, and be like any other man.&quot;";
vul[17] = "tunc aperiens veritatem rei dixit ad eam ferrum numquam ascendit super caput meum quia nazareus id est consecratus Deo sum de utero matris meae si rasum fuerit caput meum recedet a me fortitudo mea et deficiam eroque ut ceteri homines";
kjv[18] = "And when Delilah saw that he had told her all his heart, she sent and called for the lords of the Philistines, saying, Come up this once, for he hath shewed me all his heart. Then the lords of the Philistines came up unto her, and brought money in their hand.";
rsv[18] = "When Deli\'lah saw that he had told her all his mind, she sent and called the lords of the Philistines, saying, &quot;Come up this once, for he has told me all his mind.&quot; Then the lords of the Philistines came up to her, and brought the money in their hands.";
asv[18] = "And when Delilah saw that he had told her all his heart, she sent and called for the lords of the Philistines, saying, Come up this once, for he hath told me all his heart. Then the lords of the Philistines came up unto her, and brought the money in their hand.";
yng[18] = "And Delilah seeth that he hath declared to her all his heart, and she sendeth and calleth for the princes of the Philistines, saying, `Come up this time, for he hath declared to me all his heart;\' and the princes of the Philistines have come up unto her, and bring up the money in their hand.";
dby[18] = "And Delilah saw that he had told her all his heart, and she sent and called for the lords of the Philistines, saying, Come up this time, for he has told me all his heart. And the lords of the Philistines came up to her, and brought the money in their hand.";
web[18] = "And when Delilah saw that he had told her all his heart, she sent and called for the lords of the Philistines, saying, Come up this once, for he hath disclosed to me all his heart. Then the lords of the Philistines came up to her and brought money in their hand.";
hnv[18] = "When Delilah saw that he had told her all his heart, she sent and called for the lords of the Pelishtim, saying, Come up this once, for he has told me all his heart. Then the lords of the Pelishtim came up to her, and brought the money in their hand.";
vul[18] = "videns illa quod confessus ei esset omnem animum suum misit ad principes Philisthinorum atque mandavit ascendite adhuc semel quia nunc mihi aperuit cor suum qui ascenderunt adsumpta pecunia quam promiserant";
kjv[19] = "And she made him sleep upon her knees; and she called for a man, and she caused him to shave off the seven locks of his head; and she began to afflict him, and his strength went from him.";
rsv[19] = "She made him sleep upon her knees; and she called a man, and had him shave off the seven locks of his head. Then she began to torment him, and his strength left him.";
asv[19] = "And she made him sleep upon her knees; and she called for a man, and shaved off the seven locks of his head; and she began to afflict him, and his strength went from him.";
yng[19] = "and she maketh him sleep on her knees, and calleth for a man, and shaveth the seven locks of his head, and beginneth to afflict him, and his power turneth aside from off him;";
dby[19] = "And she made him sleep upon her knees, and called a man, and she caused him to shave off the seven locks of his head; and she began to overpower him, and his strength went from him.";
web[19] = "And she made him sleep upon her knees; and she called for a man, and she caused him to shave off the seven locks of his head; and she began to afflict him, and his strength went from him.";
hnv[19] = "She made him sleep on her knees; and she called for a man, and shaved off the seven locks of his head; and she began to afflict him, and his strength went from him.";
vul[19] = "at illa dormire eum fecit super genua sua et in sinu suo reclinare caput vocavitque tonsorem et rasit septem crines eius et coepit abicere eum et a se repellere statim enim ab eo fortitudo discessit";
kjv[20] = "And she said, The Philistines [be] upon thee, Samson. And he awoke out of his sleep, and said, I will go out as at other times before, and shake myself. And he wist not that the LORD was departed from him.";
rsv[20] = "And she said, &quot;The Philistines are upon you, Samson!&quot; And he awoke from his sleep, and said, &quot;I will go out as at other times, and shake myself free.&quot; And he did not know that the LORD had left him.";
asv[20] = "And she said, The Philistines are upon thee, Samson. And he awoke out of his sleep, and said, I will go out as at other times, and shake myself free. But he knew not that Jehovah was departed from him.";
yng[20] = "and she saith, `Philistines [are] upon thee, Samson;\' and he awaketh out of his sleep, and saith, `I go out as time by time, and shake myself;\' and he hath not known that Jehovah hath turned aside from off him.";
dby[20] = "And she said, The Philistines are upon thee, Samson! And he awoke out of his sleep, and thought, I will go out as at other times before, and disengage myself. And he knew not that Jehovah had departed from him.";
web[20] = "And she said, the Philistines [are] upon thee, Samson. And he awoke out of his sleep, and said, I will go out as at other times before, and shake myself. And he knew not that the LORD had departed from him.";
hnv[20] = "She said, The Pelishtim are on you, Shimshon. He awoke out of his sleep, and said, I will go out as at other times, and shake myself free. But he didn\'t know that the LORD had departed from him.";
vul[20] = "dixitque Philisthim super te Samson qui de somno consurgens dixit in animo suo egrediar sicut ante feci et me excutiam nesciens quod Dominus recessisset ab eo";
kjv[21] = "But the Philistines took him, and put out his eyes, and brought him down to Gaza, and bound him with fetters of brass; and he did grind in the prison house.";
rsv[21] = "And the Philistines seized him and gouged out his eyes, and brought him down to Gaza, and bound him with bronze fetters; and he ground at the mill in the prison.";
asv[21] = "And the Philistines laid hold on him, and put out his eyes; and they brought him down to Gaza, and bound him with fetters of brass; and he did grind in the prison-house.";
yng[21] = "And the Philistines seize him, and pick out his eyes, and bring him down to Gaza, and bind him with two brazen fetters; and he is grinding in the prison-house.";
dby[21] = "And the Philistines seized him, and put out his eyes, and brought him down to Gazah, and bound him with fetters of bronze; and he had to grind in the prison-house.";
web[21] = "But the Philistines took him and put out his eyes, and brought him down to Gaza, and bound him with fetters of brass; and he did grind in the prison-house.";
hnv[21] = "The Pelishtim laid hold on him, and put out his eyes; and they brought him down to `Aza, and bound him with fetters of brass; and he did grind in the prison-house.";
vul[21] = "quem cum adprehendissent Philisthim statim eruerunt oculos eius et duxerunt Gazam vinctum catenis et clausum in carcere molere fecerunt";
kjv[22] = "Howbeit the hair of his head began to grow again after he was shaven.";
rsv[22] = "But the hair of his head began to grow again after it had been shaved.";
asv[22] = "Howbeit the hair of his head began to grow again after he was shaven.";
yng[22] = "And the hair of his head beginneth to shoot up, when he hath been shaven,";
dby[22] = "But the hair of his head began to grow after he was shaved.";
web[22] = "However the hair of his head began to grow again after he was shaved.";
hnv[22] = "However the hair of his head began to grow again after he was shaved.";
vul[22] = "iamque capilli eius renasci coeperant";
kjv[23] = "Then the lords of the Philistines gathered them together for to offer a great sacrifice unto Dagon their god, and to rejoice: for they said, Our god hath delivered Samson our enemy into our hand.";
rsv[23] = "Now the lords of the Philistines gathered to offer a great sacrifice to Dagon their god, and to rejoice; for they said, &quot;Our god has given Samson our enemy into our hand.&quot;";
asv[23] = "And the lords of the Philistines gathered them together to offer a great sacrifice unto Dagon their god, and to rejoice; for they said, Our god hath delivered Samson our enemy into our hand.";
yng[23] = "and the princes of the Philistines have been gathered together to sacrifice a great sacrifice to Dagon their god, and to rejoice; and they say, `Our god hath given into our hand Samson our enemy.\'";
dby[23] = "Then the lords of the Philistines gathered together to sacrifice a great sacrifice to Dagon their god, and to rejoice; for they said, Our god has given Samson our enemy into our hands.";
web[23] = "Then the lords of the Philistines assembled to offer a great sacrifice to Dagon their god, and to rejoice: for they said, Our god hath delivered Samson our enemy into our hand.";
hnv[23] = "The lords of the Pelishtim gathered them together to offer a great sacrifice to Dagon their god, and to rejoice; for they said, Our god has delivered Shimshon our enemy into our hand.";
vul[23] = "et principes Philisthinorum convenerunt in unum ut immolarent hostias magnificas Dagon deo suo et epularentur dicentes tradidit deus noster inimicum nostrum Samson in manus nostras";
kjv[24] = "And when the people saw him, they praised their god: for they said, Our god hath delivered into our hands our enemy, and the destroyer of our country, which slew many of us.";
rsv[24] = "And when the people saw him, they praised their god; for they said, &quot;Our god has given our enemy into our hand, the ravager of our country, who has slain many of us.&quot;";
asv[24] = "And when the people saw him, they praised their god; for they said, Our god hath delivered into our hand our enemy, and the destroyer of our country, who hath slain many of us.";
yng[24] = "And the people see him, and praise their god, for they said, `Our god hath given in our hand our enemy, and he who is laying waste our land, and who multiplied our wounded.\'";
dby[24] = "And when the people saw him, they praised their god; for they said, Our god has given into our hands our enemy, and the destroyer of our country, even him who multiplied our slain.";
web[24] = "And when the people saw him, they praised their god: for they said, Our god hath delivered into our hands our enemy, and the destroyer of our country; who slew many of us.";
hnv[24] = "When the people saw him, they praised their god; for they said, Our god has delivered into our hand our enemy, and the destroyer of our country, who has slain many of us.";
vul[24] = "quod etiam populus videns laudabat deum suum eademque dicebat tradidit deus noster in manus nostras adversarium qui delevit terram nostram et occidit plurimos";
kjv[25] = "And it came to pass, when their hearts were merry, that they said, Call for Samson, that he may make us sport. And they called for Samson out of the prison house; and he made them sport: and they set him between the pillars.";
rsv[25] = "And when their hearts were merry, they said, &quot;Call Samson, that he may make sport for us.&quot; So they called Samson out of the prison, and he made sport before them. They made him stand between the pillars;";
asv[25] = "And it came to pass, when their hearts were merry, that they said, Call for Samson, that he may make us sport. And they called for Samson out of the prison-house; and he made sport before them. And they set him between the pillars:";
yng[25] = "And it cometh to pass, when their heart [is] glad, that they say, `Call for Samson, and he doth play before us;\' and they call for Samson out of the prison-house, and he playeth before them, and they cause him to stand between the pillars.";
dby[25] = "And it came to pass when their hearts were merry, that they said, Call for Samson, that he may make us sport. And they called for Samson out of the prison-house, and he played before them; and they set him between the pillars.";
web[25] = "And it came to pass, when their hearts were merry, that they said, Call for Samson that he may make us sport. And they called for Samson out of the prison-house; and he made them sport: and they set him between the pillars.";
hnv[25] = "It happened, when their hearts were merry, that they said, Call for Shimshon, that he may make us sport. They called for Shimshon out of the prison-house; and he made sport before them. They set him between the pillars:";
vul[25] = "laetantesque per convivia sumptis iam epulis praeceperunt ut vocaretur Samson et ante eos luderet qui adductus de carcere ludebat ante eos feceruntque eum stare inter duas columnas";
kjv[26] = "And Samson said unto the lad that held him by the hand, Suffer me that I may feel the pillars whereupon the house standeth, that I may lean upon them.";
rsv[26] = "and Samson said to the lad who held him by the hand, &quot;Let me feel the pillars on which the house rests, that I may lean against them.&quot;";
asv[26] = "and Samson said unto the lad that held him by the hand, Suffer me that I may feel the pillars whereupon the house resteth, that I may lean upon them.";
yng[26] = "And Samson saith unto the young man who is keeping hold on his hand, `Let me alone, and let me feel the pillars on which the house is established, and I lean upon them.\'";
dby[26] = "And Samson said to the lad that held him by the hand, Let loose of me, and suffer me to feel the pillars upon which the house stands, that I may lean upon them.";
web[26] = "And Samson said to the lad that held him by the hand, Suffer me that I may feel the pillars upon which the house standeth, that I may lean upon them.";
hnv[26] = "and Shimshon said to the boy who held him by the hand, Allow me that I may feel the pillars whereupon the house rests, that I may lean on them.";
vul[26] = "qui dixit puero regenti gressus suos dimitte me ut tangam columnas quibus omnis inminet domus ut recliner super eas et paululum requiescam";
kjv[27] = "Now the house was full of men and women; and all the lords of the Philistines [were] there; and [there were] upon the roof about three thousand men and women, that beheld while Samson made sport.";
rsv[27] = "Now the house was full of men and women; all the lords of the Philistines were there, and on the roof there were about three thousand men and women, who looked on while Samson made sport.";
asv[27] = "Now the house was full of men and women; and all the lords of the Philistines were there; and there were upon the roof about three thousand men and women, that beheld while Samson made sport.";
yng[27] = "And the house hath been full of men and of women, and thither [are] all the princes of the Philistines, and on the roof [are] about three thousand men and women, who are looking on the playing of Samson.";
dby[27] = "Now the house was full of men and women; and all the lords of the Philistines were there; and upon the roof there were about three thousand men and women, who looked on while Samson made sport.";
web[27] = "Now the house was full of men and women: and all the lords of the Philistines [were] there: and [there were] upon the roof about three thousand men and women, that beheld while Samson made sport.";
hnv[27] = "Now the house was full of men and women; and all the lords of the Pelishtim were there; and there were on the roof about three thousand men and women, who saw while Shimshon made sport.";
vul[27] = "domus autem plena erat virorum ac mulierum et erant ibi omnes principes Philisthinorum ac de tecto et solario circiter tria milia utriusque sexus spectabant ludentem Samson";
kjv[28] = "And Samson called unto the LORD, and said, O Lord GOD, remember me, I pray thee, and strengthen me, I pray thee, only this once, O God, that I may be at once avenged of the Philistines for my two eyes.";
rsv[28] = "Then Samson called to the LORD and said, &quot;O Lord GOD, remember me, I pray thee, and strengthen me, I pray thee, only this once, O God, that I may be avenged upon the Philistines for one of my two eyes.&quot;";
asv[28] = "And Samson called unto Jehovah, and said, O Lord Jehovah, remember me, I pray thee, and strengthen me, I pray thee, only this once, O God, that I may be at once avenged of the Philistines for my two eyes.";
yng[28] = "And Samson calleth unto Jehovah, and saith, `Lord Jehovah, remember me, I pray Thee, and strengthen me, I pray Thee, only this time, O God; and I am avenged -- vengeance at once -- because of my two eyes, on the Philistines.\'";
dby[28] = "And Samson called to Jehovah, and said, Lord Jehovah, remember me, I pray thee, and strengthen me, I pray thee, only this once, O God, that I may take one vengeance upon the Philistines for my two eyes.";
web[28] = "And Samson called to the LORD, and said, O Lord GOD, remember me, I pray thee, and strengthen me, I pray thee, only this once, O God, that I may be at once avenged of the Philistines for my two eyes.";
hnv[28] = " Shimshon called to the LORD, and said, Lord GOD, remember me, Please, and strengthen me, Please, only this once, God, that I may be at once avenged of the Pelishtim for my two eyes.";
vul[28] = "at ille invocato Domino ait Domine Deus memento mei et redde nunc mihi pristinam fortitudinem Deus meus ut ulciscar me de hostibus meis et pro amissione duorum luminum unam ultionem recipiam";
kjv[29] = "And Samson took hold of the two middle pillars upon which the house stood, and on which it was borne up, of the one with his right hand, and of the other with his left.";
rsv[29] = "And Samson grasped the two middle pillars upon which the house rested, and he leaned his weight upon them, his right hand on the one and his left hand on the other.";
asv[29] = "And Samson took hold of the two middle pillars upon which the house rested, and leaned upon them, the one with his right hand, and the other with his left.";
yng[29] = "And Samson turneth aside [to] the two middle pillars, on which the house is established, and on which it is supported, [to] the one with his right hand, and one with his left;";
dby[29] = "And Samson took hold of the two middle pillars upon which the house stood (and he supported himself upon them), the one with his right hand and the other with his left.";
web[29] = "And Samson took hold of the two middle pillars upon which the house stood, and on which it was supported, of the one with his right hand, and of the other with his left.";
hnv[29] = "Shimshon took hold of the two middle pillars on which the house rested, and leaned on them, the one with his right hand, and the other with his left.";
vul[29] = "et adprehendens ambas columnas quibus innitebatur domus alteramque earum dextera et alteram leva tenens";
kjv[30] = "And Samson said, Let me die with the Philistines. And he bowed himself with [all his] might; and the house fell upon the lords, and upon all the people that [were] therein. So the dead which he slew at his death were more than [they] which he slew in his life.";
rsv[30] = "And Samson said, &quot;Let me die with the Philistines.&quot; Then he bowed with all his might; and the house fell upon the lords and upon all the people that were in it. So the dead whom he slew at his death were more than those whom he had slain during his life.";
asv[30] = "And Samson said, Let me die with the Philistines. And he bowed himself with all his might; and the house fell upon the lords, and upon all the people that were therein. So the dead that he slew at his death were more than they that he slew in his life.";
yng[30] = "and Samson saith, `Let me die with the Philistines,\' and he inclineth himself powerfully, and the house falleth on the princes, and on all the people who [are] in it, and the dead whom he hath put to death in his death are more than those whom he put to death in his life.";
dby[30] = "And Samson said, Let me die with the Philistines! And he bowed himself with might; and the house fell on the lords, and on all the people that were therein. So the dead that he slew at his death were more than those whom he had slain in his life.";
web[30] = "And Samson said, Let me die with the Philistines. And he bowed himself with [all his] might; and the house fell upon the lords, and upon all the people that [were] in it. So the dead which he slew at his death were more than [they] which he slew in his life.";
hnv[30] = " Shimshon said, Let me die with the Pelishtim. He bowed himself with all his might; and the house fell on the lords, and on all the people who were therein. So the dead that he killed at his death were more than those who he killed in his life.";
vul[30] = "ait moriatur anima mea cum Philisthim concussisque fortiter columnis cecidit domus super omnes principes et ceteram multitudinem quae ibi erat multoque plures interfecit moriens quam ante vivus occiderat";
kjv[31] = "Then his brethren and all the house of his father came down, and took him, and brought [him] up, and buried him between Zorah and Eshtaol in the buryingplace of Manoah his father. And he judged Israel twenty years.";
rsv[31] = "Then his brothers and all his family came down and took him and brought him up and buried him between Zorah and Esh\'ta-ol in the tomb of Mano\'ah his father. He had judged Israel twenty years.";
asv[31] = "Then his brethren and all the house of his father came down, and took him, and brought him up, and buried him between Zorah and Eshtaol in the burying-place of Manoah his father. And he judged Israel twenty years.";
yng[31] = "And his brethren come down, and all the house of his father, and lift him up, and bring him up, and bury him between Zorah and Eshtaol, in the burying-place of Manoah his father; and he hath judged Israel twenty years.";
dby[31] = "And his brethren came down, and all the house of his father, and took him, and brought him up, and buried him between Zoreah and Eshtaol in the sepulchre of Manoah his father. And he had judged Israel twenty years.";
web[31] = "Then his brethren and all the house of his father came down, and took him, and brought [him] up, and buried him between Zorah and Eshtaol in the burying-place of Manoah his father. And he judged Israel twenty years.";
hnv[31] = "Then his brothers and all the house of his father came down, and took him, and brought him up, and buried him between Tzor`ah and Eshta\'ol in the burying-place of Manoach his father. He judged Yisra\'el twenty years.";
vul[31] = "descendentes autem fratres eius et universa cognatio tulerunt corpus eius et sepelierunt inter Saraa et Esthaol in sepulchro patris Manue iudicavitque Israhel viginti annis";
