csb[1] = "Jerubbaal (that is, Gideon) and all the troops who were with him, got up early and camped beside the spring of Harod. The camp of Midian was north of them, below the hill of Moreh, in the valley.";
csb[2] = "The LORD said to Gideon, &quot;You have too many troops for me to hand the Midianites over to them, or else Israel might elevate themselves over me and say, \'My own strength saved me.\'";
csb[3] = "&quot;Now announce to the troops: \'Whoever is fearful and trembling may turn back and leave Mount Gilead.\' &quot; So twenty-two thousand of the troops turned back, but ten thousand remained.";
csb[4] = "Then the LORD said to Gideon, &quot;There are still too many troops. Take them down to the water, and I will test them for you there. If I say to you, \'This one can go with you,\' he can go. But if I say about anyone, \'This one cannot go with you,\' he cannot go.&quot;";
csb[5] = "So he brought the troops down to the water, and the LORD said to Gideon, &quot;Separate everyone who laps water with his tongue like a dog. Do the same with everyone who kneels to drink.&quot;";
csb[6] = "The number of those who lapped with their hands to their mouths was three hundred men, and all the rest of the troops knelt to drink water.";
csb[7] = "The LORD said to Gideon, &quot;I will deliver you with the three hundred men who lapped and hand the Midianites over to you. But everyone else is to go home.&quot;";
csb[8] = "So Gideon sent all the Israelites to their tents but kept the three hundred troops, who took the provisions and their trumpets. The camp of Midian was below him in the valley.";
csb[9] = "That night the LORD said to him, &quot;Get up and attack the camp, for I have handed it over to you.";
csb[10] = "&quot;But if you are afraid to attack the camp, go down with Purah your servant.";
csb[11] = "&quot;Listen to what they say, and then you will be encouraged to attack the camp.&quot; So he went down with Purah his servant to the outpost of the troops who were in the camp.";
csb[12] = "Now the Midianites, Amalekites, and all the Qedemites had settled down in the valley like a swarm of locusts, and their camels were as innumerable as the sand on the seashore.";
csb[13] = "When Gideon arrived, there was a man telling his friend about a dream. He said, &quot;Listen, I had a dream: a loaf of barley bread came tumbling into the Midianite camp, struck a tent, and it fell. The loaf turned the tent upside down so that it collapsed.&quot;";
csb[14] = "His friend answered: &quot;This is nothing less than the sword of Gideon son of Joash, the Israelite. God has handed the entire Midianite camp over to him.&quot;";
csb[15] = "When Gideon heard the account of the dream and its interpretation, he bowed in worship. He returned to Israel\'s camp and said, &quot;Get up, for the LORD has handed the Midianite camp over to you.&quot;";
csb[16] = "Then he divided the three hundred men into three companies and gave each of the men a trumpet in one hand and an empty pitcher with a torch inside it in the other hand.";
csb[17] = "&quot;Watch me,&quot; he said to them, &quot;and do what I do. When I come to the outpost of the camp, do as I do.";
csb[18] = "&quot;When I and everyone with me blow our trumpets, you are also to blow your trumpets all around the camp. Then you will say, \'For the LORD and for Gideon! \' &quot;";
csb[19] = "Gideon and the hundred men who were with him went to the outpost of the camp at the beginning of the middle watch after the sentries had been stationed. They blew their trumpets and broke the pitchers that were in their hands.";
csb[20] = "The three companies blew their trumpets and shattered their pitchers. They held their torches in their left hands, their trumpets in their right hands, and shouted, &quot;A sword for the LORD and for Gideon! &quot;";
csb[21] = "Each Israelite took his position around the camp, and the entire Midianite army began to run, and they cried out as they fled.";
csb[22] = "When Gideon\'s men blew their three hundred trumpets, the LORD caused the men in the whole army to turn on each other with their swords. They fled to Acacia House in the direction of Zererah as far as the border of Abel-meholah near Tabbath.";
csb[23] = "Then the men of Israel were called from Naphtali, Asher, and Manasseh, and they pursued the Midianites.";
csb[24] = "Gideon sent messengers throughout the hill country of Ephraim with this message: &quot;Come down to intercept the Midianites and take control of the watercourses ahead of them as far as Beth-barah and the Jordan.&quot; So all the men of Ephraim were called out, and they took control of the watercourses as far as Beth-barah and the Jordan.";
csb[25] = "They captured Oreb and Zeeb, the two princes of Midian; they killed Oreb at the rock of Oreb and Zeeb at the winepress of Zeeb, while they were pursuing the Midianites. They brought the heads of Oreb and Zeeb to Gideon across the Jordan.";
kjv[1] = "Then Jerubbaal, who [is] Gideon, and all the people that [were] with him, rose up early, and pitched beside the well of Harod: so that the host of the Midianites were on the north side of them, by the hill of Moreh, in the valley.";
rsv[1] = "Then Jerubba\'al (that is, Gideon) and all the people who were with him rose early and encamped beside the spring of Harod; and the camp of Mid\'ian was north of them, by the hill of Moreh, in the valley.";
asv[1] = "Then Jerubbaal, who is Gideon, and all the people that were with him, rose up early, and encamped beside the spring of Harod: and the camp of Midian was on the north side of them, by the hill of Moreh, in the valley.";
yng[1] = "And Jerubbaal (he [is] Gideon) riseth early, and all the people who [are] with him, and they encamp by the well of Harod, and the camp of Midian hath been on the south of him, on the height of Moreh, in the valley.";
dby[1] = "And Jerubbaal, who is Gideon, arose early, and all the people that were with him, and they encamped beside the spring Harod; and he had the camp of Midian on the north by the hill of Moreh in the valley.";
web[1] = "Then Jerubbaal (who [is] Gideon) and all the people that [were] with him, rose early, and encamped beside the well of Harod: so that the host of the Midianites were on the north side of them by the hill of Moreh, in the valley.";
hnv[1] = "Then Yerubba`al, who is Gid`on, and all the people who were with him, rose up early, and encamped beside the spring of Harod: and the camp of Midyan was on the north side of them, by the hill of Moreh, in the valley.";
vul[1] = "igitur Hierobbaal qui est et Gedeon de nocte consurgens et omnis populus cum eo venit ad fontem qui vocatur Arad erant autem castra Madian in valle ad septentrionalem plagam collis Excelsi";
kjv[2] = "And the LORD said unto Gideon, The people that [are] with thee [are] too many for me to give the Midianites into their hands, lest Israel vaunt themselves against me, saying, Mine own hand hath saved me.";
rsv[2] = "The LORD said to Gideon, &quot;The people with you are too many for me to give the Mid\'ianites into their hand, lest Israel vaunt themselves against me, saying, \'My own hand has delivered me.\'";
asv[2] = "And Jehovah said unto Gideon, The people that are with thee are too many for me to give the Midianites into their hand, lest Israel vaunt themselves against me, saying, Mine own hand hath saved me.";
yng[2] = "And Jehovah saith unto Gideon, `Too many [are] the people who [are] with thee for My giving Midian into their hand, lest Israel beautify itself against Me, saying, My hand hath given salvation to me;";
dby[2] = "And Jehovah said to Gideon, The people that are with thee are too many for me to give Midian into their hand, lest Israel vaunt themselves against me, saying, Mine own hand hath saved me.";
web[2] = "And the LORD said to Gideon, The people that [are] with thee [are] too many for me to give the Midianites into their hands, lest Israel vaunt themselves against me, saying, My own hand hath saved me.";
hnv[2] = "The LORD said to Gid`on, The people who are with you are too many for me to give the Midyanim into their hand, lest Yisra\'el vaunt themselves against me, saying, My own hand has saved me.";
vul[2] = "dixitque Dominus ad Gedeon multus tecum est populus nec tradetur Madian in manus eius ne glorietur contra me Israhel et dicat meis viribus liberatus sum";
kjv[3] = "Now therefore go to, proclaim in the ears of the people, saying, Whosoever [is] fearful and afraid, let him return and depart early from mount Gilead. And there returned of the people twenty and two thousand; and there remained ten thousand.";
rsv[3] = "Now therefore proclaim in the ears of the people, saying, \'Whoever is fearful and trembling, let him return home.\'&quot; And Gideon tested them; twenty-two thousand returned, and ten thousand remained.";
asv[3] = "Now therefore proclaim in the ears of the people, saying, Whosoever is fearful and trembling, let him return and depart from mount Gilead. And there returned of the people twenty and two thousand; and there remained ten thousand.";
yng[3] = "and now, call, I pray thee, in the ears of the people, saying, Whoso [is] afraid and trembling, let him turn back and go early from mount Gilead;\' and there turn back of the people twenty and two thousand, and ten thousand have been left.";
dby[3] = "And now proclaim in the ears of the people, saying, Whoever is timid and afraid, let him go back and turn from mount Gilead. And there went back of the people twenty-two thousand; and there remained ten thousand.";
web[3] = "Now therefore, proclaim in the ears of the people, saying, Whoever [is] fearful and afraid, let him return and depart early from mount Gilead. And there returned of the people twenty and two thousand; and there remained ten thousand.";
hnv[3] = "Now therefore proclaim in the ears of the people, saying, Whoever is fearful and trembling, let him return and depart from Mount Gil`ad. There returned of the people twenty-two thousand; and there remained ten thousand.";
vul[3] = "loquere ad populum et cunctis audientibus praedica qui formidolosus et timidus est revertatur recesseruntque de monte Galaad et reversa sunt ex populo viginti duo milia virorum et tantum decem milia remanserunt";
kjv[4] = "And the LORD said unto Gideon, The people [are] yet [too] many; bring them down unto the water, and I will try them for thee there: and it shall be, [that] of whom I say unto thee, This shall go with thee, the same shall go with thee; and of whomsoever I say unto thee, This shall not go with thee, the same shall not go.";

asv[4] = "And Jehovah said unto Gideon, The people are yet too many; bring them down unto the water, and I will try them for thee there: and it shall be, that of whom I say unto thee, This shall go with thee, the same shall go with thee; and of whomsoever I say unto thee, This shall not go with thee, the same shall not go.";

kjv[13] = "And when Gideon was come, behold, [there was] a man that told a dream unto his fellow, and said, Behold, I dreamed a dream, and, lo, a cake of barley bread tumbled into the host of Midian, and came unto a tent, and smote it that it fell, and overturned it, that the tent lay along.";
rsv[13] = "When Gideon came, behold, a man was telling a dream to his comrade; and he said, &quot;Behold, I dreamed a dream; and lo, a cake of barley bread tumbled into the camp of Mid\'ian, and came to the tent, and struck it so that it fell, and turned it upside down, so that the tent lay flat.&quot;";
asv[13] = "And when Gideon was come, behold, there was a man telling a dream unto his fellow; and he said, Behold, I dreamed a dream; and, lo, a cake of barley bread tumbled into the camp of Midian, and came unto the tent, and smote it so that it fell, and turned it upside down, so that the tent lay flat.";
yng[13] = "And Gideon cometh in, and lo, a man is recounting to his companion a dream, and saith, `Lo, a dream I have dreamed, and lo, a cake of barley-bread is turning itself over into the camp of Midian, and it cometh in unto the tent, and smiteth it, and it falleth, and turneth it upwards, and the tent hath fallen.\'";
dby[13] = "And Gideon came, and behold, a man was telling a dream to his fellow; and he said, Behold, I dreamed a dream, and lo, a cake of barley-bread tumbled into the camp of Midian, and came to the tent, and smote it that it fell, and overturned it; and the tent lay along.";

yng[14] = "And his companion answereth and saith, `This is nothing save the sword of Gideon son of Joash, a man of Israel; God hath given into his hand Midian and all the camp.\'";
dby[14] = "And his fellow answered and said, This is nothing else save the sword of Gideon the son of Joash, the man of Israel: God hath given into his hand Midian and all the host.";
web[14] = "And his fellow answered, and said, This [is] nothing else save the sword of Gideon the son of Joash, a man of Israel: [for] into his hand hath God delivered Midian, and all the host.";
hnv[14] = "His fellow answered, This is nothing else save the sword of Gid`on the son of Yo\'ash, a man of Yisra\'el: into his hand God has delivered Midyan, and all the host.";
vul[14] = "respondit is cui loquebatur non est hoc aliud nisi gladius Gedeonis filii Ioas viri Israhelitae tradidit Deus in manu eius Madian et omnia castra eius";
kjv[15] = "And it was [so], when Gideon heard the telling of the dream, and the interpretation thereof, that he worshipped, and returned into the host of Israel, and said, Arise; for the LORD hath delivered into your hand the host of Midian.";
rsv[15] = "When Gideon heard the telling of the dream and its interpretation, he worshiped; and he returned to the camp of Israel, and said, &quot;Arise; for the LORD has given the host of Mid\'ian into your hand.&quot;";
asv[15] = "And it was so, when Gideon heard the telling of the dream, and the interpretation thereof, that he worshipped; and he returned into the camp of Israel, and said, Arise; for Jehovah hath delivered into your hand the host of Midian.";
yng[15] = "And it cometh to pass, when Gideon heareth the narration of the dream and its interpretation, that he boweth himself, and turneth back unto the camp of Israel, and saith, `Rise ye, for Jehovah hath given into your hand the camp of Midian.\'";
dby[15] = "And it came to pass when Gideon heard the telling of the dream and its interpretation, that he worshipped. And he returned into the camp of Israel, and said, Arise; for Jehovah hath given into your hand the camp of Midian.";
web[15] = "And it was [so], when Gideon heard the telling of the dream, and its interpretation, that he worshiped, and returned to the host of Israel, and said, Arise; for the LORD hath delivered into your hand the host of Midian.";
hnv[15] = "It was so, when Gid`on heard the telling of the dream, and the interpretation of it, that he worshiped; and he returned into the camp of Yisra\'el, and said, Arise; for the LORD has delivered into your hand the host of Midyan.";
vul[15] = "cumque audisset Gedeon somnium et interpretationem eius adoravit et reversus ad castra Israhel ait surgite tradidit enim Dominus in manus nostras castra Madian";
kjv[16] = "And he divided the three hundred men [into] three companies, and he put a trumpet in every man\'s hand, with empty pitchers, and lamps within the pitchers.";
rsv[16] = "And he divided the three hundred men into three companies, and put trumpets into the hands of all of them and empty jars, with torches inside the jars.";
asv[16] = "And he divided the three hundred men into three companies, and he put into the hands of all of them trumpets, and empty pitchers, with torches within the pitchers.";
yng[16] = "And he divideth the three hundred men [into] three detachments, and putteth trumpets into the hand of all of them, and empty pitchers, and lamps within the pitchers.";
dby[16] = "And he divided the three hundred men into three companies, and he put a trumpet in every man\'s hand, and empty pitchers, and torches within the pitchers.";
web[16] = "And he divided the three hundred men [into] three companies, and he put a trumpet in every man\'s hand, with empty pitchers, and lamps within the pitchers.";
hnv[16] = "He divided the three hundred men into three companies, and he put into the hands of all of them trumpets, and empty pitchers, with torches within the pitchers.";
vul[16] = "divisitque trecentos viros in tres partes et dedit tubas in manibus eorum lagoenasque vacuas ac lampadas in medio lagoenarum";
kjv[17] = "And he said unto them, Look on me, and do likewise: and, behold, when I come to the outside of the camp, it shall be [that], as I do, so shall ye do.";
rsv[17] = "And he said to them, &quot;Look at me, and do likewise; when I come to the outskirts of the camp, do as I do.";
asv[17] = "And he said unto them, Look on me, and do likewise: and, behold, when I come to the outermost part of the camp, it shall be that, as I do, so shall ye do.";
yng[17] = "And he saith unto them, `Look at me, and thus do; and lo, I am coming into the extremity of the camp -- and it hath been -- as I do so ye do;";
dby[17] = "And he said to them, Look on me, and do likewise; behold, when I come to the extremity of the camp, it shall be that, as I do, so shall ye do.";
web[17] = "And he said to them, Look on me, and do likewise: and behold, when I come to the outside of the camp, it shall be [that] as I do, so shall ye do.";
hnv[17] = "He said to them, Look on me, and do likewise: and, behold, when I come to the outermost part of the camp, it shall be that, as I do, so shall you do.";
vul[17] = "et dixit ad eos quod me facere videritis hoc facite ingrediar partem castrorum et quod fecero sectamini";
kjv[18] = "When I blow with a trumpet, I and all that [are] with me, then blow ye the trumpets also on every side of all the camp, and say, [The sword] of the LORD, and of Gideon.";
rsv[18] = "When I blow the trumpet, I and all who are with me, then blow the trumpets also on every side of all the camp, and shout, \'For the LORD and for Gideon.\'&quot;";
asv[18] = "When I blow the trumpet, I and all that are with me, then blow ye the trumpets also on every side of all the camp, and say, For Jehovah and for Gideon.";
yng[18] = "and I have blown with a trumpet -- I and all who [are] with me, and ye have blown with trumpets, even ye, round about all the camp, and have said, For Jehovah and for Gideon.\'";
dby[18] = "And when I blow with a trumpet, I and all that are with me, ye also shall blow the trumpets around the whole camp, and shall say, For Jehovah and for Gideon!";
web[18] = "When I blow with a trumpet, I and all that [are] with me, then blow ye the trumpets also on every side of all the camp, and say, [The sword] of the LORD, and of Gideon.";
hnv[18] = " When I blow the shofar, I and all who are with me, then blow you the trumpets also on every side of all the camp, and say, For the LORD and for Gid`on.";
vul[18] = "quando personaverit tuba in manu mea vos quoque per castrorum circuitum clangite et conclamate Domino et Gedeoni";
kjv[19] = "So Gideon, and the hundred men that [were] with him, came unto the outside of the camp in the beginning of the middle watch; and they had but newly set the watch: and they blew the trumpets, and brake the pitchers that [were] in their hands.";
rsv[19] = "So Gideon and the hundred men who were with him came to the outskirts of the camp at the beginning of the middle watch, when they had just set the watch; and they blew the trumpets and smashed the jars that were in their hands.";
asv[19] = "So Gideon, and the hundred men that were with him, came unto the outermost part of the camp in the beginning of the middle watch, when they had but newly set the watch: and they blew the trumpets, and brake in pieces the pitchers that were in their hands.";
yng[19] = "And Gideon cometh -- and the hundred men who [are] with him -- into the extremity of the camp, [at] the beginning of the middle watch (it hath only just confirmed the watchmen), and they blow with trumpets -- dashing in pieces also the pitchers which [are] in their hand;";
dby[19] = "And Gideon, and the hundred men that were with him, came to the outside of the camp in the beginning of the middle watch; and they had but newly set the watch; and they blew the trumpets, and broke the pitchers that were in their hands.";
web[19] = "So Gideon, and the hundred men that [were] with him, came to the outside of the camp in the beginning of the middle watch; and they had but newly set the watch: and they blew the trumpets, and broke the pitchers that [were] in their hands.";
hnv[19] = "So Gid`on, and the hundred men who were with him, came to the outermost part of the camp in the beginning of the middle watch, when they had but newly set the watch: and they blew the trumpets, and broke in pieces the pitchers that were in their hands.";
vul[19] = "ingressusque est Gedeon et trecenti viri qui erant cum eo in parte castrorum incipientibus vigiliis noctis mediae et custodibus suscitatis coeperunt bucinis clangere et conplodere inter se lagoenas";
kjv[20] = "And the three companies blew the trumpets, and brake the pitchers, and held the lamps in their left hands, and the trumpets in their right hands to blow [withal]: and they cried, The sword of the LORD, and of Gideon.";
rsv[20] = "And the three companies blew the trumpets and broke the jars, holding in their left hands the torches, and in their right hands the trumpets to blow; and they cried, &quot;A sword for the LORD and for Gideon!&quot;";
asv[20] = "And the three companies blew the trumpets, and brake the pitchers, and held the torches in their left hands, and the trumpets in their right hands wherewith to blow; and they cried, The sword of Jehovah and of Gideon.";
yng[20] = "and the three detachments blow with trumpets, and break the pitchers, and keep hold with their left hand on the lamps, and with their right hand on the trumpets to blow, and they cry, `The sword of Jehovah and of Gideon.\'";
dby[20] = "And the three companies blew the trumpets, and broke in pieces the pitchers, and held the torches in their left hand, and the trumpets in their right hand for blowing, and cried, The sword of Jehovah and of Gideon!";
web[20] = "And the three companies blew the trumpets, and broke the pitchers, and held the lamps in their left hands, and the trumpets in their right hands to blow [with]: and they cried, The sword of the LORD, and of Gideon.";
hnv[20] = "The three companies blew the trumpets, and broke the pitchers, and held the torches in their left hands, and the trumpets in their right hands with which to blow; and they cried, The sword of the LORD and of Gid`on.";
vul[20] = "cumque per gyrum castrorum in tribus personarent locis et hydrias confregissent tenuerunt sinistris manibus lampadas et dextris sonantes tubas clamaveruntque gladius Domini et Gedeonis";
kjv[21] = "And they stood every man in his place round about the camp: and all the host ran, and cried, and fled.";
rsv[21] = "They stood every man in his place round about the camp, and all the army ran; they cried out and fled.";
asv[21] = "And they stood every man in his place round about the camp; and all the host ran; and they shouted, and put [them] to flight.";
yng[21] = "And they stand each in his place, round about the camp, and all the camp runneth, and they shout, and flee;";
dby[21] = "And they stood every man in his place round about the camp; and all the host ran, and cried out, and fled.";
web[21] = "And they stood every man in his place around the camp; and all the host ran, and cried, and fled.";
hnv[21] = "They stood every man in his place round about the camp; and all the host ran; and they shouted, and put [them] to flight.";
vul[21] = "stantes singuli in loco suo per circuitum castrorum hostilium omnia itaque castra turbata sunt et vociferantes ululantesque fugerunt";
kjv[22] = "And the three hundred blew the trumpets, and the LORD set every man\'s sword against his fellow, even throughout all the host: and the host fled to Bethshittah in Zererath, [and] to the border of Abelmeholah, unto Tabbath.";
rsv[22] = "When they blew the three hundred trumpets, the LORD set every man\'s sword against his fellow and against all the army; and the army fled as far as Beth-shit\'tah toward Zer\'erah, as far as the border of A\'bel-meho\'lah, by Tabbath.";
asv[22] = "And they blew the three hundred trumpets, and Jehovah set every man\'s sword against his fellow, and against all the host; and the host fled as far as Beth-shittah toward Zererah, as far as the border of Abel-meholah, by Tabbath.";
yng[22] = "and the three hundred blow the trumpets, and Jehovah setteth the sword of each against his companion, even through all the camp; and the camp fleeth unto Beth-Shittah, at Zererath, unto the border of Abel-Meholah, by Tabbath.";
dby[22] = "And the three hundred blew the trumpets, and Jehovah set every man\'s sword against his fellow, even throughout the camp. And the host fled to Beth-shittah towards Zererah, to the border of Abel-meholah, by Tabbath.";
web[22] = "And the three hundred blew the trumpets, and the LORD set every man\'s sword against his fellow, even throughout all the host: and the host fled to Beth-shittah in Zereroth, [and] to the border of Abel-meholah, to Tabbath.";
hnv[22] = "They blew the three hundred trumpets, and the LORD set every man\'s sword against his fellow, and against all the host; and the host fled as far as Beth-shittah toward Tzererah, as far as the border of Avel-Mecholah, by Tabbat.";
vul[22] = "et nihilominus insistebant trecenti viri bucinis personantes inmisitque Dominus gladium in omnibus castris et mutua se caede truncabant";
kjv[23] = "And the men of Israel gathered themselves together out of Naphtali, and out of Asher, and out of all Manasseh, and pursued after the Midianites.";
rsv[23] = "And the men of Israel were called out from Naph\'tali and from Asher and from all Manas\'seh, and they pursued after Mid\'ian.";
asv[23] = "And the men of Israel were gathered together out of Naphtali, and out of Asher, and out of all Manasseh, and pursued after Midian.";
yng[23] = "And the men of Israel are called from Naphtali, and from Asher, and from all Manasseh, and pursue after Midian.";
dby[23] = "And the men of Israel were called together out of Naphtali, and out of Asher, and out of all Manasseh, and pursued after Midian.";
web[23] = "And the men of Israel assembled out of Naphtali, and out of Asher, and out of all Manasseh, and pursued the Midianites.";
hnv[23] = "The men of Yisra\'el were gathered together out of Naftali, and out of Asher, and out of all Menashsheh, and pursued after Midyan.";
vul[23] = "fugientes usque Bethseta et crepidinem Abelmeula in Tebbath conclamantes autem viri Israhel de Nepthali et Aser et omni Manasse persequebantur Madian";
kjv[24] = "And Gideon sent messengers throughout all mount Ephraim, saying, Come down against the Midianites, and take before them the waters unto Bethbarah and Jordan. Then all the men of Ephraim gathered themselves together, and took the waters unto Bethbarah and Jordan.";
rsv[24] = "And Gideon sent messengers throughout all the hill country of E\'phraim, saying, &quot;Come down against the Mid\'ianites and seize the waters against them, as far as Beth-bar\'ah, and also the Jordan.&quot; So all the men of E\'phraim were called out, and they seized the waters as far as Beth-bar\'ah, and also the Jordan.";
asv[24] = "And Gideon sent messengers throughout all the hill-country of Ephraim, saying, Come down against Midian, and take before them the waters, as far as Beth-barah, even the Jordan. So all the men of Ephraim were gathered together, and took the waters as far as Beth-barah, even the Jordan.";
yng[24] = "And messengers hath sent Gideon into all the hill-country of Ephraim, saying, `Come down to meet Midian, and capture before them the waters unto Beth-Barah, and the Jordan;\' and every man of Ephraim is called, and they capture the waters unto Beth-Barah, and the Jordan,";
dby[24] = "And Gideon sent messengers throughout mount Ephraim, saying, Come down against Midian, and take before them the waters unto Beth-barah, and the Jordan. And all the men of Ephraim were called together, and took the waters unto Beth-barah, and the Jordan.";
web[24] = "And Gideon sent messengers throughout all mount Ephraim, saying, Come down against the Midianites, and take before them the waters to Beth-barah and Jordan. Then all the men of Ephraim assembled, and took the waters to Beth-barah and Jordan.";
hnv[24] = "Gid`on sent messengers throughout all the hill-country of Efrayim, saying, Come down against Midyan, and take before them the waters, as far as Beit-Barah, even the Yarden. So all the men of Efrayim were gathered together, and took the waters as far as Beit-Barah, even the Yarden.";
vul[24] = "misitque Gedeon nuntios in omnem montem Ephraim dicens descendite in occursum Madian et occupate aquas usque Bethbera atque Iordanem clamavitque omnis Ephraim et praeoccupavit aquas atque Iordanem usque Bethbera";
kjv[25] = "And they took two princes of the Midianites, Oreb and Zeeb; and they slew Oreb upon the rock Oreb, and Zeeb they slew at the winepress of Zeeb, and pursued Midian, and brought the heads of Oreb and Zeeb to Gideon on the other side Jordan.";
rsv[25] = "And they took the two princes of Mid\'ian, Oreb and Zeeb; they killed Oreb at the rock of Oreb, and Zeeb they killed at the wine press of Zeeb, as they pursued Mid\'ian; and they brought the heads of Oreb and Zeeb to Gideon beyond the Jordan.";
asv[25] = "And they took the two princes of Midian, Oreb and Zeeb; and they slew Oreb at the rock of Oreb, and Zeeb they slew at the winepress of Zeeb, and pursued Midian: and they brought the heads of Oreb and Zeeb to Gideon beyond the Jordan.";
yng[25] = "and they capture two of the heads of Midian, Oreb, and Zeeb, and slay Oreb at the rock of Oreb, and Zeeb they have slain at the wine-vat of Zeeb, and they pursue unto Midian; and the heads of Oreb and Zeeb they have brought in unto Gideon beyond the Jordan.";
dby[25] = "And they took two princes of Midian, Oreb and Zeeb; and they slew Oreb upon the rock Oreb, and Zeeb they slew at the winepress of Zeeb; and they pursued Midian, and brought the heads of Oreb and Zeeb to Gideon beyond the Jordan.";
web[25] = "And they took two princes of the Midianites, Oreb and Zeeb; and they slew Oreb upon the rock Oreb, and Zeeb they slew at the wine-press of Zeeb, and pursued Midian, and brought the heads of Oreb and Zeeb to Gideon on the other side of Jordan.";
hnv[25] = "They took the two princes of Midyan, `Orev and Ze\'ev; and they killed `Orev at the rock of `Orev, and Ze\'ev they killed at the winepress of Ze\'ev, and pursued Midyan: and they brought the heads of `Orev and Ze\'ev to Gid`on beyond the Yarden.";
vul[25] = "adprehensosque duos viros Madian Oreb et Zeb interfecit Oreb in petra Oreb Zeb vero in torculari Zeb et persecuti sunt Madian capita Oreb et Zeb portantes ad Gedeon trans fluenta Iordanis";
