csb[1] = "After Abimelech, Tola son of Puah, son of Dodo became judge and began to deliver Israel. He was from Issachar and lived in Shamir in the hill country of Ephraim.";
csb[2] = "Tola judged Israel twenty-three years and when he died, was buried in Shamir.";
csb[3] = "After him came Jair the Gileadite, who judged Israel twenty-two years.";
csb[4] = "He had thirty sons who rode on thirty donkeys. They had thirty towns in Gilead, which are still called Jair\'s Villages today.";
csb[5] = "When Jair died, he was buried in Kamon.";
csb[6] = "Then the Israelites again did what was evil in the sight of the LORD. They worshiped the Baals and the Ashtoreths, the gods of Aram, Sidon, and Moab, and the gods of the Ammonites and the Philistines. They abandoned the LORD and did not worship him.";
csb[7] = "So the LORD\'s anger burned against Israel, and he sold them to the Philistines and the Ammonites.";
csb[8] = "They shattered and crushed the Israelites that year, and for eighteen years they did the same to all the Israelites who were on the other side of the Jordan in the land of the Amorites in Gilead.";
csb[9] = "The Ammonites also crossed the Jordan to fight against Judah, Benjamin, and the house of Ephraim. Israel was greatly oppressed,";
csb[10] = "so they cried out to the LORD, saying, &quot;We have sinned against you. We have abandoned our God and worshiped the Baals.&quot;";
csb[11] = "The LORD said to the Israelites, &quot;When the Egyptians, Amorites, Ammonites, Philistines,";
csb[12] = "&quot;Sidonians, Amalekites, and Maonites oppressed you, and you cried out to me, did I not deliver you from them?";
csb[13] = "&quot;But you have abandoned me and worshiped other gods. Therefore, I will not deliver you again.";
csb[14] = "&quot;Go and cry out to the gods you have chosen. Let them deliver you whenever you are oppressed.&quot;";
csb[15] = "But the Israelites said, &quot;We have sinned. Deal with us as you see fit; only rescue us today! &quot;";
csb[16] = "So they got rid of the foreign gods among them and worshiped the LORD, and he became weary of Israel\'s misery.";
csb[17] = "The Ammonites were called together, and they camped in Gilead. So the Israelites assembled and camped at Mizpah.";
csb[18] = "The rulers of Gilead said to one another, &quot;Which man will begin the fight against the Ammonites? He will be the leader of all the inhabitants of Gilead.&quot;";
kjv[1] = "And after Abimelech there arose to defend Israel Tola the son of Puah, the son of Dodo, a man of Issachar; and he dwelt in Shamir in mount Ephraim.";
rsv[1] = "After Abim\'elech there arose to deliver Israel Tola the son of Pu\'ah, son of Dodo, a man of Is\'sachar; and he lived at Shamir in the hill country of E\'phraim.";
asv[1] = "And after Abimelech there arose to save Israel Tola the son of Puah, the son of Dodo, a man of Issachar; and he dwelt in Shamir in the hill-country of Ephraim.";
yng[1] = "And there riseth after Abimelech, to save Israel, Tola son of Puah, son of Dodo, a man of Issachar, and he is dwelling in Shamir, in the hill-country of Ephraim,";
dby[1] = "And after Abimelech, there rose up to save Israel Tola the son of Puah, the son of Dodo, a man of Issachar; and he dwelt in Shamir on mount Ephraim.";
web[1] = "And after Abimelech there arose to defend Israel Tola the son of Puah, the son of Dodo, a man of Issachar; and he dwelt in Shamir in mount Ephraim.";
hnv[1] = "After Avimelekh there arose to save Yisra\'el Tola the son of Pu`ah, the son of Dodo, a man of Yissakhar; and he lived in Shamir in the hill-country of Efrayim.";
vul[1] = "post Abimelech surrexit dux in Israhel Thola filius Phoa patrui Abimelech vir de Isachar qui habitavit in Sanir montis Ephraim";

kjv[6] = "And the children of Israel did evil again in the sight of the LORD, and served Baalim, and Ashtaroth, and the gods of Syria, and the gods of Zidon, and the gods of Moab, and the gods of the children of Ammon, and the gods of the Philistines, and forsook the LORD, and served not him.";
rsv[6] = "And the people of Israel again did what was evil in the sight of the LORD, and served the Ba\'als and the Ash\'taroth, the gods of Syria, the gods of Sidon, the gods of Moab, the gods of the Ammonites, and the gods of the Philistines; and they forsook the LORD, and did not serve him.";
asv[6] = "And the children of Israel again did that which was evil in the sight of Jehovah, and served the Baalim, and the Ashtaroth, and the gods of Syria, and the gods of Sidon, and the gods of Moab, and the gods of the children of Ammon, and the gods of the Philistines; and they forsook Jehovah, and served him not.";
yng[6] = "And the sons of Israel add to do the evil thing in the eyes of Jehovah, and serve the Baalim, and Ashtaroth, and the gods of Aram, and the gods of Zidon, and the gods of Moab, and the gods of the Bene-Ammon, and the gods of the Philistines, and forsake Jehovah, and have not served Him;";
dby[6] = "And the children of Israel again did evil in the sight of Jehovah, and served the Baals, and the Ashtoreths, and the gods of Syria, and the gods of Zidon, and the gods of Moab, and the gods of the children of Ammon, and the gods of the Philistines; and they forsook Jehovah, and served him not.";

vul[6] = "filii autem Israhel peccatis veteribus iungentes nova fecerunt malum in conspectu Domini et servierunt idolis Baalim et Astharoth et diis Syriae ac Sidonis et Moab et filiorum Ammon et Philisthim dimiseruntque Dominum et non colebant eum";

yng[9] = "And the Bene-Ammon pass over the Jordan to fight also against Judah, and against Benjamin, and against the house of Ephraim, and Israel hath great distress.";
