csb[1] = "Samson went down to Timnah and saw a young Philistine woman there.";
csb[2] = "He went back and told his father and his mother: &quot;I have seen a young Philistine woman in Timnah. Now get her for me as a wife.&quot;";
csb[3] = "But his father and mother said to him, &quot;Can\'t you find a young woman among your relatives or among any of our people? Must you go to the uncircumcised Philistines for a wife? &quot; But Samson told his father, &quot;Get her for me. She\'s the right one for me.&quot;&#x2009;";
csb[4] = "Now his father and mother did not know this was from the LORD, who wanted the Philistines to provide an opportunity for a confrontation. At that time, the Philistines were ruling Israel.";
csb[5] = "Samson went down to Timnah with his father and mother and came to the vineyards of Timnah. Suddenly a young lion came roaring at him,";
csb[6] = "the Spirit of the LORD came powerfully on him, and he tore the lion apart with his bare hands as he might have torn a young goat. But he did not tell his father or mother what he had done.";
csb[7] = "Then he went and spoke to the woman, because she seemed right to Samson.";
csb[8] = "After some time, when he returned to marry her, he left the road to see the lion\'s carcass, and there was a swarm of bees with honey in the carcass.";
csb[9] = "He scooped some honey into his hands and ate it as he went along. When he came to his father and mother, he gave some to them and they ate it. But he did not tell them that he had scooped the honey from the lion\'s carcass.";
csb[10] = "His father went to visit the woman, and Samson prepared a feast there, as young men were accustomed to do.";
csb[11] = "When the Philistines saw him, they brought thirty men to accompany him.";
csb[12] = "&quot;Let me tell you a riddle,&quot; Samson said to them. &quot;If you can explain it to me during the seven days of the feast and figure it out, I will give you thirty linen garments and thirty changes of clothes.";
csb[13] = "&quot;But if you can\'t explain it to me, you must give me thirty linen garments and thirty changes of clothes.&quot; &quot;Tell us your riddle,&quot; they replied. &quot;Let\'s hear it.&quot;";
csb[14] = "So he said to them: Out of the eater came something to eat, and out of the strong came something sweet. After three days, they were unable to explain the riddle.";
csb[15] = "On the fourth day they said to Samson\'s wife, &quot;Persuade your husband to explain the riddle to us, or we will burn you and your father\'s family to death. Did you invite us here to rob us? &quot;";
csb[16] = "So Samson\'s wife came to him, weeping, and said, &quot;You hate me and don\'t love me! You told my people the riddle, but haven\'t explained it to me.&quot; &quot;Look,&quot; he said, &quot;I haven\'t even explained it to my father or mother, so why should I explain it to you? &quot;";
csb[17] = "She wept the whole seven days of the feast, and at last, on the seventh day, he explained it to her, because she had nagged him so much. Then she explained it to her people.";
csb[18] = "On the seventh day, before sunset, the men of the city said to him: What is sweeter than honey? What is stronger than a lion? So he said to them: If you hadn\'t plowed with my young cow, you wouldn\'t know my riddle now!";
csb[19] = "The Spirit of the LORD came powerfully on him, and he went down to Ashkelon and killed thirty of their men. He stripped them and gave their clothes to those who had explained the riddle. In a rage, Samson returned to his father\'s house,";
csb[20] = "and his wife was given to one of the men who had accompanied him.";

kjv[3] = "Then his father and his mother said unto him, [Is there] never a woman among the daughters of thy brethren, or among all my people, that thou goest to take a wife of the uncircumcised Philistines? And Samson said unto his father, Get her for me; for she pleaseth me well.";
rsv[3] = "But his father and mother said to him, &quot;Is there not a woman among the daughters of your kinsmen, or among all our people, that you must go to take a wife from the uncircumcised Philistines?&quot; But Samson said to his father, &quot;Get her for me; for she pleases me well.&quot;";
asv[3] = "Then his father and his mother said unto him, Is there never a woman among the daughters of thy brethren, or among all my people, that thou goest to take a wife of the uncircumcised Philistines? And Samson said unto his father, Get her for me; for she pleaseth me well.";
yng[3] = "And his father saith to him -- also his mother, `Is there not among the daughters of thy brethren, and among all my people, a woman, that thou art going to take a woman from the uncircumcised Philistines?\' and Samson saith unto his father, `Take her for me, for she is right in mine eyes.\'";

web[16] = "And Samson\'s wife wept before him, and said, Thou dost but hate me, and lovest me not: thou hast proposed a riddle to the children of my people, and hast not told [it] to me. And he said to her, Behold, I have not told [it] to my father nor to my mother, and shall I tell [it] to thee?";
hnv[16] = "Shimshon\'s wife wept before him, and said, You do but hate me, and don\'t love me: you have put forth a riddle to the children of my people, and haven\'t told it me. He said to her, Behold, I haven\'t told it my father nor my mother, and shall I tell you?";
vul[16] = "quae fundebat apud Samson lacrimas et querebatur dicens odisti me et non diligis idcirco problema quod proposuisti filiis populi mei non vis mihi exponere at ille respondit patri meo et matri nolui dicere et tibi indicare potero";
kjv[17] = "And she wept before him the seven days, while their feast lasted: and it came to pass on the seventh day, that he told her, because she lay sore upon him: and she told the riddle to the children of her people.";
rsv[17] = "She wept before him the seven days that their feast lasted; and on the seventh day he told her, because she pressed him hard. Then she told the riddle to her countrymen.";
asv[17] = "And she wept before him the seven days, while their feast lasted: and it came to pass on the seventh day, that he told her, because she pressed him sore; and she told the riddle to the children of her people.";
yng[17] = "And she weepeth for it the seven days [in] which their banquet hath been, and it cometh to pass on the seventh day that he declareth [it] to her, for she hath distressed him; and she declareth the riddle to the sons of her people.";
dby[17] = "And she wept before him the seven days, while they had the feast. And it came to pass on the seventh day, that he explained it to her, for she pressed him. And she explained the riddle to the children of her people.";
web[17] = "And she wept before him the seven days, while their feast lasted: and it came to pass on the seventh day, that he told her, because she urged him: and she told the riddle to the children of her people.";
hnv[17] = "She wept before him the seven days, while their feast lasted: and it happened on the seventh day, that he told her, because she pressed him sore; and she told the riddle to the children of her people.";
vul[17] = "septem igitur diebus convivii flebat apud eum tandemque die septimo cum ei molesta esset exposuit quae statim indicavit civibus suis";
kjv[18] = "And the men of the city said unto him on the seventh day before the sun went down, What [is] sweeter than honey? and what [is] stronger than a lion? And he said unto them, If ye had not plowed with my heifer, ye had not found out my riddle.";
rsv[18] = "And the men of the city said to him on the seventh day before the sun went down, &quot;What is sweeter than honey? What is stronger than a lion?&quot; And he said to them, &quot;If you had not plowed with my heifer, you would not have found out my riddle.&quot;";

yng[18] = "And the men of the city say to him on the seventh day, before the sun goeth in: -- `What [is] sweeter than honey? And what stronger than a lion?\' And he saith to them: `Unless ye had ploughed with my heifer, Ye had not found out my riddle.\'";

vul[18] = "et illi dixerunt ei die septimo ante solis occubitum quid dulcius melle et quid leone fortius qui ait ad eos si non arassetis in vitula mea non invenissetis propositionem meam";
kjv[19] = "And the Spirit of the LORD came upon him, and he went down to Ashkelon, and slew thirty men of them, and took their spoil, and gave change of garments unto them which expounded the riddle. And his anger was kindled, and he went up to his father\'s house.";
rsv[19] = "And the Spirit of the LORD came mightily upon him, and he went down to Ash\'kelon and killed thirty men of the town, and took their spoil and gave the festal garments to those who had told the riddle. In hot anger he went back to his father\'s house.";
asv[19] = "And the Spirit of Jehovah came mightily upon him, and he went down to Ashkelon, and smote thirty men of them, and took their spoil, and gave the changes [of raiment] unto them that declared the riddle. And his anger was kindled, and he went up to his father\'s house.";
yng[19] = "And the Spirit of Jehovah prospereth over him, and he goeth down to Ashkelon, and smiteth of them thirty men, and taketh their armour, and giveth the changes to those declaring the riddle; and his anger burneth, and he goeth up to the house of his father;";
dby[19] = "And the Spirit of Jehovah came upon him, and he went down to Ashkelon, and slew of them thirty men, and took their spoil, and gave the changes of garments unto them that explained the riddle. And his anger was kindled, and he went up to his father\'s house.";
