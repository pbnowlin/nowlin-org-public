csb[1] = "There was a man from the hill country of Ephraim named Micah.";
csb[2] = "He said to his mother, &quot;The 1,100 pieces of silver taken from you, and that I heard you place a curse on -- here\'s the silver. I took it.&quot; Then his mother said, &quot;My son, may you be blessed by the LORD! &quot;";
csb[3] = "He returned the 1,100 pieces of silver to his mother, and his mother said, &quot;I personally consecrate the silver to the LORD for my son\'s benefit to make a carved image and a silver idol. I will give it back to you.&quot;";
csb[4] = "So he returned the silver to his mother, and she took five pounds of silver and gave it to a silversmith. He made it into a carved image and a silver idol, and it was in Micah\'s house.";
csb[5] = "This man Micah had a shrine, and he made an ephod and household idols, and installed one of his sons to be his priest.";
csb[6] = "In those days there was no king in Israel; everyone did whatever seemed right to him.";
csb[7] = "There was a young man, a Levite from Bethlehem in Judah, who was staying within the clan of Judah.";
csb[8] = "The man left the town of Bethlehem in Judah to stay wherever he could find a place. On his way he came to Micah\'s home in the hill country of Ephraim.";
csb[9] = "&quot;Where do you come from? &quot; Micah asked him. He answered him, &quot;I am a Levite from Bethlehem in Judah, and I\'m going to stay wherever I can find a place.&quot;";
csb[10] = "Micah replied, &quot;Stay with me and be my father and priest, and I will give you four ounces of silver a year, along with your clothing and provisions.&quot; So the Levite went in";
csb[11] = "and agreed to stay with the man, and the young man became like one of his sons.";
csb[12] = "Micah consecrated the Levite, and the young man became his priest and lived in Micah\'s house.";
csb[13] = "Then Micah said, &quot;Now I know that the LORD will be good to me, because a Levite has become my priest.&quot;";

kjv[2] = "And he said unto his mother, The eleven hundred [shekels] of silver that were taken from thee, about which thou cursedst, and spakest of also in mine ears, behold, the silver [is] with me; I took it. And his mother said, Blessed [be thou] of the LORD, my son.";
rsv[2] = "And he said to his mother, &quot;The eleven hundred pieces of silver which were taken from you, about which you uttered a curse, and also spoke it in my ears, behold, the silver is with me; I took it.&quot; And his mother said, &quot;Blessed be my son by the LORD.&quot;";
asv[2] = "And he said unto his mother, The eleven hundred [pieces] of silver that were taken from thee, about which thou didst utter a curse, and didst also speak it in mine ears, behold, the silver is with me; I took it. And his mother said, Blessed be my son of Jehovah.";
yng[2] = "and he saith to his mother, `The eleven hundred silverlings which have been taken of thine, and [of which] thou hast sworn, and also spoken in mine ears; lo, the silver [is] with me, I have taken it;\' and his mother saith, `Blessed [is] my son of Jehovah.\'";
dby[2] = "And he said to his mother, The eleven hundred silver-pieces that were taken from thee, and about which thou didst curse and speak of in mine ears, behold, the silver is with me; I took it. And his mother said, Blessed be my son of Jehovah!";
web[2] = "And he said to his mother, The eleven hundred [shekels] of silver that were taken from thee, about which thou didst curse, and speak of also in my ears, behold, the silver [is] with me; I took it. And his mother said, Blessed [be thou] of the LORD, my son.";
hnv[2] = "He said to his mother, The eleven hundred [pieces] of silver that were taken from you, about which you did utter a curse, and did also speak it in my ears, behold, the silver is with me; I took it. His mother said, Blessed be my son of the LORD.";
vul[2] = "qui dixit matri suae mille centum argenteos quos separaveras tibi et super quibus me audiente iuraveras ecce ego habeo et apud me sunt cui illa respondit benedictus filius meus Domino";
kjv[3] = "And when he had restored the eleven hundred [shekels] of silver to his mother, his mother said, I had wholly dedicated the silver unto the LORD from my hand for my son, to make a graven image and a molten image: now therefore I will restore it unto thee.";
rsv[3] = "And he restored the eleven hundred pieces of silver to his mother; and his mother said, &quot;I consecrate the silver to the LORD from my hand for my son, to make a graven image and a molten image; now therefore I will restore it to you.&quot;";
asv[3] = "And he restored the eleven hundred [pieces] of silver to his mother; and his mother said, I verily dedicate the silver unto Jehovah from my hand for my son, to make a graven image and a molten image: now therefore I will restore it unto thee.";
yng[3] = "And he giveth back the eleven hundred silverlings to his mother, and his mother saith, `I had certainly sanctified the silver to Jehovah, from my hand, for my son, to make a graven image, and a molten image; and now, I give it back to thee.\'";
dby[3] = "And he restored the eleven hundred silver-pieces to his mother; and his mother said, I had dedicated the silver to Jehovah from my hand for my son, to make a graven image and a molten image; and now I will restore it to thee.";
web[3] = "And when he had restored the eleven hundred [shekels] of silver to his mother, his mother said, I had wholly dedicated the silver to the LORD from my hand for my son, to make a graven image and a molten image: now therefore I will restore it to thee.";
hnv[3] = "He restored the eleven hundred [pieces] of silver to his mother; and his mother said, I most assuredly dedicate the silver to the LORD from my hand for my son, to make an engraved image and a molten image: now therefore I will restore it to you.";
vul[3] = "reddidit ergo eos matri suae quae dixerat ei consecravi et vovi argentum hoc Domino ut de manu mea suscipiat filius meus et faciat sculptile atque conflatile et nunc trado illud tibi";

dby[4] = "Now he restored the silver to his mother; and his mother took two hundred silver-pieces and gave them to the founder, and he made of them a graven image and a molten image; and they were in the house of Micah.";
