csb[1] = "The men of Ephraim said to him, &quot;Why have you done this to us, not calling us when you went to fight against the Midianites? &quot; And they argued with him violently.";
csb[2] = "So he said to them, &quot;What have I done now compared to you? Is not the gleaning of Ephraim better than the grape harvest of Abiezer?";
csb[3] = "&quot;God handed over to you Oreb and Zeeb, the two princes of Midian. What was I able to do compared to you? &quot; When he said this, their anger against him subsided.";
csb[4] = "Gideon and the three hundred men came to the Jordan and crossed it. They were exhausted but still in pursuit.";
csb[5] = "He said to the men of Succoth, &quot;Please give some loaves of bread to the troops under my command, because they are exhausted, for I am pursuing Zebah and Zalmunna, the kings of Midian.&quot;";
csb[6] = "But the princes of Succoth asked, &quot;Are Zebah and Zalmunna now in your hands that we should give bread to your army? &quot;";
csb[7] = "Gideon replied, &quot;Very well, when the LORD has handed Zebah and Zalmunna over to me, I will tear your flesh with thorns and briers from the wilderness! &quot;";
csb[8] = "He went from there to Penuel and asked the same thing from them. The men of Penuel answered just as the men of Succoth had answered.";
csb[9] = "He also told the men of Penuel, &quot;When I return safely, I will tear down this tower! &quot;";
csb[10] = "Now Zebah and Zalmunna were in Karkor, and with them was their army of about fifteen thousand men, who were all those left of the entire army of the Qedemites. Those who had been killed were one hundred twenty thousand armed men.";
csb[11] = "Gideon traveled on the caravan route east of Nobah and Jogbehah and attacked their army while the army felt secure.";
csb[12] = "Zebah and Zalmunna fled, and he pursued them. He captured these two kings of Midian and routed the entire army.";
csb[13] = "Gideon son of Joash returned from the battle by the Ascent of Heres.";
csb[14] = "He captured a youth from the men of Succoth and interrogated him. The youth wrote down for him the names of the seventy-seven leaders and elders of Succoth.";
csb[15] = "Then he went to the men of Succoth and said, &quot;Here are Zebah and Zalmunna. You taunted me about them, saying, \'Are Zebah and Zalmunna now in your power that we should give bread to your exhausted men? \' &quot;";
csb[16] = "So he took the elders of the city, and he took some thorns and briers from the wilderness, and he disciplined the men of Succoth with them.";
csb[17] = "He also tore down the tower of Penuel and killed the men of the city.";
csb[18] = "He asked Zebah and Zalmunna, &quot;What kind of men did you kill at Tabor? &quot; &quot;They were like you,&quot; they said. &quot;Each resembled the son of a king.&quot;";
csb[19] = "So he said, &quot;They were my brothers, the sons of my mother! As the LORD lives, if you had let them live, I would not kill you.&quot;";
csb[20] = "Then he said to Jether, his firstborn, &quot;Get up and kill them.&quot; The youth did not draw his sword, for he was afraid because he was still a youth.";
csb[21] = "Zebah and Zalmunna said, &quot;Get up and strike us down yourself, for a man is judged by his strength.&quot; So Gideon got up, killed Zebah and Zalmunna, and took the crescent ornaments that were on the necks of their camels.";
csb[22] = "Then the Israelites said to Gideon, &quot;Rule over us, you as well as your sons and your grandsons, for you delivered us from the power of Midian.&quot;";
csb[23] = "But Gideon said to them, &quot;I will not rule over you, and my son will not rule over you; the LORD will rule over you.&quot;";
csb[24] = "Then he said to them, &quot;Let me make a request of you: Everyone give me an earring from his plunder.&quot; Now the enemy had gold earrings because they were Ishmaelites.";
csb[25] = "They said, &quot;We agree to give them.&quot; So they spread out a cloak, and everyone threw an earring from his plunder on it.";
csb[26] = "The weight of the gold earrings he requested was forty-three pounds of gold, in addition to the crescent ornaments and ear pendants, the purple garments on the kings of Midian, and the chains on the necks of their camels.";
csb[27] = "Gideon made an ephod from all this and put it in Ophrah, his hometown. Then all Israel prostituted themselves by worshiping it there, and it became a snare to Gideon and his household.";
csb[28] = "So Midian was subdued before the Israelites, and they were no longer a threat. The land had peace for forty years during the days of Gideon.";
csb[29] = "Jerubbaal (that is, Gideon) son of Joash went back to live at his house.";
csb[30] = "Gideon had seventy sons, his own offspring, since he had many wives.";
csb[31] = "His concubine who was in Shechem also bore him a son, and he named him Abimelech.";
csb[32] = "Then Gideon son of Joash died at a good old age and was buried in the tomb of his father Joash in Ophrah of the Abiezrites.";
csb[33] = "When Gideon died, the Israelites turned and prostituted themselves by worshiping the Baals and made Baal-berith their god.";
csb[34] = "The Israelites did not remember the LORD their God who had rescued them from the hand of the enemies around them.";
csb[35] = "They did not show kindness to the house of Jerubbaal (that is, Gideon) for all the good he had done for Israel.";

dby[16] = "And he took the elders of the city, and thorns of the wilderness and briars, and with them he taught the men of Succoth.";
web[16] = "And he took the elders of the city, and thorns of the wilderness, and briers, and with them he taught the men of Succoth.";
hnv[16] = "He took the Zakenim of the city, and thorns of the wilderness and briers, and with them he taught the men of Sukkot.";
vul[16] = "tulit ergo seniores civitatis et spinas deserti ac tribulos et contrivit cum eis atque comminuit viros Soccoth";
kjv[17] = "And he beat down the tower of Penuel, and slew the men of the city.";
rsv[17] = "And he broke down the tower of Penu\'el, and slew the men of the city.";
asv[17] = "And he brake down the tower of Penuel, and slew the men of the city.";
yng[17] = "and the tower of Penuel he hath broken down, and slayeth the men of the city.";
dby[17] = "And he broke down the tower of Penuel, and slew the men of the city.";
web[17] = "And he beat down the tower of Penuel, and slew the men of the city.";
hnv[17] = "He broke down the tower of Penu\'el, and killed the men of the city.";
vul[17] = "turrem quoque Phanuhel subvertit occisis habitatoribus civitatis";
kjv[18] = "Then said he unto Zebah and Zalmunna, What manner of men [were they] whom ye slew at Tabor? And they answered, As thou [art], so [were] they; each one resembled the children of a king.";
rsv[18] = "Then he said to Zebah and Zalmun\'na, &quot;Where are the men whom you slew at Tabor?&quot; They answered, &quot;As you are, so were they, every one of them; they resembled the sons of a king.&quot;";
asv[18] = "Then said he unto Zebah and Zalmunna, What manner of men were they whom ye slew at Tabor? And they answered, As thou art, so were they; each one resembled the children of a king.";
yng[18] = "And he saith unto Zebah and unto Zalmunna, `How -- the men whom ye slew in Tabor?\' and they say, `As thou -- so they, one -- as the form of the king\'s sons.\'";
dby[18] = "Then said he to Zebah and Zalmunna, What sort of men were they that ye slew at Tabor? And they answered, As thou art, so were they; each one resembled the sons of a king.";
web[18] = "Then said he to Zebah and Zalmunna, What manner of men [were they] whom ye slew at Tabor? And they answered, As thou [art], so [were] they; each one resembled the children of a king.";
hnv[18] = "Then said he to Zevach and Tzalmunnah, What manner of men were they whom you killed at Tavor? They answered, As you are, so were they; each one resembled the children of a king.";
vul[18] = "dixitque ad Zebee et Salmana quales fuerunt viri quos occidistis in Thabor qui responderunt similes tui et unus ex eis quasi filius regis";
kjv[19] = "And he said, They [were] my brethren, [even] the sons of my mother: [as] the LORD liveth, if ye had saved them alive, I would not slay you.";
rsv[19] = "And he said, &quot;They were my brothers, the sons of my mother; as the LORD lives, if you had saved them alive, I would not slay you.&quot;";
asv[19] = "And he said, They were my brethren, the sons of my mother: as Jehovah liveth, if ye had saved them alive, I would not slay you.";
yng[19] = "And he saith, `My brethren -- sons of my mother -- they; Jehovah liveth, if ye had kept them alive -- I had not slain you.\'";
dby[19] = "And he said, They were my brethren, the sons of my mother. [As] Jehovah liveth, if ye had saved them alive, I would not slay you.";
web[19] = "And he said, They [were] my brethren, [even] the sons of my mother: [as] the LORD liveth, if ye had saved them alive, I would not slay you.";
hnv[19] = "He said, They were my brothers, the sons of my mother: as the LORD lives, if you had saved them alive, I would not kill you.";
vul[19] = "quibus ille ait fratres mei fuerunt filii matris meae vivit Dominus si servassetis eos non vos occiderem";
kjv[20] = "And he said unto Jether his firstborn, Up, [and] slay them. But the youth drew not his sword: for he feared, because he [was] yet a youth.";
rsv[20] = "And he said to Jether his first-born, &quot;Rise, and slay them.&quot; But the youth did not draw his sword; for he was afraid, because he was still a youth.";
asv[20] = "And he said unto Jether his first-born, Up, and slay them. But the youth drew not his sword; for he feared, because he was yet a youth.";
yng[20] = "And he saith to Jether his first-born, `Rise, slay them;\' and the young man hath not drawn his sword, for he hath been afraid, for he [is] yet a youth.";
dby[20] = "And he said to Jether his firstborn, Arise, slay them! But the youth drew not his sword; for he feared, because he was yet a youth.";
web[20] = "And he said to Jether his first-born, Arise, [and] slay them. But the youth drew not his sword: for he feared, because he [was] yet a youth.";
hnv[20] = "He said to Yeter his firstborn, Up, and kill them. But the youth didn\'t draw his sword; for he feared, because he was yet a youth.";
vul[20] = "dixitque Ietther primogenito suo surge et interfice eos qui non eduxit gladium timebat enim quia adhuc puer erat";
kjv[21] = "Then Zebah and Zalmunna said, Rise thou, and fall upon us: for as the man [is, so is] his strength. And Gideon arose, and slew Zebah and Zalmunna, and took away the ornaments that [were] on their camels\' necks.";
rsv[21] = "Then Zebah and Zalmun\'na said, &quot;Rise yourself, and fall upon us; for as the man is, so is his strength.&quot; And Gideon arose and slew Zebah and Zalmun\'na; and he took the crescents that were on the necks of their camels.";
asv[21] = "Then Zebah and Zalmunna said, Rise thou, and fall upon us; for as the man is, so is his strength. And Gideon arose, and slew Zebah and Zalmunna, and took the crescents that were on their camels\' necks.";
yng[21] = "And Zebah saith -- also Zalmunna -- `Rise thou, and fall upon us; for as the man -- his might;\' and Gideon riseth, and slayeth Zebah and Zalmunna, and taketh their round ornaments which [are] on the necks of their camels.";
dby[21] = "Then Zebah and Zalmunna said, Rise thou, and fall on us; for as is the man, so is his strength. And Gideon arose, and slew Zebah and Zalmunna; and he took the moons that were on their camels\' necks.";
web[21] = "Then Zebah and Zalmunna said, Rise thou, and fall upon us: for as the man [is], [so is] his strength. And Gideon arose, and slew Zebah and Zalmunna, and took away the ornaments that [were] on their camels\' necks.";
hnv[21] = "Then Zevach and Tzalmunnah said, Rise you, and fall on us; for as the man is, so is his strength. Gid`on arose, and killed Zevach and Tzalmunnah, and took the crescents that were on their camels\' necks.";
vul[21] = "dixeruntque Zebee et Salmana tu surge et inrue in nos quia iuxta aetatem robur est hominis surrexit Gedeon et interfecit Zebee et Salmana et tulit ornamenta ac bullas quibus colla regalium camelorum decorari solent";
kjv[22] = "Then the men of Israel said unto Gideon, Rule thou over us, both thou, and thy son, and thy son\'s son also: for thou hast delivered us from the hand of Midian.";
rsv[22] = "Then the men of Israel said to Gideon, &quot;Rule over us, you and your son and your grandson also; for you have delivered us out of the hand of Mid\'ian.&quot;";
asv[22] = "Then the men of Israel said unto Gideon, Rule thou over us, both thou, and thy son, and thy son\'s son also; for thou hast saved us out of the hand of Midian.";
yng[22] = "And the men of Israel say unto Gideon, `Rule over us, both thou, and thy son, and thy son\'s son, for thou hast saved us from the hand of Midian.\'";
dby[22] = "And the men of Israel said to Gideon, Rule over us, both thou, and thy son, and thy son\'s son also; for thou hast saved us from the hand of Midian.";
web[22] = "Then the men of Israel said to Gideon, Rule thou over us, both thou, and thy son, and thy son\'s son also: for thou hast delivered us from the hand of Midian.";
hnv[22] = "Then the men of Yisra\'el said to Gid`on, Rule you over us, both you, and your son, and your son\'s son also; for you have saved us out of the hand of Midyan.";
vul[22] = "dixeruntque omnes viri Israhel ad Gedeon dominare nostri tu et filius tuus et filius filii tui quia liberasti nos de manu Madian";
kjv[23] = "And Gideon said unto them, I will not rule over you, neither shall my son rule over you: the LORD shall rule over you.";
rsv[23] = "Gideon said to them, &quot;I will not rule over you, and my son will not rule over you; the LORD will rule over you.&quot;";
asv[23] = "And Gideon said unto them, I will not rule over you, neither shall my son rule over you: Jehovah shall rule over you.";
yng[23] = "And Gideon saith unto them, `I do not rule over you, nor doth my son rule over you; Jehovah doth rule over you.\'";
dby[23] = "And Gideon said to them, I will not rule over you, neither shall my son rule over you: Jehovah will rule over you.";
web[23] = "And Gideon said to them, I will not rule over you, neither shall my son rule over you: the LORD shall rule over you.";
hnv[23] = "Gid`on said to them, I will not rule over you, neither shall my son rule over you: the LORD shall rule over you.";
vul[23] = "quibus ille ait non dominabor vestri nec dominabitur in vos filius meus sed dominabitur Dominus";
kjv[24] = "And Gideon said unto them, I would desire a request of you, that ye would give me every man the earrings of his prey. (For they had golden earrings, because they [were] Ishmaelites.)";
rsv[24] = "And Gideon said to them, &quot;Let me make a request of you; give me every man of you the earrings of his spoil.&quot; (For they had golden earrings, because they were Ish\'maelites.)";
asv[24] = "And Gideon said unto them, I would make a request of you, that ye would give me every man the ear-rings of his spoil. (For they had golden ear-rings, because they were Ishmaelites.)";
yng[24] = "And Gideon saith unto them, `Let me ask of you a petition, and give ye to me each the ring of his prey, for they have rings of gold, for they [are] Ishmaelites.\'";
dby[24] = "And Gideon said to them, I would desire a request of you: give me every man the earrings of his booty; for they had golden earrings, because they were Ishmaelites.";
web[24] = "And Gideon said to them, I would desire a request of you, that you would give me every man the ear-rings of his prey. (For they had golden ear-rings, because they [were] Ishmaelites.)";
hnv[24] = "Gid`on said to them, I would make a request of you, that you would give me every man the ear-rings of his spoil. (For they had golden ear-rings, because they were Yishme`elim.)";
vul[24] = "dixitque ad eos unam petitionem postulo a vobis date mihi inaures ex praeda vestra inaures enim aureas Ismahelitae habere consuerant";
kjv[25] = "And they answered, We will willingly give [them]. And they spread a garment, and did cast therein every man the earrings of his prey.";
rsv[25] = "And they answered, &quot;We will willingly give them.&quot; And they spread a garment, and every man cast in it the earrings of his spoil.";
asv[25] = "And they answered, We will willingly give them. And they spread a garment, and did cast therein every man the ear-rings of his spoil.";
yng[25] = "And they say, `We certainly give;\' and they spread out the garment, and cast thither each the ring of his prey;";
dby[25] = "And they said, We will willingly give [them]. And they spread a garment, and cast therein every man the earrings of his booty.";
web[25] = "And they answered, We will willingly give [them]. And they spread a garment, and cast into it every man the ear-rings of his prey.";
hnv[25] = "They answered, We will willingly give them. They spread a garment, and did cast therein every man the ear-rings of his spoil.";
vul[25] = "qui responderunt libentissime dabimus expandentesque super terram pallium proiecerunt in eo inaures de praeda";
kjv[26] = "And the weight of the golden earrings that he requested was a thousand and seven hundred [shekels] of gold; beside ornaments, and collars, and purple raiment that [was] on the kings of Midian, and beside the chains that [were] about their camels\' necks.";
rsv[26] = "And the weight of the golden earrings that he requested was one thousand seven hundred shekels of gold; besides the crescents and the pendants and the purple garments worn by the kings of Mid\'ian, and besides the collars that were about the necks of their camels.";
asv[26] = "And the weight of the golden ear-rings that he requested was a thousand and seven hundred [shekels] of gold; besides the crescents, and the pendants, and the purple raiment that was on the kings of Midian, and besides the chains that were about their camels\' necks.";
yng[26] = "and the weight of the rings of gold which he asked is a thousand and seven hundred [shekels] of gold, apart from the round ornaments, and the drops, and the purple garments, which [are] on the kings of Midian, and apart from the chains which [are] on the necks of their camels,";
dby[26] = "And the weight of the golden earrings that he requested was a thousand seven hundred [shekels] of gold; besides the moons, and eardrops, and the purple garments that were on the kings of Midian, and besides the chains that were about their camels\' necks.";
web[26] = "And the weight of the golden ear-rings that he requested, was a thousand and seven hundred [shekels] of gold; besides ornaments, and collars, and purple raiment that [was] on the kings of Midian, and besides the chains that [were] about their camels\' necks.";
hnv[26] = "The weight of the golden ear-rings that he requested was one thousand and seven hundred [shekels] of gold, besides the crescents, and the pendants, and the purple clothing that was on the kings of Midyan, and besides the chains that were about their camels\' necks.";
vul[26] = "et fuit pondus postulatarum inaurium mille septingenti auri sicli absque ornamentis et monilibus et veste purpurea quibus Madian reges uti soliti erant et praeter torques aureos camelorum";
kjv[27] = "And Gideon made an ephod thereof, and put it in his city, [even] in Ophrah: and all Israel went thither a whoring after it: which thing became a snare unto Gideon, and to his house.";
rsv[27] = "And Gideon made an ephod of it and put it in his city, in Ophrah; and all Israel played the harlot after it there, and it became a snare to Gideon and to his family.";
asv[27] = "And Gideon made an ephod thereof, and put it in his city, even in Ophrah: and all Israel played the harlot after it there; and it became a snare unto Gideon, and to his house.";
yng[27] = "and Gideon maketh it into an ephod, and setteth it up in his city, in Ophrah, and all Israel go a-whoring after it there, and it is to Gideon and to his house for a snare.";
dby[27] = "And Gideon made an ephod of them, and put it in his city, in Ophrah. And all Israel went thither a whoring after it; and it became a snare to Gideon, and to his house.";
web[27] = "And Gideon made of it an ephod, and put it in his city, [even] in Ophrah: and all Israel went thither astray after it: which thing became a snare to Gideon, and to his house.";
hnv[27] = "Gid`on made an efod of it, and put it in his city, even in Ofrat: and all Yisra\'el played the prostitute after it there; and it became a snare to Gid`on, and to his house.";
vul[27] = "fecitque ex eo Gedeon ephod et posuit illud in civitate sua Ephra fornicatusque est omnis Israhel in eo et factum est Gedeoni et omni domui eius in ruinam";
kjv[28] = "Thus was Midian subdued before the children of Israel, so that they lifted up their heads no more. And the country was in quietness forty years in the days of Gideon.";
rsv[28] = "So Mid\'ian was subdued before the people of Israel, and they lifted up their heads no more. And the land had rest forty years in the days of Gideon.";
asv[28] = "So Midian was subdued before the children of Israel, and they lifted up their heads no more. And the land had rest forty years in the days of Gideon.";
yng[28] = "And Midian is humbled before the sons of Israel, and have not added to lift up their head; and the land resteth forty years in the days of Gideon.";
dby[28] = "And Midian was subdued before the children of Israel, and they lifted up their heads no more. And the land had rest forty years in the days of Gideon.";
web[28] = "Thus was Midian subdued before the children of Israel, so that they raised their heads no more. And the country was in quietness forty years in the days of Gideon.";
hnv[28] = "So Midyan was subdued before the children of Yisra\'el, and they lifted up their heads no more. The land had rest forty years in the days of Gid`on.";
vul[28] = "humiliatus est autem Madian coram filiis Israhel nec potuerunt ultra elevare cervices sed quievit terra per quadraginta annos quibus praefuit Gedeon";
kjv[29] = "And Jerubbaal the son of Joash went and dwelt in his own house.";
rsv[29] = "Jerubba\'al the son of Jo\'ash went and dwelt in his own house.";
asv[29] = "And Jerubbaal the son of Joash went and dwelt in his own house.";
yng[29] = "And Jerubbaal son of Joash goeth and dwelleth in his own house,";
dby[29] = "And Jerubbaal the son of Joash went and dwelt in his house.";
web[29] = "And Jerubbaal the son of Joash went and dwelt in his own house.";
hnv[29] = "Yerubba`al the son of Yo\'ash went and lived in his own house.";
vul[29] = "abiit itaque Hierobbaal filius Ioas et habitavit in domo sua";
kjv[30] = "And Gideon had threescore and ten sons of his body begotten: for he had many wives.";
rsv[30] = "Now Gideon had seventy sons, his own offspring, for he had many wives.";
asv[30] = "And Gideon had threescore and ten sons of his body begotten; for he had many wives.";
yng[30] = "and to Gideon there have been seventy sons, coming out of his loin, for he had many wives;";
dby[30] = "Now Gideon had seventy sons who had come out of his loins, for he had many wives.";
web[30] = "And Gideon had seventy sons of his body begotten: for he had many wives.";
hnv[30] = "Gid`on had seventy sons conceived from his body; for he had many wives.";
vul[30] = "habuitque septuaginta filios qui egressi sunt de femore eius eo quod plures haberet uxores";
kjv[31] = "And his concubine that [was] in Shechem, she also bare him a son, whose name he called Abimelech.";
rsv[31] = "And his concubine who was in Shechem also bore him a son, and he called his name Abim\'elech.";
asv[31] = "And his concubine that was in Shechem, she also bare him a son, and he called his name Abimelech.";
yng[31] = "and his concubine, who [is] in Shechem, hath born to him -- even she -- a son, and he appointeth his name Abimelech.";
dby[31] = "And his concubine that was in Shechem, she also bore him a son, and he gave him the name of Abimelech.";
web[31] = "And his concubine that [was] in Shechem, she also bore him a son, whose name he called Abimelech.";
hnv[31] = "His concubine who was in Shekhem, she also bore him a son, and he named him Avimelekh.";
vul[31] = "concubina autem illius quam habebat in Sychem genuit ei filium nomine Abimelech";
kjv[32] = "And Gideon the son of Joash died in a good old age, and was buried in the sepulchre of Joash his father, in Ophrah of the Abiezrites.";
rsv[32] = "And Gideon the son of Jo\'ash died in a good old age, and was buried in the tomb of Jo\'ash his father, at Ophrah of the Abiez\'rites.";
asv[32] = "And Gideon the son of Joash died in a good old age, and was buried in the sepulchre of Joash his father, in Ophrah of the Abiezrites.";
yng[32] = "And Gideon son of Joash dieth, in a good old age, and is buried in the burying-place of Joash his father, in Ophrah of the Abi-Ezrite.";
dby[32] = "And Gideon the son of Joash died in a good old age, and was buried in the sepulchre of Joash his father, in Ophrah of the Abi-ezrites.";
web[32] = "And Gideon the son of Joash died in a good old age, and was buried in the sepulcher of Joash his father, in Ophrah of the Abi-ezrites.";
hnv[32] = "Gid`on the son of Yo\'ash died in a good old age, and was buried in the tomb of Yo\'ash his father, in Ofrat of the Abiezrites.";
vul[32] = "mortuusque est Gedeon filius Ioas in senectute bona et sepultus in sepulchro Ioas patris sui in Ephra de familia Ezri";
kjv[33] = "And it came to pass, as soon as Gideon was dead, that the children of Israel turned again, and went a whoring after Baalim, and made Baalberith their god.";
rsv[33] = "As soon as Gideon died, the people of Israel turned again and played the harlot after the Ba\'als, and made Ba\'al-be\'rith their god.";
asv[33] = "And it came to pass, as soon as Gideon was dead, that the children of Israel turned again, and played the harlot after the Baalim, and made Baal-berith their god.";
yng[33] = "And it cometh to pass, when Gideon [is] dead, that the sons of Israel turn back and go a-whoring after the Baalim, and set over them Baal-Berith for a god;";
dby[33] = "And it came to pass when Gideon was dead, that the children of Israel turned again, and went a whoring after the Baals, and set up Baal-Berith as their god.";
web[33] = "And it came to pass as soon as Gideon was dead, that the children of Israel turned again, and went astray after Baalim, and made Baal-berith their god.";
hnv[33] = "It happened, as soon as Gid`on was dead, that the children of Yisra\'el turned again, and played the prostitute after the Ba`alim, and made Ba`al-Berit their god.";
vul[33] = "postquam autem mortuus est Gedeon aversi sunt filii Israhel et fornicati cum Baalim percusseruntque cum Baal foedus ut esset eis in deum";
kjv[34] = "And the children of Israel remembered not the LORD their God, who had delivered them out of the hands of all their enemies on every side:";
rsv[34] = "And the people of Israel did not remember the LORD their God, who had rescued them from the hand of all their enemies on every side;";
asv[34] = "And the children of Israel remembered not Jehovah their God, who had delivered them out of the hand of all their enemies on every side;";
yng[34] = "and the sons of Israel have not remembered Jehovah their God, who is delivering them out of the hand of all their enemies round about,";
dby[34] = "And the children of Israel remembered not Jehovah their God, who had delivered them out of the hand of all their enemies on every side.";
web[34] = "And the children of Israel remembered not the LORD their God, who had delivered them from the hands of all their enemies on every side:";
hnv[34] = "The children of Yisra\'el didn\'t remember the LORD their God, who had delivered them out of the hand of all their enemies on every side;";
vul[34] = "nec recordati sunt Domini Dei sui qui eruit eos de manu omnium inimicorum suorum per circuitum";
kjv[35] = "Neither shewed they kindness to the house of Jerubbaal, [namely], Gideon, according to all the goodness which he had shewed unto Israel.";
rsv[35] = "and they did not show kindness to the family of Jerubba\'al (that is, Gideon) in return for all the good that he had done to Israel.";
asv[35] = "neither showed they kindness to the house of Jerubbaal, [who is] Gideon, according to all the goodness which he had showed unto Israel.";
yng[35] = "neither have they done kindness with the house of Jerubbaal -- Gideon -- according to all the good which he did with Israel.";
dby[35] = "And they shewed no kindness to the house of Jerubbaal-Gideon, according to all the good that he had done to Israel.";
web[35] = "Neither showed they kindness to the house of Jerubbaal, [namely] Gideon, according to all the goodness which he had shown to Israel.";
hnv[35] = "neither shown they kindness to the house of Yerubba`al, [who is] Gid`on, according to all the goodness which he had shown to Yisra\'el.";
vul[35] = "nec fecerunt misericordiam cum domo Hierobbaal Gedeon iuxta omnia bona quae fecerat Israheli";
