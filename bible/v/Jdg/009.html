csb[1] = "Abimelech son of Jerubbaal went to Shechem and spoke to his uncles and to his mother\'s whole clan, saying,";
csb[2] = "&quot;Please speak in the hearing of all the citizens of Shechem, \'Is it better for you that seventy men, all the sons of Jerubbaal, rule over you or that one man rule over you? \' Remember that I am your own flesh and blood.&quot;";
csb[3] = "His mother\'s relatives spoke all these words about him in the hearing of all the citizens of Shechem, and they were favorable to Abimelech, for they said, &quot;He is our brother.&quot;";
csb[4] = "So they gave him seventy pieces of silver from the temple of Baal-berith. Abimelech used it to hire worthless and reckless men, and they followed him.";
csb[5] = "He went to his father\'s house in Ophrah and killed his seventy brothers, the sons of Jerubbaal, on top of a large stone. But Jotham, the youngest son of Jerubbaal, survived, because he hid.";
csb[6] = "Then all the citizens of Shechem and of Beth-millo gathered together and proceeded to make Abimelech king at the oak of the pillar in Shechem.";
csb[7] = "When they told Jotham, he climbed to the top of Mount Gerizim, raised his voice, and called to them: Listen to me, citizens of Shechem, and may God listen to you:";
csb[8] = "The trees decided to anoint a king over themselves. They said to the olive tree, &quot;Reign over us.&quot;";
csb[9] = "But the olive tree said to them, &quot;Should I stop giving my oil that people use to honor both God and men, and rule over the trees? &quot;";
csb[10] = "Then the trees said to the fig tree, &quot;Come and reign over us.&quot;";
csb[11] = "But the fig tree said to them, &quot;Should I stop giving my sweetness and my good fruit, and rule over trees? &quot;";
csb[12] = "Later, the trees said to the grapevine, &quot;Come and reign over us.&quot;";
csb[13] = "But the grapevine said to them, &quot;Should I stop giving my wine that cheers both God and man, and rule over trees? &quot;";
csb[14] = "Finally, all the trees said to the bramble, &quot;Come and reign over us.&quot;";
csb[15] = "The bramble said to the trees, &quot;If you really are anointing me as king over you, come and find refuge in my shade. But if not, may fire come out from the bramble and consume the cedars of Lebanon.&quot;";
csb[16] = "&quot;Now if you have acted faithfully and honestly in making Abimelech king, if you have done well by Jerubbaal and his family, and if you have rewarded him appropriately for what he did --";
csb[17] = "&quot;for my father fought for you, risked his life, and rescued you from Midian,";
csb[18] = "&quot;and now you have attacked my father\'s family today, killed his seventy sons on top of a large stone, and made Abimelech, the son of his slave woman, king over the citizens of Shechem \'because he is your brother\' --";
csb[19] = "&quot;so if you have acted faithfully and honestly with Jerubbaal and his house this day, rejoice in Abimelech and may he also rejoice in you.";
csb[20] = "&quot;But if not, may fire come from Abimelech and consume the citizens of Shechem and Beth-millo, and may fire come from the citizens of Shechem and Beth-millo and consume Abimelech.&quot;";
csb[21] = "Then Jotham fled, escaping to Beer, and lived there because of his brother Abimelech.";
csb[22] = "When Abimelech had ruled over Israel three years,";
csb[23] = "God sent an evil spirit between Abimelech and the citizens of Shechem. They treated Abimelech deceitfully,";
csb[24] = "so that the crime against the seventy sons of Jerubbaal might come to justice and their blood would be avenged on their brother Abimelech, who killed them, and on the citizens of Shechem, who had helped him kill his brothers.";
csb[25] = "The citizens of Shechem rebelled against him by putting men in ambush on the tops of the mountains, and they robbed everyone who passed by them on the road. So this was reported to Abimelech.";
csb[26] = "Gaal son of Ebed came with his brothers and crossed into Shechem, and the citizens of Shechem trusted him.";
csb[27] = "So they went out to the countryside and harvested grapes from their vineyards. They trampled the grapes and held a celebration. Then they went to the house of their god, and as they ate and drank, they cursed Abimelech.";
csb[28] = "Gaal son of Ebed said, &quot;Who is Abimelech and who is Shechem that we should serve him? Isn\'t he the son of Jerubbaal, and isn\'t Zebul his officer? You are to serve the men of Hamor, the father of Shechem. Why should we serve Abimelech?";
csb[29] = "&quot;If only these people were in my power, I would remove Abimelech.&quot; So he said to Abimelech, &quot;Gather your army and come out.&quot;";
csb[30] = "When Zebul, the ruler of the city, heard the words of Gaal son of Ebed, he was angry.";
csb[31] = "So he secretly sent messengers to Abimelech, saying, &quot;Beware! Gaal son of Ebed, with his brothers, have come to Shechem and are turning the city against you.";
csb[32] = "&quot;Now tonight, you and the troops with you, come and wait in ambush in the countryside.";
csb[33] = "&quot;Then get up early, and at sunrise attack the city. When he and the troops who are with him come out against you, do to him whatever you can.&quot;";
csb[34] = "So Abimelech and all the troops with him got up at night and waited in ambush for Shechem in four units.";
csb[35] = "Gaal son of Ebed went out and stood at the entrance of the city gate. Then Abimelech and the troops who were with him got up from their ambush.";
csb[36] = "When Gaal saw the troops, he said to Zebul, &quot;Look, troops are coming down from the mountaintops! &quot; But Zebul said to him, &quot;The shadows of the mountains look like men to you.&quot;";
csb[37] = "Then Gaal spoke again, &quot;Look, troops are coming down from the central part of the land, and one unit is coming from the direction of the Diviners\' Oak.&quot;";
csb[38] = "Zebul replied,&quot;What do you have to say now? You said, \'Who is Abimelech that we should serve him? \' Aren\'t these the troops you despised? Now go and fight them! &quot;";
csb[39] = "So Gaal went out leading the citizens of Shechem and fought against Abimelech,";
csb[40] = "but Abimelech pursued him, and Gaal fled before him. Numerous bodies were strewn as far as the entrance of the city gate.";
csb[41] = "Abimelech stayed in Arumah, and Zebul drove Gaal and his brothers from Shechem.";
csb[42] = "The next day when the people of Shechem went into the countryside, this was reported to Abimelech.";
csb[43] = "He took the troops, divided them into three companies, and waited in ambush in the countryside. He looked, and the people were coming out of the city, so he arose against them and struck them down.";
csb[44] = "Then Abimelech and the units that were with him rushed forward and took their stand at the entrance of the city gate. The other two units rushed against all who were in the countryside and struck them down.";
csb[45] = "So Abimelech fought against the city that entire day, captured it, and killed the people who were in it. Then he tore down the city and sowed it with salt.";
csb[46] = "When all the citizens of the Tower of Shechem heard, they entered the inner chamber of the temple of El-berith.";
csb[47] = "Then it was reported to Abimelech that all the citizens of the Tower of Shechem had gathered.";
csb[48] = "So Abimelech and all the troops who were with him went up to Mount Zalmon. Abimelech took his ax in his hand and cut a branch from the trees. He picked up the branch, put it on his shoulder, and said to the troops who were with him, &quot;Hurry and do what you have seen me do.&quot;";
csb[49] = "Each of the troops also cut his own branch and followed Abimelech. They put the branches against the inner chamber and set it on fire; about a thousand men and women died, including all the men of the Tower of Shechem.";
csb[50] = "Abimelech went to Thebez, camped against it, and captured it.";
csb[51] = "There was a strong tower inside the city, and all the men, women, and citizens of the city fled there. They locked themselves in and went up to the roof of the tower.";
csb[52] = "When Abimelech came to attack the tower, he approached its entrance to set it on fire.";
csb[53] = "But a woman threw the upper portion of a millstone on Abimelech\'s head and fractured his skull.";
csb[54] = "He quickly called his armor-bearer and said to him, &quot;Draw your sword and kill me, or they\'ll say about me, \'A woman killed him.\' &quot; So his armor-bearer ran him through, and he died.";
csb[55] = "When the Israelites saw that Abimelech was dead, they all went home.";
csb[56] = "In this way, God brought back Abimelech\'s evil--the evil that Abimelech had done to his father when he killed his seventy brothers.";
csb[57] = "God also brought back to the men of Shechem all their evil. So the curse of Jotham son of Jerubbaal came upon them.";

kjv[2] = "Speak, I pray you, in the ears of all the men of Shechem, Whether [is] better for you, either that all the sons of Jerubbaal, [which are] threescore and ten persons, reign over you, or that one reign over you? remember also that I [am] your bone and your flesh.";
rsv[2] = "&quot;Say in the ears of all the citizens of Shechem, \'Which is better for you, that all seventy of the sons of Jerubba\'al rule over you, or that one rule over you?\' Remember also that I am your bone and your flesh.&quot;";
asv[2] = "Speak, I pray you, in the ears of all the men of Shechem, Whether is better for you, that all the sons of Jerubbaal, who are threescore and ten persons, rule over you, or that one rule over you? remember also that I am your bone and your flesh.";
yng[2] = "`Speak, I pray you, in the ears of all the masters of Shechem, Which [is] good for you -- the ruling over you of seventy men (all the sons of Jerubbaal), or the ruling over you of one man? -- and ye have remembered that I [am] your bone and your flesh.\'";
dby[2] = "Speak, I pray you, in the ears of all the citizens of Shechem, Which is better for you, that seventy persons, all sons of Jerubbaal, rule over you, or that one man rule over you? And remember that I am your bone and your flesh.";
web[2] = "Speak, I pray you, in the ears of all the men of Shechem, Which [is] better for you, either that all the sons of Jerubbaal, [which are] seventy persons, should reign over you, or that one should reign over you? remember also that I [am] your bone and your flesh.";
hnv[2] = "Please speak in the ears of all the men of Shekhem, Whether is better for you, that all the sons of Yerubba`al, who are seventy persons, rule over you, or that one rule over you? Remember also that I am your bone and your flesh.";

dby[3] = "And his mother\'s brethren spoke of him in the ears of all the citizens of Shechem all these words. And their heart inclined after Abimelech; for they said, He is our brother.";

hnv[14] = "Then said all the trees to the bramble, Come, and reign over us.";

kjv[15] = "And the bramble said unto the trees, If in truth ye anoint me king over you, [then] come [and] put your trust in my shadow: and if not, let fire come out of the bramble, and devour the cedars of Lebanon.";
rsv[15] = "And the bramble said to the trees, \'If in good faith you are anointing me king over you, then come and take refuge in my shade; but if not, let fire come out of the bramble and devour the cedars of Lebanon.\'";
asv[15] = "And the bramble said unto the trees, If in truth ye anoint me king over you, then come and take refuge in my shade; and if not, let fire come out of the bramble, and devour the cedars of Lebanon.";
yng[15] = "And the bramble saith unto the trees, If in truth ye are anointing me for king over you, come, take refuge in my shadow; and if not -- fire cometh out from the bramble, and devoureth the cedars of Lebanon.";
dby[15] = "And the thorn-bush said to the trees, If in truth ye anoint me king over you, come, put confidence in my shadow; but if not, fire shall come out of the thorn-bush and devour the cedars of Lebanon.";
web[15] = "And the bramble said to the trees, If in truth ye anoint me king over you, [then] come [and] put your trust in my shadow: and if not, let fire come out of the bramble, and devour the cedars of Lebanon.";
hnv[15] = "The bramble said to the trees, If in truth you anoint me king over you, then come and take refuge in my shade; and if not, let fire come out of the bramble, and devour the cedars of Levanon.";
vul[15] = "quae respondit eis si vere me regem vobis constituitis venite et sub mea umbra requiescite sin autem non vultis egrediatur ignis de ramno et devoret cedros Libani";
kjv[16] = "Now therefore, if ye have done truly and sincerely, in that ye have made Abimelech king, and if ye have dealt well with Jerubbaal and his house, and have done unto him according to the deserving of his hands;";
rsv[16] = "&quot;Now therefore, if you acted in good faith and honor when you made Abim\'elech king, and if you have dealt well with Jerubba\'al and his house, and have done to him as his deeds deserved--";
asv[16] = "Now therefore, if ye have dealt truly and uprightly, in that ye have made Abimelech king, and if ye have dealt well with Jerubbaal and his house, and have done unto him according to the deserving of his hands";
yng[16] = "`And, now, if in truth and in sincerity ye have acted, when ye make Abimelech king; and if ye have done good with Jerubbaal, and with his house; and if according to the deed of his hands ye have done to him --";
dby[16] = "Now therefore, if ye have dealt truly and sincerely in that ye have made Abimelech king, and if ye have dealt well with Jerubbaal and his house, and if ye have done to him according to the deserving of his hands;";
web[16] = "Now therefore, if ye have done truly and sincerely, in that ye have made Abimelech king, and if ye have dealt well with Jerubbaal and his house, and have done to him according to the deserving of his hands:";
hnv[16] = "Now therefore, if you have dealt truly and righteously, in that you have made Avimelekh king, and if you have dealt well with Yerubba`al and his house, and have done to him according to the deserving of his hands";
vul[16] = "nunc igitur si recte et absque peccato constituistis super vos regem Abimelech et bene egistis cum Hierobbaal et cum domo eius et reddidistis vicem beneficiis eius qui pugnavit pro vobis";
kjv[17] = "(For my father fought for you, and adventured his life far, and delivered you out of the hand of Midian:";
rsv[17] = "for my father fought for you, and risked his life, and rescued you from the hand of Mid\'ian;";
asv[17] = "(for my father fought for you, and adventured his life, and delivered you out of the hand of Midian:";
yng[17] = "because my father hath fought for you, and doth cast away his life from [him], and deliver you from the hand of Midian;";
dby[17] = "-- for my father fought for you, and endangered his life, and delivered you out of the hand of Midian;";
web[17] = "(For my father fought for you, and adventured his life far, and delivered you from the hand of Midian:";
hnv[17] = "(for my father fought for you, and adventured his life, and delivered you out of the hand of Midyan:";
vul[17] = "et animam suam dedit periculis ut erueret vos de manu Madian";
kjv[18] = "And ye are risen up against my father\'s house this day, and have slain his sons, threescore and ten persons, upon one stone, and have made Abimelech, the son of his maidservant, king over the men of Shechem, because he [is] your brother;)";
rsv[18] = "and you have risen up against my father\'s house this day, and have slain his sons, seventy men on one stone, and have made Abim\'elech, the son of his maidservant, king over the citizens of Shechem, because he is your kinsman--";
asv[18] = "and ye are risen up against my father\'s house this day, and have slain his sons, threescore and ten persons, upon one stone, and have made Abimelech, the son of his maid-servant, king over the men of Shechem, because he is your brother);";
yng[18] = "and ye have risen against the house of my father to-day, and slay his sons, seventy men, on one stone, and cause Abimelech son of his handmaid to reign over the masters of Shechem, because he [is] your brother --";
dby[18] = "but ye are risen up against my father\'s house this day, and have slain his sons, seventy men, upon one stone, and have made Abimelech, the son of his handmaid, king over the citizens of Shechem, because he is your brother;";
web[18] = "And ye have risen up against my father\'s house this day, and have slain his sons, seventy persons, upon one stone, and have made Abimelech, the son of his maid-servant, king over the men of Shechem, because he [is] your brother:)";
hnv[18] = "and you are risen up against my father\'s house this day, and have slain his sons, seventy persons, on one stone, and have made Avimelekh, the son of his maid-servant, king over the men of Shekhem, because he is your brother);";
vul[18] = "qui nunc surrexistis contra domum patris mei et interfecistis filios eius septuaginta viros super unum lapidem et constituistis regem Abimelech filium ancillae eius super habitatores Sychem eo quod frater vester sit";
kjv[19] = "If ye then have dealt truly and sincerely with Jerubbaal and with his house this day, [then] rejoice ye in Abimelech, and let him also rejoice in you:";
rsv[19] = "if you then have acted in good faith and honor with Jerubba\'al and with his house this day, then rejoice in Abim\'elech, and let him also rejoice in you;";
asv[19] = "if ye then have dealt truly and uprightly with Jerubbaal and with his house this day, then rejoice ye in Abimelech, and let him also rejoice in you:";
yng[19] = "yea, if in truth and in sincerity ye have acted with Jerubbaal and with his house this day, rejoice ye in Abimelech, and he doth rejoice -- even he -- in you;";
dby[19] = "-- if ye then have dealt truly and sincerely with Jerubbaal and with his house this day, rejoice ye in Abimelech, and let him also rejoice in you;";
web[19] = "If ye then have dealt truly and sincerely with Jerubbaal and with his house this day, [then] rejoice ye in Abimelech, and let him also rejoice in you:";
hnv[19] = "if you then have dealt truly and righteously with Yerubba`al and with his house this day, then rejoice you in Avimelekh, and let him also rejoice in you:";
vul[19] = "si ergo recte et absque vitio egistis cum Hierobbaal et domo eius hodie laetamini in Abimelech et ille laetetur in vobis";
kjv[20] = "But if not, let fire come out from Abimelech, and devour the men of Shechem, and the house of Millo; and let fire come out from the men of Shechem, and from the house of Millo, and devour Abimelech.";
rsv[20] = "but if not, let fire come out from Abim\'elech, and devour the citizens of Shechem, and Beth-millo; and let fire come out from the citizens of Shechem, and from Beth-millo, and devour Abim\'elech.&quot;";
asv[20] = "but if not, let fire come out from Abimelech, and devour the men of Shechem, and the house of Millo; and let fire come out from the men of Shechem, and from the house of Millo, and devour Abimelech.";
yng[20] = "and if not -- fire cometh out from Abimelech and devoureth the masters of Shechem and the house of Millo, and fire cometh out from the masters of Shechem and from the house of Millo, and devoureth Abimelech.\'";
dby[20] = "but if not, let fire come out from Abimelech, and devour the citizens of Shechem and the house of Millo; and let fire come out from the citizens of Shechem and from the house of Millo, and devour Abimelech.";
web[20] = "But if not, let fire come out from Abimelech, and devour the men of Shechem, and the house of Millo; and let fire come out from the men of Shechem, and from the house of Millo, and devour Abimelech.";
hnv[20] = "but if not, let fire come out from Avimelekh, and devour the men of Shekhem, and the house of Millo; and let fire come out from the men of Shekhem, and from the house of Millo, and devour Avimelekh.";
vul[20] = "sin autem perverse egrediatur ignis ex eo et consumat habitatores Sychem et oppidum Mello egrediaturque ignis de viris Sychem et de oppido Mello et devoret Abimelech";
kjv[21] = "And Jotham ran away, and fled, and went to Beer, and dwelt there, for fear of Abimelech his brother.";
rsv[21] = "And Jotham ran away and fled, and went to Beer and dwelt there, for fear of Abim\'elech his brother.";
asv[21] = "And Jotham ran away, and fled, and went to Beer, and dwelt there, for fear of Abimelech his brother.";
yng[21] = "And Jotham hasteth, and fleeth, and goeth to Beer, and dwelleth there, from the face of Abimelech his brother.";
dby[21] = "And Jotham ran away, and fled, and went to Beer, and dwelt there, because of Abimelech his brother.";
web[21] = "And Jotham ran away, and fled, and went to Beer, and dwelt there, for fear of Abimelech his brother.";
hnv[21] = "Yotam ran away, and fled, and went to Be\'er, and lived there, for fear of Avimelekh his brother.";
vul[21] = "quae cum dixisset fugit et abiit in Bera habitavitque ibi metu Abimelech fratris sui";
kjv[22] = "When Abimelech had reigned three years over Israel,";
rsv[22] = "Abim\'elech ruled over Israel three years.";
asv[22] = "And Abimelech was prince over Israel three years.";
yng[22] = "And Abimelech is prince over Israel three years,";
dby[22] = "And Abimelech ruled over Israel three years.";
web[22] = "When Abimelech had reigned three years over Israel,";
hnv[22] = "Avimelekh was prince over Yisra\'el three years.";
vul[22] = "regnavit itaque Abimelech super Israhel tribus annis";
kjv[23] = "Then God sent an evil spirit between Abimelech and the men of Shechem; and the men of Shechem dealt treacherously with Abimelech:";
rsv[23] = "And God sent an evil spirit between Abim\'elech and the men of Shechem; and the men of Shechem dealt treacherously with Abim\'elech;";
asv[23] = "And God sent an evil spirit between Abimelech and the men of Shechem; and the men of Shechem dealt treacherously with Abimelech:";
yng[23] = "and God sendeth an evil spirit between Abimelech and the masters of Shechem, and the masters of Shechem deal treacherously with Abimelech,";
dby[23] = "And God sent an evil spirit between Abimelech and the citizens of Shechem; and the citizens of Shechem dealt treacherously with Abimelech,";
web[23] = "Then God sent an evil spirit between Abimelech and the men of Shechem; and the men of Shechem dealt treacherously with Abimelech:";
hnv[23] = " God sent an evil spirit between Avimelekh and the men of Shekhem; and the men of Shekhem dealt treacherously with Avimelekh:";
vul[23] = "misitque Deus spiritum pessimum inter Abimelech et habitatores Sychem qui coeperunt eum detestari";
kjv[24] = "That the cruelty [done] to the threescore and ten sons of Jerubbaal might come, and their blood be laid upon Abimelech their brother, which slew them; and upon the men of Shechem, which aided him in the killing of his brethren.";
rsv[24] = "that the violence done to the seventy sons of Jerubba\'al might come and their blood be laid upon Abim\'elech their brother, who slew them, and upon the men of Shechem, who strengthened his hands to slay his brothers.";
asv[24] = "that the violence done to the threescore and ten sons of Jerubbaal might come, and that their blood might be laid upon Abimelech their brother, who slew them, and upon the men of Shechem, who strengthened his hands to slay his brethren.";
yng[24] = "for the coming in of the violence [to] the seventy sons of Jerubbaal, and of their blood to place [it] on Abimelech their brother, who slew them, and on the masters of Shechem, who strengthened his hands to slay his brethren.";
dby[24] = "that the violence [done] to the seventy sons of Jerubbaal might come, and their blood be laid upon Abimelech their brother, who slew them, and upon the citizens of Shechem, who had strengthened his hands to slay his brethren.";
web[24] = "That the cruelty [done] to the seventy sons of Jerubbaal might come, and their blood be laid upon Abimelech their brother who slew them, and upon the men of Shechem who aided him in the killing of his brethren.";
hnv[24] = "that the violence done to the seventy sons of Yerubba`al might come, and that their blood might be laid on Avimelekh their brother, who killed them, and on the men of Shekhem, who strengthened his hands to kill his brothers.";
vul[24] = "et scelus interfectionis septuaginta filiorum Hierobbaal et effusionem sanguinis eorum conferre in Abimelech fratrem suum et in ceteros Sycimarum principes qui eum adiuverant";
kjv[25] = "And the men of Shechem set liers in wait for him in the top of the mountains, and they robbed all that came along that way by them: and it was told Abimelech.";
rsv[25] = "And the men of Shechem put men in ambush against him on the mountain tops, and they robbed all who passed by them along that way; and it was told Abim\'elech.";
asv[25] = "And the men of Shechem set liers-in-wait for him on the tops of the mountains, and they robbed all that came along that way by them: and it was told Abimelech.";
yng[25] = "And the masters of Shechem set for him ambushes on the top of the hills, and rob every one who passeth over by them in the way, and it is declared to Abimelech.";
dby[25] = "And the citizens of Shechem set liers in wait for him on the tops of the mountains, and they robbed all that came along that way by them. And it was told Abimelech.";
web[25] = "And the men of Shechem set liers in wait for him on the top of the mountains, and they robbed all that came along that way by them: and it was told Abimelech.";
hnv[25] = "The men of Shekhem set liers-in-wait for him on the tops of the mountains, and they robbed all who came along that way by them: and it was told Avimelekh.";
vul[25] = "posueruntque insidias adversum eum in montium summitate et dum illius praestolantur adventum exercebant latrocinia agentes praedas de praetereuntibus nuntiatumque est Abimelech";
kjv[26] = "And Gaal the son of Ebed came with his brethren, and went over to Shechem: and the men of Shechem put their confidence in him.";
rsv[26] = "And Ga\'al the son of Ebed moved into Shechem with his kinsmen; and the men of Shechem put confidence in him.";
asv[26] = "And Gaal the son of Ebed came with his brethren, and went over to Shechem; and the men of Shechem put their trust in him.";
yng[26] = "And Gaal son of Ebed cometh -- also his brethren -- and they pass over into Shechem, and the masters of Shechem trust in him,";
dby[26] = "And Gaal the son of Ebed came with his brethren, and went over to Shechem; and the citizens of Shechem put confidence in him.";
web[26] = "And Gaal the son of Ebed came with his brethren, and went over to Shechem: and the men of Shechem put their confidence in him.";
hnv[26] = "Ga`al the son of `Eved came with his brothers, and went over to Shekhem; and the men of Shekhem put their trust in him.";
vul[26] = "venit autem Gaal filius Obed cum fratribus suis et transivit in Sycimam ad cuius adventum erecti habitatores Sychem";
kjv[27] = "And they went out into the fields, and gathered their vineyards, and trode [the grapes], and made merry, and went into the house of their god, and did eat and drink, and cursed Abimelech.";
rsv[27] = "And they went out into the field, and gathered the grapes from their vineyards and trod them, and held festival, and went into the house of their god, and ate and drank and reviled Abim\'elech.";
asv[27] = "And they went out into the field, and gathered their vineyards, and trod [the grapes], and held festival, and went into the house of their god, and did eat and drink, and cursed Abimelech.";
yng[27] = "and go out into the field, and gather their vineyards, and tread, and make praises, and go into the house of their god, and eat and drink, and revile Abimelech.";
dby[27] = "And they went out into the fields, and gathered their vineyards, and trode [the grapes], and made rejoicings, and went into the house of their god, and ate and drank, and cursed Abimelech.";
web[27] = "And they went out into the fields, and gathered their vineyards, and trod [the grapes], and made merry, and went into the house of their god, and ate and drank, and cursed Abimelech.";
hnv[27] = "They went out into the field, and gathered their vineyards, and trod [the grapes], and held festival, and went into the house of their god, and did eat and drink, and cursed Avimelekh.";
vul[27] = "egressi sunt in agros vastantes vineas uvasque calcantes et factis cantantium choris ingressi sunt fanum dei sui et inter epulas et pocula maledicebant Abimelech";
kjv[28] = "And Gaal the son of Ebed said, Who [is] Abimelech, and who [is] Shechem, that we should serve him? [is] not [he] the son of Jerubbaal? and Zebul his officer? serve the men of Hamor the father of Shechem: for why should we serve him?";
rsv[28] = "And Ga\'al the son of Ebed said, &quot;Who is Abim\'elech, and who are we of Shechem, that we should serve him? Did not the son of Jerubba\'al and Zebul his officer serve the men of Hamor the father of Shechem? Why then should we serve him?";
asv[28] = "And Gaal the son of Ebed said, Who is Abimelech, and who is Shechem, that we should serve him? is not he the son of Jerubbaal? and Zebul his officer? serve ye the men of Hamor the father of Shechem: but why should we serve him?";
yng[28] = "And Gaal son of Ebed saith, `Who [is] Abimelech, and who [is] Shechem, that we serve him? is [he] not son of Jerubbaal? and Zebul his commander? Serve ye the men of Hamor father of Shechem, and wherefore do we serve him -- we?";
dby[28] = "And Gaal the son of Ebed said, Who is Abimelech, and who is Shechem, that we should serve him? is he not the son of Jerubbaal? and Zebul his overseer? Serve the men of Hamor the father of Shechem! and why should *we* serve him?";
web[28] = "And Gaal the son of Ebed said, Who [is] Abimelech, and who [is] Shechem, that we should serve him; [is] not [he] the son of Jerubbaal? and Zebul his officer? Serve the men of Hamor the father of Shechem: for why should we serve him?";
hnv[28] = "Ga`al the son of `Eved said, Who is Avimelekh, and who is Shekhem, that we should serve him? Isn\'t he the son of Yerubba`al? and Zevul his officer? serve you the men of Hamor the father of Shekhem: but why should we serve him?";
vul[28] = "clamante Gaal filio Obed quis est Abimelech et quae est Sychem ut serviamus ei numquid non est filius Hierobbaal et constituit principem Zebul servum suum super viros Emmor patris Sychem cur igitur servimus ei";
kjv[29] = "And would to God this people were under my hand! then would I remove Abimelech. And he said to Abimelech, Increase thine army, and come out.";
rsv[29] = "Would that this people were under my hand! then I would remove Abim\'elech. I would say to Abim\'elech, \'Increase your army, and come out.\'&quot;";
asv[29] = "And would that this people were under my hand! then would I remove Abimelech. And he said to Abimelech, Increase thine army, and come out.";
yng[29] = "and oh that this people were in my hand -- then I turn Abimelech aside;\' and he saith to Abimelech, `Increase thy host, and come out.\'";
dby[29] = "Oh! would that this people were under my hand! then would I remove Abimelech. And he said to Abimelech, Increase thine army, and come out.";
web[29] = "And would that this people were under my hand! then would I remove Abimelech. And he said to Abimelech, Increase thy army, and come out.";
hnv[29] = "Would that this people were under my hand! then would I remove Avimelekh. He said to Avimelekh, Increase your army, and come out.";
vul[29] = "utinam daret aliquis populum istum sub manu mea ut auferrem de medio Abimelech dictumque est Abimelech congrega exercitus multitudinem et veni";
kjv[30] = "And when Zebul the ruler of the city heard the words of Gaal the son of Ebed, his anger was kindled.";
rsv[30] = "When Zebul the ruler of the city heard the words of Ga\'al the son of Ebed, his anger was kindled.";
asv[30] = "And when Zebul the ruler of the city heard the words of Gaal the son of Ebed, his anger was kindled.";
yng[30] = "And Zebul, prince of the city, heareth the words of Gaal son of Ebed, and his anger burneth,";
dby[30] = "And Zebul the ruler of the city heard the words of Gaal the son of Ebed, and his anger was kindled;";
web[30] = "And when Zebul the ruler of the city heard the words of Gaal the son of Ebed, his anger was kindled.";
hnv[30] = "When Zevul the ruler of the city heard the words of Ga`al the son of `Eved, his anger was kindled.";
vul[30] = "Zebul enim princeps civitatis auditis sermonibus Gaal filii Obed iratus est valde";
kjv[31] = "And he sent messengers unto Abimelech privily, saying, Behold, Gaal the son of Ebed and his brethren be come to Shechem; and, behold, they fortify the city against thee.";
rsv[31] = "And he sent messengers to Abim\'elech at Aru\'mah, saying, &quot;Behold, Ga\'al the son of Ebed and his kinsmen have come to Shechem, and they are stirring up the city against you.";
asv[31] = "And he sent messengers unto Abimelech craftily, saying, Behold, Gaal the son of Ebed and his brethren are come to Shechem; and, behold, they constrain the city [to take part] against thee.";
yng[31] = "and he sendeth messengers unto Abimelech deceitfully, saying, `Lo, Gaal son of Ebed and his brethren are coming into Shechem, and lo, they are fortifying the city against thee;";
dby[31] = "and he sent messengers to Abimelech craftily, saying, Behold, Gaal the son of Ebed and his brethren are come to Shechem, and behold, they shut up the city against thee;";
web[31] = "And he sent messengers to Abimelech privately, saying, Behold, Gaal the son of Ebed, and his brethren, are come to Shechem; and behold, they fortify the city against thee.";
hnv[31] = "He sent messengers to Avimelekh craftily, saying, Behold, Ga`al the son of `Eved and his brothers are come to Shekhem; and, behold, they constrain the city [to take part] against you.";
vul[31] = "et misit clam ad Abimelech nuntios dicens ecce Gaal filius Obed venit in Sycimam cum fratribus suis et obpugnat adversum te civitatem";
kjv[32] = "Now therefore up by night, thou and the people that [is] with thee, and lie in wait in the field:";
rsv[32] = "Now therefore, go by night, you and the men that are with you, and lie in wait in the fields.";
asv[32] = "Now therefore, up by night, thou and the people that are with thee, and lie in wait in the field:";
yng[32] = "and, now, rise by night, thou and the people who [are] with thee, and lay wait in the field,";
dby[32] = "and now, rise up by night, thou and the people that are with thee, and lie in ambush in the fields.";
web[32] = "Now therefore rise by night, thou, and the people that [are] with thee, and lie in wait in the field:";
hnv[32] = " Now therefore, up by night, you and the people who are with you, and lie in wait in the field:";
vul[32] = "surge itaque nocte cum populo qui tecum est et latita in agro";
kjv[33] = "And it shall be, [that] in the morning, as soon as the sun is up, thou shalt rise early, and set upon the city: and, behold, [when] he and the people that [is] with him come out against thee, then mayest thou do to them as thou shalt find occasion.";
rsv[33] = "Then in the morning, as soon as the sun is up, rise early and rush upon the city; and when he and the men that are with him come out against you, you may do to them as occasion offers.&quot;";
asv[33] = "and it shall be, that in the morning, as soon as the sun is up, thou shalt rise early, and rush upon the city; and, behold, when he and the people that are with him come out against thee, then mayest thou do to them as thou shalt find occasion.";
yng[33] = "and it hath been, in the morning, about the rising of the sun, thou dost rise early, and hast pushed against the city; and lo, he and the people who [are] with him are going out unto thee -- and thou hast done to him as thy hand doth find.\'";
dby[33] = "And it shall be in the morning when the sun is up, thou shalt rise early, and fall upon the city; and behold, he and the people that is with him shall come out against thee, and thou shalt do with him as thou shalt find occasion.";
web[33] = "And it shall be, [that] in the morning, as soon as the sun hath risen, thou shalt rise early, and attack the city: and behold, [when] he and the people that [are] with him come out against thee, then mayest thou do to them as thou shalt find occasion.";
hnv[33] = "and it shall be, that in the morning, as soon as the sun is up, you shall rise early, and rush on the city; and, behold, when he and the people who are with him come out against you, then may you do to them as you shall find occasion.";
vul[33] = "et primo mane oriente sole inrue super civitatem illo autem egrediente adversum te cum populo suo fac ei quod potueris";
kjv[34] = "And Abimelech rose up, and all the people that [were] with him, by night, and they laid wait against Shechem in four companies.";
rsv[34] = "And Abim\'elech and all the men that were with him rose up by night, and laid wait against Shechem in four companies.";
asv[34] = "And Abimelech rose up, and all the people that were with him, by night, and they laid wait against Shechem in four companies.";
yng[34] = "And Abimelech riseth, and all the people who [are] with him, by night, and they lay wait against Shechem -- four detachments;";

asv[37] = "And Gaal spake again and said, See, there come people down by the middle of the land, and one company cometh by the way of the oak of Meonenim.";
yng[37] = "And Gaal addeth yet to speak, and saith, `Lo, people are coming down from the high part of the land, and another detachment is coming by the way of the oak of Meonenim.\'";
dby[37] = "And Gaal spoke again, and said, Behold, people are coming down from the high part of the land, and one company is coming along by the way of the Magician\'s oak.";
web[37] = "And Gaal spoke again, and said, See, there come people down by the middle of the land, and another company come along by the plain of Meonenim.";

kjv[38] = "Then said Zebul unto him, Where [is] now thy mouth, wherewith thou saidst, Who [is] Abimelech, that we should serve him? [is] not this the people that thou hast despised? go out, I pray now, and fight with them.";
rsv[38] = "Then Zebul said to him, &quot;Where is your mouth now, you who said, \'Who is Abim\'elech, that we should serve him?\' Are not these the men whom you despised? Go out now and fight with them.&quot;";
asv[38] = "Then said Zebul unto him, Where is now thy mouth, that thou saidst, Who is Abimelech, that we should serve him? is not this the people that thou hast despised? go out now, I pray, and fight with them.";
yng[38] = "And Zebul saith unto him, `Where [is] now thy mouth, in that thou sayest, Who [is] Abimelech that we serve him? is not this the people against which thou hast kicked? go out, I pray thee now, and fight against it.\'";
dby[38] = "Then said Zebul to him, Where is now thy mouth, thou that saidst, Who is Abimelech, that we should serve him? is not this the people that thou hast despised? go out now, I pray, and fight against them.";
web[38] = "Then said Zebul to him, Where [is] now thy mouth, with which thou saidst, Who [is] Abimelech, that we should serve him? [are] not these the people that thou hast despised? go out, I pray now, and fight with them.";
hnv[38] = "Then said Zevul to him, Where is now your mouth, that you said, Who is Avimelekh, that we should serve him? is not this the people that you have despised? go out now, I pray, and fight with them.";
vul[38] = "cui dixit Zebul ubi est nunc os tuum quo loquebaris quis est Abimelech ut serviamus ei nonne iste est populus quem despiciebas egredere et pugna contra eum";

web[41] = "And Abimelech dwelt at Arumah: and Zebul thrust out Gaal and his brethren, that they should not dwell in Shechem.";

web[42] = "And it came to pass on the morrow, that the people went out into the field; and they told Abimelech.";
hnv[42] = "It happened on the next day, that the people went out into the field; and they told Avimelekh.";

dby[44] = "And Abimelech, and the companies that were with him, rushed forward, and stood in the entrance of the gate of the city; and two of the companies ran upon all that were in the fields, and slew them.";

dby[45] = "And Abimelech fought against the city all that day; and he took the city, and slew the people that were in it, and broke down the city, and sowed it with salt.";

kjv[48] = "And Abimelech gat him up to mount Zalmon, he and all the people that [were] with him; and Abimelech took an axe in his hand, and cut down a bough from the trees, and took it, and laid [it] on his shoulder, and said unto the people that [were] with him, What ye have seen me do, make haste, [and] do as I [have done].";
rsv[48] = "And Abim\'elech went up to Mount Zalmon, he and all the men that were with him; and Abim\'elech took an axe in his hand, and cut down a bundle of brushwood, and took it up and laid it on his shoulder. And he said to the men that were with him, &quot;What you have seen me do, make haste to do, as I have done.&quot;";
asv[48] = "And Abimelech gat him up to mount Zalmon, he and all the people that were with him; and Abimelech took an axe in his hand, and cut down a bough from the trees, and took it up, and laid it on his shoulder: and he said unto the people that were with him, What ye have seen me do, make haste, and do as I have done.";
yng[48] = "and Abimelech goeth up to mount Zalmon, he and all the people who [are] with him, and Abimelech taketh the great axe in his hand, and cutteth off a bough of the trees, and lifteth it up, and setteth [it] on his shoulder, and saith unto the people who [are] with him, `What ye have seen I have done -- haste, do ye like it.\'";
dby[48] = "Then Abimelech went up to mount Zalmon, he and all the people that were with him; and Abimelech took an axe in his hand, and cut down a bough from the trees, and took it up and laid it on his shoulder, and said to the people that was with him, What ye have seen me do, make haste, do as I have done.";
web[48] = "And Abimelech ascended mount Zalmon, he and all the people that [were] with him; and Abimelech took an ax in his hand, and cut down a bough from the trees, and took it, and laid [it] on his shoulder, and said to the people that [were] with him, What ye have seen me do, make haste, [and] do as I [have done].";
hnv[48] = "Avimelekh got him up to Mount Tzalmon, he and all the people who were with him; and Avimelekh took an axe in his hand, and cut down a bough from the trees, and took it up, and laid it on his shoulder: and he said to the people who were with him, What you have seen me do, make haste, and do as I have done.";
vul[48] = "ascendit in montem Selmon cum omni populo suo et arrepta securi praecidit arboris ramum inpositumque ferens umero dixit ad socios quod me vidistis facere cito facite";

asv[49] = "And all the people likewise cut down every man his bough, and followed Abimelech, and put them to the stronghold, and set the stronghold on fire upon them; so that all the men of the tower of Shechem died also, about a thousand men and women.";

dby[49] = "And all the people likewise cut down every man his bough, and they followed Abimelech, and put [them] to the hold, and burned the hold with fire upon them. And all the men of the tower of Shechem died also, about a thousand men and women.";
web[49] = "And all the people likewise cut down every man his bough, and followed Abimelech, and put [them] to the hold, and set the hold on fire upon them: so that all the men of the tower of Shechem died also, about a thousand men and women.";

vul[49] = "igitur certatim ramos de arboribus praecidentes sequebantur ducem quos circumdantes praesidio succenderunt atque ita factum est ut fumo et igne mille hominum necarentur viri pariter ac mulieres habitatorum turris Sychem";

asv[51] = "But there was a strong tower within the city, and thither fled all the men and women, and all they of the city, and shut themselves in, and gat them up to the roof of the tower.";
yng[51] = "and a strong tower hath been in the midst of the city, and thither flee do all the men and the women, and all the masters of the city, and they shut [it] behind them, and go up on the roof of the tower.";
dby[51] = "But there was a strong tower in the midst of the city, and thither fled all the men and women, all the citizens of the city; and they shut it behind them, and went up to the roof of the tower.";

hnv[52] = "Avimelekh came to the tower, and fought against it, and drew near to the door of the tower to burn it with fire.";

kjv[54] = "Then he called hastily unto the young man his armourbearer, and said unto him, Draw thy sword, and slay me, that men say not of me, A woman slew him. And his young man thrust him through, and he died.";
rsv[54] = "Then he called hastily to the young man his armor-bearer, and said to him, &quot;Draw your sword and kill me, lest men say of me, \'A woman killed him.\'&quot; And his young man thrust him through, and he died.";
asv[54] = "Then he called hastily unto the young man his armorbearer, and said unto him, Draw thy sword, and kill me, that men say not of me, A woman slew him. And his young man thrust him through, and he died.";
yng[54] = "and he calleth hastily unto the young man bearing his weapons, and saith to him, `Draw thy sword, and thou hast put me to death, lest they say of me -- A woman slew him;\' and his young man pierced him through, and he dieth.";
dby[54] = "Then he called hastily to the young man that carried his armour, and said to him, Draw thy sword, and slay me, that they say not of me, A woman killed him. And his young man thrust him through, and he died.";
web[54] = "Then he called hastily to the young man his armor-bearer, and said to him, Draw thy sword, and slay me, that men say not of me, A woman slew him. And his young man thrust him through, and he died.";
hnv[54] = "Then he called hastily to the young man his armor bearer, and said to him, Draw your sword, and kill me, that men not say of me, A woman killed him. His young man thrust him through, and he died.";
vul[54] = "qui vocavit cito armigerum suum et ait ad eum evagina gladium tuum et percute me ne forte dicatur quod a femina interfectus sim qui iussa perficiens interfecit eum";
kjv[55] = "And when the men of Israel saw that Abimelech was dead, they departed every man unto his place.";

asv[55] = "And when the men of Israel saw that Abimelech was dead, they departed every man unto his place.";
yng[55] = "And the men of Israel see that Abimelech [is] dead, and go each one to his place;";
dby[55] = "And when the men of Israel saw that Abimelech was dead, they went every man to his place.";
web[55] = "And when the men of Israel saw that Abimelech was dead, they departed every man to his place.";
hnv[55] = " When the men of Yisra\'el saw that Avimelekh was dead, they departed every man to his place.";
vul[55] = "illoque mortuo omnes qui cum eo erant de Israhel reversi sunt in sedes suas";
kjv[56] = "Thus God rendered the wickedness of Abimelech, which he did unto his father, in slaying his seventy brethren:";
rsv[56] = "Thus God requited the crime of Abim\'elech, which he committed against his father in killing his seventy brothers;";
asv[56] = "Thus God requited the wickedness of Abimelech, which he did unto his father, in slaying his seventy brethren;";
yng[56] = "and God turneth back the evil of Abimelech which he did to his father to slay his seventy brethren;";
dby[56] = "And God rendered back the wickedness of Abimelech, which he did to his father in slaying his seventy brethren.";
web[56] = "Thus God rendered the wickedness of Abimelech, which he did to his father, in slaying his seventy brethren:";
hnv[56] = "Thus God requited the wickedness of Avimelekh, which he did to his father, in killing his seventy brothers;";

yng[57] = "and all the evil of the men of Shechem hath God turned back on their head, and come unto them doth the cursing of Jotham son of Jerubbaal.";
dby[57] = "And all the evil of the men of Shechem did God render back upon their heads; and upon them came the curse of Jotham the son of Jerubbaal.";
web[57] = "And all the evil of the men of Shechem did God render upon their heads: and upon them came the curse of Jotham the son of Jerubbaal.";
hnv[57] = "and all the wickedness of the men of Shekhem did God requite on their heads: and on them came the curse of Yotam the son of Yerubba`al.";
