csb[1] = "On that day Deborah and Barak son of Abinoam sang:";
csb[2] = "When the leaders lead in Israel, when the people volunteer, blessed be the LORD.";
csb[3] = "Listen, kings! Pay attention, princes! I will sing to the LORD; I will sing praise to the LORD God of Israel.";
csb[4] = "LORD, when you came from Seir, when you marched from the fields of Edom, the earth trembled, the skies poured rain, and the clouds poured water.";
csb[5] = "The mountains melted before the LORD, even Sinai, before the LORD, the God of Israel.";
csb[6] = "In the days of Shamgar son of Anath, in the days of Jael, the main roads were deserted because travelers kept to the side roads.";
csb[7] = "Villages were deserted, they were deserted in Israel, until I, Deborah, arose, a mother in Israel.";
csb[8] = "Israel chose new gods, then there was war in the city gates. Not a shield or spear was seen among forty thousand in Israel.";
csb[9] = "My heart is with the leaders of Israel, with the volunteers of the people. Blessed be the LORD!";
csb[10] = "You who ride on white donkeys, who sit on saddle blankets, and who travel on the road, give praise!";
csb[11] = "Let them tell the righteous acts of the LORD, the righteous deeds of his warriors in Israel, with the voices of the singers at the watering places. Then the LORD\'s people went down to the city gates.";
csb[12] = "&quot;Awake! Awake, Deborah! Awake! Awake, sing a song! Arise, Barak, and take your prisoners, son of Abinoam! &quot;";
csb[13] = "Then the survivors came down to the nobles; the LORD\'s people came down to me with the warriors.";
csb[14] = "Those with their roots in Amalek came from Ephraim; Benjamin came with your people after you. The leaders came down from Machir, and those who carry a marshal\'s staff came from Zebulun.";
csb[15] = "The princes of Issachar were with Deborah; Issachar was with Barak; they were under his leadership in the valley. There was great searching of heart among the clans of Reuben.";
csb[16] = "Why did you sit among the sheep pens listening to the playing of pipes for the flocks? There was great searching of heart among the clans of Reuben.";
csb[17] = "Gilead remained beyond the Jordan. Dan, why did you linger at the ships? Asher remained at the seashore and stayed in his harbors.";
csb[18] = "The people of Zebulun defied death, Naphtali also, on the heights of the battlefield.";
csb[19] = "Kings came and fought. Then the kings of Canaan fought at Taanach by the Waters of Megiddo, but they did not plunder the silver.";
csb[20] = "The stars fought from the heavens; the stars fought with Sisera from their paths.";
csb[21] = "The river Kishon swept them away, the ancient river, the river Kishon. March on, my soul, in strength!";
csb[22] = "The horses\' hooves then hammered -- the galloping, galloping of his stallions.";
csb[23] = "&quot;Curse Meroz,&quot; says the angel of the LORD, &quot;Bitterly curse her inhabitants, for they did not come to help the LORD, to help the LORD with the warriors.&quot;";
csb[24] = "Jael is most blessed of women, the wife of Heber the Kenite; she is most blessed among tent-dwelling women.";
csb[25] = "He asked for water; she gave him milk. She brought him cream in a majestic bowl.";
csb[26] = "She reached for a tent peg, her right hand, for a workman\'s hammer. Then she hammered Sisera -- she crushed his head; she shattered and pierced his temple.";
csb[27] = "He collapsed, he fell, he lay down between her feet; he collapsed, he fell between her feet; where he collapsed, there he fell -- dead.";
csb[28] = "Sisera\'s mother looked through the window; she peered through the lattice, crying out: &quot;Why is his chariot so long in coming? Why don\'t I hear the hoofbeats of his horses? &quot;";
csb[29] = "Her wisest princesses answer her; she even answers herself:";
csb[30] = "&quot;Are they not finding and dividing the spoil -- a girl or two for each warrior, the spoil of colored garments for Sisera, the spoil of an embroidered garment or two for my neck? &quot;";
csb[31] = "LORD, may all your enemies perish as Sisera did. But may those who love him be like the rising of the sun in its strength. And the land had peace for forty years.";
kjv[1] = "Then sang Deborah and Barak the son of Abinoam on that day, saying,";
kjv[2] = "Praise ye the LORD for the avenging of Israel, when the people willingly offered themselves.";
kjv[3] = "Hear, O ye kings; give ear, O ye princes; I, [even] I, will sing unto the LORD; I will sing [praise] to the LORD God of Israel.";
kjv[4] = "LORD, when thou wentest out of Seir, when thou marchedst out of the field of Edom, the earth trembled, and the heavens dropped, the clouds also dropped water.";
kjv[5] = "The mountains melted from before the LORD, [even] that Sinai from before the LORD God of Israel.";
kjv[6] = "In the days of Shamgar the son of Anath, in the days of Jael, the highways were unoccupied, and the travellers walked through byways.";
kjv[7] = "[The inhabitants of] the villages ceased, they ceased in Israel, until that I Deborah arose, that I arose a mother in Israel.";
kjv[8] = "They chose new gods; then [was] war in the gates: was there a shield or spear seen among forty thousand in Israel?";
kjv[9] = "My heart [is] toward the governors of Israel, that offered themselves willingly among the people. Bless ye the LORD.";
kjv[10] = "Speak, ye that ride on white asses, ye that sit in judgment, and walk by the way.";
kjv[11] = "[They that are delivered] from the noise of archers in the places of drawing water, there shall they rehearse the righteous acts of the LORD, [even] the righteous acts [toward the inhabitants] of his villages in Israel: then shall the people of the LORD go down to the gates.";
kjv[12] = "Awake, awake, Deborah: awake, awake, utter a song: arise, Barak, and lead thy captivity captive, thou son of Abinoam.";
kjv[13] = "Then he made him that remaineth have dominion over the nobles among the people: the LORD made me have dominion over the mighty.";
kjv[14] = "Out of Ephraim [was there] a root of them against Amalek; after thee, Benjamin, among thy people; out of Machir came down governors, and out of Zebulun they that handle the pen of the writer.";
kjv[15] = "And the princes of Issachar [were] with Deborah; even Issachar, and also Barak: he was sent on foot into the valley. For the divisions of Reuben [there were] great thoughts of heart.";
kjv[16] = "Why abodest thou among the sheepfolds, to hear the bleatings of the flocks? For the divisions of Reuben [there were] great searchings of heart.";
kjv[17] = "Gilead abode beyond Jordan: and why did Dan remain in ships? Asher continued on the sea shore, and abode in his breaches.";
kjv[18] = "Zebulun and Naphtali [were] a people [that] jeoparded their lives unto the death in the high places of the field.";
kjv[19] = "The kings came [and] fought, then fought the kings of Canaan in Taanach by the waters of Megiddo; they took no gain of money.";
kjv[20] = "They fought from heaven; the stars in their courses fought against Sisera.";
kjv[21] = "The river of Kishon swept them away, that ancient river, the river Kishon. O my soul, thou hast trodden down strength.";
kjv[22] = "Then were the horsehoofs broken by the means of the pransings, the pransings of their mighty ones.";
kjv[23] = "Curse ye Meroz, said the angel of the LORD, curse ye bitterly the inhabitants thereof; because they came not to the help of the LORD, to the help of the LORD against the mighty.";
kjv[24] = "Blessed above women shall Jael the wife of Heber the Kenite be, blessed shall she be above women in the tent.";
kjv[25] = "He asked water, [and] she gave [him] milk; she brought forth butter in a lordly dish.";
kjv[26] = "She put her hand to the nail, and her right hand to the workmen\'s hammer; and with the hammer she smote Sisera, she smote off his head, when she had pierced and stricken through his temples.";
kjv[27] = "At her feet he bowed, he fell, he lay down: at her feet he bowed, he fell: where he bowed, there he fell down dead.";
kjv[28] = "The mother of Sisera looked out at a window, and cried through the lattice, Why is his chariot [so] long in coming? why tarry the wheels of his chariots?";
kjv[29] = "Her wise ladies answered her, yea, she returned answer to herself,";
kjv[30] = "Have they not sped? have they [not] divided the prey; to every man a damsel [or] two; to Sisera a prey of divers colours, a prey of divers colours of needlework, of divers colours of needlework on both sides, [meet] for the necks of [them that take] the spoil?";
kjv[31] = "So let all thine enemies perish, O LORD: but [let] them that love him [be] as the sun when he goeth forth in his might. And the land had rest forty years.";

web[2] = "Praise ye the LORD for the avenging of Israel, when the people willingly offered themselves.";
hnv[2] = "For that the leaders took the lead in Yisra\'el, For that the people offered themselves willingly, Bless you the LORD.";

yng[3] = "Hear, ye kings; give ear, ye princes, I, to Jehovah, I -- I do sing, I sing praise to Jehovah, God of Israel.";

yng[5] = "Hills flowed from the face of Jehovah, This one -- Sinai -- From the face of Jehovah, God of Israel.";

rsv[6] = "&quot;In the days of Shamgar, son of Anath, in the days of Ja\'el, caravans ceased and travelers kept to the byways.";
asv[6] = "In the days of Shamgar the son of Anath, In the days of Jael, the highways were unoccupied, And the travellers walked through byways. ";
yng[6] = "In the days of Shamgar son of Anath -- In the days of Jael -- The ways have ceased, And those going in the paths go [in] crooked ways.";
dby[6] = "In the days of Shamgar the son of Anath, in the days of Jael, The roads were unused, and the travellers on highways went by crooked paths.";

asv[7] = "The rulers ceased in Israel, they ceased, Until that I Deborah arose, That I arose a mother in Israel. ";

rsv[11] = "To the sound of musicians at the watering places, there they repeat the triumphs of the LORD, the triumphs of his peasantry in Israel. &quot;Then down to the gates marched the people of the LORD.";
asv[11] = "Far from the noise of archers, in the places of drawing water, There shall they rehearse the righteous acts of Jehovah, [Even] the righteous acts of his rule in Israel. Then the people of Jehovah went down to the gates. ";
yng[11] = "By the voice of shouters Between the places of drawing water, There they give out righteous acts of Jehovah, Righteous acts of His villages in Israel, Then ruled in the gates have the people of Jehovah.";

rsv[14] = "From E\'phraim they set out thither into the valley, following you, Benjamin, with your kinsmen; from Machir marched down the commanders, and from Zeb\'ulun those who bear the marshal\'s staff;";
asv[14] = "Out of Ephraim [came down] they whose root is in Amalek; After thee, Benjamin, among thy peoples; Out of Machir came down governors, And out of Zebulun they that handle the marshal\'s staff. ";
yng[14] = "Out of Ephraim their root [is] against Amalek. After thee, Benjamin, among thy peoples. Out of Machir came down lawgivers, And out of Zebulun those drawing with the reed of a writer.";
dby[14] = "Out of Ephraim [came] those whose root was in Amalek; After thee was Benjamin among thy peoples. Out of Machir came down governors, And out of Zebulun they that handled the staff of the ruler.";
web[14] = "Out of Ephraim [was there] a root of them against Amalek; after thee, Benjamin, among thy people; out of Machir came down governors, and out of Zebulun they that handle the pen of the writer.";
hnv[14] = "Out of Efrayim [came down] they whose root is in `Amalek; After you, Binyamin, among your peoples; Out of Makhir came down governors, Out of Zevulun those who handle the marshal\'s staff.";

rsv[15] = "the princes of Is\'sachar came with Deb\'orah, and Is\'sachar faithful to Barak; into the valley they rushed forth at his heels. Among the clans of Reuben there were great searchings of heart.";

rsv[17] = "Gilead stayed beyond the Jordan; and Dan, why did he abide with the ships? Asher sat still at the coast of the sea, settling down by his landings.";

yng[17] = "Gilead beyond the Jordan did tabernacle, And Dan -- why doth he sojourn [in] ships? Asher hath abode at the haven of the seas, And by his creeks doth tabernacle.";
dby[17] = "Gilead abode beyond Jordan; And Dan, why did he remain in ships? Asher sat on the sea-shore, And abode in his creeks.";

yng[18] = "Zebulun [is] a people who exposed its soul to death, Naphtali also -- on high places of the field.";
dby[18] = "Zebulun is a people [that] jeoparded their lives unto death, Naphtali also, on the high places of the field.";
web[18] = "Zebulun and Naphtali [were] a people [that] jeoparded their lives to death in the high places of the field.";
hnv[18] = "Zevulun was a people that jeopardized their lives to the death, Naftali, on the high places of the field.";
vul[18] = "Zabulon vero et Nepthalim obtulerunt animas suas morti in regione Merome";
rsv[19] = "&quot;The kings came, they fought; then fought the kings of Canaan, at Ta\'anach, by the waters of Megid\'do; they got no spoils of silver.";
asv[19] = "The kings came and fought; Then fought the kings of Canaan, In Taanach by the waters of Megiddo: They took no gain of money. ";
yng[19] = "Kings came -- they fought; Then fought kings of Canaan, In Taanach, by the waters of Megiddo; Gain of money they took not!";
dby[19] = "Kings came, -- they fought; Then fought the kings of Canaan; At Taanach, by the waters of Megiddo; They took no spoil of silver.";
web[19] = "The kings came [and] fought, then fought the kings of Canaan in Tanach by the waters of Megiddo; they took no gain of money.";
hnv[19] = "The kings came and fought; Then fought the kings of Kana`an. In Ta`nakh by the waters of Megiddo: They took no gain of money.";
vul[19] = "venerunt reges et pugnaverunt pugnaverunt reges Chanaan in Thanach iuxta aquas Mageddo et tamen nihil tulere praedantes";
rsv[20] = "From heaven fought the stars, from their courses they fought against Sis\'era.";
asv[20] = "From heaven fought the stars, From their courses they fought against Sisera. ";
yng[20] = "From the heavens they fought: The stars from their highways fought with Sisera.";
dby[20] = "From heaven was the fight; The stars from their courses fought with Sisera.";
web[20] = "They fought from heaven; the stars in their courses fought against Sisera.";
hnv[20] = "From the sky the stars fought, From their courses they fought against Sisera.";
vul[20] = "de caelo dimicatum est contra eos stellae manentes in ordine et cursu suo adversum Sisaram pugnaverunt";
rsv[21] = "The torrent Kishon swept them away, the onrushing torrent, the torrent Kishon. March on, my soul, with might!";
asv[21] = "The river Kishon swept them away, That ancient river, the river Kishon. O my soul, march on with strength. ";
yng[21] = "The brook Kishon swept them away, The brook most ancient -- the brook Kishon. Thou dost tread down strength, O my soul!";
dby[21] = "The torrent of Kishon swept them away, That ancient torrent, the torrent Kishon. My soul, thou hast trodden down strength!";
web[21] = "The river of Kishon swept them away, that ancient river, the river Kishon. O my soul, thou hast trodden down strength.";
hnv[21] = "The river Kishon swept them away, That ancient river, the river Kishon. My soul, march on with strength.";
vul[21] = "torrens Cison traxit cadavera eorum torrens Cadumim torrens Cison conculca anima mea robustos";
rsv[22] = "&quot;Then loud beat the horses\' hoofs with the galloping, galloping of his steeds.";
asv[22] = "Then did the horsehoofs stamp By reason of the prancings, the prancings of their strong ones. ";
yng[22] = "Then broken were the horse-heels, By pransings -- pransings of its mighty ones.";
dby[22] = "Then did the horse-hoofs clatter with the coursings, The coursings of their steeds.";
web[22] = "Then were the horse\'s hoofs broken by the means of the prancings, the prancings of their mighty ones.";
hnv[22] = "Then did the horse hoofs stamp By reason of the prancings, the prancings of their strong ones.";
vul[22] = "ungulae equorum ceciderunt fugientibus impetu et per praeceps ruentibus fortissimis hostium";
rsv[23] = "&quot;Curse Meroz, says the angel of the LORD, curse bitterly its inhabitants, because they came not to the help of the LORD, to the help of the LORD against the mighty.";
asv[23] = "Curse ye Meroz, said the angel of Jehovah. Curse ye bitterly the inhabitants thereof, Because they came not to the help of Jehovah, To the help of Jehovah against the mighty. ";
yng[23] = "Curse Meroz -- said a messenger of Jehovah, Cursing, curse ye its inhabitants, For they came not to the help of Jehovah, To the help of Jehovah among the mighty!";
dby[23] = "Curse Meroz, saith the Angel of Jehovah; Curse, curse the inhabitants thereof; For they came not to the help of Jehovah, To the help of Jehovah among the mighty.";
web[23] = "Curse ye Meroz, said the angel of the LORD, curse ye bitterly its inhabitants; because they came not to the help of the LORD, to the help of the LORD against the mighty.";
hnv[23] = "Curse you Meroz, said the angel of the LORD. Curse you bitterly the inhabitants of it, Because they didn\'t come to the help of the LORD, To the help of the LORD against the mighty.";
vul[23] = "maledicite terrae Meroz dixit angelus Domini maledicite habitatoribus eius quia non venerunt ad auxilium Domini in adiutorium fortissimorum eius";
rsv[24] = "&quot;Most blessed of women be Ja\'el, the wife of Heber the Ken\'ite, of tent-dwelling women most blessed.";
asv[24] = "Blessed above women shall Jael be, The wife of Heber the Kenite; Blessed shall she be above women in the tent. ";
yng[24] = "Blessed above women is Jael, Wife of Heber the Kenite, Above women in the tent she is blessed.";
dby[24] = "Blessed above women shall Jael the wife of Heber the Kenite be, Blessed above women in the tent!";
web[24] = "Blessed above women shall Jael the wife of Heber the Kenite be, blessed shall she be above women in the tent.";
hnv[24] = "Blessed above women shall Ya`el be, The wife of Hever the Keni; Blessed shall she be above women in the tent.";
vul[24] = "benedicta inter mulieres Iahel uxor Aber Cinei benedicatur in tabernaculo suo";
rsv[25] = "He asked water and she gave him milk, she brought him curds in a lordly bowl.";
asv[25] = "He asked water, [and] she gave him milk; She brought him butter in a lordly dish. ";
yng[25] = "Water he asked -- milk she gave; In a lordly dish she brought near butter.";
dby[25] = "He asked water, she gave milk; In the nobles\' bowl she brought forth cream.";
web[25] = "He asked water, [and] she gave [him] milk; she brought forth butter in a lordly dish.";
hnv[25] = "He asked water, [and] she gave him milk; She brought him butter in a lordly dish.";
vul[25] = "aquam petenti lac dedit et in fiala principum obtulit butyrum";
rsv[26] = "She put her hand to the tent peg and her right hand to the workmen\'s mallet; she struck Sis\'era a blow, she crushed his head, she shattered and pierced his temple.";
asv[26] = "She put her hand to the tent-pin, And her right hand to the workmen\'s hammer; And with the hammer she smote Sisera, she smote through his head; Yea, she pierced and struck through his temples. ";
yng[26] = "Her hand to the pin she sendeth forth, And her right hand to the labourers\' hammer, And she hammered Sisera -- she smote his head, Yea, she smote, and it passed through his temple.";
dby[26] = "She put her hand to the tent-pin, And her right hand to the workmen\'s hammer; And she smote Sisera, she struck through his head, Shattered and pierced through his temples.";
web[26] = "She put her hand to the nail, and her right hand to the workmen\'s hammer; and with the hammer she smote Sisera, she smote off his head, when she had pierced and struck through his temples.";
hnv[26] = "She put her hand to the tent-pin, Her right hand to the workmen\'s hammer; With the hammer she struck Sisera, she struck through his head; Yes, she pierced and struck through his temples.";
vul[26] = "sinistram manum misit ad clavum et dexteram ad fabrorum malleos percussitque Sisaram quaerens in capite vulneri locum et tempus valide perforans";
rsv[27] = "He sank, he fell, he lay still at her feet; at her feet he sank, he fell; where he sank, there he fell dead.";
asv[27] = "At her feet he bowed, he fell, he lay; At her feet he bowed, he fell: Where he bowed, there he fell down dead. ";
yng[27] = "Between her feet he bowed -- He fell, he lay down; Between her feet he bowed, he fell; Where he bowed, there he fell -- destroyed.";
dby[27] = "Between her feet he bowed, he fell, he lay down: Between her feet he bowed, he fell; Where he bowed, there he fell, overcome.";
web[27] = "At her feet he bowed, he fell, he lay down: at her feet he bowed, he fell: where he bowed, there he fell down dead.";
hnv[27] = "At her feet he bowed, he fell, he lay; At her feet he bowed, he fell; Where he bowed, there he fell down dead.";
vul[27] = "inter pedes eius ruit defecit et mortuus est ante pedes illius volvebatur et iacebat exanimis et miserabilis";
rsv[28] = "&quot;Out of the window she peered, the mother of Sis\'era gazed through the lattice: \'Why is his chariot so long in coming? Why tarry the hoofbeats of his chariots?\'";
asv[28] = "Through the window she looked forth, and cried, The mother of Sisera [cried] through the lattice, Why is his chariot so long in coming? Why tarry the wheels of his chariots? ";
yng[28] = "Through the window she hath looked out -- Yea, she crieth out -- the mother of Sisera, Through the lattice: Wherefore is his chariot delaying to come? Wherefore tarried have the steps of his chariot?";
dby[28] = "Them other of Sisera looketh out at the window, And crieth through the lattice, Why is his chariot so long in coming? Why tarry the trampings of his chariots?";
web[28] = "The mother of Sisera looked out at a window, and cried through the lattice, Why is his chariot [so] long in coming? why tarry the wheels of his chariots?";
hnv[28] = "Through the window she looked forth, and cried, The mother of Sisera [cried] through the lattice, Why is his chariot so long in coming? Why do the wheels of his chariots wait?";
vul[28] = "per fenestram prospiciens ululabat mater eius et de cenaculo loquebatur cur moratur regredi currus eius quare tardaverunt pedes quadrigarum illius";
rsv[29] = "Her wisest ladies make answer, nay, she gives answer to herself,";
asv[29] = "Her wise ladies answered her, Yea, she returned answer to herself, ";
yng[29] = "The wise ones, her princesses, answer her, Yea, she returneth her sayings to herself:";
dby[29] = "The wise amongst her ladies answer [her], Yea, she returneth answer to herself,";
web[29] = "Her wise ladies answered her, yes, she returned answer to herself.";
hnv[29] = "Her wise ladies answered her, Yes, she returned answer to herself,";
vul[29] = "una sapientior ceteris uxoribus eius haec socrui verba respondit";
rsv[30] = "\'Are they not finding and dividing the spoil?--A maiden or two for every man; spoil of dyed stuffs for Sis\'era, spoil of dyed stuffs embroidered, two pieces of dyed work embroidered for my neck as spoil?\'";
asv[30] = "Have they not found, have they not divided the spoil? A damsel, two damsels to every man; To Sisera a spoil of dyed garments, A spoil of dyed garments embroidered, Of dyed garments embroidered on both sides, on the necks of the spoil? ";
yng[30] = "Do they not find? -- they apportion spoil, A female -- two females -- for every head, Spoil of finger-work for Sisera, Spoil of embroidered finger-work, Finger-work -- a pair of embroidered things, For the necks of the spoil!";
dby[30] = "Have they not found, divided the booty, A damsel, two damsels, to each? A booty of dyed stuffs for Sisera, A booty of dyed stuffs of embroidery, Dyed stuff of double embroidery for the neck of a spoiler?";
web[30] = "Have they not found; have they [not] divided the prey; to every man a damsel [or] two; to Sisera a prey of divers colors, a prey of divers colors of needle-work, of divers colors of needle-work on both sides, [meet] for the necks of [them that take] the spoil?";
hnv[30] = "Have they not found, have they not divided the spoil? A lady, two ladies to every man; To Sisera a spoil of dyed garments, A spoil of dyed garments embroidered, Of dyed garments embroidered on both sides, on the necks of the spoil?";
vul[30] = "forsitan nunc dividit spolia et pulcherrima feminarum eligitur ei vestes diversorum colorum Sisarae traduntur in praedam et supellex varia ad ornanda colla congeritur";
rsv[31] = "&quot;So perish all thine enemies, O LORD! But thy friends be like the sun as he rises in his might.&quot; And the land had rest for forty years.";
asv[31] = "So let all thine enemies perish, O Jehovah: But let them that love him be as the sun when he goeth forth in his might. And the land had rest forty years.";
yng[31] = "So do all Thine enemies perish, O Jehovah, And those loving Him [are] As the going out of the sun in its might!\' and the land resteth forty years.";
dby[31] = "So let all thine enemies perish, Jehovah! But let them that love him be as the rising of the sun in its might. And the land had rest forty years.";
web[31] = "So let all thy enemies perish, O LORD: but [let] them that love him [be] as the sun when he goeth forth in his might. And the land had rest forty years.";
hnv[31] = "So let all your enemies perish, LORD: But let those who love him be as the sun when he goes forth in his might. The land had rest forty years.";
vul[31] = "sic pereant omnes inimici tui Domine qui autem diligunt te sicut sol in ortu suo splendet ita rutilent [Vulgate 5:32] quievitque terra per quadraginta annos";
