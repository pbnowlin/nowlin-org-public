csb[1] = "These are the nations the LORD left in order to test all those in Israel who had experienced none of the wars in Canaan.";
csb[2] = "This was to teach the future generations of the Israelites how to fight in battle, especially those who had not fought before.";
csb[3] = "These nations included the five rulers of the Philistines and all of the Canaanites, the Sidonians, and the Hivites who lived in the Lebanese mountains from Mount Baal-hermon as far as the entrance to Hamath.";
csb[4] = "The LORD left them to test Israel, to determine if they would keep the LORD\'s commands he had given their fathers through Moses.";
csb[5] = "But they settled among the Canaanites, Hethites, Amorites, Perizzites, Hivites, and Jebusites.";
csb[6] = "The Israelites took their daughters as wives for themselves, gave their own daughters to their sons, and worshiped their gods.";
csb[7] = "The Israelites did what was evil in the LORD\'s sight; they forgot the LORD their God and worshiped the Baals and the Asherahs.";
csb[8] = "The LORD\'s anger burned against Israel, and he sold them to King Cushan-rishathaim of Aram-naharaim, and the Israelites served him eight years.";
csb[9] = "The Israelites cried out to the LORD. So the LORD raised up Othniel son of Kenaz, Caleb\'s youngest brother, as a deliverer to save the Israelites.";
csb[10] = "The Spirit of the LORD came on him, and he judged Israel. Othniel went out to battle, and the LORD handed over King Cushan-rishathaim of Aram to him, so that Othniel overpowered him.";
csb[11] = "Then the land had peace for forty years, and Othniel son of Kenaz died.";
csb[12] = "The Israelites again did what was evil in the LORD\'s sight. He gave King Eglon of Moab power over Israel, because they had done what was evil in the LORD\'s sight.";
csb[13] = "After Eglon convinced the Ammonites and the Amalekites to join forces with him, he attacked and defeated Israel and took possession of the City of Palms.";
csb[14] = "The Israelites served King Eglon of Moab eighteen years.";
csb[15] = "Then the Israelites cried out to the LORD, and he raised up Ehud son of Gera, a left-handed Benjaminite, as a deliverer for them. The Israelites sent him with the tribute for King Eglon of Moab.";
csb[16] = "Ehud made himself a double-edged sword eighteen inches long. He strapped it to his right thigh under his clothes";
csb[17] = "and brought the tribute to King Eglon of Moab, who was an extremely fat man.";
csb[18] = "When Ehud had finished presenting the tribute, he dismissed the people who had carried it.";
csb[19] = "At the carved images near Gilgal he returned and said, &quot;King Eglon, I have a secret message for you.&quot; The king said, &quot;Silence! &quot; and all his attendants left him.";
csb[20] = "Then Ehud approached him while he was sitting alone in his upstairs room where it was cool. Ehud said, &quot;I have a message from God for you,&quot; and the king stood up from his throne.";
csb[21] = "Ehud reached with his left hand, took the sword from his right thigh, and plunged it into Eglon\'s belly.";
csb[22] = "Even the handle went in after the blade, and Eglon\'s fat closed in over it, so that Ehud did not withdraw the sword from his belly. And the waste came out.";
csb[23] = "Ehud escaped by way of the porch, closing and locking the doors of the upstairs room behind him.";
csb[24] = "Ehud was gone when Eglon\'s servants came in. They looked and found the doors of the upstairs room locked and thought he was relieving himself in the cool room.";
csb[25] = "The servants waited until they became embarrassed and saw that he had still not opened the doors of the upstairs room. So they took the key and opened the doors -- and there was their lord lying dead on the floor!";
csb[26] = "Ehud escaped while the servants waited. He passed the Jordan near the carved images and reached Seirah.";
csb[27] = "After he arrived, he sounded the ram\'s horn throughout the hill country of Ephraim. The Israelites came down with him from the hill country, and he became their leader.";
csb[28] = "He told them, &quot;Follow me, because the LORD has handed over your enemies, the Moabites, to you.&quot; So they followed him, captured the fords of the Jordan leading to Moab, and did not allow anyone to cross over.";
csb[29] = "At that time they struck down about ten thousand Moabites, all stout and able-bodied men. Not one of them escaped.";
csb[30] = "Moab became subject to Israel that day, and the land had peace for eighty years.";
csb[31] = "After Ehud, Shamgar son of Anath became judge. He also delivered Israel, striking down six hundred Philistines with a cattle prod.";

hnv[18] = "When he had made an end of offering the tribute, he sent away the people who bore the tribute.";
vul[18] = "cumque obtulisset ei munera prosecutus est socios qui cum eo venerant";
kjv[19] = "But he himself turned again from the quarries that [were] by Gilgal, and said, I have a secret errand unto thee, O king: who said, Keep silence. And all that stood by him went out from him.";
rsv[19] = "But he himself turned back at the sculptured stones near Gilgal, and said, &quot;I have a secret message for you, O king.&quot; And he commanded, &quot;Silence.&quot; And all his attendants went out from his presence.";
asv[19] = "But he himself turned back from the quarries that were by Gilgal, and said, I have a secret errand unto thee, O king. And he said, Keep silence. And all that stood by him went out from him.";
yng[19] = "and he himself hath turned back from the graven images which [are] at Gilgal, and saith, `A secret word I have unto thee, O king;\' and he saith, `Hush!\' and go out from him do all those standing by him.";
dby[19] = "But he turned from the graven images that were by Gilgal, and said, I have a secret word unto thee, O king. And he said, Be silent! And all that stood by him went out from him.";
web[19] = "But he himself turned again from the quarries that [were] by Gilgal, and said, I have a secret errand to thee, O king: who said, Keep silence. And all that stood by him went out from him.";
hnv[19] = "But he himself turned back from the quarries that were by Gilgal, and said, I have a secret errand to you, king. He said, Keep silence. All who stood by him went out from him.";
vul[19] = "et reversus de Galgalis ubi erant idola dixit ad regem verbum secretum habeo ad te o rex et ille imperavit silentium egressisque omnibus qui circa eum erant";
kjv[20] = "And Ehud came unto him; and he was sitting in a summer parlour, which he had for himself alone. And Ehud said, I have a message from God unto thee. And he arose out of [his] seat.";
rsv[20] = "And Ehud came to him, as he was sitting alone in his cool roof chamber. And Ehud said, &quot;I have a message from God for you.&quot; And he arose from his seat.";
asv[20] = "And Ehud came unto him; and he was sitting by himself alone in the cool upper room. And Ehud said, I have a message from God unto thee. And he arose out of his seat.";
yng[20] = "And Ehud hath come unto him, and he is sitting in the upper chamber of the wall which he hath for himself, and Ehud saith, `A word of God I have unto thee;\' and he riseth from off the throne;";
dby[20] = "And Ehud came to him; now he was sitting in the cool upper-chamber, which was for him alone. And Ehud said, I have a word from God unto thee. And he arose from the seat.";
web[20] = "And Ehud came to him; and he was sitting in a summer-parlor, which he had for himself alone: and Ehud said, I have a message from God to thee. And he arose from [his] seat.";
hnv[20] = "Ehud came to him; and he was sitting by himself alone in the cool upper room. Ehud said, I have a message from God to you. He arose out of his seat.";
vul[20] = "ingressus est Ahoth ad eum sedebat autem in aestivo cenaculo solus dixitque verbum Dei habeo ad te qui statim surrexit de throno";
kjv[21] = "And Ehud put forth his left hand, and took the dagger from his right thigh, and thrust it into his belly:";
rsv[21] = "And Ehud reached with his left hand, took the sword from his right thigh, and thrust it into his belly;";
asv[21] = "And Ehud put forth his left hand, and took the sword from his right thigh, and thrust it into his body:";
yng[21] = "and Ehud putteth forth his left hand, and taketh the sword from off his right thigh, and striketh it into his belly;";
dby[21] = "Then Ehud put forth his left hand, and took the sword from his right hip, and thrust it into his belly;";
web[21] = "And Ehud put forth his left hand, and took the dagger from his right thigh, and thrust it into his belly:";
hnv[21] = "Ehud put forth his left hand, and took the sword from his right thigh, and thrust it into his body:";
vul[21] = "extenditque Ahoth manum sinistram et tulit sicam de dextro femore suo infixitque eam in ventre eius";
kjv[22] = "And the haft also went in after the blade; and the fat closed upon the blade, so that he could not draw the dagger out of his belly; and the dirt came out.";
rsv[22] = "and the hilt also went in after the blade, and the fat closed over the blade, for he did not draw the sword out of his belly; and the dirt came out.";
asv[22] = "and the haft also went in after the blade; and the fat closed upon the blade, for he drew not the sword out of his body; and it came out behind.";
yng[22] = "and the haft also goeth in after the blade, and the fat shutteth on the blade, that he hath not drawn the sword out of his belly, and it goeth out at the fundament.";
dby[22] = "and the haft also went in after the blade, and the fat closed upon the blade; for he did not draw the sword out of his belly, and it came out between the legs.";
web[22] = "And the haft also entered after the blade: and the fat closed upon the blade, so that he could not draw the dagger out of his belly; and the dirt came out.";
hnv[22] = "and the haft also went in after the blade; and the fat closed on the blade, for he didn\'t draw the sword out of his body; and it came out behind.";
vul[22] = "tam valide ut capulus ferrum sequeretur in vulnere ac pinguissimo adipe stringeretur nec eduxit gladium sed ita ut percusserat reliquit in corpore statimque per secreta naturae alvi stercora proruperunt";
kjv[23] = "Then Ehud went forth through the porch, and shut the doors of the parlour upon him, and locked them.";
rsv[23] = "Then Ehud went out into the vestibule, and closed the doors of the roof chamber upon him, and locked them.";
asv[23] = "Then Ehud went forth into the porch, and shut the doors of the upper room upon him, and locked them.";
yng[23] = "And Ehud goeth out at the porch, and shutteth the doors of the upper chamber upon him, and hath bolted [it];";
dby[23] = "And Ehud went out into the portico, and shut the doors of the upper-chamber upon him, and bolted them.";
web[23] = "Then Ehud went forth through the porch, and shut the doors of the parlor upon him, and locked them.";
hnv[23] = "Then Ehud went forth into the porch, and shut the doors of the upper room on him, and locked them.";
vul[23] = "Ahoth autem clausis diligentissime ostiis cenaculi et obfirmatis sera";
kjv[24] = "When he was gone out, his servants came; and when they saw that, behold, the doors of the parlour [were] locked, they said, Surely he covereth his feet in his summer chamber.";
rsv[24] = "When he had gone, the servants came; and when they saw that the doors of the roof chamber were locked, they thought, &quot;He is only relieving himself in the closet of the cool chamber.&quot;";
asv[24] = "Now when he was gone out, his servants came; and they saw, and, behold, the doors of the upper room were locked; and they said, Surely he is covering his feet in the upper chamber.";
yng[24] = "and he hath gone out, and his servants have come in, and look, and lo, the doors of the upper chamber are bolted, and they say, `He is only covering his feet in the inner chamber of the wall.\'";
dby[24] = "And when he was gone out, the servants of the [king] came and saw, and behold, the doors of the upper-chamber were bolted. And they said, Surely he is covering his feet in the summer chamber.";
web[24] = "When he had gone out, his servants came; and when they saw that, behold, the doors of the parlor [were] locked, they said, Surely he covereth his feet in his summer-chamber.";
hnv[24] = "Now when he was gone out, his servants came; and they saw, and, behold, the doors of the upper room were locked; and they said, Surely he is covering his feet in the upper chamber.";
vul[24] = "per posticam egressus est servique regis ingressi viderunt clausas fores cenaculi atque dixerunt forsitan purgat alvum in aestivo cubiculo";
kjv[25] = "And they tarried till they were ashamed: and, behold, he opened not the doors of the parlour; therefore they took a key, and opened [them]: and, behold, their lord [was] fallen down dead on the earth.";
rsv[25] = "And they waited till they were utterly at a loss; but when he still did not open the doors of the roof chamber, they took the key and opened them; and there lay their lord dead on the floor.";
asv[25] = "And they tarried till they were ashamed; and, behold, he opened not the doors of the upper room: therefore they took the key, and opened [them]; and, behold, their lord was fallen down dead on the earth.";
yng[25] = "And they stay till confounded, and lo, he is not opening the doors of the upper chamber, and they take the key, and open, and lo, their lord is fallen to the earth -- dead.";
dby[25] = "And they waited till they were ashamed; and behold, he opened not the doors of the upper-chamber, and they took the key, and opened [them], and behold, their lord lay dead on the earth.";
web[25] = "And they tarried till they were ashamed: and behold, he opened not the doors of the parlor, therefore they took a key and opened [them]: and behold, their lord lay dead on the earth.";
hnv[25] = "They waited until they were ashamed; and, behold, he didn\'t open the doors of the upper room: therefore they took the key, and opened [them], and, behold, their lord was fallen down dead on the eretz.";
vul[25] = "expectantesque diu donec erubescerent et videntes quod nullus aperiret tulerunt clavem et aperientes invenerunt dominum suum iacentem in terra mortuum";
kjv[26] = "And Ehud escaped while they tarried, and passed beyond the quarries, and escaped unto Seirath.";
rsv[26] = "Ehud escaped while they delayed, and passed beyond the sculptured stones, and escaped to Se-i\'rah.";
asv[26] = "And Ehud escaped while they tarried, and passed beyond the quarries, and escaped unto Seirah.";
yng[26] = "And Ehud escaped during their tarrying, and hath passed by the images, and is escaped to Seirath.";
dby[26] = "And Ehud had escaped while they lingered, and passed beyond the graven images, and escaped to Seirah.";
web[26] = "And Ehud escaped while they tarried; and passed beyond the quarries, and escaped to Seirath.";
hnv[26] = "Ehud escaped while they waited, and passed beyond the quarries, and escaped to Seirah.";
vul[26] = "Ahoth autem dum illi turbarentur effugit et pertransiit locum Idolorum unde reversus fuerat venitque in Seirath";
kjv[27] = "And it came to pass, when he was come, that he blew a trumpet in the mountain of Ephraim, and the children of Israel went down with him from the mount, and he before them.";
rsv[27] = "When he arrived, he sounded the trumpet in the hill country of E\'phraim; and the people of Israel went down with him from the hill country, having him at their head.";
asv[27] = "And it came to pass, when he was come, that he blew a trumpet in the hill-country of Ephraim; and the children of Israel went down with him from the hill-country, and he before them.";
yng[27] = "And it cometh to pass, in his coming in, that he bloweth with a trumpet in the hill-country of Ephraim, and go down with him do the sons of Israel from the hill-country, and he before them;";
dby[27] = "And it came to pass when he was come, that he blew a trumpet in the hill-country of Ephraim, and the children of Israel went down with him from the hill-country, and he before them.";
web[27] = "And it came to pass when he had come, that he blew a trumpet in the mountain of Ephraim, and the children of Israel went down with him from the mount, and he before them.";
hnv[27] = "It happened, when he had come, that he blew a shofar in the hill-country of Efrayim; and the children of Yisra\'el went down with him from the hill-country, and he before them.";
vul[27] = "et statim insonuit bucina in monte Ephraim descenderuntque cum eo filii Israhel ipso in fronte gradiente";
kjv[28] = "And he said unto them, Follow after me: for the LORD hath delivered your enemies the Moabites into your hand. And they went down after him, and took the fords of Jordan toward Moab, and suffered not a man to pass over.";
rsv[28] = "And he said to them, &quot;Follow after me; for the LORD has given your enemies the Moabites into your hand.&quot; So they went down after him, and seized the fords of the Jordan against the Moabites, and allowed not a man to pass over.";
asv[28] = "And he said unto them, Follow after me; for Jehovah hath delivered your enemies the Moabites into your hand. And they went down after him, and took the fords of the Jordan against the Moabites, and suffered not a man to pass over.";
yng[28] = "and he saith unto them, `Pursue after me, for Jehovah hath given your enemies, the Moabites, into your hand;\' and they go down after him, and capture the passages of the Jordan towards Moab, and have not permitted a man to pass over.";
dby[28] = "And he said to them, Follow after me, for Jehovah has delivered your enemies the Moabites into your hand. And they went down after him, and took the fords of the Jordan toward Moab, and suffered no one to pass over.";
web[28] = "And he said to them, Follow me: for the LORD hath delivered your enemies the Moabites into your hand. And they went down after him, and took the fords of Jordan towards Moab, and suffered not a man to pass over.";
hnv[28] = "He said to them, Follow after me; for the LORD has delivered your enemies the Mo`avim into your hand. They went down after him, and took the fords of the Yarden against the Mo`avim, and didn\'t allow a man to pass over.";
vul[28] = "qui dixit ad eos sequimini me tradidit enim Dominus inimicos nostros Moabitas in manus nostras descenderuntque post eum et occupaverunt vada Iordanis quae transmittunt in Moab et non dimiserunt transire quemquam";
kjv[29] = "And they slew of Moab at that time about ten thousand men, all lusty, and all men of valour; and there escaped not a man.";
rsv[29] = "And they killed at that time about ten thousand of the Moabites, all strong, able-bodied men; not a man escaped.";
asv[29] = "And they smote of Moab at that time about ten thousand men, every lusty man, and every man of valor; and there escaped not a man.";
yng[29] = "And they smite Moab at that time, about ten thousand men, all robust, and every one a man of valour, and not a man hath escaped,";
dby[29] = "And they slew the Moabites at that time, about ten thousand men, all fat, and all men of valour, and not a man escaped.";
web[29] = "And they slew of Moab at that time about ten thousand men, all lusty, and all men of valor: and there escaped not a man.";
hnv[29] = "They struck of Mo\'av at that time about ten thousand men, every lusty man, and every man of valor; and there escaped not a man.";
vul[29] = "sed percusserunt Moabitas in tempore illo circiter decem milia omnes robustos et fortes viros nullus eorum evadere potuit";
kjv[30] = "So Moab was subdued that day under the hand of Israel. And the land had rest fourscore years.";
rsv[30] = "So Moab was subdued that day under the hand of Israel. And the land had rest for eighty years.";
asv[30] = "So Moab was subdued that day under the hand of Israel. And the land had rest fourscore years.";
yng[30] = "and Moab is humbled in that day under the hand of Israel; and the land resteth eighty years.";
dby[30] = "And Moab was subdued that day under the hand of Israel. And the land had rest eighty years.";
web[30] = "So Moab was subdued that day under the hand of Israel: and the land had rest eighty years.";
hnv[30] = "So Mo\'av was subdued that day under the hand of Yisra\'el. The land had rest eighty years.";
vul[30] = "humiliatusque est Moab die illo sub manu Israhel et quievit terra octoginta annis";

rsv[31] = "After him was Shamgar the son of Anath, who killed six hundred of the Philistines with an oxgoad; and he too delivered Israel.";
asv[31] = "And after him was Shamgar the son of Anath, who smote of the Philistines six hundred men with an ox-goad: and he also saved Israel.";
yng[31] = "And after him hath been Shamgar son of Anath, and he smiteth the Philistines -- six hundred men -- with an ox-goad, and he saveth -- he also -- Israel.";
dby[31] = "And after him was Shamgar the son of Anath; and he smote the Philistines, six hundred men, with an ox-goad. And he also delivered Israel.";
web[31] = "And after him was Shamgar the son of Anath, who slew of the Philistines six hundred men with an ox-goad; and he also delivered Israel.";
hnv[31] = "After him was Shamgar the son of `Anat, who struck of the Pelishtim six hundred men with an ox-goad: and he also saved Yisra\'el.";
vul[31] = "post hunc fuit Samgar filius Anath qui percussit de Philisthim sescentos viros vomere et ipse quoque defendit Israhel";
