csb[1] = "The men of Israel had sworn an oath at Mizpah: &quot;None of us will give his daughter to a Benjaminite in marriage.&quot;";
csb[2] = "So the people went to Bethel and sat there before God until evening. They wept loudly and bitterly,";
csb[3] = "and cried out, &quot;Why, LORD God of Israel, has it occurred that one tribe is missing in Israel today? &quot;";
csb[4] = "The next day the people got up early, built an altar there, and offered burnt offerings and fellowship offerings.";
csb[5] = "The Israelites asked, &quot;Who of all the tribes of Israel didn\'t come to the LORD with the assembly? &quot; For a great oath had been taken that anyone who had not come to the LORD at Mizpah would certainly be put to death.";
csb[6] = "But the Israelites had compassion on their brothers, the Benjaminites, and said, &quot;Today a tribe has been cut off from Israel.";
csb[7] = "&quot;What should we do about wives for the survivors? We\'ve sworn to the LORD not to give them any of our daughters as wives.&quot;";
csb[8] = "They asked, &quot;Which city among the tribes of Israel didn\'t come to the LORD at Mizpah? &quot; It turned out that no one from Jabesh-gilead had come to the camp and the assembly.";
csb[9] = "For when the roll was called, no men were there from the inhabitants of Jabesh-gilead.";
csb[10] = "The congregation sent twelve thousand brave warriors there and commanded them: &quot;Go and kill the inhabitants of Jabesh-gilead with the sword, including women and dependents.";
csb[11] = "&quot;This is what you should do: Completely destroy every male, as well as every woman who has gone to bed with a man.&quot;";
csb[12] = "They found among the inhabitants of Jabesh-gilead four hundred young virgins, who had not gone to bed with a man, and they brought them to the camp at Shiloh in the land of Canaan.";
csb[13] = "The whole congregation sent a message of peace to the Benjaminites who were at Rimmon Rock.";
csb[14] = "Benjamin returned at that time, and Israel gave them the women they had kept alive from Jabesh-gilead. But there were not enough for them.";
csb[15] = "The people had compassion on Benjamin, because the LORD had made this gap in the tribes of Israel.";
csb[16] = "The elders of the congregation said, &quot;What should we do about wives for those who are left, since the women of Benjamin have been destroyed? &quot;";
csb[17] = "They said, &quot;There must be heirs for the survivors of Benjamin, so that a tribe of Israel will not be wiped out.";
csb[18] = "&quot;But we can\'t give them our daughters as wives.&quot; For the Israelites had sworn, &quot;Anyone who gives a wife to a Benjaminite is cursed.&quot;";
csb[19] = "They also said, &quot;Look, there\'s an annual festival to the LORD in Shiloh, which is north of Bethel, east of the highway that goes up from Bethel to Shechem, and south of Lebonah.&quot;";
csb[20] = "Then they commanded the Benjaminites: &quot;Go and hide in the vineyards.";
csb[21] = "&quot;Watch, and when you see the young women of Shiloh come out to perform the dances, each of you leave the vineyards and catch a wife for yourself from the young women of Shiloh, and go to the land of Benjamin.";
csb[22] = "&quot;When their fathers or brothers come to us and protest, we will tell them, \'Show favor to them, since we did not get enough wives for each of them in the battle. You didn\'t actually give the women to them, so you are not guilty of breaking your oath.\' &quot;";
csb[23] = "The Benjaminites did this and took the number of women they needed from the dancers they caught. They went back to their own inheritance, rebuilt their cities, and lived in them.";
csb[24] = "At that time, each of the Israelites returned from there to his own tribe and family. Each returned from there to his own inheritance.";
csb[25] = "In those days there was no king in Israel; everyone did whatever seemed right to him.";

asv[19] = "And they said, Behold, there is a feast of Jehovah from year to year in Shiloh, which is on the north of Beth-el, on the east side of the highway that goeth up from Beth-el to Shechem, and on the south of Lebonah.";
yng[19] = "And they say, `Lo, a festival of Jehovah [is] in Shiloh, from time to time, which [is] on the north of Beth-El, at the rising of the sun, by the highway which is going up from Beth-El to Shechem, and on the south of Lebonah.\'";
dby[19] = "And they said, Behold, there is a feast of Jehovah from year to year in Shiloh, which is on the north side of Bethel, toward the sun-rising of the highway that goes up from Bethel to Shechem, and on the south of Lebonah.";
web[19] = "Then they said, Behold, [there is] a feast of the LORD in Shiloh yearly [in a place] which [is] on the north side of Beth-el, on the east side of the highway that goeth up from Beth-el to Shechem, and on the south of Lebonah.";
hnv[19] = "They said, Behold, there is a feast of the LORD from year to year in Shiloh, which is on the north of Beit-El, on the east side of the highway that goes up from Beit-El to Shekhem, and on the south of Levonah.";
vul[19] = "ceperuntque consilium atque dixerunt ecce sollemnitas Domini est in Silo anniversaria quae sita est ad septentrionem urbis Bethel et ad orientalem plagam viae quae de Bethel tendit ad Sycimam et ad meridiem oppidi Lebona";
kjv[20] = "Therefore they commanded the children of Benjamin, saying, Go and lie in wait in the vineyards;";
rsv[20] = "And they commanded the Benjaminites, saying, &quot;Go and lie in wait in the vineyards,";
asv[20] = "And they commanded the children of Benjamin, saying, Go and lie in wait in the vineyards,";
yng[20] = "And they command the sons of Benjamin, saying, `Go -- and ye have laid wait in the vineyards,";
dby[20] = "And they commanded the sons of Benjamin, saying, Go and lie in wait in the vineyards;";
web[20] = "Therefore they commanded the children of Benjamin, saying, Go, and lie in wait in the vineyards;";
hnv[20] = "They commanded the children of Binyamin, saying, Go and lie in wait in the vineyards,";
vul[20] = "praeceperuntque filiis Beniamin atque dixerunt ite et latete in vineis";
kjv[21] = "And see, and, behold, if the daughters of Shiloh come out to dance in dances, then come ye out of the vineyards, and catch you every man his wife of the daughters of Shiloh, and go to the land of Benjamin.";
rsv[21] = "and watch; if the daughters of Shiloh come out to dance in the dances, then come out of the vineyards and seize each man his wife from the daughters of Shiloh, and go to the land of Benjamin.";
asv[21] = "and see, and, behold, if the daughters of Shiloh come out to dance in the dances, then come ye out of the vineyards, and catch you every man his wife of the daughters of Shiloh, and go to the land of Benjamin.";
yng[21] = "and have seen, and lo, if the daughters of Shiloh come out to dance in dances -- then ye have gone out from the vineyards, and caught for you each his wife out of the daughters of Shiloh, and gone to the land of Benjamin;";
dby[21] = "and see, and behold, if the daughters of Shiloh come out to dance in the dances, then come out of the vineyards, and catch you every man his wife of the daughters of Shiloh, and go to the land of Benjamin.";
web[21] = "And see, and behold, if the daughters of Shiloh come out to dance in dances, then come ye out of the vineyards, and catch you every man his wife of the daughters of Shiloh, and go to the land of Benjamin.";
hnv[21] = "and see, and, behold, if the daughters of Shiloh come out to dance in the dances, then come you out of the vineyards, and catch you every man his wife of the daughters of Shiloh, and go to the land of Binyamin.";
vul[21] = "cumque videritis filias Silo ad ducendos choros ex more procedere exite repente de vineis et rapite eas singuli uxores singulas et pergite in terram Beniamin";
kjv[22] = "And it shall be, when their fathers or their brethren come unto us to complain, that we will say unto them, Be favourable unto them for our sakes: because we reserved not to each man his wife in the war: for ye did not give unto them at this time, [that] ye should be guilty.";
rsv[22] = "And when their fathers or their brothers come to complain to us, we will say to them, \'Grant them graciously to us; because we did not take for each man of them his wife in battle, neither did you give them to them, else you would now be guilty.\'&quot;";
asv[22] = "And it shall be, when their fathers or their brethren come to complain unto us, that we will say unto them, Grant them graciously unto us, because we took not for each man [of them] his wife in battle, neither did ye give them unto them, else would ye now be guilty.";
yng[22] = "and it hath been, when their fathers or their brethren come in to plead unto us, that we have said unto them, Favour us [by] them, for we have not taken [to] each his wife in battle, for ye -- ye have not given to them at this time [that] ye are guilty.\'";
dby[22] = "And it shall be, when their fathers or their brethren come to complain to us, that we will say to them, Gratify us with them, because we did not take each man his wife in the war; for ye did not give them to them, that ye should now be guilty.";
web[22] = "And it shall be, when their fathers or their brethren come to us to complain, that we will say to them, Be favorable to them for our sakes: because we reserved not to each man his wife in the war: for ye did not give to them at this time, [that] ye should be guilty.";
hnv[22] = "It shall be, when their fathers or their brothers come to complain to us, that we will say to them, Grant them graciously to us, because we didn\'t take for each man his wife in battle, neither did you give them to them, else would you now be guilty.";
vul[22] = "cumque venerint patres earum ac fratres et adversum vos queri coeperint atque iurgari dicemus eis miseremini eorum non enim rapuerunt eas iure bellantium atque victorum sed rogantibus ut acciperent non dedistis et a vestra parte peccatum est";
kjv[23] = "And the children of Benjamin did so, and took [them] wives, according to their number, of them that danced, whom they caught: and they went and returned unto their inheritance, and repaired the cities, and dwelt in them.";
rsv[23] = "And the Benjaminites did so, and took their wives, according to their number, from the dancers whom they carried off; then they went and returned to their inheritance, and rebuilt the towns, and dwelt in them.";
asv[23] = "And the children of Benjamin did so, and took them wives, according to their number, of them that danced, whom they carried off: and they went and returned unto their inheritance, and built the cities, and dwelt in them.";
yng[23] = "And the sons of Benjamin do so, and take women according to their number, out of the dancers whom they have taken violently away; and they go, and turn back unto their inheritance, and build the cities, and dwell in them.";
dby[23] = "And the children of Benjamin did so, and took wives, according to their number, of them that danced, whom they caught; and they went and returned to their inheritance, and built the cities, and dwelt in them.";
web[23] = "And the children of Benjamin did so, and took [them] wives, according to their number, of them that danced, whom they caught: and they went and returned to their inheritance, and repaired the cities and dwelt in them.";
hnv[23] = "The children of Binyamin did so, and took them wives, according to their number, of those who danced, whom they carried off: and they went and returned to their inheritance, and built the cities, and lived in them.";
vul[23] = "feceruntque filii Beniamin ut sibi fuerat imperatum et iuxta numerum suum rapuerunt sibi de his quae ducebant choros uxores singulas abieruntque in possessionem suam aedificantes urbes et habitantes in eis";
kjv[24] = "And the children of Israel departed thence at that time, every man to his tribe and to his family, and they went out from thence every man to his inheritance.";
rsv[24] = "And the people of Israel departed from there at that time, every man to his tribe and family, and they went out from there every man to his inheritance.";
asv[24] = "And the children of Israel departed thence at that time, every man to his tribe and to his family, and they went out from thence every man to his inheritance.";
yng[24] = "And the sons of Israel go up and down thence at that time, each to his tribe, and to his family; and they go out thence each to his inheritance.";
dby[24] = "And the children of Israel departed thence at that time, every man to his tribe and to his family, and they went out from thence every man to his inheritance.";
web[24] = "And the children of Israel departed thence at that time, every man to his tribe and to his family, and they went from thence every man to his inheritance.";
hnv[24] = "The children of Yisra\'el departed there at that time, every man to his tribe and to his family, and they went out from there every man to his inheritance.";
vul[24] = "filii quoque Israhel reversi sunt per tribus et familias in tabernacula sua in diebus illis non erat rex in Israhel sed unusquisque quod sibi rectum videbatur hoc faciebat";
kjv[25] = "In those days [there was] no king in Israel: every man did [that which was] right in his own eyes.";
rsv[25] = "In those days there was no king in Israel; every man did what was right in his own eyes.";
asv[25] = "In those days there was no king in Israel: every man did that which was right in his own eyes.";
yng[25] = "In those days there is no king in Israel; each doth that which is right in his own eyes.";
dby[25] = "In those days there was no king in Israel; every man did what was right in his own eyes.";
web[25] = "In those days [there was] no king in Israel: every man did [that which was] right in his own eyes.";
hnv[25] = "In those days there was no king in Yisra\'el: every man did that which was right in his own eyes.";
vul[25] = "[Vulgate verse 25 combined with 21:24]";
