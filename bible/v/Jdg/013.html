csb[1] = "The Israelites again did what was evil in the LORD\'s sight, so the LORD handed them over to the Philistines forty years.";
csb[2] = "There was a certain man from Zorah, from the family of Dan, whose name was Manoah; his wife was unable to conceive and had no children.";
csb[3] = "The angel of the LORD appeared to the woman and said to her, &quot;It is true that you are unable to conceive and have no children, but you will conceive and give birth to a son.";
csb[4] = "&quot;Now please be careful not to drink wine or beer, or to eat anything unclean;";
csb[5] = "&quot;for indeed, you will conceive and give birth to a son. You must never cut his hair, because the boy will be a Nazirite to God from birth, and he will begin to save Israel from the power of the Philistines.&quot;";
csb[6] = "Then the woman went and told her husband, &quot;A man of God came to me. He looked like the awe-inspiring angel of God. I didn\'t ask him where he came from, and he didn\'t tell me his name.";
csb[7] = "&quot;He said to me, \'You will conceive and give birth to a son. Therefore, do not drink wine or beer, and do not eat anything unclean, because the boy will be a Nazirite to God from birth until the day of his death.\' &quot;";
csb[8] = "Manoah prayed to the LORD and said, &quot;Please, Lord, let the man of God you sent come again to us and teach us what we should do for the boy who will be born.&quot;";
csb[9] = "God listened to Manoah, and the angel of God came again to the woman. She was sitting in the field, and her husband Manoah was not with her.";
csb[10] = "The woman ran quickly to her husband and told him, &quot;The man who came to me the other day has just come back! &quot;";
csb[11] = "So Manoah got up and followed his wife. When he came to the man, he asked, &quot;Are you the man who spoke to my wife? &quot; &quot;I am,&quot; he said.";
csb[12] = "Then Manoah asked, &quot;When your words come true, what will be the boy\'s responsibilities and work? &quot;";
csb[13] = "The angel of the LORD answered Manoah, &quot;Your wife needs to do everything I told her.";
csb[14] = "&quot;She must not eat anything that comes from the grapevine or drink wine or beer. And she must not eat anything unclean. Your wife must do everything I have commanded her.&quot;";
csb[15] = "&quot;Please stay here,&quot; Manoah told him, &quot;and we will prepare a young goat for you.&quot;";
csb[16] = "The angel of the LORD said to him, &quot;If I stay, I won\'t eat your food. But if you want to prepare a burnt offering, offer it to the LORD.&quot; (Manoah did not know he was the angel of the LORD.)";
csb[17] = "Then Manoah said to him, &quot;What is your name, so that we may honor you when your words come true? &quot;";
csb[18] = "&quot;Why do you ask my name,&quot; the angel of the LORD asked him, &quot;since it is beyond understanding.&quot;";
csb[19] = "Manoah took a young goat and a grain offering and offered them on a rock to the LORD, who did something miraculous while Manoah and his wife were watching.";
csb[20] = "When the flame went up from the altar to the sky, the angel of the LORD went up in its flame. When Manoah and his wife saw this, they fell facedown on the ground.";
csb[21] = "The angel of the LORD did not appear again to Manoah and his wife. Then Manoah realized that it was the angel of the LORD.";
csb[22] = "&quot;We\'re certainly going to die,&quot; he said to his wife, &quot;because we have seen God! &quot;";
csb[23] = "But his wife said to him, &quot;If the LORD had intended to kill us, he wouldn\'t have accepted the burnt offering and the grain offering from us, and he would not have shown us all these things or spoken to us like this.&quot;";
csb[24] = "So the woman gave birth to a son and named him Samson. The boy grew, and the LORD blessed him.";
csb[25] = "Then the Spirit of the LORD began to stir him in the Camp of Dan, between Zorah and Eshtaol.";

dby[17] = "And Manoah said to the Angel of Jehovah, What is thy name, that when thy word cometh to pass we may do thee honour?";
web[17] = "And Manoah said to the angel of the LORD, What [is] thy name, that when thy sayings come to pass, we may do thee honor?";
hnv[17] = "Manoach said to the angel of the LORD, What is your name, that when your words happen, we may honor you?";
vul[17] = "dixitque ad eum quod est tibi nomen ut si sermo tuus fuerit expletus honoremus te";
kjv[18] = "And the angel of the LORD said unto him, Why askest thou thus after my name, seeing it [is] secret?";
rsv[18] = "And the angel of the LORD said to him, &quot;Why do you ask my name, seeing it is wonderful?&quot;";
asv[18] = "And the angel of Jehovah said unto him, Wherefore askest thou after my name, seeing it is wonderful?";
yng[18] = "And the messenger of Jehovah saith to him, `Why [is] this -- thou dost ask for My name? -- and it [is] Wonderful.\'";
dby[18] = "And the Angel of Jehovah said to him, How is it that thou askest after my name, seeing it is wonderful?";
web[18] = "And the angel of the LORD said to him, why askest thou thus after my name, seeing it [is] secret?";
hnv[18] = "The angel of the LORD said to him, Why do you ask after my name, seeing it is wonderful?";
vul[18] = "cui ille respondit cur quaeris nomen meum quod est mirabile";
kjv[19] = "So Manoah took a kid with a meat offering, and offered [it] upon a rock unto the LORD: and [the angel] did wondrously; and Manoah and his wife looked on.";
rsv[19] = "So Mano\'ah took the kid with the cereal offering, and offered it upon the rock to the LORD, to him who works wonders.";
asv[19] = "So Manoah took the kid with the meal-offering, and offered it upon the rock unto Jehovah: and [the angel] did wondrously, and Manoah and his wife looked on.";
yng[19] = "And Manoah taketh the kid of the goats, and the present, and offereth on the rock to Jehovah, and He is doing wonderfully, and Manoah and his wife are looking on,";
dby[19] = "Then Manoah took the kid and the oblation, and offered it up to Jehovah upon the rock. And he did wondrously, and Manoah and his wife looked on.";
web[19] = "So Manoah took a kid, with a meat-offering, and offered [it] upon a rock to the LORD; and [the angel] did wonderously, and Manoah and his wife looked on.";
hnv[19] = "So Manoach took the kid with the meal-offering, and offered it on the rock to the LORD: and [the angel] did wondrously, and Manoach and his wife looked on.";
vul[19] = "tulit itaque Manue hedum de capris et libamenta et posuit super petram offerens Domino qui facit mirabilia ipse autem et uxor eius intuebantur";
kjv[20] = "For it came to pass, when the flame went up toward heaven from off the altar, that the angel of the LORD ascended in the flame of the altar. And Manoah and his wife looked on [it], and fell on their faces to the ground.";
rsv[20] = "And when the flame went up toward heaven from the altar, the angel of the LORD ascended in the flame of the altar while Mano\'ah and his wife looked on; and they fell on their faces to the ground.";
asv[20] = "For it came to pass, when the flame went up toward heaven from off the altar, that the angel of Jehovah ascended in the flame of the altar: and Manoah and his wife looked on; and they fell on their faces to the ground.";
yng[20] = "and it cometh to pass, in the going up of the flame from off the altar toward the heavens, that the messenger of Jehovah goeth up in the flame of the altar, and Manoah and his wife are looking on, and they fall on their faces to the earth,";
dby[20] = "And it came to pass, as the flame went up from off the altar towards the heavens, that the Angel of Jehovah ascended in the flame of the altar; and Manoah and his wife looked on, and fell on their faces to the ground.";
web[20] = "For it came to pass, when the flame ascended towards heaven from off the altar, that the angel of the LORD ascended in the flame of the altar. And Manoah and his wife looked on [it], and fell on their faces to the ground.";
hnv[20] = " For it happened, when the flame went up toward the sky from off the altar, that the angel of the LORD ascended in the flame of the altar: and Manoach and his wife looked on; and they fell on their faces to the ground.";
vul[20] = "cumque ascenderet flamma altaris in caelum angelus Domini in flamma pariter ascendit quod cum vidisset Manue et uxor eius proni ceciderunt in terram";
kjv[21] = "But the angel of the LORD did no more appear to Manoah and to his wife. Then Manoah knew that he [was] an angel of the LORD.";
rsv[21] = "The angel of the LORD appeared no more to Mano\'ah and to his wife. Then Mano\'ah knew that he was the angel of the LORD.";
asv[21] = "But the angel of Jehovah did no more appear to Manoah or to his wife. Then Manoah knew that he was the angel of Jehovah.";
yng[21] = "and the messenger of Jehovah hath not added again to appear unto Manoah, and unto his wife, then hath Manoah known that He [is] a messenger of Jehovah.";
dby[21] = "And the Angel of Jehovah appeared no more to Manoah and to his wife. Then Manoah knew that it was the Angel of Jehovah.";
web[21] = "But the angel of the LORD did no more appear to Manoah and to his wife. Then Manoah knew that he [was] an angel of the LORD.";
hnv[21] = "But the angel of the LORD did no more appear to Manoach or to his wife. Then Manoach knew that he was the angel of the LORD.";
vul[21] = "et ultra non eis apparuit angelus Domini statimque intellexit Manue angelum esse Domini";
kjv[22] = "And Manoah said unto his wife, We shall surely die, because we have seen God.";
rsv[22] = "And Mano\'ah said to his wife, &quot;We shall surely die, for we have seen God.&quot;";
asv[22] = "And Manoah said unto his wife, We shall surely die, because we have seen God.";
yng[22] = "And Manoah saith unto his wife, `We certainly die, for we have seen God.\'";
dby[22] = "And Manoah said to his wife, We shall surely die, because we have seen God.";
web[22] = "And Manoah said to his wife, We shall surely die, because we have seen God.";
hnv[22] = "Manoach said to his wife, We shall surely die, because we have seen God.";
vul[22] = "et dixit ad uxorem suam morte moriemur quia vidimus Deum";
kjv[23] = "But his wife said unto him, If the LORD were pleased to kill us, he would not have received a burnt offering and a meat offering at our hands, neither would he have shewed us all these [things], nor would as at this time have told us [such things] as these.";
rsv[23] = "But his wife said to him, &quot;If the LORD had meant to kill us, he would not have accepted a burnt offering and a cereal offering at our hands, or shown us all these things, or now announced to us such things as these.&quot;";
asv[23] = "But his wife said unto him, If Jehovah were pleased to kill us, he would not have received a burnt-offering and a meal-offering at our hand, neither would he have showed us all these things, nor would at this time have told such things as these.";
yng[23] = "And his wife saith to him, `If Jehovah were desirous to put us to death, He had not received from our hands burnt-offering and present, nor shewed us all these things, nor as [at this] time caused us to hear [anything] like this.\'";
dby[23] = "But his wife said to him, If Jehovah were pleased to kill us, he would not have received a burnt-offering and an oblation at our hands, neither would he have shewed us all these things, nor would he at this time have told us [such things] as these.";
web[23] = "But his wife said to him, If the LORD were pleased to kill us, he would not have received a burnt-offering and a meat-offering at our hands, neither would he have showed us all these [things], nor would, as at this time, have told us [such things] as these.";
hnv[23] = "But his wife said to him, If the LORD were pleased to kill us, he wouldn\'t have received a burnt offering and a meal-offering at our hand, neither would he have shown us all these things, nor would at this time have told such things as these.";
vul[23] = "cui respondit mulier si Dominus nos vellet occidere de manibus nostris holocaustum et libamenta non suscepisset nec ostendisset nobis haec omnia neque ea quae sunt ventura dixisset";
kjv[24] = "And the woman bare a son, and called his name Samson: and the child grew, and the LORD blessed him.";
rsv[24] = "And the woman bore a son, and called his name Samson; and the boy grew, and the LORD blessed him.";
asv[24] = "And the woman bare a son, and called his name Samson: and the child grew, and Jehovah blessed him.";
yng[24] = "And the woman beareth a son, and calleth his name Samson, and the youth groweth, and Jehovah doth bless him,";
dby[24] = "And the woman bore a son, and called his name Samson. And the child grew, and Jehovah blessed him.";
web[24] = "And the woman bore a son, and called his name Samson. And the child grew, and the LORD blessed him.";
hnv[24] = "The woman bore a son, and named him Shimshon: and the child grew, and the LORD blessed him.";
vul[24] = "peperit itaque filium et vocavit nomen eius Samson crevitque puer et benedixit ei Dominus";
kjv[25] = "And the Spirit of the LORD began to move him at times in the camp of Dan between Zorah and Eshtaol.";
rsv[25] = "And the Spirit of the LORD began to stir him in Ma\'haneh-dan, between Zorah and Esh\'ta-ol.";
asv[25] = "And the Spirit of Jehovah began to move him in Mahaneh-dan, between Zorah and Eshtaol.";
yng[25] = "and the Spirit of Jehovah beginneth to move him in the camp of Dan, between Zorah and Eshtaol.";
dby[25] = "And the Spirit of Jehovah began to move him at Mahaneh-Dan, between Zoreah and Eshtaol.";
web[25] = "And the Spirit of the LORD began to move him at times in the camp of Dan, between Zorah and Eshtaol.";
hnv[25] = "The Spirit of the LORD began to move him in Machane-Dan, between Tzor`ah and Eshta\'ol.";
vul[25] = "coepitque spiritus Domini esse cum eo in castris Dan inter Saraa et Esthaol";
