csb[1] = "The Israelites again did what was evil in the sight of the LORD after Ehud had died.";
csb[2] = "So the LORD sold them to King Jabin of Canaan, who reigned in Hazor. The commander of his army was Sisera who lived in Harosheth of the Nations.";
csb[3] = "Then the Israelites cried out to the LORD, because Jabin had nine hundred iron chariots, and he harshly oppressed them twenty years.";
csb[4] = "Deborah, a prophetess and the wife of Lappidoth, was judging Israel at that time.";
csb[5] = "She would sit under the palm tree of Deborah between Ramah and Bethel in the hill country of Ephraim, and the Israelites went up to her to settle disputes.";
csb[6] = "She summoned Barak son of Abinoam from Kedesh in Naphtali and said to him, &quot;Hasn\'t the LORD, the God of Israel, commanded you: \'Go, deploy the troops on Mount Tabor, and take with you ten thousand men from the Naphtalites and Zebulunites?";
csb[7] = "&quot;Then I will lure Sisera commander of Jabin\'s army, his chariots, and his infantry at the Wadi Kishon to fight against you, and I will hand him over to you.\' &quot;";
csb[8] = "Barak said to her, &quot;If you will go with me, I will go. But if you will not go with me, I will not go.&quot;";
csb[9] = "&quot;I will gladly go with you,&quot; she said, &quot;but you will receive no honor on the road you are about to take, because the LORD will sell Sisera to a woman.&quot; So Deborah got up and went with Barak to Kedesh.";
csb[10] = "Barak summoned Zebulun and Naphtali to Kedesh; ten thousand men followed him, and Deborah also went with him.";
csb[11] = "Now Heber the Kenite had moved away from the Kenites, the sons of Hobab, Moses\'s father-in-law, and pitched his tent beside the oak tree of Zaanannim, which was near Kedesh.";
csb[12] = "It was reported to Sisera that Barak son of Abinoam had gone up Mount Tabor.";
csb[13] = "Sisera summoned all his nine hundred iron chariots and all the troops who were with him from Harosheth of the Nations to the Wadi Kishon.";
csb[14] = "Then Deborah said to Barak, &quot;Go! This is the day the LORD has handed Sisera over to you. Hasn\'t the LORD gone before you? &quot; So Barak came down from Mount Tabor with ten thousand men following him.";
csb[15] = "The LORD threw Sisera, all his charioteers, and all his army into a panic before Barak\'s assault. Sisera left his chariot and fled on foot.";
csb[16] = "Barak pursued the chariots and the army as far as Harosheth of the Nations, and the whole army of Sisera fell by the sword; not a single man was left.";
csb[17] = "Meanwhile, Sisera had fled on foot to the tent of Jael, the wife of Heber the Kenite, because there was peace between King Jabin of Hazor and the family of Heber the Kenite.";
csb[18] = "Jael went out to greet Sisera and said to him, &quot;Come in, my lord. Come in with me. Don\'t be afraid.&quot; So he went into her tent, and she covered him with a blanket.";
csb[19] = "He said to her, &quot;Please give me a little water to drink for I am thirsty.&quot; She opened a container of milk, gave him a drink, and covered him again.";
csb[20] = "Then he said to her, &quot;Stand at the entrance to the tent. If a man comes and asks you, \'Is there a man here? \' say, \'No.\' &quot;";
csb[21] = "While he was sleeping from exhaustion, Heber\'s wife Jael took a tent peg, grabbed a hammer, and went silently to Sisera. She hammered the peg into his temple and drove it into the ground, and he died.";
csb[22] = "When Barak arrived in pursuit of Sisera, Jael went out to greet him and said to him, &quot;Come and I will show you the man you are looking for.&quot; So he went in with her, and there was Sisera lying dead with a tent peg through his temple!";
csb[23] = "That day God subdued King Jabin of Canaan before the Israelites.";
csb[24] = "The power of the Israelites continued to increase against King Jabin of Canaan until they destroyed him.";

kjv[6] = "And she sent and called Barak the son of Abinoam out of Kedeshnaphtali, and said unto him, Hath not the LORD God of Israel commanded, [saying], Go and draw toward mount Tabor, and take with thee ten thousand men of the children of Naphtali and of the children of Zebulun?";
rsv[6] = "She sent and summoned Barak the son of Abin\'o-am from Kedesh in Naph\'tali, and said to him, &quot;The LORD, the God of Israel, commands you, \'Go, gather your men at Mount Tabor, taking ten thousand from the tribe of Naph\'tali and the tribe of Zeb\'ulun.";
asv[6] = "And she sent and called Barak the son of Abinoam out of Kedesh-naphtali, and said unto him, Hath not Jehovah, the God of Israel, commanded, [saying], Go and draw unto mount Tabor, and take with thee ten thousand men of the children of Naphtali and of the children of Zebulun?";
yng[6] = "And she sendeth and calleth for Barak son of Abinoam, out of Kedesh-Naphtali, and saith unto him, `Hath not Jehovah, God of Israel, commanded? go, and thou hast drawn towards mount Tabor, and hast taken with thee ten thousand men, out of the sons of Naphtali, and out of the sons of Zebulun,";
dby[6] = "And she sent and called Barak the son of Abinoam out of Kedesh-Naphtali, and said to him, Hath not Jehovah the God of Israel commanded? Go and draw towards mount Tabor, and take with thee ten thousand men of the children of Naphtali and of the children of Zebulun,";

yng[7] = "and I have drawn unto thee, unto the brook Kishon, Sisera, head of the host of Jabin, and his chariot, and his multitude, and have given him into thy hand.\'";

web[16] = "But Barak pursued the chariots, and the host, to Harosheth of the Gentiles: and all the host of Sisera fell upon the edge of the sword; [and] there was not a man left.";
hnv[16] = "But Barak pursued after the chariots, and after the host, to Haroshet of the Goyim: and all the host of Sisera fell by the edge of the sword; there was not a man left.";
vul[16] = "et Barac persequeretur fugientes currus et exercitum usque ad Aroseth gentium et omnis hostium multitudo usque ad internicionem caderet";
kjv[17] = "Howbeit Sisera fled away on his feet to the tent of Jael the wife of Heber the Kenite: for [there was] peace between Jabin the king of Hazor and the house of Heber the Kenite.";
rsv[17] = "But Sis\'era fled away on foot to the tent of Ja\'el, the wife of Heber the Ken\'ite; for there was peace between Jabin the king of Hazor and the house of Heber the Ken\'ite.";
asv[17] = "Howbeit Sisera fled away on his feet to the tent of Jael the wife of Heber the Kenite; for there was peace between Jabin the king of Hazor and the house of Heber the Kenite.";
yng[17] = "And Sisera hath fled on his feet unto the tent of Jael wife of Heber the Kenite, for peace [is] between Jabin king of Hazor and the house of Heber the Kenite;";
dby[17] = "And Sisera fled on foot to the tent of Jael the wife of Heber the Kenite; for there was peace between Jabin the king of Hazor and the house of Heber the Kenite.";
web[17] = "Howbeit, Sisera fled away on his feet to the tent of Jael the wife of Heber the Kenite: for [there was] peace between Jabin the king of Hazor and the house of Heber the Kenite.";
hnv[17] = "However Sisera fled away on his feet to the tent of Ya`el the wife of Hever the Keni; for there was shalom between Yavin the king of Hatzor and the house of Hever the Keni.";
vul[17] = "Sisara autem fugiens pervenit ad tentorium Iahel uxoris Aber Cinei erat enim pax inter Iabin regem Asor et domum Aber Cinei";
kjv[18] = "And Jael went out to meet Sisera, and said unto him, Turn in, my lord, turn in to me; fear not. And when he had turned in unto her into the tent, she covered him with a mantle.";
rsv[18] = "And Ja\'el came out to meet Sis\'era, and said to him, &quot;Turn aside, my lord, turn aside to me; have no fear.&quot; So he turned aside to her into the tent, and she covered him with a rug.";
asv[18] = "And Jael went out to meet Sisera, and said unto him, Turn in, my lord, turn in to me; fear not. And he turned in unto her into the tent, and she covered him with a rug.";
yng[18] = "and Jael goeth out to meet Sisera, and saith unto him, `Turn aside, my lord, turn aside unto me, fear not;\' and he turneth aside unto her, into the tent, and she covereth him with a coverlet.";
dby[18] = "And Jael went out to meet Sisera, and said to him, Turn in, my lord, turn in to me; fear not. And he turned in to her, into the tent, and she covered him with the quilt.";
web[18] = "And Jael went out to meet Sisera, and said to him, Turn in, my lord, turn in to me; fear not. And when he had turned in to her into the tent, she covered him with a mantle.";
hnv[18] = "Ya`el went out to meet Sisera, and said to him, Turn in, my lord, turn in to me; don\'t be afraid. He came in to her into the tent, and she covered him with a rug.";
vul[18] = "egressa igitur Iahel in occursum Sisarae dixit ad eum intra ad me domine mi intra ne timeas qui ingressus tabernaculum eius et opertus ab ea pallio";
kjv[19] = "And he said unto her, Give me, I pray thee, a little water to drink; for I am thirsty. And she opened a bottle of milk, and gave him drink, and covered him.";
rsv[19] = "And he said to her, &quot;Pray, give me a little water to drink; for I am thirsty.&quot; So she opened a skin of milk and gave him a drink and covered him.";
asv[19] = "And he said unto her, Give me, I pray thee, a little water to drink; for I am thirsty. And she opened a bottle of milk, and gave him drink, and covered him.";
yng[19] = "And he saith unto her, `Give me to drink, I pray thee, a little water, for I am thirsty;\' and she openeth the bottle of milk, and giveth him to drink, and covereth him.";
dby[19] = "And he said to her, Give me, I pray thee, a little water to drink, for I am thirsty. And she opened the flask of milk, and gave him drink, and covered him.";
web[19] = "And he said to her, Give me, I pray thee, a little water to drink; for I am thirsty. And she opened a bottle of milk, and gave him drink, and covered him.";
hnv[19] = "He said to her, Please give me a little water to drink; for I am thirsty. She opened a bottle of milk, and gave him drink, and covered him.";
vul[19] = "dixit ad eam da mihi obsecro paululum aquae quia valde sitio quae aperuit utrem lactis et dedit ei bibere et operuit illum";
kjv[20] = "Again he said unto her, Stand in the door of the tent, and it shall be, when any man doth come and enquire of thee, and say, Is there any man here? that thou shalt say, No.";
rsv[20] = "And he said to her, &quot;Stand at the door of the tent, and if any man comes and asks you, \'Is any one here?\' say, No.&quot;";
asv[20] = "And he said unto her, Stand in the door of the tent, and it shall be, when any man doth come and inquire of thee, and say, Is there any man here? that thou shalt say, No.";
yng[20] = "And he saith unto her, `Stand at the opening of the tent, and it hath been, if any doth come in, and hath asked thee, and said, Is there a man here? that thou hast said, There is not.\'";
dby[20] = "And he said to her, Stand in the door of the tent, and it shall be if any one come and inquire of thee, and say, Is there any man here? that thou shalt say, No.";
web[20] = "Again he said to her, stand in the door of the tent, and it shall be, when any man doth come and inquire of thee, and say, Is there any man here? that thou shalt say, No.";
hnv[20] = "He said to her, Stand in the door of the tent, and it shall be, when any man does come and inquire of you, and say, Is there any man here? that you shall say, No.";
vul[20] = "dixitque Sisara ad eam sta ante ostium tabernaculi et cum venerit aliquis interrogans te et dicens numquid hic est aliquis respondebis nullus est";
kjv[21] = "Then Jael Heber\'s wife took a nail of the tent, and took an hammer in her hand, and went softly unto him, and smote the nail into his temples, and fastened it into the ground: for he was fast asleep and weary. So he died.";
rsv[21] = "But Ja\'el the wife of Heber took a tent peg, and took a hammer in her hand, and went softly to him and drove the peg into his temple, till it went down into the ground, as he was lying fast asleep from weariness. So he died.";
asv[21] = "Then Jael Heber\'s wife took a tent-pin, and took a hammer in her hand, and went softly unto him, and smote the pin into his temples, and it pierced through into the ground; for he was in a deep sleep; so he swooned and died.";
yng[21] = "And Jael wife of Heber taketh the pin of the tent, and taketh the hammer in her hand, and goeth unto him gently, and striketh the pin into his temples, and it fasteneth in the earth -- and he hath been fast asleep, and is weary -- and he dieth.";
dby[21] = "And Jael Heber\'s wife took a tent-pin, and took the hammer in her hand, and went softly to him, and smote the pin into his temples, and it penetrated into the ground; for he had fallen into a deep sleep and was faint; and he died.";
web[21] = "Then Jael, Heber\'s wife, took a nail of the tent, and took a hammer in her hand, and went softly to him, and smote the nail into his temples, and fastened it into the ground: for he was fast asleep, and weary. So he died.";
hnv[21] = "Then Ya`el Hever\'s wife took a tent-pin, and took a hammer in her hand, and went softly to him, and struck the pin into his temples, and it pierced through into the ground; for he was in a deep sleep; so he swooned and died.";
vul[21] = "tulit itaque Iahel uxor Aber clavum tabernaculi adsumens pariter malleum et ingressa abscondite et cum silentio posuit supra tempus capitis eius clavum percussumque malleo defixit in cerebrum usque ad terram qui soporem morti socians defecit et mortuus est";
kjv[22] = "And, behold, as Barak pursued Sisera, Jael came out to meet him, and said unto him, Come, and I will shew thee the man whom thou seekest. And when he came into her [tent], behold, Sisera lay dead, and the nail [was] in his temples.";
rsv[22] = "And behold, as Barak pursued Sis\'era, Ja\'el went out to meet him, and said to him, &quot;Come, and I will show you the man whom you are seeking.&quot; So he went in to her tent; and there lay Sis\'era dead, with the tent peg in his temple.";
asv[22] = "And, behold, as Barak pursued Sisera, Jael came out to meet him, and said unto him, Come, and I will show thee the man whom thou seekest. And he came unto her; and, behold, Sisera lay dead, and the tent-pin was in his temples.";
yng[22] = "And lo, Barak is pursuing Sisera, and Jael cometh out to meet him, and saith to him, `Come, and I shew thee the man whom thou art seeking;\' and he cometh in unto her, and lo, Sisera is fallen -- dead, and the pin in his temples.";
dby[22] = "And behold, as Barak pursued Sisera, Jael went out to meet him, and said to him, Come, and I will shew thee the man whom thou seekest. And he went into her [tent], and behold, Sisera lay dead, and the pin was in his temples.";
web[22] = "And behold, as Barak pursued Sisera, Jael came out to meet him, and said to him, Come, and I will show thee the man whom thou seekest. And when he came into her [tent], behold, Sisera lay dead, and the nail [was] in his temples.";
hnv[22] = "Behold, as Barak pursued Sisera, Ya`el came out to meet him, and said to him, Come, and I will show you the man whom you seek. He came to her; and, behold, Sisera lay dead, and the tent-pin was in his temples.";
vul[22] = "et ecce Barac sequens Sisaram veniebat egressaque Iahel in occursum eius dixit ei veni et ostendam tibi virum quem quaeris qui cum intrasset ad eam vidit Sisaram iacentem mortuum et clavum infixum in tempore eius";
kjv[23] = "So God subdued on that day Jabin the king of Canaan before the children of Israel.";
rsv[23] = "So on that day God subdued Jabin the king of Canaan before the people of Israel.";
asv[23] = "So God subdued on that day Jabin the king of Canaan before the children of Israel.";
yng[23] = "And God humbleth on that day Jabin king of Canaan before the sons of Israel,";
dby[23] = "So God subdued on that day Jabin king of Canaan before the children of Israel.";
web[23] = "So God subdued on that day Jabin the king of Canaan before the children of Israel.";
hnv[23] = "So God subdued on that day Yavin the king of Kana`an before the children of Yisra\'el.";
vul[23] = "humiliavit ergo Deus in die illo Iabin regem Chanaan coram filiis Israhel";
kjv[24] = "And the hand of the children of Israel prospered, and prevailed against Jabin the king of Canaan, until they had destroyed Jabin king of Canaan.";
rsv[24] = "And the hand of the people of Israel bore harder and harder on Jabin the king of Canaan, until they destroyed Jabin king of Canaan.";
asv[24] = "And the hand of the children of Israel prevailed more and more against Jabin the king of Canaan, until they had destroyed Jabin king of Canaan.";
yng[24] = "and the hand of the sons of Israel goeth, going on and becoming hard on Jabin king of Canaan, till that they have cut off Jabin king of Canaan.";
dby[24] = "And the hand of the children of Israel ever advanced, and prevailed against Jabin king of Canaan, until they had cut off Jabin king of Canaan.";
web[24] = "And the hand of the children of Israel prospered, and prevailed against Jabin the king of Canaan, until they had destroyed Jabin king of Canaan.";
hnv[24] = "The hand of the children of Yisra\'el prevailed more and more against Yavin the king of Kana`an, until they had destroyed Yavin king of Kana`an.";
vul[24] = "qui crescebant cotidie et forti manu opprimebant Iabin regem Chanaan donec delerent eum";
