csb[1] = "The Israelites did what was evil in the sight of the LORD. So the LORD handed them over to Midian seven years,";
csb[2] = "and they oppressed Israel. Because of Midian, the Israelites made hiding places for themselves in the mountains, caves, and strongholds.";
csb[3] = "Whenever the Israelites planted crops, the Midianites, Amalekites, and the Qedemites came and attacked them.";
csb[4] = "They encamped against them and destroyed the produce of the land, even as far as Gaza. They left nothing for Israel to eat, as well as no sheep, ox, or donkey.";
csb[5] = "For the Midianites came with their cattle and their tents like a great swarm of locusts. They and their camels were without number, and they entered the land to lay waste to it.";
csb[6] = "So Israel became poverty-stricken because of Midian, and the Israelites cried out to the LORD.";
csb[7] = "When the Israelites cried out to him because of Midian,";
csb[8] = "the LORD sent a prophet to them. He said to them, &quot;This is what the LORD God of Israel says: \'I brought you out of Egypt and out of the place of slavery.";
csb[9] = "&quot;I rescued you from the power of Egypt and the power of all who oppressed you. I drove them out before you and gave you their land.";
csb[10] = "&quot;I said to you: I am the LORD your God. Do not fear the gods of the Amorites whose land you live in. But you did not obey me.\' &quot;";
csb[11] = "The angel of the LORD came, and he sat under the oak that was in Ophrah, which belonged to Joash, the Abiezrite. His son Gideon was threshing wheat in the winepress in order to hide it from the Midianites.";
csb[12] = "Then the angel of the LORD appeared to him and said: &quot;The LORD is with you, valiant warrior.&quot;";
csb[13] = "Gideon said to him, &quot;Please, my lord, if the LORD is with us, why has all this happened? And where are all his wonders that our fathers told us about? They said, \'Hasn\'t the LORD brought us out of Egypt? \' But now the LORD has abandoned us and handed us over to Midian.&quot;";
csb[14] = "The LORD turned to him and said, &quot;Go in the strength you have and deliver Israel from the grasp of Midian. I am sending you! &quot;";
csb[15] = "He said to him, &quot;Please, Lord, how can I deliver Israel? Look, my family is the weakest in Manasseh, and I am the youngest in my father\'s family.&quot;";
csb[16] = "&quot;But I will be with you,&quot; the LORD said to him. &quot;You will strike Midian down as if it were one man.&quot;";
csb[17] = "Then he said to him, &quot;If I have found favor with you, give me a sign that you are speaking with me.";
csb[18] = "&quot;Please do not leave this place until I return to you. Let me bring my gift and set it before you.&quot; And he said, &quot;I will stay until you return.&quot;";
csb[19] = "So Gideon went and prepared a young goat and unleavened bread from a half bushel of flour. He placed the meat in a basket and the broth in a pot. He brought them out and offered them to him under the oak.";
csb[20] = "The angel of God said to him, &quot;Take the meat with the unleavened bread, put it on this stone, and pour the broth on it.&quot; So he did that.";
csb[21] = "The angel of the LORD extended the tip of the staff that was in his hand and touched the meat and the unleavened bread. Fire came up from the rock and consumed the meat and the unleavened bread. Then the angel of the LORD vanished from his sight.";
csb[22] = "When Gideon realized that he was the angel of the LORD, he said, &quot;Oh no, Lord GOD! I have seen the angel of the LORD face to face! &quot;";
csb[23] = "But the LORD said to him, &quot;Peace to you. Don\'t be afraid, for you will not die.&quot;";
csb[24] = "So Gideon built an altar to the LORD there and called it The LORD Is Peace. It is still in Ophrah of the Abiezrites today.";
csb[25] = "On that very night the LORD said to him, &quot;Take your father\'s young bull and a second bull seven years old. Then tear down the altar of Baal that belongs to your father and cut down the Asherah pole beside it.";
csb[26] = "&quot;Build a well-constructed altar to the LORD your God on the top of this mound. Take the second bull and offer it as a burnt offering with the wood of the Asherah pole you cut down.&quot;";
csb[27] = "So Gideon took ten of his male servants and did as the LORD had told him. But because he was too afraid of his father\'s family and the men of the city to do it in the daytime, he did it at night.";
csb[28] = "When the men of the city got up in the morning, they found Baal\'s altar torn down, the Asherah pole beside it cut down, and the second bull offered up on the altar that had been built.";
csb[29] = "They said to each other, &quot;Who did this? &quot; After they made a thorough investigation, they said, &quot;Gideon son of Joash did it.&quot;";
csb[30] = "Then the men of the city said to Joash, &quot;Bring out your son. He must die, because he tore down Baal\'s altar and cut down the Asherah pole beside it.&quot;";
csb[31] = "But Joash said to all who stood against him, &quot;Would you plead Baal\'s case for him? Would you save him? Whoever pleads his case will be put to death by morning! If he is a god, let him plead his own case because someone tore down his altar.&quot;";
csb[32] = "That day he was called Jerubbaal, since Joash said, &quot;Let Baal contend with him,&quot; because he tore down his altar.";
csb[33] = "All the Midianites, Amalekites, and Qedemites gathered together, crossed over the Jordan, and camped in the Jezreel Valley.";
csb[34] = "The Spirit of the LORD enveloped Gideon, and he blew the ram\'s horn and the Abiezrites rallied behind him.";
csb[35] = "He sent messengers throughout all of Manasseh, who rallied behind him. He also sent messengers throughout Asher, Zebulun, and Naphtali, who also came to meet him.";
csb[36] = "Then Gideon said to God, &quot;If you will deliver Israel by my hand, as you said,";
csb[37] = "&quot;I will put a wool fleece here on the threshing floor. If dew is only on the fleece, and all the ground is dry, I will know that you will deliver Israel by my strength, as you said.&quot;";
csb[38] = "And that is what happened. When he got up early in the morning, he squeezed the fleece and wrung dew out of it, filling a bowl with water.";
csb[39] = "Gideon then said to God, &quot;Don\'t be angry with me; let me speak one more time. Please allow me to make one more test with the fleece. Let it remain dry, and the dew be all over the ground.&quot;";
csb[40] = "That night God did as Gideon requested: only the fleece was dry, and dew was all over the ground.";

rsv[11] = "Now the angel of the LORD came and sat under the oak at Ophrah, which belonged to Jo\'ash the Abiez\'rite, as his son Gideon was beating out wheat in the wine press, to hide it from the Mid\'ianites.";
asv[11] = "And the angel of Jehovah came, and sat under the oak which was in Ophrah, that pertained unto Joash the Abiezrite: and his son Gideon was beating out wheat in the winepress, to hide it from the Midianites.";
yng[11] = "And the messenger of Jehovah cometh and sitteth under the oak which [is] in Ophrah, which [is] to Joash the Abi-Ezrite, and Gideon his son is beating out wheat in the wine-press, to remove [it] from the presence of the Midianites;";

kjv[16] = "And the LORD said unto him, Surely I will be with thee, and thou shalt smite the Midianites as one man.";
rsv[16] = "And the LORD said to him, &quot;But I will be with you, and you shall smite the Mid\'ianites as one man.&quot;";
asv[16] = "And Jehovah said unto him, Surely I will be with thee, and thou shalt smite the Midianites as one man.";
yng[16] = "And Jehovah saith unto him, `Because I am with thee -- thou hast smitten the Midianites as one man.\'";
dby[16] = "And Jehovah said to him, I will certainly be with thee; and thou shalt smite Midian as one man.";
web[16] = "And the LORD said to him, Surely I will be with thee, and thou shalt smite the Midianites as one man.";
hnv[16] = "The LORD said to him, Surely I will be with you, and you shall strike the Midyanim as one man.";
vul[16] = "dixitque ei Dominus ego ero tecum et percuties Madian quasi unum virum";
kjv[17] = "And he said unto him, If now I have found grace in thy sight, then shew me a sign that thou talkest with me.";
rsv[17] = "And he said to him, &quot;If now I have found favor with thee, then show me a sign that it is thou who speakest with me.";
asv[17] = "And he said unto him, If now I have found favor in thy sight, then show me a sign that it is thou that talkest with me.";
yng[17] = "And he saith unto Him, `If, I pray Thee, I have found grace in Thine eyes, then Thou hast done for me a sign that Thou art speaking with me.";
dby[17] = "And he said to him, If now I have found favour in thine eyes, shew me a sign that it is thou who talkest with me.";
web[17] = "And he said to him, If now I have found grace in thy sight, then show me a sign that thou talkest with me.";
hnv[17] = "He said to him, If now I have found favor in your sight, then show me a sign that it is you who talk with me.";
vul[17] = "et ille si inveni inquit gratiam coram te da mihi signum quod tu sis qui loquaris ad me";
kjv[18] = "Depart not hence, I pray thee, until I come unto thee, and bring forth my present, and set [it] before thee. And he said, I will tarry until thou come again.";
rsv[18] = "Do not depart from here, I pray thee, until I come to thee, and bring out my present, and set it before thee.&quot; And he said, &quot;I will stay till you return.&quot;";
asv[18] = "Depart not hence, I pray thee, until I come unto thee, and bring forth my present, and lay it before thee. And he said, I will tarry until thou come again.";
yng[18] = "Move not, I pray Thee, from this, till my coming in unto Thee, and I have brought out my present, and put it before Thee;\' and he saith, `I -- I do abide till thy return.\'";
dby[18] = "Depart not hence, I pray thee, until I come unto thee, and bring forth my present, and set it before thee. And he said, I will tarry until thou come again.";
web[18] = "Depart not hence, I pray thee, until I come to thee, and bring forth my present, and set [it] before thee. And he said, I will tarry until thou comest again.";
hnv[18] = "Please don\'t go away, until I come to you, and bring out my present, and lay it before you. He said, I will wait until you come again.";
vul[18] = "ne recedas hinc donec revertar ad te portans sacrificium et offerens tibi qui respondit ego praestolabor adventum tuum";
kjv[19] = "And Gideon went in, and made ready a kid, and unleavened cakes of an ephah of flour: the flesh he put in a basket, and he put the broth in a pot, and brought [it] out unto him under the oak, and presented [it].";
rsv[19] = "So Gideon went into his house and prepared a kid, and unleavened cakes from an ephah of flour; the meat he put in a basket, and the broth he put in a pot, and brought them to him under the oak and presented them.";
asv[19] = "And Gideon went in, and made ready a kid, and unleavened cakes of an ephah of meal: the flesh he put in a basket, and he put the broth in a pot, and brought it out unto him under the oak, and presented it.";
yng[19] = "And Gideon hath gone in, and prepareth a kid of the goats, and of an ephah of flour unleavened things; the flesh he hath put in a basket, and the broth he hath put in a pot, and he bringeth out unto Him, unto the place of the oak, and bringeth [it] nigh.";
dby[19] = "And Gideon went in, and made ready a kid of the goats, and an ephah of flour in unleavened cakes: the flesh he put in a basket, and he put the broth in a pot, and brought it out to him under the terebinth, and presented it.";
web[19] = "And Gideon went in, and made ready a kid, and unleavened cakes of an ephah of flour: the flesh he put in a basket, and he put the broth in a pot, and brought [it] out to him under the oak, and presented [it].";
hnv[19] = "Gid`on went in, and made ready a kid, and unleavened cakes of an efah of meal: the flesh he put in a basket, and he put the broth in a pot, and brought it out to him under the oak, and presented it.";
vul[19] = "ingressus est itaque Gedeon et coxit hedum et de farinae modio azymos panes carnesque ponens in canistro et ius carnium mittens in ollam tulit omnia sub quercum et obtulit ei";
kjv[20] = "And the angel of God said unto him, Take the flesh and the unleavened cakes, and lay [them] upon this rock, and pour out the broth. And he did so.";
rsv[20] = "And the angel of God said to him, &quot;Take the meat and the unleavened cakes, and put them on this rock, and pour the broth over them.&quot; And he did so.";
asv[20] = "And the angel of God said unto him, Take the flesh and the unleavened cakes, and lay them upon this rock, and pour out the broth. And he did so.";
yng[20] = "And the messenger of God saith unto him, `Take the flesh and the unleavened things, and place on this rock -- and the broth pour out;\' and he doth so.";
dby[20] = "And the Angel of God said to him, Take the flesh and the unleavened cakes, and lay them upon this rock, and pour out the broth. And he did so.";
web[20] = "And the angel of God said to him, Take the flesh and the unleavened cakes, and lay [them] upon this rock, and pour out the broth. And he did so.";
hnv[20] = "The angel of God said to him, Take the flesh and the unleavened cakes, and lay them on this rock, and pour out the broth. He did so.";
vul[20] = "cui dixit angelus Domini tolle carnes et panes azymos et pone super petram illam et ius desuper funde cumque fecisset ita";
kjv[21] = "Then the angel of the LORD put forth the end of the staff that [was] in his hand, and touched the flesh and the unleavened cakes; and there rose up fire out of the rock, and consumed the flesh and the unleavened cakes. Then the angel of the LORD departed out of his sight.";
rsv[21] = "Then the angel of the LORD reached out the tip of the staff that was in his hand, and touched the meat and the unleavened cakes; and there sprang up fire from the rock and consumed the flesh and the unleavened cakes; and the angel of the LORD vanished from his sight.";
asv[21] = "Then the angel of Jehovah put forth the end of the staff that was in his hand, and touched the flesh and the unleavened cakes; and there went up fire out of the rock, and consumed the flesh and the unleavened cakes; and the angel of Jehovah departed out of his sight.";
yng[21] = "And the messenger of Jehovah putteth forth the end of the staff which [is] in His hand, and cometh against the flesh, and against the unleavened things, and the fire goeth up out of the rock and consumeth the flesh and the unleavened things -- and the messenger of Jehovah hath gone from his eyes.";
dby[21] = "And the Angel of Jehovah put forth the end of the staff that was in his hand, and touched the flesh and the unleavened cakes; and there rose up fire out of the rock, and consumed the flesh and the unleavened cakes. And the Angel of Jehovah departed out of his sight.";
web[21] = "Then the angel of the LORD put forth the end of the staff that [was] in his hand, and touched the flesh and the unleavened cakes; and there rose fire out of the rock, and consumed the flesh and the unleavened cakes. Then the angel of the LORD departed from his sight.";
hnv[21] = "Then the angel of the LORD put forth the end of the staff that was in his hand, and touched the flesh and the unleavened cakes; and there went up fire out of the rock, and consumed the flesh and the unleavened cakes; and the angel of the LORD departed out of his sight.";
vul[21] = "extendit angelus Domini summitatem virgae quam tenebat in manu et tetigit carnes et azymos panes ascenditque ignis de petra et carnes azymosque consumpsit angelus autem Domini evanuit ex oculis eius";
kjv[22] = "And when Gideon perceived that he [was] an angel of the LORD, Gideon said, Alas, O Lord GOD! for because I have seen an angel of the LORD face to face.";
rsv[22] = "Then Gideon perceived that he was the angel of the LORD; and Gideon said, &quot;Alas, O Lord GOD! For now I have seen the angel of the LORD face to face.&quot;";
asv[22] = "And Gideon saw that he was the angel of Jehovah; and Gideon said, Alas, O Lord Jehovah! forasmuch as I have seen the angel of Jehovah face to face.";
yng[22] = "And Gideon seeth that He [is] a messenger of Jehovah, and Gideon saith, `Alas, Lord Jehovah! because that I have seen a messenger of Jehovah face to face!\'";
dby[22] = "And Gideon perceived that he was an angel of Jehovah; and Gideon said, Alas, Lord Jehovah! for because I have seen an angel of Jehovah face to face ...";
web[22] = "And when Gideon perceived that he was [an] angel of the LORD, Gideon said, Alas, O Lord GOD! for because I have seen an angel of the LORD face to face.";
hnv[22] = "Gid`on saw that he was the angel of the LORD; and Gid`on said, Alas, Lord GOD! because I have seen the angel of the LORD face to face.";
vul[22] = "vidensque Gedeon quod esset angelus Domini ait heu mihi Domine Deus quia vidi angelum Domini facie ad faciem";
kjv[23] = "And the LORD said unto him, Peace [be] unto thee; fear not: thou shalt not die.";
rsv[23] = "But the LORD said to him, &quot;Peace be to you; do not fear, you shall not die.&quot;";
asv[23] = "And Jehovah said unto him, Peace be unto thee; fear not: thou shalt not die.";
yng[23] = "And Jehovah saith to him, `Peace to thee; fear not; thou dost not die.\'";
dby[23] = "And Jehovah said to him, Peace be unto thee: fear not; thou shalt not die.";
web[23] = "And the LORD said to him, Peace [be] to thee; fear not: thou shalt not die.";
hnv[23] = "The LORD said to him, Shalom be to you; don\'t be afraid: you shall not die.";
vul[23] = "dixitque ei Dominus pax tecum ne timeas non morieris";

rsv[24] = "Then Gideon built an altar there to the LORD, and called it, The LORD is peace. To this day it still stands at Ophrah, which belongs to the Abiez\'rites.";
asv[24] = "Then Gideon built an altar there unto Jehovah, and called it Jehovah-shalom: unto this day it is yet in Ophrah of the Abiezrites.";
yng[24] = "And Gideon buildeth there an altar to Jehovah, and calleth it Jehovah-Shalom, unto this day it [is] yet in Ophrah of the Abi-Ezrites.";
dby[24] = "And Gideon built there an altar to Jehovah, and called it Jehovah-shalom. To this day it is yet in Ophrah of the Abi-ezrites.";
web[24] = "Then Gideon built an altar there to the LORD, and called it Jehovah-shalom: to this day it [is] yet in Ophrah of the Abi-ezrites.";

kjv[25] = "And it came to pass the same night, that the LORD said unto him, Take thy father\'s young bullock, even the second bullock of seven years old, and throw down the altar of Baal that thy father hath, and cut down the grove that [is] by it:";
rsv[25] = "That night the LORD said to him, &quot;Take your father\'s bull, the second bull seven years old, and pull down the altar of Ba\'al which your father has, and cut down the Ashe\'rah that is beside it;";
asv[25] = "And it came to pass the same night, that Jehovah said unto him, Take thy father\'s bullock, even the second bullock seven years old, and throw down the altar of Baal that thy father hath, and cut down the Asherah that is by it;";
yng[25] = "And it cometh to pass, on that night, that Jehovah saith to him, `Take the young ox which [is] to thy father, and the second bullock of seven years, and thou hast thrown down the altar of Baal which [is] to thy father, and the shrine which [is] by it thou dost cut down,";
dby[25] = "And it came to pass the same night, that Jehovah said to him, Take the young bullock, which thy father hath, even the second bullock of seven years old, and throw down the altar of Baal that thy father hath, and cut down the Asherah that is by it;";
web[25] = "And it came to pass the same night, that the LORD said to him, Take thy father\'s young bullock, even the second bullock of seven years old, and throw down the altar of Baal that thy father hath, and cut down the grove that [is] by it:";

vul[25] = "nocte illa dixit Dominus ad eum tolle taurum patris tui et alterum taurum annorum septem destruesque aram Baal quae est patris tui et nemus quod circa aram est succide";
kjv[26] = "And build an altar unto the LORD thy God upon the top of this rock, in the ordered place, and take the second bullock, and offer a burnt sacrifice with the wood of the grove which thou shalt cut down.";
rsv[26] = "and build an altar to the LORD your God on the top of the stronghold here, with stones laid in due order; then take the second bull, and offer it as a burnt offering with the wood of the Ashe\'rah which you shall cut down.&quot;";
asv[26] = "and build an altar unto Jehovah thy God upon the top of this stronghold, in the orderly manner, and take the second bullock, and offer a burnt-offering with the wood of the Asherah which thou shalt cut down.";
yng[26] = "and thou hast built an altar to Jehovah thy God on the top of this stronghold, by the arrangement, and hast taken the second bullock, and caused to ascend a burnt-offering with the wood of the shrine which thou cuttest down.\'";
dby[26] = "and build an altar to Jehovah thy God upon the top of this strong place in the ordered manner, and take the second bullock, and offer up a burnt-offering with the wood of the Asherah that thou shalt cut down.";
web[26] = "And build an altar to the LORD thy God upon the top of this rock, in the ordered place, and take the second bullock, and offer a burnt-sacrifice with the wood of the grove which thou shalt cut down.";
hnv[26] = "and build an altar to the LORD your God on the top of this stronghold, in the orderly manner, and take the second bull, and offer a burnt offering with the wood of the Asherah which you shall cut down.";
vul[26] = "et aedificabis altare Domino Deo tuo in summitate petrae huius super quam sacrificium ante posuisti tollesque taurum secundum et offeres holocaustum super lignorum struem quae de nemore succideris";
kjv[27] = "Then Gideon took ten men of his servants, and did as the LORD had said unto him: and [so] it was, because he feared his father\'s household, and the men of the city, that he could not do [it] by day, that he did [it] by night.";
rsv[27] = "So Gideon took ten men of his servants, and did as the LORD had told him; but because he was too afraid of his family and the men of the town to do it by day, he did it by night.";
asv[27] = "Then Gideon took ten men of his servants, and did as Jehovah had spoken unto him: and it came to pass, because he feared his father\'s household and the men of the city, so that he could not do it by day, that he did it by night.";
yng[27] = "And Gideon taketh ten men of his servants, and doth as Jehovah hath spoken unto him, and it cometh to pass, because he hath been afraid of the house of his father, and the men of the city, to do [it] by day, that he doth [it] by night.";
dby[27] = "And Gideon took ten men of his servants, and did as Jehovah had said to him. And it came to pass, because he feared his father\'s house, and the men of the city, if he did it by day, that he did it by night.";
web[27] = "Then Gideon took ten men of his servants, and did as the LORD had said to him: and [so] it was, because he feared his father\'s household, and the men of the city, that he could not do [it] by day, that he did [it] by night.";
hnv[27] = "Then Gid`on took ten men of his servants, and did as the LORD had spoken to him: and it happened, because he feared his father\'s household and the men of the city, so that he could not do it by day, that he did it by night.";
vul[27] = "adsumptis igitur Gedeon decem viris de servis suis fecit sicut praeceperat Dominus timens autem domum patris sui et homines illius civitatis per diem facere noluit sed omnia nocte conplevit";
kjv[28] = "And when the men of the city arose early in the morning, behold, the altar of Baal was cast down, and the grove was cut down that [was] by it, and the second bullock was offered upon the altar [that was] built.";
rsv[28] = "When the men of the town rose early in the morning, behold, the altar of Ba\'al was broken down, and the Ashe\'rah beside it was cut down, and the second bull was offered upon the altar which had been built.";
asv[28] = "And when the men of the city arose early in the morning, behold, the altar of Baal was broken down, and the Asherah was cut down that was by it, and the second bullock was offered upon the altar that was built.";
yng[28] = "And the men of the city rise early in the morning, and lo, broken down hath been the altar of Baal, and the shrine which is by it hath been cut down, and the second bullock hath been offered on the altar which is built.";
dby[28] = "And when the men of the city arose early in the morning, behold, the altar of Baal was broken down, and the Asherah was cut down that was by it, and the second bullock was offered up upon the altar that was built.";

vul[28] = "cumque surrexissent viri oppidi eius mane viderunt destructam aram Baal lucumque succisum et taurum alterum inpositum super altare quod tunc aedificatum erat";
kjv[29] = "And they said one to another, Who hath done this thing? And when they enquired and asked, they said, Gideon the son of Joash hath done this thing.";

asv[29] = "And they said one to another, Who hath done this thing? And when they inquired and asked, they said, Gideon the son of Joash hath done this thing.";
yng[29] = "And they say one to another, `Who hath done this thing?\' and they inquire and seek, and they say, `Gideon son of Joash hath done this thing.\'";

kjv[30] = "Then the men of the city said unto Joash, Bring out thy son, that he may die: because he hath cast down the altar of Baal, and because he hath cut down the grove that [was] by it.";
rsv[30] = "Then the men of the town said to Jo\'ash, &quot;Bring out your son, that he may die, for he has pulled down the altar of Ba\'al and cut down the Ashe\'rah beside it.&quot;";
asv[30] = "Then the men of the city said unto Joash, Bring out thy son, that he may die, because he hath broken down the altar of Baal, and because he hath cut down the Asherah that was by it.";
yng[30] = "And the men of the city say unto Joash, `Bring out thy son, and he dieth, because he hath broken down the altar of Baal, and because he hath cut down the shrine which [is] by it.\'";
dby[30] = "And the men of the city said to Joash, Bring out thy son, that he may die, because he has broken down the altar of Baal, and because he has cut down the Asherah that was by it.";
web[30] = "Then the men of the city said to Joash, Bring out thy son, that he may die: because he hath cast down the altar of Baal, and because he hath cut down the grove that [was] by it.";
hnv[30] = " Then the men of the city said to Yo\'ash, Bring out your son, that he may die, because he has broken down the altar of Ba`al, and because he has cut down the Asherah that was by it.";
vul[30] = "et dixerunt ad Ioas produc filium tuum ut moriatur quia destruxit aram Baal et succidit nemus";
kjv[31] = "And Joash said unto all that stood against him, Will ye plead for Baal? will ye save him? he that will plead for him, let him be put to death whilst [it is yet] morning: if he [be] a god, let him plead for himself, because [one] hath cast down his altar.";
rsv[31] = "But Jo\'ash said to all who were arrayed against him, &quot;Will you contend for Ba\'al? Or will you defend his cause? Whoever contends for him shall be put to death by morning. If he is a god, let him contend for himself, because his altar has been pulled down.&quot;";
asv[31] = "And Joash said unto all that stood against him, Will ye contend for Baal? Or will ye save him? he that will contend for him, let him be put to death whilst [it is yet] morning: if he be a god, let him contend for himself, because one hath broken down his altar.";
yng[31] = "And Joash saith to all who have stood against him, `Ye, do ye plead for Baal? ye -- do ye save him? he who pleadeth for him is put to death during the morning; if he [is] a god he himself doth plead against him, because he hath broken down his altar.\'";
dby[31] = "And Joash said to all that stood near him, Will *ye* contend for Baal? or will *ye* save him? he that contends for him, let him be put to death whilst it is yet morning. If he be a god, let him plead for himself, because they have broken down his altar.";
web[31] = "And Joash said to all that stood against him, Will ye plead for Baal? will ye save him? he that will plead for him, let him be put to death whilst [it is yet] morning: if he [is] a god, let him plead for himself, because [one] hath cast down his altar.";
hnv[31] = "Yo\'ash said to all who stood against him, Will you contend for Ba`al? Or will you save him? he who will contend for him, let him be put to death while [it is yet] morning: if he be a god, let him contend for himself, because one has broken down his altar.";
vul[31] = "quibus ille respondit numquid ultores estis Baal et pugnatis pro eo qui adversarius eius est moriatur antequam lux crastina veniat si deus est vindicet se de eo qui suffodit aram eius";
kjv[32] = "Therefore on that day he called him Jerubbaal, saying, Let Baal plead against him, because he hath thrown down his altar.";
rsv[32] = "Therefore on that day he was called Jerubba\'al, that is to say, &quot;Let Ba\'al contend against him,&quot; because he pulled down his altar.";
asv[32] = "Therefore on that day he called him Jerubbaal, saying, Let Baal contend against him, because he hath broken down his altar.";
yng[32] = "And he calleth him, on that day, Jerubbaal, saying, `The Baal doth plead against him, because he hath broken down his altar.\'";
dby[32] = "And on that day they called him Jerubbaal, saying, Let Baal plead with him, because he has broken down his altar.";
web[32] = "Therefore on that day he called him Jerubbaal, saying, Let Baal plead against him, because he hath thrown down his altar.";
hnv[32] = "Therefore on that day he named him Yerubba`al, saying, Let Ba`al contend against him, because he has broken down his altar.";
vul[32] = "ex illo die vocatus est Gedeon Hierobbaal eo quod dixisset Ioas ulciscatur se de eo Baal qui suffodit altare eius";
kjv[33] = "Then all the Midianites and the Amalekites and the children of the east were gathered together, and went over, and pitched in the valley of Jezreel.";
rsv[33] = "Then all the Mid\'ianites and the Amal\'ekites and the people of the East came together, and crossing the Jordan they encamped in the Valley of Jezreel.";
asv[33] = "Then all the Midianites and the Amalekites and the children of the east assembled themselves together; and they passed over, and encamped in the valley of Jezreel.";
yng[33] = "And all Midian and Amalek and the sons of the east have been gathered together, and pass over, and encamp in the valley of Jezreel,";
dby[33] = "And all Midian and Amalek and the children of the east were gathered together, and went over, and encamped in the valley of Jezreel.";
web[33] = "Then all the Midianites, and the Amalekites, and the children of the east were assembled, and went over, and encamped in the valley of Jezreel.";
hnv[33] = "Then all the Midyanim and the `Amaleki and the children of the east assembled themselves together; and they passed over, and encamped in the valley of Yizre`el.";
vul[33] = "igitur omnis Madian et Amalech et orientales populi congregati sunt simul et transeuntes Iordanem castrametati sunt in valle Iezrahel";
kjv[34] = "But the Spirit of the LORD came upon Gideon, and he blew a trumpet; and Abiezer was gathered after him.";
rsv[34] = "But the Spirit of the LORD took possession of Gideon; and he sounded the trumpet, and the Abiez\'rites were called out to follow him.";
asv[34] = "But the Spirit of Jehovah came upon Gideon; and he blew a trumpet; and Abiezer was gathered together after him.";
