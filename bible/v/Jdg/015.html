csb[1] = "Later on, during the wheat harvest, Samson took a young goat as a gift and visited his wife. &quot;I want to go to my wife in her room,&quot; he said. But her father would not let him enter.";
csb[2] = "&quot;I was sure you hated her,&quot; her father said, &quot;so I gave her to one of the men who accompanied you. Isn\'t her younger sister more beautiful than she is? Why not take her instead? &quot;";
csb[3] = "Samson said to them, &quot;This time I will be blameless when I harm the Philistines.&quot;";
csb[4] = "So he went out and caught three hundred foxes. He took torches, turned the foxes tail-to-tail, and put a torch between each pair of tails.";
csb[5] = "Then he ignited the torches and released the foxes into the standing grain of the Philistines. He burned the piles of grain and the standing grain as well as the vineyards and olive groves.";
csb[6] = "Then the Philistines asked, &quot;Who did this? &quot; They were told, &quot;It was Samson, the Timnite\'s son-in-law, because he took Samson\'s wife and gave her to his companion.&quot; So the Philistines went to her and her father and burned them to death.";
csb[7] = "Then Samson told them, &quot;Because you did this, I swear that I won\'t rest until I have taken vengeance on you.&quot;";
csb[8] = "He tore them limb from limb and then went down and stayed in the cave at the rock of Etam.";
csb[9] = "The Philistines went up, camped in Judah, and raided Lehi.";
csb[10] = "So the men of Judah said, &quot;Why have you attacked us? &quot; They replied, &quot;We have come to tie Samson up and pay him back for what he did to us.&quot;";
csb[11] = "Then three thousand men of Judah went to the cave at the rock of Etam, and they asked Samson, &quot;Don\'t you realize that the Philistines rule us? What have you done to us? &quot; &quot;I have done to them what they did to me,&quot; he answered.";
csb[12] = "They said to him, &quot;We\'ve come to tie you up and hand you over to the Philistines.&quot; Then Samson told them, &quot;Swear to me that you yourselves won\'t kill me.&quot;";
csb[13] = "&quot;No,&quot; they said, &quot;we won\'t kill you, but we will tie you up securely and hand you over to them.&quot; So they tied him up with two new ropes and led him away from the rock.";
csb[14] = "When he came to Lehi, the Philistines came to meet him shouting. The Spirit of the LORD came powerfully on him, and the ropes that were on his arms and wrists became like burnt flax and fell off.";
csb[15] = "He found a fresh jawbone of a donkey, reached out his hand, took it, and killed a thousand men with it.";
csb[16] = "Then Samson said: With the jawbone of a donkey I have piled them in heaps. With the jawbone of a donkey I have killed a thousand men.";
csb[17] = "When he finished speaking, he threw away the jawbone and named that place Ramath-lehi.";
csb[18] = "He became very thirsty and called out to the LORD: &quot;You have accomplished this great victory through your servant. Must I now die of thirst and fall into the hands of the uncircumcised? &quot;";
csb[19] = "So God split a hollow place in the ground at Lehi, and water came out of it. After Samson drank, his strength returned, and he revived. That is why he named it En-hakkore, which is still in Lehi today.";
csb[20] = "And he judged Israel twenty years in the days of the Philistines.";
kjv[1] = "But it came to pass within a while after, in the time of wheat harvest, that Samson visited his wife with a kid; and he said, I will go in to my wife into the chamber. But her father would not suffer him to go in.";
kjv[2] = "And her father said, I verily thought that thou hadst utterly hated her; therefore I gave her to thy companion: [is] not her younger sister fairer than she? take her, I pray thee, instead of her.";
kjv[3] = "And Samson said concerning them, Now shall I be more blameless than the Philistines, though I do them a displeasure.";
kjv[4] = "And Samson went and caught three hundred foxes, and took firebrands, and turned tail to tail, and put a firebrand in the midst between two tails.";
kjv[5] = "And when he had set the brands on fire, he let [them] go into the standing corn of the Philistines, and burnt up both the shocks, and also the standing corn, with the vineyards [and] olives.";
kjv[6] = "Then the Philistines said, Who hath done this? And they answered, Samson, the son in law of the Timnite, because he had taken his wife, and given her to his companion. And the Philistines came up, and burnt her and her father with fire.";
kjv[7] = "And Samson said unto them, Though ye have done this, yet will I be avenged of you, and after that I will cease.";
kjv[8] = "And he smote them hip and thigh with a great slaughter: and he went down and dwelt in the top of the rock Etam.";
kjv[9] = "Then the Philistines went up, and pitched in Judah, and spread themselves in Lehi.";
kjv[10] = "And the men of Judah said, Why are ye come up against us? And they answered, To bind Samson are we come up, to do to him as he hath done to us.";
kjv[11] = "Then three thousand men of Judah went to the top of the rock Etam, and said to Samson, Knowest thou not that the Philistines [are] rulers over us? what [is] this [that] thou hast done unto us? And he said unto them, As they did unto me, so have I done unto them.";
kjv[12] = "And they said unto him, We are come down to bind thee, that we may deliver thee into the hand of the Philistines. And Samson said unto them, Swear unto me, that ye will not fall upon me yourselves.";
kjv[13] = "And they spake unto him, saying, No; but we will bind thee fast, and deliver thee into their hand: but surely we will not kill thee. And they bound him with two new cords, and brought him up from the rock.";
kjv[14] = "[And] when he came unto Lehi, the Philistines shouted against him: and the Spirit of the LORD came mightily upon him, and the cords that [were] upon his arms became as flax that was burnt with fire, and his bands loosed from off his hands.";
kjv[15] = "And he found a new jawbone of an ass, and put forth his hand, and took it, and slew a thousand men therewith.";
kjv[16] = "And Samson said, With the jawbone of an ass, heaps upon heaps, with the jaw of an ass have I slain a thousand men.";
kjv[17] = "And it came to pass, when he had made an end of speaking, that he cast away the jawbone out of his hand, and called that place Ramathlehi.";
kjv[18] = "And he was sore athirst, and called on the LORD, and said, Thou hast given this great deliverance into the hand of thy servant: and now shall I die for thirst, and fall into the hand of the uncircumcised?";
kjv[19] = "But God clave an hollow place that [was] in the jaw, and there came water thereout; and when he had drunk, his spirit came again, and he revived: wherefore he called the name thereof Enhakkore, which [is] in Lehi unto this day.";
kjv[20] = "And he judged Israel in the days of the Philistines twenty years.";

dby[17] = "And it came to pass when he had ended speaking, that he cast away the jawbone out of his hand, and called that place Ramath-Lehi.";

hnv[17] = "It happened, when he had made an end of speaking, that he cast away the jawbone out of his hand; and that place was called Ramat-Lechi.";

rsv[18] = "And he was very thirsty, and he called on the LORD and said, &quot;Thou hast granted this great deliverance by the hand of thy servant; and shall I now die of thirst, and fall into the hands of the uncircumcised?&quot;";

dby[18] = "And he was very thirsty, and called on Jehovah, and said, Thou hast given by the hand of thy servant this great deliverance, and now shall I die for thirst, and fall into the hand of the uncircumcised?";

rsv[19] = "And God split open the hollow place that is at Lehi, and there came water from it; and when he drank, his spirit returned, and he revived. Therefore the name of it was called En-hakkor\'e; it is at Lehi to this day.";
asv[19] = "But God clave the hollow place that is in Lehi, and there came water thereout; and when he had drunk, his spirit came again, and he revived: wherefore the name thereof was called En-hakkore, which is in Lehi, unto this day.";
yng[19] = "And God cleaveth the hollow place which [is] in Lehi, and waters come out of it, and he drinketh, and his spirit cometh back, and he reviveth; therefore hath [one] called its name `The fountain of him who is calling,\' which [is] in Lehi unto this day.";
dby[19] = "And God clave the hallow rock which was in Lehi, and water came out of it. And he drank, and his spirit came again, and he revived. Therefore its name was called En-hakkore, which is in Lehi to this day.";

vul[19] = "aperuit itaque Dominus molarem dentem in maxilla asini et egressae sunt ex eo aquae quibus haustis refocilavit spiritum et vires recepit idcirco appellatum est nomen loci illius Fons invocantis de maxilla usque in praesentem diem";
