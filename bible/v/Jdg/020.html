csb[1] = "All the Israelites from Dan to Beer-sheba and from the land of Gilead came out, and the community assembled as one body before the LORD at Mizpah.";
csb[2] = "The leaders of all the people and of all the tribes of Israel presented themselves in the assembly of God\'s people: four hundred thousand armed foot soldiers.";
csb[3] = "The Benjaminites heard that the Israelites had gone up to Mizpah. The Israelites asked, &quot;Tell us, how did this evil act happen? &quot;";
csb[4] = "The Levite, the husband of the murdered woman, answered: &quot;I went to Gibeah in Benjamin with my concubine to spend the night.";
csb[5] = "&quot;Citizens of Gibeah came to attack me and surrounded the house at night. They intended to kill me, but they raped my concubine, and she died.";
csb[6] = "&quot;Then I took my concubine and cut her in pieces, and sent her throughout Israel\'s territory, because they have committed a wicked outrage in Israel.";
csb[7] = "&quot;Look, all of you are Israelites. Give your judgment and verdict here and now.&quot;";
csb[8] = "Then all the people stood united and said, &quot;None of us will go to his tent or return to his house.";
csb[9] = "&quot;Now this is what we will do to Gibeah: we will attack it. By lot";
csb[10] = "&quot;we will take ten men out of every hundred from all the tribes of Israel, and one hundred out of every thousand, and one thousand out of every ten thousand to get provisions for the troops when they go to Gibeah in Benjamin to punish them for all the outrage they committed in Israel.&quot;";
csb[11] = "So all the men of Israel gathered united against the city.";
csb[12] = "Then the tribes of Israel sent men throughout the tribe of Benjamin, saying, &quot;What is this evil act that has happened among you?";
csb[13] = "&quot;Hand over the wicked men in Gibeah so we can put them to death and eradicate evil from Israel.&quot; But the Benjaminites would not listen to their fellow Israelites.";
csb[14] = "Instead, the Benjaminites gathered together from their cities to Gibeah to go out and fight against the Israelites.";
csb[15] = "On that day the Benjaminites mobilized twenty-six thousand armed men from their cities, besides seven hundred fit young men rallied by the inhabitants of Gibeah.";
csb[16] = "There were seven hundred fit young men who were left-handed among all these troops; all could sling a stone at a hair and not miss.";
csb[17] = "The Israelites, apart from Benjamin, mobilized four hundred thousand armed men, every one an experienced warrior.";
csb[18] = "They set out, went to Bethel, and inquired of God. The Israelites asked, &quot;Who is to go first to fight for us against the Benjaminites? &quot; And the LORD answered, &quot;Judah will be first.&quot;";
csb[19] = "In the morning, the Israelites set out and camped near Gibeah.";
csb[20] = "The men of Israel went out to fight against Benjamin and took their battle positions against Gibeah.";
csb[21] = "The Benjaminites came out of Gibeah and slaughtered twenty-two thousand men of Israel on the field that day.";
csb[22] = "But the Israelite troops rallied and again took their battle positions in the same place where they positioned themselves on the first day.";
csb[23] = "They went up, wept before the LORD until evening, and inquired of him: &quot;Should we again attack our brothers the Benjaminites? &quot; And the LORD answered: &quot;Fight against them.&quot;";
csb[24] = "On the second day the Israelites advanced against the Benjaminites.";
csb[25] = "That same day the Benjaminites came out from Gibeah to meet them and slaughtered an additional eighteen thousand Israelites on the field; all were armed.";
csb[26] = "The whole Israelite army went to Bethel where they wept and sat before the LORD. They fasted that day until evening and offered burnt offerings and fellowship offerings to the LORD.";
csb[27] = "Then the Israelites inquired of the LORD. In those days, the ark of the covenant of God was there,";
csb[28] = "and Phinehas son of Eleazar, son of Aaron, was serving before it. The Israelites asked: &quot;Should we again fight against our brothers the Benjaminites or should we stop? &quot; The LORD answered: &quot;Fight, because I will hand them over to you tomorrow.&quot;";
csb[29] = "So Israel set up an ambush around Gibeah.";
csb[30] = "On the third day the Israelites fought against the Benjaminites and took their battle positions against Gibeah as before.";
csb[31] = "Then the Benjaminites came out against the troops and were drawn away from the city. They began to attack the troops as before, killing about thirty men of Israel on the highways, one of which goes up to Bethel and the other to Gibeah through the open country.";
csb[32] = "The Benjaminites said, &quot;We are defeating them as before.&quot; But the Israelites said, &quot;Let\'s flee and draw them away from the city to the highways.&quot;";
csb[33] = "So all the men of Israel got up from their places and took their battle positions at Baal-tamar, while the Israelites in ambush charged out of their places west of Geba.";
csb[34] = "Then ten thousand fit young men from all Israel made a frontal assault against Gibeah, and the battle was fierce, but the Benjaminites did not know that disaster was about to strike them.";
csb[35] = "The LORD defeated Benjamin in the presence of Israel, and on that day the Israelites slaughtered 25,100 men of Benjamin; all were armed.";
csb[36] = "Then the Benjaminites realized they had been defeated. The men of Israel had retreated before Benjamin, because they were confident in the ambush they had set against Gibeah.";
csb[37] = "The men in ambush had rushed quickly against Gibeah; they advanced and put the whole city to the sword.";
csb[38] = "The men of Israel had a prearranged signal with the men in ambush: when they sent up a great cloud of smoke from the city,";
csb[39] = "the men of Israel would return to the battle. When Benjamin had begun to strike them down, killing about thirty men of Israel, they said, &quot;They\'re defeated before us, just as they were in the first battle.&quot;";
csb[40] = "But when the column of smoke began to go up from the city, Benjamin looked behind them, and the whole city was going up in smoke.";
csb[41] = "Then the men of Israel returned, and the men of Benjamin were terrified when they realized that disaster had struck them.";
csb[42] = "They retreated before the men of Israel toward the wilderness, but the battle overtook them, and those who came out of the cities slaughtered those between them.";
csb[43] = "They surrounded the Benjaminites, pursued them, and easily overtook them near Gibeah toward the east.";
csb[44] = "There were eighteen thousand men who died from Benjamin; all were warriors.";
csb[45] = "Then Benjamin turned and fled toward the wilderness to Rimmon Rock, and Israel killed five thousand men on the highways. They overtook them at Gidom and struck two thousand more dead.";
csb[46] = "All the Benjaminites who died that day were twenty-five thousand armed men; all were warriors.";
csb[47] = "But six hundred men escaped into the wilderness to Rimmon Rock and stayed there four months.";
csb[48] = "The men of Israel turned back against the other Benjaminites and killed them with their swords -- the entire city, the animals, and everything that remained. They also burned all the cities that remained.";

kjv[10] = "And we will take ten men of an hundred throughout all the tribes of Israel, and an hundred of a thousand, and a thousand out of ten thousand, to fetch victual for the people, that they may do, when they come to Gibeah of Benjamin, according to all the folly that they have wrought in Israel.";
rsv[10] = "and we will take ten men of a hundred throughout all the tribes of Israel, and a hundred of a thousand, and a thousand of ten thousand, to bring provisions for the people, that when they come they may requite Gib\'e-ah of Benjamin, for all the wanton crime which they have committed in Israel.&quot;";
asv[10] = "and we will take ten men of a hundred throughout all the tribes of Israel, and a hundred of a thousand, and a thousand out of ten thousand, to fetch victuals for the people, that they may do, when they come to Gibeah of Benjamin, according to all the folly that they have wrought in Israel.";
yng[10] = "and we have taken ten men of a hundred, of all the tribes of Israel, and a hundred of a thousand, and a thousand of a myriad, to receive provision for the people, to do, at their coming to Gibeah of Benjamin, according to all the folly which it hath done in Israel.\'";

hnv[10] = "and we will take ten men of one hundred throughout all the tribes of Yisra\'el, and one hundred of one thousand, and a thousand out of ten thousand, to get victuals for the people, that they may do, when they come to Gevah of Binyamin, according to all the folly that they have worked in Yisra\'el.";

kjv[17] = "And the men of Israel, beside Benjamin, were numbered four hundred thousand men that drew sword: all these [were] men of war.";
rsv[17] = "And the men of Israel, apart from Benjamin, mustered four hundred thousand men that drew sword; all these were men of war.";
asv[17] = "And the men of Israel, besides Benjamin, were numbered four hundred thousand men that drew sword: all these were men of war.";
yng[17] = "And the men of Israel numbered themselves, apart from Benjamin, four hundred thousand men, drawing sword, each of these a man of war.";
dby[17] = "And the men of Israel, besides Benjamin, were numbered four hundred thousand men that drew sword: all these were men of war.";
web[17] = "And the men of Israel, besides Benjamin, were numbered four hundred thousand men that drew sword: all these [were] men of war.";
hnv[17] = "The men of Yisra\'el, besides Binyamin, were numbered four hundred thousand men who drew sword: all these were men of war.";
vul[17] = "virorum quoque Israhel absque filiis Beniamin inventa sunt quadringenta milia educentium gladios et paratorum ad pugnam";
kjv[18] = "And the children of Israel arose, and went up to the house of God, and asked counsel of God, and said, Which of us shall go up first to the battle against the children of Benjamin? And the LORD said, Judah [shall go up] first.";
rsv[18] = "The people of Israel arose and went up to Bethel, and inquired of God, &quot;Which of us shall go up first to battle against the Benjaminites?&quot; And the LORD said, &quot;Judah shall go up first.&quot;";
asv[18] = "And the children of Israel arose, and went up to Beth-el, and asked counsel of God; and they said, Who shall go up for us first to battle against the children of Benjamin? And Jehovah said, Judah [shall go up] first.";
yng[18] = "And they rise and go up to Beth-El, and ask of God, and the sons of Israel say, `Who doth go up for us at the commencement to battle with the sons of Benjamin?\' and Jehovah saith, `Judah -- at the commencement.\'";
dby[18] = "And the children of Israel arose and went up to Bethel, and inquired of God, and said, Which of us shall go up first to the battle against the children of Benjamin? And Jehovah said, Judah first.";
web[18] = "And the children of Israel arose, and went up to the house of God, and asked counsel of God, and said, Which of us shall go up first to the battle against the children of Benjamin? And the LORD said, Judah [shall go up] first.";
hnv[18] = "The children of Yisra\'el arose, and went up to Beit-El, and asked counsel of God; and they said, Who shall go up for us first to battle against the children of Binyamin? the LORD said, Yehudah [shall go up] first.";
vul[18] = "qui surgentes venerunt in domum Dei hoc est in Silo consulueruntque eum atque dixerunt quis erit in exercitu nostro princeps certaminis contra filios Beniamin quibus respondit Dominus Iudas sit dux vester";
kjv[19] = "And the children of Israel rose up in the morning, and encamped against Gibeah.";
rsv[19] = "Then the people of Israel rose in the morning, and encamped against Gib\'e-ah.";
asv[19] = "And the children of Israel rose up in the morning, and encamped against Gibeah.";
yng[19] = "And the sons of Israel rise in the morning, and encamp against Gibeah,";
dby[19] = "And the children of Israel rose up in the morning and encamped against Gibeah.";
web[19] = "And the children of Israel rose in the morning, and encamped against Gibeah.";
hnv[19] = "The children of Yisra\'el rose up in the morning, and encamped against Gevah.";
vul[19] = "statimque filii Israhel surgentes mane castrametati sunt iuxta Gabaa";
kjv[20] = "And the men of Israel went out to battle against Benjamin; and the men of Israel put themselves in array to fight against them at Gibeah.";
rsv[20] = "And the men of Israel went out to battle against Benjamin; and the men of Israel drew up the battle line against them at Gib\'e-ah.";
asv[20] = "And the men of Israel went out to battle against Benjamin; and the men of Israel set the battle in array against them at Gibeah.";
yng[20] = "and the men of Israel go out to battle with Benjamin, and the men of Israel set themselves in array with them, [for] battle against Gibeah,";
dby[20] = "And the men of Israel went out to battle against Benjamin; and the men of Israel put themselves in array to fight against them at Gibeah.";
web[20] = "And the men of Israel went out to battle against Benjamin; and the men of Israel put themselves in array to fight against them at Gibeah.";
hnv[20] = "The men of Yisra\'el went out to battle against Binyamin; and the men of Yisra\'el set the battle in array against them at Gevah.";
vul[20] = "et inde procedentes ad pugnam contra Beniamin urbem obpugnare coeperunt";
kjv[21] = "And the children of Benjamin came forth out of Gibeah, and destroyed down to the ground of the Israelites that day twenty and two thousand men.";
rsv[21] = "The Benjaminites came out of Gib\'e-ah, and felled to the ground on that day twenty-two thousand men of the Israelites.";
asv[21] = "And the children of Benjamin came forth out of Gibeah, and destroyed down to the ground of the Israelites on that day twenty and two thousand men.";
yng[21] = "and the sons of Benjamin come out from Gibeah, and destroy in Israel on that day two and twenty thousand men -- to the earth.";
dby[21] = "And the children of Benjamin went forth out of Gibeah, and destroyed to the ground of the Israelites that day twenty-two thousand men.";
web[21] = "And the children of Benjamin came forth from Gibeah, and destroyed down to the ground of the Israelites that day twenty and two thousand men.";
hnv[21] = "The children of Binyamin came forth out of Gevah, and destroyed down to the ground of the Yisra\'elites on that day Twenty-two thousand men.";
vul[21] = "egressique filii Beniamin de Gabaa occiderunt de filiis Israhel die illo viginti duo milia viros";
kjv[22] = "And the people the men of Israel encouraged themselves, and set their battle again in array in the place where they put themselves in array the first day.";
rsv[22] = "But the people, the men of Israel, took courage, and again formed the battle line in the same place where they had formed it on the first day.";
asv[22] = "And the people, the men of Israel, encouraged themselves, and set the battle again in array in the place where they set themselves in array the first day.";
yng[22] = "And the people, the men of Israel, strengthen themselves, and add to set the battle in array in the place where they arranged themselves on the first day.";
dby[22] = "And the people, the men of Israel, took courage, and set the battle again in array in the place where they put themselves in array the first day.";
web[22] = "And the people the men of Israel encouraged themselves, and set their battle again in array in the place where they put themselves in array the first day.";
hnv[22] = "The people, the men of Yisra\'el, encouraged themselves, and set the battle again in array in the place where they set themselves in array the first day.";
vul[22] = "rursum filii Israhel et fortitudine et numero confidentes in eodem loco in quo prius certaverant aciem direxerunt";
kjv[23] = "(And the children of Israel went up and wept before the LORD until even, and asked counsel of the LORD, saying, Shall I go up again to battle against the children of Benjamin my brother? And the LORD said, Go up against him.)";
rsv[23] = "And the people of Israel went up and wept before the LORD until the evening; and they inquired of the LORD, &quot;Shall we again draw near to battle against our brethren the Benjaminites?&quot; And the LORD said, &quot;Go up against them.&quot;";
asv[23] = "And the children of Israel went up and wept before Jehovah until even; and they asked of Jehovah, saying, Shall I again draw nigh to battle against the children of Benjamin my brother? And Jehovah said, Go up against him.";
yng[23] = "And the sons of Israel go up and weep before Jehovah till the evening, and ask of Jehovah, saying, `Do I add to draw nigh to battle with the sons of Benjamin, my brother?\' And Jehovah saith, `Go up against him.\'";
dby[23] = "And the children of Israel went up and wept before Jehovah until even, and inquired of Jehovah, saying, Shall I go up again to battle against the children of Benjamin my brother? And Jehovah said, Go up against him.";
web[23] = "(And the children of Israel went up and wept before the LORD until evening, and asked counsel of the LORD, saying, Shall I go up again to battle against the children of Benjamin my brother? And the LORD said, Go up against him.)";
hnv[23] = "The children of Yisra\'el went up and wept before the LORD until even; and they asked of the LORD, saying, Shall I again draw near to battle against the children of Binyamin my brother? the LORD said, Go up against him.";
vul[23] = "ita tamen ut prius ascenderent et flerent coram Domino usque ad noctem consulerentque eum et dicerent debeo ultra procedere ad dimicandum contra filios Beniamin fratres meos an non quibus ille respondit ascendite ad eum et inite certamen";
kjv[24] = "And the children of Israel came near against the children of Benjamin the second day.";
rsv[24] = "So the people of Israel came near against the Benjaminites the second day.";
asv[24] = "And the children of Israel came near against the children of Benjamin the second day.";
yng[24] = "And the sons of Israel draw near unto the sons of Benjamin on the second day,";
dby[24] = "And the children of Israel came near against the children of Benjamin the second day.";
web[24] = "And the children of Israel came near against the children of Benjamin the second day.";
hnv[24] = "The children of Yisra\'el came near against the children of Binyamin the second day.";
vul[24] = "cumque filii Israhel altero die contra Beniamin ad proelium processissent";
kjv[25] = "And Benjamin went forth against them out of Gibeah the second day, and destroyed down to the ground of the children of Israel again eighteen thousand men; all these drew the sword.";
rsv[25] = "And Benjamin went against them out of Gib\'e-ah the second day, and felled to the ground eighteen thousand men of the people of Israel; all these were men who drew the sword.";
asv[25] = "And Benjamin went forth against them out of Gibeah the second day, and destroyed down to the ground of the children of Israel again eighteen thousand men; all these drew the sword.";
yng[25] = "and Benjamin cometh out to meet them from Gibeah on the second day, and destroy among the sons of Israel again eighteen thousand men -- to the earth; all these are drawing sword.";
dby[25] = "And Benjamin went forth against them out of Gibeah the second day, and again destroyed to the ground of the children of Israel eighteen thousand men: all these drew the sword.";
web[25] = "And Benjamin went forth against them out of Gibeah the second day, and destroyed down to the ground of the children of Israel again eighteen thousand men; all these drew the sword.";
hnv[25] = "Binyamin went forth against them out of Gevah the second day, and destroyed down to the ground of the children of Yisra\'el again eighteen thousand men; all these drew the sword.";
vul[25] = "eruperunt filii Beniamin de portis Gabaa et occurrentes eis tanta in illos caede baccati sunt ut decem et octo milia virorum educentium gladium prosternerent";
kjv[26] = "Then all the children of Israel, and all the people, went up, and came unto the house of God, and wept, and sat there before the LORD, and fasted that day until even, and offered burnt offerings and peace offerings before the LORD.";
rsv[26] = "Then all the people of Israel, the whole army, went up and came to Bethel and wept; they sat there before the LORD, and fasted that day until evening, and offered burnt offerings and peace offerings before the LORD.";
asv[26] = "Then all the children of Israel, and all the people, went up, and came unto Beth-el, and wept, and sat there before Jehovah, and fasted that day until even; and they offered burnt-offerings and peace-offerings before Jehovah.";
yng[26] = "And all the sons of Israel go up, even all the people, and come in to Beth-El, and weep, and sit there before Jehovah, and fast on that day till the evening, and cause to ascend burnt-offerings and peace-offerings before Jehovah.";
dby[26] = "Then all the children of Israel, and all the people, went up and came to Bethel, and wept, and abode there before Jehovah, and fasted that day until even, and offered up burnt-offerings and peace-offerings before Jehovah.";
web[26] = "Then all the children of Israel, and all the people, went up, and came to the house of God, and wept, and sat there before the LORD, and fasted that day until evening, and offered burnt-offerings and peace-offerings before the LORD.";
hnv[26] = " Then all the children of Yisra\'el, and all the people, went up, and came to Beit-El, and wept, and sat there before the LORD, and fasted that day until even; and they offered burnt-offerings and peace-offerings before the LORD.";
vul[26] = "quam ob rem omnes filii Israhel venerunt in domum Dei et sedentes flebant coram Domino ieiunaveruntque illo die usque ad vesperam et obtulerunt ei holocausta et pacificas victimas";
kjv[27] = "And the children of Israel enquired of the LORD, (for the ark of the covenant of God [was] there in those days,";
rsv[27] = "And the people of Israel inquired of the LORD (for the ark of the covenant of God was there in those days,";
asv[27] = "And the children of Israel asked of Jehovah (for the ark of the covenant of God was there in those days,";
yng[27] = "And the sons of Israel ask of Jehovah, -- and there [is] the ark of the covenant of God in those days,";
dby[27] = "And the children of Israel inquired of Jehovah (and the ark of the covenant of God was there in those days,";
web[27] = "And the children of Israel inquired of the LORD, (for the ark of the covenant of God [was] there in those days,";
hnv[27] = "The children of Yisra\'el asked of the LORD (for the ark of the covenant of God was there in those days,";
vul[27] = "et super statu suo interrogaverunt eo tempore ibi erat arca foederis Dei";
kjv[28] = "And Phinehas, the son of Eleazar, the son of Aaron, stood before it in those days,) saying, Shall I yet again go out to battle against the children of Benjamin my brother, or shall I cease? And the LORD said, Go up; for to morrow I will deliver them into thine hand.";
rsv[28] = "and Phin\'ehas the son of Elea\'zar, son of Aaron, ministered before it in those days), saying, &quot;Shall we yet again go out to battle against our brethren the Benjaminites, or shall we cease?&quot; And the LORD said, &quot;Go up; for tomorrow I will give them into your hand.&quot;";
asv[28] = "and Phinehas, the son of Eleazar, the son of Aaron, stood before it in those days), saying, Shall I yet again go out to battle against the children of Benjamin my brother, or shall I cease? And Jehovah said, Go up; for to-morrow I will deliver him into thy hand.";
yng[28] = "and Phinehas son of Eleazar, son of Aaron, is standing before it in those days -- saying, `Do I add again to go out to battle with the sons of Benjamin, my brother, or do I cease?\' And Jehovah saith, `Go up, for to-morrow I give him into thy hand.\'";
dby[28] = "and Phinehas, the son of Eleazar, the son of Aaron, stood before it in those days), saying, Shall I yet again go out to battle against the children of Benjamin my brother, or shall I cease? And Jehovah said, Go up; for to-morrow I will give them into thy hand.";
web[28] = "And Phinehas, the son of Eleazar, the son of Aaron, stood before it in those days,) saying, Shall I yet again go out to battle against the children of Benjamin my brother, or shall I cease? And the LORD said, Go up; for to-morrow I will deliver them into thy hand.";
hnv[28] = "and Pinechas, the son of El`azar, the son of Aharon, stood before it in those days), saying, Shall I yet again go out to battle against the children of Binyamin my brother, or shall I cease? the LORD said, Go up; for tomorrow I will deliver him into your hand.";
vul[28] = "et Finees filius Eleazari filii Aaron praepositus domus consuluerunt igitur Dominum atque dixerunt exire ultra debemus ad pugnam contra filios Beniamin fratres nostros an quiescere quibus ait Dominus ascendite cras enim tradam eos in manus vestras";
kjv[29] = "And Israel set liers in wait round about Gibeah.";
rsv[29] = "So Israel set men in ambush round about Gib\'e-ah.";
asv[29] = "And Israel set liers-in-wait against Gibeah round about.";
yng[29] = "And Israel setteth liers in wait against Gibeah, round about,";
dby[29] = "And Israel set liers in wait against Gibeah, round about.";
web[29] = "And Israel set liers in wait around Gibeah.";
hnv[29] = "Yisra\'el set liers-in-wait against Gevah round about.";
vul[29] = "posueruntque filii Israhel insidias per circuitum urbis Gabaa";
kjv[30] = "And the children of Israel went up against the children of Benjamin on the third day, and put themselves in array against Gibeah, as at other times.";
rsv[30] = "And the people of Israel went up against the Benjaminites on the third day, and set themselves in array against Gib\'e-ah, as at other times.";
asv[30] = "And the children of Israel went up against the children of Benjamin on the third day, and set themselves in array against Gibeah, as at other times.";
yng[30] = "and the sons of Israel go up against the sons of Benjamin, on the third day, and arrange themselves against Gibeah, as time by time.";
dby[30] = "And the children of Israel went up against the children of Benjamin on the third day, and put themselves in array against Gibeah, as at the other times.";
web[30] = "And the children of Israel went up against the children of Benjamin on the third day, and put themselves in array against Gibeah, as at other times.";
hnv[30] = " The children of Yisra\'el went up against the children of Binyamin on the third day, and set themselves in array against Gevah, as at other times.";
vul[30] = "et tertia vice sicut semel et bis contra Beniamin exercitum produxerunt";
kjv[31] = "And the children of Benjamin went out against the people, [and] were drawn away from the city; and they began to smite of the people, [and] kill, as at other times, in the highways, of which one goeth up to the house of God, and the other to Gibeah in the field, about thirty men of Israel.";
rsv[31] = "And the Benjaminites went out against the people, and were drawn away from the city; and as at other times they began to smite and kill some of the people, in the highways, one of which goes up to Bethel and the other to Gib\'e-ah, and in the open country, about thirty men of Israel.";
asv[31] = "And the children of Benjamin went out against the people, and were drawn away from the city; and they began to smite and kill of the people, as at other times, in the highways, of which one goeth up to Beth-el, and the other to Gibeah, in the field, about thirty men of Israel.";
yng[31] = "And the sons of Benjamin come out to meet the people; they have been drawn away out of the city, and begin to smite [some] of the people -- wounded as time by time, in the highways (of which one is going up to Beth-El, and the other to Gibeah in the field), [are] about thirty men of Israel.";
dby[31] = "And the children of Benjamin went out against the people, and were drawn away from the city, and began to smite of the people, slaying as at the former times, in the highways, of which one leads to Bethel and the other to Gibeah in the field, about thirty men of Israel.";
web[31] = "And the children of Benjamin went out against the people, [and] were drawn away from the city; and they began to smite of the people, [and] kill, as at other times, in the highways, of which one goeth up to the house of God, and the other to Gibeah in the field, about thirty men of Israel.";
hnv[31] = "The children of Binyamin went out against the people, and were drawn away from the city; and they began to strike and kill of the people, as at other times, in the highways, of which one goes up to Beit-El, and the other to Gevah, in the field, about thirty men of Yisra\'el.";
vul[31] = "sed et filii Beniamin audacter eruperunt de civitate et fugientes adversarios longius persecuti sunt ita ut vulnerarent ex eis sicut primo et secundo die et caederent per duas semitas terga vertentes quarum una ferebat in Bethel altera in Gabaa atque prosternerent triginta circiter viros";
kjv[32] = "And the children of Benjamin said, They [are] smitten down before us, as at the first. But the children of Israel said, Let us flee, and draw them from the city unto the highways.";
rsv[32] = "And the Benjaminites said, &quot;They are routed before us, as at the first.&quot; But the men of Israel said, &quot;Let us flee, and draw them away from the city to the highways.&quot;";
asv[32] = "And the children of Benjamin said, They are smitten down before us, as at the first. But the children of Israel said, Let us flee, and draw them away from the city unto the highways.";
yng[32] = "And the sons of Benjamin say, `They are smitten before us as at the beginning;\' but the sons of Israel said, `Let us flee, and draw them away out of the city, unto the highways.\'";
dby[32] = "And the children of Benjamin said, They are smitten down before us, as at the first. And the children of Israel said, Let us flee, that we may draw them from the city to the highways.";
web[32] = "And the children of Benjamin said, They [are] smitten down before us, as at the first. But the children of Israel said, Let us flee, and draw them from the city to the highways.";
hnv[32] = "The children of Binyamin said, They are struck down before us, as at the first. But the children of Yisra\'el said, Let us flee, and draw them away from the city to the highways.";
vul[32] = "putaverunt enim solito eos more cedere qui fugam arte simulantes iniere consilium ut abstraherent eos de civitate et quasi fugientes ad supradictas semitas perducerent";
kjv[33] = "And all the men of Israel rose up out of their place, and put themselves in array at Baaltamar: and the liers in wait of Israel came forth out of their places, [even] out of the meadows of Gibeah.";
rsv[33] = "And all the men of Israel rose up out of their place, and set themselves in array at Ba\'al-ta\'mar; and the men of Israel who were in ambush rushed out of their place west of Geba.";
asv[33] = "And all the men of Israel rose up out of their place, and set themselves in array at Baal-tamar: and the liers-in-wait of Israel brake forth out of their place, even out of Maareh-geba.";
yng[33] = "And all the men of Israel have risen from their place, and arrange themselves at Baal-Tamar, and the ambush of Israel is coming forth out of its place, out of the meadow of Gibeah.";
dby[33] = "And all the men of Israel rose up out of their place, and put themselves in array at Baal-Tamar; and the ambush of Israel rushed forth out of their place, out of the meadows of Geba.";
web[33] = "And all the men of Israel rose out of their place, and put themselves in array at Baal-tamar: and the liers in wait of Israel came forth out of their places, [even] out of the meadows of Gibeah.";
hnv[33] = "All the men of Yisra\'el rose up out of their place, and set themselves in array at Ba`al-Tamar: and the liers-in-wait of Yisra\'el broke forth out of their place, even out of Ma`areh-Geva.";
vul[33] = "omnes itaque filii Israhel surgentes de sedibus suis tetenderunt aciem in loco qui vocatur Baalthamar insidiae quoque quae circa urbem erant paulatim se aperire coeperunt";
kjv[34] = "And there came against Gibeah ten thousand chosen men out of all Israel, and the battle was sore: but they knew not that evil [was] near them.";
rsv[34] = "And there came against Gib\'e-ah ten thousand picked men out of all Israel, and the battle was hard; but the Benjaminites did not know that disaster was close upon them.";
asv[34] = "And there came over against Gibeah ten thousand chosen men out of all Israel, and the battle was sore; but they knew not that evil was close upon them.";
yng[34] = "And they come in over against Gibeah -- ten thousand chosen men out of all Israel -- and the battle [is] grievous, and they have not known that the evil is striking against them.";
dby[34] = "And there came from opposite Gibeah ten thousand chosen men out of all Israel, and the battle was severe; but they knew not that disaster was coming upon them.";
web[34] = "And there came against Gibeah ten thousand chosen men out of all Israel, and the battle was severe: but they knew not that evil [was] near them.";
hnv[34] = "There came over against Gevah ten thousand chosen men out of all Yisra\'el, and the battle was sore; but they didn\'t know that evil was close on them.";
vul[34] = "et ab occidentali urbis parte procedere sed et alia decem milia virorum de universo Israhel habitatores urbis ad certamina provocabant ingravatumque est bellum contra filios Beniamin et non intellexerunt quod ex omni parte illis instaret interitus";
kjv[35] = "And the LORD smote Benjamin before Israel: and the children of Israel destroyed of the Benjamites that day twenty and five thousand and an hundred men: all these drew the sword.";
rsv[35] = "And the LORD defeated Benjamin before Israel; and the men of Israel destroyed twenty-five thousand one hundred men of Benjamin that day; all these were men who drew the sword.";
asv[35] = "And Jehovah smote Benjamin before Israel; and the children of Israel destroyed of Benjamin that day twenty and five thousand and a hundred men: all these drew the sword.";
yng[35] = "And Jehovah smiteth Benjamin before Israel, and the sons of Israel destroy in Benjamin, on that day, twenty and five thousand, and a hundred men; all these [are] drawing sword.";
dby[35] = "And Jehovah smote Benjamin before Israel; and the children of Israel destroyed of the Benjaminites that day twenty-five thousand one hundred men: all these drew the sword.";
web[35] = "And the LORD smote Benjamin before Israel: and the children of Israel destroyed of the Benjaminites that day twenty and five thousand and a hundred men: all these drew the sword.";
hnv[35] = "The LORD struck Binyamin before Yisra\'el; and the children of Yisra\'el destroyed of Binyamin that day twenty-five thousand one hundred men: all these drew the sword.";
vul[35] = "percussitque eos Dominus in conspectu filiorum Israhel et interfecerunt ex eis in illo die viginti quinque milia et centum viros omnes bellatores et educentes gladium";
kjv[36] = "So the children of Benjamin saw that they were smitten: for the men of Israel gave place to the Benjamites, because they trusted unto the liers in wait which they had set beside Gibeah.";
rsv[36] = "So the Benjaminites saw that they were defeated. The men of Israel gave ground to Benjamin, because they trusted to the men in ambush whom they had set against Gib\'e-ah.";
asv[36] = "So the children of Benjamin saw that they were smitten; for the men of Israel gave place to Benjamin, because they trusted unto the liers-in-wait whom they had set against Gibeah.";
yng[36] = "And the sons of Benjamin see that they have been smitten -- and the men of Israel give place to Benjamin, for they have trusted unto the ambush which they had set against Gibeah,";
dby[36] = "And the children of Benjamin saw that they were smitten. -- And the men of Israel gave place to Benjamin, because they trusted to the ambush that they had set against Gibeah.";
web[36] = "So the children of Benjamin saw that they were smitten: for the men of Israel gave place to the Benjaminites, because they trusted to the liers in wait which they had set beside Gibeah.";
hnv[36] = "So the children of Binyamin saw that they were struck; for the men of Yisra\'el gave place to Binyamin, because they trusted to the liers-in-wait whom they had set against Gevah.";
vul[36] = "filii autem Beniamin cum se inferiores esse vidissent coeperunt fugere quod cernentes filii Israhel dederunt eis ad fugiendum locum ut ad praeparatas insidias devenirent quas iuxta urbem posuerant";
kjv[37] = "And the liers in wait hasted, and rushed upon Gibeah; and the liers in wait drew [themselves] along, and smote all the city with the edge of the sword.";
rsv[37] = "And the men in ambush made haste and rushed upon Gib\'e-ah; the men in ambush moved out and smote all the city with the edge of the sword.";
asv[37] = "And the liers-in-wait hasted, and rushed upon Gibeah; and the liers-in-wait drew themselves along, and smote all the city with the edge of the sword.";
yng[37] = "and the ambush have hasted, and push against Gibeah, and the ambush draweth itself out, and smiteth the whole of the city by the mouth of the sword.";
dby[37] = "And the ambush hasted, and fell upon Gibeah; and the ambush drew along, and smote the whole city with the edge of the sword.";
web[37] = "And the liers in wait hasted, and rushed upon Gibeah; and the liers in wait drew [themselves] along, and smote all the city with the edge of the sword.";
hnv[37] = "The liers-in-wait hurried, and rushed on Gevah; and the liers-in-wait drew themselves along, and struck all the city with the edge of the sword.";
vul[37] = "qui cum repente de latibulis surrexissent et Beniamin terga caedentibus daret ingressi sunt civitatem et percusserunt eam in ore gladii";
kjv[38] = "Now there was an appointed sign between the men of Israel and the liers in wait, that they should make a great flame with smoke rise up out of the city.";
rsv[38] = "Now the appointed signal between the men of Israel and the men in ambush was that when they made a great cloud of smoke rise up out of the city";
asv[38] = "Now the appointed sign between the men of Israel and the liers-in-wait was, that they should make a great cloud of smoke rise up out of the city.";
yng[38] = "And there was the appointed sign to the men of Israel with the ambush -- their causing to go up a great volume of smoke from the city.";
dby[38] = "Now there was an appointed sign between the men of Israel and the ambush, that they should make a thick column of smoke rise up out of the city.";
web[38] = "Now there was an appointed sign between the men of Israel and the liers in wait, that they should make a great flame with smoke to rise from the city.";
hnv[38] = "Now the appointed sign between the men of Yisra\'el and the liers-in-wait was that they should make a great cloud of smoke rise up out of the city.";
vul[38] = "signum autem dederant filii Israhel his quos in insidiis conlocaverant ut postquam urbem cepissent ignem accenderent et ascendente in altum fumo captam urbem demonstrarent";
kjv[39] = "And when the men of Israel retired in the battle, Benjamin began to smite [and] kill of the men of Israel about thirty persons: for they said, Surely they are smitten down before us, as [in] the first battle.";
rsv[39] = "the men of Israel should turn in battle. Now Benjamin had begun to smite and kill about thirty men of Israel; they said, &quot;Surely they are smitten down before us, as in the first battle.&quot;";
asv[39] = "And the men of Israel turned in the battle, and Benjamin began to smite and kill of the men of Israel about thirty persons; for they said, Surely they are smitten down before us, as in the first battle.";
yng[39] = "And the men of Israel turn in battle, and Benjamin hath begun to smite the wounded among the men of Israel, about thirty men, for they said, `Surely they are utterly smitten before us, as [at] the first battle;";
dby[39] = "And when the men of Israel turned back in the battle, Benjamin began to smite, slaying of the men of Israel about thirty men; for they said, Surely they are quite routed before us as in the first battle.";
web[39] = "And when the men of Israel retired in the battle, Benjamin began to smite [and] kill of the men of Israel about thirty persons: for they said, Surely they are smitten down before us, as [in] the first battle.";
hnv[39] = "The men of Yisra\'el turned in the battle, and Binyamin began to strike and kill of the men of Yisra\'el about thirty persons; for they said, Surely they are struck down before us, as in the first battle.";
vul[39] = "quod cum cernerent filii Israhel in ipso certamine positi putaverunt enim filii Beniamin eos fugere et instantius sequebantur caesis de exercitu eorum triginta viris";
kjv[40] = "But when the flame began to arise up out of the city with a pillar of smoke, the Benjamites looked behind them, and, behold, the flame of the city ascended up to heaven.";
rsv[40] = "But when the signal began to rise out of the city in a column of smoke, the Benjaminites looked behind them; and behold, the whole of the city went up in smoke to heaven.";
asv[40] = "But when the cloud began to arise up out of the city in a pillar of smoke, the Benjamites looked behind them; and, behold, the whole of the city went up [in smoke] to heaven.";
yng[40] = "and the volume hath begun to go up from the city -- a pillar of smoke -- and Benjamin turneth behind, and lo, gone up hath the perfection of the city toward the heavens.";
dby[40] = "And when the burning began to rise up out of the city as a pillar of smoke, Benjamin looked behind, and behold, the whole city ascended [in smoke] to the heavens.";
web[40] = "But when the flame began to rise from the city with a pillar of smoke, the Benjaminites looked behind them, and behold, the flame of the city ascended to heaven.";
hnv[40] = "But when the cloud began to arise up out of the city in a pillar of smoke, the Binyamini looked behind them; and, behold, the whole of the city went up in smoke to the sky.";
vul[40] = "et viderent quasi columnam fumi de civitate conscendere Beniamin quoque retro aspiciens captam cerneret civitatem et flammas in sublime ferri";
kjv[41] = "And when the men of Israel turned again, the men of Benjamin were amazed: for they saw that evil was come upon them.";
rsv[41] = "Then the men of Israel turned, and the men of Benjamin were dismayed, for they saw that disaster was close upon them.";
asv[41] = "And the men of Israel turned, and the men of Benjamin were dismayed; for they saw that evil was come upon them.";
yng[41] = "And the men of Israel have turned, and the men of Benjamin are troubled, for they have seen that the evil hath stricken against them --";
dby[41] = "Then the men of Israel turned back, and the men of Benjamin were amazed, for they saw that disaster was come upon them.";
web[41] = "And when the men of Israel turned again, the men of Benjamin were amazed: for they saw that evil had come upon them.";
hnv[41] = "The men of Yisra\'el turned, and the men of Binyamin were dismayed; for they saw that evil had come on them.";
vul[41] = "qui prius simulaverant fugam versa facie fortius resistebant quod cum vidissent filii Beniamin in fugam versi sunt";
kjv[42] = "Therefore they turned [their backs] before the men of Israel unto the way of the wilderness; but the battle overtook them; and them which [came] out of the cities they destroyed in the midst of them.";
rsv[42] = "Therefore they turned their backs before the men of Israel in the direction of the wilderness; but the battle overtook them, and those who came out of the cities destroyed them in the midst of them.";
asv[42] = "Therefore they turned their backs before the men of Israel unto the way of the wilderness; but the battle followed hard after them; and they that came out of the cities destroyed them in the midst thereof.";
yng[42] = "and they turn before the men of Israel unto the way of the wilderness, and the battle hath followed them; and those who [are] from the city are destroying them in their midst;";
dby[42] = "And they turned before the men of Israel to the way of the wilderness; but the battle overtook them; and those who came out of the cities destroyed them in their midst.";
web[42] = "Therefore they turned [their backs] before the men of Israel to the way of the wilderness; but the battle overtook them; and them who [came] out of the cities they destroyed in the midst of them.";
hnv[42] = " Therefore they turned their backs before the men of Yisra\'el to the way of the wilderness; but the battle followed hard after them; and those who came out of the cities destroyed them in the midst of it.";
vul[42] = "et ad viam deserti ire coeperunt illuc quoque eos adversariis persequentibus sed et hii qui urbem succenderant occurrerunt eis";
kjv[43] = "[Thus] they inclosed the Benjamites round about, [and] chased them, [and] trode them down with ease over against Gibeah toward the sunrising.";
rsv[43] = "Cutting down the Benjaminites, they pursued them and trod them down from Nohah as far as opposite Gib\'e-ah on the east.";
asv[43] = "They inclosed the Benjamites round about, [and] chased them, [and] trod them down at [their] resting-place, as far as over against Gibeah toward the sunrising.";
yng[43] = "they have compassed the Benjamites -- they have pursued them -- with ease they have trodden them down till over-against Gibeah, at the sun-rising.";
dby[43] = "They encompassed the Benjaminites, chased them, trode them down at the resting-place over against Gibeah toward the sun-rising.";
web[43] = "[Thus] they inclosed the Benjaminites on all sides, [and] chased them, [and] trod them down with ease over against Gibeah towards the sun-rising.";
hnv[43] = " They enclosed the Binyamini round about, [and] chased them, [and] trod them down at [their] resting-place, as far as over against Gevah toward the sunrise.";
vul[43] = "atque ita factum est ut ex utraque parte ab hostibus caederentur nec erat ulla morientium requies ceciderunt atque prostrati sunt ad orientalem plagam urbis Gabaa";
kjv[44] = "And there fell of Benjamin eighteen thousand men; all these [were] men of valour.";
rsv[44] = "Eighteen thousand men of Benjamin fell, all of them men of valor.";
asv[44] = "And there fell of Benjamin eighteen thousand men; all these [were] men of valor.";
yng[44] = "And there fall of Benjamin eighteen thousand men -- the whole of these [are] men of valour;";
dby[44] = "And there fell of Benjamin eighteen thousand men: all these, men of valour.";
web[44] = "And there fell of Benjamin eighteen thousand men; all these [were] men of valor.";
hnv[44] = "There fell of Binyamin eighteen thousand men; all these [were] men of valor.";
vul[44] = "fuerunt autem qui in eodem loco interfecti sunt decem et octo milia virorum omnes robustissimi pugnatores";
kjv[45] = "And they turned and fled toward the wilderness unto the rock of Rimmon: and they gleaned of them in the highways five thousand men; and pursued hard after them unto Gidom, and slew two thousand men of them.";
rsv[45] = "And they turned and fled toward the wilderness to the rock of Rimmon; five thousand men of them were cut down in the highways, and they were pursued hard to Gidom, and two thousand men of them were slain.";
asv[45] = "And they turned and fled toward the wilderness unto the rock of Rimmon: and they gleaned of them in the highways five thousand men, and followed hard after them unto Gidom, and smote of them two thousand men.";
yng[45] = "and they turn and flee toward the wilderness, unto the rock of Rimmon; and they glean of them in the highways five thousand men, and follow after them unto Gidom, and smite of them two thousand men.";
dby[45] = "And they turned and fled towards the wilderness to the cliff of Rimmon, and they gleaned of them in the highways five thousand men; and pursued hard after them to Gidom, and slew two thousand men of them.";
web[45] = "And they turned and fled towards the wilderness to the rock of Rimmon: and they gleaned of them in the highways five thousand men; and pursued hard after them to Gidom, and slew two thousand men of them.";
hnv[45] = "They turned and fled toward the wilderness to the rock of Rimmon: and they gleaned of them in the highways five thousand men, and followed hard after them to Gid`om, and struck of them two thousand men.";
vul[45] = "quod cum vidissent qui remanserant de Beniamin fugerunt in solitudinem et pergebant ad petram cuius vocabulum est Remmon in illa quoque fuga palantes et in diversa tendentes occiderunt quinque milia viros et cum ultra tenderent persecuti sunt eos et interfecerunt etiam alios duo milia";
kjv[46] = "So that all which fell that day of Benjamin were twenty and five thousand men that drew the sword; all these [were] men of valour.";
rsv[46] = "So all who fell that day of Benjamin were twenty-five thousand men that drew the sword, all of them men of valor.";
asv[46] = "So that all who fell that day of Benjamin were twenty and five thousand men that drew the sword; all these [were] men of valor.";
yng[46] = "And all those falling of Benjamin are twenty and five thousand men drawing sword, on that day -- the whole of these [are] men of valour;";
dby[46] = "So that all who fell that day of Benjamin were twenty-five thousand men that drew the sword: all these, men of valour.";
web[46] = "So that all who fell that day of Benjamin were twenty and five thousand men that drew the sword; all these [were] men of valor.";
hnv[46] = "So that all who fell that day of Binyamin were twenty-five thousand men who drew the sword; all these [were] men of valor.";
vul[46] = "et sic factum est ut omnes qui ceciderant de Beniamin in diversis locis essent viginti quinque milia pugnatores ad bella promptissimi";
kjv[47] = "But six hundred men turned and fled to the wilderness unto the rock Rimmon, and abode in the rock Rimmon four months.";
rsv[47] = "But six hundred men turned and fled toward the wilderness to the rock of Rimmon, and abode at the rock of Rimmon four months.";
asv[47] = "But six hundred men turned and fled toward the wilderness unto the rock of Rimmon, and abode in the rock of Rimmon four months.";
yng[47] = "and there turn and flee into the wilderness, unto the rock of Rimmon six hundred men, and they dwell in the rock Rimmon four months.";
dby[47] = "And six hundred men turned and fled to the wilderness to the cliff of Rimmon, and abode at the cliff of Rimmon four months.";
web[47] = "But six hundred men turned and fled to the wilderness to the rock Rimmon, and abode in the rock Rimmon four months.";
hnv[47] = "But six hundred men turned and fled toward the wilderness to the rock of Rimmon, and abode in the rock of Rimmon four months.";
vul[47] = "remanserunt itaque de omni numero Beniamin qui evadere potuerant et fugere in solitudinem sescenti viri sederuntque in petra Remmon mensibus quattuor";
kjv[48] = "And the men of Israel turned again upon the children of Benjamin, and smote them with the edge of the sword, as well the men of [every] city, as the beast, and all that came to hand: also they set on fire all the cities that they came to.";
rsv[48] = "And the men of Israel turned back against the Benjaminites, and smote them with the edge of the sword, men and beasts and all that they found. And all the towns which they found they set on fire.";
asv[48] = "And the men of Israel turned again upon the children of Benjamin, and smote them with the edge of the sword, both the entire city, and the cattle, and all that they found: moreover all the cities which they found they set on fire.";
yng[48] = "And the men of Israel have turned back unto the sons of Benjamin, and smite them by the mouth of the sword out of the city, -- men unto cattle, unto all that is found; also all the cities which are found they have sent into fire.";
dby[48] = "And the men of Israel turned again upon the children of Benjamin, and smote them with the edge of the sword, as well the men of [every] city as the cattle, and all that was found; even all the cities that were found did they set on fire.";
web[48] = "And the men of Israel turned again upon the children of Benjamin, and smote them with the edge of the sword, as well the men of [every] city, as the beast, and all that came to hand: also they set on fire all the cities that they came to.";
hnv[48] = "The men of Yisra\'el turned again on the children of Binyamin, and struck them with the edge of the sword, both the entire city, and the cattle, and all that they found: moreover all the cities which they found they set on fire.";
vul[48] = "regressi autem filii Israhel omnes reliquias civitatis a viris usque ad iumenta gladio percusserunt cunctasque urbes et viculos Beniamin vorax flamma consumpsit";
