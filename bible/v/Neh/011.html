csb[1] = "Now the leaders of the people stayed in Jerusalem, and the rest of the people cast lots for one out of ten to come and live in Jerusalem, the holy city, while the other nine-tenths remained in their towns.";
csb[2] = "The people blessed all the men who volunteered to live in Jerusalem.";
csb[3] = "These are the heads of the province who stayed in Jerusalem (but in the villages of Judah each lived on his own property in their towns -- the Israelites, priests, Levites, temple servants, and descendants of Solomon\'s servants --";
csb[4] = "while some of the descendants of Judah and Benjamin settled in Jerusalem): Judah\'s descendants: Athaiah son of Uzziah, son of Zechariah, son of Amariah, son of Shephatiah, son of Mahalalel, of Perez\'s descendants;";
csb[5] = "and Maaseiah son of Baruch, son of Col-hozeh, son of Hazaiah, son of Adaiah, son of Joiarib, son of Zechariah, a descendant of the Shilonite.";
csb[6] = "The total number of Perez\'s descendants, who settled in Jerusalem, was 468 capable men.";
csb[7] = "These were Benjamin\'s descendants: Sallu son of Meshullam, son of Joed, son of Pedaiah, son of Kolaiah, son of Maaseiah, son of Ithiel, son of Jeshaiah,";
csb[8] = "and after him Gabbai and Sallai: 928.";
csb[9] = "Joel son of Zichri was the officer over them, and Judah son of Hassenuah was second in command over the city.";
csb[10] = "The priests: Jedaiah son of Joiarib, Jachin, and";
csb[11] = "Seraiah son of Hilkiah, son of Meshullam, son of Zadok, son of Meraioth, son of Ahitub, the chief official of God\'s temple,";
csb[12] = "and their relatives who did the work at the temple: 822. Adaiah son of Jeroham, son of Pelaliah, son of Amzi, son of Zechariah, son of Pashhur, son of Malchijah";
csb[13] = "and his relatives, the heads of families: 242. Amashsai son of Azarel, son of Ahzai, son of Meshillemoth, son of Immer,";
csb[14] = "and their relatives, capable men: 128. Zabdiel son of Haggedolim, was their chief.";
csb[15] = "The Levites: Shemaiah son of Hasshub, son of Azrikam, son of Hashabiah, son of Bunni;";
csb[16] = "and Shabbethai and Jozabad, from the heads of the Levites, who supervised the work outside the house of God;";
csb[17] = "Mattaniah son of Mica, son of Zabdi, son of Asaph, the one who began the thanksgiving in prayer; Bakbukiah, second among his relatives; and Abda son of Shammua, son of Galal, son of Jeduthun.";
csb[18] = "All the Levites in the holy city: 284.";
csb[19] = "The gatekeepers: Akkub, Talmon, and their relatives, who guarded the city gates: 172.";
csb[20] = "The rest of Israel, the priests, and the Levites were in all the villages of Judah, each on his own inherited property.";
csb[21] = "The temple servants lived on Ophel; Ziha and Gishpa supervised the temple servants.";
csb[22] = "The leader of the Levites in Jerusalem was Uzzi son of Bani, son of Hashabiah, son of Mattaniah, son of Mica, of the descendants of Asaph, who were singers for the service of God\'s house.";
csb[23] = "There was, in fact, a command of the king regarding them, and an ordinance regulating the singers\' daily tasks.";
csb[24] = "Pethahiah son of Meshezabel, of the descendants of Zerah son of Judah, was the king\'s agent in every matter concerning the people.";
csb[25] = "As for the farming settlements with their fields: Some of Judah\'s descendants lived in Kiriath-arba and Dibon and their surrounding villages, and Jekabzeel and its settlements;";
csb[26] = "in Jeshua, Moladah, Beth-pelet,";
csb[27] = "Hazar-shual, and Beer-sheba and its surrounding villages;";
csb[28] = "in Ziklag and Meconah and its surrounding villages;";
csb[29] = "in En-rimmon, Zorah, Jarmuth, and";
csb[30] = "Zanoah and Adullam with their settlements; in Lachish with its fields and Azekah and its surrounding villages. So they settled from Beer-sheba to Hinnom Valley.";
csb[31] = "Benjamin\'s descendants: from Geba, Michmash, Aija, and Bethel and its surrounding villages,";
csb[32] = "Anathoth, Nob, Ananiah,";
csb[33] = "Hazor, Ramah, Gittaim,";
csb[34] = "Hadid, Zeboim, Neballat,";
csb[35] = "Lod, and Ono, in Craftsmen\'s Valley.";
csb[36] = "Some of the Judean divisions of Levites were in Benjamin.";
kjv[1] = "And the rulers of the people dwelt at Jerusalem: the rest of the people also cast lots, to bring one of ten to dwell in Jerusalem the holy city, and nine parts [to dwell] in [other] cities.";

vul[1] = "habitaverunt autem principes populi in Hierusalem reliqua vero plebs misit sortem ut tollerent unam partem de decem qui habitaturi essent in Hierusalem in civitate sancta novem vero partes in civitatibus";

asv[2] = "And the people blessed all the men that willingly offered themselves to dwell in Jerusalem.";
yng[2] = "and the people give a blessing to all the men who are offering themselves willingly to dwell in Jerusalem.";
dby[2] = "And the people blessed all the men that willingly offered themselves to dwell in Jerusalem.";
web[2] = "And the people blessed all the men that willingly offered themselves to dwell at Jerusalem.";
hnv[2] = "The people blessed all the men who willingly offered themselves to dwell in Yerushalayim.";
vul[2] = "benedixit autem populus omnibus viris qui se sponte obtulerunt ut habitarent in Hierusalem";
kjv[3] = "Now these [are] the chief of the province that dwelt in Jerusalem: but in the cities of Judah dwelt every one in his possession in their cities, [to wit], Israel, the priests, and the Levites, and the Nethinims, and the children of Solomon\'s servants.";
rsv[3] = "These are the chiefs of the province who lived in Jerusalem; but in the towns of Judah every one lived on his property in their towns: Israel, the priests, the Levites, the temple servants, and the descendants of Solomon\'s servants.";
asv[3] = "Now these are the chiefs of the province that dwelt in Jerusalem: but in the cities of Judah dwelt every one in his possession in their cities, [to wit], Israel, the priests, and the Levites, and the Nethinim, and the children of Solomon\'s servants.";
yng[3] = "And these [are] heads of the province who have dwelt in Jerusalem, and in cities of Judah, they have dwelt each in his possession in their cities; Israel, the priests, and the Levites, and the Nethinim, and the sons of the servants of Solomon.";
dby[3] = "And these are the chiefs of the province that dwelt in Jerusalem; but in the cities of Judah dwelt every one in his possession in their cities, Israel, the priests, and the Levites, and the Nethinim, and the children of Solomon\'s servants.";
web[3] = "Now these [are] the chief of the province that dwelt in Jerusalem: but in the cities of Judah dwelt every one in his possession in their cities, [to wit], Israel, the priests, and the Levites, and the Nethinims, and the children of Solomon\'s servants.";
hnv[3] = "Now these are the chiefs of the province who lived in Yerushalayim: but in the cities of Yehudah lived everyone in his possession in their cities, [to wit], Yisra\'el, the Kohanim, and the Levites, and the temple servants, and the children of Shlomo\'s servants.";
vul[3] = "hii sunt itaque principes provinciae qui habitaverunt in Hierusalem et in civitatibus Iuda habitavit unusquisque in possessione sua in urbibus suis Israhel sacerdotes Levitae Nathinnei et filii servorum Salomonis";
kjv[4] = "And at Jerusalem dwelt [certain] of the children of Judah, and of the children of Benjamin. Of the children of Judah; Athaiah the son of Uzziah, the son of Zechariah, the son of Amariah, the son of Shephatiah, the son of Mahalaleel, of the children of Perez;";
rsv[4] = "And in Jerusalem lived certain of the sons of Judah and of the sons of Benjamin. Of the sons of Judah: Athai\'ah the son of Uzzi\'ah, son of Zechari\'ah, son of Amari\'ah, son of Shephati\'ah, son of Mahal\'alel, of the sons of Perez;";
asv[4] = "And in Jerusalem dwelt certain of the children of Judah, and of the children of Benjamin. Of the children of Judah: Athaiah the son of Uzziah, the son of Zechariah, the son of Amariah, the son of Shephatiah, the son of Mahalalel, of the children of Perez;";
yng[4] = "And in Jerusalem have dwelt of the sons of Judah, and of the sons of Benjamin. Of the sons of Judah: Athaiah son of Uzziah, son of Zechariah, son of Amariah, son of Shephatiah, son of Mahalaleel, of the sons of Perez;";
dby[4] = "And in Jerusalem dwelt some of the children of Judah and of the children of Benjamin. Of the children of Judah: Athaiah the son of Uzziah, the son of Zechariah, the son of Amariah, the son of Shephatiah, the son of Mahalaleel, of the children of Pherez;";
web[4] = "And at Jerusalem dwelt [certain] of the children of Judah, and of the children of Benjamin. Of the children of Judah; Athaiah the son of Uzziah, the son of Zechariah, the son of Amariah, the son of Shephatiah, the son of Mahalaleel, of the children of Perez;";
hnv[4] = "In Yerushalayim lived certain of the children of Yehudah, and of the children of Binyamin. Of the children of Yehudah: `Atayah the son of `Uzziyah, the son of Zekharyah, the son of Amaryah, the son of Shefatyah, the son of Mahalal\'el, of the children of Peretz;";

asv[17] = "and Mattaniah the son of Mica, the son of Zabdi, the son of Asaph, who was the chief to begin the thanksgiving in prayer, and Bakbukiah, the second among his brethren; and Abda the son of Shammua, the son of Galal, the son of Jeduthun.";
yng[17] = "and Mattaniah son of Micha, son of Zabdi, son of Asaph, [is] head -- at the commencement he giveth thanks in prayer; and Bakbukiah [is] second among his brethren, and Abda son of Shammua, son of Galal, son of Jeduthun.";
dby[17] = "and Mattaniah the son of Mica, the son of Zabdi, the son of Asaph, [who was] the principal to begin the thanksgiving in prayer; and Bakbukiah, the second among his brethren; and Abda the son of Shammua, the son of Galal, the son of Jeduthun:";

vul[17] = "et Mathania filius Micha filius Zebdaei filius Asaph princeps ad laudandum et confitendum in oratione et Becbecia secundus de fratribus eius et Abda filius Sammua filius Galal filius Idithun";
