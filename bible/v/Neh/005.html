csb[1] = "There was a widespread outcry from the people and their wives against their Jewish countrymen.";
csb[2] = "Some were saying, &quot;We, our sons, and our daughters are numerous. Let us get grain so that we can eat and live.&quot;";
csb[3] = "Others were saying, &quot;We are mortgaging our fields, vineyards, and homes to get grain during the famine.&quot;";
csb[4] = "Still others were saying, &quot;We have borrowed money to pay the king\'s tax on our fields and vineyards.";
csb[5] = "&quot;We and our children are just like our countrymen and their children, yet we are subjecting our sons and daughters to slavery. Some of our daughters are already enslaved, but we are powerless because our fields and vineyards belong to others.&quot;";
csb[6] = "I became extremely angry when I heard their outcry and these complaints.";
csb[7] = "After seriously considering the matter, I accused the nobles and officials, saying to them, &quot;Each of you is charging his countrymen interest.&quot; So I called a large assembly against them";
csb[8] = "and said, &quot;We have done our best to buy back our Jewish countrymen who were sold to foreigners, but now you sell your own countrymen, and we have to buy them back.&quot; They remained silent and could not say a word.";
csb[9] = "Then I said, &quot;What you are doing isn\'t right. Shouldn\'t you walk in the fear of our God and not invite the reproach of our foreign enemies?";
csb[10] = "&quot;Even I, as well as my brothers and my servants, have been lending them money and grain. Please, let us stop charging this interest.";
csb[11] = "&quot;Return their fields, vineyards, olive groves, and houses to them immediately, along with the percentage of the money, grain, new wine, and fresh oil that you have been assessing them.&quot;";
csb[12] = "They responded: &quot;We will return these things and require nothing more from them. We will do as you say.&quot; So I summoned the priests and made everyone take an oath to do this.";
csb[13] = "I also shook the folds of my robe and said, &quot;May God likewise shake from his house and property everyone who doesn\'t keep this promise. May he be shaken out and have nothing! &quot; The whole assembly said, &quot;Amen,&quot; and they praised the LORD. Then the people did as they had promised.";
csb[14] = "Furthermore, from the day King Artaxerxes appointed me to be their governor in the land of Judah -- from the twentieth year until his thirty-second year, twelve years -- I and my associates never ate from the food allotted to the governor.";
csb[15] = "The governors who preceded me had heavily burdened the people, taking from them food and wine as well as a pound of silver. Their subordinates also oppressed the people, but because of the fear of God, I didn\'t do this.";
csb[16] = "Instead, I devoted myself to the construction of this wall, and all my subordinates were gathered there for the work. We didn\'t buy any land.";
csb[17] = "There were 150 Jews and officials, as well as guests from the surrounding nations at my table.";
csb[18] = "Each day, one ox, six choice sheep, and some fowl were prepared for me. An abundance of all kinds of wine was provided every ten days. But I didn\'t demand the food allotted to the governor, because the burden on the people was so heavy.";
csb[19] = "Remember me favorably, my God, for all that I have done for this people.";

kjv[5] = "Yet now our flesh [is] as the flesh of our brethren, our children as their children: and, lo, we bring into bondage our sons and our daughters to be servants, and [some] of our daughters are brought unto bondage [already]: neither [is it] in our power [to redeem them]; for other men have our lands and vineyards.";
rsv[5] = "Now our flesh is as the flesh of our brethren, our children are as their children; yet we are forcing our sons and our daughters to be slaves, and some of our daughters have already been enslaved; but it is not in our power to help it, for other men have our fields and our vineyards.&quot;";
asv[5] = "Yet now our flesh is as the flesh of our brethren, our children as their children: and, lo, we bring into bondage our sons and our daughters to be servants, and some of our daughters are brought into bondage [already]: neither is it in our power to help it; for other men have our fields and our vineyards.";
yng[5] = "and now, as the flesh of our brethren [is] our flesh, as their sons [are] our sons, and lo, we are subduing our sons and our daughters for servants, and there are of our daughters subdued, and our hand hath no might, and our fields and our vineyards [are] to others.\'";
dby[5] = "yet now our flesh is as the flesh of our brethren, our children as their children; and behold, we must bring into bondage our sons and our daughters to be servants, and some of our daughters are brought into bondage [already]; neither is it in the power of our hand [to redeem them], for other men have our fields and our vineyards.";

hnv[5] = "Yet now our flesh is as the flesh of our brothers, our children as their children: and, behold, we bring into bondage our sons and our daughters to be servants, and some of our daughters are brought into bondage [already]: neither is it in our power to help it; for other men have our fields and our vineyards.";

kjv[8] = "And I said unto them, We after our ability have redeemed our brethren the Jews, which were sold unto the heathen; and will ye even sell your brethren? or shall they be sold unto us? Then held they their peace, and found nothing [to answer].";
rsv[8] = "and said to them, &quot;We, as far as we are able, have bought back our Jewish brethren who have been sold to the nations; but you even sell your brethren that they may be sold to us!&quot; They were silent, and could not find a word to say.";
asv[8] = "And I said unto them, We after our ability have redeemed our brethren the Jews, that were sold unto the nations; and would ye even sell your brethren, and should they be sold unto us? Then held they their peace, and found never a word.";
yng[8] = "and say to them, `We have acquired our brethren the Jews, those sold to the nations, according to the ability that [is] in us, and ye also sell your brethren, and they have been sold to us!\' and they are silent, and have not found a word.";
dby[8] = "And I said to them, We, according to our ability, have redeemed our brethren the Jews, who were sold to the nations; and will ye even sell your brethren? or shall they be sold unto us? And they were silent and found no answer.";
web[8] = "And I said to them, We after our ability have redeemed our brethren the Jews, who were sold to the heathen; and will ye even sell your brethren? or shall they be sold to us? Then they held their peace, and found nothing [to answer].";
hnv[8] = "I said to them, We after our ability have redeemed our brothers the Yehudim, that were sold to the nations; and would you even sell your brothers, and should they be sold to us? Then held they their shalom, and found never a word.";
vul[8] = "et dixi eis nos ut scitis redemimus fratres nostros iudaeos qui venditi fuerant gentibus secundum possibilitatem nostram et vos igitur vendite fratres vestros et emimus eos et siluerunt nec invenerunt quid responderent";

kjv[12] = "Then said they, We will restore [them], and will require nothing of them; so will we do as thou sayest. Then I called the priests, and took an oath of them, that they should do according to this promise.";

kjv[13] = "Also I shook my lap, and said, So God shake out every man from his house, and from his labour, that performeth not this promise, even thus be he shaken out, and emptied. And all the congregation said, Amen, and praised the LORD. And the people did according to this promise.";
rsv[13] = "I also shook out my lap and said, &quot;So may God shake out every man from his house and from his labor who does not perform this promise. So may he be shaken out and emptied.&quot; And all the assembly said &quot;Amen&quot; and praised the LORD. And the people did as they had promised.";
asv[13] = "Also I shook out my lap, and said, So God shake out every man from his house, and from his labor, that performeth not this promise; even thus be he shaken out, and emptied. And all the assembly said, Amen, and praised Jehovah. And the people did according to this promise.";
yng[13] = "also, my lap I have shaken, and I say, `Thus doth God shake out every man, who doth not perform this thing, from his house, and from his labour; yea, thus is he shaken out and empty;\' and all the assembly say, `Amen,\' and praise Jehovah; and the people do according to this thing.";
dby[13] = "Also I shook my lap, and said, So God shake out every man from his house and from his earnings, that performeth not this promise: even thus be he shaken out and emptied! And all the congregation said, Amen! And they praised Jehovah. And the people did according to this promise.";
web[13] = "Also I shook my lap, and said, So God shake out every man from his house, and from his labor, that performeth not this promise, even thus be he shaken out, and emptied. And all the congregation said, Amen, and praised the LORD. And the people did according to this promise.";

yng[14] = "Also, from the day that he appointed me to be their governor in the land of Judah, from the twentieth year even unto the thirty and second year of Artaxerxes the king -- twelve years -- I, and my brethren, the bread of the governor have not eaten:";
dby[14] = "Moreover from the time that I was appointed to be their governor in the land of Judah, from the twentieth year even to the thirty-second year of Artaxerxes the king, twelve years, I and my brethren have not eaten the bread of the governor.";

hnv[14] = "Moreover from the time that I was appointed to be their governor in the land of Yehudah, from the twentieth year even to the two and thirtieth year of Artachshasta the king, [that is], twelve years, I and my brothers have not eaten the bread of the governor.";
vul[14] = "a die autem illa qua praeceperat mihi ut essem dux in terra Iuda ab anno vicesimo usque ad annum tricesimum secundum Artarxersis regis per annos duodecim ego et fratres mei annonas quae ducibus debebantur non comedimus";
kjv[15] = "But the former governors that [had been] before me were chargeable unto the people, and had taken of them bread and wine, beside forty shekels of silver; yea, even their servants bare rule over the people: but so did not I, because of the fear of God.";

dby[15] = "But the former governors that were before me had been chargeable to the people, and had taken of them bread and wine, besides forty shekels of silver: even their servants bore rule over the people. But I did not so, because of the fear of God.";

dby[16] = "Yea, also I applied myself to this work of the wall, and we bought no fields; and all my servants were gathered thither for the work.";
web[16] = "Yea, also I continued in the work of this wall, neither bought we any land: and all my servants [were] gathered thither to the work.";
hnv[16] = "Yes, also I continued in the work of this wall, neither bought we any land: and all my servants were gathered there to the work.";
vul[16] = "quin potius in opere muri aedificavi et agrum non emi et omnes pueri mei congregati ad opus erant";

dby[17] = "And there were at my table a hundred and fifty of the Jews and the rulers, besides those that came to us from among the nations that were about us.";
web[17] = "Moreover, [there were] at my table a hundred and fifty of the Jews and rulers, besides those that came to us from among the heathen that [were] about us.";
hnv[17] = "Moreover there were at my table, of the Yehudim and the rulers, one hundred fifty men, besides those who came to us from among the nations that were round about us.";
vul[17] = "Iudaei quoque et magistratus centum quinquaginta viri et qui veniebant ad nos de gentibus quae in circuitu nostro sunt in mensa mea erant";
kjv[18] = "Now [that] which was prepared [for me] daily [was] one ox [and] six choice sheep; also fowls were prepared for me, and once in ten days store of all sorts of wine: yet for all this required not I the bread of the governor, because the bondage was heavy upon this people.";
rsv[18] = "Now that which was prepared for one day was one ox and six choice sheep; fowls likewise were prepared for me, and every ten days skins of wine in abundance; yet with all this I did not demand the food allowance of the governor, because the servitude was heavy upon this people.";
