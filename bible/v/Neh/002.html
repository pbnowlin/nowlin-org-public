csb[1] = "During the month of Nisan in the twentieth year of King Artaxerxes, when wine was set before him, I took the wine and gave it to the king. I had never been sad in his presence,";
csb[2] = "so the king said to me, &quot;Why are you sad, when you aren\'t sick? This is nothing but sadness of heart.&quot; I was overwhelmed with fear";
csb[3] = "and replied to the king, &quot;May the king live forever! Why should I not be sad when the city where my ancestors are buried lies in ruins and its gates have been destroyed by fire? &quot;";
csb[4] = "Then the king asked me, &quot;What is your request? &quot; So I prayed to the God of the heavens";
csb[5] = "and answered the king, &quot;If it pleases the king, and if your servant has found favor with you, send me to Judah and to the city where my ancestors are buried, so that I may rebuild it.&quot;";
csb[6] = "The king, with the queen seated beside him, asked me, &quot;How long will your journey take, and when will you return? &quot; So I gave him a definite time, and it pleased the king to send me.";
csb[7] = "I also said to the king: &quot;If it pleases the king, let me have letters written to the governors of the region west of the Euphrates River, so that they will grant me safe passage until I reach Judah.";
csb[8] = "&quot;And let me have a letter written to Asaph, keeper of the king\'s forest, so that he will give me timber to rebuild the gates of the temple\'s fortress, the city wall, and the home where I will live.&quot; The king granted my requests, for the gracious hand of my God was on me.";
csb[9] = "I went to the governors of the region west of the Euphrates and gave them the king\'s letters. The king had also sent officers of the infantry and cavalry with me.";
csb[10] = "When Sanballat the Horonite and Tobiah the Ammonite official heard that someone had come to pursue the prosperity of the Israelites, they were greatly displeased.";
csb[11] = "After I arrived in Jerusalem and had been there three days,";
csb[12] = "I got up at night and took a few men with me. I didn\'t tell anyone what my God had laid on my heart to do for Jerusalem. The only animal I took was the one I was riding.";
csb[13] = "I went out at night through the Valley Gate toward the Serpent\'s Well and the Dung Gate, and I inspected the walls of Jerusalem that had been broken down and its gates that had been destroyed by fire.";
csb[14] = "I went on to the Fountain Gate and the King\'s Pool, but farther down it became too narrow for my animal to go through.";
csb[15] = "So I went up at night by way of the valley and inspected the wall. Then heading back, I entered through the Valley Gate and returned.";
csb[16] = "The officials did not know where I had gone or what I was doing, for I had not yet told the Jews, priests, nobles, officials, or the rest of those who would be doing the work.";
csb[17] = "So I said to them, &quot;You see the trouble we are in. Jerusalem lies in ruins and its gates have been burned. Come, let\'s rebuild Jerusalem\'s wall, so that we will no longer be a disgrace.&quot;";
csb[18] = "I told them how the gracious hand of my God had been on me, and what the king had said to me. They said, &quot;Let\'s start rebuilding,&quot; and their hands were strengthened to do this good work.";
csb[19] = "When Sanballat the Horonite, Tobiah the Ammonite official, and Geshem the Arab heard about this, they mocked and despised us, and said, &quot;What is this you\'re doing? Are you rebelling against the king? &quot;";
csb[20] = "I gave them this reply, &quot;The God of the heavens is the one who will grant us success. We, his servants, will start building, but you have no share, right, or historic claim in Jerusalem.&quot;";

kjv[17] = "Then said I unto them, Ye see the distress that we [are] in, how Jerusalem [lieth] waste, and the gates thereof are burned with fire: come, and let us build up the wall of Jerusalem, that we be no more a reproach.";
rsv[17] = "Then I said to them, &quot;You see the trouble we are in, how Jerusalem lies in ruins with its gates burned. Come, let us build the wall of Jerusalem, that we may no longer suffer disgrace.&quot;";
asv[17] = "Then said I unto them, Ye see the evil case that we are in, how Jerusalem lieth waste, and the gates thereof are burned with fire: come, and let us build up the wall of Jerusalem, that we be no more a reproach.";
yng[17] = "and I say unto them, `Ye are seeing the evil that we are in, in that Jerusalem [is] waste, and its gates have been burnt with fire; come and we build the wall of Jerusalem, and we are not any more a reproach.\'";
dby[17] = "And I said to them, Ye see the distress that we are in, that Jerusalem lies waste, and its gates are burned with fire. Come, and let us build up the wall of Jerusalem, that we be no more a reproach.";
web[17] = "Then said I to them, Ye see the distress that we [are] in, how Jerusalem [lieth] waste, and its gates are burned with fire: come, and let us build up the wall of Jerusalem, that we may be no more a reproach.";
hnv[17] = "Then said I to them, You see the evil case that we are in, how Yerushalayim lies waste, and the gates of it are burned with fire: come, and let us build up the wall of Yerushalayim, that we be no more a reproach.";
vul[17] = "et dixi eis vos nostis adflictionem in qua sumus quia Hierusalem deserta est et portae eius consumptae sunt igni venite et aedificemus muros Hierusalem et non simus ultra obprobrium";
kjv[18] = "Then I told them of the hand of my God which was good upon me; as also the king\'s words that he had spoken unto me. And they said, Let us rise up and build. So they strengthened their hands for [this] good [work].";
rsv[18] = "And I told them of the hand of my God which had been upon me for good, and also of the words which the king had spoken to me. And they said, &quot;Let us rise up and build.&quot; So they strengthened their hands for the good work.";
asv[18] = "And I told them of the hand of my God which was good upon me, as also of the king\'s words that he had spoken unto me. And they said, Let us rise up and build. So they strengthened their hands for the good [work].";
yng[18] = "And I declare to them the hand of my God that is good upon me, and also the words of the king that he said to me, and they say, `Let us rise, and we have built;\' and they strengthen their hands for good.";
dby[18] = "And I told them of the hand of my God which had been good upon me; as also of the king\'s words which he had said unto me. And they said, Let us rise up and build. And they strengthened their hands for the good [work].";
web[18] = "Then I told them of the hand of my God which was good upon me; as also the king\'s words that he had spoken to me. And they said, Let us rise and build. So they strengthened their hands for [this] good [work].";
hnv[18] = "I told them of the hand of my God which was good on me, as also of the king\'s words that he had spoken to me. They said, Let us rise up and build. So they strengthened their hands for the good [work].";
vul[18] = "et indicavi eis manum Dei mei quod esset bona mecum et verba regis quae locutus est mihi et aio surgamus et aedificemus et confortatae sunt manus eorum in bono";
kjv[19] = "But when Sanballat the Horonite, and Tobiah the servant, the Ammonite, and Geshem the Arabian, heard [it], they laughed us to scorn, and despised us, and said, What [is] this thing that ye do? will ye rebel against the king?";
rsv[19] = "But when Sanbal\'lat the Hor\'onite and Tobi\'ah the servant, the Ammonite, and Geshem the Arab heard of it, they derided us and despised us and said, &quot;What is this thing that you are doing? Are you rebelling against the king?&quot;";
asv[19] = "But when Sanballat the Horonite, and Tobiah the servant, the Ammonite, and Geshem the Arabian, heard it, they laughed us to scorn, and despised us, and said, What is this thing that ye do? will ye rebel against the king?";
yng[19] = "And Sanballat the Horonite heareth, and Tobiah the servant, the Ammonite, and Geshem the Arabian, and they mock at us, and despise us, and say, `What [is] this thing that ye are doing? against the king are ye rebelling?\'";
dby[19] = "And Sanballat the Horonite, and Tobijah the servant, the Ammonite, and Geshem the Arabian, heard it; and they mocked us and despised us, and said, What is this thing which ye do? will ye rebel against the king?";
web[19] = "But when Sanballat the Horonite, and Tobiah the servant, the Ammonite, and Geshem the Arabian, heard [it], they laughed us to scorn, and despised us, and said, What [is] this thing that ye do? will ye rebel against the king?";
hnv[19] = "But when Sanvallat the Horonite, and Toviyah the servant, the `Ammonite, and Geshem the `Arvian, heard it, they ridiculed us, and despised us, and said, What is this thing that you do? will you rebel against the king?";
vul[19] = "audierunt autem Sanaballat Horonites et Tobias servus ammanites et Gosem Arabs et subsannaverunt nos et despexerunt dixeruntque quae est haec res quam facitis numquid contra regem vos rebellatis";
kjv[20] = "Then answered I them, and said unto them, The God of heaven, he will prosper us; therefore we his servants will arise and build: but ye have no portion, nor right, nor memorial, in Jerusalem.";
rsv[20] = "Then I replied to them, &quot;The God of heaven will make us prosper, and we his servants will arise and build; but you have no portion or right or memorial in Jerusalem.&quot;";
asv[20] = "Then answered I them, and said unto them, The God of heaven, he will prosper us; therefore we his servants will arise and build: but ye have no portion, nor right, nor memorial, in Jerusalem.";
yng[20] = "And I return them word, and say to them, `The God of the heavens -- He doth give prosperity to us, and we His servants rise and have built; and to you there is no portion, and right, and memorial in Jerusalem.\'";
dby[20] = "And I answered them, and said to them, The God of the heavens, he will prosper us, and we his servants will arise and build; but ye have no portion, nor right, nor memorial in Jerusalem.";
web[20] = "Then I answered them, and said to them, The God of heaven, he will prosper us; therefore we his servants will arise and build: but ye have no portion, nor right, nor memorial, in Jerusalem.";
hnv[20] = "Then answered I them, and said to them, The God of heaven, he will prosper us; therefore we his servants will arise and build: but you have no portion, nor right, nor memorial, in Yerushalayim.";
vul[20] = "et reddidi eis sermonem dixique ad eos Deus caeli ipse nos iuvat et nos servi eius sumus surgamus et aedificemus vobis autem non est pars et iustitia et memoria in Hierusalem";
</script>
