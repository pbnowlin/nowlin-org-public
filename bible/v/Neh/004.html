csb[1] = "When Sanballat heard that we were rebuilding the wall, he became furious. He mocked the Jews";
csb[2] = "before his colleagues and the powerful men of Samaria, and said, &quot;What are these pathetic Jews doing? Can they restore it by themselves? Will they offer sacrifices? Will they ever finish it? Can they bring these burnt stones back to life from the mounds of rubble? &quot;";
csb[3] = "Then Tobiah the Ammonite, who was beside him, said, &quot;Indeed, even if a fox climbed up what they are building, he would break down their stone wall! &quot;";
csb[4] = "Listen, our God, for we are despised. Make their insults return on their own heads and let them be taken as plunder to a land of captivity.";
csb[5] = "Do not cover their guilt or let their sin be erased from your sight, because they have angered the builders.";
csb[6] = "So we rebuilt the wall until the entire wall was joined together up to half its height, for the people had the will to keep working.";
csb[7] = "When Sanballat, Tobiah, and the Arabs, Ammonites, and Ashdodites heard that the repair to the walls of Jerusalem was progressing and that the gaps were being closed, they became furious.";
csb[8] = "They all plotted together to come and fight against Jerusalem and throw it into confusion.";
csb[9] = "So we prayed to our God and stationed a guard because of them day and night.";
csb[10] = "In Judah, it was said: The strength of the laborer fails, since there is so much rubble. We will never be able to rebuild the wall.";
csb[11] = "And our enemies said, &quot;They won\'t realize it until we\'re among them and can kill them and stop the work.&quot;";
csb[12] = "When the Jews who lived nearby arrived, they said to us time and again, &quot;Everywhere you turn, they attack us.&quot;";
csb[13] = "So I stationed people behind the lowest sections of the wall, at the vulnerable areas. I stationed them by families with their swords, spears, and bows.";
csb[14] = "After I made an inspection, I stood up and said to the nobles, the officials, and the rest of the people, &quot;Don\'t be afraid of them. Remember the great and awe-inspiring Lord, and fight for your countrymen, your sons and daughters, your wives and homes.&quot;";
csb[15] = "When our enemies heard that we knew their scheme and that God had frustrated it, every one of us returned to his own work on the wall.";
csb[16] = "From that day on, half of my men did the work while the other half held spears, shields, bows, and armor. The officers supported all the people of Judah,";
csb[17] = "who were rebuilding the wall. The laborers who carried the loads worked with one hand and held a weapon with the other.";
csb[18] = "Each of the builders had his sword strapped around his waist while he was building, and the trumpeter was beside me.";
csb[19] = "Then I said to the nobles, the officials, and the rest of the people: &quot;The work is enormous and spread out, and we are separated far from one another along the wall.";
csb[20] = "&quot;Wherever you hear the trumpet sound, rally to us there. Our God will fight for us! &quot;";
csb[21] = "So we continued the work, while half of the men were holding spears from daybreak until the stars came out.";
csb[22] = "At that time, I also said to the people, &quot;Let everyone and his servant spend the night inside Jerusalem, so that they can stand guard by night and work by day.&quot;";
csb[23] = "And I, my brothers, my servants, and the men of the guard with me never took off our clothes. Each carried his weapon, even when washing.";
kjv[1] = "But it came to pass, that when Sanballat heard that we builded the wall, he was wroth, and took great indignation, and mocked the Jews.";
rsv[1] = "Now when Sanbal\'lat heard that we were building the wall, he was angry and greatly enraged, and he ridiculed the Jews.";
asv[1] = "But it came to pass that, when Sanballat heard that we were building the wall, he was wroth, and took great indignation, and mocked the Jews.";
yng[1] = "And it cometh to pass, when Sanballat hath heard that we are building the wall, that it is displeasing to him, and he is very angry and mocketh at the Jews,";
dby[1] = "And it came to pass that when Sanballat heard that we built the wall, he was angry and very indignant, and mocked the Jews.";
web[1] = "But it came to pass that when Sanballat heard that we were building the wall, he was wroth, and took great indignation, and mocked the Jews.";
hnv[1] = "But it happened that when Sanvallat heard that we were building the wall, he was angry, and took great indignation, and mocked the Yehudim.";
vul[1] = "factum est autem cum audisset Sanaballat quod aedificaremus murum iratus est valde et motus nimis subsannavit Iudaeos";
kjv[2] = "And he spake before his brethren and the army of Samaria, and said, What do these feeble Jews? will they fortify themselves? will they sacrifice? will they make an end in a day? will they revive the stones out of the heaps of the rubbish which are burned?";
rsv[2] = "And he said in the presence of his brethren and of the army of Sama\'ria, &quot;What are these feeble Jews doing? Will they restore things? Will they sacrifice? Will they finish up in a day? Will they revive the stones out of the heaps of rubbish, and burned ones at that?&quot;";
asv[2] = "And he spake before his brethren and the army of Samaria, and said, What are these feeble Jews doing? will they fortify themselves? will they sacrifice? will they make an end in a day? will they revive the stones out of the heaps of rubbish, seeing they are burned?";
yng[2] = "and saith before his brethren and the force of Samaria, yea, he saith, `What [are] the weak Jews doing? are they left to themselves? do they sacrifice? do they complete in a day? do they revive the stones out of the heaps of the rubbish? -- and they burnt!\'";
dby[2] = "And he spoke before his brethren and the army of Samaria, and said, What do these feeble Jews? shall they be permitted to go on? Will they offer sacrifices? Will they finish in a day? Will they revive the stones out of the heaps of rubbish, when they are burned?";
web[2] = "And he spoke before his brethren, and the army of Samaria, and said, What do these feeble Jews? will they fortify themselves? will they sacrifice? will they make an end in a day? will they revive the stones out of the heaps of the rubbish which are burned?";
hnv[2] = "He spoke before his brothers and the army of Shomron, and said, What are these feeble Yehudim doing? will they fortify themselves? will they sacrifice? will they make an end in a day? will they revive the stones out of the heaps of rubbish, seeing they are burned?";
vul[2] = "et dixit coram fratribus suis et frequentia Samaritanorum quid Iudaei inbecilli faciunt num dimittent eos gentes num sacrificabunt et conplebunt in una die numquid aedificare poterunt lapides de acervis pulveris qui conbusti sunt";
kjv[3] = "Now Tobiah the Ammonite [was] by him, and he said, Even that which they build, if a fox go up, he shall even break down their stone wall.";
rsv[3] = "Tobi\'ah the Ammonite was by him, and he said, &quot;Yes, what they are building--if a fox goes up on it he will break down their stone wall!&quot;";
asv[3] = "Now Tobiah the Ammonite was by him, and he said, Even that which they are building, if a fox go up, he shall break down their stone wall.";
yng[3] = "And Tobiah the Ammonite [is] by him and saith, `Also, that which they are building -- if a fox doth go up, then it hath broken down their stone wall.\'";
dby[3] = "And Tobijah the Ammonite was by him, and he said, Even that which they build, if a fox went up, it would break down their stone wall. --";
web[3] = "Now Tobiah the Ammonite [was] by him, and he said, Even that which they build, if a fox should go up, he would even break down their stone wall.";
hnv[3] = "Now Toviyah the `Ammonite was by him, and he said, Even that which they are building, if a fox go up, he shall break down their stone wall.";
vul[3] = "sed et Tobias Ammanites proximus eius ait aedificent si ascenderit vulpis transiliet murum eorum lapideum";
kjv[4] = "Hear, O our God; for we are despised: and turn their reproach upon their own head, and give them for a prey in the land of captivity:";
rsv[4] = "Hear, O our God, for we are despised; turn back their taunt upon their own heads, and give them up to be plundered in a land where they are captives.";
asv[4] = "Hear, O our God; for we are despised: and turn back their reproach upon their own head, and give them up for a spoil in a land of captivity;";
yng[4] = "Hear, O our God, for we have been despised; and turn back their reproach on their own head, and give them for a spoil in a land of captivity;";
dby[4] = "Hear, our God, for we are despised, and turn their reproach upon their own head, and give them for a prey in a land of captivity!";

kjv[5] = "And cover not their iniquity, and let not their sin be blotted out from before thee: for they have provoked [thee] to anger before the builders.";
rsv[5] = "Do not cover their guilt, and let not their sin be blotted out from thy sight; for they have provoked thee to anger before the builders.";
asv[5] = "and cover not their iniquity, and let not their sin be blotted out from before thee; for they have provoked [thee] to anger before the builders.";
yng[5] = "and do not cover over their iniquity, and their sin from before Thee let not be blotted out, for they have provoked to anger -- over-against those building.";
dby[5] = "And cover not their iniquity, and let not their sin be blotted out from before thee; for they have provoked the builders.";
web[5] = "And cover not their iniquity, and let not their sin be blotted out from before thee: for they have provoked [thee] to anger before the builders.";
hnv[5] = "and don\'t cover their iniquity, and don\'t let their sin be blotted out from before you; for they have provoked [you] to anger before the builders.";

kjv[7] = "But it came to pass, [that] when Sanballat, and Tobiah, and the Arabians, and the Ammonites, and the Ashdodites, heard that the walls of Jerusalem were made up, [and] that the breaches began to be stopped, then they were very wroth,";
rsv[7] = "But when Sanbal\'lat and Tobi\'ah and the Arabs and the Ammonites and the Ash\'dodites heard that the repairing of the walls of Jerusalem was going forward and that the breaches were beginning to be closed, they were very angry;";
asv[7] = "But it came to pass that, when Sanballat, and Tobiah, and the Arabians, and the Ammonites, and the Ashdodites, heard that the repairing of the walls of Jerusalem went forward, [and] that the breaches began to be stopped, then they were very wroth;";
yng[7] = "And it cometh to pass, when Sanballat hath heard, and Tobiah, and the Arabians, and the Ammonites, and the Ashdodites, that lengthening hath gone up to the walls of Jerusalem, that the breeches have begun to be stopped, then it is very displeasing to them,";
dby[7] = "And it came to pass, when Sanballat, and Tobijah, and the Arabians, and the Ammonites, and the Ashdodites heard that the walls of Jerusalem were being repaired, that the breaches began to be stopped, then they were very wroth,";

hnv[7] = "But it happened that when Sanvallat, Toviyah, the `Aravi\'im, the `Ammonim, and the Ashdodi heard that the repairing of the walls of Yerushalayim went forward, [and] that the breaches began to be stopped, then they were very angry;";
vul[7] = "factum est autem cum audisset Sanaballat et Tobias et Arabes et Ammanitae et Azotii quod obducta esset cicatrix muri Hierusalem et quod coepissent interrupta concludi irati sunt nimis";

kjv[14] = "And I looked, and rose up, and said unto the nobles, and to the rulers, and to the rest of the people, Be not ye afraid of them: remember the Lord, [which is] great and terrible, and fight for your brethren, your sons, and your daughters, your wives, and your houses.";

dby[16] = "And from that time forth the half of my servants wrought in the work, and the other half of them held the spears, and the shields, and the bows, and the corslets; and the captains were behind all the house of Judah.";

asv[18] = "and the builders, every one had his sword girded by his side, and so builded. And he that sounded the trumpet was by me.";
yng[18] = "And the builders [are] each with his sword, girded on his loins, and building, and he who is blowing with a trumpet [is] beside me.";

asv[19] = "And I said unto the nobles, and to the rulers and to the rest of the people, The work is great and large, and we are separated upon the wall, one far from another:";

dby[19] = "And I said to the nobles, and to the rulers, and to the rest of the people, The work is great and extended, and we are scattered upon the wall, one far from another:";
web[19] = "And I said to the nobles, and to the rulers, and to the rest of the people, The work [is] great and large, and we are separated upon the wall, one far from another.";

rsv[20] = "In the place where you hear the sound of the trumpet, rally to us there. Our God will fight for us.&quot;";
asv[20] = "in what place soever ye hear the sound of the trumpet, resort ye thither unto us; our God will fight for us.";
yng[20] = "in the place that ye hear the voice of the trumpet thither ye are gathered unto us; our God doth fight for us.\'";

web[20] = "In what place [therefore] ye hear the sound of the trumpet, resort ye thither to us: our God will fight for us.";
hnv[20] = "in whatever place you hear the sound of the shofar, resort you there to us; our God will fight for us.";

web[21] = "So we labored in the work: and half of them held the spears from the rising of the morning till the stars appeared.";
hnv[21] = "So we worked in the work: and half of them held the spears from the rising of the morning until the stars appeared.";

hnv[22] = "Likewise at the same time said I to the people, Let everyone with his servant lodge within Yerushalayim, that in the night they may be a guard to us, and may labor in the day.";

web[23] = "So neither I, nor my brethren, nor my servants, nor the men of the guard who followed me, none of us put off our clothes, [saving that] every one put them off for washing.";
hnv[23] = "So neither I, nor my brothers, nor my servants, nor the men of the guard who followed me, none of us put off our clothes, everyone [went with] his weapon [to] the water.";
