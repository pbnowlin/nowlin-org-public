csb[1] = "The words of Nehemiah son of Hacaliah: During the month of Chislev in the twentieth year, when I was in the fortress city of Susa,";
csb[2] = "Hanani, one of my brothers, arrived with men from Judah, and I questioned them about Jerusalem and the Jewish remnant that had survived the exile.";
csb[3] = "They said to me, &quot;The remnant in the province, who survived the exile, are in great trouble and disgrace. Jerusalem\'s wall has been broken down, and its gates have been burned.&quot;";
csb[4] = "When I heard these words, I sat down and wept. I mourned for a number of days, fasting and praying before the God of the heavens.";
csb[5] = "I said, LORD, the God of the heavens, the great and awe-inspiring God who keeps his gracious covenant with those who love him and keep his commands,";
csb[6] = "let your eyes be open and your ears be attentive to hear your servant\'s prayer that I now pray to you day and night for your servants, the Israelites. I confess the sins we have committed against you. Both I and my father\'s family have sinned.";
csb[7] = "We have acted corruptly toward you and have not kept the commands, statutes, and ordinances you gave your servant Moses.";
csb[8] = "Please remember what you commanded your servant Moses: &quot;If you are unfaithful, I will scatter you among the peoples.";
csb[9] = "&quot;But if you return to me and carefully observe my commands, even though your exiles were banished to the farthest horizon, I will gather them from there and bring them to the place where I chose to have my name dwell.&quot;";
csb[10] = "They are your servants and your people. You redeemed them by your great power and strong hand.";
csb[11] = "Please, Lord, let your ear be attentive to the prayer of your servant and to that of your servants who delight to revere your name. Give your servant success today, and grant him compassion in the presence of this man. At the time, I was the king\'s cupbearer.";

kjv[6] = "Let thine ear now be attentive, and thine eyes open, that thou mayest hear the prayer of thy servant, which I pray before thee now, day and night, for the children of Israel thy servants, and confess the sins of the children of Israel, which we have sinned against thee: both I and my father\'s house have sinned.";
rsv[6] = "let thy ear be attentive, and thy eyes open, to hear the prayer of thy servant which I now pray before thee day and night for the people of Israel thy servants, confessing the sins of the people of Israel, which we have sinned against thee. Yea, I and my father\'s house have sinned.";
asv[6] = "Let thine ear now be attentive, and thine eyes open, that thou mayest hearken unto the prayer of thy servant, which I pray before thee at this time, day and night, for the children of Israel thy servants, while I confess the sins of the children of Israel, which we have sinned against thee. Yea, I and my father\'s house have sinned:";
yng[6] = "let Thine ear be, I pray Thee, attentive, and Thine eyes open, to hearken unto the prayer of Thy servant, that I am praying before Thee to-day, by day and by night, concerning the sons of Israel Thy servants, and confessing concerning the sins of the sons of Israel, that we have sinned against Thee; yea, I and the house of my father have sinned;";
dby[6] = "Let thine ear now be attentive, and thine eyes open, to hear the prayer of thy servant, which I pray before thee at this time, day and night, for the children of Israel thy servants, confessing the sins of the children of Israel, which we have sinned against thee: both I and my father\'s house have sinned.";
web[6] = "Let thy ear now be attentive, and thy eyes open, that thou mayest hear the prayer of thy servant, which I pray before thee now, day and night, for the children of Israel thy servants, and confess the sins of the children of Israel, which we have sinned against thee: both I and my father\'s house have sinned.";
hnv[6] = "Let your ear now be attentive, and your eyes open, that you may listen to the prayer of your servant, which I pray before you at this time, day and night, for the children of Yisra\'el your servants while I confess the sins of the children of Yisra\'el, which we have sinned against you. Yes, I and my father\'s house have sinned:";
vul[6] = "fiat auris tua auscultans et oculi tui aperti ut audias orationem servi tui quam ego oro coram te hodie nocte et die pro filiis Israhel servis tuis et confiteor pro peccatis filiorum Israhel quibus peccaverunt tibi et ego et domus patris mei peccavimus";

kjv[9] = "But [if] ye turn unto me, and keep my commandments, and do them; though there were of you cast out unto the uttermost part of the heaven, [yet] will I gather them from thence, and will bring them unto the place that I have chosen to set my name there.";

asv[11] = "O Lord, I beseech thee, let now thine ear be attentive to the prayer of thy servant, and to the prayer of thy servants, who delight to fear thy name; and prosper, I pray thee, thy servant this day, and grant him mercy in the sight of this man. Now I was cupbearer to the king.";
yng[11] = "`I beseech Thee, O Lord, let, I pray Thee, Thine ear be attentive unto the prayer of Thy servant, and unto the prayer of Thy servants, those delighting to fear Thy Name; and give prosperity, I pray Thee, to Thy servant to-day, and give him for mercies before this man;\' and I have been butler to the king.";

hnv[11] = " Lord, I beg you, let now your ear be attentive to the prayer of your servant, and to the prayer of your servants, who delight to fear your name; and please prosper your servant this day, and grant him mercy in the sight of this man. Now I was cup bearer to the king.";
vul[11] = "obsecro Domine sit auris tua adtendens ad orationem servi tui et ad orationem servorum tuorum qui volunt timere nomen tuum et dirige servum tuum hodie et da ei misericordiam ante virum hunc ego enim eram pincerna regis";
