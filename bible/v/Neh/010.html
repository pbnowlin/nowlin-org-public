csb[28] = "The rest of the people -- the priests, Levites, gatekeepers, singers, and temple servants, along with their wives, sons, and daughters, everyone who is able to understand and who has separated themselves from the surrounding peoples to obey the law of God --";
csb[29] = "join with their noble brothers and commit themselves with a sworn oath to follow the law of God given through God\'s servant Moses and to obey carefully all the commands, ordinances, and statutes of the LORD our Lord.";
csb[30] = "We will not give our daughters in marriage to the surrounding peoples and will not take their daughters as wives for our sons.";
csb[31] = "When the surrounding peoples bring merchandise or any kind of grain to sell on the Sabbath day, we will not buy from them on the Sabbath or a holy day. We will also leave the land uncultivated in the seventh year and will cancel every debt.";
csb[32] = "We will impose the following commands on ourselves: To give an eighth of an ounce of silver yearly for the service of the house of our God:";
csb[33] = "the bread displayed before the LORD, the daily grain offering, the regular burnt offering, the Sabbath and New Moon offerings, the appointed festivals, the holy things, the sin offerings to atone for Israel, and for all the work of the house of our God.";
csb[34] = "We have cast lots among the priests, Levites, and people for the donation of wood by our ancestral families at the appointed times each year. They are to bring the wood to our God\'s house to burn on the altar of the LORD our God, as it is written in the law.";
csb[35] = "We will bring the firstfruits of our land and of every fruit tree to the LORD\'s house year by year.";
csb[36] = "We will also bring the firstborn of our sons and our livestock, as prescribed by the law, and will bring the firstborn of our herds and flocks to the house of our God, to the priests who serve in our God\'s house.";
csb[37] = "We will bring a loaf from our first batch of dough to the priests at the storerooms of the house of our God. We will also bring the firstfruits of our grain offerings, of every fruit tree, and of the new wine and fresh oil. A tenth of our land\'s produce belongs to the Levites, for the Levites are to collect the one-tenth offering in all our agricultural towns.";
csb[38] = "A priest from Aaron\'s descendants is to accompany the Levites when they collect the tenth, and the Levites are to take a tenth of this offering to the storerooms of the treasury in the house of our God.";
csb[39] = "For the Israelites and the Levites are to bring the contributions of grain, new wine, and fresh oil to the storerooms where the articles of the sanctuary are kept and where the priests who minister are, along with the gatekeepers and singers. We will not neglect the house of our God.";

kjv[28] = "And the rest of the people, the priests, the Levites, the porters, the singers, the Nethinims, and all they that had separated themselves from the people of the lands unto the law of God, their wives, their sons, and their daughters, every one having knowledge, and having understanding;";
rsv[28] = "The rest of the people, the priests, the Levites, the gatekeepers, the singers, the temple servants, and all who have separated themselves from the peoples of the lands to the law of God, their wives, their sons, their daughters, all who have knowledge and understanding,";
asv[28] = "And the rest of the people, the priests, the Levites, the porters, the singers, the Nethinim, and all they that had separated themselves from the peoples of the lands unto the law of God, their wives, their sons, and their daughters, every one that had knowledge, and understanding;";
yng[28] = "And the rest of the people, the priests, the Levites, the gatekeepers, the singers, the Nethinim, and every one who hath been separated from the peoples of the lands unto the law of God, their wives, their sons, and their daughters, every knowing intelligent one,";
dby[28] = "And the rest of the people, the priests, the Levites, the doorkeepers, the singers, the Nethinim, and all they that had separated themselves from the peoples of the lands to the law of God, their wives, their sons and their daughters, every one having knowledge [and] having understanding,";
web[28] = "And the rest of the people, the priests, the Levites, the porters, the singers, the Nethinims, and all they that had separated themselves from the people of the lands to the law of God, their wives, their sons, and their daughters, every one having knowledge, and having understanding;";
hnv[28] = "The rest of the people, the Kohanim, the Levites, the porters, the singers, the temple servants, and all those who had separated themselves from the peoples of the lands to the law of God, their wives, their sons, and their daughters, everyone who had knowledge, and understanding;";
vul[28] = "et reliqui de populo sacerdotes Levitae ianitores et cantores Nathinnei et omnes qui se separaverunt de populis terrarum ad legem Dei uxores eorum filii eorum et filiae eorum";
kjv[29] = "They clave to their brethren, their nobles, and entered into a curse, and into an oath, to walk in God\'s law, which was given by Moses the servant of God, and to observe and do all the commandments of the LORD our Lord, and his judgments and his statutes;";
rsv[29] = "join with their brethren, their nobles, and enter into a curse and an oath to walk in God\'s law which was given by Moses the servant of God, and to observe and do all the commandments of the LORD our Lord and his ordinances and his statutes.";
asv[29] = "They clave to their brethren, their nobles, and entered into a curse, and into an oath, to walk in God\'s law, which was given by Moses the servant of God, and to observe and do all the commandments of Jehovah our Lord, and his ordinances and his statutes;";
yng[29] = "are laying hold on their brethren, their honourable ones, and coming in to an execration, and in to an oath, to walk in the law of God, that was given by the hand of Moses, servant of God, and to observe and to do all the commands of Jehovah our Lord, and His judgments, and His statutes;";
dby[29] = "joined with their brethren, their nobles, and entered into a curse and into an oath, to walk in the law of God, which had been given by Moses the servant of God, and to keep and do all the commandments of Jehovah our Lord, and his ordinances and his statutes;";
web[29] = "They united with their brethren, their nobles, and entered into a curse, and into an oath, to walk in God\'s law, which was given by Moses the servant of God, and to observe and do all the commandments of the LORD our Lord, and his judgments and his statutes;";
hnv[29] = "They joined with their brothers, their nobles, and entered into a curse, and into an oath, to walk in God\'s law, which was given by Moshe the servant of God, and to observe and do all the mitzvot of the LORD our Lord, and his ordinances and his statutes;";
vul[29] = "omnis qui poterat sapere spondentes pro fratribus suis optimates eorum et qui veniebant ad pollicendum et iurandum ut ambularent in lege Dei quam dederat in manu Mosi servi Dei ut facerent et custodirent universa mandata Domini Dei nostri et iudicia eius et caerimonias eius";

hnv[30] = "and that we would not give our daughters to the peoples of the land, nor take their daughters for our sons;";
vul[30] = "et ut non daremus filias nostras populo terrae et filias eorum non acciperemus filiis nostris";
kjv[31] = "And [if] the people of the land bring ware or any victuals on the sabbath day to sell, [that] we would not buy it of them on the sabbath, or on the holy day: and [that] we would leave the seventh year, and the exaction of every debt.";
rsv[31] = "and if the peoples of the land bring in wares or any grain on the sabbath day to sell, we will not buy from them on the sabbath or on a holy day; and we will forego the crops of the seventh year and the exaction of every debt.";
asv[31] = "and if the peoples of the land bring wares or any grain on the sabbath day to sell, that we would not buy of them on the sabbath, or on a holy day; and that we would forego the seventh year, and the exaction of every debt.";
yng[31] = "and the peoples of the land who are bringing in the wares and any corn on the sabbath-day to sell, we receive not of them on the sabbath, and on a holy day, and we leave the seventh year, and usury on every hand.";
dby[31] = "and that if the peoples of the land brought wares or any grain on the sabbath day to sell, we would not take it of them on the sabbath, or on [any] holy day; and that we would leave [the land uncultivated] the seventh year, and the exaction of every debt.";
web[31] = "And [if] the people of the land should bring wares or any provisions on the sabbath day to sell, [that] we would not buy it of them on the sabbath, or on the holy day: and [that] we would leave the seventh year, and the exaction of every debt.";
hnv[31] = "and if the peoples of the land bring wares or any grain on the day of Shabbat to sell, that we would not buy of them on the Shabbat, or on a holy day; and that we would forego the seventh year, and the exaction of every debt.";
vul[31] = "populi quoque terrae qui inportant venalia et omnia ad usum per diem sabbati ut vendant non accipiemus ab eis in sabbato et in die sanctificata et dimittemus annum septimum et exactionem universae manus";
kjv[32] = "Also we made ordinances for us, to charge ourselves yearly with the third part of a shekel for the service of the house of our God;";
rsv[32] = "We also lay upon ourselves the obligation to charge ourselves yearly with the third part of a shekel for the service of the house of our God:";
asv[32] = "Also we made ordinances for us, to charge ourselves yearly with the third part of a shekel for the service of the house of our God;";
yng[32] = "And we have appointed for ourselves commands, to put on ourselves the third of a shekel in a year, for the service of the house of our God,";
dby[32] = "And we made ordinances for us, to charge ourselves yearly with the third part of a shekel for the service of the house of our God,";
web[32] = "Also we made ordinances for us, to charge ourselves yearly with the third part of a shekel for the service of the house of our God;";
hnv[32] = "Also we made ordinances for us, to charge ourselves yearly with the third part of a shekel for the service of the house of our God;";
vul[32] = "et statuemus super nos praecepta ut demus tertiam partem sicli per annum ad opus domus Dei nostri";
kjv[33] = "For the shewbread, and for the continual meat offering, and for the continual burnt offering, of the sabbaths, of the new moons, for the set feasts, and for the holy [things], and for the sin offerings to make an atonement for Israel, and [for] all the work of the house of our God.";
rsv[33] = "for the showbread, the continual cereal offering, the continual burnt offering, the sabbaths, the new moons, the appointed feasts, the holy things, and the sin offerings to make atonement for Israel, and for all the work of the house of our God.";
asv[33] = "for the showbread, and for the continual meal-offering, and for the continual burnt-offering, for the sabbaths, for the new moons, for the set feasts, and for the holy things, and for the sin-offerings to make atonement for Israel, and for all the work of the house of our God.";
yng[33] = "for bread of the arrangement, and the continual present, and the continual burnt-offering of the sabbaths, of the new moons, for appointed seasons, and for holy things, and for sin-offerings, to make atonement for Israel, even all the work of the house of our God.";
dby[33] = "for the bread to be set in rows, and for the continual oblation, and for the continual burnt-offering, [for that] of the sabbaths [and] of the new moons, for the set feasts and for the holy [things], and for the sin-offerings to make an atonement for Israel, and [for] all the work of the house of our God.";
web[33] = "For the show-bread, and for the continual meat-offering, and for the continual burnt-offering, of the sabbaths, of the new moons, for the set feasts, and for the holy [things], and for the sin-offerings to make an atonement for Israel, and [for] all the work of the house of our God.";
hnv[33] = "for the show bread, and for the continual meal-offering, and for the continual burnt-offering, for the Shabbatot, for the new moons, for the set feasts, and for the holy things, and for the sin-offerings to make atonement for Yisra\'el, and for all the work of the house of our God.";
vul[33] = "ad panes propositionis et ad sacrificium sempiternum et in holocaustum sempiternum in sabbatis in kalendis in sollemnitatibus et in sanctificatis et pro peccato ut exoretur pro Israhel et in omnem usum domus Dei nostri";
kjv[34] = "And we cast the lots among the priests, the Levites, and the people, for the wood offering, to bring [it] into the house of our God, after the houses of our fathers, at times appointed year by year, to burn upon the altar of the LORD our God, as [it is] written in the law:";
rsv[34] = "We have likewise cast lots, the priests, the Levites, and the people, for the wood offering, to bring it into the house of our God, according to our fathers\' houses, at times appointed, year by year, to burn upon the altar of the LORD our God, as it is written in the law.";
asv[34] = "And we cast lots, the priests, the Levites, and the people, for the wood-offering, to bring it into the house of our God, according to our fathers\' houses, at times appointed, year by year, to burn upon the altar of Jehovah our God, as it is written in the law;";
yng[34] = "And the lots we have caused to fall for the offering of wood, [among] the priests, the Levites, and the people, to bring in to the house of our God, by the house of our fathers, at times appointed, year by year, to burn on the altar of Jehovah our God, as it is written in the law,";
dby[34] = "And we cast the lots among the priests, the Levites, and the people, for the wood-offering, to bring [it] into the house of our God, according to our fathers\' houses, at times appointed year by year, to burn upon the altar of Jehovah our God, as it is written in the law;";
web[34] = "And we cast the lots among the priests, the Levites, and the people, for the wood-offering, to bring [it] into the house of our God, after the houses of our fathers, at times appointed year by year, to burn upon the altar of the LORD our God, as [it is] written in the law:";
hnv[34] = "We cast lots, the Kohanim, the Levites, and the people, for the wood-offering, to bring it into the house of our God, according to our fathers\' houses, at times appointed, year by year, to burn on the altar of the LORD our God, as it is written in the law;";
vul[34] = "sortes ergo misimus super oblatione lignorum inter sacerdotes et Levitas et populos ut inferrentur in domum Dei nostri per domos patrum nostrorum per tempora a temporibus anni usque ad annum ut arderent super altare Domini Dei nostri sicut scriptum est in lege Mosi";
kjv[35] = "And to bring the firstfruits of our ground, and the firstfruits of all fruit of all trees, year by year, unto the house of the LORD:";
rsv[35] = "We obligate ourselves to bring the first fruits of our ground and the first fruits of all fruit of every tree, year by year, to the house of the LORD;";
asv[35] = "and to bring the first-fruits of our ground, and the first-fruits of all fruit of all manner of trees, year by year, unto the house of Jehovah;";
yng[35] = "and to bring in the first fruits of our ground, and the first fruits of all fruit of every tree, year by year, to the house of Jehovah,";
dby[35] = "and to bring the first-fruits of our land, and the first-fruits of all fruit of all trees, year by year to the house of Jehovah,";
web[35] = "And to bring the first-fruits of our ground, and the first-fruits of all fruit of all trees, year by year, to the house of the LORD:";
hnv[35] = "and to bring the first fruits of our ground, and the first fruits of all fruit of all manner of trees, year by year, to the house of the LORD;";
vul[35] = "et ut adferremus primogenita terrae nostrae et primitiva universi fructus omnis ligni ab anno in annum in domo Domini";
kjv[36] = "Also the firstborn of our sons, and of our cattle, as [it is] written in the law, and the firstlings of our herds and of our flocks, to bring to the house of our God, unto the priests that minister in the house of our God:";
rsv[36] = "also to bring to the house of our God, to the priests who minister in the house of our God, the first-born of our sons and of our cattle, as it is written in the law, and the firstlings of our herds and of our flocks;";
asv[36] = "also the first-born of our sons, and of our cattle, as it is written in the law, and the firstlings of our herds and of our flocks, to bring to the house of our God, unto the priests that minister in the house of our God;";
yng[36] = "and the firstlings of our sons, and of our cattle, as it is written in the law, and the firstlings of our herds and our flocks, to bring in to the house of our God, to the priests who are ministering in the house of our God.";
dby[36] = "and the firstborn of our sons and of our cattle, as it is written in the law; and to bring the firstlings of our herds and of our flocks to the house of our God, to the priests that minister in the house of our God;";
web[36] = "Also the first-born of our sons, and of our cattle, as [it is] written in the law, and the firstlings of our herds and of our flocks, to bring to the house of our God, to the priests that minister in the house of our God:";
hnv[36] = "also the firstborn of our sons, and of our cattle, as it is written in the law, and the firstborn of our herds and of our flocks, to bring to the house of our God, to the Kohanim who minister in the house of our God;";
vul[36] = "et primitiva filiorum nostrorum et pecorum nostrorum sicut scriptum est in lege et primitiva boum nostrorum et ovium nostrarum ut offerrentur in domo Dei nostri sacerdotibus qui ministrant in domo Dei nostri";
kjv[37] = "And [that] we should bring the firstfruits of our dough, and our offerings, and the fruit of all manner of trees, of wine and of oil, unto the priests, to the chambers of the house of our God; and the tithes of our ground unto the Levites, that the same Levites might have the tithes in all the cities of our tillage.";
rsv[37] = "and to bring the first of our coarse meal, and our contributions, the fruit of every tree, the wine and the oil, to the priests, to the chambers of the house of our God; and to bring to the Levites the tithes from our ground, for it is the Levites who collect the tithes in all our rural towns.";
asv[37] = "and that we should bring the first-fruits of our dough, and our heave-offerings, and the fruit of all manner of trees, the new wine and the oil, unto the priests, to the chambers of the house of our God; and the tithes of our ground unto the Levites; for they, the Levites, take the tithes in all the cities of our tillage.";
yng[37] = "And the beginning of our dough, and our heave-offerings, and the fruit of every tree, of new wine, and of oil, we bring in to the priests, unto the chambers of the house of our God, and the tithe of our ground to the Levites; and they -- the Levites -- have the tithes in all the cities of our tillage;";
dby[37] = "and that we should bring the first-fruits of our coarse meal and our heave-offerings, and the fruit of all manner of trees, new wine and oil, to the priests, into the chambers of the house of our God, and the tithes of our ground to the Levites, that they, the Levites, should take the tithes in all the cities of our tillage.";
web[37] = "And [that] we should bring the first-fruits of our dough, and our offerings, and the fruit of all manner of trees, of wine and of oil, to the priests, to the chambers of the house of our God; and the tithes of our ground to the Levites, that the same Levites might have the tithes in all the cities of our tillage.";
hnv[37] = "and that we should bring the first fruits of our dough, and our heave-offerings, and the fruit of all manner of trees, the new wine and the oil, to the Kohanim, to the chambers of the house of our God; and the tithes of our ground to the Levites; for they, the Levites, take the tithes in all the cities of our tillage.";
vul[37] = "et primitias ciborum nostrorum et libaminum nostrorum et poma omnis ligni vindemiae quoque et olei adferemus sacerdotibus ad gazofilacium Dei nostri et decimam partem terrae nostrae Levitis ipsi Levitae decimas accipient ex omnibus civitatibus operum nostrorum";
kjv[38] = "And the priest the son of Aaron shall be with the Levites, when the Levites take tithes: and the Levites shall bring up the tithe of the tithes unto the house of our God, to the chambers, into the treasure house.";
rsv[38] = "And the priest, the son of Aaron, shall be with the Levites when the Levites receive the tithes; and the Levites shall bring up the tithe of the tithes to the house of our God, to the chambers, to the storehouse.";
asv[38] = "And the priest the son of Aaron shall be with the Levites, when the Levites take tithes: and the Levites shall bring up the tithe of the tithes unto the house of our God, to the chambers, into the treasure-house.";
yng[38] = "and the priest, son of Aaron, hath been with the Levites in the tithing of the Levites, and the Levites bring up the tithe of the tithe to the house of our God unto the chambers, to the treasure-house;";
dby[38] = "And the priest the son of Aaron shall be with the Levites, when the Levites take tithes; and the Levites shall bring up the tithe of the tithes to the house of our God, into the chambers of the treasure-house.";
web[38] = "And the priest the son of Aaron shall be with the Levites, when the Levites take tithes: and the Levites shall bring up the tenth of the tithes to the house of our God, to the chambers, into the treasure house.";
hnv[38] = "The Kohen the son of Aharon shall be with the Levites, when the Levites take tithes: and the Levites shall bring up the tithe of the tithes to the house of our God, to the chambers, into the treasure-house.";
vul[38] = "erit autem sacerdos filius Aaron cum Levitis in decimis Levitarum et Levitae offerent decimam partem decimae suae in domum Dei nostri ad gazofilacium in domo thesauri";
kjv[39] = "For the children of Israel and the children of Levi shall bring the offering of the corn, of the new wine, and the oil, unto the chambers, where [are] the vessels of the sanctuary, and the priests that minister, and the porters, and the singers: and we will not forsake the house of our God.";
rsv[39] = "For the people of Israel and the sons of Levi shall bring the contribution of grain, wine, and oil to the chambers, where are the vessels of the sanctuary, and the priests that minister, and the gatekeepers and the singers. We will not neglect the house of our God.";
asv[39] = "For the children of Israel and the children of Levi shall bring the heave-offering of the grain, of the new wine, and of the oil, unto the chambers, where are the vessels of the sanctuary, and the priests that minister, and the porters, and the singers: and we will not forsake the house of our God.";
yng[39] = "for unto the chambers do they bring in -- the sons of Israel and the sons of Levi -- the heave-offering of the corn, the new wine, and the oil, and there [are] vessels of the sanctuary, and the priests, those ministering, and the gatekeepers, and the singers, and we do not forsake the house of our God.";
dby[39] = "For the children of Israel and the children of Levi shall bring the heave-offering of the corn, of the new wine and the oil, into the chambers, where are the vessels of the sanctuary, and the priests that minister, and the doorkeepers and the singers. And we will not forsake the house of our God.";
web[39] = "For the children of Israel and the children of Levi shall bring the offering of the corn, of the new wine, and the oil, to the chambers, where [are] the vessels of the sanctuary, and the priests that minister, and the porters, and the singers: and we will not forsake the house of our God.";
hnv[39] = "For the children of Yisra\'el and the children of Levi shall bring the heave-offering of the grain, of the new wine, and of the oil, to the chambers, where are the vessels of the sanctuary, and the Kohanim who minister, and the porters, and the singers: and we will not forsake the house of our God.";
vul[39] = "ad gazofilacium enim deportabunt filii Israhel et filii Levi primitias frumenti vini et olei et ibi erunt vasa sanctificata et sacerdotes et cantores et ianitores et ministri et non dimittemus domum Dei nostri";
