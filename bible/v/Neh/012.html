csb[1] = "These are the priests and Levites who went up with Zerubbabel son of Shealtiel and with Jeshua: Seraiah, Jeremiah, Ezra,";
csb[2] = "Amariah, Malluch, Hattush,";
csb[3] = "Shecaniah, Rehum, Meremoth,";
csb[4] = "Iddo, Ginnethoi, Abijah,";
csb[5] = "Mijamin, Maadiah, Bilgah,";
csb[6] = "Shemaiah, Joiarib, Jedaiah,";
csb[7] = "Sallu, Amok, Hilkiah, Jedaiah. These were the heads of the priests and their relatives in the days of Jeshua.";
csb[8] = "The Levites: Jeshua, Binnui, Kadmiel, Sherebiah, Judah, and Mattaniah -- he and his relatives were in charge of the songs of praise.";
csb[9] = "Bakbukiah, Unni, and their relatives stood opposite them in the services.";
csb[10] = "Jeshua fathered Joiakim, Joiakim fathered Eliashib, Eliashib fathered Joiada,";
csb[11] = "Joiada fathered Jonathan, and Jonathan fathered Jaddua.";
csb[12] = "In the days of Joiakim, the heads of the priestly families were Meraiah of Seraiah, Hananiah of Jeremiah,";
csb[13] = "Meshullam of Ezra, Jehohanan of Amariah,";
csb[14] = "Jonathan of Malluchi, Joseph of Shebaniah,";
csb[15] = "Adna of Harim, Helkai of Meraioth,";
csb[16] = "Zechariah of Iddo, Meshullam of Ginnethon,";
csb[17] = "Zichri of Abijah, Piltai of Moadiah, of Miniamin,";
csb[18] = "Shammua of Bilgah, Jehonathan of Shemaiah,";
csb[19] = "Mattenai of Joiarib, Uzzi of Jedaiah,";
csb[20] = "Kallai of Sallai, Eber of Amok,";
csb[21] = "Hashabiah of Hilkiah, and Nethanel of Jedaiah.";
csb[22] = "In the days of Eliashib, Joiada, Johanan, and Jaddua, the heads of the families of the Levites and priests were recorded while Darius the Persian ruled.";
csb[23] = "Levi\'s descendants, the family heads, were recorded in the Book of the Historical Events during the days of Johanan son of Eliashib.";
csb[24] = "The heads of the Levites -- Hashabiah, Sherebiah, and Jeshua son of Kadmiel, along with their relatives opposite them -- gave praise and thanks, division by division, as David the man of God had prescribed.";
csb[25] = "This included Mattaniah, Bakbukiah, and Obadiah. Meshullam, Talmon, and Akkub were gatekeepers who guarded the storerooms at the city gates.";
csb[26] = "These served in the days of Joiakim son of Jeshua, son of Jozadak, and in the days of Nehemiah the governor and Ezra the priest and scribe.";
csb[27] = "At the dedication of the wall of Jerusalem, they sent for the Levites wherever they lived and brought them to Jerusalem to celebrate the joyous dedication with thanksgiving and singing accompanied by cymbals, harps, and lyres.";
csb[28] = "The singers gathered from the region around Jerusalem, from the settlements of the Netophathites,";
csb[29] = "from Beth-gilgal, and from the fields of Geba and Azmaveth, for they had built settlements for themselves around Jerusalem.";
csb[30] = "After the priests and Levites had purified themselves, they purified the people, the city gates, and the wall.";
csb[31] = "Then I brought the leaders of Judah up on top of the wall, and I appointed two large processions that gave thanks. One went to the right on the wall, toward the Dung Gate.";
csb[32] = "Hoshaiah and half the leaders of Judah followed,";
csb[33] = "along with Azariah, Ezra, Meshullam,";
csb[34] = "Judah, Benjamin, Shemaiah, Jeremiah,";
csb[35] = "and some of the priests\' sons with trumpets, and Zechariah son of Jonathan, son of Shemaiah, son of Mattaniah, son of Micaiah, son of Zaccur, son of Asaph followed";
csb[36] = "as well as his relatives -- Shemaiah, Azarel, Milalai, Gilalai, Maai, Nethanel, Judah, and Hanani, with the musical instruments of David, the man of God. Ezra the scribe went in front of them.";
csb[37] = "At the Fountain Gate they climbed the steps of the city of David on the ascent of the wall and went above the house of David to the Water Gate on the east.";
csb[38] = "The second thanksgiving procession went to the left, and I followed it with half the people along the top of the wall, past the Tower of the Ovens to the Broad Wall,";
csb[39] = "above the Ephraim Gate, and by the Old Gate, the Fish Gate, the Tower of Hananel, and the Tower of the Hundred, to the Sheep Gate. They stopped at the Gate of the Guard.";
csb[40] = "The two thanksgiving processions stood in the house of God. So did I and half of the officials accompanying me,";
csb[41] = "as well as the priests: Eliakim, Maaseiah, Miniamin, Micaiah, Elioenai, Zechariah, and Hananiah, with trumpets;";
csb[42] = "and Maaseiah, Shemaiah, Eleazar, Uzzi, Jehohanan, Malchijah, Elam, and Ezer. Then the singers sang, with Jezrahiah as the leader.";
csb[43] = "On that day they offered great sacrifices and rejoiced because God had given them great joy. The women and children also celebrated, and Jerusalem\'s rejoicing was heard far away.";
csb[44] = "On that same day men were placed in charge of the rooms that housed the supplies, contributions, firstfruits, and tenths. The legally required portions for the priests and Levites were gathered from the village fields, because Judah was grateful to the priests and Levites who were serving.";
csb[45] = "They performed the service of their God and the service of purification, along with the singers and gatekeepers, as David and his son Solomon had prescribed.";
csb[46] = "For long ago, in the days of David and Asaph, there were heads of the singers and songs of praise and thanksgiving to God.";
csb[47] = "So in the days of Zerubbabel and Nehemiah, all Israel contributed the daily portions for the singers and gatekeepers. They also set aside daily portions for the Levites, and the Levites set aside daily portions for Aaron\'s descendants.";
kjv[1] = "Now these [are] the priests and the Levites that went up with Zerubbabel the son of Shealtiel, and Jeshua: Seraiah, Jeremiah, Ezra,";
kjv[2] = "Amariah, Malluch, Hattush,";
kjv[3] = "Shechaniah, Rehum, Meremoth,";
kjv[4] = "Iddo, Ginnetho, Abijah,";
kjv[5] = "Miamin, Maadiah, Bilgah,";
kjv[6] = "Shemaiah, and Joiarib, Jedaiah,";
kjv[7] = "Sallu, Amok, Hilkiah, Jedaiah. These [were] the chief of the priests and of their brethren in the days of Jeshua.";
kjv[8] = "Moreover the Levites: Jeshua, Binnui, Kadmiel, Sherebiah, Judah, [and] Mattaniah, [which was] over the thanksgiving, he and his brethren.";
kjv[9] = "Also Bakbukiah and Unni, their brethren, [were] over against them in the watches.";
kjv[10] = "And Jeshua begat Joiakim, Joiakim also begat Eliashib, and Eliashib begat Joiada,";
kjv[11] = "And Joiada begat Jonathan, and Jonathan begat Jaddua.";
kjv[12] = "And in the days of Joiakim were priests, the chief of the fathers: of Seraiah, Meraiah; of Jeremiah, Hananiah;";
kjv[13] = "Of Ezra, Meshullam; of Amariah, Jehohanan;";
kjv[14] = "Of Melicu, Jonathan; of Shebaniah, Joseph;";
kjv[15] = "Of Harim, Adna; of Meraioth, Helkai;";
kjv[16] = "Of Iddo, Zechariah; of Ginnethon, Meshullam;";
kjv[17] = "Of Abijah, Zichri; of Miniamin, of Moadiah, Piltai;";
kjv[18] = "Of Bilgah, Shammua; of Shemaiah, Jehonathan;";
kjv[19] = "And of Joiarib, Mattenai; of Jedaiah, Uzzi;";
kjv[20] = "Of Sallai, Kallai; of Amok, Eber;";
kjv[21] = "Of Hilkiah, Hashabiah; of Jedaiah, Nethaneel.";
kjv[22] = "The Levites in the days of Eliashib, Joiada, and Johanan, and Jaddua, [were] recorded chief of the fathers: also the priests, to the reign of Darius the Persian.";
kjv[23] = "The sons of Levi, the chief of the fathers, [were] written in the book of the chronicles, even until the days of Johanan the son of Eliashib.";
kjv[24] = "And the chief of the Levites: Hashabiah, Sherebiah, and Jeshua the son of Kadmiel, with their brethren over against them, to praise [and] to give thanks, according to the commandment of David the man of God, ward over against ward.";
kjv[25] = "Mattaniah, and Bakbukiah, Obadiah, Meshullam, Talmon, Akkub, [were] porters keeping the ward at the thresholds of the gates.";
kjv[26] = "These [were] in the days of Joiakim the son of Jeshua, the son of Jozadak, and in the days of Nehemiah the governor, and of Ezra the priest, the scribe.";
kjv[27] = "And at the dedication of the wall of Jerusalem they sought the Levites out of all their places, to bring them to Jerusalem, to keep the dedication with gladness, both with thanksgivings, and with singing, [with] cymbals, psalteries, and with harps.";
kjv[28] = "And the sons of the singers gathered themselves together, both out of the plain country round about Jerusalem, and from the villages of Netophathi;";
kjv[29] = "Also from the house of Gilgal, and out of the fields of Geba and Azmaveth: for the singers had builded them villages round about Jerusalem.";
kjv[30] = "And the priests and the Levites purified themselves, and purified the people, and the gates, and the wall.";
kjv[31] = "Then I brought up the princes of Judah upon the wall, and appointed two great [companies of them that gave] thanks, [whereof one] went on the right hand upon the wall toward the dung gate:";
kjv[32] = "And after them went Hoshaiah, and half of the princes of Judah,";
kjv[33] = "And Azariah, Ezra, and Meshullam,";
kjv[34] = "Judah, and Benjamin, and Shemaiah, and Jeremiah,";
kjv[35] = "And [certain] of the priests\' sons with trumpets; [namely], Zechariah the son of Jonathan, the son of Shemaiah, the son of Mattaniah, the son of Michaiah, the son of Zaccur, the son of Asaph:";
kjv[36] = "And his brethren, Shemaiah, and Azarael, Milalai, Gilalai, Maai, Nethaneel, and Judah, Hanani, with the musical instruments of David the man of God, and Ezra the scribe before them.";
kjv[37] = "And at the fountain gate, which was over against them, they went up by the stairs of the city of David, at the going up of the wall, above the house of David, even unto the water gate eastward.";
kjv[38] = "And the other [company of them that gave] thanks went over against [them], and I after them, and the half of the people upon the wall, from beyond the tower of the furnaces even unto the broad wall;";
kjv[39] = "And from above the gate of Ephraim, and above the old gate, and above the fish gate, and the tower of Hananeel, and the tower of Meah, even unto the sheep gate: and they stood still in the prison gate.";
kjv[40] = "So stood the two [companies of them that gave] thanks in the house of God, and I, and the half of the rulers with me:";
kjv[41] = "And the priests; Eliakim, Maaseiah, Miniamin, Michaiah, Elioenai, Zechariah, [and] Hananiah, with trumpets;";
kjv[42] = "And Maaseiah, and Shemaiah, and Eleazar, and Uzzi, and Jehohanan, and Malchijah, and Elam, and Ezer. And the singers sang loud, with Jezrahiah [their] overseer.";
kjv[43] = "Also that day they offered great sacrifices, and rejoiced: for God had made them rejoice with great joy: the wives also and the children rejoiced: so that the joy of Jerusalem was heard even afar off.";
kjv[44] = "And at that time were some appointed over the chambers for the treasures, for the offerings, for the firstfruits, and for the tithes, to gather into them out of the fields of the cities the portions of the law for the priests and Levites: for Judah rejoiced for the priests and for the Levites that waited.";
kjv[45] = "And both the singers and the porters kept the ward of their God, and the ward of the purification, according to the commandment of David, [and] of Solomon his son.";
kjv[46] = "For in the days of David and Asaph of old [there were] chief of the singers, and songs of praise and thanksgiving unto God.";
kjv[47] = "And all Israel in the days of Zerubbabel, and in the days of Nehemiah, gave the portions of the singers and the porters, every day his portion: and they sanctified [holy things] unto the Levites; and the Levites sanctified [them] unto the children of Aaron.";

dby[24] = "And the chief Levites: Hashabiah, Sherebiah, and Jeshua the son of Kadmiel, with their brethren over against them, to praise [and] to give thanks, according to the commandment of David the man of God, ward over against ward.";

yng[27] = "And at the dedication of the wall of Jerusalem they sought the Levites out of all their places, to bring them in to Jerusalem, to make the dedication even with gladness, and with thanksgivings, and with singing, [with] cymbals, psalteries, and with harps;";
dby[27] = "And at the dedication of the wall of Jerusalem they sought the Levites out of all their places, to bring them to Jerusalem, to hold the dedication with gladness, both with thanksgivings, and with singing, [with] cymbals, lutes and harps.";

vul[43] = "[Vulgate 12:42] et immolaverunt in die illa victimas magnas et laetati sunt Deus enim laetificaverat eos laetitia magna sed et uxores eorum et liberi gavisi sunt et audita est laetitia Hierusalem procul";
rsv[44] = "On that day men were appointed over the chambers for the stores, the contributions, the first fruits, and the tithes, to gather into them the portions required by the law for the priests and for the Levites according to the fields of the towns; for Judah rejoiced over the priests and the Levites who ministered.";
asv[44] = "And on that day were men appointed over the chambers for the treasures, for the heave-offerings, for the first-fruits, and for the tithes, to gather into them, according to the fields of the cities, the portions appointed by the law for the priests and Levites: for Judah rejoiced for the priests and for the Levites that waited.";
yng[44] = "And certain are appointed on that day over the chambers for treasures, for heave-offerings, for first-fruits, and for tithes, to gather into them out of the fields of the cities the portions of the law for priests, and for Levites, for the joy of Judah [is] over the priests, and over the Levites, who are standing up.";
dby[44] = "And at that time men were appointed over the chambers of the treasures for the heave-offerings, for the first-fruits, and for the tithes, to gather into them, out of the fields of the cities, the portions assigned by the law for the priests and the Levites; for Judah rejoiced over the priests, and over the Levites that waited.";
web[44] = "And at that time were some appointed over the chambers for the treasures, for the offerings, for the first-fruits, and for the tithes, to gather into them out of the fields of the cities the portions of the law for the priests and Levites: for Judah rejoiced for the priests and for the Levites that waited.";
hnv[44] = "On that day were men appointed over the chambers for the treasures, for the heave-offerings, for the first fruits, and for the tithes, to gather into them, according to the fields of the cities, the portions appointed by the law for the Kohanim and Levites: for Yehudah rejoiced for the Kohanim and for the Levites who waited.";
vul[44] = "[Vulgate 12:43] recensuerunt quoque in die illa viros super gazofilacia thesauri ad libamina et ad primitias et ad decimas ut introferrent per eos principes civitatis in decore gratiarum actionis sacerdotes et Levitas quia laetatus est Iuda in sacerdotibus et Levitis adstantibus";
rsv[45] = "And they performed the service of their God and the service of purification, as did the singers and the gatekeepers, according to the command of David and his son Solomon.";
asv[45] = "And they kept the charge of their God, and the charge of the purification, and [so did] the singers and the porters, according to the commandment of David, and of Solomon his son.";
yng[45] = "And the singers and the gatekeepers keep the charge of their God, even the charge of the cleansing -- according to the command of David [and] Solomon his son,";
dby[45] = "And, with the singers and the doorkeepers, they kept the ward of their God, and the ward of the purification, according to the commandment of David [and] of Solomon his son.";
web[45] = "And both the singers and the porters kept the ward of their God, and the ward of the purification, according to the commandment of David, [and] of Solomon his son.";
hnv[45] = "They kept the charge of their God, and the charge of the purification, and [so did] the singers and the porters, according to the mitzvah of David, and of Shlomo his son.";
vul[45] = "[Vulgate 12:44] et custodierunt observationem Dei sui et observationem expiationis et cantores et ianitores iuxta praeceptum David et Salomonis filii eius";
rsv[46] = "For in the days of David and Asaph of old there was a chief of the singers, and there were songs of praise and thanksgiving to God.";
asv[46] = "For in the days of David and Asaph of old there was a chief of the singers, and songs of praise and thanksgiving unto God.";
yng[46] = "for in the days of David and Asaph of old [were] heads of the singers, and a song of praise and thanksgiving to God.";
dby[46] = "For of old, in the days of David and Asaph, there were the chiefs of the singers, and songs of praise and thanksgivings to God.";
web[46] = "For in the days of David, and Asaph of old [there were] chief of the singers, and songs of praise and thanksgiving to God.";
hnv[46] = "For in the days of David and Asaf of old there was a chief of the singers, and songs of praise and thanksgiving to God.";
vul[46] = "[Vulgate 12:45] quia in diebus David et Asaph ab exordio erant principes constituti cantorum in carmine laudantium et confitentium Deo";
rsv[47] = "And all Israel in the days of Zerub\'babel and in the days of Nehemi\'ah gave the daily portions for the singers and the gatekeepers; and they set apart that which was for the Levites; and the Levites set apart that which was for the sons of Aaron.";
asv[47] = "And all Israel in the days of Zerubbabel, and in the days of Nehemiah, gave the portions of the singers and the porters, as every day required: and they set apart [that which was] for the Levites; and the Levites set apart [that which was] for the sons of Aaron.";
yng[47] = "And all Israel in the days of Zerubbabel, and in the days of Nehemiah, are giving the portions of the singers, and of the gatekeepers, the matter of a day in its day, and are sanctifying to the Levites, and the Levites are sanctifying to the sons of Aaron.";
dby[47] = "And all Israel, in the days of Zerubbabel and in the days of Nehemiah, gave the portions of the singers and the doorkeepers, every day what was needed, and they consecrated things for the Levites; and the Levites consecrated for the children of Aaron.";
web[47] = "And all Israel in the days of Zerubbabel, and in the days of Nehemiah, gave the portions of the singers and the porters, every day his portion: and they sanctified [holy things] to the Levites; and the Levites sanctified [them] to the children of Aaron.";
hnv[47] = "All Yisra\'el in the days of Zerubbavel, and in the days of Nechemyah, gave the portions of the singers and the porters, as every day required: and they set apart [that which was] for the Levites; and the Levites set apart [that which was] for the sons of Aharon.";
vul[47] = "[Vulgate 12:46] et omnis Israhel in diebus Zorobabel et in diebus Neemiae dabat partes cantoribus et ianitoribus per dies singulos et sanctificabant Levitas et Levitae sanctificabant filios Aaron";
