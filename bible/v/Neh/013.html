csb[1] = "At that time the book of Moses was read publicly to the people. The command was found written in it that no Ammonite or Moabite should ever enter the assembly of God,";
csb[2] = "because they did not meet the Israelites with food and water. Instead, they hired Balaam against them to curse them, but our God turned the curse into a blessing.";
csb[3] = "When they heard the law, they separated all those of mixed descent from Israel.";
csb[4] = "Now before this, the priest Eliashib had been put in charge of the storerooms of the house of our God. He was a relative of Tobiah";
csb[5] = "and had prepared a large room for him where they had previously stored the grain offerings, the frankincense, the articles, and the tenths of grain, new wine, and fresh oil prescribed for the Levites, singers, and gatekeepers, along with the contributions for the priests.";
csb[6] = "While all this was happening, I was not in Jerusalem, because I had returned to King Artaxerxes of Babylon in the thirty-second year of his reign. It was only later that I asked the king for a leave of absence";
csb[7] = "so I could return to Jerusalem. Then I discovered the evil that Eliashib had done on behalf of Tobiah by providing him a room in the courts of God\'s house.";
csb[8] = "I was greatly displeased and threw all of Tobiah\'s household possessions out of the room.";
csb[9] = "I ordered that the rooms be purified, and I had the articles of the house of God restored there, along with the grain offering and frankincense.";
csb[10] = "I also found out that because the portions for the Levites had not been given, each of the Levites and the singers performing the service had gone back to his own field.";
csb[11] = "Therefore, I rebuked the officials, asking, &quot;Why has the house of God been neglected? &quot; I gathered the Levites and singers together and stationed them at their posts.";
csb[12] = "Then all Judah brought a tenth of the grain, new wine, and fresh oil into the storehouses.";
csb[13] = "I appointed as treasurers over the storehouses the priest Shelemiah, the scribe Zadok, and Pedaiah of the Levites, with Hanan son of Zaccur, son of Mattaniah to assist them, because they were considered trustworthy. They were responsible for the distribution to their colleagues.";
csb[14] = "Remember me for this, my God, and don\'t erase the deeds of faithful love I have done for the house of my God and for its services.";
csb[15] = "At that time I saw people in Judah treading winepresses on the Sabbath. They were also bringing in stores of grain and loading them on donkeys, along with wine, grapes, and figs. All kinds of goods were being brought to Jerusalem on the Sabbath day. So I warned them against selling food on that day.";
csb[16] = "The Tyrians living there were importing fish and all kinds of merchandise and selling them on the Sabbath to the people of Judah in Jerusalem.";
csb[17] = "I rebuked the nobles of Judah and said to them: &quot;What is this evil you are doing -- profaning the Sabbath day?";
csb[18] = "&quot;Didn\'t your ancestors do the same, so that our God brought all this disaster on us and on this city? And now you are rekindling his anger against Israel by profaning the Sabbath! &quot;";
csb[19] = "When shadows began to fall on the city gates of Jerusalem just before the Sabbath, I gave orders that the city gates be closed and not opened until after the Sabbath. I posted some of my men at the gates, so that no goods could enter during the Sabbath day.";
csb[20] = "Once or twice the merchants and those who sell all kinds of goods camped outside Jerusalem,";
csb[21] = "but I warned them, &quot;Why are you camping in front of the wall? If you do it again, I\'ll use force against you.&quot; After that they did not come again on the Sabbath.";
csb[22] = "Then I instructed the Levites to purify themselves and guard the city gates in order to keep the Sabbath day holy. Remember me for this also, my God, and look on me with compassion according to the abundance of your faithful love.";
csb[23] = "In those days I also saw Jews who had married women from Ashdod, Ammon, and Moab.";
csb[24] = "Half of their children spoke the language of Ashdod or the language of one of the other peoples but could not speak Hebrew.";
csb[25] = "I rebuked them, cursed them, beat some of their men, and pulled out their hair. I forced them to take an oath before God and said, &quot;You must not give your daughters in marriage to their sons or take their daughters as wives for your sons or yourselves!";
csb[26] = "&quot;Didn\'t King Solomon of Israel sin in matters like this? There was not a king like him among many nations. He was loved by his God, and God made him king over all Israel, yet foreign women drew him into sin.";
csb[27] = "&quot;Why then should we hear about you doing all this terrible evil and acting unfaithfully against our God by marrying foreign women? &quot;";
csb[28] = "Even one of the sons of Jehoiada, son of the high priest Eliashib, had become a son-in-law to Sanballat the Horonite. So I drove him away from me.";
csb[29] = "Remember them, my God, for defiling the priesthood as well as the covenant of the priesthood and the Levites.";
csb[30] = "So I purified them from everything foreign and assigned specific duties to each of the priests and Levites.";
csb[31] = "I also arranged for the donation of wood at the appointed times and for the firstfruits. Remember me, my God, with favor.";
kjv[1] = "On that day they read in the book of Moses in the audience of the people; and therein was found written, that the Ammonite and the Moabite should not come into the congregation of God for ever;";
rsv[1] = "On that day they read from the book of Moses in the hearing of the people; and in it was found written that no Ammonite or Moabite should ever enter the assembly of God;";
asv[1] = "On that day they read in the book of Moses in the audience of the people; and therein was found written, that an Ammonite and a Moabite should not enter into the assembly of God for ever,";
yng[1] = "On that day there was read in the book of Moses, in the ears of the people, and it hath been found written in it that an Ammonite and Moabite doth not come into the assembly of God -- unto the age,";
dby[1] = "On that day they read in the book of Moses in the audience of the people; and there was found written in it that the Ammonite and the Moabite should not come into the congregation of God for ever;";
web[1] = "On that day they read in the book of Moses in the audience of the people; and therein was found written, that the Ammonite and the Moabite should not come into the congregation of God for ever:";
hnv[1] = "On that day they read in the book of Moshe in the audience of the people; and therein was found written, that an `Ammonite and a Mo\'avite should not enter into the assembly of God forever,";
vul[1] = "in die autem illo lectum est in volumine Mosi audiente populo et inventum est scriptum in eo quod non debeat introire Ammanites et Moabites in ecclesiam Dei usque in aeternum";
kjv[2] = "Because they met not the children of Israel with bread and with water, but hired Balaam against them, that he should curse them: howbeit our God turned the curse into a blessing.";
rsv[2] = "for they did not meet the children of Israel with bread and water, but hired Balaam against them to curse them--yet our God turned the curse into a blessing.";
asv[2] = "because they met not the children of Israel with bread and with water, but hired Balaam against them, to curse them: howbeit our God turned the curse into a blessing.";
yng[2] = "because they have not come before the sons of Israel with bread and with water, and hire against them Balaam to revile them, and our God turneth the reviling into a blessing.";
dby[2] = "because they had not met the children of Israel with bread and with water, and had hired Balaam against them, to curse them; but our God turned the curse into blessing.";
web[2] = "Because they met not the children of Israel with bread and with water, but hired Baalam against them, that he should curse them: but our God turned the curse into a blessing.";
hnv[2] = " because they didn\'t meet the children of Yisra\'el with bread and with water, but hired Bil`am against them, to curse them: however our God turned the curse into a blessing.";
vul[2] = "eo quod non occurrerint filiis Israhel cum pane et aqua et conduxerint adversum eum Balaam ad maledicendum ei et convertit Deus noster maledictionem in benedictionem";
kjv[3] = "Now it came to pass, when they had heard the law, that they separated from Israel all the mixed multitude.";
rsv[3] = "When the people heard the law, they separated from Israel all those of foreign descent.";
asv[3] = "And it came to pass, when they had heard the law, that they separated from Israel all the mixed multitude.";
yng[3] = "And it cometh to pass, at their hearing the law, that they separate all the mixed people from Israel.";
dby[3] = "And it came to pass, when they heard the law, that they separated from Israel all the mixed multitude.";
web[3] = "Now it came to pass, when they had heard the law, that they separated from Israel all the mixed multitude.";
hnv[3] = "It came to pass, when they had heard the law, that they separated from Yisra\'el all the mixed multitude.";
vul[3] = "factum est autem cum audissent legem separaverunt omnem alienigenam ab Israhel";
kjv[4] = "And before this, Eliashib the priest, having the oversight of the chamber of the house of our God, [was] allied unto Tobiah:";
rsv[4] = "Now before this, Eli\'ashib the priest, who was appointed over the chambers of the house of our God, and who was connected with Tobi\'ah,";
asv[4] = "Now before this, Eliashib the priest, who was appointed over the chambers of the house of our God, being allied unto Tobiah,";
yng[4] = "And before this Eliashib the priest, appointed over chambers of the house of our God, [is] a relation of Tobiah,";
dby[4] = "And before this, Eliashib the priest, who had the oversight of the chambers of the house of our God, a kinsman of Tobijah,";
web[4] = "And before this, Eliashib the priest, having the oversight of the chamber of the house of our God, [was] allied to Tobiah:";
hnv[4] = "Now before this, Elyashiv the Kohen, who was appointed over the chambers of the house of our God, being allied to Toviyah,";
vul[4] = "et super hoc erat Eliasib sacerdos qui fuerat positus in gazofilacio domus Dei nostri et proximus Tobiae";
kjv[5] = "And he had prepared for him a great chamber, where aforetime they laid the meat offerings, the frankincense, and the vessels, and the tithes of the corn, the new wine, and the oil, which was commanded [to be given] to the Levites, and the singers, and the porters; and the offerings of the priests.";
rsv[5] = "prepared for Tobi\'ah a large chamber where they had previously put the cereal offering, the frankincense, the vessels, and the tithes of grain, wine, and oil, which were given by commandment to the Levites, singers, and gatekeepers, and the contributions for the priests.";
asv[5] = "had prepared for him a great chamber, where aforetime they laid the meal-offerings, the frankincense, and the vessels, and the tithes of the grain, the new wine, and the oil, which were given by commandment to the Levites, and the singers, and the porters; and the heave-offerings for the priests.";
yng[5] = "and he maketh for him a great chamber, and there they were formerly putting the present, the frankincense, and the vessels, and the tithe of the corn, the new wine, and the oil -- the commanded thing of the Levites, and the singers, and the gatekeepers -- and the heave-offering of the priests.";
dby[5] = "had prepared for him a great chamber, where formerly they laid the oblations, the frankincense, and the vessels, and the tithes of the corn, the new wine and the oil, which was commanded for the Levites and the singers and the doorkeepers, and the heave-offerings of the priests.";
web[5] = "And he had prepared for him a great chamber, where formerly they laid the meat-offerings, the frankincense, and the vessels, and the tithes of the corn, the new wine, and the oil, which was commanded [to be given] to the Levites, and the singers, and the porters; and the offerings of the priests.";
hnv[5] = "had prepared for him a great chamber, where before they laid the meal-offerings, the frankincense, and the vessels, and the tithes of the grain, the new wine, and the oil, which were given by mitzvah to the Levites, and the singers, and the porters; and the heave-offerings for the Kohanim.";
vul[5] = "fecit ergo sibi gazofilacium grande et ibi erant ante eum reponentes munera et tus et vasa et decimam frumenti et vini et olei partes Levitarum et cantorum et ianitorum et primitias sacerdotales";
kjv[6] = "But in all this [time] was not I at Jerusalem: for in the two and thirtieth year of Artaxerxes king of Babylon came I unto the king, and after certain days obtained I leave of the king:";
rsv[6] = "While this was taking place I was not in Jerusalem, for in the thirty-second year of Ar-ta-xerx\'es king of Babylon I went to the king. And after some time I asked leave of the king";
asv[6] = "But in all this [time] I was not at Jerusalem; for in the two and thirtieth year of Artaxerxes king of Babylon I went unto the king: and after certain days asked I leave of the king,";
yng[6] = "And during all this I was not in Jerusalem, for in the thirty and second year of Artaxerxes king of Babylon did I come unto the king, and at the end of days I have asked of the king,";
dby[6] = "And during all that [time] I was not at Jerusalem; for in the two-and-thirtieth year of Artaxerxes king of Babylon I came to the king; and after some time I obtained leave of the king.";
web[6] = "But in all this [time] I was not at Jerusalem: for in the two and thirtieth year of Artaxerxes king of Babylon I came to the king, and after certain days I obtained leave of the king:";
hnv[6] = "But in all this [time] I was not at Yerushalayim; for in the two and thirtieth year of Artachshasta king of Bavel I went to the king: and after certain days asked I leave of the king,";
vul[6] = "in omnibus autem his non fui in Hierusalem quia in anno tricesimo secundo Artarxersis regis Babylonis veni ad regem et in fine dierum rogavi regem";
kjv[7] = "And I came to Jerusalem, and understood of the evil that Eliashib did for Tobiah, in preparing him a chamber in the courts of the house of God.";
rsv[7] = "and came to Jerusalem, and I then discovered the evil that Eli\'ashib had done for Tobi\'ah, preparing for him a chamber in the courts of the house of God.";
asv[7] = "and I came to Jerusalem, and understood the evil that Eliashib had done for Tobiah, in preparing him a chamber in the courts of the house of God.";
yng[7] = "and I come in to Jerusalem, and understand concerning the evil that Eliashib hath done for Tobiah, to make to him a chamber in the courts of the house of God,";
dby[7] = "And I came to Jerusalem, and observed the evil that Eliashib had done for Tobijah, in preparing him a chamber in the courts of the house of God.";
web[7] = "And I came to Jerusalem, and understood of the evil that Eliashib did for Tobiah, in preparing for him a chamber in the courts of the house of God.";
hnv[7] = "and I came to Yerushalayim, and understood the evil that Elyashiv had done for Toviyah, in preparing him a chamber in the courts of the house of God.";
vul[7] = "et veni in Hierusalem et intellexi malum quod fecerat Eliasib Tobiae ut faceret ei thesaurum in vestibulis domus Dei";
kjv[8] = "And it grieved me sore: therefore I cast forth all the household stuff of Tobiah out of the chamber.";
rsv[8] = "And I was very angry, and I threw all the household furniture of Tobi\'ah out of the chamber.";
asv[8] = "And it grieved me sore: therefore I cast forth all the household stuff of Tobiah out of the chamber.";
yng[8] = "and it is very displeasing to me, and I cast all the vessels of the house of Tobiah without, out of the chamber,";
dby[8] = "And it grieved me much, and I cast forth all the household stuff of Tobijah out of the chamber.";
web[8] = "And it grieved me greatly: therefore I cast forth all the household stuff of Tobiah out of the chamber.";
hnv[8] = "It grieved me sore: therefore I cast forth all the household stuff of Toviyah out of the chamber.";
vul[8] = "et malum mihi visum est valde et proieci vasa domus Tobiae foras de gazofilacio";
kjv[9] = "Then I commanded, and they cleansed the chambers: and thither brought I again the vessels of the house of God, with the meat offering and the frankincense.";
rsv[9] = "Then I gave orders and they cleansed the chambers; and I brought back thither the vessels of the house of God, with the cereal offering and the frankincense.";
asv[9] = "Then I commanded, and they cleansed the chambers: and thither brought I again the vessels of the house of God, with the meal-offerings and the frankincense.";
yng[9] = "and I speak, and they cleanse the chambers, and I bring back thither the vessels of the house of God with the present and the frankincense.";
dby[9] = "And I commanded, and they purified the chambers; and thither brought I again the vessels of the house of God, the oblation and the frankincense.";
web[9] = "Then I commanded, and they cleansed the chambers: and thither I brought again the vessels of the house of God, with the meat-offering and the frankincense.";
hnv[9] = " Then I commanded, and they cleansed the chambers: and there brought I again the vessels of the house of God, with the meal-offerings and the frankincense.";
vul[9] = "praecepique et mundaverunt gazofilacia et rettuli ibi vasa domus Dei sacrificium et tus";
kjv[10] = "And I perceived that the portions of the Levites had not been given [them]: for the Levites and the singers, that did the work, were fled every one to his field.";
rsv[10] = "I also found out that the portions of the Levites had not been given to them; so that the Levites and the singers, who did the work, had fled each to his field.";
asv[10] = "And I perceived that the portions of the Levites had not been given them; so that the Levites and the singers, that did the work, were fled every one to his field.";
yng[10] = "And I know that the portions of the Levites have not been given, and they flee each to his field -- the Levites and the singers, doing the work.";
dby[10] = "And I perceived that the portions of the Levites had not been given, and that the Levites and the singers that did the work had fled every one to his field.";
web[10] = "And I perceived that the portions of the Levites had not been given [them]: for the Levites and the singers, that did the work, had fled every one to his field.";
hnv[10] = "I perceived that the portions of the Levites had not been given them; so that the Levites and the singers, who did the work, were fled everyone to his field.";
vul[10] = "et cognovi quoniam partes Levitarum non fuissent datae et fugisset unusquisque in regionem suam de Levitis et de cantoribus et de his qui ministrabant";
kjv[11] = "Then contended I with the rulers, and said, Why is the house of God forsaken? And I gathered them together, and set them in their place.";
rsv[11] = "So I remonstrated with the officials and said, &quot;Why is the house of God forsaken?&quot; And I gathered them together and set them in their stations.";
asv[11] = "Then contended I with the rulers, and said, Why is the house of God forsaken? And I gathered them together, and set them in their place.";
yng[11] = "And I strive with the prefects, and say, `Wherefore hath the house of God been forsaken?\' and I gather them, and set them on their station;";
dby[11] = "Then I contended with the rulers, and said, Why is the house of God forsaken? And I gathered them together and set them in their place.";
web[11] = "Then I contended with the rulers, and said, Why is the house of God forsaken? and I assembled them, and set them in their place.";
hnv[11] = "Then contended I with the rulers, and said, Why is the house of God forsaken? I gathered them together, and set them in their place.";
vul[11] = "et egi causam adversus magistratus et dixi quare dereliquimus domum Dei et congregavi eos et feci stare in stationibus suis";
kjv[12] = "Then brought all Judah the tithe of the corn and the new wine and the oil unto the treasuries.";
rsv[12] = "Then all Judah brought the tithe of the grain, wine, and oil into the storehouses.";
asv[12] = "Then brought all Judah the tithe of the grain and the new wine and the oil unto the treasuries.";
yng[12] = "and all Judah have brought in the tithe of the corn, and of the new wine, and of the oil, to the treasuries.";
dby[12] = "And all Judah brought the tithe of the corn and the new wine and the oil into the storehouses.";
web[12] = "Then all Judah brought the tithe of the corn and the new wine and the oil to the treasuries.";
hnv[12] = "Then brought all Yehudah the tithe of the grain and the new wine and the oil to the treasuries.";
vul[12] = "et omnis Iuda adportabat decimam frumenti et vini et olei in horrea";
kjv[13] = "And I made treasurers over the treasuries, Shelemiah the priest, and Zadok the scribe, and of the Levites, Pedaiah: and next to them [was] Hanan the son of Zaccur, the son of Mattaniah: for they were counted faithful, and their office [was] to distribute unto their brethren.";
rsv[13] = "And I appointed as treasurers over the storehouses Shelemi\'ah the priest, Zadok the scribe, and Pedai\'ah of the Levites, and as their assistant Hanan the son of Zaccur, son of Mattani\'ah, for they were counted faithful; and their duty was to distribute to their brethren.";
asv[13] = "And I made treasurers over the treasuries, Shelemiah the priest, and Zadok the scribe, and of the Levites, Pedaiah: and next to them was Hanan the son of Zaccur, the son of Mattaniah; for they were counted faithful, and their business was to distribute unto their brethren.";
yng[13] = "And I appoint treasurers over the treasuries, Shelemiah the priest, and Zadok the scribe, and Pedaiah of the Levites; and by their hand [is] Hanan son of Zaccur, son of Mattaniah, for stedfast they have been reckoned, and on them [it is] to give a portion to their brethren.";
dby[13] = "And I made storekeepers over the storehouses: Shelemiah the priest, and Zadok the scribe, and of the Levites, Pedaiah; and subordinate to them, Hanan the son of Zaccur, the son of Mattaniah; for they were esteemed faithful, and their office was to distribute to their brethren.";
web[13] = "And I made treasurers over the treasuries, Shelemiah the priest, and Zadok the scribe, and of the Levites, Pedaiah: and next to them [was] Hanan the son of Zaccur, the son of Mattaniah: for they were accounted faithful; and their office [was] to distribute to their brethren.";
hnv[13] = "I made treasurers over the treasuries, Shelemyahu the Kohen, and Tzadok the Sofer, and of the Levites, Pedayahu: and next to them was Hanan the son of Zakkur, the son of Mattanyah; for they were counted faithful, and their business was to distribute to their brothers.";
vul[13] = "et constituimus super horrea Selemiam sacerdotem et Sadoc scribam et Phadaiam de Levitis et iuxta eos Anan filium Zacchur filium Matthaniae quoniam fideles conprobati sunt et ipsis creditae sunt partes fratrum suorum";
kjv[14] = "Remember me, O my God, concerning this, and wipe not out my good deeds that I have done for the house of my God, and for the offices thereof.";
rsv[14] = "Remember me, O my God, concerning this, and wipe not out my good deeds that I have done for the house of my God and for his service.";
asv[14] = "Remember me, O my God, concerning this, and wipe not out my good deeds that I have done for the house of my God, and for the observances thereof.";
yng[14] = "Be mindful of me, O my God, for this, and do not blot out my kind acts that I have done, for the house of my God, and for its charges.";
dby[14] = "Remember me, O my God, concerning this, and wipe not out my good deeds which I have done for the house of my God, and for the charges thereof!";
web[14] = "Remember me, O my God, concerning this, and wipe not out my good deeds that I have done for the house of my God, and for its offices.";
hnv[14] = "Remember me, my God, concerning this, and don\'t wipe out my good deeds that I have done for the house of my God, and for the observances of it.";
vul[14] = "memento mei Deus meus pro hoc et ne deleas miserationes meas quas feci in domo Dei mei et in caerimoniis eius";
kjv[15] = "In those days saw I in Judah [some] treading wine presses on the sabbath, and bringing in sheaves, and lading asses; as also wine, grapes, and figs, and all [manner of] burdens, which they brought into Jerusalem on the sabbath day: and I testified [against them] in the day wherein they sold victuals.";
rsv[15] = "In those days I saw in Judah men treading wine presses on the sabbath, and bringing in heaps of grain and loading them on asses; and also wine, grapes, figs, and all kinds of burdens, which they brought into Jerusalem on the sabbath day; and I warned them on the day when they sold food.";
asv[15] = "In those days saw I in Judah some men treading wine-presses on the sabbath, and bringing in sheaves, and lading asses [therewith]; as also wine, grapes, and figs, and all manner of burdens, which they brought into Jerusalem on the sabbath day: and I testified [against them] in the day wherein they sold victuals.";
yng[15] = "In those days I have seen in Judah those treading wine-vats on sabbath, and bringing in the sheaves, and lading on the asses, and also, wine, grapes, and figs, and every burden, yea, they are bringing in to Jerusalem on the sabbath-day, and I testify in the day of their selling provision.";
dby[15] = "In those days I saw in Judah some treading winepresses on the sabbath, and bringing in sheaves, and lading them on asses; as also wine, grapes and figs, and all manner of burdens; and they brought them into Jerusalem on the sabbath day; and I protested in the day on which they sold the victuals.";
web[15] = "In those days I saw in Judah [some] treading wine presses on the sabbath, and bringing in sheaves, and lading asses; as also wine, grapes, and figs, and all [manner of] burdens, which they brought into Jerusalem on the sabbath day: and I testified [against them] in the day in which they sold provisions.";
hnv[15] = "In those days saw I in Yehudah some men treading wine-presses on the Shabbat, and bringing in sheaves, and lading donkeys [therewith]; as also wine, grapes, and figs, and all manner of burdens, which they brought into Yerushalayim on the day of Shabbat: and I testified [against them] in the day in which they sold victuals.";
vul[15] = "in diebus illis vidi in Iuda calcabant torcularia in sabbato portantes acervos et onerantes super asinos vinum et uvas et ficus et omne onus et inferentes Hierusalem in die sabbati et contestatus sum ut in die qua vendere liceret venderent";
kjv[16] = "There dwelt men of Tyre also therein, which brought fish, and all manner of ware, and sold on the sabbath unto the children of Judah, and in Jerusalem.";
rsv[16] = "Men of Tyre also, who lived in the city, brought in fish and all kinds of wares and sold them on the sabbath to the people of Judah, and in Jerusalem.";
asv[16] = "There dwelt men of Tyre also therein, who brought in fish, and all manner of wares, and sold on the sabbath unto the children of Judah, and in Jerusalem.";
yng[16] = "And the Tyrians have dwelt in it, bringing in fish, and every ware, and selling on sabbath to the sons of Judah and in Jerusalem.";
dby[16] = "Men of Tyre also dwelt therein, who brought fish and all manner of ware, and sold it on the sabbath to the children of Judah, and in Jerusalem.";
web[16] = "There dwelt men of Tyre also therein, who brought fish, and all manner of wares, and sold on the sabbath to the children of Judah, and in Jerusalem.";
hnv[16] = "There lived men of Tzor also therein, who brought in fish, and all manner of wares, and sold on the Shabbat to the children of Yehudah, and in Yerushalayim.";
vul[16] = "et Tyrii habitaverunt in ea inferentes pisces et omnia venalia et vendebant in sabbatis filiis Iuda et in Hierusalem";
kjv[17] = "Then I contended with the nobles of Judah, and said unto them, What evil thing [is] this that ye do, and profane the sabbath day?";
rsv[17] = "Then I remonstrated with the nobles of Judah and said to them, &quot;What is this evil thing which you are doing, profaning the sabbath day?";
asv[17] = "Then I contended with the nobles of Judah, and said unto them, What evil thing is this that ye do, and profane the sabbath day?";
yng[17] = "And I strive with the freemen of Judah, and say to them, `What [is] this evil thing that ye are doing, and polluting the sabbath-day?";
dby[17] = "And I contended with the nobles of Judah, and said to them, What evil thing is this which ye do, profaning the sabbath day?";
web[17] = "Then I contended with the nobles of Judah, and said to them, What evil thing [is] this that ye do, and profane the sabbath day?";
hnv[17] = "Then I contended with the nobles of Yehudah, and said to them, What evil thing is this that you do, and profane the day of Shabbat?";
vul[17] = "et obiurgavi optimates Iuda et dixi eis quae est res haec mala quam vos facitis et profanatis diem sabbati";
kjv[18] = "Did not your fathers thus, and did not our God bring all this evil upon us, and upon this city? yet ye bring more wrath upon Israel by profaning the sabbath.";
rsv[18] = "Did not your fathers act in this way, and did not our God bring all this evil on us and on this city? Yet you bring more wrath upon Israel by profaning the sabbath.&quot;";
asv[18] = "Did not your fathers thus, and did not our God bring all this evil upon us, and upon this city? yet ye bring more wrath upon Israel by profaning the sabbath.";
yng[18] = "Thus did not your fathers do? and our God bringeth in on us all this evil, and on this city, and ye are adding fierceness on Israel, to pollute the sabbath.\'";
dby[18] = "Did not your fathers thus, and did not our God bring all this evil upon us and upon this city? And ye will bring more wrath against Israel by profaning the sabbath.";
web[18] = "Did not your fathers thus, and did not our God bring all this evil upon us, and upon this city? yet ye bring more wrath upon Israel by profaning the sabbath.";
hnv[18] = "Didn\'t your fathers do thus, and did not our God bring all this evil on us, and on this city? yet you bring more wrath on Yisra\'el by profaning the Shabbat.";
vul[18] = "numquid non haec fecerunt patres nostri et adduxit Deus noster super nos omne malum hoc et super civitatem hanc et vos additis iracundiam super Israhel violando sabbatum";
kjv[19] = "And it came to pass, that when the gates of Jerusalem began to be dark before the sabbath, I commanded that the gates should be shut, and charged that they should not be opened till after the sabbath: and [some] of my servants set I at the gates, [that] there should no burden be brought in on the sabbath day.";
rsv[19] = "When it began to be dark at the gates of Jerusalem before the sabbath, I commanded that the doors should be shut and gave orders that they should not be opened until after the sabbath. And I set some of my servants over the gates, that no burden might be brought in on the sabbath day.";
asv[19] = "And it came to pass that, when the gates of Jerusalem began to be dark before the sabbath, I commanded that the doors should be shut, and commanded that they should not be opened till after the sabbath: and some of my servants set I over the gates, that there should no burden be brought in on the sabbath day.";
yng[19] = "And it cometh to pass, when the gates of Jerusalem have been dark before the sabbath, that I speak, and the doors are shut, and I say, that they do not open them till after the sabbath; and of my servants I have stationed at the gates; there doth not come in a burden on the sabbath-day.";
dby[19] = "And it came to pass, that when it began to be dark in the gates of Jerusalem before the sabbath, I commanded that the gates should be shut; and I commanded that they should not be opened till after the sabbath. And I set [some] of my servants at the gates, so that no burden should be brought in on the sabbath day.";
web[19] = "And it came to pass, that, when the gates of Jerusalem began to be dark before the sabbath, I commanded that the gates should be shut, and charged that they should not be opened till after the sabbath: and I set [some] of my servants at the gates, [that] there should no burden be brought in on the sabbath day.";
hnv[19] = " It came to pass that, when the gates of Yerushalayim began to be dark before the Shabbat, I commanded that the doors should be shut, and commanded that they should not be opened until after the Shabbat: and some of my servants set I over the gates, that there should no burden be brought in on the day of Shabbat.";
vul[19] = "factum est itaque cum quievissent portae Hierusalem die sabbati dixi et cluserunt ianuas et praecepi ut non aperirent eas usque post sabbatum et de pueris meis constitui super portas ut nullus inferret onus in die sabbati";
kjv[20] = "So the merchants and sellers of all kind of ware lodged without Jerusalem once or twice.";
rsv[20] = "Then the merchants and sellers of all kinds of wares lodged outside Jerusalem once or twice.";
asv[20] = "So the merchants and sellers of all kind of wares lodged without Jerusalem once or twice.";
yng[20] = "And they lodge -- the merchants and sellers of all ware -- at the outside of Jerusalem, once or twice,";
dby[20] = "And the dealers and sellers of all kind of ware passed the night without Jerusalem once or twice.";
web[20] = "So the merchants and sellers of all kind of wares lodged without Jerusalem once or twice.";
hnv[20] = "So the merchants and sellers of all kind of wares lodged outside of Yerushalayim once or twice.";
vul[20] = "et manserunt negotiatores et vendentes universa venalia foris Hierusalem semel et bis";
kjv[21] = "Then I testified against them, and said unto them, Why lodge ye about the wall? if ye do [so] again, I will lay hands on you. From that time forth came they no [more] on the sabbath.";
rsv[21] = "But I warned them and said to them, &quot;Why do you lodge before the wall? If you do so again I will lay hands on you.&quot; From that time on they did not come on the sabbath.";
asv[21] = "Then I testified against them, and said unto them, Why lodge ye about the wall? if ye do so again, I will lay hands on you. From that time forth came they no more on the sabbath.";
yng[21] = "and I testify against them, and say unto them, `Wherefore are ye lodging over-against the wall? if ye repeat [it], a hand I put forth upon you;\' from that time they have not come in on the sabbath.";
dby[21] = "And I testified against them, and said to them, Why do ye pass the night before the wall? if ye do so again, I will lay hands on you. From that time forth they came not on the sabbath.";
web[21] = "Then I testified against them, and said to them, Why lodge ye about the wall? if ye do [so] again, I will lay hands on you. From that time forth they came no [more] on the sabbath.";
hnv[21] = "Then I testified against them, and said to them, Why lodge you about the wall? if you do so again, I will lay hands on you. From that time forth came they no more on the Shabbat.";
vul[21] = "et contestatus sum eos et dixi eis quare manetis ex adverso muri si secundo hoc feceritis manum mittam in vos itaque ex tempore illo non venerunt in sabbato";
kjv[22] = "And I commanded the Levites that they should cleanse themselves, and [that] they should come [and] keep the gates, to sanctify the sabbath day. Remember me, O my God, [concerning] this also, and spare me according to the greatness of thy mercy.";
rsv[22] = "And I commanded the Levites that they should purify themselves and come and guard the gates, to keep the sabbath day holy. Remember this also in my favor, O my God, and spare me according to the greatness of thy steadfast love.";
asv[22] = "And I commanded the Levites that they should purify themselves, and that they should come and keep the gates, to sanctify the sabbath day. Remember unto me, O my God, this also, and spare me according to the greatness of thy lovingkindness.";
yng[22] = "And I say to the Levites, that they be cleansed, and, coming in, keeping the gates, to sanctify the sabbath-day. Also, this, remember for me, O my God, and have pity on me, according to the abundance of Thy kindness.";
dby[22] = "And I commanded the Levites that they should purify themselves, and that they should come and keep the gates, to hallow the sabbath day. Remember this also for me, my God, and spare me according to thy great loving-kindness!";
web[22] = "And I commanded the Levites, that they should cleanse themselves, and [that] they should come [and] keep the gates, to sanctify the sabbath day. Remember me, O my God, [concerning] this also, and spare me according to the greatness of thy mercy.";
hnv[22] = "I commanded the Levites that they should purify themselves, and that they should come and keep the gates, to sanctify the day of Shabbat. Remember to me, my God, this also, and spare me according to the greatness of your lovingkindness.";
vul[22] = "dixi quoque Levitis ut mundarentur et venirent ad custodiendas portas et sanctificandum diem sabbati et pro hoc ergo memento mei Deus meus et parce mihi secundum multitudinem miserationum tuarum";
kjv[23] = "In those days also saw I Jews [that] had married wives of Ashdod, of Ammon, [and] of Moab:";
rsv[23] = "In those days also I saw the Jews who had married women of Ashdod, Ammon, and Moab;";
asv[23] = "In those days also saw I the Jews that had married women of Ashdod, of Ammon, [and] of Moab:";
yng[23] = "Also, in those days, I have seen the Jews [who] have settled women of Ashdod, of Ammon, of Moab.";
dby[23] = "In those days also I saw Jews that had married wives of Ashdod, of Ammon, [and] of Moab.";
web[23] = "In those days also I saw Jews [that] had married wives of Ashdod, of Ammon, [and] of Moab:";
hnv[23] = "In those days also saw I the Yehudim who had married women of Ashdod, of `Ammon, [and] of Mo\'av:";
vul[23] = "sed et in diebus illis vidi Iudaeos ducentes uxores azotias ammanitidas et moabitidas";
kjv[24] = "And their children spake half in the speech of Ashdod, and could not speak in the Jews\' language, but according to the language of each people.";
rsv[24] = "and half of their children spoke the language of Ashdod, and they could not speak the language of Judah, but the language of each people.";
asv[24] = "and their children spake half in the speech of Ashdod, and could not speak in the Jews\' language, but according to the language of each people.";
yng[24] = "And of their sons, half are speaking Ashdoditish -- and are not knowing to speak Jewish -- and according to the language of people and people.";
dby[24] = "And their children spoke half in the language of Ashdod, and could not speak in the Jews\' language, but according to the language of each people.";
web[24] = "And their children spoke half in the speech of Ashdod, and could not speak in the Jews language, but according to the language of each people.";
hnv[24] = "and their children spoke half in the speech of Ashdod, and could not speak in the Yehudim\' language, but according to the language of each people.";
vul[24] = "et filii eorum ex media parte loquebantur azotice et nesciebant loqui iudaice et loquebantur iuxta linguam populi et populi";
kjv[25] = "And I contended with them, and cursed them, and smote certain of them, and plucked off their hair, and made them swear by God, [saying], Ye shall not give your daughters unto their sons, nor take their daughters unto your sons, or for yourselves.";
rsv[25] = "And I contended with them and cursed them and beat some of them and pulled out their hair; and I made them take oath in the name of God, saying, &quot;You shall not give your daughters to their sons, or take their daughters for your sons or for yourselves.";
asv[25] = "And I contended with them, and cursed them, and smote certain of them, and plucked off their hair, and made them swear by God, [saying], Ye shall not give your daughters unto their sons, nor take their daughters for your sons, or for yourselves.";
yng[25] = "And I strive with them, and declare them vile, and smite certain of them, and pluck off their hair, and cause them to swear by God, `Ye do not give your daughters to their sons, nor do ye take of their daughters to your sons, and to yourselves.";
dby[25] = "And I contended with them, and cursed them, and smote certain of them and plucked off their hair, and adjured them by God [saying], Ye shall not give your daughters to their sons, nor take their daughters for your sons or for yourselves.";
web[25] = "And I contended with them, and cursed them, and smote certain of them, and plucked off their hair, and made them swear by God, [saying], Ye shall not give your daughters to their sons, nor take their daughters to your sons, or for yourselves.";
hnv[25] = "I contended with them, and cursed them, and struck certain of them, and plucked off their hair, and made them swear by God, [saying], You shall not give your daughters to their sons, nor take their daughters for your sons, or for yourselves.";
vul[25] = "et obiurgavi eos et maledixi et cecidi ex ipsis viros et decalvavi eos et adiuravi in Deo ut non darent filias suas filiis eorum et non acciperent de filiabus eorum filiis suis et sibimet ipsis dicens";
kjv[26] = "Did not Solomon king of Israel sin by these things? yet among many nations was there no king like him, who was beloved of his God, and God made him king over all Israel: nevertheless even him did outlandish women cause to sin.";
rsv[26] = "Did not Solomon king of Israel sin on account of such women? Among the many nations there was no king like him, and he was beloved by his God, and God made him king over all Israel; nevertheless foreign women made even him to sin.";
asv[26] = "Did not Solomon king of Israel sin by these things? yet among many nations was there no king like him, and he was beloved of his God, and God made him king over all Israel: nevertheless even him did foreign women cause to sin.";
yng[26] = "`By these did not Solomon king of Israel sin? and among the many nations there was no king like him, and beloved by his God he was, and God maketh him king over all Israel -- even him did the strange women cause to sin.";
dby[26] = "Did not Solomon king of Israel sin by these things? Yet among the many nations was there no king like him, who was beloved of his God, and God made him king over all Israel; but even him did foreign wives cause to sin.";
web[26] = "Did not Solomon king of Israel sin by these things? yet among many nations was there no king like him, who was beloved by his God, and God made him king over all Israel: nevertheless even him did outlandish women cause to sin.";
hnv[26] = "Did not Shlomo king of Yisra\'el sin by these things? yet among many nations was there no king like him, and he was beloved of his God, and God made him king over all Yisra\'el: nevertheless even him did foreign women cause to sin.";
vul[26] = "numquid non in huiuscemodi re peccavit Salomon rex Israhel et certe in gentibus multis non erat rex similis ei et dilectus Deo suo erat et posuit eum Deus regem super omnem Israhel et ipsum ergo ad peccatum duxerunt mulieres alienigenae";
kjv[27] = "Shall we then hearken unto you to do all this great evil, to transgress against our God in marrying strange wives?";
rsv[27] = "Shall we then listen to you and do all this great evil and act treacherously against our God by marrying foreign women?&quot;";
asv[27] = "Shall we then hearken unto you to do all this great evil, to trespass against our God in marrying foreign women?";
yng[27] = "And to you do we hearken to do all this great evil, to trespass against our God, to settle strange women?\'";
dby[27] = "And should we hearken to you to do all this great evil, to act unfaithfully to our God by marrying foreign wives?";
web[27] = "Shall we then hearken to you to do all this great evil, to transgress against our God in marrying foreign wives?";
hnv[27] = "Shall we then listen to you to do all this great evil, to trespass against our God in marrying foreign women?";
vul[27] = "numquid et nos inoboedientes faciemus omne malum grande hoc ut praevaricemur in Deo nostro et ducamus uxores peregrinas";
kjv[28] = "And [one] of the sons of Joiada, the son of Eliashib the high priest, [was] son in law to Sanballat the Horonite: therefore I chased him from me.";
rsv[28] = "And one of the sons of Jehoi\'ada, the son of Eli\'ashib the high priest, was the son-in-law of Sanbal\'lat the Hor\'onite; therefore I chased him from me.";
asv[28] = "And one of the sons of Joiada, the son of Eliashib the high priest, was son-in-law to Sanballat the Horonite: therefore I chased him from me.";
yng[28] = "And [one] of the sons of Joiada son of Eliashib the high priest, [is] son-in-law to Sanballat the Horonite, and I cause him to flee from off me.";
dby[28] = "And [one] of the sons of Joiada, the son of Eliashib the high priest, was son-in-law to Sanballat the Horonite; and I chased him from me.";
web[28] = "And [one] of the sons of Joiada, the son of Eliashib the high priest, [was] son-in-law to Sanballat the Horonite: therefore I chased him from me.";
hnv[28] = "One of the sons of Yoiada, the son of Elyashiv the Kohen Gadol, was son-in-law to Sanvallat the Horonite: therefore I chased him from me.";
vul[28] = "de filiis autem Ioiada filii Eliasib sacerdotis magni gener erat Sanaballat Horonitis quem fugavi a me";
kjv[29] = "Remember them, O my God, because they have defiled the priesthood, and the covenant of the priesthood, and of the Levites.";
rsv[29] = "Remember them, O my God, because they have defiled the priesthood and the covenant of the priesthood and the Levites.";
asv[29] = "Remember them, O my God, because they have defiled the priesthood, and the covenant of the priesthood, and of the Levites.";
yng[29] = "Be mindful of them, O my God, for the redeemed of the priesthood, and the covenant of the priesthood, and of the Levites.";
dby[29] = "Remember them, my God, for they are polluters of the priesthood, and of the covenant of the priesthood and of the Levites!";
web[29] = "Remember them, O my God, because they have defiled the priesthood, and the covenant of the priesthood and of the Levites.";
hnv[29] = " Remember them, my God, because they have defiled the priesthood, and the covenant of the priesthood, and of the Levites.";
vul[29] = "recordare Domine Deus meus adversum eos qui polluunt sacerdotium iusque sacerdotale et leviticum";
kjv[30] = "Thus cleansed I them from all strangers, and appointed the wards of the priests and the Levites, every one in his business;";
rsv[30] = "Thus I cleansed them from everything foreign, and I established the duties of the priests and Levites, each in his work;";
asv[30] = "Thus cleansed I them from all foreigners, and appointed charges for the priests and for the Levites, every one in his work;";
yng[30] = "And I have cleansed them from every stranger, and appoint charges to priests and to Levites, each in his work,";
dby[30] = "And I purified them from all foreigners, and appointed the charges of the priests and the Levites, every one in his service;";
web[30] = "Thus I cleansed them from all strangers, and appointed the wards of the priests and the Levites, every one in his business;";
hnv[30] = "Thus cleansed I them from all foreigners, and appointed charges for the Kohanim and for the Levites, everyone in his work;";
vul[30] = "igitur mundavi eos ab omnibus alienigenis et constitui ordines sacerdotum et Levitarum unumquemque in ministerio suo";
kjv[31] = "And for the wood offering, at times appointed, and for the firstfruits. Remember me, O my God, for good.";
rsv[31] = "and I provided for the wood offering, at appointed times, and for the first fruits. Remember me, O my God, for good.";
asv[31] = "and for the wood-offering, at times appointed, and for the first-fruits. Remember me, O my God, for good.";
yng[31] = "and for the wood-offering at appointed times, and for first-fruits. Be mindful of me, O my God, for good.";
dby[31] = "and for the wood-offering, at times appointed, and for the first-fruits. Remember me, O my God, for good!";
web[31] = "And for the wood-offering, at times appointed, and for the first-fruits. Remember me, O my God, for good.";
hnv[31] = "and for the wood-offering, at times appointed, and for the first fruits. Remember me, my God, for good.";
vul[31] = "et in oblatione lignorum in temporibus constitutis et in primitiis memento mei Deus meus in bonum";
