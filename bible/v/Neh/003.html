csb[1] = "The high priest Eliashib and his fellow priests began rebuilding the Sheep Gate. They dedicated it and installed its doors. After building the wall to the Tower of the Hundred and the Tower of Hananel, they dedicated it.";
csb[2] = "The men of Jericho built next to Eliashib, and next to them Zaccur son of Imri built.";
csb[3] = "The sons of Hassenaah built the Fish Gate. They built it with beams and installed its doors, bolts, and bars.";
csb[4] = "Next to them Meremoth son of Uriah, son of Hakkoz, made repairs. Beside them Meshullam son of Berechiah, son of Meshezabel, made repairs. Next to them Zadok son of Baana made repairs.";
csb[5] = "Beside them the Tekoites made repairs, but their nobles did not lift a finger to help their supervisors.";
csb[6] = "Joiada son of Paseah and Meshullam son of Besodeiah repaired the Old Gate. They built it with beams and installed its doors, bolts, and bars.";
csb[7] = "Next to them the repairs were done by Melatiah the Gibeonite, Jadon the Meronothite, and the men of Gibeon and Mizpah, who were under the authority of the governor of the region west of the Euphrates River.";
csb[8] = "After him Uzziel son of Harhaiah, the goldsmith, made repairs, and next to him Hananiah son of the perfumer made repairs. They restored Jerusalem as far as the Broad Wall.";
csb[9] = "Next to them Rephaiah son of Hur, ruler of half the district of Jerusalem, made repairs.";
csb[10] = "After them Jedaiah son of Harumaph made repairs across from his house. Next to him Hattush the son of Hashabneiah made repairs.";
csb[11] = "Malchijah son of Harim and Hasshub son of Pahath-moab made repairs to another section, as well as to the Tower of the Ovens.";
csb[12] = "Beside him Shallum son of Hallohesh, ruler of half the district of Jerusalem, made repairs -- he and his daughters.";
csb[13] = "Hanun and the inhabitants of Zanoah repaired the Valley Gate. They rebuilt it and installed its doors, bolts, and bars, and repaired five hundred yards of the wall to the Dung Gate.";
csb[14] = "Malchijah son of Rechab, ruler of the district of Beth-haccherem, repaired the Dung Gate. He rebuilt it and installed its doors, bolts, and bars.";
csb[15] = "Shallun son of Col-hozeh, ruler of the district of Mizpah, repaired the Fountain Gate. He rebuilt it and roofed it. Then he installed its doors, bolts, and bars. He also made repairs to the wall of the Pool of Shelah near the king\'s garden, as far as the stairs that descend from the city of David.";
csb[16] = "After him Nehemiah son of Azbuk, ruler of half the district of Beth-zur, made repairs up to a point opposite the tombs of David, as far as the artificial pool and the House of the Warriors.";
csb[17] = "Next to him the Levites made repairs under Rehum son of Bani. Beside him Hashabiah, ruler of half the district of Keilah, made repairs for his district.";
csb[18] = "After him their fellow Levites made repairs under Binnui son of Henadad, ruler of half the district of Keilah.";
csb[19] = "Next to him Ezer son of Jeshua, ruler of Mizpah, made repairs to another section opposite the ascent to the armory at the Angle.";
csb[20] = "After him Baruch son of Zabbai diligently repaired another section, from the Angle to the door of the house of the high priest Eliashib.";
csb[21] = "Beside him Meremoth son of Uriah, son of Hakkoz, made repairs to another section, from the door of Eliashib\'s house to the end of his house.";
csb[22] = "And next to him the priests from the surrounding area made repairs.";
csb[23] = "After them Benjamin and Hasshub made repairs opposite their house. Beside them Azariah son of Maaseiah, son of Ananiah, made repairs beside his house.";
csb[24] = "After him Binnui son of Henadad made repairs to another section, from the house of Azariah to the Angle and the corner.";
csb[25] = "Palal son of Uzai made repairs opposite the Angle and tower that juts out from the king\'s upper palace, by the courtyard of the guard. Beside him Pedaiah son of Parosh";
csb[26] = "and the temple servants living on Ophel made repairs opposite the Water Gate toward the east and the tower that juts out.";
csb[27] = "Next to him the Tekoites made repairs to another section from a point opposite the great tower that juts out, as far as the wall of Ophel.";
csb[28] = "Each of the priests made repairs above the Horse Gate, each opposite his own house.";
csb[29] = "After them Zadok son of Immer made repairs opposite his house. And beside him Shemaiah son of Shecaniah, guard of the East Gate, made repairs.";
csb[30] = "Next to him Hananiah son of Shelemiah and Hanun the sixth son of Zalaph made repairs to another section. After them Meshullam son of Berechiah made repairs opposite his room.";
csb[31] = "Next to him Malchijah, one of the goldsmiths, made repairs to the house of the temple servants and the merchants, opposite the Inspection Gate, and as far as the upstairs room on the corner.";
csb[32] = "The goldsmiths and merchants made repairs between the upstairs room on the corner and the Sheep Gate.";
kjv[1] = "Then Eliashib the high priest rose up with his brethren the priests, and they builded the sheep gate; they sanctified it, and set up the doors of it; even unto the tower of Meah they sanctified it, unto the tower of Hananeel.";
kjv[2] = "And next unto him builded the men of Jericho. And next to them builded Zaccur the son of Imri.";
kjv[3] = "But the fish gate did the sons of Hassenaah build, who [also] laid the beams thereof, and set up the doors thereof, the locks thereof, and the bars thereof.";
kjv[4] = "And next unto them repaired Meremoth the son of Urijah, the son of Koz. And next unto them repaired Meshullam the son of Berechiah, the son of Meshezabeel. And next unto them repaired Zadok the son of Baana.";
kjv[5] = "And next unto them the Tekoites repaired; but their nobles put not their necks to the work of their Lord.";
kjv[6] = "Moreover the old gate repaired Jehoiada the son of Paseah, and Meshullam the son of Besodeiah; they laid the beams thereof, and set up the doors thereof, and the locks thereof, and the bars thereof.";
kjv[7] = "And next unto them repaired Melatiah the Gibeonite, and Jadon the Meronothite, the men of Gibeon, and of Mizpah, unto the throne of the governor on this side the river.";
kjv[8] = "Next unto him repaired Uzziel the son of Harhaiah, of the goldsmiths. Next unto him also repaired Hananiah the son of [one of] the apothecaries, and they fortified Jerusalem unto the broad wall.";
kjv[9] = "And next unto them repaired Rephaiah the son of Hur, the ruler of the half part of Jerusalem.";
kjv[10] = "And next unto them repaired Jedaiah the son of Harumaph, even over against his house. And next unto him repaired Hattush the son of Hashabniah.";
kjv[11] = "Malchijah the son of Harim, and Hashub the son of Pahathmoab, repaired the other piece, and the tower of the furnaces.";
kjv[12] = "And next unto him repaired Shallum the son of Halohesh, the ruler of the half part of Jerusalem, he and his daughters.";
kjv[13] = "The valley gate repaired Hanun, and the inhabitants of Zanoah; they built it, and set up the doors thereof, the locks thereof, and the bars thereof, and a thousand cubits on the wall unto the dung gate.";
kjv[14] = "But the dung gate repaired Malchiah the son of Rechab, the ruler of part of Bethhaccerem; he built it, and set up the doors thereof, the locks thereof, and the bars thereof.";
kjv[15] = "But the gate of the fountain repaired Shallun the son of Colhozeh, the ruler of part of Mizpah; he built it, and covered it, and set up the doors thereof, the locks thereof, and the bars thereof, and the wall of the pool of Siloah by the king\'s garden, and unto the stairs that go down from the city of David.";
kjv[16] = "After him repaired Nehemiah the son of Azbuk, the ruler of the half part of Bethzur, unto [the place] over against the sepulchres of David, and to the pool that was made, and unto the house of the mighty.";
kjv[17] = "After him repaired the Levites, Rehum the son of Bani. Next unto him repaired Hashabiah, the ruler of the half part of Keilah, in his part.";
kjv[18] = "After him repaired their brethren, Bavai the son of Henadad, the ruler of the half part of Keilah.";
kjv[19] = "And next to him repaired Ezer the son of Jeshua, the ruler of Mizpah, another piece over against the going up to the armoury at the turning [of the wall].";
kjv[20] = "After him Baruch the son of Zabbai earnestly repaired the other piece, from the turning [of the wall] unto the door of the house of Eliashib the high priest.";
kjv[21] = "After him repaired Meremoth the son of Urijah the son of Koz another piece, from the door of the house of Eliashib even to the end of the house of Eliashib.";
kjv[22] = "And after him repaired the priests, the men of the plain.";
kjv[23] = "After him repaired Benjamin and Hashub over against their house. After him repaired Azariah the son of Maaseiah the son of Ananiah by his house.";
kjv[24] = "After him repaired Binnui the son of Henadad another piece, from the house of Azariah unto the turning [of the wall], even unto the corner.";
kjv[25] = "Palal the son of Uzai, over against the turning [of the wall], and the tower which lieth out from the king\'s high house, that [was] by the court of the prison. After him Pedaiah the son of Parosh.";
kjv[26] = "Moreover the Nethinims dwelt in Ophel, unto [the place] over against the water gate toward the east, and the tower that lieth out.";
kjv[27] = "After them the Tekoites repaired another piece, over against the great tower that lieth out, even unto the wall of Ophel.";
kjv[28] = "From above the horse gate repaired the priests, every one over against his house.";
kjv[29] = "After them repaired Zadok the son of Immer over against his house. After him repaired also Shemaiah the son of Shechaniah, the keeper of the east gate.";
kjv[30] = "After him repaired Hananiah the son of Shelemiah, and Hanun the sixth son of Zalaph, another piece. After him repaired Meshullam the son of Berechiah over against his chamber.";
kjv[31] = "After him repaired Malchiah the goldsmith\'s son unto the place of the Nethinims, and of the merchants, over against the gate Miphkad, and to the going up of the corner.";
kjv[32] = "And between the going up of the corner unto the sheep gate repaired the goldsmiths and the merchants.";
rsv[1] = "Then Eli\'ashib the high priest rose up with his brethren the priests and they built the Sheep Gate. They consecrated it and set its doors; they consecrated it as far as the Tower of the Hundred, as far as the Tower of Hanan\'el.";
asv[1] = "Then Eliashib the high priest rose up with his brethren the priests, and they builded the sheep gate; they sanctified it, and set up the doors of it; even unto the tower of Hammeah they sanctified it, unto the tower of Hananel.";
yng[1] = "And Eliashib the high priest riseth, and his brethren the priests, and they build the sheep-gate; they have sanctified it, and set up its doors, even unto the tower of Meah they have sanctified it, unto the tower of Hananeel;";
dby[1] = "And Eliashib the high priest rose up with his brethren the priests, and they built the sheep-gate. They hallowed it, and set up its doors; and they hallowed it even to the tower of Meah, to the tower of Hananeel.";
web[1] = "Then Eliashib the high priest arose with his brethren the priests, and they built the sheep-gate; they sanctified it, and set up the doors of it; even to the tower of Meah they sanctified it, to the tower of Hananeel.";
hnv[1] = "Then Elyashiv the Kohen Gadol rose up with his brothers the Kohanim, and they built the sheep gate; they sanctified it, and set up the doors of it; even to the tower of Hammeah they sanctified it, to the tower of Hanan\'el.";
vul[1] = "et surrexit Eliasib sacerdos magnus et fratres eius sacerdotes et aedificaverunt portam Gregis ipsi sanctificaverunt eam et statuerunt valvas eius et usque ad turrem centum cubitorum sanctificaverunt eam usque ad turrem Ananehel";
rsv[2] = "And next to him the men of Jericho built. And next to them Zaccur the son of Imri built.";
asv[2] = "And next unto him builded the men of Jericho. And next to them builded Zaccur the son of Imri.";
yng[2] = "and by his hand have men of Jericho built; and by their hand hath Zaccur son of Imri built;";
dby[2] = "And next to them built the men of Jericho. And next to them built Zaccur the son of Imri.";
web[2] = "And next to him built the men of Jericho. And next to them built Zaccur the son of Imri.";
hnv[2] = "Next to him built the men of Yericho. Next to them built Zakkur the son of Imri.";
vul[2] = "et iuxta eum aedificaverunt viri Hiericho et iuxta eum aedificavit Zecchur filius Amri";
rsv[3] = "And the sons of Hassena\'ah built the Fish Gate; they laid its beams and set its doors, its bolts, and its bars.";
asv[3] = "And the fish gate did the sons of Hassenaah build; they laid the beams thereof, and set up the doors thereof, the bolts thereof, and the bars thereof.";
yng[3] = "and the fish-gate have sons of Hassenaah built, they have walled it, and set up its doors, its locks, and its bars.";
dby[3] = "And the fish-gate did the sons of Senaah build: they laid its beams, and set up its doors, its locks and its bars.";
web[3] = "But the fish-gate did the sons of Hassenaah build, who [also] laid its beams, and set up its doors, its locks and its bars.";
hnv[3] = "The fish gate did the sons of Sena\'ah build; they laid the beams of it, and set up the doors of it, the bolts of it, and the bars of it.";
vul[3] = "portam autem Piscium aedificaverunt filii Asanaa ipsi texerunt eam et statuerunt valvas eius et seras et vectes et iuxta eos aedificavit Marimuth filius Uriae filii Accus";
rsv[4] = "And next to them Mer\'emoth the son of Uri\'ah, son of Hakkoz repaired. And next to them Meshul\'lam the son of Berechi\'ah, son of Meshez\'abel repaired. And next to them Zadok the son of Ba\'ana repaired.";
asv[4] = "And next unto them repaired Meremoth the son of Uriah, the son of Hakkoz. And next unto them repaired Meshullam the son of Berechiah, the son of Meshezabel. And next unto them repaired Zadok the son of Baana.";
yng[4] = "And by their hand hath Merimoth son of Urijah, son of Koz, strengthened; and by his hand hath Meshullam son of Berechiah, son of Meshezabeel, strengthened; and by his hand hath Zadok son of Baana strengthened;";
dby[4] = "And next to them repaired Meremoth the son of Urijah, the son of Koz. And next to them repaired Meshullam the son of Berechiah, the son of Meshezabeel. And next to them repaired Zadok the son of Baana.";
web[4] = "And next to them repaired Meremoth the son of Urijah, the son of Koz. And next to them repaired Meshullam the son of Berechiah, the son of Meshezabeel. And next to them repaired Zadok the son of Baana.";
hnv[4] = "Next to them repaired Meremot the son of Uriyah, the son of Hakkotz. Next to them repaired Meshullam the son of Berekhyah, the son of Meshezav\'el. Next to them repaired Tzadok the son of Ba`anah.";
vul[4] = "et iuxta eos aedificavit Mosollam filius Barachiae filii Mesezebel et iuxta eos aedificavit Sadoc filius Baana";
rsv[5] = "And next to them the Teko\'ites repaired; but their nobles did not put their necks to the work of their Lord.";
asv[5] = "And next unto them the Tekoites repaired; but their nobles put not their necks to the work of their lord.";
yng[5] = "and by his hand have the Tekoites strengthened, and their honourable ones have not brought in their neck to the service of their Lord.";
dby[5] = "And next to them the Tekoites repaired; but their nobles put not their necks to the work of their Lord.";
web[5] = "And next to them the Tekoites repaired; but their nobles put not their necks to the work of their Lord.";
hnv[5] = "Next to them the Tekoites repaired; but their nobles didn\'t put their necks to the work of their lord.";
vul[5] = "et iuxta eos aedificaverunt Thecueni optimates autem eorum non subposuerunt colla sua in opere Domini sui";
rsv[6] = "And Joi\'ada the son of Pase\'ah and Meshul\'lam the son of Besodei\'ah repaired the Old Gate; they laid its beams and set its doors, its bolts, and its bars.";
asv[6] = "And the old gate repaired Joiada the son of Paseah and Meshullam the son of Besodeiah; they laid the beams thereof, and set up the doors thereof, and the bolts thereof, and the bars thereof.";
yng[6] = "And the old gate have Jehoiada son of Paseah, and Meshullam son of Besodeiah, strengthened; they have walled it, and set up its doors, and its locks, and its bars.";
dby[6] = "And the gate of the old [wall] repaired Jehoiada the son of Paseah, and Meshullam the son of Besodiah; they laid its beams, and set up its doors, and its locks, and its bars.";
web[6] = "Moreover, the old gate repaired Jehoiada the son of Paseah, and Meshullam the son of Besodeiah; they laid its beams, and set up its doors, and its locks, and its bars.";
hnv[6] = "The old gate repaired Yoiada the son of Pase\'ach and Meshullam the son of Besodyah; they laid the beams of it, and set up the doors of it, and the bolts of it, and the bars of it.";
vul[6] = "et portam Veterem aedificaverunt Ioiada filius Fasea et Mosollam filius Besodia ipsi texerunt eam et statuerunt valvas eius et seras et vectes";
rsv[7] = "And next to them repaired Melati\'ah the Gib\'eonite and Jadon the Mero\'nothite, the men of Gibeon and of Mizpah, who were under the jurisdiction of the governor of the province Beyond the River.";
asv[7] = "And next unto them repaired Melatiah the Gibeonite, and Jadon the Meronothite, the men of Gibeon, and of Mizpah, [that appertained] to the throne of the governor beyond the River.";
yng[7] = "And by their hand hath Melatiah the Gibeonite strengthened, and Jadon the Meronothite, men of Gibeon and of Mizpah, to the throne of the governor beyond the River.";
dby[7] = "And next to them repaired Melatiah the Gibeonite, and Jadon the Meronothite, the men of Gibeon and of Mizpah, to the seat of the governor on this side the river.";
web[7] = "And next to them repaired Melatiah the Gibeonite, and Jadon the Meronothite, the men of Gibeon, and of Mizpah, to the throne of the governor on this side of the river.";
hnv[7] = "Next to them repaired Melatyah the Giv`oni, and Yadon the Meronotite, the men of Giv`on, and of Mitzpah, [that appertained] to the throne of the governor beyond the River.";
vul[7] = "et iuxta eos aedificavit Meletias Gabaonites et Iadon Meronathites viri de Gabaon et Maspha pro duce qui erat in regione trans Flumen";
rsv[8] = "Next to them Uz\'ziel the son of Harhai\'ah, goldsmiths, repaired. Next to him Hanani\'ah, one of the perfumers, repaired; and they restored Jerusalem as far as the Broad Wall.";
asv[8] = "Next unto him repaired Uzziel the son of Harhaiah, goldsmiths. And next unto him repaired Hananiah one of the perfumers, and they fortified Jerusalem even unto the broad wall.";
yng[8] = "By his hand hath Uzziel son of Harhaiah of the refiners strengthened; and by his hand hath Hananiah son of [one of] the compounders strengthened; and they leave Jerusalem unto the broad wall.";
dby[8] = "Next to them repaired Uzziel the son of Harhaiah, of the goldsmiths; and next to him repaired Hananiah of the perfumers, and they left Jerusalem [in its state] as far as the broad wall.";
web[8] = "Next to him repaired Uzziel the son of Harhaiah, of the goldsmiths. Next to him also repaired Hananiah the son of [one of] the apothecaries, and they fortified Jerusalem to the broad wall.";
hnv[8] = "Next to him repaired `Uzzi\'el the son of Harchayah, goldsmiths. Next to him repaired Hananyah one of the perfumers, and they fortified Yerushalayim even to the broad wall.";
vul[8] = "et iuxta eum aedificavit Ezihel filius Araia aurifex et iuxta eum aedificavit Anania filius pigmentarii et dimiserunt Hierusalem usque ad murum plateae latioris";
rsv[9] = "Next to them Rephai\'ah the son of Hur, ruler of half the district of Jerusalem, repaired.";
asv[9] = "And next unto them repaired Rephaiah the son of Hur, the ruler of half the district of Jerusalem.";
yng[9] = "And by their hand hath Rephaiah son of Hur, head of the half of the district of Jerusalem, strengthened.";
dby[9] = "And next to them repaired Rephaiah the son of Hur, the ruler of the half part of Jerusalem.";
web[9] = "And next to them repaired Rephaiah the son of Hur, the ruler of the half part of Jerusalem.";
hnv[9] = "Next to them repaired Refayah the son of Hur, the ruler of half the district of Yerushalayim.";
vul[9] = "et iuxta eum aedificavit Rafaia filius Ahur princeps vici Hierusalem";
rsv[10] = "Next to them Jedai\'ah the son of Haru\'maph repaired opposite his house; and next to him Hattush the son of Hashabnei\'ah repaired.";
asv[10] = "And next unto them repaired Jedaiah the son of Harumaph, over against his house. And next unto him repaired Hattush the son of Hashabneiah.";
yng[10] = "And by their hand hath Jedaiah son of Harumaph strengthened, and over-against his own house; and by his hand hath Hattush son of Hashabniah strengthened.";
dby[10] = "And next to them repaired Jedaiah the son of Harumaph, even over against his house. And next to him repaired Hattush the son of Hashabniah.";
web[10] = "And next to them repaired Jedaiah the son of Harumaph, even over against his house. And next to him repaired Hattush the son of Hashabniah.";
hnv[10] = "Next to them repaired Yedayah the son of Harumaf, over against his house. Next to him repaired Hattush the son of Hashavneyah.";
vul[10] = "et iuxta eos aedificavit Ieiada filius Aromath contra domum suam et iuxta eum aedificavit Attus filius Asebeniae";
rsv[11] = "Malchi\'jah the son of Harim and Hasshub the son of Pa\'hath-mo\'ab repaired another section and the Tower of the Ovens.";
asv[11] = "Malchijah the son of Harim, and Hasshub the son of Pahath-moab, repaired another portion, and the tower of the furnaces.";
yng[11] = "A second measure hath Malchijah son of Harim strengthened, and Hashub son of Pahath-Moab, even the tower of the furnaces.";
dby[11] = "Malchijah the son of Harim and Hasshub the son of Pahath-Moab repaired a second piece, and the tower of the furnaces.";
web[11] = "Malchijah the son of Harim, and Hashub the son of Pahath-moab, repaired the other piece, and the tower of the furnaces.";
hnv[11] = "Malkiyah the son of Harim, and Hashshuv the son of Pachat-Mo\'av, repaired another portion, and the tower of the furnaces.";
vul[11] = "mediam partem vici aedificavit Melchias filius Erem et Asub filius Phaethmoab et turrem Furnorum";
rsv[12] = "Next to him Shallum the son of Hallo\'hesh, ruler of half the district of Jerusalem, repaired, he and his daughters.";
asv[12] = "And next unto him repaired Shallum the son of Hallohesh, the ruler of half the district of Jerusalem, he and his daughters.";
yng[12] = "And by his hand hath Shallum son of Halohesh, head of the half of the district of Jerusalem, strengthened, he and his daughters.";
dby[12] = "And next to them repaired Shallum the son of Hallohesh, the ruler of the half part of Jerusalem, he and his daughters.";
web[12] = "And next to him repaired Shallum the son of Halohesh, the ruler of the half part of Jerusalem, he and his daughters.";
hnv[12] = "Next to him repaired Shallum the son of Hallochesh, the ruler of half the district of Yerushalayim, he and his daughters.";
vul[12] = "iuxta eum aedificavit Sellum filius Alloes princeps mediae partis vici Hierusalem ipse et filiae eius";
rsv[13] = "Hanun and the inhabitants of Zano\'ah repaired the Valley Gate; they rebuilt it and set its doors, its bolts, and its bars, and repaired a thousand cubits of the wall, as far as the Dung Gate.";
asv[13] = "The valley gate repaired Hanun, and the inhabitants of Zanoah; they built it, and set up the doors thereof, the bolts thereof, and the bars thereof, and a thousand cubits of the wall unto the dung gate.";
yng[13] = "The gate of the valley hath Hanun strengthened, and the inhabitants of Zanoah; they have built it, and set up its doors, its locks, and its bars, and a thousand cubits in the wall unto the dung-gate.";
dby[13] = "The valley-gate repaired Hanun, and the inhabitants of Zanoah; they built it, and set up its doors, its locks and its bars, and a thousand cubits of the wall as far as the dung-gate.";
web[13] = "The valley-gate repaired Hanun, and the inhabitants of Zanoah; they built it, and set up its doors, its locks, and its bars, and a thousand cubits on the wall to the dung-gate.";
hnv[13] = "The valley gate repaired Hanun, and the inhabitants of Zanoach; they built it, and set up the doors of it, the bolts of it, and the bars of it, and one thousand cubits of the wall to the dung gate.";
vul[13] = "et portam Vallis aedificavit Anun et habitatores Zanoe ipsi aedificaverunt eam et statuerunt valvas eius et seras et vectes et mille cubitos in muro usque ad portam Sterquilinii";
rsv[14] = "Malchi\'jah the son of Rechab, ruler of the district of Beth-hacche\'rem, repaired the Dung Gate; he rebuilt it and set its doors, its bolts, and its bars.";
asv[14] = "And the dung gate repaired Malchijah the son of Rechab, the ruler of the district of Beth-haccherem; he built it, and set up the doors thereof, the bolts thereof, and the bars thereof.";
yng[14] = "And the dung-gate hath Malchijah son of Rechab, head of the district of Beth-Haccerem, strengthened; he doth built it, and set up its doors, its locks, and its bars.";
dby[14] = "And the dung-gate repaired Malchijah the son of Rechab, the chief of the district of Beth-haccerem; he built it, and set up its doors, its locks and its bars.";
web[14] = "But the dung-gate repaired Malchiah the son of Rechab, the ruler of part of Beth-haccerem; he built it, and set up its doors, its locks, and its bars.";
hnv[14] = "The dung gate repaired Malkiyah the son of Rechav, the ruler of the district of Beit-Hakkerem; he built it, and set up the doors of it, the bolts of it, and the bars of it.";
vul[14] = "et portam Sterquilinii aedificavit Melchias filius Rechab princeps vici Bethaccharem ipse aedificavit eam et statuit valvas eius et seras et vectes";
rsv[15] = "And Shallum the son of Colho\'zeh, ruler of the district of Mizpah, repaired the Fountain Gate; he rebuilt it and covered it and set its doors, its bolts, and its bars; and he built the wall of the Pool of Shelah of the king\'s garden, as far as the stairs that go down from the City of David.";
asv[15] = "And the fountain gate repaired Shallun the son of Colhozeh, the ruler of the district of Mizpah; he built it, and covered it, and set up the doors thereof, the bolts thereof, and the bars thereof, and the wall of the pool of Shelah by the king\'s garden, even unto the stairs that go down from the city of David.";
yng[15] = "And the gate of the fountain hath Shallum son of Col-Hozeh, head of the district of Mizpah, strengthened: he doth build it, and cover it, and set up its doors, its locks, and its bars, and the wall of the pool of Siloah, to the garden of the king, and unto the steps that are going down from the city of David.";
dby[15] = "And the fountain-gate repaired Shallun the son of Colhozeh, the chief of the district of Mizpah; he built it, and covered it, and set up its doors, its locks and its bars, and the wall of the pool of Shelah by the king\'s garden, and to the stairs that go down from the city of David.";
web[15] = "But the gate of the fountain repaired Shallun the son of Col-hozeh, the ruler of part of Mizpah; he built it, and covered it, and set up its doors, its locks, and its bars, and the wall of the pool of Siloah by the king\'s garden, and to the stairs that go down from the city of David.";
hnv[15] = "The spring gate repaired Shallun the son of Kolchozeh, the ruler of the district of Mitzpah; he built it, and covered it, and set up the doors of it, the bolts of it, and the bars of it, and the wall of the pool of Shelach by the king\'s garden, even to the stairs that go down from the city of David.";
vul[15] = "et portam Fontis aedificavit Sellum filius Choloozai princeps pagi Maspha ipse aedificavit eam et texit et statuit valvas eius et seras et vectes et muros piscinae Siloae in hortum regis et usque ad gradus qui descendunt de civitate David";
rsv[16] = "After him Nehemi\'ah the son of Azbuk, ruler of half the district of Beth-zur, repaired to a point opposite the sepulchres of David, to the artificial pool, and to the house of the mighty men.";
asv[16] = "After him repaired Nehemiah the son of Azbuk, the ruler of half the district of Beth-zur, unto the place over against the sepulchres of David, and unto the pool that was made, and unto the house of the mighty men.";
yng[16] = "After him hath Nehemiah son of Azbuk, head of the half of the district of Beth-Zur, strengthened, unto over-against the graves of David, and unto the pool that is made, and unto the house of the mighty ones.";
dby[16] = "After him repaired Nehemiah the son of Azbuk, the chief of the half district of Beth-zur, even over against the sepulchres of David, and to the pool that was made, and to the house of the mighty [men].";
web[16] = "After him repaired Nehemiah the son of Azbuk, the ruler of the half part of Beth-zur, to [the place] over against the sepulchers of David, and to the pool that was made, and to the house of the mighty.";
hnv[16] = " After him repaired Nechemyah the son of Azbuk, the ruler of half the district of Beit-Tzur, to the place over against the tombs of David, and to the pool that was made, and to the house of the mighty men.";
vul[16] = "post eum aedificavit Neemias filius Azboc princeps dimidiae partis vici Bethsur usque contra sepulchra David et usque ad piscinam quae grandi opere constructa est et usque ad domum Fortium";
rsv[17] = "After him the Levites repaired: Rehum the son of Bani; next to him Hashabi\'ah, ruler of half the district of Kei\'lah, repaired for his district.";
asv[17] = "After him repaired the Levites, Rehum the son of Bani. Next unto him repaired Hashabiah, the ruler of half the district of Keilah, for his district.";
yng[17] = "After him have the Levites strengthened, [and] Rehum son of Bani: by his hand hath Hashabiah, head of the half of the district of Keilah, strengthened, for his district.";
dby[17] = "After him repaired the Levites, Rehum the son of Bani. Next to him repaired Hashabiah, the chief of the half district of Keilah, for his district.";
web[17] = "After him repaired the Levites Rehum the son of Bani. Next to him repaired Hashabiah the ruler of the half part of Keilah, in his part.";
hnv[17] = "After him repaired the Levites, Rechum the son of Bani. Next to him repaired Hashavyah, the ruler of half the district of Ke`ilah, for his district.";
vul[17] = "post eum aedificaverunt Levitae Reum filius Benni post eum aedificavit Asebias princeps dimidiae partis vici Ceilae in vico suo";
rsv[18] = "After him their brethren repaired: Bav\'vai the son of Hen\'adad, ruler of half the district of Kei\'lah;";
asv[18] = "After him repaired their brethren, Bavvai the son of Henadad, the ruler of half the district of Keilah.";
yng[18] = "After him have their brethren strengthened, [and] Bavvai son of Henadad, head of the half of the district of Keilah.";
dby[18] = "After him repaired their brethren, Bavvai the son of Henadad, the chief of the half district of Keilah.";
web[18] = "After him repaired their brethren, Bavai the son of Henadad, the ruler of the half part of Keilah.";
hnv[18] = "After him repaired their brothers, Bavvai the son of Henadad, the ruler of half the district of Ke`ilah.";
vul[18] = "post eum aedificaverunt fratres eorum Behui filius Enadad princeps dimidiae partis Ceila";
rsv[19] = "next to him Ezer the son of Jeshua, ruler of Mizpah, repaired another section opposite the ascent to the armory at the Angle.";
asv[19] = "And next to him repaired Ezer the son of Jeshua, the ruler of Mizpah, another portion, over against the ascent to the armory at the turning [of the wall].";
yng[19] = "And Ezer son of Jeshua, head of Mizpah, doth strengthen, by his hand, a second measure, from over-against the ascent of the armoury at the angle.";
dby[19] = "And next to him repaired Ezer the son of Jeshua, the ruler of Mizpah, a second piece over against the going up to the armoury at the angle.";
web[19] = "And next to him repaired Ezer the son of Jeshua, the ruler of Mizpah, another piece over against the ascent to the armory, at the turning [of the wall].";
hnv[19] = "Next to him repaired Etzer the son of Yeshua, the ruler of Mitzpah, another portion, over against the ascent to the armory at the turning [of the wall].";
vul[19] = "et aedificavit iuxta eum Azer filius Iosue princeps Maspha mensuram secundam contra ascensum firmissimi anguli";
rsv[20] = "After him Baruch the son of Zab\'bai repaired another section from the Angle to the door of the house of Eli\'ashib the high priest.";
asv[20] = "After him Baruch the son of Zabbai earnestly repaired another portion, from the turning [of the wall] unto the door of the house of Eliashib the high priest.";
yng[20] = "After him hath Baruch son of Zabbai hastened to strengthen a second measure from the angle unto the opening of the house of Eliashib the high priest.";
dby[20] = "After him Baruch the son of Zabbai earnestly repaired another piece, from the angle to the entry of the house of Eliashib the high priest.";
web[20] = "After him Baruch the son of Zabbai, earnestly repaired the other piece, from the turning [of the wall] to the door of the house of Eliashib the high priest.";
hnv[20] = "After him Barukh the son of Zakkai earnestly repaired another portion, from the turning [of the wall] to the door of the house of Elyashiv the Kohen Gadol.";
vul[20] = "post eum in monte aedificavit Baruch filius Zacchai mensuram secundam ab angulo usque ad portam domus Eliasib sacerdotis magni";
rsv[21] = "After him Mer\'emoth the son of Uri\'ah, son of Hakkoz repaired another section from the door of the house of Eli\'ashib to the end of the house of Eli\'ashib.";
asv[21] = "After him repaired Meremoth the son of Uriah the son of Hakkoz another portion, from the door of the house of Eliashib even to the end of the house of Eliashib.";
yng[21] = "After him hath Meremoth son of Urijah, son of Koz, strengthened, a second measure, from the opening of the house of Eliashib even unto the completion of the house of Eliashib.";
dby[21] = "After him repaired Meremoth the son of Urijah, the son of Koz, another piece, from the door of the house of Eliashib as far as the end of the house of Eliashib.";
web[21] = "After him repaired Meremoth the son of Urijah the son of Koz another piece, from the door of the house of Eliashib, even to the end of the house of Eliashib.";
hnv[21] = "After him repaired Meremot the son of Uriyah the son of Hakkotz another portion, from the door of the house of Elyashiv even to the end of the house of Elyashiv.";
vul[21] = "post eum aedificavit Meremuth filius Uriae filii Accus mensuram secundam a porta domus Eliasib donec extenderetur domus Eliasib";
rsv[22] = "After him the priests, the men of the Plain, repaired.";
asv[22] = "And after him repaired the priests, the men of the Plain.";
yng[22] = "And after him have the priests, men of the circuit, strengthened.";
dby[22] = "And after him repaired the priests, the men of the plain [of Jordan].";
web[22] = "And after him repaired the priests, the men of the plain.";
hnv[22] = " After him repaired the Kohanim, the men of the Plain.";
vul[22] = "et post eum aedificaverunt sacerdotes viri de campestribus Iordanis";
rsv[23] = "After them Benjamin and Hasshub repaired opposite their house. After them Azari\'ah the son of Ma-asei\'ah, son of Anani\'ah repaired beside his own house.";
asv[23] = "After them repaired Benjamin and Hasshub over against their house. After them repaired Azariah the son of Maaseiah the son of Ananiah beside his own house.";
yng[23] = "After them hath Benjamin strengthened, and Hashub, over-against their house; after him hath Azariah son of Maaseiah, son of Ananiah, strengthened, near his house.";
dby[23] = "After them repaired Benjamin and Hasshub over against their house. After them repaired Azariah the son of Maaseiah, the son of Ananiah, by his house.";
web[23] = "After him repaired Benjamin and Hashub, over against their house. After him repaired Azariah, the son of Maaseiah, the son of Ananiah, by his house.";
hnv[23] = "After them repaired Binyamin and Hashshuv over against their house. After them repaired `Azaryah the son of Ma`aseyah the son of `Ananyah beside his own house.";
vul[23] = "post eum aedificavit Beniamin et Asub contra domum suam et post eum aedificavit Azarias filius Maasiae filii Ananiae contra domum suam";
rsv[24] = "After him Bin\'nui the son of Hen\'adad repaired another section, from the house of Azari\'ah to the Angle";
asv[24] = "After him repaired Binnui the son of Henadad another portion, from the house of Azariah unto the turning [of the wall], and unto the corner.";
yng[24] = "After him hath Binnui son of Henadad strengthened, a second measure, from the house of Azariah unto the angle, and unto the corner.";
dby[24] = "After him repaired Binnui the son of Henadad another piece, from the house of Azariah to the angle, as far as the corner.";
web[24] = "After him repaired Binnui, the son of Henadad, another piece, from the house of Azariah to the turning [of the wall], even to the corner.";
hnv[24] = "After him repaired Binnui the son of Henadad another portion, from the house of `Azaryah to the turning [of the wall], and to the corner.";
vul[24] = "post eum aedificavit Bennui filius Enadda mensuram secundam a domo Azariae usque ad flexuram et usque ad angulum";
rsv[25] = "and to the corner. Palal the son of Uzai repaired opposite the Angle and the tower projecting from the upper house of the king at the court of the guard. After him Pedai\'ah the son of Parosh";
asv[25] = "Palal the son of Uzai [repaired] over against the turning [of the wall], and the tower that standeth out from the upper house of the king, which is by the court of the guard. After him Pedaiah the son of Parosh [repaired].";
yng[25] = "Palal son of Uzai, from over-against the angle, and the tower that is going out from the upper house of the king that [is] at the court of the prison; after him Pedaiah son of Parosh.";
dby[25] = "Palal the son of Uzai, over against the angle, and the high tower that lies out from the king\'s house, which was by the court of the prison. After him, Pedaiah the son of Parosh.";
web[25] = "Palal, the son of Uzai, over against the turning [of the wall], and the tower which lieth out from the king\'s high house, that [was] by the court of the prison. After him Pedaiah, the son of Parosh.";
hnv[25] = "Palal the son of Uzai [repaired] over against the turning [of the wall], and the tower that stands out from the upper house of the king, which is by the court of the guard. After him Pedayahu the son of Par`osh [repaired].";
vul[25] = "Falel filius Ozi contra flexuram et turrem quae eminet de domo regis excelsa id est in atrio carceris post eum Phadaia filius Pheros";
rsv[26] = "and the temple servants living on Ophel repaired to a point opposite the Water Gate on the east and the projecting tower.";
asv[26] = "(Now the Nethinim dwelt in Ophel, unto the place over against the water gate toward the east, and the tower that standeth out.)";
yng[26] = "And the Nethinim have been dwelling in Ophel, unto over-against the water-gate at the east, and the tower that goeth out.";
dby[26] = "(Now the Nethinim dwelt in Ophel, even over against the water-gate toward the east, and the tower which lies out.)";
web[26] = "Moreover, the Nethinims dwelt in Ophel, to [the place] over against the water-gate towards the east, and the projecting tower.";
hnv[26] = "(Now the temple servants lived in `Ofel, to the place over against the water gate toward the east, and the tower that stands out.)";
vul[26] = "Nathinnei autem habitabant in Ofel usque contra portam Aquarum ad orientem et turrem quae prominebat";
rsv[27] = "After him the Teko\'ites repaired another section opposite the great projecting tower as far as the wall of Ophel.";
asv[27] = "After him the Tekoites repaired another portion, over against the great tower that standeth out, and unto the wall of Ophel.";
yng[27] = "After him have the Tekoites strengthened, a second measure, from over-against the great tower that goeth out, and unto the wall of Ophel.";
dby[27] = "After him the Tekoites repaired a second piece, over against the great tower which lies out, as far as the wall of Ophel.";
web[27] = "After them the Tekoites repaired another piece, over against the great projecting tower, even to the wall of Ophel.";
hnv[27] = "After him the Tekoites repaired another portion, over against the great tower that stands out, and to the wall of `Ofel.";
vul[27] = "post eum aedificaverunt Thecueni mensuram secundam e regione a turre magna et eminenti usque ad murum templi";
rsv[28] = "Above the Horse Gate the priests repaired, each one opposite his own house.";
asv[28] = "Above the horse gate repaired the priests, every one over against his own house.";
yng[28] = "From above the horse-gate have the priests strengthened, each over-against his house.";
dby[28] = "From above the horse-gate repaired the priests, every one over against his house.";
web[28] = "From above the horse-gate repaired the priests, every one over against his house.";
hnv[28] = "Above the horse gate repaired the Kohanim, everyone over against his own house.";
vul[28] = "sursum autem a porta Equorum aedificaverunt sacerdotes unusquisque contra domum suam";
rsv[29] = "After them Zadok the son of Immer repaired opposite his own house. After him Shemai\'ah the son of Shecani\'ah, the keeper of the East Gate, repaired.";
asv[29] = "After them repaired Zadok the son of Immer over against his own house. And after him repaired Shemaiah the son of Shecaniah, the keeper of the east gate.";
yng[29] = "After them hath Zadok son of Immer strengthened, over against his house; and after him hath Shemaiah son of Shechaniah, keeper of the east gate, strengthened.";
dby[29] = "After them repaired Zadok the son of Immer over against his house. And after him repaired also Shemaiah the son of Shechaniah, the keeper of the east gate.";
web[29] = "After them repaired Zadok the son of Immer over against his house. After him repaired also Shemaiah the son of Shechaniah, the keeper of the east gate.";
hnv[29] = "After them repaired Tzadok the son of Immer over against his own house. After him repaired Shemayah the son of Shekhanyahu, the keeper of the east gate.";
vul[29] = "post eos aedificavit Seddo filius Emmer contra domum suam et post eum aedificavit Semeia filius Secheniae custos portae orientalis";
rsv[30] = "After him Hanani\'ah the son of Shelemi\'ah and Hanun the sixth son of Zalaph repaired another section. After him Meshul\'lam the son of Berechi\'ah repaired opposite his chamber.";
asv[30] = "After him repaired Hananiah the son of Shelemiah, and Hanun the sixth son of Zalaph, another portion. After him repaired Meshullam the son of Berechiah over against his chamber.";
yng[30] = "After him hath Hananiah son of Shelemiah strengthened, and Hanun the sixth son of Zalaph, a second measure; after him hath Meshullam son of Berechiah strengthened, over-against his chamber.";
dby[30] = "After him repaired Hananiah the son of Shelemiah, and Hanun the sixth son of Zalaph, a second piece. After them repaired Meshullam the son of Berechiah over against his chamber.";
web[30] = "After him repaired Hananiah the son of Shelemiah, and Hanun the sixth son of Zalaph, another piece. After him repaired Meshullam the son of Berechiah over against his chamber.";
hnv[30] = "After him repaired Hananyah the son of Shelemyahu, and Hanun the sixth son of Tzalaf, another portion. After him repaired Meshullam the son of Berekhyah over against his chamber.";
vul[30] = "[Vulgate 3:30a] post eum aedificavit Anania filius Selemiae et Anon filius Selo sextus mensuram secundam post eum aedificavit Mosollam filius Barachiae contra gazofilacium";
rsv[31] = "After him Malchi\'jah, one of the goldsmiths, repaired as far as the house of the temple servants and of the merchants, opposite the Muster Gate, and to the upper chamber of the corner.";
asv[31] = "After him repaired Malchijah one of the goldsmiths unto the house of the Nethinim, and of the merchants, over against the gate of Hammiphkad, and to the ascent of the corner.";
yng[31] = "After him hath Malchijah son of the refiner strengthened, unto the house of the Nethinim, and of the merchants, over-against the gate of the Miphkad, and unto the ascent of the corner.";
dby[31] = "After him repaired Malchijah of the goldsmiths to the place of the Nethinim and of the dealers, over against the gate Miphkad, and to the ascent of the corner.";
web[31] = "After him repaired Malchiah the goldsmith\'s son, to the place of the Nethinims, and of the merchants, over against the gate Miphkad, and to the ascent of the corner.";
hnv[31] = "After him repaired Malkiyah one of the goldsmiths to the house of the temple servants, and of the merchants, over against the gate of Hammifkad, and to the ascent of the corner.";
vul[31] = "[Vulgate 3:30b] suum post eum aedificavit Melchias filius aurificis usque ad domum Nathinneorum et scruta vendentium contra portam Iudicialem et usque ad cenaculum Anguli";
rsv[32] = "And between the upper chamber of the corner and the Sheep Gate the goldsmiths and the merchants repaired.";
asv[32] = "And between the ascent of the corner and the sheep gate repaired the goldsmiths and the merchants.";
yng[32] = "And between the ascent of the corner and the sheep-gate, have the refiners and the merchants strengthened.";
dby[32] = "And between the ascent of the corner and the sheep-gate repaired the goldsmiths and the dealers.";
web[32] = "And between the ascent of the corner to the sheep-gate repaired the goldsmiths and the merchants.";
hnv[32] = "Between the ascent of the corner and the sheep gate repaired the goldsmiths and the merchants.";
vul[32] = "[Vulgate 3:31] et inter cenaculum Anguli in porta Gregis aedificaverunt artifices et negotiatores";
</script>
