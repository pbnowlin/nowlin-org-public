csb[1] = "all the people gathered together at the square in front of the Water Gate. They asked the scribe Ezra to bring the book of the law of Moses that the LORD had given Israel.";
csb[2] = "On the first day of the seventh month, the priest Ezra brought the law before the assembly of men, women, and all who could listen with understanding.";
csb[3] = "While he was facing the square in front of the Water Gate, he read out of it from daybreak until noon before the men, the women, and those who could understand. All the people listened attentively to the book of the law.";
csb[4] = "The scribe Ezra stood on a high wooden platform made for this purpose. Mattithiah, Shema, Anaiah, Uriah, Hilkiah, and Maaseiah stood beside him on his right; to his left were Pedaiah, Mishael, Malchijah, Hashum, Hash-baddanah, Zechariah, and Meshullam.";
csb[5] = "Ezra opened the book in full view of all the people, since he was elevated above everyone. As he opened it, all the people stood up.";
csb[6] = "Ezra blessed the LORD, the great God, and with their hands uplifted all the people said, &quot;Amen, Amen! &quot; Then they knelt low and worshiped the LORD with their faces to the ground.";
csb[7] = "Jeshua, Bani, Sherebiah, Jamin, Akkub, Shabbethai, Hodiah, Maaseiah, Kelita, Azariah, Jozabad, Hanan, and Pelaiah, who were Levites, explained the law to the people as they stood in their places.";
csb[8] = "They read out of the book of the law of God, translating and giving the meaning so that the people could understand what was read.";
csb[9] = "Nehemiah the governor, Ezra the priest and scribe, and the Levites who were instructing the people said to all of them, &quot;This day is holy to the LORD your God. Do not mourn or weep.&quot; For all the people were weeping as they heard the words of the law.";
csb[10] = "Then he said to them, &quot;Go and eat what is rich, drink what is sweet, and send portions to those who have nothing prepared, since today is holy to our Lord. Do not grieve, because the joy of the LORD is your strength.&quot;";
csb[11] = "And the Levites quieted all the people, saying, &quot;Be still, since today is holy. Don\'t grieve.&quot;";
csb[12] = "Then all the people began to eat and drink, send portions, and have a great celebration, because they had understood the words that were explained to them.";
csb[13] = "On the second day, the family heads of all the people, along with the priests and Levites, assembled before the scribe Ezra to study the words of the law.";
csb[14] = "They found written in the law how the LORD had commanded through Moses that the Israelites should dwell in shelters during the festival of the seventh month.";
csb[15] = "So they proclaimed and spread this news throughout their towns and in Jerusalem, saying, &quot;Go out to the hill country and bring back branches of olive, wild olive, myrtle, palm, and other leafy trees to make shelters, just as it is written.&quot;";
csb[16] = "The people went out, brought back branches, and made shelters for themselves on each of their rooftops and courtyards, the court of the house of God, the square by the Water Gate, and the square by the Ephraim Gate.";
csb[17] = "The whole community that had returned from exile made shelters and lived in them. The Israelites had not celebrated like this from the days of Joshua son of Nun until that day. And there was tremendous joy.";
csb[18] = "Ezra read out of the book of the law of God every day, from the first day to the last. The Israelites celebrated the festival for seven days, and on the eighth day there was an assembly, according to the ordinance.";

kjv[9] = "And Nehemiah, which [is] the Tirshatha, and Ezra the priest the scribe, and the Levites that taught the people, said unto all the people, This day [is] holy unto the LORD your God; mourn not, nor weep. For all the people wept, when they heard the words of the law.";
rsv[9] = "And Nehemi\'ah, who was the governor, and Ezra the priest and scribe, and the Levites who taught the people said to all the people, &quot;This day is holy to the LORD your God; do not mourn or weep.&quot; For all the people wept when they heard the words of the law.";
asv[9] = "And Nehemiah, who was the governor, and Ezra the priest the scribe, and the Levites that taught the people, said unto all the people, This day is holy unto Jehovah your God; mourn not, nor weep. For all the people wept, when they heard the words of the law.";
yng[9] = "And Nehemiah -- he [is] the Tirshatha -- saith (and Ezra the priest, the scribe, and the Levites who are instructing the people) to all the people, `To-day is holy to Jehovah your God, do not mourn, nor weep:\' for all the people are weeping at their hearing the words of the law.";
dby[9] = "And Nehemiah, that is, the Tirshatha, and Ezra the priest the scribe, and the Levites that explained to the people, said to all the people, This day is holy to Jehovah your God: mourn not, nor weep. For all the people wept when they heard the words of the law.";
web[9] = "And Nehemiah, who [is] the Tirshatha, and Ezra the priest, the scribe, and the Levites that taught the people, said to all the people, This day [is] holy to the LORD your God; mourn not, nor weep. For all the people wept, when they heard the words of the law.";

vul[9] = "dixit autem Neemias ipse est Athersatha et Ezras sacerdos scriba et Levitae interpretantes universo populo dies sanctificatus est Domino Deo nostro nolite lugere et nolite flere flebat enim omnis populus cum audiret verba legis";
