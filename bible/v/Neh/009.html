csb[1] = "On the twenty-fourth day of this month the Israelites assembled; they were fasting, wearing sackcloth, and had put dust on their heads.";
csb[2] = "Those of Israelite descent separated themselves from all foreigners, and they stood and confessed their sins and the iniquities of their fathers.";
csb[3] = "While they stood in their places, they read from the book of the law of the LORD their God for a fourth of the day and spent another fourth of the day in confession and worship of the LORD their God.";
csb[4] = "Jeshua, Bani, Kadmiel, Shebaniah, Bunni, Sherebiah, Bani, and Chenani stood on the raised platform built for the Levites and cried out loudly to the LORD their God.";
csb[5] = "Then the Levites -- Jeshua, Kadmiel, Bani, Hashabneiah, Sherebiah, Hodiah, Shebaniah, and Pethahiah -- said, &quot;Stand up. Blessed be the LORD your God from everlasting to everlasting.&quot; Blessed be your glorious name, and may it be exalted above all blessing and praise.";
csb[6] = "You, LORD, are the only God. You created the heavens, the highest heavens with all their stars, the earth and all that is on it, the seas and all that is in them. You give life to all of them, and all the stars of heaven worship you.";
csb[7] = "You, the LORD, are the God who chose Abram and brought him out of Ur of the Chaldeans, and changed his name to Abraham.";
csb[8] = "You found his heart faithful in your sight, and made a covenant with him to give the land of the Canaanites, Hethites, Amorites, Perizzites, Jebusites, and Girgashites -- to give it to his descendants. You have fulfilled your promise, for you are righteous.";
csb[9] = "You saw the oppression of our ancestors in Egypt and heard their cry at the Red Sea.";
csb[10] = "You performed signs and wonders against Pharaoh, all his officials, and all the people of his land, for you knew how arrogantly they treated our ancestors. You made a name for yourself that endures to this day.";
csb[11] = "You divided the sea before them, and they crossed through it on dry ground. You hurled their pursuers into the depths like a stone into raging water.";
csb[12] = "You led them with a pillar of cloud by day, and with a pillar of fire by night, to illuminate the way they should go.";
csb[13] = "You came down on Mount Sinai, and spoke to them from heaven. You gave them impartial ordinances, reliable instructions, and good statutes and commands.";
csb[14] = "You revealed your holy Sabbath to them, and gave them commands, statutes, and instruction through your servant Moses.";
csb[15] = "You provided bread from heaven for their hunger; you brought them water from the rock for their thirst. You told them to go in and possess the land you had sworn to give them.";
csb[16] = "But our ancestors acted arrogantly; they became stiff-necked and did not listen to your commands.";
csb[17] = "They refused to listen and did not remember your wonders you performed among them. They became stiff-necked and appointed a leader to return to their slavery in Egypt. But you are a forgiving God, gracious and compassionate, slow to anger and abounding in faithful love, and you did not abandon them.";
csb[18] = "Even after they had cast an image of a calf for themselves and said, &quot;This is your god who brought you out of Egypt,&quot; and they had committed terrible blasphemies,";
csb[19] = "you did not abandon them in the wilderness because of your great compassion. During the day the pillar of cloud never turned away from them, guiding them on their journey. And during the night the pillar of fire illuminated the way they should go.";
csb[20] = "You sent your good Spirit to instruct them. You did not withhold your manna from their mouths, and you gave them water for their thirst.";
csb[21] = "You provided for them in the wilderness forty years, and they lacked nothing. Their clothes did not wear out, and their feet did not swell.";
csb[22] = "You gave them kingdoms and peoples and established boundaries for them. They took possession of the land of King Sihon of Heshbon and of the land of King Og of Bashan.";
csb[23] = "You multiplied their descendants like the stars of the sky and brought them to the land you told their ancestors to go in and possess.";
csb[24] = "So their descendants went in and possessed the land: You subdued the Canaanites who inhabited the land before them and handed their kings and the surrounding peoples over to them, to do as they pleased with them.";
csb[25] = "They captured fortified cities and fertile land and took possession of well-supplied houses, cisterns cut out of rock, vineyards, olive groves, and fruit trees in abundance. They ate, were filled, became prosperous, and delighted in your great goodness.";
csb[26] = "But they were disobedient and rebelled against you. They flung your law behind their backs and killed your prophets who warned them in order to turn them back to you. They committed terrible blasphemies.";
csb[27] = "So you handed them over to their enemies, who oppressed them. In their time of distress, they cried out to you, and you heard from heaven. In your abundant compassion you gave them deliverers, who rescued them from the power of their enemies.";
csb[28] = "But as soon as they had relief, they again did what was evil in your sight. So you abandoned them to the power of their enemies, who dominated them. When they cried out to you again, you heard from heaven and rescued them many times in your compassion.";
csb[29] = "You warned them to turn back to your law, but they acted arrogantly and would not obey your commands. They sinned against your ordinances, which a person will live by if he does them. They stubbornly resisted, stiffened their necks, and would not obey.";
csb[30] = "You were patient with them for many years, and your Spirit warned them through your prophets, but they would not listen. Therefore, you handed them over to the surrounding peoples.";
csb[31] = "However, in your abundant compassion, you did not destroy them or abandon them, for you are a gracious and compassionate God.";
csb[32] = "So now, our God -- the great, mighty, and awe-inspiring God who keeps his gracious covenant -- do not view lightly all the hardships that have afflicted us, our kings and leaders, our priests and prophets, our ancestors and all your people, from the days of the Assyrian kings until today.";
csb[33] = "You are righteous concerning all that has happened to us, because you have acted faithfully, while we have acted wickedly.";
csb[34] = "Our kings, leaders, priests, and ancestors did not obey your law or listen to your commands and warnings you gave them.";
csb[35] = "When they were in their kingdom, with your abundant goodness that you gave them, and in the spacious and fertile land you set before them, they would not serve you or turn from their wicked ways.";
csb[36] = "Here we are today, slaves in the land you gave our ancestors so that they could enjoy its fruit and its goodness. Here we are -- slaves in it!";
csb[37] = "Its abundant harvest goes to the kings you have set over us, because of our sins. They rule over our bodies and our livestock as they please. We are in great distress.";
csb[38] = "In view of all this, we are making a binding agreement in writing on a sealed document containing the names of our leaders, Levites, and priests.";
kjv[1] = "Now in the twenty and fourth day of this month the children of Israel were assembled with fasting, and with sackclothes, and earth upon them.";
kjv[2] = "And the seed of Israel separated themselves from all strangers, and stood and confessed their sins, and the iniquities of their fathers.";
kjv[3] = "And they stood up in their place, and read in the book of the law of the LORD their God [one] fourth part of the day; and [another] fourth part they confessed, and worshipped the LORD their God.";
kjv[4] = "Then stood up upon the stairs, of the Levites, Jeshua, and Bani, Kadmiel, Shebaniah, Bunni, Sherebiah, Bani, [and] Chenani, and cried with a loud voice unto the LORD their God.";
kjv[5] = "Then the Levites, Jeshua, and Kadmiel, Bani, Hashabniah, Sherebiah, Hodijah, Shebaniah, [and] Pethahiah, said, Stand up [and] bless the LORD your God for ever and ever: and blessed be thy glorious name, which is exalted above all blessing and praise.";
kjv[6] = "Thou, [even] thou, [art] LORD alone; thou hast made heaven, the heaven of heavens, with all their host, the earth, and all [things] that [are] therein, the seas, and all that [is] therein, and thou preservest them all; and the host of heaven worshippeth thee.";
kjv[7] = "Thou [art] the LORD the God, who didst choose Abram, and broughtest him forth out of Ur of the Chaldees, and gavest him the name of Abraham;";
kjv[8] = "And foundest his heart faithful before thee, and madest a covenant with him to give the land of the Canaanites, the Hittites, the Amorites, and the Perizzites, and the Jebusites, and the Girgashites, to give [it, I say], to his seed, and hast performed thy words; for thou [art] righteous:";
kjv[9] = "And didst see the affliction of our fathers in Egypt, and heardest their cry by the Red sea;";
kjv[10] = "And shewedst signs and wonders upon Pharaoh, and on all his servants, and on all the people of his land: for thou knewest that they dealt proudly against them. So didst thou get thee a name, as [it is] this day.";
kjv[11] = "And thou didst divide the sea before them, so that they went through the midst of the sea on the dry land; and their persecutors thou threwest into the deeps, as a stone into the mighty waters.";
kjv[12] = "Moreover thou leddest them in the day by a cloudy pillar; and in the night by a pillar of fire, to give them light in the way wherein they should go.";
kjv[13] = "Thou camest down also upon mount Sinai, and spakest with them from heaven, and gavest them right judgments, and true laws, good statutes and commandments:";
kjv[14] = "And madest known unto them thy holy sabbath, and commandedst them precepts, statutes, and laws, by the hand of Moses thy servant:";
kjv[15] = "And gavest them bread from heaven for their hunger, and broughtest forth water for them out of the rock for their thirst, and promisedst them that they should go in to possess the land which thou hadst sworn to give them.";
kjv[16] = "But they and our fathers dealt proudly, and hardened their necks, and hearkened not to thy commandments,";
kjv[17] = "And refused to obey, neither were mindful of thy wonders that thou didst among them; but hardened their necks, and in their rebellion appointed a captain to return to their bondage: but thou [art] a God ready to pardon, gracious and merciful, slow to anger, and of great kindness, and forsookest them not.";
kjv[18] = "Yea, when they had made them a molten calf, and said, This [is] thy God that brought thee up out of Egypt, and had wrought great provocations;";
kjv[19] = "Yet thou in thy manifold mercies forsookest them not in the wilderness: the pillar of the cloud departed not from them by day, to lead them in the way; neither the pillar of fire by night, to shew them light, and the way wherein they should go.";
kjv[20] = "Thou gavest also thy good spirit to instruct them, and withheldest not thy manna from their mouth, and gavest them water for their thirst.";
kjv[21] = "Yea, forty years didst thou sustain them in the wilderness, [so that] they lacked nothing; their clothes waxed not old, and their feet swelled not.";
kjv[22] = "Moreover thou gavest them kingdoms and nations, and didst divide them into corners: so they possessed the land of Sihon, and the land of the king of Heshbon, and the land of Og king of Bashan.";
kjv[23] = "Their children also multipliedst thou as the stars of heaven, and broughtest them into the land, concerning which thou hadst promised to their fathers, that they should go in to possess [it].";
kjv[24] = "So the children went in and possessed the land, and thou subduedst before them the inhabitants of the land, the Canaanites, and gavest them into their hands, with their kings, and the people of the land, that they might do with them as they would.";
kjv[25] = "And they took strong cities, and a fat land, and possessed houses full of all goods, wells digged, vineyards, and oliveyards, and fruit trees in abundance: so they did eat, and were filled, and became fat, and delighted themselves in thy great goodness.";
kjv[26] = "Nevertheless they were disobedient, and rebelled against thee, and cast thy law behind their backs, and slew thy prophets which testified against them to turn them to thee, and they wrought great provocations.";
kjv[27] = "Therefore thou deliveredst them into the hand of their enemies, who vexed them: and in the time of their trouble, when they cried unto thee, thou heardest [them] from heaven; and according to thy manifold mercies thou gavest them saviours, who saved them out of the hand of their enemies.";
kjv[28] = "But after they had rest, they did evil again before thee: therefore leftest thou them in the hand of their enemies, so that they had the dominion over them: yet when they returned, and cried unto thee, thou heardest [them] from heaven; and many times didst thou deliver them according to thy mercies;";
kjv[29] = "And testifiedst against them, that thou mightest bring them again unto thy law: yet they dealt proudly, and hearkened not unto thy commandments, but sinned against thy judgments, (which if a man do, he shall live in them;) and withdrew the shoulder, and hardened their neck, and would not hear.";
kjv[30] = "Yet many years didst thou forbear them, and testifiedst against them by thy spirit in thy prophets: yet would they not give ear: therefore gavest thou them into the hand of the people of the lands.";
kjv[31] = "Nevertheless for thy great mercies\' sake thou didst not utterly consume them, nor forsake them; for thou [art] a gracious and merciful God.";
kjv[32] = "Now therefore, our God, the great, the mighty, and the terrible God, who keepest covenant and mercy, let not all the trouble seem little before thee, that hath come upon us, on our kings, on our princes, and on our priests, and on our prophets, and on our fathers, and on all thy people, since the time of the kings of Assyria unto this day.";
kjv[33] = "Howbeit thou [art] just in all that is brought upon us; for thou hast done right, but we have done wickedly:";
kjv[34] = "Neither have our kings, our princes, our priests, nor our fathers, kept thy law, nor hearkened unto thy commandments and thy testimonies, wherewith thou didst testify against them.";
kjv[35] = "For they have not served thee in their kingdom, and in thy great goodness that thou gavest them, and in the large and fat land which thou gavest before them, neither turned they from their wicked works.";
kjv[36] = "Behold, we [are] servants this day, and [for] the land that thou gavest unto our fathers to eat the fruit thereof and the good thereof, behold, we [are] servants in it:";
kjv[37] = "And it yieldeth much increase unto the kings whom thou hast set over us because of our sins: also they have dominion over our bodies, and over our cattle, at their pleasure, and we [are] in great distress.";
kjv[38] = "And because of all this we make a sure [covenant], and write [it]; and our princes, Levites, [and] priests, seal [unto it].";

asv[5] = "Then the Levites, Jeshua, and Kadmiel, Bani, Hashabneiah, Sherebiah, Hodiah, Shebaniah, [and] Pethahiah, said, Stand up and bless Jehovah your God from everlasting to everlasting; and blessed be thy glorious name, which is exalted above all blessing and praise.";
yng[5] = "And the Levites say, [even] Jeshua, and Kadmiel, Bani, Hashabniah, Sherebiah, Hodijah, Shebaniah, Pethahiah, `Rise, bless Jehovah your God, from the age unto the age, and they bless the name of Thine honour that [is] exalted above all blessing and praise.";
dby[5] = "And the Levites, Jeshua, and Kadmiel, Bani, Hashabniah, Sherebiah, Hodijah, Shebaniah, Pethahiah, said, Stand up, bless Jehovah your God from eternity to eternity. And let [men] bless the name of thy glory, which is exalted above all blessing and praise.";

hnv[5] = "Then the Levites, Yeshua, and Kadmi\'el, Bani, Hashavneyah, Sherevyah, Hodiyah, Shevanyah, [and] Petachyah, said, Stand up and bless the LORD your God from everlasting to everlasting; and blessed be your glorious name, which is exalted above all blessing and praise.";

rsv[6] = "And Ezra said: &quot;Thou art the LORD, thou alone; thou hast made heaven, the heaven of heavens, with all their host, the earth and all that is on it, the seas and all that is in them; and thou preservest all of them; and the host of heaven worships thee.";
asv[6] = "Thou art Jehovah, even thou alone; thou hast made heaven, the heaven of heavens, with all their host, the earth and all things that are thereon, the seas and all that is in them, and thou preservest them all; and the host of heaven worshippeth thee.";
yng[6] = "Thou [art] He, O Jehovah, Thyself -- Thou hast made the heavens, the heavens of the heavens, and all their host, the earth and all that [are] on it, the seas and all that [are] in them, and Thou art keeping all of them alive, and the host of the heavens to Thee are bowing themselves.";
dby[6] = "Thou art the Same, thou alone, Jehovah, who hast made the heaven of heavens, and all their host, the earth and all that is therein, the seas and all that is therein. And thou quickenest them all; and the host of heaven worshippeth thee.";
web[6] = "Thou, [even] thou, [art] LORD alone; thou hast made heaven, the heaven of heavens, with all their host, the earth, and all [things] that [are] in it, the seas, and all that [is] in them, and thou preservest them all; and the host of heaven worshipeth thee.";
hnv[6] = "You are the LORD, even you alone; you have made heaven, the heaven of heavens, with all their host, the eretz and all things that are thereon, the seas and all that is in them, and you preserve them all; and the host of heaven worships you.";
vul[6] = "tu ipse Domine solus tu fecisti caelum caelum caelorum et omnem exercitum eorum terram et universa quae in ea sunt maria et omnia quae in eis sunt et tu vivificas omnia haec et exercitus caeli te adorat";
rsv[7] = "Thou art the LORD, the God who didst choose Abram and bring him forth out of Ur of the Chalde\'ans and give him the name Abraham;";

asv[8] = "and foundest his heart faithful before thee, and madest a covenant with him to give the land of the Canaanite, the Hittite, the Amorite, and the Perizzite, and the Jebusite, and the Girgashite, to give it unto his seed, and hast performed thy words; for thou art righteous.";
yng[8] = "and didst find his heart stedfast before Thee, so as to make with him the covenant, to give the land of the Canaanite, the Hittite, the Amorite, and the Perizzite, and the Jebusite, and the Girgashite, to give [it] to his seed. `And Thou dost establish Thy words, for Thou [art] righteous,";

asv[10] = "and showedst signs and wonders upon Pharaoh, and on all his servants, and on all the people of his land; for thou knewest that they dealt proudly against them, and didst get thee a name, as it is this day.";
yng[10] = "and dost give signs and wonders on Pharaoh, and on all his servants, and on all the people of his land, for Thou hast known that they have acted proudly against them, and Thou makest to Thee a name as [at] this day.";
dby[10] = "and didst shew signs and wonders upon Pharaoh, and upon all his servants, and upon all the people of his land; for thou knewest that they dealt proudly against them, and thou didst make thee a name, as it is this day.";
web[10] = "And shewedst signs and wonders upon Pharaoh, and on all his servants, and on all the people of his land: for thou knewest that they dealt proudly against them. So didst thou get thee a name, as [it is] this day.";
hnv[10] = "and shown signs and wonders on Par`oh, and on all his servants, and on all the people of his land; for you knew that they dealt proudly against them, and did get you a name, as it is this day.";
vul[10] = "et dedisti signa et portenta in Pharao et in universis servis eius et in omni populo terrae illius cognovisti enim quia superbe egerant contra eos et fecisti tibi nomen sicut et in hac die";
rsv[11] = "And thou didst divide the sea before them, so that they went through the midst of the sea on dry land; and thou didst cast their pursuers into the depths, as a stone into mighty waters.";
asv[11] = "And thou didst divide the sea before them, so that they went through the midst of the sea on the dry land; and their pursuers thou didst cast into the depths, as a stone into the mighty waters.";
yng[11] = "And the sea Thou hast cleaved before them, and they pass over into the midst of the sea on the dry land, and their pursuers Thou hast cast into the depths, as a stone, into the strong waters.";
dby[11] = "And thou didst divide the sea before them, and they went through the midst of the sea on dry [ground]; and their pursuers thou threwest into the depths, as a stone into the mighty waters.";
web[11] = "And thou didst divide the sea before them, so that they went through the midst of the sea on the dry land; and their persecutors thou threwest into the deeps, as a stone into the mighty waters.";
hnv[11] = "You divided the sea before them, so that they went through the midst of the sea on the dry land; and their pursuers you did cast into the depths, as a stone into the mighty waters.";
vul[11] = "et mare divisisti ante eos et transierunt per medium maris in sicca persecutores autem eorum proiecisti in profundum quasi lapidem in aquas validas";
rsv[12] = "By a pillar of cloud thou didst lead them in the day, and by a pillar of fire in the night to light for them the way in which they should go.";
asv[12] = "Moreover in a pillar of cloud thou leddest them by day; and in a pillar of fire by night, to give them light in the way wherein they should go.";
yng[12] = "And by a pillar of cloud Thou hast led them by day, and by a pillar of fire by night, to lighten to them the way in which they go.";
dby[12] = "And thou leddest them in the day by a pillar of cloud, and in the night by a pillar of fire, to give them light in the way wherein they should go.";
web[12] = "Moreover, thou leddest them in the day by a cloudy pillar; and in the night by a pillar of fire, to give them light in the way in which they should go.";
hnv[12] = "Moreover in a pillar of cloud you led them by day; and in a pillar of fire by night, to give them light in the way in which they should go.";
vul[12] = "et in columna nubis ductor eorum fuisti per diem et in columna ignis per noctem ut appareret eis via per quam ingrediebantur";
rsv[13] = "Thou didst come down upon Mount Sinai, and speak with them from heaven and give them right ordinances and true laws, good statutes and commandments,";
asv[13] = "Thou camest down also upon mount Sinai, and spakest with them from heaven, and gavest them right ordinances and true laws, good statutes and commandments,";
yng[13] = "`And on mount Sinai Thou hast come down, even to speak with them from the heavens, and Thou dost give to them right judgments, and true laws, good statutes and commands.";
dby[13] = "And thou camest down on mount Sinai, and didst speak with them from the heavens, and gavest them right judgments and true laws, good statutes and commandments.";
web[13] = "Thou camest down also upon mount Sinai, and spokest with them from heaven, and gavest them right judgments, and true laws, good statutes and commandments:";
hnv[13] = "You came down also on Mount Sinai, and spoke with them from heaven, and gave them right ordinances and true laws, good statutes and mitzvot,";
vul[13] = "ad montem quoque Sinai descendisti et locutus es cum eis de caelo et dedisti eis iudicia recta et legem veritatis caerimonias et praecepta bona";
rsv[14] = "and thou didst make known to them thy holy sabbath and command them commandments and statutes and a law by Moses thy servant.";
asv[14] = "and madest known unto them thy holy sabbath, and commandedst them commandments, and statutes, and a law, by Moses thy servant,";
yng[14] = "And Thy holy sabbath Thou hast made known to them, and commands, and statutes, and law, Thou hast commanded for them, by the hand of Moses Thy servant;";
dby[14] = "And thou madest known unto them thy holy sabbath, and prescribedst for them commandments and statutes and a law, through Moses thy servant.";
web[14] = "And madest known to them thy holy sabbath, and commandedst them precepts, statutes, and laws, by the hand of Moses thy servant:";
hnv[14] = " and mad known to them your holy Shabbat, and commanded them mitzvot, and statutes, and a law, by Moshe your servant,";
vul[14] = "et sabbatum sanctificatum tuum ostendisti eis et mandata et caerimonias et legem praecepisti eis in manu Mosi servi tui";
rsv[15] = "Thou didst give them bread from heaven for their hunger and bring forth water for them from the rock for their thirst, and thou didst tell them to go in to possess the land which thou hadst sworn to give them.";
asv[15] = "and gavest them bread from heaven for their hunger, and broughtest forth water for them out of the rock for their thirst, and commandedst them that they should go in to possess the land which thou hadst sworn to give them.";
yng[15] = "and bread from the heavens Thou hast given to them for their hunger, and water from a rock hast brought out to them for their thirst, and dost say to them to go in to possess the land that Thou hast lifted up Thy hand to give to them.";
dby[15] = "And thou gavest them bread from the heavens for their hunger, and broughtest forth water for them out of the rock for their thirst, and didst say to them that they should go in to possess the land which thou hadst sworn to give them.";
web[15] = "And gavest them bread from heaven for their hunger, and broughtest forth water for them out of the rock for their thirst, and promisedst them that they should go in to possess the land which thou hadst sworn to give them.";
hnv[15] = "and gave them bread from the sky for their hunger, and brought forth water for them out of the rock for their thirst, and commanded those who they should go in to possess the land which you had sworn to give them.";
vul[15] = "panem quoque de caelo dedisti eis in fame eorum et aquam de petra eduxisti eis sitientibus et dixisti eis ut ingrederentur et possiderent terram super quam levasti manum tuam ut traderes eis";
rsv[16] = "&quot;But they and our fathers acted presumptuously and stiffened their neck and did not obey thy commandments;";
asv[16] = "But they and our fathers dealt proudly, and hardened their neck, and hearkened not to thy commandments,";
yng[16] = "`And they and our fathers have acted proudly, and harden their neck, and have not hearkened unto Thy commands,";
dby[16] = "But they, our fathers, dealt proudly, and hardened their neck, and hearkened not to thy commandments,";
web[16] = "But they and our fathers dealt proudly, and hardened their necks, and hearkened not to thy commandments,";
hnv[16] = "But they and our fathers dealt proudly and hardened their neck, and didn\'t listen to your mitzvot,";
vul[16] = "ipsi vero et patres nostri superbe egerunt et induraverunt cervices suas et non audierunt mandata tua";
rsv[17] = "they refused to obey, and were not mindful of the wonders which thou didst perform among them; but they stiffened their neck and appointed a leader to return to their bondage in Egypt. But thou art a God ready to forgive, gracious and merciful, slow to anger and abounding in steadfast love, and didst not forsake them.";
asv[17] = "and refused to obey, neither were mindful of thy wonders that thou didst among them, but hardened their neck, and in their rebellion appointed a captain to return to their bondage. But thou art a God ready to pardon, gracious and merciful, slow to anger, and abundant in lovingkindness, and forsookest them not.";
yng[17] = "yea, they refuse to hearken, and have not remembered Thy wonders that Thou hast done with them, and harden their neck and appoint a head, to turn back to their service, in their rebellion; and Thou [art] a God of pardons, gracious, and merciful, long-suffering, and abundant in kindness, and hast not forsaken them.";
dby[17] = "and refused to obey, neither were they mindful of thy wonders which thou hadst done among them; but hardened their neck, and in their rebellion made a captain to return to their bondage. But thou art a God ready to forgive, gracious and merciful, slow to anger and of great loving-kindness, and thou forsookest them not.";
web[17] = "And refused to obey, neither were mindful of thy wonders that thou didst perform among them; but hardened their necks, and in their rebellion appointed a captain to return to their bondage: but thou [art] a God ready to pardon, gracious and merciful, slow to anger, and of great kindness, and forsookest them not.";
hnv[17] = "and refused to obey, neither were mindful of your wonders that you did among them, but hardened their neck, and in their rebellion appointed a captain to return to their bondage. But you are a God ready to pardon, gracious and merciful, slow to anger, and abundant in lovingkindness, and didn\'t forsake them.";
vul[17] = "et noluerunt audire et non sunt recordati mirabilium tuorum quae feceras eis et induraverunt cervices suas et dederunt caput ut converterentur ad servitutem suam quasi per contentionem tu autem Deus propitius clemens et misericors longanimis et multae miserationis non dereliquisti eos";
rsv[18] = "Even when they had made for themselves a molten calf and said, \'This is your God who brought you up out of Egypt,\' and had committed great blasphemies,";
asv[18] = "Yea, when they had made them a molten calf, and said, This is thy God that brought thee up out of Egypt, and had wrought great provocations;";
yng[18] = "`Also, when they have made to themselves a molten calf, and say, this [is] thy god that brought thee up out of Egypt, and do great despisings,";
dby[18] = "Yea, when they had made them a molten calf, and said, This is thy god that brought thee up out of Egypt! and they had wrought great provocation,";
web[18] = "Yea, when they had made them a molten calf, and said, This [is] thy God that brought thee out of Egypt, and had wrought great provocations;";
hnv[18] = "Yes, when they had made them a molten calf, and said, This is your God who brought you up out of Mitzrayim, and had committed awful blasphemies;";
vul[18] = "et quidem cum fecissent sibi vitulum conflatilem et dixissent iste est Deus tuus qui eduxit te de Aegypto feceruntque blasphemias magnas";
rsv[19] = "thou in thy great mercies didst not forsake them in the wilderness; the pillar of cloud which led them in the way did not depart from them by day, nor the pillar of fire by night which lighted for them the way by which they should go.";
asv[19] = "yet thou in thy manifold mercies forsookest them not in the wilderness: the pillar of cloud departed not from over them by day, to lead them in the way; neither the pillar of fire by night, to show them light, and the way wherein they should go.";
yng[19] = "and Thou, in Thine abundant mercies, hast not forsaken them in the wilderness -- the pillar of the cloud hath not turned aside from off them by day, to lead them in the way, and the pillar of the fire by night, to give light to them and the way in which they go.";
dby[19] = "yet thou in thy manifold mercies forsookest them not in the wilderness. The pillar of the cloud departed not from over them by day, to lead them on the way; neither the pillar of fire by night, to shew them light, and the way wherein they should go.";
web[19] = "Yet thou in thy manifold mercies forsookest them not in the wilderness: the pillar of the cloud departed not from them by day, to lead them in the way; neither the pillar of fire by night, to show them light, and the way in which they should go.";
hnv[19] = "yet you in your manifold mercies didn\'t forsake them in the wilderness: the pillar of cloud didn\'t depart from over them by day, to lead them in the way; neither the pillar of fire by night, to show them light, and the way in which they should go.";
vul[19] = "tu autem in misericordiis tuis multis non dimisisti eos in deserto columna nubis non recessit ab eis per diem ut duceret eos in via et columna ignis in nocte ut ostenderet eis iter per quod ingrederentur";
rsv[20] = "Thou gavest thy good Spirit to instruct them, and didst not withhold thy manna from their mouth, and gavest them water for their thirst.";
asv[20] = "Thou gavest also thy good Spirit to instruct them, and withheldest not thy manna from their mouth, and gavest them water for their thirst.";
yng[20] = "`And Thy good Spirit Thou hast given, to cause them to act wisely; and Thy manna Thou hast not withheld from their mouth, and water Thou hast given to them for their thirst,";
dby[20] = "Thou gavest also thy good Spirit to instruct them, and withheldest not thy manna from their mouth, and gavest them water for their thirst.";
web[20] = "Thou gavest also thy good spirit to instruct them, and withheldest not thy manna from their mouth, and gavest them water for their thirst.";
hnv[20] = " You gave also your good Spirit to instruct them, and didn\'t withhold your manna from their mouth, and gave them water for their thirst.";
vul[20] = "et spiritum tuum bonum dedisti qui doceret eos et manna tuum non prohibuisti ab ore eorum et aquam dedisti eis in siti";
rsv[21] = "Forty years didst thou sustain them in the wilderness, and they lacked nothing; their clothes did not wear out and their feet did not swell.";
asv[21] = "Yea, forty years didst thou sustain them in the wilderness, [and] they lacked nothing; their clothes waxed not old, and their feet swelled not.";
yng[21] = "and forty years Thou hast nourished them in a wilderness; they have not lacked; their garments have not worn out, and their feet have not swelled.";
dby[21] = "Yea, forty years didst thou sustain them in the wilderness; they lacked nothing; their clothes grew not old, and their feet swelled not.";
web[21] = "Yea, forty years didst thou sustain them in the wilderness, [so that] they lacked nothing; their clothes grew not old, and their feet swelled not.";
hnv[21] = "Yes, forty years did you sustain them in the wilderness, [and] they lacked nothing; their clothes didn\'t grow old, and their feet didn\'t swell.";
vul[21] = "quadraginta annis pavisti eos in deserto nihilque eis defuit vestimenta eorum non inveteraverunt et pedes eorum non sunt adtriti";
rsv[22] = "And thou didst give them kingdoms and peoples, and didst allot to them every corner; so they took possession of the land of Sihon king of Heshbon and the land of Og king of Bashan.";
asv[22] = "Moreover thou gavest them kingdoms and peoples, which thou didst allot after their portions: so they possessed the land of Sihon, even the land of the king of Heshbon, and the land of Og king of Bashan.";
yng[22] = "`And Thou givest to them kingdoms, and peoples, and dost apportion them to the corner, and they possess the land of Sihon, and the land of the king of Heshbon, and the land of Og king of Bashan.";
dby[22] = "And thou gavest them kingdoms and peoples, and didst divide them by countries; and they possessed the land of Sihon, as well the land of the king of Heshbon, as the land of Og king of Bashan.";
web[22] = "Moreover, thou gavest them kingdoms and nations, and didst divide them into corners: so they possessed the land of Sihon, and the land of the king of Heshbon, and the land of Og king of Bashan.";
hnv[22] = "Moreover you gave them kingdoms and peoples, which you did allot after their portions: so they possessed the land of Sichon, even the land of the king of Heshbon, and the land of `Og king of Bashan.";
vul[22] = "et dedisti eis regna et populos et partitus es eis sortes et possederunt terram Seon et terram regis Esebon et terram Og regis Basan";
rsv[23] = "Thou didst multiply their descendants as the stars of heaven, and thou didst bring them into the land which thou hadst told their fathers to enter and possess.";
asv[23] = "Their children also multipliedst thou as the stars of heaven, and broughtest them into the land concerning which thou didst say to their fathers, that they should go in to possess it.";
yng[23] = "And their sons Thou hast multiplied as the stars of the heavens, and bringest them in unto the land that Thou hast said to their fathers to go in to possess.";
dby[23] = "And their children thou didst multiply as the stars of heaven, and thou broughtest them into the land concerning which thou didst say to their fathers that they should go in to possess it.";
web[23] = "Their children also multipliedst thou as the stars of heaven, and broughtest them into the land, concerning which thou hadst promised to their fathers, that they should go in to possess [it].";
hnv[23] = "Their children also multiplied you as the stars of the sky, and brought them into the land concerning which you did say to their fathers, that they should go in to possess it.";
vul[23] = "et filios eorum multiplicasti sicut stellas caeli et adduxisti eos ad terram de qua dixeras patribus eorum ut ingrederentur et possiderent";
rsv[24] = "So the descendants went in and possessed the land, and thou didst subdue before them the inhabitants of the land, the Canaanites, and didst give them into their hands, with their kings and the peoples of the land, that they might do with them as they would.";
asv[24] = "So the children went in and possessed the land, and thou subduedst before them the inhabitants of the land, the Canaanites, and gavest them into their hands, with their kings, and the peoples of the land, that they might do with them as they would.";
yng[24] = "`And the sons come in, and possess the land, and Thou humblest before them the inhabitants of the land, the Canaanites, and givest them into their hand, and their kings, and the peoples of the land, to do with them according to their pleasure.";
dby[24] = "And the children went in and possessed the land; and thou subduedst before them the inhabitants of the land, the Canaanites, and gavest them into their hands, both their kings and the peoples of the land, that they might do with them as they would.";
web[24] = "So the children went in and possessed the land, and thou subduedst before them the inhabitants of the land, the Canaanites, and gavest them into their hands, with their kings, and the people of the land, that they might do with them as they would.";
hnv[24] = "So the children went in and possessed the land, and you subdued before them the inhabitants of the land, the Kana`anim, and gave them into their hands, with their kings, and the peoples of the land, that they might do with them as they would.";
vul[24] = "et venerunt filii et possederunt terram et humiliasti coram eis habitatores terrae Chananeos et dedisti eos in manu eorum et reges eorum et populos terrae ut facerent eis sicut placebat illis";
rsv[25] = "And they captured fortified cities and a rich land, and took possession of houses full of all good things, cisterns hewn out, vineyards, olive orchards and fruit trees in abundance; so they ate, and were filled and became fat, and delighted themselves in thy great goodness.";
asv[25] = "And they took fortified cities, and a fat land, and possessed houses full of all good things, cisterns hewn out, vineyards, and oliveyards, and fruit-trees in abundance: so they did eat, and were filled, and became fat, and delighted themselves in thy great goodness.";
yng[25] = "And they capture fenced cities, and fat ground, and possess houses full of all good, digged-wells, vineyards, and olive-yards, and fruit-trees in abundance, and they eat, and are satisfied, and become fat, and delight themselves in Thy great goodness.";
dby[25] = "And they took strong cities, and a fat land, and possessed houses full of all good things, wells digged, vineyards and olive-gardens, and fruit trees in abundance. And they did eat and were filled, and became fat, and delighted themselves in thy great goodness.";
web[25] = "And they took strong cities, and a fat land, and possessed houses full of all goods, wells digged, vineyards and olive-yards, and fruit trees in abundance: so they ate and were filled, and became fat, and delighted themselves in thy great goodness.";
hnv[25] = "They took fortified cities, and a fat land, and possessed houses full of all good things, cisterns hewn out, vineyards, and olive groves, and fruit trees in abundance: so they ate, and were filled, and became fat, and delighted themselves in your great goodness.";
vul[25] = "ceperunt itaque urbes munitas et humum pinguem et possederunt domos plenas cunctis bonis cisternas ab aliis fabricatas vineas et oliveta et ligna pomifera multa et comederunt et saturati sunt et inpinguati sunt et abundavere deliciis in bonitate tua magna";
rsv[26] = "&quot;Nevertheless they were disobedient and rebelled against thee and cast thy law behind their back and killed thy prophets, who had warned them in order to turn them back to thee, and they committed great blasphemies.";
asv[26] = "Nevertheless they were disobedient, and rebelled against thee, and cast thy law behind their back, and slew thy prophets that testified against them to turn them again unto thee, and they wrought great provocations.";
yng[26] = "`And they are disobedient, and rebel against Thee, and cast Thy law behind their back, and Thy prophets they have slain, who testified against them, to bring them back unto Thee, and they do great despisings,";
dby[26] = "But they were disobedient, and rebelled against thee, and cast thy law behind their backs, and slew thy prophets who testified against them to turn them to thee, and they wrought great provocations.";
web[26] = "Nevertheless, they were disobedient, and rebelled against thee, and cast thy law behind their backs, and slew thy prophets who testified against them to turn them to thee, and they wrought great provocations.";
hnv[26] = "Nevertheless they were disobedient, and rebelled against you, and cast your law behind their back, and killed your prophets that testified against them to turn them again to you, and they committed awful blasphemies.";
vul[26] = "provocaverunt autem te ad iracundiam et recesserunt a te et proiecerunt legem tuam post terga sua et prophetas tuos occiderunt qui contestabantur eos ut reverterentur ad te feceruntque blasphemias grandes";
rsv[27] = "Therefore thou didst give them into the hand of their enemies, who made them suffer; and in the time of their suffering they cried to thee and thou didst hear them from heaven; and according to thy great mercies thou didst give them saviors who saved them from the hand of their enemies.";
asv[27] = "Therefore thou deliveredst them into the hand of their adversaries, who distressed them: and in the time of their trouble, when they cried unto thee, thou heardest from heaven; and according to thy manifold mercies thou gavest them saviours who saved them out of the hand of their adversaries.";
yng[27] = "and Thou givest them into the hand of their adversaries, and they distress them, and in the time of their distress they cry unto Thee, and Thou, from the heavens, dost hear, and, according to Thine abundant mercies, dost give to them saviours, and they save them out of the hand of their adversaries.";
dby[27] = "And thou gavest them into the hand of their oppressors, and they oppressed them; and in the time of their distress, when they cried unto thee, thou heardest them from the heavens, and according to thy manifold mercies thou gavest them saviours, who saved them out of the hand of their oppressors.";
web[27] = "Therefore thou deliveredst them into the hand of their enemies, who distressed them: and in the time of their trouble, when they cried to thee, thou hearedest [them] from heaven; and according to thy manifold mercies thou gavest them deliverers, who saved them out of the hand of their enemies.";
hnv[27] = "Therefore you delivered them into the hand of their adversaries, who distressed them: and in the time of their trouble, when they cried to you, you heard from heaven; and according to your manifold mercies you gave them saviors who saved them out of the hand of their adversaries.";
vul[27] = "et dedisti eos in manu hostium suorum et adflixerunt eos et in tempore tribulationis suae clamaverunt ad te et tu de caelo audisti et secundum miserationes tuas multas dedisti eis salvatores qui salvaverunt eos de manu hostium suorum";
rsv[28] = "But after they had rest they did evil again before thee, and thou didst abandon them to the hand of their enemies, so that they had dominion over them; yet when they turned and cried to thee thou didst hear from heaven, and many times thou didst deliver them according to thy mercies.";
asv[28] = "But after they had rest, they did evil again before thee; therefore leftest thou them in the hand of their enemies, so that they had the dominion over them: yet when they returned, and cried unto thee, thou heardest from heaven; and many times didst thou deliver them according to thy mercies,";
yng[28] = "`And when they have rest, they turn back to do evil before Thee, and Thou dost leave them in the hand of their enemies, and they rule over them; and they turn back, and call Thee, and Thou from the heavens dost hear, and dost deliver them, according to Thy mercies, many times,";
dby[28] = "But when they had rest, they did evil again before thee; and thou didst leave them in the hand of their enemies, and they had dominion over them; and again they cried unto thee, and thou heardest [them] from the heavens, and many times didst thou deliver them, according to thy mercies.";
web[28] = "But after they had rest, they did evil again before thee: therefore thou leftest them in the hand of their enemies, so that they had the dominion over them: yet when they returned and cried to thee, thou hearedest [them] from heaven; and many times didst thou deliver them according to thy mercies;";
hnv[28] = "But after they had rest, they did evil again before you; therefore left you them in the hand of their enemies, so that they had the dominion over them: yet when they returned, and cried to you, you heard from heaven; and many times did you deliver them according to your mercies,";
vul[28] = "cumque requievissent reversi sunt ut facerent malum in conspectu tuo et dereliquisti eos in manu inimicorum suorum et possederunt eos conversique sunt et clamaverunt ad te tu autem de caelo audisti et liberasti eos in misericordiis tuis multis temporibus";
rsv[29] = "And thou didst warn them in order to turn them back to thy law. Yet they acted presumptuously and did not obey thy commandments, but sinned against thy ordinances, by the observance of which a man shall live, and turned a stubborn shoulder and stiffened their neck and would not obey.";
asv[29] = "and testifiedst against them, that thou mightest bring them again unto thy law. Yet they dealt proudly, and hearkened not unto thy commandments, but sinned against thine ordinances (which if a man do, he shall live in them), and withdrew the shoulder, and hardened their neck, and would not hear.";
yng[29] = "and dost testify against them, to bring them back unto Thy law; and they -- they have acted proudly, and have not hearkened to Thy commands, and against Thy judgments have sinned, -- which man doth and hath lived in them -- and they give a refractory shoulder, and their neck have hardened, and have not hearkened.";
dby[29] = "And thou testifiedst against them, that thou mightest bring them again unto thy law; but they dealt proudly, and hearkened not unto thy commandments, but sinned against thine ordinances (which if a man do, he shall live in them); and they withdrew the shoulder, and hardened their neck, and would not hear.";
web[29] = "And testifiedst against them, that thou mightest bring them again to thy law: yet they dealt proudly, and hearkened not to thy commandments, but sinned against thy judgments, (which if a man doeth, he shall live in them:) and withdrew the shoulder, and hardened their neck, and would not hear.";
hnv[29] = "and testified against them, that you might bring them again to your law. Yet they dealt proudly, and didn\'t listen to your mitzvot, but sinned against your ordinances, (which if a man do, he shall live in them,) and withdrew the shoulder, and hardened their neck, and would not hear.";
vul[29] = "et contestatus es eos ut reverterentur ad legem tuam ipsi vero superbe egerunt et non audierunt mandata tua et in iudiciis tuis peccaverunt quae faciet homo et vivet in eis et dederunt umerum recedentem et cervicem suam induraverunt nec audierunt";
rsv[30] = "Many years thou didst bear with them, and didst warn them by thy Spirit through thy prophets; yet they would not give ear. Therefore thou didst give them into the hand of the peoples of the lands.";
asv[30] = "Yet many years didst thou bear with them, and testifiedst against them by thy Spirit through thy prophets: yet would they not give ear: therefore gavest thou them into the hand of the peoples of the lands.";
yng[30] = "`And Thou drawest over them many years, and testifiest against them by Thy Spirit, by the hand of Thy prophets, and they have not given ear, and Thou dost give them into the hand of peoples of the lands,";
dby[30] = "And many years didst thou forbear with them, and testifiedst against them by thy Spirit through thy prophets; but they would not give ear: and thou gavest them into the hand of the peoples of the lands.";
web[30] = "Yet many years didst thou forbear over them, and testifiedst against them by thy spirit in thy prophets: yet would they not give ear: therefore thou gavest them into the hand of the people of the lands.";
hnv[30] = "Yet many years did you bear with them, and testified against them by your Spirit through your prophets: yet would they not give ear: therefore gave you them into the hand of the peoples of the lands.";
vul[30] = "et protraxisti super eos annos multos et contestatus es eos in spiritu tuo per manum prophetarum tuorum et non audierunt et tradidisti eos in manu populorum terrarum";
rsv[31] = "Nevertheless in thy great mercies thou didst not make an end of them or forsake them; for thou art a gracious and merciful God.";
asv[31] = "Nevertheless in thy manifold mercies thou didst not make a full end of them, nor forsake them; for thou art a gracious and merciful God.";
yng[31] = "and in Thine abundant mercies Thou hast not made them a consumption, nor hast forsaken them; for a God, gracious and merciful, [art] Thou.";
dby[31] = "Nevertheless for thy manifold mercies\' sake, thou didst not make a full end of them nor forsake them; for thou art a gracious and merciful God.";
web[31] = "Nevertheless, for thy great mercies\' sake thou didst not utterly consume them, nor forsake them; for thou [art] a gracious and merciful God.";
hnv[31] = "Nevertheless in your manifold mercies you did not make a full end of them, nor forsake them; for you are a gracious and merciful God.";
vul[31] = "in misericordiis autem tuis plurimis non fecisti eos in consumptione nec dereliquisti eos quoniam Deus miserationum et clemens tu es";
rsv[32] = "&quot;Now therefore, our God, the great and mighty and terrible God, who keepest covenant and steadfast love, let not all the hardship seem little to thee that has come upon us, upon our kings, our princes, our priests, our prophets, our fathers, and all thy people, since the time of the kings of Assyria until this day.";
asv[32] = "Now therefore, our God, the great, the mighty, and the terrible God, who keepest covenant and lovingkindness, let not all the travail seem little before thee, that hath come upon us, on our kings, on our princes, and on our priests, and on our prophets, and on our fathers, and on all thy people, since the time of the kings of Assyria unto this day.";
yng[32] = "`And now, O our God -- God, the great, the mighty, and the fearful, keeping the covenant and the kindness -- let not all the travail that hath found us be little before Thee, for our kings, for our heads, and for our priests, and for our prophets, and for our fathers, and for all Thy people, from the days of the kings of Asshur unto this day;";
dby[32] = "And now, our God, the great, the mighty, and the terrible God, who keepest covenant and loving-kindness, let not all the trouble seem little before thee, that hath come upon us, on our kings, on our princes, and on our priests, and on our prophets, and on our fathers, and on all thy people, since the days of the kings of Assyria unto this day.";
web[32] = "Now therefore, our God, the great, the mighty, and the terrible God, who keepest covenant and mercy, let not all the trouble seem little before thee, that hath come upon us, on our kings, on our princes, and on our priests, and on our prophets, and on our fathers, and on all thy people, since the time of the kings of Assyria to this day.";
hnv[32] = "Now therefore, our God, the great, the mighty, and the awesome God, who keep covenant and lovingkindness, don\'t let all the travail seem little before you, that has come on us, on our kings, on our princes, and on our Kohanim, and on our prophets, and on our fathers, and on all your people, since the time of the kings of Ashshur to this day.";
vul[32] = "nunc itaque Deus noster Deus magne fortis et terribilis custodiens pactum et misericordiam ne avertas a facie tua omnem laborem qui invenit nos reges nostros principes nostros et sacerdotes nostros prophetas nostros et patres nostros et omnem populum tuum a diebus regis Assur usque in diem hanc";
rsv[33] = "Yet thou hast been just in all that has come upon us, for thou hast dealt faithfully and we have acted wickedly;";
asv[33] = "Howbeit thou art just in all that is come upon us; for thou hast dealt truly, but we have done wickedly;";
yng[33] = "and Thou [art] righteous concerning all that hath come upon us, for truth Thou hast done, and we have done wickedly;";
dby[33] = "But thou art just in all that is come upon us; for thou hast acted according to truth, and we have done wickedly.";
web[33] = "But thou [art] just in all that is brought upon us; for thou hast done right, but we have done wickedly:";
hnv[33] = "However you are just in all that is come on us; for you have dealt truly, but we have done wickedly;";
vul[33] = "et tu iustus in omnibus quae venerunt super nos quia veritatem fecisti nos autem impie egimus";
rsv[34] = "our kings, our princes, our priests, and our fathers have not kept thy law or heeded thy commandments and thy warnings which thou didst give them.";
asv[34] = "neither have our kings, our princes, our priests, nor our fathers, kept thy law, nor hearkened unto thy commandments and thy testimonies wherewith thou didst testify against them.";
yng[34] = "and our kings, our heads, our priests, and our fathers, have not done Thy law, nor attended unto Thy commands, and to Thy testimonies, that Thou hast testified against them;";
dby[34] = "And our kings, our princes, our priests, and our fathers, have not performed thy law, nor hearkened unto thy commandments and thy testimonies, wherewith thou didst testify against them.";
web[34] = "Neither have our kings, our princes, our priests, nor our fathers, kept thy law, nor hearkened to thy commandments and thy testimonies, with which thou didst testify against them.";
hnv[34] = "neither have our kings, our princes, our Kohanim, nor our fathers, kept your law, nor listened to your mitzvot and your testimonies with which you did testify against them.";
vul[34] = "reges nostri principes nostri sacerdotes nostri et patres nostri non fecerunt legem tuam et non adtenderunt mandata tua et testimonia tua quae testificatus es in eis";
rsv[35] = "They did not serve thee in their kingdom, and in thy great goodness which thou gavest them, and in the large and rich land which thou didst set before them; and they did not turn from their wicked works.";
asv[35] = "For they have not served thee in their kingdom, and in thy great goodness that thou gavest them, and in the large and fat land which thou gavest before them, neither turned they from their wicked works.";
yng[35] = "and they, in their kingdom, and in Thine abundant goodness, that Thou hast given to them, and in the land, the large and the fat, that Thou hast set before them, have not served Thee, nor turned back from their evil doings.";
dby[35] = "And they have not served thee in their kingdom, and in thy great goodness that thou gavest them, and in the large and fat land that thou didst set before them, neither turned they from their wicked works.";
web[35] = "For they have not served thee in their kingdom, and in thy great goodness that thou gavest them, and in the large and fat land which thou gavest before them, neither turned they from their wicked works.";
hnv[35] = "For they have not served you in their kingdom, and in your great goodness that you gave them, and in the large and fat land which you gave before them, neither turned they from their wicked works.";
vul[35] = "et ipsi in regnis suis bonis et in bonitate tua multa quam dederas eis et in terra latissima et pingui quam tradideras in conspectu eorum non servierunt tibi nec reversi sunt ab studiis suis pessimis";
rsv[36] = "Behold, we are slaves this day; in the land that thou gavest to our fathers to enjoy its fruit and its good gifts, behold, we are slaves.";
asv[36] = "Behold, we are servants this day, and as for the land that thou gavest unto our fathers to eat the fruit thereof and the good thereof, behold, we are servants in it.";
yng[36] = "`Lo, we -- to-day -- [are] servants, and the land that Thou hast given to our fathers, to eat its fruit and its good -- lo, we [are] servants on it,";
dby[36] = "Behold, we are servants this day, and the land that thou gavest unto our fathers to eat the fruit thereof and the good thereof, behold, we are bondmen in it.";
web[36] = "Behold, we [are] servants this day, and [for] the land that thou gavest to our fathers to eat the fruit of it and the good of it, behold, we [are] servants in it:";
hnv[36] = "Behold, we are servants this day, and as for the land that you gave to our fathers to eat the fruit of it and the good of it, behold, we are servants in it.";
vul[36] = "ecce nos ipsi hodie servi sumus et terram quam dedisti patribus nostris ut comederent panem eius et quae bona sunt eius et nos ipsi servi sumus in ea";
rsv[37] = "And its rich yield goes to the kings whom thou hast set over us because of our sins; they have power also over our bodies and over our cattle at their pleasure, and we are in great distress.&quot;";
asv[37] = "And it yieldeth much increase unto the kings whom thou hast set over us because of our sins: also they have power over our bodies, and over our cattle, at their pleasure, and we are in great distress.";
yng[37] = "and its increase it is multiplying to the kings whom Thou hast set over us in our sins; and over our bodies they are ruling, and over our cattle, according to their pleasure, and we [are] in great distress.";
dby[37] = "And it yieldeth much increase unto the kings whom thou hast set over us because of our sins: and they have dominion over our bodies, and over our cattle, at their pleasure; and we are in great distress.";
web[37] = "And it yieldeth much increase to the kings whom thou hast set over us because of our sins: also they have dominion over our bodies, and over our cattle, at their pleasure, and we [are] in great distress.";
hnv[37] = "It yields much increase to the kings whom you have set over us because of our sins: also they have power over our bodies, and over our cattle, at their pleasure, and we are in great distress.";
vul[37] = "et fruges eius multiplicantur regibus quos posuisti super nos propter peccata nostra et in corporibus nostris dominantur et in iumentis nostris secundum voluntatem suam et in tribulatione magna sumus";
rsv[38] = "Because of all this we make a firm covenant and write it, and our princes, our Levites, and our priests set their seal to it.";
asv[38] = "And yet for all this we make a sure covenant, and write it; and our princes, our Levites, [and] our priests, seal unto it.";
yng[38] = "And for all this we are making a stedfast covenant, and are writing, and over him who is sealed [are] our heads, our Levites, our priests.\'";
dby[38] = "And because of all this we make a sure covenant, and write it; and our princes, our Levites, [and] our priests are at the sealing.";
web[38] = "And because of all this we make a sure [covenant], and write [it]; and our princes, Levites, [and] priests, set their seals [to it].";
hnv[38] = "Yet for all this we make a sure covenant, and write it; and our princes, our Levites, [and] our Kohanim, seal to it.";
vul[38] = "super omnibus ergo his nos ipsi percutimus foedus et scribimus et signant principes nostri Levitae nostri et sacerdotes nostri";
</script>
