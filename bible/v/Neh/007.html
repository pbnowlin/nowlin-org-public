csb[1] = "When the wall had been rebuilt and I had the doors installed, the gatekeepers, singers, and Levites were appointed.";
csb[2] = "Then I put my brother Hanani in charge of Jerusalem, along with Hananiah, commander of the fortress, because he was a faithful man who feared God more than most.";
csb[3] = "I said to them, &quot;Do not open the gates of Jerusalem until the sun is hot, and let the doors be shut and securely fastened while the guards are on duty. Station the citizens of Jerusalem as guards, some at their posts and some at their homes.&quot;";

rsv[3] = "And I said to them, &quot;Let not the gates of Jerusalem be opened until the sun is hot; and while they are still standing guard let them shut and bar the doors. Appoint guards from among the inhabitants of Jerusalem, each to his station and each opposite his own house.&quot;";
asv[3] = "And I said unto them, Let not the gates of Jerusalem be opened until the sun be hot; and while they stand [on guard], let them shut the doors, and bar ye them: and appoint watches of the inhabitants of Jerusalem, every one in his watch, and every one [to be] over against his house.";
yng[3] = "and I say to them, `Let not the gates of Jerusalem be opened till the heat of the sun, and while they are standing by let them shut the doors, and fasten, and appoint guards of the inhabitants of Jerusalem, each in his guard, and each over-against his house.\'";
dby[3] = "And I said to them that the gates of Jerusalem should not be opened until the sun was hot, and that they should shut the doors and bar them while they stood by; and that there should be appointed watches of the inhabitants of Jerusalem, every one in his watch, and every one over against his house.";
web[3] = "And I said to them, Let not the gates of Jerusalem be opened until the sun shall be hot; and while they stand by, let them shut the doors, and bar [them]: and appoint watches of the inhabitants of Jerusalem, every one in his watch, and every one [to be] over against his house.";
hnv[3] = "I said to them, Don\'t let the gates of Yerushalayim be opened until the sun be hot; and while they stand [on guard], let them shut the doors, and bar you them: and appoint watches of the inhabitants of Yerushalayim, everyone in his watch, and everyone [to be] over against his house.";

rsv[61] = "The following were those who came up from Tel-me\'lah, Tel-har\'sha, Cherub, Addon, and Immer, but they could not prove their fathers\' houses nor their descent, whether they belonged to Israel:";

yng[61] = "And these [are] those coming up from Tel-Melah, Tel-Harsha, Cherub, Addon, and Immer -- and they have not been able to declare the house of their fathers, and their seed, whether they [are] of Israel --";

rsv[63] = "Also, of the priests: the sons of Hobai\'ah, the sons of Hakkoz, the sons of Barzil\'lai (who had taken a wife of the daughters of Barzil\'lai the Gileadite and was called by their name).";

yng[64] = "These have sought their register among those reckoning themselves by genealogy, and it hath not been found, and they are redeemed from the priesthood,";

rsv[73] = "So the priests, the Levites, the gatekeepers, the singers, some of the people, the temple servants, and all Israel, lived in their towns. And when the seventh month had come, the children of Israel were in their towns.";
asv[73] = "So the priests, and the Levites, and the porters, and the singers, and some of the people, and the Nethinim, and all Israel, dwelt in their cities. And when the seventh month was come, the children of Israel were in their cities.";
yng[73] = "And they dwell -- the priests, and the Levites, and the gatekeepers, and the singers, and [some] of the people, and the Nethinim, and all Israel -- in their cities, and the seventh month cometh, and the sons of Israel [are] in their cities.";
dby[73] = "And the priests, and the Levites, and the doorkeepers, and the singers, and [some] of the people, and the Nethinim, and all Israel, dwelt in their cities. And when the seventh month came, and the children of Israel were in their cities,";
web[73] = "So the priests, and the Levites, and the porters, and the singers, and [some] of the people, and the Nethinims, and all Israel, dwelt in their cities; and when the seventh month came, the children of Israel [were] in their cities.";
hnv[73] = "So the Kohanim, and the Levites, and the porters, and the singers, and some of the people, and the temple servants, and all Yisra\'el, lived in their cities. When the seventh month was come, the children of Yisra\'el were in their cities.";
vul[73] = "habitaverunt autem sacerdotes et Levitae et ianitores et cantores et reliquum vulgus et Nathinnei et omnis Israhel in civitatibus suis";
