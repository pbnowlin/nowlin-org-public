csb[1] = "When Sanballat, Tobiah, Geshem the Arab, and the rest of our enemies heard that I had rebuilt the wall and that no gap was left in it -- though at that time I had not installed the doors in the city gates --";
csb[2] = "Sanballat and Geshem sent me a message: &quot;Come, let\'s meet together in the villages of the Ono Valley.&quot; They were planning to harm me.";
csb[3] = "So I sent messengers to them, saying, &quot;I am doing important work and cannot come down. Why should the work cease while I leave it and go down to you? &quot;";
csb[4] = "Four times they sent me the same proposal, and I gave them the same reply.";
csb[5] = "Sanballat sent me this same message a fifth time by his aide, who had an open letter in his hand.";
csb[6] = "In it was written: It is reported among the nations -- and Geshem agrees -- that you and the Jews plan to rebel. This is the reason you are building the wall. According to these reports, you are to become their king";
csb[7] = "and have even set up the prophets in Jerusalem to proclaim on your behalf: &quot;There is a king in Judah.&quot; These rumors will be heard by the king. So come, let\'s confer together.";
csb[8] = "Then I replied to him, &quot;There is nothing to these rumors you are spreading; you are inventing them in your own mind.&quot;";
csb[9] = "For they were all trying to intimidate us, saying, &quot;They will drop their hands from the work, and it will never be finished.&quot; But now, my God, strengthen my hands.";
csb[10] = "I went to the house of Shemaiah son of Delaiah, son of Mehetabel, who was restricted to his house. He said: Let\'s meet at the house of God, inside the temple. Let\'s shut the temple doors because they\'re coming to kill you. They\'re coming to kill you tonight!";
csb[11] = "But I said, &quot;Should a man like me run away? How can someone like me enter the temple and live? I will not go.&quot;";
csb[12] = "I realized that God had not sent him, because of the prophecy he spoke against me. Tobiah and Sanballat had hired him.";
csb[13] = "He was hired, so that I would be intimidated, do as he suggested, sin, and get a bad reputation, in order that they could discredit me.";
csb[14] = "My God, remember Tobiah and Sanballat for what they have done, and also the prophetess Noadiah and the other prophets who wanted to intimidate me.";
csb[15] = "The wall was completed in fifty-two days, on the twenty-fifth day of the month Elul.";
csb[16] = "When all our enemies heard this, all the surrounding nations were intimidated and lost their confidence, for they realized that this task had been accomplished by our God.";
csb[17] = "During those days, the nobles of Judah sent many letters to Tobiah, and Tobiah\'s letters came to them.";
csb[18] = "For many in Judah were bound by oath to him, since he was a son-in-law of Shecaniah son of Arah, and his son Jehohanan had married the daughter of Meshullam son of Berechiah.";
csb[19] = "These nobles kept mentioning Tobiah\'s good deeds to me, and they reported my words to him. And Tobiah sent letters to intimidate me.";
kjv[1] = "Now it came to pass, when Sanballat, and Tobiah, and Geshem the Arabian, and the rest of our enemies, heard that I had builded the wall, and [that] there was no breach left therein; (though at that time I had not set up the doors upon the gates;)";
rsv[1] = "Now when it was reported to Sanbal\'lat and Tobi\'ah and to Geshem the Arab and to the rest of our enemies that I had built the wall and that there was no breach left in it (although up to that time I had not set up the doors in the gates),";
asv[1] = "Now it came to pass, when it was reported to Sanballat and Tobiah, and to Geshem the Arabian, and unto the rest of our enemies, that I had builded the wall, and that there was no breach left therein (though even unto that time I had not set up the doors in the gates),";
yng[1] = "And it cometh to pass, when it hath been heard by Sanballat, and Tobiah, and by Geshem the Arabian, and by the rest of our enemies, that I have builded the wall, and there hath not been left in it a breach, (also, till that time the doors I had not set up in the gates,)";
dby[1] = "And it came to pass when Sanballat, and Tobijah, and Geshem the Arabian, and the rest of our enemies, heard that I had built the wall, and that there was no breach left in it (though at that time I had not set up the doors in the gates),";
web[1] = "Now it came to pass, when Sanballat, and Tobiah, and Geshem the Arabian, and the rest of our enemies, heard that I had built the wall, and [that] there was no breach left in it, (though at that time I had not set up the doors upon the gates;)";
hnv[1] = "Now it happened, when it was reported to Sanvallat and Toviyah, and to Geshem the `Arvian, and to the rest of our enemies, that I had built the wall, and that there was no breach left therein; (though even to that time I had not set up the doors in the gates;)";
vul[1] = "factum est autem cum audisset Sanaballat et Tobia et Gosem Arabs et ceteri inimici nostri quod aedificassem ego murum et non esset in ipso residua interruptio usque ad tempus autem illud valvas non posueram in portis";
kjv[2] = "That Sanballat and Geshem sent unto me, saying, Come, let us meet together in [some one of] the villages in the plain of Ono. But they thought to do me mischief.";
rsv[2] = "Sanbal\'lat and Geshem sent to me, saying, &quot;Come and let us meet together in one of the villages in the plain of Ono.&quot; But they intended to do me harm.";
asv[2] = "that Sanballat and Geshem sent unto me saying, Come, let us meet together in [one of] the villages in the plain of Ono. But they thought to do me mischief.";
yng[2] = "that Sanballat sendeth, also Geshem, unto me, saying, `Come and we meet together in the villages, in the valley of Ono;\' and they are thinking to do to me evil.";
dby[2] = "that Sanballat and Geshem sent to me, saying, Come, let us meet together in the villages in the plain of Ono. But they thought to do me mischief.";
web[2] = "That Sanballat and Geshem sent to me, saying, Come, let us meet together in [some one of] the villages in the plain of Ono. But they thought to do me mischief.";
hnv[2] = "that Sanvallat and Geshem sent to me, saying, Come, let us meet together in [one of] the villages in the plain of Ono. But they thought to do me mischief.";
vul[2] = "miserunt Sanaballat et Gosem ad me dicentes veni et percutiamus foedus pariter in viculis in campo Ono ipsi autem cogitabant ut facerent mihi malum";
kjv[3] = "And I sent messengers unto them, saying, I [am] doing a great work, so that I cannot come down: why should the work cease, whilst I leave it, and come down to you?";
rsv[3] = "And I sent messengers to them, saying, &quot;I am doing a great work and I cannot come down. Why should the work stop while I leave it and come down to you?&quot;";
asv[3] = "And I sent messengers unto them, saying, I am doing a great work, so that I cannot come down: why should the work cease, whilst I leave it, and come down to you?";
yng[3] = "And I send unto them messengers, saying, `A great work I am doing, and I am not able to come down; why doth the work cease when I let it alone, and have come down unto you?\'";
dby[3] = "And I sent messengers to them, saying, I am doing a great work, and I cannot come down. Why should the work cease, whilst I leave it and come down to you?";
web[3] = "And I sent messengers to them, saying, I [am] doing a great work, so that I cannot come down: why should the work cease, whilst I leave it, and come down to you?";
hnv[3] = "I sent messengers to them, saying, I am doing a great work, so that I can\'t come down: why should the work cease, while I leave it, and come down to you?";
vul[3] = "misi ergo ad eos nuntios dicens opus grande ego facio et non possum descendere ne forte neglegatur cum venero et descendero ad vos";
kjv[4] = "Yet they sent unto me four times after this sort; and I answered them after the same manner.";
rsv[4] = "And they sent to me four times in this way and I answered them in the same manner.";
asv[4] = "And they sent unto me four times after this sort; and I answered them after the same manner.";
yng[4] = "and they send unto me, according to this word, four times, and I return them [word] according to this word.";
dby[4] = "And they sent to me four times after this sort; and I answered them in the same manner.";
web[4] = "Yet they sent to me four times after this sort; and I answered them after the same manner.";
hnv[4] = "They sent to me four times after this sort; and I answered them after the same manner.";
vul[4] = "miserunt autem ad me secundum verbum hoc per quattuor vices et respondi eis iuxta sermonem priorem";
kjv[5] = "Then sent Sanballat his servant unto me in like manner the fifth time with an open letter in his hand;";
rsv[5] = "In the same way Sanbal\'lat for the fifth time sent his servant to me with an open letter in his hand.";
asv[5] = "Then sent Sanballat his servant unto me in like manner the fifth time with an open letter in his hand,";
yng[5] = "And Sanballat sendeth unto me, according to this word, a fifth time, his servant, and an open letter in his hand;";
dby[5] = "Then sent Sanballat his servant to me in this manner the fifth time, with an open letter in his hand,";

vul[5] = "et misit ad me Sanaballat iuxta verbum prius quinta vice puerum suum et epistulam habebat in manu scriptam hoc modo";
kjv[6] = "Wherein [was] written, It is reported among the heathen, and Gashmu saith [it, that] thou and the Jews think to rebel: for which cause thou buildest the wall, that thou mayest be their king, according to these words.";
rsv[6] = "In it was written, &quot;It is reported among the nations, and Geshem also says it, that you and the Jews intend to rebel; that is why you are building the wall; and you wish to become their king, according to this report.";
asv[6] = "wherein was written, It is reported among the nations, and Gashmu saith it, that thou and the Jews think to rebel; for which cause thou art building the wall: and thou wouldest be their king, according to these words.";
yng[6] = "it is written in it, `Among the nations it hath been heard, and Gashmu is saying: Thou and the Jews are thinking to rebel, therefore thou art building the wall, and thou hast been to them for a king -- according to these words!";
dby[6] = "in which was written: It is reported among the nations, and Gashmu says [it, that] thou and the Jews think to rebel, for which cause thou buildest the wall, and according to these words thou wilt become their king.";
web[6] = "In which [was] written, It is reported among the heathen, and Gashmu saith [it], [that] thou and the Jews think to rebel: for which cause thou buildest the wall that thou mayest be their king, according to these words.";
hnv[6] = "in which was written, It is reported among the nations, and Gashmu says it, that you and the Yehudim think to rebel; for which cause you are building the wall: and you would be their king, according to these words.";
vul[6] = "in gentibus auditum est et Gosem dixit quod tu et Iudaei cogitetis rebellare et propterea aedifices murum et levare te velis super eos regem propter quam causam";
kjv[7] = "And thou hast also appointed prophets to preach of thee at Jerusalem, saying, [There is] a king in Judah: and now shall it be reported to the king according to these words. Come now therefore, and let us take counsel together.";
rsv[7] = "And you have also set up prophets to proclaim concerning you in Jerusalem, \'There is a king in Judah.\' And now it will be reported to the king according to these words. So now come, and let us take counsel together.&quot;";
asv[7] = "And thou hast also appointed prophets to preach of thee at Jerusalem, saying, There is a king in Judah: and now shall it be reported to the king according to these words. Come now therefore, and let us take counsel together.";
yng[7] = "And also, prophets thou hast appointed to call for thee in Jerusalem, saying, A king [is] in Judah, and now it is heard by the king according to these words; and now come, and we take counsel together.\'";
dby[7] = "And thou hast also appointed prophets to proclaim concerning thee at Jerusalem saying, There is a king in Judah! And now it will be reported to the king according to these words. Come now therefore, and let us take counsel together.";
web[7] = "And thou hast also appointed prophets to preach of thee at Jerusalem, saying, [There is] a king in Judah: and now shall it be reported to the king according to these words. Come now therefore, and let us take counsel together.";
hnv[7] = "You have also appointed prophets to preach of you at Yerushalayim, saying, There is a king in Yehudah: and now shall it be reported to the king according to these words. Come now therefore, and let us take counsel together.";
vul[7] = "et prophetas posueris qui praedicent de te in Hierusalem dicentes rex in Iudaea est auditurus est rex verba haec idcirco nunc veni ut ineamus consilium pariter";
kjv[8] = "Then I sent unto him, saying, There are no such things done as thou sayest, but thou feignest them out of thine own heart.";
rsv[8] = "Then I sent to him, saying, &quot;No such things as you say have been done, for you are inventing them out of your own mind.&quot;";
asv[8] = "Then I sent unto him, saying, There are no such things done as thou sayest, but thou feignest them out of thine own heart.";
yng[8] = "And I send unto him, saying, `It hath not been according to these words that thou art saying, for from thine own heart thou art devising them;\'";
dby[8] = "And I sent to him, saying, There are no such things done as thou sayest, but thou feignest them out of thine own heart.";
web[8] = "Then I sent to him, saying, There are no such things done as thou sayest, but thou feignest them out of thy own heart.";
hnv[8] = "Then I sent to him, saying, There are no such things done as you say, but you feign them out of your own heart.";
vul[8] = "et misi ad eos dicens non est factum secundum verba haec quae tu loqueris de corde enim tuo tu conponis haec";
kjv[9] = "For they all made us afraid, saying, Their hands shall be weakened from the work, that it be not done. Now therefore, [O God], strengthen my hands.";
rsv[9] = "For they all wanted to frighten us, thinking, &quot;Their hands will drop from the work, and it will not be done.&quot; But now, O God, strengthen thou my hands.";
asv[9] = "For they all would have made us afraid, saying, Their hands shall be weakened from the work, that it be not done. But now, [O God], strengthen thou my hands.";
yng[9] = "for all of them are making us afraid, saying, `Their hands are too feeble for the work, and it is not done;\' and now, strengthen Thou my hands.";
dby[9] = "For they all would have made us afraid, saying, Their hands shall be slackened from the work, that it be not carried out. -- Now therefore strengthen my hands!";
web[9] = "For they all made us afraid, saying, Their hands shall be weakened from the work, that it may not be done. Now therefore, [O God], strengthen my hands.";
hnv[9] = "For they all would have made us afraid, saying, Their hands shall be weakened from the work, that it not be done. But now, [God], strengthen you my hands.";
vul[9] = "omnes autem hii terrebant nos cogitantes quod cessarent manus nostrae ab opere et quiesceremus quam ob causam magis confortavi manus meas";
kjv[10] = "Afterward I came unto the house of Shemaiah the son of Delaiah the son of Mehetabeel, who [was] shut up; and he said, Let us meet together in the house of God, within the temple, and let us shut the doors of the temple: for they will come to slay thee; yea, in the night will they come to slay thee.";
rsv[10] = "Now when I went into the house of Shemai\'ah the son of Delai\'ah, son of Mehet\'abel, who was shut up, he said, &quot;Let us meet together in the house of God, within the temple, and let us close the doors of the temple; for they are coming to kill you, at night they are coming to kill you.&quot;";
asv[10] = "And I went unto the house of Shemaiah the son of Delaiah the son of Mehetabel, who was shut up; and he said, Let us meet together in the house of God, within the temple, and let us shut the doors of the temple: for they will come to slay thee; yea, in the night will they come to slay thee.";
yng[10] = "And I have entered the house of Shemaiah son of Delaiah, son of Mehetabeel -- and he is restrained -- and he saith, `Let us meet at the house of God, at the inside of the temple, and we shut the doors of the temple, for they are coming in to slay thee -- yea, by night they are coming in to slay thee.\'";
dby[10] = "And I came to the house of Shemaiah the son of Delaiah, the son of Mehetabeel, who had shut himself up. And he said, Let us meet together in the house of God, within the temple, and let us shut the doors of the temple; for they are coming to kill thee; even in the night are they coming to kill thee.";
web[10] = "Afterward I came to the house of Shemaiah the son of Delaiah the son of Mehetabeel, who [was] shut up; and he said, Let us meet together in the house of God, within the temple, and let us shut the doors of the temple: for they will come to slay thee; yea, in the night will they come to slay thee.";
hnv[10] = "I went to the house of Shemayah the son of Delayah the son of Mehetav\'el, who was shut up; and he said, Let us meet together in the house of God, within the temple, and let us shut the doors of the temple: for they will come to kill you; yes, in the night will they come to kill you.";
vul[10] = "et ingressus sum domum Samaiae filii Dalaiae filii Metabehel secreto qui ait tractemus nobiscum in domo Dei in medio templi et claudamus portas aedis quia venturi sunt ut interficiant te et nocte venturi sunt ad occidendum te";
kjv[11] = "And I said, Should such a man as I flee? and who [is there], that, [being] as I [am], would go into the temple to save his life? I will not go in.";
rsv[11] = "But I said, &quot;Should such a man as I flee? And what man such as I could go into the temple and live? I will not go in.&quot;";
asv[11] = "And I said, Should such a man as I flee? and who is there, that, being such as I, would go into the temple to save his life? I will not go in.";
yng[11] = "And I say, `A man such as I -- doth he flee? and who as I, that doth go in unto the temple, and live? -- I do not go in.\'";
dby[11] = "And I said, Should such a man as I flee? and who is there, that, being as I am, could go into the temple, and live? I will not go in.";
web[11] = "And I said, Should such a man as I flee? and who [is there], that, [being] as I [am], would go into the temple to save his life? I will not go in.";
hnv[11] = "I said, Should such a man as I flee? and who is there that, being such as I, would go into the temple to save his life? I will not go in.";
vul[11] = "et dixi num quisquam similis mei fugit et quis ut ego ingredietur templum et vivet non ingrediar";
kjv[12] = "And, lo, I perceived that God had not sent him; but that he pronounced this prophecy against me: for Tobiah and Sanballat had hired him.";
rsv[12] = "And I understood, and saw that God had not sent him, but he had pronounced the prophecy against me because Tobi\'ah and Sanbal\'lat had hired him.";
asv[12] = "And I discerned, and, lo, God had not sent him; but he pronounced this prophecy against me: and Tobiah and Sanballat had hired him.";
yng[12] = "And I discern, and lo, God hath not sent him, for in the prophecy he hath spoken unto me both Tobiah and Sanballat hired him,";
dby[12] = "And I perceived, and behold, God had not sent him; for he pronounced this prophecy against me; and Tobijah and Sanballat had hired him.";
web[12] = "And lo, I perceived that God had not sent him; but that he pronounced this prophecy against me: for Tobiah and Sanballat had hired him.";
hnv[12] = "I discerned, and, behold, God had not sent him; but he pronounced this prophecy against me: and Toviyah and Sanvallat had hired him.";
vul[12] = "et intellexi quod Deus non misisset eum sed quasi vaticinans locutus esset ad me et Tobia et Sanaballat conduxissent eum";
kjv[13] = "Therefore [was] he hired, that I should be afraid, and do so, and sin, and [that] they might have [matter] for an evil report, that they might reproach me.";
rsv[13] = "For this purpose he was hired, that I should be afraid and act in this way and sin, and so they could give me an evil name, in order to taunt me.";
asv[13] = "For this cause was he hired, that I should be afraid, and do so, and sin, and that they might have matter for an evil report, that they might reproach me.";
yng[13] = "so that he [is] an hireling, that I may fear and do so, and I had sinned, and it had been to them for an evil name that they may reproach me.";
dby[13] = "Therefore was he hired, that I should be afraid, and do so, and sin, and that they might have wherewith to spread an evil report, that they might reproach me.";
web[13] = "Therefore [was] he hired, that I should be afraid, and do so, and sin, and [that] they might have [matter] for an evil report, that they might reproach me.";
hnv[13] = "For this cause was he hired, that I should be afraid, and do so, and sin, and that they might have matter for an evil report, that they might reproach me.";
vul[13] = "acceperat enim pretium ut territus facerem et peccarem et haberent malum quod exprobrarent mihi";
kjv[14] = "My God, think thou upon Tobiah and Sanballat according to these their works, and on the prophetess Noadiah, and the rest of the prophets, that would have put me in fear.";
rsv[14] = "Remember Tobi\'ah and Sanbal\'lat, O my God, according to these things that they did, and also the prophetess No-adi\'ah and the rest of the prophets who wanted to make me afraid.";
asv[14] = "Remember, O my God, Tobiah and Sanballat according to these their works, and also the prophetess Noadiah, and the rest of the prophets, that would have put me in fear.";
yng[14] = "Be mindful, O my God, of Tobiah, and of Sanballat, according to these his works, and also, of Noadiah the prophetess, and of the rest of the prophets who have been making me afraid.";
dby[14] = "My God, remember Tobijah and Sanballat according to these their works, and also the prophetess Noadiah, and the rest of the prophets who would have put me in fear.";
web[14] = "My God, think thou upon Tobiah and Sanballat according to these their works, and on the prophetess Noadiah, and the rest of the prophets, that would have put me in fear.";
hnv[14] = "Remember, my God, Toviyah and Sanvallat according to these their works, and also the prophetess No`adyah, and the rest of the prophets, that would have put me in fear.";
vul[14] = "memento Domine mei pro Tobia et Sanaballat iuxta opera eorum talia sed et Noadiae prophetae et ceterorum prophetarum qui terrebant me";
kjv[15] = "So the wall was finished in the twenty and fifth [day] of [the month] Elul, in fifty and two days.";
rsv[15] = "So the wall was finished on the twenty-fifth day of the month Elul, in fifty-two days.";
asv[15] = "So the wall was finished in the twenty and fifth [day] of [the month] Elul, in fifty and two days.";
yng[15] = "And the wall is completed in the twenty and fifth of Elul, on the fifty and second day;";
dby[15] = "So the wall was finished on the twenty-fifth of Elul, in fifty-two days.";
web[15] = "So the wall was finished in the twenty and fifth [day] of [the month] Elul, in fifty and two days.";
hnv[15] = "So the wall was finished in the twenty-fifth [day] of [the month] Elul, in fifty-two days.";
vul[15] = "conpletus est autem murus vicesimo quinto die mensis elul quinquaginta duobus diebus";
kjv[16] = "And it came to pass, that when all our enemies heard [thereof], and all the heathen that [were] about us saw [these things], they were much cast down in their own eyes: for they perceived that this work was wrought of our God.";
rsv[16] = "And when all our enemies heard of it, all the nations round about us were afraid and fell greatly in their own esteem; for they perceived that this work had been accomplished with the help of our God.";
asv[16] = "And it came to pass, when all our enemies heard [thereof], that all the nations that were about us feared, and were much cast down in their own eyes; for they perceived that this work was wrought of our God.";
yng[16] = "and it cometh to pass, when all our enemies have heard, and all the nations who are round about us see, that they fall greatly in their own eyes, and know that by our God hath this work been done.";
dby[16] = "And it came to pass that when all our enemies heard [of it], all the nations that were about us were afraid and were much cast down in their own eyes, and they perceived that this work was wrought by our God.";
web[16] = "And it came to pass, that when all our enemies heard [of it], and all the heathen that [were] about us saw [these things], they were much cast down in their own eyes: for they perceived that this work was wrought by our God.";
hnv[16] = "It happened, when all our enemies heard [of it], that all the nations that were about us feared, and were much cast down in their own eyes; for they perceived that this work was worked of our God.";
vul[16] = "factum est ergo cum audissent omnes inimici nostri ut timerent universae gentes quae erant in circuitu nostro et conciderent intra semet ipsos et scirent quod a Deo factum esset opus hoc";
kjv[17] = "Moreover in those days the nobles of Judah sent many letters unto Tobiah, and [the letters] of Tobiah came unto them.";
rsv[17] = "Moreover in those days the nobles of Judah sent many letters to Tobi\'ah, and Tobi\'ah\'s letters came to them.";
asv[17] = "Moreover in those days the nobles of Judah sent many letters unto Tobiah, and [the letters] of Tobiah came unto them.";
yng[17] = "Also, in those days the freemen of Judah are multiplying their letters going unto Tobiah, and those of Tobiah are coming in unto them;";
dby[17] = "Moreover in those days the nobles of Judah sent many letters to Tobijah, and those of Tobijah came to them.";
web[17] = "Moreover, in those days the nobles of Judah sent many letters to Tobiah, and [the letters] of Tobiah came to them.";
hnv[17] = "Moreover in those days the nobles of Yehudah sent many letters to Toviyah, and [the letters] of Toviyah came to them.";
vul[17] = "sed et in diebus illis multae optimatium Iudaeorum epistulae mittebantur ad Tobiam et a Tobia veniebant ad eos";
kjv[18] = "For [there were] many in Judah sworn unto him, because he [was] the son in law of Shechaniah the son of Arah; and his son Johanan had taken the daughter of Meshullam the son of Berechiah.";
rsv[18] = "For many in Judah were bound by oath to him, because he was the son-in-law of Shecani\'ah the son of Arah: and his son Jehoha\'nan had taken the daughter of Meshul\'lam the son of Berechi\'ah as his wife.";
