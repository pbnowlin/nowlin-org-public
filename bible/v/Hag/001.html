csb[1] = "In the second year of King Darius, on the first day of the sixth month, the word of the LORD came through the prophet Haggai to Zerubbabel son of Shealtiel, the governor of Judah, and to Joshua son of Jehozadak, the high priest:";
csb[2] = "&quot;The LORD of Armies says this: These people say: The time has not come for the house of the LORD to be rebuilt.&quot;";
csb[3] = "The word of the LORD came through the prophet Haggai:";
csb[4] = "&quot;Is it a time for you yourselves to live in your paneled houses, while this house lies in ruins? &quot;";
csb[5] = "Now, the LORD of Armies says this: &quot;Think carefully about your ways:";
csb[6] = "&quot;You have planted much but harvested little. You eat but never have enough to be satisfied. You drink but never have enough to be happy. You put on clothes but never have enough to get warm. The wage earner puts his wages into a bag with a hole in it.&quot;";
csb[7] = "The LORD of Armies says this: &quot;Think carefully about your ways.";
csb[8] = "&quot;Go up into the hills, bring down lumber, and build the house; and I will be pleased with it and be glorified,&quot; says the LORD.";
csb[9] = "&quot;You expected much, but then it amounted to little. When you brought the harvest to your house, I ruined it. Why? &quot; This is the declaration of the LORD of Armies. &quot;Because my house still lies in ruins, while each of you is busy with his own house.";
csb[10] = "&quot;So on your account, the skies have withheld the dew and the land its crops.";
csb[11] = "&quot;I have summoned a drought on the fields and the hills, on the grain, new wine, fresh oil, and whatever the ground yields, on man and animal, and on all that your hands produce.&quot;";
csb[12] = "Then Zerubbabel son of Shealtiel, the high priest Joshua son of Jehozadak, and the entire remnant of the people obeyed the LORD their God and the words of the prophet Haggai, because the LORD their God had sent him. So the people feared the LORD.";
csb[13] = "Then Haggai, the LORD\'s messenger, delivered the LORD\'s message to the people: &quot;I am with you -- this is the LORD\'s declaration.&quot;";
csb[14] = "The LORD roused the spirit of Zerubbabel son of Shealtiel, governor of Judah, the spirit of the high priest Joshua son of Jehozadak, and the spirit of all the remnant of the people. They began work on the house of the LORD of Armies, their God,";
csb[15] = "on the twenty-fourth day of the sixth month, in the second year of King Darius.";
