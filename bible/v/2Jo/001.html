csb[1] = "The elder: To the elect lady and her children, whom I love in the truth -- and not only I, but also all who know the truth --";
csb[2] = "because of the truth that remains in us and will be with us forever.";
csb[3] = "Grace, mercy, and peace will be with us from God the Father and from Jesus Christ, the Son of the Father, in truth and love.";
csb[4] = "I was very glad to find some of your children walking in truth, in keeping with a command we have received from the Father.";
csb[5] = "So now I ask you, dear lady -- not as if I were writing you a new command, but one we have had from the beginning -- that we love one another.";
csb[6] = "This is love: that we walk according to his commands. This is the command as you have heard it from the beginning: that you walk in love.";
csb[7] = "Many deceivers have gone out into the world; they do not confess the coming of Jesus Christ in the flesh. This is the deceiver and the antichrist.";
csb[8] = "Watch yourselves so you don\'t lose what we have worked for, but that you may receive a full reward.";
csb[9] = "Anyone who does not remain in Christ\'s teaching but goes beyond it does not have God. The one who remains in that teaching, this one has both the Father and the Son.";
csb[10] = "If anyone comes to you and does not bring this teaching, do not receive him into your home, and don\'t greet him;";
csb[11] = "for the one who greets him shares in his evil works.";
csb[12] = "Though I have many things to write to you, I don\'t want to use paper and ink. Instead, I hope to come to you and talk face to face so that our joy may be complete.";
csb[13] = "The children of your elect sister send you greetings.";
