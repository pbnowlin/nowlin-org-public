csb[1] = "For this Melchizedek, king of Salem, priest of God Most High, met Abraham and blessed him as he returned from defeating the kings,";
csb[2] = "and Abraham gave him a tenth of everything. First, his name means king of righteousness, then also, king of Salem, meaning king of peace.";
csb[3] = "Without father, mother, or genealogy, having neither beginning of days nor end of life, but resembling the Son of God, he remains a priest forever.";
csb[4] = "Now consider how great this man was: even Abraham the patriarch gave a tenth of the plunder to him.";
csb[5] = "The sons of Levi who receive the priestly office have a command according to the law to collect a tenth from the people -- that is, from their brothers and sisters -- though they have also descended from Abraham.";
csb[6] = "But one without this lineage collected a tenth from Abraham and blessed the one who had the promises.";
csb[7] = "Without a doubt, the inferior is blessed by the superior.";
csb[8] = "In the one case, men who will die receive a tenth, but in the other case, Scripture testifies that he lives.";
csb[9] = "And in a sense Levi himself, who receives a tenth, has paid a tenth through Abraham,";
csb[10] = "for he was still within his ancestor when Melchizedek met him.";
csb[11] = "Now if perfection came through the Levitical priesthood (for on the basis of it the people received the law), what further need was there for another priest to appear, said to be according to the order of Melchizedek and not according to the order of Aaron?";
csb[12] = "For when there is a change of the priesthood, there must be a change of law as well.";
csb[13] = "For the one these things are spoken about belonged to a different tribe. No one from it has served at the altar.";
csb[14] = "Now it is evident that our Lord came from Judah, and Moses said nothing about that tribe concerning priests.";
csb[15] = "And this becomes clearer if another priest like Melchizedek appears,";
csb[16] = "who did not become a priest based on a legal regulation about physical descent but based on the power of an indestructible life.";
csb[17] = "For it has been testified: You are a priest forever according to the order of Melchizedek.";
csb[18] = "So the previous command is annulled because it was weak and unprofitable";
csb[19] = "(for the law perfected nothing), but a better hope is introduced, through which we draw near to God.";
csb[20] = "None of this happened without an oath. For others became priests without an oath,";
csb[21] = "but he became a priest with an oath made by the one who said to him: The Lord has sworn and will not change his mind, &quot;You are a priest forever.&quot;";
csb[22] = "Because of this oath, Jesus has also become the guarantee of a better covenant.";
csb[23] = "Now many have become Levitical priests, since they are prevented by death from remaining in office.";
csb[24] = "But because he remains forever, he holds his priesthood permanently.";
csb[25] = "Therefore, he is able to save completely those who come to God through him, since he always lives to intercede for them.";
csb[26] = "For this is the kind of high priest we need: holy, innocent, undefiled, separated from sinners, and exalted above the heavens.";
csb[27] = "He doesn\'t need to offer sacrifices every day, as high priests do -- first for their own sins, then for those of the people. He did this once for all time when he offered himself.";
csb[28] = "For the law appoints as high priests men who are weak, but the promise of the oath, which came after the law, appoints a Son, who has been perfected forever.";
kjv[1] = "For this Melchisedec, king of Salem, priest of the most high God, who met Abraham returning from the slaughter of the kings, and blessed him;";

yng[1] = "For this Melchisedek, king of Salem, priest of God Most High, who did meet Abraham turning back from the smiting of the kings, and did bless him,";
dby[1] = "For this Melchisedec, King of Salem, priest of the most high God, who met Abraham returning from smiting the kings, and blessed him;";
web[1] = "For this Melchisedec, king of Salem, priest of the most high God, who met Abraham returning from the slaughter of the kings, and blessed him;";

vul[1] = "hic enim Melchisedech rex Salem sacerdos Dei summi qui obviavit Abrahae regresso a caede regum et benedixit ei";
kjv[2] = "To whom also Abraham gave a tenth part of all; first being by interpretation King of righteousness, and after that also King of Salem, which is, King of peace;";

asv[2] = "to whom also Abraham divided a tenth part of all (being first, by interpretation, King of righteousness, and then also King of Salem, which is, King of peace;";
yng[2] = "to whom also a tenth of all did Abraham divide, (first, indeed, being interpreted, `King of righteousness,\' and then also, King of Salem, which is, King of Peace,)";
dby[2] = "to whom Abraham gave also the tenth portion of all; first being interpreted King of righteousness, and then also King of Salem, which is King of peace;";
web[2] = "To whom also Abraham gave a tenth part of all; first being by interpretation King of righteousness, and after that also King of Salem, which is, King of peace;";
hnv[2] = "to whom also Avraham divided a tenth part of all (being first, by interpretation, king of righteousness, and then also king of Shalem, which is king of shalom;";
vul[2] = "cui decimas omnium divisit Abraham primum quidem qui interpretatur rex iustitiae deinde autem et rex Salem quod est rex pacis";
kjv[3] = "Without father, without mother, without descent, having neither beginning of days, nor end of life; but made like unto the Son of God; abideth a priest continually.";

yng[3] = "without father, without mother, without genealogy, having neither beginning of days nor end of life, and being made like to the Son of God, doth remain a priest continually.";
dby[3] = "without father, without mother, without genealogy; having neither beginning of days nor end of life, but assimilated to the Son of God, abides a priest continually.";

dby[4] = "Now consider how great this [personage] was, to whom [even] the patriarch Abraham gave a tenth out of the spoils.";

hnv[4] = "Now consider how great this man was, to whom even Avraham, the patriarch, gave a tenth out of the best spoils.";

kjv[5] = "And verily they that are of the sons of Levi, who receive the office of the priesthood, have a commandment to take tithes of the people according to the law, that is, of their brethren, though they come out of the loins of Abraham:";

dby[5] = "And they indeed from among the sons of Levi, who receive the priesthood, have commandment to take tithes from the people according to the law, that is from their brethren, though these are come out of the loins of Abraham:";

hnv[6] = "but he whose genealogy is not counted from them has taken tithes of Avraham, and has blessed him who has the promises.";

hnv[7] = "But without any dispute the less is blessed by the better.";

yng[8] = "and here, indeed, men who die do receive tithes, and there [he], who is testified to that he was living,";

kjv[11] = "If therefore perfection were by the Levitical priesthood, (for under it the people received the law,) what further need [was there] that another priest should rise after the order of Melchisedec, and not be called after the order of Aaron?";
rsv[11] = "Now if perfection had been attainable through the Levit\'ical priesthood (for under it the people received the law), what further need would there have been for another priest to arise after the order of Melchiz\'edek, rather than one named after the order of Aaron?";
asv[11] = "Now if there was perfection through the Levitical priesthood (for under it hath the people received the law), what further need [was there] that another priest should arise after the order of Melchizedek, and not be reckoned after the order of Aaron?";
yng[11] = "If indeed, then, perfection were through the Levitical priesthood -- for the people under it had received law -- what further need, according to the order of Melchisedek, for another priest to arise, and not to be called according to the order of Aaron?";
dby[11] = "If indeed then perfection were by the Levitical priesthood, for the people had their law given to them in connexion with *it*, what need [was there] still that a different priest should arise according to the order of Melchisedec, and not be named after the order of Aaron?";
web[11] = "If therefore perfection were by the Levitical priesthood (for under it the people received the law) what further need [was there] that another priest should rise after the order of Melchisedec, and not be called after the order of Aaron?";
hnv[11] = "Now if there was perfection through the Levitical priesthood (for under it the people have received the law), what further need was there for another Kohen to arise after the order of Malki-Tzedek, and not be called after the order of Aharon?";
vul[11] = "si ergo consummatio per sacerdotium leviticum erat populus enim sub ipso legem accepit quid adhuc necessarium secundum ordinem Melchisedech alium surgere sacerdotem et non secundum ordinem Aaron dici";

dby[24] = "but he, because of his continuing for ever, has the priesthood unchangeable.";

hnv[24] = "But he, because he lives forever, has his priesthood unchangeable.";

kjv[25] = "Wherefore he is able also to save them to the uttermost that come unto God by him, seeing he ever liveth to make intercession for them.";
rsv[25] = "Consequently he is able for all time to save those who draw near to God through him, since he always lives to make intercession for them.";
asv[25] = "Wherefore also he is able to save to the uttermost them that draw near unto God through him, seeing he ever liveth to make intercession for them.";
yng[25] = "whence also he is able to save to the very end, those coming through him unto God -- ever living to make intercession for them.";
dby[25] = "Whence also he is able to save completely those who approach by him to God, always living to intercede for them.";
web[25] = "Wherefore he is able also to save them to the uttermost that come to God by him, seeing he ever liveth to make intercession for them.";
hnv[25] = "Therefore he is also able to save to the uttermost those who draw near to God through him, seeing he ever lives to make intercession for them.";

kjv[26] = "For such an high priest became us, [who is] holy, harmless, undefiled, separate from sinners, and made higher than the heavens;";
rsv[26] = "For it was fitting that we should have such a high priest, holy, blameless, unstained, separated from sinners, exalted above the heavens.";
asv[26] = "For such a high priest became us, holy, guileless, undefiled, separated from sinners, and made higher than the heavens;";
yng[26] = "For such a chief priest did become us -- kind, harmless, undefiled, separate from the sinners, and become higher than the heavens,";
dby[26] = "For such a high priest became us, holy, harmless, undefiled, separated from sinners, and become higher than the heavens:";
web[26] = "For such a high priest became us, [who is] holy, harmless, undefiled, separate from sinners, and made higher than the heavens;";
hnv[26] = "For such a Kohen Gadol was fitting for us: holy, guiltless, undefiled, separated from sinners, and made higher than the heavens;";
vul[26] = "talis enim decebat ut nobis esset pontifex sanctus innocens inpollutus segregatus a peccatoribus et excelsior caelis factus";
kjv[27] = "Who needeth not daily, as those high priests, to offer up sacrifice, first for his own sins, and then for the people\'s: for this he did once, when he offered up himself.";
rsv[27] = "He has no need, like those high priests, to offer sacrifices daily, first for his own sins and then for those of the people; he did this once for all when he offered up himself.";
asv[27] = "who needeth not daily, like those high priests, to offer up sacrifices, first for his own sins, and then for the [sins] of the people: for this he did once for all, when he offered up himself.";
yng[27] = "who hath no necessity daily, as the chief priests, first for his own sins to offer up sacrifice, then for those of the people; for this he did once, having offered up himself;";
dby[27] = "who has not day by day need, as the high priests, first to offer up sacrifices for his own sins, then [for] those of the people; for this he did once for all [in] having offered up himself.";
web[27] = "Who needeth not daily, as those high priests, to offer up sacrifice, first for his own sins, and then for the people\'s: for this he did once, when he offered up himself.";
hnv[27] = "who doesn\'t need, like those Kohenim Gedolim, to daily offer up sacrifices, first for his own sins, and then for the sins of the people. For this he did once for all, when he offered up himself.";
vul[27] = "qui non habet cotidie necessitatem quemadmodum sacerdotes prius pro suis delictis hostias offerre deinde pro populi hoc enim fecit semel se offerendo";
kjv[28] = "For the law maketh men high priests which have infirmity; but the word of the oath, which was since the law, [maketh] the Son, who is consecrated for evermore.";
rsv[28] = "Indeed, the law appoints men in their weakness as high priests, but the word of the oath, which came later than the law, appoints a Son who has been made perfect for ever.";
asv[28] = "For the law appointeth men high priests, having infirmity; but the word of the oath, which was after the law, [appointeth] a Son, perfected for evermore.";
yng[28] = "for the law doth appoint men chief priests, having infirmity, but the word of the oath that [is] after the law [appointeth] the Son -- to the age having been perfected.";
dby[28] = "For the law constitutes men high priests, having infirmity; but the word of the swearing of the oath which [is] after the law, a Son perfected for ever.";
web[28] = "For the law maketh men high priests who have infirmity; but the word of the oath, which was after the law, [maketh] the Son, who is consecrated for evermore.";
hnv[28] = "For the law appoints men as Kohenim Gedolim who have weakness, but the word of the oath which came after the law appoints a Son forever who has been perfected.";
vul[28] = "lex enim homines constituit sacerdotes infirmitatem habentes sermo autem iurisiurandi qui post legem est Filium in aeternum perfectum";
