csb[1] = "For this reason, we must pay attention all the more to what we have heard, so that we will not drift away.";
csb[2] = "For if the message spoken through angels was legally binding and every transgression and disobedience received a just punishment,";
csb[3] = "how will we escape if we neglect such a great salvation? This salvation had its beginning when it was spoken of by the Lord, and it was confirmed to us by those who heard him.";
csb[4] = "At the same time, God also testified by signs and wonders, various miracles, and distributions of gifts from the Holy Spirit according to his will.";
csb[5] = "For he has not subjected to angels the world to come that we are talking about.";
csb[6] = "But someone somewhere has testified: What is man that you remember him, or the son of man that you care for him?";
csb[7] = "You made him lower than the angels for a short time; you crowned him with glory and honor";
csb[8] = "and subjected everything under his feet. For in subjecting everything to him, he left nothing that is not subject to him. As it is, we do not yet see everything subjected to him.";
csb[9] = "But we do see Jesus -- made lower than the angels for a short time so that by God\'s grace he might taste death for everyone -- crowned with glory and honor because he suffered death.";
csb[10] = "For in bringing many sons and daughters to glory, it was entirely appropriate that God -- for whom and through whom all things exist -- should make the source of their salvation perfect through sufferings.";
csb[11] = "For the one who sanctifies and those who are sanctified all have one Father. That is why Jesus is not ashamed to call them brothers and sisters,";
csb[12] = "saying: I will proclaim your name to my brothers and sisters; I will sing hymns to you in the congregation.";
csb[13] = "Again, I will trust in him. And again, Here I am with the children God gave me.";
csb[14] = "Now since the children have flesh and blood in common, Jesus also shared in these, so that through his death he might destroy the one holding the power of death -- that is, the devil --";
csb[15] = "and free those who were held in slavery all their lives by the fear of death.";
csb[16] = "For it is clear that he does not reach out to help angels, but to help Abraham\'s offspring.";
csb[17] = "Therefore, he had to be like his brothers and sisters in every way, so that he could become a merciful and faithful high priest in matters pertaining to God, to make atonement for the sins of the people.";
csb[18] = "For since he himself has suffered when he was tempted, he is able to help those who are tempted.";
