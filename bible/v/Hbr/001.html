csb[1] = "Long ago God spoke to the fathers by the prophets at different times and in different ways.";
csb[2] = "In these last days, he has spoken to us by his Son. God has appointed him heir of all things and made the universe through him.";
csb[3] = "The Son is the radiance of God\'s glory and the exact expression of his nature, sustaining all things by his powerful word. After making purification for sins, he sat down at the right hand of the Majesty on high.";
csb[4] = "So he became superior to the angels, just as the name he inherited is more excellent than theirs.";
csb[5] = "For to which of the angels did he ever say, You are my Son; today I have become your Father, or again, I will be his Father, and he will be my Son?";
csb[6] = "Again, when he brings his firstborn into the world, he says, And let all God\'s angels worship him.";
csb[7] = "And about the angels he says: He makes his angels winds, and his servants a fiery flame,";
csb[8] = "but to the Son: Your throne, O God, is forever and ever, and the scepter of your kingdom is a scepter of justice.";
csb[9] = "You have loved righteousness and hated lawlessness; this is why God, your God, has anointed you with the oil of joy beyond your companions.";
csb[10] = "And: In the beginning, Lord, you established the earth, and the heavens are the works of your hands;";
csb[11] = "they will perish, but you remain. They will all wear out like clothing;";
csb[12] = "you will roll them up like a cloak, and they will be changed like clothing. But you are the same, and your years will never end.";
csb[13] = "Now to which of the angels has he ever said: Sit at my right hand until I make your enemies your footstool?";
csb[14] = "Are they not all ministering spirits sent out to serve those who are going to inherit salvation?";
