csb[1] = "For every high priest taken from among men is appointed in matters pertaining to God for the people, to offer both gifts and sacrifices for sins.";
csb[2] = "He is able to deal gently with those who are ignorant and are going astray, since he is also clothed with weakness.";
csb[3] = "Because of this, he must make an offering for his own sins as well as for the people.";
csb[4] = "No one takes this honor on himself; instead, a person is called by God, just as Aaron was.";
csb[5] = "In the same way, Christ did not exalt himself to become a high priest, but God who said to him, You are my Son; today I have become your Father,";
csb[6] = "also says in another place, You are a priest forever according to the order of Melchizedek.";
csb[7] = "During his earthly life, he offered prayers and appeals with loud cries and tears to the one who was able to save him from death, and he was heard because of his reverence.";
csb[8] = "Although he was the Son, he learned obedience from what he suffered.";
csb[9] = "After he was perfected, he became the source of eternal salvation for all who obey him,";
csb[10] = "and he was declared by God a high priest according to the order of Melchizedek.";
csb[11] = "We have a great deal to say about this, and it is difficult to explain, since you have become too lazy to understand.";
csb[12] = "Although by this time you ought to be teachers, you need someone to teach you the basic principles of God\'s revelation again. You need milk, not solid food.";
csb[13] = "Now everyone who lives on milk is inexperienced with the message about righteousness, because he is an infant.";
csb[14] = "But solid food is for the mature -- for those whose senses have been trained to distinguish between good and evil.";
kjv[1] = "For every high priest taken from among men is ordained for men in things [pertaining] to God, that he may offer both gifts and sacrifices for sins:";
rsv[1] = "For every high priest chosen from among men is appointed to act on behalf of men in relation to God, to offer gifts and sacrifices for sins.";
asv[1] = "For every high priest, being taken from among men, is appointed for men in things pertaining to God, that he may offer both gifts and sacrifices for sins:";
yng[1] = "For every chief priest -- out of men taken -- in behalf of men is set in things [pertaining] to God, that he may offer both gifts and sacrifices for sins,";
dby[1] = "For every high priest taken from amongst men is established for men in things relating to God, that he may offer both gifts and sacrifices for sins;";
web[1] = "For every high priest taken from among men, is ordained for men in things [pertaining] to God, that he may offer both gifts and sacrifices for sins:";
hnv[1] = "For every Kohen Gadol, being taken from among men, is appointed for men in things pertaining to God, that he may offer both gifts and sacrifices for sins.";
vul[1] = "omnis namque pontifex ex hominibus adsumptus pro hominibus constituitur in his quae sunt ad Deum ut offerat dona et sacrificia pro peccatis";
kjv[2] = "Who can have compassion on the ignorant, and on them that are out of the way; for that he himself also is compassed with infirmity.";
rsv[2] = "He can deal gently with the ignorant and wayward, since he himself is beset with weakness.";
asv[2] = "who can bear gently with the ignorant and erring, for that he himself also is compassed with infirmity;";
yng[2] = "able to be gentle to those ignorant and going astray, since himself also is compassed with infirmity;";
dby[2] = "being able to exercise forbearance towards the ignorant and erring, since he himself also is clothed with infirmity;";
web[2] = "Who can have compassion on the ignorant, and on them that are out of the way; for that he himself also is compassed with infirmity.";
hnv[2] = "The Kohen Gadol can deal gently with those who are ignorant and going astray, because he himself is also surrounded with weakness.";
vul[2] = "qui condolere possit his qui ignorant et errant quoniam et ipse circumdatus est infirmitate";
kjv[3] = "And by reason hereof he ought, as for the people, so also for himself, to offer for sins.";
rsv[3] = "Because of this he is bound to offer sacrifice for his own sins as well as for those of the people.";
asv[3] = "and by reason thereof is bound, as for the people, so also for himself, to offer for sins.";
yng[3] = "and because of this infirmity he ought, as for the people, so also for himself to offer for sins;";
dby[3] = "and, on account of this [infirmity], he ought, even as for the people, so also for himself, to offer for sins.";
web[3] = "And by reason of this he ought, as for the people, so also for himself, to offer for sins.";
hnv[3] = "Because of this, he must offer sacrifices for sins for the people, as well as for himself.";
vul[3] = "et propter eam debet quemadmodum et pro populo ita etiam pro semet ipso offerre pro peccatis";
kjv[4] = "And no man taketh this honour unto himself, but he that is called of God, as [was] Aaron.";
rsv[4] = "And one does not take the honor upon himself, but he is called by God, just as Aaron was.";
asv[4] = "And no man taketh the honor unto himself, but when he is called of God, even as was Aaron.";
yng[4] = "and no one to himself doth take the honour, but he who is called by God, as also Aaron:";
dby[4] = "And no one takes the honour to himself but [as] called by God, even as Aaron also.";
web[4] = "And no man taketh this honor to himself, but he that is called by God, as [was] Aaron:";
hnv[4] = " Nobody takes this honor on himself, but he is called by God, just like Aharon was.";
vul[4] = "nec quisquam sumit sibi honorem sed qui vocatur a Deo tamquam Aaron";
kjv[5] = "So also Christ glorified not himself to be made an high priest; but he that said unto him, Thou art my Son, to day have I begotten thee.";
rsv[5] = "So also Christ did not exalt himself to be made a high priest, but was appointed by him who said to him, &quot;Thou art my Son, today I have begotten thee&quot;;";
asv[5] = "So Christ also glorified not himself to be made a high priest, but he that spake unto him, Thou art my Son, This day have I begotten thee: ";
yng[5] = "so also the Christ did not glorify himself to become chief priest, but He who spake unto him: `My Son thou art, I to-day have begotten thee;\'";
dby[5] = "Thus the Christ also has not glorified himself to be made a high priest; but he who had said to him, *Thou* art my Son, *I* have to-day begotten thee.";
web[5] = "So also Christ glorified not himself to be made a high priest; but he that said to him, Thou art my Son, to-day have I begotten thee.";
hnv[5] = "So also Messiah didn\'t glorify himself to be made a Kohen Gadol, but it was he who said to him, &quot;You are my Son. Today I have become your father.&quot;";
vul[5] = "sic et Christus non semet ipsum clarificavit ut pontifex fieret sed qui locutus est ad eum Filius meus es tu ego hodie genui te";
kjv[6] = "As he saith also in another [place], Thou [art] a priest for ever after the order of Melchisedec.";
rsv[6] = "as he says also in another place, &quot;Thou art a priest for ever, after the order of Melchiz\'edek.&quot;";
asv[6] = "as he saith also in another [place,] Thou art a priest for ever After the order of Melchizedek. ";
yng[6] = "as also in another [place] He saith, `Thou [art] a priest -- to the age, according to the order of Melchisedek;\'";
dby[6] = "Even as also in another [place] he says, *Thou* [art] a priest for ever according to the order of Melchisedec.";
web[6] = "As he saith also in another [place], Thou [art] a priest for ever after the order of Melchisedec.";
hnv[6] = "As he says also in another place, &quot;You are a Kohen forever, After the order of Malki-Tzedek.&quot;";
vul[6] = "quemadmodum et in alio dicit tu es sacerdos in aeternum secundum ordinem Melchisedech";
kjv[7] = "Who in the days of his flesh, when he had offered up prayers and supplications with strong crying and tears unto him that was able to save him from death, and was heard in that he feared;";
rsv[7] = "In the days of his flesh, Jesus offered up prayers and supplications, with loud cries and tears, to him who was able to save him from death, and he was heard for his godly fear.";
asv[7] = "Who in the days of his flesh, having offered up prayers and supplications with strong crying and tears unto him that was able to save him from death, and having been heard for his godly fear,";
yng[7] = "who in the days of his flesh both prayers and supplications unto Him who was able to save him from death -- with strong crying and tears -- having offered up, and having been heard in respect to that which he feared,";
dby[7] = "Who in the days of his flesh, having offered up both supplications and entreaties to him who was able to save him out of death, with strong crying and tears; (and having been heard because of his piety;)";
web[7] = "Who in the days of his flesh, when he had offered up prayers and supplications with strong crying and tears to him that was able to save him from death, and was heard, in that he feared;";
hnv[7] = "He, in the days of his flesh, having offered up prayers and petitions with strong crying and tears to him who was able to save him from death, and having been heard for his godly fear,";
vul[7] = "qui in diebus carnis suae preces supplicationesque ad eum qui possit salvum illum a morte facere cum clamore valido et lacrimis offerens et exauditus pro sua reverentia";
kjv[8] = "Though he were a Son, yet learned he obedience by the things which he suffered;";
rsv[8] = "Although he was a Son, he learned obedience through what he suffered;";
asv[8] = "though he was a Son, yet learned obedience by the things which he suffered;";
yng[8] = "through being a Son, did learn by the things which he suffered -- the obedience,";
dby[8] = "though he were Son, he learned obedience from the things which he suffered;";
web[8] = "Though he was a Son, yet he learned obedience by the things which he suffered;";
hnv[8] = "though he was a Son, yet learned obedience by the things which he suffered.";
vul[8] = "et quidem cum esset Filius didicit ex his quae passus est oboedientiam";
kjv[9] = "And being made perfect, he became the author of eternal salvation unto all them that obey him;";
rsv[9] = "and being made perfect he became the source of eternal salvation to all who obey him,";
asv[9] = "and having been made perfect, he became unto all them that obey him the author of eternal salvation;";
yng[9] = "and having been made perfect, he did become to all those obeying him a cause of salvation age-during,";
dby[9] = "and having been perfected, became to all them that obey him, author of eternal salvation;";
web[9] = "And being made perfect, he became the author of eternal salvation to all them that obey him;";
hnv[9] = " Having been made perfect, he became to all of those who obey him the author of eternal salvation,";
vul[9] = "et consummatus factus est omnibus obtemperantibus sibi causa salutis aeternae";
kjv[10] = "Called of God an high priest after the order of Melchisedec.";
rsv[10] = "being designated by God a high priest after the order of Melchiz\'edek.";
asv[10] = "named of God a high priest after the order of Melchizedek.";
yng[10] = "having been addressed by God a chief priest, according to the order of Melchisedek,";
dby[10] = "addressed by God [as] high priest according to the order of Melchisedec.";
web[10] = "Called by God a high priest after the order of Melchisedec.";
hnv[10] = "named by God a Kohen Gadol after the order of Malki-Tzedek.";

kjv[11] = "Of whom we have many things to say, and hard to be uttered, seeing ye are dull of hearing.";
rsv[11] = "About this we have much to say which is hard to explain, since you have become dull of hearing.";
asv[11] = "Of whom we have many things to say, and hard of interpretation, seeing ye are become dull of hearing.";
yng[11] = "concerning whom we have much discourse and of hard explanation to say, since ye have become dull of hearing,";
dby[11] = "Concerning whom we have much to say, and hard to be interpreted in speaking [of it], since ye are become dull in hearing.";
web[11] = "Of whom we have many things to say, and hard to be uttered, seeing ye are dull of hearing.";
hnv[11] = "About him we have many words to say, and hard to interpret, seeing you have become dull of hearing.";
vul[11] = "de quo grandis nobis sermo et ininterpretabilis ad dicendum quoniam inbecilles facti estis ad audiendum";
kjv[12] = "For when for the time ye ought to be teachers, ye have need that one teach you again which [be] the first principles of the oracles of God; and are become such as have need of milk, and not of strong meat.";
rsv[12] = "For though by this time you ought to be teachers, you need some one to teach you again the first principles of God\'s word. You need milk, not solid food;";
asv[12] = "For when by reason of the time ye ought to be teachers, ye have need again that some one teach you the rudiments of the first principles of the oracles of God; and are become such as have need of milk, and not of solid food.";
yng[12] = "for even owing to be teachers, because of the time, again ye have need that one teach you what [are] the elements of the beginning of the oracles of God, and ye have become having need of milk, and not of strong food,";
dby[12] = "For when for the time ye ought to be teachers, ye have again need that [one] should teach you what [are] the elements of the beginning of the oracles of God, and are become such as have need of milk, [and] not of solid food.";
web[12] = "For when for the time ye ought to be teachers, ye have need of one to teach you again which [are] the first principles of the oracles of God; and are become such as have need of milk, and not of strong food.";
hnv[12] = " For when by reason of the time you ought to be teachers, you again need to have someone teach you the rudiments of the first principles of the oracles of God. You have come to need milk, and not solid food.";
vul[12] = "etenim cum deberetis magistri esse propter tempus rursum indigetis ut vos doceamini quae sint elementa exordii sermonum Dei et facti estis quibus lacte opus sit non solido cibo";
kjv[13] = "For every one that useth milk [is] unskilful in the word of righteousness: for he is a babe.";
rsv[13] = "for every one who lives on milk is unskilled in the word of righteousness, for he is a child.";
asv[13] = "For every one that partaketh of milk is without experience of the word of righteousness; for he is a babe.";
yng[13] = "for every one who is partaking of milk [is] unskilled in the word of righteousness -- for he is an infant,";
dby[13] = "For every one that partakes of milk [is] unskilled in the word of righteousness, for he is a babe;";
web[13] = "For every one that useth milk, [is] unskillful in the word of righteousness: for he is a babe.";
hnv[13] = " For everyone who lives on milk is not experienced in the word of righteousness, for he is a baby.";
vul[13] = "omnis enim qui lactis est particeps expers est sermonis iustitiae parvulus enim est";
kjv[14] = "But strong meat belongeth to them that are of full age, [even] those who by reason of use have their senses exercised to discern both good and evil.";
rsv[14] = "But solid food is for the mature, for those who have their faculties trained by practice to distinguish good from evil.";
asv[14] = "But solid food is for fullgrown men, [even] those who by reason of use have their senses exercised to discern good and evil.";
yng[14] = "and of perfect men is the strong food, who because of the use are having the senses exercised, unto the discernment both of good and of evil.";
dby[14] = "but solid food belongs to full-grown men, who, on account of habit, have their senses exercised for distinguishing both good and evil.";
web[14] = "But strong food belongeth to them that are of full age, [even] those who by reason of use have their senses exercised to discern both good and evil.";
hnv[14] = "But solid food is for those who are full grown, who by reason of use have their senses exercised to discern good and evil.";
vul[14] = "perfectorum autem est solidus cibus eorum qui pro consuetudine exercitatos habent sensus ad discretionem boni ac mali";
