csb[1] = "Now faith is the reality of what is hoped for, the proof of what is not seen.";
csb[2] = "For by it our ancestors won God\'s approval.";
csb[3] = "By faith we understand that the universe was created by the word of God, so that what is seen was made from things that are not visible.";
csb[4] = "By faith Abel offered to God a better sacrifice than Cain did. By faith he was approved as a righteous man, because God approved his gifts, and even though he is dead, he still speaks through his faith.";
csb[5] = "By faith Enoch was taken away, and so he did not experience death. He was not to be found because God took him away. For before he was taken away, he was approved as one who pleased God.";
csb[6] = "Now without faith it is impossible to please God, since the one who draws near to him must believe that he exists and that he rewards those who seek him.";
csb[7] = "By faith Noah, after he was warned about what was not yet seen and motivated by godly fear, built an ark to deliver his family. By faith he condemned the world and became an heir of the righteousness that comes by faith.";
csb[8] = "By faith Abraham, when he was called, obeyed and set out for a place that he was going to receive as an inheritance. He went out, even though he did not know where he was going.";
csb[9] = "By faith he stayed as a foreigner in the land of promise, living in tents as did Isaac and Jacob, coheirs of the same promise.";
csb[10] = "For he was looking forward to the city that has foundations, whose architect and builder is God.";
csb[11] = "By faith even Sarah herself, when she was unable to have children, received power to conceive offspring, even though she was past the age, since she considered that the one who had promised was faithful.";
csb[12] = "Therefore, from one man -- in fact, from one as good as dead -- came offspring as numerous as the stars of the sky and as innumerable as the grains of sand along the seashore.";
csb[13] = "These all died in faith, although they had not received the things that were promised. But they saw them from a distance, greeted them, and confessed that they were foreigners and temporary residents on the earth.";
csb[14] = "Now those who say such things make it clear that they are seeking a homeland.";
csb[15] = "If they were thinking about where they came from, they would have had an opportunity to return.";
csb[16] = "But they now desire a better place -- a heavenly one. Therefore, God is not ashamed to be called their God, for he has prepared a city for them.";
csb[17] = "By faith Abraham, when he was tested, offered up Isaac. He received the promises and yet he was offering his one and only son,";
csb[18] = "the one to whom it had been said, Your offspring will be called through Isaac.";
csb[19] = "He considered God to be able even to raise someone from the dead; therefore, he received him back, figuratively speaking.";
csb[20] = "By faith Isaac blessed Jacob and Esau concerning things to come.";
csb[21] = "By faith Jacob, when he was dying, blessed each of the sons of Joseph, and he worshiped, leaning on the top of his staff.";
csb[22] = "By faith Joseph, as he was nearing the end of his life, mentioned the exodus of the Israelites and gave instructions concerning his bones.";
csb[23] = "By faith Moses, after he was born, was hidden by his parents for three months, because they saw that the child was beautiful, and they didn\'t fear the king\'s edict.";
csb[24] = "By faith Moses, when he had grown up, refused to be called the son of Pharaoh\'s daughter";
csb[25] = "and chose to suffer with the people of God rather than to enjoy the fleeting pleasure of sin.";
csb[26] = "For he considered reproach for the sake of Christ to be greater wealth than the treasures of Egypt, since he was looking ahead to the reward.";
csb[27] = "By faith he left Egypt behind, not being afraid of the king\'s anger, for Moses persevered as one who sees him who is invisible.";
csb[28] = "By faith he instituted the Passover and the sprinkling of the blood, so that the destroyer of the firstborn might not touch the Israelites.";
csb[29] = "By faith they crossed the Red Sea as though they were on dry land. When the Egyptians attempted to do this, they were drowned.";
csb[30] = "By faith the walls of Jericho fell down after being marched around by the Israelites for seven days.";
csb[31] = "By faith Rahab the prostitute welcomed the spies in peace and didn\'t perish with those who disobeyed.";
csb[32] = "And what more can I say? Time is too short for me to tell about Gideon, Barak, Samson, Jephthah, David, Samuel, and the prophets,";
csb[33] = "who by faith conquered kingdoms, administered justice, obtained promises, shut the mouths of lions,";
csb[34] = "quenched the raging of fire, escaped the edge of the sword, gained strength in weakness, became mighty in battle, and put foreign armies to flight.";
csb[35] = "Women received their dead, raised to life again. Other people were tortured, not accepting release, so that they might gain a better resurrection.";
csb[36] = "Others experienced mockings and scourgings, as well as bonds and imprisonment.";
csb[37] = "They were stoned, they were sawed in two, they died by the sword, they wandered about in sheepskins, in goatskins, destitute, afflicted, and mistreated.";
csb[38] = "The world was not worthy of them. They wandered in deserts and on mountains, hiding in caves and holes in the ground.";
csb[39] = "All these were approved through their faith, but they did not receive what was promised,";
csb[40] = "since God had provided something better for us, so that they would not be made perfect without us.";
kjv[1] = "Now faith is the substance of things hoped for, the evidence of things not seen.";
kjv[2] = "For by it the elders obtained a good report.";
kjv[3] = "Through faith we understand that the worlds were framed by the word of God, so that things which are seen were not made of things which do appear.";
kjv[4] = "By faith Abel offered unto God a more excellent sacrifice than Cain, by which he obtained witness that he was righteous, God testifying of his gifts: and by it he being dead yet speaketh.";
kjv[5] = "By faith Enoch was translated that he should not see death; and was not found, because God had translated him: for before his translation he had this testimony, that he pleased God.";
kjv[6] = "But without faith [it is] impossible to please [him]: for he that cometh to God must believe that he is, and [that] he is a rewarder of them that diligently seek him.";
kjv[7] = "By faith Noah, being warned of God of things not seen as yet, moved with fear, prepared an ark to the saving of his house; by the which he condemned the world, and became heir of the righteousness which is by faith.";
kjv[8] = "By faith Abraham, when he was called to go out into a place which he should after receive for an inheritance, obeyed; and he went out, not knowing whither he went.";
kjv[9] = "By faith he sojourned in the land of promise, as [in] a strange country, dwelling in tabernacles with Isaac and Jacob, the heirs with him of the same promise:";
kjv[10] = "For he looked for a city which hath foundations, whose builder and maker [is] God.";
kjv[11] = "Through faith also Sara herself received strength to conceive seed, and was delivered of a child when she was past age, because she judged him faithful who had promised.";
kjv[12] = "Therefore sprang there even of one, and him as good as dead, [so many] as the stars of the sky in multitude, and as the sand which is by the sea shore innumerable.";
kjv[13] = "These all died in faith, not having received the promises, but having seen them afar off, and were persuaded of [them], and embraced [them], and confessed that they were strangers and pilgrims on the earth.";
kjv[14] = "For they that say such things declare plainly that they seek a country.";
kjv[15] = "And truly, if they had been mindful of that [country] from whence they came out, they might have had opportunity to have returned.";
kjv[16] = "But now they desire a better [country], that is, an heavenly: wherefore God is not ashamed to be called their God: for he hath prepared for them a city.";
kjv[17] = "By faith Abraham, when he was tried, offered up Isaac: and he that had received the promises offered up his only begotten [son],";
kjv[18] = "Of whom it was said, That in Isaac shall thy seed be called:";
kjv[19] = "Accounting that God [was] able to raise [him] up, even from the dead; from whence also he received him in a figure.";
kjv[20] = "By faith Isaac blessed Jacob and Esau concerning things to come.";
kjv[21] = "By faith Jacob, when he was a dying, blessed both the sons of Joseph; and worshipped, [leaning] upon the top of his staff.";
kjv[22] = "By faith Joseph, when he died, made mention of the departing of the children of Israel; and gave commandment concerning his bones.";
kjv[23] = "By faith Moses, when he was born, was hid three months of his parents, because they saw [he was] a proper child; and they were not afraid of the king\'s commandment.";
kjv[24] = "By faith Moses, when he was come to years, refused to be called the son of Pharaoh\'s daughter;";
kjv[25] = "Choosing rather to suffer affliction with the people of God, than to enjoy the pleasures of sin for a season;";
kjv[26] = "Esteeming the reproach of Christ greater riches than the treasures in Egypt: for he had respect unto the recompence of the reward.";
kjv[27] = "By faith he forsook Egypt, not fearing the wrath of the king: for he endured, as seeing him who is invisible.";
kjv[28] = "Through faith he kept the passover, and the sprinkling of blood, lest he that destroyed the firstborn should touch them.";
kjv[29] = "By faith they passed through the Red sea as by dry [land]: which the Egyptians assaying to do were drowned.";
kjv[30] = "By faith the walls of Jericho fell down, after they were compassed about seven days.";
kjv[31] = "By faith the harlot Rahab perished not with them that believed not, when she had received the spies with peace.";
kjv[32] = "And what shall I more say? for the time would fail me to tell of Gedeon, and [of] Barak, and [of] Samson, and [of] Jephthae; [of] David also, and Samuel, and [of] the prophets:";
kjv[33] = "Who through faith subdued kingdoms, wrought righteousness, obtained promises, stopped the mouths of lions,";
kjv[34] = "Quenched the violence of fire, escaped the edge of the sword, out of weakness were made strong, waxed valiant in fight, turned to flight the armies of the aliens.";
kjv[35] = "Women received their dead raised to life again: and others were tortured, not accepting deliverance; that they might obtain a better resurrection:";
kjv[36] = "And others had trial of [cruel] mockings and scourgings, yea, moreover of bonds and imprisonment:";
kjv[37] = "They were stoned, they were sawn asunder, were tempted, were slain with the sword: they wandered about in sheepskins and goatskins; being destitute, afflicted, tormented;";
kjv[38] = "(Of whom the world was not worthy:) they wandered in deserts, and [in] mountains, and [in] dens and caves of the earth.";
kjv[39] = "And these all, having obtained a good report through faith, received not the promise:";
kjv[40] = "God having provided some better thing for us, that they without us should not be made perfect.";

asv[2] = "For therein the elders had witness borne to them.";
yng[2] = "for in this were the elders testified of;";
dby[2] = "For in [the power of] this the elders have obtained testimony.";

hnv[2] = "For by this, the Zakenim obtained testimony.";

asv[3] = "By faith we understand that the worlds have been framed by the word of God, so that what is seen hath not been made out of things which appear.";
yng[3] = "by faith we understand the ages to have been prepared by a saying of God, in regard to the things seen not having come out of things appearing;";
dby[3] = "By faith we apprehend that the worlds were framed by [the] word of God, so that that which is seen should not take its origin from things which appear.";
web[3] = "Through faith we understand that the worlds were framed by the word of God, so that things which are seen were not made of things which appeared.";
hnv[3] = "By faith, we understand that the universe has been framed by the word of God, so that what is seen has not been made out of things which are visible.";

rsv[4] = "By faith Abel offered to God a more acceptable sacrifice than Cain, through which he received approval as righteous, God bearing witness by accepting his gifts; he died, but through his faith he is still speaking.";
asv[4] = "By faith Abel offered unto God a more excellent sacrifice than Cain, through which he had witness borne to him that he was righteous, God bearing witness in respect of his gifts: and through it he being dead yet speaketh.";

dby[4] = "By faith Abel offered to God a more excellent sacrifice than Cain, by which he obtained testimony of being righteous, God bearing testimony to his gifts, and by it, having died, he yet speaks.";

rsv[5] = "By faith Enoch was taken up so that he should not see death; and he was not found, because God had taken him. Now before he was taken he was attested as having pleased God.";
asv[5] = "By faith Enoch was translated that he should not see death; and he was not found, because God translated him: for he hath had witness borne to him that before his translation he had been well-pleasing unto God:";
yng[5] = "By faith Enoch was translated -- not to see death, and was not found, because God did translate him; for before his translation he had been testified to -- that he had pleased God well,";
dby[5] = "By faith Enoch was translated that he should not see death; and was not found, because God had translated him; for before [his] translation he has the testimony that he had pleased God.";
web[5] = "By faith Enoch was translated, that he should not see death; and was not found, because God had translated him: for before his translation he had this testimony, that he pleased God.";

asv[7] = "By faith Noah, being warned [of God] concerning things not seen as yet, moved with godly fear, prepared an ark to the saving of his house; through which he condemned the world, and became heir of the righteousness which is according to faith.";
yng[7] = "By faith Noah, having been divinely warned concerning the things not yet seen, having feared, did prepare an ark to the salvation of his house, through which he did condemn the world, and of the righteousness according to faith he became heir.";
dby[7] = "By faith, Noah, oracularly warned concerning things not yet seen, moved with fear, prepared an ark for the saving of his house; by which he condemned the world, and became heir of the righteousness which [is] according to faith.";

hnv[8] = "By faith, Avraham, when he was called, obeyed to go out to the place which he was to receive for an inheritance. He went out, not knowing where he went.";

yng[17] = "By faith Abraham hath offered up Isaac, being tried, and the only begotten he did offer up who did receive the promises,";
dby[17] = "By faith Abraham, [when] tried, offered up Isaac, and he who had received to himself the promises offered up his only begotten [son],";
web[17] = "By faith Abraham, when he was tried, offered up Isaac: and he that had received the promises offered up his only-begotten [son],";
hnv[17] = "By faith, Avraham, being tested, offered up Yitzchak. Yes, he who had gladly received the promises was offering up his one and only son;";
vul[17] = "fide obtulit Abraham Isaac cum temptaretur et unigenitum offerebat qui susceperat repromissiones";
rsv[18] = "of whom it was said, &quot;Through Isaac shall your descendants be named.&quot;";
asv[18] = "[even he] to whom it was said, In Isaac shall thy seed be called:";
yng[18] = "of whom it was said -- `In Isaac shall a seed be called to thee;\'";
dby[18] = "as to whom it had been said, In Isaac shall thy seed be called:";
web[18] = "Of whom it was said, That in Isaac shall thy seed be called:";
hnv[18] = "even he to whom it was said, &quot;In Yitzchak will your seed be called;&quot;";
vul[18] = "ad quem dictum est quia in Isaac vocabitur tibi semen";
rsv[19] = "He considered that God was able to raise men even from the dead; hence, figuratively speaking, he did receive him back.";
asv[19] = "accounting that God [is] able to raise up, even from the dead; from whence he did also in a figure receive him back.";
yng[19] = "reckoning that even out of the dead God is able to raise up, whence also in a figure he did receive [him].";
dby[19] = "counting that God [was] able to raise [him] even from among [the] dead, whence also he received him in a figure.";
web[19] = "Accounting that God [was] able to raise [him] even from the dead; from whence also he received him in a figure.";
hnv[19] = "accounting that God is able to raise up even from the dead. Figuratively speaking, he also did receive him back from the dead.";
vul[19] = "arbitrans quia et a mortuis suscitare potens est Deus unde eum et in parabola accepit";
rsv[20] = "By faith Isaac invoked future blessings on Jacob and Esau.";
asv[20] = "By faith Isaac blessed Jacob and Esau, even concerning things to come.";
yng[20] = "By faith, concerning coming things, Isaac did bless Jacob and Esau;";
dby[20] = "By faith Isaac blessed Jacob and Esau concerning things to come.";
web[20] = "By faith Isaac blessed Jacob and Esau concerning things to come.";
hnv[20] = "By faith, Yitzchak blessed Ya`akov and Esav, even concerning things to come.";
vul[20] = "fide et de futuris benedixit Isaac Iacob et Esau";
rsv[21] = "By faith Jacob, when dying, blessed each of the sons of Joseph, bowing in worship over the head of his staff.";
asv[21] = "By faith Jacob, when he was dying, blessed each of the sons of Joseph; and worshipped, [leaning] upon the top of his staff.";
yng[21] = "by faith Jacob dying -- each of the sons of Joseph did bless, and did bow down upon the top of his staff;";
dby[21] = "By faith Jacob [when] dying blessed each of the sons of Joseph, and worshipped on the top of his staff.";
web[21] = "By faith Jacob, when he was dying, blessed both the sons of Joseph; and worshiped, [leaning] upon the top of his staff.";
hnv[21] = "By faith, Ya`akov, when he was dying, blessed each of the sons of Yosef, and worshiped, leaning on the top of his staff.";
vul[21] = "fide Iacob moriens singulis filiorum Ioseph benedixit et adoravit fastigium virgae eius";
rsv[22] = "By faith Joseph, at the end of his life, made mention of the exodus of the Israelites and gave directions concerning his burial.";
asv[22] = "By faith Joseph, when his end was nigh, made mention of the departure of the children of Israel; and gave commandment concerning his bones.";
yng[22] = "by faith, Joseph dying, concerning the outgoing of the sons of Israel did make mention, and concerning his bones did give command.";
dby[22] = "By faith Joseph [when] dying called to mind the going forth of the sons of Israel, and gave commandment concerning his bones.";
web[22] = "By faith Joseph, when he died, made mention of the departing of the children of Israel; and gave commandment concerning his bones.";
hnv[22] = "By faith, Yosef, when his end was near, made mention of the departure of the children of Yisra\'el; and gave instructions concerning his bones.";
vul[22] = "fide Ioseph moriens de profectione filiorum Israhel memoratus est et de ossibus suis mandavit";
rsv[23] = "By faith Moses, when he was born, was hid for three months by his parents, because they saw that the child was beautiful; and they were not afraid of the king\'s edict.";
asv[23] = "By faith Moses, when he was born, was hid three months by his parents, because they saw he was a goodly child; and they were not afraid of the king\'s commandment.";
yng[23] = "By faith Moses, having been born, was hid three months by his parents, because they saw the child comely, and were not afraid of the decree of the king;";
dby[23] = "By faith Moses, being born, was hid three months by his parents, because they saw the child beautiful; and they did not fear the injunction of the king.";
web[23] = "By faith Moses when he was born, was hid three months by his parents, because they saw [he was] a proper child; and they were not afraid of the king\'s commandment.";
hnv[23] = "By faith, Moshe, when he was born, was hidden for three months by his parents, because they saw that he was a beautiful child, and they were not afraid of the king\'s mitzvah.";
vul[23] = "fide Moses natus occultatus est mensibus tribus a parentibus suis eo quod vidissent elegantem infantem et non timuerunt regis edictum";
rsv[24] = "By faith Moses, when he was grown up, refused to be called the son of Pharaoh\'s daughter,";
asv[24] = "By faith Moses, when he was grown up, refused to be called the son of Pharaoh\'s daughter;";
yng[24] = "by faith Moses, having become great, did refuse to be called a son of the daughter of Pharaoh,";
dby[24] = "By faith Moses, when he had become great, refused to be called son of Pharaoh\'s daughter;";
web[24] = "By faith Moses, when he had come to years, refused to be called the son of Pharaoh\'s daughter;";
hnv[24] = "By faith, Moshe, when he had grown up, refused to be called the son of Par`oh\'s daughter,";
vul[24] = "fide Moses grandis factus negavit se esse filium filiae Pharaonis";
rsv[25] = "choosing rather to share ill-treatment with the people of God than to enjoy the fleeting pleasures of sin.";
asv[25] = "choosing rather to share ill treatment with the people of God, than to enjoy the pleasures of sin for a season;";
yng[25] = "having chosen rather to be afflicted with the people of God, than to have sin\'s pleasure for a season,";
dby[25] = "choosing rather to suffer affliction along with the people of God than to have [the] temporary pleasure of sin;";
web[25] = "Choosing rather to suffer affliction with the people of God, than to enjoy the pleasures of sin for a season;";
hnv[25] = "choosing rather to share ill treatment with God\'s people, than to enjoy the pleasures of sin for a time;";
vul[25] = "magis eligens adfligi cum populo Dei quam temporalis peccati habere iucunditatem";
rsv[26] = "He considered abuse suffered for the Christ greater wealth than the treasures of Egypt, for he looked to the reward.";
asv[26] = "accounting the reproach of Christ greater riches than the treasures of Egypt: for he looked unto the recompense of reward.";
yng[26] = "greater wealth having reckoned the reproach of the Christ than the treasures in Egypt, for he did look to the recompense of reward;";
dby[26] = "esteeming the reproach of the Christ greater riches than the treasures of Egypt, for he had respect to the recompense.";
web[26] = "Esteeming the reproach of Christ greater riches than the treasures of Egypt: for he had respect to the recompense of the reward.";
hnv[26] = "accounting the reproach of Messiah greater riches than the treasures of Mitzrayim; for he looked to the reward.";
vul[26] = "maiores divitias aestimans thesauro Aegyptiorum inproperium Christi aspiciebat enim in remunerationem";
rsv[27] = "By faith he left Egypt, not being afraid of the anger of the king; for he endured as seeing him who is invisible.";
asv[27] = "By faith he forsook Egypt, not fearing the wrath of the king: for he endured, as seeing him who is invisible.";
yng[27] = "by faith he left Egypt behind, not having been afraid of the wrath of the king, for, as seeing the Invisible One -- he endured;";
dby[27] = "By faith he left Egypt, not fearing the wrath of the king; for he persevered, as seeing him who is invisible.";
web[27] = "By faith he forsook Egypt, not fearing the wrath of the king: for he endured, as seeing him who is invisible.";
hnv[27] = "By faith, he left Mitzrayim, not fearing the wrath of the king; for he endured, as seeing him who is invisible.";
vul[27] = "fide reliquit Aegyptum non veritus animositatem regis invisibilem enim tamquam videns sustinuit";
rsv[28] = "By faith he kept the Passover and sprinkled the blood, so that the Destroyer of the first-born might not touch them.";
asv[28] = "By faith he kept the passover, and the sprinkling of the blood, that the destroyer of the firstborn should not touch them.";
yng[28] = "by faith he kept the passover, and the sprinkling of the blood, that He who is destroying the first-born might not touch them.";
dby[28] = "By faith he celebrated the passover and the sprinkling of the blood, that the destroyer of the firstborn might not touch them.";
web[28] = "Through faith he kept the passover, and the sprinkling of blood, lest he that destroyed the first-born should touch them.";
hnv[28] = "By faith, he kept the Pesach, and the sprinkling of the blood, that the destroyer of the firstborn should not touch them.";
vul[28] = "fide celebravit pascha et sanguinis effusionem ne qui vastabat primitiva tangeret eos";
rsv[29] = "By faith the people crossed the Red Sea as if on dry land; but the Egyptians, when they attempted to do the same, were drowned.";
asv[29] = "By faith they passed through the Red sea as by dry land: which the Egyptians assaying to do were swallowed up.";
yng[29] = "By faith they did pass through the Red Sea as through dry land, which the Egyptians having received a trial of, were swallowed up;";
dby[29] = "By faith they passed through the Red sea as through dry land; of which the Egyptians having made trial were swallowed up.";
web[29] = "By faith they passed through the Red sea as by dry [land]: which the Egyptians essaying to do were drowned.";
hnv[29] = "By faith, they passed through the Red sea as on dry land. When the Mitzrim tried to do so, they were swallowed up.";
vul[29] = "fide transierunt mare Rubrum tamquam per aridam terram quod experti Aegyptii devorati sunt";
rsv[30] = "By faith the walls of Jericho fell down after they had been encircled for seven days.";
asv[30] = "By faith the walls of Jericho fell down, after they had been compassed about for seven days.";
yng[30] = "by faith the walls of Jericho did fall, having been surrounded for seven days;";
dby[30] = "By faith the walls of Jericho fell, having been encircled for seven days.";
web[30] = "By faith the walls of Jericho fell down after they had been encompassed seven days.";
hnv[30] = "By faith, the walls of Yericho fell down, after they had been encircled for seven days.";
vul[30] = "fide muri Hiericho ruerunt circuiti dierum septem";
rsv[31] = "By faith Rahab the harlot did not perish with those who were disobedient, because she had given friendly welcome to the spies.";
asv[31] = "By faith Rahab the harlot perished not with them that were disobedient, having received the spies with peace.";
yng[31] = "by faith Rahab the harlot did not perish with those who disbelieved, having received the spies with peace.";
dby[31] = "By faith Rahab the harlot did not perish along with the unbelieving, having received the spies in peace.";
web[31] = "By faith the harlot Rahab perished not with them that believed not, as she had received the spies with peace.";
hnv[31] = "By faith, Rachav the prostitute, didn\'t perish with those who were disobedient, having received the spies in shalom.";
vul[31] = "fide Raab meretrix non periit cum incredulis excipiens exploratores cum pace";
rsv[32] = "And what more shall I say? For time would fail me to tell of Gideon, Barak, Samson, Jephthah, of David and Samuel and the prophets--";
asv[32] = "And what shall I more say? for the time will fail me if I tell of Gideon, Barak, Samson, Jephthah; of David and Samuel and the prophets:";
yng[32] = "And what shall I yet say? for the time will fail me recounting about Gideon, Barak also, and Samson, and Jephthah, David also, and Samuel, and the prophets,";
dby[32] = "And what more do I say? For the time would fail me telling of Gideon, and Barak, and Samson, and Jephthah, and David and Samuel, and of the prophets:";
web[32] = "And what shall I say more? for the time would fail me to tell of Gideon, and [of] Barak, and [of] Samson, and [of] Jephthah, [of] David also, and Samuel, and [of] the prophets:";
hnv[32] = "What more shall I say? For the time would fail me if I told of Gid`on, Barak, Shimshon, Yiftach, David, Shemu\'el, and the prophets;";
vul[32] = "et quid adhuc dicam deficiet enim me tempus enarrantem de Gedeon Barac Samson Iepthae David et Samuhel et prophetis";
rsv[33] = "who through faith conquered kingdoms, enforced justice, received promises, stopped the mouths of lions,";
asv[33] = "who through faith subdued kingdoms, wrought righteousness, obtained promises, stopped the mouths of lions,";
yng[33] = "who through faith did subdue kingdoms, wrought righteousness, obtained promises, stopped mouths of lions,";
dby[33] = "who by faith overcame kingdoms, wrought righteousness, obtained promises, stopped lions\' mouths,";
web[33] = "Who through faith subdued kingdoms, wrought righteousness, obtained promises, stopped the mouths of lions,";
hnv[33] = "who, through faith subdued kingdoms, worked out righteousness, obtained promises, stopped the mouths of lions,";
vul[33] = "qui per fidem devicerunt regna operati sunt iustitiam adepti sunt repromissiones obturaverunt ora leonum";
rsv[34] = "quenched raging fire, escaped the edge of the sword, won strength out of weakness, became mighty in war, put foreign armies to flight.";
asv[34] = "quenched the power of fire, escaped the edge of the sword, from weakness were made strong, waxed mighty in war, turned to flight armies of aliens.";
yng[34] = "quenched the power of fire, escaped the mouth of the sword, were made powerful out of infirmities, became strong in battle, caused to give way camps of the aliens.";
dby[34] = "quenched [the] power of fire, escaped [the] edge of the sword, became strong out of weakness, became mighty in war, made [the] armies of strangers give way.";
web[34] = "Quenched the violence of fire, escaped the edge of the sword, out of weakness were made strong, became valiant in fight, turned to flight the armies of the aliens.";
hnv[34] = "quenched the power of fire, escaped the edge of the sword, from weakness were made strong, grew mighty in war, and turned to flight armies of aliens.";
vul[34] = "extinxerunt impetum ignis effugerunt aciem gladii convaluerunt de infirmitate fortes facti sunt in bello castra verterunt exterorum";
rsv[35] = "Women received their dead by resurrection. Some were tortured, refusing to accept release, that they might rise again to a better life.";
asv[35] = "Women received their dead by a resurrection: and others were tortured, not accepting their deliverance; that they might obtain a better resurrection:";
yng[35] = "Women received by a rising again their dead, and others were tortured, not accepting the redemption, that a better rising again they might receive,";
dby[35] = "Women received their dead again by resurrection; and others were tortured, not having accepted deliverance, that they might get a better resurrection;";
web[35] = "Women received their dead raised to life again: and others were tortured, not accepting deliverance; that they might obtain a better resurrection:";
hnv[35] = "Women received their dead by resurrection. Others were tortured, not accepting their deliverance, that they might obtain a better resurrection.";
vul[35] = "acceperunt mulieres de resurrectione mortuos suos alii autem distenti sunt non suscipientes redemptionem ut meliorem invenirent resurrectionem";
rsv[36] = "Others suffered mocking and scourging, and even chains and imprisonment.";
asv[36] = "and others had trial of mockings and scourgings, yea, moreover of bonds and imprisonment:";
yng[36] = "and others of mockings and scourgings did receive trial, and yet of bonds and imprisonment;";
dby[36] = "and others underwent trial of mockings and scourgings, yea, and of bonds and imprisonment.";
web[36] = "And others had trial of [cruel] mockings and scourgings, and, moreover of bonds and imprisonment:";
hnv[36] = "Others were tried by mocking and scourging, yes, moreover by bonds and imprisonment.";
vul[36] = "alii vero ludibria et verbera experti insuper et vincula et carceres";
rsv[37] = "They were stoned, they were sawn in two, they were killed with the sword; they went about in skins of sheep and goats, destitute, afflicted, ill-treated--";
asv[37] = "they were stoned, they were sawn asunder, they were tempted, they were slain with the sword: they went about in sheepskins, in goatskins; being destitute, afflicted, ill-treated";
yng[37] = "they were stoned, they were sawn asunder, they were tried; in the killing of the sword they died; they went about in sheepskins, in goatskins -- being destitute, afflicted, injuriously treated,";
dby[37] = "They were stoned, were sawn asunder, were tempted, died by the death of the sword; they went about in sheepskins, in goatskins, destitute, afflicted, evil treated,";
web[37] = "They were stoned, they were sawn asunder, were tempted, were slain with the sword: they wandered about in sheep-skins, and goat-skins; being destitute, afflicted, tormented;";
hnv[37] = "They were stoned. They were sawn apart. They were tempted. They were slain with the sword. They went around in sheepskins, in goatskins; being destitute, afflicted, ill-treated";
vul[37] = "lapidati sunt secti sunt temptati sunt in occisione gladii mortui sunt circumierunt in melotis in pellibus caprinis egentes angustiati adflicti";
rsv[38] = "of whom the world was not worthy--wandering over deserts and mountains, and in dens and caves of the earth.";
asv[38] = "(of whom the world was not worthy), wandering in deserts and mountains and caves, and the holes of the earth.";
yng[38] = "of whom the world was not worthy; in deserts wandering, and [in] mountains, and [in] caves, and [in] the holes of the earth;";
dby[38] = "(of whom the world was not worthy,) wandering in deserts and mountains, and [in] dens and caverns of the earth.";
web[38] = "(Of whom the world was not worthy:) they wandered in deserts, and [in] mountains, and [in] dens and caves of the earth.";
hnv[38] = "(of whom the world was not worthy), wandering in deserts, mountains, caves, and the holes of the eretz.";
vul[38] = "quibus dignus non erat mundus in solitudinibus errantes et montibus et speluncis et in cavernis terrae";
rsv[39] = "And all these, though well attested by their faith, did not receive what was promised,";
asv[39] = "And these all, having had witness borne to them through their faith, received not the promise,";
yng[39] = "and these all, having been testified to through the faith, did not receive the promise,";
dby[39] = "And these all, having obtained witness through faith, did not receive the promise,";
web[39] = "And these all, having obtained a good report through faith, received not the promise:";
hnv[39] = "These all, having had testimony given to them through their faith, didn\'t receive the promise,";
vul[39] = "et hii omnes testimonio fidei probati non acceperunt repromissionem";
rsv[40] = "since God had foreseen something better for us, that apart from us they should not be made perfect.";
asv[40] = "God having provided some better thing concerning us, that apart from us they should not be made perfect.";
yng[40] = "God for us something better having provided, that apart from us they might not be made perfect.";
dby[40] = "God having foreseen some better thing for us, that they should not be made perfect without us.";
web[40] = "God having provided some better [thing] for us, that they without us should not be made perfect.";
hnv[40] = "God having provided some better thing concerning us, so that apart from us they should not be made perfect.";
vul[40] = "Deo pro nobis melius aliquid providente ut ne sine nobis consummarentur";
</script>
