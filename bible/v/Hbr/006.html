csb[1] = "Therefore, let us leave the elementary teaching about Christ and go on to maturity, not laying again a foundation of repentance from dead works, faith in God,";
csb[2] = "teaching about ritual washings, laying on of hands, the resurrection of the dead, and eternal judgment.";
csb[3] = "And we will do this if God permits.";
csb[4] = "For it is impossible to renew to repentance those who were once enlightened, who tasted the heavenly gift, who shared in the Holy Spirit,";
csb[5] = "who tasted God\'s good word and the powers of the coming age,";
csb[6] = "and who have fallen away. This is because, to their own harm, they are recrucifying the Son of God and holding him up to contempt.";
csb[7] = "For the ground that drinks the rain that often falls on it and that produces vegetation useful to those for whom it is cultivated receives a blessing from God.";
csb[8] = "But if it produces thorns and thistles, it is worthless and about to be cursed, and at the end will be burned.";
csb[9] = "Even though we are speaking this way, dearly loved friends, in your case we are confident of things that are better and that pertain to salvation.";
csb[10] = "For God is not unjust; he will not forget your work and the love you demonstrated for his name by serving the saints -- and by continuing to serve them.";
csb[11] = "Now we desire each of you to demonstrate the same diligence for the full assurance of your hope until the end,";
csb[12] = "so that you won\'t become lazy but will be imitators of those who inherit the promises through faith and perseverance.";
csb[13] = "For when God made a promise to Abraham, since he had no one greater to swear by, he swore by himself:";
csb[14] = "I will indeed bless you, and I will greatly multiply you.";
csb[15] = "And so, after waiting patiently, Abraham obtained the promise.";
csb[16] = "For people swear by something greater than themselves, and for them a confirming oath ends every dispute.";
csb[17] = "Because God wanted to show his unchangeable purpose even more clearly to the heirs of the promise, he guaranteed it with an oath,";
csb[18] = "so that through two unchangeable things, in which it is impossible for God to lie, we who have fled for refuge might have strong encouragement to seize the hope set before us.";
csb[19] = "We have this hope as an anchor for the soul, firm and secure. It enters the inner sanctuary behind the curtain.";
csb[20] = "Jesus has entered there on our behalf as a forerunner, because he has become a high priest forever according to the order of Melchizedek.";
