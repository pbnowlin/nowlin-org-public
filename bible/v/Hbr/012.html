csb[1] = "Therefore, since we also have such a large cloud of witnesses surrounding us, let us lay aside every hindrance and the sin that so easily ensnares us. Let us run with endurance the race that lies before us,";
csb[2] = "keeping our eyes on Jesus, the source and perfecter of our faith. For the joy that lay before him, he endured the cross, despising the shame, and sat down at the right hand of the throne of God.";
csb[3] = "For consider him who endured such hostility from sinners against himself, so that you won\'t grow weary and give up.";
csb[4] = "In struggling against sin, you have not yet resisted to the point of shedding your blood.";
csb[5] = "And you have forgotten the exhortation that addresses you as sons: My son, do not take the Lord\'s discipline lightly or lose heart when you are reproved by him,";
csb[6] = "for the Lord disciplines the one he loves and punishes every son he receives.";
csb[7] = "Endure suffering as discipline: God is dealing with you as sons. For what son is there that a father does not discipline?";
csb[8] = "But if you are without discipline -- which all receive -- then you are illegitimate children and not sons.";
csb[9] = "Furthermore, we had human fathers discipline us, and we respected them. Shouldn\'t we submit even more to the Father of spirits and live?";
csb[10] = "For they disciplined us for a short time based on what seemed good to them, but he does it for our benefit, so that we can share his holiness.";
csb[11] = "No discipline seems enjoyable at the time, but painful. Later on, however, it yields the peaceful fruit of righteousness to those who have been trained by it.";
csb[12] = "Therefore, strengthen your tired hands and weakened knees,";
csb[13] = "and make straight paths for your feet, so that what is lame may not be dislocated but healed instead.";
csb[14] = "Pursue peace with everyone, and holiness -- without it no one will see the Lord.";
csb[15] = "Make sure that no one falls short of the grace of God and that no root of bitterness springs up, causing trouble and defiling many.";
csb[16] = "And make sure that there isn\'t any immoral or irreverent person like Esau, who sold his birthright in exchange for a single meal.";
csb[17] = "For you know that later, when he wanted to inherit the blessing, he was rejected, even though he sought it with tears, because he didn\'t find any opportunity for repentance.";
csb[18] = "For you have not come to what could be touched, to a blazing fire, to darkness, gloom, and storm,";
csb[19] = "to the blast of a trumpet, and the sound of words. Those who heard it begged that not another word be spoken to them,";
csb[20] = "for they could not bear what was commanded: If even an animal touches the mountain, it must be stoned.";
csb[21] = "The appearance was so terrifying that Moses said, I am trembling with fear.";
csb[22] = "Instead, you have come to Mount Zion, to the city of the living God (the heavenly Jerusalem), to myriads of angels, a festive gathering,";
csb[23] = "to the assembly of the firstborn whose names have been written in heaven, to a Judge, who is God of all, to the spirits of righteous people made perfect,";
csb[24] = "and to Jesus, the mediator of a new covenant, and to the sprinkled blood, which says better things than the blood of Abel.";
csb[25] = "See to it that you do not reject the one who speaks. For if they did not escape when they rejected him who warned them on earth, even less will we if we turn away from him who warns us from heaven.";
csb[26] = "His voice shook the earth at that time, but now he has promised, Yet once more I will shake not only the earth but also the heavens.";
csb[27] = "This expression, &quot;Yet once more,&quot; indicates the removal of what can be shaken -- that is, created things -- so that what is not shaken might remain.";
csb[28] = "Therefore, since we are receiving a kingdom that cannot be shaken, let us be thankful. By it, we may serve God acceptably, with reverence and awe,";
csb[29] = "for our God is a consuming fire.";
