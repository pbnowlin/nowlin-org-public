csb[1] = "Now the first covenant also had regulations for ministry and an earthly sanctuary.";
csb[2] = "For a tabernacle was set up, and in the first room, which is called the holy place, were the lampstand, the table, and the presentation loaves.";
csb[3] = "Behind the second curtain was a tent called the most holy place.";
csb[4] = "It had the gold altar of incense and the ark of the covenant, covered with gold on all sides, in which was a gold jar containing the manna, Aaron\'s staff that budded, and the tablets of the covenant.";
csb[5] = "The cherubim of glory were above the ark overshadowing the mercy seat. It is not possible to speak about these things in detail right now.";
csb[6] = "With these things prepared like this, the priests enter the first room repeatedly, performing their ministry.";
csb[7] = "But the high priest alone enters the second room, and he does that only once a year, and never without blood, which he offers for himself and for the sins the people had committed in ignorance.";
csb[8] = "The Holy Spirit was making it clear that the way into the most holy place had not yet been disclosed while the first tabernacle was still standing.";
csb[9] = "This is a symbol for the present time, during which gifts and sacrifices are offered that cannot perfect the worshiper\'s conscience.";
csb[10] = "They are physical regulations and only deal with food, drink, and various washings imposed until the time of the new order.";
csb[11] = "But Christ has appeared as a high priest of the good things that have come. In the greater and more perfect tabernacle not made with hands (that is, not of this creation),";
csb[12] = "he entered the most holy place once for all time, not by the blood of goats and calves, but by his own blood, having obtained eternal redemption.";
csb[13] = "For if the blood of goats and bulls and the ashes of a young cow, sprinkling those who are defiled, sanctify for the purification of the flesh,";
csb[14] = "how much more will the blood of Christ, who through the eternal Spirit offered himself without blemish to God, cleanse our consciences from dead works so that we can serve the living God?";
csb[15] = "Therefore, he is the mediator of a new covenant, so that those who are called might receive the promise of the eternal inheritance, because a death has taken place for redemption from the transgressions committed under the first covenant.";
csb[16] = "Where a will exists, the death of the one who made it must be established.";
csb[17] = "For a will is valid only when people die, since it is never in effect while the one who made it is living.";
csb[18] = "That is why even the first covenant was inaugurated with blood.";
csb[19] = "For when every command had been proclaimed by Moses to all the people according to the law, he took the blood of calves and goats, along with water, scarlet wool, and hyssop, and sprinkled the scroll itself and all the people,";
csb[20] = "saying, This is the blood of the covenant that God has ordained for you.";
csb[21] = "In the same way, he sprinkled the tabernacle and all the articles of worship with blood.";
csb[22] = "According to the law almost everything is purified with blood, and without the shedding of blood there is no forgiveness.";
csb[23] = "Therefore, it was necessary for the copies of the things in the heavens to be purified with these sacrifices, but the heavenly things themselves to be purified with better sacrifices than these.";
csb[24] = "For Christ did not enter a sanctuary made with hands (only a model of the true one) but into heaven itself, so that he might now appear in the presence of God for us.";
csb[25] = "He did not do this to offer himself many times, as the high priest enters the sanctuary yearly with the blood of another.";
csb[26] = "Otherwise, he would have had to suffer many times since the foundation of the world. But now he has appeared one time, at the end of the ages, for the removal of sin by the sacrifice of himself.";
csb[27] = "And just as it is appointed for people to die once -- and after this, judgment --";
csb[28] = "so also Christ, having been offered once to bear the sins of many, will appear a second time, not to bear sin, but to bring salvation to those who are waiting for him.";

vul[21] = "etiam tabernaculum et omnia vasa ministerii sanguine similiter aspersit";
kjv[22] = "And almost all things are by the law purged with blood; and without shedding of blood is no remission.";
rsv[22] = "Indeed, under the law almost everything is purified with blood, and without the shedding of blood there is no forgiveness of sins.";
asv[22] = "And according to the law, I may almost say, all things are cleansed with blood, and apart from shedding of blood there is no remission.";
yng[22] = "and with blood almost all things are purified according to the law, and apart from blood-shedding forgiveness doth not come.";
dby[22] = "and almost all things are purified with blood according to the law, and without blood-shedding there is no remission.";
web[22] = "And almost all things are by the law cleansed with blood; and without shedding of blood is no remission.";
hnv[22] = "According to the law, nearly everything is cleansed with blood, and apart from shedding of blood there is no remission.";
vul[22] = "et omnia paene in sanguine mundantur secundum legem et sine sanguinis fusione non fit remissio";
kjv[23] = "[It was] therefore necessary that the patterns of things in the heavens should be purified with these; but the heavenly things themselves with better sacrifices than these.";
rsv[23] = "Thus it was necessary for the copies of the heavenly things to be purified with these rites, but the heavenly things themselves with better sacrifices than these.";
asv[23] = "It was necessary therefore that the copies of the things in the heavens should be cleansed with these; but the heavenly things themselves with better sacrifices than these.";
yng[23] = "[It is] necessary, therefore, the pattern indeed of the things in the heavens to be purified with these, and the heavenly things themselves with better sacrifices than these;";
dby[23] = "[It was] necessary then that the figurative representations of the things in the heavens should be purified with these; but the heavenly things themselves with sacrifices better than these.";
web[23] = "[It was] therefore necessary that the patterns of things in the heavens should be purified with these; but the heavenly things themselves with better sacrifices than these.";
hnv[23] = "It was necessary therefore that the copies of the things in the heavens should be cleansed with these; but the heavenly things themselves with better sacrifices than these.";
vul[23] = "necesse est ergo exemplaria quidem caelestium his mundari ipsa autem caelestia melioribus hostiis quam istis";
kjv[24] = "For Christ is not entered into the holy places made with hands, [which are] the figures of the true; but into heaven itself, now to appear in the presence of God for us:";
rsv[24] = "For Christ has entered, not into a sanctuary made with hands, a copy of the true one, but into heaven itself, now to appear in the presence of God on our behalf.";
asv[24] = "For Christ entered not into a holy place made with hands, like in pattern to the true; but into heaven itself, now to appear before the face of God for us:";
yng[24] = "for not into holy places made with hands did the Christ enter -- figures of the true -- but into the heaven itself, now to be manifested in the presence of God for us;";
dby[24] = "For the Christ is not entered into holy places made with hand, figures of the true, but into heaven itself, now to appear before the face of God for us:";
web[24] = "For Christ hath not entered into the holy places made with hands, [which are] the figures of the true; but into heaven itself, now to appear in the presence of God for us:";
hnv[24] = "For Messiah hasn\'t entered into holy places made with hands, which are representations of the true, but into heaven itself, now to appear in the presence of God for us;";
vul[24] = "non enim in manufactis sanctis Iesus introiit exemplaria verorum sed in ipsum caelum ut appareat nunc vultui Dei pro nobis";
kjv[25] = "Nor yet that he should offer himself often, as the high priest entereth into the holy place every year with blood of others;";
rsv[25] = "Nor was it to offer himself repeatedly, as the high priest enters the Holy Place yearly with blood not his own;";
asv[25] = "nor yet that he should offer himself often, as the high priest entereth into the holy place year by year with blood not his own;";
yng[25] = "nor that he may many times offer himself, even as the chief priest doth enter into the holy places every year with blood of others;";
dby[25] = "nor in order that he should offer himself often, as the high priest enters into the holy places every year with blood not his own;";
web[25] = "Nor yet that he should offer himself often, as the high priest entereth into the holy place every year with blood of others;";
hnv[25] = "nor yet that he should offer himself often, as the Kohen Gadol enters into the holy place year by year with blood not his own,";
vul[25] = "neque ut saepe offerat semet ipsum quemadmodum pontifex intrat in sancta per singulos annos in sanguine alieno";
kjv[26] = "For then must he often have suffered since the foundation of the world: but now once in the end of the world hath he appeared to put away sin by the sacrifice of himself.";
rsv[26] = "for then he would have had to suffer repeatedly since the foundation of the world. But as it is, he has appeared once for all at the end of the age to put away sin by the sacrifice of himself.";
asv[26] = "else must he often have suffered since the foundation of the world: but now once at the end of the ages hath he been manifested to put away sin by the sacrifice of himself.";
yng[26] = "since it had behoved him many times to suffer from the foundation of the world, but now once, at the full end of the ages, for putting away of sin through his sacrifice, he hath been manifested;";
dby[26] = "since he had [then] been obliged often to suffer from the foundation of the world. But now once in the consummation of the ages he has been manifested for [the] putting away of sin by his sacrifice.";
web[26] = "For then must he often have suffered since the foundation of the world: but now once in the end of the world hath he appeared to put away sin by the sacrifice of himself.";
hnv[26] = "or else he must have suffered often since the foundation of the world. But now once at the end of the ages, he has been revealed to put away sin by the sacrifice of himself.";
vul[26] = "alioquin oportebat eum frequenter pati ab origine mundi nunc autem semel in consummatione saeculorum ad destitutionem peccati per hostiam suam apparuit";
kjv[27] = "And as it is appointed unto men once to die, but after this the judgment:";
rsv[27] = "And just as it is appointed for men to die once, and after that comes judgment,";
asv[27] = "And inasmuch as it is appointed unto men once to die, and after this [cometh] judgment;";
yng[27] = "and as it is laid up to men once to die, and after this -- judgment,";
dby[27] = "And forasmuch as it is the portion of men once to die, and after this judgment;";
web[27] = "And as it is appointed to men once to die, but after this the judgment:";
hnv[27] = "Inasmuch as it is appointed for men to die once, and after this, judgment,";
vul[27] = "et quemadmodum statutum est hominibus semel mori post hoc autem iudicium";
kjv[28] = "So Christ was once offered to bear the sins of many; and unto them that look for him shall he appear the second time without sin unto salvation.";
rsv[28] = "so Christ, having been offered once to bear the sins of many, will appear a second time, not to deal with sin but to save those who are eagerly waiting for him.";
asv[28] = "so Christ also, having been once offered to bear the sins of many, shall appear a second time, apart from sin, to them that wait for him, unto salvation.";
yng[28] = "so also the Christ, once having been offered to bear the sins of many, a second time, apart from a sin-offering, shall appear, to those waiting for him -- to salvation!";
dby[28] = "thus the Christ also, having been once offered to bear the sins of many, shall appear to those that look for him the second time without sin for salvation.";
web[28] = "So Christ was once offered to bear the sins of many; and to them that look for him he will appear the second time without sin to salvation.";
hnv[28] = "so Messiah also, having been once offered to bear the sins of many, will appear a second time, without sin, to those who are eagerly waiting for him for salvation.";
vul[28] = "sic et Christus semel oblatus ad multorum exhaurienda peccata secundo sine peccato apparebit expectantibus se in salutem";
