csb[1] = "Masters, deal with your slaves justly and fairly, since you know that you too have a Master in heaven.";
csb[2] = "Devote yourselves to prayer; stay alert in it with thanksgiving.";
csb[3] = "At the same time, pray also for us that God may open a door to us for the word, to speak the mystery of Christ, for which I am in chains,";
csb[4] = "so that I may make it known as I should.";
csb[5] = "Act wisely toward outsiders, making the most of the time.";
csb[6] = "Let your speech always be gracious, seasoned with salt, so that you may know how you should answer each person.";
csb[7] = "Tychicus, our dearly loved brother, faithful minister, and fellow servant in the Lord, will tell you all the news about me.";
csb[8] = "I have sent him to you for this very purpose, so that you may know how we are and so that he may encourage your hearts.";
csb[9] = "He is coming with Onesimus, a faithful and dearly loved brother, who is one of you. They will tell you about everything here.";
csb[10] = "Aristarchus, my fellow prisoner, sends you greetings, as does Mark, Barnabas\'s cousin (concerning whom you have received instructions: if he comes to you, welcome him),";
csb[11] = "and so does Jesus who is called Justus. These alone of the circumcised are my coworkers for the kingdom of God, and they have been a comfort to me.";
csb[12] = "Epaphras, who is one of you, a servant of Christ Jesus, sends you greetings. He is always wrestling for you in his prayers, so that you can stand mature and fully assured in everything God wills.";
csb[13] = "For I testify about him that he works hard for you, for those in Laodicea, and for those in Hierapolis.";
csb[14] = "Luke, the dearly loved physician, and Demas send you greetings.";
csb[15] = "Give my greetings to the brothers and sisters in Laodicea, and to Nympha and the church in her home.";
csb[16] = "After this letter has been read at your gathering, have it read also in the church of the Laodiceans; and see that you also read the letter from Laodicea.";
csb[17] = "And tell Archippus, &quot;Pay attention to the ministry you have received in the Lord, so that you can accomplish it.&quot;";
csb[18] = "I, Paul, am writing this greeting with my own hand. Remember my chains. Grace be with you.";
kjv[1] = "Masters, give unto [your] servants that which is just and equal; knowing that ye also have a Master in heaven.";

asv[1] = "Masters, render unto your servants that which is just and equal; knowing that ye also have a Master in heaven.";
yng[1] = "The masters! that which is righteous and equal to the servants give ye, having known that ye also have a Master in the heavens.";
dby[1] = "Masters, give to bondmen what is just and fair, knowing that *ye* also have a Master in [the] heavens.";
web[1] = "Masters, give to [your] servants that which is just and equal; knowing that ye also have a Master in heaven.";
hnv[1] = "Masters, give to your servants that which is just and equal, knowing that you also have a Master in heaven.";
vul[1] = "domini quod iustum est et aequum servis praestate scientes quoniam et vos Dominum habetis in caelo";

rsv[2] = "Continue steadfastly in prayer, being watchful in it with thanksgiving;";
asv[2] = "Continue stedfastly in prayer, watching therein with thanksgiving;";
yng[2] = "In the prayer continue ye, watching in it in thanksgiving;";
dby[2] = "Persevere in prayer, watching in it with thanksgiving;";
web[2] = "Continue in prayer, and watch in the same with thanksgiving;";
hnv[2] = "Continue steadfastly in prayer, watching therein with thanksgiving;";
vul[2] = "orationi instate vigilantes in ea in gratiarum actione";
kjv[3] = "Withal praying also for us, that God would open unto us a door of utterance, to speak the mystery of Christ, for which I am also in bonds:";
rsv[3] = "and pray for us also, that God may open to us a door for the word, to declare the mystery of Christ, on account of which I am in prison,";
asv[3] = "withal praying for us also, that God may open unto us a door for the word, to speak the mystery of Christ, for which I am also in bonds;";
yng[3] = "praying at the same time also for us, that God may open to us a door for the word, to speak the secret of the Christ, because of which also I have been bound,";
dby[3] = "praying at the same time for us also, that God may open to us a door of the word to speak the mystery of Christ, on account of which also I am bound,";
web[3] = "At the same time praying also for us, that God would open to us a door of utterance, to speak the mystery of Christ, for which I am also in bonds:";
hnv[3] = "praying together for us also, that God may open to us a door for the word, to speak the mystery of Messiah, for which I am also in bonds;";
vul[3] = "orantes simul et pro nobis ut Deus aperiat nobis ostium sermonis ad loquendum mysterium Christi propter quod etiam vinctus sum";
kjv[4] = "That I may make it manifest, as I ought to speak.";
rsv[4] = "that I may make it clear, as I ought to speak.";
asv[4] = "that I may make it manifest, as I ought to speak.";
yng[4] = "that I may manifest it, as it behoveth me to speak;";
dby[4] = "to the end that I may make it manifest as I ought to speak.";
web[4] = "That I may make it manifest, as I ought to speak.";
hnv[4] = "that I may reveal it as I ought to speak.";
vul[4] = "ut manifestem illud ita ut oportet me loqui";
kjv[5] = "Walk in wisdom toward them that are without, redeeming the time.";
rsv[5] = "Conduct yourselves wisely toward outsiders, making the most of the time.";
asv[5] = "Walk in wisdom toward them that are without, redeeming the time.";
yng[5] = "in wisdom walk ye toward those without, the time forestalling;";
dby[5] = "Walk in wisdom towards those without, redeeming opportunities.";
web[5] = "Walk in wisdom towards them that are without, redeeming the time.";
hnv[5] = " Walk in wisdom toward those who are outside, redeeming the time.";
vul[5] = "in sapientia ambulate ad eos qui foris sunt tempus redimentes";
kjv[6] = "Let your speech [be] alway with grace, seasoned with salt, that ye may know how ye ought to answer every man.";
rsv[6] = "Let your speech always be gracious, seasoned with salt, so that you may know how you ought to answer every one.";
asv[6] = "Let your speech be always with grace, seasoned with salt, that ye may know how ye ought to answer each one.";
yng[6] = "your word always in grace -- with salt being seasoned -- to know how it behoveth you to answer each one.";
dby[6] = "[Let] your word [be] always with grace, seasoned with salt, [so as] to know how ye ought to answer each one.";
web[6] = "Let your speech [be] always with grace, seasoned with salt, that ye may know how ye ought to answer every man.";
hnv[6] = " Let your speech always be with grace, seasoned with salt, that you may know how you ought to answer each one.";
vul[6] = "sermo vester semper in gratia sale sit conditus ut sciatis quomodo oporteat vos unicuique respondere";
kjv[7] = "All my state shall Tychicus declare unto you, [who is] a beloved brother, and a faithful minister and fellowservant in the Lord:";
rsv[7] = "Tych\'icus will tell you all about my affairs; he is a beloved brother and faithful minister and fellow servant in the Lord.";

dby[7] = "Tychicus, the beloved brother and faithful minister and fellow-bondman in [the] Lord, will make known to you all that concerns me;";

asv[8] = "whom I have sent unto you for this very purpose, that ye may know our state, and that he may comfort your hearts;";
yng[8] = "whom I did send unto you for this very thing, that he might know the things concerning you, and might comfort your hearts,";
dby[8] = "whom I have sent to you for this very purpose, that he might know your state, and that he might encourage your hearts:";
web[8] = "Whom I have sent to you for the same purpose, that he may know your state, and comfort your hearts;";
hnv[8] = "I am sending him to you for this very purpose, that he may know your circumstances and comfort your hearts,";
vul[8] = "quem misi ad vos ad hoc ipsum ut cognoscat quae circa vos sunt et consoletur corda vestra";
kjv[9] = "With Onesimus, a faithful and beloved brother, who is [one] of you. They shall make known unto you all things which [are done] here.";
rsv[9] = "and with him Ones\'imus, the faithful and beloved brother, who is one of yourselves. They will tell you of everything that has taken place here.";
asv[9] = "together with Onesimus, the faithful and beloved brother, who is one of you. They shall make known unto you all things that [are done] here.";
yng[9] = "with Onesimus the faithful and beloved brother, who is of you; all things to you shall they make known that [are] here.";
dby[9] = "with Onesimus, the faithful and beloved brother, who is [one] of you. They shall make known to you everything here.";
web[9] = "With Onesimus, a faithful and beloved brother, who is [one] of you. They will make known to you all things which [are done] here.";
hnv[9] = "together with Onesimus, the faithful and beloved brother, who is one of you. They will make known to you everything that is going on here.";

kjv[10] = "Aristarchus my fellowprisoner saluteth you, and Marcus, sister\'s son to Barnabas, (touching whom ye received commandments: if he come unto you, receive him;)";

kjv[11] = "And Jesus, which is called Justus, who are of the circumcision. These only [are my] fellowworkers unto the kingdom of God, which have been a comfort unto me.";

asv[11] = "and Jesus that is called Justus, who are of the circumcision: these only [are my] fellow-workers unto the kingdom of God, men that have been a comfort unto me.";
yng[11] = "and Jesus who is called Justus, who are of the circumcision: these only [are] fellow-workers for the reign of God who did become a comfort to me.";
dby[11] = "and Jesus called Justus, who are of the circumcision. These [are the] only fellow-workers for the kingdom of God who have been a consolation to me.";

hnv[12] = "Epaphras, who is one of you, a servant of Messiah, salutes you, always striving for you in his prayers, that you may stand perfect and complete in all the will of God.";

yng[13] = "for I do testify to him, that he hath much zeal for you, and those in Laodicea, and those in Hierapolis.";

hnv[13] = "For I testify about him, that he has great zeal for you, and for those in Laodicea, and for those in Hierapolis.";
