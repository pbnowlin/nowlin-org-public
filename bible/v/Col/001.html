csb[1] = "Paul, an apostle of Christ Jesus by God\'s will, and Timothy our brother:";
csb[2] = "To the saints in Christ at Colossae, who are faithful brothers and sisters. Grace to you and peace from God our Father.";
csb[3] = "We always thank God, the Father of our Lord Jesus Christ, when we pray for you,";
csb[4] = "for we have heard of your faith in Christ Jesus and of the love you have for all the saints";
csb[5] = "because of the hope reserved for you in heaven. You have already heard about this hope in the word of truth, the gospel";
csb[6] = "that has come to you. It is bearing fruit and growing all over the world, just as it has among you since the day you heard it and came to truly appreciate God\'s grace.";
csb[7] = "You learned this from Epaphras, our dearly loved fellow servant. He is a faithful minister of Christ on your behalf,";
csb[8] = "and he has told us about your love in the Spirit.";
csb[9] = "For this reason also, since the day we heard this, we haven\'t stopped praying for you. We are asking that you may be filled with the knowledge of his will in all wisdom and spiritual understanding,";
csb[10] = "so that you may walk worthy of the Lord, fully pleasing to him: bearing fruit in every good work and growing in the knowledge of God,";
csb[11] = "being strengthened with all power, according to his glorious might, so that you may have great endurance and patience, joyfully";
csb[12] = "giving thanks to the Father, who has enabled you to share in the saints\' inheritance in the light.";
csb[13] = "He has rescued us from the domain of darkness and transferred us into the kingdom of the Son he loves.";
csb[14] = "In him we have redemption, the forgiveness of sins.";
csb[15] = "He is the image of the invisible God, the firstborn over all creation.";
csb[16] = "For everything was created by him, in heaven and on earth, the visible and the invisible, whether thrones or dominions or rulers or authorities -- all things have been created through him and for him.";
csb[17] = "He is before all things, and by him all things hold together.";
csb[18] = "He is also the head of the body, the church; he is the beginning, the firstborn from the dead, so that he might come to have first place in everything.";
csb[19] = "For God was pleased to have all his fullness dwell in him,";
csb[20] = "and through him to reconcile everything to himself, whether things on earth or things in heaven, by making peace through his blood, shed on the cross.";
csb[21] = "Once you were alienated and hostile in your minds expressed in your evil actions.";
csb[22] = "But now he has reconciled you by his physical body through his death, to present you holy, faultless, and blameless before him --";
csb[23] = "if indeed you remain grounded and steadfast in the faith and are not shifted away from the hope of the gospel that you heard. This gospel has been proclaimed in all creation under heaven, and I, Paul, have become a servant of it.";
csb[24] = "Now I rejoice in my sufferings for you, and I am completing in my flesh what is lacking in Christ\'s afflictions for his body, that is, the church.";
csb[25] = "I have become its servant, according to God\'s commission that was given to me for you, to make the word of God fully known,";
csb[26] = "the mystery hidden for ages and generations but now revealed to his saints.";
csb[27] = "God wanted to make known among the Gentiles the glorious wealth of this mystery, which is Christ in you, the hope of glory.";
csb[28] = "We proclaim him, warning and teaching everyone with all wisdom, so that we may present everyone mature in Christ.";
csb[29] = "I labor for this, striving with his strength that works powerfully in me.";
