csb[1] = "So if you have been raised with Christ, seek the things above, where Christ is, seated at the right hand of God.";
csb[2] = "Set your minds on things above, not on earthly things.";
csb[3] = "For you died, and your life is hidden with Christ in God.";
csb[4] = "When Christ, who is your life, appears, then you also will appear with him in glory.";
csb[5] = "Therefore, put to death what belongs to your earthly nature: sexual immorality, impurity, lust, evil desire, and greed, which is idolatry.";

csb[10] = "and have put on the new self. You are being renewed in knowledge according to the image of your Creator.";

csb[13] = "bearing with one another and forgiving one another if anyone has a grievance against another. Just as the Lord has forgiven you, so you are also to forgive.";
csb[14] = "Above all, put on love, which is the perfect bond of unity.";
csb[15] = "And let the peace of Christ, to which you were also called in one body, rule your hearts. And be thankful.";
csb[16] = "Let the word of Christ dwell richly among you, in all wisdom teaching and admonishing one another through psalms, hymns, and spiritual songs, singing to God with gratitude in your hearts.";
csb[17] = "And whatever you do, in word or in deed, do everything in the name of the Lord Jesus, giving thanks to God the Father through him.";
