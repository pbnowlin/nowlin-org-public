csb[1] = "Now Peter and John were going up to the temple for the time of prayer at three in the afternoon.";
csb[2] = "A man who was lame from birth was being carried there. He was placed each day at the temple gate called Beautiful, so that he could beg from those entering the temple.";
csb[3] = "When he saw Peter and John about to enter the temple, he asked for money.";
csb[4] = "Peter, along with John, looked straight at him and said, &quot;Look at us.&quot;";
csb[5] = "So he turned to them, expecting to get something from them.";
csb[6] = "But Peter said, &quot;I don\'t have silver or gold, but what I do have, I give you: In the name of Jesus Christ of Nazareth, get up and walk! &quot;";
csb[7] = "Then, taking him by the right hand he raised him up, and at once his feet and ankles became strong.";
csb[8] = "So he jumped up and started to walk, and he entered the temple with them -- walking, leaping, and praising God.";
csb[9] = "All the people saw him walking and praising God,";
csb[10] = "and they recognized that he was the one who used to sit and beg at the Beautiful Gate of the temple. So they were filled with awe and astonishment at what had happened to him.";
csb[11] = "While he was holding on to Peter and John, all the people, utterly astonished, ran toward them in what is called Solomon\'s Colonnade.";
csb[12] = "When Peter saw this, he addressed the people: &quot;Fellow Israelites, why are you amazed at this? Why do you stare at us, as though we had made him walk by our own power or godliness?";
csb[13] = "&quot;The God of Abraham, Isaac, and Jacob, the God of our ancestors, has glorified his servant Jesus, whom you handed over and denied before Pilate, though he had decided to release him.";
csb[14] = "&quot;You denied the Holy and Righteous One and asked to have a murderer released to you.";
csb[15] = "&quot;You killed the source of life, whom God raised from the dead; we are witnesses of this.";
csb[16] = "&quot;By faith in his name, his name has made this man strong, whom you see and know. So the faith that comes through Jesus has given him this perfect health in front of all of you.";
csb[17] = "&quot;And now, brothers and sisters, I know that you acted in ignorance, just as your leaders also did.";
csb[18] = "&quot;In this way God fulfilled what he had predicted through all the prophets -- that his Messiah would suffer.";
csb[19] = "&quot;Therefore repent and turn back, so that your sins may be wiped out,";
csb[20] = "&quot;that seasons of refreshing may come from the presence of the Lord, and that he may send Jesus, who has been appointed for you as the Messiah.";
csb[21] = "&quot;Heaven must receive him until the time of the restoration of all things, which God spoke about through his holy prophets from the beginning.";
csb[22] = "&quot;Moses said: The Lord your God will raise up for you a prophet like me from among your brothers and sisters. You must listen to everything he tells you.";
csb[23] = "&quot;And everyone who does not listen to that prophet will be completely cut off from the people.";
csb[24] = "&quot;In addition, all the prophets who have spoken, from Samuel and those after him, have also foretold these days.";
csb[25] = "&quot;You are the sons of the prophets and of the covenant that God made with your ancestors, saying to Abraham, And all the families of the earth will be blessed through your offspring.";
csb[26] = "&quot;God raised up his servant and sent him first to you to bless you by turning each of you from your evil ways.&quot;";
kjv[1] = "Now Peter and John went up together into the temple at the hour of prayer, [being] the ninth [hour].";
kjv[2] = "And a certain man lame from his mother\'s womb was carried, whom they laid daily at the gate of the temple which is called Beautiful, to ask alms of them that entered into the temple;";
kjv[3] = "Who seeing Peter and John about to go into the temple asked an alms.";
kjv[4] = "And Peter, fastening his eyes upon him with John, said, Look on us.";
kjv[5] = "And he gave heed unto them, expecting to receive something of them.";
kjv[6] = "Then Peter said, Silver and gold have I none; but such as I have give I thee: In the name of Jesus Christ of Nazareth rise up and walk.";
kjv[7] = "And he took him by the right hand, and lifted [him] up: and immediately his feet and ankle bones received strength.";
kjv[8] = "And he leaping up stood, and walked, and entered with them into the temple, walking, and leaping, and praising God.";
kjv[9] = "And all the people saw him walking and praising God:";
kjv[10] = "And they knew that it was he which sat for alms at the Beautiful gate of the temple: and they were filled with wonder and amazement at that which had happened unto him.";
kjv[11] = "And as the lame man which was healed held Peter and John, all the people ran together unto them in the porch that is called Solomon\'s, greatly wondering.";
kjv[12] = "And when Peter saw [it], he answered unto the people, Ye men of Israel, why marvel ye at this? or why look ye so earnestly on us, as though by our own power or holiness we had made this man to walk?";
kjv[13] = "The God of Abraham, and of Isaac, and of Jacob, the God of our fathers, hath glorified his Son Jesus; whom ye delivered up, and denied him in the presence of Pilate, when he was determined to let [him] go.";
kjv[14] = "But ye denied the Holy One and the Just, and desired a murderer to be granted unto you;";
kjv[15] = "And killed the Prince of life, whom God hath raised from the dead; whereof we are witnesses.";
kjv[16] = "And his name through faith in his name hath made this man strong, whom ye see and know: yea, the faith which is by him hath given him this perfect soundness in the presence of you all.";
kjv[17] = "And now, brethren, I wot that through ignorance ye did [it], as [did] also your rulers.";
kjv[18] = "But those things, which God before had shewed by the mouth of all his prophets, that Christ should suffer, he hath so fulfilled.";
kjv[19] = "Repent ye therefore, and be converted, that your sins may be blotted out, when the times of refreshing shall come from the presence of the Lord;";
kjv[20] = "And he shall send Jesus Christ, which before was preached unto you:";
kjv[21] = "Whom the heaven must receive until the times of restitution of all things, which God hath spoken by the mouth of all his holy prophets since the world began.";
kjv[22] = "For Moses truly said unto the fathers, A prophet shall the Lord your God raise up unto you of your brethren, like unto me; him shall ye hear in all things whatsoever he shall say unto you.";
kjv[23] = "And it shall come to pass, [that] every soul, which will not hear that prophet, shall be destroyed from among the people.";
kjv[24] = "Yea, and all the prophets from Samuel and those that follow after, as many as have spoken, have likewise foretold of these days.";
kjv[25] = "Ye are the children of the prophets, and of the covenant which God made with our fathers, saying unto Abraham, And in thy seed shall all the kindreds of the earth be blessed.";
kjv[26] = "Unto you first God, having raised up his Son Jesus, sent him to bless you, in turning away every one of you from his iniquities.";

web[22] = "For Moses truly said to the fathers, A Prophet will the Lord your God raise up to you, of your brethren, like me; him shall ye hear in all things, whatever he shall say to you.";
hnv[22] = "For Moshe indeed said to the fathers, \'The Lord God will raise up a prophet for you from among your brothers, like me. You shall listen to him in all things whatever he says to you.";
vul[22] = "Moses quidem dixit quia prophetam vobis suscitabit Dominus Deus vester de fratribus vestris tamquam me ipsum audietis iuxta omnia quaecumque locutus fuerit vobis";
rsv[23] = "And it shall be that every soul that does not listen to that prophet shall be destroyed from the people.\'";

rsv[24] = "And all the prophets who have spoken, from Samuel and those who came afterwards, also proclaimed these days.";
