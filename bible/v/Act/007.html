csb[1] = "&quot;Are these things true? &quot; the high priest asked.";
csb[2] = "&quot;Brothers and fathers,&quot; he replied, &quot;listen: The God of glory appeared to our father Abraham when he was in Mesopotamia, before he settled in Haran,";
csb[3] = "&quot;and said to him: Leave your country and relatives, and come to the land that I will show you.";
csb[4] = "&quot;Then he left the land of the Chaldeans and settled in Haran. From there, after his father died, God had him move to this land in which you are now living.";
csb[5] = "&quot;He didn\'t give him an inheritance in it -- not even a foot of ground -- but he promised to give it to him as a possession, and to his descendants after him, even though he was childless.";
csb[6] = "&quot;God spoke in this way: His descendants would be strangers in a foreign country, and they would enslave and oppress them for four hundred years.";
csb[7] = "&quot;I will judge the nation that they will serve as slaves, God said. After this, they will come out and worship me in this place.";
csb[8] = "&quot;And so he gave Abraham the covenant of circumcision. After this, he fathered Isaac and circumcised him on the eighth day. Isaac became the father of Jacob, and Jacob became the father of the twelve patriarchs.";
csb[9] = "&quot;The patriarchs became jealous of Joseph and sold him into Egypt, but God was with him";
csb[10] = "&quot;and rescued him out of all his troubles. He gave him favor and wisdom in the sight of Pharaoh, king of Egypt, who appointed him ruler over Egypt and over his whole household.";
csb[11] = "&quot;Now a famine and great suffering came over all of Egypt and Canaan, and our ancestors could find no food.";
csb[12] = "&quot;When Jacob heard there was grain in Egypt, he sent our ancestors there the first time.";
csb[13] = "&quot;The second time, Joseph revealed himself to his brothers, and Joseph\'s family became known to Pharaoh.";
csb[14] = "&quot;Joseph invited his father Jacob and all his relatives, seventy-five people in all,";
csb[15] = "&quot;and Jacob went down to Egypt. He and our ancestors died there,";
csb[16] = "&quot;were carried back to Shechem, and were placed in the tomb that Abraham had bought for a sum of silver from the sons of Hamor in Shechem.";
csb[17] = "&quot;As the time was approaching to fulfill the promise that God had made to Abraham, the people flourished and multiplied in Egypt";
csb[18] = "&quot;until a different king who did not know Joseph ruled over Egypt.";
csb[19] = "&quot;He dealt deceitfully with our race and oppressed our ancestors by making them abandon their infants outside so that they wouldn\'t survive.";
csb[20] = "&quot;At this time Moses was born, and he was beautiful in God\'s sight. He was cared for in his father\'s home for three months.";
csb[21] = "&quot;When he was put outside, Pharaoh\'s daughter adopted and raised him as her own son.";
csb[22] = "&quot;So Moses was educated in all the wisdom of the Egyptians and was powerful in his speech and actions.";
csb[23] = "&quot;When he was forty years old, he decided to visit his own people, the Israelites.";
csb[24] = "&quot;When he saw one of them being mistreated, he came to his rescue and avenged the oppressed man by striking down the Egyptian.";
csb[25] = "&quot;He assumed his people would understand that God would give them deliverance through him, but they did not understand.";
csb[26] = "&quot;The next day he showed up while they were fighting and tried to reconcile them peacefully, saying, \'Men, you are brothers. Why are you mistreating each other? \'";
csb[27] = "&quot;But the one who was mistreating his neighbor pushed Moses aside, saying: Who appointed you a ruler and a judge over us?";
csb[28] = "&quot;Do you want to kill me, the same way you killed the Egyptian yesterday?";
csb[29] = "&quot;When he heard this, Moses fled and became an exile in the land of Midian, where he became the father of two sons.";
csb[30] = "&quot;After forty years had passed, an angel appeared to him in the wilderness of Mount Sinai, in the flame of a burning bush.";
csb[31] = "&quot;When Moses saw it, he was amazed at the sight. As he was approaching to look at it, the voice of the Lord came:";
csb[32] = "&quot;I am the God of your ancestors -- the God of Abraham, of Isaac, and of Jacob. Moses began to tremble and did not dare to look.";
csb[33] = "&quot;The Lord said to him: Take off the sandals from your feet, because the place where you are standing is holy ground.";
csb[34] = "&quot;I have certainly seen the oppression of my people in Egypt; I have heard their groaning and have come down to set them free. And now, come, I will send you to Egypt.";
csb[35] = "&quot;This Moses, whom they rejected when they said, Who appointed you a ruler and a judge? -- this one God sent as a ruler and a deliverer through the angel who appeared to him in the bush.";
csb[36] = "&quot;This man led them out and performed wonders and signs in the land of Egypt, at the Red Sea, and in the wilderness for forty years.";
csb[37] = "&quot;This is the Moses who said to the Israelites: God will raise up for you a prophet like me from among your brothers and sisters.";
csb[38] = "&quot;He is the one who was in the assembly in the wilderness, with the angel who spoke to him on Mount Sinai, and with our ancestors. He received living oracles to give to us.";
csb[39] = "&quot;Our ancestors were unwilling to obey him. Instead, they pushed him aside, and in their hearts turned back to Egypt.";
csb[40] = "&quot;They told Aaron: Make us gods who will go before us. As for this Moses who brought us out of the land of Egypt, we don\'t know what\'s happened to him.";
csb[41] = "&quot;They even made a calf in those days, offered sacrifice to the idol, and were celebrating what their hands had made.";
csb[42] = "&quot;God turned away and gave them up to worship the stars of heaven, as it is written in the book of the prophets: House of Israel, did you bring me offerings and sacrifices for forty years in the wilderness?";
csb[43] = "&quot;You took up the tent of Moloch and the star of your god Rephan, the images that you made to worship. So I will send you into exile beyond Babylon.";
csb[44] = "&quot;Our ancestors had the tabernacle of the testimony in the wilderness, just as he who spoke to Moses commanded him to make it according to the pattern he had seen.";
csb[45] = "&quot;Our ancestors in turn received it and with Joshua brought it in when they dispossessed the nations that God drove out before them, until the days of David.";
csb[46] = "&quot;He found favor in God\'s sight and asked that he might provide a dwelling place for the God of Jacob.";
csb[47] = "&quot;It was Solomon, rather, who built him a house,";
csb[48] = "&quot;but the Most High does not dwell in sanctuaries made with hands, as the prophet says:";
csb[49] = "&quot;Heaven is my throne, and the earth my footstool. What sort of house will you build for me? says the Lord, or what will be my resting place?";
csb[50] = "&quot;Did not my hand make all these things?";
csb[51] = "&quot;You stiff-necked people with uncircumcised hearts and ears! You are always resisting the Holy Spirit. As your ancestors did, you do also.";
csb[52] = "&quot;Which of the prophets did your ancestors not persecute? They even killed those who foretold the coming of the Righteous One, whose betrayers and murderers you have now become.";
csb[53] = "&quot;You received the law under the direction of angels and yet have not kept it.&quot;";
csb[54] = "When they heard these things, they were enraged and gnashed their teeth at him.";
csb[55] = "Stephen, full of the Holy Spirit, gazed into heaven. He saw the glory of God, and Jesus standing at the right hand of God.";
csb[56] = "He said, &quot;Look, I see the heavens opened and the Son of Man standing at the right hand of God! &quot;";
csb[57] = "They yelled at the top of their voices, covered their ears, and together rushed against him.";
csb[58] = "They dragged him out of the city and began to stone him. And the witnesses laid their garments at the feet of a young man named Saul.";
csb[59] = "While they were stoning Stephen, he called out: &quot;Lord Jesus, receive my spirit! &quot;";
csb[60] = "He knelt down and cried out with a loud voice, &quot;Lord, do not hold this sin against them! &quot; And after saying this, he died.";

kjv[18] = "Till another king arose, which knew not Joseph.";
rsv[18] = "till there arose over Egypt another king who had not known Joseph.";
asv[18] = "till there arose another king over Egypt, who knew not Joseph.";
yng[18] = "till another king rose, who had not known Joseph;";
dby[18] = "until another king over Egypt arose who did not know Joseph.";
web[18] = "Till another king arose, who knew not Joseph.";
hnv[18] = " until there arose a different king, who didn\'t know Yosef.";
vul[18] = "quoadusque surrexit rex alius in Aegypto qui non sciebat Ioseph";
kjv[19] = "The same dealt subtilly with our kindred, and evil entreated our fathers, so that they cast out their young children, to the end they might not live.";
rsv[19] = "He dealt craftily with our race and forced our fathers to expose their infants, that they might not be kept alive.";
asv[19] = "The same dealt craftily with our race, and ill-treated our fathers, that they should cast out their babes to the end they might not live.";
yng[19] = "this one, having dealt subtilely with our kindred, did evil to our fathers, causing to expose their babes, that they might not live;";
dby[19] = "*He* dealt subtilly with our race, and evil entreated the fathers, casting out their infants that they might not live.";
web[19] = "The same dealt subtilly with our kindred, and ill-treated our fathers, so that they cast out their young children, to the end they might not live.";
hnv[19] = "The same took advantage of our race, and mistreated our fathers, and forced them to throw out their babies, so that they wouldn\'t stay alive.";
vul[19] = "hic circumveniens genus nostrum adflixit patres ut exponerent infantes suos ne vivificarentur";
kjv[20] = "In which time Moses was born, and was exceeding fair, and nourished up in his father\'s house three months:";
rsv[20] = "At this time Moses was born, and was beautiful before God. And he was brought up for three months in his father\'s house;";
asv[20] = "At which season Moses was born, and was exceeding fair; and he was nourished three months in his father\'s house:";
yng[20] = "in which time Moses was born, and he was fair to God, and he was brought up three months in the house of his father;";
dby[20] = "In which time Moses was born, and was exceedingly lovely, who was nourished three months in the house of his father.";
web[20] = "In which time Moses was born, and was exceeding fair, and nourished in his father\'s house three months:";
hnv[20] = "At that time Moshe was born, and was exceedingly handsome. He was nourished three months in his father\'s house.";
vul[20] = "eodem tempore natus est Moses et fuit gratus Deo qui nutritus est tribus mensibus in domo patris sui";
kjv[21] = "And when he was cast out, Pharaoh\'s daughter took him up, and nourished him for her own son.";
rsv[21] = "and when he was exposed, Pharaoh\'s daughter adopted him and brought him up as her own son.";
asv[21] = "and when he was cast out, Pharaoh\'s daughter took him up, and nourished him for her own son.";
yng[21] = "and he having been exposed, the daughter of Pharaoh took him up, and did rear him to herself for a son;";
dby[21] = "And when he was cast out, the daughter of Pharaoh took him up, and brought him up for herself [to be] for a son.";
web[21] = "And when he was cast out, Pharaoh\'s daughter took him up, and nourished him for her own son.";
hnv[21] = "When he was thrown out, Par`oh\'s daughter took him up, and reared him as her own son.";
vul[21] = "exposito autem illo sustulit eum filia Pharaonis et enutrivit eum sibi in filium";
kjv[22] = "And Moses was learned in all the wisdom of the Egyptians, and was mighty in words and in deeds.";
rsv[22] = "And Moses was instructed in all the wisdom of the Egyptians, and he was mighty in his words and deeds.";
asv[22] = "And Moses was instructed in all the wisdom of the Egyptians; and he was mighty in his words and works.";
yng[22] = "and Moses was taught in all wisdom of the Egyptians, and he was powerful in words and in works.";
dby[22] = "And Moses was instructed in all [the] wisdom of the Egyptians, and he was mighty in his words and deeds.";
web[22] = "And Moses was learned in all the wisdom of the Egyptians, and was mighty in words and in deeds.";
hnv[22] = "Moshe was instructed in all the wisdom of the Mitzrim. He was mighty in his words and works.";
vul[22] = "et eruditus est Moses omni sapientia Aegyptiorum et erat potens in verbis et in operibus suis";
kjv[23] = "And when he was full forty years old, it came into his heart to visit his brethren the children of Israel.";
rsv[23] = "&quot;When he was forty years old, it came into his heart to visit his brethren, the sons of Israel.";
asv[23] = "But when he was well-nigh forty years old, it came into his heart to visit his brethren the children of Israel.";
yng[23] = "`And when forty years were fulfilled to him, it came upon his heart to look after his brethren, the sons of Israel;";
dby[23] = "And when a period of forty years was fulfilled to him, it came into his heart to look upon his brethren, the sons of Israel;";
web[23] = "And when he was full forty years old, it came into his heart to visit his brethren the children of Israel.";
hnv[23] = "But when he was forty years old, it came into his heart to visit his brothers, the children of Yisra\'el.";
vul[23] = "cum autem impleretur ei quadraginta annorum tempus ascendit in cor eius ut visitaret fratres suos filios Israhel";
kjv[24] = "And seeing one [of them] suffer wrong, he defended [him], and avenged him that was oppressed, and smote the Egyptian:";
rsv[24] = "And seeing one of them being wronged, he defended the oppressed man and avenged him by striking the Egyptian.";
asv[24] = "And seeing one [of them] suffer wrong, he defended him, and avenged him that was oppressed, smiting the Egyptian:";
yng[24] = "and having seen a certain one suffering injustice, he did defend, and did justice to the oppressed, having smitten the Egyptian;";
dby[24] = "and seeing a certain one wronged, he defended [him], and avenged him that was being oppressed, smiting the Egyptian.";
web[24] = "And seeing one [of them] suffer wrong, he defended [him], and avenged him that was oppressed, and smote the Egyptian:";
hnv[24] = "Seeing one of them suffer wrong, he defended him, and avenged him who was oppressed, striking the Mitzrian.";
vul[24] = "et cum vidisset quendam iniuriam patientem vindicavit illum et fecit ultionem ei qui iniuriam sustinebat percusso Aegyptio";
kjv[25] = "For he supposed his brethren would have understood how that God by his hand would deliver them: but they understood not.";
rsv[25] = "He supposed that his brethren understood that God was giving them deliverance by his hand, but they did not understand.";
asv[25] = "and he supposed that his brethren understood that God by his hand was giving them deliverance; but they understood not.";
yng[25] = "and he was supposing his brethren to understand that God through his hand doth give salvation; and they did not understand.";
dby[25] = "For he thought that his brethren would understand that God by his hand was giving them deliverance. But they understood not.";
web[25] = "For he supposed his brethren to understand that God by his hand would deliver them: but they understood not.";
hnv[25] = "He supposed that his brothers understood that God, by his hand, was giving them deliverance; but they didn\'t understand.";
vul[25] = "existimabat autem intellegere fratres quoniam Deus per manum ipsius daret salutem illis at illi non intellexerunt";
kjv[26] = "And the next day he shewed himself unto them as they strove, and would have set them at one again, saying, Sirs, ye are brethren; why do ye wrong one to another?";
rsv[26] = "And on the following day he appeared to them as they were quarreling and would have reconciled them, saying, \'Men, you are brethren, why do you wrong each other?\'";
asv[26] = "And the day following he appeared unto them as they strove, and would have set them at one again, saying, Sirs, ye are brethren; why do ye wrong one to another?";
yng[26] = "`On the succeeding day, also, he shewed himself to them as they are striving, and urged them to peace, saying, Men, brethren are ye, wherefore do ye injustice to one another?";
dby[26] = "And on the morrow he shewed himself to them as they were contending, and compelled them to peace, saying, *Ye* are brethren, why do ye wrong one another?";
web[26] = "And the next day he showed himself to them as they were contending, and would have constrained them to be at peace again, saying, Sirs, ye are brethren: why do ye wrong one to another?";
hnv[26] = "&quot;The day following, he appeared to them as they fought, and urged them to be at shalom again, saying, \'Sirs, you are brothers. Why do you wrong one another?\'";
vul[26] = "sequenti vero die apparuit illis litigantibus et reconciliabat eos in pacem dicens viri fratres estis ut quid nocetis alterutrum";
kjv[27] = "But he that did his neighbour wrong thrust him away, saying, Who made thee a ruler and a judge over us?";
rsv[27] = "But the man who was wronging his neighbor thrust him aside, saying, \'Who made you a ruler and a judge over us?";
asv[27] = "But he that did his neighbor wrong thrust him away, saying, Who made thee a ruler and a judge over us?";
yng[27] = "and he who is doing injustice to the neighbour, did thrust him away, saying, Who set thee a ruler and a judge over us?";
dby[27] = "But he that was wronging his neighbour thrust him away, saying, Who established thee ruler and judge over us?";
web[27] = "But he that did his neighbor wrong, thrust him away, saying, Who made thee a ruler and a judge over us?";
hnv[27] = "But he who did his neighbor wrong pushed him away, saying, \'Who made you a ruler and a judge over us?";
vul[27] = "qui autem iniuriam faciebat proximo reppulit eum dicens quis te constituit principem et iudicem super nos";
kjv[28] = "Wilt thou kill me, as thou diddest the Egyptian yesterday?";
rsv[28] = "Do you want to kill me as you killed the Egyptian yesterday?\'";
asv[28] = "Wouldest thou kill me, as thou killedst the Egyptian yesterday?";
yng[28] = "to kill me dost thou wish, as thou didst kill yesterday the Egyptian?";
dby[28] = "Dost *thou* wish to kill me as thou killedst the Egyptian yesterday?";
web[28] = "Wilt thou kill me, as thou didst the Egyptian yesterday?";
hnv[28] = "Do you want to kill me, as you killed the Mitzrian yesterday?\'";
vul[28] = "numquid interficere me tu vis quemadmodum interfecisti heri Aegyptium";
kjv[29] = "Then fled Moses at this saying, and was a stranger in the land of Madian, where he begat two sons.";
rsv[29] = "At this retort Moses fled, and became an exile in the land of Mid\'ian, where he became the father of two sons.";
asv[29] = "And Moses fled at this saying, and became a sojourner in the land of Midian, where he begat two sons.";
yng[29] = "`And Moses fled at this word, and became a sojourner in the land of Midian, where he begat two sons,";
dby[29] = "And Moses fled at this saying, and became a sojourner in the land of Madiam, where he begat two sons.";
web[29] = "Then Moses fled at this saying, and was a stranger in the land of Madian, where he begat two sons.";
hnv[29] = "Moshe fled at this saying, and became a stranger in the land of Midyan, where he became the father of two sons.";
vul[29] = "fugit autem Moses in verbo isto et factus est advena in terra Madiam ubi generavit filios duos";
kjv[30] = "And when forty years were expired, there appeared to him in the wilderness of mount Sina an angel of the Lord in a flame of fire in a bush.";
rsv[30] = "&quot;Now when forty years had passed, an angel appeared to him in the wilderness of Mount Sinai, in a flame of fire in a bush.";
asv[30] = "And when forty years were fulfilled, an angel appeared to him in the wilderness of mount Sinai, in a flame of fire in a bush.";
yng[30] = "and forty years having been fulfilled, there appeared to him in the wilderness of mount Sinai a messenger of the Lord, in a flame of fire of a bush,";
dby[30] = "And when forty years were fulfilled, an angel appeared to him in the wilderness of mount Sinai, in a flame of fire of a bush.";
web[30] = "And when forty years had expired, there appeared to him in the wilderness of mount Sina, an angel of the Lord in a flame of fire in a bush.";
hnv[30] = "&quot;When forty years were fulfilled, an angel of the Lord appeared to him in the wilderness of Mount Sinai, in a flame of fire in a bush.";
vul[30] = "et expletis annis quadraginta apparuit illi in deserto montis Sina angelus in igne flammae rubi";
kjv[31] = "When Moses saw [it], he wondered at the sight: and as he drew near to behold [it], the voice of the Lord came unto him,";
rsv[31] = "When Moses saw it he wondered at the sight; and as he drew near to look, the voice of the Lord came,";
asv[31] = "And when Moses saw it, he wondered at the sight: and as he drew near to behold, there came a voice of the Lord,";
yng[31] = "and Moses having seen did wonder at the sight; and he drawing near to behold, there came a voice of the Lord unto him,";
dby[31] = "And Moses seeing it wondered at the vision; and as he went up to consider it, there was a voice of [the] Lord,";
web[31] = "When Moses saw [it], he wondered at the sight; and as he drew near to behold [it], the voice of the Lord came to him,";
hnv[31] = "When Moshe saw it, he wondered at the sight. As he came close to see, a voice of the Lord came to him,";
vul[31] = "Moses autem videns admiratus est visum et accedente illo ut consideraret facta est vox Domini";
kjv[32] = "[Saying], I [am] the God of thy fathers, the God of Abraham, and the God of Isaac, and the God of Jacob. Then Moses trembled, and durst not behold.";
rsv[32] = "\'I am the God of your fathers, the God of Abraham and of Isaac and of Jacob.\' And Moses trembled and did not dare to look.";
asv[32] = "I am the God of thy fathers, the God of Abraham, and of Isaac, and of Jacob. And Moses trembled, and durst not behold.";
yng[32] = "I [am] the God of thy fathers; the God of Abraham, and the God of Isaac, and the God of Jacob. `And Moses having become terrified, durst not behold,";
dby[32] = "*I* am the God of thy fathers, the God of Abraham, and of Isaac, and of Jacob. And Moses trembled, and durst not consider [it].";
web[32] = "[Saying], I [am] the God of thy fathers, the God of Abraham, and the God of Isaac, and the God of Jacob. Then Moses trembled, and durst not behold.";
hnv[32] = "\'I am the God of your fathers, the God of Avraham, the God of Yitzchak, and the God of Ya`akov.\' Moshe trembled, and dared not look.";
vul[32] = "ego Deus patrum tuorum Deus Abraham et Deus Isaac et Deus Iacob tremefactus autem Moses non audebat considerare";
kjv[33] = "Then said the Lord to him, Put off thy shoes from thy feet: for the place where thou standest is holy ground.";
rsv[33] = "And the Lord said to him, \'Take off the shoes from your feet, for the place where you are standing is holy ground.";
asv[33] = "And the Lord said unto him, Loose the shoes from thy feet: for the place whereon thou standest is holy ground.";
yng[33] = "and the Lord said to him, Loose the sandal of thy feet, for the place in which thou hast stood is holy ground;";
dby[33] = "And the Lord said to him, Loose the sandal of thy feet, for the place on which thou standest is holy ground.";
web[33] = "Then said the Lord to him, Put off thy shoes from thy feet: for the place where thou standest is holy ground.";
hnv[33] = "The Lord said to him, \'Take your sandals off of your feet, for the place where you stand is holy ground.";
vul[33] = "dixit autem illi Dominus solve calciamentum pedum tuorum locus enim in quo stas terra sancta est";
kjv[34] = "I have seen, I have seen the affliction of my people which is in Egypt, and I have heard their groaning, and am come down to deliver them. And now come, I will send thee into Egypt.";
rsv[34] = "I have surely seen the ill-treatment of my people that are in Egypt and heard their groaning, and I have come down to deliver them. And now come, I will send you to Egypt.\'";
asv[34] = "I have surely seen the affliction of my people that is in Egypt, and have heard their groaning, and I am come down to deliver them: and now come, I will send thee into Egypt.";
yng[34] = "seeing I have seen the affliction of My people that [is] in Egypt, and their groaning I did hear, and came down to deliver them; and now come, I will send thee to Egypt.";
dby[34] = "I have surely seen the ill treatment of my people which is in Egypt, and I have heard their groan, and have come down to take them out of it; and now, come, I will send thee to Egypt.";
web[34] = "I have seen, I have seen the affliction of my people who are in Egypt, and I have heard their groaning, and am come down to deliver them. And now come, I will send thee into Egypt.";
hnv[34] = "I have surely seen the affliction of my people that is in Mitzrayim, and have heard their groaning. I have come down to deliver them. Now come, I will send you into Mitzrayim.\'";
vul[34] = "videns vidi adflictionem populi mei qui est in Aegypto et gemitum eorum audivi et descendi liberare eos et nunc veni et mittam te in Aegyptum";
kjv[35] = "This Moses whom they refused, saying, Who made thee a ruler and a judge? the same did God send [to be] a ruler and a deliverer by the hand of the angel which appeared to him in the bush.";
rsv[35] = "&quot;This Moses whom they refused, saying, \'Who made you a ruler and a judge?\' God sent as both ruler and deliverer by the hand of the angel that appeared to him in the bush.";
asv[35] = "This Moses whom they refused, saying, Who made thee a ruler and a judge? him hath God sent [to be] both a ruler and a deliverer with the hand of the angel that appeared to him in the bush.";
yng[35] = "`This Moses, whom they did refuse, saying, Who did set thee a ruler and a judge? this one God a ruler and a redeemer did send, in the hand of a messenger who appeared to him in the bush;";
dby[35] = "This Moses, whom they refused, saying, Who made thee ruler and judge? him did God send [to be] a ruler and deliverer with the hand of the angel who appeared to him in the bush.";
web[35] = "This Moses, whom they refused, saying, Who made thee a ruler and a judge? the same did God send [to be] a ruler and a deliverer by the hand of the angel who appeared to him in the bush.";
hnv[35] = "&quot;This Moshe, whom they refused, saying, \'Who made you a ruler and a judge?\' -- God has sent him as both a ruler and a deliverer by the hand of the angel who appeared to him in the bush.";
vul[35] = "hunc Mosen quem negaverunt dicentes quis te constituit principem et iudicem hunc Deus principem et redemptorem misit cum manu angeli qui apparuit illi in rubo";
kjv[36] = "He brought them out, after that he had shewed wonders and signs in the land of Egypt, and in the Red sea, and in the wilderness forty years.";
rsv[36] = "He led them out, having performed wonders and signs in Egypt and at the Red Sea, and in the wilderness for forty years.";
asv[36] = "This man led them forth, having wrought wonders and signs in Egypt, and in the Red sea, and in the wilderness forty years.";
yng[36] = "this one did bring them forth, having done wonders and signs in the land of Egypt, and in the Red Sea, and in the wilderness forty years;";
dby[36] = "*He* led them out, having wrought wonders and signs in the land of Egypt, and in the Red sea, and in the wilderness forty years.";
web[36] = "He brought them out, after he had showed wonders and signs in the land of Egypt, and in the Red sea, and in the wilderness forty years.";
hnv[36] = "This man led them out, having worked wonders and signs in Mitzrayim, in the Sea of Suf, and in the wilderness for forty years.";
vul[36] = "hic eduxit illos faciens prodigia et signa in terra Aegypti et in Rubro mari et in deserto annis quadraginta";
kjv[37] = "This is that Moses, which said unto the children of Israel, A prophet shall the Lord your God raise up unto you of your brethren, like unto me; him shall ye hear.";
rsv[37] = "This is the Moses who said to the Israelites, \'God will raise up for you a prophet from your brethren as he raised me up.\'";
asv[37] = "This is that Moses, who said unto the children of Israel, A prophet shall God raise up unto you from among your brethren, like unto me.";
yng[37] = "this is the Moses who did say to the sons of Israel: A prophet to you shall the Lord your God raise up out of your brethren, like to me, him shall ye hear.";
dby[37] = "This is the Moses who said to the sons of Israel, A prophet shall God raise up to you out of your brethren like me [him shall ye hear].";
web[37] = "This is that Moses, who said to the children of Israel, A prophet will the Lord your God raise up to you of your brethren, like me; him will ye hear.";
hnv[37] = "This is that Moshe, who said to the children of Yisra\'el, \'The Lord our God will raise up a prophet for you from among your brothers, like me.\'";
vul[37] = "hic est Moses qui dixit filiis Israhel prophetam vobis suscitabit Deus de fratribus vestris tamquam me";
kjv[38] = "This is he, that was in the church in the wilderness with the angel which spake to him in the mount Sina, and [with] our fathers: who received the lively oracles to give unto us:";
rsv[38] = "This is he who was in the congregation in the wilderness with the angel who spoke to him at Mount Sinai, and with our fathers; and he received living oracles to give to us.";
asv[38] = "This is he that was in the church in the wilderness with the angel that spake to him in the mount Sinai, and with our fathers: who received living oracles to give unto us:";
yng[38] = "`This is he who was in the assembly in the wilderness, with the messenger who is speaking to him in the mount Sinai, and with our fathers who did receive the living oracles to give to us;";
dby[38] = "This is he who was in the assembly in the wilderness, with the angel who spoke to him in the mount Sinai, and with our fathers; who received living oracles to give to us;";
web[38] = "This is he, that was in the church in the wilderness with the angel who spoke to him on the mount Sina, and [with] our fathers: who received the living oracles to give to us:";
hnv[38] = " This is he who was in the assembly in the wilderness with the angel that spoke to him on Mount Sinai, and with our fathers, who received living oracles to give to us,";
vul[38] = "hic est qui fuit in ecclesia in solitudine cum angelo qui loquebatur ei in monte Sina et cum patribus nostris qui accepit verba vitae dare nobis";
kjv[39] = "To whom our fathers would not obey, but thrust [him] from them, and in their hearts turned back again into Egypt,";
rsv[39] = "Our fathers refused to obey him, but thrust him aside, and in their hearts they turned to Egypt,";
asv[39] = "to whom our fathers would not be obedient, but thrust him from them, and turned back in their hearts unto Egypt,";
yng[39] = "to whom our fathers did not wish to become obedient, but did thrust away, and turned back in their hearts to Egypt,";
dby[39] = "to whom our fathers would not be subject, but thrust [him] from them, and in their hearts turned back to Egypt,";
web[39] = "Whom our fathers would not obey, but thrust [him] from them, and in their hearts turned back again into Egypt,";
hnv[39] = "to whom our fathers wouldn\'t be obedient, but rejected him, and turned back in their hearts to Mitzrayim,";
vul[39] = "cui noluerunt oboedire patres nostri sed reppulerunt et aversi sunt cordibus suis in Aegyptum";
kjv[40] = "Saying unto Aaron, Make us gods to go before us: for [as for] this Moses, which brought us out of the land of Egypt, we wot not what is become of him.";
rsv[40] = "saying to Aaron, \'Make for us gods to go before us; as for this Moses who led us out from the land of Egypt, we do not know what has become of him.\'";
asv[40] = "saying unto Aaron, Make us gods that shall go before us: for as for this Moses, who led us forth out of the land of Egypt, we know not what is become of him.";
yng[40] = "saying to Aaron, Make to us gods who shall go on before us, for this Moses, who brought us forth out of the land of Egypt, we have not known what hath happened to him.";
dby[40] = "saying to Aaron, Make us gods who shall go before us; for this Moses, who brought us out of the land of Egypt, we know not what has happened to him.";
web[40] = "Saying to Aaron, Make us gods to go before us: for [as for] this Moses, who brought us out of the land of Egypt, we know not what is become of him.";
hnv[40] = "saying to Aharon, \'Make us gods that will go before us, for as for this Moshe, who led us out of the land of Mitzrayim, we don\'t know what has become of him.\'";
vul[40] = "dicentes ad Aaron fac nobis deos qui praecedant nos Moses enim hic qui eduxit nos de terra Aegypti nescimus quid factum sit ei";
kjv[41] = "And they made a calf in those days, and offered sacrifice unto the idol, and rejoiced in the works of their own hands.";
rsv[41] = "And they made a calf in those days, and offered a sacrifice to the idol and rejoiced in the works of their hands.";
asv[41] = "And they made a calf in those days, and brought a sacrifice unto the idol, and rejoiced in the works of their hands.";
yng[41] = "`And they made a calf in those days, and brought a sacrifice to the idol, and were rejoicing in the works of their hands,";
dby[41] = "And they made a calf in those days, and offered sacrifice to the idol, and rejoiced in the works of their own hands.";
web[41] = "And they made a calf in those days, and offered sacrifice to the idol, and rejoiced in the works of their own hands.";
hnv[41] = "They made a calf in those days, and brought a sacrifice to the idol, and rejoiced in the works of their hands.";
vul[41] = "et vitulum fecerunt in illis diebus et obtulerunt hostiam simulacro et laetabantur in operibus manuum suarum";
kjv[42] = "Then God turned, and gave them up to worship the host of heaven; as it is written in the book of the prophets, O ye house of Israel, have ye offered to me slain beasts and sacrifices [by the space of] forty years in the wilderness?";
rsv[42] = "But God turned and gave them over to worship the host of heaven, as it is written in the book of the prophets: \'Did you offer to me slain beasts and sacrifices, forty years in the wilderness, O house of Israel?";
asv[42] = "But God turned, and gave them up to serve the host of heaven; as it is written in the book of the prophets, Did ye offer unto me slain beasts and sacrifices Forty years in the wilderness, O house of Israel? ";
yng[42] = "and God did turn, and did give them up to do service to the host of the heaven, according as it hath been written in the scroll of the prophets: Slain beasts and sacrifices did ye offer to Me forty years in the wilderness, O house of Israel?";
dby[42] = "But God turned and delivered them up to serve the host of heaven; as it is written in [the] book of the prophets, Have ye offered me victims and sacrifices forty years in the wilderness, O house of Israel?";
web[42] = "Then God turned, and gave them up to worship the host of heaven; as it is written in the book of the prophets, O ye house of Israel, have ye offered to me slain beasts and sacrifices [during] forty years in the wilderness?";
