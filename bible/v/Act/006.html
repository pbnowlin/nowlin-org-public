csb[1] = "In those days, as the disciples were increasing in number, there arose a complaint by the Hellenistic Jews against the Hebraic Jews that their widows were being overlooked in the daily distribution.";
csb[2] = "The Twelve summoned the whole company of the disciples and said, &quot;It would not be right for us to give up preaching the word of God to wait on tables.";
csb[3] = "&quot;Brothers and sisters, select from among you seven men of good reputation, full of the Spirit and wisdom, whom we can appoint to this duty.";
csb[4] = "&quot;But we will devote ourselves to prayer and to the ministry of the word.&quot;";
csb[5] = "This proposal pleased the whole company. So they chose Stephen, a man full of faith and the Holy Spirit, and Philip, Prochorus, Nicanor, Timon, Parmenas, and Nicolaus, a convert from Antioch.";
csb[6] = "They had them stand before the apostles, who prayed and laid their hands on them.";
csb[7] = "So the word of God spread, the disciples in Jerusalem increased greatly in number, and a large group of priests became obedient to the faith.";
csb[8] = "Now Stephen, full of grace and power, was performing great wonders and signs among the people.";
csb[9] = "Opposition arose, however, from some members of the Freedmen\'s Synagogue, composed of both Cyrenians and Alexandrians, and some from Cilicia and Asia, and they began to argue with Stephen.";
csb[10] = "But they were unable to stand up against his wisdom and the Spirit by whom he was speaking.";
csb[11] = "Then they secretly persuaded some men to say, &quot;We heard him speaking blasphemous words against Moses and God.&quot;";
csb[12] = "They stirred up the people, the elders, and the scribes; so they came, seized him, and took him to the Sanhedrin.";
csb[13] = "They also presented false witnesses who said, &quot;This man never stops speaking against this holy place and the law.";
csb[14] = "&quot;For we heard him say that this Jesus of Nazareth will destroy this place and change the customs that Moses handed down to us.&quot;";
csb[15] = "And all who were sitting in the Sanhedrin looked intently at him and saw that his face was like the face of an angel.";
