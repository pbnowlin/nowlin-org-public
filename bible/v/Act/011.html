csb[1] = "The apostles and the brothers and sisters who were throughout Judea heard that the Gentiles had also received the word of God.";
csb[2] = "When Peter went up to Jerusalem, the circumcision party criticized him,";
csb[3] = "saying, &quot;You went to uncircumcised men and ate with them.&quot;";
csb[4] = "Peter began to explain to them step by step:";
csb[5] = "&quot;I was in the town of Joppa praying, and I saw, in a trance, an object that resembled a large sheet coming down, being lowered by its four corners from heaven, and it came to me.";
csb[6] = "&quot;When I looked closely and considered it, I saw the four-footed animals of the earth, the wild beasts, the reptiles, and the birds of the sky.";
csb[7] = "&quot;I also heard a voice telling me, \'Get up, Peter; kill and eat.\'";
csb[8] = "&quot; \'No, Lord! \' I said. \'For nothing impure or ritually unclean has ever entered my mouth.\'";
csb[9] = "&quot;But a voice answered from heaven a second time, \'What God has made clean, you must not call impure.\'";
csb[10] = "&quot;Now this happened three times, and everything was drawn up again into heaven.";
csb[11] = "&quot;At that very moment, three men who had been sent to me from Caesarea arrived at the house where we were.";
csb[12] = "&quot;The Spirit told me to accompany them with no doubts at all. These six brothers also accompanied me, and we went into the man\'s house.";
csb[13] = "&quot;He reported to us how he had seen the angel standing in his house and saying, \'Send to Joppa, and call for Simon, who is also named Peter.";
csb[14] = "&quot;He will speak a message to you by which you and all your household will be saved.\'";
csb[15] = "&quot;As I began to speak, the Holy Spirit came down on them, just as on us at the beginning.";
csb[16] = "&quot;I remembered the word of the Lord, how he said, \'John baptized with water, but you will be baptized with the Holy Spirit.\'";
csb[17] = "&quot;If, then, God gave them the same gift that he also gave to us when we believed in the Lord Jesus Christ, how could I possibly hinder God? &quot;";
csb[18] = "When they heard this they became silent. And they glorified God, saying, &quot;So then, God has given repentance resulting in life even to the Gentiles.&quot;";
csb[19] = "Now those who had been scattered as a result of the persecution that started because of Stephen made their way as far as Phoenicia, Cyprus, and Antioch, speaking the word to no one except Jews.";
csb[20] = "But there were some of them, men from Cyprus and Cyrene, who came to Antioch and began speaking to the Greeks also, proclaiming the good news about the Lord Jesus.";
csb[21] = "The Lord\'s hand was with them, and a large number who believed turned to the Lord.";
csb[22] = "News about them reached the church in Jerusalem, and they sent out Barnabas to travel as far as Antioch.";
csb[23] = "When he arrived and saw the grace of God, he was glad and encouraged all of them to remain true to the Lord with devoted hearts,";
csb[24] = "for he was a good man, full of the Holy Spirit and of faith. And large numbers of people were added to the Lord.";
csb[25] = "Then he went to Tarsus to search for Saul,";
csb[26] = "and when he found him he brought him to Antioch. For a whole year they met with the church and taught large numbers. The disciples were first called Christians at Antioch.";
csb[27] = "In those days some prophets came down from Jerusalem to Antioch.";
csb[28] = "One of them, named Agabus, stood up and predicted by the Spirit that there would be a severe famine throughout the Roman world. This took place during the reign of Claudius.";
csb[29] = "Each of the disciples, according to his ability, determined to send relief to the brothers and sisters who lived in Judea.";
csb[30] = "They did this, sending it to the elders by means of Barnabas and Saul.";

yng[23] = "who, having come, and having seen the grace of God, was glad, and was exhorting all with purpose of heart to cleave to the Lord,";
dby[23] = "who, having arrived and seeing the grace of God, rejoiced, and exhorted all with purpose of heart to abide with the Lord;";
web[23] = "Who, when he came, and had seen the grace of God, was glad, and exhorted them all that with purpose of heart they would cleave to the Lord.";
hnv[23] = "who, when he had come, and had seen the grace of God, was glad. He exhorted them all, that with purpose of heart they should remain near to the Lord.";
vul[23] = "qui cum pervenisset et vidisset gratiam Dei gavisus est et hortabatur omnes proposito cordis permanere in Domino";
kjv[24] = "For he was a good man, and full of the Holy Ghost and of faith: and much people was added unto the Lord.";

asv[24] = "for he was a good man, and full of the Holy Spirit and of faith: and much people was added unto the Lord.";
yng[24] = "because he was a good man, and full of the Holy Spirit, and of faith, and a great multitude was added to the Lord.";

web[24] = "For he was a good man, and full of the Holy Spirit, and of faith: and many people were added to the Lord.";
hnv[24] = "For he was a good man, and full of the Ruach HaKodesh and of faith, and many people were added to the Lord.";
vul[24] = "quia erat vir bonus et plenus Spiritu Sancto et fide et adposita est turba multa Domino";
kjv[25] = "Then departed Barnabas to Tarsus, for to seek Saul:";

kjv[26] = "And when he had found him, he brought him unto Antioch. And it came to pass, that a whole year they assembled themselves with the church, and taught much people. And the disciples were called Christians first in Antioch.";
rsv[26] = "and when he had found him, he brought him to Antioch. For a whole year they met with the church, and taught a large company of people; and in Antioch the disciples were for the first time called Christians.";
asv[26] = "and when he had found him, he brought him unto Antioch. And it came to pass, that even for a whole year they were gathered together with the church, and taught much people; and that the disciples were called Christians first in Antioch.";
yng[26] = "and having found him, he brought him to Antioch, and it came to pass that they a whole year did assemble together in the assembly, and taught a great multitude, the disciples also were divinely called first in Antioch Christians.";
dby[26] = "And having found [him], he brought him to Antioch. And so it was with them that for a whole year they were gathered together in the assembly and taught a large crowd: and the disciples were first called Christians in Antioch.";
web[26] = "And when he had found him, he brought him to Antioch. And it came to pass, that a whole year they assembled themselves with the church, and taught many people. And the disciples were first called Christians in Antioch.";
hnv[26] = " When he had found him, he brought him to Antioch. It happened, that for a whole year they were gathered together with the assembly, and taught many people. The talmidim were first called Messianic in Antioch.";
vul[26] = "et annum totum conversati sunt in ecclesia et docuerunt turbam multam ita ut cognominarentur primum Antiochiae discipuli Christiani";

asv[27] = "Now in these days there came down prophets from Jerusalem unto Antioch.";
yng[27] = "And in those days there came from Jerusalem prophets to Antioch,";
dby[27] = "Now in these days prophets went down from Jerusalem to Antioch;";
web[27] = "And in these days came prophets from Jerusalem to Antioch.";
hnv[27] = "Now in these days, prophets came down from Yerushalayim to Antioch.";
vul[27] = "in his autem diebus supervenerunt ab Hierosolymis prophetae Antiochiam";
kjv[28] = "And there stood up one of them named Agabus, and signified by the Spirit that there should be great dearth throughout all the world: which came to pass in the days of Claudius Caesar.";

asv[28] = "And there stood up one of them named Agabus, and signified by the Spirit that there should be a great famine over all the world: which came to pass in the days of Claudius.";
yng[28] = "and one of them, by name Agabus, having stood up, did signify through the Spirit a great dearth is about to be throughout all the world -- which also came to pass in the time of Claudius Caesar --";
dby[28] = "and one from among them, by name Agabus, rose up and signified by the Spirit that there was going to be a great famine over all the inhabited earth, which also came to pass under Claudius.";
web[28] = "And there stood up one of them named Agabus, and signified by the Spirit that there should be great dearth throughout all the world: which came to pass in the days of Claudius Cesar.";
hnv[28] = "One of them named Agav stood up, and indicated by the Spirit that there should be a great famine all over the world, which also happened in the days of Claudius.";

asv[29] = "And the disciples, every man according to his ability, determined to send relief unto the brethren that dwelt in Judaea:";

hnv[29] = "As any of the talmidim had plenty, each determined to send relief to the brothers who lived in Yehudah;";
