csb[1] = "Agrippa said to Paul, &quot;You have permission to speak for yourself.&quot; Then Paul stretched out his hand and began his defense:";
csb[2] = "&quot;I consider myself fortunate, that it is before you, King Agrippa, I am to make my defense today against all the accusations of the Jews,";
csb[3] = "&quot;especially since you are very knowledgeable about all the Jewish customs and controversies. Therefore I beg you to listen to me patiently.";
csb[4] = "&quot;All the Jews know my way of life from my youth, which was spent from the beginning among my own people and in Jerusalem.";
csb[5] = "&quot;They have known me for a long time, if they are willing to testify, that according to the strictest sect of our religion I lived as a Pharisee.";
csb[6] = "&quot;And now I stand on trial because of the hope in what God promised to our ancestors,";
csb[7] = "&quot;the promise our twelve tribes hope to reach as they earnestly serve him night and day. King Agrippa, I am being accused by the Jews because of this hope.";
csb[8] = "&quot;Why do any of you consider it incredible that God raises the dead?";
csb[9] = "&quot;In fact, I myself was convinced that it was necessary to do many things in opposition to the name of Jesus of Nazareth.";
csb[10] = "&quot;I actually did this in Jerusalem, and I locked up many of the saints in prison, since I had received authority for that from the chief priests. When they were put to death, I was in agreement against them.";
csb[11] = "&quot;In all the synagogues I often punished them and tried to make them blaspheme. Since I was terribly enraged at them, I pursued them even to foreign cities.";
csb[12] = "&quot;I was traveling to Damascus under these circumstances with authority and a commission from the chief priests.";
csb[13] = "&quot;King Agrippa, while on the road at midday, I saw a light from heaven brighter than the sun, shining around me and those traveling with me.";
csb[14] = "&quot;We all fell to the ground, and I heard a voice speaking to me in Aramaic, \'Saul, Saul, why are you persecuting me? It is hard for you to kick against the goads.\'";
csb[15] = "&quot;I asked, \'Who are you, Lord? \' &quot;And the Lord replied: \'I am Jesus, the one you are persecuting.";
csb[16] = "&quot;But get up and stand on your feet. For I have appeared to you for this purpose, to appoint you as a servant and a witness of what you have seen and will see of me.";
csb[17] = "&quot;I will rescue you from your people and from the Gentiles. I am sending you to them";
csb[18] = "&quot;to open their eyes so that they may turn from darkness to light and from the power of Satan to God, that they may receive forgiveness of sins and a share among those who are sanctified by faith in me.\'";
csb[19] = "&quot;So then, King Agrippa, I was not disobedient to the heavenly vision.";
csb[20] = "&quot;Instead, I preached to those in Damascus first, and to those in Jerusalem and in all the region of Judea, and to the Gentiles, that they should repent and turn to God, and do works worthy of repentance.";
csb[21] = "&quot;For this reason the Jews seized me in the temple and were trying to kill me.";
csb[22] = "&quot;To this very day, I have had help from God, and I stand and testify to both small and great, saying nothing other than what the prophets and Moses said would take place --";
csb[23] = "&quot;that the Messiah must suffer, and that, as the first to rise from the dead, he would proclaim light to our people and to the Gentiles.&quot;";
csb[24] = "As he was saying these things in his defense, Festus exclaimed in a loud voice, &quot;You\'re out of your mind, Paul! Too much study is driving you mad.&quot;";
csb[25] = "But Paul replied, &quot;I\'m not out of my mind, most excellent Festus. On the contrary, I\'m speaking words of truth and good judgment.";
csb[26] = "&quot;For the king knows about these matters, and I can speak boldly to him. For I am convinced that none of these things has escaped his notice, since this was not done in a corner.";
csb[27] = "&quot;King Agrippa, do you believe the prophets? I know you believe.&quot;";
csb[28] = "Agrippa said to Paul, &quot;Are you going to persuade me to become a Christian so easily? &quot;";
csb[29] = "&quot;I wish before God,&quot; replied Paul, &quot;that whether easily or with difficulty, not only you but all who listen to me today might become as I am -- except for these chains.&quot;";
csb[30] = "The king, the governor, Bernice, and those sitting with them got up,";
csb[31] = "and when they had left they talked with each other and said, &quot;This man is not doing anything to deserve death or imprisonment.&quot;";
csb[32] = "Agrippa said to Festus, &quot;This man could have been released if he had not appealed to Caesar.&quot;";
kjv[1] = "Then Agrippa said unto Paul, Thou art permitted to speak for thyself. Then Paul stretched forth the hand, and answered for himself:";
kjv[2] = "I think myself happy, king Agrippa, because I shall answer for myself this day before thee touching all the things whereof I am accused of the Jews:";
kjv[3] = "Especially [because I know] thee to be expert in all customs and questions which are among the Jews: wherefore I beseech thee to hear me patiently.";
kjv[4] = "My manner of life from my youth, which was at the first among mine own nation at Jerusalem, know all the Jews;";
kjv[5] = "Which knew me from the beginning, if they would testify, that after the most straitest sect of our religion I lived a Pharisee.";
kjv[6] = "And now I stand and am judged for the hope of the promise made of God unto our fathers:";
kjv[7] = "Unto which [promise] our twelve tribes, instantly serving [God] day and night, hope to come. For which hope\'s sake, king Agrippa, I am accused of the Jews.";
kjv[8] = "Why should it be thought a thing incredible with you, that God should raise the dead?";
kjv[9] = "I verily thought with myself, that I ought to do many things contrary to the name of Jesus of Nazareth.";
kjv[10] = "Which thing I also did in Jerusalem: and many of the saints did I shut up in prison, having received authority from the chief priests; and when they were put to death, I gave my voice against [them].";
kjv[11] = "And I punished them oft in every synagogue, and compelled [them] to blaspheme; and being exceedingly mad against them, I persecuted [them] even unto strange cities.";
kjv[12] = "Whereupon as I went to Damascus with authority and commission from the chief priests,";
kjv[13] = "At midday, O king, I saw in the way a light from heaven, above the brightness of the sun, shining round about me and them which journeyed with me.";
kjv[14] = "And when we were all fallen to the earth, I heard a voice speaking unto me, and saying in the Hebrew tongue, Saul, Saul, why persecutest thou me? [it is] hard for thee to kick against the pricks.";
kjv[15] = "And I said, Who art thou, Lord? And he said, I am Jesus whom thou persecutest.";
kjv[16] = "But rise, and stand upon thy feet: for I have appeared unto thee for this purpose, to make thee a minister and a witness both of these things which thou hast seen, and of those things in the which I will appear unto thee;";
kjv[17] = "Delivering thee from the people, and [from] the Gentiles, unto whom now I send thee,";
kjv[18] = "To open their eyes, [and] to turn [them] from darkness to light, and [from] the power of Satan unto God, that they may receive forgiveness of sins, and inheritance among them which are sanctified by faith that is in me.";
kjv[19] = "Whereupon, O king Agrippa, I was not disobedient unto the heavenly vision:";
kjv[20] = "But shewed first unto them of Damascus, and at Jerusalem, and throughout all the coasts of Judaea, and [then] to the Gentiles, that they should repent and turn to God, and do works meet for repentance.";
kjv[21] = "For these causes the Jews caught me in the temple, and went about to kill [me].";
kjv[22] = "Having therefore obtained help of God, I continue unto this day, witnessing both to small and great, saying none other things than those which the prophets and Moses did say should come:";
kjv[23] = "That Christ should suffer, [and] that he should be the first that should rise from the dead, and should shew light unto the people, and to the Gentiles.";
kjv[24] = "And as he thus spake for himself, Festus said with a loud voice, Paul, thou art beside thyself; much learning doth make thee mad.";
kjv[25] = "But he said, I am not mad, most noble Festus; but speak forth the words of truth and soberness.";
kjv[26] = "For the king knoweth of these things, before whom also I speak freely: for I am persuaded that none of these things are hidden from him; for this thing was not done in a corner.";
kjv[27] = "King Agrippa, believest thou the prophets? I know that thou believest.";
kjv[28] = "Then Agrippa said unto Paul, Almost thou persuadest me to be a Christian.";
kjv[29] = "And Paul said, I would to God, that not only thou, but also all that hear me this day, were both almost, and altogether such as I am, except these bonds.";
kjv[30] = "And when he had thus spoken, the king rose up, and the governor, and Bernice, and they that sat with them:";
kjv[31] = "And when they were gone aside, they talked between themselves, saying, This man doeth nothing worthy of death or of bonds.";
kjv[32] = "Then said Agrippa unto Festus, This man might have been set at liberty, if he had not appealed unto Caesar.";

vul[18] = "aperire oculos eorum ut convertantur a tenebris ad lucem et de potestate Satanae ad Deum ut accipiant remissionem peccatorum et sortem inter sanctos per fidem quae est in me";
rsv[19] = "&quot;Wherefore, O King Agrippa, I was not disobedient to the heavenly vision,";
asv[19] = "Wherefore, O king Agrippa, I was not disobedient unto the heavenly vision:";
yng[19] = "`Whereupon, king Agrippa, I was not disobedient to the heavenly vision,";
dby[19] = "Whereupon, king Agrippa, I was not disobedient to the heavenly vision;";
web[19] = "Upon which O king Agrippa, I was not disobedient to the heavenly vision.";
hnv[19] = "&quot;Therefore, King Agrippa, I was not disobedient to the heavenly vision,";
vul[19] = "unde rex Agrippa non fui incredulus caelestis visionis";
rsv[20] = "but declared first to those at Damascus, then at Jerusalem and throughout all the country of Judea, and also to the Gentiles, that they should repent and turn to God and perform deeds worthy of their repentance.";
asv[20] = "but declared both to them of Damascus first, and at Jerusalem, and throughout all the country of Judaea, and also to the Gentiles, that they should repent and turn to God, doing works worthy of repentance.";
yng[20] = "but to those in Damascus first, and to those in Jerusalem, to all the region also of Judea, and to the nations, I was preaching to reform, and to turn back unto God, doing works worthy of reformation;";
dby[20] = "but have, first to those both in Damascus and Jerusalem, and to all the region of Judaea, and to the nations, announced that they should repent and turn to God, doing works worthy of repentance.";
web[20] = "But showed first to them of Damascus, and at Jerusalem, and throughout all the region of Judea, and [then] to the Gentiles, that they should repent and turn to God, and do works meet for repentance.";
hnv[20] = "but declared first to them of Dammesek, at Yerushalayim, and throughout all the country of Yehudah, and also to the Goyim, that they should repent and turn to God, doing works worthy of repentance.";
vul[20] = "sed his qui sunt Damasci primum et Hierosolymis et in omnem regionem Iudaeae et gentibus adnuntiabam ut paenitentiam agerent et converterentur ad Deum digna paenitentiae opera facientes";
rsv[21] = "For this reason the Jews seized me in the temple and tried to kill me.";
asv[21] = "For this cause the Jews seized me in the temple, and assayed to kill me.";
yng[21] = "because of these things the Jews -- having caught me in the temple -- were endeavouring to kill [me].";
dby[21] = "On account of these things the Jews, having seized me in the temple, attempted to lay hands on and destroy me.";
web[21] = "For these causes the Jews caught me in the temple, and went about to kill [me].";
hnv[21] = "For this reason the Yehudim seized me in the temple, and tried to kill me.";
vul[21] = "hac ex causa me Iudaei cum essem in templo conprehensum temptabant interficere";
rsv[22] = "To this day I have had the help that comes from God, and so I stand here testifying both to small and great, saying nothing but what the prophets and Moses said would come to pass:";
asv[22] = "Having therefore obtained the help that is from God, I stand unto this day testifying both to small and great, saying nothing but what the prophets and Moses did say should come;";
yng[22] = "`Having obtained, therefore, help from God, till this day, I have stood witnessing both to small and to great, saying nothing besides the things that both the prophets and Moses spake of as about to come,";
dby[22] = "Having therefore met with [the] help which is from God, I have stood firm unto this day, witnessing both to small and great, saying nothing else than those things which both the prophets and Moses have said should happen,";
web[22] = "Having therefore obtained help from God, I continue to this day, testifying both to small and great, saying no other things than those which the prophets and Moses did say should come:";
hnv[22] = "Having therefore obtained the help that is from God, I stand to this day testifying both to small and great, saying nothing but what the prophets and Moshe said would happen,";
vul[22] = "auxilio autem adiutus Dei usque in hodiernum diem sto testificans minori atque maiori nihil extra dicens quam ea quae prophetae sunt locuti futura esse et Moses";
rsv[23] = "that the Christ must suffer, and that, by being the first to rise from the dead, he would proclaim light both to the people and to the Gentiles.&quot;";
asv[23] = "how that the Christ must suffer, [and] how that he first by the resurrection of the dead should proclaim light both to the people and to the Gentiles.";
yng[23] = "that the Christ is to suffer, whether first by a rising from the dead, he is about to proclaim light to the people and to the nations.\'";
dby[23] = "[namely,] whether Christ should suffer; whether he first, through resurrection of [the] dead, should announce light both to the people and to the nations.";
web[23] = "That Christ should suffer, [and] that he should be the first that should rise from the dead, and should show light to the people, and to the Gentiles.";
hnv[23] = "how the Messiah must suffer, and how, by the resurrection of the dead, he would be first to proclaim light both to these people and to the Goyim.&quot;";
vul[23] = "si passibilis Christus si primus ex resurrectione mortuorum lumen adnuntiaturus est populo et gentibus";
rsv[24] = "And as he thus made his defense, Festus said with a loud voice, &quot;Paul, you are mad; your great learning is turning you mad.&quot;";
asv[24] = "And as he thus made his defence, Festus saith with a loud voice, Paul, thou art mad; thy much learning is turning thee mad.";
yng[24] = "And, he thus making a defence, Festus with a loud voice said, `Thou art mad, Paul; much learning doth turn thee mad;\'";
dby[24] = "And as he answered for his defence with these things, Festus says with a loud voice, Thou art mad, Paul; much learning turns thee to madness.";
web[24] = "And as he was thus speaking for himself, Festus said with a loud voice, Paul, thou art beside thyself; much learning doth make thee insane.";
hnv[24] = "As he thus made his defense, Festus said with a loud voice, &quot;Sha\'ul, you are crazy! Your great learning is driving you insane!&quot;";
vul[24] = "haec loquente eo et rationem reddente Festus magna voce dixit insanis Paule multae te litterae ad insaniam convertunt";
rsv[25] = "But Paul said, &quot;I am not mad, most excellent Festus, but I am speaking the sober truth.";
asv[25] = "But Paul saith, I am not mad, most excellent Festus; but speak forth words of truth and soberness.";
yng[25] = "and he saith, `I am not mad, most noble Festus, but of truth and soberness the sayings I speak forth;";
dby[25] = "But Paul said, I am not mad, most excellent Festus, but utter words of truth and soberness;";
web[25] = "But he said, I am not insane, most noble Festus; but speak forth the words of truth and soberness.";
hnv[25] = "But he said, &quot;I am not crazy, most excellent Festus, but boldly declare words of truth and reasonableness.";
vul[25] = "at Paulus non insanio inquit optime Feste sed veritatis et sobrietatis verba eloquor";
rsv[26] = "For the king knows about these things, and to him I speak freely; for I am persuaded that none of these things has escaped his notice, for this was not done in a corner.";
asv[26] = "For the king knoweth of these things, unto whom also I speak freely: for I am persuaded that none of these things is hidden from him; for this hath not been done in a corner.";
yng[26] = "for the king doth know concerning these things, before whom also I speak boldly, for none of these things, I am persuaded, are hidden from him; for this thing hath not been done in a corner;";
dby[26] = "for the king is informed about these things, to whom also I speak with all freedom. For I am persuaded that of these things nothing is hidden from him; for this was not done in a corner.";
web[26] = "For the king knoweth of these things, before whom also I speak freely. For I am persuaded that none of these things are hidden from him; for this thing was not done in a corner.";
hnv[26] = "For the king knows of these things, to whom also I speak freely. For I am persuaded that none of these things is hidden from him, for this has not been done in a corner.";
vul[26] = "scit enim de his rex ad quem et constanter loquor latere enim eum nihil horum arbitror neque enim in angulo quicquam horum gestum est";
rsv[27] = "King Agrippa, do you believe the prophets? I know that you believe.&quot;";
asv[27] = "King Agrippa, believest thou the prophets? I know that thou believest.";
yng[27] = "thou dost believe, king Agrippa, the prophets? I have known that thou dost believe!\'";
dby[27] = "King Agrippa, believest thou the prophets? I know that thou believest.";
web[27] = "King Agrippa, believest thou the prophets? I know that thou believest.";
hnv[27] = "King Agrippa, do you believe the prophets? I know that you believe.&quot;";
vul[27] = "credis rex Agrippa prophetis scio quia credis";
rsv[28] = "And Agrippa said to Paul, &quot;In a short time you think to make me a Christian!&quot;";
asv[28] = "And Agrippa [said] unto Paul, With but little persuasion thou wouldest fain make me a Christian.";
yng[28] = "And Agrippa said unto Paul, `In a little thou dost persuade me to become a Christian!\'";
dby[28] = "And Agrippa [said] to Paul, In a little thou persuadest me to become a Christian.";
web[28] = "Then Agrippa said to Paul, Almost thou persuadest me to be a Christian.";
hnv[28] = "Agrippa said to Sha\'ul, &quot;With a little persuasion are you trying to make me a Messianic?&quot;";
vul[28] = "Agrippa autem ad Paulum in modico suades me Christianum fieri";
rsv[29] = "And Paul said, &quot;Whether short or long, I would to God that not only you but also all who hear me this day might become such as I am--except for these chains.&quot;";
asv[29] = "And Paul [said], I would to God, that whether with little or with much, not thou only, but also all that hear me this day, might become such as I am, except these bonds.";
yng[29] = "and Paul said, `I would have wished to God, both in a little, and in much, not only thee, but also all those hearing me to-day, to become such as I also am -- except these bonds.\'";
dby[29] = "And Paul [said], I would to God, both in little and in much, that not only thou, but all who have heard me this day, should become such as *I* also am, except these bonds.";
web[29] = "And Paul said, I would to God, that not only thou, but also all that hear me this day, were both almost, and altogether such as I am, except these bonds.";
hnv[29] = "Sha\'ul said, &quot;I pray to God, that whether with little or with much, not only you, but also all that hear me this day, might become such as I am, except for these bonds.&quot;";
vul[29] = "et Paulus opto apud Deum et in modico et in magno non tantum te sed et omnes hos qui audiunt hodie fieri tales qualis et ego sum exceptis vinculis his";
rsv[30] = "Then the king rose, and the governor and Berni\'ce and those who were sitting with them;";
asv[30] = "And the king rose up, and the governor, and Bernice, and they that sat with them:";
yng[30] = "And, he having spoken these things, the king rose up, and the governor, Bernice also, and those sitting with them,";
dby[30] = "And the king stood up, and the governor and Bernice, and those who sat with them,";
web[30] = "And when he had thus spoken, the king rose, and the governor, and Bernice, and they that sat with them:";
hnv[30] = "The king rose up with the governor, and Bernice, and those who sat with them.";
vul[30] = "et exsurrexit rex et praeses et Bernice et qui adsidebant eis";
rsv[31] = "and when they had withdrawn, they said to one another, &quot;This man is doing nothing to deserve death or imprisonment.&quot;";
asv[31] = "and when they had withdrawn, they spake one to another, saying, This man doeth nothing worthy of death or of bonds.";
yng[31] = "and having withdrawn, they were speaking unto one another, saying -- `This man doth nothing worthy of death or of bonds;\'";
dby[31] = "and having gone apart, they spoke to one another saying, This man does nothing worthy of death or of bonds.";
web[31] = "And when they had gone aside, they talked between themselves, saying, This man doeth nothing worthy of death, or of bonds.";
hnv[31] = "When they had withdrawn, they spoke one to another, saying, &quot;This man does nothing worthy of death or of bonds.&quot;";
vul[31] = "et cum secessissent loquebantur ad invicem dicentes quia nihil morte aut vinculorum dignum quid facit homo iste";
rsv[32] = "And Agrippa said to Festus, &quot;This man could have been set free if he had not appealed to Caesar.&quot;";
asv[32] = "And Agrippa said unto Festus, This man might have been set at liberty, if he had not appealed unto Caesar.";
yng[32] = "and Agrippa said to Festus, `This man might have been released if he had not appealed to Caesar.\'";
dby[32] = "And Agrippa said to Festus, This man might have been let go if he had not appealed to Caesar.";
web[32] = "Then said Agrippa to Festus, This man might have been set at liberty, if he had not appealed to Cesar.";
hnv[32] = "Agrippa said to Festus, &quot;This man might have been set free if he had not appealed to Caesar.&quot;";
vul[32] = "Agrippa autem Festo dixit dimitti poterat homo hic si non appellasset Caesarem";
