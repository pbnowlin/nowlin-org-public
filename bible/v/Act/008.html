csb[1] = "Saul agreed with putting him to death. On that day a severe persecution broke out against the church in Jerusalem, and all except the apostles were scattered throughout the land of Judea and Samaria.";
csb[2] = "Devout men buried Stephen and mourned deeply over him.";
csb[3] = "Saul, however, was ravaging the church. He would enter house after house, drag off men and women, and put them in prison.";
csb[4] = "So those who were scattered went on their way preaching the word.";
csb[5] = "Philip went down to a city in Samaria and proclaimed the Messiah to them.";
csb[6] = "The crowds were all paying attention to what Philip said, as they listened and saw the signs he was performing.";
csb[7] = "For unclean spirits, crying out with a loud voice, came out of many who were possessed, and many who were paralyzed and lame were healed.";
csb[8] = "So there was great joy in that city.";
csb[9] = "A man named Simon had previously practiced sorcery in that city and amazed the Samaritan people, while claiming to be somebody great.";
csb[10] = "They all paid attention to him, from the least of them to the greatest, and they said, &quot;This man is called the Great Power of God.&quot;";
csb[11] = "They were attentive to him because he had amazed them with his sorceries for a long time.";
csb[12] = "But when they believed Philip, as he proclaimed the good news about the kingdom of God and the name of Jesus Christ, both men and women were baptized.";
csb[13] = "Even Simon himself believed. And after he was baptized, he followed Philip everywhere and was amazed as he observed the signs and great miracles that were being performed.";
csb[14] = "When the apostles who were at Jerusalem heard that Samaria had received the word of God, they sent Peter and John to them.";
csb[15] = "After they went down there, they prayed for them so the Samaritans might receive the Holy Spirit because he had not yet come down on any of them.";
csb[16] = "(They had only been baptized in the name of the Lord Jesus.)";
csb[17] = "Then Peter and John laid their hands on them, and they received the Holy Spirit.";
csb[18] = "When Simon saw that the Spirit was given through the laying on of the apostles\' hands, he offered them money,";
csb[19] = "saying, &quot;Give me this power also so that anyone I lay hands on may receive the Holy Spirit.&quot;";
csb[20] = "But Peter told him, &quot;May your silver be destroyed with you, because you thought you could obtain the gift of God with money!";
csb[21] = "&quot;You have no part or share in this matter, because your heart is not right before God.";
csb[22] = "&quot;Therefore repent of this wickedness of yours, and pray to the Lord that, if possible, your heart\'s intent may be forgiven.";
csb[23] = "&quot;For I see you are poisoned by bitterness and bound by wickedness.&quot;";
csb[24] = "&quot;Pray to the Lord for me,&quot; Simon replied, &quot;so that nothing you have said may happen to me.&quot;";
csb[25] = "So, after they had testified and spoken the word of the Lord, they traveled back to Jerusalem, preaching the gospel in many villages of the Samaritans.";
csb[26] = "An angel of the Lord spoke to Philip: &quot;Get up and go south to the road that goes down from Jerusalem to Gaza.&quot; (This is the desert road.)";
csb[27] = "So he got up and went. There was an Ethiopian man, a eunuch and high official of Candace, queen of the Ethiopians, who was in charge of her entire treasury. He had come to worship in Jerusalem";
csb[28] = "and was sitting in his chariot on his way home, reading the prophet Isaiah aloud.";
csb[29] = "The Spirit told Philip, &quot;Go and join that chariot.&quot;";
csb[30] = "When Philip ran up to it, he heard him reading the prophet Isaiah, and said, &quot;Do you understand what you\'re reading? &quot;";
csb[31] = "&quot;How can I,&quot; he said, &quot;unless someone guides me? &quot; So he invited Philip to come up and sit with him.";
csb[32] = "Now the Scripture passage he was reading was this: He was led like a sheep to the slaughter, and as a lamb is silent before its shearer, so he does not open his mouth.";
csb[33] = "In his humiliation justice was denied him. Who will describe his generation? For his life is taken from the earth.";
csb[34] = "The eunuch said to Philip, &quot;I ask you, who is the prophet saying this about -- himself or someone else? &quot;";
csb[35] = "Philip proceeded to tell him the good news about Jesus, beginning with that Scripture.";
csb[36] = "As they were traveling down the road, they came to some water. The eunuch said, &quot;Look, there\'s water. What would keep me from being baptized? &quot;";
csb[37] = " ";
csb[38] = "So he ordered the chariot to stop, and both Philip and the eunuch went down into the water, and he baptized him.";
csb[39] = "When they came up out of the water, the Spirit of the Lord carried Philip away, and the eunuch did not see him any longer but went on his way rejoicing.";
csb[40] = "Philip appeared in Azotus, and he was traveling and preaching the gospel in all the towns until he came to Caesarea.";
