csb[1] = "&quot;Brothers and fathers, listen now to my defense before you.&quot;";
csb[2] = "When they heard that he was addressing them in Aramaic, they became even quieter.";
csb[3] = "He continued, &quot;I am a Jew, born in Tarsus of Cilicia but brought up in this city, educated at the feet of Gamaliel according to the law of our ancestors. I was zealous for God, just as all of you are today.";
csb[4] = "&quot;I persecuted this Way to the death, arresting and putting both men and women in jail,";
csb[5] = "&quot;as both the high priest and the whole council of elders can testify about me. After I received letters from them to the brothers, I traveled to Damascus to arrest those who were there and bring them to Jerusalem to be punished.";
csb[6] = "&quot;As I was traveling and approaching Damascus, about noon an intense light from heaven suddenly flashed around me.";
csb[7] = "&quot;I fell to the ground and heard a voice saying to me, \'Saul, Saul, why are you persecuting me? \'";
csb[8] = "&quot;I answered, \'Who are you, Lord? \' &quot;He said to me, \'I am Jesus of Nazareth, the one you are persecuting.\'";
csb[9] = "&quot;Now those who were with me saw the light, but they did not hear the voice of the one who was speaking to me.";
csb[10] = "&quot;I said, \'What should I do, Lord? \' &quot;The Lord told me, \'Get up and go into Damascus, and there you will be told everything that you have been assigned to do.\'";
csb[11] = "&quot;Since I couldn\'t see because of the brightness of the light, I was led by the hand by those who were with me, and went into Damascus.";
csb[12] = "&quot;Someone named Ananias, a devout man according to the law, who had a good reputation with all the Jews living there,";
csb[13] = "&quot;came and stood by me and said, \'Brother Saul, regain your sight.\' And in that very hour I looked up and saw him.";
csb[14] = "&quot;And he said, \'The God of our ancestors has appointed you to know his will, to see the Righteous One, and to hear the words from his mouth,";
csb[15] = "&quot;since you will be a witness for him to all people of what you have seen and heard.";
csb[16] = "&quot;And now, why are you delaying? Get up and be baptized, and wash away your sins, calling on his name.\'";
csb[17] = "&quot;After I returned to Jerusalem and was praying in the temple, I fell into a trance";
csb[18] = "&quot;and saw him telling me, \'Hurry and get out of Jerusalem quickly, because they will not accept your testimony about me.\'";
csb[19] = "&quot;But I said, \'Lord, they know that in synagogue after synagogue I had those who believed in you imprisoned and beaten.";
csb[20] = "&quot;And when the blood of your witness Stephen was being shed, I stood there giving approval and guarding the clothes of those who killed him.\'";
csb[21] = "&quot;He said to me, \'Go, because I will send you far away to the Gentiles.\' &quot;";
csb[22] = "They listened to him up to this point. Then they raised their voices, shouting, &quot;Wipe this man off the face of the earth! He should not be allowed to live! &quot;";
csb[23] = "As they were yelling and flinging aside their garments and throwing dust into the air,";
csb[24] = "the commander ordered him to be brought into the barracks, directing that he be interrogated with the scourge to discover the reason they were shouting against him like this.";
csb[25] = "As they stretched him out for the lash, Paul said to the centurion standing by, &quot;Is it legal for you to scourge a man who is a Roman citizen and is uncondemned? &quot;";
csb[26] = "When the centurion heard this, he went and reported to the commander, saying, &quot;What are you going to do? For this man is a Roman citizen.&quot;";
csb[27] = "The commander came and said to him, &quot;Tell me, are you a Roman citizen? &quot; &quot;Yes,&quot; he said.";
csb[28] = "The commander replied, &quot;I bought this citizenship for a large amount of money.&quot; &quot;But I was born a citizen,&quot; Paul said.";
csb[29] = "So those who were about to examine him withdrew from him immediately. The commander too was alarmed when he realized Paul was a Roman citizen and he had bound him.";
csb[30] = "The next day, since he wanted to find out exactly why Paul was being accused by the Jews, he released him and instructed the chief priests and all the Sanhedrin to convene. He brought Paul down and placed him before them.";

yng[21] = "and he said unto me, Go, because to nations far off I will send thee.\'";
dby[21] = "And he said to me, Go, for *I* will send thee to the nations afar off.";
web[21] = "And he said to me, Depart: for I will send thee far hence to the Gentiles.";
hnv[21] = "&quot;He said to me, \'Depart, for I will send you out far from here to the Goyim.\'&quot;";
vul[21] = "et dixit ad me vade quoniam ego in nationes longe mittam te";
kjv[22] = "And they gave him audience unto this word, and [then] lifted up their voices, and said, Away with such a [fellow] from the earth: for it is not fit that he should live.";
rsv[22] = "Up to this word they listened to him; then they lifted up their voices and said, &quot;Away with such a fellow from the earth! For he ought not to live.&quot;";
asv[22] = "And they gave him audience unto this word; and they lifted up their voice, and said, Away with such a fellow from the earth: for it is not fit that he should live.";
yng[22] = "And they were hearing him unto this word, and they lifted up their voice, saying, `Away from the earth with such an one; for it is not fit for him to live.\'";
dby[22] = "And they heard him until this word, and lifted up their voice, saying, Away with such a one as that from the earth, for it was not fit he should live.";
web[22] = "And they gave him audience to this word, and [then] lifted up their voices, and said, Away with such a [man] from the earth: for it is not fit that he should live.";
hnv[22] = "They listened to him until he said that; then they lifted up their voice, and said, &quot;Rid the eretz of this fellow, for he isn\'t fit to live!&quot;";
vul[22] = "audiebant autem eum usque ad hoc verbum et levaverunt vocem suam dicentes tolle de terra eiusmodi non enim fas est eum vivere";
kjv[23] = "And as they cried out, and cast off [their] clothes, and threw dust into the air,";
rsv[23] = "And as they cried out and waved their garments and threw dust into the air,";
asv[23] = "And as they cried out, and threw off their garments, and cast dust into the air,";
yng[23] = "And they crying out and casting up their garments, and throwing dust into the air,";
dby[23] = "And as they were crying, and throwing away their clothes, and casting dust into the air,";
web[23] = "And as they cried out, and cast off [their] clothes, and threw dust into the air,";

vul[23] = "vociferantibus autem eis et proicientibus vestimenta sua et pulverem iactantibus in aerem";
kjv[24] = "The chief captain commanded him to be brought into the castle, and bade that he should be examined by scourging; that he might know wherefore they cried so against him.";
rsv[24] = "the tribune commanded him to be brought into the barracks, and ordered him to be examined by scourging, to find out why they shouted thus against him.";
asv[24] = "the chief captain commanded him to be brought into the castle, bidding that he should be examined by scourging, that he might know for what cause they so shouted against him.";
yng[24] = "the chief captain commanded him to be brought into the castle, saying, `By scourges let him be examined;\' that he might know for what cause they were crying so against him.";
dby[24] = "the chiliarch commanded him to be brought into the fortress, saying that he should be examined by scourging, that he might ascertain for what cause they cried thus against him.";
web[24] = "The chief captain commanded him to be brought into the castle, and bade that he should be examined by scourging; that he might know for what cause they cried so against him.";
hnv[24] = "the commanding officer commanded him to be brought into the barracks, ordering him to be examined by scourging, that he might know for what crime they shouted against him like that.";
vul[24] = "iussit tribunus induci eum in castra et flagellis caedi et torqueri eum ut sciret propter quam causam sic adclamarent ei";
kjv[25] = "And as they bound him with thongs, Paul said unto the centurion that stood by, Is it lawful for you to scourge a man that is a Roman, and uncondemned?";
rsv[25] = "But when they had tied him up with the thongs, Paul said to the centurion who was standing by, &quot;Is it lawful for you to scourge a man who is a Roman citizen, and uncondemned?&quot;";
asv[25] = "And when they had tied him up with the thongs, Paul said unto the centurion that stood by, Is it lawful for you to scourge a man that is a Roman, and uncondemned?";
yng[25] = "And as he was stretching him with the thongs, Paul said unto the centurion who was standing by, `A man, a Roman, uncondemned -- is it lawful to you to scourge;\'";
dby[25] = "But as they stretched him forward with the thongs, Paul said to the centurion who stood [by], Is it lawful for you to scourge a man [who is] a Roman and uncondemned?";
web[25] = "And as they bound him with thongs, Paul said to the centurion that stood by, Is it lawful for you to scourge a man that is a Roman, and uncondemned?";
hnv[25] = "When they had tied him up with thongs, Sha\'ul asked the centurion who stood by, &quot;Is it lawful for you to scourge a man who is a Roman, and not found guilty?&quot;";
vul[25] = "et cum adstrinxissent eum loris dixit adstanti sibi centurioni Paulus si hominem romanum et indemnatum licet vobis flagellare";
kjv[26] = "When the centurion heard [that], he went and told the chief captain, saying, Take heed what thou doest: for this man is a Roman.";
rsv[26] = "When the centurion heard that, he went to the tribune and said to him, &quot;What are you about to do? For this man is a Roman citizen.&quot;";
asv[26] = "And when the centurion heard it, he went to the chief captain and told him, saying, What art thou about to do? for this man is a Roman.";
yng[26] = "and the centurion having heard, having gone near to the chief captain, told, saying, `Take heed what thou art about to do, for this man is a Roman;\'";
dby[26] = "And the centurion, having heard it, went and reported it to the chiliarch, saying, What art thou going to do? for this man is a Roman.";
web[26] = "When the centurion heard [that], he went and told the chief captain, saying, Take heed what thou doest; for this man is a Roman.";
hnv[26] = "When the centurion heard it, he went to the commanding officer and told him, &quot;Watch what you are about to do, for this man is a Roman!&quot;";
vul[26] = "quo audito centurio accessit ad tribunum et nuntiavit dicens quid acturus es hic enim homo civis romanus est";
kjv[27] = "Then the chief captain came, and said unto him, Tell me, art thou a Roman? He said, Yea.";
rsv[27] = "So the tribune came and said to him, &quot;Tell me, are you a Roman citizen?&quot; And he said, &quot;Yes.&quot;";
asv[27] = "And the chief captain came and said unto him, Tell me, art thou a Roman? And he said, Yea.";
yng[27] = "and the chief captain having come near, said to him, `Tell me, art thou a Roman?\' and he said, `Yes;\'";
dby[27] = "And the chiliarch coming up said to him, Tell me, Art *thou* a Roman? And he said, Yes.";
web[27] = "Then the chief captain came, and said to him, Tell me, art thou a Roman? He said, Yes.";
hnv[27] = "The commanding officer came and asked him, &quot;Tell me, are you a Roman?&quot; He said, &quot;Yes.&quot;";
vul[27] = "accedens autem tribunus dixit illi dic mihi tu Romanus es at ille dixit etiam";
kjv[28] = "And the chief captain answered, With a great sum obtained I this freedom. And Paul said, But I was [free] born.";
rsv[28] = "The tribune answered, &quot;I bought this citizenship for a large sum.&quot; Paul said, &quot;But I was born a citizen.&quot;";
asv[28] = "And the chief captain answered, With a great sum obtained I this citizenship. And Paul said, But I am [a Roman] born.";
yng[28] = "and the chief captain answered, `I, with a great sum, did obtain this citizenship;\' but Paul said, `But I have been even born [so].\'";
dby[28] = "And the chiliarch answered, *I*, for a great sum, bought this citizenship. And Paul said, But *I* was also [free] born.";
web[28] = "And the chief captain answered, With a great sum I obtained this freedom. And Paul said, But I was [free] born.";
hnv[28] = "The commanding officer answered, &quot;I bought my citizenship for a great price.&quot; Sha\'ul said, &quot;But I was born a Roman.&quot;";
vul[28] = "et respondit tribunus ego multa summa civitatem hanc consecutus sum et Paulus ait ego autem et natus sum";
kjv[29] = "Then straightway they departed from him which should have examined him: and the chief captain also was afraid, after he knew that he was a Roman, and because he had bound him.";
rsv[29] = "So those who were about to examine him withdrew from him instantly; and the tribune also was afraid, for he realized that Paul was a Roman citizen and that he had bound him.";
asv[29] = "They then that were about to examine him straightway departed from him: and the chief captain also was afraid when he knew that he was a Roman, and because he had bound him.";
yng[29] = "Immediately, therefore, they departed from him who are about to examine him, and the chief captain also was afraid, having learned that he is a Roman, and because he had bound him,";
dby[29] = "Immediately therefore those who were going to examine him left him, and the chiliarch also was afraid when he ascertained that he was a Roman, and because he had bound him.";
web[29] = "Then forthwith they departed from him who were about to examine him: and the chief captain also was afraid, after he knew that he was a Roman, and because he had bound him.";
hnv[29] = "Immediately those who were about to examine him departed from him, and the commanding officer also was afraid when he realized that he was a Roman, because he had bound him.";
vul[29] = "protinus ergo discesserunt ab illo qui eum torturi erant tribunus quoque timuit postquam rescivit quia civis romanus esset et quia alligasset eum";
kjv[30] = "On the morrow, because he would have known the certainty wherefore he was accused of the Jews, he loosed him from [his] bands, and commanded the chief priests and all their council to appear, and brought Paul down, and set him before them.";
rsv[30] = "But on the morrow, desiring to know the real reason why the Jews accused him, he unbound him, and commanded the chief priests and all the council to meet, and he brought Paul down and set him before them.";
asv[30] = "But on the morrow, desiring to know the certainty wherefore he was accused of the Jews, he loosed him, and commanded the chief priests and all the council to come together, and brought Paul down and set him before them.";
yng[30] = "and on the morrow, intending to know the certainty wherefore he is accused by the Jews, he did loose him from the bonds, and commanded the chief priests and all their sanhedrim to come, and having brought down Paul, he set [him] before them.";
dby[30] = "And on the morrow, desirous to know the certainty [of the matter] why he was accused of the Jews, he loosed him, and commanded the chief priests and all the council to meet, and having brought Paul down set him before them.";
web[30] = "On the morrow, because he would have known the certainty why he was accused by the Jews, he loosed him from [his] bands, and commanded the chief priests and all their council to appear, and brought Paul down, and set him before them.";
hnv[30] = "But on the next day, desiring to know the truth about why he was accused by the Yehudim, he freed him from the bonds, and commanded the chief Kohanim and all the council to come together, and brought Sha\'ul down and set him before them.";
vul[30] = "postera autem die volens scire diligentius qua ex causa accusaretur a Iudaeis solvit eum et iussit sacerdotes convenire et omne concilium et producens Paulum statuit inter illos";
