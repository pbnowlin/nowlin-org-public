csb[1] = "Now Saul was still breathing threats and murder against the disciples of the Lord. He went to the high priest";
csb[2] = "and requested letters from him to the synagogues in Damascus, so that if he found any men or women who belonged to the Way, he might bring them as prisoners to Jerusalem.";
csb[3] = "As he traveled and was nearing Damascus, a light from heaven suddenly flashed around him.";
csb[4] = "Falling to the ground, he heard a voice saying to him, &quot;Saul, Saul, why are you persecuting me? &quot;";
csb[5] = "&quot;Who are you, Lord? &quot; Saul said. &quot;I am Jesus, the one you are persecuting,&quot; he replied.";
csb[6] = "&quot;But get up and go into the city, and you will be told what you must do.&quot;";
csb[7] = "The men who were traveling with him stood speechless, hearing the sound but seeing no one.";
csb[8] = "Saul got up from the ground, and though his eyes were open, he could see nothing. So they took him by the hand and led him into Damascus.";
csb[9] = "He was unable to see for three days and did not eat or drink.";
csb[10] = "There was a disciple in Damascus named Ananias, and the Lord said to him in a vision, &quot;Ananias.&quot; &quot;Here I am, Lord,&quot; he replied.";
csb[11] = "&quot;Get up and go to the street called Straight,&quot; the Lord said to him, &quot;to the house of Judas, and ask for a man from Tarsus named Saul, since he is praying there.";
csb[12] = "&quot;In a vision he has seen a man named Ananias coming in and placing his hands on him so that he may regain his sight.&quot;";
csb[13] = "&quot;Lord,&quot; Ananias answered, &quot;I have heard from many people about this man, how much harm he has done to your saints in Jerusalem.";
csb[14] = "&quot;And he has authority here from the chief priests to arrest all who call on your name.&quot;";
csb[15] = "But the Lord said to him, &quot;Go, for this man is my chosen instrument to take my name to Gentiles, kings, and Israelites.";
csb[16] = "&quot;I will show him how much he must suffer for my name.&quot;";
csb[17] = "Ananias went and entered the house. He placed his hands on him and said, &quot;Brother Saul, the Lord Jesus, who appeared to you on the road you were traveling, has sent me so that you may regain your sight and be filled with the Holy Spirit.&quot;";
csb[18] = "At once something like scales fell from his eyes, and he regained his sight. Then he got up and was baptized.";
csb[19] = "And after taking some food, he regained his strength. Saul was with the disciples in Damascus for some time.";
csb[20] = "Immediately he began proclaiming Jesus in the synagogues: &quot;He is the Son of God.&quot;";
csb[21] = "All who heard him were astounded and said, &quot;Isn\'t this the man in Jerusalem who was causing havoc for those who called on this name and came here for the purpose of taking them as prisoners to the chief priests? &quot;";
csb[22] = "But Saul grew stronger and kept confounding the Jews who lived in Damascus by proving that Jesus is the Messiah.";
csb[23] = "After many days had passed, the Jews conspired to kill him,";
csb[24] = "but Saul learned of their plot. So they were watching the gates day and night intending to kill him,";
csb[25] = "but his disciples took him by night and lowered him in a large basket through an opening in the wall.";
csb[26] = "When he arrived in Jerusalem, he tried to join the disciples, but they were all afraid of him, since they did not believe he was a disciple.";
csb[27] = "Barnabas, however, took him and brought him to the apostles and explained to them how Saul had seen the Lord on the road and that the Lord had talked to him, and how in Damascus he had spoken boldly in the name of Jesus.";
csb[28] = "Saul was coming and going with them in Jerusalem, speaking boldly in the name of the Lord.";
csb[29] = "He conversed and debated with the Hellenistic Jews, but they tried to kill him.";
csb[30] = "When the brothers found out, they took him down to Caesarea and sent him off to Tarsus.";
csb[31] = "So the church throughout all Judea, Galilee, and Samaria had peace and was strengthened. Living in the fear of the Lord and encouraged by the Holy Spirit, it increased in numbers.";
csb[32] = "As Peter was traveling from place to place, he also came down to the saints who lived in Lydda.";
csb[33] = "There he found a man named Aeneas, who was paralyzed and had been bedridden for eight years.";
csb[34] = "Peter said to him, &quot;Aeneas, Jesus Christ heals you. Get up and make your bed,&quot; and immediately he got up.";
csb[35] = "So all who lived in Lydda and Sharon saw him and turned to the Lord.";
csb[36] = "In Joppa there was a disciple named Tabitha (which is translated Dorcas). She was always doing good works and acts of charity.";
csb[37] = "About that time she became sick and died. After washing her, they placed her in a room upstairs.";
csb[38] = "Since Lydda was near Joppa, the disciples heard that Peter was there and sent two men to him who urged him, &quot;Don\'t delay in coming with us.&quot;";
csb[39] = "Peter got up and went with them. When he arrived, they led him to the room upstairs. And all the widows approached him, weeping and showing him the robes and clothes that Dorcas had made while she was with them.";
csb[40] = "Peter sent them all out of the room. He knelt down, prayed, and turning toward the body said, &quot;Tabitha, get up.&quot; She opened her eyes, saw Peter, and sat up.";
csb[41] = "He gave her his hand and helped her stand up. He called the saints and widows and presented her alive.";
csb[42] = "This became known throughout Joppa, and many believed in the Lord.";
csb[43] = "Peter stayed for some time in Joppa with Simon, a leather tanner.";
