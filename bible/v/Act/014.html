csb[1] = "In Iconium they entered the Jewish synagogue, as usual, and spoke in such a way that a great number of both Jews and Greeks believed.";
csb[2] = "But the unbelieving Jews stirred up the Gentiles and poisoned their minds against the brothers.";
csb[3] = "So they stayed there a long time and spoke boldly for the Lord, who testified to the message of his grace by enabling them to do signs and wonders.";
csb[4] = "But the people of the city were divided, some siding with the Jews and others with the apostles.";
csb[5] = "When an attempt was made by both the Gentiles and Jews, with their rulers, to mistreat and stone them,";
csb[6] = "they found out about it and fled to the Lycaonian towns of Lystra and Derbe and to the surrounding countryside.";
csb[7] = "There they continued preaching the gospel.";
csb[8] = "In Lystra a man was sitting who was without strength in his feet, had never walked, and had been lame from birth.";
csb[9] = "He listened as Paul spoke. After looking directly at him and seeing that he had faith to be healed,";
csb[10] = "Paul said in a loud voice, &quot;Stand up on your feet! &quot; And he jumped up and began to walk around.";
csb[11] = "When the crowds saw what Paul had done, they shouted, saying in the Lycaonian language, &quot;The gods have come down to us in human form! &quot;";
csb[12] = "Barnabas they called Zeus, and Paul, Hermes, because he was the chief speaker.";
csb[13] = "The priest of Zeus, whose temple was just outside the town, brought bulls and wreaths to the gates because he intended, with the crowds, to offer sacrifice.";
csb[14] = "The apostles Barnabas and Paul tore their robes when they heard this and rushed into the crowd, shouting:";
csb[15] = "&quot;People! Why are you doing these things? We are people also, just like you, and we are proclaiming good news to you, that you turn from these worthless things to the living God, who made the heaven, the earth, the sea, and everything in them.";
csb[16] = "&quot;In past generations he allowed all the nations to go their own way,";
csb[17] = "&quot;although he did not leave himself without a witness, since he did what is good by giving you rain from heaven and fruitful seasons and filling you with food and your hearts with joy.&quot;";
csb[18] = "Even though they said these things, they barely stopped the crowds from sacrificing to them.";
csb[19] = "Some Jews came from Antioch and Iconium, and when they won over the crowds, they stoned Paul and dragged him out of the city, thinking he was dead.";
csb[20] = "After the disciples gathered around him, he got up and went into the town. The next day he left with Barnabas for Derbe.";
csb[21] = "After they had preached the gospel in that town and made many disciples, they returned to Lystra, to Iconium, and to Antioch,";
csb[22] = "strengthening the disciples by encouraging them to continue in the faith and by telling them, &quot;It is necessary to go through many hardships to enter the kingdom of God.&quot;";
csb[23] = "When they had appointed elders for them in every church and prayed with fasting, they committed them to the Lord in whom they had believed.";
csb[24] = "They passed through Pisidia and came to Pamphylia.";
csb[25] = "After they had spoken the word in Perga, they went down to Attalia.";
csb[26] = "From there they sailed back to Antioch where they had been commended to the grace of God for the work they had now completed.";
csb[27] = "After they arrived and gathered the church together, they reported everything God had done with them and that he had opened the door of faith to the Gentiles.";
csb[28] = "And they spent a considerable time with the disciples.";

rsv[1] = "Now at Ico\'nium they entered together into the Jewish synagogue, and so spoke that a great company believed, both of Jews and of Greeks.";

yng[1] = "And it came to pass in Iconium, that they did enter together into the synagogue of the Jews, and spake, so that there believed both of Jews and Greeks a great multitude;";
dby[1] = "And it came to pass in Iconium that they entered together into the synagogue of the Jews, and so spake that a great multitude of both Jews and Greeks believed.";

web[2] = "But the unbelieving Jews stirred up the Gentiles, and made their minds evil-affected against the brethren.";
hnv[2] = "But the disobedient Yehudim stirred up and embittered the souls of the Goyim against the brothers.";
