csb[1] = "While Apollos was in Corinth, Paul traveled through the interior regions and came to Ephesus. He found some disciples";
csb[2] = "and asked them, &quot;Did you receive the Holy Spirit when you believed? &quot; &quot;No,&quot; they told him, &quot;we haven\'t even heard that there is a Holy Spirit.&quot;";
csb[3] = "&quot;Into what then were you baptized? &quot; he asked them. &quot;Into John\'s baptism,&quot; they replied.";
csb[4] = "Paul said, &quot;John baptized with a baptism of repentance, telling the people that they should believe in the one who would come after him, that is, in Jesus.&quot;";
csb[5] = "When they heard this, they were baptized into the name of the Lord Jesus.";
csb[6] = "And when Paul had laid his hands on them, the Holy Spirit came on them, and they began to speak in other tongues and to prophesy.";
csb[7] = "Now there were about twelve men in all.";
csb[8] = "Paul entered the synagogue and spoke boldly over a period of three months, arguing and persuading them about the kingdom of God.";
csb[9] = "But when some became hardened and would not believe, slandering the Way in front of the crowd, he withdrew from them, taking the disciples, and conducted discussions every day in the lecture hall of Tyrannus.";
csb[10] = "This went on for two years, so that all the residents of Asia, both Jews and Greeks, heard the word of the Lord.";
csb[11] = "God was performing extraordinary miracles by Paul\'s hands,";
csb[12] = "so that even facecloths or aprons that had touched his skin were brought to the sick, and the diseases left them, and the evil spirits came out of them.";
csb[13] = "Now some of the itinerant Jewish exorcists also attempted to pronounce the name of the Lord Jesus over those who had evil spirits, saying, &quot;I command you by the Jesus that Paul preaches! &quot;";
csb[14] = "Seven sons of Sceva, a Jewish high priest, were doing this.";
csb[15] = "The evil spirit answered them, &quot;I know Jesus, and I recognize Paul -- but who are you? &quot;";
csb[16] = "Then the man who had the evil spirit jumped on them, overpowered them all, and prevailed against them, so that they ran out of that house naked and wounded.";
csb[17] = "When this became known to everyone who lived in Ephesus, both Jews and Greeks, they became afraid, and the name of the Lord Jesus was held in high esteem.";
csb[18] = "And many who had become believers came confessing and disclosing their practices,";
csb[19] = "while many of those who had practiced magic collected their books and burned them in front of everyone. So they calculated their value and found it to be fifty thousand pieces of silver.";
csb[20] = "In this way the word of the Lord flourished and prevailed.";
csb[21] = "After these events, Paul resolved by the Spirit to pass through Macedonia and Achaia and go to Jerusalem. &quot;After I\'ve been there,&quot; he said, &quot;It is necessary for me to see Rome as well.&quot;";
csb[22] = "After sending to Macedonia two of those who assisted him, Timothy and Erastus, he himself stayed in Asia for a while.";
csb[23] = "About that time there was a major disturbance about the Way.";
csb[24] = "For a person named Demetrius, a silversmith who made silver shrines of Artemis, provided a great deal of business for the craftsmen.";
csb[25] = "When he had assembled them, as well as the workers engaged in this type of business, he said: &quot;Men, you know that our prosperity is derived from this business.";
csb[26] = "&quot;You see and hear that not only in Ephesus, but in almost all of Asia, this man Paul has persuaded and misled a considerable number of people by saying that gods made by hand are not gods.";
csb[27] = "&quot;Not only do we run a risk that our business may be discredited, but also that the temple of the great goddess Artemis may be despised and her magnificence come to the verge of ruin -- the very one all of Asia and the world worship.&quot;";
csb[28] = "When they had heard this, they were filled with rage and began to cry out, &quot;Great is Artemis of the Ephesians! &quot;";
csb[29] = "So the city was filled with confusion, and they rushed all together into the amphitheater, dragging along Gaius and Aristarchus, Macedonians who were Paul\'s traveling companions.";
csb[30] = "Although Paul wanted to go in before the people, the disciples did not let him.";
csb[31] = "Even some of the provincial officials of Asia, who were his friends, sent word to him, pleading with him not to venture into the amphitheater.";
csb[32] = "Some were shouting one thing and some another, because the assembly was in confusion, and most of them did not know why they had come together.";
csb[33] = "Some Jews in the crowd gave instructions to Alexander after they pushed him to the front. Motioning with his hand, Alexander wanted to make his defense to the people.";
csb[34] = "But when they recognized that he was a Jew, they all shouted in unison for about two hours: &quot;Great is Artemis of the Ephesians! &quot;";
csb[35] = "When the city clerk had calmed the crowd down, he said, &quot;People of Ephesus! What person is there who doesn\'t know that the city of the Ephesians is the temple guardian of the great Artemis, and of the image that fell from heaven?";
csb[36] = "&quot;Therefore, since these things are undeniable, you must keep calm and not do anything rash.";
csb[37] = "&quot;For you have brought these men here who are not temple robbers or blasphemers of our goddess.";
csb[38] = "&quot;So if Demetrius and the craftsmen who are with him have a case against anyone, the courts are in session, and there are proconsuls. Let them bring charges against one another.";
csb[39] = "&quot;But if you seek anything further, it must be decided in a legal assembly.";
csb[40] = "&quot;In fact, we run a risk of being charged with rioting for what happened today, since there is no justification that we can give as a reason for this disturbance.&quot;";
csb[41] = "After saying this, he dismissed the assembly.";

rsv[21] = "Now after these events Paul resolved in the Spirit to pass through Macedo\'nia and Acha\'ia and go to Jerusalem, saying, &quot;After I have been there, I must also see Rome.&quot;";
asv[21] = "Now after these things were ended, Paul purposed in the spirit, when he had passed through Macedonia and Achaia, to go to Jerusalem, saying, After I have been there, I must also see Rome.";
yng[21] = "And when these things were fulfilled, Paul purposed in the Spirit, having gone through Macedonia and Achaia, to go on to Jerusalem, saying -- `After my being there, it behoveth me also to see Rome;\'";
dby[21] = "And when these things were fulfilled, Paul purposed in his spirit to go to Jerusalem, passing through Macedonia and Achaia, saying, After I have been there I must see Rome also.";
web[21] = "After these things were ended, Paul purposed in the spirit, when he had passed through Macedonia, and Achaia, to go to Jerusalem, saying, After I have been there, I must also see Rome.";
hnv[21] = "Now after these things had ended, Sha\'ul determined in the spirit, when he had passed through Macedonia and Achaia, to go to Yerushalayim, saying, &quot;After I have been there, I must also see Rome.&quot;";
vul[21] = "his autem expletis posuit Paulus in Spiritu transita Macedonia et Achaia ire Hierosolymam dicens quoniam postquam fuero ibi oportet me et Romam videre";
kjv[22] = "So he sent into Macedonia two of them that ministered unto him, Timotheus and Erastus; but he himself stayed in Asia for a season.";
rsv[22] = "And having sent into Macedo\'nia two of his helpers, Timothy and Eras\'tus, he himself stayed in Asia for a while.";
asv[22] = "And having sent into Macedonia two of them that ministered unto him, Timothy and Erastus, he himself stayed in Asia for a while.";
yng[22] = "and having sent to Macedonia two of those ministering to him -- Timotheus and Erastus -- he himself stayed a time in Asia.";
dby[22] = "And having sent into Macedonia two of those ministering to him, Timotheus and Erastus, he remained himself awhile in Asia.";
web[22] = "So he sent into Macedonia two of them that ministered to him, Timothy and Erastus; but he himself stayed in Asia for a season.";
hnv[22] = "Having sent into Macedonia two of those who ministered to him, Timothy and Erastus, he himself stayed in Asia for a while.";
vul[22] = "mittens autem in Macedoniam duos ex ministrantibus sibi Timotheum et Erastum ipse remansit ad tempus in Asia";
kjv[23] = "And the same time there arose no small stir about that way.";
rsv[23] = "About that time there arose no little stir concerning the Way.";
asv[23] = "And about that time there arose no small stir concerning the Way.";
yng[23] = "And there came, at that time, not a little stir about the way,";
dby[23] = "And there took place at that time no small disturbance about the way.";
web[23] = "And the same time there arose no small stir about that way.";
hnv[23] = "About that time there arose no small stir concerning the Way.";
vul[23] = "facta est autem in illo tempore turbatio non minima de via";
kjv[24] = "For a certain [man] named Demetrius, a silversmith, which made silver shrines for Diana, brought no small gain unto the craftsmen;";
rsv[24] = "For a man named Deme\'trius, a silversmith, who made silver shrines of Ar\'temis, brought no little business to the craftsmen.";
asv[24] = "For a certain man named Demetrius, a silversmith, who made silver shrines of Diana, brought no little business unto the craftsmen;";
yng[24] = "for a certain one, Demetrius by name, a worker in silver, making silver sanctuaries of Artemis, was bringing to the artificers gain not a little,";
dby[24] = "For a certain [man] by name Demetrius, a silver-beater, making silver temples of Artemis, brought no small gain to the artisans;";
web[24] = "For a certain [man] named Demetrius, a silver-smith, who made silver shrines for Diana, brought no small gain to the artificers;";
hnv[24] = "For a certain man named Demetrius, a silversmith, who made silver shrines of Artemis, brought no little business to the craftsmen,";
vul[24] = "Demetrius enim quidam nomine argentarius faciens aedes argenteas Dianae praestabat artificibus non modicum quaestum";
kjv[25] = "Whom he called together with the workmen of like occupation, and said, Sirs, ye know that by this craft we have our wealth.";
rsv[25] = "These he gathered together, with the workmen of like occupation, and said, &quot;Men, you know that from this business we have our wealth.";
asv[25] = "whom he gathered together, with the workmen of like occupation, and said, Sirs, ye know that by this business we have our wealth.";
yng[25] = "whom, having brought in a crowd together, and those who did work about such things, he said, `Men, ye know that by this work we have our wealth;";
dby[25] = "whom having brought together, and those who wrought in such things, he said, Men, ye know that our well-living arises from this work,";
web[25] = "Whom he called together with the workmen of like occupation, and said, Sirs, ye know that by this craft we have our wealth:";
hnv[25] = "whom he gathered together, with the workmen of like occupation, and said, &quot;Sirs, you know that by this business we have our wealth.";
vul[25] = "quos convocans et eos qui eiusmodi erant opifices dixit viri scitis quia de hoc artificio adquisitio est nobis";
kjv[26] = "Moreover ye see and hear, that not alone at Ephesus, but almost throughout all Asia, this Paul hath persuaded and turned away much people, saying that they be no gods, which are made with hands:";
rsv[26] = "And you see and hear that not only at Ephesus but almost throughout all Asia this Paul has persuaded and turned away a considerable company of people, saying that gods made with hands are not gods.";
asv[26] = "And ye see and hear, that not alone at Ephesus, but almost throughout all Asia, this Paul hath persuaded and turned away much people, saying that they are no gods, that are made with hands:";
yng[26] = "and ye see and hear, that not only at Ephesus, but almost in all Asia, this Paul, having persuaded, did turn away a great multitude, saying, that they are not gods who are made by hands;";
dby[26] = "and ye see and hear that this Paul has persuaded and turned away a great crowd, not only of Ephesus, but almost of all Asia, saying that they are no gods which are made with hands.";
web[26] = "Moreover, ye see and hear, that not alone at Ephesus, but almost throughout all Asia, this Paul hath persuaded and turned away many people, saying, that they are no gods which are made with hands.";
hnv[26] = "You see and hear, that not at Ephesus alone, but almost throughout all Asia, this Sha\'ul has persuaded and turned away many people, saying that they are no gods, that are made with hands.";
vul[26] = "et videtis et auditis quia non solum Ephesi sed paene totius Asiae Paulus hic suadens avertit multam turbam dicens quoniam non sunt dii qui manibus fiunt";
kjv[27] = "So that not only this our craft is in danger to be set at nought; but also that the temple of the great goddess Diana should be despised, and her magnificence should be destroyed, whom all Asia and the world worshippeth.";
rsv[27] = "And there is danger not only that this trade of ours may come into disrepute but also that the temple of the great goddess Ar\'temis may count for nothing, and that she may even be deposed from her magnificence, she whom all Asia and the world worship.&quot;";
asv[27] = "and not only is there danger that this our trade come into disrepute; but also that the temple of the great goddess Diana be made of no account, and that she should even be deposed from her magnificence whom all Asia and the world worshippeth.";
yng[27] = "and not only is this department in danger for us of coming into disregard, but also, that of the great goddess Artemis the temple is to be reckoned for nothing, and also her greatness is about to be brought down, whom all Asia and the world doth worship.\'";
dby[27] = "Now not only there is danger for us that our business come into discredit, but also that the temple of the great goddess Artemis be counted for nothing, and that her greatness should be destroyed whom the whole of Asia and the world reveres.";
web[27] = "So that not only this our craft is in danger to be set at naught; but also that the temple of the great goddess Diana should be despised, and her magnificence should be destroyed, whom all Asia, and the world worshipeth.";
hnv[27] = " Not only is there danger that this our trade come into disrepute, but also that the temple of the great goddess Artemis will be counted as nothing, and her majesty destroyed, whom all Asia and the world worships.&quot;";
vul[27] = "non solum autem haec periclitabitur nobis pars in redargutionem venire sed et magnae deae Dianae templum in nihilum reputabitur sed et destrui incipiet maiestas eius quam tota Asia et orbis colit";
kjv[28] = "And when they heard [these sayings], they were full of wrath, and cried out, saying, Great [is] Diana of the Ephesians.";
rsv[28] = "When they heard this they were enraged, and cried out, &quot;Great is Ar\'temis of the Ephesians!&quot;";
asv[28] = "And when they heard this they were filled with wrath, and cried out, saying, Great [is] Diana of the Ephesians.";
yng[28] = "And they having heard, and having become full of wrath, were crying out, saying, `Great [is] the Artemis of the Ephesians!\'";
dby[28] = "And having heard [this], and being filled with rage, they cried out, saying, Great [is] Artemis of the Ephesians.";
web[28] = "And when they heard [these sayings], they were full of wrath, and cried out, saying, Great [is] Diana of the Ephesians.";
hnv[28] = "When they heard this they were filled with anger, and cried out, saying, &quot;Great is Artemis of the Ephesians!&quot;";
vul[28] = "his auditis repleti sunt ira et exclamaverunt dicentes magna Diana Ephesiorum";
kjv[29] = "And the whole city was filled with confusion: and having caught Gaius and Aristarchus, men of Macedonia, Paul\'s companions in travel, they rushed with one accord into the theatre.";
rsv[29] = "So the city was filled with the confusion; and they rushed together into the theater, dragging with them Ga\'ius and Aristar\'chus, Macedo\'nians who were Paul\'s companions in travel.";
asv[29] = "And the city was filled with the confusion: and they rushed with one accord into the theatre, having seized Gaius and Aristarchus, men of Macedonia, Paul\'s companions in travel.";
yng[29] = "and the whole city was filled with confusion, they rushed also with one accord into the theatre, having caught Gaius and Aristarchus, Macedonians, Paul\'s fellow-travellers.";
dby[29] = "And the [whole] city was filled with confusion, and they rushed with one accord to the theatre, having seized and carried off with [them] Gaius and Aristarchus, Macedonians, fellow-travellers of Paul.";
web[29] = "And the whole city was filled with confusion: and having caught Gaius and Aristarchus, men of Macedonia, Paul\'s companions in travel, they rushed with one accord into the theater.";
hnv[29] = "The whole city was filled with confusion, and they rushed with one accord into the theater, having seized Gaius and Aristarchus, men of Macedonia, Sha\'ul\'s companions in travel.";
vul[29] = "et impleta est civitas confusione et impetum fecerunt uno animo in theatrum rapto Gaio et Aristarcho Macedonibus comitibus Pauli";
kjv[30] = "And when Paul would have entered in unto the people, the disciples suffered him not.";
rsv[30] = "Paul wished to go in among the crowd, but the disciples would not let him;";
asv[30] = "And when Paul was minded to enter in unto the people, the disciples suffered him not.";
yng[30] = "And on Paul\'s purposing to enter in unto the populace, the disciples were not suffering him,";
dby[30] = "But Paul intending to go in to the people, the disciples suffered him not;";
web[30] = "And when Paul would have entered in to the people, the disciples suffered him not.";
hnv[30] = "When Sha\'ul wanted to enter in to the people, the talmidim didn\'t allow him.";
vul[30] = "Paulo autem volente intrare in populum non permiserunt discipuli";
kjv[31] = "And certain of the chief of Asia, which were his friends, sent unto him, desiring [him] that he would not adventure himself into the theatre.";
rsv[31] = "some of the A\'si-archs also, who were friends of his, sent to him and begged him not to venture into the theater.";
asv[31] = "And certain also of the Asiarchs, being his friends, sent unto him and besought him not to adventure himself into the theatre.";
yng[31] = "and certain also of the chief men of Asia, being his friends, having sent unto him, were entreating him not to venture himself into the theatre.";
dby[31] = "and some of the Asiarchs also, who were his friends, sent to him and urged him not to throw himself into the theatre.";
web[31] = "And certain of the chief of Asia, who were his friends, sent to him, desiring [him] that he would not adventure himself into the theater.";
hnv[31] = "Certain also of the Asiarchs, being his friends, sent to him and begged him not to venture into the theater.";
vul[31] = "quidam autem et de Asiae principibus qui erant amici eius miserunt ad eum rogantes ne se daret in theatrum";
kjv[32] = "Some therefore cried one thing, and some another: for the assembly was confused; and the more part knew not wherefore they were come together.";
rsv[32] = "Now some cried one thing, some another; for the assembly was in confusion, and most of them did not know why they had come together.";
asv[32] = "Some therefore cried one thing, and some another: for the assembly was in confusion; and the more part knew not wherefore they were come together.";
yng[32] = "Some indeed, therefore, were calling out one thing, and some another, for the assembly was confused, and the greater part did not know for what they were come together;";
dby[32] = "Different persons therefore cried out some different thing; for the assembly was tumultuous, and the most did not know for what cause they had come together.";
web[32] = "Some therefore cried one thing, and some another: for the assembly was confused, and the greater part knew not why they had come together.";
hnv[32] = "Some therefore cried one thing, and some another, for the assembly was in confusion. Most of them didn\'t know why they had come together.";
vul[32] = "alii autem aliud clamabant erat enim ecclesia confusa et plures nesciebant qua ex causa convenissent";
kjv[33] = "And they drew Alexander out of the multitude, the Jews putting him forward. And Alexander beckoned with the hand, and would have made his defence unto the people.";
rsv[33] = "Some of the crowd prompted Alexander, whom the Jews had put forward. And Alexander motioned with his hand, wishing to make a defense to the people.";
asv[33] = "And they brought Alexander out of the multitude, the Jews putting him forward. And Alexander beckoned with the hand, and would have made a defence unto the people.";
yng[33] = "and out of the multitude they put forward Alexander -- the Jews thrusting him forward -- and Alexander having beckoned with the hand, wished to make defence to the populace,";
dby[33] = "But from among the crowd they put forward Alexander, the Jews pushing him forward. And Alexander, beckoning with his hand, would have made a defence to the people.";
web[33] = "And they drew Alexander out of the multitude, the Jews putting him forward. And Alexander beckoned with the hand, and would have made his defense to the people.";
hnv[33] = "They brought Alexander out of the multitude, the Yehudim putting him forward. Alexander beckoned with his hand, and would have made a defense to the people.";
vul[33] = "de turba autem detraxerunt Alexandrum propellentibus eum Iudaeis Alexander ergo manu silentio postulato volebat rationem reddere populo";
kjv[34] = "But when they knew that he was a Jew, all with one voice about the space of two hours cried out, Great [is] Diana of the Ephesians.";
rsv[34] = "But when they recognized that he was a Jew, for about two hours they all with one voice cried out, &quot;Great is Ar\'temis of the Ephesians!&quot;";
asv[34] = "But when they perceived that he was a Jew, all with one voice about the space of two hours cried out, Great [is] Diana of the Ephesians.";
yng[34] = "and having known that he is a Jew, one voice came out of all, for about two hours, crying, `Great [is] the Artemis of the Ephesians!\'";
dby[34] = "But, recognising that he was a Jew, there was one cry from all, shouting for about two hours, Great [is] Artemis of the Ephesians.";
web[34] = "But when they knew that he was a Jew, all with one voice about the space of two hours cried out, Great [is] Diana of the Ephesians.";
hnv[34] = "But when they perceived that he was a Yehudi, all with one voice for a time of about two hours cried out, &quot;Great is Artemis of the Ephesians!&quot;";
vul[34] = "quem ut cognoverunt Iudaeum esse vox facta est una omnium quasi per horas duas clamantium magna Diana Ephesiorum";
kjv[35] = "And when the townclerk had appeased the people, he said, [Ye] men of Ephesus, what man is there that knoweth not how that the city of the Ephesians is a worshipper of the great goddess Diana, and of the [image] which fell down from Jupiter?";
rsv[35] = "And when the town clerk had quieted the crowd, he said, &quot;Men of Ephesus, what man is there who does not know that the city of the Ephesians is temple keeper of the great Ar\'temis, and of the sacred stone that fell from the sky?";
asv[35] = "And when the townclerk had quieted the multitude, he saith, Ye men of Ephesus, what man is there who knoweth not that the city of the Ephesians is temple-keeper of the great Diana, and of the [image] which fell down from Jupiter?";
yng[35] = "And the public clerk having quieted the multitude, saith, `Men, Ephesians, why, who is the man that doth not know that the city of the Ephesians is a devotee of the great goddess Artemis, and of that which fell down from Zeus?";
dby[35] = "And the townclerk, having quieted the crowd, said, Ephesians, what man is there then who does not know that the city of the Ephesians is temple-keeper of Artemis the great, and of the [image] which fell down from heaven?";
web[35] = "And when the town-clerk had appeased the people, he said, [Ye] men of Ephesus, what man is there that knoweth not that the city of the Ephesians is a worshiper of the great goddess Diana, and of the [image] which fell down from Jupiter?";
hnv[35] = "When the town clerk had quieted the multitude, he said, &quot;You men of Ephesus, what man is there who doesn\'t know that the city of the Ephesians is temple-keeper of the great goddess Artemis, and of the image which fell down from Zeus?";
vul[35] = "et cum sedasset scriba turbas dixit viri ephesii quis enim est hominum qui nesciat Ephesiorum civitatem cultricem esse magnae Dianae Iovisque prolis";
kjv[36] = "Seeing then that these things cannot be spoken against, ye ought to be quiet, and to do nothing rashly.";
rsv[36] = "Seeing then that these things cannot be contradicted, you ought to be quiet and do nothing rash.";
asv[36] = "Seeing then that these things cannot be gainsaid, ye ought to be quiet, and to do nothing rash.";
yng[36] = "these things, then, not being to be gainsaid, it is necessary for you to be quiet, and to do nothing rashly.";
dby[36] = "These things therefore being undeniable, it is necessary that ye should be calm and do nothing headlong.";
web[36] = "Seeing then that these things cannot be contradicted, ye ought to be quiet, and to do nothing rashly.";
hnv[36] = "Seeing then that these things can\'t be denied, you ought to be quiet, and to do nothing rash.";
vul[36] = "cum ergo his contradici non possit oportet vos sedatos esse et nihil temere agere";
kjv[37] = "For ye have brought hither these men, which are neither robbers of churches, nor yet blasphemers of your goddess.";
rsv[37] = "For you have brought these men here who are neither sacrilegious nor blasphemers of our goddess.";
asv[37] = "For ye have brought [hither] these men, who are neither robbers of temples nor blasphemers of our goddess.";
yng[37] = "`For ye brought these men, who are neither temple-robbers nor speaking evil of your goddess;";
dby[37] = "For ye have brought these men, [who are] neither temple-plunderers, nor speak injuriously of your goddess.";
web[37] = "For ye have brought hither these men, who are neither robbers of churches, nor yet blasphemers of your goddess.";
hnv[37] = " For you have brought these men here, who are neither robbers of temples nor blasphemers of your goddess.";
vul[37] = "adduxistis enim homines istos neque sacrilegos neque blasphemantes deam vestram";
kjv[38] = "Wherefore if Demetrius, and the craftsmen which are with him, have a matter against any man, the law is open, and there are deputies: let them implead one another.";
rsv[38] = "If therefore Deme\'trius and the craftsmen with him have a complaint against any one, the courts are open, and there are proconsuls; let them bring charges against one another.";
asv[38] = "If therefore Demetrius, and the craftsmen that are with him, have a matter against any man, the courts are open, and there are proconsuls: let them accuse one another.";
yng[38] = "if indeed, therefore, Demetrius and the artificers with him with any one have a matter, court [days] are held, and there are proconsuls; let them accuse one another.";
dby[38] = "If therefore Demetrius and the artisans who [are] with him have a matter against any one, the courts are being held, and there are proconsuls: let them accuse one another.";
web[38] = "Wherefore, if Demetrius and the artificers who are with him, have a matter against any man, the law is open, and there are deputies: let them implead one another.";
hnv[38] = "If therefore Demetrius and the craftsmen who are with him have a matter against anyone, the courts are open, and there are proconsuls. Let them press charges against one another.";
vul[38] = "quod si Demetrius et qui cum eo sunt artifices habent adversus aliquem causam conventus forenses aguntur et pro consulibus sunt accusent invicem";
kjv[39] = "But if ye enquire any thing concerning other matters, it shall be determined in a lawful assembly.";
rsv[39] = "But if you seek anything further, it shall be settled in the regular assembly.";
asv[39] = "But if ye seek anything about other matters, it shall be settled in the regular assembly.";
yng[39] = "`And if ye seek after anything concerning other matters, in the legal assembly it shall be determined;";
dby[39] = "But if ye inquire anything concerning other matters, it will be settled in the regular assembly.";
web[39] = "But if ye inquire any thing concerning other matters, it shall be determined in a lawful assembly.";
hnv[39] = "But if you seek anything about other matters, it will be settled in the regular assembly.";
vul[39] = "si quid autem alterius rei quaeritis in legitima ecclesia poterit absolvi";
kjv[40] = "For we are in danger to be called in question for this day\'s uproar, there being no cause whereby we may give an account of this concourse.";
rsv[40] = "For we are in danger of being charged with rioting today, there being no cause that we can give to justify this commotion.&quot;";
asv[40] = "For indeed we are in danger to be accused concerning this day\'s riot, there being no cause [for it]: and as touching it we shall not be able to give account of this concourse.";
yng[40] = "for we are also in peril of being accused of insurrection in regard to this day, there being no occasion by which we shall be able to give an account of this concourse;\'";
dby[40] = "For also we are in danger to be put in accusation for sedition for this [affair] of to-day, no cause existing in reference to which we shall be able to give a reason for this concourse.";
web[40] = "For we are in danger to be called in question for this day\'s uproar, there being no cause by which we may give an account of this concourse.";
hnv[40] = "For indeed we are in danger of being accused concerning this day\'s riot, there being no cause. Concerning it, we wouldn\'t be able to give an account of this commotion.&quot;";
vul[40] = "[Vulgate 19:40a] nam et periclitamur argui seditionis hodiernae cum nullus obnoxius sit de quo non possimus reddere rationem concursus istius";
kjv[41] = "And when he had thus spoken, he dismissed the assembly.";
rsv[41] = "And when he had said this, he dismissed the assembly.";
asv[41] = "And when he had thus spoken, he dismissed the assembly.";
yng[41] = "and these things having said, he dismissed the assembly.";
dby[41] = "And having said these things, he dismissed the assembly.";
web[41] = "And when he had thus spoken, he dismissed the assembly.";
hnv[41] = "When he had thus spoken, he dismissed the assembly.";
vul[41] = "[Vulgate 19:40b] et cum haec dixisset dimisit ecclesiam";
