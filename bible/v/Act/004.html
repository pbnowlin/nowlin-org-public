csb[1] = "While they were speaking to the people, the priests, the captain of the temple police, and the Sadducees confronted them,";
csb[2] = "because they were annoyed that they were teaching the people and proclaiming in Jesus the resurrection of the dead.";
csb[3] = "So they seized them and took them into custody until the next day since it was already evening.";
csb[4] = "But many of those who heard the message believed, and the number of the men came to about five thousand.";
csb[5] = "The next day, their rulers, elders, and scribes assembled in Jerusalem";
csb[6] = "with Annas the high priest, Caiaphas, John, Alexander, and all the members of the high-priestly family.";
csb[7] = "After they had Peter and John stand before them, they began to question them: &quot;By what power or in what name have you done this? &quot;";
csb[8] = "Then Peter was filled with the Holy Spirit and said to them, &quot;Rulers of the people and elders:";
csb[9] = "&quot;If we are being examined today about a good deed done to a disabled man, by what means he was healed,";
csb[10] = "&quot;let it be known to all of you and to all the people of Israel, that by the name of Jesus Christ of Nazareth, whom you crucified and whom God raised from the dead -- by him this man is standing here before you healthy.";
csb[11] = "&quot;This Jesus is the stone rejected by you builders, which has become the cornerstone.";
csb[12] = "&quot; There is salvation in no one else, for there is no other name under heaven given to people by which we must be saved.&quot;";
csb[13] = "When they observed the boldness of Peter and John and realized that they were uneducated and untrained men, they were amazed and recognized that they had been with Jesus.";
csb[14] = "And since they saw the man who had been healed standing with them, they had nothing to say in opposition.";
csb[15] = "After they ordered them to leave the Sanhedrin, they conferred among themselves,";
csb[16] = "saying, &quot;What should we do with these men? For an obvious sign has been done through them, clear to everyone living in Jerusalem, and we cannot deny it.";
csb[17] = "&quot;But so that this does not spread any further among the people, let\'s threaten them against speaking to anyone in this name again.&quot;";
csb[18] = "So they called for them and ordered them not to speak or teach at all in the name of Jesus.";
csb[19] = "Peter and John answered them, &quot;Whether it\'s right in the sight of God for us to listen to you rather than to God, you decide;";
csb[20] = "&quot;for we are unable to stop speaking about what we have seen and heard.&quot;";
csb[21] = "After threatening them further, they released them. They found no way to punish them because the people were all giving glory to God over what had been done.";
csb[22] = "For this sign of healing had been performed on a man over forty years old.";
csb[23] = "After they were released, they went to their own people and reported everything the chief priests and the elders had said to them.";
csb[24] = "When they heard this, they raised their voices together to God and said, &quot;Master, you are the one who made the heaven, the earth, and the sea, and everything in them.";
csb[25] = "&quot;You said through the Holy Spirit, by the mouth of our father David your servant: Why do the Gentiles rage and the peoples plot futile things?";
csb[26] = "&quot;The kings of the earth take their stand and the rulers assemble together against the Lord and against his Messiah.";
csb[27] = "&quot;For, in fact, in this city both Herod and Pontius Pilate, with the Gentiles and the people of Israel, assembled together against your holy servant Jesus, whom you anointed,";
csb[28] = "&quot;to do whatever your hand and your will had predestined to take place.";
csb[29] = "&quot;And now, Lord, consider their threats, and grant that your servants may speak your word with all boldness,";
csb[30] = "&quot;while you stretch out your hand for healing, and signs and wonders are performed through the name of your holy servant Jesus.&quot;";
csb[31] = "When they had prayed, the place where they were assembled was shaken, and they were all filled with the Holy Spirit and began to speak the word of God boldly.";
csb[32] = "Now the entire group of those who believed were of one heart and mind, and no one claimed that any of his possessions was his own, but instead they held everything in common.";
csb[33] = "With great power the apostles were giving testimony to the resurrection of the Lord Jesus, and great grace was on all of them.";
csb[34] = "For there was not a needy person among them because all those who owned lands or houses sold them, brought the proceeds of what was sold,";
csb[35] = "and laid them at the apostles\' feet. This was then distributed to each person as any had need.";
csb[36] = "Joseph, a Levite from Cyprus by birth, the one the apostles called Barnabas (which is translated Son of Encouragement),";
csb[37] = "sold a field he owned, brought the money, and laid it at the apostles\' feet.";
