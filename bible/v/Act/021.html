csb[1] = "After we tore ourselves away from them, we set sail straight for Cos, the next day to Rhodes, and from there to Patara.";
csb[2] = "Finding a ship crossing over to Phoenicia, we boarded and set sail.";
csb[3] = "After we sighted Cyprus, passing to the south of it, we sailed on to Syria and arrived at Tyre, since the ship was to unload its cargo there.";
csb[4] = "We sought out the disciples and stayed there seven days. Through the Spirit they told Paul not to go to Jerusalem.";
csb[5] = "When our time had come to an end, we left to continue our journey, while all of them, with their wives and children, accompanied us out of the city. After kneeling down on the beach to pray,";
csb[6] = "we said farewell to one another and boarded the ship, and they returned home.";
csb[7] = "When we completed our voyage from Tyre, we reached Ptolemais, where we greeted the brothers and sisters and stayed with them for a day.";
csb[8] = "The next day we left and came to Caesarea, where we entered the house of Philip the evangelist, who was one of the Seven, and stayed with him.";
csb[9] = "This man had four virgin daughters who prophesied.";
csb[10] = "After we had been there for several days, a prophet named Agabus came down from Judea.";
csb[11] = "He came to us, took Paul\'s belt, tied his own feet and hands, and said, &quot;This is what the Holy Spirit says: \'In this way the Jews in Jerusalem will bind the man who owns this belt and deliver him over to the Gentiles.\' &quot;";
csb[12] = "When we heard this, both we and the local people pleaded with him not to go up to Jerusalem.";
csb[13] = "Then Paul replied, &quot;What are you doing, weeping and breaking my heart? For I am ready not only to be bound but also to die in Jerusalem for the name of the Lord Jesus.&quot;";
csb[14] = "Since he would not be persuaded, we said no more except, &quot;The Lord\'s will be done.&quot;";
csb[15] = "After this we got ready and went up to Jerusalem.";
csb[16] = "Some of the disciples from Caesarea also went with us and brought us to Mnason of Cyprus, an early disciple, with whom we were to stay.";
csb[17] = "When we reached Jerusalem, the brothers and sisters welcomed us warmly.";
csb[18] = "The following day Paul went in with us to James, and all the elders were present.";
csb[19] = "After greeting them, he reported in detail what God had done among the Gentiles through his ministry.";
csb[20] = "When they heard it, they glorified God and said, &quot;You see, brother, how many thousands of Jews there are who have believed, and they are all zealous for the law.";
csb[21] = "&quot;But they have been informed about you -- that you are teaching all the Jews who are among the Gentiles to abandon Moses, telling them not to circumcise their children or to live according to our customs.";
csb[22] = "&quot;So what is to be done? They will certainly hear that you\'ve come.";
csb[23] = "&quot;Therefore do what we tell you: We have four men who have made a vow.";
csb[24] = "&quot;Take these men, purify yourself along with them, and pay for them to get their heads shaved. Then everyone will know that what they were told about you amounts to nothing, but that you yourself are also careful about observing the law.";
csb[25] = "&quot;With regard to the Gentiles who have believed, we have written a letter containing our decision that they should keep themselves from food sacrificed to idols, from blood, from what is strangled, and from sexual immorality.&quot;";
csb[26] = "So the next day, Paul took the men, having purified himself along with them, and entered the temple, announcing the completion of the purification days when the offering would be made for each of them.";
csb[27] = "When the seven days were nearly over, some Jews from the province of Asia saw him in the temple, stirred up the whole crowd, and seized him,";
csb[28] = "shouting, &quot;Fellow Israelites, help! This is the man who teaches everyone everywhere against our people, our law, and this place. What\'s more, he also brought Greeks into the temple and has defiled this holy place.&quot;";
csb[29] = "For they had previously seen Trophimus the Ephesian in the city with him, and they supposed that Paul had brought him into the temple.";
csb[30] = "The whole city was stirred up, and the people rushed together. They seized Paul, dragged him out of the temple, and at once the gates were shut.";
csb[31] = "As they were trying to kill him, word went up to the commander of the regiment that all Jerusalem was in chaos.";
csb[32] = "Taking along soldiers and centurions, he immediately ran down to them. Seeing the commander and the soldiers, they stopped beating Paul.";
csb[33] = "Then the commander approached, took him into custody, and ordered him to be bound with two chains. He asked who he was and what he had done.";
csb[34] = "Some in the crowd were shouting one thing and some another. Since he was not able to get reliable information because of the uproar, he ordered him to be taken into the barracks.";
csb[35] = "When Paul got to the steps, he had to be carried by the soldiers because of the violence of the crowd,";
csb[36] = "for the mass of people followed, yelling, &quot;Get rid of him! &quot;";
csb[37] = "As he was about to be brought into the barracks, Paul said to the commander, &quot;Am I allowed to say something to you? &quot; He replied, &quot;You know how to speak Greek?";
csb[38] = "&quot;Aren\'t you the Egyptian who started a revolt some time ago and led four thousand men of the Assassins into the wilderness? &quot;";
csb[39] = "Paul said, &quot;I am a Jewish man from Tarsus of Cilicia, a citizen of an important city. Now I ask you, let me speak to the people.&quot;";
csb[40] = "After he had given permission, Paul stood on the steps and motioned with his hand to the people. When there was a great hush, he addressed them in Aramaic:";
kjv[1] = "And it came to pass, that after we were gotten from them, and had launched, we came with a straight course unto Coos, and the [day] following unto Rhodes, and from thence unto Patara:";
kjv[2] = "And finding a ship sailing over unto Phenicia, we went aboard, and set forth.";
kjv[3] = "Now when we had discovered Cyprus, we left it on the left hand, and sailed into Syria, and landed at Tyre: for there the ship was to unlade her burden.";
kjv[4] = "And finding disciples, we tarried there seven days: who said to Paul through the Spirit, that he should not go up to Jerusalem.";
kjv[5] = "And when we had accomplished those days, we departed and went our way; and they all brought us on our way, with wives and children, till [we were] out of the city: and we kneeled down on the shore, and prayed.";
kjv[6] = "And when we had taken our leave one of another, we took ship; and they returned home again.";
kjv[7] = "And when we had finished [our] course from Tyre, we came to Ptolemais, and saluted the brethren, and abode with them one day.";
kjv[8] = "And the next [day] we that were of Paul\'s company departed, and came unto Caesarea: and we entered into the house of Philip the evangelist, which was [one] of the seven; and abode with him.";
kjv[9] = "And the same man had four daughters, virgins, which did prophesy.";
kjv[10] = "And as we tarried [there] many days, there came down from Judaea a certain prophet, named Agabus.";
kjv[11] = "And when he was come unto us, he took Paul\'s girdle, and bound his own hands and feet, and said, Thus saith the Holy Ghost, So shall the Jews at Jerusalem bind the man that owneth this girdle, and shall deliver [him] into the hands of the Gentiles.";
kjv[12] = "And when we heard these things, both we, and they of that place, besought him not to go up to Jerusalem.";
kjv[13] = "Then Paul answered, What mean ye to weep and to break mine heart? for I am ready not to be bound only, but also to die at Jerusalem for the name of the Lord Jesus.";
kjv[14] = "And when he would not be persuaded, we ceased, saying, The will of the Lord be done.";
kjv[15] = "And after those days we took up our carriages, and went up to Jerusalem.";
kjv[16] = "There went with us also [certain] of the disciples of Caesarea, and brought with them one Mnason of Cyprus, an old disciple, with whom we should lodge.";
kjv[17] = "And when we were come to Jerusalem, the brethren received us gladly.";
kjv[18] = "And the [day] following Paul went in with us unto James; and all the elders were present.";
kjv[19] = "And when he had saluted them, he declared particularly what things God had wrought among the Gentiles by his ministry.";
kjv[20] = "And when they heard [it], they glorified the Lord, and said unto him, Thou seest, brother, how many thousands of Jews there are which believe; and they are all zealous of the law:";
kjv[21] = "And they are informed of thee, that thou teachest all the Jews which are among the Gentiles to forsake Moses, saying that they ought not to circumcise [their] children, neither to walk after the customs.";
kjv[22] = "What is it therefore? the multitude must needs come together: for they will hear that thou art come.";
kjv[23] = "Do therefore this that we say to thee: We have four men which have a vow on them;";
kjv[24] = "Them take, and purify thyself with them, and be at charges with them, that they may shave [their] heads: and all may know that those things, whereof they were informed concerning thee, are nothing; but [that] thou thyself also walkest orderly, and keepest the law.";
kjv[25] = "As touching the Gentiles which believe, we have written [and] concluded that they observe no such thing, save only that they keep themselves from [things] offered to idols, and from blood, and from strangled, and from fornication.";
kjv[26] = "Then Paul took the men, and the next day purifying himself with them entered into the temple, to signify the accomplishment of the days of purification, until that an offering should be offered for every one of them.";
kjv[27] = "And when the seven days were almost ended, the Jews which were of Asia, when they saw him in the temple, stirred up all the people, and laid hands on him,";
kjv[28] = "Crying out, Men of Israel, help: This is the man, that teacheth all [men] every where against the people, and the law, and this place: and further brought Greeks also into the temple, and hath polluted this holy place.";
kjv[29] = "(For they had seen before with him in the city Trophimus an Ephesian, whom they supposed that Paul had brought into the temple.)";
kjv[30] = "And all the city was moved, and the people ran together: and they took Paul, and drew him out of the temple: and forthwith the doors were shut.";
kjv[31] = "And as they went about to kill him, tidings came unto the chief captain of the band, that all Jerusalem was in an uproar.";
kjv[32] = "Who immediately took soldiers and centurions, and ran down unto them: and when they saw the chief captain and the soldiers, they left beating of Paul.";
kjv[33] = "Then the chief captain came near, and took him, and commanded [him] to be bound with two chains; and demanded who he was, and what he had done.";
kjv[34] = "And some cried one thing, some another, among the multitude: and when he could not know the certainty for the tumult, he commanded him to be carried into the castle.";
kjv[35] = "And when he came upon the stairs, so it was, that he was borne of the soldiers for the violence of the people.";
kjv[36] = "For the multitude of the people followed after, crying, Away with him.";
kjv[37] = "And as Paul was to be led into the castle, he said unto the chief captain, May I speak unto thee? Who said, Canst thou speak Greek?";
kjv[38] = "Art not thou that Egyptian, which before these days madest an uproar, and leddest out into the wilderness four thousand men that were murderers?";
kjv[39] = "But Paul said, I am a man [which am] a Jew of Tarsus, [a city] in Cilicia, a citizen of no mean city: and, I beseech thee, suffer me to speak unto the people.";
kjv[40] = "And when he had given him licence, Paul stood on the stairs, and beckoned with the hand unto the people. And when there was made a great silence, he spake unto [them] in the Hebrew tongue, saying,";

dby[16] = "And [some] of the disciples from Caesarea went with us, bringing [with them] a certain Mnason, a Cyprian, an old disciple, with whom we were to lodge.";
web[16] = "There went with us also [certain] of the disciples of Cesarea, and brought with them one Mnason of Cyprus, an old disciple, with whom we should lodge.";
hnv[16] = "Some of the talmidim from Caesarea also went with us, bringing one Mnason of Cyprus, an early talmid, with whom we would stay.";
vul[16] = "venerunt autem et ex discipulis a Caesarea nobiscum adducentes apud quem hospitaremur Mnasonem quendam Cyprium antiquum discipulum";
rsv[17] = "When we had come to Jerusalem, the brethren received us gladly.";
asv[17] = "And when we were come to Jerusalem, the brethren received us gladly.";
yng[17] = "And we having come to Jerusalem, the brethren did gladly receive us,";
dby[17] = "And when we arrived at Jerusalem the brethren gladly received us.";
web[17] = "And when we had come to Jerusalem, the brethren received us gladly.";
hnv[17] = "When we had come to Yerushalayim, the brothers received us gladly.";
vul[17] = "et cum venissemus Hierosolymam libenter exceperunt nos fratres";
rsv[18] = "On the following day Paul went in with us to James; and all the elders were present.";
asv[18] = "And the day following Paul went in with us unto James; and all the elders were present.";
yng[18] = "and on the morrow Paul was going in with us unto James, all the elders also came,";
dby[18] = "And on the morrow Paul went in with us to James, and all the elders came there.";
web[18] = "And the [day] following Paul went in with us to James: and all the elders were present.";
hnv[18] = "The day following, Sha\'ul went in with us to Ya`akov; and all the Zakenim were present.";
vul[18] = "sequenti autem die introibat Paulus nobiscum ad Iacobum omnesque collecti sunt seniores";
rsv[19] = "After greeting them, he related one by one the things that God had done among the Gentiles through his ministry.";
asv[19] = "And when he had saluted them, he rehearsed one by one the things which God had wrought among the Gentiles through his ministry.";
yng[19] = "and having saluted them, he was declaring, one by one, each of the things God did among the nations through his ministration,";
dby[19] = "And having saluted them, he related one by one the things which God had wrought among the nations by his ministry.";
web[19] = "And when he had saluted them, he declared particularly what things God had wrought among the Gentiles by his ministry.";
hnv[19] = "When he had greeted them, he reported one by one the things which God had worked among the Goyim through his ministry.";
vul[19] = "quos cum salutasset narrabat per singula quae fecisset Deus in gentibus per ministerium ipsius";
rsv[20] = "And when they heard it, they glorified God. And they said to him, &quot;You see, brother, how many thousands there are among the Jews of those who have believed; they are all zealous for the law,";
asv[20] = "And they, when they heard it, glorified God; and they said unto him, Thou seest, brother, how many thousands there are among the Jews of them that have believed; and they are all zealous for the law:";
yng[20] = "and they having heard, were glorifying the Lord. They said also to him, `Thou seest, brother, how many myriads there are of Jews who have believed, and all are zealous of the law,";
dby[20] = "And they having heard [it] glorified God, and said to him, Thou seest, brother, how many myriads there are of the Jews who have believed, and all are zealous of the law.";
web[20] = "And when they heard [it], they glorified the Lord, and said to him, Thou seest, brother, how many thousands of Jews there are who believe; and they are all zealous of the law:";
hnv[20] = "They, when they heard it, glorified God. They said to him, &quot;You see, brother, how many thousands there are among the Yehudim of those who have believed, and they are all zealous for the law.";
vul[20] = "at illi cum audissent magnificabant Deum dixeruntque ei vides frater quot milia sint in Iudaeis qui crediderunt et omnes aemulatores sunt legis";
rsv[21] = "and they have been told about you that you teach all the Jews who are among the Gentiles to forsake Moses, telling them not to circumcise their children or observe the customs.";
asv[21] = "and they have been informed concerning thee, that thou teachest all the Jews who are among the Gentiles to forsake Moses, telling them not to circumcise their children, neither to walk after the customs.";
yng[21] = "and they are instructed concerning thee, that apostacy from Moses thou dost teach to all Jews among the nations, saying -- Not to circumcise the children, nor after the customs to walk;";
dby[21] = "And they have been informed concerning thee, that thou teachest all the Jews among the nations apostasy from Moses, saying that they should not circumcise their children, nor walk in the customs.";
web[21] = "And they are informed concerning thee, that thou teachest all the Jews who are among the Gentiles to forsake Moses, saying, That they ought not to circumcise [their] children, neither to walk after the customs.";
hnv[21] = "They have been informed about you, that you teach all the Yehudim who are among the Goyim to forsake Moshe, telling them not to circumcise their children neither to walk after the customs.";
vul[21] = "audierunt autem de te quia discessionem doceas a Mose eorum qui per gentes sunt Iudaeorum dicens non debere circumcidere eos filios suos neque secundum consuetudinem ingredi";
rsv[22] = "What then is to be done? They will certainly hear that you have come.";
asv[22] = "What is it therefore? they will certainly hear that thou art come.";
yng[22] = "what then is it? certainly the multitude it behoveth to come together, for they will hear that thou hast come.";
dby[22] = "What is it then? a multitude must necessarily come together, for they will hear that thou art come.";
web[22] = "What is it therefore? the multitude must needs come together: for they will hear that thou art come.";
hnv[22] = " What then? The assembly must certainly meet, for they will hear that you have come.";
vul[22] = "quid ergo est utique oportet convenire multitudinem audient enim te supervenisse";
rsv[23] = "Do therefore what we tell you. We have four men who are under a vow;";
asv[23] = "Do therefore this that we say to thee: We have four men that have a vow on them;";
yng[23] = "`This, therefore, do that we say to thee: We have four men having a vow on themselves,";
dby[23] = "This do therefore that we say to thee: We have four men who have a vow on them;";
web[23] = "Do therefore this that we say to thee: we have four men who have a vow on them;";
hnv[23] = "Therefore do what we tell you. We have four men who have taken a vow.";
vul[23] = "hoc ergo fac quod tibi dicimus sunt nobis viri quattuor votum habentes super se";
rsv[24] = "take these men and purify yourself along with them and pay their expenses, so that they may shave their heads. Thus all will know that there is nothing in what they have been told about you but that you yourself live in observance of the law.";
asv[24] = "these take, and purify thyself with them, and be at charges for them, that they may shave their heads: and all shall know that there is no truth in the things whereof they have been informed concerning thee; but that thou thyself also walkest orderly, keeping the law.";
yng[24] = "these having taken, be purified with them, and be at expence with them, that they may shave the head, and all may know that the things of which they have been instructed concerning thee are nothing, but thou dost walk -- thyself also -- the law keeping.";
dby[24] = "take these and be purified with them, and pay their expenses, that they may have their heads shaved; and all will know that [of those things] of which they have been informed about thee nothing is [true]; but that thou thyself also walkest orderly, keeping the law.";
web[24] = "Take them, and purify thyself with them, and be at charges with them, that they may shave [their] heads: and all may know that those things of which they were informed concerning thee, are nothing; but [that] thou thyself also walkest orderly, and keepest the law.";
hnv[24] = "Take them, and purify yourself with them, and pay their expenses for them, that they may shave their heads. Then all will know that there is no truth in the things that they have been informed about you, but that you yourself also walk keeping the law.";
vul[24] = "his adsumptis sanctifica te cum illis et inpende in illis ut radant capita et scient omnes quia quae de te audierunt falsa sunt sed ambulas et ipse custodiens legem";
rsv[25] = "But as for the Gentiles who have believed, we have sent a letter with our judgment that they should abstain from what has been sacrificed to idols and from blood and from what is strangled and from unchastity.&quot;";
asv[25] = "But as touching the Gentiles that have believed, we wrote, giving judgment that they should keep themselves from things sacrificed to idols, and from blood, and from what is strangled, and from fornication.";
yng[25] = "`And concerning those of the nations who have believed, we have written, having given judgment, that they observe no such thing, except to keep themselves both from idol-sacrifices, and blood, and a strangled thing, and whoredom.\'";
dby[25] = "But concerning [those of] the nations who have believed, we have written, deciding that they should [observe no such thing, only to] keep themselves both from things offered to idols, and from blood, and from things strangled, and from fornication.";
web[25] = "As concerning the Gentiles who believe, we have written [and] concluded that they observe no such thing, save only that they keep themselves from [things] offered to idols, and from blood, and from strangled, and from lewdness.";
hnv[25] = "But concerning the Goyim who believe, we have written our decision that they should observe no such thing, except that they should keep themselves from food offered to idols, from blood, from strangled things, and from sexual immorality.&quot;";
vul[25] = "de his autem qui crediderunt ex gentibus nos scripsimus iudicantes ut abstineant se ab idolis immolato et sanguine et suffocato et fornicatione";
rsv[26] = "Then Paul took the men, and the next day he purified himself with them and went into the temple, to give notice when the days of purification would be fulfilled and the offering presented for every one of them.";
asv[26] = "Then Paul took the men, and the next day purifying himself with them went into the temple, declaring the fulfilment of the days of purification, until the offering was offered for every one of them.";
yng[26] = "Then Paul, having taken the men, on the following day, with them having purified himself, was entering into the temple, announcing the fulfilment of the days of the purification, till the offering was offered for each one of them.";
dby[26] = "Then Paul, taking the men, on the next day, having been purified, entered with them into the temple, signifying the time the days of the purification would be fulfilled, until the offering was offered for every one of them.";
web[26] = "Then Paul took the men, and the next day purifying himself with them, entered into the temple, to signify the accomplishment of the days of purification, until an offering should be offered for every one of them.";
hnv[26] = "Then Sha\'ul took the men, and the next day, purified himself and went with them into the temple, declaring the fulfillment of the days of purification, until the offering was offered for every one of them.";
vul[26] = "tunc Paulus adsumptis viris postera die purificatus cum illis intravit in templum adnuntians expletionem dierum purificationis donec offerretur pro unoquoque eorum oblatio";
rsv[27] = "When the seven days were almost completed, the Jews from Asia, who had seen him in the temple, stirred up all the crowd, and laid hands on him,";
asv[27] = "And when the seven days were almost completed, the Jews from Asia, when they saw him in the temple, stirred up all the multitude and laid hands on him,";
yng[27] = "And, as the seven days were about to be fully ended, the Jews from Asia having beheld him in the temple, were stirring up all the multitude, and they laid hands upon him,";
dby[27] = "And when the seven days were nearly completed, the Jews from Asia, having seen him in the temple, set all the crowd in a tumult, and laid hands upon him,";
web[27] = "And when the seven days were almost ended, the Jews who were from Asia, when they saw him in the temple, stirred up all the people, and laid hands on him,";
hnv[27] = "When the seven days were almost completed, the Yehudim from Asia, when they saw him in the temple, stirred up all the multitude and laid hands on him,";
vul[27] = "dum autem septem dies consummarentur hii qui de Asia erant Iudaei cum vidissent eum in templo concitaverunt omnem populum et iniecerunt ei manus clamantes";
rsv[28] = "crying out, &quot;Men of Israel, help! This is the man who is teaching men everywhere against the people and the law and this place; moreover he also brought Greeks into the temple, and he has defiled this holy place.&quot;";
asv[28] = "crying out, Men of Israel, help: This is the man that teacheth all men everywhere against the people, and the law, and this place; and moreover he brought Greeks also into the temple, and hath defiled this holy place.";
yng[28] = "crying out, `Men, Israelites, help! this is the man who, against the people, and the law, and this place, all everywhere is teaching; and further, also, Greeks he brought into the temple, and hath defiled this holy place;\'";
dby[28] = "crying, Israelites, help! this is the man who teaches all everywhere against the people, and the law, and this place, and has brought Greeks too into the temple, and profaned this holy place.";
web[28] = "Crying out, Men of Israel, help. This is the man that teacheth all [men] every where against the people, and the law, and this place: and further, hath brought Greeks also into the temple; and hath polluted this holy place.";
hnv[28] = "crying out, &quot;Men of Yisra\'el, help! This is the man who teaches all men everywhere against the people, and the law, and this place. Moreover, he also brought Yevanim into the temple, and has defiled this holy place!&quot;";
vul[28] = "viri israhelitae adiuvate hic est homo qui adversus populum et legem et locum hunc omnes ubique docens insuper et gentiles induxit in templum et violavit sanctum locum istum";
rsv[29] = "For they had previously seen Troph\'imus the Ephesian with him in the city, and they supposed that Paul had brought him into the temple.";
asv[29] = "For they had before seen with him in the city Trophimus the Ephesian, whom they supposed that Paul had brought into the temple.";
yng[29] = "for they had seen before Trophimus, the Ephesian, in the city with him, whom they were supposing that Paul brought into the temple.";
dby[29] = "For they had before seen Trophimus the Ephesian with him in the city, whom they supposed that Paul had brought into the temple.";
web[29] = "(For they had seen before with him in the city, Trophimus, an Ephesian, whom they supposed that Paul had brought into the temple.)";
hnv[29] = "For they had seen Trophimus, the Ephesian, with him in the city, and they supposed that Sha\'ul had brought him into the temple.";
vul[29] = "viderant enim Trophimum Ephesium in civitate cum ipso quem aestimaverunt quoniam in templum induxisset Paulus";
rsv[30] = "Then all the city was aroused, and the people ran together; they seized Paul and dragged him out of the temple, and at once the gates were shut.";
asv[30] = "And all the city was moved, and the people ran together; and they laid hold on Paul, and dragged him out of the temple: and straightway the doors were shut.";
yng[30] = "All the city also was moved and there was a running together of the people, and having laid hold on Paul, they were drawing him out of the temple, and immediately were the doors shut,";
dby[30] = "And the whole city was moved, and there was a concourse of the people; and having laid hold on Paul they drew him out of the temple, and immediately the doors were shut.";
web[30] = "And all the city was moved, and the people ran together: and they took Paul and drew him out of the temple. And forthwith the doors were shut.";
hnv[30] = "All the city was moved, and the people ran together. They seized Sha\'ul and dragged him out of the temple. Immediately the doors were shut.";
vul[30] = "commotaque est civitas tota et facta est concursio populi et adprehendentes Paulum trahebant eum extra templum et statim clausae sunt ianuae";
rsv[31] = "And as they were trying to kill him, word came to the tribune of the cohort that all Jerusalem was in confusion.";
asv[31] = "And as they were seeking to kill him, tidings came up to the chief captain of the band, that all Jerusalem was in confusion.";
yng[31] = "and they seeking to kill him, a rumour came to the chief captain of the band that all Jerusalem hath been thrown into confusion,";
dby[31] = "And as they were seeking to kill him, a representation came to the chiliarch of the band that the whole of Jerusalem was in a tumult;";
web[31] = "And as they went about to kill him, tidings came to the chief captain of the band, that all Jerusalem was in an uproar.";
hnv[31] = "As they were trying to kill him, news came up to the commanding officer of the regiment that all Yerushalayim was in an uproar.";
vul[31] = "quaerentibus autem eum occidere nuntiatum est tribuno cohortis quia tota confunditur Hierusalem";
rsv[32] = "He at once took soldiers and centurions, and ran down to them; and when they saw the tribune and the soldiers, they stopped beating Paul.";
asv[32] = "And forthwith he took soldiers and centurions, and ran down upon them: and they, when they saw the chief captain and the soldiers, left off beating Paul.";
yng[32] = "who, at once, having taken soldiers and centurions, ran down upon them, and they having seen the chief captain and the soldiers, did leave off beating Paul.";
dby[32] = "who, taking with him immediately soldiers and centurions, ran down upon them. But they, seeing the chiliarch and the soldiers, ceased beating Paul.";
web[32] = "Who immediately took soldiers and centurions, and ran down to them. And when they saw the chief captain and the soldiers, they left beating Paul.";
hnv[32] = "Immediately he took soldiers and centurions, and ran down to them. They, when they saw the chief captain and the soldiers, stopped beating Sha\'ul.";
vul[32] = "qui statim adsumptis militibus et centurionibus decucurrit ad illos qui cum vidissent tribunum et milites cessaverunt percutere Paulum";
rsv[33] = "Then the tribune came up and arrested him, and ordered him to be bound with two chains. He inquired who he was and what he had done.";
asv[33] = "Then the chief captain came near, and laid hold on him, and commanded him to be bound with two chains; and inquired who he was, and what he had done.";
yng[33] = "Then the chief captain, having come nigh, took him, and commanded [him] to be bound with two chains, and was inquiring who he may be, and what it is he hath been doing,";
dby[33] = "Then the chiliarch came up and laid hold upon him, and commanded [him] to be bound with two chains, and inquired who he might be, and what he had done.";
web[33] = "Then the chief captain came near and took him, and commanded [him] to be bound with two chains: and inquired who he was, and what he had done.";
hnv[33] = "Then the commanding officer came near, arrested him, commanded him to be bound with two chains, and inquired who he was and what he had done.";
vul[33] = "tunc accedens tribunus adprehendit eum et iussit alligari catenis duabus et interrogabat quis esset et quid fecisset";
rsv[34] = "Some in the crowd shouted one thing, some another; and as he could not learn the facts because of the uproar, he ordered him to be brought into the barracks.";
asv[34] = "And some shouted one thing, some another, among the crowd: and when he could not know the certainty for the uproar, he commanded him to be brought into the castle.";
yng[34] = "and some were crying out one thing, and some another, among the multitude, and not being able to know the certainty because of the tumult, he commanded him to be carried to the castle,";
dby[34] = "And different persons cried some different thing in the crowd. But he, not being able to know the certainty on account of the uproar, commanded him to be brought into the fortress.";
web[34] = "And some cried one thing, some another, among the multitude: and when he could not know the certainty for the tumult, he commanded him to be carried into the castle.";
hnv[34] = "Some shouted one thing, and some another, among the crowd. When he couldn\'t find out the truth because of the noise, he commanded him to be brought into the barracks.";
vul[34] = "alii autem aliud clamabant in turba et cum non posset certum cognoscere prae tumultu iussit duci eum in castra";
rsv[35] = "And when he came to the steps, he was actually carried by the soldiers because of the violence of the crowd;";
asv[35] = "And when he came upon the stairs, so it was that he was borne of the soldiers for the violence of the crowd;";
yng[35] = "and when he came upon the steps, it happened he was borne by the soldiers, because of the violence of the multitude,";
dby[35] = "But when he got upon the stairs it was so that he was borne by the soldiers on account of the violence of the crowd.";
web[35] = "And when he came upon the stairs, so it was that he was borne by the soldiers, for the violence of the people.";
hnv[35] = "When he came to the stairs, it happened that he was carried by the soldiers because of the violence of the crowd;";
vul[35] = "et cum venisset ad gradus contigit ut portaretur a militibus propter vim populi";
rsv[36] = "for the mob of the people followed, crying, &quot;Away with him!&quot;";
asv[36] = "for the multitude of the people followed after, crying out, Away with him.";
yng[36] = "for the crowd of the people was following after, crying, `Away with him.\'";
dby[36] = "For the multitude of the people followed, crying, Away with him.";
web[36] = "For the multitude of the people followed, crying, Away with him.";
hnv[36] = "for the multitude of the people followed after, crying out, &quot;Away with him!&quot;";
vul[36] = "sequebatur enim multitudo populi clamans tolle eum";
rsv[37] = "As Paul was about to be brought into the barracks, he said to the tribune, &quot;May I say something to you?&quot; And he said, &quot;Do you know Greek?";
asv[37] = "And as Paul was about to be brought into the castle, he saith unto the chief captain, May I say something unto thee? And he said, Dost thou know Greek?";
yng[37] = "And Paul being about to be led into the castle, saith to the chief captain, `Is it permitted to me to say anything unto thee?\' and he said, `Greek dost thou know?";
dby[37] = "But as he was about to be led into the fortress, Paul says to the chiliarch, Is it allowed me to say something to thee? And he said, Dost thou know Greek?";
web[37] = "And as Paul was to be led into the castle, he said to the chief captain, May I speak to thee? Who said, Canst thou speak Greek?";
hnv[37] = "As Sha\'ul was about to be brought into the barracks, he asked the commanding officer, &quot;May I speak to you?&quot; He said, &quot;Do you know Yevanit?";
vul[37] = "et cum coepisset induci in castra Paulus dicit tribuno si licet mihi loqui aliquid ad te qui dixit graece nosti";
rsv[38] = "Are you not the Egyptian, then, who recently stirred up a revolt and led the four thousand men of the Assassins out into the wilderness?&quot;";
asv[38] = "Art thou not then the Egyptian, who before these days stirred up to sedition and led out into the wilderness the four thousand men of the Assassins?";
yng[38] = "art not thou, then, the Egyptian who before these days made an uprising, and did lead into the desert the four thousand men of the assassins?\'";
dby[38] = "Thou art not then that Egyptian who before these days raised a sedition and led out into the wilderness the four thousand men of the assassins?";
web[38] = "Art not thou that Egyptian, who before these days madest an uproar, and leddest out into the wilderness four thousand men that were murderers?";
hnv[38] = "Aren\'t you then the Mitzrian, who before these days stirred up to sedition and led out into the wilderness the four thousand men of the Assassins?&quot;";
vul[38] = "nonne tu es Aegyptius qui ante hos dies tumultum concitasti et eduxisti in desertum quattuor milia virorum sicariorum";
rsv[39] = "Paul replied, &quot;I am a Jew, from Tarsus in Cili\'cia, a citizen of no mean city; I beg you, let me speak to the people.&quot;";
asv[39] = "But Paul said, I am a Jew, of Tarsus in Cilicia, a citizen of no mean city: and I beseech thee, give me leave to speak unto the people.";
yng[39] = "And Paul said, `I, indeed, am a man, a Jew, of Tarsus of Cilicia, of no mean city a citizen; and I beseech thee, suffer me to speak unto the people.\'";
dby[39] = "But Paul said, *I* am a Jew of Tarsus, citizen of no insignificant city of Cilicia, and I beseech of thee, allow me to speak to the people.";
web[39] = "But Paul said, I am a man [who am] a Jew of Tarsus, [a city] of Cilicia, a citizen of no mean city: and I beseech thee suffer me to speak to the people.";
hnv[39] = "But Sha\'ul said, &quot;I am a Yehudi, from Tarsus in Cilicia, a citizen of no insignificant city. I beg you, allow me to speak to the people.&quot;";
vul[39] = "et dixit ad eum Paulus ego homo sum quidem iudaeus a Tarso Ciliciae non ignotae civitatis municeps rogo autem te permitte mihi loqui ad populum";
rsv[40] = "And when he had given him leave, Paul, standing on the steps, motioned with his hand to the people; and when there was a great hush, he spoke to them in the Hebrew language, saying:";
asv[40] = "And when he had given him leave, Paul, standing on the stairs, beckoned with the hand unto the people; and when there was made a great silence, he spake unto them in the Hebrew language, saying,";
yng[40] = "And he having given him leave, Paul having stood upon the stairs, did beckon with the hand to the people, and there having been a great silence, he spake unto them in the Hebrew dialect, saying:";
dby[40] = "And when he had allowed him, Paul, standing on the stairs, beckoned with his hand to the people; and a great silence having been made, he addressed them in the Hebrew tongue, saying,";
web[40] = "And when he had given him license, Paul stood on the stairs, and beckoned with the hand to the people. And when there was made entire silence, he spoke to [them] in the Hebrew language, saying,";
hnv[40] = "When he had given him permission, Sha\'ul, standing on the stairs, beckoned with his hand to the people. When there was a great silence, he spoke to them in the Hebrew language, saying,";
vul[40] = "et cum ille permisisset Paulus stans in gradibus annuit manu ad plebem et magno silentio facto adlocutus est hebraea lingua dicens";
