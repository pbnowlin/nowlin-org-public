csb[1] = "After this, he left Athens and went to Corinth,";
csb[2] = "where he found a Jew named Aquila, a native of Pontus, who had recently come from Italy with his wife Priscilla because Claudius had ordered all the Jews to leave Rome. Paul came to them,";
csb[3] = "and since they were of the same occupation, tentmakers by trade, he stayed with them and worked.";
csb[4] = "He reasoned in the synagogue every Sabbath and tried to persuade both Jews and Greeks.";
csb[5] = "When Silas and Timothy arrived from Macedonia, Paul devoted himself to preaching the word and testified to the Jews that Jesus is the Messiah.";
csb[6] = "When they resisted and blasphemed, he shook out his clothes and told them, &quot;Your blood is on your own heads! I am innocent. From now on I will go to the Gentiles.&quot;";
csb[7] = "So he left there and went to the house of a man named Titius Justus, a worshiper of God, whose house was next door to the synagogue.";
csb[8] = "Crispus, the leader of the synagogue, believed in the Lord, along with his whole household. Many of the Corinthians, when they heard, believed and were baptized.";
csb[9] = "The Lord said to Paul in a night vision, &quot;Don\'t be afraid, but keep on speaking and don\'t be silent.";
csb[10] = "&quot;For I am with you, and no one will lay a hand on you to hurt you, because I have many people in this city.&quot;";
csb[11] = "He stayed there a year and a half, teaching the word of God among them.";
csb[12] = "While Gallio was proconsul of Achaia, the Jews made a united attack against Paul and brought him to the tribunal.";
csb[13] = "&quot;This man,&quot; they said, &quot; is persuading people to worship God in ways contrary to the law.&quot;";
csb[14] = "As Paul was about to open his mouth, Gallio said to the Jews, &quot;If it were a matter of wrongdoing or of a serious crime, it would be reasonable for me to put up with you Jews.";
csb[15] = "&quot;But if these are questions about words, names, and your own law, see to it yourselves. I refuse to be a judge of such things.&quot;";
csb[16] = "So he drove them from the tribunal.";
csb[17] = "And they all seized Sosthenes, the leader of the synagogue, and beat him in front of the tribunal, but none of these things mattered to Gallio.";
csb[18] = "After staying for some time, Paul said farewell to the brothers and sisters and sailed away to Syria, accompanied by Priscilla and Aquila. He shaved his head at Cenchreae because of a vow he had taken.";
csb[19] = "When they reached Ephesus he left them there, but he himself entered the synagogue and debated with the Jews.";
csb[20] = "When they asked him to stay for a longer time, he declined,";
csb[21] = "but he said farewell and added, &quot;I\'ll come back to you again, if God wills.&quot; Then he set sail from Ephesus.";
csb[22] = "On landing at Caesarea, he went up to Jerusalem and greeted the church, then went down to Antioch.";
csb[23] = "After spending some time there, he set out, traveling through one place after another in the region of Galatia and Phrygia, strengthening all the disciples.";
csb[24] = "Now a Jew named Apollos, a native Alexandrian, an eloquent man who was competent in the use of the Scriptures, arrived in Ephesus.";
csb[25] = "He had been instructed in the way of the Lord; and being fervent in spirit, he was speaking and teaching accurately about Jesus, although he knew only John\'s baptism.";
csb[26] = "He began to speak boldly in the synagogue. After Priscilla and Aquila heard him, they took him aside and explained the way of God to him more accurately.";
csb[27] = "When he wanted to cross over to Achaia, the brothers and sisters wrote to the disciples to welcome him. After he arrived, he was a great help to those who by grace had believed.";
csb[28] = "For he vigorously refuted the Jews in public, demonstrating through the Scriptures that Jesus is the Messiah.";
