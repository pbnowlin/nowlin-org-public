csb[1] = "I wrote the first narrative, Theophilus, about all that Jesus began to do and teach";
csb[2] = "until the day he was taken up, after he had given instructions through the Holy Spirit to the apostles he had chosen.";
csb[3] = "After he had suffered, he also presented himself alive to them by many convincing proofs, appearing to them over a period of forty days and speaking about the kingdom of God.";
csb[4] = "While he was with them, he commanded them not to leave Jerusalem, but to wait for the Father\'s promise. &quot;Which,&quot; he said, &quot;you have heard me speak about;";
csb[5] = "&quot;for John baptized with water, but you will be baptized with the Holy Spirit in a few days.&quot;";
csb[6] = "So when they had come together, they asked him, &quot;Lord, are you restoring the kingdom to Israel at this time? &quot;";
csb[7] = "He said to them, &quot;It is not for you to know times or periods that the Father has set by his own authority.";
csb[8] = "&quot;But you will receive power when the Holy Spirit has come on you, and you will be my witnesses in Jerusalem, in all Judea and Samaria, and to the end of the earth.&quot;";
csb[9] = "After he had said this, he was taken up as they were watching, and a cloud took him out of their sight.";
csb[10] = "While he was going, they were gazing into heaven, and suddenly two men in white clothes stood by them.";
csb[11] = "They said, &quot;Men of Galilee, why do you stand looking up into heaven? This same Jesus, who has been taken from you into heaven, will come in the same way that you have seen him going into heaven.&quot;";
csb[12] = "Then they returned to Jerusalem from the Mount of Olives, which is near Jerusalem -- a Sabbath day\'s journey away.";
csb[13] = "When they arrived, they went to the room upstairs where they were staying: Peter, John, James, Andrew, Philip, Thomas, Bartholomew, Matthew, James the son of Alphaeus, Simon the Zealot, and Judas the son of James.";
csb[14] = "They all were continually united in prayer, along with the women, including Mary the mother of Jesus, and his brothers.";
csb[15] = "In those days Peter stood up among the brothers and sisters -- the number of people who were together was about a hundred and twenty -- and said:";
csb[16] = "&quot;Brothers and sisters, it was necessary that the Scripture be fulfilled that the Holy Spirit through the mouth of David foretold about Judas, who became a guide to those who arrested Jesus.";
csb[17] = "&quot;For he was one of our number and shared in this ministry.&quot;";
csb[18] = "Now this man acquired a field with his unrighteous wages. He fell headfirst, his body burst open and his intestines spilled out.";
csb[19] = "This became known to all the residents of Jerusalem, so that in their own language that field is called Hakeldama (that is, Field of Blood).";
csb[20] = "&quot;For it is written in the Book of Psalms: Let his dwelling become desolate; let no one live in it; and Let someone else take his position.";
csb[21] = "&quot;Therefore, from among the men who have accompanied us during the whole time the Lord Jesus went in and out among us --";
csb[22] = "&quot;beginning from the baptism of John until the day he was taken up from us -- from among these, it is necessary that one become a witness with us of his resurrection.&quot;";
csb[23] = "So they proposed two: Joseph, called Barsabbas, who was also known as Justus, and Matthias.";
csb[24] = "Then they prayed, &quot;You, Lord, know everyone\'s hearts; show which of these two you have chosen";
csb[25] = "&quot;to take the place in this apostolic ministry that Judas left to go where he belongs.&quot;";
csb[26] = "Then they cast lots for them, and the lot fell to Matthias and he was added to the eleven apostles.";
