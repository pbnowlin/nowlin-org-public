csb[1] = "Five days later Ananias the high priest came down with some elders and a lawyer named Tertullus. These men presented their case against Paul to the governor.";
csb[2] = "When Paul was called in, Tertullus began to accuse him and said: &quot;We enjoy great peace because of you, and reforms are taking place for the benefit of this nation because of your foresight.";
csb[3] = "&quot;We acknowledge this in every way and everywhere, most excellent Felix, with utmost gratitude.";
csb[4] = "&quot;But, so that I will not burden you any further, I request that you would be kind enough to give us a brief hearing.";
csb[5] = "&quot;For we have found this man to be a plague, an agitator among all the Jews throughout the Roman world, and a ringleader of the sect of the Nazarenes.";
csb[6] = "&quot;He even tried to desecrate the temple, and so we apprehended him.";
csb[7] = " ";
csb[8] = "&quot;By examining him yourself you will be able to discern the truth about these charges we are bringing against him.&quot;";
csb[9] = "The Jews also joined in the attack, alleging that these things were true.";
csb[10] = "When the governor motioned for him to speak, Paul replied: &quot;Because I know you have been a judge of this nation for many years, I am glad to offer my defense in what concerns me.";
csb[11] = "&quot;You can verify for yourself that it is no more than twelve days since I went up to worship in Jerusalem.";
csb[12] = "&quot;They didn\'t find me arguing with anyone or causing a disturbance among the crowd, either in the temple or in the synagogues or anywhere in the city.";
csb[13] = "&quot;Neither can they prove the charges they are now making against me.";
csb[14] = "&quot;But I admit this to you: I worship the God of my ancestors according to the Way, which they call a sect, believing everything that is in accordance with the law and written in the prophets.";
csb[15] = "&quot;I have a hope in God, which these men themselves also accept, that there will be a resurrection, both of the righteous and the unrighteous.";
csb[16] = "&quot;I always strive to have a clear conscience toward God and men.";
csb[17] = "&quot;After many years, I came to bring charitable gifts and offerings to my people.";
csb[18] = "&quot;While I was doing this, some Jews from Asia found me ritually purified in the temple, without a crowd and without any uproar.";
csb[19] = "&quot;It is they who ought to be here before you to bring charges, if they have anything against me.";
csb[20] = "&quot;Or let these men here state what wrongdoing they found in me when I stood before the Sanhedrin,";
csb[21] = "&quot;other than this one statement I shouted while standing among them, \'Today I am on trial before you concerning the resurrection of the dead.\' &quot;";
csb[22] = "Since Felix was well informed about the Way, he adjourned the hearing, saying, &quot;When Lysias the commander comes down, I will decide your case.&quot;";
csb[23] = "He ordered that the centurion keep Paul under guard, though he could have some freedom, and that he should not prevent any of his friends from meeting his needs.";
csb[24] = "Several days later, when Felix came with his wife Drusilla, who was Jewish, he sent for Paul and listened to him on the subject of faith in Christ Jesus.";
csb[25] = "Now as he spoke about righteousness, self-control, and the judgment to come, Felix became afraid and replied, &quot;Leave for now, but when I have an opportunity I\'ll call for you.&quot;";
csb[26] = "At the same time he was also hoping that Paul would offer him money. So he sent for him quite often and conversed with him.";
csb[27] = "After two years had passed, Porcius Festus succeeded Felix, and because Felix wanted to do the Jews a favor, he left Paul in prison.";

yng[1] = "And after five days came down the chief priest Ananias, with the elders, and a certain orator -- Tertullus, and they made manifest to the governor [the things] against Paul;";

web[1] = "And after five days, Ananias the high priest descended with the elders, and [with] a certain orator [named] Tertullus, who informed the governor against Paul.";

asv[22] = "But Felix, having more exact knowledge concerning the Way, deferred them, saying, When Lysias the chief captain shall come down, I will determine your matter.";
yng[22] = "And having heard these things, Felix delayed them -- having known more exactly of the things concerning the way -- saying, `When Lysias the chief captain may come down, I will know fully the things concerning you;\'";
dby[22] = "And Felix, knowing accurately the things concerning the way, adjourned them, saying, When Lysias the chiliarch is come down I will determine your affair;";

hnv[23] = "He ordered the centurion that Sha\'ul should be kept in custody, and should have some privileges, and not to forbid any of his friends to serve him or to visit him.";
vul[23] = "iussitque centurioni custodiri eum et habere requiem nec quemquam prohibere de suis ministrare ei";
kjv[24] = "And after certain days, when Felix came with his wife Drusilla, which was a Jewess, he sent for Paul, and heard him concerning the faith in Christ.";
rsv[24] = "After some days Felix came with his wife Drusil\'la, who was a Jewess; and he sent for Paul and heard him speak upon faith in Christ Jesus.";
asv[24] = "But after certain days, Felix came with Drusilla, his wife, who was a Jewess, and sent for Paul, and heard him concerning the faith in Christ Jesus.";
yng[24] = "And after certain days, Felix having come with Drusilla his wife, being a Jewess, he sent for Paul, and heard him concerning the faith toward Christ,";
dby[24] = "And after certain days, Felix having arrived with Drusilla his wife, who was a Jewess, he sent for Paul and heard him concerning the faith in Christ.";
web[24] = "And after certain days, when Felix came with his wife Drusilla, who was a Jewess, he sent for Paul, and heard him concerning the faith in Christ.";
hnv[24] = " But after some days, Felix came with Drusilla, his wife, who was a Yehudi, and sent for Sha\'ul, and heard him concerning the faith in Messiah Yeshua.";
vul[24] = "post aliquot autem dies veniens Felix cum Drusilla uxore sua quae erat Iudaea vocavit Paulum et audivit ab eo fidem quae est in Iesum Christum";
kjv[25] = "And as he reasoned of righteousness, temperance, and judgment to come, Felix trembled, and answered, Go thy way for this time; when I have a convenient season, I will call for thee.";
rsv[25] = "And as he argued about justice and self-control and future judgment, Felix was alarmed and said, &quot;Go away for the present; when I have an opportunity I will summon you.&quot;";
asv[25] = "And as he reasoned of righteousness, and self-control, and the judgment to come, Felix was terrified, and answered, Go thy way for this time; and when I have a convenient season, I will call thee unto me.";
yng[25] = "and he reasoning concerning righteousness, and temperance, and the judgment that is about to be, Felix, having become afraid, answered, `For the present be going, and having got time, I will call for thee;\'";
dby[25] = "And as he reasoned concerning righteousness, and temperance, and the judgment about to come, Felix, being filled with fear, answered, Go for the present, and when I get an opportunity I will send for thee;";
web[25] = "And as he reasoned of righteousness, temperance, and judgment to come, Felix trembled, and answered, depart for this time; when I have a convenient season, I will call for thee.";
hnv[25] = "As he reasoned about righteousness, self-control, and the judgment to come, Felix was terrified, and answered, &quot;Go your way for this time, and when it is convenient for me, I will summon you.&quot;";
vul[25] = "disputante autem illo de iustitia et castitate et de iudicio futuro timefactus Felix respondit quod nunc adtinet vade tempore autem oportuno accersiam te";
kjv[26] = "He hoped also that money should have been given him of Paul, that he might loose him: wherefore he sent for him the oftener, and communed with him.";
rsv[26] = "At the same time he hoped that money would be given him by Paul. So he sent for him often and conversed with him.";
asv[26] = "He hoped withal that money would be given him of Paul: wherefore also he sent for him the oftener, and communed with him.";
yng[26] = "and at the same time also hoping that money shall be given to him by Paul, that he may release him, therefore, also sending for him the oftener, he was conversing with him;";
dby[26] = "hoping at the same time that money would be given him by Paul: wherefore also he sent for him the oftener and communed with him.";
web[26] = "He hoped also that money would have been given him by Paul, that he might loose him: wherefore he sent for him the oftener, and communed with him.";
hnv[26] = "Meanwhile, he also hoped that money would be given to him by Sha\'ul, that he might release him. Therefore also he sent for him more often, and talked with him.";
vul[26] = "simul et sperans quia pecunia daretur a Paulo propter quod et frequenter accersiens eum loquebatur cum eo";
kjv[27] = "But after two years Porcius Festus came into Felix\' room: and Felix, willing to shew the Jews a pleasure, left Paul bound.";
rsv[27] = "But when two years had elapsed, Felix was succeeded by Porcius Festus; and desiring to do the Jews a favor, Felix left Paul in prison.";
asv[27] = "But when two years were fulfilled, Felix was succeeded by Porcius Festus; and desiring to gain favor with the Jews, Felix left Paul in bonds.";
yng[27] = "and two years having been fulfilled, Felix received a successor, Porcius Festus; Felix also willing to lay a favour on the Jews, left Paul bound.";
dby[27] = "But when two years were completed, Felix was relieved by Porcius Festus as his successor; and Felix, desirous to oblige the Jews, to acquire their favour, left Paul bound.";
web[27] = "But after two years Porcius Festus came as successor to Felix: and Felix willing to show the Jews a pleasure, left Paul bound.";
hnv[27] = "But when two years were fulfilled, Felix was succeeded by Porcius Festus, and desiring to gain favor with the Yehudim, Felix left Sha\'ul in bonds.";
vul[27] = "biennio autem expleto accepit successorem Felix Porcium Festum volens autem gratiam praestare Iudaeis Felix reliquit Paulum vinctum";
