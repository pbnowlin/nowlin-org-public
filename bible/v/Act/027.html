csb[1] = "When it was decided that we were to sail to Italy, they handed over Paul and some other prisoners to a centurion named Julius, of the Imperial Regiment.";
csb[2] = "When we had boarded a ship of Adramyttium, we put to sea, intending to sail to ports along the coast of Asia. Aristarchus, a Macedonian of Thessalonica, was with us.";
csb[3] = "The next day we put in at Sidon, and Julius treated Paul kindly and allowed him to go to his friends to receive their care.";
csb[4] = "When we had put out to sea from there, we sailed along the northern coast of Cyprus because the winds were against us.";
csb[5] = "After sailing through the open sea off Cilicia and Pamphylia, we reached Myra in Lycia.";
csb[6] = "There the centurion found an Alexandrian ship sailing for Italy and put us on board.";
csb[7] = "Sailing slowly for many days, with difficulty we arrived off Cnidus. Since the wind did not allow us to approach it, we sailed along the south side of Crete off Salmone.";
csb[8] = "With still more difficulty we sailed along the coast and came to a place called Fair Havens near the city of Lasea.";
csb[9] = "By now much time had passed, and the voyage was already dangerous. Since the Day of Atonement was already over, Paul gave his advice";
csb[10] = "and told them, &quot;Men, I can see that this voyage is headed toward disaster and heavy loss, not only of the cargo and the ship but also of our lives.&quot;";
csb[11] = "But the centurion paid attention to the captain and the owner of the ship rather than to what Paul said.";
csb[12] = "Since the harbor was unsuitable to winter in, the majority decided to set sail from there, hoping somehow to reach Phoenix, a harbor on Crete facing the southwest and northwest, and to winter there.";
csb[13] = "When a gentle south wind sprang up, they thought they had achieved their purpose. They weighed anchor and sailed along the shore of Crete.";
csb[14] = "But before long, a fierce wind called the &quot;northeaster&quot; rushed down from the island.";
csb[15] = "Since the ship was caught and unable to head into the wind, we gave way to it and were driven along.";
csb[16] = "After running under the shelter of a little island called Cauda, we were barely able to get control of the skiff.";
csb[17] = "After hoisting it up, they used ropes and tackle and girded the ship. Fearing they would run aground on the Syrtis, they lowered the drift-anchor, and in this way they were driven along.";
csb[18] = "Because we were being severely battered by the storm, they began to jettison the cargo the next day.";
csb[19] = "On the third day, they threw the ship\'s tackle overboard with their own hands.";
csb[20] = "For many days neither sun nor stars appeared, and the severe storm kept raging. Finally all hope was fading that we would be saved.";
csb[21] = "Since they had been without food for a long time, Paul then stood up among them and said, &quot;You men should have followed my advice not to sail from Crete and sustain this damage and loss.";
csb[22] = "&quot;Now I urge you to take courage, because there will be no loss of any of your lives, but only of the ship.";
csb[23] = "&quot;For last night an angel of the God I belong to and serve stood by me";
csb[24] = "&quot;and said, \'Don\'t be afraid, Paul. It is necessary for you to appear before Caesar. And indeed, God has graciously given you all those who are sailing with you.\'";
csb[25] = "&quot;So take courage, men, because I believe God that it will be just the way it was told to me.";
csb[26] = "&quot;But we have to run aground on some island.&quot;";
csb[27] = "When the fourteenth night came, we were drifting in the Adriatic Sea, and about midnight the sailors thought they were approaching land.";
csb[28] = "They took soundings and found it to be a hundred and twenty feet deep; when they had sailed a little farther and sounded again, they found it to be ninety feet deep.";
csb[29] = "Then, fearing we might run aground on the rocks, they dropped four anchors from the stern and prayed for daylight to come.";
csb[30] = "Some sailors tried to escape from the ship; they had let down the skiff into the sea, pretending that they were going to put out anchors from the bow.";
csb[31] = "Paul said to the centurion and the soldiers, &quot;Unless these men stay in the ship, you cannot be saved.&quot;";
csb[32] = "Then the soldiers cut the ropes holding the skiff and let it drop away.";
csb[33] = "When it was about daylight, Paul urged them all to take food, saying, &quot;Today is the fourteenth day that you have been waiting and going without food, having eaten nothing.";
csb[34] = "&quot;So I urge you to take some food. For this is for your survival, since none of you will lose a hair from your head.&quot;";
csb[35] = "After he said these things and had taken some bread, he gave thanks to God in the presence of all of them, and after he broke it, he began to eat.";
csb[36] = "They all were encouraged and took food themselves.";
csb[37] = "In all there were 276 of us on the ship.";
csb[38] = "When they had eaten enough, they began to lighten the ship by throwing the grain overboard into the sea.";
csb[39] = "When daylight came, they did not recognize the land but sighted a bay with a beach. They planned to run the ship ashore if they could.";
csb[40] = "After cutting loose the anchors, they left them in the sea, at the same time loosening the ropes that held the rudders. Then they hoisted the foresail to the wind and headed for the beach.";
csb[41] = "But they struck a sandbar and ran the ship aground. The bow jammed fast and remained immovable, while the stern began to break up by the pounding of the waves.";
csb[42] = "The soldiers\' plan was to kill the prisoners so that no one could swim away and escape.";
csb[43] = "But the centurion kept them from carrying out their plan because he wanted to save Paul, and so he ordered those who could swim to jump overboard first and get to land.";
csb[44] = "The rest were to follow, some on planks and some on debris from the ship. In this way, everyone safely reached the shore.";
kjv[1] = "And when it was determined that we should sail into Italy, they delivered Paul and certain other prisoners unto [one] named Julius, a centurion of Augustus\' band.";

dby[1] = "But when it had been determined that we should sail to Italy, they delivered up Paul and certain other prisoners to a centurion, by name Julius, of Augustus\' company.";

rsv[2] = "And embarking in a ship of Adramyt\'tium, which was about to sail to the ports along the coast of Asia, we put to sea, accompanied by Aristar\'chus, a Macedo\'nian from Thessaloni\'ca.";
asv[2] = "And embarking in a ship of Adramyttium, which was about to sail unto the places on the coast of Asia, we put to sea, Aristarchus, a Macedonian of Thessalonica, being with us.";

kjv[12] = "And because the haven was not commodious to winter in, the more part advised to depart thence also, if by any means they might attain to Phenice, [and there] to winter; [which is] an haven of Crete, and lieth toward the south west and north west.";
rsv[12] = "And because the harbor was not suitable to winter in, the majority advised to put to sea from there, on the chance that somehow they could reach Phoenix, a harbor of Crete, looking northeast and southeast, and winter there.";
asv[12] = "And because the haven was not commodious to winter in, the more part advised to put to sea from thence, if by any means they could reach Phoenix, and winter [there; which is] a haven of Crete, looking north-east and south-east.";

dby[12] = "And the harbour being ill adapted to winter in, the most counselled to set sail thence, if perhaps they might reach Phoenice to winter in, a port of Crete looking north-east and south-east.";

rsv[20] = "And when neither sun nor stars appeared for many a day, and no small tempest lay on us, all hope of our being saved was at last abandoned.";
asv[20] = "And when neither sun nor stars shone upon [us] for many days, and no small tempest lay on [us,] all hope that we should be saved was now taken away.";
yng[20] = "and neither sun nor stars appearing for more days, and not a little tempest lying upon us, thenceforth all hope was taken away of our being saved.";
dby[20] = "And neither sun nor stars appearing for many days, and no small storm lying on us, in the end all hope of our being saved was taken away.";
web[20] = "And when neither sun nor stars in many days appeared, and no small tempest lay on [us], all hope that we should be saved was then taken away.";
hnv[20] = "When neither sun nor stars shone on us for many days, and no small tempest pressed on us, all hope that we would be saved was now taken away.";
vul[20] = "neque sole autem neque sideribus apparentibus per plures dies et tempestate non exigua inminente iam ablata erat spes omnis salutis nostrae";
kjv[21] = "But after long abstinence Paul stood forth in the midst of them, and said, Sirs, ye should have hearkened unto me, and not have loosed from Crete, and to have gained this harm and loss.";
rsv[21] = "As they had been long without food, Paul then came forward among them and said, &quot;Men, you should have listened to me, and should not have set sail from Crete and incurred this injury and loss.";
asv[21] = "And when they had been long without food, then Paul stood forth in the midst of them, and said, Sirs, ye should have hearkened unto me, and not have set sail from Crete, and have gotten this injury and loss.";
yng[21] = "And there having been long fasting, then Paul having stood in the midst of them, said, `It behoved [you], indeed, O men -- having hearkened to me -- not to set sail from Crete, and to save this hurt and damage;";
dby[21] = "And when they had been a long while without taking food, Paul then standing up in the midst of them said, Ye ought, O men, to have hearkened to me, and not have made sail from Crete and have gained this disaster and loss.";
web[21] = "But after long abstinence, Paul stood forth in the midst of them, and said, Sirs, ye should have hearkened to me, and not have loosed from Crete, and to have gained this harm and loss.";
hnv[21] = "When they had been long without food, Sha\'ul stood up in the middle of them, and said, &quot;Sirs, you should have listened to me, and not have set sail from Crete, and have gotten this injury and loss.";
vul[21] = "et cum multa ieiunatio fuisset tunc stans Paulus in medio eorum dixit oportebat quidem o viri audito me non tollere a Creta lucrique facere iniuriam hanc et iacturam";
kjv[22] = "And now I exhort you to be of good cheer: for there shall be no loss of [any man\'s] life among you, but of the ship.";
rsv[22] = "I now bid you take heart; for there will be no loss of life among you, but only of the ship.";
asv[22] = "And now I exhort you to be of good cheer; for there shall be no loss of life among you, but [only] of the ship.";
yng[22] = "and now I exhort you to be of good cheer, for there shall be no loss of life among you -- but of the ship;";
dby[22] = "And now I exhort you to be of good courage, for there shall be no loss at all of life of [any] of you, only of the ship.";
web[22] = "And now I exhort you to be of good cheer: for there shall be no loss of life among you, but of the ship.";
hnv[22] = "Now I exhort you to cheer up, for there will be no loss of life among you, but only of the ship.";
vul[22] = "et nunc suadeo vobis bono animo esse amissio enim nullius animae erit ex vobis praeterquam navis";
kjv[23] = "For there stood by me this night the angel of God, whose I am, and whom I serve,";
rsv[23] = "For this very night there stood by me an angel of the God to whom I belong and whom I worship,";
asv[23] = "For there stood by me this night an angel of the God whose I am, whom also I serve,";
yng[23] = "for there stood by me this night a messenger of God -- whose I am, and whom I serve --";
dby[23] = "For an angel of the God, whose I am and whom I serve, stood by me this night,";
web[23] = "For there stood by me this night the angel of God, whose I am, and whom I serve,";
hnv[23] = "For there stood by me this night an angel, belonging to the God whose I am and whom I serve,";
vul[23] = "adstitit enim mihi hac nocte angelus Dei cuius sum ego et cui deservio";
kjv[24] = "Saying, Fear not, Paul; thou must be brought before Caesar: and, lo, God hath given thee all them that sail with thee.";
rsv[24] = "and he said, \'Do not be afraid, Paul; you must stand before Caesar; and lo, God has granted you all those who sail with you.\'";
asv[24] = "saying, Fear not, Paul; thou must stand before Caesar: and lo, God hath granted thee all them that sail with thee.";
yng[24] = "saying, Be not afraid Paul; before Caesar it behoveth thee to stand; and, lo, God hath granted to thee all those sailing with thee;";
dby[24] = "saying, Fear not, Paul; thou must stand before Caesar; and behold, God has granted to thee all those that sail with thee.";
web[24] = "Saying, Fear not, Paul; thou must be brought before Cesar: and lo, God hath given thee all them that sail with thee.";
hnv[24] = "saying, \'Don\'t be afraid, Sha\'ul. You must stand before Caesar. Behold, God has granted you all those who sail with you.\'";
vul[24] = "dicens ne timeas Paule Caesari te oportet adsistere et ecce donavit tibi Deus omnes qui navigant tecum";
kjv[25] = "Wherefore, sirs, be of good cheer: for I believe God, that it shall be even as it was told me.";
rsv[25] = "So take heart, men, for I have faith in God that it will be exactly as I have been told.";
asv[25] = "Wherefore, sirs, be of good cheer: for I believe God, that it shall be even so as it hath been spoken unto me.";
yng[25] = "wherefore be of good cheer, men! for I believe God, that so it shall be, even as it hath been spoken to me,";
dby[25] = "Wherefore be of good courage, men, for I believe God that thus it shall be, as it has been said to me.";
web[25] = "Wherefore, sirs, be of good cheer: for I believe God, that it will be even as it was told to me.";
hnv[25] = " Therefore, sirs, cheer up! For I believe God, that it will be just as it has been spoken to me.";
vul[25] = "propter quod bono animo estote viri credo enim Deo quia sic erit quemadmodum dictum est mihi";
kjv[26] = "Howbeit we must be cast upon a certain island.";
rsv[26] = "But we shall have to run on some island.&quot;";
asv[26] = "But we must be cast upon a certain island.";
yng[26] = "and on a certain island it behoveth us to be cast.\'";
dby[26] = "But we must be cast ashore on a certain island.";
web[26] = "But we must be cast upon a certain isle.";
hnv[26] = "But we must run aground on a certain island.&quot;";
vul[26] = "in insulam autem quandam oportet nos devenire";
kjv[27] = "But when the fourteenth night was come, as we were driven up and down in Adria, about midnight the shipmen deemed that they drew near to some country;";
rsv[27] = "When the fourteenth night had come, as we were drifting across the sea of A\'dria, about midnight the sailors suspected that they were nearing land.";
asv[27] = "But when the fourteenth night was come, as we were driven to and fro in the [sea of] Adria, about midnight the sailors surmised that they were drawing near to some country:";
yng[27] = "And when the fourteenth night came -- we being borne up and down in the Adria -- toward the middle of the night the sailors were supposing that some country drew nigh to them;";
dby[27] = "And when the fourteenth night was come, we being driven about in Adria, towards the middle of the night the sailors supposed that some land neared them,";
web[27] = "When the fourteenth night was come, as we were driven up and down in Adria, about midnight the shipmen suspected that they drew near to some country:";
hnv[27] = "But when the fourteenth night had come, as we were driven back and forth in the Adriatic Sea, about midnight the sailors surmised that they were drawing near to some land.";
vul[27] = "sed posteaquam quartadecima nox supervenit navigantibus nobis in Hadria circa mediam noctem suspicabantur nautae apparere sibi aliquam regionem";
kjv[28] = "And sounded, and found [it] twenty fathoms: and when they had gone a little further, they sounded again, and found [it] fifteen fathoms.";
rsv[28] = "So they sounded and found twenty fathoms; a little farther on they sounded again and found fifteen fathoms.";
asv[28] = "and they sounded, and found twenty fathoms; and after a little space, they sounded again, and found fifteen fathoms.";
yng[28] = "and having sounded they found twenty fathoms, and having gone a little farther, and again having sounded, they found fifteen fathoms,";
dby[28] = "and having sounded found twenty fathoms, and having gone a little farther and having again sounded they found fifteen fathoms;";
web[28] = "And sounded, and found [it] twenty fathoms: and when they had gone a little further, they sounded again, and found [it] fifteen fathoms.";
hnv[28] = "They took soundings, and found twenty fathoms. After a little while, they took soundings again, and found fifteen fathoms..";
vul[28] = "qui submittentes invenerunt passus viginti et pusillum inde separati invenerunt passus quindecim";
kjv[29] = "Then fearing lest we should have fallen upon rocks, they cast four anchors out of the stern, and wished for the day.";
rsv[29] = "And fearing that we might run on the rocks, they let out four anchors from the stern, and prayed for day to come.";
asv[29] = "And fearing lest haply we should be cast ashore on rocky ground, they let go four anchors from the stern, and wished for the day.";
yng[29] = "and fearing lest on rough places we may fall, out of the stern having cast four anchors, they were wishing day to come.";
dby[29] = "and fearing lest we should be cast on rocky places, casting four anchors out of the stern, they wished that day were come.";
web[29] = "Then fearing lest we should fall upon rocks, they cast four anchors out of the stern, and wished for the day.";
hnv[29] = "Fearing that we would run aground on rocky ground, they let go four anchors from the stern, and wished for daylight.";
vul[29] = "timentes autem ne in aspera loca incideremus de puppi mittentes anchoras quattuor optabant diem fieri";
kjv[30] = "And as the shipmen were about to flee out of the ship, when they had let down the boat into the sea, under colour as though they would have cast anchors out of the foreship,";
rsv[30] = "And as the sailors were seeking to escape from the ship, and had lowered the boat into the sea, under pretense of laying out anchors from the bow,";
asv[30] = "And as the sailors were seeking to flee out of the ship, and had lowered the boat into the sea, under color as though they would lay out anchors from the foreship,";
yng[30] = "And the sailors seeking to flee out of the ship, and having let down the boat to the sea, in pretence as [if] out of the foreship they are about to cast anchors,";
dby[30] = "But the sailors wishing to flee out of the ship, and having let down the boat into the sea under pretext of being about to carry out anchors from the prow,";
web[30] = "And as the shipmen were about to flee out of the ship, when they had let down the boat into the sea, under color as though they would cast anchors out of the foreship,";
hnv[30] = "As the sailors were trying to flee out of the ship, and had lowered the boat into the sea, pretending that they would lay out anchors from the bow,";
vul[30] = "nautis vero quaerentibus fugere de navi cum misissent scapham in mare sub obtentu quasi a prora inciperent anchoras extendere";
kjv[31] = "Paul said to the centurion and to the soldiers, Except these abide in the ship, ye cannot be saved.";
rsv[31] = "Paul said to the centurion and the soldiers, &quot;Unless these men stay in the ship, you cannot be saved.&quot;";
asv[31] = "Paul said to the centurion and to the soldiers, Except these abide in the ship, ye cannot be saved.";
yng[31] = "Paul said to the centurion and to the soldiers, `If these do not remain in the ship -- ye are not able to be saved;\'";
dby[31] = "Paul said to the centurion and the soldiers, Unless these abide in the ship *ye* cannot be saved.";
web[31] = "Paul said to the centurion, and to the soldiers, Except these abide in the ship, ye cannot be saved.";
hnv[31] = "Sha\'ul said to the centurion and to the soldiers, &quot;Unless these stay in the ship, you can\'t be saved.&quot;";
vul[31] = "dixit Paulus centurioni et militibus nisi hii in navi manserint vos salvi fieri non potestis";
kjv[32] = "Then the soldiers cut off the ropes of the boat, and let her fall off.";
rsv[32] = "Then the soldiers cut away the ropes of the boat, and let it go.";
asv[32] = "Then the soldiers cut away the ropes of the boat, and let her fall off.";
yng[32] = "then the soldiers did cut off the ropes of the boat, and suffered it to fall off.";
dby[32] = "Then the soldiers cut away the ropes of the boat and let her fall.";
web[32] = "Then the soldiers cut off the ropes of the boat, and let her fall off.";
hnv[32] = "Then the soldiers cut away the ropes of the boat, and let it fall off.";
vul[32] = "tunc absciderunt milites funes scaphae et passi sunt eam excidere";
kjv[33] = "And while the day was coming on, Paul besought [them] all to take meat, saying, This day is the fourteenth day that ye have tarried and continued fasting, having taken nothing.";
rsv[33] = "As day was about to dawn, Paul urged them all to take some food, saying, &quot;Today is the fourteenth day that you have continued in suspense and without food, having taken nothing.";
asv[33] = "And while the day was coming on, Paul besought them all to take some food, saying, This day is the fourteenth day that ye wait and continue fasting, having taken nothing.";
yng[33] = "And till the day was about to be, Paul was calling upon all to partake of nourishment, saying, `Fourteen days to-day, waiting, ye continue fasting, having taken nothing,";
dby[33] = "And while it was drawing on to daylight, Paul exhorted them all to partake of food, saying, Ye have passed the fourteenth day watching in expectation without taking food.";
web[33] = "And while the day was coming on, Paul besought [them] all to take food, saying, This day is the fourteenth day that ye have tarried, and continued fasting, having taken nothing.";
hnv[33] = "While the day was coming on, Sha\'ul begged them all to take some food, saying, &quot;This day is the fourteenth day that you wait and continue fasting, having taken nothing.";
vul[33] = "et cum lux inciperet fieri rogabat Paulus omnes sumere cibum dicens quartadecima hodie die expectantes ieiuni permanetis nihil accipientes";
kjv[34] = "Wherefore I pray you to take [some] meat: for this is for your health: for there shall not an hair fall from the head of any of you.";
rsv[34] = "Therefore I urge you to take some food; it will give you strength, since not a hair is to perish from the head of any of you.&quot;";
asv[34] = "Wherefore I beseech you to take some food: for this is for your safety: for there shall not a hair perish from the head of any of you.";
yng[34] = "wherefore I call upon you to take nourishment, for this is for your safety, for of not one of you shall a hair from the head fall;\'";
dby[34] = "Wherefore I exhort you to partake of food, for this has to do with your safety; for not a hair from the head of any one of you shall perish.";
web[34] = "Wherefore I pray you to take [some] food; for this is for your health: for there shall not a hair fall from the head of any of you.";
hnv[34] = "Therefore I beg you to take some food, for this is for your safety; for not a hair will perish from any of your heads.&quot;";
vul[34] = "propter quod rogo vos accipere cibum pro salute vestra quia nullius vestrum capillus de capite peribit";
kjv[35] = "And when he had thus spoken, he took bread, and gave thanks to God in presence of them all: and when he had broken [it], he began to eat.";
rsv[35] = "And when he had said this, he took bread, and giving thanks to God in the presence of all he broke it and began to eat.";
asv[35] = "And when he had said this, and had taken bread, he gave thanks to God in the presence of all; and he brake it, and began to eat.";
yng[35] = "and having said these things, and having taken bread, he gave thanks to God before all, and having broken [it], he began to eat;";
dby[35] = "And, having said these things and taken a loaf, he gave thanks to God before all, and having broken it began to eat.";
web[35] = "And when he had thus spoken, he took bread, and gave thanks to God in presence of them all; and when he had broken [it], he began to eat.";
hnv[35] = "When he had said this, and had taken bread, he gave thanks to God in the presence of all, and he broke it, and began to eat.";
vul[35] = "et cum haec dixisset sumens panem gratias egit Deo in conspectu omnium et cum fregisset coepit manducare";
kjv[36] = "Then were they all of good cheer, and they also took [some] meat.";
rsv[36] = "Then they all were encouraged and ate some food themselves.";
asv[36] = "Then were they all of good cheer, and themselves also took food.";
yng[36] = "and all having become of good cheer, themselves also took food,";
dby[36] = "And all taking courage, themselves also took food.";
web[36] = "Then they were all of good cheer, and they also took food.";
hnv[36] = "Then they all cheered up, and they also took food.";
vul[36] = "animaequiores autem facti omnes et ipsi adsumpserunt cibum";
kjv[37] = "And we were in all in the ship two hundred threescore and sixteen souls.";
rsv[37] = "(We were in all two hundred and seventy-six persons in the ship.)";
asv[37] = "And we were in all in the ship two hundred threescore and sixteen souls.";
yng[37] = "(and we were -- all the souls in the ship -- two hundred, seventy and six),";
dby[37] = "And we were in the ship, all the souls, two hundred and seventy-six.";
web[37] = "And we were in all in the ship two hundred and seventy six souls.";
hnv[37] = "In all, we were two hundred seventy-six souls on the ship.";
vul[37] = "eramus vero universae animae in navi ducentae septuaginta sex";
kjv[38] = "And when they had eaten enough, they lightened the ship, and cast out the wheat into the sea.";
rsv[38] = "And when they had eaten enough, they lightened the ship, throwing out the wheat into the sea.";
asv[38] = "And when they had eaten enough, they lightened the ship, throwing out the wheat into the sea.";
yng[38] = "and having eaten sufficient nourishment, they were lightening the ship, casting forth the wheat into the sea.";
dby[38] = "And having satisfied themselves with food, they lightened the ship, casting out the wheat into the sea.";
web[38] = "And when they had eaten enough, they lightened the ship, and cast the wheat into the sea.";
hnv[38] = "When they had eaten enough, they lightened the ship, throwing out the wheat into the sea.";
vul[38] = "et satiati cibo adleviabant navem iactantes triticum in mare";
kjv[39] = "And when it was day, they knew not the land: but they discovered a certain creek with a shore, into the which they were minded, if it were possible, to thrust in the ship.";
rsv[39] = "Now when it was day, they did not recognize the land, but they noticed a bay with a beach, on which they planned if possible to bring the ship ashore.";
asv[39] = "And when it was day, they knew not the land: but they perceived a certain bay with a beach, and they took counsel whether they could drive the ship upon it.";
yng[39] = "And when the day came, they were not discerning the land, but a certain creek were perceiving having a beach, into which they took counsel, if possible, to thrust forward the ship,";
dby[39] = "And when it was day they did not recognise the land; but they perceived a certain bay having a strand, on which they were minded, if they should be able, to run the ship ashore;";
web[39] = "And when it was day, they knew not the land: but they discovered a certain creek with a shore, into which they purposed, if it were possible, to thrust in the ship.";
hnv[39] = "When it was day, they didn\'t recognize the land, but they noticed a certain bay with a beach, and they decided to try to drive the ship onto it.";
vul[39] = "cum autem dies factus esset terram non agnoscebant sinum vero quendam considerabant habentem litus in quem cogitabant si possent eicere navem";
kjv[40] = "And when they had taken up the anchors, they committed [themselves] unto the sea, and loosed the rudder bands, and hoised up the mainsail to the wind, and made toward shore.";
rsv[40] = "So they cast off the anchors and left them in the sea, at the same time loosening the ropes that tied the rudders; then hoisting the foresail to the wind they made for the beach.";
asv[40] = "And casting off the anchors, they left them in the sea, at the same time loosing the bands of the rudders; and hoisting up the foresail to the wind, they made for the beach.";
yng[40] = "and the anchors having taken up, they were committing [it] to the sea, at the same time -- having loosed the bands of the rudders, and having hoisted up the mainsail to the wind -- they were making for the shore,";
dby[40] = "and, having cast off the anchors, they left [them] in the sea, at the same time loosening the lashings of the rudders, and hoisting the foresail to the wind, they made for the strand.";
web[40] = "And when they had taken up the anchors, they committed [themselves] to the sea, and loosed the rudder bands, and hoisted the mainsail to the wind, and made towards the shore.";
hnv[40] = "Casting off the anchors, they left them in the sea, at the same time untying the rudder ropes. Hoisting up the foresail to the wind, they made for the beach.";
vul[40] = "et cum anchoras abstulissent committebant se mari simul laxantes iuncturas gubernaculorum et levato artemone secundum flatum aurae tendebant ad litus";
kjv[41] = "And falling into a place where two seas met, they ran the ship aground; and the forepart stuck fast, and remained unmoveable, but the hinder part was broken with the violence of the waves.";
rsv[41] = "But striking a shoal they ran the vessel aground; the bow stuck and remained immovable, and the stern was broken up by the surf.";
asv[41] = "But lighting upon a place where two seas met, they ran the vessel aground; and the foreship struck and remained unmoveable, but the stern began to break up by the violence [of the waves].";
yng[41] = "and having fallen into a place of two seas, they ran the ship aground, and the fore-part, indeed, having stuck fast, did remain immoveable, but the hinder-part was broken by the violence of the waves.";
dby[41] = "And falling into a place where two seas met they ran the ship aground, and the prow having stuck itself fast remained unmoved, but the stern was broken by the force of the waves.";
web[41] = "And falling into a place where two seas met, they ran the ship aground; and the forepart stuck fast, and remained immovable, but the hinder part was broken with the violence of the waves.";
hnv[41] = "But coming to a place where two seas met, they ran the vessel aground. The bow struck and remained immovable, but the stern began to break up by the violence of the waves.";
vul[41] = "et cum incidissemus in locum bithalassum inpegerunt navem et prora quidem fixa manebat inmobilis puppis vero solvebatur a vi maris";
kjv[42] = "And the soldiers\' counsel was to kill the prisoners, lest any of them should swim out, and escape.";
rsv[42] = "The soldiers\' plan was to kill the prisoners, lest any should swim away and escape;";
asv[42] = "And the soldiers\' counsel was to kill the prisoners, lest any [of them] should swim out, and escape.";
yng[42] = "And the soldiers\' counsel was that they should kill the prisoners, lest any one having swam out should escape,";
dby[42] = "And [the] counsel of the soldiers was that they should kill the prisoners, lest any one should swim off and escape.";
web[42] = "And the soldiers\' counsel was to kill the prisoners, lest any of them should swim out, and escape.";
hnv[42] = "The soldiers\' counsel was to kill the prisoners, so that none of them would swim out and escape.";
vul[42] = "militum autem consilium fuit ut custodias occiderent ne quis cum enatasset effugeret";
kjv[43] = "But the centurion, willing to save Paul, kept them from [their] purpose; and commanded that they which could swim should cast [themselves] first [into the sea], and get to land:";
rsv[43] = "but the centurion, wishing to save Paul, kept them from carrying out their purpose. He ordered those who could swim to throw themselves overboard first and make for the land,";
asv[43] = "But the centurion, desiring to save Paul, stayed them from their purpose; and commanded that they who could swim should cast themselves overboard, and get first to the land;";
yng[43] = "but the centurion, wishing to save Paul, hindered them from the counsel, and did command those able to swim, having cast themselves out first -- to get unto the land,";
dby[43] = "But the centurion, desirous of saving Paul, hindered them of their purpose, and commanded those who were able to swim, casting themselves first [into the sea], to get out on land;";
web[43] = "But the centurion, willing to save Paul, kept them from [their] purpose, and commanded that they who could swim, should cast [themselves] first [into the sea], and get to land:";
hnv[43] = "But the centurion, desiring to save Sha\'ul, stopped them from their purpose, and commanded that those who could swim should throw themselves overboard first to go toward the land;";
vul[43] = "centurio autem volens servare Paulum prohibuit fieri iussitque eos qui possent natare mittere se primos et evadere et ad terram exire";
kjv[44] = "And the rest, some on boards, and some on [broken pieces] of the ship. And so it came to pass, that they escaped all safe to land.";
rsv[44] = "and the rest on planks or on pieces of the ship. And so it was that all escaped to land.";
asv[44] = "and the rest, some on planks, and some on [other] things from the ship. And so it came to pass, that they all escaped safe to the land.";
yng[44] = "and the rest, some indeed upon boards, and some upon certain things of the ship; and thus it came to pass that all came safe unto the land.";
dby[44] = "and the rest, some on boards, some on some of the things [that came] from the ship; and thus it came to pass that all got safe to land.";
web[44] = "And the rest, some on boards, and some on [broken pieces] of the ship: And so it came to pass, that they all escaped safe to land.";
hnv[44] = "and the rest should follow, some on planks, and some on other things from the ship. So it happened that they all escaped safely to the land.";
vul[44] = "et ceteros alios in tabulis ferebant quosdam super ea quae de navi essent et sic factum est ut omnes animae evaderent ad terram";
