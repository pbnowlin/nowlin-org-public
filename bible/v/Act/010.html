csb[1] = "There was a man in Caesarea named Cornelius, a centurion of what was called the Italian Regiment.";
csb[2] = "He was a devout man and feared God along with his whole household. He did many charitable deeds for the Jewish people and always prayed to God.";
csb[3] = "About three in the afternoon he distinctly saw in a vision an angel of God who came in and said to him, &quot;Cornelius.&quot;";
csb[4] = "Staring at him in awe, he said, &quot;What is it, Lord? &quot; The angel told him, &quot;Your prayers and your acts of charity have ascended as a memorial offering before God.";
csb[5] = "&quot;Now send men to Joppa and call for Simon, who is also named Peter.";
csb[6] = "&quot;He is lodging with Simon, a tanner, whose house is by the sea.&quot;";
csb[7] = "When the angel who spoke to him had gone, he called two of his household servants and a devout soldier, who was one of those who attended him.";
csb[8] = "After explaining everything to them, he sent them to Joppa.";
csb[9] = "The next day, as they were traveling and nearing the city, Peter went up to pray on the roof about noon.";
csb[10] = "He became hungry and wanted to eat, but while they were preparing something, he fell into a trance.";
csb[11] = "He saw heaven opened and an object that resembled a large sheet coming down, being lowered by its four corners to the earth.";
csb[12] = "In it were all the four-footed animals and reptiles of the earth, and the birds of the sky.";
csb[13] = "A voice said to him, &quot;Get up, Peter; kill and eat.&quot;";
csb[14] = "&quot;No, Lord! &quot; Peter said. &quot;For I have never eaten anything impure and ritually unclean.&quot;";
csb[15] = "Again, a second time, the voice said to him, &quot;What God has made clean, do not call impure.&quot;";
csb[16] = "This happened three times, and suddenly the object was taken up into heaven.";
csb[17] = "While Peter was deeply perplexed about what the vision he had seen might mean, right away the men who had been sent by Cornelius, having asked directions to Simon\'s house, stood at the gate.";
csb[18] = "They called out, asking if Simon, who was also named Peter, was lodging there.";
csb[19] = "While Peter was thinking about the vision, the Spirit told him, &quot;Three men are here looking for you.";
csb[20] = "&quot;Get up, go downstairs, and go with them with no doubts at all, because I have sent them.&quot;";
csb[21] = "Then Peter went down to the men and said, &quot;Here I am, the one you\'re looking for. What is the reason you\'re here? &quot;";
csb[22] = "They said, &quot;Cornelius, a centurion, an upright and God-fearing man, who has a good reputation with the whole Jewish nation, was divinely directed by a holy angel to call you to his house and to hear a message from you.&quot;";
csb[23] = "Peter then invited them in and gave them lodging. The next day he got up and set out with them, and some of the brothers from Joppa went with him.";
csb[24] = "The following day he entered Caesarea. Now Cornelius was expecting them and had called together his relatives and close friends.";
csb[25] = "When Peter entered, Cornelius met him, fell at his feet, and worshiped him.";
csb[26] = "But Peter lifted him up and said, &quot;Stand up. I myself am also a man.&quot;";
csb[27] = "While talking with him, he went in and found a large gathering of people.";
csb[28] = "Peter said to them, &quot;You know it\'s forbidden for a Jewish man to associate with or visit a foreigner, but God has shown me that I must not call any person impure or unclean.";
csb[29] = "&quot;That\'s why I came without any objection when I was sent for. So may I ask why you sent for me? &quot;";
csb[30] = "Cornelius replied, &quot;Four days ago at this hour, at three in the afternoon, I was praying in my house. Just then a man in dazzling clothing stood before me";
csb[31] = "&quot;and said, \'Cornelius, your prayer has been heard, and your acts of charity have been remembered in God\'s sight.";
csb[32] = "&quot;Therefore send someone to Joppa and invite Simon here, who is also named Peter. He is lodging in Simon the tanner\'s house by the sea.\'";
csb[33] = "&quot;So I immediately sent for you, and it was good of you to come. So now we are all in the presence of God to hear everything you have been commanded by the Lord.&quot;";
csb[34] = "Peter began to speak: &quot;Now I truly understand that God doesn\'t show favoritism,";
csb[35] = "&quot;but in every nation the person who fears him and does what is right is acceptable to him.";
csb[36] = "&quot;He sent the message to the Israelites, proclaiming the good news of peace through Jesus Christ -- he is Lord of all.";
csb[37] = "&quot;You know the events that took place throughout all Judea, beginning from Galilee after the baptism that John preached:";
csb[38] = "&quot;how God anointed Jesus of Nazareth with the Holy Spirit and with power, and how he went about doing good and healing all who were under the tyranny of the devil, because God was with him.";
csb[39] = "&quot;We ourselves are witnesses of everything he did in both the Judean country and in Jerusalem, and yet they killed him by hanging him on a tree.";
csb[40] = "&quot;God raised up this man on the third day and caused him to be seen,";
csb[41] = "&quot;not by all the people, but by us whom God appointed as witnesses, who ate and drank with him after he rose from the dead.";
csb[42] = "&quot;He commanded us to preach to the people and to testify that he is the one appointed by God to be the judge of the living and the dead.";
csb[43] = "&quot;All the prophets testify about him that through his name everyone who believes in him receives forgiveness of sins.&quot;";
csb[44] = "While Peter was still speaking these words, the Holy Spirit came down on all those who heard the message.";
csb[45] = "The circumcised believers who had come with Peter were amazed because the gift of the Holy Spirit had been poured out even on the Gentiles.";
csb[46] = "For they heard them speaking in other tongues and declaring the greatness of God. Then Peter responded,";
csb[47] = "&quot;Can anyone withhold water and prevent these people from being baptized, who have received the Holy Spirit just as we have? &quot;";
csb[48] = "He commanded them to be baptized in the name of Jesus Christ. Then they asked him to stay for a few days.";
