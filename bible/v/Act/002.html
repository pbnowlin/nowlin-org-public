csb[1] = "When the day of Pentecost had arrived, they were all together in one place.";
csb[2] = "Suddenly a sound like that of a violent rushing wind came from heaven, and it filled the whole house where they were staying.";
csb[3] = "They saw tongues like flames of fire that separated and rested on each one of them.";
csb[4] = "Then they were all filled with the Holy Spirit and began to speak in different tongues, as the Spirit enabled them.";
csb[5] = "Now there were Jews staying in Jerusalem, devout people from every nation under heaven.";
csb[6] = "When this sound occurred, a crowd came together and was confused because each one heard them speaking in his own language.";
csb[7] = "They were astounded and amazed, saying, &quot;Look, aren\'t all these who are speaking Galileans?";
csb[8] = "&quot;How is it that each of us can hear them in our own native language?";
csb[9] = "&quot;Parthians, Medes, Elamites; those who live in Mesopotamia, in Judea and Cappadocia, Pontus and Asia,";
csb[10] = "&quot;Phrygia and Pamphylia, Egypt and the parts of Libya near Cyrene; visitors from Rome (both Jews and converts),";
csb[11] = "&quot;Cretans and Arabs -- we hear them declaring the magnificent acts of God in our own tongues.&quot;";
csb[12] = "They were all astounded and perplexed, saying to one another, &quot;What does this mean? &quot;";
csb[13] = "But some sneered and said, &quot;They\'re drunk on new wine.&quot;";
csb[14] = "Peter stood up with the Eleven, raised his voice, and proclaimed to them: &quot;Fellow Jews and all you residents of Jerusalem, let me explain this to you and pay attention to my words.";
csb[15] = "&quot;For these people are not drunk, as you suppose, since it\'s only nine in the morning.";
csb[16] = "&quot;On the contrary, this is what was spoken through the prophet Joel:";
csb[17] = "&quot;And it will be in the last days, says God, that I will pour out my Spirit on all people; then your sons and your daughters will prophesy, your young men will see visions, and your old men will dream dreams.";
csb[18] = "&quot;I will even pour out my Spirit on my servants in those days, both men and women and they will prophesy.";
csb[19] = "&quot;I will display wonders in the heaven above and signs on the earth below: blood and fire and a cloud of smoke.";
csb[20] = "&quot;The sun will be turned to darkness and the moon to blood before the great and glorious day of the Lord comes.";
csb[21] = "&quot;Then everyone who calls on the name of the Lord will be saved.";
csb[22] = "&quot;Fellow Israelites, listen to these words: This Jesus of Nazareth was a man attested to you by God with miracles, wonders, and signs that God did among you through him, just as you yourselves know.";
csb[23] = "&quot;Though he was delivered up according to God\'s determined plan and foreknowledge, you used lawless people to nail him to a cross and kill him.";
csb[24] = "&quot;God raised him up, ending the pains of death, because it was not possible for him to be held by death.";
csb[25] = "&quot;For David says of him: I saw the Lord ever before me; because he is at my right hand, I will not be shaken.";
csb[26] = "&quot;Therefore my heart is glad and my tongue rejoices. Moreover, my flesh will rest in hope,";
csb[27] = "&quot;because you will not abandon me in Hades or allow your holy one to see decay.";
csb[28] = "&quot;You have revealed the paths of life to me; you will fill me with gladness in your presence.";
csb[29] = "&quot;Brothers and sisters, I can confidently speak to you about the patriarch David: He is both dead and buried, and his tomb is with us to this day.";
csb[30] = "&quot;Since he was a prophet, he knew that God had sworn an oath to him to seat one of his descendants on his throne.";
csb[31] = "&quot;Seeing what was to come, he spoke concerning the resurrection of the Messiah: He was not abandoned in Hades, and his flesh did not experience decay.";
csb[32] = "&quot;God has raised this Jesus; we are all witnesses of this.";
csb[33] = "&quot;Therefore, since he has been exalted to the right hand of God and has received from the Father the promised Holy Spirit, he has poured out what you both see and hear.";
csb[34] = "&quot;For it was not David who ascended into the heavens, but he himself says: The Lord declared to my Lord, \'Sit at my right hand";
csb[35] = "&quot;until I make your enemies your footstool.\'";
csb[36] = "&quot;Therefore let all the house of Israel know with certainty that God has made this Jesus, whom you crucified, both Lord and Messiah.&quot;";
csb[37] = "When they heard this, they were pierced to the heart and said to Peter and the rest of the apostles: &quot;Brothers, what should we do? &quot;";
csb[38] = "Peter replied, &quot;Repent and be baptized, each of you, in the name of Jesus Christ for the forgiveness of your sins, and you will receive the gift of the Holy Spirit.";
csb[39] = "&quot;For the promise is for you and for your children, and for all who are far off, as many as the Lord our God will call.&quot;";
csb[40] = "With many other words he testified and strongly urged them, saying, &quot;Be saved from this corrupt generation! &quot;";
csb[41] = "So those who accepted his message were baptized, and that day about three thousand people were added to them.";
csb[42] = "They devoted themselves to the apostles\' teaching, to the fellowship, to the breaking of bread, and to prayer.";
csb[43] = "Everyone was filled with awe, and many wonders and signs were being performed through the apostles.";
csb[44] = "Now all the believers were together and held all things in common.";
csb[45] = "They sold their possessions and property and distributed the proceeds to all, as any had need.";
csb[46] = "Every day they devoted themselves to meeting together in the temple, and broke bread from house to house. They ate their food with joyful and sincere hearts,";
csb[47] = "praising God and enjoying the favor of all the people. Every day the Lord added to their number those who were being saved.";
