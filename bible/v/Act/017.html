csb[1] = "After they passed through Amphipolis and Apollonia, they came to Thessalonica, where there was a Jewish synagogue.";
csb[2] = "As usual, Paul went into the synagogue, and on three Sabbath days reasoned with them from the Scriptures,";
csb[3] = "explaining and proving that it was necessary for the Messiah to suffer and rise from the dead: &quot;This Jesus I am proclaiming to you is the Messiah.&quot;";
csb[4] = "Some of them were persuaded and joined Paul and Silas, including a large number of God-fearing Greeks, as well as a number of the leading women.";
csb[5] = "But the Jews became jealous, and they brought together some wicked men from the marketplace, formed a mob, and started a riot in the city. Attacking Jason\'s house, they searched for them to bring them out to the public assembly.";
csb[6] = "When they did not find them, they dragged Jason and some of the brothers before the city officials, shouting, &quot;These men who have turned the world upside down have come here too,";
csb[7] = "&quot;and Jason has welcomed them. They are all acting contrary to Caesar\'s decrees, saying that there is another king -- Jesus.&quot;";
csb[8] = "The crowd and city officials who heard these things were upset.";
csb[9] = "After taking a security bond from Jason and the others, they released them.";
csb[10] = "As soon as it was night, the brothers and sisters sent Paul and Silas away to Berea. Upon arrival, they went into the synagogue of the Jews.";
csb[11] = "The people here were of more noble character than those in Thessalonica, since they received the word with eagerness and examined the Scriptures daily to see if these things were so.";
csb[12] = "Consequently, many of them believed, including a number of the prominent Greek women as well as men.";
csb[13] = "But when the Jews from Thessalonica found out that the word of God had been proclaimed by Paul at Berea, they came there too, agitating and upsetting the crowds.";
csb[14] = "Then the brothers and sisters immediately sent Paul away to go to the coast, but Silas and Timothy stayed on there.";
csb[15] = "Those who escorted Paul brought him as far as Athens, and after receiving instructions for Silas and Timothy to come to him as quickly as possible, they departed.";
csb[16] = "While Paul was waiting for them in Athens, he was deeply distressed when he saw that the city was full of idols.";
csb[17] = "So he reasoned in the synagogue with the Jews and with those who worshiped God, as well as in the marketplace every day with those who happened to be there.";
csb[18] = "Some of the Epicurean and Stoic philosophers also debated with him. Some said, &quot;What is this ignorant show-off trying to say? &quot; Others replied, &quot;He seems to be a preacher of foreign deities&quot; -- because he was telling the good news about Jesus and the resurrection.";
csb[19] = "They took him and brought him to the Areopagus, and said, &quot;May we learn about this new teaching you are presenting?";
csb[20] = "&quot;Because what you say sounds strange to us, and we want to know what these things mean.&quot;";
csb[21] = "Now all the Athenians and the foreigners residing there spent their time on nothing else but telling or hearing something new.";
csb[22] = "Paul stood in the middle of the Areopagus and said: &quot;People of Athens! I see that you are extremely religious in every respect.";
csb[23] = "&quot;For as I was passing through and observing the objects of your worship, I even found an altar on which was inscribed: \'To an Unknown God.\' Therefore, what you worship in ignorance, this I proclaim to you.";
csb[24] = "&quot;The God who made the world and everything in it -- he is Lord of heaven and earth -- does not live in shrines made by hands.";
csb[25] = "&quot;Neither is he served by human hands, as though he needed anything, since he himself gives everyone life and breath and all things.";
csb[26] = "&quot;From one man he has made every nationality to live over the whole earth and has determined their appointed times and the boundaries of where they live.";
csb[27] = "&quot;He did this so that they might seek God, and perhaps they might reach out and find him, though he is not far from each one of us.";
csb[28] = "&quot;For in him we live and move and have our being, as even some of your own poets have said, \'For we are also his offspring.\'";
csb[29] = "&quot;Since we are God\'s offspring then, we shouldn\'t think that the divine nature is like gold or silver or stone, an image fashioned by human art and imagination.";
csb[30] = "&quot;Therefore, having overlooked the times of ignorance, God now commands all people everywhere to repent,";
csb[31] = "&quot;because he has set a day when he is going to judge the world in righteousness by the man he has appointed. He has provided proof of this to everyone by raising him from the dead.&quot;";
csb[32] = "When they heard about the resurrection of the dead, some began to ridicule him, but others said, &quot;We\'d like to hear from you again about this.&quot;";
csb[33] = "So Paul left their presence.";
csb[34] = "However, some people joined him and believed, including Dionysius the Areopagite, a woman named Damaris, and others with them.";

hnv[19] = "They took hold of him, and brought him to the Areopagus, saying, &quot;May we know what this new teaching is, which is spoken by you?";
vul[19] = "et adprehensum eum ad Ariopagum duxerunt dicentes possumus scire quae est haec nova quae a te dicitur doctrina";
kjv[20] = "For thou bringest certain strange things to our ears: we would know therefore what these things mean.";
rsv[20] = "For you bring some strange things to our ears; we wish to know therefore what these things mean.&quot;";
asv[20] = "For thou bringest certain strange things to our ears: we would know therefore what these things mean.";
yng[20] = "for certain strange things thou dost bring to our ears? we wish, then, to know what these things would wish to be;\'";
dby[20] = "For thou bringest certain strange things to our ears. We wish therefore to know what these things may mean.";
web[20] = "For thou bringest certain strange things to our ears; we would know therefore what these things mean.";
hnv[20] = "For you bring certain strange things to our ears. We want to know therefore what these things mean.&quot;";
vul[20] = "nova enim quaedam infers auribus nostris volumus ergo scire quidnam velint haec esse";
kjv[21] = "(For all the Athenians and strangers which were there spent their time in nothing else, but either to tell, or to hear some new thing.)";
rsv[21] = "Now all the Athenians and the foreigners who lived there spent their time in nothing except telling or hearing something new.";
asv[21] = "(Now all the Athenians and the strangers sojourning there spent their time in nothing else, but either to tell or to hear some new thing.)";
yng[21] = "and all Athenians, and the strangers sojourning, for nothing else were at leisure but to say something, and to hear some newer thing.";
dby[21] = "Now all [the] Athenians and the strangers sojourning there spent their time in nothing else than to tell and to hear the news.";
web[21] = "(For all the Athenians and strangers who were there, spent their time in nothing else, but either to tell, or to hear some new thing.)";
hnv[21] = "Now all the Athenians and the strangers living there spent their time in nothing else, but either to tell or to hear some new thing.";
vul[21] = "Athenienses autem omnes et advenae hospites ad nihil aliud vacabant nisi aut dicere aut audire aliquid novi";
kjv[22] = "Then Paul stood in the midst of Mars\' hill, and said, [Ye] men of Athens, I perceive that in all things ye are too superstitious.";
rsv[22] = "So Paul, standing in the middle of the Are-op\'agus, said: &quot;Men of Athens, I perceive that in every way you are very religious.";
asv[22] = "And Paul stood in the midst of the Areopagus, and said, Ye men of Athens, in all things I perceive that ye are very religious.";
yng[22] = "And Paul, having stood in the midst of the Areopagus, said, `Men, Athenians, in all things I perceive you as over-religious;";
dby[22] = "And Paul standing in the midst of Areopagus said, Athenians, in every way I see you given up to demon worship;";
web[22] = "Then Paul stood in the midst of Mars-hill, and said, [Ye] men of Athens, I perceive that in all things ye are too superstitious.";
hnv[22] = "Sha\'ul stood in the middle of the Areopagus, and said, &quot;You men of Athens, I perceive that you are very religious in all things.";
vul[22] = "stans autem Paulus in medio Ariopagi ait viri athenienses per omnia quasi superstitiosiores vos video";
kjv[23] = "For as I passed by, and beheld your devotions, I found an altar with this inscription, TO THE UNKNOWN GOD. Whom therefore ye ignorantly worship, him declare I unto you.";
rsv[23] = "For as I passed along, and observed the objects of your worship, I found also an altar with this inscription, \'To an unknown god.\' What therefore you worship as unknown, this I proclaim to you.";
asv[23] = "For as I passed along, and observed the objects of your worship, I found also an altar with this inscription, TO AN UNKNOWN GOD. What therefore ye worship in ignorance, this I set forth unto you.";
yng[23] = "for passing through and contemplating your objects of worship, I found also an erection on which had been inscribed: To God -- unknown; whom, therefore -- not knowing -- ye do worship, this One I announce to you.";
dby[23] = "for, passing through and beholding your shrines, I found also an altar on which was inscribed, To the unknown God. Whom therefore ye reverence, not knowing [him], him I announce to you.";
web[23] = "For as I passed by, and beheld your devotions, I found an altar with this inscription, TO THE UNKNOWN GOD. Whom therefore ye ignorantly worship, him declare I to you.";
hnv[23] = "For as I passed along, and observed the objects of your worship, I found also an altar with this inscription: \'TO AN UNKNOWN GOD.\' What therefore you worship in ignorance, this I announce to you.";
vul[23] = "praeteriens enim et videns simulacra vestra inveni et aram in qua scriptum erat ignoto deo quod ergo ignorantes colitis hoc ego adnuntio vobis";
kjv[24] = "God that made the world and all things therein, seeing that he is Lord of heaven and earth, dwelleth not in temples made with hands;";
rsv[24] = "The God who made the world and everything in it, being Lord of heaven and earth, does not live in shrines made by man,";
asv[24] = "The God that made the world and all things therein, he, being Lord of heaven and earth, dwelleth not in temples made with hands;";
yng[24] = "`God, who did make the world, and all things in it, this One, of heaven and of earth being Lord, in temples made with hands doth not dwell,";
dby[24] = "The God who has made the world and all things which are in it, *he*, being Lord of heaven and earth, does not dwell in temples made with hands,";
web[24] = "God that made the world, and all things therein, seeing that he is Lord of heaven and earth, dwelleth not in temples made with hands;";
hnv[24] = "The God who made the world and all things in it, he, being Lord of heaven and eretz, doesn\'t dwell in temples made with hands,";
vul[24] = "Deus qui fecit mundum et omnia quae in eo sunt hic caeli et terrae cum sit Dominus non in manufactis templis inhabitat";
kjv[25] = "Neither is worshipped with men\'s hands, as though he needed any thing, seeing he giveth to all life, and breath, and all things;";
rsv[25] = "nor is he served by human hands, as though he needed anything, since he himself gives to all men life and breath and everything.";
asv[25] = "neither is he served by men\'s hands, as though he needed anything, seeing he himself giveth to all life, and breath, and all things;";
yng[25] = "neither by the hands of men is He served -- needing anything, He giving to all life, and breath, and all things;";
dby[25] = "nor is served by men\'s hands as needing something, himself giving to all life and breath and all things;";
web[25] = "Neither is worshiped with men\'s hands, as though he needed any thing, seeing he giveth to all life, and breath, and all things;";
hnv[25] = " neither is he served by men\'s hands, as though he needed anything, seeing he himself gives to all life and breath, and all things.";
vul[25] = "nec manibus humanis colitur indigens aliquo cum ipse det omnibus vitam et inspirationem et omnia";
kjv[26] = "And hath made of one blood all nations of men for to dwell on all the face of the earth, and hath determined the times before appointed, and the bounds of their habitation;";
rsv[26] = "And he made from one every nation of men to live on all the face of the earth, having determined allotted periods and the boundaries of their habitation,";
asv[26] = "and he made of one every nation of men to dwell on all the face of the earth, having determined [their] appointed seasons, and the bounds of their habitation;";
yng[26] = "He made also of one blood every nation of men, to dwell upon all the face of the earth -- having ordained times before appointed, and the bounds of their dwellings --";
dby[26] = "and has made of one blood every nation of men to dwell upon the whole face of the earth, having determined ordained times and the boundaries of their dwelling,";
web[26] = "And hath made of one blood all nations of men to dwell on all the face of the earth, and hath determined the times before appointed, and the bounds of their habitation;";
hnv[26] = " He made from one blood every nation of men to dwell on all the surface of the eretz, having determined appointed seasons, and the boundaries of their dwellings,";
vul[26] = "fecitque ex uno omne genus hominum inhabitare super universam faciem terrae definiens statuta tempora et terminos habitationis eorum";
kjv[27] = "That they should seek the Lord, if haply they might feel after him, and find him, though he be not far from every one of us:";
rsv[27] = "that they should seek God, in the hope that they might feel after him and find him. Yet he is not far from each one of us,";
asv[27] = "that they should seek God, if haply they might feel after him and find him, though he is not far from each one of us:";
yng[27] = "to seek the Lord, if perhaps they did feel after Him and find, -- though, indeed, He is not far from each one of us,";
dby[27] = "that they may seek God; if indeed they might feel after him and find him, although he is not far from each one of us:";
web[27] = "That they should seek the Lord, if haply they might feel after him, and find him, though he is not far from every one of us:";
hnv[27] = "that they should seek the Lord, if perhaps they might reach out for him and find him, though he is not far from each one of us.";
vul[27] = "quaerere Deum si forte adtractent eum aut inveniant quamvis non longe sit ab unoquoque nostrum";
kjv[28] = "For in him we live, and move, and have our being; as certain also of your own poets have said, For we are also his offspring.";
rsv[28] = "for \'In him we live and move and have our being\'; as even some of your poets have said, \'For we are indeed his offspring.\'";
asv[28] = "for in him we live, and move, and have our being; as certain even of your own poets have said, For we are also his offspring.";
yng[28] = "for in Him we live, and move, and are; as also certain of your poets have said: For of Him also we are offspring.";
dby[28] = "for in him we live and move and exist; as also some of the poets amongst you have said, For we are also his offspring.";
web[28] = "For in him we live, and move, and have our being; as certain also of your own poets have said, for we are also his offspring.";
hnv[28] = "\'For in him we live, and move, and have our being.\' As some of your own poets have said, \'For we are also his offspring.\'";
vul[28] = "in ipso enim vivimus et movemur et sumus sicut et quidam vestrum poetarum dixerunt ipsius enim et genus sumus";
kjv[29] = "Forasmuch then as we are the offspring of God, we ought not to think that the Godhead is like unto gold, or silver, or stone, graven by art and man\'s device.";
rsv[29] = "Being then God\'s offspring, we ought not to think that the Deity is like gold, or silver, or stone, a representation by the art and imagination of man.";
asv[29] = "Being then the offspring of God, we ought not to think that the Godhead is like unto gold, or silver, or stone, graven by art and device of man.";
yng[29] = "`Being, therefore, offspring of God, we ought not to think the Godhead to be like to gold, or silver, or stone, graving of art and device of man;";
dby[29] = "Being therefore [the] offspring of God, we ought not to think that which is divine to be like gold or silver or stone, [the] graven form of man\'s art and imagination.";
web[29] = "Being then the offspring of God, we ought not to think that the Godhead is like to gold, or silver, or stone graven by art and man\'s device.";
hnv[29] = "Being then the offspring of God, we ought not to think that the Divine Nature is like gold, or silver, or stone, engraved by art and design of man.";
vul[29] = "genus ergo cum simus Dei non debemus aestimare auro aut argento aut lapidi sculpturae artis et cogitationis hominis divinum esse simile";
kjv[30] = "And the times of this ignorance God winked at; but now commandeth all men every where to repent:";
rsv[30] = "The times of ignorance God overlooked, but now he commands all men everywhere to repent,";
asv[30] = "The times of ignorance therefore God overlooked; but now he commandeth men that they should all everywhere repent:";
yng[30] = "the times, indeed, therefore, of the ignorance God having overlooked, doth now command all men everywhere to reform,";
dby[30] = "God therefore, having overlooked the times of ignorance, now enjoins men that they shall all everywhere repent,";
web[30] = "And the times of this ignorance God winked at; but now commandeth all men every where to repent:";
hnv[30] = "The times of ignorance therefore God overlooked. But now he commands that all people everywhere should repent,";
vul[30] = "et tempora quidem huius ignorantiae despiciens Deus nunc adnuntiat hominibus ut omnes ubique paenitentiam agant";
kjv[31] = "Because he hath appointed a day, in the which he will judge the world in righteousness by [that] man whom he hath ordained; [whereof] he hath given assurance unto all [men], in that he hath raised him from the dead.";
rsv[31] = "because he has fixed a day on which he will judge the world in righteousness by a man whom he has appointed, and of this he has given assurance to all men by raising him from the dead.&quot;";
asv[31] = "inasmuch as he hath appointed a day in which he will judge the world in righteousness by the man whom he hath ordained; whereof he hath given assurance unto all men, in that he hath raised him from the dead.";
yng[31] = "because He did set a day in which He is about to judge the world in righteousness, by a man whom He did ordain, having given assurance to all, having raised him out of the dead.\'";
dby[31] = "because he has set a day in which he is going to judge the habitable earth in righteousness by [the] man whom he has appointed, giving the proof [of it] to all [in] having raised him from among [the] dead.";
web[31] = "Because he hath appointed a day, in which he will judge the world in righteousness, by [that] man whom he hath ordained: [of which] he hath given assurance to all [men], in that he hath raised him from the dead.";
hnv[31] = "because he has appointed a day in which he will judge the world in righteousness by the man whom he has ordained; whereof he has given assurance to all men, in that he has raised him from the dead.&quot;";
vul[31] = "eo quod statuit diem in qua iudicaturus est orbem in aequitate in viro in quo statuit fidem praebens omnibus suscitans eum a mortuis";
kjv[32] = "And when they heard of the resurrection of the dead, some mocked: and others said, We will hear thee again of this [matter].";
rsv[32] = "Now when they heard of the resurrection of the dead, some mocked; but others said, &quot;We will hear you again about this.&quot;";
asv[32] = "Now when they heard of the resurrection of the dead, some mocked; but others said, We will hear thee concerning this yet again.";
yng[32] = "And having heard of a rising again of the dead, some, indeed, were mocking, but others said, `We will hear thee again concerning this;\'";
dby[32] = "And when they heard [of the] resurrection of the dead, some mocked, and some said, We will hear thee again also concerning this.";
web[32] = "And when they heard of the resurrection of the dead, some mocked: and others said, We will hear thee again concerning this [matter].";
hnv[32] = "Now when they heard of the resurrection of the dead, some mocked; but others said, &quot;We want to hear you again concerning this.&quot;";
vul[32] = "cum audissent autem resurrectionem mortuorum quidam quidem inridebant quidam vero dixerunt audiemus te de hoc iterum";
kjv[33] = "So Paul departed from among them.";
rsv[33] = "So Paul went out from among them.";
asv[33] = "Thus Paul went out from among them.";
yng[33] = "and so Paul went forth from the midst of them,";
dby[33] = "Thus Paul went out of their midst.";
web[33] = "So Paul departed from among them.";
hnv[33] = "Thus Sha\'ul went out from among them.";
vul[33] = "sic Paulus exivit de medio eorum";
kjv[34] = "Howbeit certain men clave unto him, and believed: among the which [was] Dionysius the Areopagite, and a woman named Damaris, and others with them.";
rsv[34] = "But some men joined him and believed, among them Dionys\'ius the Are-op\'agite and a woman named Dam\'aris and others with them.";
asv[34] = "But certain men clave unto him, and believed: among whom also was Dionysius the Areopagite, and a woman named Damaris, and others with them.";
yng[34] = "and certain men having cleaved to him, did believe, among whom [is] also Dionysius the Areopagite, and a woman, by name Damaris, and others with them.";
dby[34] = "But some men joining themselves to him believed; among whom also was Dionysius the Areopagite, and a woman by name Damaris, and others with them.";
web[34] = "But certain men adhered to him, and believed: among whom [was] Dionysius the Areopagite, and a woman named Damaris, and others with them.";
hnv[34] = "But certain men joined with him, and believed, among whom also was Dionysius the Areopagite, and a woman named Damaris, and others with them.";
vul[34] = "quidam vero viri adherentes ei crediderunt in quibus et Dionisius Ariopagita et mulier nomine Damaris et alii cum eis";
