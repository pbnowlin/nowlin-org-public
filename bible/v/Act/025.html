csb[1] = "Three days after Festus arrived in the province, he went up to Jerusalem from Caesarea.";
csb[2] = "The chief priests and the leaders of the Jews presented their case against Paul to him; and they appealed,";
csb[3] = "asking for a favor against Paul, that Festus summon him to Jerusalem. They were, in fact, preparing an ambush along the road to kill him.";
csb[4] = "Festus, however, answered that Paul should be kept at Caesarea, and that he himself was about to go there shortly.";
csb[5] = "&quot;Therefore,&quot; he said, &quot;let those of you who have authority go down with me and accuse him, if he has done anything wrong.&quot;";
csb[6] = "When he had spent not more than eight or ten days among them, he went down to Caesarea. The next day, seated at the tribunal, he commanded Paul to be brought in.";
csb[7] = "When he arrived, the Jews who had come down from Jerusalem stood around him and brought many serious charges that they were not able to prove.";
csb[8] = "Then Paul made his defense: &quot;Neither against the Jewish law, nor against the temple, nor against Caesar have I sinned in any way.&quot;";
csb[9] = "But Festus, wanting to do the Jews a favor, replied to Paul, &quot;Are you willing to go up to Jerusalem to be tried before me there on these charges? &quot;";
csb[10] = "Paul replied: &quot;I am standing at Caesar\'s tribunal, where I ought to be tried. I have done no wrong to the Jews, as even you yourself know very well.";
csb[11] = "&quot;If then I did anything wrong and am deserving of death, I am not trying to escape death; but if there is nothing to what these men accuse me of, no one can give me up to them. I appeal to Caesar! &quot;";
csb[12] = "Then after Festus conferred with his council, he replied, &quot;You have appealed to Caesar; to Caesar you will go.&quot;";
csb[13] = "Several days later, King Agrippa and Bernice arrived in Caesarea and paid a courtesy call on Festus.";
csb[14] = "Since they were staying there several days, Festus presented Paul\'s case to the king, saying, &quot;There\'s a man who was left as a prisoner by Felix.";
csb[15] = "&quot;When I was in Jerusalem, the chief priests and the elders of the Jews presented their case and asked that he be condemned.";
csb[16] = "&quot;I answered them that it is not the Roman custom to give someone up before the accused faces the accusers and has an opportunity for a defense against the charges.";
csb[17] = "&quot;So when they had assembled here, I did not delay. The next day I took my seat at the tribunal and ordered the man to be brought in.";
csb[18] = "&quot;The accusers stood up but brought no charge against him of the evils I was expecting.";
csb[19] = "&quot;Instead they had some disagreements with him about their own religion and about a certain Jesus, a dead man Paul claimed to be alive.";
csb[20] = "&quot;Since I was at a loss in a dispute over such things, I asked him if he wanted to go to Jerusalem and be tried there regarding these matters.";
csb[21] = "&quot;But when Paul appealed to be held for trial by the Emperor, I ordered him to be kept in custody until I could send him to Caesar.&quot;";
csb[22] = "Agrippa said to Festus, &quot;I would like to hear the man myself.&quot; &quot;Tomorrow you will hear him,&quot; he replied.";
csb[23] = "So the next day, Agrippa and Bernice came with great pomp and entered the auditorium with the military commanders and prominent men of the city. When Festus gave the command, Paul was brought in.";
csb[24] = "Then Festus said: &quot;King Agrippa and all men present with us, you see this man. The whole Jewish community has appealed to me concerning him, both in Jerusalem and here, shouting that he should not live any longer.";
csb[25] = "&quot;I found that he had not done anything deserving of death, but when he himself appealed to the Emperor, I decided to send him.";
csb[26] = "&quot;I have nothing definite to write to my lord about him. Therefore, I have brought him before all of you, and especially before you, King Agrippa, so that after this examination is over, I may have something to write.";
csb[27] = "&quot;For it seems unreasonable to me to send a prisoner without indicating the charges against him.&quot;";

kjv[21] = "But when Paul had appealed to be reserved unto the hearing of Augustus, I commanded him to be kept till I might send him to Caesar.";
rsv[21] = "But when Paul had appealed to be kept in custody for the decision of the emperor, I commanded him to be held until I could send him to Caesar.&quot;";
asv[21] = "But when Paul had appealed to be kept for the decision of the emperor, I commanded him to be kept till I should send him to Caesar.";

dby[21] = "But Paul having appealed to be kept for the cognisance of Augustus, I commanded him to be kept till I shall send him to Caesar.";

hnv[21] = "But when Sha\'ul had appealed to be kept for the decision of the emperor, I commanded him to be kept until I could send him to Caesar.&quot;";

kjv[23] = "And on the morrow, when Agrippa was come, and Bernice, with great pomp, and was entered into the place of hearing, with the chief captains, and principal men of the city, at Festus\' commandment Paul was brought forth.";
rsv[23] = "So on the morrow Agrippa and Berni\'ce came with great pomp, and they entered the audience hall with the military tribunes and the prominent men of the city. Then by command of Festus Paul was brought in.";
asv[23] = "So on the morrow, when Agrippa was come, and Bernice, with great pomp, and they were entered into the place of hearing with the chief captains and the principal men of the city, at the command of Festus Paul was brought in.";

dby[23] = "On the morrow therefore, Agrippa being come, and Bernice, with great pomp, and having entered into the hall of audience, with the chiliarchs and the men of distinction of the city, and Festus having given command, Paul was brought.";

hnv[23] = "So on the next day, when Agrippa and Bernice had come with great pomp, and they had entered into the place of hearing with the commanding officers and principal men of the city, at the command of Festus, Sha\'ul was brought in.";

kjv[24] = "And Festus said, King Agrippa, and all men which are here present with us, ye see this man, about whom all the multitude of the Jews have dealt with me, both at Jerusalem, and [also] here, crying that he ought not to live any longer.";

asv[24] = "And Festus saith, King Agrippa, and all men who are here present with us, ye behold this man, about whom all the multitude of the Jews made suit to me, both at Jerusalem and here, crying that he ought not to live any longer.";
yng[24] = "And Festus said, `King Agrippa, and all men who are present with us, ye see this one, about whom all the multitude of the Jews did deal with me, both in Jerusalem and here, crying out, He ought not to live any longer;";
dby[24] = "And Festus said, King Agrippa, and all men who are here present with us, ye see this person, concerning whom all the multitude of the Jews applied to me both in Jerusalem and here, crying out against [him] that he ought not to live any longer.";
web[24] = "And Festus said, King Agrippa, and all men who are here present with us, ye see this man about whom all the multitude of the Jews have dealt with me, both at Jerusalem, and [also] here, crying that he ought not to live any longer.";
hnv[24] = "Festus said, &quot;King Agrippa, and all men who are here present with us, you see this man, about whom all the multitude of the Yehudim petitioned me, both at Yerushalayim and here, crying that he ought not to live any longer.";
vul[24] = "et dixit Festus Agrippa rex et omnes qui simul adestis nobiscum viri videtis hunc de quo omnis multitudo Iudaeorum interpellavit me Hierosolymis petens et hic clamantes non oportere eum vivere amplius";
