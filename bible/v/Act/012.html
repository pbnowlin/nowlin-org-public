csb[1] = "About that time King Herod violently attacked some who belonged to the church,";
csb[2] = "and he executed James, John\'s brother, with the sword.";
csb[3] = "When he saw that it pleased the Jews, he proceeded to arrest Peter too, during the Festival of Unleavened Bread.";
csb[4] = "After the arrest, he put him in prison and assigned four squads of four soldiers each to guard him, intending to bring him out to the people after the Passover.";
csb[5] = "So Peter was kept in prison, but the church was praying fervently to God for him.";
csb[6] = "When Herod was about to bring him out for trial, that very night Peter, bound with two chains, was sleeping between two soldiers, while the sentries in front of the door guarded the prison.";
csb[7] = "Suddenly an angel of the Lord appeared, and a light shone in the cell. Striking Peter on the side, he woke him up and said, &quot;Quick, get up! &quot; And the chains fell off his wrists.";
csb[8] = "&quot;Get dressed,&quot; the angel told him, &quot;and put on your sandals.&quot; And he did. &quot;Wrap your cloak around you,&quot; he told him, &quot;and follow me.&quot;";
csb[9] = "So he went out and followed, and he did not know that what the angel did was really happening, but he thought he was seeing a vision.";
csb[10] = "After they passed the first and second guards, they came to the iron gate that leads into the city, which opened to them by itself. They went outside and passed one street, and suddenly the angel left him.";
csb[11] = "When Peter came to himself, he said, &quot;Now I know for certain that the Lord has sent his angel and rescued me from Herod\'s grasp and from all that the Jewish people expected.&quot;";
csb[12] = "As soon as he realized this, he went to the house of Mary, the mother of John Mark, where many had assembled and were praying.";
csb[13] = "He knocked at the door of the outer gate, and a servant named Rhoda came to answer.";
csb[14] = "She recognized Peter\'s voice, and because of her joy, she did not open the gate but ran in and announced that Peter was standing at the outer gate.";
csb[15] = "&quot;You\'re out of your mind! &quot; they told her. But she kept insisting that it was true, and they said, &quot;It\'s his angel.&quot;";
csb[16] = "Peter, however, kept on knocking, and when they opened the door and saw him, they were amazed.";
csb[17] = "Motioning to them with his hand to be silent, he described to them how the Lord had brought him out of the prison. &quot;Tell these things to James and the brothers,&quot; he said, and he left and went to another place.";
csb[18] = "At daylight, there was a great commotion among the soldiers as to what had become of Peter.";
csb[19] = "After Herod had searched and did not find him, he interrogated the guards and ordered their execution. Then Herod went down from Judea to Caesarea and stayed there.";
csb[20] = "Herod had been very angry with the people of Tyre and Sidon. Together they presented themselves before him. After winning over Blastus, who was in charge of the king\'s bedroom, they asked for peace, because their country was supplied with food from the king\'s country.";
csb[21] = "On an appointed day, dressed in royal robes and seated on the throne, Herod delivered a speech to them.";
csb[22] = "The assembled people began to shout, &quot;It\'s the voice of a god and not of a man! &quot;";
csb[23] = "At once an angel of the Lord struck him because he did not give the glory to God, and he was eaten by worms and died.";
csb[24] = "But the word of God flourished and multiplied.";
csb[25] = "After they had completed their relief mission, Barnabas and Saul returned to Jerusalem, taking along John who was called Mark.";

yng[20] = "And Herod was highly displeased with the Tyrians and Sidonians, and with one accord they came unto him, and having made a friend of Blastus, who [is] over the bed-chambers of the king, they were asking peace, because of their country being nourished from the king\'s;";
dby[20] = "And he was in bitter hostility with [the] Tyrians and Sidonians; but they came to him with one accord, and, having gained Blastus the king\'s chamberlain, sought peace, because their country was nourished by the king\'s.";
web[20] = "And Herod was highly displeased with them of Tyre and Sidon. But they came with one accord to him, and having made Blastus the king\'s chamberlain their friend, desired peace, because their country was nourished by the king\'s [country].";
hnv[20] = "Now Herod was very angry with the people of Tzor and Tzidon. They came with one accord to him, and, having made Blastus, the king\'s chamberlain, their friend, they asked for shalom, because their country depended on the king\'s country for food.";
vul[20] = "erat autem iratus Tyriis et Sidoniis at illi unianimes venerunt ad eum et persuaso Blasto qui erat super cubiculum regis postulabant pacem eo quod alerentur regiones eorum ab illo";
