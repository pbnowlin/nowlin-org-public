csb[1] = "Now in the church at Antioch there were prophets and teachers: Barnabas, Simeon who was called Niger, Lucius of Cyrene, Manaen, a close friend of Herod the tetrarch, and Saul.";
csb[2] = "As they were worshiping the Lord and fasting, the Holy Spirit said, &quot;Set apart for me Barnabas and Saul for the work to which I have called them.&quot;";
csb[3] = "Then after they had fasted, prayed, and laid hands on them, they sent them off.";
csb[4] = "So being sent out by the Holy Spirit, they went down to Seleucia, and from there they sailed to Cyprus.";
csb[5] = "Arriving in Salamis, they proclaimed the word of God in the Jewish synagogues. They also had John as their assistant.";
csb[6] = "When they had traveled the whole island as far as Paphos, they came across a sorcerer, a Jewish false prophet named Bar-Jesus.";
csb[7] = "He was with the proconsul, Sergius Paulus, an intelligent man. This man summoned Barnabas and Saul and wanted to hear the word of God.";
csb[8] = "But Elymas the sorcerer (that is the meaning of his name) opposed them and tried to turn the proconsul away from the faith.";
csb[9] = "But Saul -- also called Paul -- filled with the Holy Spirit, stared straight at Elymas";
csb[10] = "and said, &quot;You are full of all kinds of deceit and trickery, you son of the devil and enemy of all that is right. Won\'t you ever stop perverting the straight paths of the Lord?";
csb[11] = "&quot;Now, look, the Lord\'s hand is against you. You are going to be blind, and will not see the sun for a time.&quot; Immediately a mist and darkness fell on him, and he went around seeking someone to lead him by the hand.";
csb[12] = "Then, when he saw what happened, the proconsul believed, because he was astonished at the teaching of the Lord.";
csb[13] = "Paul and his companions set sail from Paphos and came to Perga in Pamphylia, but John left them and went back to Jerusalem.";
csb[14] = "They continued their journey from Perga and reached Pisidian Antioch. On the Sabbath day they went into the synagogue and sat down.";
csb[15] = "After the reading of the Law and the Prophets, the leaders of the synagogue sent word to them, saying, &quot;Brothers, if you have any word of encouragement for the people, you can speak.&quot;";
csb[16] = "Paul stood up and motioned with his hand and said: &quot;Fellow Israelites, and you who fear God, listen!";
csb[17] = "&quot;The God of this people Israel chose our ancestors, made the people prosper during their stay in the land of Egypt, and led them out of it with a mighty arm.";
csb[18] = "&quot;And for about forty years he put up with them in the wilderness;";
csb[19] = "&quot;and after destroying seven nations in the land of Canaan, he gave them their land as an inheritance.";
csb[20] = "&quot;This all took about 450 years. After this, he gave them judges until Samuel the prophet.";
csb[21] = "&quot;Then they asked for a king, and God gave them Saul the son of Kish, a man of the tribe of Benjamin, for forty years.";
csb[22] = "&quot;After removing him, he raised up David as their king and testified about him: \'I have found David the son of Jesse to be a man after my own heart, who will carry out all my will.\'";
csb[23] = "&quot;From this man\'s descendants, as he promised, God brought to Israel the Savior, Jesus.";
csb[24] = "&quot;Before his coming to public attention, John had previously proclaimed a baptism of repentance to all the people of Israel.";
csb[25] = "&quot;Now as John was completing his mission, he said, \'Who do you think I am? I am not the one. But one is coming after me, and I am not worthy to untie the sandals on his feet.\'";
csb[26] = "&quot;Brothers and sisters, children of Abraham\'s race, and those among you who fear God, it is to us that the word of this salvation has been sent.";
csb[27] = "&quot;Since the residents of Jerusalem and their rulers did not recognize him or the sayings of the prophets that are read every Sabbath, they have fulfilled their words by condemning him.";
csb[28] = "&quot;Though they found no grounds for the death sentence, they asked Pilate to have him killed.";
csb[29] = "&quot;When they had carried out all that had been written about him, they took him down from the tree and put him in a tomb.";
csb[30] = "&quot;But God raised him from the dead,";
csb[31] = "&quot;and he appeared for many days to those who came up with him from Galilee to Jerusalem, who are now his witnesses to the people.";
csb[32] = "&quot;And we ourselves proclaim to you the good news of the promise that was made to our ancestors.";
csb[33] = "&quot;God has fulfilled this for us, their children, by raising up Jesus, as it is written in the second Psalm: You are my Son; today I have become your Father.";
csb[34] = "&quot;As to his raising him from the dead, never to return to decay, he has spoken in this way, I will give you the holy and sure promises of David.";
csb[35] = "&quot;Therefore he also says in another passage, You will not let your Holy One see decay.";
csb[36] = "&quot;For David, after serving God\'s purpose in his own generation, fell asleep, was buried with his fathers, and decayed,";
csb[37] = "&quot;but the one God raised up did not decay.";
csb[38] = "&quot;Therefore, let it be known to you, brothers and sisters, that through this man forgiveness of sins is being proclaimed to you.";
csb[39] = "&quot;Everyone who believes is justified through him from everything that you could not be justified from through the law of Moses.";
csb[40] = "&quot;So beware that what is said in the prophets does not happen to you:";
csb[41] = "&quot;Look, you scoffers, marvel and vanish away, because I am doing a work in your days, a work that you will never believe, even if someone were to explain it to you.&quot;";
csb[42] = "As they were leaving, the people urged them to speak about these matters the following Sabbath.";
csb[43] = "After the synagogue had been dismissed, many of the Jews and devout converts to Judaism followed Paul and Barnabas, who were speaking with them and urging them to continue in the grace of God.";
csb[44] = "The following Sabbath almost the whole town assembled to hear the word of the Lord.";
csb[45] = "But when the Jews saw the crowds, they were filled with jealousy and began to contradict what Paul was saying, insulting him.";
csb[46] = "Paul and Barnabas boldly replied, &quot;It was necessary that the word of God be spoken to you first. Since you reject it and judge yourselves unworthy of eternal life, we are turning to the Gentiles.";
csb[47] = "&quot;For this is what the Lord has commanded us: I have made you a light for the Gentiles to bring salvation to the end of the earth.&quot;";
csb[48] = "When the Gentiles heard this, they rejoiced and honored the word of the Lord, and all who had been appointed to eternal life believed.";
csb[49] = "The word of the Lord spread through the whole region.";
csb[50] = "But the Jews incited the prominent God-fearing women and the leading men of the city. They stirred up persecution against Paul and Barnabas and expelled them from their district.";
csb[51] = "But Paul and Barnabas shook the dust off their feet against them and went to Iconium.";
csb[52] = "And the disciples were filled with joy and the Holy Spirit.";

asv[43] = "Now when the synagogue broke up, many of the Jews and of the devout proselytes followed Paul and Barnabas; who, speaking to them, urged them to continue in the grace of God.";
yng[43] = "and the synagogue having been dismissed, many of the Jews and of the devout proselytes did follow Paul and Barnabas, who, speaking to them, were persuading them to remain in the grace of God.";
dby[43] = "And the congregation of the synagogue having broken up, many of the Jews and of the worshipping proselytes followed Paul and Barnabas, who speaking to them, persuaded them to continue in the grace of God.";
web[43] = "Now when the congregation was broken up, many of the Jews and religious proselytes followed Paul and Barnabas; who speaking to them, persuaded them to continue in the grace of God.";
hnv[43] = "Now when the synagogue broke up, many of the Yehudim and of the devout proselytes followed Sha\'ul and Bar-Nabba; who, speaking to them, urged them to continue in the grace of God.";
vul[43] = "cumque dimissa esset synagoga secuti sunt multi Iudaeorum et colentium advenarum Paulum et Barnaban qui loquentes suadebant eis ut permanerent in gratia Dei";
kjv[44] = "And the next sabbath day came almost the whole city together to hear the word of God.";
rsv[44] = "The next sabbath almost the whole city gathered together to hear the word of God.";
asv[44] = "And the next sabbath almost the whole city was gathered together to hear the word of God.";
yng[44] = "And on the coming sabbath, almost all the city was gathered together to hear the word of God,";
dby[44] = "And on the coming sabbath almost all the city was gathered together to hear the word of God.";
web[44] = "And the next sabbath came almost the whole city together to hear the word of God.";
hnv[44] = "The next Shabbat almost the whole city was gathered together to hear the word of God.";
vul[44] = "sequenti vero sabbato paene universa civitas convenit audire verbum Domini";
kjv[45] = "But when the Jews saw the multitudes, they were filled with envy, and spake against those things which were spoken by Paul, contradicting and blaspheming.";
rsv[45] = "But when the Jews saw the multitudes, they were filled with jealousy, and contradicted what was spoken by Paul, and reviled him.";
asv[45] = "But when the Jews saw the multitudes, they were filled with jealousy, and contradicted the things which were spoken by Paul, and blasphemed.";
yng[45] = "and the Jews having seen the multitudes, were filled with zeal, and did contradict the things spoken by Paul -- contradicting and speaking evil.";
dby[45] = "But the Jews, seeing the crowds, were filled with envy, and contradicted the things said by Paul, [contradicting and] speaking injuriously.";
web[45] = "But when the Jews saw the multitudes, they were filled with envy, and spoke against those things which were uttered by Paul, contradicting and blaspheming.";
hnv[45] = "But when the Yehudim saw the multitudes, they were filled with jealousy, and contradicted the things which were spoken by Sha\'ul, and blasphemed.";
vul[45] = "videntes autem turbas Iudaei repleti sunt zelo et contradicebant his quae a Paulo dicebantur blasphemantes";
kjv[46] = "Then Paul and Barnabas waxed bold, and said, It was necessary that the word of God should first have been spoken to you: but seeing ye put it from you, and judge yourselves unworthy of everlasting life, lo, we turn to the Gentiles.";
rsv[46] = "And Paul and Barnabas spoke out boldly, saying, &quot;It was necessary that the word of God should be spoken first to you. Since you thrust it from you, and judge yourselves unworthy of eternal life, behold, we turn to the Gentiles.";
asv[46] = "And Paul and Barnabas spake out boldly, and said, It was necessary that the word of God should first be spoken to you. Seeing ye thrust it from you, and judge yourselves unworthy of eternal life, lo, we turn to the Gentiles.";
yng[46] = "And speaking boldly, Paul and Barnabas said, `To you it was necessary that first the word of God be spoken, and seeing ye do thrust it away, and do not judge yourselves worthy of the life age-during, lo, we do turn to the nations;";
dby[46] = "And Paul and Barnabas spoke boldly and said, It was necessary that the word of God should be first spoken to you; but, since ye thrust it from you, and judge yourselves unworthy of eternal life, lo, we turn to the nations;";
web[46] = "Then Paul and Barnabas became bold, and said, It was necessary that the word of God should first be spoken to you: but seeing ye reject it, and judge yourselves unworthy of everlasting life, lo, we turn to the Gentiles.";
hnv[46] = "Sha\'ul and Bar-Nabba spoke out boldly, and said, &quot;It was necessary that God\'s word should be spoken to you first. Since indeed you thrust it from you, and judge yourselves unworthy of eternal life, behold, we turn to the Goyim.";
vul[46] = "tunc constanter Paulus et Barnabas dixerunt vobis oportebat primum loqui verbum Dei sed quoniam repellitis illud et indignos vos iudicastis aeternae vitae ecce convertimur ad gentes";
kjv[47] = "For so hath the Lord commanded us, [saying], I have set thee to be a light of the Gentiles, that thou shouldest be for salvation unto the ends of the earth.";
rsv[47] = "For so the Lord has commanded us, saying, \'I have set you to be a light for the Gentiles, that you may bring salvation to the uttermost parts of the earth.\'&quot;";
asv[47] = "For so hath the Lord commanded us, [saying], I have set thee for a light of the Gentiles, That thou shouldest be for salvation unto the uttermost part of the earth. ";
yng[47] = "for so hath the Lord commanded us: I have set thee for a light of nations -- for thy being for salvation unto the end of the earth.\'";
dby[47] = "for thus has the Lord enjoined us: I have set thee for a light of the nations, that thou shouldest be for salvation to the end of the earth.";
web[47] = "For so hath the Lord commanded us, [saying], I have set thee to be a light of the Gentiles, that thou shouldst be for salvation to the ends of the earth.";
hnv[47] = "For so has the Lord commanded us, saying, \'I have set you as a light for the Goyim, That you should bring salvation to the uttermost parts of the eretz.\'&quot;";
vul[47] = "sic enim praecepit nobis Dominus posui te in lumen gentibus ut sis in salutem usque ad extremum terrae";
kjv[48] = "And when the Gentiles heard this, they were glad, and glorified the word of the Lord: and as many as were ordained to eternal life believed.";
rsv[48] = "And when the Gentiles heard this, they were glad and glorified the word of God; and as many as were ordained to eternal life believed.";
asv[48] = "And as the Gentiles heard this, they were glad, and glorified the word of God: and as many as were ordained to eternal life believed.";
yng[48] = "And the nations hearing were glad, and were glorifying the word of the Lord, and did believe -- as many as were appointed to life age-during;";
dby[48] = "And [those of] the nations, hearing it, rejoiced, and glorified the word of the Lord, and believed, as many as were ordained to eternal life.";
web[48] = "And when the Gentiles heard this, they were glad, and glorified the word of the Lord: and as many as were ordained to eternal life, believed.";
hnv[48] = "As the Goyim heard this, they were glad, and glorified the word of God. As many as were appointed to eternal life believed.";
vul[48] = "audientes autem gentes gavisae sunt et glorificabant verbum Domini et crediderunt quotquot erant praeordinati ad vitam aeternam";
kjv[49] = "And the word of the Lord was published throughout all the region.";
rsv[49] = "And the word of the Lord spread throughout all the region.";
asv[49] = "And the word of the Lord was spread abroad throughout all the region.";
yng[49] = "and the word of the Lord was spread abroad through all the region.";
dby[49] = "And the word of the Lord was carried through the whole country.";
web[49] = "And the word of the Lord was published throughout all the region.";
hnv[49] = "The Lord\'s word was spread abroad throughout all the region.";
vul[49] = "disseminabatur autem verbum Domini per universam regionem";
kjv[50] = "But the Jews stirred up the devout and honourable women, and the chief men of the city, and raised persecution against Paul and Barnabas, and expelled them out of their coasts.";
rsv[50] = "But the Jews incited the devout women of high standing and the leading men of the city, and stirred up persecution against Paul and Barnabas, and drove them out of their district.";
asv[50] = "But the Jews urged on the devout women of honorable estate, and the chief men of the city, and stirred up a persecution against Paul and Barnabas, and cast them out of their borders.";
yng[50] = "And the Jews stirred up the devout and honourable women, and the first men of the city, and did raise persecution against Paul and Barnabas, and did put them out from their borders;";
dby[50] = "But the Jews excited the women of the upper classes who were worshippers, and the first people of the city, and raised a persecution against Paul and Barnabas, and cast them out of their coasts.";
web[50] = "But the Jews stirred up the devout and honorable women, and the chief men of the city, and raised persecution against Paul and Barnabas, and expelled them from their borders.";
hnv[50] = "But the Yehudim stirred up the devout and prominent women and the chief men of the city, and stirred up a persecution against Sha\'ul and Bar-Nabba, and threw them out of their borders.";
vul[50] = "Iudaei autem concitaverunt religiosas mulieres et honestas et primos civitatis et excitaverunt persecutionem in Paulum et Barnaban et eiecerunt eos de finibus suis";
kjv[51] = "But they shook off the dust of their feet against them, and came unto Iconium.";
rsv[51] = "But they shook off the dust from their feet against them, and went to Ico\'nium.";
asv[51] = "But they shook off the dust of their feet against them, and came unto Iconium.";
yng[51] = "and they having shaken off the dust of their feet against them, came to Iconium,";
dby[51] = "But they, having shaken off the dust of their feet against them, came to Iconium.";
web[51] = "But they shook off the dust of their feet against them, and came to Iconium.";
hnv[51] = "But they shook off the dust of their feet against them, and came to Iconium.";

rsv[52] = "And the disciples were filled with joy and with the Holy Spirit.";
asv[52] = "And the disciples were filled with joy and with the Holy Spirit.";
yng[52] = "and the disciples were filled with joy and the Holy Spirit.";
dby[52] = "And the disciples were filled with joy and [the] Holy Spirit.";
web[52] = "And the disciples were filled with joy and with the Holy Spirit.";
hnv[52] = "The talmidim were filled with joy with the Ruach HaKodesh.";
