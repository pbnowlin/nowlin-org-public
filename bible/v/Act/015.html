csb[1] = "Some men came down from Judea and began to teach the brothers: &quot;Unless you are circumcised according to the custom prescribed by Moses, you cannot be saved.&quot;";
csb[2] = "After Paul and Barnabas had engaged them in serious argument and debate, Paul and Barnabas and some others were appointed to go up to the apostles and elders in Jerusalem about this issue.";
csb[3] = "When they had been sent on their way by the church, they passed through both Phoenicia and Samaria, describing in detail the conversion of the Gentiles, and they brought great joy to all the brothers and sisters.";
csb[4] = "When they arrived at Jerusalem, they were welcomed by the church, the apostles, and the elders, and they reported all that God had done with them.";
csb[5] = "But some of the believers who belonged to the party of the Pharisees stood up and said, &quot;It is necessary to circumcise them and to command them to keep the law of Moses.&quot;";
csb[6] = "The apostles and the elders gathered to consider this matter.";
csb[7] = "After there had been much debate, Peter stood up and said to them: &quot;Brothers and sisters, you are aware that in the early days God made a choice among you, that by my mouth the Gentiles would hear the gospel message and believe.";
csb[8] = "&quot;And God, who knows the heart, bore witness to them by giving them the Holy Spirit, just as he also did to us.";
csb[9] = "&quot;He made no distinction between us and them, cleansing their hearts by faith.";
csb[10] = "&quot;Now then, why are you testing God by putting a yoke on the disciples\' necks that neither our ancestors nor we have been able to bear?";
csb[11] = "&quot;On the contrary, we believe that we are saved through the grace of the Lord Jesus in the same way they are.&quot;";
csb[12] = "The whole assembly became silent and listened to Barnabas and Paul describe all the signs and wonders God had done through them among the Gentiles.";
csb[13] = "After they stopped speaking, James responded: &quot;Brothers and sisters, listen to me.";
csb[14] = "&quot;Simeon has reported how God first intervened to take from the Gentiles a people for his name.";
csb[15] = "&quot;And the words of the prophets agree with this, as it is written:";
csb[16] = "&quot;After these things I will return and rebuild David\'s fallen tent. I will rebuild its ruins and set it up again,";
csb[17] = "&quot;so the rest of humanity may seek the Lord -- even all the Gentiles who are called by my name -- declares the Lord who makes these things";
csb[18] = "&quot;known from long ago.";
csb[19] = "&quot;Therefore, in my judgment, we should not cause difficulties for those among the Gentiles who turn to God,";
csb[20] = "&quot;but instead we should write to them to abstain from things polluted by idols, from sexual immorality, from eating anything that has been strangled, and from blood.";
csb[21] = "&quot;For since ancient times, Moses has had those who proclaim him in every city, and every Sabbath day he is read aloud in the synagogues.&quot;";
csb[22] = "Then the apostles and the elders, with the whole church, decided to select men who were among them and to send them to Antioch with Paul and Barnabas: Judas, called Barsabbas, and Silas, both leading men among the brothers.";
csb[23] = "They wrote: &quot;From the apostles and the elders, your brothers, To the brothers and sisters among the Gentiles in Antioch, Syria, and Cilicia: Greetings.";
csb[24] = "&quot;Since we have heard that some without our authorization went out from us and troubled you with their words and unsettled your hearts,";
csb[25] = "&quot;we have unanimously decided to select men and send them to you along with our dearly loved Barnabas and Paul,";
csb[26] = "&quot;who have risked their lives for the name of our Lord Jesus Christ.";
csb[27] = "&quot;Therefore we have sent Judas and Silas, who will personally report the same things by word of mouth.";
csb[28] = "&quot;For it was the Holy Spirit\'s decision -- and ours -- not to place further burdens on you beyond these requirements:";
csb[29] = "&quot;that you abstain from food offered to idols, from blood, from eating anything that has been strangled, and from sexual immorality. You will do well if you keep yourselves from these things. Farewell.&quot;";
csb[30] = "So they were sent off and went down to Antioch, and after gathering the assembly, they delivered the letter.";
csb[31] = "When they read it, they rejoiced because of its encouragement.";
csb[32] = "Both Judas and Silas, who were also prophets themselves, encouraged the brothers and sisters and strengthened them with a long message.";
csb[33] = "After spending some time there, they were sent back in peace by the brothers and sisters to those who had sent them.";
csb[34] = " ";
csb[35] = "But Paul and Barnabas, along with many others, remained in Antioch, teaching and proclaiming the word of the Lord.";
csb[36] = "After some time had passed, Paul said to Barnabas, &quot;Let\'s go back and visit the brothers and sisters in every town where we have preached the word of the Lord and see how they\'re doing.&quot;";
csb[37] = "Barnabas wanted to take along John Mark.";
csb[38] = "But Paul insisted that they should not take along this man who had deserted them in Pamphylia and had not gone on with them to the work.";
csb[39] = "They had such a sharp disagreement that they parted company, and Barnabas took Mark with him and sailed off to Cyprus.";
csb[40] = "But Paul chose Silas and departed, after being commended by the brothers and sisters to the grace of the Lord.";
csb[41] = "He traveled through Syria and Cilicia, strengthening the churches.";

asv[23] = "and they wrote [thus] by them, The apostles and the elders, brethren, unto the brethren who are of the Gentiles in Antioch and Syria and Cilicia, greeting:";
yng[23] = "having written through their hand thus: `The apostles, and the elders, and the brethren, to those in Antioch, and Syria, and Cilicia, brethren, who [are] of the nations, greeting;";
dby[23] = "having by their hand written [thus]: The apostles, and the elders, and the brethren, to the brethren who are from among [the] nations at Antioch, and [in] Syria and Cilicia, greeting:";
