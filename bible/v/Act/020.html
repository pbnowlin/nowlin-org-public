csb[1] = "After the uproar was over, Paul sent for the disciples, encouraged them, and after saying farewell, departed to go to Macedonia.";
csb[2] = "And when he had passed through those areas and offered them many words of encouragement, he came to Greece";
csb[3] = "and stayed three months. The Jews plotted against him when he was about to set sail for Syria, and so he decided to go back through Macedonia.";
csb[4] = "He was accompanied by Sopater son of Pyrrhus from Berea, Aristarchus and Secundus from Thessalonica, Gaius from Derbe, Timothy, and Tychicus and Trophimus from the province of Asia.";
csb[5] = "These men went on ahead and waited for us in Troas,";
csb[6] = "but we sailed away from Philippi after the Festival of Unleavened Bread. In five days we reached them at Troas, where we spent seven days.";
csb[7] = "On the first day of the week, we assembled to break bread. Paul spoke to them, and since he was about to depart the next day, he kept on talking until midnight.";
csb[8] = "There were many lamps in the room upstairs where we were assembled,";
csb[9] = "and a young man named Eutychus was sitting on a window sill and sank into a deep sleep as Paul kept on talking. When he was overcome by sleep, he fell down from the third story and was picked up dead.";
csb[10] = "But Paul went down, bent over him, embraced him, and said, &quot;Don\'t be alarmed, because he\'s alive.&quot;";
csb[11] = "After going upstairs, breaking the bread, and eating, Paul talked a long time until dawn. Then he left.";
csb[12] = "They brought the boy home alive and were greatly comforted.";
csb[13] = "We went on ahead to the ship and sailed for Assos, where we were going to take Paul on board, because these were his instructions, since he himself was going by land.";
csb[14] = "When he met us at Assos, we took him on board and went on to Mitylene.";
csb[15] = "Sailing from there, the next day we arrived off Chios. The following day we crossed over to Samos, and the day after, we came to Miletus.";
csb[16] = "For Paul had decided to sail past Ephesus to avoid spending time in the province of Asia, because he was hurrying to be in Jerusalem, if possible, for the day of Pentecost.";
csb[17] = "Now from Miletus, he sent to Ephesus and summoned the elders of the church.";
csb[18] = "When they came to him, he said to them: &quot;You know, from the first day I set foot in Asia, how I was with you the whole time,";
csb[19] = "&quot;serving the Lord with all humility, with tears, and during the trials that came to me through the plots of the Jews.";
csb[20] = "&quot;You know that I did not avoid proclaiming to you anything that was profitable or from teaching you publicly and from house to house.";
csb[21] = "&quot;I testified to both Jews and Greeks about repentance toward God and faith in our Lord Jesus.";
csb[22] = "&quot;And now I am on my way to Jerusalem, compelled by the Spirit, not knowing what I will encounter there,";
csb[23] = "&quot;except that in every town the Holy Spirit warns me that chains and afflictions are waiting for me.";
csb[24] = "&quot;But I consider my life of no value to myself; my purpose is to finish my course and the ministry I received from the Lord Jesus, to testify to the gospel of God\'s grace.";
csb[25] = "&quot;And now I know that none of you, among whom I went about preaching the kingdom, will ever see me again.";
csb[26] = "&quot;Therefore I declare to you this day that I am innocent of the blood of all of you,";
csb[27] = "&quot;because I did not avoid declaring to you the whole plan of God.";
csb[28] = "&quot;Be on guard for yourselves and for all the flock of which the Holy Spirit has appointed you as overseers, to shepherd the church of God, which he purchased with his own blood.";
csb[29] = "&quot;I know that after my departure savage wolves will come in among you, not sparing the flock.";
csb[30] = "&quot;Men will rise up even from your own number and distort the truth to lure the disciples into following them.";
csb[31] = "&quot;Therefore be on the alert, remembering that night and day for three years I never stopped warning each one of you with tears.";
csb[32] = "&quot;And now I commit you to God and to the word of his grace, which is able to build you up and to give you an inheritance among all who are sanctified.";
csb[33] = "&quot;I have not coveted anyone\'s silver or gold or clothing.";
csb[34] = "&quot;You yourselves know that I worked with my own hands to support myself and those who are with me.";
csb[35] = "&quot;In every way I\'ve shown you that it is necessary to help the weak by laboring like this and to remember the words of the Lord Jesus, because he said, \'It is more blessed to give than to receive.\' &quot;";
csb[36] = "After he said this, he knelt down and prayed with all of them.";
csb[37] = "There were many tears shed by everyone. They embraced Paul and kissed him,";
csb[38] = "grieving most of all over his statement that they would never see his face again. And they accompanied him to the ship.";
kjv[1] = "And after the uproar was ceased, Paul called unto [him] the disciples, and embraced [them], and departed for to go into Macedonia.";
rsv[1] = "After the uproar ceased, Paul sent for the disciples and having exhorted them took leave of them and departed for Macedo\'nia.";
asv[1] = "And after the uproar ceased, Paul having sent for the disciples and exhorted them, took leave of them, and departed to go into Macedonia.";
yng[1] = "And after the ceasing of the tumult, Paul having called near the disciples, and having embraced [them], went forth to go on to Macedonia;";
dby[1] = "But after the tumult had ceased, Paul having called the disciples to [him] and embraced [them], went away to go to Macedonia.";
web[1] = "And after the uproar had ceased, Paul called to [him] the disciples, and embraced [them], and departed to go into Macedonia.";
hnv[1] = "After the uproar had ceased, Sha\'ul sent for the talmidim, took leave of them, and departed to go into Macedonia.";

web[2] = "And when he had gone over those parts, and had given them much exhortation, he came into Greece,";

kjv[3] = "And [there] abode three months. And when the Jews laid wait for him, as he was about to sail into Syria, he purposed to return through Macedonia.";
rsv[3] = "There he spent three months, and when a plot was made against him by the Jews as he was about to set sail for Syria, he determined to return through Macedo\'nia.";
asv[3] = "And when he had spent three months [there,] and a plot was laid against him by the Jews as he was about to set sail for Syria, he determined to return through Macedonia.";
yng[3] = "having made also three months\' [stay] -- a counsel of the Jews having been against him -- being about to set forth to Syria, there came [to him] a resolution of returning through Macedonia.";
dby[3] = "And having spent three months [there], a treacherous plot against him having been set on foot by the Jews, as he was going to sail to Syria, [the] resolution was adopted of returning through Macedonia.";
web[3] = "And [there] abode three months. And when the Jews laid wait for him, as he was about to sail into Syria, he purposed to return through Macedonia.";
hnv[3] = "When he had spent three months there, and a plot was made against him by Yehudim as he was about to set sail for Aram, he determined to return through Macedonia.";
vul[3] = "ubi cum fecisset menses tres factae sunt illi insidiae a Iudaeis navigaturo in Syriam habuitque consilium ut reverteretur per Macedoniam";

asv[4] = "And there accompanied him as far as Asia, Sopater of Beroea, [the son] of Pyrrhus; and of the Thessalonians, Aristarchus and Secundus; and Gaius of Derbe, and Timothy; and of Asia, Tychicus and Trophimus.";
yng[4] = "And there were accompanying him unto Asia, Sopater of Berea, and of Thessalonians Aristarchus and Secundus, and Gaius of Derbe, and Timotheus, and of Asiatics Tychicus and Trophimus;";
dby[4] = "And there accompanied him as far as Asia, Sopater [son] of Pyrrhus, a Berean; and of Thessalonians, Aristarchus and Secundus, and Gaius and Timotheus of Derbe, and of Asia, Tychicus and Trophimus.";
web[4] = "And there accompanied him into Asia Sopater of Berea; and of the Thessalonians, Aristarchus and Secundus; and Gaius of Derbe, and Timothy; and of Asia, Tychicus, and Trophimus.";

asv[9] = "And there sat in the window a certain young man named Eutychus, borne down with deep sleep; and as Paul discoursed yet longer, being borne down by his sleep he fell down from the third story, and was taken up dead.";
yng[9] = "and there was sitting a certain youth, by name Eutychus, upon the window -- being borne down by a deep sleep, Paul discoursing long -- he having sunk down from the sleep, fell down from the third story, and was lifted up dead.";
dby[9] = "And a certain youth, by name Eutychus, sitting at the window-opening, overpowered by deep sleep, while Paul discoursed very much at length, having been overpowered by the sleep, fell from the third story down to the bottom, and was taken up dead.";
