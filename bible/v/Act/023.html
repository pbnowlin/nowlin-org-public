csb[1] = "Paul looked straight at the Sanhedrin and said, &quot;Brothers, I have lived my life before God in all good conscience to this day.&quot;";
csb[2] = "The high priest Ananias ordered those who were standing next to him to strike him on the mouth.";
csb[3] = "Then Paul said to him, &quot;God is going to strike you, you whitewashed wall! You are sitting there judging me according to the law, and yet in violation of the law are you ordering me to be struck? &quot;";
csb[4] = "Those standing nearby said, &quot;Do you dare revile God\'s high priest? &quot;";
csb[5] = "&quot;I did not know, brothers, that he was the high priest,&quot; replied Paul. &quot;For it is written, You must not speak evil of a ruler of your people.&quot;";
csb[6] = "When Paul realized that one part of them were Sadducees and the other part were Pharisees, he cried out in the Sanhedrin, &quot;Brothers, I am a Pharisee, a son of Pharisees. I am being judged because of the hope of the resurrection of the dead! &quot;";
csb[7] = "When he said this, a dispute broke out between the Pharisees and the Sadducees, and the assembly was divided.";
csb[8] = "For the Sadducees say there is no resurrection, and neither angel nor spirit, but the Pharisees affirm them all.";
csb[9] = "The shouting grew loud, and some of the scribes of the Pharisees\' party got up and argued vehemently: &quot;We find nothing evil in this man. What if a spirit or an angel has spoken to him? &quot;";
csb[10] = "When the dispute became violent, the commander feared that Paul might be torn apart by them and ordered the troops to go down, take him away from them, and bring him into the barracks.";
csb[11] = "The following night, the Lord stood by him and said, &quot;Have courage! For as you have testified about me in Jerusalem, so it is necessary for you to testify in Rome.&quot;";
csb[12] = "When it was morning, the Jews formed a conspiracy and bound themselves under a curse not to eat or drink until they had killed Paul.";
csb[13] = "There were more than forty who had formed this plot.";
csb[14] = "These men went to the chief priests and elders and said, &quot;We have bound ourselves under a solemn curse that we won\'t eat anything until we have killed Paul.";
csb[15] = "&quot;So now you, along with the Sanhedrin, make a request to the commander that he bring him down to you as if you were going to investigate his case more thoroughly. But, before he gets near, we are ready to kill him.&quot;";
csb[16] = "But the son of Paul\'s sister, hearing about their ambush, came and entered the barracks and reported it to Paul.";
csb[17] = "Paul called one of the centurions and said, &quot;Take this young man to the commander, because he has something to report to him.&quot;";
csb[18] = "So he took him, brought him to the commander, and said, &quot;The prisoner Paul called me and asked me to bring this young man to you, because he has something to tell you.&quot;";
csb[19] = "The commander took him by the hand, led him aside, and inquired privately, &quot;What is it you have to report to me? &quot;";
csb[20] = "&quot;The Jews,&quot; he said, &quot;have agreed to ask you to bring Paul down to the Sanhedrin tomorrow, as though they are going to hold a somewhat more careful inquiry about him.";
csb[21] = "&quot;Don\'t let them persuade you, because there are more than forty of them lying in ambush -- men who have bound themselves under a curse not to eat or drink until they have killed him. Now they are ready, waiting for your consent.&quot;";
csb[22] = "So the commander dismissed the young man and instructed him, &quot;Don\'t tell anyone that you have informed me about this.&quot;";
csb[23] = "He summoned two of his centurions and said, &quot;Get two hundred soldiers ready with seventy cavalry and two hundred spearmen to go to Caesarea at nine tonight.";
csb[24] = "&quot;Also provide mounts for Paul to ride and bring him safely to Felix the governor.&quot;";
csb[25] = "He wrote the following letter:";
csb[26] = "Claudius Lysias, To the most excellent governor Felix: Greetings.";
csb[27] = "When this man had been seized by the Jews and was about to be killed by them, I arrived with my troops and rescued him because I learned that he is a Roman citizen.";
csb[28] = "Wanting to know the charge they were accusing him of, I brought him down before their Sanhedrin.";
csb[29] = "I found out that the accusations were concerning questions of their law, and that there was no charge that merited death or imprisonment.";
csb[30] = "When I was informed that there was a plot against the man, I sent him to you right away. I also ordered his accusers to state their case against him in your presence.";
csb[31] = "So the soldiers took Paul during the night and brought him to Antipatris as they were ordered.";
csb[32] = "The next day, they returned to the barracks, allowing the cavalry to go on with him.";
csb[33] = "When these men entered Caesarea and delivered the letter to the governor, they also presented Paul to him.";
csb[34] = "After he read it, he asked what province he was from. When he learned he was from Cilicia,";
csb[35] = "he said, &quot;I will give you a hearing whenever your accusers also get here.&quot; He ordered that he be kept under guard in Herod\'s palace.";
kjv[1] = "And Paul, earnestly beholding the council, said, Men [and] brethren, I have lived in all good conscience before God until this day.";

yng[1] = "And Paul having earnestly beheld the sanhedrim, said, `Men, brethren, I in all good conscience have lived to God unto this day;\'";

dby[3] = "Then Paul said to him, God will smite thee, whited wall. And *thou*, dost thou sit judging me according to the law, and breaking the law commandest me to be smitten?";

kjv[6] = "But when Paul perceived that the one part were Sadducees, and the other Pharisees, he cried out in the council, Men [and] brethren, I am a Pharisee, the son of a Pharisee: of the hope and resurrection of the dead I am called in question.";
rsv[6] = "But when Paul perceived that one part were Sad\'ducees and the other Pharisees, he cried out in the council, &quot;Brethren, I am a Pharisee, a son of Pharisees; with respect to the hope and the resurrection of the dead I am on trial.&quot;";
asv[6] = "But when Paul perceived that the one part were Sadducees and the other Pharisees, he cried out in the council, Brethren, I am a Pharisee, a son of Pharisees: touching the hope and resurrection of the dead I am called in question.";
yng[6] = "and Paul having known that the one part are Sadducees, and the other Pharisees, cried out in the sanhedrim, `Men, brethren, I am a Pharisee -- son of a Pharisee -- concerning hope and rising again of dead men I am judged.\'";
dby[6] = "But Paul, knowing that the one part [of them] were of the Sadducees and the other of the Pharisees, cried out in the council, Brethren, *I* am a Pharisee, son of Pharisees: *I* am judged concerning the hope and resurrection of [the] dead.";

hnv[6] = "But when Sha\'ul perceived that the one part were Tzedukim and the other Perushim, he cried out in the council, &quot;Men and brothers, I am a Parush, a son of Perushim. Concerning the hope and resurrection of the dead I am being judged!&quot;";
vul[6] = "sciens autem Paulus quia una pars esset Sadducaeorum et altera Pharisaeorum exclamavit in concilio viri fratres ego Pharisaeus sum filius Pharisaeorum de spe et resurrectione mortuorum ego iudicor";

kjv[10] = "And when there arose a great dissension, the chief captain, fearing lest Paul should have been pulled in pieces of them, commanded the soldiers to go down, and to take him by force from among them, and to bring [him] into the castle.";
rsv[10] = "And when the dissension became violent, the tribune, afraid that Paul would be torn in pieces by them, commanded the soldiers to go down and take him by force from among them and bring him into the barracks.";
asv[10] = "And when there arose a great dissension, the chief captain, fearing lest Paul should be torn in pieces by them, commanded the soldiers to go down and take him by force from among them, and bring him into the castle.";

dby[10] = "And a great tumult having arisen, the chiliarch, fearing lest Paul should have been torn in pieces by them, commanded the troop to come down and take him by force from the midst of them, and to bring [him] into the fortress.";

kjv[11] = "And the night following the Lord stood by him, and said, Be of good cheer, Paul: for as thou hast testified of me in Jerusalem, so must thou bear witness also at Rome.";
rsv[11] = "The following night the Lord stood by him and said, &quot;Take courage, for as you have testified about me at Jerusalem, so you must bear witness also at Rome.&quot;";
asv[11] = "And the night following the Lord stood by him, and said, Be of good cheer: for as thou hast testified concerning me at Jerusalem, so must thou bear witness also at Rome.";
yng[11] = "And on the following night, the Lord having stood by him, said, `Take courage, Paul, for as thou didst fully testify the things concerning me at Jerusalem, so it behoveth thee also at Rome to testify.\'";
dby[11] = "But the following night the Lord stood by him, and said, Be of good courage; for as thou hast testified the things concerning me at Jerusalem, so thou must bear witness at Rome also.";

yng[12] = "And day having come, certain of the Jews having made a concourse, did anathematize themselves, saying neither to eat nor to drink till they may kill Paul;";

yng[14] = "who having come near to the chief priests and to the elders said, `With an anathema we did anathematize ourselves -- to taste nothing till we have killed Paul;";
dby[14] = "and they went to the chief priests and elders, and said, We have cursed ourselves with a curse to taste nothing until we kill Paul.";
web[14] = "And they came to the chief priests and elders, and said, We have bound ourselves under a great curse, that we will eat nothing until we have slain Paul.";
hnv[14] = "They came to the chief Kohanim and the Zakenim, and said, &quot;We have bound ourselves under a great curse, to taste nothing until we have killed Sha\'ul.";
vul[14] = "qui accesserunt ad principes sacerdotum et seniores et dixerunt devotione devovimus nos nihil gustaturos donec occidamus Paulum";
kjv[15] = "Now therefore ye with the council signify to the chief captain that he bring him down unto you to morrow, as though ye would enquire something more perfectly concerning him: and we, or ever he come near, are ready to kill him.";
rsv[15] = "You therefore, along with the council, give notice now to the tribune to bring him down to you, as though you were going to determine his case more exactly. And we are ready to kill him before he comes near.&quot;";
asv[15] = "Now therefore do ye with the council signify to the chief captain that he bring him down unto you, as though ye would judge of his case more exactly: and we, before he comes near, are ready to slay him.";
yng[15] = "now, therefore, ye, signify ye to the chief captain, with the sanhedrim, that to-morrow he may bring him down unto you, as being about to know more exactly the things concerning him; and we, before his coming nigh, are ready to put him to death.\'";
dby[15] = "Now therefore do ye with the council make a representation to the chiliarch so that he may bring him down to you, as about to determine more precisely what concerns him, and we, before he draws near, are ready to kill him.";
web[15] = "Now therefore ye with the council signify to the chief captain, that he bring him down to you to-morrow, as though ye would inquire something more perfectly concerning him: and we, before he shall come near, are ready to kill him.";
hnv[15] = "Now therefore, you with the council inform the commanding officer that he should bring him down to you tomorrow, as though you were going to judge his case more exactly. We are ready to kill him before he comes near.&quot;";
vul[15] = "nunc ergo vos notum facite tribuno cum concilio ut producat illum ad vos tamquam aliquid certius cognituri de eo nos vero priusquam adpropiet parati sumus interficere illum";

yng[16] = "And the son of Paul\'s sister having heard of the lying in wait, having gone and entered into the castle, told Paul,";

yng[17] = "and Paul having called near one of the centurions, said, `This young man lead unto the chief captain, for he hath something to tell him.\'";
dby[17] = "And Paul, having called one of the centurions, said, Take this youth to the chiliarch, for he has something to report to him.";
web[17] = "Then Paul called one of the centurions to [him], and said, Bring this young man to the chief captain: for he hath a certain thing to tell him.";
hnv[17] = "Sha\'ul summoned one of the centurions, and said, &quot;Bring this young man to the commanding officer, for he has something to tell him.&quot;";
vul[17] = "vocans autem Paulus ad se unum ex centurionibus ait adulescentem hunc perduc ad tribunum habet enim aliquid indicare illi";
kjv[18] = "So he took him, and brought [him] to the chief captain, and said, Paul the prisoner called me unto [him], and prayed me to bring this young man unto thee, who hath something to say unto thee.";
rsv[18] = "So he took him and brought him to the tribune and said, &quot;Paul the prisoner called me and asked me to bring this young man to you, as he has something to say to you.&quot;";
asv[18] = "So he took him, and brought him to the chief captain, and saith, Paul the prisoner called me unto him, and asked me to bring this young man unto thee, who hath something to say to thee.";
yng[18] = "He indeed, then, having taken him, brought him unto the chief captain, and saith, `The prisoner Paul, having called me near, asked [me] this young man to bring unto thee, having something to say to thee.\'";
dby[18] = "He therefore, having taken him with [him], led him to the chiliarch, and says, The prisoner Paul called me to [him] and asked me to lead this youth to thee, who has something to say to thee.";
web[18] = "So he took him, and brought [him] to the chief captain, and said, Paul the prisoner called me to [him], and prayed me to bring this young man to thee, who hath something to say to thee.";
hnv[18] = "So he took him, and brought him to the commanding officer, and said, &quot;Sha\'ul, the prisoner, summoned me and asked me to bring this young man to you, who has something to tell you.&quot;";
vul[18] = "et ille quidem adsumens eum duxit ad tribunum et ait vinctus Paulus vocans rogavit me hunc adulescentem perducere ad te habentem aliquid loqui tibi";
kjv[19] = "Then the chief captain took him by the hand, and went [with him] aside privately, and asked [him], What is that thou hast to tell me?";
rsv[19] = "The tribune took him by the hand, and going aside asked him privately, &quot;What is it that you have to tell me?&quot;";
asv[19] = "And the chief captain took him by the hand, and going aside asked him privately, What is it that thou hast to tell me?";
yng[19] = "And the chief captain having taken him by the hand, and having withdrawn by themselves, inquired, `What is that which thou hast to tell me?\'";
dby[19] = "And the chiliarch having taken him by the hand, and having gone apart in private, inquired, What is it that thou hast to report to me?";
web[19] = "Then the chief captain took him by the hand, and went [with him] aside privately, and asked [him], What is that thou hast to tell me?";
hnv[19] = "The commanding officer took him by the hand, and going aside, asked him privately, &quot;What is it that you have to tell me?&quot;";
vul[19] = "adprehendens autem tribunus manum illius secessit cum eo seorsum et interrogavit illum quid est quod habes indicare mihi";
kjv[20] = "And he said, The Jews have agreed to desire thee that thou wouldest bring down Paul to morrow into the council, as though they would enquire somewhat of him more perfectly.";
rsv[20] = "And he said, &quot;The Jews have agreed to ask you to bring Paul down to the council tomorrow, as though they were going to inquire somewhat more closely about him.";
asv[20] = "And he said, The Jews have agreed to ask thee to bring down Paul tomorrow unto the council, as though thou wouldest inquire somewhat more exactly concerning him.";
yng[20] = "and he said -- `The Jews agreed to request thee, that to-morrow to the sanhedrim thou mayest bring down Paul, as being about to enquire something more exactly concerning him;";
dby[20] = "And he said, The Jews have agreed together to make a request to thee, that thou mayest bring Paul down to-morrow into the council, as about to inquire something more precise concerning him.";
web[20] = "And he said, The Jews have agreed to desire thee, that thou wouldst bring down Paul to-morrow into the council, as though they would inquire somewhat concerning him more perfectly.";
hnv[20] = "He said, &quot;The Yehudim have agreed to ask you to bring Sha\'ul down to the council tomorrow, as though intending to inquire somewhat more accurately concerning him.";
vul[20] = "ille autem dixit Iudaeis convenit rogare te ut crastina die Paulum producas in concilium quasi aliquid certius inquisituri sint de illo";
kjv[21] = "But do not thou yield unto them: for there lie in wait for him of them more than forty men, which have bound themselves with an oath, that they will neither eat nor drink till they have killed him: and now are they ready, looking for a promise from thee.";
rsv[21] = "But do not yield to them; for more than forty of their men lie in ambush for him, having bound themselves by an oath neither to eat nor drink till they have killed him; and now they are ready, waiting for the promise from you.&quot;";
asv[21] = "Do not thou therefore yield unto them: for there lie in wait for him of them more than forty men, who have bound themselves under a curse, neither to eat nor to drink till they have slain him: and now are they ready, looking for the promise from thee.";
yng[21] = "thou, therefore, mayest thou not yield to them, for there lie in wait for him of them more than forty men, who did anathematize themselves -- not to eat nor to drink till they kill him, and now they are ready, waiting for the promise from thee.\'";
dby[21] = "Do not thou then be persuaded by them, for there lie in wait for him of them more than forty men, who have put themselves under a curse neither to eat nor drink till they kill him; and now they are ready waiting the promise from thee.";
web[21] = "But do not thou yield to them: for there are of them who lie in wait for him more than forty men, who have bound themselves with an oath, that they will neither eat nor drink till they have killed him: and now they are ready, looking for a promise from thee.";
hnv[21] = "Therefore don\'t yield to them, for more than forty men lie in wait for him, who have bound themselves under a curse neither to eat nor to drink until they have killed him. Now they are ready, looking for the promise from you.&quot;";
vul[21] = "tu vero ne credideris illis insidiantur enim ei ex eis viri amplius quadraginta qui se devoverunt non manducare neque bibere donec interficiant eum et nunc parati sunt expectantes promissum tuum";
kjv[22] = "So the chief captain [then] let the young man depart, and charged [him, See thou] tell no man that thou hast shewed these things to me.";
rsv[22] = "So the tribune dismissed the young man, charging him, &quot;Tell no one that you have informed me of this.&quot;";
asv[22] = "So the chief captain let the young man go, charging him, Tell no man that thou hast signified these things to me.";
yng[22] = "The chief captain, then, indeed, let the young man go, having charged [him] to tell no one, `that these things thou didst shew unto me;\'";
dby[22] = "The chiliarch then dismissed the youth, commanding [him], Utter to no one that thou hast represented these things to me.";
web[22] = "So the chief captain [then] let the young man depart, and charged [him], [See thou] tell no man that thou hast shown these things to me.";
hnv[22] = "So the commanding officer let the young man go, charging him, &quot;Tell no one that you have revealed these things to me.&quot;";
vul[22] = "tribunus igitur dimisit adulescentem praecipiens ne cui loqueretur quoniam haec nota sibi fecisset";
kjv[23] = "And he called unto [him] two centurions, saying, Make ready two hundred soldiers to go to Caesarea, and horsemen threescore and ten, and spearmen two hundred, at the third hour of the night;";
rsv[23] = "Then he called two of the centurions and said, &quot;At the third hour of the night get ready two hundred soldiers with seventy horsemen and two hundred spearmen to go as far as Caesare\'a.";
asv[23] = "And he called unto him two of the centurions, and said, Make ready two hundred soldiers to go as far as Caesarea, and horsemen threescore and ten, and spearmen two hundred, at the third hour of the night:";
yng[23] = "and having called near a certain two of the centurions, he said, `Make ready soldiers two hundred, that they may go on unto Caesarea, and horsemen seventy, and spearmen two hundred, from the third hour of the night;";
dby[23] = "And having called to [him] certain two of the centurions, he said, Prepare two hundred soldiers that they may go as far as Caesarea, and seventy horsemen, and two hundred light-armed footmen, for the third hour of the night.";
web[23] = "And he called to [him] two centurions, saying, Make ready two hundred soldiers to go to Cesarea, and seventy horsemen, and spearmen two hundred, at the third hour of the night;";
hnv[23] = " He called to himself two of the centurions, and said, &quot;Prepare two hundred soldiers to go as far as Caesarea, with seventy horsemen, and two hundred men armed with spears, at the third hour of the night.&quot;";
vul[23] = "et vocatis duobus centurionibus dixit illis parate milites ducentos ut eant usque Caesaream et equites septuaginta et lancearios ducentos a tertia hora noctis";
kjv[24] = "And provide [them] beasts, that they may set Paul on, and bring [him] safe unto Felix the governor.";
rsv[24] = "Also provide mounts for Paul to ride, and bring him safely to Felix the governor.&quot;";
asv[24] = "and [he bade them] provide beasts, that they might set Paul thereon, and bring him safe unto Felix the governor.";
yng[24] = "beasts also provide, that, having set Paul on, they may bring him safe unto Felix the governor;\'";
dby[24] = "And [he ordered them] to provide beasts, that they might set Paul on them and carry [him] safe through to Felix the governor,";
web[24] = "And provide [for them] beasts, that they may set Paul on, and bring [him] safe to Felix the governor.";
hnv[24] = "He asked them to provide animals, that they might set Sha\'ul on one, and bring him safely to Felix the governor.";
vul[24] = "et iumenta praeparate ut inponentes Paulum salvum perducerent ad Felicem praesidem";
kjv[25] = "And he wrote a letter after this manner:";
rsv[25] = "And he wrote a letter to this effect:";
asv[25] = "And he wrote a letter after this form:";
yng[25] = "he having written a letter after this description:";
dby[25] = "having written a letter, couched in this form:";
web[25] = "And he wrote a letter after this manner:";
hnv[25] = "He wrote a letter like this:";
vul[25] = "[Vulgate 23:26a] scribens epistulam continentem";
kjv[26] = "Claudius Lysias unto the most excellent governor Felix [sendeth] greeting.";
rsv[26] = "&quot;Claudius Lys\'ias to his Excellency the governor Felix, greeting.";
asv[26] = "Claudius Lysias unto the most excellent governor Felix, greeting.";
yng[26] = "`Claudius Lysias, to the most noble governor Felix, hail:";
dby[26] = "Claudius Lysias to the most excellent governor Felix, greeting.";
web[26] = "Claudius Lysias, to the most excellent governor Felix, [sendeth] greeting.";
hnv[26] = "&quot;Claudius Lysias to the most excellent governor Felix: Greetings.";
vul[26] = "[Vulgate 23:26b] haec Claudius Lysias optimo praesidi Felici salutem";
kjv[27] = "This man was taken of the Jews, and should have been killed of them: then came I with an army, and rescued him, having understood that he was a Roman.";
rsv[27] = "This man was seized by the Jews, and was about to be killed by them, when I came upon them with the soldiers and rescued him, having learned that he was a Roman citizen.";
asv[27] = "This man was seized by the Jews, and was about to be slain of them, when I came upon them with the soldiers and rescued him, having learned that he was a Roman.";
yng[27] = "This man having been taken by the Jews, and being about to be killed by them -- having come with the soldiery, I rescued him, having learned that he is a Roman;";
dby[27] = "This man, having been taken by the Jews, and being about to be killed by them, I came up with the military and took out [of their hands], having learned that he was a Roman.";
web[27] = "This man was taken by the Jews, and would have been killed by them: then I came with a body of soldiers, and rescued him, having understood that he was a Roman.";
hnv[27] = "&quot;This man was seized by the Yehudim, and was about to be killed by them, when I came with the soldiers and rescued him, having learned that he was a Roman.";
vul[27] = "virum hunc conprehensum a Iudaeis et incipientem interfici ab eis superveniens cum exercitu eripui cognito quia Romanus est";
kjv[28] = "And when I would have known the cause wherefore they accused him, I brought him forth into their council:";
rsv[28] = "And desiring to know the charge on which they accused him, I brought him down to their council.";
asv[28] = "And desiring to know the cause wherefore they accused him, I brought him down unto their council:";
yng[28] = "and, intending to know the cause for which they were accusing him, I brought him down to their sanhedrim,";
dby[28] = "And desiring to know the charge on which they accused him, I brought him down to their council;";
web[28] = "And when I would have known the cause for which they accused him, I brought him forth into their council:";
hnv[28] = "Desiring to know the cause why they accused him, I brought him down to their council.";
vul[28] = "volensque scire causam quam obiciebant illi deduxi eum in concilium eorum";
kjv[29] = "Whom I perceived to be accused of questions of their law, but to have nothing laid to his charge worthy of death or of bonds.";
rsv[29] = "I found that he was accused about questions of their law, but charged with nothing deserving death or imprisonment.";
asv[29] = "whom I found to be accused about questions of their law, but to have nothing laid to his charge worthy of death or of bonds.";
yng[29] = "whom I found accused concerning questions of their law, and having no accusation worthy of death or bonds;";
dby[29] = "whom I found to be accused of questions of their law, but to have no charge laid against him [making him] worthy of death or of bonds.";
web[29] = "Whom I perceived to be accused of questions of their law, but to have nothing laid to his charge worthy of death, or of bonds.";
hnv[29] = "I found him to be accused about questions of their law, but to have nothing laid to his charge worthy of death or of bonds.";
vul[29] = "quem inveni accusari de quaestionibus legis ipsorum nihil vero dignum morte aut vinculis habentem crimen";
kjv[30] = "And when it was told me how that the Jews laid wait for the man, I sent straightway to thee, and gave commandment to his accusers also to say before thee what [they had] against him. Farewell.";
rsv[30] = "And when it was disclosed to me that there would be a plot against the man, I sent him to you at once, ordering his accusers also to state before you what they have against him.&quot;";
asv[30] = "And when it was shown to me that there would be a plot against the man, I sent him to thee forthwith, charging his accusers also to speak against him before thee.";
yng[30] = "and a plot having been intimated to me against this man -- about to be of the Jews -- at once I sent unto thee, having given command also to the accusers to say the things against him before thee; be strong.\'";
dby[30] = "But having received information of a plot about to be put in execution against the man [by the Jews], I have immediately sent him to thee, commanding also his accusers to say before thee the things that are against him. [Farewell.]";
web[30] = "And when it was told to me that the Jews laid wait for the man, I sent forthwith to thee, and gave commandment to his accusers also, to say before thee what [they had] against him. Farewell.";
hnv[30] = "When I was told that the Yehudim lay in wait for the man, I sent him to you immediately, charging his accusers also to bring their accusations against him before you. Farewell.&quot;";
vul[30] = "et cum mihi perlatum esset de insidiis quas paraverunt ei misi ad te denuntians et accusatoribus ut dicant apud te";
kjv[31] = "Then the soldiers, as it was commanded them, took Paul, and brought [him] by night to Antipatris.";
rsv[31] = "So the soldiers, according to their instructions, took Paul and brought him by night to Antip\'atris.";
asv[31] = "So the soldiers, as it was commanded them, took Paul and brought him by night to Antipatris.";
yng[31] = "Then, indeed, the soldiers according to that directed them, having taken up Paul, brought him through the night to Antipatris,";
dby[31] = "The soldiers therefore, according to what was ordered them, took Paul and brought him by night to Antipatris,";
web[31] = "Then the soldiers, as it was commanded them, took Paul, and brought [him] by night to Antipatris.";
hnv[31] = "So the soldiers, carrying out their orders, took Sha\'ul and brought him by night to Antipatris.";
vul[31] = "milites ergo secundum praeceptum sibi adsumentes Paulum duxerunt per noctem in Antipatridem";
kjv[32] = "On the morrow they left the horsemen to go with him, and returned to the castle:";
rsv[32] = "And on the morrow they returned to the barracks, leaving the horsemen to go on with him.";
asv[32] = "But on the morrow they left the horsemen to go with him, and returned to the castle:";
yng[32] = "and on the morrow, having suffered the horsemen to go on with him, they returned to the castle;";
dby[32] = "and on the morrow, having left the horsemen to go with him, returned to the fortress.";
web[32] = "On the morrow they left the horsemen to go with him, and returned to the castle:";
hnv[32] = "But on the next day they left the horsemen to go with him, and returned to the barracks.";
vul[32] = "et postera die dimissis equitibus ut irent cum eo reversi sunt ad castra";
kjv[33] = "Who, when they came to Caesarea, and delivered the epistle to the governor, presented Paul also before him.";
rsv[33] = "When they came to Caesare\'a and delivered the letter to the governor, they presented Paul also before him.";
asv[33] = "and they, when they came to Caesarea and delivered the letter to the governor, presented Paul also before him.";
yng[33] = "those having entered into Caesarea, and delivered the letter to the governor, did present also Paul to him.";
dby[33] = "And these, having entered into Caesarea, and given up the letter to the governor, presented Paul also to him.";
web[33] = "Who, when they came to Cesarea, and delivered the epistle to the governor, presented Paul also before him.";
hnv[33] = " When they came to Caesarea and delivered the letter to the governor, they also presented Sha\'ul to him.";
vul[33] = "qui cum venissent Caesaream et tradidissent epistulam praesidi statuerunt ante illum et Paulum";
kjv[34] = "And when the governor had read [the letter], he asked of what province he was. And when he understood that [he was] of Cilicia;";
rsv[34] = "On reading the letter, he asked to what province he belonged. When he learned that he was from Cili\'cia";
asv[34] = "And when he had read it, he asked of what province he was; and when he understood that he was of Cilicia,";
yng[34] = "And the governor having read [it], and inquired of what province he is, and understood that [he is] from Cilicia;";
dby[34] = "And having read [it], and asked of what eparchy he was, and learned that [he was] of Cilicia,";
web[34] = "And when the governor had read [the letter], he asked of what province he was. And when he understood that [he was] of Cilicia,";
hnv[34] = "When the governor had read it, he asked what province he was from. When he understood that he was from Cilicia, he said,";
vul[34] = "cum legisset autem et interrogasset de qua provincia esset et cognoscens quia de Cilicia";
kjv[35] = "I will hear thee, said he, when thine accusers are also come. And he commanded him to be kept in Herod\'s judgment hall.";
rsv[35] = "he said, &quot;I will hear you when your accusers arrive.&quot; And he commanded him to be guarded in Herod\'s praetorium.";
asv[35] = "I will hear thee fully, said he, when thine accusers also are come: and he commanded him to be kept in Herod\'s palace.";
yng[35] = "`I will hear thee -- said he -- when thine accusers also may have come;\' he also commanded him to be kept in the praetorium of Herod.";
dby[35] = "he said, I will hear thee fully when thine accusers also are arrived. And he commanded him to be kept in Herod\'s praetorium.";
web[35] = "I will hear thee, said he, when thy accusers also have come. And he commanded him to be kept in Herod\'s judgment-hall.";
hnv[35] = "&quot;I will hear you fully when your accusers also arrive.&quot; He commanded that he be kept in Herod\'s palace.";
vul[35] = "audiam te inquit cum et accusatores tui venerint iussitque in praetorio Herodis custodiri eum";
