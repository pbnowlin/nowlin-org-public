csb[1] = "Now the allotment for the tribe of the descendants of Judah by their clans was in the southernmost region, south to the Wilderness of Zin and over to the border of Edom.";
csb[2] = "Their southern border began at the tip of the Dead Sea on the south bay";
csb[3] = "and went south of the Scorpions\' Ascent, proceeded to Zin, ascended to the south of Kadesh-barnea, passed Hezron, ascended to Addar, and turned to Karka.";
csb[4] = "It proceeded to Azmon and to the Brook of Egypt and so the border ended at the Mediterranean Sea. This is your southern border.";
csb[5] = "Now the eastern border was along the Dead Sea to the mouth of the Jordan. The border on the north side was from the bay of the sea at the mouth of the Jordan.";
csb[6] = "It ascended to Beth-hoglah, proceeded north of Beth-arabah, and ascended to the Stone of Bohan son of Reuben.";
csb[7] = "Then the border ascended to Debir from the Valley of Achor, turning north to the Gilgal that is opposite the Ascent of Adummim, which is south of the ravine. The border proceeded to the Waters of En-shemesh and ended at En-rogel.";
csb[8] = "From there the border ascended Ben Hinnom Valley to the southern Jebusite slope (that is, Jerusalem) and ascended to the top of the hill that faces Hinnom Valley on the west, at the northern end of Rephaim Valley.";
csb[9] = "From the top of the hill the border curved to the spring of the Waters of Nephtoah, went to the cities of Mount Ephron, and then curved to Baalah (that is, Kiriath-jearim).";
csb[10] = "The border turned westward from Baalah to Mount Seir, went to the northern slope of Mount Jearim (that is, Chesalon), descended to Beth-shemesh, and proceeded to Timnah.";
csb[11] = "Then the border reached to the slope north of Ekron, curved to Shikkeron, proceeded to Mount Baalah, went to Jabneel, and ended at the Mediterranean Sea.";
csb[12] = "Now the western border was the coastline of the Mediterranean Sea. This was the boundary of the descendants of Judah around their clans.";
csb[13] = "He gave Caleb son of Jephunneh the following portion among the descendants of Judah based on the LORD\'s instruction to Joshua: Kiriath-arba (that is, Hebron; Arba was the father of Anak).";
csb[14] = "Caleb drove out from there the three sons of Anak: Sheshai, Ahiman, and Talmai, descendants of Anak.";
csb[15] = "From there he marched against the inhabitants of Debir, which used to be called Kiriath-sepher,";
csb[16] = "and Caleb said, &quot;Whoever attacks and captures Kiriath-sepher, I will give my daughter Achsah to him as a wife.&quot;";
csb[17] = "So Othniel son of Caleb\'s brother, Kenaz, captured it, and Caleb gave his daughter Achsah to him as a wife.";
csb[18] = "When she arrived, she persuaded Othniel to ask her father for a field. As she got off her donkey, Caleb asked her, &quot;What can I do for you? &quot;";
csb[19] = "She replied, &quot;Give me a blessing. Since you have given me land in the Negev, give me the springs also.&quot; So he gave her the upper and lower springs.";
csb[20] = "This was the inheritance of the tribe of the descendants of Judah by their clans.";
csb[21] = "These were the outermost cities of the tribe of the descendants of Judah toward the border of Edom in the Negev: Kabzeel, Eder, Jagur,";
csb[22] = "Kinah, Dimonah, Adadah,";
csb[23] = "Kedesh, Hazor, Ithnan,";
csb[24] = "Ziph, Telem, Bealoth,";
csb[25] = "Hazor-hadattah, Kerioth-hezron (that is, Hazor),";
csb[26] = "Amam, Shema, Moladah,";
csb[27] = "Hazar-gaddah, Heshmon, Beth-pelet,";
csb[28] = "Hazar-shual, Beer-sheba, Biziothiah,";
csb[29] = "Baalah, Iim, Ezem,";
csb[30] = "Eltolad, Chesil, Hormah,";
csb[31] = "Ziklag, Madmannah, Sansannah,";
csb[32] = "Lebaoth, Shilhim, Ain, and Rimmon -- twenty-nine cities in all, with their settlements.";
csb[33] = "In the Judean foothills: Eshtaol, Zorah, Ashnah,";
csb[34] = "Zanoah, En-gannim, Tappuah, Enam,";
csb[35] = "Jarmuth, Adullam, Socoh, Azekah,";
csb[36] = "Shaaraim, Adithaim, Gederah, and Gederothaim -- fourteen cities, with their settlements;";
csb[37] = "Zenan, Hadashah, Migdal-gad,";
csb[38] = "Dilan, Mizpeh, Jokthe-el,";
csb[39] = "Lachish, Bozkath, Eglon,";
csb[40] = "Cabbon, Lahmam, Chitlish,";
csb[41] = "Gederoth, Beth-dagon, Naamah, and Makkedah -- sixteen cities, with their settlements;";
csb[42] = "Libnah, Ether, Ashan,";
csb[43] = "Iphtah, Ashnah, Nezib,";
csb[44] = "Keilah, Achzib, and Mareshah -- nine cities, with their settlements;";
csb[45] = "Ekron, with its surrounding villages and settlements;";
csb[46] = "from Ekron to the sea, all the cities near Ashdod, with their settlements;";
csb[47] = "Ashdod, with its surrounding villages and settlements; Gaza, with its surrounding villages and settlements, to the Brook of Egypt and the coastline of the Mediterranean Sea.";
csb[48] = "In the hill country: Shamir, Jattir, Socoh,";
csb[49] = "Dannah, Kiriath-sannah (that is, Debir),";
csb[50] = "Anab, Eshtemoh, Anim,";
csb[51] = "Goshen, Holon, and Giloh -- eleven cities, with their settlements;";
csb[52] = "Arab, Dumah, Eshan,";
csb[53] = "Janim, Beth-tappuah, Aphekah,";
csb[54] = "Humtah, Kiriath-arba (that is, Hebron), and Zior -- nine cities, with their settlements;";
csb[55] = "Maon, Carmel, Ziph, Juttah,";
csb[56] = "Jezreel, Jokdeam, Zanoah,";
csb[57] = "Kain, Gibeah, and Timnah -- ten cities, with their settlements;";
csb[58] = "Halhul, Beth-zur, Gedor,";
csb[59] = "Maarath, Beth-anoth, and Eltekon -- six cities, with their settlements;";
csb[60] = "Kiriath-baal (that is, Kiriath-jearim), and Rabbah -- two cities, with their settlements.";
csb[61] = "In the wilderness: Beth-arabah, Middin, Secacah,";
csb[62] = "Nibshan, the City of Salt, and En-gedi -- six cities, with their settlements.";
csb[63] = "But the descendants of Judah could not drive out the Jebusites who lived in Jerusalem. So the Jebusites still live in Jerusalem among the descendants of Judah today.";
kjv[1] = "[This] then was the lot of the tribe of the children of Judah by their families; [even] to the border of Edom the wilderness of Zin southward [was] the uttermost part of the south coast.";
kjv[2] = "And their south border was from the shore of the salt sea, from the bay that looketh southward:";
kjv[3] = "And it went out to the south side to Maalehacrabbim, and passed along to Zin, and ascended up on the south side unto Kadeshbarnea, and passed along to Hezron, and went up to Adar, and fetched a compass to Karkaa:";
kjv[4] = "[From thence] it passed toward Azmon, and went out unto the river of Egypt; and the goings out of that coast were at the sea: this shall be your south coast.";
kjv[5] = "And the east border [was] the salt sea, [even] unto the end of Jordan. And [their] border in the north quarter [was] from the bay of the sea at the uttermost part of Jordan:";
kjv[6] = "And the border went up to Bethhogla, and passed along by the north of Betharabah; and the border went up to the stone of Bohan the son of Reuben:";
kjv[7] = "And the border went up toward Debir from the valley of Achor, and so northward, looking toward Gilgal, that [is] before the going up to Adummim, which [is] on the south side of the river: and the border passed toward the waters of Enshemesh, and the goings out thereof were at Enrogel:";
kjv[8] = "And the border went up by the valley of the son of Hinnom unto the south side of the Jebusite; the same [is] Jerusalem: and the border went up to the top of the mountain that [lieth] before the valley of Hinnom westward, which [is] at the end of the valley of the giants northward:";
kjv[9] = "And the border was drawn from the top of the hill unto the fountain of the water of Nephtoah, and went out to the cities of mount Ephron; and the border was drawn to Baalah, which [is] Kirjathjearim:";
kjv[10] = "And the border compassed from Baalah westward unto mount Seir, and passed along unto the side of mount Jearim, which [is] Chesalon, on the north side, and went down to Bethshemesh, and passed on to Timnah:";
kjv[11] = "And the border went out unto the side of Ekron northward: and the border was drawn to Shicron, and passed along to mount Baalah, and went out unto Jabneel; and the goings out of the border were at the sea.";
kjv[12] = "And the west border [was] to the great sea, and the coast [thereof]. This [is] the coast of the children of Judah round about according to their families.";
kjv[13] = "And unto Caleb the son of Jephunneh he gave a part among the children of Judah, according to the commandment of the LORD to Joshua, [even] the city of Arba the father of Anak, which [city is] Hebron.";
kjv[14] = "And Caleb drove thence the three sons of Anak, Sheshai, and Ahiman, and Talmai, the children of Anak.";
kjv[15] = "And he went up thence to the inhabitants of Debir: and the name of Debir before [was] Kirjathsepher.";
kjv[16] = "And Caleb said, He that smiteth Kirjathsepher, and taketh it, to him will I give Achsah my daughter to wife.";
kjv[17] = "And Othniel the son of Kenaz, the brother of Caleb, took it: and he gave him Achsah his daughter to wife.";
kjv[18] = "And it came to pass, as she came [unto him], that she moved him to ask of her father a field: and she lighted off [her] ass; and Caleb said unto her, What wouldest thou?";
kjv[19] = "Who answered, Give me a blessing; for thou hast given me a south land; give me also springs of water. And he gave her the upper springs, and the nether springs.";
kjv[20] = "This [is] the inheritance of the tribe of the children of Judah according to their families.";
kjv[21] = "And the uttermost cities of the tribe of the children of Judah toward the coast of Edom southward were Kabzeel, and Eder, and Jagur,";
kjv[22] = "And Kinah, and Dimonah, and Adadah,";
kjv[23] = "And Kedesh, and Hazor, and Ithnan,";
kjv[24] = "Ziph, and Telem, and Bealoth,";
kjv[25] = "And Hazor, Hadattah, and Kerioth, [and] Hezron, which [is] Hazor,";
kjv[26] = "Amam, and Shema, and Moladah,";
kjv[27] = "And Hazargaddah, and Heshmon, and Bethpalet,";
kjv[28] = "And Hazarshual, and Beersheba, and Bizjothjah,";
kjv[29] = "Baalah, and Iim, and Azem,";
kjv[30] = "And Eltolad, and Chesil, and Hormah,";
kjv[31] = "And Ziklag, and Madmannah, and Sansannah,";
kjv[32] = "And Lebaoth, and Shilhim, and Ain, and Rimmon: all the cities [are] twenty and nine, with their villages:";
kjv[33] = "[And] in the valley, Eshtaol, and Zoreah, and Ashnah,";
kjv[34] = "And Zanoah, and Engannim, Tappuah, and Enam,";
kjv[35] = "Jarmuth, and Adullam, Socoh, and Azekah,";
kjv[36] = "And Sharaim, and Adithaim, and Gederah, and Gederothaim; fourteen cities with their villages:";
kjv[37] = "Zenan, and Hadashah, and Migdalgad,";
kjv[38] = "And Dilean, and Mizpeh, and Joktheel,";
kjv[39] = "Lachish, and Bozkath, and Eglon,";
kjv[40] = "And Cabbon, and Lahmam, and Kithlish,";
kjv[41] = "And Gederoth, Bethdagon, and Naamah, and Makkedah; sixteen cities with their villages:";
kjv[42] = "Libnah, and Ether, and Ashan,";
kjv[43] = "And Jiphtah, and Ashnah, and Nezib,";
kjv[44] = "And Keilah, and Achzib, and Mareshah; nine cities with their villages:";
kjv[45] = "Ekron, with her towns and her villages:";
kjv[46] = "From Ekron even unto the sea, all that [lay] near Ashdod, with their villages:";
kjv[47] = "Ashdod with her towns and her villages, Gaza with her towns and her villages, unto the river of Egypt, and the great sea, and the border [thereof]:";
kjv[48] = "And in the mountains, Shamir, and Jattir, and Socoh,";
kjv[49] = "And Dannah, and Kirjathsannah, which [is] Debir,";
kjv[50] = "And Anab, and Eshtemoh, and Anim,";
kjv[51] = "And Goshen, and Holon, and Giloh; eleven cities with their villages:";
kjv[52] = "Arab, and Dumah, and Eshean,";
kjv[53] = "And Janum, and Bethtappuah, and Aphekah,";
kjv[54] = "And Humtah, and Kirjatharba, which [is] Hebron, and Zior; nine cities with their villages:";
kjv[55] = "Maon, Carmel, and Ziph, and Juttah,";
kjv[56] = "And Jezreel, and Jokdeam, and Zanoah,";
kjv[57] = "Cain, Gibeah, and Timnah; ten cities with their villages:";
kjv[58] = "Halhul, Bethzur, and Gedor,";
kjv[59] = "And Maarath, and Bethanoth, and Eltekon; six cities with their villages:";
kjv[60] = "Kirjathbaal, which [is] Kirjathjearim, and Rabbah; two cities with their villages:";
kjv[61] = "In the wilderness, Betharabah, Middin, and Secacah,";
kjv[62] = "And Nibshan, and the city of Salt, and Engedi; six cities with their villages.";
kjv[63] = "As for the Jebusites the inhabitants of Jerusalem, the children of Judah could not drive them out: but the Jebusites dwell with the children of Judah at Jerusalem unto this day.";
rsv[1] = "The lot for the tribe of the people of Judah according to their families reached southward to the boundary of Edom, to the wilderness of Zin at the farthest south.";
asv[1] = "And the lot for the tribe of the children of Judah according to their families was unto the border of Edom, even to the wilderness of Zin southward, at the uttermost part of the south.";
yng[1] = "And the lot for the tribe of the sons of Judah, for their families, is unto the border of Edom; the wilderness of Zin southward, at the extremity of the south;";
dby[1] = "And the lot of the tribe of the children of Judah according to their families was: to the border of Edom, the wilderness of Zin, southward, in the extreme south.";
web[1] = "[This] then was the lot of the tribe of the children of Judah by their families; [even] to the border of Edom, the wilderness of Zin southward [was] the uttermost part of the south border.";
hnv[1] = "The lot for the tribe of the children of Yehudah according to their families was to the border of Edom, even to the wilderness of Tzin southward, at the uttermost part of the south.";
vul[1] = "igitur sors filiorum Iudae per cognationes suas ista fuit a termino Edom desertum Sin contra meridiem et usque ad extremam partem australis plagae";
rsv[2] = "And their south boundary ran from the end of the Salt Sea, from the bay that faces southward;";

yng[2] = "and to them the south border is at the extremity of the salt sea, from the bay which is looking southward;";
dby[2] = "And their southern border was from the end of the salt sea, from the tongue that turns southward;";
web[2] = "And their south border was from the shore of the salt-sea, from the bay that looketh southward:";
hnv[2] = "Their south border was from the uttermost part of the Salt Sea, from the bay that looks southward;";

rsv[3] = "it goes out southward of the ascent of Akrab\'bim, passes along to Zin, and goes up south of Ka\'desh-bar\'nea, along by Hezron, up to Addar, turns about to Karka,";
asv[3] = "and it went out southward of the ascent of Akrabbim, and passed along to Zin, and went up by the south of Kadesh-barnea, and passed along by Hezron, and went up to Addar, and turned about to Karka;";
yng[3] = "and it hath gone out unto the south to Maaleh-Akrabbim, and passed over to Zin, and gone up on the south to Kadesh-Barnea, and passed over [to] Hezron, and gone up to Adar, and turned round to Karkaa,";
dby[3] = "and it went out south of the ascent of Akrabbim, and passed on to Zin, and went up on the south of Kadesh-barnea, and passed to Hezron, and went up toward Addar, and turned toward Karkaah,";
web[3] = "And it went out to the south side to Maaleh-acrabbim, and passed along to Zin, and ascended on the south side to Kadesh-barnea, and passed along to Hezron, and went up to Adar, and fetched a compass to Karkaa:";
hnv[3] = "and it went out southward of the ascent of `Akrabbim, and passed along to Tzin, and went up by the south of Kadesh-Barnea, and passed along by Hetzron, and went up to Addar, and turned about to Karka;";
vul[3] = "egrediturque contra ascensum Scorpionis et pertransit in Sina ascenditque in Cadesbarne et pervenit in Esrom ascendens Addara et circumiens Caricaa";
rsv[4] = "passes along to Azmon, goes out by the Brook of Egypt, and comes to its end at the sea. This shall be your south boundary.";
asv[4] = "and it passed along to Azmon, and went out at the brook of Egypt; and the goings out of the border were at the sea: this shall be your south border.";
yng[4] = "and passed over [to] Azmon, and gone out [at] the brook of Egypt, and the outgoings of the border have been at the sea; this is to you the south border.";
dby[4] = "and passed on to Azmon, and went out by the torrent of Egypt; and the border ended at the sea. That shall be your border southward.";
web[4] = "[From thence] it passed towards Azmon, and went out to the river of Egypt; and the limits of that border were at the sea: this shall be your south limit.";
hnv[4] = "and it passed along to `Atzmon, and went out at the brook of Mitzrayim; and the goings out of the border were at the sea: this shall be your south border.";
vul[4] = "atque inde pertransiens in Asemona et perveniens ad torrentem Aegypti eruntque termini eius mare Magnum hic erit finis meridianae plagae";
rsv[5] = "And the east boundary is the Salt Sea, to the mouth of the Jordan. And the boundary on the north side runs from the bay of the sea at the mouth of the Jordan;";
asv[5] = "And the east border was the Salt Sea, even unto the end of the Jordan. And the border of the north quarter was from the bay of the sea at the end of the Jordan;";
yng[5] = "And the east border [is] the salt sea, unto the extremity of the Jordan, and the border at the north quarter [is] from the bay of the sea, at the extremity of the Jordan;";
dby[5] = "-- And the eastern border was the salt sea as far as the end of the Jordan. -- And the border on the north side was from the tongue of the salt sea, at the end of the Jordan;";
web[5] = "And the east border [was] the salt-sea, [even] to the end of Jordan: and [their] border in the north quarter [was] from the bay of the sea, at the uttermost part of Jordan:";
hnv[5] = "The east border was the Salt Sea, even to the end of the Yarden. The border of the north quarter was from the bay of the sea at the end of the Yarden;";
vul[5] = "ab oriente vero erit initium mare Salsissimum usque ad extrema Iordanis et ea quae respiciunt aquilonem a lingua maris usque ad eundem Iordanem fluvium";
rsv[6] = "and the boundary goes up to Beth-hoglah, and passes along north of Beth-arabah; and the boundary goes up to the stone of Bohan the son of Reuben;";
asv[6] = "and the border went up to Beth-hoglah, and passed along by the north of Beth-arabah; and the border went up to the stone of Bohan the son of Reuben;";
yng[6] = "and the border hath gone up [to] Beth-Hoglah, and passed over on the north of Beth-Arabah, and the border hath gone up [to] the stone of Bohan son of Reuben:";
dby[6] = "and the border went up toward Beth-hoglah, and passed north of Beth-Arabah; and the border went up to the stone of Bohan, the son of Reuben;";
web[6] = "And the border went up to Beth-hogla, and passed along by the north of Beth-arabah; and the border went up to the stone of Bohan the son of Reuben:";
hnv[6] = " and the border went up to Beit-Hoglah, and passed along by the north of Beit-Ha`aravah; and the border went up to the stone of Bohan the son of Re\'uven;";
vul[6] = "ascenditque terminus in Bethagla et transit ab aquilone in Betharaba ascendens ad lapidem Boem filii Ruben";
rsv[7] = "and the boundary goes up to Debir from the Valley of Achor, and so northward, turning toward Gilgal, which is opposite the ascent of Adum\'mim, which is on the south side of the valley; and the boundary passes along to the waters of En-she\'mesh, and ends at En-ro\'gel;";
asv[7] = "and the border went up to Debir from the valley of Achor, and so northward, looking toward Gilgal, that is over against the ascent of Adummim, which is on the south side of the river; and the border passed along to the waters of En-shemesh, and the goings out thereof were at En-rogel;";
yng[7] = "and the border hath gone up towards Debir from the valley of Achor, and northward looking unto Gilgal, which [is] over-against the ascent of Adummim, which [is] on the south of the brook, and the border hath passed over unto the waters of En-Shemesh, and its outgoings have been unto En-Rogel;";
dby[7] = "and the border went up toward Debir from the valley of Achor, and turned northward to Gilgal, which is opposite to the ascent of Adummim, which is on the south side of the torrent; and the border passed to the waters of En-shemesh, and ended at En-rogel;";
web[7] = "And the border went up towards Debir from the valley of Achor, and so northward looking towards Gilgal, that [is] before the going up to Adummim, which [is] on the south side of the river: and the border passed towards the waters of En-shemesh, and the borders of it were at En-rogel:";
hnv[7] = "and the border went up to Devir from the valley of `Akhor, and so northward, looking toward Gilgal, that is over against the ascent of Adummim, which is on the south side of the river; and the border passed along to the waters of `En-Shemesh, and the goings out of it were at `En-Rogel;";
vul[7] = "et tendens usque ad terminos Debera de valle Achor contra aquilonem respiciens Galgala quae est ex adverso ascensionis Adommim ab australi parte torrentis transitque aquas quae vocantur fons Solis et erunt exitus eius ad fontem Rogel";
rsv[8] = "then the boundary goes up by the valley of the son of Hinnom at the southern shoulder of the Jeb\'usite (that is, Jerusalem); and the boundary goes up to the top of the mountain that lies over against the valley of Hinnom, on the west, at the northern end of the valley of Reph\'aim;";
asv[8] = "and the border went up by the valley of the son of Hinnom unto the side of the Jebusite southward (the same is Jerusalem); and the border went up to the top of the mountain that lieth before the valley of Hinnom westward, which is at the uttermost part of the vale of Rephaim northward;";
yng[8] = "and the border hath gone up the valley of the son of Hinnom, unto the side of the Jebusite on the south (it [is] Jerusalem), and the border hath gone up unto the top of the hill-country which [is] on the front of the valley of Hinnom westward, which [is] in the extremity of the valley of the Rephaim northward;";
dby[8] = "and the border went up to the valley of the son of Hinnom, toward the south side of the Jebusite, that is, Jerusalem; and the border went up to the top of the mountain that is before the valley of Hinnom westward, which is at the end of the valley of Rephaim northward;";
web[8] = "And the border went up by the valley of the son of Hinnom, to the south side of the Jebusite; the same [is] Jerusalem: and the border went up to the top of the mountain that [lieth] before the valley of Hinnom westward, which [is] at the end of the valley of the giants northward:";
hnv[8] = "and the border went up by the valley of the son of Hinnom to the side of the Yevusi southward (the same is Yerushalayim); and the border went up to the top of the mountain that lies before the valley of Hinnom westward, which is at the uttermost part of the valley of Refa\'im northward;";
vul[8] = "ascenditque per convallem filii Ennom ex latere Iebusei ad meridiem haec est Hierusalem et inde se erigens ad verticem montis qui est contra Gehennom ad occidentem in summitate vallis Rafaim contra aquilonem";
rsv[9] = "then the boundary extends from the top of the mountain to the spring of the Waters of Nephto\'ah, and from there to the cities of Mount Ephron; then the boundary bends round to Ba\'alah (that is, Kir\'iath-je\'arim);";
asv[9] = "and the border extended from the top of the mountain unto the fountain of the waters of Nephtoah, and went out to the cities of mount Ephron; and the border extended to Baalah (the same is Kiriath-jearim);";
yng[9] = "and the border hath been marked out, from the top of the hill-country unto the fountain of the waters of Nephtoah, and hath gone out unto the cities of mount Ephron, and the border hath been marked out [to] Baalah, (it [is] Kirjath-Jearim);";
dby[9] = "and the border reached along from the top of the mountain toward the spring of the waters of Nephtoah, and went out toward the cities of mount Ephron; and the border reached along to Baalah, that is, Kirjath-jearim;";
web[9] = "And the border was drawn from the top of the hill to the fountain of the water of Nephtoah, and went out to the cities of mount Ephron; and the border was drawn to Baalah, which [is] Kirjath-jearim:";
hnv[9] = "and the border extended from the top of the mountain to the spring of the waters of Nefto\'ach, and went out to the cities of Mount `Efron; and the border extended to Ba`alah (the same is Kiryat-Ye`arim);";
vul[9] = "pertransitque a vertice montis usque ad fontem aquae Nepthoa et pervenit usque ad vicos montis Ephron inclinaturque in Bala quae est Cariathiarim id est urbs Silvarum";
rsv[10] = "and the boundary circles west of Ba\'alah to Mount Se\'ir, passes along to the northern shoulder of Mount Je\'arim (that is, Ches\'alon), and goes down to Beth-she\'mesh, and passes along by Timnah;";
asv[10] = "and the border turned about from Baalah westward unto mount Seir, and passed along unto the side of mount Jearim on the north (the same is Chesalon), and went down to Beth-shemesh, and passed along by Timnah;";
yng[10] = "and the border hath gone round from Baalah westward, unto mount Seir, and passed over unto the side of mount Jearim (it [is] Chesalon), on the north, and gone down [to] Beth-Shemesh, and passed over to Timnah;";
dby[10] = "and the border turned from Baalah westwards toward mount Seir, and passed toward the side of Har-jearim, that is, Chesalon, northwards, and went down to Beth-shemesh, and passed Timnah.";
web[10] = "And the border compassed from Baalah westward to mount Seir, and passed along to the side of mount Jearim (which [is] Chesalon) on the north side, and went down to Beth-shemesh, and passed on to Timnah:";
hnv[10] = "and the border turned about from Ba`alah westward to Mount Se`ir, and passed along to the side of Mount Ye`arim on the north (the same is Kesalon), and went down to Beth-shemesh, and passed along by Timnah;";
vul[10] = "et circuit de Bala contra occidentem usque ad montem Seir transitque iuxta latus montis Iarim ad aquilonem in Cheslon et descendit in Bethsames transitque in Thamna";
rsv[11] = "the boundary goes out to the shoulder of the hill north of Ekron, then the boundary bends round to Shik\'keron, and passes along to Mount Ba\'alah, and goes out to Jabneel; then the boundary comes to an end at the sea.";
asv[11] = "and the border went out unto the side of Ekron northward; and the border extended to Shikkeron, and passed along to mount Baalah, and went out at Jabneel; and the goings out of the border were at the sea.";
yng[11] = "and the border hath gone out unto the side of Ekron northward, and the border hath been marked out [to] Shicron, and hath passed over to mount Baalah, and gone out [to] Jabneel; and the outgoings of the border have been at the sea.";
dby[11] = "And the border went out to the side of Ekron northwards, and the border reached along toward Shicron, and passed mount Baalah, and went toward Jabneel; and the border ended at the sea.";
web[11] = "And the border went out to the side of Ekron northward: and the border was drawn to Shicron, and passed along to mount Baalah, and went out to Jabneel; and the terminations of the border were at the sea.";
hnv[11] = "and the border went out to the side of `Ekron northward; and the border extended to Shikron, and passed along to Mount Ba`alah, and went out at Yavne\'el; and the goings out of the border were at the sea.";
vul[11] = "et pervenit contra aquilonem partis Accaron ex latere inclinaturque Sechrona et transit montem Baala pervenitque in Iebnehel et maris Magni contra occidentem fine concluditur";
rsv[12] = "And the west boundary was the Great Sea with its coast-line. This is the boundary round about the people of Judah according to their families.";
asv[12] = "And the west border was to the great sea, and the border [thereof]. This is the border of the children of Judah round about according to their families.";
yng[12] = "And the west border [is] to the great sea, and [its] border; this [is] the border of the sons of Judah round about for their families.";
dby[12] = "-- And the west border is the great sea and [its] coast. This is the border of the children of Judah round about, according to their families.";
web[12] = "And the west border [was] to the great sea, and its coast: this [is] the border of the children of Judah round about, according to their families.";
hnv[12] = "The west border was to the great sea, and the border [of it]. This is the border of the children of Yehudah round about according to their families.";
vul[12] = "hii sunt termini filiorum Iuda per circuitum in cognationibus suis";
rsv[13] = "According to the commandment of the LORD to Joshua, he gave to Caleb the son of Jephun\'neh a portion among the people of Judah, Kir\'iath-ar\'ba, that is, Hebron (Arba was the father of Anak).";
asv[13] = "And unto Caleb the son of Jephunneh he gave a portion among the children of Judah, according to the commandment of Jehovah to Joshua, even Kiriath-arba, [which Arba was] the father of Anak (the same is Hebron).";
yng[13] = "And to Caleb son of Jephunneh hath he given a portion in the midst of the sons of Judah, according to the command of Jehovah to Joshua, [even] the city of Arba, father of Anak -- it [is] Hebron.";
dby[13] = "And to Caleb the son of Jephunneh he gave a portion among the children of Judah according to the commandment of Jehovah to Joshua, the city of Arba, the father of Anak, that is, Hebron.";
web[13] = "And to Caleb the son of Jephunneh he gave a part among the children of Judah, according to the commandment of the LORD to Joshua, [even] the city of Arba the father of Anak, which [city is] Hebron.";
hnv[13] = "To Kalev the son of Yefunneh he gave a portion among the children of Yehudah, according to the mitzvah of the LORD to Yehoshua, even Kiryat-Arba, [which Arba was] the father of `Anak (the same is Hevron).";
vul[13] = "Chaleb vero filio Iepphonne dedit partem in medio filiorum Iuda sicut praeceperat ei Dominus Cariatharbe patris Enach ipsa est Hebron";
rsv[14] = "And Caleb drove out from there the three sons of Anak, She\'shai and Ahi\'man and Talmai, the descendants of Anak.";
asv[14] = "And Caleb drove out thence the three sons of Anak: Sheshai, and Ahiman, and Talmai, the children of Anak.";
yng[14] = "And Caleb is dispossessing thence the three sons of Anak, Sheshai, and Ahiman, and Talmai, children of Anak,";
dby[14] = "And thence Caleb dispossessed the three sons of Anak, Sheshai and Ahiman and Talmai, who were born of Anak.";
web[14] = "And Caleb drove thence the three sons of Anak, Sheshai, and Ahiman, and Talmai, the children of Anak.";
hnv[14] = "Kalev drove out there the three sons of `Anak: Sheshai, and Achiman, and Talmai, the children of `Anak.";
vul[14] = "delevitque ex ea Chaleb tres filios Enach Sesai et Ahiman et Tholmai de stirpe Enach";
rsv[15] = "And he went up from there against the inhabitants of Debir; now the name of Debir formerly was Kir\'iath-se\'pher.";
asv[15] = "And he went up thence against the inhabitants of Debir: now the name of Debir beforetime was Kiriath-sepher.";
yng[15] = "and he goeth up thence unto the inhabitants of Debir; and the name of Debir formerly is Kirjath-Sepher.";
dby[15] = "And from there he went up against the inhabitants of Debir; now the name of Debir before was Kirjath-sepher.";
web[15] = "And he went up thence to the inhabitants of Debir: and the name of Debir before [was] Kirjath-sepher.";
hnv[15] = "He went up there against the inhabitants of Devir: now the name of Devir before was Kiryat Sepher.";
vul[15] = "atque inde conscendens venit ad habitatores Dabir quae prius vocabatur Cariathsepher id est civitas Litterarum";
rsv[16] = "And Caleb said, &quot;Whoever smites Kir\'iath-se\'pher, and takes it, to him will I give Achsah my daughter as wife.&quot;";
asv[16] = "And Caleb said, He that smiteth Kiriath-sepher, and taketh it, to him will I give Achsah my daughter to wife.";
yng[16] = "And Caleb saith, `He who smiteth Kirjath-Sephar, and hath captured it -- I have given to him Achsah my daughter for a wife.\'";
dby[16] = "And Caleb said, He that smites Kirjath-sepher and takes it, to him will I give Achsah my daughter as wife.";
web[16] = "And Caleb said, He that smiteth Kirjath-sepher, and taketh it, to him will I give Achsah my daughter for a wife.";
hnv[16] = "Kalev said, He who strikes Kiryat Sepher, and takes it, to him will I give `Akhsah my daughter as wife.";
vul[16] = "dixitque Chaleb qui percusserit Cariathsepher et ceperit eam dabo illi Axam filiam meam uxorem";
rsv[17] = "And Oth\'ni-el the son of Kenaz, the brother of Caleb, took it; and he gave him Achsah his daughter as wife.";
asv[17] = "And Othniel the son of Kenaz, the brother of Caleb, took it: and he gave him Achsah his daughter to wife.";
yng[17] = "And Othniel son of Kenaz, brother of Caleb, doth capture it, and he giveth to him Achsah his daughter for a wife.";
dby[17] = "And Othniel the son of Kenaz, the brother of Caleb, took it; and he gave him Achsah his daughter as wife.";
web[17] = "And Othniel the son of Kenaz, the brother of Caleb, took it: and he gave him Achsah his daughter for a wife.";
hnv[17] = "`Otni\'el the son of Kenaz, the brother of Kalev, took it: and he gave him `Akhsah his daughter as wife.";
vul[17] = "cepitque eam Othonihel filius Cenez frater Chaleb iunior deditque ei Axam filiam suam uxorem";
rsv[18] = "When she came to him, she urged him to ask her father for a field; and she alighted from her ass, and Caleb said to her, &quot;What do you wish?&quot;";
asv[18] = "And it came to pass, when she came [unto him], that she moved him to ask of her father a field: and she alighted from off her ass; and Caleb said, What wouldest thou?";
yng[18] = "And it cometh to pass, in her coming in, that she persuadeth him to ask from her father a field, and she lighteth from off the ass, and Caleb saith to her, `What -- to thee?\'";
dby[18] = "And it came to pass as she came, that she urged him to ask of her father a field; and she sprang down from the ass. And Caleb said to her, What wouldest thou?";
web[18] = "And it came to pass, as she came [to him], that she moved him to ask of her father a field. And she lighted off [her] ass; and Caleb said to her, What wouldst thou?";
hnv[18] = "It happened, when she came [to him], that she moved him to ask of her father a field: and she alighted from off her donkey; and Kalev said, What would you?";
vul[18] = "quae cum pergerent simul suasit viro ut peteret a patre suo agrum suspiravitque ut sedebat in asino cui Chaleb quid habes inquit";
rsv[19] = "She said to him, &quot;Give me a present; since you have set me in the land of the Negeb, give me also springs of water.&quot; And Caleb gave her the upper springs and the lower springs.";
asv[19] = "And she said, Give me a blessing; for that thou hast set me in the land of the South, give me also springs of water. And he gave her the upper springs and the nether springs.";
yng[19] = "And she saith, `Give to me a blessing; when the land of the south thou hast given me, then thou hast given to me springs of waters;\' and he giveth to her the upper springs and the lower springs.";
dby[19] = "And she said, Give me a blessing; for thou hast given me a southern land; give me also springs of water. Then he gave her the upper springs and the lower springs.";
web[19] = "Who answered, Give me a blessing; for thou hast given me a south land, give me also springs of water. And he gave her the upper springs, and the nether springs.";
hnv[19] = " She said, Give me a blessing; for that you have set me in the land of the South, give me also springs of water. He gave her the upper springs and the lower springs.";
vul[19] = "at illa respondit da mihi benedictionem terram australem et arentem dedisti mihi iunge et inriguam dedit itaque ei Chaleb inriguum superius et inferius";
