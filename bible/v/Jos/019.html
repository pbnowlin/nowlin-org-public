csb[1] = "The second lot came out for Simeon, for the tribe of his descendants by their clans, but their inheritance was within the inheritance given to Judah\'s descendants.";
csb[2] = "Their inheritance included Beer-sheba (or Sheba), Moladah,";
csb[3] = "Hazar-shual, Balah, Ezem,";
csb[4] = "Eltolad, Bethul, Hormah,";
csb[5] = "Ziklag, Beth-marcaboth, Hazar-susah,";
csb[6] = "Beth-lebaoth, and Sharuhen -- thirteen cities, with their settlements;";
csb[7] = "Ain, Rimmon, Ether, and Ashan -- four cities, with their settlements;";
csb[8] = "and all the settlements surrounding these cities as far as Baalath-beer (Ramah in the south). This was the inheritance of the tribe of Simeon\'s descendants by their clans.";
csb[9] = "The inheritance of Simeon\'s descendants was within the territory of Judah\'s descendants, because the share for Judah\'s descendants was too large. So Simeon\'s descendants received an inheritance within Judah\'s portion.";
csb[10] = "The third lot came up for Zebulun\'s descendants by their clans. The territory of their inheritance stretched as far as Sarid;";
csb[11] = "their border went up westward to Maralah, reached Dabbesheth, and met the brook east of Jokneam.";
csb[12] = "From Sarid, it turned due east along the border of Chisloth-tabor, went to Daberath, and went up to Japhia.";
csb[13] = "From there, it went due east to Gath-hepher and to Eth-kazin; it extended to Rimmon, curving around to Neah.";
csb[14] = "The border then circled around Neah on the north to Hannathon and ended at Iphtah-el Valley,";
csb[15] = "along with Kattath, Nahalal, Shimron, Idalah, and Bethlehem -- twelve cities, with their settlements.";
csb[16] = "This was the inheritance of Zebulun\'s descendants by their clans, these cities, with their settlements.";
csb[17] = "The fourth lot came out for the tribe of Issachar\'s descendants by their clans.";
csb[18] = "Their territory went to Jezreel, and included Chesulloth, Shunem,";
csb[19] = "Hapharaim, Shion, Anaharath,";
csb[20] = "Rabbith, Kishion, Ebez,";
csb[21] = "Remeth, En-gannim, En-haddah, and Beth-pazzez.";
csb[22] = "The border reached Tabor, Shahazumah, and Beth-shemesh, and ended at the Jordan -- sixteen cities, with their settlements.";
csb[23] = "This was the inheritance of the tribe of Issachar\'s descendants by their clans, the cities, with their settlements.";
csb[24] = "The fifth lot came out for the tribe of Asher\'s descendants by their clans.";
csb[25] = "Their boundary included Helkath, Hali, Beten, Achshaph,";
csb[26] = "Allammelech, Amad, and Mishal and reached westward to Carmel and Shihor-libnath.";
csb[27] = "It turned eastward to Beth-dagon, reached Zebulun and Iphtah-el Valley, north toward Beth-emek and Neiel, and went north to Cabul,";
csb[28] = "Ebron, Rehob, Hammon, and Kanah, as far as greater Sidon.";
csb[29] = "The boundary then turned to Ramah as far as the fortified city of Tyre; it turned back to Hosah and ended at the Mediterranean Sea, including Mahalab, Achzib,";
csb[30] = "Ummah, Aphek, and Rehob -- twenty-two cities, with their settlements.";
csb[31] = "This was the inheritance of the tribe of Asher\'s descendants by their clans, these cities with their settlements.";
csb[32] = "The sixth lot came out for Naphtali\'s descendants by their clans.";
csb[33] = "Their boundary went from Heleph and from the oak in Zaanannim, including Adami-nekeb and Jabneel, as far as Lakkum, and ended at the Jordan.";
csb[34] = "To the west, the boundary turned to Aznoth-tabor and went from there to Hukkok, reaching Zebulun on the south, Asher on the west, and Judah at the Jordan on the east.";
csb[35] = "The fortified cities were Ziddim, Zer, Hammath, Rakkath, Chinnereth,";
csb[36] = "Adamah, Ramah, Hazor,";
csb[37] = "Kedesh, Edrei, En-hazor,";
csb[38] = "Iron, Migdal-el, Horem, Beth-anath, and Beth-shemesh -- nineteen cities, with their settlements.";
csb[39] = "This was the inheritance of the tribe of Naphtali\'s descendants by their clans, the cities with their settlements.";
csb[40] = "The seventh lot came out for the tribe of Dan\'s descendants by their clans.";
csb[41] = "The territory of their inheritance included Zorah, Eshtaol, Ir-shemesh,";
csb[42] = "Shaalabbin, Aijalon, Ithlah,";
csb[43] = "Elon, Timnah, Ekron,";
csb[44] = "Eltekeh, Gibbethon, Baalath,";
csb[45] = "Jehud, Bene-berak, Gath-rimmon,";
csb[46] = "Me-jarkon, and Rakkon, with the territory facing Joppa.";
csb[47] = "When the territory of the descendants of Dan slipped out of their control, they went up and fought against Leshem, captured it, and struck it down with the sword. So they took possession of it, lived there, and renamed Leshem after their ancestor Dan.";
csb[48] = "This was the inheritance of the tribe of Dan\'s descendants by their clans, these cities with their settlements.";
csb[49] = "When they had finished distributing the land into its territories, the Israelites gave Joshua son of Nun an inheritance among them.";
csb[50] = "By the LORD\'s command, they gave him the city Timnath-serah in the hill country of Ephraim, which he requested. He rebuilt the city and lived in it.";
csb[51] = "These were the portions that the priest Eleazar, Joshua son of Nun, and the family heads distributed to the Israelite tribes by lot at Shiloh in the LORD\'s presence at the entrance to the tent of meeting. So they finished dividing up the land.";

kjv[9] = "Out of the portion of the children of Judah [was] the inheritance of the children of Simeon: for the part of the children of Judah was too much for them: therefore the children of Simeon had their inheritance within the inheritance of them.";
rsv[9] = "The inheritance of the tribe of Simeon formed part of the territory of Judah; because the portion of the tribe of Judah was too large for them, the tribe of Simeon obtained an inheritance in the midst of their inheritance.";
asv[9] = "Out of the part of the children of Judah was the inheritance of the children of Simeon; for the portion of the children of Judah was too much for them: therefore the children of Simeon had inheritance in the midst of their inheritance.";
yng[9] = "out of the portion of the sons of Judah [is] the inheritance of the sons of Simeon, for the portion of the sons of Judah hath been too much for them, and the sons of Simeon inherit in the midst of their inheritance.";
dby[9] = "Out of the lot of the children of Judah was the inheritance of the children of Simeon; for the portion of the children of Judah was too great for them, and the children of Simeon inherited within their inheritance.";
web[9] = "Out of the portion of the children of Judah [was] the inheritance of the children of Simeon: for the part of the children of Judah was too much for them: therefore the children of Simeon had their inheritance within the inheritance of them.";

kjv[47] = "And the coast of the children of Dan went out [too little] for them: therefore the children of Dan went up to fight against Leshem, and took it, and smote it with the edge of the sword, and possessed it, and dwelt therein, and called Leshem, Dan, after the name of Dan their father.";
rsv[47] = "When the territory of the Danites was lost to them, the Danites went up and fought against Leshem, and after capturing it and putting it to the sword they took possession of it and settled in it, calling Leshem, Dan, after the name of Dan their ancestor.";
asv[47] = "And the border of the children of Dan went out beyond them; for the children of Dan went up and fought against Leshem, and took it, and smote it with the edge of the sword, and possessed it, and dwelt therein, and called Leshem, Dan, after the name of Dan their father.";
yng[47] = "And the border of the sons of Dan goeth out from them, and the sons of Dan go up and fight with Leshem, and capture it, and smite it by the mouth of the sword, and possess it, and dwell in it, and call Leshem, Dan, according to the name of Dan their father.";
dby[47] = "And the border of the children of Dan ended with these; and the children of Dan went up and fought against Leshem, and took it, and smote it with the edge of the sword, and took possession of it, and dwelt in it, and called Leshem, Dan, after the name of Dan their father.";
web[47] = "And the border of the children of Dan, went out [too little] for them: therefore the children of Dan went up to fight against Leshem, and took it, and smote it with the edge of the sword, and possessed it, and dwelt in it, and called Leshem, Dan, after the name of Dan their father.";
hnv[47] = "The border of the children of Dan went out beyond them; for the children of Dan went up and fought against Leshem, and took it, and struck it with the edge of the sword, and possessed it, and lived therein, and called Leshem, Dan, after the name of Dan their father.";
vul[47] = "et ipso fine concluditur ascenderuntque filii Dan et pugnaverunt contra Lesem ceperuntque eam et percusserunt in ore gladii ac possederunt et habitaverunt in ea vocantes nomen eius Lesemdan ex nomine Dan patris sui";

hnv[48] = "This is the inheritance of the tribe of the children of Dan according to their families, these cities with their villages.";
vul[48] = "haec est possessio tribus filiorum Dan per cognationes suas urbes et viculi earum";
kjv[49] = "When they had made an end of dividing the land for inheritance by their coasts, the children of Israel gave an inheritance to Joshua the son of Nun among them:";
rsv[49] = "When they had finished distributing the several territories of the land as inheritances, the people of Israel gave an inheritance among them to Joshua the son of Nun.";
asv[49] = "So they made an end of distributing the land for inheritance by the borders thereof; and the children of Israel gave an inheritance to Joshua the son of Nun in the midst of them:";
yng[49] = "And they finish to give the land in inheritance, by its borders, and the sons of Israel give an inheritance to Joshua son of Nun in their midst;";
dby[49] = "And they ended dividing the land for inheritance according to its borders. And the children of Israel gave an inheritance to Joshua the son of Nun among them.";
web[49] = "When they had made an end of dividing the land for inheritance by their borders, the children of Israel gave an inheritance to Joshua the son of Nun among them:";
hnv[49] = "So they made an end of distributing the land for inheritance by the borders of it; and the children of Yisra\'el gave an inheritance to Yehoshua the son of Nun in the midst of them:";
vul[49] = "cumque conplesset terram sorte dividere singulis per tribus suas dederunt filii Israhel possessionem Iosue filio Nun in medio sui";
kjv[50] = "According to the word of the LORD they gave him the city which he asked, [even] Timnathserah in mount Ephraim: and he built the city, and dwelt therein.";
rsv[50] = "By command of the LORD they gave him the city which he asked, Tim\'nath-se\'rah in the hill country of E\'phraim; and he rebuilt the city, and settled in it.";
asv[50] = "according to the commandment of Jehovah they gave him the city which he asked, even Timnath-serah in the hill-country of Ephraim; and he built the city, and dwelt therein.";
yng[50] = "by the command of Jehovah they have given to him the city which he asked, Timnath-Serah, in the hill-country of Ephraim, and he buildeth the city and dwelleth in it.";
dby[50] = "According to the word of Jehovah they gave him the city that he asked, Timnath-serah in the hill-country of Ephraim; and he built the city, and dwelt in it.";
web[50] = "According to the word of the LORD they gave him the city which he asked, [even] Timnath-serah in mount Ephraim: and he built the city, and dwelt in it.";
hnv[50] = "according to the mitzvah of the LORD they gave him the city which he asked, even Timnat-Serach in the hill-country of Efrayim; and he built the city, and lived therein.";
vul[50] = "iuxta praeceptum Domini urbem quam postulavit Thamnathseraa in monte Ephraim et aedificavit civitatem habitavitque in ea";
kjv[51] = "These [are] the inheritances, which Eleazar the priest, and Joshua the son of Nun, and the heads of the fathers of the tribes of the children of Israel, divided for an inheritance by lot in Shiloh before the LORD, at the door of the tabernacle of the congregation. So they made an end of dividing the country.";
rsv[51] = "These are the inheritances which Elea\'zar the priest and Joshua the son of Nun and the heads of the fathers\' houses of the tribes of the people of Israel distributed by lot at Shiloh before the LORD, at the door of the tent of meeting. So they finished dividing the land.";
asv[51] = "These are the inheritances, which Eleazar the priest, and Joshua the son of Nun, and the heads of the fathers\' [houses] of the tribes of the children of Israel, distributed for inheritance by lot in Shiloh before Jehovah, at the door of the tent of meeting. So they made an end of dividing the land.";
yng[51] = "These [are] the inheritances which Eleazar the priest, and Joshua son of Nun, and the heads of the fathers of the tribes of the sons of Israel, have caused to inherit by lot, in Shiloh, before Jehovah, at the opening of the tent of meeting; and they finish to apportion the land.";
dby[51] = "These were the inheritances, which Eleazar the priest, and Joshua the son of Nun, and the chief fathers of the tribes of the children of Israel, distributed by lot in Shiloh before Jehovah, at the entrance of the tent of meeting. And they ended dividing the land.";
web[51] = "These [are] the inheritances which Eleazar the priest, and Joshua the son of Nun, and the heads of the fathers of the tribes of the children of Israel, divided for an inheritance by lot in Shiloh before the LORD, at the door of the tabernacle of the congregation. So they made an end of dividing the country.";
hnv[51] = "These are the inheritances, which El`azar the Kohen, and Yehoshua the son of Nun, and the heads of the fathers\' [houses] of the tribes of the children of Yisra\'el, distributed for inheritance by lot in Shiloh before the LORD, at the door of the tent of meeting. So they made an end of dividing the land.";
vul[51] = "hae sunt possessiones quas sorte diviserunt Eleazar sacerdos et Iosue filius Nun et principes familiarum ac tribuum filiorum Israhel in Silo coram Domino ad ostium tabernaculi testimonii partitique sunt terram";
