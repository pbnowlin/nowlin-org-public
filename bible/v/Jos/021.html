csb[1] = "The Levite family heads approached the priest Eleazar, Joshua son of Nun, and the family heads of the Israelite tribes.";
csb[2] = "At Shiloh, in the land of Canaan, they told them, &quot;The LORD commanded through Moses that we be given cities to live in, with their pasturelands for our livestock.&quot;";
csb[3] = "So the Israelites, by the LORD\'s command, gave the Levites these cities with their pasturelands from their inheritance.";
csb[4] = "The lot came out for the Kohathite clans: The Levites who were the descendants of the priest Aaron received thirteen cities by lot from the tribes of Judah, Simeon, and Benjamin.";
csb[5] = "The remaining descendants of Kohath received ten cities by lot from the clans of the tribes of Ephraim, Dan, and half the tribe of Manasseh.";
csb[6] = "Gershon\'s descendants received thirteen cities by lot from the clans of the tribes of Issachar, Asher, Naphtali, and half the tribe of Manasseh in Bashan.";
csb[7] = "Merari\'s descendants received twelve cities for their clans from the tribes of Reuben, Gad, and Zebulun.";
csb[8] = "The Israelites gave these cities with their pasturelands around them to the Levites by lot, as the LORD had commanded through Moses.";
csb[9] = "The Israelites gave these cities by name from the tribes of the descendants of Judah and Simeon";
csb[10] = "to the descendants of Aaron from the Kohathite clans of the Levites, because they received the first lot.";
csb[11] = "They gave them Kiriath-arba (that is, Hebron; Arba was the father of Anak) with its surrounding pasturelands in the hill country of Judah.";
csb[12] = "But they gave the fields and settlements of the city to Caleb son of Jephunneh as his possession.";
csb[13] = "They gave to the descendants of the priest Aaron: Hebron, the city of refuge for the one who commits manslaughter, with its pasturelands, Libnah with its pasturelands,";
csb[14] = "Jattir with its pasturelands, Eshtemoa with its pasturelands,";
csb[15] = "Holon with its pasturelands, Debir with its pasturelands,";
csb[16] = "Ain with its pasturelands, Juttah with its pasturelands, and Beth-shemesh with its pasturelands -- nine cities from these two tribes.";
csb[17] = "From the tribe of Benjamin they gave: Gibeon with its pasturelands, Geba with its pasturelands,";
csb[18] = "Anathoth with its pasturelands, and Almon with its pasturelands -- four cities.";
csb[19] = "All thirteen cities with their pasturelands were for the priests, the descendants of Aaron.";
csb[20] = "The allotted cities to the remaining clans of Kohath\'s descendants, who were Levites, came from the tribe of Ephraim.";
csb[21] = "The Israelites gave them: Shechem, the city of refuge for the one who commits manslaughter, with its pasturelands in the hill country of Ephraim, Gezer with its pasturelands,";
csb[22] = "Kibzaim with its pasturelands, and Beth-horon with its pasturelands -- four cities.";
csb[23] = "From the tribe of Dan they gave: Elteke with its pasturelands, Gibbethon with its pasturelands,";
csb[24] = "Aijalon with its pasturelands, and Gath-rimmon with its pasturelands -- four cities.";
csb[25] = "From half the tribe of Manasseh they gave: Taanach with its pasturelands and Gath-rimmon with its pasturelands -- two cities.";
csb[26] = "All ten cities with their pasturelands were for the clans of Kohath\'s other descendants.";
csb[27] = "From half the tribe of Manasseh, they gave to the descendants of Gershon, who were one of the Levite clans: Golan, the city of refuge for the one who commits manslaughter, with its pasturelands in Bashan, and Beeshterah with its pasturelands -- two cities.";
csb[28] = "From the tribe of Issachar they gave: Kishion with its pasturelands, Daberath with its pasturelands,";
csb[29] = "Jarmuth with its pasturelands, and En-gannim with its pasturelands -- four cities.";
csb[30] = "From the tribe of Asher they gave: Mishal with its pasturelands, Abdon with its pasturelands,";
csb[31] = "Helkath with its pasturelands, and Rehob with its pasturelands -- four cities.";
csb[32] = "From the tribe of Naphtali they gave: Kedesh in Galilee, the city of refuge for the one who commits manslaughter, with its pasturelands, Hammoth-dor with its pasturelands, and Kartan with its pasturelands -- three cities.";
csb[33] = "All thirteen cities with their pasturelands were for the Gershonites by their clans.";
csb[34] = "From the tribe of Zebulun, they gave to the clans of the descendants of Merari, who were the remaining Levites: Jokneam with its pasturelands, Kartah with its pasturelands,";
csb[35] = "Dimnah with its pasturelands, and Nahalal with its pasturelands -- four cities.";
csb[36] = "From the tribe of Reuben they gave: Bezer with its pasturelands, Jahzah with its pasturelands,";
csb[37] = "Kedemoth with its pasturelands, and Mephaath with its pasturelands -- four cities.";
csb[38] = "From the tribe of Gad they gave: Ramoth in Gilead, the city of refuge for the one who commits manslaughter, with its pasturelands, Mahanaim with its pasturelands,";
csb[39] = "Heshbon with its pasturelands, and Jazer with its pasturelands -- four cities in all.";
csb[40] = "All twelve cities were allotted to the clans of Merari\'s descendants, the remaining Levite clans.";
csb[41] = "Within the Israelite possession there were forty-eight cities in all with their pasturelands for the Levites.";
csb[42] = "Each of these cities had its own surrounding pasturelands; this was true for all the cities.";
csb[43] = "So the LORD gave Israel all the land he had sworn to give their fathers, and they took possession of it and settled there.";
csb[44] = "The LORD gave them rest on every side according to all he had sworn to their fathers. None of their enemies were able to stand against them, for the LORD handed over all their enemies to them.";
csb[45] = "None of the good promises the LORD had made to the house of Israel failed. Everything was fulfilled.";
kjv[1] = "Then came near the heads of the fathers of the Levites unto Eleazar the priest, and unto Joshua the son of Nun, and unto the heads of the fathers of the tribes of the children of Israel;";
kjv[2] = "And they spake unto them at Shiloh in the land of Canaan, saying, The LORD commanded by the hand of Moses to give us cities to dwell in, with the suburbs thereof for our cattle.";
kjv[3] = "And the children of Israel gave unto the Levites out of their inheritance, at the commandment of the LORD, these cities and their suburbs.";
kjv[4] = "And the lot came out for the families of the Kohathites: and the children of Aaron the priest, [which were] of the Levites, had by lot out of the tribe of Judah, and out of the tribe of Simeon, and out of the tribe of Benjamin, thirteen cities.";
kjv[5] = "And the rest of the children of Kohath [had] by lot out of the families of the tribe of Ephraim, and out of the tribe of Dan, and out of the half tribe of Manasseh, ten cities.";
kjv[6] = "And the children of Gershon [had] by lot out of the families of the tribe of Issachar, and out of the tribe of Asher, and out of the tribe of Naphtali, and out of the half tribe of Manasseh in Bashan, thirteen cities.";
kjv[7] = "The children of Merari by their families [had] out of the tribe of Reuben, and out of the tribe of Gad, and out of the tribe of Zebulun, twelve cities.";
kjv[8] = "And the children of Israel gave by lot unto the Levites these cities with their suburbs, as the LORD commanded by the hand of Moses.";
kjv[9] = "And they gave out of the tribe of the children of Judah, and out of the tribe of the children of Simeon, these cities which are [here] mentioned by name,";
kjv[10] = "Which the children of Aaron, [being] of the families of the Kohathites, [who were] of the children of Levi, had: for theirs was the first lot.";
kjv[11] = "And they gave them the city of Arba the father of Anak, which [city is] Hebron, in the hill [country] of Judah, with the suburbs thereof round about it.";
kjv[12] = "But the fields of the city, and the villages thereof, gave they to Caleb the son of Jephunneh for his possession.";
kjv[13] = "Thus they gave to the children of Aaron the priest Hebron with her suburbs, [to be] a city of refuge for the slayer; and Libnah with her suburbs,";
kjv[14] = "And Jattir with her suburbs, and Eshtemoa with her suburbs,";
kjv[15] = "And Holon with her suburbs, and Debir with her suburbs,";
kjv[16] = "And Ain with her suburbs, and Juttah with her suburbs, [and] Bethshemesh with her suburbs; nine cities out of those two tribes.";
kjv[17] = "And out of the tribe of Benjamin, Gibeon with her suburbs, Geba with her suburbs,";
kjv[18] = "Anathoth with her suburbs, and Almon with her suburbs; four cities.";
kjv[19] = "All the cities of the children of Aaron, the priests, [were] thirteen cities with their suburbs.";
kjv[20] = "And the families of the children of Kohath, the Levites which remained of the children of Kohath, even they had the cities of their lot out of the tribe of Ephraim.";
kjv[21] = "For they gave them Shechem with her suburbs in mount Ephraim, [to be] a city of refuge for the slayer; and Gezer with her suburbs,";
kjv[22] = "And Kibzaim with her suburbs, and Bethhoron with her suburbs; four cities.";
kjv[23] = "And out of the tribe of Dan, Eltekeh with her suburbs, Gibbethon with her suburbs,";
kjv[24] = "Aijalon with her suburbs, Gathrimmon with her suburbs; four cities.";
kjv[25] = "And out of the half tribe of Manasseh, Tanach with her suburbs, and Gathrimmon with her suburbs; two cities.";
kjv[26] = "All the cities [were] ten with their suburbs for the families of the children of Kohath that remained.";
kjv[27] = "And unto the children of Gershon, of the families of the Levites, out of the [other] half tribe of Manasseh [they gave] Golan in Bashan with her suburbs, [to be] a city of refuge for the slayer; and Beeshterah with her suburbs; two cities.";
kjv[28] = "And out of the tribe of Issachar, Kishon with her suburbs, Dabareh with her suburbs,";
kjv[29] = "Jarmuth with her suburbs, Engannim with her suburbs; four cities.";
kjv[30] = "And out of the tribe of Asher, Mishal with her suburbs, Abdon with her suburbs,";
kjv[31] = "Helkath with her suburbs, and Rehob with her suburbs; four cities.";
kjv[32] = "And out of the tribe of Naphtali, Kedesh in Galilee with her suburbs, [to be] a city of refuge for the slayer; and Hammothdor with her suburbs, and Kartan with her suburbs; three cities.";
kjv[33] = "All the cities of the Gershonites according to their families [were] thirteen cities with their suburbs.";
kjv[34] = "And unto the families of the children of Merari, the rest of the Levites, out of the tribe of Zebulun, Jokneam with her suburbs, and Kartah with her suburbs,";
kjv[35] = "Dimnah with her suburbs, Nahalal with her suburbs; four cities.";
kjv[36] = "And out of the tribe of Reuben, Bezer with her suburbs, and Jahazah with her suburbs,";
kjv[37] = "Kedemoth with her suburbs, and Mephaath with her suburbs; four cities.";
kjv[38] = "And out of the tribe of Gad, Ramoth in Gilead with her suburbs, [to be] a city of refuge for the slayer; and Mahanaim with her suburbs,";
kjv[39] = "Heshbon with her suburbs, Jazer with her suburbs; four cities in all.";
kjv[40] = "So all the cities for the children of Merari by their families, which were remaining of the families of the Levites, were [by] their lot twelve cities.";
kjv[41] = "All the cities of the Levites within the possession of the children of Israel [were] forty and eight cities with their suburbs.";
kjv[42] = "These cities were every one with their suburbs round about them: thus [were] all these cities.";
kjv[43] = "And the LORD gave unto Israel all the land which he sware to give unto their fathers; and they possessed it, and dwelt therein.";
kjv[44] = "And the LORD gave them rest round about, according to all that he sware unto their fathers: and there stood not a man of all their enemies before them; the LORD delivered all their enemies into their hand.";
kjv[45] = "There failed not ought of any good thing which the LORD had spoken unto the house of Israel; all came to pass.";
rsv[1] = "Then the heads of the fathers\' houses of the Levites came to Elea\'zar the priest and to Joshua the son of Nun and to the heads of the fathers\' houses of the tribes of the people of Israel;";
asv[1] = "Then came near the heads of fathers\' [houses] of the Levites unto Eleazar the priest, and unto Joshua the son of Nun, and unto the heads of fathers\' [houses] of the tribes of the children of Israel;";
yng[1] = "And the heads of the fathers of the Levites draw nigh unto Eleazar the priest, and unto Joshua son of Nun, and unto the heads of the fathers of the tribes of the sons of Israel,";
dby[1] = "Then the chief fathers of the Levites drew near to Eleazar the priest, and to Joshua the son of Nun, and to the chief fathers of the tribes of the children of Israel;";
web[1] = "Then came near the heads of the fathers of the Levites to Eleazar the priest, and to Joshua the son of Nun, and to the heads of the fathers of the tribes of the children of Israel;";
hnv[1] = "Then came near the heads of fathers\' [houses] of the Levites to El`azar the Kohen, and to Yehoshua the son of Nun, and to the heads of fathers\' [houses] of the tribes of the children of Yisra\'el;";
vul[1] = "accesseruntque principes familiarum Levi ad Eleazar sacerdotem et Iosue filium Nun et ad duces cognationum per singulas tribus filiorum Israhel";
rsv[2] = "and they said to them at Shiloh in the land of Canaan, &quot;The LORD commanded through Moses that we be given cities to dwell in, along with their pasture lands for our cattle.&quot;";
asv[2] = "and they spake unto them at Shiloh in the land of Canaan, saying, Jehovah commanded by Moses to give us cities to dwell in, with the suburbs thereof for our cattle.";
yng[2] = "and they speak unto them in Shiloh, in the land of Canaan, saying, `Jehovah commanded by the hand of Moses to give to us cities to dwell in, and their suburbs for our cattle.\'";
dby[2] = "and they spoke to them at Shiloh in the land of Canaan, saying, Jehovah commanded through Moses to give us cities to dwell in, and their suburbs for our cattle.";
web[2] = "And they spoke to them at Shiloh in the land of Canaan, saying, the LORD commanded by the hand of Moses to give us cities to dwell in, with their suburbs for our cattle.";
hnv[2] = " and they spoke to them at Shiloh in the land of Kana`an, saying, the LORD commanded Moshe to give us cities to dwell in, with the suburbs of it for our cattle.";
vul[2] = "locutique sunt ad eos in Silo terrae Chanaan atque dixerunt Dominus praecepit per manum Mosi ut darentur nobis urbes ad habitandum et suburbana earum ad alenda iumenta";
rsv[3] = "So by command of the LORD the people of Israel gave to the Levites the following cities and pasture lands out of their inheritance.";
asv[3] = "And the children of Israel gave unto the Levites out of their inheritance, according to the commandment of Jehovah, these cities with their suburbs.";
yng[3] = "And the sons of Israel give to the Levites, out of their inheritance, at the command of Jehovah, these cities and their suburbs:";
dby[3] = "And the children of Israel gave to the Levites out of their inheritance, according to the word of Jehovah, these cities and their suburbs.";
web[3] = "And the children of Israel gave to the Levites out of their inheritance, at the commandment of the LORD, these cities and their suburbs.";
hnv[3] = "The children of Yisra\'el gave to the Levites out of their inheritance, according to the mitzvah of the LORD, these cities with their suburbs.";
vul[3] = "dederuntque filii Israhel de possessionibus suis iuxta imperium Domini civitates et suburbana earum";
rsv[4] = "The lot came out for the families of the Ko\'hathites. So those Levites who were descendants of Aaron the priest received by lot from the tribes of Judah, Simeon, and Benjamin, thirteen cities.";
asv[4] = "And the lot came out for the families of the Kohathites: and the children of Aaron the priest, who were of the Levites, had by lot out of the tribe of Judah, and out of the tribe of the Simeonites, and out of the tribe of Benjamin, thirteen cities.";
yng[4] = "And the lot goeth out for the families of the Kohathite, and there are for the sons of Aaron the priest (of the Levites), out of the tribe of Judah, and out of the tribe of Simeon, and out of the tribe of Benjamin, by lot thirteen cities,";
dby[4] = "And the lot came forth for the families of the Kohathites. And the children of Aaron the priest, of the Levites, had by lot out of the tribe of Judah, and out of the tribe of the Simeonites, and out of the tribe of Benjamin, thirteen cities.";
web[4] = "And the lot came out for the families of the Kohathites: and the children of Aaron the priest, [who were] of the Levites, had by lot out of the tribe of Judah, and out of the tribe of Simeon, and out of the tribe of Benjamin, thirteen cities.";
hnv[4] = "The lot came out for the families of the Kehati: and the children of Aharon the Kohen, who were of the Levites, had by lot out of the tribe of Yehudah, and out of the tribe of the Shim`oni, and out of the tribe of Binyamin, thirteen cities.";
vul[4] = "egressaque est sors in familiam Caath filiorum Aaron sacerdotis de tribubus Iuda et Symeon et Beniamin civitates tredecim";
rsv[5] = "And the rest of the Ko\'hathites received by lot from the families of the tribe of E\'phraim, from the tribe of Dan and the half-tribe of Manas\'seh, ten cities.";
asv[5] = "And the rest of the children of Kohath had by lot out of the families of the tribe of Ephraim, and out of the tribe of Dan, and out of the half-tribe of Manasseh, ten cities.";
yng[5] = "and for the sons of Kohath who are left, out of the families of the tribe of Ephraim, and out of the tribe of Dan, and out of the half of the tribe of Manasseh, by lot ten cities:";
dby[5] = "And the children of Kohath that remained had by lot out of the families of the tribe of Ephraim, and out of the tribe of Dan, and out of the half tribe of Manasseh, ten cities.";
web[5] = "And the rest of the children of Kohath [had] by lot out of the families of the tribe of Ephraim, and out of the tribe of Dan, and out of the half-tribe of Manasseh, ten cities.";
hnv[5] = "The rest of the children of Kehat had by lot out of the families of the tribe of Efrayim, and out of the tribe of Dan, and out of the half-tribe of Menashsheh, ten cities.";
vul[5] = "et reliquis filiorum Caath id est Levitis qui superflui erant de tribubus Ephraim et Dan et dimidia tribu Manasse civitates decem";
rsv[6] = "The Gersonites received by lot from the families of the tribe of Is\'sachar, from the tribe of Asher, from the tribe of Naph\'tali, and from the half-tribe of Manas\'seh in Bashan, thirteen cities.";
asv[6] = "And the children of Gershon had by lot out of the families of the tribe of Issachar, and out of the tribe of Asher, and out of the tribe of Naphtali, and out of the half-tribe of Manasseh in Bashan, thirteen cities.";
yng[6] = "And for the sons of Gershon [are], out of the families of the tribe of Issachar, and out of the tribe of Asher, and out of the tribe of Naphtali, and out of the half tribe of Manasseh in Bashan, by lot, thirteen cities.";
dby[6] = "And the children of Gershon had by lot out of the families of the tribe of Issachar, and out of the tribe of Asher, and out of the tribe of Naphtali, and out of the half tribe of Manasseh in Bashan, thirteen cities.";
web[6] = "And the children of Gershon [had] by lot out of the families of the tribe of Issachar, and out of the tribe of Asher, and out of the tribe of Naphtali, and out of the half-tribe of Manasseh in Bashan, thirteen cities.";
hnv[6] = "The children of Gershon had by lot out of the families of the tribe of Yissakhar, and out of the tribe of Asher, and out of the tribe of Naftali, and out of the half-tribe of Menashsheh in Bashan, thirteen cities.";
vul[6] = "porro filiis Gerson egressa est sors ut acciperent de tribubus Isachar et Aser et Nepthalim dimidiaque tribu Manasse in Basan civitates numero tredecim";
rsv[7] = "The Merar\'ites according to their families received from the tribe of Reuben, the tribe of Gad, and the tribe of Zeb\'ulun, twelve cities.";
asv[7] = "The children of Merari according to their families had out of the tribe of Reuben, and out of the tribe of Gad, and out of the tribe of Zebulun, twelve cities.";
yng[7] = "For the sons of Merari, for their families, [are], out of the tribe of Reuben, and out of the tribe of Gad, and out of the tribe of Zebulun, twelve cities.";
dby[7] = "The children of Merari according to their families had by lot out of the tribe of Reuben, and out of the tribe of Gad, and out of the tribe of Zebulun, twelve cities.";
web[7] = "The children of Merari by their families [had] out of the tribe of Reuben, and out of the tribe of Gad, and out of the tribe of Zebulun, twelve cities.";
hnv[7] = "The children of Merari according to their families had out of the tribe of Re\'uven, and out of the tribe of Gad, and out of the tribe of Zevulun, twelve cities.";
vul[7] = "et filiis Merari per cognationes suas de tribubus Ruben et Gad et Zabulon urbes duodecim";
rsv[8] = "These cities and their pasture lands the people of Israel gave by lot to the Levites, as the LORD had commanded through Moses.";
asv[8] = "And the children of Israel gave by lot unto the Levites these cities with their suburbs, as Jehovah commanded by Moses.";
yng[8] = "And the sons of Israel give to the Levites these cities and their suburbs, as Jehovah commanded by the hand of Moses, by lot.";
dby[8] = "And the children of Israel gave by lot to the Levites these cities and their suburbs, as Jehovah commanded through Moses.";
web[8] = "And the children of Israel gave by lot to the Levites these cities with their suburbs, as the LORD commanded by the hand of Moses.";
hnv[8] = "The children of Yisra\'el gave by lot to the Levites these cities with their suburbs, as the LORD commanded by Moshe.";
vul[8] = "dederuntque filii Israhel Levitis civitates et suburbana earum sicut praecepit Dominus per manum Mosi singulis sorte tribuentes";
rsv[9] = "Out of the tribe of Judah and the tribe of Simeon they gave the following cities mentioned by name,";
asv[9] = "And they gave out of the tribe of the children of Judah, and out of the tribe of the children of Simeon, these cities which are [here] mentioned by name:";
yng[9] = "And they give out of the tribe of the sons of Judah, and out of the tribe of the sons of Simeon, these cities which are called by name;";
dby[9] = "And they gave out of the tribe of the children of Judah, and out of the tribe of the children of Simeon, these cities which were mentioned by name,";
web[9] = "And they gave out of the tribe of the children of Judah, and out of the tribe of the children of Simeon, these cities which are [here] mentioned by name,";
hnv[9] = "They gave out of the tribe of the children of Yehudah, and out of the tribe of the children of Shim`on, these cities which are [here] mentioned by name:";
vul[9] = "de tribubus filiorum Iuda et Symeon dedit Iosue civitates quarum ista sunt nomina";
rsv[10] = "which went to the descendants of Aaron, one of the families of the Ko\'hathites who belonged to the Levites; since the lot fell to them first.";
asv[10] = "and they were for the children of Aaron, of the families of the Kohathites, who were of the children of Levi; for theirs was the first lot.";
yng[10] = "and they are for the sons of Aaron, of the families of the Kohathite, of the sons of Levi, for theirs hath been the first lot;";
dby[10] = "and which the children of Aaron, of the families of the Kohathites, of the children of Levi had (for theirs was the first lot);";
web[10] = "Which the children of Aaron, [being] of the families of the Kohathites, [who were] of the children of Levi, had: for theirs was the first lot.";
hnv[10] = "and they were for the children of Aharon, of the families of the Kehati, who were of the children of Levi; for theirs was the first lot.";
vul[10] = "filiis Aaron per familias Caath levitici generis prima enim sors illis egressa est";
rsv[11] = "They gave them Kir\'iath-ar\'ba (Arba being the father of Anak), that is Hebron, in the hill country of Judah, along with the pasture lands round about it.";
asv[11] = "And they gave them Kiriath-arba, [which Arba was] the father of Anak (the same is Hebron), in the hill-country of Judah, with the suburbs thereof round about it.";
yng[11] = "and they give to them the city of Arba father of Anak (it [is] Hebron), in the hill-country of Judah, and its suburbs round about it;";
dby[11] = "and they gave them Kirjath-Arba, [which Arba was] the father of Anak, that is, Hebron, in the mountain of Judah, with its suburbs round about it.";
web[11] = "And they gave them the city of Arba the father of Anak (which [city is] Hebron) in the hill-[country] of Judah, with its suburbs round it.";
hnv[11] = "They gave them Kiryat-Arba, [which Arba was] the father of `Anak (the same is Hevron), in the hill-country of Yehudah, with the suburbs of it round about it.";
vul[11] = "Cariatharbe patris Enach quae vocatur Hebron in monte Iuda et suburbana eius per circuitum";
rsv[12] = "But the fields of the city and its villages had been given to Caleb the son of Jephun\'neh as his possession.";
asv[12] = "But the fields of the city, and the villages thereof, gave they to Caleb the son of Jephunneh for his possession.";
yng[12] = "and the field of the city and its villages they have given to Caleb son of Jephunneh for his possession.";
dby[12] = "But the fields of the city and the hamlets thereof gave they to Caleb the son of Jephunneh for his possession.";
web[12] = "But the fields of the city, and its villages, they gave to Caleb the son of Jephunneh for his possession.";
hnv[12] = " But the fields of the city, and the villages of it, gave they to Kalev the son of Yefunneh for his possession.";
vul[12] = "agros vero et villas eius dederat Chaleb filio Iepphonne ad possidendum";
rsv[13] = "And to the descendants of Aaron the priest they gave Hebron, the city of refuge for the slayer, with its pasture lands, Libnah with its pasture lands,";
asv[13] = "And unto the children of Aaron the priest they gave Hebron with its suburbs, the city of refuge for the manslayer, and Libnah with its suburbs,";
yng[13] = "And to the sons of Aaron the priest they have given the city of refuge [for] the man-slayer, Hebron and its suburbs, and Libnah and its suburbs,";
dby[13] = "And they gave to the children of Aaron the priest the city of refuge for the slayer, Hebron and its suburbs; and Libnah and its suburbs,";
web[13] = "Thus they gave to the children of Aaron the priest, Hebron with its suburbs, [to be] a city of refuge for the slayer; and Libnah with its suburbs,";
