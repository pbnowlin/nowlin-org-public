csb[1] = "A long time after the LORD had given Israel rest from all the enemies around them, Joshua was old, advanced in age.";
csb[2] = "So Joshua summoned all Israel, including its elders, leaders, judges, and officers, and said to them, &quot;I am old, advanced in age,";
csb[3] = "&quot;and you have seen for yourselves everything the LORD your God did to all these nations on your account, because it was the LORD your God who was fighting for you.";
csb[4] = "&quot;See, I have allotted these remaining nations to you as an inheritance for your tribes, including all the nations I have destroyed, from the Jordan westward to the Mediterranean Sea.";
csb[5] = "&quot;The LORD your God will force them back on your account and drive them out before you so that you can take possession of their land, as the LORD your God promised you.";
csb[6] = "&quot;Be very strong and continue obeying all that is written in the book of the law of Moses, so that you do not turn from it to the right or left";
csb[7] = "&quot;and so that you do not associate with these nations remaining among you. Do not call on the names of their gods or make an oath to them; do not serve them or bow in worship to them.";
csb[8] = "&quot;Instead, be loyal to the LORD your God, as you have been to this day.";
csb[9] = "&quot;The LORD has driven out great and powerful nations before you, and no one is able to stand against you to this day.";
csb[10] = "&quot;One of you routed a thousand because the LORD your God was fighting for you, as he promised.";
csb[11] = "&quot;So diligently watch yourselves! Love the LORD your God!";
csb[12] = "&quot;If you ever turn away and become loyal to the rest of these nations remaining among you, and if you intermarry or associate with them and they with you,";
csb[13] = "&quot;know for certain that the LORD your God will not continue to drive these nations out before you. They will become a snare and a trap for you, a sharp stick for your sides and thorns in your eyes, until you disappear from this good land the LORD your God has given you.";
csb[14] = "&quot;I am now going the way of the whole earth, and you know with all your heart and all your soul that none of the good promises the LORD your God made to you has failed. Everything was fulfilled for you; not one promise has failed.";
csb[15] = "&quot;Since every good thing the LORD your God promised you has come about, so he will bring on you every bad thing until he has annihilated you from this good land the LORD your God has given you.";
csb[16] = "&quot;If you break the covenant of the LORD your God, which he commanded you, and go and serve other gods, and bow in worship to them, the LORD\'s anger will burn against you, and you will quickly disappear from this good land he has given you.&quot;";
