csb[1] = "Now Jericho was strongly fortified because of the Israelites -- no one leaving or entering.";
csb[2] = "The LORD said to Joshua, &quot;Look, I have handed Jericho, its king, and its best soldiers over to you.";
csb[3] = "&quot;March around the city with all the men of war, circling the city one time. Do this for six days.";
csb[4] = "&quot;Have seven priests carry seven ram\'s-horn trumpets in front of the ark. But on the seventh day, march around the city seven times, while the priests blow the trumpets.";
csb[5] = "&quot;When there is a prolonged blast of the horn and you hear its sound, have all the troops give a mighty shout. Then the city wall will collapse, and the troops will advance, each man straight ahead.&quot;";
csb[6] = "So Joshua son of Nun summoned the priests and said to them, &quot;Take up the ark of the covenant and have seven priests carry seven trumpets in front of the ark of the LORD.&quot;";
csb[7] = "He said to the troops, &quot;Move forward, march around the city, and have the armed men go ahead of the ark of the LORD.&quot;";
csb[8] = "After Joshua had spoken to the troops, seven priests carrying seven trumpets before the LORD moved forward and blew the trumpets; the ark of the LORD\'s covenant followed them.";
csb[9] = "While the trumpets were blowing, the armed men went in front of the priests who blew the trumpets, and the rear guard went behind the ark.";
csb[10] = "But Joshua had commanded the troops: &quot;Do not shout or let your voice be heard. Don\'t let one word come out of your mouth until the time I say, \'Shout! \' Then you are to shout.&quot;";
csb[11] = "So the ark of the LORD was carried around the city, circling it once. They returned to the camp and spent the night there.";
csb[12] = "Joshua got up early the next morning. The priests took the ark of the LORD,";
csb[13] = "and the seven priests carrying seven trumpets marched in front of the ark of the LORD. While the trumpets were blowing, the armed men went in front of them, and the rear guard went behind the ark of the LORD.";
csb[14] = "On the second day they marched around the city once and returned to the camp. They did this for six days.";
csb[15] = "Early on the seventh day, they started at dawn and marched around the city seven times in the same way. That was the only day they marched around the city seven times.";
csb[16] = "After the seventh time, the priests blew the trumpets, and Joshua said to the troops, &quot;Shout! For the LORD has given you the city.";
csb[17] = "&quot;But the city and everything in it are set apart to the LORD for destruction. Only Rahab the prostitute and everyone with her in the house will live, because she hid the messengers we sent.";
csb[18] = "&quot;But keep yourselves from the things set apart, or you will be set apart for destruction. If you take any of those things, you will set apart the camp of Israel for destruction and make trouble for it.";
csb[19] = "&quot;For all the silver and gold, and the articles of bronze and iron, are dedicated to the LORD and must go into the LORD\'s treasury.&quot;";
csb[20] = "So the troops shouted, and the trumpets sounded. When they heard the blast of the trumpet, the troops gave a great shout, and the wall collapsed. The troops advanced into the city, each man straight ahead, and they captured the city.";
csb[21] = "They completely destroyed everything in the city with the sword -- every man and woman, both young and old, and every ox, sheep, and donkey.";
csb[22] = "Joshua said to the two men who had scouted the land, &quot;Go to the prostitute\'s house and bring the woman out of there, and all who are with her, just as you swore to her.&quot;";
csb[23] = "So the young men who had scouted went in and brought out Rahab and her father, mother, brothers, and all who belonged to her. They brought out her whole family and settled them outside the camp of Israel.";
csb[24] = "They burned the city and everything in it, but they put the silver and gold and the articles of bronze and iron into the treasury of the LORD\'s house.";
csb[25] = "However, Joshua spared Rahab the prostitute, her father\'s family, and all who belonged to her, because she hid the messengers Joshua had sent to spy on Jericho, and she still lives in Israel today.";
csb[26] = "At that time Joshua imposed this curse: The man who undertakes the rebuilding of this city, Jericho, is cursed before the LORD. He will lay its foundation at the cost of his firstborn; he will finish its gates at the cost of his youngest.";
csb[27] = "And the LORD was with Joshua, and his fame spread throughout the land.";

web[17] = "And the city shall be accursed, [even] it, and all that [are] in it, to the LORD: only Rahab the harlot shall live, she and all that [are] with her in the house, because she hid the messengers that we sent.";
hnv[17] = "The city shall be devoted, even it and all that is therein, to the LORD: only Rachav the prostitute shall live, she and all who are with her in the house, because she hid the messengers that we sent.";
vul[17] = "sitque civitas haec anathema et omnia quae in ea sunt Domino sola Raab meretrix vivat cum universis qui cum ea in domo sunt abscondit enim nuntios quos direximus";
kjv[18] = "And ye, in any wise keep [yourselves] from the accursed thing, lest ye make [yourselves] accursed, when ye take of the accursed thing, and make the camp of Israel a curse, and trouble it.";
rsv[18] = "But you, keep yourselves from the things devoted to destruction, lest when you have devoted them you take any of the devoted things and make the camp of Israel a thing for destruction, and bring trouble upon it.";
asv[18] = "But as for you, only keep yourselves from the devoted thing, lest when ye have devoted it, ye take of the devoted thing; so would ye make the camp of Israel accursed, and trouble it.";
yng[18] = "and surely ye have kept from the devoted thing, lest ye devote [yourselves], and have taken from the devoted thing, and have made the camp of Israel become a devoted thing, and have troubled it;";
dby[18] = "But in any wise keep from the accursed thing, lest ye make [yourselves] accursed in taking of the accursed thing, and make the camp of Israel a curse, and trouble it.";
web[18] = "And ye, in any wise keep [yourselves] from the accursed thing, lest ye make [yourselves] accursed, when ye take of the accursed thing, and make the camp of Israel a curse, and trouble it.";
hnv[18] = "But as for you, only keep yourselves from the devoted thing, lest when you have devoted it, you take of the devoted thing; so would you make the camp of Yisra\'el accursed, and trouble it.";
vul[18] = "vos autem cavete ne de his quae praecepta sunt quippiam contingatis et sitis praevaricationis rei et omnia castra Israhel sub peccato sint atque turbentur";
kjv[19] = "But all the silver, and gold, and vessels of brass and iron, [are] consecrated unto the LORD: they shall come into the treasury of the LORD.";
rsv[19] = "But all silver and gold, and vessels of bronze and iron, are sacred to the LORD; they shall go into the treasury of the LORD.&quot;";
asv[19] = "But all the silver, and gold, and vessels of brass and iron, are holy unto Jehovah: they shall come into the treasury of Jehovah.";
yng[19] = "and all the silver and gold, and vessels of brass and iron, holy they [are] to Jehovah; into the treasury of Jehovah they come.\'";
dby[19] = "And all the silver, and gold, and vessels of copper and iron, shall be holy to Jehovah; they shall come into the treasury of Jehovah.";
web[19] = "But all the silver, and gold, and vessels of brass and iron, [are] consecrated to the LORD: they shall come into the treasury of the LORD.";
hnv[19] = "But all the silver, and gold, and vessels of brass and iron, are holy to the LORD: they shall come into the treasury of the LORD.";
vul[19] = "quicquid autem auri et argenti fuerit et vasorum aeneorum ac ferri Domino consecretur repositum in thesauris eius";
kjv[20] = "So the people shouted when [the priests] blew with the trumpets: and it came to pass, when the people heard the sound of the trumpet, and the people shouted with a great shout, that the wall fell down flat, so that the people went up into the city, every man straight before him, and they took the city.";
rsv[20] = "So the people shouted, and the trumpets were blown. As soon as the people heard the sound of the trumpet, the people raised a great shout, and the wall fell down flat, so that the people went up into the city, every man straight before him, and they took the city.";
asv[20] = "So the people shouted, and [the priests] blew the trumpets: and it came to pass, when the people heard the sound of the trumpet, that the people shouted with a great shout, and the wall fell down flat, so that the people went up into the city, every man straight before him, and they took the city.";
yng[20] = "And the people shout, and blow with the trumpets, and it cometh to pass when the people hear the voice of the trumpet, that the people shout -- a great shout, and the wall falleth under it, and the people goeth up into the city, each over-against him, and they capture the city;";
dby[20] = "And the people shouted, and they blew with the trumpets. And it came to pass when the people heard the sound of the trumpets, and the people shouted with a great shout, that the wall fell down flat; and the people went up into the city, each one straight before him, and they took the city.";
web[20] = "So the people shouted when [the priests] blew with the trumpets: and it came to pass, when the people heard the sound of the trumpet, and the people shouted with a great shout, that the wall fell down flat, so that the people went up into the city, every man straight before him, and they took the city.";
hnv[20] = "So the people shouted, and [the Kohanim] blew the trumpets; and it happened, when the people heard the sound of the shofar, that the people shouted with a great shout, and the wall fell down flat, so that the people went up into the city, every man straight before him, and they took the city.";
vul[20] = "igitur omni vociferante populo et clangentibus tubis postquam in aures multitudinis vox sonitusque increpuit muri ilico corruerunt et ascendit unusquisque per locum qui contra se erat ceperuntque civitatem";
kjv[21] = "And they utterly destroyed all that [was] in the city, both man and woman, young and old, and ox, and sheep, and ass, with the edge of the sword.";
rsv[21] = "Then they utterly destroyed all in the city, both men and women, young and old, oxen, sheep, and asses, with the edge of the sword.";
asv[21] = "And they utterly destroyed all that was in the city, both man and woman, both young and old, and ox, and sheep, and ass, with the edge of the sword.";
yng[21] = "and they devote all that [is] in the city, from man even unto woman, from young even unto aged, even unto ox, and sheep, and ass, by the mouth of the sword.";
dby[21] = "And they utterly destroyed all that was in the city; both man and woman, young and old, and ox, and sheep, and ass, with the edge of the sword.";
web[21] = "And they utterly destroyed all that [was] in the city, both man and woman, young and old, and ox, and sheep, and ass, with the edge of the sword.";
hnv[21] = "They utterly destroyed all that was in the city, both man and woman, both young and old, and ox, and sheep, and donkey, with the edge of the sword.";
vul[21] = "et interfecerunt omnia quae erant in ea a viro usque ad mulierem ab infante usque ad senem boves quoque et oves et asinos in ore gladii percusserunt";
kjv[22] = "But Joshua had said unto the two men that had spied out the country, Go into the harlot\'s house, and bring out thence the woman, and all that she hath, as ye sware unto her.";
rsv[22] = "And Joshua said to the two men who had spied out the land, &quot;Go into the harlot\'s house, and bring out from it the woman, and all who belong to her, as you swore to her.&quot;";
asv[22] = "And Joshua said unto the two men that had spied out the land, Go into the harlot\'s house, and bring out thence the woman, and all that she hath, as ye sware unto her.";
yng[22] = "And to the two men who are spying the land Joshua said, `Go into the house of the woman, the harlot, and bring out thence the woman, and all whom she hath, as ye have sworn to her.\'";
dby[22] = "And Joshua said to the two men that had spied out the country, Go into the harlot\'s house and bring out thence the woman, and all that she has, as ye swore unto her.";
web[22] = "But Joshua had said to the two men that spied out the country, Go into the harlot\'s house, and bring out thence the woman, and all that she hath, as ye swore to her.";
hnv[22] = "Yehoshua said to the two men who had spied out the land, Go into the prostitute\'s house, and bring out there the woman, and all that she has, as you swore to her.";
vul[22] = "duobus autem viris qui exploratores missi fuerant dixit Iosue ingredimini domum mulieris meretricis et producite eam omniaque quae illius sunt sicut illi iuramento firmastis";
kjv[23] = "And the young men that were spies went in, and brought out Rahab, and her father, and her mother, and her brethren, and all that she had; and they brought out all her kindred, and left them without the camp of Israel.";
rsv[23] = "So the young men who had been spies went in, and brought out Rahab, and her father and mother and brothers and all who belonged to her; and they brought all her kindred, and set them outside the camp of Israel.";
asv[23] = "And the young men the spies went in, and brought out Rahab, and her father, and her mother, and her brethren, and all that she had; all her kindred also they brought out; and they set them without the camp of Israel.";
yng[23] = "And the young man, the spies, go in and bring out Rahab, and her father, and her mother, and her brethren, and all whom she hath; yea, all her families they have brought out, and place them at the outside of the camp of Israel.";
dby[23] = "And the young men, the spies, went in and brought out Rahab, and her father, and her mother, and her brethren, and all that she had: all her kindred did they bring out, and they left them outside the camp of Israel.";
web[23] = "And the young men that were spies went in, and brought out Rahab, and her father, and her mother, and her brethren, and all that she had; and they brought out all her kindred, and left them without the camp of Israel.";
hnv[23] = "The young men the spies went in, and brought out Rachav, and her father, and her mother, and her brothers, and all that she had; all her relatives also they brought out; and they set them outside of the camp of Yisra\'el.";
vul[23] = "ingressique iuvenes eduxerunt Raab et parentes eius fratres quoque et cunctam supellectilem ac cognationem illius et extra castra Israhel manere fecerunt";
kjv[24] = "And they burnt the city with fire, and all that [was] therein: only the silver, and the gold, and the vessels of brass and of iron, they put into the treasury of the house of the LORD.";
rsv[24] = "And they burned the city with fire, and all within it; only the silver and gold, and the vessels of bronze and of iron, they put into the treasury of the house of the LORD.";
asv[24] = "And they burnt the city with fire, and all that was therein; only the silver, and the gold, and the vessels of brass and of iron, they put into the treasury of the house of Jehovah.";
yng[24] = "And the city they have burnt with fire, and all that [is] in it; only, the silver and the gold, and the vessels of brass, and of iron, they have given [to] the treasury of the house of Jehovah;";
dby[24] = "And they burned the city with fire, and all that was therein; only the silver, and the gold, and the vessels of copper and of iron, they put into the treasury of the house of Jehovah.";
web[24] = "And they burnt the city with fire, and all that [was] in it: only the silver, and the gold, and the vessels of brass and of iron, they put into the treasury of the house of the LORD.";
hnv[24] = "They burnt the city with fire, and all that was therein; only the silver, and the gold, and the vessels of brass and of iron, they put into the treasury of the house of the LORD.";
vul[24] = "urbem autem et omnia quae in ea sunt succenderunt absque argento et auro et vasis aeneis ac ferro quae in aerarium Domini consecrarunt";
kjv[25] = "And Joshua saved Rahab the harlot alive, and her father\'s household, and all that she had; and she dwelleth in Israel [even] unto this day; because she hid the messengers, which Joshua sent to spy out Jericho.";
rsv[25] = "But Rahab the harlot, and her father\'s household, and all who belonged to her, Joshua saved alive; and she dwelt in Israel to this day, because she hid the messengers whom Joshua sent to spy out Jericho.";
asv[25] = "But Rahab the harlot, and her father\'s household, and all that she had, did Joshua save alive; and she dwelt in the midst of Israel unto this day, because she hid the messengers, whom Joshua sent to spy out Jericho.";
yng[25] = "and Rahab the harlot, and the house of her father, and all whom she hath, hath Joshua kept alive; and she dwelleth in the midst of Israel unto this day, for she hid the messengers whom Joshua sent to spy out Jericho.";
dby[25] = "And Joshua saved alive Rahab the harlot, and her father\'s household, and all that she had, and she dwelt in the midst of Israel to this day; because she hid the messengers whom Joshua had sent to spy out Jericho.";
web[25] = "And Joshua saved Rahab the harlot alive, and her father\'s household, and all that she had; and she dwelleth in Israel [even] to this day; because she hid the messengers which Joshua sent to spy out Jericho.";
hnv[25] = "But Rachav the prostitute, and her father\'s household, and all that she had, did Yehoshua save alive; and she lived in the midst of Yisra\'el to this day, because she hid the messengers, whom Yehoshua sent to spy out Yericho.";
vul[25] = "Raab vero meretricem et domum patris eius atque omnia quae habebat fecit Iosue vivere et habitaverunt in medio Israhel usque in praesentem diem eo quod absconderit nuntios quos miserat ut explorarent Hiericho in tempore illo inprecatus est Iosue dicens";
kjv[26] = "And Joshua adjured [them] at that time, saying, Cursed [be] the man before the LORD, that riseth up and buildeth this city Jericho: he shall lay the foundation thereof in his firstborn, and in his youngest [son] shall he set up the gates of it.";
rsv[26] = "Joshua laid an oath upon them at that time, saying, &quot;Cursed before the LORD be the man that rises up and rebuilds this city, Jericho. At the cost of his first-born shall he lay its foundation, and at the cost of his youngest son shall he set up its gates.&quot;";
asv[26] = "And Joshua charged them with an oath at that time, saying, Cursed be the man before Jehovah, that riseth up and buildeth this city Jericho: with the loss of his first-born shall he lay the foundation thereof, and with the loss of his youngest son shall he set up the gates of it.";
yng[26] = "And Joshua adjureth [them] at that time, saying, `Cursed [is] the man before Jehovah who raiseth up and hath built this city, [even] Jericho; in his first-born he doth lay its foundation, and in his youngest he doth set up its doors;\'";
dby[26] = "And Joshua swore at that time, saying, Cursed be the man before Jehovah who shall rise up and build this city Jericho! In his first-born shall he lay its foundation, and in his youngest son shall he set up its gates.";
web[26] = "And Joshua adjured [them] at that time, saying, Cursed [be] the man before the LORD, that riseth up and buildeth this city Jericho: he shall lay its foundation in his first-born, and in his youngest [son] shall he set up the gates of it.";
hnv[26] = "Yehoshua charged them with an oath at that time, saying, Cursed be the man before the LORD, that rises up and builds this city Yericho: with the loss of his firstborn shall he lay the foundation of it, and with the loss of his youngest son shall he set up the gates of it.";
vul[26] = "maledictus vir coram Domino qui suscitaverit et aedificaverit civitatem Hiericho in primogenito suo fundamenta illius iaciat et in novissimo liberorum ponat portas eius";
kjv[27] = "So the LORD was with Joshua; and his fame was [noised] throughout all the country.";
rsv[27] = "So the LORD was with Joshua; and his fame was in all the land.";
asv[27] = "So Jehovah was with Joshua; and his fame was in all the land.";
yng[27] = "and Jehovah is with Joshua, and his fame is in all the land.";
dby[27] = "And Jehovah was with Joshua; and his fame was in all the land.";
web[27] = "So the LORD was with Joshua; and his fame was [noised] throughout all the country.";
hnv[27] = "So the LORD was with Yehoshua; and his fame was in all the land.";
vul[27] = "fuit ergo Dominus cum Iosue et nomen eius in omni terra vulgatum est";
