csb[1] = "When all the Amorite kings across the Jordan to the west and all the Canaanite kings near the sea heard how the LORD had dried up the water of the Jordan before the Israelites until they had crossed over, they lost heart and their courage failed because of the Israelites.";
csb[2] = "At that time the LORD said to Joshua, &quot;Make flint knives and circumcise the Israelite men again.&quot;";
csb[3] = "So Joshua made flint knives and circumcised the Israelite men at Gibeath-haaraloth.";
csb[4] = "This is the reason Joshua circumcised them: All the people who came out of Egypt who were males -- all the men of war -- had died in the wilderness along the way after they had come out of Egypt.";
csb[5] = "Though all the people who came out were circumcised, none of the people born in the wilderness along the way were circumcised after they had come out of Egypt.";
csb[6] = "For the Israelites wandered in the wilderness forty years until all the nation\'s men of war who came out of Egypt had died off because they did not obey the LORD. So the LORD vowed never to let them see the land he had sworn to their fathers to give us, a land flowing with milk and honey.";
csb[7] = "He raised up their sons in their place; it was these Joshua circumcised. They were still uncircumcised, since they had not been circumcised along the way.";
csb[8] = "After the entire nation had been circumcised, they stayed where they were in the camp until they recovered.";
csb[9] = "The LORD then said to Joshua, &quot;Today I have rolled away the disgrace of Egypt from you.&quot; Therefore, that place is still called Gilgal today.";
csb[10] = "While the Israelites camped at Gilgal on the plains of Jericho, they observed the Passover on the evening of the fourteenth day of the month.";
csb[11] = "The day after Passover they ate unleavened bread and roasted grain from the produce of the land.";
csb[12] = "And the day after they ate from the produce of the land, the manna ceased. Since there was no more manna for the Israelites, they ate from the crops of the land of Canaan that year.";
csb[13] = "When Joshua was near Jericho, he looked up and saw a man standing in front of him with a drawn sword in his hand. Joshua approached him and asked, &quot;Are you for us or for our enemies? &quot;";
csb[14] = "&quot;Neither,&quot; he replied. &quot;I have now come as commander of the LORD\'s army.&quot; Then Joshua bowed with his face to the ground in worship and asked him, &quot;What does my lord want to say to his servant? &quot;";
csb[15] = "The commander of the LORD\'s army said to Joshua, &quot;Remove the sandals from your feet, for the place where you are standing is holy.&quot; And Joshua did that.";
kjv[1] = "And it came to pass, when all the kings of the Amorites, which [were] on the side of Jordan westward, and all the kings of the Canaanites, which [were] by the sea, heard that the LORD had dried up the waters of Jordan from before the children of Israel, until we were passed over, that their heart melted, neither was there spirit in them any more, because of the children of Israel.";
rsv[1] = "When all the kings of the Amorites that were beyond the Jordan to the west, and all the kings of the Canaanites that were by the sea, heard that the LORD had dried up the waters of the Jordan for the people of Israel until they had crossed over, their heart melted, and there was no longer any spirit in them, because of the people of Israel.";
asv[1] = "And it came to pass, when all the kings of the Amorites, that were beyond the Jordan westward, and all the kings of the Canaanites, that were by the sea, heard how that Jehovah had dried up the waters of the Jordan from before the children of Israel, until we were passed over, that their heart melted, neither was there spirit in them any more, because of the children of Israel.";
yng[1] = "And it cometh to pass when all the kings of the Amorite which [are] beyond the Jordan, towards the sea, and all the kings of the Canaanite which [are] by the sea, hear how that Jehovah hath dried up the waters of the Jordan at the presence of the sons of Israel till their passing over, that their heart is melted, and there hath not been in them any more spirit because of the presence of the sons of Israel.";
dby[1] = "And it came to pass when all the kings of the Amorites, who were beyond the Jordan westward, and all the kings of the Canaanites, who were by the sea, heard that Jehovah had dried up the waters of the Jordan from before the children of Israel, until they had passed over, that their heart melted, and there was no spirit in them any more, because of the children of Israel.";
web[1] = "And it came to pass, when all the kings of the Amorites who [were] on the side of Jordan westward, and all the kings of the Canaanites who [were] by the sea, heard that the LORD had dried up the waters of Jordan from before the children of Israel, until we had passed over, that their heart melted; neither was there spirit in them any more, because of the children of Israel.";
hnv[1] = "It happened, when all the kings of the Amori, who were beyond the Yarden westward, and all the kings of the Kana`anim, who were by the sea, heard how that the LORD had dried up the waters of the Yarden from before the children of Yisra\'el, until we were passed over, that their heart melted, neither was there spirit in them any more, because of the children of Yisra\'el.";
vul[1] = "postquam ergo audierunt omnes reges Amorreorum qui habitabant trans Iordanem ad occidentalem plagam et cuncti reges Chanaan qui propinqua possidebant Magno mari loca quod siccasset Dominus fluenta Iordanis coram filiis Israhel donec transirent dissolutum est cor eorum et non remansit in eis spiritus timentium introitum filiorum Israhel";
kjv[2] = "At that time the LORD said unto Joshua, Make thee sharp knives, and circumcise again the children of Israel the second time.";
rsv[2] = "At that time the LORD said to Joshua, &quot;Make flint knives and circumcise the people of Israel again the second time.&quot;";
asv[2] = "At that time Jehovah said unto Joshua, Make thee knives of flint, and circumcise again the children of Israel the second time.";
yng[2] = "At that time said Jehovah unto Joshua, `Make for thee knives of flint, and turn back, circumcise the sons of Israel a second time;\'";
dby[2] = "At that time Jehovah said to Joshua, Make thee stone-knives, and circumcise again the children of Israel the second time.";
web[2] = "At that time the LORD said to Joshua, Make thee sharp knives, and circumcise again the children of Israel the second time.";
hnv[2] = "At that time the LORD said to Yehoshua, Make you flint knives, and circumcise again the children of Yisra\'el the second time.";

kjv[4] = "And this [is] the cause why Joshua did circumcise: All the people that came out of Egypt, [that were] males, [even] all the men of war, died in the wilderness by the way, after they came out of Egypt.";
rsv[4] = "And this is the reason why Joshua circumcised them: all the males of the people who came out of Egypt, all the men of war, had died on the way in the wilderness after they had come out of Egypt.";
asv[4] = "And this is the cause why Joshua did circumcise: all the people that came forth out of Egypt, that were males, even all the men of war, died in the wilderness by the way, after they came forth out of Egypt.";

dby[4] = "And this is the cause why Joshua circumcised [them]: all the people that had come out of Egypt, the males, all the men of war, had died in the wilderness on the way, after they came out of Egypt.";

kjv[6] = "For the children of Israel walked forty years in the wilderness, till all the people [that were] men of war, which came out of Egypt, were consumed, because they obeyed not the voice of the LORD: unto whom the LORD sware that he would not shew them the land, which the LORD sware unto their fathers that he would give us, a land that floweth with milk and honey.";
rsv[6] = "For the people of Israel walked forty years in the wilderness, till all the nation, the men of war that came forth out of Egypt, perished, because they did not hearken to the voice of the LORD; to them the LORD swore that he would not let them see the land which the LORD had sworn to their fathers to give us, a land flowing with milk and honey.";
asv[6] = "For the children of Israel walked forty years in the wilderness, till all the nation, even the men of war that came forth out of Egypt, were consumed, because they hearkened not unto the voice of Jehovah: unto whom Jehovah sware that he would not let them see the land which Jehovah sware unto their fathers that he would give us, a land flowing with milk and honey.";
yng[6] = "for forty years have the sons of Israel gone in the wilderness, till all the nation of the men of war who are coming out of Egypt, who hearkened not to the voice of Jehovah, to whom Jehovah hath sworn not to show them the land which Jehovah sware to their fathers to give to us, a land flowing with milk and honey, are consumed;";
dby[6] = "For the children of Israel had walked forty years in the wilderness, till the whole nation of men of war had perished who had come out of Egypt, who had not hearkened to the voice of Jehovah; to whom Jehovah had sworn that he would not show them the land which Jehovah had sworn unto their fathers that he would give us, a land flowing with milk and honey.";
web[6] = "For the children of Israel walked forty years in the wilderness, till all the people [that were] men of war who came out of Egypt were consumed, because they obeyed not the voice of the LORD: to whom the LORD swore that he would not show them the land which the LORD swore to their fathers that he would give us, a land that floweth with milk and honey.";
hnv[6] = "For the children of Yisra\'el walked forty years in the wilderness, until all the nation, even the men of war who came forth out of Mitzrayim, were consumed, because they didn\'t listen to the voice of the LORD: to whom the LORD swore that he wouldn\'t let them see the land which the LORD swore to their fathers that he would give us, a land flowing with milk and honey.";
vul[6] = "per quadraginta annos itineris latissimae solitudinis incircumcisus fuit donec consumerentur qui non audierant vocem Domini et quibus ante iuraverat ut ostenderet eis terram lacte et melle manantem";

kjv[8] = "And it came to pass, when they had done circumcising all the people, that they abode in their places in the camp, till they were whole.";

yng[8] = "And it cometh to pass when all the nation have completed to be circumcised, that they abide in their places in the camp till their recovering;";

kjv[9] = "And the LORD said unto Joshua, This day have I rolled away the reproach of Egypt from off you. Wherefore the name of the place is called Gilgal unto this day.";
