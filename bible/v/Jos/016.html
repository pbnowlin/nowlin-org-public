csb[1] = "The allotment for the descendants of Joseph went from the Jordan at Jericho to the Waters of Jericho on the east, through the wilderness ascending from Jericho into the hill country of Bethel.";
csb[2] = "From Bethel it went to Luz and proceeded to the border of the Archites by Ataroth.";
csb[3] = "It then descended westward to the border of the Japhletites as far as the border of lower Beth-horon, then to Gezer, and ended at the Mediterranean Sea.";
csb[4] = "So Ephraim and Manasseh, the sons of Joseph, received their inheritance.";
csb[5] = "This was the territory of the descendants of Ephraim by their clans: The border of their inheritance went from Ataroth-addar on the east to Upper Beth-horon.";
csb[6] = "In the north the border went westward from Michmethath; it turned eastward from Taanath-shiloh and passed it east of Janoah.";
csb[7] = "From Janoah it descended to Ataroth and Naarah, and then reached Jericho and went to the Jordan.";
csb[8] = "From Tappuah the border went westward along the Brook of Kanah and ended at the Mediterranean Sea. This was the inheritance of the tribe of the descendants of Ephraim by their clans, together with";
csb[9] = "the cities set apart for the descendants of Ephraim within the inheritance of the descendants of Manasseh -- all these cities with their settlements.";
csb[10] = "However, they did not drive out the Canaanites who lived in Gezer. So the Canaanites still live in Ephraim today, but they are forced laborers.";
kjv[1] = "And the lot of the children of Joseph fell from Jordan by Jericho, unto the water of Jericho on the east, to the wilderness that goeth up from Jericho throughout mount Bethel,";
rsv[1] = "The allotment of the descendants of Joseph went from the Jordan by Jericho, east of the waters of Jericho, into the wilderness, going up from Jericho into the hill country to Bethel;";
asv[1] = "And the lot came out for the children of Joseph from the Jordan at Jericho, at the waters of Jericho on the east, even the wilderness, going up from Jericho through the hill-country to Beth-el;";
yng[1] = "And the lot for the sons of Joseph goeth out from Jordan [by] Jericho, to the waters of Jericho on the east, to the wilderness going up from Jericho in the hill-country of Beth-El,";
dby[1] = "And the lot came forth for the children of Joseph from the Jordan of Jericho as far as the waters of Jericho eastwards, to the wilderness which goes up from Jericho to the hill-country of Bethel.";
web[1] = "And the lot of the children of Joseph fell from Jordan by Jericho, to the water of Jericho on the east, to the wilderness that goeth up from Jericho throughout mount Beth-el,";
hnv[1] = "The lot came out for the children of Yosef from the Yarden at Yericho, at the waters of Yericho on the east, even the wilderness, going up from Yericho through the hill-country to Beit-El;";
vul[1] = "cecidit quoque sors filiorum Ioseph ab Iordane contra Hiericho et aquas eius ab oriente solitudo quae ascendit de Hiericho ad montana Bethel";
kjv[2] = "And goeth out from Bethel to Luz, and passeth along unto the borders of Archi to Ataroth,";
rsv[2] = "then going from Bethel to Luz, it passes along to At\'aroth, the territory of the Archites;";
asv[2] = "and it went out from Beth-el to Luz, and passed along unto the border of the Archites to Ataroth;";
yng[2] = "and hath gone out from Beth-El to Luz, and passed over unto the border of Archi [to] Ataroth,";
dby[2] = "And [the border] went from Bethel to Luz, and passed to the border of the Archites to Ataroth,";
web[2] = "And goeth out from Beth-el to Luz, and passeth along to the borders of Archi to Ataroth,";
hnv[2] = "and it went out from Beit-El to Luz, and passed along to the border of the Arki to `Atrot;";
vul[2] = "et egreditur de Bethel Luzam transitque terminum Archiatharoth";
kjv[3] = "And goeth down westward to the coast of Japhleti, unto the coast of Bethhoron the nether, and to Gezer: and the goings out thereof are at the sea.";
rsv[3] = "then it goes down westward to the territory of the Japh\'letites, as far as the territory of Lower Beth-hor\'on, then to Gezer, and it ends at the sea.";
asv[3] = "and it went down westward to the border of the Japhletites, unto the border of Beth-horon the nether, even unto Gezer; and the goings out thereof were at the sea.";
yng[3] = "and gone down westward unto the border of Japhleti, unto the border of Beth-Horon the lower, and unto Gezer, and its outgoings have been at the sea.";
dby[3] = "and went down westward to the border of the Japhletites, as far as the border of the lower Beth-horon, and to Gezer; and ended at the sea.";
web[3] = "And goeth down westward to the border of Japhleti, to the border of Beth-horon the nether, and to Gezer: and the limits of it are at the sea.";
hnv[3] = "and it went down westward to the border of the Yafleti, to the border of Beit-Horon the lower, even to Gezer; and the goings out of it were at the sea.";
vul[3] = "et descendit ad occidentem iuxta terminum Ieflethi usque ad terminos Bethoron inferioris et Gazer finiunturque regiones eius mari Magno";
kjv[4] = "So the children of Joseph, Manasseh and Ephraim, took their inheritance.";
rsv[4] = "The people of Joseph, Manas\'seh and E\'phraim, received their inheritance.";
asv[4] = "And the children of Joseph, Manasseh and Ephraim, took their inheritance.";
yng[4] = "And the sons of Joseph -- Manasseh and Ephraim -- inherit.";
dby[4] = "And the children of Joseph, Manasseh and Ephraim, took their inheritance.";
web[4] = "So the children of Joseph, Manasseh and Ephraim, took their inheritance.";
hnv[4] = "The children of Yosef, Menashsheh and Efrayim, took their inheritance.";
vul[4] = "possederuntque filii Ioseph Manasse et Ephraim";
kjv[5] = "And the border of the children of Ephraim according to their families was [thus]: even the border of their inheritance on the east side was Atarothaddar, unto Bethhoron the upper;";
rsv[5] = "The territory of the E\'phraimites by their families was as follows: the boundary of their inheritance on the east was At\'aroth-ad\'dar as far as Upper Beth-hor\'on,";
asv[5] = "And the border of the children of Ephraim according to their families was [thus]: the border of their inheritance eastward was Ataroth-addar, unto Beth-horon the upper;";
yng[5] = "And the border of the sons of Ephraim is by their families; and the border of their inheritance is on the east, Atroth-Addar unto Beth-Horon the upper;";
dby[5] = "And the border of the children of Ephraim was according to their families; the border of their inheritance eastwards was Ataroth-Addar as far as the upper Beth-horon;";
web[5] = "And the border of the children of Ephraim according to their families was [thus]: even the border of their inheritance on the east side was Ataroth-adar, to Beth-horon the upper:";
hnv[5] = "The border of the children of Efrayim according to their families was [thus]: the border of their inheritance eastward was `Atarot-Addar, to Beit-Horon the upper;";
vul[5] = "et factus est terminus filiorum Ephraim per cognationes suas et possessio eorum contra orientem Atharothaddar usque Bethoron superiorem";
kjv[6] = "And the border went out toward the sea to Michmethah on the north side; and the border went about eastward unto Taanathshiloh, and passed by it on the east to Janohah;";
rsv[6] = "and the boundary goes thence to the sea; on the north is Mich-me\'thath; then on the east the boundary turns round toward Ta\'anath-shi\'loh, and passes along beyond it on the east to Jan-o\'ah,";
asv[6] = "and the border went out westward at Michmethath on the north; and the border turned about eastward unto Taanath-shiloh, and passed along it on the east of Janoah;";
yng[6] = "and the border hath gone out at the sea, to Michmethah on the north, and the border hath gone round eastward [to] Taanath-Shiloh, and passed over it eastward to Janohah,";
dby[6] = "and the border went forth westwards to Micmethath on the north; and the border turned eastwards to Taanath-Shiloh, and passed by it eastwards to Janohah,";
web[6] = "And the border went out towards the sea to Michmethah on the north side; and the border went about eastward to Taanath-shiloh, and passed by it on the east to Janohah;";
hnv[6] = "and the border went out westward at Mikhmetat on the north; and the border turned about eastward to Ta\'anat-Shiloh, and passed along it on the east of Yano`ach;";
vul[6] = "egrediunturque confinia in mare Machmethath vero aquilonem respicit et circuit terminus contra orientem in Thanathselo et pertransit ab oriente Ianoe";
kjv[7] = "And it went down from Janohah to Ataroth, and to Naarath, and came to Jericho, and went out at Jordan.";
rsv[7] = "then it goes down from Jan-o\'ah to At\'aroth and to Na\'arah, and touches Jericho, ending at the Jordan.";
asv[7] = "and it went down from Janoah to Ataroth, and to Naarah, and reached unto Jericho, and went out at the Jordan.";
yng[7] = "and gone down from Janohah [to] Ataroth, and to Naarath, and touched against Jericho, and gone out at the Jordan.";
dby[7] = "and went down from Janohah to Ataroth and Naarath, and touched upon Jericho, and went out to the Jordan.";
web[7] = "And it went down from Janohah to Ataroth, and to Naarath, and came to Jericho, and terminated at Jordan.";
hnv[7] = "and it went down from Yano`ach to `Atrot, and to Na`arah, and reached to Yericho, and went out at the Yarden.";
vul[7] = "descenditque de Ianoe in Atharoth et Noaratha et pervenit in Hiericho et egreditur ad Iordanem";
kjv[8] = "The border went out from Tappuah westward unto the river Kanah; and the goings out thereof were at the sea. This [is] the inheritance of the tribe of the children of Ephraim by their families.";
rsv[8] = "From Tap\'puah the boundary goes westward to the brook Kanah, and ends at the sea. Such is the inheritance of the tribe of the E\'phraimites by their families,";
asv[8] = "From Tappuah the border went along westward to the brook of Kanah; and the goings out thereof were at the sea. This is the inheritance of the tribe of the children of Ephraim according to their families;";
yng[8] = "From Tappuah the border goeth westward unto the brook of Kanah, and its outgoings have been at the sea: this [is] the inheritance of the tribe of the sons of Ephraim, for their families.";
dby[8] = "From Tappuah the border went westwards to the torrent Kanah, and ended at the sea. This is the inheritance of the tribe of the children of Ephraim according to their families,";
web[8] = "The border went out from Tappuah westward to the river Kanah; and the limits of it were at the sea. This [is] the inheritance of the tribe of the children of Ephraim by their families.";
hnv[8] = "From Tappuach the border went along westward to the brook of Kanah; and the goings out of it were at the sea. This is the inheritance of the tribe of the children of Efrayim according to their families;";
vul[8] = "de Taffua pertransitque contra mare in valle Harundineti suntque egressus eius in mare Salsissimum haec est possessio tribus filiorum Ephraim per familias suas";
kjv[9] = "And the separate cities for the children of Ephraim [were] among the inheritance of the children of Manasseh, all the cities with their villages.";
rsv[9] = "together with the towns which were set apart for the E\'phraimites within the inheritance of the Manas\'sites, all those towns with their villages.";
asv[9] = "together with the cities which were set apart for the children of Ephraim in the midst of the inheritance of the children of Manasseh, all the cities with their villages.";
yng[9] = "And the separate cities of the sons of Ephraim [are] in the midst of the inheritance of the sons of Manasseh, all the cities and their villages;";
dby[9] = "with the cities that were set apart for the children of Ephraim in the midst of the inheritance of the children of Manasseh, all the cities and their hamlets.";
web[9] = "And the separate cities for the children of Ephraim [were] among the inheritance of the children of Manasseh, all the cities with their villages.";
hnv[9] = "together with the cities which were set apart for the children of Efrayim in the midst of the inheritance of the children of Menashsheh, all the cities with their villages.";
vul[9] = "urbesque quae separatae sunt filiis Ephraim in medio possessionis filiorum Manasse et villae earum";
kjv[10] = "And they drave not out the Canaanites that dwelt in Gezer: but the Canaanites dwell among the Ephraimites unto this day, and serve under tribute.";
rsv[10] = "However they did not drive out the Canaanites that dwelt in Gezer: so the Canaanites have dwelt in the midst of E\'phraim to this day but have become slaves to do forced labor.";
asv[10] = "And they drove not out the Canaanites that dwelt in Gezer: but the Canaanites dwell in the midst of Ephraim unto this day, and are become servants to do taskwork.";
yng[10] = "and they have not dispossessed the Canaanite who is dwelling in Gezer, and the Canaanite dwelleth in the midst of Ephraim unto this day, and is to tribute -- a servant.";
dby[10] = "But they did not dispossess the Canaanites that dwelt at Gezer; and the Canaanites dwell in the midst of Ephraim to this day, and serve under tribute.";
web[10] = "And they did not expel the Canaanites that dwelt in Gezer: but the Canaanites dwell among the Ephraimites to this day, and serve under tribute.";
hnv[10] = " They didn\'t drive out the Kana`anim who lived in Gezer: but the Kana`anim dwell in the midst of Efrayim to this day, and are become servants to do forced labor.";
vul[10] = "et non interfecerunt filii Ephraim Chananeum qui habitabat in Gazer habitavitque Chananeus in medio Ephraim usque in diem hanc tributarius";
