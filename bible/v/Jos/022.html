csb[1] = "Joshua summoned the Reubenites, Gadites, and half the tribe of Manasseh";
csb[2] = "and told them, &quot;You have done everything Moses the LORD\'s servant commanded you and have obeyed me in everything I commanded you.";
csb[3] = "&quot;You have not deserted your brothers even once this whole time but have carried out the requirement of the command of the LORD your God.";
csb[4] = "&quot;Now that he has given your brothers rest, just as he promised them, return to your homes in your own land that Moses the LORD\'s servant gave you across the Jordan.";
csb[5] = "&quot;Only carefully obey the command and instruction that Moses the LORD\'s servant gave you: to love the LORD your God, walk in all his ways, keep his commands, be loyal to him, and serve him with all your heart and all your soul.&quot;";
csb[6] = "Joshua blessed them and sent them on their way, and they went to their homes.";
csb[7] = "Moses had given territory to half the tribe of Manasseh in Bashan, but Joshua had given territory to the other half, with their brothers, on the west side of the Jordan. When Joshua sent them to their homes and blessed them,";
csb[8] = "he said, &quot;Return to your homes with great wealth: a huge number of cattle, and silver, gold, bronze, iron, and a large quantity of clothing. Share the spoil of your enemies with your brothers.&quot;";
csb[9] = "The Reubenites, Gadites, and half the tribe of Manasseh left the Israelites at Shiloh in the land of Canaan to return to their own land of Gilead, which they took possession of according to the LORD\'s command through Moses.";
csb[10] = "When they came to the region of the Jordan in the land of Canaan, the Reubenites, Gadites, and half the tribe of Manasseh built a large, impressive altar there by the Jordan.";
csb[11] = "Then the Israelites heard it said, &quot;Look, the Reubenites, Gadites, and half the tribe of Manasseh have built an altar on the frontier of the land of Canaan at the region of the Jordan, on the Israelite side.&quot;";
csb[12] = "When the Israelites heard this, the entire Israelite community assembled at Shiloh to go to war against them.";
csb[13] = "The Israelites sent Phinehas son of Eleazar the priest to the Reubenites, Gadites, and half the tribe of Manasseh, in the land of Gilead.";
csb[14] = "They sent ten leaders with him -- one family leader for each tribe of Israel. All of them were heads of their ancestral families among the clans of Israel.";
csb[15] = "They went to the Reubenites, Gadites, and half the tribe of Manasseh, in the land of Gilead, and told them,";
csb[16] = "&quot;This is what the LORD\'s entire community says: \'What is this treachery you have committed today against the God of Israel by turning away from the LORD and building an altar for yourselves, so that you are in rebellion against the LORD today?";
csb[17] = "&quot;Wasn\'t the iniquity of Peor, which brought a plague on the LORD\'s community, enough for us? We have not cleansed ourselves from it even to this day,";
csb[18] = "&quot;and now would you turn away from the LORD? If you rebel against the LORD today, tomorrow he will be angry with the entire community of Israel.";
csb[19] = "&quot;But if the land you possess is defiled, cross over to the land the LORD possesses where the LORD\'s tabernacle stands, and take possession of it among us. But don\'t rebel against the LORD or against us by building for yourselves an altar other than the altar of the LORD our God.";
csb[20] = "&quot;Wasn\'t Achan son of Zerah unfaithful regarding what was set apart for destruction, bringing wrath on the entire community of Israel? He was not the only one who perished because of his iniquity.\' &quot;";
csb[21] = "The Reubenites, Gadites, and half the tribe of Manasseh answered the heads of the Israelite clans,";
csb[22] = "&quot;The Mighty One, God, the LORD! The Mighty One, God, the LORD! He knows, and may Israel also know. Do not spare us today, if it was in rebellion or treachery against the LORD";
csb[23] = "&quot;that we have built for ourselves an altar to turn away from him. May the LORD himself hold us accountable if we intended to offer burnt offerings and grain offerings on it, or to sacrifice fellowship offerings on it.";
csb[24] = "&quot;We actually did this from a specific concern that in the future your descendants might say to our descendants, \'What relationship do you have with the LORD, the God of Israel?";
csb[25] = "&quot;For the LORD has made the Jordan a border between us and you descendants of Reuben and Gad. You have no share in the LORD! \' So your descendants may cause our descendants to stop fearing the LORD.";
csb[26] = "&quot;Therefore we said: Let us take action and build an altar for ourselves, but not for burnt offering or sacrifice.";
csb[27] = "&quot;Instead, it is to be a witness between us and you, and between the generations after us, so that we may carry out the worship of the LORD in his presence with our burnt offerings, sacrifices, and fellowship offerings. Then in the future, your descendants will not be able to say to our descendants, \'You have no share in the LORD! \'";
csb[28] = "&quot;We thought that if they said this to us or to our generations in the future, we would reply: Look at the replica of the LORD\'s altar that our fathers made, not for burnt offering or sacrifice, but as a witness between us and you.";
csb[29] = "&quot;We would never ever rebel against the LORD or turn away from him today by building an altar for burnt offering, grain offering, or sacrifice, other than the altar of the LORD our God, which is in front of his tabernacle.&quot;";
csb[30] = "When the priest Phinehas and the community leaders, the heads of Israel\'s clans who were with him, heard what the descendants of Reuben, Gad, and Manasseh had to say, they were pleased.";
csb[31] = "Phinehas son of Eleazar the priest said to the descendants of Reuben, Gad, and Manasseh, &quot;Today we know that the LORD is among us, because you have not committed this treachery against him. As a result, you have rescued the Israelites from the LORD\'s power.&quot;";
csb[32] = "Then the priest Phinehas son of Eleazar and the leaders returned from the Reubenites and Gadites in the land of Gilead to the Israelites in the land of Canaan and brought back a report to them.";
csb[33] = "The Israelites were pleased with the report, and they blessed God. They spoke no more about going to war against them to ravage the land where the Reubenites and Gadites lived.";
csb[34] = "So the Reubenites and Gadites named the altar: It is a witness between us that the LORD is God.";

kjv[2] = "And said unto them, Ye have kept all that Moses the servant of the LORD commanded you, and have obeyed my voice in all that I commanded you:";
rsv[2] = "and said to them, &quot;You have kept all that Moses the servant of the LORD commanded you, and have obeyed my voice in all that I have commanded you;";
asv[2] = "and said unto them, Ye have kept all that Moses the servant of Jehovah commanded you, and have hearkened unto my voice in all that I commanded you:";
yng[2] = "and saith unto them, `Ye -- ye have kept the whole of that which Moses, servant of Jehovah, commanded you, and ye hearken to my voice, to all that I have commanded you;";
dby[2] = "and said unto them, Ye have kept all that Moses the servant of Jehovah commanded you, and have hearkened to my voice in all that I commanded you.";
web[2] = "And said to them, Ye have kept all that Moses the servant of the LORD commanded you, and have obeyed my voice in all that I commanded you:";
hnv[2] = "and said to them, You have kept all that Moshe the servant of the LORD commanded you, and have listened to my voice in all that I commanded you:";
vul[2] = "dixitque ad eos fecistis omnia quae vobis praecepit Moses famulus Domini mihi quoque in omnibus oboedistis";
kjv[3] = "Ye have not left your brethren these many days unto this day, but have kept the charge of the commandment of the LORD your God.";
rsv[3] = "you have not forsaken your brethren these many days, down to this day, but have been careful to keep the charge of the LORD your God.";
asv[3] = "ye have not left your brethren these many days unto this day, but have kept the charge of the commandment of Jehovah your God.";
yng[3] = "ye have not left your brethren these many days unto this day, and have kept the charge -- the command of Jehovah your God.";
dby[3] = "Ye have not left your brethren these many days unto this day, and ye have kept the charge of the commandment of Jehovah your God.";
web[3] = "Ye have not left your brethren these many days to this day, but have kept the charge of the commandment of the LORD your God.";
hnv[3] = "you have not left your brothers these many days to this day, but have kept the charge of the mitzvah of the LORD your God.";
vul[3] = "nec reliquistis fratres vestros longo tempore usque in praesentem diem custodientes imperium Domini Dei vestri";
kjv[4] = "And now the LORD your God hath given rest unto your brethren, as he promised them: therefore now return ye, and get you unto your tents, [and] unto the land of your possession, which Moses the servant of the LORD gave you on the other side Jordan.";
rsv[4] = "And now the LORD your God has given rest to your brethren, as he promised them; therefore turn and go to your home in the land where your possession lies, which Moses the servant of the LORD gave you on the other side of the Jordan.";
asv[4] = "And now Jehovah your God hath given rest unto your brethren, as he spake unto them: therefore now turn ye, and get you unto your tents, unto the land of your possession, which Moses the servant of Jehovah gave you beyond the Jordan.";
yng[4] = "`And, now, Jehovah your God hath given rest to your brethren, as He spake to them; and now, turn ye, and go for yourselves to your tents, unto the land of your possession, which Moses, servant of Jehovah, hath given to you beyond the Jordan.";
dby[4] = "And now Jehovah your God hath given rest to your brethren, as he said unto them; and now return, and get you unto your tents, unto the land of your possession, which Moses the servant of Jehovah gave you beyond the Jordan.";
web[4] = "And now the LORD your God hath given rest to your brethren, as he promised them: therefore now return ye, and go to your tents, [and] to the land of your possession, which Moses the servant of the LORD gave you on the other side of Jordan.";
hnv[4] = "Now the LORD your God has given rest to your brothers, as he spoke to them: therefore now turn you, and get you to your tents, to the land of your possession, which Moshe the servant of the LORD gave you beyond the Yarden.";
vul[4] = "quia igitur dedit Dominus Deus vester fratribus vestris quietem ac pacem sicut pollicitus est revertimini et ite in tabernacula vestra et in terram possessionis quam tradidit vobis Moses famulus Domini trans Iordanem";
kjv[5] = "But take diligent heed to do the commandment and the law, which Moses the servant of the LORD charged you, to love the LORD your God, and to walk in all his ways, and to keep his commandments, and to cleave unto him, and to serve him with all your heart and with all your soul.";
rsv[5] = "Take good care to observe the commandment and the law which Moses the servant of the LORD commanded you, to love the LORD your God, and to walk in all his ways, and to keep his commandments, and to cleave to him, and to serve him with all your heart and with all your soul.&quot;";
asv[5] = "Only take diligent heed to do the commandment and the law which Moses the servant of Jehovah commanded you, to love Jehovah your God, and to walk in all his ways, and to keep his commandments, and to cleave unto him, and to serve him with all your heart and with all your soul.";
yng[5] = "Only, be very watchful to do the command and the law which Moses, servant of Jehovah, commanded you, to love Jehovah your God, and to walk in all His ways, and to keep His commands, and to cleave to Him, and to serve Him, with all your heart, and with all your soul.\'";
dby[5] = "Only, take great heed to do the commandment and the law, which Moses the servant of Jehovah commanded you, to love Jehovah your God, and to walk in all his ways, and to keep his commandments, and to cleave unto him, and to serve him with all your heart and with all your soul.";
web[5] = "But take diligent heed to perform the commandment and the law, which Moses the servant of the LORD charged you, to love the LORD your God, and to walk in all his ways, and to keep his commandments, and to cleave to him, and to serve him with all your heart, and with all your soul.";
hnv[5] = "Only take diligent heed to do the mitzvah and the law which Moshe the servant of the LORD commanded you, to love the LORD your God, and to walk in all his ways, and to keep his mitzvot, and to cleave to him, and to serve him with all your heart and with all your soul.";
vul[5] = "ita dumtaxat ut custodiatis adtente et opere conpleatis mandatum et legem quam praecepit vobis Moses servus Domini ut diligatis Dominum Deum vestrum et ambuletis in omnibus viis eius et observetis mandata illius adhereatisque ei ac serviatis in omni corde et in omni anima vestra";
kjv[6] = "So Joshua blessed them, and sent them away: and they went unto their tents.";

kjv[7] = "Now to the [one] half of the tribe of Manasseh Moses had given [possession] in Bashan: but unto the [other] half thereof gave Joshua among their brethren on this side Jordan westward. And when Joshua sent them away also unto their tents, then he blessed them,";
rsv[7] = "Now to the one half of the tribe of Manas\'seh Moses had given a possession in Bashan; but to the other half Joshua had given a possession beside their brethren in the land west of the Jordan. And when Joshua sent them away to their homes and blessed them,";
asv[7] = "Now to the one half-tribe of Manasseh Moses had given [inheritance] in Bashan; but unto the other half gave Joshua among their brethren beyond the Jordan westward. Moreover when Joshua sent them away unto their tents, he blessed them,";
yng[7] = "And to the half of the tribe of Manasseh hath Moses given, in Bashan, and to its [other] half hath Joshua given with their brethren beyond the Jordan westward; and also when Joshua hath sent them away unto their tents, then he doth bless them,";
dby[7] = "And to half the tribe of Manasseh Moses had given [inheritance] in Bashan, and to the other half thereof had Joshua given among their brethren on this side the Jordan westward. And when Joshua sent them away to their tents, he blessed them also,";
web[7] = "Now to the [one] half of the tribe of Manasseh Moses had given [possession] in Bashan: but to the [other] half of it gave Joshua among their brethren on this side of Jordan westward. And when Joshua sent them away also to their tents, then he blessed them,";
hnv[7] = " Now to the one half-tribe of Menashsheh Moshe had given [inheritance] in Bashan; but to the other half gave Yehoshua among their brothers beyond the Yarden westward; moreover when Yehoshua sent them away to their tents, he blessed them,";
vul[7] = "tribui autem Manasse mediae possessionem Moses dederat in Basan et idcirco mediae quae superfuit dedit Iosue sortem inter ceteros fratres suos trans Iordanem ad occidentalem eius plagam cumque dimitteret eos in tabernacula sua et benedixisset illis";

asv[8] = "and spake unto them, saying, Return with much wealth unto your tents, and with very much cattle, with silver, and with gold, and with brass, and with iron, and with very much raiment: divide the spoil of your enemies with your brethren.";
yng[8] = "and speak unto them, saying, `With great riches turn ye back unto your tents, and with very much cattle, with silver, and with gold, and with brass, and with iron, and with very much raiment; divide the spoil of your enemies with your brethren.\'";

kjv[9] = "And the children of Reuben and the children of Gad and the half tribe of Manasseh returned, and departed from the children of Israel out of Shiloh, which [is] in the land of Canaan, to go unto the country of Gilead, to the land of their possession, whereof they were possessed, according to the word of the LORD by the hand of Moses.";
rsv[9] = "So the Reubenites and the Gadites and the half-tribe of Manas\'seh returned home, parting from the people of Israel at Shiloh, which is in the land of Canaan, to go to the land of Gilead, their own land of which they had possessed themselves by command of the LORD through Moses.";
asv[9] = "And the children of Reuben and the children of Gad and the half-tribe of Manasseh returned, and departed from the children of Israel out of Shiloh, which is in the land of Canaan, to go unto the land of Gilead, to the land of their possession, whereof they were possessed, according to the commandment of Jehovah by Moses.";
yng[9] = "And the sons of Reuben, and the sons of Gad, and the half of the tribe of Manasseh, turn back and go from the sons of Israel out of Shiloh, which [is] in the land of Canaan, to go unto the land of Gilead, unto the land of their possession, in which they have possession, according to the command of Jehovah, by the hand of Moses;";
dby[9] = "And the children of Reuben and the children of Gad and the half tribe of Manasseh returned, and departed from the children of Israel out of Shiloh, which is in the land of Canaan, to go to the country of Gilead, into the land of their possession, of which they had become possessed, according to the word of Jehovah through Moses.";
web[9] = "And the children of Reuben, and the children of Gad, and the half-tribe of Manasseh returned, and departed from the children of Israel out of Shiloh, which [is] in the land of Canaan, to go to the country of Gilead, to the land of their possession, of which they were possessed, according to the word of the LORD by the hand of Moses.";
hnv[9] = " The children of Re\'uven and the children of Gad and the half-tribe of Menashsheh returned, and departed from the children of Yisra\'el out of Shiloh, which is in the land of Kana`an, to go to the land of Gil`ad, to the land of their possession, whereof they were possessed, according to the mitzvah of the LORD by Moshe.";
vul[9] = "reversique sunt et abierunt filii Ruben et filii Gad et dimidia tribus Manasse a filiis Israhel de Silo quae sita est in Chanaan ut intrarent Galaad terram possessionis suae quam obtinuerant iuxta imperium Domini in manu Mosi";
kjv[10] = "And when they came unto the borders of Jordan, that [are] in the land of Canaan, the children of Reuben and the children of Gad and the half tribe of Manasseh built there an altar by Jordan, a great altar to see to.";
rsv[10] = "And when they came to the region about the Jordan, that lies in the land of Canaan, the Reubenites and the Gadites and the half-tribe of Manas\'seh built there an altar by the Jordan, an altar of great size.";
asv[10] = "And when they came unto the region about the Jordan, that is in the land of Canaan, the children of Reuben and the children of Gad and the half-tribe of Manasseh built there an altar by the Jordan, a great altar to look upon.";
yng[10] = "and they come in unto the districts of the Jordan, which [are] in the land of Canaan, and the sons of Reuben, and the sons of Gad, and the half of the tribe of Manasseh, build there an altar by the Jordan -- a great altar for appearance.";
dby[10] = "And they came to the districts of the Jordan that are in the land of Canaan; and the children of Reuben and the children of Gad and the half tribe of Manasseh built there an altar by the Jordan, an altar of grand appearance.";
web[10] = "And when they came to the borders of Jordan, that [are] in the land of Canaan, the children of Reuben, and the children of Gad, and the half-tribe of Manasseh built there an altar by Jordan, a great altar to the sight.";
hnv[10] = "When they came to the region about the Yarden, that is in the land of Kana`an, the children of Re\'uven and the children of Gad and the half-tribe of Menashsheh built there an altar by the Yarden, a great altar to look on.";
vul[10] = "cumque venissent ad tumulos Iordanis in terra Chanaan aedificaverunt iuxta Iordanem altare infinitae magnitudinis";
kjv[11] = "And the children of Israel heard say, Behold, the children of Reuben and the children of Gad and the half tribe of Manasseh have built an altar over against the land of Canaan, in the borders of Jordan, at the passage of the children of Israel.";
rsv[11] = "And the people of Israel heard say, &quot;Behold, the Reubenites and the Gadites and the half-tribe of Manas\'seh have built an altar at the frontier of the land of Canaan, in the region about the Jordan, on the side that belongs to the people of Israel.&quot;";
asv[11] = "And the children of Israel heard say, Behold, the children of Reuben and the children of Gad and the half-tribe of Manasseh have built an altar in the forefront of the land of Canaan, in the region about the Jordan, on the side that pertaineth to the children of Israel.";
yng[11] = "And the sons of Israel hear, saying, `Lo, the sons of Reuben, and the sons of Gad, and the half of the tribe of Manasseh, have built the altar over-against the land of Canaan, on the districts of the Jordan, at the passage of the sons of Israel.\'";
dby[11] = "And the children of Israel heard say, Behold, the children of Reuben and the children of Gad and the half tribe of Manasseh have built an altar over against the land of Canaan, in the districts of the Jordan, separately from the children of Israel.";
web[11] = "And the children of Israel heard it said, Behold, the children of Reuben, and the children of Gad, and the half-tribe of Manasseh, have built an altar over against the land of Canaan, in the borders of Jordan, at the passage of the children of Israel.";
hnv[11] = " The children of Yisra\'el heard say, Behold, the children of Re\'uven and the children of Gad and the half-tribe of Menashsheh have built an altar in the forefront of the land of Kana`an, in the region about the Yarden, on the side that pertains to the children of Yisra\'el.";
vul[11] = "quod cum audissent filii Israhel et ad eos certi nuntii detulissent aedificasse filios Ruben et Gad et dimidiae tribus Manasse altare in terra Chanaan super Iordanis tumulos contra filios Israhel";
kjv[12] = "And when the children of Israel heard [of it], the whole congregation of the children of Israel gathered themselves together at Shiloh, to go up to war against them.";
rsv[12] = "And when the people of Israel heard of it, the whole assembly of the people of Israel gathered at Shiloh, to make war against them.";
asv[12] = "And when the children of Israel heard of it, the whole congregation of the children of Israel gathered themselves together at Shiloh, to go up against them to war.";
yng[12] = "And the sons of Israel hear, and all the company of the sons of Israel is assembled at Shiloh, to go up against them to war;";
dby[12] = "And when the children of Israel heard [of it], the whole assembly of the children of Israel gathered together at Shiloh, to go up against them to war.";
web[12] = "And when the children of Israel heard [of it], the whole congregation of the children of Israel assembled at Shiloh, to go up to war against them.";
hnv[12] = " When the children of Yisra\'el heard of it, the whole congregation of the children of Yisra\'el gathered themselves together at Shiloh, to go up against them to war.";
vul[12] = "convenerunt omnes in Silo ut ascenderent et dimicarent contra eos";
kjv[13] = "And the children of Israel sent unto the children of Reuben, and to the children of Gad, and to the half tribe of Manasseh, into the land of Gilead, Phinehas the son of Eleazar the priest,";
rsv[13] = "Then the people of Israel sent to the Reubenites and the Gadites and the half-tribe of Manas\'seh, in the land of Gilead, Phin\'ehas the son of Elea\'zar the priest,";
asv[13] = "And the children of Israel sent unto the children of Reuben, and to the children of Gad, and to the half-tribe of Manasseh, into the land of Gilead, Phinehas the son of Eleazar the priest,";
yng[13] = "and the sons of Israel send unto the sons of Reuben, and unto the sons of Gad, and unto the half of the tribe of Manasseh -- unto the land of Gilead -- Phinehas son of Eleazar the priest,";
dby[13] = "And the children of Israel sent to the children of Reuben, and to the children of Gad, and to the half tribe of Manasseh, into the land of Gilead, Phinehas the son of Eleazar the priest,";
web[13] = "And the children of Israel sent to the children of Reuben, and to the children of Gad, and to the half-tribe of Manasseh into the land of Gilead, Phinehas the son of Eleazar the priest,";
hnv[13] = "The children of Yisra\'el sent to the children of Re\'uven, and to the children of Gad, and to the half-tribe of Menashsheh, into the land of Gil`ad, Pinechas the son of El`azar the Kohen,";
vul[13] = "et interim miserunt ad illos in terram Galaad Finees filium Eleazar sacerdotem";
kjv[14] = "And with him ten princes, of each chief house a prince throughout all the tribes of Israel; and each one [was] an head of the house of their fathers among the thousands of Israel.";
rsv[14] = "and with him ten chiefs, one from each of the tribal families of Israel, every one of them the head of a family among the clans of Israel.";
asv[14] = "and with him ten princes, one prince of a fathers\' house for each of the tribes of Israel; and they were every one of them head of their fathers\' houses among the thousands of Israel.";
yng[14] = "and ten princes with him, one prince, one prince, for a house of a father, for all the tribes of Israel, and each of them a head of a house of their fathers, for the thousands of Israel.";
dby[14] = "and with him ten princes, of each father\'s house a prince, out of all the tribes of Israel; and each of them was head of a father\'s house, of the thousands of Israel.";

hnv[14] = "and with him ten princes, one prince of a fathers\' house for each of the tribes of Yisra\'el; and they were everyone of them head of their fathers\' houses among the thousands of Yisra\'el.";
vul[14] = "et decem principes cum eo singulos de tribubus singulis";

yng[15] = "And they come in unto the sons of Reuben, and unto the sons of Gad, and unto the half of the tribe of Manasseh, unto the land of Gilead, and speak with them, saying,";
dby[15] = "And they came to the children of Reuben, and to the children of Gad, and to the half tribe of Manasseh, to the land of Gilead, and spoke with them, saying,";
web[15] = "And they came to the children of Reuben, and to the children of Gad, and to the half-tribe of Manasseh, to the land of Gilead, and they spoke with them, saying,";
hnv[15] = "They came to the children of Re\'uven, and to the children of Gad, and to the half-tribe of Menashsheh, to the land of Gil`ad, and they spoke with them, saying,";

kjv[16] = "Thus saith the whole congregation of the LORD, What trespass [is] this that ye have committed against the God of Israel, to turn away this day from following the LORD, in that ye have builded you an altar, that ye might rebel this day against the LORD?";
rsv[16] = "&quot;Thus says the whole congregation of the LORD, \'What is this treachery which you have committed against the God of Israel in turning away this day from following the LORD, by building yourselves an altar this day in rebellion against the LORD?";
asv[16] = "Thus saith the whole congregation of Jehovah, What trespass is this that ye have committed against the God of Israel, to turn away this day from following Jehovah, in that ye have builded you an altar, to rebel this day against Jehovah?";
yng[16] = "`Thus said all the company of Jehovah, What [is] this trespass which ye have trespassed against the God of Israel, to turn back to-day from after Jehovah, by your building for you an altar, for your rebelling to-day against Jehovah?";
dby[16] = "Thus saith the whole assembly of Jehovah: What wickedness is this which ye have committed against the God of Israel, to turn away this day from following Jehovah, in that ye have built yourselves an altar, rebelling this day against Jehovah?";
web[16] = "Thus saith the whole congregation of the LORD, What trespass [is] this that ye have committed against the God of Israel, to turn away this day from following the LORD, in that ye have built you an altar, that ye might rebel this day against the LORD?";
hnv[16] = "Thus says the whole congregation of the LORD, What trespass is this that you have committed against the God of Yisra\'el, to turn away this day from following the LORD, in that you have built you an altar, to rebel this day against the LORD?";
vul[16] = "haec mandat omnis populus Domini quae est ista transgressio cur reliquistis Dominum Deum Israhel aedificantes altare sacrilegum et a cultu illius recedentes";
kjv[17] = "[Is] the iniquity of Peor too little for us, from which we are not cleansed until this day, although there was a plague in the congregation of the LORD,";
rsv[17] = "Have we not had enough of the sin at Pe\'or from which even yet we have not cleansed ourselves, and for which there came a plague upon the congregation of the LORD,";
asv[17] = "Is the iniquity of Peor too little for us, from which we have not cleansed ourselves unto this day, although there came a plague upon the congregation of Jehovah,";
yng[17] = "Is the iniquity of Peor little to us, from which we have not been cleansed till this day -- and the plague is in the company of Jehovah,";
dby[17] = "Is the iniquity of Peor too little for us? from which we are not cleansed until this day, although there was a plague in the assembly of Jehovah.";
web[17] = "[Is] the iniquity of Peor too little for us, from which we are not cleansed until this day, although there was a plague in the congregation of the LORD,";
hnv[17] = "Is the iniquity of Pe`or too little for us, from which we have not cleansed ourselves to this day, although there came a plague on the congregation of the LORD,";
vul[17] = "an parum vobis est quod peccastis in Beelphegor et usque in praesentem diem macula huius sceleris in nobis permanet multique de populo corruerunt";
kjv[18] = "But that ye must turn away this day from following the LORD? and it will be, [seeing] ye rebel to day against the LORD, that to morrow he will be wroth with the whole congregation of Israel.";
rsv[18] = "that you must turn away this day from following the LORD? And if you rebel against the LORD today he will be angry with the whole congregation of Israel tomorrow.";
asv[18] = "that ye must turn away this day from following Jehovah? and it will be, seeing ye rebel to-day against Jehovah, that to-morrow he will be wroth with the whole congregation of Israel.";
yng[18] = "that ye turn back to-day from after Jehovah? and it hath been -- ye rebel to-day against Jehovah -- and to-morrow against all the company of Israel He is wroth.";
dby[18] = "And ye turn away this day from following Jehovah; and it will be, that since ye rebel this day against Jehovah, to-morrow he will be wroth with the whole assembly of Israel.";
web[18] = "But that ye must turn away this day from following the LORD? and it will be, [seeing] ye rebel to-day against the LORD, that to-morrow he will be wroth with the whole congregation of Israel.";
hnv[18] = "that you must turn away this day from following the LORD? and it will be, seeing you rebel today against the LORD, that tomorrow he will be angry with the whole congregation of Yisra\'el.";
vul[18] = "et vos hodie reliquistis Dominum et cras in universum Israhel eius ira desaeviet";
kjv[19] = "Notwithstanding, if the land of your possession [be] unclean, [then] pass ye over unto the land of the possession of the LORD, wherein the LORD\'S tabernacle dwelleth, and take possession among us: but rebel not against the LORD, nor rebel against us, in building you an altar beside the altar of the LORD our God.";
rsv[19] = "But now, if your land is unclean, pass over into the LORD\'s land where the LORD\'s tabernacle stands, and take for yourselves a possession among us; only do not rebel against the LORD, or make us as rebels by building yourselves an altar other than the altar of the LORD our God.";
asv[19] = "Howbeit, if the land of your possession be unclean, then pass ye over unto the land of the possession of Jehovah, wherein Jehovah\'s tabernacle dwelleth, and take possession among us: but rebel not against Jehovah, nor rebel against us, in building you an altar besides the altar of Jehovah our God.";
yng[19] = "`And surely, if the land of your possession is unclean, pass over for you unto the land of the possession of Jehovah, where the tabernacle of Jehovah hath tabernacled, and have possession in our midst; and against Jehovah rebel not, and against us rebel not, by your building for you an altar, besides the altar of Jehovah our God.";
dby[19] = "Notwithstanding, if the land of your possession is unclean, come over into the land of the possession of Jehovah, where Jehovah\'s tabernacle dwelleth, and take possession amongst us; but rebel not against Jehovah, and rebel not against us, in building for yourselves an altar besides the altar of Jehovah our God.";
web[19] = "Not withstanding, if the land of your possession [is] unclean, [then] pass ye over to the land of the possession of the LORD, in which the LORD\'S tabernacle dwelleth, and take possession among us: but rebel not against the LORD, nor rebel against us, in building you an altar besides the altar of the LORD our God.";
hnv[19] = "However, if the land of your possession be unclean, then pass over to the land of the possession of the LORD, in which the LORD\'s tent dwells, and take possession among us: but don\'t rebel against the LORD, nor rebel against us, in building you an altar besides the altar of the LORD our God.";
vul[19] = "quod si putatis inmundam esse terram possessionis vestrae transite ad terram in qua tabernaculum Domini est et habitate inter nos tantum ut a Domino et a nostro consortio non recedatis aedificato altari praeter altare Domini Dei vestri";
kjv[20] = "Did not Achan the son of Zerah commit a trespass in the accursed thing, and wrath fell on all the congregation of Israel? and that man perished not alone in his iniquity.";
rsv[20] = "Did not Achan the son of Zerah break faith in the matter of the devoted things, and wrath fell upon all the congregation of Israel? And he did not perish alone for his iniquity.\'&quot;";
asv[20] = "Did not Achan the son of Zerah commit a trespass in the devoted thing, and wrath fell upon all the congregation of Israel? and that man perished not alone in his iniquity.";
yng[20] = "Did not Achan son of Zerah commit a trespass in the devoted thing, and on all the company of Israel there was wrath? and he alone expired not in his iniquity.\'";
dby[20] = "Did not Achan the son of Zerah commit a trespass in the accursed thing? and wrath fell on all the assembly of Israel, and he perished not alone in his iniquity.";
web[20] = "Did not Achan the son of Zerah commit a trespass in the accursed thing, and wrath fall on all the congregation of Israel? and that man perished not alone in his iniquity.";
hnv[20] = "Didn\'t `Akhan the son of Zerach commit a trespass in the devoted thing, and wrath fell on all the congregation of Yisra\'el? and that man didn\'t perish alone in his iniquity.";
vul[20] = "nonne Achan filius Zare praeteriit mandatum Domini et super omnem populum Israhel ira eius incubuit et ille erat unus homo atque utinam solus perisset in scelere suo";
kjv[21] = "Then the children of Reuben and the children of Gad and the half tribe of Manasseh answered, and said unto the heads of the thousands of Israel,";
rsv[21] = "Then the Reubenites, the Gadites, and the half-tribe of Manas\'seh said in answer to the heads of the families of Israel,";
asv[21] = "Then the children of Reuben and the children of Gad and the half-tribe of Manasseh answered, and spake unto the heads of the thousands of Israel,";
yng[21] = "And the sons of Reuben, and the sons of Gad, and the half of the tribe of Manasseh, answer and speak with the heads of the thousands of Israel:";
dby[21] = "And the children of Reuben and the children of Gad and the half tribe of Manasseh answered and said to the heads of the thousands of Israel,";
web[21] = "Then the children of Reuben, and the children of Gad, and the half-tribe of Manasseh answered, and said to the heads of the thousands of Israel,";
hnv[21] = "Then the children of Re\'uven and the children of Gad and the half-tribe of Menashsheh answered, and spoke to the heads of the thousands of Yisra\'el,";
vul[21] = "responderuntque filii Ruben et Gad et dimidiae tribus Manasse principibus legationis Israhel";
kjv[22] = "The LORD God of gods, the LORD God of gods, he knoweth, and Israel he shall know; if [it be] in rebellion, or if in transgression against the LORD, (save us not this day,)";
rsv[22] = "&quot;The Mighty One, God, the LORD! The Mighty One, God, the LORD! He knows; and let Israel itself know! If it was in rebellion or in breach of faith toward the LORD, spare us not today";
asv[22] = "The Mighty One, God, Jehovah, the Mighty One, God, Jehovah, he knoweth; and Israel he shall know: if it be in rebellion, or if in trespass against Jehovah (save thou us not this day),";
yng[22] = "`The God of gods -- Jehovah, the God of gods -- Jehovah, He is knowing, and Israel, he doth know, if in rebellion, and if in trespass against Jehovah (Thou dost not save us this day!)";
dby[22] = "The God of gods, Jehovah, the God of gods, Jehovah, he knoweth, and Israel he shall know [it]; if it is in rebellion, or if in trespass against Jehovah, -- save us not this day!";
web[22] = "The LORD God of gods, the LORD God of gods, he knoweth, and Israel he shall know; if [it is] in rebellion, or if in transgression against the LORD, (save us not this day,)";
hnv[22] = "The Mighty One, God, the LORD, the Mighty One, God, the LORD, he knows; and Yisra\'el he shall know: if it be in rebellion, or if in trespass against the LORD (don\'t save us this day,)";
vul[22] = "fortissimus Deus Dominus fortissimus Deus Dominus ipse novit et Israhel simul intelleget si praevaricationis animo hoc altare construximus non custodiat nos sed puniat in praesenti";
kjv[23] = "That we have built us an altar to turn from following the LORD, or if to offer thereon burnt offering or meat offering, or if to offer peace offerings thereon, let the LORD himself require [it];";
rsv[23] = "for building an altar to turn away from following the LORD; or if we did so to offer burnt offerings or cereal offerings or peace offerings on it, may the LORD himself take vengeance.";
asv[23] = "that we have built us an altar to turn away from following Jehovah; or if to offer thereon burnt-offering or meal-offering, or if to offer sacrifices of peace-offerings thereon, let Jehovah himself require it;";
yng[23] = "[we are] building for ourselves an altar to turn back from after Jehovah, and if to cause to go up on it burnt-offering and present, and if to make on it peace-offerings -- Jehovah Himself doth require [it].";
dby[23] = "-- that we have built for ourselves an altar to turn from following Jehovah, and if it is to offer up burnt-offering and oblation on it, and if to offer peace-offerings thereon, let Jehovah himself require it [from us];";
web[23] = "That we have built us an altar to turn from following the LORD, or if to offer on it burnt-offering, or meat-offering, or if to offer peace-offerings on it, let the LORD himself require [it];";
hnv[23] = "that we have built us an altar to turn away from following the LORD; or if to offer thereon burnt offering or meal-offering, or if to offer sacrifices of peace-offerings thereon, let the LORD himself require it;";
vul[23] = "et si ea mente fecimus ut holocausta et sacrificium et pacificas victimas super eo inponeremus ipse quaerat et iudicet";
kjv[24] = "And if we have not [rather] done it for fear of [this] thing, saying, In time to come your children might speak unto our children, saying, What have ye to do with the LORD God of Israel?";
rsv[24] = "Nay, but we did it from fear that in time to come your children might say to our children, \'What have you to do with the LORD, the God of Israel?";
asv[24] = "and if we have not [rather] out of carefulness done this, [and] of purpose, saying, In time to come your children might speak unto our children, saying, What have ye to do with Jehovah, the God of Israel?";
yng[24] = "`And if not, from fear of [this] thing we have done it, saying, Hereafter your sons do speak to ours sons, saying, What to you and to Jehovah God of Israel?";
dby[24] = "and if we have not done it from fear of this thing, saying, In future your children will speak to our children, saying, What have ye to do with Jehovah the God of Israel?";
web[24] = "And if we have not [rather] done it for fear of [this] thing, saying, In time to come your children may speak to our children, saying, What have ye to do with the LORD God of Israel?";
hnv[24] = "and if we have not [rather] out of carefulness done this, [and] of purpose, saying, In time to come your children might speak to our children, saying, What have you to do with the LORD, the God of Yisra\'el?";
vul[24] = "et non ea magis cogitatione atque tractatu ut diceremus cras dicent filii vestri filiis nostris quid vobis et Domino Deo Israhel";
kjv[25] = "For the LORD hath made Jordan a border between us and you, ye children of Reuben and children of Gad; ye have no part in the LORD: so shall your children make our children cease from fearing the LORD.";
rsv[25] = "For the LORD has made the Jordan a boundary between us and you, you Reubenites and Gadites; you have no portion in the LORD.\' So your children might make our children cease to worship the LORD.";
asv[25] = "for Jehovah hath made the Jordan a border between us and you, ye children of Reuben and children of Gad; ye have no portion in Jehovah: so might your children make our children cease from fearing Jehovah.";
yng[25] = "for a border hath Jehovah put between us and you, O sons of Reuben, and sons of Gad -- Jordan; ye have no portion in Jehovah -- and your sons have caused our sons to cease, not to fear Jehovah.";
dby[25] = "Jehovah hath made the Jordan a border between us and you, ye children of Reuben and children of Gad, ye have no portion in Jehovah! And so shall your children make our children cease from fearing Jehovah.";
web[25] = "For the LORD hath made Jordan a boundary between us and you, ye children of Reuben and children of Gad; ye have no part in the LORD. So shall your children make our children cease from fearing the LORD.";
hnv[25] = "for the LORD has made the Yarden a border between us and you, you children of Re\'uven and children of Gad; you have no portion in the LORD: so might your children make our children cease from fearing the LORD.";
vul[25] = "terminum posuit Dominus inter nos et vos o filii Ruben et filii Gad Iordanem fluvium et idcirco partem non habetis in Domino et per hanc occasionem avertent filii vestri filios nostros a timore Domini putavimus itaque melius";
kjv[26] = "Therefore we said, Let us now prepare to build us an altar, not for burnt offering, nor for sacrifice:";
rsv[26] = "Therefore we said, \'Let us now build an altar, not for burnt offering, nor for sacrifice,";
asv[26] = "Therefore we said, Let us now prepare to build us an altar, not for burnt-offering, nor for sacrifice:";
yng[26] = "`And we say, Pray let us prepare for ourselves to build the altar -- not for burnt-offering nor for sacrifice --";
dby[26] = "And we said, Let us now set to work to build an altar, not for burnt-offering, nor for sacrifice,";
web[26] = "Therefore we said, Let us now prepare to build us an altar, not for burnt-offering, nor for sacrifice:";
hnv[26] = " Therefore we said, Let us now prepare to build us an altar, not for burnt offering, nor for sacrifice:";
vul[26] = "et diximus extruamus nobis altare non in holocausta neque ad victimas offerendas";
kjv[27] = "But [that] it [may be] a witness between us, and you, and our generations after us, that we might do the service of the LORD before him with our burnt offerings, and with our sacrifices, and with our peace offerings; that your children may not say to our children in time to come, Ye have no part in the LORD.";
rsv[27] = "but to be a witness between us and you, and between the generations after us, that we do perform the service of the LORD in his presence with our burnt offerings and sacrifices and peace offerings; lest your children say to our children in time to come, &quot;You have no portion in the LORD.&quot;\'";
asv[27] = "but it shall be a witness between us and you, and between our generations after us, that we may do the service of Jehovah before him with our burnt-offerings, and with our sacrifices, and with our peace-offerings; that your children may not say to our children in time to come, Ye have no portion in Jehovah.";
yng[27] = "but a witness it [is] between us and you, and between our generations after us, to do the service of Jehovah before Him with our burnt-offerings, and with our sacrifices, and with our peace-offerings, and your sons do not say hereafter to our sons, Ye have no portion in Jehovah.";
dby[27] = "but to be a witness between us and you, and between our generations after us, that we might do service to Jehovah before him with our burnt-offerings, and with our sacrifices, and with our peace-offerings; that your children may not say to our children in future, Ye have no portion in Jehovah.";
web[27] = "But [that] it [may be] a witness between us, and you, and our generations after us, that we may do the service of the LORD before him with our burnt-offerings, and with our sacrifices, and with our peace-offerings; that your children may not say to our children in time to come, Ye have no part in the LORD.";
hnv[27] = "but it shall be a witness between us and you, and between our generations after us, that we may do the service of the LORD before him with our burnt offerings, and with our sacrifices, and with our peace-offerings; that your children may not tell our children in time to come, You have no portion in the LORD.";
vul[27] = "sed in testimonium inter nos et vos et subolem nostram vestramque progeniem ut serviamus Domino et iuris nostri sit offerre holocausta et victimas et pacificas hostias et nequaquam dicant cras filii vestri filiis nostris non est vobis pars in Domino";
kjv[28] = "Therefore said we, that it shall be, when they should [so] say to us or to our generations in time to come, that we may say [again], Behold the pattern of the altar of the LORD, which our fathers made, not for burnt offerings, nor for sacrifices; but it [is] a witness between us and you.";
rsv[28] = "And we thought, If this should be said to us or to our descendants in time to come, we should say, \'Behold the copy of the altar of the LORD, which our fathers made, not for burnt offerings, nor for sacrifice, but to be a witness between us and you.\'";
asv[28] = "Therefore said we, It shall be, when they so say to us or to our generations in time to come, that we shall say, Behold the pattern of the altar of Jehovah, which our fathers made, not for burnt-offering, nor for sacrifice; but it is a witness between us and you.";
yng[28] = "`And we say, And it hath been, when they say [so] unto us, and unto our generations hereafter, that we have said, See the pattern of the altar of Jehovah, which our fathers made -- not for burnt-offering nor for sacrifice -- but a witness it [is] between us and you.";
dby[28] = "And we said, If it shall be that in future they so say to us and to our generations, we will say, Behold the pattern of the altar of Jehovah which our fathers made, not for burnt-offering, nor for sacrifice, but as a witness between us and you.";
web[28] = "Therefore said we, that it shall be, when they shall [so] say to us or to our generations in time to come, that we may say, Behold the pattern of the altar of the LORD, which our fathers made, not for burnt-offerings, nor for sacrifices; but [it is] a witness between us and you.";
hnv[28] = "Therefore said we, It shall be, when they so tell us or to our generations in time to come, that we shall say, Behold the pattern of the altar of the LORD, which our fathers made, not for burnt offering, nor for sacrifice; but it is a witness between us and you.";
vul[28] = "quod si voluerint dicere respondebunt eis ecce altare Domini quod fecerunt patres nostri non in holocausta neque in sacrificium sed in testimonium vestrum ac nostrum";
kjv[29] = "God forbid that we should rebel against the LORD, and turn this day from following the LORD, to build an altar for burnt offerings, for meat offerings, or for sacrifices, beside the altar of the LORD our God that [is] before his tabernacle.";
rsv[29] = "Far be it from us that we should rebel against the LORD, and turn away this day from following the LORD by building an altar for burnt offering, cereal offering, or sacrifice, other than the altar of the LORD our God that stands before his tabernacle!&quot;";
asv[29] = "Far be it from us that we should rebel against Jehovah, and turn away this day from following Jehovah, to build an altar for burnt-offering, for meal-offering, or for sacrifice, besides the altar of Jehovah our God that is before his tabernacle.";
yng[29] = "`Far be it from us to rebel against Jehovah, and to turn back to-day from after Jehovah, to build an altar for burnt-offering, for present, and for sacrifice, apart from the altar of Jehovah our God, which [is] before His tabernacle.\'";
dby[29] = "Far be it from us that we should rebel against Jehovah, and turn this day from following Jehovah, in building an altar for burnt-offering, for oblation, and for sacrifice, besides the altar of Jehovah our God that is before his tabernacle.";
web[29] = "Far be it from us that we should rebel against the LORD, and turn this day from following the LORD, to build an altar for burnt-offerings, for meat-offerings, or for sacrifices, besides the altar of the LORD our God that [is] before his tabernacle.";
hnv[29] = "Far be it from us that we should rebel against the LORD, and turn away this day from following the LORD, to build an altar for burnt-offering, for meal-offering, or for sacrifice, besides the altar of the LORD our God that is before his tent.";
vul[29] = "absit a nobis hoc scelus ut recedamus a Domino et eius vestigia relinquamus extructo altari ad holocausta et sacrificia et victimas offerendas praeter altare Domini Dei nostri quod extructum est ante tabernaculum eius";
kjv[30] = "And when Phinehas the priest, and the princes of the congregation and heads of the thousands of Israel which [were] with him, heard the words that the children of Reuben and the children of Gad and the children of Manasseh spake, it pleased them.";
rsv[30] = "When Phin\'ehas the priest and the chiefs of the congregation, the heads of the families of Israel who were with him, heard the words that the Reubenites and the Gadites and the Manas\'sites spoke, it pleased them well.";
asv[30] = "And when Phinehas the priest, and the princes of the congregation, even the heads of the thousands of Israel that were with him, heard the words that the children of Reuben and the children of Gad and the children of Manasseh spake, it pleased them well.";
yng[30] = "And Phinehas the priest, and the princes of the company, and the heads of the thousands of Israel, who [are] with him, hear the words which the sons of Reuben, and the sons of Gad, and the sons of Manasseh have spoken, and it is good in their eyes.";
dby[30] = "And when Phinehas the priest and the princes of the assembly and the heads of the thousands of Israel that were with him heard the words that the children of Reuben and the children of Gad and the children of Manasseh spoke, it was good in their sight.";
web[30] = "And when Phinehas the priest, and the princes of the congregation, and heads of the thousands of Israel who [were] with him, heard the words that the children of Reuben, and the children of Gad, and the children of Manasseh spoke, it pleased them.";
hnv[30] = "When Pinechas the Kohen, and the princes of the congregation, even the heads of the thousands of Yisra\'el that were with him, heard the words that the children of Re\'uven and the children of Gad and the children of Menashsheh spoke, it pleased them well.";
vul[30] = "quibus auditis Finees sacerdos et principes legationis Israhel qui erant cum eo placati sunt et verba filiorum Ruben et Gad et dimidiae tribus Manasse libentissime susceperunt";
kjv[31] = "And Phinehas the son of Eleazar the priest said unto the children of Reuben, and to the children of Gad, and to the children of Manasseh, This day we perceive that the LORD [is] among us, because ye have not committed this trespass against the LORD: now ye have delivered the children of Israel out of the hand of the LORD.";
rsv[31] = "And Phin\'ehas the son of Elea\'zar the priest said to the Reubenites and the Gadites and the Manas\'sites, &quot;Today we know that the LORD is in the midst of us, because you have not committed this treachery against the LORD; now you have saved the people of Israel from the hand of the LORD.&quot;";
asv[31] = "And Phinehas the son of Eleazar the priest said unto the children of Reuben, and to the children of Gad, and to the children of Manasseh, This day we know that Jehovah is in the midst of us, because ye have not committed this trespass against Jehovah: now have ye delivered the children of Israel out of the hand of Jehovah.";
yng[31] = "And Phinehas son of Eleazar the priest saith unto the sons of Reuben, and unto the sons of Gad, and unto the sons of Manasseh, `To-day we have known that Jehovah [is] in our midst, because ye have not committed against Jehovah this trespass -- then ye have delivered the sons of Israel out of the hand of Jehovah.\'";
dby[31] = "And Phinehas the son of Eleazar the priest said unto the children of Reuben, and to the children of Gad, and to the children of Manasseh, This day we perceive that Jehovah is among us, because ye have not committed this trespass against Jehovah: now have ye delivered the children of Israel out of the hand of Jehovah.";
web[31] = "And Phinehas the son of Eleazar the priest said to the children of Reuben, and to the children of Gad, and to the children of Manasseh, This day we perceive that the LORD [is] among us, because ye have not committed this trespass against the LORD: now ye have delivered the children of Israel out of the hand of the LORD.";
hnv[31] = "Pinechas the son of El`azar the Kohen said to the children of Re\'uven, and to the children of Gad, and to the children of Menashsheh, This day we know that the LORD is in the midst of us, because you have not committed this trespass against the LORD: now have you delivered the children of Yisra\'el out of the hand of the LORD.";
vul[31] = "dixitque Finees filius Eleazari sacerdos ad eos nunc scimus quod nobiscum sit Dominus quoniam alieni estis a praevaricatione hac et liberastis filios Israhel de manu Domini";
kjv[32] = "And Phinehas the son of Eleazar the priest, and the princes, returned from the children of Reuben, and from the children of Gad, out of the land of Gilead, unto the land of Canaan, to the children of Israel, and brought them word again.";
rsv[32] = "Then Phin\'ehas the son of Elea\'zar the priest, and the chiefs, returned from the Reubenites and the Gadites in the land of Gilead to the land of Canaan, to the people of Israel, and brought back word to them.";
asv[32] = "And Phinehas the son of Eleazar the priest, and the princes, returned from the children of Reuben, and from the children of Gad, out of the land of Gilead, unto the land of Canaan, to the children of Israel, and brought them word again.";
yng[32] = "And Phinehas son of Eleazar the priest, and the princes, turn back from the sons of Reuben, and from the sons of Gad, out of the land of Gilead, unto the land of Canaan, unto the sons of Israel, and bring them back word;";
dby[32] = "And Phinehas the son of Eleazar the priest, and the princes, returned from the children of Reuben, and from the children of Gad, out of the land of Gilead, to the land of Canaan, to the children of Israel, and brought them word again.";
web[32] = "And Phinehas the son of Eleazar the priest, and the princes, returned from the children of Reuben, and from the children of Gad, from the land of Gilead, to the land of Canaan, to the children of Israel, and brought them word again.";
hnv[32] = "Pinechas the son of El`azar the Kohen, and the princes, returned from the children of Re\'uven, and from the children of Gad, out of the land of Gil`ad, to the land of Kana`an, to the children of Yisra\'el, and brought them word again.";
vul[32] = "reversusque est cum principibus a filiis Ruben et Gad de terra Galaad finium Chanaan ad filios Israhel et rettulit eis";
kjv[33] = "And the thing pleased the children of Israel; and the children of Israel blessed God, and did not intend to go up against them in battle, to destroy the land wherein the children of Reuben and Gad dwelt.";
rsv[33] = "And the report pleased the people of Israel; and the people of Israel blessed God and spoke no more of making war against them, to destroy the land where the Reubenites and the Gadites were settled.";
asv[33] = "And the thing pleased the children of Israel; and the children of Israel blessed God, and spake no more of going up against them to war, to destroy the land wherein the children of Reuben and the children of Gad dwelt.";
yng[33] = "and the thing is good in the eyes of the sons of Israel, and the sons of Israel bless God, and have not said to go up against them to war, to destroy the land which the sons of Reuben, and the sons of Gad, are dwelling in.";
dby[33] = "And the thing was good in the sight of the children of Israel, and the children of Israel blessed God, and no more said that they would go up in warfare against them, to destroy the land in which the children of Reuben and the children of Gad dwelt.";
web[33] = "And the thing pleased the children of Israel; and the children of Israel blessed God, and did not intend to go up against them in battle, to destroy the land in which the children of Reuben and Gad dwelt.";
hnv[33] = "The thing pleased the children of Yisra\'el; and the children of Yisra\'el blessed God, and spoke no more of going up against them to war, to destroy the land in which the children of Re\'uven and the children of Gad lived.";
vul[33] = "placuitque sermo cunctis audientibus et laudaverunt Deum filii Israhel et nequaquam ultra dixerunt ut ascenderent contra eos atque pugnarent et delerent terram possessionis eorum";
kjv[34] = "And the children of Reuben and the children of Gad called the altar [Ed]: for it [shall be] a witness between us that the LORD [is] God.";
rsv[34] = "The Reubenites and the Gadites called the altar Witness; &quot;For,&quot; said they, &quot;it is a witness between us that the LORD is God.&quot;";
asv[34] = "And the children of Reuben and the children of Gad called the altar [Ed]: For, [said they], it is a witness between us that Jehovah is God.";
yng[34] = "And the sons of Reuben and the sons of Gad proclaim concerning the altar, that `it [is] a witness between us that Jehovah [is] God.\'";
dby[34] = "And the children of Reuben and the children of Gad gave a name to the altar; for it is a witness between us that Jehovah is God.";
web[34] = "And the children of Reuben and the children of Gad called the altar [Ed]: for it [shall be] a witness between us that the LORD [is] God.";
hnv[34] = "The children of Re\'uven and the children of Gad called the altar [`Ed]: For, [said they], it is a witness between us that the LORD is God.";
vul[34] = "vocaveruntque filii Ruben et filii Gad altare quod extruxerant Testimonium nostrum quod Dominus ipse sit Deus";
