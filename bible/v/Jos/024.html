csb[1] = "Joshua assembled all the tribes of Israel at Shechem and summoned Israel\'s elders, leaders, judges, and officers, and they presented themselves before God.";
csb[2] = "Joshua said to all the people, &quot;This is what the LORD, the God of Israel, says: \'Long ago your ancestors, including Terah, the father of Abraham and Nahor, lived beyond the Euphrates River and worshiped other gods.";
csb[3] = "&quot;But I took your father Abraham from the region beyond the Euphrates River, led him throughout the land of Canaan, and multiplied his descendants. I gave him Isaac,";
csb[4] = "&quot;and to Isaac I gave Jacob and Esau. I gave the hill country of Seir to Esau as a possession. &quot; \'Jacob and his sons, however, went down to Egypt.";
csb[5] = "&quot;I sent Moses and Aaron, and I defeated Egypt by what I did within it, and afterward I brought you out.";
csb[6] = "&quot;When I brought your fathers out of Egypt and you reached the Red Sea, the Egyptians pursued your fathers with chariots and horsemen as far as the sea.";
csb[7] = "&quot;Your fathers cried out to the LORD, so he put darkness between you and the Egyptians, and brought the sea over them, engulfing them. Your own eyes saw what I did to Egypt. After that, you lived in the wilderness a long time.";
csb[8] = "&quot; \'Later, I brought you to the land of the Amorites who lived beyond the Jordan. They fought against you, but I handed them over to you. You possessed their land, and I annihilated them before you.";
csb[9] = "&quot;Balak son of Zippor, king of Moab, set out to fight against Israel. He sent for Balaam son of Beor to curse you,";
csb[10] = "&quot;but I would not listen to Balaam. Instead, he repeatedly blessed you, and I rescued you from him.";
csb[11] = "&quot; \'You then crossed the Jordan and came to Jericho. Jericho\'s citizens -- as well as the Amorites, Perizzites, Canaanites, Hethites, Girgashites, Hivites, and Jebusites -- fought against you, but I handed them over to you.";
csb[12] = "&quot;I sent hornets ahead of you, and they drove out the two Amorite kings before you. It was not by your sword or bow.";
csb[13] = "&quot;I gave you a land you did not labor for, and cities you did not build, though you live in them; you are eating from vineyards and olive groves you did not plant.\'";
csb[14] = "&quot;Therefore, fear the LORD and worship him in sincerity and truth. Get rid of the gods your fathers worshiped beyond the Euphrates River and in Egypt, and worship the LORD.";
csb[15] = "&quot;But if it doesn\'t please you to worship the LORD, choose for yourselves today: Which will you worship -- the gods your fathers worshiped beyond the Euphrates River or the gods of the Amorites in whose land you are living? As for me and my family, we will worship the LORD.&quot;";
csb[16] = "The people replied, &quot;We will certainly not abandon the LORD to worship other gods!";
csb[17] = "&quot;For the LORD our God brought us and our fathers out of the land of Egypt, out of the place of slavery, and performed these great signs before our eyes. He also protected us all along the way we went and among all the peoples whose lands we traveled through.";
csb[18] = "&quot;The LORD drove out before us all the peoples, including the Amorites who lived in the land. We too will worship the LORD, because he is our God.&quot;";
csb[19] = "But Joshua told the people, &quot;You will not be able to worship the LORD, because he is a holy God. He is a jealous God; he will not forgive your transgressions and sins.";
csb[20] = "&quot;If you abandon the LORD and worship foreign gods, he will turn against you, harm you, and completely destroy you, after he has been good to you.&quot;";
csb[21] = "&quot;No! &quot; the people answered Joshua. &quot;We will worship the LORD.&quot;";
csb[22] = "Joshua then told the people, &quot;You are witnesses against yourselves that you yourselves have chosen to worship the LORD.&quot; &quot;We are witnesses,&quot; they said.";
csb[23] = "&quot;Then get rid of the foreign gods that are among you and turn your hearts to the LORD, the God of Israel.&quot;";
csb[24] = "So the people said to Joshua, &quot;We will worship the LORD our God and obey him.&quot;";
csb[25] = "On that day Joshua made a covenant for the people at Shechem and established a statute and ordinance for them.";
csb[26] = "Joshua recorded these things in the book of the law of God; he also took a large stone and set it up there under the oak at the sanctuary of the LORD.";
csb[27] = "And Joshua said to all the people, &quot;You see this stone -- it will be a witness against us, for it has heard all the words the LORD said to us, and it will be a witness against you, so that you will not deny your God.&quot;";
csb[28] = "Then Joshua sent the people away, each to his own inheritance.";
csb[29] = "After these things, the LORD\'s servant, Joshua son of Nun, died at the age of 110.";
csb[30] = "They buried him in his allotted territory at Timnath-serah, in the hill country of Ephraim north of Mount Gaash.";
csb[31] = "Israel worshiped the LORD throughout Joshua\'s lifetime and during the lifetimes of the elders who outlived Joshua and who had experienced all the works the LORD had done for Israel.";
csb[32] = "Joseph\'s bones, which the Israelites had brought up from Egypt, were buried at Shechem in the parcel of land Jacob had purchased from the sons of Hamor, Shechem\'s father, for a hundred pieces of silver. It was an inheritance for Joseph\'s descendants.";
csb[33] = "And Eleazar son of Aaron died, and they buried him at Gibeah, which had been given to his son Phinehas in the hill country of Ephraim.";

kjv[11] = "And ye went over Jordan, and came unto Jericho: and the men of Jericho fought against you, the Amorites, and the Perizzites, and the Canaanites, and the Hittites, and the Girgashites, the Hivites, and the Jebusites; and I delivered them into your hand.";

asv[11] = "And ye went over the Jordan, and came unto Jericho: and the men of Jericho fought against you, the Amorite, and the Perizzite, and the Canaanite, and the Hittite, and the Girgashite, the Hivite, and the Jebusite; and I delivered them into your hand.";

kjv[15] = "And if it seem evil unto you to serve the LORD, choose you this day whom ye will serve; whether the gods which your fathers served that [were] on the other side of the flood, or the gods of the Amorites, in whose land ye dwell: but as for me and my house, we will serve the LORD.";
rsv[15] = "And if you be unwilling to serve the LORD, choose this day whom you will serve, whether the gods your fathers served in the region beyond the River, or the gods of the Amorites in whose land you dwell; but as for me and my house, we will serve the LORD.&quot;";
asv[15] = "And if it seem evil unto you to serve Jehovah, choose you this day whom ye will serve; whether the gods which your fathers served that were beyond the River, or the gods of the Amorites, in whose land ye dwell: but as for me and my house, we will serve Jehovah.";
yng[15] = "and if wrong in your eyes to serve Jehovah -- choose for you to-day whom ye do serve; -- whether the gods whom your fathers served, which [are] beyond the River, or the gods of the Amorite in whose land ye are dwelling; and I and my house -- we serve Jehovah.\'";
dby[15] = "And if it seem evil unto you to serve Jehovah, choose you this day whom ye will serve; whether the gods whom your fathers that were on the other side of the river served, or the gods of the Amorite, in whose land ye dwell; but as for me and my house, we will serve Jehovah.";
web[15] = "And if it seemeth evil to you to serve the LORD, choose you this day whom ye will serve, whether the gods which your fathers served that [were] on the other side of the flood, or the gods of the Amorites in whose land ye dwell: but as for me and my house, we will serve the LORD.";
hnv[15] = "If it seem evil to you to serve the LORD, choose you this day whom you will serve; whether the gods which your fathers served that were beyond the River, or the gods of the Amori, in whose land you dwell: but as for me and my house, we will serve the LORD.";
vul[15] = "sin autem malum vobis videtur ut Domino serviatis optio vobis datur eligite hodie quod placet cui potissimum servire debeatis utrum diis quibus servierunt patres vestri in Mesopotamia an diis Amorreorum in quorum terra habitatis ego autem et domus mea serviemus Domino";

kjv[17] = "For the LORD our God, he [it is] that brought us up and our fathers out of the land of Egypt, from the house of bondage, and which did those great signs in our sight, and preserved us in all the way wherein we went, and among all the people through whom we passed:";

asv[17] = "for Jehovah our God, he it is that brought us and our fathers up out of the land of Egypt, from the house of bondage, and that did those great signs in our sight, and preserved us in all the way wherein we went, and among all the peoples through the midst of whom we passed;";
yng[17] = "for Jehovah our God [is] He who is bringing us and our fathers up out of the land of Egypt, out of a house of servants, and who hath done before our eyes these great signs, and doth keep us in all the way in which we have gone, and among all the peoples through whose midst we passed;";
dby[17] = "for Jehovah our God, he it is that brought us up and our fathers out of the land of Egypt, from the house of bondage, and who did those great signs before our eyes, and preserved us in all the way wherein we went, and among all the peoples through whom we passed!";

hnv[17] = "for the LORD our God, he it is who brought us and our fathers up out of the land of Mitzrayim, from the house of bondage, and who did those great signs in our sight, and preserved us in all the way in which we went, and among all the peoples through the midst of whom we passed;";
vul[17] = "Dominus Deus noster ipse eduxit nos et patres nostros de terra Aegypti de domo servitutis fecitque videntibus nobis signa ingentia et custodivit nos in omni via per quam ambulavimus et in cunctis populis per quos transivimus";

vul[18] = "et eiecit universas gentes Amorreum habitatorem terrae quam nos intravimus serviemus igitur Domino quia ipse est Deus noster";
kjv[19] = "And Joshua said unto the people, Ye cannot serve the LORD: for he [is] an holy God; he [is] a jealous God; he will not forgive your transgressions nor your sins.";

yng[19] = "And Joshua saith unto the people, `Ye are not able to serve Jehovah, for a God most holy He [is]; a zealous God He [is]; He doth not bear with your transgression and with your sins.";
dby[19] = "And Joshua said to the people, Ye cannot serve Jehovah, for he is a holy God; he is a jealous God; he will not forgive your transgressions nor your sins.";

kjv[20] = "If ye forsake the LORD, and serve strange gods, then he will turn and do you hurt, and consume you, after that he hath done you good.";
