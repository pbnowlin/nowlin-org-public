csb[1] = "Joshua son of Nun secretly sent two men as spies from the Acacia Grove, saying, &quot;Go and scout the land, especially Jericho.&quot; So they left, and they came to the house of a prostitute named Rahab, and stayed there.";
csb[2] = "The king of Jericho was told, &quot;Look, some of the Israelite men have come here tonight to investigate the land.&quot;";
csb[3] = "Then the king of Jericho sent word to Rahab and said, &quot;Bring out the men who came to you and entered your house, for they came to investigate the entire land.&quot;";
csb[4] = "But the woman had taken the two men and hidden them. So she said, &quot;Yes, the men did come to me, but I didn\'t know where they were from.";
csb[5] = "&quot;At nightfall, when the city gate was about to close, the men went out, and I don\'t know where they were going. Chase after them quickly, and you can catch up with them! &quot;";
csb[6] = "But she had taken them up to the roof and hidden them among the stalks of flax that she had arranged on the roof.";
csb[7] = "The men pursued them along the road to the fords of the Jordan, and as soon as they left to pursue them, the city gate was shut.";
csb[8] = "Before the men fell asleep, she went up on the roof";
csb[9] = "and said to them, &quot;I know that the LORD has given you this land and that the terror of you has fallen on us, and everyone who lives in the land is panicking because of you.";
csb[10] = "&quot;For we have heard how the LORD dried up the water of the Red Sea before you when you came out of Egypt, and what you did to Sihon and Og, the two Amorite kings you completely destroyed across the Jordan.";
csb[11] = "&quot;When we heard this, we lost heart, and everyone\'s courage failed because of you, for the LORD your God is God in heaven above and on earth below.";
csb[12] = "&quot;Now please swear to me by the LORD that you will also show kindness to my father\'s family, because I showed kindness to you. Give me a sure sign";
csb[13] = "&quot;that you will spare the lives of my father, mother, brothers, sisters, and all who belong to them, and save us from death.&quot;";
csb[14] = "The men answered her, &quot;We will give our lives for yours. If you don\'t report our mission, we will show kindness and faithfulness to you when the LORD gives us the land.&quot;";
csb[15] = "Then she let them down by a rope through the window, since she lived in a house that was built into the wall of the city.";
csb[16] = "&quot;Go to the hill country so that the men pursuing you won\'t find you,&quot; she said to them. &quot;Hide there for three days until they return; afterward, go on your way.&quot;";
csb[17] = "The men said to her, &quot;We will be free from this oath you made us swear,";
csb[18] = "&quot;unless, when we enter the land, you tie this scarlet cord to the window through which you let us down. Bring your father, mother, brothers, and all your father\'s family into your house.";
csb[19] = "&quot;If anyone goes out the doors of your house, his death will be his own fault, and we will be innocent. But if anyone with you in the house should be harmed, his death will be our fault.";
csb[20] = "&quot;And if you report our mission, we are free from the oath you made us swear.&quot;";
csb[21] = "&quot;Let it be as you say,&quot; she replied, and she sent them away. After they had gone, she tied the scarlet cord to the window.";
csb[22] = "So the two men went into the hill country and stayed there three days until the pursuers had returned. They searched all along the way, but did not find them.";
csb[23] = "Then the men returned, came down from the hill country, and crossed the Jordan. They went to Joshua son of Nun and reported everything that had happened to them.";
csb[24] = "They told Joshua, &quot;The LORD has handed over the entire land to us. Everyone who lives in the land is also panicking because of us.&quot;";
kjv[1] = "And Joshua the son of Nun sent out of Shittim two men to spy secretly, saying, Go view the land, even Jericho. And they went, and came into an harlot\'s house, named Rahab, and lodged there.";
rsv[1] = "And Joshua the son of Nun sent two men secretly from Shittim as spies, saying, &quot;Go, view the land, especially Jericho.&quot; And they went, and came into the house of a harlot whose name was Rahab, and lodged there.";
asv[1] = "And Joshua the son of Nun sent out of Shittim two men as spies secretly, saying, Go, view the land, and Jericho. And they went and came into the house of a harlot whose name was Rahab, and lay there.";
yng[1] = "And Joshua son of Nun sendeth from Shittim, two men, spies, silently, saying, `Go, see the land -- and Jericho;\' and they go and come into the house of a woman, a harlot, and her name [is] Rahab, and they lie down there.";

vul[1] = "misit ergo Iosue filius Nun de Setthim duos viros exploratores abscondito et dixit eis ite et considerate terram urbemque Hiericho qui pergentes ingressi sunt domum mulieris meretricis nomine Raab et quieverunt apud eam";

asv[2] = "And it was told the king of Jericho, saying, Behold, there came men in hither to-night of the children of Israel to search out the land.";
yng[2] = "And it is told to the king of Jericho, saying, `Lo, men have come in hither to-night, from the sons of Israel, to search the land.";

yng[10] = "`For we have heard how Jehovah dried up the waters of the Red Sea at your presence, in your going out of Egypt, and that which ye have done to the two kings of the Amorite who [are] beyond the Jordan; to Sihon and to Og whom ye devoted.";

vul[10] = "audivimus quod siccaverit Dominus aquas maris Rubri ad vestrum introitum quando egressi estis ex Aegypto et quae feceritis duobus Amorreorum regibus qui erant trans Iordanem Seon et Og quos interfecistis";

vul[18] = "si ingredientibus nobis terram signum fuerit funiculus iste coccineus et ligaveris eum in fenestra per quam nos dimisisti et patrem tuum ac matrem fratresque et omnem cognationem tuam congregaveris in domum tuam";
