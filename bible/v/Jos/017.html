csb[1] = "This was the allotment for the tribe of Manasseh as Joseph\'s firstborn. Gilead and Bashan were given to Machir, the firstborn of Manasseh and the father of Gilead, because he was a man of war.";
csb[2] = "So the allotment was for the rest of Manasseh\'s descendants by their clans, for the sons of Abiezer, Helek, Asriel, Shechem, Hepher, and Shemida. These are the male descendants of Manasseh son of Joseph, by their clans.";
csb[3] = "Now Zelophehad son of Hepher, son of Gilead, son of Machir, son of Manasseh, had no sons, only daughters. These are the names of his daughters: Mahlah, Noah, Hoglah, Milcah, and Tirzah.";
csb[4] = "They came before the priest Eleazar, Joshua son of Nun, and the leaders, saying, &quot;The LORD commanded Moses to give us an inheritance among our male relatives.&quot; So they gave them an inheritance among their father\'s brothers, in keeping with the LORD\'s instruction.";
csb[5] = "As a result, ten tracts fell to Manasseh, besides the land of Gilead and Bashan, which are beyond the Jordan,";
csb[6] = "because Manasseh\'s daughters received an inheritance among his sons. The land of Gilead belonged to the rest of Manasseh\'s sons.";
csb[7] = "The border of Manasseh went from Asher to Michmethath near Shechem. It then went southward toward the inhabitants of En-tappuah.";
csb[8] = "The region of Tappuah belonged to Manasseh, but Tappuah itself on Manasseh\'s border belonged to the descendants of Ephraim.";
csb[9] = "From there the border descended to the Brook of Kanah; south of the brook, cities belonged to Ephraim among Manasseh\'s cities. Manasseh\'s border was on the north side of the brook and ended at the Mediterranean Sea.";
csb[10] = "Ephraim\'s territory was to the south and Manasseh\'s to the north, with the Sea as its border. They reached Asher on the north and Issachar on the east.";
csb[11] = "Beth-shean, Ibleam, and the inhabitants of Dor with their surrounding villages; the inhabitants of En-dor, Taanach, and Megiddo -- the three cities of Naphath -- with their surrounding villages.";
csb[12] = "The descendants of Manasseh could not possess these cities, because the Canaanites were determined to stay in this land.";
csb[13] = "However, when the Israelites grew stronger, they imposed forced labor on the Canaanites but did not drive them out completely.";
csb[14] = "Joseph\'s descendants said to Joshua, &quot;Why did you give us only one tribal allotment as an inheritance? We have many people, because the LORD has been blessing us greatly.&quot;";
csb[15] = "&quot;If you have so many people,&quot; Joshua replied to them, &quot;go to the forest and clear an area for yourselves there in the land of the Perizzites and the Rephaim, because Ephraim\'s hill country is too small for you.&quot;";
csb[16] = "But the descendants of Joseph said, &quot;The hill country is not enough for us, and all the Canaanites who inhabit the valley area have iron chariots, both at Beth-shean with its surrounding villages and in the Jezreel Valley.&quot;";
csb[17] = "So Joshua replied to Joseph\'s family (that is, Ephraim and Manasseh), &quot;You have many people and great strength. You will not have just one allotment,";
csb[18] = "&quot;because the hill country will be yours also. It is a forest; clear it and its outlying areas will be yours. You can also drive out the Canaanites, even though they have iron chariots and are strong.&quot;";
kjv[1] = "There was also a lot for the tribe of Manasseh; for he [was] the firstborn of Joseph; [to wit], for Machir the firstborn of Manasseh, the father of Gilead: because he was a man of war, therefore he had Gilead and Bashan.";
rsv[1] = "Then allotment was made to the tribe of Manas\'seh, for he was the first-born of Joseph. To Machir the first-born of Manas\'seh, the father of Gilead, were allotted Gilead and Bashan, because he was a man of war.";
asv[1] = "And [this] was the lot for the tribe of Manasseh; for he was the first-born of Joseph. As for Machir the first-born of Manasseh, the father of Gilead, because he was a man of war, therefore he had Gilead and Bashan.";
yng[1] = "And the lot is for the tribe of Manasseh (for he [is] first-born of Joseph), for Machir first-born of Manasseh, father of Gilead, for he hath been a man of war, and his are Gilead and Bashan.";
dby[1] = "And the lot came to the tribe of Manasseh (for he was the firstborn of Joseph), to Machir, the firstborn of Manasseh, the father of Gilead, for he was a man of war, and he had Gilead and Bashan.";
web[1] = "There was also a lot for the tribe of Manasseh; for he [was] the first-born of Joseph; [to wit], for Machir the first-born of Manasseh, the father of Gilead: because he was a man of war, therefore he had Gilead and Bashan.";
hnv[1] = "[This] was the lot for the tribe of Menashsheh; for he was the firstborn of Yosef. As for Makhir the firstborn of Menashsheh, the father of Gil`ad, because he was a man of war, therefore he had Gil`ad and Bashan.";
vul[1] = "cecidit autem sors tribui Manasse ipse est enim primogenitus Ioseph Machir primogenito Manasse patri Galaad qui fuit vir pugnator habuitque possessionem Galaad et Basan";
kjv[2] = "There was also [a lot] for the rest of the children of Manasseh by their families; for the children of Abiezer, and for the children of Helek, and for the children of Asriel, and for the children of Shechem, and for the children of Hepher, and for the children of Shemida: these [were] the male children of Manasseh the son of Joseph by their families.";
rsv[2] = "And allotments were made to the rest of the tribe of Manas\'seh, by their families, Abi-e\'zer, Helek, As\'ri-el, Shechem, Hepher, and Shemi\'da; these were the male descendants of Manas\'seh the son of Joseph, by their families.";
asv[2] = "So [the lot] was for the rest of the children of Manasseh according to their families: for the children of Abiezer, and for the children of Helek, and for the children of Asriel, and for the children of Shechem, and for the children of Hepher, and for the children of Shemida: these were the male children of Manasseh the son of Joseph according to their families.";
yng[2] = "And there is for the sons of Manasseh who are left, for their families; for the sons of Abiezer, and for the sons of Helek, and for the sons of Asriel, and for the sons of Shechem, and for the sons of Hepher, and for the sons of Shemida; these [are] the children of Manasseh son of Joseph -- the males -- by their families.";
dby[2] = "There was also [a portion] for the rest of the children of Manasseh according to their families: for the children of Abiezer, and for the children of Helek, and for the children of Asriel, and for the children of Shechem, and for the children of Hepher, and for the children of Shemida: these are the children of Manasseh, the son of Joseph, the males, according to their families.";
web[2] = "There was also [a lot] for the rest of the children of Manasseh by their families; for the children of Abiezer, and for the children of Helek, and for the children of Asriel, and for the children of Shechem, and for the children of Hepher, and for the children of Shemida: these [were] the male children of Manasseh the son of Joseph by their families.";
hnv[2] = "So [the lot] was for the rest of the children of Menashsheh according to their families: for the children of Avi-Ezer, and for the children of Helek, and for the children of Asri\'el, and for the children of Shekhem, and for the children of Hefer, and for the children of Shemida: these were the male children of Menashsheh the son of Yosef according to their families.";
vul[2] = "et reliquis filiorum Manasse iuxta familias suas filiis Abiezer et filiis Elech et filiis Esrihel et filiis Sechem et filiis Epher et filiis Semida isti sunt filii Manasse filii Ioseph mares per cognationes suas";
kjv[3] = "But Zelophehad, the son of Hepher, the son of Gilead, the son of Machir, the son of Manasseh, had no sons, but daughters: and these [are] the names of his daughters, Mahlah, and Noah, Hoglah, Milcah, and Tirzah.";
rsv[3] = "Now Zeloph\'ehad the son of Hepher, son of Gilead, son of Machir, son of Manas\'seh, had no sons, but only daughters; and these are the names of his daughters: Mahlah, Noah, Hoglah, Milcah, and Tirzah.";
asv[3] = "But Zelophehad, the son of Hepher, the son of Gilead, the son of Machir, the son of Manasseh, had no sons, but daughters: and these are the names of his daughters: Mahlah, and Noah, Hoglah, Milcah, and Tirzah.";
yng[3] = "As to Zelophehad, son of Hepher, son of Gilead, son of Machir, son of Manasseh, he hath no children except daughters, and these [are] the names of his daughters: Mahlah, and Noah, Hoglah, Milcah, and Tirzah,";
dby[3] = "And Zelophehad, the son of Hepher, the son of Gilead, the son of Machir, the son of Manasseh, had no sons, but daughters; and these are the names of his daughters: Mahlah, and Noah, Hoglah, Milcah, and Tirzah.";
web[3] = "But Zelophehad, the son of Hepher, the son of Gilead, the son of Machir, the son of Manasseh, had no sons, but daughters: and these [are] the names of his daughters, Mahlah, and Noah, Hoglah, Milcah, and Tirzah.";
hnv[3] = "But Tzelohchad, the son of Hefer, the son of Gil`ad, the son of Makhir, the son of Menashsheh, had no sons, but daughters: and these are the names of his daughters: Mahlach, and No`ah, Hoglah, Milkah, and Tirtzah.";
vul[3] = "Salphaad vero filio Epher filii Galaad filii Machir filii Manasse non erant filii sed solae filiae quarum ista sunt nomina Maala et Noa Egla et Melcha et Thersa";
kjv[4] = "And they came near before Eleazar the priest, and before Joshua the son of Nun, and before the princes, saying, The LORD commanded Moses to give us an inheritance among our brethren. Therefore according to the commandment of the LORD he gave them an inheritance among the brethren of their father.";
rsv[4] = "They came before Elea\'zar the priest and Joshua the son of Nun and the leaders, and said, &quot;The LORD commanded Moses to give us an inheritance along with our brethren.&quot; So according to the commandment of the LORD he gave them an inheritance among the brethren of their father.";
asv[4] = "And they came near before Eleazar the priest, and before Joshua the son of Nun, and before the princes, saying, Jehovah commanded Moses to give us an inheritance among our brethren: therefore according to the commandment of Jehovah he gave them an inheritance among the brethren of their father.";
yng[4] = "and they draw near before Eleazar the priest, and before Joshua son of Nun, and before the princes, saying, `Jehovah commanded Moses to give to us an inheritance in the midst of our brethren;\' and he giveth to them, at the command of Jehovah, an inheritance in the midst of the brethren of their father.";
dby[4] = "And they came near before Eleazar the priest, and before Joshua the son of Nun, and before the princes, saying, Jehovah commanded Moses to give us an inheritance among our brethren. And he gave them according to the commandment of Jehovah an inheritance among the brethren of their father.";
web[4] = "And they came near before Eleazar the priest, and before Joshua the son of Nun, and before the princes, saying, The LORD commanded Moses to give us an inheritance among our brethren: therefore according to the commandment of the LORD he gave them an inheritance among the brethren of their father.";
hnv[4] = "They came near before El`azar the Kohen, and before Yehoshua the son of Nun, and before the princes, saying, the LORD commanded Moshe to give us an inheritance among our brothers: therefore according to the mitzvah of the LORD he gave them an inheritance among the brothers of their father.";
vul[4] = "veneruntque in conspectu Eleazari sacerdotis et Iosue filii Nun et principum dicentes Dominus praecepit per manum Mosi ut daretur nobis possessio in medio fratrum nostrorum deditque eis iuxta imperium Domini possessionem in medio fratrum patris earum";
kjv[5] = "And there fell ten portions to Manasseh, beside the land of Gilead and Bashan, which [were] on the other side Jordan;";
rsv[5] = "Thus there fell to Manas\'seh ten portions, besides the land of Gilead and Bashan, which is on the other side of the Jordan;";
asv[5] = "And there fell ten parts to Manasseh, besides the land of Gilead and Bashan, which is beyond the Jordan;";
yng[5] = "And ten portions fall [to] Manasseh, apart from the land of Gilead and Bashan, which [are] beyond the Jordan;";
dby[5] = "And there fell ten portions to Manasseh, besides the land of Gilead and Bashan, which are beyond the Jordan.";
web[5] = "And there fell ten portions to Manasseh, besides the land of Gilead and Bashan, which [were] on the other side of Jordan;";
hnv[5] = "There fell ten parts to Menashsheh, besides the land of Gil`ad and Bashan, which is beyond the Yarden;";
vul[5] = "et ceciderunt funiculi Manasse decem absque terra Galaad et Basan trans Iordanem";
kjv[6] = "Because the daughters of Manasseh had an inheritance among his sons: and the rest of Manasseh\'s sons had the land of Gilead.";
rsv[6] = "because the daughters of Manas\'seh received an inheritance along with his sons. The land of Gilead was allotted to the rest of the Manas\'sites.";
asv[6] = "because the daughters of Manasseh had an inheritance among his sons. And the land of Gilead belonged unto the rest of the sons of Manasseh.";
yng[6] = "for the daughters of Manasseh have inherited an inheritance in the midst of his sons, and the land of Gilead hath been to the sons of Manasseh who are left.";
dby[6] = "For the daughters of Manasseh received an inheritance among his sons; and the rest of Manasseh\'s sons had the land of Gilead.";
web[6] = "Because the daughters of Manasseh had an inheritance among his sons: and the rest of Manasseh\'s sons had the land of Gilead.";
hnv[6] = "because the daughters of Menashsheh had an inheritance among his sons. The land of Gil`ad belonged to the rest of the sons of Menashsheh.";
vul[6] = "filiae enim Manasse possederunt hereditatem in medio filiorum eius terra autem Galaad cecidit in sortem filiorum Manasse qui reliqui erant";
kjv[7] = "And the coast of Manasseh was from Asher to Michmethah, that [lieth] before Shechem; and the border went along on the right hand unto the inhabitants of Entappuah.";
rsv[7] = "The territory of Manas\'seh reached from Asher to Mich-me\'thath, which is east of Shechem; then the boundary goes along southward to the inhabitants of En-tap\'puah.";
asv[7] = "And the border of Manasseh was from Asher to Michmethath, which is before Shechem; and the border went along to the right hand, unto the inhabitants of En-tappuah.";
yng[7] = "And the border of Manasseh is from Asher to Michmethah, which [is] on the front of Shechem, and the border hath gone on unto the right, unto the inhabitants of En-Tappuah.";
dby[7] = "And the territory of Manasseh was from Asher to Micmethath, which is before Shechem, and the border went on the right hand toward the inhabitants of En-Tappuah.";
web[7] = "And the border of Manasseh was from Asher to Michmethah, that [lieth] before Shechem; and the border went along on the right hand to the inhabitants of En-tappuah.";
hnv[7] = "The border of Menashsheh was from Asher to Mikhmetat, which is before Shekhem; and the border went along to the right hand, to the inhabitants of `Entappu\'ach.";
vul[7] = "fuitque terminus Manasse ab Aser Machmathath quae respicit Sychem et egreditur ad dextram iuxta habitatores fontis Taffuae";
kjv[8] = "[Now] Manasseh had the land of Tappuah: but Tappuah on the border of Manasseh [belonged] to the children of Ephraim;";
rsv[8] = "The land of Tap\'puah belonged to Manas\'seh, but the town of Tap\'puah on the boundary of Manas\'seh belonged to the sons of E\'phraim.";
asv[8] = "The land of Tappuah belonged to Manasseh; but Tappuah on the border of Manasseh belonged to the children of Ephraim.";
yng[8] = "To Manasseh hath been the land of Tappuah, and Tappuah unto the border of Manasseh is to the sons of Ephraim.";
dby[8] = "Manasseh had the land of Tappuah; but Tappuah on the border of Manasseh belonged to the children of Ephraim.";
web[8] = "[Now] Manasseh had the land of Tappuah: but Tappuah on the border of Manasseh [belonged] to the children of Ephraim;";
hnv[8] = "The land of Tappuach belonged to Menashsheh; but Tappuach on the border of Menashsheh belonged to the children of Efrayim.";
vul[8] = "etenim in sorte Manasse ceciderat terra Taffuae quae est iuxta terminos Manasse filiorum Ephraim";
kjv[9] = "And the coast descended unto the river Kanah, southward of the river: these cities of Ephraim [are] among the cities of Manasseh: the coast of Manasseh also [was] on the north side of the river, and the outgoings of it were at the sea:";
rsv[9] = "Then the boundary went down to the brook Kanah. The cities here, to the south of the brook, among the cities of Manas\'seh, belong to E\'phraim. Then the boundary of Manas\'seh goes on the north side of the brook and ends at the sea;";
asv[9] = "And the border went down unto the brook of Kanah, southward of the brook: these cities belonged to Ephraim among the cities of Manasseh: and the border of Manasseh was on the north side of the brook, and the goings out thereof were at the sea:";
yng[9] = "And the border hath come down [to] the brook of Kanah, southward of the brook; these cities of Ephraim [are] in the midst of the cities of Manasseh, and the border of Manasseh [is] on the north of the brook, and its outgoings are at the sea.";
dby[9] = "And the border descended to the torrent Kanah, south of the torrent. These cities were Ephraim\'s among the cities of Manasseh. And the territory of Manasseh was on the north side of the torrent, and ended at the sea.";
web[9] = "And the border descended to the river Kanah, southward of the river. These cities of Ephraim [are] among the cities of Manasseh: the border of Manasseh also [was] on the north side of the river, and the limits of it were at the sea:";
hnv[9] = "The border went down to the brook of Kanah, southward of the brook: these cities belonged to Efrayim among the cities of Menashsheh: and the border of Menashsheh was on the north side of the brook, and the goings out of it were at the sea:";
vul[9] = "descenditque terminus vallis Harundineti in meridiem torrentis civitatum Ephraim quae in medio sunt urbium Manasse terminus Manasse ab aquilone torrentis et exitus eius pergit ad mare";
kjv[10] = "Southward [it was] Ephraim\'s, and northward [it was] Manasseh\'s, and the sea is his border; and they met together in Asher on the north, and in Issachar on the east.";
rsv[10] = "the land to the south being E\'phraim\'s and that to the north being Manas\'seh\'s, with the sea forming its boundary; on the north Asher is reached, and on the east Is\'sachar.";
asv[10] = "southward it was Ephraim\'s, and northward it was Manasseh\'s, and the sea was his border; and they reached to Asher on the north, and to Issachar on the east.";
yng[10] = "Southward [is] to Ephraim and northward to Manasseh, and the sea is his border, and in Asher they meet on the north, and in Issachar on the east.";
dby[10] = "Southward it was Ephraim\'s, and northward it was Manasseh\'s, and the sea was his border. And they touched upon Asher on the north, and upon Issachar on the east.";
web[10] = "Southward [it was] Ephraim\'s, and northward [it was] Manasseh\'s, and the sea is his border; and they met together in Asher on the north, and in Issachar on the east.";
hnv[10] = " southward it was Efrayim\'s, and northward it was Menashsheh\'s, and the sea was his border; and they reached to Asher on the north, and to Yissakhar on the east.";
vul[10] = "ita ut ab austro sit possessio Ephraim et ab aquilone Manasse et utramque claudat mare et coniungantur sibi in tribu Aser ab aquilone et in tribu Isachar ab oriente";
kjv[11] = "And Manasseh had in Issachar and in Asher Bethshean and her towns, and Ibleam and her towns, and the inhabitants of Dor and her towns, and the inhabitants of Endor and her towns, and the inhabitants of Taanach and her towns, and the inhabitants of Megiddo and her towns, [even] three countries.";
rsv[11] = "Also in Is\'sachar and in Asher Manas\'seh had Beth-she\'an and its villages, and Ibleam and its villages, and the inhabitants of Dor and its villages, and the inhabitants of En-dor and its villages, and the inhabitants of Ta\'anach and its villages, and the inhabitants of Megid\'do and its villages; the third is Naphath.";
asv[11] = "And Manasseh had in Issachar and in Asher Beth-shean and its towns, and Ibleam and its towns, and the inhabitants of Dor and its towns, and the inhabitants of En-dor and its towns, and the inhabitants of Taanach and its towns, and the inhabitants of Megiddo and its towns, even the three heights.";
yng[11] = "And Manasseh hath in Issachar and in Asher, Beth-Shean and its towns, and Ibleam and its towns, and the inhabitants of Dor and its towns, and the inhabitants of En-Dor and its towns, and the inhabitants of Taanach and its towns, and the inhabitants of Megiddo and its towns, three counties.";
dby[11] = "And Manasseh had in Issachar and in Asher, Beth-shean and its dependent villages, and Ibleam and its dependent villages, and the inhabitants of Dor and its dependent villages, and the inhabitants of En-Dor and its dependent villages, and the inhabitants of Taanach and its dependent villages, and the inhabitants of Megiddo and its dependent villages, the three hilly regions.";
web[11] = "And Manasseh had in Issachar and in Asher Beth-shean and its towns, and Ibleam and its towns, and the inhabitants of Dor and its towns, and the inhabitants of En-dor and its towns, and the inhabitants of Tanach and its towns, and the inhabitants of Megiddo and its towns, [even] three countries.";
hnv[11] = "Menashsheh had in Yissakhar and in Asher Beth-shean and its towns, and Yivle`am and its towns, and the inhabitants of Dor and its towns, and the inhabitants of En-dor and its towns, and the inhabitants of Ta`nakh and its towns, and the inhabitants of Megiddo and its towns, even the three heights.";
vul[11] = "fuitque hereditas Manasse in Isachar et in Aser Bethsan et viculi eius et Ieblaam cum villulis suis et habitatores Dor cum oppidis suis habitatores quoque Hendor cum villulis suis similiterque habitatores Thanach cum villulis suis et habitatores Mageddo cum viculis suis et tertia pars urbis Nofeth";
kjv[12] = "Yet the children of Manasseh could not drive out [the inhabitants of] those cities; but the Canaanites would dwell in that land.";
rsv[12] = "Yet the sons of Manas\'seh could not take possession of those cities; but the Canaanites persisted in dwelling in that land.";
asv[12] = "Yet the children of Manasseh could not drive out [the inhabitants of] those cities; but the Canaanites would dwell in that land.";
yng[12] = "And the sons of Manasseh have not been able to occupy these cities, and the Canaanite is desirous to dwell in this land,";
dby[12] = "But the children of Manasseh could not dispossess [the inhabitants of] those cities; and the Canaanites would dwell in that land.";
web[12] = "Yet the children of Manasseh could not expel [the inhabitants of] those cities; but the Canaanites would dwell in that land.";
hnv[12] = " Yet the children of Menashsheh couldn\'t drive out [the inhabitants of] those cities; but the Kana`anim would dwell in that land.";
vul[12] = "nec potuerunt filii Manasse has subvertere civitates sed coepit Chananeus habitare in terra ista";
kjv[13] = "Yet it came to pass, when the children of Israel were waxen strong, that they put the Canaanites to tribute; but did not utterly drive them out.";
rsv[13] = "But when the people of Israel grew strong, they put the Canaanites to forced labor, and did not utterly drive them out.";
asv[13] = "And it came to pass, when the children of Israel were waxed strong, that they put the Canaanites to taskwork, and did not utterly drive them out.";
yng[13] = "and it cometh to pass when the sons of Israel have been strong, that they put the Canaanite to tribute, and have not utterly dispossessed him.";
dby[13] = "And it came to pass when the children of Israel were become strong, that they made the Canaanites tributary; but they did not utterly dispossess them.";
web[13] = "Yet it came to pass, when the children of Israel had become strong, that they subjected the Canaanites to tribute; but did not utterly expel them.";
hnv[13] = "It happened, when the children of Yisra\'el had grown strong, that they put the Kana`anim to forced labor, and didn\'t utterly drive them out.";
vul[13] = "postquam autem convaluerunt filii Israhel subiecerunt Chananeos et fecerunt sibi tributarios nec interfecerunt eos";
kjv[14] = "And the children of Joseph spake unto Joshua, saying, Why hast thou given me [but] one lot and one portion to inherit, seeing I [am] a great people, forasmuch as the LORD hath blessed me hitherto?";
rsv[14] = "And the tribe of Joseph spoke to Joshua, saying, &quot;Why have you given me but one lot and one portion as an inheritance, although I am a numerous people, since hitherto the LORD has blessed me?&quot;";
asv[14] = "And the children of Joseph spake unto Joshua, saying, Why hast thou given me but one lot and one part for an inheritance, seeing I am a great people, forasmuch as hitherto Jehovah hath blessed me?";
yng[14] = "And the sons of Joseph speak with Joshua, saying, `Wherefore hast thou given to me an inheritance -- one lot and one portion, and I a numerous people? hitherto hath Jehovah blessed me.\'";
dby[14] = "And the children of Joseph spoke to Joshua, saying, Why hast thou given me as inheritance one lot and one portion, seeing I am a great people, forasmuch as Jehovah has blessed me hitherto?";
web[14] = "And the children of Joseph spoke to Joshua, saying, Why hast thou given me [but] one lot and one portion to inherit, seeing I [am] a great people, forasmuch as the LORD hath hitherto blessed me?";
hnv[14] = "The children of Yosef spoke to Yehoshua, saying, Why have you given me but one lot and one part for an inheritance, seeing I am a great people, because hitherto the LORD has blessed me?";
vul[14] = "locutique sunt filii Ioseph ad Iosue atque dixerunt quare dedisti mihi possessionem sortis et funiculi unius cum sim tantae multitudinis et benedixerit mihi Dominus";
kjv[15] = "And Joshua answered them, If thou [be] a great people, [then] get thee up to the wood [country], and cut down for thyself there in the land of the Perizzites and of the giants, if mount Ephraim be too narrow for thee.";
rsv[15] = "And Joshua said to them, &quot;If you are a numerous people, go up to the forest, and there clear ground for yourselves in the land of the Per\'izzites and the Reph\'aim, since the hill country of E\'phraim is too narrow for you.&quot;";
