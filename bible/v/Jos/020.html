csb[1] = "Then the LORD spoke to Joshua,";
csb[2] = "&quot;Tell the Israelites: Select your cities of refuge, as I instructed you through Moses,";
csb[3] = "&quot;so that a person who kills someone unintentionally or accidentally may flee there. These will be your refuge from the avenger of blood.";
csb[4] = "&quot;When someone flees to one of these cities, stands at the entrance of the city gate, and states his case before the elders of that city, they are to bring him into the city and give him a place to live among them.";
csb[5] = "&quot;And if the avenger of blood pursues him, they must not hand the one who committed manslaughter over to him, for he killed his neighbor accidentally and did not hate him beforehand.";
csb[6] = "&quot;He is to stay in that city until he stands trial before the assembly and until the death of the high priest serving at that time. Then the one who committed manslaughter may return home to his own city from which he fled.&quot;";
csb[7] = "So they designated Kedesh in the hill country of Naphtali in Galilee, Shechem in the hill country of Ephraim, and Kiriath-arba (that is, Hebron) in the hill country of Judah.";
csb[8] = "Across the Jordan east of Jericho, they selected Bezer on the wilderness plateau from Reuben\'s tribe, Ramoth in Gilead from Gad\'s tribe, and Golan in Bashan from Manasseh\'s tribe.";
csb[9] = "These are the cities appointed for all the Israelites and the aliens residing among them, so that anyone who kills a person unintentionally may flee there and not die at the hand of the avenger of blood until he stands before the assembly.";
kjv[1] = "The LORD also spake unto Joshua, saying,";
rsv[1] = "Then the LORD said to Joshua,";
asv[1] = "And Jehovah spake unto Joshua, saying,";
yng[1] = "And Jehovah speaketh unto Joshua, saying,";
dby[1] = "And Jehovah spoke to Joshua, saying,";
web[1] = "The LORD also spoke to Joshua, saying,";
hnv[1] = "The LORD spoke to Yehoshua, saying,";
vul[1] = "et locutus est Dominus ad Iosue dicens loquere filiis Israhel et dic eis";
kjv[2] = "Speak to the children of Israel, saying, Appoint out for you cities of refuge, whereof I spake unto you by the hand of Moses:";
rsv[2] = "&quot;Say to the people of Israel, \'Appoint the cities of refuge, of which I spoke to you through Moses,";
asv[2] = "Speak to the children of Israel, saying, Assign you the cities of refuge, whereof I spake unto you by Moses,";
yng[2] = "`Speak unto the sons of Israel, saying, Give for you cities of refuge, as I have spoken unto you by the hand of Moses,";
dby[2] = "Speak to the children of Israel, saying, Appoint for yourselves the cities of refuge, whereof I spoke unto you through Moses,";
web[2] = "Speak to the children of Israel, saying, Appoint for you cities of refuge, of which I spoke to you by the hand of Moses:";
hnv[2] = "Speak to the children of Yisra\'el, saying, Assign you the cities of refuge, whereof I spoke to you by Moshe,";
vul[2] = "separate urbes fugitivorum de quibus locutus sum ad vos per manum Mosi";
kjv[3] = "That the slayer that killeth [any] person unawares [and] unwittingly may flee thither: and they shall be your refuge from the avenger of blood.";
rsv[3] = "that the manslayer who kills any person without intent or unwittingly may flee there; they shall be for you a refuge from the avenger of blood.";
asv[3] = "that the manslayer that killeth any person unwittingly [and] unawares may flee thither: and they shall be unto you for a refuge from the avenger of blood.";
yng[3] = "for the fleeing thither of a man-slayer smiting life inadvertently, without knowledge; and they have been to you for a refuge from the redeemer of blood.";
dby[3] = "that the slayer who unwittingly without intent smiteth any one mortally may flee thither: and they shall be your refuge from the avenger of blood.";
web[3] = "That the slayer that killeth [any] person unawares [and] ignorantly, may flee thither: and they shall be your refuge from the avenger of blood.";
hnv[3] = "that the manslayer who kills any person unwittingly [and] unawares may flee there: and they shall be to you for a refuge from the avenger of blood.";
vul[3] = "ut confugiat ad eas quicumque animam percusserit nescius et possit evadere iram proximi qui ultor est sanguinis";
kjv[4] = "And when he that doth flee unto one of those cities shall stand at the entering of the gate of the city, and shall declare his cause in the ears of the elders of that city, they shall take him into the city unto them, and give him a place, that he may dwell among them.";
rsv[4] = "He shall flee to one of these cities and shall stand at the entrance of the gate of the city, and explain his case to the elders of that city; then they shall take him into the city, and give him a place, and he shall remain with them.";
asv[4] = "And he shall flee unto one of those cities, and shall stand at the entrance of the gate of the city, and declare his cause in the ears of the elders of that city; and they shall take him into the city unto them, and give him a place, that he may dwell among them.";
yng[4] = "`When [one] hath fled unto one of these cities, and hath stood [at] the opening of the gate of the city, and hath spoken in the ears of the elders of that city his matter, then they have gathered him into the city unto them, and have given to him a place, and he hath dwelt with them.";
dby[4] = "And he shall flee unto one of those cities and stand at the entrance of the city-gate, and shall declare his matter in the ears of the elders of that city; and they shall take him into the city unto them, and give him a place, that he may dwell among them.";
web[4] = "And when he that doth flee to one of those cities shall stand at the entering of the gate of the city, and shall declare his cause in the ears of the elders of that city, they shall take him into the city to them, and give him a place, that he may dwell among them.";
hnv[4] = "He shall flee to one of those cities, and shall stand at the entrance of the gate of the city, and declare his cause in the ears of the Zakenim of that city; and they shall take him into the city to them, and give him a place, that he may dwell among them.";
vul[4] = "cum ad unam harum confugerit civitatum stabitque ante portam civitatis et loquetur senioribus urbis illius ea quae se conprobent innocentem sicque suscipient eum et dabunt ei locum ad habitandum";
kjv[5] = "And if the avenger of blood pursue after him, then they shall not deliver the slayer up into his hand; because he smote his neighbour unwittingly, and hated him not beforetime.";
rsv[5] = "And if the avenger of blood pursues him, they shall not give up the slayer into his hand; because he killed his neighbor unwittingly, having had no enmity against him in times past.";
asv[5] = "And if the avenger of blood pursue after him, then they shall not deliver up the manslayer into his hand; because he smote his neighbor unawares, and hated him not beforetime.";
yng[5] = "`And when the redeemer of blood doth pursue after him, then they do not shut up the man-slayer into his hand, for without knowledge he hath smitten his neighbour, and is not hating him hitherto;";
dby[5] = "And if the avenger of blood pursue after him, they shall not deliver the slayer up into his hand; for he smote his neighbour unwittingly, and hated him not previously.";
web[5] = "And if the avenger of blood shall pursue him, then they shall not deliver the slayer into his hand; because he smote his neighbor ignorantly, and had not hated him before.";
hnv[5] = "If the avenger of blood pursue after him, then they shall not deliver up the manslayer into his hand; because he struck his neighbor unawares, and didn\'t hate him before.";
vul[5] = "cumque ultor sanguinis eum fuerit persecutus non tradent in manus eius quia ignorans percussit proximum eius nec ante biduum triduumve eius probatur inimicus";
kjv[6] = "And he shall dwell in that city, until he stand before the congregation for judgment, [and] until the death of the high priest that shall be in those days: then shall the slayer return, and come unto his own city, and unto his own house, unto the city from whence he fled.";
rsv[6] = "And he shall remain in that city until he has stood before the congregation for judgment, until the death of him who is high priest at the time: then the slayer may go again to his own town and his own home, to the town from which he fled.\'&quot;";
asv[6] = "And he shall dwell in that city, until he stand before the congregation for judgment, until the death of the high priest that shall be in those days: then shall the manslayer return, and come unto his own city, and unto his own house, unto the city from whence he fled.";
yng[6] = "and he hath dwelt in that city till his standing before the company for judgment, till the death of the chief priest who is in those days -- then doth the man-slayer turn back and hath come unto his city, and unto his house, unto the city whence he fled.\'";
dby[6] = "And he shall dwell in that city, until he have stood before the assembly in judgment, until the death of the high-priest that shall be in those days; then shall the slayer return, and come unto his own city, and unto his own house, unto the city from whence he fled.";
web[6] = "And he shall dwell in that city, until he shall stand before the congregation for judgment, [and] until the death of the high-priest that shall be in those days: then shall the slayer return, and come to his own city, and to his own house, to the city from whence he fled.";
hnv[6] = "He shall dwell in that city, until he stand before the congregation for judgment, until the death of the Kohen Gadol that shall be in those days: then shall the manslayer return, and come to his own city, and to his own house, to the city from whence he fled.";
vul[6] = "et habitabit in civitate illa donec stet ante iudicium causam reddens facti sui et moriatur sacerdos magnus qui fuerit in illo tempore tunc revertetur homicida et ingredietur civitatem et domum suam de qua fugerat";
kjv[7] = "And they appointed Kedesh in Galilee in mount Naphtali, and Shechem in mount Ephraim, and Kirjatharba, which [is] Hebron, in the mountain of Judah.";
rsv[7] = "So they set apart Kedesh in Galilee in the hill country of Naph\'tali, and Shechem in the hill country of E\'phraim, and Kir\'iath-ar\'ba (that is, Hebron) in the hill country of Judah.";
asv[7] = "And they set apart Kedesh in Galilee in the hill-country of Naphtali, and Shechem in the hill-country of Ephraim, and Kiriath-arba (the same is Hebron) in the hill-country of Judah.";
yng[7] = "And they sanctify Kedesh in Galilee, in the hill-country of Naphtali, and Shechem in the hill-country of Ephraim, and Kirjath-Arba (it [is] Hebron), in the hill-country of Judah;";
dby[7] = "And they hallowed Kedesh in Galilee in the hill-country of Naphtali, and Shechem in the hill-country of Ephraim, and Kirjath-Arba, that is, Hebron, in the hill-country of Judah.";
web[7] = "And they appointed Kedesh in Galilee in mount Naphtali, and Shechem in mount Ephraim, and Kirjath-arba, (which [is] Hebron) in the mountain of Judah.";
hnv[7] = "They set apart Kedesh in the Galil in the hill-country of Naftali, and Shekhem in the hill-country of Efrayim, and Kiryat-Arba (the same is Hevron) in the hill-country of Yehudah.";
vul[7] = "decreveruntque Cedes in Galilea montis Nepthali et Sychem in monte Ephraim et Cariatharbe ipsa est Hebron in monte Iuda";
kjv[8] = "And on the other side Jordan by Jericho eastward, they assigned Bezer in the wilderness upon the plain out of the tribe of Reuben, and Ramoth in Gilead out of the tribe of Gad, and Golan in Bashan out of the tribe of Manasseh.";
rsv[8] = "And beyond the Jordan east of Jericho, they appointed Bezer in the wilderness on the tableland, from the tribe of Reuben, and Ramoth in Gilead, from the tribe of Gad, and Golan in Bashan, from the tribe of Manas\'seh.";
asv[8] = "And beyond the Jordan at Jericho eastward, they assigned Bezer in the wilderness in the plain out of the tribe of Reuben, and Ramoth in Gilead out of the tribe of Gad, and Golan in Bashan out of the tribe of Manasseh.";
yng[8] = "and beyond the Jordan, [at] Jericho eastward, they have given Bezer in the wilderness, in the plain, out of the tribe of Reuben, and Ramoth in Gilead out of the tribe of Gad, and Golan in Bashan out of the tribe of Manasseh.";
dby[8] = "And beyond the Jordan from Jericho eastward, they assigned Bezer in the wilderness, in the plateau, out of the tribe of Reuben, and Ramoth in Gilead out of the tribe of Gad, and Golan in Bashan of the tribe of Manasseh.";
web[8] = "And on the other side of Jordan by Jericho eastward, they assigned Bezer in the wilderness upon the plain out of the tribe of Reuben, and Ramoth in Gilead out of the tribe of Gad, and Golan in Bashan out of the tribe of Manasseh.";
hnv[8] = "Beyond the Yarden at Yericho eastward, they assigned Betzer in the wilderness in the plain out of the tribe of Re\'uven, and Ramot in Gil`ad out of the tribe of Gad, and Galon in Bashan out of the tribe of Menashsheh.";
vul[8] = "et trans Iordanem contra orientalem plagam Hiericho statuerunt Bosor quae sita est in campestri solitudine de tribu Ruben et Ramoth in Galaad de tribu Gad et Gaulon in Basan de tribu Manasse";
kjv[9] = "These were the cities appointed for all the children of Israel, and for the stranger that sojourneth among them, that whosoever killeth [any] person at unawares might flee thither, and not die by the hand of the avenger of blood, until he stood before the congregation.";
rsv[9] = "These were the cities designated for all the people of Israel, and for the stranger sojourning among them, that any one who killed a person without intent could flee there, so that he might not die by the hand of the avenger of blood, till he stood before the congregation.";
asv[9] = "These were the appointed cities for all the children of Israel, and for the stranger that sojourneth among them, that whosoever killeth any person unwittingly might flee thither, and not die by the hand of the avenger of blood, until he stood before the congregation.";
yng[9] = "These have been cities of meeting for all the sons of Israel, and for a sojourner who is sojourning in their midst, for the fleeing thither of any one smiting life inadvertently, and he doth not die by the hand of the redeemer of blood till his standing before the company.";
dby[9] = "These were the cities appointed for all the children of Israel, and for the stranger that sojourneth among them, that whosoever smiteth any one mortally without intent might flee thither, and not die by the hand of the avenger of blood, until he stood before the assembly.";
web[9] = "These were the cities appointed for all the children of Israel, and for the stranger sojourning among them, that whoever should kill [any] person unawares might flee thither, and not die by the hand of the avenger of blood, until he stood before the congregation.";
hnv[9] = "These were the appointed cities for all the children of Yisra\'el, and for the stranger who sojourns among them, that whoever kills any person unwittingly might flee there, and not die by the hand of the avenger of blood, until he stood before the congregation.";
vul[9] = "hae civitates constitutae sunt cunctis filiis Israhel et advenis qui habitant inter eos ut fugeret ad eas qui animam nescius percussisset et non moreretur in manu proximi effusum sanguinem vindicare cupientis donec staret ante populum expositurus causam suam";
