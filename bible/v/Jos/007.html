csb[1] = "The Israelites, however, were unfaithful regarding the things set apart for destruction. Achan son of Carmi, son of Zabdi, son of Zerah, of the tribe of Judah, took some of what was set apart, and the LORD\'s anger burned against the Israelites.";
csb[2] = "Joshua sent men from Jericho to Ai, which is near Beth-aven, east of Bethel, and told them, &quot;Go up and scout the land.&quot; So the men went up and scouted Ai.";
csb[3] = "After returning to Joshua they reported to him, &quot;Don\'t send all the people, but send about two thousand or three thousand men to attack Ai. Since the people of Ai are so few, don\'t wear out all our people there.&quot;";
csb[4] = "So about three thousand men went up there, but they fled from the men of Ai.";
csb[5] = "The men of Ai struck down about thirty-six of them and chased them from outside the city gate to the quarries, striking them down on the descent. As a result, the people lost heart.";
csb[6] = "Then Joshua tore his clothes and fell facedown to the ground before the ark of the LORD until evening, as did the elders of Israel; they all put dust on their heads.";
csb[7] = "&quot;Oh, Lord GOD,&quot; Joshua said, &quot;why did you ever bring these people across the Jordan to hand us over to the Amorites for our destruction? If only we had been content to remain on the other side of the Jordan!";
csb[8] = "&quot;What can I say, Lord, now that Israel has turned its back and run from its enemies?";
csb[9] = "&quot;When the Canaanites and all who live in the land hear about this, they will surround us and wipe out our name from the earth. Then what will you do about your great name? &quot;";
csb[10] = "The LORD then said to Joshua, &quot;Stand up! Why have you fallen facedown?";
csb[11] = "&quot;Israel has sinned. They have violated my covenant that I appointed for them. They have taken some of what was set apart. They have stolen, deceived, and put those things with their own belongings.";
csb[12] = "&quot;This is why the Israelites cannot stand against their enemies. They will turn their backs and run from their enemies, because they have been set apart for destruction. I will no longer be with you unless you remove from among you what is set apart.";
csb[13] = "&quot;Go and consecrate the people. Tell them to consecrate themselves for tomorrow, for this is what the LORD, the God of Israel, says: There are things that are set apart among you, Israel. You will not be able to stand against your enemies until you remove what is set apart.";
csb[14] = "&quot;In the morning, present yourselves tribe by tribe. The tribe the LORD selects is to come forward clan by clan. The clan the LORD selects is to come forward family by family. The family the LORD selects is to come forward man by man.";
csb[15] = "&quot;The one who is caught with the things set apart must be burned, along with everything he has, because he has violated the LORD\'s covenant and committed an outrage in Israel.&quot;";
csb[16] = "Joshua got up early the next morning. He had Israel come forward tribe by tribe, and the tribe of Judah was selected.";
csb[17] = "He had the clans of Judah come forward, and the Zerahite clan was selected. He had the Zerahite clan come forward by heads of families, and Zabdi was selected.";
csb[18] = "He then had Zabdi\'s family come forward man by man, and Achan son of Carmi, son of Zabdi, son of Zerah, of the tribe of Judah, was selected.";
csb[19] = "So Joshua said to Achan, &quot;My son, give glory to the LORD, the God of Israel, and make a confession to him. I urge you, tell me what you have done. Don\'t hide anything from me.&quot;";
csb[20] = "Achan replied to Joshua, &quot;It is true. I have sinned against the LORD, the God of Israel. This is what I did:";
csb[21] = "&quot;When I saw among the spoils a beautiful cloak from Babylon, five pounds of silver, and a bar of gold weighing a pound and a quarter, I coveted them and took them. You can see for yourself. They are concealed in the ground inside my tent, with the silver under the cloak.&quot;";
csb[22] = "So Joshua sent messengers who ran to the tent, and there was the cloak, concealed in his tent, with the silver underneath.";
csb[23] = "They took the things from inside the tent, brought them to Joshua and all the Israelites, and spread them out in the LORD\'s presence.";
csb[24] = "Then Joshua and all Israel with him took Achan son of Zerah, the silver, the cloak, and the bar of gold, his sons and daughters, his ox, donkey, and sheep, his tent, and all that he had, and brought them up to the Valley of Achor.";
csb[25] = "Joshua said, &quot;Why have you brought us trouble? Today the LORD will bring you trouble! &quot; So all Israel stoned them to death. They burned their bodies, threw stones on them,";
csb[26] = "and raised over him a large pile of rocks that remains still today. Then the LORD turned from his burning anger. Therefore that place is called the Valley of Achor still today.";
kjv[1] = "But the children of Israel committed a trespass in the accursed thing: for Achan, the son of Carmi, the son of Zabdi, the son of Zerah, of the tribe of Judah, took of the accursed thing: and the anger of the LORD was kindled against the children of Israel.";
rsv[1] = "But the people of Israel broke faith in regard to the devoted things; for Achan the son of Carmi, son of Zabdi, son of Zerah, of the tribe of Judah, took some of the devoted things; and the anger of the LORD burned against the people of Israel.";
asv[1] = "But the children of Israel committed a trespass in the devoted thing; for Achan, the son of Carmi, the son of Zabdi, the son of Zerah, of the tribe of Judah, took of the devoted thing: and the anger of Jehovah was kindled against the children of Israel.";
yng[1] = "And the sons of Israel commit a trespass in the devoted thing, and Achan, son of Carmi, son of Zabdi, son of Zerah, of the tribe of Judah, taketh of the devoted thing, and the anger of Jehovah burneth against the sons of Israel.";
dby[1] = "But the children of Israel committed unfaithfulness in that which had been brought under the curse: Achan, the son of Carmi, the son of Zabdi, the son of Zerah, of the tribe of Judah, took of the accursed thing; and the anger of Jehovah was kindled against the children of Israel.";

hnv[1] = "But the children of Yisra\'el committed a trespass in the devoted thing; for `Akhan, the son of Karmi, the son of Zavdi, the son of Zerach, of the tribe of Yehudah, took of the devoted thing: and the anger of the LORD was kindled against the children of Yisra\'el.";

yng[7] = "And Joshua saith, `Ah, Lord Jehovah, why hast Thou at all caused this people to pass over the Jordan, to give us into the hand of the Amorite to destroy us? -- and oh that we had been willing -- and we dwell beyond the Jordan!";

kjv[13] = "Up, sanctify the people, and say, Sanctify yourselves against to morrow: for thus saith the LORD God of Israel, [There is] an accursed thing in the midst of thee, O Israel: thou canst not stand before thine enemies, until ye take away the accursed thing from among you.";

asv[15] = "And it shall be, that he that is taken with the devoted thing shall be burnt with fire, he and all that he hath; because he hath transgressed the covenant of Jehovah, and because he hath wrought folly in Israel.";
yng[15] = "and it hath been, he who is captured with the devoted thing is burnt with fire, he and all that he hath, because he hath transgressed the covenant of Jehovah, and because he hath done folly in Israel.\'";
dby[15] = "And it shall be, that he who is taken with the accursed thing shall be burned with fire, he and all that he hath, because he hath transgressed the covenant of Jehovah, and because he hath wrought wickedness in Israel.";
web[15] = "And it shall be, [that] he that is taken with the accursed thing shall be burnt with fire, he and all that he hath: because he hath transgressed the covenant of the LORD, and because he hath wrought folly in Israel.";
hnv[15] = "It shall be, that he who is taken with the devoted thing shall be burnt with fire, he and all that he has; because he has transgressed the covenant of the LORD, and because he has done folly in Yisra\'el.";
vul[15] = "et quicumque ille in hoc facinore fuerit deprehensus conburetur igni cum omni substantia sua quoniam praevaricatus est pactum Domini et fecit nefas in Israhel";
kjv[16] = "So Joshua rose up early in the morning, and brought Israel by their tribes; and the tribe of Judah was taken:";
rsv[16] = "So Joshua rose early in the morning, and brought Israel near tribe by tribe, and the tribe of Judah was taken;";
asv[16] = "So Joshua rose up early in the morning, and brought Israel near by their tribes; and the tribe of Judah was taken:";
yng[16] = "And Joshua riseth early in the morning, and bringeth Israel near by its tribes, and the tribe of Judah is captured;";
dby[16] = "And Joshua rose early in the morning, and caused Israel to come forward by their tribes, and the tribe of Judah was taken.";
web[16] = "So Joshua rose early in the morning, and brought Israel by their tribes; and the tribe of Judah was taken:";
hnv[16] = "So Yehoshua rose up early in the morning, and brought Yisra\'el near by their tribes; and the tribe of Yehudah was taken:";
vul[16] = "surgens itaque Iosue mane adplicavit Israhel per tribus suas et inventa est tribus Iuda";
kjv[17] = "And he brought the family of Judah; and he took the family of the Zarhites: and he brought the family of the Zarhites man by man; and Zabdi was taken:";
rsv[17] = "and he brought near the families of Judah, and the family of the Zer\'ahites was taken; and he brought near the family of the Zer\'ahites man by man, and Zabdi was taken;";
asv[17] = "and he brought near the family of Judah; and he took the family of the Zerahites: and he brought near the family of the Zerahites man by man; and Zabdi was taken:";
yng[17] = "and he bringeth near the family of Judah, and he captureth the family of the Zarhite; and he bringeth near the family of the Zarhite by men, and Zabdi is captured;";
dby[17] = "And he caused the families of Judah to come forward, and he took the family of the Zarhites. And he caused the family of the Zarhites to come forward man by man, and Zabdi was taken.";
web[17] = "And he brought the family of Judah; and he took the family of the Zarhites: and he brought the family of the Zarhites man by man; and Zabdi was taken:";
hnv[17] = "and he brought near the family of Yehudah; and he took the family of the Zarchi: and he brought near the family of the Zarchi man by man; and Zavdi was taken:";
vul[17] = "quae cum iuxta familias suas esset oblata inventa est familia Zarai illam quoque per viros offerens repperit Zabdi";
kjv[18] = "And he brought his household man by man; and Achan, the son of Carmi, the son of Zabdi, the son of Zerah, of the tribe of Judah, was taken.";
rsv[18] = "and he brought near his household man by man, and Achan the son of Carmi, son of Zabdi, son of Zerah, of the tribe of Judah, was taken.";
asv[18] = "and he brought near his household man by man; and Achan, the son of Carmi, the son of Zabdi, the son of Zerah, of the tribe of Judah, was taken.";
yng[18] = "and he bringeth near his household by men, and Achan -- son of Carmi, son of Zabdi, son of Zerah, of the tribe of Judah -- is captured.";
dby[18] = "And he caused his household to come forward man by man, and Achan, the son of Carmi, the son of Zabdi, the son of Zerah, of the tribe of Judah, was taken.";
web[18] = "And he brought his household man by man; and Achan the son of Carmi, the son of Zabdi, the son of Zerah, of the tribe of Judah, was taken.";
hnv[18] = "and he brought near his household man by man; and `Akhan, the son of Karmi, the son of Zavdi, the son of Zerach, of the tribe of Yehudah, was taken.";
vul[18] = "cuius domum in singulos dividens viros invenit Achan filium Charmi filii Zabdi filii Zare de tribu Iuda";
kjv[19] = "And Joshua said unto Achan, My son, give, I pray thee, glory to the LORD God of Israel, and make confession unto him; and tell me now what thou hast done; hide [it] not from me.";
rsv[19] = "Then Joshua said to Achan, &quot;My son, give glory to the LORD God of Israel, and render praise to him; and tell me now what you have done; do not hide it from me.&quot;";
asv[19] = "And Joshua said unto Achan, My son, give, I pray thee, glory to Jehovah, the God of Israel, and make confession unto him; and tell me now what thou hast done; hide it not from me.";
yng[19] = "And Joshua saith unto Achan, `My son, put, I pray thee, honour on Jehovah, God of Israel, and give to Him thanks, and declare, I pray thee, to me, what thou hast done -- hide not from me.\'";
dby[19] = "And Joshua said to Achan, My son, give, I pray thee, glory to Jehovah the God of Israel, and make confession to him: tell me now what thou hast done, keep it not back from me.";
web[19] = "And Joshua said to Achan, My son, give, I pray thee, glory to the LORD God of Israel, and make confession to him; and tell me now what thou hast done, hide [it] not from me.";
hnv[19] = "Yehoshua said to `Akhan, My son, please give glory to the LORD, the God of Yisra\'el, and make confession to him; and tell me now what you have done; don\'t hide it from me.";
vul[19] = "et ait ad Achan fili mi da gloriam Domino Deo Israhel et confitere atque indica mihi quid feceris ne abscondas";
kjv[20] = "And Achan answered Joshua, and said, Indeed I have sinned against the LORD God of Israel, and thus and thus have I done:";
rsv[20] = "And Achan answered Joshua, &quot;Of a truth I have sinned against the LORD God of Israel, and this is what I did:";
asv[20] = "And Achan answered Joshua, and said, Of a truth I have sinned against Jehovah, the God of Israel, and thus and thus have I done:";
yng[20] = "And Achan answereth Joshua, and saith, `Truly I have sinned against Jehovah, God of Israel, and thus and thus I have done;";
dby[20] = "And Achan answered Joshua and said, Indeed I have sinned against Jehovah the God of Israel, and thus and thus have I done.";
web[20] = "And Achan answered Joshua, and said, Indeed I have sinned against the LORD God of Israel, and thus and thus have I done.";
hnv[20] = "`Akhan answered Yehoshua, and said, Of a truth I have sinned against the LORD, the God of Yisra\'el, and thus and thus have I done:";
vul[20] = "responditque Achan Iosue et dixit ei vere ego peccavi Domino Deo Israhel et sic et sic feci";
kjv[21] = "When I saw among the spoils a goodly Babylonish garment, and two hundred shekels of silver, and a wedge of gold of fifty shekels weight, then I coveted them, and took them; and, behold, they [are] hid in the earth in the midst of my tent, and the silver under it.";
rsv[21] = "when I saw among the spoil a beautiful mantle from Shinar, and two hundred shekels of silver, and a bar of gold weighing fifty shekels, then I coveted them, and took them; and behold, they are hidden in the earth inside my tent, with the silver underneath.&quot;";
asv[21] = "when I saw among the spoil a goodly Babylonish mantle, and two hundred shekels of silver, and a wedge of gold of fifty shekels weight, then I coveted them, and took them; and, behold, they are hid in the earth in the midst of my tent, and the silver under it.";
yng[21] = "and I see among the spoil a goodly robe of Shinar, and two hundred shekels of silver, and one wedge of gold, whose weight [is] fifty shekels, and I desire them, and take them; and lo, they [are] hid in the earth, in the midst of my tent, and the silver under it.\'";
dby[21] = "I saw among the spoils a beautiful mantle of Shinar, and two hundred shekels of silver, and a golden bar of fifty shekels weight, and I coveted them and took them; and behold, they are hid in the earth in the midst of my tent, and the silver under it.";
web[21] = "When I saw among the spoils a goodly Babylonish garment, and two hundred shekels of silver, and a wedge of gold of fifty shekels weight, then I coveted them, and took them, and behold, they [are] hid in the earth in the midst of my tent, and the silver under it.";
hnv[21] = "when I saw among the spoil a goodly mantle of Shin`ar, and two hundred shekels of silver, and a wedge of gold of fifty shekels weight, then I coveted them, and took them; and, behold, they are hid in the eretz in the midst of my tent, and the silver under it.";
vul[21] = "vidi enim inter spolia pallium coccineum valde bonum et ducentos siclos argenti regulamque auream quinquaginta siclorum et concupiscens abstuli et abscondi in terra contra medium tabernaculi mei argentumque fossa humo operui";
kjv[22] = "So Joshua sent messengers, and they ran unto the tent; and, behold, [it was] hid in his tent, and the silver under it.";
rsv[22] = "So Joshua sent messengers, and they ran to the tent; and behold, it was hidden in his tent with the silver underneath.";
asv[22] = "So Joshua sent messengers, and they ran unto the tent; and, behold, it was hid in his tent, and the silver under it.";
yng[22] = "And Joshua sendeth messengers, and they run unto the tent, and lo, it is hidden in his tent, and the silver under it;";
dby[22] = "And Joshua sent messengers, and they ran to the tent, and behold, it was hid in his tent, and the silver under it.";
web[22] = "So Joshua sent messengers, and they ran to the tent, and behold, [it was] hid in his tent, and the silver under it.";
hnv[22] = "So Yehoshua sent messengers, and they ran to the tent; and, behold, it was hid in his tent, and the silver under it.";
vul[22] = "misit ergo Iosue ministros qui currentes ad tabernaculum illius reppererunt cuncta abscondita in eodem loco et argentum simul";
kjv[23] = "And they took them out of the midst of the tent, and brought them unto Joshua, and unto all the children of Israel, and laid them out before the LORD.";
rsv[23] = "And they took them out of the tent and brought them to Joshua and all the people of Israel; and they laid them down before the LORD.";
asv[23] = "And they took them from the midst of the tent, and brought them unto Joshua, and unto all the children of Israel; and they laid them down before Jehovah.";
yng[23] = "and they take them out of the midst of the tent, and bring them in unto Joshua, and unto all the sons of Israel, and pour them out before Jehovah.";
dby[23] = "And they took them out of the midst of the tent, and brought them to Joshua and to all the children of Israel, and laid them out before Jehovah.";
web[23] = "And they took them from the midst of the tent, and brought them to Joshua, and to all the children of Israel, and laid them out before the LORD.";
hnv[23] = "They took them from the midst of the tent, and brought them to Yehoshua, and to all the children of Yisra\'el; and they laid them down before the LORD.";
vul[23] = "auferentesque de tentorio tulerunt ea ad Iosue et ad omnes filios Israhel proieceruntque ante Dominum";
kjv[24] = "And Joshua, and all Israel with him, took Achan the son of Zerah, and the silver, and the garment, and the wedge of gold, and his sons, and his daughters, and his oxen, and his asses, and his sheep, and his tent, and all that he had: and they brought them unto the valley of Achor.";
rsv[24] = "And Joshua and all Israel with him took Achan the son of Zerah, and the silver and the mantle and the bar of gold, and his sons and daughters, and his oxen and asses and sheep, and his tent, and all that he had; and they brought them up to the Valley of Achor.";
asv[24] = "And Joshua, and all Israel with him, took Achan the son of Zerah, and the silver, and the mantle, and the wedge of gold, and his sons, and his daughters, and his oxen, and his asses, and his sheep, and his tent, and all that he had: and they brought them up unto the valley of Achor.";
yng[24] = "And Joshua taketh Achan son of Zerah, and the silver, and the robe, and the wedge of gold, and his sons, and his daughters, and his ox, and his ass, and his flock, and his tent, and all that he hath, and all Israel with him, and they cause them to go up the valley of Achor.";
dby[24] = "Then Joshua, and all Israel with him, took Achan the son of Zerah, and the silver, and the mantle, and the bar of gold, and his sons, and his daughters, and his oxen, and his asses, and his sheep, and his tent, and all that he had; and they brought them up into the valley of Achor.";
web[24] = "And Joshua, and all Israel with him, took Achan the son of Zerah, and the silver, and the garment, and the wedge of gold, and his sons, and his daughters, and his oxen, and his asses, and his sheep, and his tent, and all that he had: and they brought them to the valley of Achor.";
hnv[24] = "Yehoshua, and all Yisra\'el with him, took `Akhan the son of Zerach, and the silver, and the mantle, and the wedge of gold, and his sons, and his daughters, and his oxen, and his donkeys, and his sheep, and his tent, and all that he had: and they brought them up to the valley of `Akhor.";
vul[24] = "tollens itaque Iosue Achan filium Zare argentumque et pallium et auream regulam filiosque eius et filias boves et asinos et oves ipsumque tabernaculum et cunctam supellectilem et omnis Israhel cum eo duxerunt eos ad vallem Achor";
kjv[25] = "And Joshua said, Why hast thou troubled us? the LORD shall trouble thee this day. And all Israel stoned him with stones, and burned them with fire, after they had stoned them with stones.";
rsv[25] = "And Joshua said, &quot;Why did you bring trouble on us? The LORD brings trouble on you today.&quot; And all Israel stoned him with stones; they burned them with fire, and stoned them with stones.";
asv[25] = "And Joshua said, Why hast thou troubled us? Jehovah shall trouble thee this day. And all Israel stoned him with stones; and they burned them with fire, and stoned them with stones.";
yng[25] = "And Joshua saith, `What! thou hast troubled us! -- Jehovah doth trouble thee this day;\' and all Israel cast stones at him, and they burn them with fire, and they stone them with stones,";
dby[25] = "And Joshua said, How hast thou troubled us! Jehovah will trouble thee this day. And all Israel stoned him with stones; and they burned them with fire, and stoned them with stones.";
web[25] = "And Joshua said, why hast thou troubled us? the LORD shall trouble thee this day. And all Israel stoned him with stones, and burned them with fire, after they had stoned them with stones.";
hnv[25] = "Yehoshua said, Why have you troubled us? the LORD shall trouble you this day. All Yisra\'el stoned him with stones; and they burned them with fire, and stoned them with stones.";
vul[25] = "ubi dixit Iosue quia turbasti nos exturbet te Dominus in die hac lapidavitque eum omnis Israhel et cuncta quae illius erant igne consumpta sunt";
kjv[26] = "And they raised over him a great heap of stones unto this day. So the LORD turned from the fierceness of his anger. Wherefore the name of that place was called, The valley of Achor, unto this day.";
rsv[26] = "And they raised over him a great heap of stones that remains to this day; then the LORD turned from his burning anger. Therefore to this day the name of that place is called the Valley of Achor.";
asv[26] = "And they raised over him a great heap of stones, unto this day; and Jehovah turned from the fierceness of his anger. Wherefore the name of that place was called, The valley of Achor, unto this day.";
yng[26] = "and they raise up over him a great heap of stones unto this day, and Jehovah turneth back from the heat of His anger, therefore hath [one] called the name of that place `Valley of Achor\' till this day.";
dby[26] = "And they raised over him a great heap of stones, [which is there] to this day. And Jehovah turned from the fierceness of his anger. Therefore the name of that place was called, The Valley of Achor, to this day.";
web[26] = "And they raised over him a great heap of stones to this day. So the LORD turned from the fierceness of his anger: wherefore the name of that place was called the valley of Achor to this day.";
hnv[26] = "They raised over him a great heap of stones, to this day; and the LORD turned from the fierceness of his anger. Therefore the name of that place was called &quot;The valley of `Akhor&quot; to this day.";
vul[26] = "congregaverunt quoque super eum acervum magnum lapidum qui permanet usque in praesentem diem et aversus est furor Domini ab eis vocatumque est nomen loci illius vallis Achor usque hodie";
</script>
