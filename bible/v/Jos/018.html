csb[1] = "The entire Israelite community assembled at Shiloh and set up the tent of meeting there. The land had been subdued before them,";
csb[2] = "but seven tribes among the Israelites were left who had not divided up their inheritance.";
csb[3] = "So Joshua asked the Israelites, &quot;How long will you delay going out to take possession of the land that the LORD, the God of your fathers, gave you?";
csb[4] = "&quot;Appoint for yourselves three men from each tribe, and I will send them out. They are to go and survey the land, write a description of it for the purpose of their inheritance, and return to me.";
csb[5] = "&quot;Then they are to divide it into seven portions. Judah is to remain in its territory in the south and Joseph\'s family in their territory in the north.";
csb[6] = "&quot;When you have written a description of the seven portions of land and brought it to me, I will cast lots for you here in the presence of the LORD our God.";
csb[7] = "&quot;But the Levites among you do not get a portion, because their inheritance is the priesthood of the LORD. Gad, Reuben, and half the tribe of Manasseh have taken their inheritance beyond the Jordan to the east, which Moses the LORD\'s servant gave them.&quot;";
csb[8] = "As the men prepared to go, Joshua commanded them to write down a description of the land, saying, &quot;Go and survey the land, write a description of it, and return to me. I will then cast lots for you here in Shiloh in the presence of the LORD.&quot;";
csb[9] = "So the men left, went through the land, and described it by towns in a document of seven sections. They returned to Joshua at the camp in Shiloh.";
csb[10] = "Joshua cast lots for them at Shiloh in the presence of the LORD where he distributed the land to the Israelites according to their divisions.";
csb[11] = "The lot came up for the tribe of Benjamin\'s descendants by their clans, and their allotted territory lay between Judah\'s descendants and Joseph\'s descendants.";
csb[12] = "Their border on the north side began at the Jordan, ascended to the slope of Jericho on the north, through the hill country westward, and ended at the wilderness around Beth-aven.";
csb[13] = "From there the border went toward Luz, to the southern slope of Luz (that is, Bethel); it then went down by Ataroth-addar, over the hill south of Lower Beth-horon.";
csb[14] = "On the west side, from the hill facing Beth-horon on the south, the border curved, turning southward, and ended at Kiriath-baal (that is, Kiriath-jearim), a city of the descendants of Judah. This was the west side of their border.";
csb[15] = "The south side began at the edge of Kiriath-jearim, and the border extended westward; it went to the spring at the Waters of Nephtoah.";
csb[16] = "The border descended to the foot of the hill that faces Ben Hinnom Valley at the northern end of Rephaim Valley. It ran down Hinnom Valley toward the south Jebusite slope and downward to En-rogel.";
csb[17] = "It curved northward and went to En-shemesh and on to Geliloth, which is opposite the Ascent of Adummim, and continued down to the Stone of Bohan son of Reuben.";
csb[18] = "Then it went north to the slope opposite the Arabah and proceeded into the plains.";
csb[19] = "The border continued to the north slope of Beth-hoglah and ended at the northern bay of the Dead Sea, at the southern end of the Jordan. This was the southern border.";
csb[20] = "The Jordan formed the border on the east side. This was the inheritance of Benjamin\'s descendants, by their clans, according to its surrounding borders.";
csb[21] = "These were the cities of the tribe of Benjamin\'s descendants by their clans: Jericho, Beth-hoglah, Emek-keziz,";
csb[22] = "Beth-arabah, Zemaraim, Bethel,";
csb[23] = "Avvites, Parah, Ophrah,";
csb[24] = "Chephar-ammoni, Ophni, and Geba -- twelve cities, with their settlements;";
csb[25] = "Gibeon, Ramah, Beeroth,";
csb[26] = "Mizpeh, Chephirah, Mozah,";
csb[27] = "Rekem, Irpeel, Taralah,";
csb[28] = "Zela, Haeleph, Jebus (that is, Jerusalem), Gibeah, and Kiriath -- fourteen cities, with their settlements. This was the inheritance for Benjamin\'s descendants by their clans.";
kjv[1] = "And the whole congregation of the children of Israel assembled together at Shiloh, and set up the tabernacle of the congregation there. And the land was subdued before them.";

asv[1] = "And the whole congregation of the children of Israel assembled themselves together at Shiloh, and set up the tent of meeting there: and the land was subdued before them.";
yng[1] = "And all the company of the sons of Israel are assembled [at] Shiloh, and they cause the tent of meeting to tabernacle there, and the land hath been subdued before them.";
dby[1] = "And the whole assembly of the children of Israel gathered together at Shiloh, and set up the tent of meeting there; and the land was subdued before them.";
web[1] = "And the whole congregation of the children of Israel assembled at Shiloh, and set up the tabernacle of the congregation there: and the land was subdued before them.";
hnv[1] = "The whole congregation of the children of Yisra\'el assembled themselves together at Shiloh, and set up the tent of meeting there: and the land was subdued before them.";

rsv[2] = "There remained among the people of Israel seven tribes whose inheritance had not yet been apportioned.";

yng[2] = "And there are left among the sons of Israel who have not shared their inheritance, seven tribes,";
dby[2] = "And there remained among the children of Israel seven tribes whose inheritance had not been distributed to them.";
web[2] = "And there remained among the children of Israel seven tribes, which had not yet received their inheritance.";
hnv[2] = "There remained among the children of Yisra\'el seven tribes, which had not yet divided their inheritance.";
vul[2] = "remanserant autem filiorum Israhel septem tribus quae necdum acceperant possessiones suas";
kjv[3] = "And Joshua said unto the children of Israel, How long [are] ye slack to go to possess the land, which the LORD God of your fathers hath given you?";
rsv[3] = "So Joshua said to the people of Israel, &quot;How long will you be slack to go in and take possession of the land, which the LORD, the God of your fathers, has given you?";
asv[3] = "And Joshua said unto the children of Israel, How long are ye slack to go in to possess the land, which Jehovah, the God of your fathers, hath given you?";
yng[3] = "and Joshua saith unto the sons of Israel, `Till when are ye remiss to go in to possess the land which He hath given to you, Jehovah, God of your fathers?";
dby[3] = "And Joshua said to the children of Israel, How long will ye shew yourselves slack to go to take possession of the land which Jehovah the God of your fathers hath given you?";
web[3] = "And Joshua said to the children of Israel, How long [are] ye slack to go to possess the land which the LORD God of your fathers hath given you?";
hnv[3] = "Yehoshua said to the children of Yisra\'el, How long are you slack to go in to possess the land, which the LORD, the God of your fathers, has given you?";
vul[3] = "ad quos Iosue ait usquequo marcetis ignavia et non intratis ad possidendam terram quam Dominus Deus patrum vestrorum dedit vobis";
kjv[4] = "Give out from among you three men for [each] tribe: and I will send them, and they shall rise, and go through the land, and describe it according to the inheritance of them; and they shall come [again] to me.";
rsv[4] = "Provide three men from each tribe, and I will send them out that they may set out and go up and down the land, writing a description of it with a view to their inheritances, and then come to me.";
asv[4] = "Appoint for you three men of each tribe: and I will send them, and they shall arise, and walk through the land, and describe it according to their inheritance; and they shall come unto me.";
yng[4] = "Give for you three men for a tribe, and I send them, and they rise and go up and down through the land, and describe it according to their inheritance, and come in unto me,";

web[4] = "Select from among you three men for [each] tribe: and I will send them, and they shall rise, and go through the land, and describe it according to the inheritance of them, and they shall come [again] to me.";
hnv[4] = "Appoint for you three men of each tribe: and I will send them, and they shall arise, and walk through the land, and describe it according to their inheritance; and they shall come to me.";
vul[4] = "eligite de singulis tribubus ternos viros ut mittam eos et pergant atque circumeant terram et describant eam iuxta numerum uniuscuiusque multitudinis referantque ad me quod descripserint";
kjv[5] = "And they shall divide it into seven parts: Judah shall abide in their coast on the south, and the house of Joseph shall abide in their coasts on the north.";
rsv[5] = "They shall divide it into seven portions, Judah continuing in his territory on the south, and the house of Joseph in their territory on the north.";
asv[5] = "And they shall divide it into seven portions: Judah shall abide in his border on the south, and the house of Joseph shall abide in their border on the north.";
yng[5] = "and they have divided it into seven portions -- Judah doth stay by its border on the south, and the house of Joseph do stay by their border on the north --";
dby[5] = "And they shall divide it into seven portions. Judah shall remain in their border on the south, and the house of Joseph shall remain in their border on the north;";
web[5] = "And they shall divide it into seven parts: Judah shall abide in their border on the south, and the house of Joseph shall abide in their borders on the north.";
hnv[5] = "They shall divide it into seven portions: Yehudah shall abide in his border on the south, and the house of Yosef shall abide in their border on the north.";

rsv[6] = "And you shall describe the land in seven divisions and bring the description here to me; and I will cast lots for you here before the LORD our God.";
asv[6] = "And ye shall describe the land into seven portions, and bring [the description] hither to me; and I will cast lots for you here before Jehovah our God.";
yng[6] = "and ye describe the land [in] seven portions, and have brought [it] in unto me hither, and I have cast for you a lot here before Jehovah our God;";
dby[6] = "and *ye* shall describe the land into seven portions, and bring [the description] hither to me, and I will cast lots for you here before Jehovah our God.";
web[6] = "Ye shall therefore describe the land [in] seven parts, and bring [the description] hither to me, that I may cast lots for you here before the LORD our God.";
hnv[6] = "You shall describe the land into seven portions, and bring [the description] here to me; and I will cast lots for you here before the LORD our God.";

kjv[7] = "But the Levites have no part among you; for the priesthood of the LORD [is] their inheritance: and Gad, and Reuben, and half the tribe of Manasseh, have received their inheritance beyond Jordan on the east, which Moses the servant of the LORD gave them.";
rsv[7] = "The Levites have no portion among you, for the priesthood of the LORD is their heritage; and Gad and Reuben and half the tribe of Manas\'seh have received their inheritance beyond the Jordan eastward, which Moses the servant of the LORD gave them.&quot;";
asv[7] = "For the Levites have no portion among you; for the priesthood of Jehovah is their inheritance: and Gad and Reuben and the half-tribe of Manasseh have received their inheritance beyond the Jordan eastward, which Moses the servant of Jehovah gave them.";
yng[7] = "for there is no portion to the Levites in your midst, for the priesthood of Jehovah [is] their inheritance, and Gad, and Reuben, and the half of the tribe of Manasseh received their inheritance beyond the Jordan eastward, which Moses servant of Jehovah gave to them.\'";
dby[7] = "But the Levites have no portion among you, for the priesthood of Jehovah is their inheritance. And Gad, and Reuben, and half the tribe of Manasseh have received their inheritance beyond the Jordan on the east, which Moses the servant of Jehovah gave them.";
web[7] = "But the Levites have no part among you; for the priesthood of the LORD [is] their inheritance. And Gad, and Reuben, and half the tribe of Manasseh, have received their inheritance beyond Jordan on the east, which Moses the servant of the LORD gave them.";
hnv[7] = "For the Levites have no portion among you; for the priesthood of the LORD is their inheritance: and Gad and Re\'uven and the half-tribe of Menashsheh have received their inheritance beyond the Yarden eastward, which Moshe the servant of the LORD gave them.";
vul[7] = "quia non est inter vos pars Levitarum sed sacerdotium Domini est eorum hereditas Gad autem et Ruben et dimidia tribus Manasse iam acceperant possessiones suas trans Iordanem ad orientalem plagam quas dedit eis Moses famulus Domini";
kjv[8] = "And the men arose, and went away: and Joshua charged them that went to describe the land, saying, Go and walk through the land, and describe it, and come again to me, that I may here cast lots for you before the LORD in Shiloh.";
rsv[8] = "So the men started on their way; and Joshua charged those who went to write the description of the land, saying, &quot;Go up and down and write a description of the land, and come again to me; and I will cast lots for you here before the LORD in Shiloh.&quot;";
asv[8] = "And the men arose, and went: and Joshua charged them that went to describe the land, saying, Go and walk through the land, and describe it, and come again to me; and I will cast lots for you here before Jehovah in Shiloh.";
yng[8] = "And the men rise and go; and Joshua commandeth those who are going to describe the land, saying, `Go, and walk up and down through the land, and describe it, and turn back unto me, and here I cast for you a lot before Jehovah in Shiloh.\'";
dby[8] = "And the men arose and went away. And Joshua charged them that went to describe the land, saying, Go and walk through the land, and describe it, and come again to me, and I will cast lots for you here before Jehovah in Shiloh.";
web[8] = "And the men arose, and departed: and Joshua charged them that went to describe the land, saying, Go, and walk through the land, and describe it, and come again to me, that I may here cast lots for you before the LORD in Shiloh.";
hnv[8] = "The men arose, and went: and Yehoshua charged those who went to describe the land, saying, Go and walk through the land, and describe it, and come again to me; and I will cast lots for you here before the LORD in Shiloh.";
vul[8] = "cumque surrexissent viri ut pergerent ad describendam terram praecepit eis Iosue dicens circuite terram et describite eam ac revertimini ad me ut hic coram Domino Deo in Silo mittam vobis sortem";
kjv[9] = "And the men went and passed through the land, and described it by cities into seven parts in a book, and came [again] to Joshua to the host at Shiloh.";
rsv[9] = "So the men went and passed up and down in the land and set down in a book a description of it by towns in seven divisions; then they came to Joshua in the camp at Shiloh,";
asv[9] = "And the men went and passed through the land, and described it by cities into seven portions in a book; and they came to Joshua unto the camp at Shiloh.";
yng[9] = "And the men go, and pass over through the land, and describe it by cities, in seven portions, on a book, and they come in unto Joshua, unto the camp, [at] Shiloh.";
dby[9] = "And the men went and passed through the land, and described it by cities into seven portions, in a book, and they came to Joshua, to the camp at Shiloh.";
web[9] = "And the men went and passed through the land, and described it by cities in seven parts in a book, and came [again], to Joshua to the host at Shiloh.";
hnv[9] = "The men went and passed through the land, and described it by cities into seven portions in a book; and they came to Yehoshua to the camp at Shiloh.";
vul[9] = "itaque perrexerunt et lustrantes eam in septem partes diviserunt scribentes in volumine reversique sunt ad Iosue in castra Silo";
kjv[10] = "And Joshua cast lots for them in Shiloh before the LORD: and there Joshua divided the land unto the children of Israel according to their divisions.";
rsv[10] = "and Joshua cast lots for them in Shiloh before the LORD; and there Joshua apportioned the land to the people of Israel, to each his portion.";
asv[10] = "And Joshua cast lots for them in Shiloh before Jehovah: and there Joshua divided the land unto the children of Israel according to their divisions.";
yng[10] = "And Joshua casteth for them a lot in Shiloh before Jehovah, and there Joshua apportioneth the land to the sons of Israel, according to their divisions.";
dby[10] = "And Joshua cast lots for them in Shiloh before Jehovah. And there Joshua divided the land to the children of Israel according to their divisions.";
web[10] = "And Joshua cast lots for them in Shiloh before the LORD: and there Joshua divided the land to the children of Israel according to their divisions.";
hnv[10] = "Yehoshua cast lots for them in Shiloh before the LORD: and there Yehoshua divided the land to the children of Yisra\'el according to their divisions.";
vul[10] = "qui misit sortes coram Domino in Silo divisitque terram filiis Israhel in septem partes";
kjv[11] = "And the lot of the tribe of the children of Benjamin came up according to their families: and the coast of their lot came forth between the children of Judah and the children of Joseph.";
rsv[11] = "The lot of the tribe of Benjamin according to its families came up, and the territory allotted to it fell between the tribe of Judah and the tribe of Joseph.";
asv[11] = "And the lot of the tribe of the children of Benjamin came up according to their families: and the border of their lot went out between the children of Judah and the children of Joseph.";
yng[11] = "And a lot goeth up [for] the tribe of the sons of Benjamin, for their families; and the border of their lot goeth out between the sons of Judah and the sons of Joseph.";
dby[11] = "And the lot of the tribe of the children of Benjamin came up according to their families. And the territory of their lot came forth between the children of Judah and the children of Joseph.";
web[11] = "And the lot of the tribe of the children of Benjamin came up according to their families: and the border of their lot came forth between the children of Judah and the children of Joseph.";
hnv[11] = "The lot of the tribe of the children of Binyamin came up according to their families: and the border of their lot went out between the children of Yehudah and the children of Yosef.";
vul[11] = "et ascendit sors prima filiorum Beniamin per familias suas ut possiderent terram inter filios Iuda et filios Ioseph";
kjv[12] = "And their border on the north side was from Jordan; and the border went up to the side of Jericho on the north side, and went up through the mountains westward; and the goings out thereof were at the wilderness of Bethaven.";
rsv[12] = "On the north side their boundary began at the Jordan; then the boundary goes up to the shoulder north of Jericho, then up through the hill country westward; and it ends at the wilderness of Beth-a\'ven.";
asv[12] = "And their border on the north quarter was from the Jordan; and the border went up to the side of Jericho on the north, and went up through the hill-country westward; and the goings out thereof were at the wilderness of Beth-aven.";
yng[12] = "And the border is to them at the north side from the Jordan, and the border hath gone up unto the side of Jericho on the north, and gone up through the hill-country westward, and its outgoings have been at the wilderness of Beth-Aven;";
dby[12] = "And their border on the north side was from the Jordan; and the border went up to the side of Jericho on the north, and went up to the mountain westward; and ended at the wilderness of Beth-Aven;";
web[12] = "And their border on the north side was from Jordan; and the border went up to the side of Jericho on the north side, and went up through the mountains westward; and the limits of it were at the wilderness of Beth-aven.";
hnv[12] = "Their border on the north quarter was from the Yarden; and the border went up to the side of Yericho on the north, and went up through the hill-country westward; and the goings out of it were at the wilderness of Beit-Aven.";
vul[12] = "fuitque terminus eorum contra aquilonem ab Iordane pergens iuxta latus Hiericho septentrionalis plagae et inde contra occidentem ad montana conscendens et perveniens in solitudinem Bethaven";
kjv[13] = "And the border went over from thence toward Luz, to the side of Luz, which [is] Bethel, southward; and the border descended to Atarothadar, near the hill that [lieth] on the south side of the nether Bethhoron.";
rsv[13] = "From there the boundary passes along southward in the direction of Luz, to the shoulder of Luz (the same is Bethel), then the boundary goes down to At\'aroth-ad\'dar, upon the mountain that lies south of Lower Beth-hor\'on.";
asv[13] = "And the border passed along from thence to Luz, to the side of Luz (the same is Beth-el), southward; and the border went down to Ataroth-addar, by the mountain that lieth on the south of Beth-horon the nether.";
yng[13] = "and the border hath gone over thence to Luz, unto the side of Luz (it [is] Beth-El) southward, and the border hath gone down [to] Atroth-Addar, by the hill that [is] on the south of the lower Beth-Horon;";
dby[13] = "and the border passed on from thence toward Luz, to the south side of Luz, which is Bethel: and the border went down to Ataroth-Addar, near the hill that is on the south of the lower Beth-horon.";
web[13] = "And the border went over from thence towards Luz, to the side of Luz (which [is] Beth-el) southward; and the border descended to Ataroth-adar, near the hill that [lieth] on the south side of the nether Beth-horon.";
hnv[13] = "The border passed along from there to Luz, to the side of Luz (the same is Beit-El), southward; and the border went down to `Atarot-Addar, by the mountain that lies on the south of Beit-Horon the lower.";
vul[13] = "atque pertransiens iuxta Luzam ad meridiem ipsa est Bethel descenditque in Atharothaddar in montem qui est ad meridiem Bethoron inferioris";
kjv[14] = "And the border was drawn [thence], and compassed the corner of the sea southward, from the hill that [lieth] before Bethhoron southward; and the goings out thereof were at Kirjathbaal, which [is] Kirjathjearim, a city of the children of Judah: this [was] the west quarter.";
rsv[14] = "Then the boundary goes in another direction, turning on the western side southward from the mountain that lies to the south, opposite Beth-hor\'on, and it ends at Kir\'iath-ba\'al (that is, Kir\'iath-je\'arim), a city belonging to the tribe of Judah. This forms the western side.";
asv[14] = "And the border extended [thence], and turned about on the west quarter southward, from the mountain that lieth before Beth-horon southward; and the goings out thereof were at Kiriath-baal (the same is Kiriath-jearim), a city of the children of Judah: this was the west quarter.";
yng[14] = "and the border hath been marked out, and hath gone round to the corner of the sea southward, from the hill which [is] at the front of Beth-Horon southward, and its outgoings have been unto Kirjath-Baal (it [is] Kirjath-Jearim), a city of the sons of Judah: this [is] the west quarter.";
dby[14] = "-- And the border reached along and turned on the west side, southward from the hill that is before Beth-horon southward; and ended at Kirjath-Baal, which is Kirjath-jearim, a city of the children of Judah: this is the west side.";
web[14] = "And the border was drawn [thence], and compassed the corner of the sea southward, from the hill that [lieth] before Beth-horon southward; and the limits of it were at Kirjath-baal (which [is] Kirjath-jearim) a city of the children of Judah. This [was] the west quarter.";
hnv[14] = "The border extended [there], and turned about on the west quarter southward, from the mountain that lies before Beit-Horon southward; and the goings out of it were at Kiryat-Ba`al (the same is Kiryat-Ye`arim), a city of the children of Yehudah: this was the west quarter.";
vul[14] = "et inclinatur circumiens contra mare a meridie montis qui respicit Bethoron contra africum suntque exitus eius in Cariathbaal quae vocatur et Cariathiarim urbem filiorum Iuda haec est plaga contra mare et occidentem";
kjv[15] = "And the south quarter [was] from the end of Kirjathjearim, and the border went out on the west, and went out to the well of waters of Nephtoah:";
rsv[15] = "And the southern side begins at the outskirts of Kir\'iath-je\'arim; and the boundary goes from there to Ephron, to the spring of the Waters of Nephto\'ah;";
asv[15] = "And the south quarter was from the uttermost part of Kiriath-jearim; and the border went out westward, and went out to the fountain of the waters of Nephtoah;";
yng[15] = "And the south quarter [is] from the end of Kirjath-Jearim, and the border hath gone out westward, and gone out unto the fountain of the waters of Nephtoah;";
dby[15] = "-- And the south side was from the extreme end of Kirjath-jearim, and the border went out on the west, and went out to the spring of the waters of Nephtoah.";
web[15] = "And the south quarter [was] from the end of Kirjah-jearim, and the border went out on the west, and went out to the well of waters of Nephtoah:";
hnv[15] = "The south quarter was from the uttermost part of Kiryat-Ye`arim; and the border went out westward, and went out to the spring of the waters of Nefto\'ach;";
vul[15] = "a meridie autem ex parte Cariathiarim egreditur terminus contra mare et pervenit usque ad fontem aquarum Nepthoa";
kjv[16] = "And the border came down to the end of the mountain that [lieth] before the valley of the son of Hinnom, [and] which [is] in the valley of the giants on the north, and descended to the valley of Hinnom, to the side of Jebusi on the south, and descended to Enrogel,";
rsv[16] = "then the boundary goes down to the border of the mountain that overlooks the valley of the son of Hinnom, which is at the north end of the valley of Reph\'aim; and it then goes down the valley of Hinnom, south of the shoulder of the Jeb\'usites, and downward to En-rogel;";
asv[16] = "and the border went down to the uttermost part of the mountain that lieth before the valley of the son of Hinnom, which is in the vale of Rephaim northward; and it went down to the valley of Hinnom, to the side of the Jebusite southward, and went down to En-rogel;";
yng[16] = "and the border hath come down unto the extremity of the hill which [is] on the front of the valley of the son of Hinnom, which [is] in the valley of the Rephaim northward, and hath gone down the valley of Hinnom unto the side of Jebusi southward, and gone down [to] En-Rogel,";
dby[16] = "And the border went down to the end of the mountain that is before the valley of the son of Hinnom, which is in the valley of Rephaim on the north, and went down the valley of Hinnom, to the side of the Jebusite on the south, and went down to En-rogel;";
web[16] = "And the border came down to the end of the mountain that [lieth] before the valley of the son of Hinnom, [and] which [is] in the valley of the giants on the north, and descended to the valley of Hinnom, to the side of Jebusi on the south, and descended to En-rogel,";
hnv[16] = "and the border went down to the uttermost part of the mountain that lies before the valley of the son of Hinnom, which is in the valley of Refa\'im northward; and it went down to the valley of Hinnom, to the side of the Yevusi southward, and went down to `En-Rogel;";
vul[16] = "descenditque in partem montis qui respicit vallem filiorum Ennom et est contra septentrionalem plagam in extrema parte vallis Rafaim descenditque Gehennom id est vallis Ennom iuxta latus Iebusei ad austrum et pervenit ad fontem Rogel";
kjv[17] = "And was drawn from the north, and went forth to Enshemesh, and went forth toward Geliloth, which [is] over against the going up of Adummim, and descended to the stone of Bohan the son of Reuben,";
rsv[17] = "then it bends in a northerly direction going on to En-she\'mesh, and thence goes to Geli\'loth, which is opposite the ascent of Adum\'mim; then it goes down to the Stone of Bohan the son of Reuben;";
asv[17] = "and it extended northward, and went out at En-shemesh, and went out to Geliloth, which is over against the ascent of Adummim; and it went down to the stone of Bohan the son of Reuben;";
yng[17] = "and hath been marked out on the north, and gone out to En-Shemesh, and gone out unto Geliloth, which [is] over-against the ascent of Adummim, and gone down [to] the stone of Bohan son of Reuben,";
dby[17] = "and it reached along on the north, and went forth to En-shemesh, and went forth towards Geliloth, which is opposite to the ascent of Adummim, and went down to the stone of Bohan, the son of Reuben,";
web[17] = "And was drawn from the north, and went forth to En-shemesh, and went forth towards Geliloth, which [is] over against the going up of Adummim, and descended to the stone of Bohan the son of Reuben,";
hnv[17] = "and it extended northward, and went out at `En-Shemesh, and went out to Gelilot, which is over against the ascent of Adummim; and it went down to the stone of Bohan the son of Re\'uven;";
vul[17] = "transiens ad aquilonem et egrediens ad Aensemes id est fontem Solis";
kjv[18] = "And passed along toward the side over against Arabah northward, and went down unto Arabah:";
rsv[18] = "and passing on to the north of the shoulder of Beth-arabah it goes down to the Arabah;";
asv[18] = "and it passed along to the side over against the Arabah northward, and went down unto the Arabah;";
yng[18] = "and passed over unto the side over-against Arabah northward, and gone down to Arabah;";
dby[18] = "and passed along towards the side opposite to Arabah northwards, and went down to Arabah;";
web[18] = "And passed along towards the side over against Arabah northward, and went down to Arabah:";
hnv[18] = "and it passed along to the side over against the `Aravah northward, and went down to the `Aravah;";
vul[18] = "et pertransit usque ad tumulos qui sunt e regione ascensus Adommim descenditque ad Abenboen id est lapidem Boen filii Ruben et pertransit ex latere aquilonis ad campestria descenditque in planitiem";
kjv[19] = "And the border passed along to the side of Bethhoglah northward: and the outgoings of the border were at the north bay of the salt sea at the south end of Jordan: this [was] the south coast.";
rsv[19] = "then the boundary passes on to the north of the shoulder of Beth-hoglah; and the boundary ends at the northern bay of the Salt Sea, at the south end of the Jordan: this is the southern border.";
asv[19] = "and the border passed along to the side of Beth-hoglah northward; and the goings out of the border were at the north bay of the Salt Sea, at the south end of the Jordan: this was the south border.";
yng[19] = "and the border hath passed over unto the side of Beth-Hoglah northward, and the outgoings of the border have been unto the north bay of the salt sea, unto the south extremity of the Jordan; this [is] the south border;";
dby[19] = "and the border passed on to the side of Beth-hoglah on the north, and the border ended at the tongue of the salt sea northward, at the south end of the Jordan: this is the southern border.";
web[19] = "And the border passed along to the side of Beth-hoglah northward: and the limits of the border were at the north bay of the salt sea at the south end of Jordan. This [was] the south border.";
hnv[19] = " and the border passed along to the side of Beit-Hoglah northward; and the goings out of the border were at the north bay of the Salt Sea, at the south end of the Yarden: this was the south border.";
vul[19] = "et praetergreditur contra aquilonem Bethagla suntque exitus eius contra linguam maris Salsissimi ab aquilone in fine Iordanis ad australem plagam";
kjv[20] = "And Jordan was the border of it on the east side. This [was] the inheritance of the children of Benjamin, by the coasts thereof round about, according to their families.";
rsv[20] = "The Jordan forms its boundary on the eastern side. This is the inheritance of the tribe of Benjamin, according to its families, boundary by boundary round about.";
asv[20] = "And the Jordan was the border of it on the east quarter. This was the inheritance of the children of Benjamin, by the borders thereof round about, according to their families.";
yng[20] = "and the Jordan doth border it at the east quarter; this [is] the inheritance of the sons of Benjamin, by its borders round about, for their families.";
dby[20] = "-- And the Jordan borders it on the east side. -- This was the inheritance of the children of Benjamin, according to its borders round about, according to their families.";
web[20] = "And Jordan was the border of it on the east side. This [was] the inheritance of the children of Benjamin, by the limits of it round about, according to their families.";
hnv[20] = "The Yarden was the border of it on the east quarter. This was the inheritance of the children of Binyamin, by the borders of it round about, according to their families.";
vul[20] = "qui est terminus illius ab oriente haec est possessio filiorum Beniamin per terminos suos in circuitu et familias singulas";
kjv[21] = "Now the cities of the tribe of the children of Benjamin according to their families were Jericho, and Bethhoglah, and the valley of Keziz,";
rsv[21] = "Now the cities of the tribe of Benjamin according to their families were Jericho, Beth-hoglah, Emek-ke\'ziz,";
asv[21] = "Now the cities of the tribe of the children of Benjamin according to their families were Jericho, and Beth-hoglah, and Emek-keziz,";
yng[21] = "And the cities for the tribe of the sons of Benjamin, for their families, have been Jericho, and Beth-Hoglah, and the valley of Keziz,";
dby[21] = "And the cities of the tribe of the children of Benjamin according to their families were: Jericho, and Beth-hoglah, and Emek-Keziz,";
web[21] = "Now the cities of the tribe of the children of Benjamin, according to their families, were Jericho, and Beth-hoglah, and the valley of Keziz,";
hnv[21] = "Now the cities of the tribe of the children of Binyamin according to their families were Yericho, and Beit-Hoglah, and Emek-Ketzitz,";
vul[21] = "fueruntque civitates eius Hiericho et Bethagla et vallis Casis";

rsv[22] = "Beth-arabah, Zemara\'im, Bethel,";

yng[22] = "and Beth-Arabah, Zemaraim, and Beth-El,";
dby[22] = "and Beth-Arabah, and Zemaraim, and Bethel,";
web[22] = "And Beth-arabah, and Zemaraim, and Beth-el,";
hnv[22] = "and Beit-Ha`aravah, and Tzemaryim, and Beit-El,";

rsv[23] = "Avvim, Parah, Ophrah,";
asv[23] = "and Avvim, and Parah, and Ophrah,";

dby[23] = "and Avvim, and Parah, and Ophrah,";
web[23] = "And Avim, and Parah, and Ophrah,";

kjv[24] = "And Chepharhaammonai, and Ophni, and Gaba; twelve cities with their villages:";
rsv[24] = "Che\'phar-am\'moni, Ophni, Geba--twelve cities with their villages:";
asv[24] = "and Chephar-ammoni, and Ophni, and Geba; twelve cities with their villages:";
yng[24] = "and Chephar-Haammonai, and Ophni, and Gaba; twelve cities and their villages.";
dby[24] = "and Chephar-haammonai, and Ophni, and Geba: twelve cities and their hamlets;";
web[24] = "And Chephar-haamonai, and Ophni, and Gaba; twelve cities with their villages:";
hnv[24] = "and Khefar-Ha`ammoni, and `Ofni, and Geva; twelve cities with their villages:";
vul[24] = "villa Emona et Ofni et Gabee civitates duodecim et villae earum";

rsv[25] = "Gibeon, Ramah, Be-er\'oth,";
asv[25] = "Gibeon, and Ramah, and Beeroth,";

dby[25] = "Gibeon, and Ramah, and Beeroth,";

rsv[27] = "Rekem, Irpeel, Tar\'alah,";

kjv[28] = "And Zelah, Eleph, and Jebusi, which [is] Jerusalem, Gibeath, [and] Kirjath; fourteen cities with their villages. This [is] the inheritance of the children of Benjamin according to their families.";
rsv[28] = "Zela, Ha-eleph, Jebus (that is, Jerusalem), Gib\'e-ah and Kir\'iath-je\'arim--fourteen cities with their villages. This is the inheritance of the tribe of Benjamin according to its families.";
asv[28] = "and Zelah, Eleph, and the Jebusite (the same is Jerusalem), Gibeath, [and] Kiriath; fourteen cities with their villages. This is the inheritance of the children of Benjamin according to their families.";
yng[28] = "and Zelah, Eleph, and Jebusi (it [is] Jerusalem), Gibeath, Kirjath: fourteen cities and their villages. This [is] the inheritance of the sons of Benjamin, for their families.";
dby[28] = "and Zelah, Eleph, and Jebusi, that is, Jerusalem, Gibeah, Kirjath: fourteen cities and their hamlets. This was the inheritance of the children of Benjamin according to their families.";
web[28] = "And Zelah, Eleph, and Jebusi, (which [is] Jerusalem) Gibeath, [and] Kirjath; fourteen cities with their villages. This [is] the inheritance of the children of Benjamin according to their families.";
hnv[28] = "and Tzelah, Elef, and the Yevusi (the same is Yerushalayim), Giv`at, [and] Kiryat; fourteen cities with their villages. This is the inheritance of the children of Binyamin according to their families.";
vul[28] = "et Sela Eleph et Iebus quae est Hierusalem Gabaath et Cariath civitates quattuordecim et villae earum haec est possessio filiorum Beniamin iuxta familias suas";
