csb[1] = "After the death of Moses the LORD\'s servant, the LORD spoke to Joshua son of Nun, Moses\'s assistant:";
csb[2] = "&quot;Moses my servant is dead. Now you and all the people prepare to cross over the Jordan to the land I am giving the Israelites.";
csb[3] = "&quot;I have given you every place where the sole of your foot treads, just as I promised Moses.";
csb[4] = "&quot;Your territory will be from the wilderness and Lebanon to the great river, the Euphrates River -- all the land of the Hittites -- and west to the Mediterranean Sea.";
csb[5] = "&quot;No one will be able to stand against you as long as you live. I will be with you, just as I was with Moses. I will not leave you or abandon you.";
csb[6] = "&quot;Be strong and courageous, for you will distribute the land I swore to their fathers to give them as an inheritance.";
csb[7] = "&quot;Above all, be strong and very courageous to observe carefully the whole instruction my servant Moses commanded you. Do not turn from it to the right or the left, so that you will have success wherever you go.";
csb[8] = "&quot;This book of instruction must not depart from your mouth; you are to meditate on it day and night so that you may carefully observe everything written in it. For then you will prosper and succeed in whatever you do.";
csb[9] = "&quot;Haven\'t I commanded you: be strong and courageous? Do not be afraid or discouraged, for the LORD your God is with you wherever you go.&quot;";
csb[10] = "Then Joshua commanded the officers of the people:";
csb[11] = "&quot;Go through the camp and tell the people, \'Get provisions ready for yourselves, for within three days you will be crossing the Jordan to go in and take possession of the land the LORD your God is giving you to inherit.\' &quot;";
csb[12] = "Joshua said to the Reubenites, the Gadites, and half the tribe of Manasseh:";
csb[13] = "&quot;Remember what Moses the LORD\'s servant commanded you when he said, \'The LORD your God will give you rest, and he will give you this land.\'";
csb[14] = "&quot;Your wives, dependents, and livestock may remain in the land Moses gave you on this side of the Jordan. But your best soldiers must cross over in battle formation ahead of your brothers and help them";
csb[15] = "&quot;until the LORD gives your brothers rest, as he has given you, and they too possess the land the LORD your God is giving them. You may then return to the land of your inheritance and take possession of what Moses the LORD\'s servant gave you on the east side of the Jordan.&quot;";
csb[16] = "They answered Joshua, &quot;Everything you have commanded us we will do, and everywhere you send us we will go.";
csb[17] = "&quot;We will obey you, just as we obeyed Moses in everything. Certainly the LORD your God will be with you, as he was with Moses.";
csb[18] = "&quot;Anyone who rebels against your order and does not obey your words in all that you command him, will be put to death. Above all, be strong and courageous! &quot;";

kjv[17] = "According as we hearkened unto Moses in all things, so will we hearken unto thee: only the LORD thy God be with thee, as he was with Moses.";

web[17] = "According as we hearkened to Moses in all things, so will we hearken to thee: only the LORD thy God be with thee, as he was with Moses.";

yng[18] = "Any man who doth provoke thy mouth, and doth not hear thy words, in all that thou dost command him, is put to death; only, be strong and courageous.\'";
dby[18] = "Every one that is rebellious against thy commandment and hearkeneth not to thy words in everything that thou commandest us, shall be put to death. Only be strong and courageous.";
web[18] = "Every one that doth rebel against thy commandment, and will not hearken to thy words in all that thou commandest him, shall be put to death: only be strong and of a good courage.";
