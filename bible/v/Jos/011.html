csb[1] = "When King Jabin of Hazor heard this news, he sent a message to: King Jobab of Madon, the kings of Shimron and Achshaph,";
csb[2] = "and the kings of the north in the hill country, the Arabah south of Chinnereth, the Judean foothills, and the Slopes of Dor to the west,";
csb[3] = "the Canaanites in the east and west, the Amorites, Hethites, Perizzites, and Jebusites in the hill country, and the Hivites at the foot of Hermon in the land of Mizpah.";
csb[4] = "They went out with all their armies -- a multitude as numerous as the sand on the seashore -- along with a vast number of horses and chariots.";
csb[5] = "All these kings joined forces; they came and camped together at the Waters of Merom to attack Israel.";
csb[6] = "The LORD said to Joshua, &quot;Do not be afraid of them, for at this time tomorrow I will cause all of them to be killed before Israel. You are to hamstring their horses and burn their chariots.&quot;";
csb[7] = "So Joshua and all his troops surprised them at the Waters of Merom and attacked them.";
csb[8] = "The LORD handed them over to Israel, and they struck them down, pursuing them as far as greater Sidon and Misrephoth-maim, and to the east as far as the Valley of Mizpeh. They struck them down, leaving no survivors.";
csb[9] = "Joshua treated them as the LORD had told him; he hamstrung their horses and burned their chariots.";
csb[10] = "At that time Joshua turned back, captured Hazor, and struck down its king with the sword, because Hazor had formerly been the leader of all these kingdoms.";
csb[11] = "They struck down everyone in it with the sword, completely destroying them; he left no one alive. Then he burned Hazor.";
csb[12] = "Joshua captured all these kings and their cities and struck them down with the sword. He completely destroyed them, as Moses the LORD\'s servant had commanded.";
csb[13] = "However, Israel did not burn any of the cities that stood on their mounds except Hazor, which Joshua burned.";
csb[14] = "The Israelites plundered all the spoils and cattle of these cities for themselves. But they struck down every person with the sword until they had annihilated them, leaving no one alive.";
csb[15] = "Just as the LORD had commanded his servant Moses, Moses commanded Joshua. That is what Joshua did, leaving nothing undone of all that the LORD had commanded Moses.";
csb[16] = "So Joshua took all this land -- the hill country, all the Negev, all the land of Goshen, the foothills, the Arabah, and the hill country of Israel with its foothills --";
csb[17] = "from Mount Halak, which ascends to Seir, as far as Baal-gad in the Valley of Lebanon at the foot of Mount Hermon. He captured all their kings and struck them down, putting them to death.";
csb[18] = "Joshua waged war with all these kings for a long time.";
csb[19] = "No city made peace with the Israelites except the Hivites who inhabited Gibeon; all of them were taken in battle.";
csb[20] = "For it was the LORD\'s intention to harden their hearts, so that they would engage Israel in battle, be completely destroyed without mercy, and be annihilated, just as the LORD had commanded Moses.";
csb[21] = "At that time Joshua proceeded to exterminate the Anakim from the hill country -- Hebron, Debir, Anab -- all the hill country of Judah and of Israel. Joshua completely destroyed them with their cities.";
csb[22] = "No Anakim were left in the land of the Israelites, except for some remaining in Gaza, Gath, and Ashdod.";
csb[23] = "So Joshua took the entire land, in keeping with all that the LORD had told Moses. Joshua then gave it as an inheritance to Israel according to their tribal allotments. After this, the land had rest from war.";

yng[6] = "And Jehovah saith unto Joshua, `Be not afraid of their presence, for to-morrow about this time I am giving all of them wounded before Israel; their horses thou dost hough, and their chariots burn with fire.\'";
dby[6] = "And Jehovah said to Joshua, Be not afraid because of them; for to-morrow about this time will I give them all up slain before Israel: their horses shalt thou hough, and thou shalt burn their chariots with fire.";

rsv[8] = "And the LORD gave them into the hand of Israel, who smote them and chased them as far as Great Sidon and Mis\'rephoth-ma\'im, and eastward as far as the valley of Mizpeh; and they smote them, until they left none remaining.";
asv[8] = "And Jehovah delivered them into the hand of Israel, and they smote them, and chased them unto great Sidon, and unto Misrephoth-maim, and unto the valley of Mizpeh eastward; and they smote them, until they left them none remaining.";
yng[8] = "and Jehovah giveth them into the hand of Israel, and they smite them and pursue them unto the great Zidon, and unto Misrephoth-Maim, and unto the valley of Mizpeh eastward, and they smite them, till he hath not left to them a remnant;";
dby[8] = "And Jehovah delivered them into the hand of Israel, and they smote them, and chased them unto great Zidon, and to Misrephoth-maim, and to the valley of Mizpah eastward, and smote them until none were left remaining to them.";

vul[8] = "tradiditque illos Dominus in manu Israhel qui percusserunt eos et persecuti sunt usque ad Sidonem magnam et aquas Maserefoth campumque Masphe qui est ad orientalem illius partem ita percussit omnes ut nullas dimitteret ex eis reliquias";

web[17] = "[Even] from the mount Halak, that goeth up to Seir, even to Baal-gad, in the valley of Lebanon under mount Hermon: and all their kings he took, and smote them, and slew them.";
hnv[17] = "from Mount Halak, that goes up to Se`ir, even to Ba`al-Gad in the valley of Levanon under Mount Hermon: and all their kings he took, and struck them, and put them to death.";
vul[17] = "et partem montis quae ascendit Seir usque Baalgad per planitiem Libani subter montem Hermon omnes reges eorum cepit percussit occidit";
kjv[18] = "Joshua made war a long time with all those kings.";
rsv[18] = "Joshua made war a long time with all those kings.";
asv[18] = "Joshua made war a long time with all those kings.";
yng[18] = "Many days hath Joshua made with all these kings war;";
dby[18] = "Joshua made war a long time with all those kings.";
web[18] = "Joshua made war a long time with all those kings.";
hnv[18] = " Yehoshua made war a long time with all those kings.";
vul[18] = "multo tempore pugnavit Iosue contra reges istos";
kjv[19] = "There was not a city that made peace with the children of Israel, save the Hivites the inhabitants of Gibeon: all [other] they took in battle.";
rsv[19] = "There was not a city that made peace with the people of Israel, except the Hivites, the inhabitants of Gibeon; they took all in battle.";
asv[19] = "There was not a city that made peace with the children of Israel, save the Hivites the inhabitants of Gibeon: they took all in battle.";
yng[19] = "there hath not been a city which made peace with the sons of Israel save the Hivite, inhabitants of Gibeon; the whole they have taken in battle;";
dby[19] = "There was not a city that made peace with the children of Israel, save the Hivites who dwelt at Gibeon; they took all in battle.";
web[19] = "There was not a city that made peace with the children of Israel, save the Hivites the inhabitants of Gibeon: all [other] they took in battle.";
hnv[19] = "There was not a city that made shalom with the children of Yisra\'el, save the Hivvi the inhabitants of Giv`on: they took all in battle.";
vul[19] = "non fuit civitas quae se non traderet filiis Israhel praeter Eveum qui habitabat in Gabaon omnes bellando cepit";
kjv[20] = "For it was of the LORD to harden their hearts, that they should come against Israel in battle, that he might destroy them utterly, [and] that they might have no favour, but that he might destroy them, as the LORD commanded Moses.";
rsv[20] = "For it was the LORD\'s doing to harden their hearts that they should come against Israel in battle, in order that they should be utterly destroyed, and should receive no mercy but be exterminated, as the LORD commanded Moses.";
asv[20] = "For it was of Jehovah to harden their hearts, to come against Israel in battle, that he might utterly destroy them, that they might have no favor, but that he might destroy them, as Jehovah commanded Moses.";
yng[20] = "for from Jehovah it hath been to strengthen their heart, to meet in battle with Israel, in order to devote them, so that they have no grace, but in order to destroy them, as Jehovah commanded Moses.";
dby[20] = "For it was of Jehovah that their heart was hardened, to meet Israel in battle, that they might be utterly destroyed, and that there might be no favour shewn to them, but that they might be destroyed, as Jehovah had commanded Moses.";
web[20] = "For it was of the LORD to harden their hearts, that they should come against Israel in battle, that he might destroy them utterly, [and] that they might have no favor, but that he might destroy them, as the LORD commanded Moses.";
hnv[20] = "For it was of the LORD to harden their hearts, to come against Yisra\'el in battle, that he might utterly destroy them, that they might have no favor, but that he might destroy them, as the LORD commanded Moshe.";
vul[20] = "Domini enim sententiae fuerat ut indurarentur corda eorum et pugnarent contra Israhel et caderent et non mererentur ullam clementiam ac perirent sicut praeceperat Dominus Mosi";
kjv[21] = "And at that time came Joshua, and cut off the Anakims from the mountains, from Hebron, from Debir, from Anab, and from all the mountains of Judah, and from all the mountains of Israel: Joshua destroyed them utterly with their cities.";
rsv[21] = "And Joshua came at that time, and wiped out the Anakim from the hill country, from Hebron, from Debir, from Anab, and from all the hill country of Judah, and from all the hill country of Israel; Joshua utterly destroyed them with their cities.";
asv[21] = "And Joshua came at that time, and cut off the Anakim from the hill-country, from Hebron, from Debir, from Anab, and from all the hill-country of Judah, and from all the hill-country of Israel: Joshua utterly destroyed them with their cities.";
yng[21] = "And Joshua cometh at that time, and cutteth off the Anakim from the hill-country, from Hebron, from Debir, from Anab, even from all the hill-country of Judah, and from all the hill-country of Israel; with their cities hath Joshua devoted them.";
dby[21] = "And Joshua came at that time and cut off the Anakim from the mountains, from Hebron, from Debir, from Anab, and from all the mountain of Judah, and from all the mountain of Israel: Joshua destroyed them utterly, with their cities.";
web[21] = "And at that time came Joshua and cut off the Anakims from the mountains, from Hebron, from Debir, from Anab, and from all the mountains of Judah, and from all the mountains of Israel: Joshua destroyed them utterly with their cities.";
hnv[21] = "Yehoshua came at that time, and cut off the `Anakim from the hill-country, from Hevron, from Devir, from `Anav, and from all the hill-country of Yehudah, and from all the hill-country of Yisra\'el: Yehoshua utterly destroyed them with their cities.";
vul[21] = "in tempore illo venit Iosue et interfecit Enacim de montanis Hebron et Dabir et Anab et de omni monte Iuda et Israhel urbesque eorum delevit";
kjv[22] = "There was none of the Anakims left in the land of the children of Israel: only in Gaza, in Gath, and in Ashdod, there remained.";
rsv[22] = "There was none of the Anakim left in the land of the people of Israel; only in Gaza, in Gath, and in Ashdod, did some remain.";
asv[22] = "There was none of the Anakim left in the land of the children of Israel: only in Gaza, in Gath, and in Ashdod, did some remain.";
yng[22] = "There hath not been left Anakim in the land of the sons of Israel; only in Gaza, in Gath, and in Ashdod, were they left.";
dby[22] = "There were none of the Anakim left in the land of the children of Israel; only at Gazah, at Gath, and at Ashdod there remained.";
web[22] = "There was none of the Anakims left in the land of the children of Israel: only in Gaza, in Gath, and in Ashdod, there remained.";
hnv[22] = "There was none of the `Anakim left in the land of the children of Yisra\'el: only in `Aza, in Gat, and in Ashdod, did some remain.";
vul[22] = "non reliquit ullum de stirpe Enacim in terra filiorum Israhel absque civitatibus Gaza et Geth et Azoto in quibus solis relicti sunt";
kjv[23] = "So Joshua took the whole land, according to all that the LORD said unto Moses; and Joshua gave it for an inheritance unto Israel according to their divisions by their tribes. And the land rested from war.";
rsv[23] = "So Joshua took the whole land, according to all that the LORD had spoken to Moses; and Joshua gave it for an inheritance to Israel according to their tribal allotments. And the land had rest from war.";
asv[23] = "So Joshua took the whole land, according to all that Jehovah spake unto Moses; and Joshua gave it for an inheritance unto Israel according to their divisions by their tribes. And the land had rest from war.";
yng[23] = "And Joshua taketh the whole of the land, according to all that Jehovah hath spoken unto Moses, and Joshua giveth it for an inheritance to Israel according to their divisions, by their tribes; and the land hath rest from war.";
dby[23] = "And Joshua took the whole land, according to all that Jehovah had said to Moses; and Joshua gave it for an inheritance to Israel according to their divisions, by their tribes. And the land rested from war.";
web[23] = "So Joshua took the whole land, according to all that the LORD said to Moses, and Joshua gave it for an inheritance to Israel according to their divisions by their tribes. And the land rested from war.";
hnv[23] = "So Yehoshua took the whole land, according to all that the LORD spoke to Moshe; and Yehoshua gave it for an inheritance to Yisra\'el according to their divisions by their tribes. The land had rest from war.";
vul[23] = "cepit ergo Iosue omnem terram sicut locutus est Dominus ad Mosen et tradidit eam in possessionem filiis Israhel secundum partes et tribus suas quievitque terra a proeliis";
