csb[1] = "When all the kings heard about Jericho and Ai, those who were west of the Jordan in the hill country, in the Judean foothills, and all along the coast of the Mediterranean Sea toward Lebanon -- the Hethites, Amorites, Canaanites, Perizzites, Hivites, and Jebusites --";
csb[2] = "they formed a unified alliance to fight against Joshua and Israel.";
csb[3] = "When the inhabitants of Gibeon heard what Joshua had done to Jericho and Ai,";
csb[4] = "they acted deceptively. They gathered provisions and took worn-out sacks on their donkeys and old wineskins, cracked and mended.";
csb[5] = "They wore old, patched sandals on their feet and threadbare clothing on their bodies. Their entire provision of bread was dry and crumbly.";
csb[6] = "They went to Joshua in the camp at Gilgal and said to him and the men of Israel, &quot;We have come from a distant land. Please make a treaty with us.&quot;";
csb[7] = "The men of Israel replied to the Hivites, &quot;Perhaps you live among us. How can we make a treaty with you? &quot;";
csb[8] = "They said to Joshua, &quot;We are your servants.&quot; Then Joshua asked them, &quot;Who are you and where do you come from? &quot;";
csb[9] = "They replied to him, &quot;Your servants have come from a faraway land because of the reputation of the LORD your God. For we have heard of his fame, and all that he did in Egypt,";
csb[10] = "&quot;and all that he did to the two Amorite kings beyond the Jordan -- King Sihon of Heshbon and King Og of Bashan, who was in Ashtaroth.";
csb[11] = "&quot;So our elders and all the inhabitants of our land told us, \'Take provisions with you for the journey; go and meet them and say, &quot;We are your servants. Please make a treaty with us.&quot; \'";
csb[12] = "This bread of ours was warm when we took it from our houses as food on the day we left to come to you; but see, it is now dry and crumbly.";
csb[13] = "These wineskins were new when we filled them; but see, they are cracked. And these clothes and sandals of ours are worn out from the extremely long journey.&quot;";
csb[14] = "Then the men of Israel took some of their provisions, but did not seek the LORD\'s decision.";
csb[15] = "So Joshua established peace with them and made a treaty to let them live, and the leaders of the community swore an oath to them.";
csb[16] = "Three days after making the treaty with them, they heard that the Gibeonites were their neighbors, living among them.";
csb[17] = "So the Israelites set out and reached the Gibeonite cities on the third day. Now their cities were Gibeon, Chephirah, Beeroth, and Kiriath-jearim.";
csb[18] = "But the Israelites did not attack them, because the leaders of the community had sworn an oath to them by the LORD, the God of Israel. Then the whole community grumbled against the leaders.";
csb[19] = "All the leaders answered them, &quot;We have sworn an oath to them by the LORD, the God of Israel, and now we cannot touch them.";
csb[20] = "&quot;This is how we will treat them: we will let them live, so that no wrath will fall on us because of the oath we swore to them.&quot;";
csb[21] = "They also said, &quot;Let them live.&quot; So the Gibeonites became woodcutters and water carriers for the whole community, as the leaders had promised them.";
csb[22] = "Joshua summoned the Gibeonites and said to them, &quot;Why did you deceive us by telling us you live far away from us, when in fact you live among us?";
csb[23] = "&quot;Therefore you are cursed and will always be slaves -- woodcutters and water carriers for the house of my God.&quot;";
csb[24] = "The Gibeonites answered him, &quot;It was clearly communicated to your servants that the LORD your God had commanded his servant Moses to give you all the land and to destroy all the inhabitants of the land before you. We greatly feared for our lives because of you, and that is why we did this.";
csb[25] = "&quot;Now we are in your hands. Do to us whatever you think is right.&quot;";
csb[26] = "This is what Joshua did to them: he rescued them from the Israelites, and they did not kill them.";
csb[27] = "On that day he made them woodcutters and water carriers -- as they are today -- for the community and for the LORD\'s altar at the place he would choose.";

yng[18] = "and the sons of Israel have not smitten them, for sworn to them have the princes of the company by Jehovah God of Israel, and all the company murmur against the princes.";
dby[18] = "And the children of Israel did not smite them, because the princes of the assembly had sworn unto them by Jehovah the God of Israel. Then all the assembly murmured against the princes.";
web[18] = "And the children of Israel smote them not, because the princes of the congregation had sworn to them by the LORD God of Israel. And all the congregation murmured against the princes.";
hnv[18] = "The children of Yisra\'el didn\'t strike them, because the princes of the congregation had sworn to them by the LORD, the God of Yisra\'el. All the congregation murmured against the princes.";
vul[18] = "et non percusserunt eos eo quod iurassent eis principes multitudinis in nomine Domini Dei Israhel murmuravit itaque omne vulgus contra principes";
kjv[19] = "But all the princes said unto all the congregation, We have sworn unto them by the LORD God of Israel: now therefore we may not touch them.";
rsv[19] = "But all the leaders said to all the congregation, &quot;We have sworn to them by the LORD, the God of Israel, and now we may not touch them.";
asv[19] = "But all the princes said unto all the congregation, We have sworn unto them by Jehovah, the God of Israel: now therefore we may not touch them.";
yng[19] = "And all the princes say unto all the company, `We -- we have sworn to them by Jehovah, God of Israel; and now, we are not able to come against them;";
dby[19] = "And all the princes said to all the assembly, We have sworn unto them by Jehovah the God of Israel, and now we may not touch them.";
web[19] = "But all the princes said to all the congregation, We have sworn to them by the LORD God of Israel: now therefore we may not touch them.";
hnv[19] = "But all the princes said to all the congregation, We have sworn to them by the LORD, the God of Yisra\'el: now therefore we may not touch them.";
vul[19] = "qui responderunt eis iuravimus illis in nomine Domini Dei Israhel et idcirco non possumus eos contingere";
kjv[20] = "This we will do to them; we will even let them live, lest wrath be upon us, because of the oath which we sware unto them.";
rsv[20] = "This we will do to them, and let them live, lest wrath be upon us, because of the oath which we swore to them.&quot;";
asv[20] = "This we will do to them, and let them live; lest wrath be upon us, because of the oath which we sware unto them.";
yng[20] = "this we do to them, and have kept them alive, and wrath is not upon us, because of the oath which we have sworn to them.\'";
dby[20] = "This we will do to them, and let them live, lest wrath come upon us, because of the oath which we swore unto them.";
web[20] = "This we will do to them; we will even let them live, lest wrath be upon us, because of the oath which we swore to them.";
hnv[20] = " This we will do to them, and let them live; lest wrath be on us, because of the oath which we swore to them.";
vul[20] = "sed hoc faciemus eis reserventur quidem ut vivant ne contra nos ira Domini concitetur si peieraverimus";
kjv[21] = "And the princes said unto them, Let them live; but let them be hewers of wood and drawers of water unto all the congregation; as the princes had promised them.";
rsv[21] = "And the leaders said to them, &quot;Let them live.&quot; So they became hewers of wood and drawers of water for all the congregation, as the leaders had said of them.";
asv[21] = "And the princes said unto them, Let them live: so they became hewers of wood and drawers of water unto all the congregation, as the princes had spoken unto them.";
yng[21] = "And the princes say unto them, `They live, and are hewers of wood and drawers of water for all the company, as the princes spake to them.\'";
dby[21] = "And the princes said to them, Let them live. And they were hewers of wood and drawers of water for all the assembly; as the princes had said to them.";
web[21] = "And the princes said to them, Let them live; but let them be hewers of wood, and drawers of water to all the congregation; as the princes had promised them.";
hnv[21] = "The princes said to them, Let them live: so they became wood cutters and drawers of water to all the congregation, as the princes had spoken to them.";
vul[21] = "sed sic vivant ut in usus universae multitudinis ligna caedant aquasque conportent quibus haec loquentibus";
kjv[22] = "And Joshua called for them, and he spake unto them, saying, Wherefore have ye beguiled us, saying, We [are] very far from you; when ye dwell among us?";
rsv[22] = "Joshua summoned them, and he said to them, &quot;Why did you deceive us, saying, \'We are very far from you,\' when you dwell among us?";
asv[22] = "And Joshua called for them, and he spake unto them, saying, Wherefore have ye beguiled us, saying, We are very far from you; when ye dwell among us?";
yng[22] = "And Joshua calleth for them, and speaketh unto them, saying, `Why have ye deceived us, saying, We are very far from you, and ye in our midst dwelling?";
dby[22] = "And Joshua called for them, and he spoke to them, saying, Why have ye deceived us, saying, We are very far from you; whereas ye dwell in our midst?";
web[22] = "And Joshua called for them, and he spoke to them, saying, Why have ye deceived us, saying, We [are] very far from you; when ye dwell among us?";
hnv[22] = " Yehoshua called for them, and he spoke to them, saying, Why have you deceived us, saying, We are very far from you; when you dwell among us?";
vul[22] = "vocavit Gabaonitas Iosue et dixit eis cur nos decipere fraude voluistis ut diceretis procul valde habitamus a vobis cum in medio nostri sitis";
kjv[23] = "Now therefore ye [are] cursed, and there shall none of you be freed from being bondmen, and hewers of wood and drawers of water for the house of my God.";
rsv[23] = "Now therefore you are cursed, and some of you shall always be slaves, hewers of wood and drawers of water for the house of my God.&quot;";
asv[23] = "Now therefore ye are cursed, and there shall never fail to be of you bondmen, both hewers of wood and drawers of water for the house of my God.";
yng[23] = "and now, cursed are ye, and none of you is cut off [from being] a servant, even hewers of wood and drawers of water, for the house of my God.\'";
dby[23] = "And now ye are cursed, and ye shall never cease to be bondmen, and hewers of wood, and drawers of water for the house of my God.";
web[23] = "Now therefore ye [are] cursed, and there shall none of you be freed from being bond-men, and hewers of wood and drawers of water for the house of my God.";
hnv[23] = "Now therefore you are cursed, and there shall never fail to be of you bondservants, both wood cutters and drawers of water for the house of my God.";
vul[23] = "itaque sub maledictione eritis et non deficiet de stirpe vestra ligna caedens aquasque conportans in domum Dei mei";
kjv[24] = "And they answered Joshua, and said, Because it was certainly told thy servants, how that the LORD thy God commanded his servant Moses to give you all the land, and to destroy all the inhabitants of the land from before you, therefore we were sore afraid of our lives because of you, and have done this thing.";
rsv[24] = "They answered Joshua, &quot;Because it was told to your servants for a certainty that the LORD your God had commanded his servant Moses to give you all the land, and to destroy all the inhabitants of the land from before you; so we feared greatly for our lives because of you, and did this thing.";
asv[24] = "And they answered Joshua, and said, Because it was certainly told thy servants, how that Jehovah thy God commanded his servant Moses to give you all the land, and to destroy all the inhabitants of the land from before you; therefore we were sore afraid for our lives because of you, and have done this thing.";
yng[24] = "And they answer Joshua and say, `Because it was certainly declared to thy servants, that Jehovah thy God commanded Moses His servant to give to you all the land, and to destroy all the inhabitants of the land from before you; and we fear greatly for ourselves because of you, and we do this thing;";
dby[24] = "And they answered Joshua and said, Because it was certainly told thy servants how that Jehovah thy God commanded his servant Moses to give you all the land, and to destroy all the inhabitants of the land from before you; and we feared greatly for our lives because of you, and did this thing.";
web[24] = "And they answered Joshua, and said, Because it was certainly told thy servants, how the LORD thy God commanded his servant Moses to give you all the land, and to destroy all the inhabitants of the land from before you, therefore we were greatly afraid for our lives because of you, and have done this thing.";
hnv[24] = "They answered Yehoshua, and said, Because it was certainly told your servants, how that the LORD your God commanded his servant Moshe to give you all the land, and to destroy all the inhabitants of the land from before you; therefore we were sore afraid for our lives because of you, and have done this thing.";
vul[24] = "qui responderunt nuntiatum est nobis servis tuis quae promisisset Dominus Deus tuus Mosi servo suo ut traderet vobis omnem terram et disperderet cunctos habitatores eius timuimus igitur valde et providimus animabus nostris vestro terrore conpulsi et hoc consilium inivimus";
kjv[25] = "And now, behold, we [are] in thine hand: as it seemeth good and right unto thee to do unto us, do.";
rsv[25] = "And now, behold, we are in your hand: do as it seems good and right in your sight to do to us.&quot;";
asv[25] = "And now, behold, we are in thy hand: as it seemeth good and right unto thee to do unto us, do.";
yng[25] = "and now, lo, we [are] in thy hand, as [it is] good, and as [it is] right in thine eyes to do to us -- do.\'";
dby[25] = "And now behold, we are in thy hand: as it is good and right in thine eyes to do to us, do.";
web[25] = "And now, behold, we [are] in thy hand: do as it seemeth good and right to thee to do to us,";
hnv[25] = "Now, behold, we are in your hand: as it seems good and right to you to do to us, do.";
vul[25] = "nunc autem in manu tua sumus quod tibi bonum et rectum videtur fac nobis";
kjv[26] = "And so did he unto them, and delivered them out of the hand of the children of Israel, that they slew them not.";
rsv[26] = "So he did to them, and delivered them out of the hand of the people of Israel; and they did not kill them.";
asv[26] = "And so did he unto them, and delivered them out of the hand of the children of Israel, that they slew them not.";
yng[26] = "And he doth to them so, and delivereth them from the hand of the sons of Israel, and they have not slain them;";
dby[26] = "And he did so to them, and delivered them out of the hand of the children of Israel, and they did not slay them.";
web[26] = "And so did he to them, and delivered them out of the hand of the children of Israel, that they slew them not.";
hnv[26] = "So did he to them, and delivered them out of the hand of the children of Yisra\'el, that they didn\'t kill them.";
vul[26] = "fecit ergo Iosue ut dixerat et liberavit eos de manibus filiorum Israhel ut non occiderentur";
kjv[27] = "And Joshua made them that day hewers of wood and drawers of water for the congregation, and for the altar of the LORD, even unto this day, in the place which he should choose.";
rsv[27] = "But Joshua made them that day hewers of wood and drawers of water for the congregation and for the altar of the LORD, to continue to this day, in the place which he should choose.";
asv[27] = "And Joshua made them that day hewers of wood and drawers of water for the congregation, and for the altar of Jehovah, unto this day, in the place which he should choose.";
yng[27] = "and Joshua maketh them on that day hewers of wood and drawers of water for the company, and for the altar of Jehovah, unto this day, at the place which He doth choose.";
dby[27] = "And Joshua made them that day hewers of wood and drawers of water for the assembly, and for the altar of Jehovah, to this day, in the place which he should choose.";
web[27] = "And Joshua made them that day hewers of wood and drawers of water for the congregation, and for the altar of the LORD, even to this day, in the place which he should choose.";
hnv[27] = "That day Yehoshua made those wood cutters and drawers of water for the congregation, and for the altar of the LORD, to this day, in the place which he should choose.";
vul[27] = "decrevitque in illo die esse eos in ministerium cuncti populi et altaris Domini caedentes ligna et aquas conportantes usque in praesens tempus in loco quem Dominus elegisset";
