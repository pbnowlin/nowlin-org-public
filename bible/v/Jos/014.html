csb[1] = "The Israelites received these portions that the priest Eleazar, Joshua son of Nun, and the family heads of the Israelite tribes gave them in the land of Canaan.";
csb[2] = "Their inheritance was by lot as the LORD commanded through Moses for the nine and a half tribes,";
csb[3] = "because Moses had given the inheritance to the two and a half tribes beyond the Jordan. But he gave no inheritance among them to the Levites.";
csb[4] = "The descendants of Joseph became two tribes, Manasseh and Ephraim. No portion of the land was given to the Levites except cities to live in, along with pasturelands for their cattle and livestock.";
csb[5] = "So the Israelites did as the LORD commanded Moses, and they divided the land.";
csb[6] = "The descendants of Judah approached Joshua at Gilgal, and Caleb son of Jephunneh the Kenizzite said to him, &quot;You know what the LORD promised Moses the man of God at Kadesh-barnea about you and me.";
csb[7] = "&quot;I was forty years old when Moses the LORD\'s servant sent me from Kadesh-barnea to scout the land, and I brought back an honest report.";
csb[8] = "&quot;My brothers who went with me caused the people to lose heart, but I followed the LORD my God completely.";
csb[9] = "&quot;On that day Moses swore to me: \'The land where you have set foot will be an inheritance for you and your descendants forever, because you have followed the LORD my God completely.\'";
csb[10] = "&quot;As you see, the LORD has kept me alive these forty-five years as he promised, since the LORD spoke this word to Moses while Israel was journeying in the wilderness. Here I am today, eighty-five years old.";
csb[11] = "&quot;I am still as strong today as I was the day Moses sent me out. My strength for battle and for daily tasks is now as it was then.";
csb[12] = "&quot;Now give me this hill country the LORD promised me on that day, because you heard then that the Anakim are there, as well as large fortified cities. Perhaps the LORD will be with me and I will drive them out as the LORD promised.&quot;";
csb[13] = "Then Joshua blessed Caleb son of Jephunneh and gave him Hebron as an inheritance.";
csb[14] = "Therefore, Hebron still belongs to Caleb son of Jephunneh the Kenizzite as an inheritance today because he followed the LORD, the God of Israel, completely.";
csb[15] = "Hebron\'s name used to be Kiriath-arba; Arba was the greatest man among the Anakim. After this, the land had rest from war.";
kjv[1] = "And these [are the countries] which the children of Israel inherited in the land of Canaan, which Eleazar the priest, and Joshua the son of Nun, and the heads of the fathers of the tribes of the children of Israel, distributed for inheritance to them.";
kjv[2] = "By lot [was] their inheritance, as the LORD commanded by the hand of Moses, for the nine tribes, and [for] the half tribe.";
kjv[3] = "For Moses had given the inheritance of two tribes and an half tribe on the other side Jordan: but unto the Levites he gave none inheritance among them.";
kjv[4] = "For the children of Joseph were two tribes, Manasseh and Ephraim: therefore they gave no part unto the Levites in the land, save cities to dwell [in], with their suburbs for their cattle and for their substance.";
kjv[5] = "As the LORD commanded Moses, so the children of Israel did, and they divided the land.";
kjv[6] = "Then the children of Judah came unto Joshua in Gilgal: and Caleb the son of Jephunneh the Kenezite said unto him, Thou knowest the thing that the LORD said unto Moses the man of God concerning me and thee in Kadeshbarnea.";
kjv[7] = "Forty years old [was] I when Moses the servant of the LORD sent me from Kadeshbarnea to espy out the land; and I brought him word again as [it was] in mine heart.";
kjv[8] = "Nevertheless my brethren that went up with me made the heart of the people melt: but I wholly followed the LORD my God.";
kjv[9] = "And Moses sware on that day, saying, Surely the land whereon thy feet have trodden shall be thine inheritance, and thy children\'s for ever, because thou hast wholly followed the LORD my God.";
kjv[10] = "And now, behold, the LORD hath kept me alive, as he said, these forty and five years, even since the LORD spake this word unto Moses, while [the children of] Israel wandered in the wilderness: and now, lo, I [am] this day fourscore and five years old.";
kjv[11] = "As yet I [am as] strong this day as [I was] in the day that Moses sent me: as my strength [was] then, even so [is] my strength now, for war, both to go out, and to come in.";
kjv[12] = "Now therefore give me this mountain, whereof the LORD spake in that day; for thou heardest in that day how the Anakims [were] there, and [that] the cities [were] great [and] fenced: if so be the LORD [will be] with me, then I shall be able to drive them out, as the LORD said.";
kjv[13] = "And Joshua blessed him, and gave unto Caleb the son of Jephunneh Hebron for an inheritance.";
kjv[14] = "Hebron therefore became the inheritance of Caleb the son of Jephunneh the Kenezite unto this day, because that he wholly followed the LORD God of Israel.";
kjv[15] = "And the name of Hebron before [was] Kirjatharba; [which Arba was] a great man among the Anakims. And the land had rest from war.";
rsv[1] = "And these are the inheritances which the people of Israel received in the land of Canaan, which Elea\'zar the priest, and Joshua the son of Nun, and the heads of the fathers\' houses of the tribes of the people of Israel distributed to them.";
asv[1] = "And these are the inheritances which the children of Israel took in the land of Canaan, which Eleazar the priest, and Joshua the son of Nun, and the heads of the fathers\' [houses] of the tribes of the children of Israel, distributed unto them,";
yng[1] = "And these [are] they [of] the sons of Israel who inherited in the land of Canaan, whom Eleazar the priest, and Joshua son of Nun, and the heads of the fathers of the tribes of the sons of Israel, caused to inherit;";
dby[1] = "And this is what the children of Israel inherited in the land of Canaan, which Eleazar the priest, and Joshua the son of Nun, and the chief fathers of the tribes of the children of Israel, allotted for inheritance to them:";

hnv[1] = "These are the inheritances which the children of Yisra\'el took in the land of Kana`an, which El`azar the Kohen, and Yehoshua the son of Nun, and the heads of the fathers\' [houses] of the tribes of the children of Yisra\'el, distributed to them,";
vul[1] = "hoc est quod possederunt filii Israhel in terra Chanaan quam dederunt eis Eleazar sacerdos et Iosue filius Nun et principes familiarum per tribus Israhel";
rsv[2] = "Their inheritance was by lot, as the LORD had commanded Moses for the nine and one-half tribes.";
asv[2] = "by the lot of their inheritance, as Jehovah commanded by Moses, for the nine tribes, and for the half-tribe.";
yng[2] = "by lot [is] their inheritance, as Jehovah commanded by the hand of Moses, for the nine of the tribes, and the half of the tribe;";
dby[2] = "their inheritance was by lot, as Jehovah had commanded by Moses, for the nine tribes, and the half tribe.";
web[2] = "By lot [was] their inheritance, as the LORD commanded by the hand of Moses, for the nine tribes, and [for] the half-tribe.";

vul[2] = "sorte omnia dividentes sicut praeceperat Dominus in manu Mosi novem tribubus et dimidiae tribui";
rsv[3] = "For Moses had given an inheritance to the two and one-half tribes beyond the Jordan; but to the Levites he gave no inheritance among them.";
asv[3] = "For Moses had given the inheritance of the two tribes and the half-tribe beyond the Jordan: but unto the Levites he gave no inheritance among them.";
yng[3] = "for Moses hath given the inheritance of two of the tribes, and of half of the tribe, beyond the Jordan, and to the Levites he hath not given an inheritance in their midst;";

hnv[3] = "For Moshe had given the inheritance of the two tribes and the half-tribe beyond the Yarden: but to the Levites he gave no inheritance among them.";
vul[3] = "duabus enim tribubus et dimidiae dederat Moses trans Iordanem possessionem absque Levitis qui nihil terrae acceperunt inter fratres suos";
rsv[4] = "For the people of Joseph were two tribes, Manas\'seh and E\'phraim; and no portion was given to the Levites in the land, but only cities to dwell in, with their pasture lands for their cattle and their substance.";
asv[4] = "For the children of Joseph were two tribes, Manasseh and Ephraim: and they gave no portion unto the Levites in the land, save cities to dwell in, with the suburbs thereof for their cattle and for their substance.";
yng[4] = "for the sons of Joseph hath been two tribes, Manasseh and Ephraim, and they have not given a portion to the Levites in the land, except cities to dwell in, and their suburbs for their cattle, and for their possessions;";
dby[4] = "For the children of Joseph were two tribes, Manasseh and Ephraim; and they gave no part to the Levites in the land, save cities to dwell in, and their suburbs for their cattle and for their substance.";
web[4] = "For the children of Joseph were two tribes, Manasseh and Ephraim: therefore they gave no part to the Levites in the land, save cities to dwell [in], with their suburbs for their cattle, and for their substance.";
hnv[4] = "For the children of Yosef were two tribes, Menashsheh and Efrayim: and they gave no portion to the Levites in the land, save cities to dwell in, with the suburbs of it for their cattle and for their substance.";

rsv[5] = "The people of Israel did as the LORD commanded Moses; they allotted the land.";
asv[5] = "As Jehovah commanded Moses, so the children of Israel did; and they divided the land.";
yng[5] = "as Jehovah commanded Moses, so have the sons of Israel done, and they apportion the land.";

rsv[6] = "Then the people of Judah came to Joshua at Gilgal; and Caleb the son of Jephun\'neh the Ken\'izzite said to him, &quot;You know what the LORD said to Moses the man of God in Ka\'desh-bar\'nea concerning you and me.";
asv[6] = "Then the children of Judah drew nigh unto Joshua in Gilgal: and Caleb the son of Jephunneh the Kenizzite said unto him, Thou knowest the thing that Jehovah spake unto Moses the man of God concerning me and concerning thee in Kadesh-barnea.";
yng[6] = "And the sons of Judah come nigh unto Joshua in Gilgal, and Caleb son of Jephunneh the Kenezzite saith unto him, `Thou hast known the word that Jehovah hath spoken unto Moses the man of God, concerning me and concerning thee in Kadesh-Barnea:";
dby[6] = "Then the children of Judah came near to Joshua in Gilgal, and Caleb the son of Jephunneh the Kenizzite said to him, Thou knowest the word that Jehovah spoke to Moses the man of God, concerning me and thee, in Kadesh-barnea.";
web[6] = "Then the children of Judah came to Joshua in Gilgal: and Caleb the son of Jephunneh the Kenezite said to him, Thou knowest the thing that the LORD said to Moses the man of God concerning me and thee in Kadesh-barnea.";
hnv[6] = "Then the children of Yehudah drew near to Yehoshua in Gilgal: and Kalev the son of Yefunneh the Kenizzi said to him, You know the thing that the LORD spoke to Moshe the man of God concerning me and concerning you in Kadesh-Barnea.";
vul[6] = "accesserunt itaque filii Iuda ad Iosue in Galgala locutusque est ad eum Chaleb filius Iepphonne Cenezeus nosti quid locutus sit Dominus ad Mosen hominem Dei de me et te in Cadesbarne";
rsv[7] = "I was forty years old when Moses the servant of the LORD sent me from Ka\'desh-bar\'nea to spy out the land; and I brought him word again as it was in my heart.";
asv[7] = "Forty years old was I when Moses the servant of Jehovah sent me from Kadesh-barnea to spy out the land; and I brought him word again as it was in my heart.";
yng[7] = "a son of forty years [am] I in Moses, servant of Jehovah, sending me from Kadesh-Barnea, to spy the land, and I bring him back word as with my heart;";
dby[7] = "Forty years old was I when Moses the servant of Jehovah sent me from Kadesh-barnea to search out the land; and I brought him word again as it was in my heart.";
web[7] = "Forty years old [was] I when Moses the servant of the LORD sent me from Kadesh-barnea to explore the land; and I brought him word again as it [was] in my heart.";
hnv[7] = "Forty years old was I when Moshe the servant of the LORD sent me from Kadesh-Barnea to spy out the land; and I brought him word again as it was in my heart.";

hnv[8] = " Nevertheless my brothers who went up with me made the heart of the people melt; but I wholly followed the LORD my God.";
vul[8] = "fratres autem mei qui ascenderant mecum dissolverunt cor populi et nihilominus ego secutus sum Dominum Deum meum";
rsv[9] = "And Moses swore on that day, saying, \'Surely the land on which your foot has trodden shall be an inheritance for you and your children for ever, because you have wholly followed the LORD my God.\'";
asv[9] = "And Moses sware on that day, saying, Surely the land whereon thy foot hath trodden shall be an inheritance to thee and to thy children for ever, because thou hast wholly followed Jehovah my God.";
yng[9] = "and Moses sweareth in that day, saying, If not -- the land on which thy foot hath trodden, to thee it is for inheritance, and to thy sons -- to the age, for thou hast been fully after Jehovah my God.";
dby[9] = "And Moses swore on that day, saying, The land whereon thy feet have trodden shall assuredly be thine inheritance, and thy children\'s for ever! for thou hast wholly followed Jehovah my God.";

hnv[9] = "Moshe swore on that day, saying, Surely the land whereon your foot has trodden shall be an inheritance to you and to your children forever, because you have wholly followed the LORD my God.";
vul[9] = "iuravitque Moses in die illo dicens terram quam calcavit pes tuus erit possessio tua et filiorum tuorum in aeternum quia secutus es Dominum Deum meum";
rsv[10] = "And now, behold, the LORD has kept me alive, as he said, these forty-five years since the time that the LORD spoke this word to Moses, while Israel walked in the wilderness; and now, lo, I am this day eighty-five years old.";
asv[10] = "And now, behold, Jehovah hath kept me alive, as he spake, these forty and five years, from the time that Jehovah spake this word unto Moses, while Israel walked in the wilderness: and now, lo, I am this day fourscore and five years old.";
yng[10] = "`And, now, lo, Jehovah hath kept me alive, as He hath spoken, these forty and five years, since Jehovah spake this word unto Moses, when Israel went in the wilderness; and now, lo, I [am] to-day a son of five and eighty years;";
dby[10] = "And now behold, Jehovah has kept me alive, as he said, these forty-five years, since Jehovah spoke this word to Moses, when Israel wandered in the wilderness; and now behold, I am this day eighty-five years old.";

hnv[10] = "Now, behold, the LORD has kept me alive, as he spoke, these forty-five years, from the time that the LORD spoke this word to Moshe, while Yisra\'el walked in the wilderness: and now, behold, I am this day eighty-five years old.";
vul[10] = "concessit ergo Dominus vitam mihi sicut pollicitus est usque in praesentem diem quadraginta et quinque anni sunt ex quo locutus est Dominus verbum istud ad Mosen quando ambulabat Israhel per solitudinem hodie octoginta quinque annorum sum";

dby[11] = "I am still this day strong, as in the day that Moses sent me: as my strength was then, even so is my strength now, for war, both to go out and to come in.";
