csb[1] = "Joshua was now old, advanced in age, and the LORD said to him, &quot;You have become old, advanced in age, but a great deal of the land remains to be possessed.";
csb[2] = "&quot;This is the land that remains: All the districts of the Philistines and the Geshurites:";
csb[3] = "&quot;from the Shihor east of Egypt to the border of Ekron on the north (considered to be Canaanite territory) -- the five Philistine rulers of Gaza, Ashdod, Ashkelon, Gath, and Ekron, as well as the Avvites";
csb[4] = "&quot;in the south; all the land of the Canaanites, from Arah of the Sidonians to Aphek and as far as the border of the Amorites;";
csb[5] = "&quot;the land of the Gebalites; and all Lebanon east from Baal-gad below Mount Hermon to the entrance of Hamath --";
csb[6] = "&quot;all the inhabitants of the hill country from Lebanon to Misrephoth-maim, all the Sidonians. I will drive them out before the Israelites, only distribute the land as an inheritance for Israel, as I have commanded you.";
csb[7] = "&quot;Therefore, divide this land as an inheritance to the nine tribes and half the tribe of Manasseh.&quot;";
csb[8] = "With the other half of the tribe of Manasseh, the Reubenites and Gadites had received the inheritance Moses gave them beyond the Jordan to the east, just as Moses the LORD\'s servant had given them:";
csb[9] = "From Aroer on the rim of the Arnon Valley, along with the city in the middle of the valley, all the Medeba plateau as far as Dibon,";
csb[10] = "and all the cities of King Sihon of the Amorites, who reigned in Heshbon, to the border of the Ammonites;";
csb[11] = "also Gilead and the territory of the Geshurites and Maacathites, all Mount Hermon, and all Bashan to Salecah --";
csb[12] = "the whole kingdom of Og in Bashan, who reigned in Ashtaroth and Edrei; he was one of the remaining Rephaim. Moses struck them down and drove them out,";
csb[13] = "but the Israelites did not drive out the Geshurites and Maacathites. So Geshur and Maacath still live in Israel today.";
csb[14] = "He did not, however, give any inheritance to the tribe of Levi. This was their inheritance, just as he had promised: the offerings made by fire to the LORD, the God of Israel.";
csb[15] = "To the tribe of Reuben\'s descendants by their clans, Moses gave";
csb[16] = "this as their territory: From Aroer on the rim of the Arnon Valley, along with the city in the middle of the valley, the whole plateau as far as Medeba,";
csb[17] = "with Heshbon and all its cities on the plateau -- Dibon, Bamoth-baal, Beth-baal-meon,";
csb[18] = "Jahaz, Kedemoth, Mephaath,";
csb[19] = "Kiriathaim, Sibmah, Zereth-shahar on the hill in the valley,";
csb[20] = "Beth-peor, the slopes of Pisgah, and Beth-jeshimoth --";
csb[21] = "all the cities of the plateau, and all the kingdom of King Sihon of the Amorites, who reigned in Heshbon. Moses had killed him and the chiefs of Midian -- Evi, Rekem, Zur, Hur, and Reba -- the princes of Sihon who lived in the land.";
csb[22] = "Along with those the Israelites put to death, they also killed the diviner, Balaam son of Beor, with the sword.";
csb[23] = "The border of the Reubenites was the Jordan and its plain. This was the inheritance of the Reubenites by their clans, with the cities and their settlements.";
csb[24] = "To the tribe of the Gadites by their clans, Moses gave";
csb[25] = "this as their territory: Jazer and all the cities of Gilead, and half the land of the Ammonites to Aroer, near Rabbah;";
csb[26] = "from Heshbon to Ramath-mizpeh and Betonim, and from Mahanaim to the border of Debir;";
csb[27] = "in the valley: Beth-haram, Beth-nimrah, Succoth, and Zaphon -- the rest of the kingdom of King Sihon of Heshbon. Their land also included the Jordan and its territory as far as the edge of the Sea of Chinnereth on the east side of the Jordan.";
csb[28] = "This was the inheritance of the Gadites by their clans, with the cities and their settlements.";
csb[29] = "And to half the tribe of Manasseh (that is, to half the tribe of Manasseh\'s descendants by their clans) Moses gave";
csb[30] = "this as their territory: From Mahanaim through all Bashan -- all the kingdom of King Og of Bashan, including all of Jair\'s Villages that are in Bashan -- sixty cities.";
csb[31] = "But half of Gilead, and Og\'s royal cities in Bashan -- Ashtaroth and Edrei -- are for the descendants of Machir son of Manasseh (that is, half the descendants of Machir by their clans).";
csb[32] = "These were the portions Moses gave them on the plains of Moab beyond the Jordan east of Jericho.";
csb[33] = "But Moses did not give a portion to the tribe of Levi. The LORD, the God of Israel, was their inheritance, just as he had promised them.";
kjv[1] = "Now Joshua was old [and] stricken in years; and the LORD said unto him, Thou art old [and] stricken in years, and there remaineth yet very much land to be possessed.";

dby[1] = "And Joshua was old, advanced in age, and Jehovah said to him, Thou art old, advanced in age, and there remaineth yet very much land to take possession of.";

hnv[1] = "Now Yehoshua was old and well stricken in years; and the LORD said to him, You are old and well stricken in years, and there remains yet very much land to be possessed.";
vul[1] = "Iosue senex provectaeque aetatis erat et dixit Dominus ad eum senuisti et longevus es terraque latissima derelicta est quae necdum est sorte divisa";

kjv[3] = "From Sihor, which [is] before Egypt, even unto the borders of Ekron northward, [which] is counted to the Canaanite: five lords of the Philistines; the Gazathites, and the Ashdothites, the Eshkalonites, the Gittites, and the Ekronites; also the Avites:";
rsv[3] = "(from the Shihor, which is east of Egypt, northward to the boundary of Ekron, it is reckoned as Canaanite; there are five rulers of the Philistines, those of Gaza, Ashdod, Ash\'kelon, Gath, and Ekron), and those of the Avvim,";
asv[3] = "from the Shihor, which is before Egypt, even unto the border of Ekron northward, [which] is reckoned to the Canaanites; the five lords of the Philistines; the Gazites, and the Ashdodites, the Ashkelonites, the Gittites, and the Ekronites; also the Avvim,";
yng[3] = "from Sihor which [is] on the front of Egypt, and unto the border of Ekron northward, to the Canaanite it is reckoned, five princes of the Philistines, the Gazathite, and the Ashdothite, the Eshkalonite, the Gittite, and the Ekronite, also the Avim.";
dby[3] = "from the Shihor, which [floweth] before Egypt, as far as the borders of Ekron northward, [and which] is counted to the Canaanite; five lordships of the Philistines: of Gazah, and of Ashdod, of Eshkalon, of Gath, and of Ekron; also the Avvites;";
web[3] = "From Sihor, which [is] before Egypt, even to the borders of Ekron northward, [which] is counted to the Canaanite: five lords of the Philistines; the Gazathites, and the Ashdothites, the Eshkalonites, the Gittites, and the Ekronites; also the Avites:";
hnv[3] = " from the Shichor, which is before Mitzrayim, even to the border of `Ekron northward, [which] is reckoned to the Kana`anim; the five lords of the Pelishtim; the `Azati, and the Ashdodi, the Eshkeloni, the Gitti, and the `Ekroni; also the `Avvim,";

kjv[6] = "All the inhabitants of the hill country from Lebanon unto Misrephothmaim, [and] all the Sidonians, them will I drive out from before the children of Israel: only divide thou it by lot unto the Israelites for an inheritance, as I have commanded thee.";

yng[6] = "all the inhabitants of the hill-country, from Lebanon unto Misrephoth-Maim, all the Sidonians: I -- I dispossess them before the sons of Israel; only, cause it to fall to Israel for an inheritance, as I have commanded thee.";

dby[17] = "Heshbon, and all her cities that are in the plateau, Dibon, and Bamoth-Baal, and Beth-Baal-meon,";
web[17] = "Heshbon, and all her cities that [are] in the plain; Dibon, and Bamoth-baal, and Beth-baal-meon,";
hnv[17] = "Heshbon, and all its cities that are in the plain; Divon, and Bamot-Ba`al, and Beit-Ba`al-Me`on,";
vul[17] = "et Esebon cunctosque viculos earum qui sunt in campestribus Dibon quoque et Bamothbaal et oppidum Baalmaon";
kjv[18] = "And Jahazah, and Kedemoth, and Mephaath,";
rsv[18] = "and Jahaz, and Ked\'emoth, and Meph\'aath,";
asv[18] = "and Jahaz, and Kedemoth, and Mephaath,";
yng[18] = "and Jahazah, and Kedemoth, and Mephaath,";
dby[18] = "And Jahzah, and Kedemoth, and Mephaath,";
web[18] = "And Jahaza, and Kedemoth, and Mephaath,";
hnv[18] = "and Yahatz, and Kedemot, and Mefa`at,";
vul[18] = "Iessa et Cedmoth et Mepheeth";
kjv[19] = "And Kirjathaim, and Sibmah, and Zarethshahar in the mount of the valley,";
rsv[19] = "and Kir\'iatha\'im, and Sibmah, and Zer\'eth-sha\'har on the hill of the valley,";
asv[19] = "and Kiriathaim, and Sibmah, and Zereth-shahar in the mount of the valley,";
yng[19] = "and Kirjathaim, and Sibmah, and Zareth-Shahar, in the mount of the valley,";
dby[19] = "and Kirjathaim, and Sibmah, and Zereth-shahar in the mountain of the vale,";
web[19] = "And Kirjathaim, and Sibmah, and Zareth-shahar in the mount of the valley,";
hnv[19] = "and Kiryatayim, and Sivmah, and Tzeret-Hashachar in the mount of the valley,";
vul[19] = "Cariathaim et Sebama et Sarathasar in monte convallis";
kjv[20] = "And Bethpeor, and Ashdothpisgah, and Bethjeshimoth,";
rsv[20] = "and Beth-pe\'or, and the slopes of Pisgah, and Beth-jesh\'imoth,";
asv[20] = "and Beth-peor, and the slopes of Pisgah, and Beth-jeshimoth,";
yng[20] = "and Beth-Peor, and the springs of Pisgah, and Beth-Jeshimoth,";
dby[20] = "and Beth-Peor, and the slopes of Pisgah, and Beth-jeshimoth;";
web[20] = "And Beth-peor, and Ashdoth-pisgah, and Beth-jeshimoth,";
hnv[20] = "and Beit-Pe`or, and the slopes of Pisgah, and Beth-jeshimoth,";
vul[20] = "Bethpheor et Asedothphasga et Bethaisimoth";
kjv[21] = "And all the cities of the plain, and all the kingdom of Sihon king of the Amorites, which reigned in Heshbon, whom Moses smote with the princes of Midian, Evi, and Rekem, and Zur, and Hur, and Reba, [which were] dukes of Sihon, dwelling in the country.";
rsv[21] = "that is, all the cities of the tableland, and all the kingdom of Sihon king of the Amorites, who reigned in Heshbon, whom Moses defeated with the leaders of Mid\'ian, Evi and Rekem and Zur and Hur and Reba, the princes of Sihon, who dwelt in the land.";
asv[21] = "and all the cities of the plain, and all the kingdom of Sihon king of the Amorites, who reigned in Heshbon, whom Moses smote with the chiefs of Midian, Evi, and Rekem, and Zur, and Hur, and Reba, the princes of Sihon, that dwelt in the land.";
yng[21] = "and all the cities of the plain, and all the kingdom of Sihon king of the Amorite, who reigned in Heshbon, whom Moses smote, with the princes of Midian, Evi, and Rekem, and Zur, and Hur, and Reba, princes of Sihon, inhabitants of the land.";
dby[21] = "all the cities of the plateau, and the whole kingdom of Sihon the king of the Amorites, who reigned at Heshbon, whom Moses smote, him and the princes of Midian, Evi, and Rekem, and Zur, and Hur, and Reba, the chiefs of Sihon dwelling in the land.";
web[21] = "And all the cities of the plain, and all the kingdom of Sihon king of the Amorites, who reigned in Heshbon, whom Moses smote with the princes of Midian, Evi, and Rekem, and Zur, and Hur, and Reba, dukes of Sihon, dwelling in the country.";
hnv[21] = "and all the cities of the plain, and all the kingdom of Sichon king of the Amori, who reigned in Heshbon, whom Moshe struck with the chiefs of Midyan, Evi, and Rekem, and Tzur, and Hur, and Reva, the princes of Sichon, who lived in the land.";
vul[21] = "omnes urbes campestres universaque regna Seon regis Amorrei qui regnavit in Esebon quem percussit Moses cum principibus Madian Eveum et Recem et Sur et Ur et Rabee duces Seon habitatores terrae";
kjv[22] = "Balaam also the son of Beor, the soothsayer, did the children of Israel slay with the sword among them that were slain by them.";
rsv[22] = "Balaam also, the son of Be\'or, the soothsayer, the people of Israel killed with the sword among the rest of their slain.";
asv[22] = "Balaam also the son of Beor, the soothsayer, did the children of Israel slay with the sword among the rest of their slain.";
yng[22] = "And Balaam, son of Beor, the diviner, have the sons of Israel slain with the sword, among their wounded ones.";
dby[22] = "And Balaam the son of Beor, the diviner, did the children of Israel kill with the sword among them that were slain by them.";
web[22] = "Balaam also the son of Beor, the sooth-sayer, did the children of Israel slay with the sword, among them that were slain by them.";
hnv[22] = "Bil`am also the son of Be\'or, the soothsayer, did the children of Yisra\'el kill with the sword among the rest of their slain.";
vul[22] = "et Balaam filium Beor ariolum occiderunt filii Israhel gladio cum ceteris interfectis";
kjv[23] = "And the border of the children of Reuben was Jordan, and the border [thereof]. This [was] the inheritance of the children of Reuben after their families, the cities and the villages thereof.";
rsv[23] = "And the border of the people of Reuben was the Jordan as a boundary. This was the inheritance of the Reubenites, according to their families with their cities and villages.";
asv[23] = "And the border of the children of Reuben was the Jordan, and the border [thereof]. This was the inheritance of the children of Reuben according to their families, the cities and the villages thereof.";
yng[23] = "And the border of the sons of Reuben is the Jordan, and [its] border; this [is] the inheritance of the sons of Reuben, for their families, the cities and their villages.";
dby[23] = "And the border of the children of Reuben was the Jordan, and [its] border. This is the inheritance of the children of Reuben according to their families, the cities and their hamlets.";
web[23] = "And the border of the children of Reuben was Jordan, and its border. This [was] the inheritance of the children of Reuben after their families, the cities and their villages.";
hnv[23] = "The border of the children of Re\'uven was the Yarden, and the border [of it]. This was the inheritance of the children of Re\'uven according to their families, the cities and the villages of it.";
vul[23] = "factusque est terminus filiorum Ruben Iordanis fluvius haec est possessio Rubenitarum per cognationes suas urbium et viculorum";
kjv[24] = "And Moses gave [inheritance] unto the tribe of Gad, [even] unto the children of Gad according to their families.";
rsv[24] = "And Moses gave an inheritance also to the tribe of the Gadites, according to their families.";
asv[24] = "And Moses gave unto the tribe of Gad, unto the children of Gad, according to their families.";
yng[24] = "And Moses giveth to the tribe of Gad, to the sons of Gad, for their families;";
dby[24] = "And Moses gave [a portion] to the tribe of Gad, to the children of Gad according to their families.";
web[24] = "And Moses gave [inheritance] to the tribe of Gad, [even] to the children of Gad according to their families.";
hnv[24] = "Moshe gave to the tribe of Gad, to the children of Gad, according to their families.";
vul[24] = "deditque Moses tribui Gad et filiis eius per cognationes suas possessionem cuius haec divisio est";
kjv[25] = "And their coast was Jazer, and all the cities of Gilead, and half the land of the children of Ammon, unto Aroer that [is] before Rabbah;";
rsv[25] = "Their territory was Jazer, and all the cities of Gilead, and half the land of the Ammonites, to Aro\'er, which is east of Rabbah,";
asv[25] = "And their border was Jazer, and all the cities of Gilead, and half the land of the children of Ammon, unto Aroer that is before Rabbah;";
yng[25] = "and the border is to them Jazer, and all the cities of Gilead, and the half of the land of the Bene-Ammon, unto Aroer which [is] on the front of Rabbah,";
dby[25] = "And their territory was Jaazer, and all the cities of Gilead, and half the land of the children of Ammon, to Aroer which is before Rabbah;";
web[25] = "And their border was Jazer, and all the cities of Gilead, and half the land of the children of Ammon, to Aroer that [is] before Rabbah;";
hnv[25] = "Their border was Ya`zer, and all the cities of Gil`ad, and half the land of the children of `Ammon, to `Aro`er that is before Rabbah;";
vul[25] = "terminus Iazer et omnes civitates Galaad dimidiamque partem terrae filiorum Ammon usque ad Aroer quae est contra Rabba";
kjv[26] = "And from Heshbon unto Ramathmizpeh, and Betonim; and from Mahanaim unto the border of Debir;";
rsv[26] = "and from Heshbon to Ra\'math-miz\'peh and Bet\'onim, and from Mahana\'im to the territory of Debir,";
asv[26] = "and from Heshbon unto Ramath-mizpeh, and Betonim; and from Mahanaim unto the border of Debir;";
yng[26] = "and from Heshbon unto Ramath-Mispeh, and Betonim, and from Mahanaim unto the border of Debir,";
dby[26] = "and from Heshbon to Ramath-Mizpeh, and Betonim; and from Mahanaim to the border of Debir;";
web[26] = "And from Heshbon to Ramath-mizpeh, and Betonim; and from Mahanaim to the border of Debir;";
hnv[26] = "and from Heshbon to Ramat-Hamitzpeh, and Betonim; and from Machanayim to the border of Devir;";
vul[26] = "et ab Esebon usque Ramoth Masphe et Batanim et a Manaim usque ad terminos Dabir";
kjv[27] = "And in the valley, Betharam, and Bethnimrah, and Succoth, and Zaphon, the rest of the kingdom of Sihon king of Heshbon, Jordan and [his] border, [even] unto the edge of the sea of Chinnereth on the other side Jordan eastward.";
rsv[27] = "and in the valley Beth-ha\'ram, Beth-nim\'rah, Succoth, and Zaphon, the rest of the kingdom of Sihon king of Heshbon, having the Jordan as a boundary, to the lower end of the Sea of Chin\'nereth, eastward beyond the Jordan.";
asv[27] = "and in the valley, Beth-haram, and Beth-nimrah, and Succoth, and Zaphon, the rest of the kingdom of Sihon king of Heshbon, the Jordan and the border [thereof], unto the uttermost part of the sea of Chinnereth beyond the Jordan eastward.";
yng[27] = "and in the valley, Beth-Aram, and Beth-Nimrah, and Succoth, and Zaphon, the rest of the kingdom of Sihon king of Heshbon, the Jordan and [its] border, unto the extremity of the sea of Chinnereth, beyond the Jordan, eastward.";
dby[27] = "and in the valley, Beth-haram, and Beth-Nimrah, and Succoth, and Zaphon, the rest of the kingdom of Sihon the king of Heshbon, the Jordan and [its] border, as far as the edge of the sea of Chinnereth beyond the Jordan eastward.";
web[27] = "And in the valley, Beth-aram, and Beth-nimrah, and Succoth, and Zaphon, the rest of the kingdom of Sihon king of Heshbon, Jordan and [its] border, [even] to the edge of the sea of Cinneroth, on the other side of Jordan eastward.";
hnv[27] = "and in the valley, Beit-Haram, and Beit-Nimrah, and Sukkot, and Tzafon, the rest of the kingdom of Sichon king of Heshbon, the Yarden and the border [of it], to the uttermost part of the sea of Kinneret beyond the Yarden eastward.";
vul[27] = "in valle quoque Betharaam et Bethnemra et Soccoth et Saphon reliquam partem regni Seon regis Esebon huius quoque Iordanis finis est usque ad extremam partem maris Chenereth trans Iordanem ad orientalem plagam";
kjv[28] = "This [is] the inheritance of the children of Gad after their families, the cities, and their villages.";
rsv[28] = "This is the inheritance of the Gadites according to their families, with their cities and villages.";
asv[28] = "This is the inheritance of the children of Gad according to their families, the cities and the villages thereof.";
yng[28] = "This [is] the inheritance of the sons of Gad, for their families, the cities and their villages.";
dby[28] = "This is the inheritance of the children of Gad according to their families, the cities and their hamlets.";
web[28] = "This [is] the inheritance of the children of Gad after their families, the cities, and their villages.";
hnv[28] = "This is the inheritance of the children of Gad according to their families, the cities and the villages of it.";
vul[28] = "haec est possessio filiorum Gad per familias suas civitates et villae earum";
kjv[29] = "And Moses gave [inheritance] unto the half tribe of Manasseh: and [this] was [the possession] of the half tribe of the children of Manasseh by their families.";
rsv[29] = "And Moses gave an inheritance to the half-tribe of Manas\'seh; it was allotted to the half-tribe of the Manas\'sites according to their families.";
asv[29] = "And Moses gave [inheritance] unto the half-tribe of Manasseh: and it was for the half-tribe of the children of Manasseh according to their families.";
yng[29] = "And Moses giveth to the half of the tribe of Manasseh; and it is to the half of the tribe of the sons of Manasseh, for their families.";
dby[29] = "And Moses gave [a portion] to half the tribe of Manasseh; and for half the tribe of the children of Manasseh according to their families:";
web[29] = "And Moses gave [inheritance] to the half-tribe of Manasseh: and [this] was [the possession] of the half-tribe of the children of Manasseh by their families.";
hnv[29] = "Moshe gave [inheritance] to the half-tribe of Menashsheh: and it was for the half-tribe of the children of Menashsheh according to their families.";
vul[29] = "dedit et dimidiae tribui Manasse filiisque eius iuxta cognationes suas possessionem";
kjv[30] = "And their coast was from Mahanaim, all Bashan, all the kingdom of Og king of Bashan, and all the towns of Jair, which [are] in Bashan, threescore cities:";
rsv[30] = "Their region extended from Mahana\'im, through all Bashan, the whole kingdom of Og king of Bashan, and all the towns of Ja\'ir, which are in Bashan, sixty cities,";
asv[30] = "And their border was from Mahanaim, all Bashan, all the kingdom of Og king of Bashan, and all the towns of Jair, which are in Bashan, threescore cities:";
yng[30] = "And their border is from Mahanaim, all Bashan, all the kingdom of Og king of Bashan, and all the small towns of Jair, which [are] in Bashan, sixty cities;";
dby[30] = "their territory was from Mahanaim, all Bashan, the whole kingdom of Og the king of Bashan, and all the villages of Jair, which are in Bashan, sixty cities.";
web[30] = "And their border was from Mahanaim, all Bashan, all the kingdom of Og king of Bashan, and all the towns of Jair, which [are] in Bashan, sixty cities:";
hnv[30] = "Their border was from Machanayim, all Bashan, all the kingdom of `Og king of Bashan, and all the towns of Ya\'ir, which are in Bashan, sixty cities:";
vul[30] = "cuius hoc principium est a Manaim universam Basan et cuncta regna Og regis Basan omnesque vicos Air qui sunt in Basan sexaginta oppida";
kjv[31] = "And half Gilead, and Ashtaroth, and Edrei, cities of the kingdom of Og in Bashan, [were pertaining] unto the children of Machir the son of Manasseh, [even] to the one half of the children of Machir by their families.";
rsv[31] = "and half Gilead, and Ash\'taroth, and Ed\'re-i, the cities of the kingdom of Og in Bashan; these were allotted to the people of Machir the son of Manas\'seh for the half of the Machirites according to their families.";
asv[31] = "and half Gilead, and Ashtaroth, and Edrei, the cities of the kingdom of Og in Bashan, were for the children of Machir the son of Manasseh, even for the half of the children of Machir according to their families.";
yng[31] = "and the half of Gilead, and Ashteroth, and Edrei, cities of the kingdom of Og in Bashan, [are] to the sons of Machir, son of Manasseh, to the half of the sons of Machir, for their families.";
dby[31] = "And half Gilead, and Ashtaroth, and Edrei, the cities of the kingdom of Og in Bashan, [belonged] to the children of Machir the son of Manasseh, to the one half of the children of Machir according to their families.";
web[31] = "And half Gilead, and Ashtaroth, and Edrei, cities of the kingdom of Og in Bashan, [were pertaining] to the children of Machir the son of Manasseh, [even] to the one half of the children of Machir by their families.";
hnv[31] = "and half Gil`ad, and `Ashtarot, and Edre`i, the cities of the kingdom of `Og in Bashan, were for the children of Makhir the son of Menashsheh, even for the half of the children of Makhir according to their families.";
vul[31] = "et dimidiam partem Galaad Astharoth et Edrai urbes regni Og in Basan filiis Machir filii Manasse dimidiae parti filiorum Machir iuxta cognationes suas";
kjv[32] = "These [are the countries] which Moses did distribute for inheritance in the plains of Moab, on the other side Jordan, by Jericho, eastward.";
rsv[32] = "These are the inheritances which Moses distributed in the plains of Moab, beyond the Jordan east of Jericho.";
asv[32] = "These are the inheritances which Moses distributed in the plains of Moab, beyond the Jordan at Jericho, eastward.";
yng[32] = "These [are] they whom Moses caused to inherit in the plains of Moab, beyond the Jordan, [by] Jericho, eastward;";
dby[32] = "This is that which Moses allotted for inheritance in the plains of Moab, beyond the Jordan of Jericho, eastward.";
web[32] = "These [are the countries] which Moses distributed for inheritance in the plains of Moab, on the other side of Jordan by Jericho eastward.";
hnv[32] = "These are the inheritances which Moshe distributed in the plains of Mo\'av, beyond the Yarden at Yericho, eastward.";
vul[32] = "hanc possessionem divisit Moses in campestribus Moab trans Iordanem contra Hiericho ad orientalem plagam";
kjv[33] = "But unto the tribe of Levi Moses gave not [any] inheritance: the LORD God of Israel [was] their inheritance, as he said unto them.";
rsv[33] = "But to the tribe of Levi Moses gave no inheritance; the LORD God of Israel is their inheritance, as he said to them.";
asv[33] = "But unto the tribe of Levi Moses gave no inheritance: Jehovah, the God of Israel, is their inheritance, as he spake unto them.";
yng[33] = "and to the tribe of Levi Moses gave not an inheritance; Jehovah, God of Israel, Himself [is] their inheritance, as He hath spoken to them.";
dby[33] = "But to the tribe of Levi Moses gave no inheritance: Jehovah the God of Israel is their inheritance, as he said to them.";
web[33] = "But to the tribe of Levi Moses gave not [any] inheritance: the LORD God of Israel [was] their inheritance, as he said to them.";
hnv[33] = "But to the tribe of Levi Moshe gave no inheritance: the LORD, the God of Yisra\'el, is their inheritance, as he spoke to them.";
vul[33] = "tribui autem Levi non dedit possessionem quoniam Dominus Deus Israhel ipse est possessio eius ut locutus est illi";
