csb[1] = "After the entire nation had finished crossing the Jordan, the LORD spoke to Joshua:";
csb[2] = "&quot;Choose twelve men from the people, one man for each tribe,";
csb[3] = "&quot;and command them: Take twelve stones from this place in the middle of the Jordan where the priests are standing, carry them with you, and set them down at the place where you spend the night.&quot;";
csb[4] = "So Joshua summoned the twelve men he had selected from the Israelites, one man for each tribe,";
csb[5] = "and said to them, &quot;Go across to the ark of the LORD your God in the middle of the Jordan. Each of you lift a stone onto his shoulder, one for each of the Israelite tribes,";
csb[6] = "&quot;so that this will be a sign among you. In the future, when your children ask you, \'What do these stones mean to you? \'";
csb[7] = "&quot;you should tell them, \'The water of the Jordan was cut off in front of the ark of the LORD\'s covenant. When it crossed the Jordan, the Jordan\'s water was cut off.\' Therefore these stones will always be a memorial for the Israelites.&quot;";
csb[8] = "The Israelites did just as Joshua had commanded them. The twelve men took stones from the middle of the Jordan, one for each of the Israelite tribes, just as the LORD had told Joshua. They carried them to the camp and set them down there.";
csb[9] = "Joshua also set up twelve stones in the middle of the Jordan where the priests who carried the ark of the covenant were standing. The stones are still there today.";
csb[10] = "The priests carrying the ark continued standing in the middle of the Jordan until everything was completed that the LORD had commanded Joshua to tell the people, in keeping with all that Moses had commanded Joshua. The people hurried across,";
csb[11] = "and after everyone had finished crossing, the priests with the ark of the LORD crossed in the sight of the people.";
csb[12] = "The Reubenites, Gadites, and half the tribe of Manasseh went in battle formation in front of the Israelites, as Moses had instructed them.";
csb[13] = "About forty thousand equipped for war crossed to the plains of Jericho in the LORD\'s presence.";
csb[14] = "On that day the LORD exalted Joshua in the sight of all Israel, and they revered him throughout his life, as they had revered Moses.";
csb[15] = "The LORD told Joshua,";
csb[16] = "&quot;Command the priests who carry the ark of the testimony to come up from the Jordan.&quot;";
csb[17] = "So Joshua commanded the priests, &quot;Come up from the Jordan.&quot;";
csb[18] = "When the priests carrying the ark of the LORD\'s covenant came up from the middle of the Jordan, and their feet stepped out on solid ground, the water of the Jordan resumed its course, flowing over all the banks as before.";
csb[19] = "The people came up from the Jordan on the tenth day of the first month, and camped at Gilgal on the eastern limits of Jericho.";
csb[20] = "Then Joshua set up in Gilgal the twelve stones they had taken from the Jordan,";
csb[21] = "and he said to the Israelites, &quot;In the future, when your children ask their fathers, \'What is the meaning of these stones? \'";
csb[22] = "&quot;you should tell your children, \'Israel crossed the Jordan on dry ground.\'";
csb[23] = "&quot;For the LORD your God dried up the water of the Jordan before you until you had crossed over, just as the LORD your God did to the Red Sea, which he dried up before us until we had crossed over.";
csb[24] = "&quot;This is so that all the peoples of the earth may know that the LORD\'s hand is mighty, and so that you may always fear the LORD your God.&quot;";

kjv[18] = "And it came to pass, when the priests that bare the ark of the covenant of the LORD were come up out of the midst of Jordan, [and] the soles of the priests\' feet were lifted up unto the dry land, that the waters of Jordan returned unto their place, and flowed over all his banks, as [they did] before.";
