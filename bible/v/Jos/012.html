csb[1] = "The Israelites struck down the following kings of the land and took possession of their land beyond the Jordan to the east and from the Arnon River to Mount Hermon, including all the Arabah eastward:";
csb[2] = "King Sihon of the Amorites lived in Heshbon. He ruled from Aroer on the rim of the Arnon River, along the middle of the valley, and half of Gilead up to the Jabbok River (the border of the Ammonites),";
csb[3] = "the Arabah east of the Sea of Chinnereth to the Sea of Arabah (that is, the Dead Sea), eastward through Beth-jeshimoth and southward below the slopes of Pisgah.";
csb[4] = "King Og of Bashan, of the remnant of the Rephaim, lived in Ashtaroth and Edrei.";
csb[5] = "He ruled over Mount Hermon, Salecah, all Bashan up to the Geshurite and Maacathite border, and half of Gilead to the border of King Sihon of Heshbon.";
csb[6] = "Moses the LORD\'s servant and the Israelites struck them down. And Moses the LORD\'s servant gave their land as an inheritance to the Reubenites, Gadites, and half the tribe of Manasseh.";
csb[7] = "Joshua and the Israelites struck down the following kings of the land beyond the Jordan to the west, from Baal-gad in the Valley of Lebanon to Mount Halak, which ascends toward Seir (Joshua gave their land as an inheritance to the tribes of Israel according to their allotments:";
csb[8] = "the hill country, the Judean foothills, the Arabah, the slopes, the wilderness, and the Negev -- the lands of the Hethites, Amorites, Canaanites, Perizzites, Hivites, and Jebusites):";
csb[9] = "the king of Jericho one the king of Ai, which is next to Bethel one";
csb[10] = "the king of Jerusalem one the king of Hebron one";

kjv[1] = "Now these [are] the kings of the land, which the children of Israel smote, and possessed their land on the other side Jordan toward the rising of the sun, from the river Arnon unto mount Hermon, and all the plain on the east:";
rsv[1] = "Now these are the kings of the land, whom the people of Israel defeated, and took possession of their land beyond the Jordan toward the sunrising, from the valley of the Arnon to Mount Hermon, with all the Arabah eastward:";
asv[1] = "Now these are the kings of the land, whom the children of Israel smote, and possessed their land beyond the Jordan toward the sunrising, from the valley of the Arnon unto mount Hermon, and all the Arabah eastward:";
yng[1] = "And these [are] kings of the land whom the sons of Israel have smitten, and possess their land, beyond the Jordan, at the sun-rising, from the brook Arnon unto mount Hermon, and all the plain eastward.";
dby[1] = "And these are the kings of the land, whom the children of Israel smote, and of whose land they took possession across the Jordan, toward the sun-rising, from the river Arnon to mount Hermon, and all the plain on the east:";
web[1] = "Now these [are] the kings of the land, whom the children of Israel smote, and possessed their land on the other side of Jordan towards the rising of the sun, from the river Arnon, to mount Hermon, and all the plain on the east:";
hnv[1] = "Now these are the kings of the land, whom the children of Yisra\'el struck, and possessed their land beyond the Yarden toward the sunrise, from the valley of the Arnon to Mount Hermon, and all the `Aravah eastward:";
vul[1] = "hii sunt reges quos percusserunt filii Israhel et possederunt terram eorum trans Iordanem ad solis ortum a torrente Arnon usque ad montem Hermon et omnem orientalem plagam quae respicit solitudinem";
kjv[2] = "Sihon king of the Amorites, who dwelt in Heshbon, [and] ruled from Aroer, which [is] upon the bank of the river Arnon, and from the middle of the river, and from half Gilead, even unto the river Jabbok, [which is] the border of the children of Ammon;";
rsv[2] = "Sihon king of the Amorites who dwelt at Heshbon, and ruled from Aro\'er, which is on the edge of the valley of the Arnon, and from the middle of the valley as far as the river Jabbok, the boundary of the Ammonites, that is, half of Gilead,";
asv[2] = "Sihon king of the Amorites, who dwelt in Heshbon, and ruled from Aroer, which is on the edge of the valley of the Arnon, and [the city that is in] the middle of the valley, and half Gilead, even unto the river Jabbok, the border of the children of Ammon;";
yng[2] = "Sihon, king of the Amorite, who is dwelling in Heshbon, ruling from Aroer which [is] on the border of the brook Arnon, and the middle of the brook, and half of Gilead, and unto Jabok the brook, the border of the Bene-Ammon;";
dby[2] = "Sihon the king of the Amorites, who dwelt at Heshbon, [and] ruled from Aroer, which is upon the bank of the river Arnon, and from the middle of the ravine, and over half Gilead, as far as the river Jabbok, [which is] the border of the children of Ammon;";
web[2] = "Sihon king of the Amorites, who dwelt in Heshbon, [and] ruled from Aroer, which [is] upon the bank of the river Arnon, and from the middle of the river, and from half Gilead, even to the river Jabbok, [which is] the border of the children of Ammon;";
hnv[2] = "Sichon king of the Amori, who lived in Heshbon, and ruled from `Aro`er, which is on the edge of the valley of the Arnon, and [the city that is in] the middle of the valley, and half Gil`ad, even to the river Yabbok, the border of the children of `Ammon;";
vul[2] = "Seon rex Amorreorum qui habitavit in Esebon dominatus est ab Aroer quae sita est super ripam torrentis Arnon et mediae partis in valle dimidiique Galaad usque ad torrentem Iaboc qui est terminus filiorum Ammon";
kjv[3] = "And from the plain to the sea of Chinneroth on the east, and unto the sea of the plain, [even] the salt sea on the east, the way to Bethjeshimoth; and from the south, under Ashdothpisgah:";
rsv[3] = "and the Arabah to the Sea of Chin\'neroth eastward, and in the direction of Beth-jesh\'imoth, to the sea of the Arabah, the Salt Sea, southward to the foot of the slopes of Pisgah;";
asv[3] = "and the Arabah unto the sea of Chinneroth, eastward, and unto the sea of the Arabah, even the Salt Sea, eastward, the way to Beth-jeshimoth; and on the south, under the slopes of Pisgah:";
yng[3] = "And the plain unto the sea of Chinneroth eastward, and unto the sea of the plain (the salt sea) eastward, the way to Beth-Jeshimoth, and from the south under the springs of Pisgah.";
dby[3] = "and the plain as far as the sea of Chinneroth on the east, and as far as the sea of the plain, the salt sea, on the east, toward Beth-jeshimoth; and on the south, under the slopes of Pisgah;";
web[3] = "And from the plain to the sea of Cinneroth on the east, and to the sea of the plain, [even] the salt sea on the east, the way to Beth-jeshimoth; and from the south, under Ashdoth-pisgah:";
hnv[3] = "and the `Aravah to the sea of Kinnarot, eastward, and to the sea of the `Aravah, even the Salt Sea, eastward, the way to Beth-jeshimoth; and on the south, under the slopes of Pisgah:";
vul[3] = "et a solitudine usque ad mare Cheneroth contra orientem et usque ad mare Deserti quod est mare Salsissimum ad orientalem plagam per viam quae ducit Bethesimoth et ab australi parte quae subiacent Asedothphasga";
kjv[4] = "And the coast of Og king of Bashan, [which was] of the remnant of the giants, that dwelt at Ashtaroth and at Edrei,";
rsv[4] = "and Og king of Bashan, one of the remnant of the Reph\'aim, who dwelt at Ash\'taroth and at Ed\'re-i";
asv[4] = "and the border of Og king of Bashan, of the remnant of the Rephaim, who dwelt at Ashtaroth and at Edrei,";
yng[4] = "And the border of Og king of Bashan (of the remnant of the Rephaim), who is dwelling in Ashtaroth and in Edrei,";
dby[4] = "and the territory of Og the king of Bashan, of the residue of the giants, who dwelt at Ashtaroth and at Edrei,";
web[4] = "And the coast of Og king of Bashan, [who was] of the remnant of the giants, that dwelt at Ashtaroth and at Edrei,";
hnv[4] = "and the border of `Og king of Bashan, of the remnant of the Refa\'im, who lived at `Ashtarot and at Edre`i,";
vul[4] = "terminus Og regis Basan de reliquiis Rafaim qui habitavit in Astharoth et in Edrain et dominatus est in monte Hermon et in Salacha atque in universa Basan usque ad terminos";
kjv[5] = "And reigned in mount Hermon, and in Salcah, and in all Bashan, unto the border of the Geshurites and the Maachathites, and half Gilead, the border of Sihon king of Heshbon.";
rsv[5] = "and ruled over Mount Hermon and Sal\'ecah and all Bashan to the boundary of the Gesh\'urites and the Ma-ac\'athites, and over half of Gilead to the boundary of Sihon king of Heshbon.";
asv[5] = "and ruled in mount Hermon, and in Salecah, and in all Bashan, unto the border of the Geshurites and the Maacathites, and half Gilead, the border of Sihon king of Heshbon.";
yng[5] = "and ruling in mount Hermon, and in Salcah, and in all Bashan, unto the border of the Geshurite, and the Maachathite, and the half of Gilead, the border of Sihon king of Heshbon.";
dby[5] = "and ruled over mount Hermon, and over Salcah, and over all Bashan, as far as the border of the Geshurites and the Maachathites, and [over] half Gilead [as far as] the border of Sihon the king of Heshbon.";
web[5] = "And reigned in mount Hermon, and in Salcah, and in all Bashan, to the border of the Geshurites, and the Maachathites, and half Gilead, the border of Sihon king of Heshbon.";
hnv[5] = "and ruled in Mount Hermon, and in Salkhah, and in all Bashan, to the border of the Geshuri and the Ma`akhati, and half Gil`ad, the border of Sichon king of Heshbon.";
vul[5] = "Gesuri et Machathi et dimidiae partis Galaad terminos Seon regis Esebon";
kjv[6] = "Them did Moses the servant of the LORD and the children of Israel smite: and Moses the servant of the LORD gave it [for] a possession unto the Reubenites, and the Gadites, and the half tribe of Manasseh.";
rsv[6] = "Moses, the servant of the LORD, and the people of Israel defeated them; and Moses the servant of the LORD gave their land for a possession to the Reubenites and the Gadites and the half-tribe of Manas\'seh.";
asv[6] = "Moses the servant of Jehovah and the children of Israel smote them: and Moses the servant of Jehovah gave it for a possession unto the Reubenites, and the Gadites, and the half-tribe of Manasseh.";
yng[6] = "Moses, servant of Jehovah, and the sons of Israel have smitten them, and Moses, servant of Jehovah, giveth it -- a possession to the Reubenite, and to the Gadite, and to the half of the tribe of Manasseh.";
dby[6] = "Moses the servant of Jehovah and the children of Israel smote them, and Moses the servant of Jehovah gave it for a possession to the Reubenites, and to the Gadites, and to half the tribe of Manasseh.";
web[6] = "Them did Moses the servant of the LORD, and the children of Israel smite: and Moses the servant of the LORD gave it [for] a possession to the Reubenites, and the Gadites, and the half-tribe of Manasseh.";
hnv[6] = "Moshe the servant of the LORD and the children of Yisra\'el struck them: and Moshe the servant of the LORD gave it for a possession to the Re\'uveni, and the Gadi, and the half-tribe of Menashsheh.";
vul[6] = "Moses famulus Domini et filii Israhel percusserunt eos tradiditque terram eorum Moses in possessionem Rubenitis et Gadditis et dimidiae tribui Manasse";
kjv[7] = "And these [are] the kings of the country which Joshua and the children of Israel smote on this side Jordan on the west, from Baalgad in the valley of Lebanon even unto the mount Halak, that goeth up to Seir; which Joshua gave unto the tribes of Israel [for] a possession according to their divisions;";
rsv[7] = "And these are the kings of the land whom Joshua and the people of Israel defeated on the west side of the Jordan, from Ba\'al-gad in the valley of Lebanon to Mount Halak, that rises toward Se\'ir (and Joshua gave their land to the tribes of Israel as a possession according to their allotments,";
asv[7] = "And these are the kings of the land whom Joshua and the children of Israel smote beyond the Jordan westward, from Baal-gad in the valley of Lebanon even unto mount Halak, that goeth up to Seir (and Joshua gave it unto the tribes of Israel for a possession according to their divisions;";
yng[7] = "And these [are] kings of the land whom Joshua and the sons of Israel have smitten beyond the Jordan westward, from Baal-Gad, in the valley of Lebanon, and unto the mount of Halak, which is going up to Seir; and Joshua giveth it to the tribes of Israel -- a possession according to their divisions;";
dby[7] = "And these are the kings of the land whom Joshua and the children of Israel smote on this side the Jordan on the west, from Baal-Gad in the valley of Lebanon as far as the smooth mountain, which rises toward Seir. And Joshua gave it to the tribes of Israel for a possession according to their divisions,";
web[7] = "And these [are] the kings of the country whom Joshua and the children of Israel smote on this side of Jordan on the west, from Baal-gad in the valley of Lebanon, even to the mount Halak that goeth up to Seir; which Joshua gave to the tribes of Israel [for] a possession according to their divisions;";
hnv[7] = " These are the kings of the land whom Yehoshua and the children of Yisra\'el struck beyond the Yarden westward, from Ba`al-Gad in the valley of Levanon even to Mount Halak, that goes up to Se`ir; and Yehoshua gave it to the tribes of Yisra\'el for a possession according to their divisions;";
vul[7] = "hii sunt reges terrae quos percussit Iosue et filii Israhel trans Iordanem ad occidentalem plagam a Baalgad in campo Libani usque ad montem cuius pars ascendit in Seir tradiditque eam Iosue in possessionem tribubus Israhel singulis partes suas";
kjv[8] = "In the mountains, and in the valleys, and in the plains, and in the springs, and in the wilderness, and in the south country; the Hittites, the Amorites, and the Canaanites, the Perizzites, the Hivites, and the Jebusites:";
rsv[8] = "in the hill country, in the lowland, in the Arabah, in the slopes, in the wilderness, and in the Negeb, the land of the Hittites, the Amorites, the Canaanites, the Per\'izzites, the Hivites, and the Jeb\'usites):";
asv[8] = "in the hill-country, and in the lowland, and in the Arabah, and in the slopes, and in the wilderness, and in the South; the Hittite, the Amorite, and the Canaanite, the Perizzite, the Hivite, and the Jebusite):";
yng[8] = "in the hill-country, and in the low country, and in the plain, and in the springs, and in the wilderness, and in the south; the Hittite, the Amorite, and the Canaanite, the Perizzite, the Hivite, and the Jebusite:";
dby[8] = "in the mountain, and in the lowland, and in the plain, and on the hill-slopes, and in the wilderness, and in the south: the Hittites, and the Amorites, and the Canaanites, the Perizzites, the Hivites and the Jebusites:";
web[8] = "In the mountains, and in the valleys, and in the plains, and in the springs, and in the wilderness, and in the south country; the Hittites, the Amorites, and the Canaanites, the Perizzites, the Hivites, and the Jebusites:";
hnv[8] = "in the hill-country, and in the lowland, and in the `Aravah, and in the slopes, and in the wilderness, and in the South; the Hittite, the Amori, and the Kana`ani, the Perizzi, the Hivvi, and the Yevusi:";
vul[8] = "tam in montanis quam in planis atque campestribus in Aseroth et solitudine ac meridie Hettheus fuit et Amorreus Chananeus et Ferezeus Eveus et Iebuseus";
