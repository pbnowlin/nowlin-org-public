csb[1] = "The LORD said to Joshua, &quot;Do not be afraid or discouraged. Take all the troops with you and go attack Ai. Look, I have handed over to you the king of Ai, his people, city, and land.";
csb[2] = "&quot;Treat Ai and its king as you did Jericho and its king, except that you may plunder its spoil and livestock for yourselves. Set an ambush behind the city.&quot;";
csb[3] = "So Joshua and all the troops set out to attack Ai. Joshua selected thirty thousand of his best soldiers and sent them out at night.";
csb[4] = "He commanded them: &quot;Pay attention. Lie in ambush behind the city, not too far from it, and all of you be ready.";
csb[5] = "&quot;Then I and all the people who are with me will approach the city. When they come out against us as they did the first time, we will flee from them.";
csb[6] = "&quot;They will come after us until we have drawn them away from the city, for they will say, \'They are fleeing from us as before.\' While we are fleeing from them,";
csb[7] = "&quot;you are to come out of your ambush and seize the city. The LORD your God will hand it over to you.";
csb[8] = "&quot;After taking the city, set it on fire. Follow the LORD\'s command -- see that you do as I have ordered you.&quot;";
csb[9] = "So Joshua sent them out, and they went to the ambush site and waited between Bethel and Ai, to the west of Ai. But he spent that night with the troops.";
csb[10] = "Joshua started early the next morning and mobilized them. Then he and the elders of Israel led the troops up to Ai.";
csb[11] = "All those who were with him went up and approached the city, arriving opposite Ai, and camped to the north of it, with a valley between them and the city.";
csb[12] = "Now Joshua had taken about five thousand men and set them in ambush between Bethel and Ai, to the west of the city.";
csb[13] = "The troops were stationed in this way: the main camp to the north of the city and its rear guard to the west of the city. And that night Joshua went into the valley.";
csb[14] = "When the king of Ai saw the Israelites, the men of the city hurried and went out early in the morning so that he and all his people could engage Israel in battle at a suitable place facing the Arabah. But he did not know there was an ambush waiting for him behind the city.";
csb[15] = "Joshua and all Israel pretended to be beaten back by them and fled toward the wilderness.";
csb[16] = "Then all the troops of Ai were summoned to pursue them, and they pursued Joshua and were drawn away from the city.";
csb[17] = "Not a man was left in Ai or Bethel who did not go out after Israel, leaving the city exposed while they pursued Israel.";
csb[18] = "Then the LORD said to Joshua, &quot;Hold out the javelin in your hand toward Ai, for I will hand the city over to you.&quot; So Joshua held out his javelin toward it.";
csb[19] = "When he held out his hand, the men in ambush rose quickly from their position. They ran, entered the city, captured it, and immediately set it on fire.";
csb[20] = "The men of Ai turned and looked back, and smoke from the city was rising to the sky! They could not escape in any direction, and the troops who had fled to the wilderness now became the pursuers.";
csb[21] = "When Joshua and all Israel saw that the men in ambush had captured the city and that smoke was rising from it, they turned back and struck down the men of Ai.";
csb[22] = "Then men in ambush came out of the city against them, and the men of Ai were trapped between the Israelite forces, some on one side and some on the other. They struck them down until no survivor or fugitive remained,";
csb[23] = "but they captured the king of Ai alive and brought him to Joshua.";
csb[24] = "When Israel had finished killing everyone living in Ai who had pursued them into the open country, and when every last one of them had fallen by the sword, all Israel returned to Ai and struck it down with the sword.";
csb[25] = "The total of those who fell that day, both men and women, was twelve thousand -- all the people of Ai.";
csb[26] = "Joshua did not draw back his hand that was holding the javelin until all the inhabitants of Ai were completely destroyed.";
csb[27] = "Israel plundered only the cattle and spoil of that city for themselves, according to the LORD\'s command that he had given Joshua.";
csb[28] = "Joshua burned Ai and left it a permanent ruin, still desolate today.";
csb[29] = "He hung the body of the king of Ai on a tree until evening, and at sunset Joshua commanded that they take his body down from the tree. They threw it down at the entrance of the city gate and put a large pile of rocks over it, which still remains today.";
csb[30] = "At that time Joshua built an altar on Mount Ebal to the LORD, the God of Israel,";
csb[31] = "just as Moses the LORD\'s servant had commanded the Israelites. He built it according to what is written in the book of the law of Moses: an altar of uncut stones on which no iron tool has been used. Then they offered burnt offerings to the LORD and sacrificed fellowship offerings on it.";
csb[32] = "There on the stones, Joshua copied the law of Moses, which he had written in the presence of the Israelites.";
csb[33] = "All Israel -- resident alien and citizen alike -- with their elders, officers, and judges, stood on either side of the ark of the LORD\'s covenant facing the Levitical priests who carried it. Half of them were in front of Mount Gerizim and half in front of Mount Ebal, as Moses the LORD\'s servant had commanded earlier concerning blessing the people of Israel.";
csb[34] = "Afterward, Joshua read aloud all the words of the law -- the blessings as well as the curses -- according to all that is written in the book of the law.";
csb[35] = "There was not a word of all that Moses had commanded that Joshua did not read before the entire assembly of Israel, including the women, the dependents, and the resident aliens who lived among them.";

hnv[16] = "All the people who were in the city were called together to pursue after them: and they pursued after Yehoshua, and were drawn away from the city.";
vul[16] = "at illi vociferantes pariter et se mutuo cohortantes persecuti sunt eos cumque recessissent a civitate";
kjv[17] = "And there was not a man left in Ai or Bethel, that went not out after Israel: and they left the city open, and pursued after Israel.";
rsv[17] = "There was not a man left in Ai or Bethel, who did not go out after Israel; they left the city open, and pursued Israel.";
asv[17] = "And there was not a man left in Ai or Beth-el, that went not out after Israel: and they left the city open, and pursued after Israel.";
yng[17] = "and there hath not been left a man in Ai and Bethel who hath not gone out after Israel, and they leave the city open, and pursue after Israel.";
dby[17] = "And not a man remained in Ai and Bethel that went not out after Israel; and they left the city open, and pursued after Israel.";
web[17] = "And there was not a man left in Ai, or Beth-el that went not out after Israel: and they left the city open, and pursued Israel.";
hnv[17] = "There was not a man left in `Ai or Beit-El, who didn\'t go out after Yisra\'el: and they left the city open, and pursued after Yisra\'el.";
vul[17] = "et ne unus quidem in urbe Ahi et Bethel remansisset qui non persequeretur Israhel sicut eruperant aperta oppida relinquentes";
kjv[18] = "And the LORD said unto Joshua, Stretch out the spear that [is] in thy hand toward Ai; for I will give it into thine hand. And Joshua stretched out the spear that [he had] in his hand toward the city.";
rsv[18] = "Then the LORD said to Joshua, &quot;Stretch out the javelin that is in your hand toward Ai; for I will give it into your hand.&quot; And Joshua stretched out the javelin that was in his hand toward the city.";
asv[18] = "And Jehovah said unto Joshua, Stretch out the javelin that is in thy hand toward Ai; for I will give it into thy hand. And Joshua stretched out the javelin that was in his hand toward the city.";
yng[18] = "And Jehovah saith unto Joshua, `Stretch out with the javelin which [is] in thy hand towards Ai, for into thy hand I give it;\' and Joshua stretcheth out with the javelin which [is] in his hand toward the city,";
dby[18] = "And Jehovah said to Joshua, Stretch out the javelin that is in thy hand toward Ai; for I will give it into thy hand. And Joshua stretched out the javelin that he had in his hand toward the city.";
web[18] = "And the LORD said to Joshua, Stretch out the spear that [is] in thy hand towards Ai; for I will give it into thy hand. And Joshua stretched out the spear that [he had] in his hand towards the city.";
hnv[18] = "The LORD said to Yehoshua, Stretch out the javelin that is in your hand toward `Ai; for I will give it into your hand. Yehoshua stretched out the javelin that was in his hand toward the city.";
vul[18] = "dixit Dominus ad Iosue leva clypeum qui in manu tua est contra urbem Ahi quoniam tibi tradam eam";
kjv[19] = "And the ambush arose quickly out of their place, and they ran as soon as he had stretched out his hand: and they entered into the city, and took it, and hasted and set the city on fire.";
rsv[19] = "And the ambush rose quickly out of their place, and as soon as he had stretched out his hand, they ran and entered the city and took it; and they made haste to set the city on fire.";
asv[19] = "And the ambush arose quickly out of their place, and they ran as soon as he had stretched out his hand, and entered into the city, and took it; and they hasted and set the city on fire.";
yng[19] = "and the ambush hath risen [with] haste, out of its place, and they run at the stretching out of his hand, and go into the city, and capture it, and hasten, and burn the city with fire.";
dby[19] = "And the ambush arose quickly from their place, and they ran when he stretched out his hand, and came into the city, and took it, and hasted and set the city on fire.";
web[19] = "And the ambush arose quickly out of their place, and they ran as soon as he had stretched out his hand: and they entered into the city, and took it, and hasted, and set the city on fire.";
hnv[19] = "The ambush arose quickly out of their place, and they ran as soon as he had stretched out his hand, and entered into the city, and took it; and they hurried and set the city on fire.";
vul[19] = "cumque elevasset clypeum ex adverso civitatis insidiae quae latebant surrexerunt confestim et pergentes ad civitatem ceperunt et succenderunt eam";
kjv[20] = "And when the men of Ai looked behind them, they saw, and, behold, the smoke of the city ascended up to heaven, and they had no power to flee this way or that way: and the people that fled to the wilderness turned back upon the pursuers.";
rsv[20] = "So when the men of Ai looked back, behold, the smoke of the city went up to heaven; and they had no power to flee this way or that, for the people that fled to the wilderness turned back upon the pursuers.";
asv[20] = "And when the men of Ai looked behind them, they saw, and, behold, the smoke of the city ascended up to heaven, and they had no power to flee this way or that way: and the people that fled to the wilderness turned back upon the pursuers.";
yng[20] = "And the men of Ai look behind them, and see, and lo, the smoke of the city hath gone up unto the heavens, and there hath not been in them power to flee hither and thither -- and the people who are fleeing to the wilderness have turned against the pursuer, --";
dby[20] = "And the men of Ai turned and saw, and behold, the smoke of the city went up to heaven, and they had no power to flee this way or that way; and the people that fled to the wilderness turned upon the pursuers.";
web[20] = "And when the men of Ai looked behind them, they saw, and behold, the smoke of the city ascended to heaven, and they had no power to flee this way or that way: and the people that fled to the wilderness turned back upon the pursuers.";
hnv[20] = "When the men of `Ai looked behind them, they saw, and, behold, the smoke of the city ascended up to heaven, and they had no power to flee this way or that way: and the people who fled to the wilderness turned back on the pursuers.";
vul[20] = "viri autem civitatis qui persequebantur Iosue respicientes et videntes fumum urbis ad caelum usque conscendere non potuerunt ultra huc illucque diffugere praesertim cum hii qui simulaverant fugam et tendebant ad solitudinem contra persequentes fortissime restitissent";
kjv[21] = "And when Joshua and all Israel saw that the ambush had taken the city, and that the smoke of the city ascended, then they turned again, and slew the men of Ai.";
rsv[21] = "And when Joshua and all Israel saw that the ambush had taken the city, and that the smoke of the city went up, then they turned back and smote the men of Ai.";
asv[21] = "And when Joshua and all Israel saw that the ambush had taken the city, and that the smoke of the city ascended, then they turned again, and slew the men of Ai.";
yng[21] = "and Joshua and all Israel have seen that the ambush hath captured the city, and that the smoke of the city hath gone up, and they turn back and smite the men of Ai;";
dby[21] = "When Joshua and all Israel saw that the ambush had taken the city, and that the smoke of the city went up, they turned again, and slew the men of Ai.";
web[21] = "And when Joshua and all Israel saw that the ambush had taken the city, and that the smoke of the city ascended, then they turned again and slew the men of Ai.";
hnv[21] = "When Yehoshua and all Yisra\'el saw that the ambush had taken the city, and that the smoke of the city ascended, then they turned again, and killed the men of `Ai.";
vul[21] = "vidensque Iosue et omnis Israhel quod capta esset civitas et fumus urbis ascenderet reversus percussit viros Ahi";
kjv[22] = "And the other issued out of the city against them; so they were in the midst of Israel, some on this side, and some on that side: and they smote them, so that they let none of them remain or escape.";
rsv[22] = "And the others came forth from the city against them; so they were in the midst of Israel, some on this side, and some on that side; and Israel smote them, until there was left none that survived or escaped.";
asv[22] = "And the others came forth out of the city against them; so they were in the midst of Israel, some on this side, and some on that side: and they smote them, so that they let none of them remain or escape.";
yng[22] = "and these have come out from the city to meet them, and they are in the midst of Israel, some on this side, and some on that, and they smite them till he hath not left to them a remnant and escaped one;";
dby[22] = "And the others went out of the city against them; so they were in the midst of Israel, some on this side, and some on that side; and they smote them, until they let none of them escape or flee away.";
web[22] = "And the other issued out of the city against them; so they were in the midst of Israel, some on this side, and some on that side: and they smote them, so that they let none of them remain or escape.";
hnv[22] = "The others came forth out of the city against them; so they were in the midst of Yisra\'el, some on this side, and some on that side: and they struck them, so that they let none of them remain or escape.";
vul[22] = "siquidem et illi qui ceperant et succenderant civitatem egressi ex urbe contra suos medios hostium ferire coeperunt cum ergo ex utraque parte adversarii caederentur ita ut nullus de tanta multitudine salvaretur";
kjv[23] = "And the king of Ai they took alive, and brought him to Joshua.";
rsv[23] = "But the king of Ai they took alive, and brought him to Joshua.";
asv[23] = "And the king of Ai they took alive, and brought him to Joshua.";
yng[23] = "and the king of Ai they caught alive, and bring him near unto Joshua.";
dby[23] = "And the king of Ai they took alive, and brought him to Joshua.";
web[23] = "And the king of Ai they took alive, and brought him to Joshua.";
hnv[23] = "The king of `Ai they took alive, and brought him to Yehoshua.";
vul[23] = "regem quoque urbis Ahi adprehendere viventem et obtulerunt Iosue";
kjv[24] = "And it came to pass, when Israel had made an end of slaying all the inhabitants of Ai in the field, in the wilderness wherein they chased them, and when they were all fallen on the edge of the sword, until they were consumed, that all the Israelites returned unto Ai, and smote it with the edge of the sword.";
rsv[24] = "When Israel had finished slaughtering all the inhabitants of Ai in the open wilderness where they pursued them and all of them to the very last had fallen by the edge of the sword, all Israel returned to Ai, and smote it with the edge of the sword.";
asv[24] = "And it came to pass, when Israel had made an end of slaying all the inhabitants of Ai in the field, in the wilderness wherein they pursued them, and they were all fallen by the edge of the sword, until they were consumed, that all Israel returned unto Ai, and smote it with the edge of the sword.";
yng[24] = "And it cometh to pass, at Israel\'s finishing to slay all the inhabitants of Ai in the field, in the wilderness in which they pursued them (and they fall all of them by the mouth of the sword till their consumption), that all Israel turn back to Ai, and smite it by the mouth of the sword;";
dby[24] = "And it came to pass when Israel had ended slaying all the inhabitants of Ai in the field, in the wilderness wherein they had chased them, and they had all fallen by the edge of the sword, until they were consumed, that all Israel returned to Ai, and smote it with the edge of the sword.";
web[24] = "And it came to pass when Israel had made an end of slaying all the inhabitants of Ai in the field, in the wilderness in which they chased them, and when they had all fallen on the edge of the sword, until they were consumed, that all the Israelites returned to Ai, and smote it with the edge of the sword.";
hnv[24] = "It happened, when Yisra\'el had made an end of killing all the inhabitants of `Ai in the field, in the wilderness in which they pursued them, and they were all fallen by the edge of the sword, until they were consumed, that all Yisra\'el returned to `Ai, and struck it with the edge of the sword.";
vul[24] = "igitur omnibus interfectis qui Israhelem ad deserta tendentem fuerant persecuti et in eodem loco gladio corruentibus reversi filii Israhel percusserunt civitatem";
kjv[25] = "And [so] it was, [that] all that fell that day, both of men and women, [were] twelve thousand, [even] all the men of Ai.";
rsv[25] = "And all who fell that day, both men and women, were twelve thousand, all the people of Ai.";
asv[25] = "And all that fell that day, both of men and women, were twelve thousand, even all the men of Ai.";
yng[25] = "and all who fall during the day, of men and of women, are twelve thousand -- all men of Ai.";
dby[25] = "And so it was, that all who fell that day, men as well as women, were twelve thousand, all the people of Ai.";
web[25] = "And [so] it was, [that] all that fell that day, both of men and women, [were] twelve thousand, [even] all the men of Ai.";
hnv[25] = "All that fell that day, both of men and women, were twelve thousand, even all the men of `Ai.";
vul[25] = "erant autem qui in eo die conciderant a viro usque ad mulierem duodecim milia hominum omnes urbis Ahi";
kjv[26] = "For Joshua drew not his hand back, wherewith he stretched out the spear, until he had utterly destroyed all the inhabitants of Ai.";
rsv[26] = "For Joshua did not draw back his hand, with which he stretched out the javelin, until he had utterly destroyed all the inhabitants of Ai.";
asv[26] = "For Joshua drew not back his hand, wherewith he stretched out the javelin, until he had utterly destroyed all the inhabitants of Ai.";
yng[26] = "And Joshua hath not brought back his hand which he stretched out with the javelin till that he hath devoted all the inhabitants of Ai;";
dby[26] = "And Joshua did not draw back his hand, which he had stretched out with the javelin, until they had utterly destroyed all the inhabitants of Ai.";
web[26] = "For Joshua drew not his hand back with which he stretched out the spear, until he had utterly destroyed all the inhabitants of Ai.";
hnv[26] = "For Yehoshua didn\'t draw back his hand, with which he stretched out the javelin, until he had utterly destroyed all the inhabitants of `Ai.";
vul[26] = "Iosue vero non contraxit manum quam in sublime porrexerat tenens clypeum donec interficerentur omnes habitatores Ahi";
kjv[27] = "Only the cattle and the spoil of that city Israel took for a prey unto themselves, according unto the word of the LORD which he commanded Joshua.";
rsv[27] = "Only the cattle and the spoil of that city Israel took as their booty, according to the word of the LORD which he commanded Joshua.";
asv[27] = "Only the cattle and the spoil of that city Israel took for prey unto themselves, according unto the word of Jehovah which he commanded Joshua.";
yng[27] = "only, the cattle and the spoil of that city have Israel spoiled for themselves, according to the word of Jehovah which He commanded Joshua.";
dby[27] = "Only, the cattle and the spoil of the city Israel took as prey to themselves, according to the word of Jehovah which he had commanded Joshua.";
web[27] = "Only the cattle and the spoil of that city Israel took for a prey to themselves, according to the word of the LORD which he commanded Joshua.";
hnv[27] = "Only the cattle and the spoil of that city Yisra\'el took for prey to themselves, according to the word of the LORD which he commanded Yehoshua.";
vul[27] = "iumenta autem et praedam civitatis diviserunt sibi filii Israhel sicut praeceperat Dominus Iosue";
kjv[28] = "And Joshua burnt Ai, and made it an heap for ever, [even] a desolation unto this day.";
rsv[28] = "So Joshua burned Ai, and made it for ever a heap of ruins, as it is to this day.";
asv[28] = "So Joshua burnt Ai, and made it a heap for ever, even a desolation, unto this day.";
yng[28] = "And Joshua burneth Ai, and maketh it a heap age-during -- a desolation unto this day;";
dby[28] = "And Joshua burned Ai, and made it an everlasting heap of desolation to this day.";
web[28] = "And Joshua burnt Ai, and made it a heap for ever, [even] a desolation to this day.";
hnv[28] = "So Yehoshua burnt `Ai, and made it a heap forever, even a desolation, to this day.";
vul[28] = "qui succendit urbem et fecit eam tumulum sempiternum";
kjv[29] = "And the king of Ai he hanged on a tree until eventide: and as soon as the sun was down, Joshua commanded that they should take his carcase down from the tree, and cast it at the entering of the gate of the city, and raise thereon a great heap of stones, [that remaineth] unto this day.";
rsv[29] = "And he hanged the king of Ai on a tree until evening; and at the going down of the sun Joshua commanded, and they took his body down from the tree, and cast it at the entrance of the gate of the city, and raised over it a great heap of stones, which stands there to this day.";
asv[29] = "And the king of Ai he hanged on a tree until the eventide: and at the going down of the sun Joshua commanded, and they took his body down from the tree, and cast it at the entrance of the gate of the city, and raised thereon a great heap of stones, unto this day.";
yng[29] = "and the king of Ai he hath hanged on the tree till even-time, and at the going in of the sun hath Joshua commanded, and they take down his carcase from the tree, and cast it unto the opening of the gate of the city, and raise over it a great heap of stones till this day.";
dby[29] = "And the king of Ai he hanged on a tree until the evening; and at the going down of the sun Joshua commanded, and they took his carcase down from the tree, and threw it down at the entrance of the gate of the city, and raised upon it a great heap of stones, [which remains] to this day.";
web[29] = "And the king of Ai he hanged on a tree until evening: and as soon as the sun was down, Joshua commanded that they should take his carcass down from the tree, and cast it at the entering of the gate of the city, and raise upon it a great heap of stones, [that remaineth] to this day.";
hnv[29] = "The king of `Ai he hanged on a tree until the evening: and at the going down of the sun Yehoshua commanded, and they took his body down from the tree, and cast it at the entrance of the gate of the city, and raised thereon a great heap of stones, to this day.";
vul[29] = "regem quoque eius suspendit in patibulo usque ad vesperum et solis occasum praecepitque et deposuerunt cadaver eius de cruce proieceruntque in ipso introitu civitatis congesto super eum magno acervo lapidum qui permanet usque in praesentem diem";
kjv[30] = "Then Joshua built an altar unto the LORD God of Israel in mount Ebal,";
rsv[30] = "Then Joshua built an altar in Mount Ebal to the LORD, the God of Israel,";
asv[30] = "Then Joshua built an altar unto Jehovah, the God of Israel, in mount Ebal,";
yng[30] = "Then doth Joshua build an altar to Jehovah, God of Israel, in mount Ebal,";
dby[30] = "Then Joshua built an altar to Jehovah the God of Israel, in mount Ebal,";
web[30] = "Then Joshua built an altar to the LORD God of Israel in mount Ebal,";
hnv[30] = " Then Yehoshua built an altar to the LORD, the God of Yisra\'el, in Mount `Eval,";
vul[30] = "tunc aedificavit Iosue altare Domino Deo Israhel in monte Hebal";
kjv[31] = "As Moses the servant of the LORD commanded the children of Israel, as it is written in the book of the law of Moses, an altar of whole stones, over which no man hath lift up [any] iron: and they offered thereon burnt offerings unto the LORD, and sacrificed peace offerings.";
rsv[31] = "as Moses the servant of the LORD had commanded the people of Israel, as it is written in the book of the law of Moses, &quot;an altar of unhewn stones, upon which no man has lifted an iron tool&quot;; and they offered on it burnt offerings to the LORD, and sacrificed peace offerings.";
asv[31] = "as Moses the servant of Jehovah commanded the children of Israel, as it is written in the book of the law of Moses, an altar of unhewn stones, upon which no man had lifted up any iron: and they offered thereon burnt-offerings unto Jehovah, and sacrificed peace-offerings.";
yng[31] = "as Moses, servant of Jehovah, commanded the sons of Israel, as it is written in the book of the law of Moses -- an altar of whole stones, over which he hath not waved iron -- and they cause to go up upon it burnt-offerings to Jehovah, and sacrifice peace-offerings;";
dby[31] = "as Moses the servant of Jehovah had commanded the children of Israel, as it is written in the book of the law of Moses, an altar of whole stones, over which iron had not been lifted up. And they offered up burnt-offerings on it to Jehovah, and sacrificed peace-offerings.";
web[31] = "As Moses the servant of the LORD commanded the children of Israel, as it is written in the book of the law of Moses, an altar of whole stones, over which no man hath lifted up [any] iron: and they offered upon it burnt-offerings to the LORD, and sacrificed peace-offerings.";
hnv[31] = "as Moshe the servant of the LORD commanded the children of Yisra\'el, as it is written in the book of the law of Moshe, an altar of uncut stones, on which no man had lifted up any iron: and they offered thereon burnt offerings to the LORD, and sacrificed peace-offerings.";
vul[31] = "sicut praeceperat Moses famulus Domini filiis Israhel et scriptum est in volumine legis Mosi altare de lapidibus inpolitis quos ferrum non tetigit et obtulit super eo holocausta Domino immolavitque pacificas victimas";
kjv[32] = "And he wrote there upon the stones a copy of the law of Moses, which he wrote in the presence of the children of Israel.";
rsv[32] = "And there, in the presence of the people of Israel, he wrote upon the stones a copy of the law of Moses, which he had written.";
asv[32] = "And he wrote there upon the stones a copy of the law of Moses, which he wrote, in the presence of the children of Israel.";
yng[32] = "and he writeth there on the stones the copy of the law of Moses, which he hath written in the presence of the sons of Israel.";
dby[32] = "And he wrote there on the stones a copy of the law of Moses, which he had written before the children of Israel.";
web[32] = "And he wrote there upon the stones a copy of the law of Moses, which he wrote in the presence of the children of Israel.";
hnv[32] = "He wrote there on the stones a copy of the law of Moshe, which he wrote, in the presence of the children of Yisra\'el.";
vul[32] = "et scripsit super lapides deuteronomium legis Mosi quod ille digesserat coram filiis Israhel";
kjv[33] = "And all Israel, and their elders, and officers, and their judges, stood on this side the ark and on that side before the priests the Levites, which bare the ark of the covenant of the LORD, as well the stranger, as he that was born among them; half of them over against mount Gerizim, and half of them over against mount Ebal; as Moses the servant of the LORD had commanded before, that they should bless the people of Israel.";
rsv[33] = "And all Israel, sojourner as well as homeborn, with their elders and officers and their judges, stood on opposite sides of the ark before the Levitical priests who carried the ark of the covenant of the LORD, half of them in front of Mount Ger\'izim and half of them in front of Mount Ebal, as Moses the servant of the LORD had commanded at the first, that they should bless the people of Israel.";
asv[33] = "And all Israel, and their elders and officers, and their judges, stood on this side of the ark and on that side before the priests the Levites, that bare the ark of the covenant of Jehovah, as well the sojourner as the homeborn; half of them in front of mount Gerizim, and half of them in front of mount Ebal; as Moses the servant of Jehovah had commanded at the first, that they should bless the people of Israel.";
yng[33] = "And all Israel, and its elders, and authorities, and its judges, are standing on this side and on that of the ark, over-against the priests, the Levites, bearing the ark of the covenant of Jehovah, as well the sojourner as the native, half of them over-against mount Gerizim, and the half of them over-against mount Ebal, as Moses servant of Jehovah commanded to bless the people of Israel at the first.";
dby[33] = "And all Israel, and their elders, and their officers and judges, stood on this side and on that side of the ark before the priests the Levites, who bore the ark of the covenant of Jehovah, as well the stranger as the home-born [Israelite]; half of them toward mount Gerizim, and the other half of them toward mount Ebal; as Moses the servant of Jehovah had commanded, that they should bless the people of Israel, in the beginning.";
web[33] = "And all Israel, and their elders, and officers, and their judges, stood on this side of the ark, and on that side, before the priests the Levites, who bore the ark of the covenant of the LORD, as well the stranger, as he that was born among them; half of them over against mount Gerizim, and half of them over against mount Ebal; as Moses the servant of the LORD had commanded before, that they should bless the people of Israel.";
hnv[33] = "All Yisra\'el, and their Zakenim and officers, and their judges, stood on this side of the ark and on that side before the Kohanim the Levites, who bore the ark of the covenant of the LORD, as well the foreigner as the native; half of them in front of Mount Gerizim, and half of them in front of Mount `Eval; as Moshe the servant of the LORD had commanded at the first, that they should bless the people of Yisra\'el.";
vul[33] = "omnis autem populus et maiores natu ducesque ac iudices stabant ex utraque parte arcae in conspectu sacerdotum qui portabant arcam foederis Domini ut advena ita et indigena media eorum pars iuxta montem Garizim et media iuxta montem Hebal sicut praeceperat Moses famulus Domini et primum quidem benedixit populo Israhel";
kjv[34] = "And afterward he read all the words of the law, the blessings and cursings, according to all that is written in the book of the law.";
rsv[34] = "And afterward he read all the words of the law, the blessing and the curse, according to all that is written in the book of the law.";
asv[34] = "And afterward he read all the words of the law, the blessing and the curse, according to all that is written in the book of the law.";
yng[34] = "And afterwards he hath proclaimed all the words of the law, the blessing and the reviling, according to all that is written in the book of the law;";
dby[34] = "And afterwards he read all the words of the law, the blessing and the curse, according to all that is written in the book of the law.";
web[34] = "And afterward he read all the words of the law, the blessings and cursings, according to all that is written in the book of the law.";
hnv[34] = "Afterward he read all the words of the law, the blessing and the curse, according to all that is written in the book of the law.";
vul[34] = "post haec legit omnia verba benedictionis et maledictionis et cuncta quae scripta erant in legis volumine";
kjv[35] = "There was not a word of all that Moses commanded, which Joshua read not before all the congregation of Israel, with the women, and the little ones, and the strangers that were conversant among them.";
rsv[35] = "There was not a word of all that Moses commanded which Joshua did not read before all the assembly of Israel, and the women, and the little ones, and the sojourners who lived among them.";
asv[35] = "There was not a word of all that Moses commanded, which Joshua read not before all the assembly of Israel, and the women, and the little ones, and the sojourners that were among them.";
yng[35] = "there hath not been a thing of all that Moses commanded which Joshua hath not proclaimed before all the assembly of Israel, and the women, and the infants, and the sojourner who is going in their midst.";
dby[35] = "There was not a word of all that Moses had commanded which Joshua read not before the whole congregation of Israel, and the women, and the children, and the strangers that lived among them.";
web[35] = "There was not a word of all that Moses commanded, which Joshua read not before all the congregation of Israel, with the women, and the little ones, and the strangers that were conversant among them.";
hnv[35] = "There was not a word of all that Moshe commanded, which Yehoshua didn\'t read before all the assembly of Yisra\'el, and the women, and the little ones, and the foreigners who were among them.";
vul[35] = "nihil ex his quae Moses iusserat reliquit intactum sed universa replicavit coram omni multitudine Israhel mulieribus ac parvulis et advenis qui inter eos morabantur";
