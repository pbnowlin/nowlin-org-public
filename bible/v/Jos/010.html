csb[1] = "Now King Adoni-zedek of Jerusalem heard that Joshua had captured Ai and completely destroyed it, treating Ai and its king as he had Jericho and its king, and that the inhabitants of Gibeon had made peace with Israel and were living among them.";
csb[2] = "So Adoni-zedek and his people were greatly alarmed because Gibeon was a large city like one of the royal cities; it was larger than Ai, and all its men were warriors.";
csb[3] = "Therefore King Adoni-zedek of Jerusalem sent word to King Hoham of Hebron, King Piram of Jarmuth, King Japhia of Lachish, and King Debir of Eglon, saying,";
csb[4] = "&quot;Come up and help me. We will attack Gibeon, because they have made peace with Joshua and the Israelites.&quot;";
csb[5] = "So the five Amorite kings -- the kings of Jerusalem, Hebron, Jarmuth, Lachish, and Eglon -- joined forces, advanced with all their armies, besieged Gibeon, and fought against it.";
csb[6] = "Then the men of Gibeon sent word to Joshua in the camp at Gilgal: &quot;Don\'t give up on your servants. Come quickly and save us! Help us, for all the Amorite kings living in the hill country have joined forces against us.&quot;";
csb[7] = "So Joshua and all his troops, including all his best soldiers, came from Gilgal.";
csb[8] = "The LORD said to Joshua, &quot;Do not be afraid of them, for I have handed them over to you. Not one of them will be able to stand against you.&quot;";
csb[9] = "So Joshua caught them by surprise, after marching all night from Gilgal.";
csb[10] = "The LORD threw them into confusion before Israel. He defeated them in a great slaughter at Gibeon, chased them through the ascent of Beth-horon, and struck them down as far as Azekah and Makkedah.";
csb[11] = "As they fled before Israel, the LORD threw large hailstones on them from the sky along the descent of Beth-horon all the way to Azekah, and they died. More of them died from the hail than the Israelites killed with the sword.";
csb[12] = "On the day the LORD gave the Amorites over to the Israelites, Joshua spoke to the LORD in the presence of Israel: &quot;Sun, stand still over Gibeon, and moon, over the Valley of Aijalon.&quot;";
csb[13] = "And the sun stood still and the moon stopped until the nation took vengeance on its enemies. Isn\'t this written in the Book of Jashar? So the sun stopped in the middle of the sky and delayed its setting almost a full day.";
csb[14] = "There has been no day like it before or since, when the LORD listened to a man, because the LORD fought for Israel.";
csb[15] = "Then Joshua and all Israel with him returned to the camp at Gilgal.";
csb[16] = "Now the five defeated kings had fled and hidden in the cave at Makkedah.";
csb[17] = "It was reported to Joshua: &quot;The five kings have been found; they are hiding in the cave at Makkedah.&quot;";
csb[18] = "Joshua said, &quot;Roll large stones against the mouth of the cave, and station men by it to guard the kings.";
csb[19] = "&quot;But as for the rest of you, don\'t stay there. Pursue your enemies and attack them from behind. Don\'t let them enter their cities, for the LORD your God has handed them over to you.&quot;";
csb[20] = "So Joshua and the Israelites finished inflicting a terrible slaughter on them until they were destroyed, although a few survivors ran away to the fortified cities.";
csb[21] = "The people returned safely to Joshua in the camp at Makkedah. And no one dared to threaten the Israelites.";
csb[22] = "Then Joshua said, &quot;Open the mouth of the cave, and bring those five kings to me out of there.&quot;";
csb[23] = "That is what they did. They brought the five kings of Jerusalem, Hebron, Jarmuth, Lachish, and Eglon to Joshua out of the cave.";
csb[24] = "When they had brought the kings to him, Joshua summoned all the men of Israel and said to the military commanders who had accompanied him, &quot;Come here and put your feet on the necks of these kings.&quot; So the commanders came forward and put their feet on their necks.";
csb[25] = "Joshua said to them, &quot;Do not be afraid or discouraged. Be strong and courageous, for the LORD will do this to all the enemies you fight.&quot;";
csb[26] = "After this, Joshua struck them down and executed them. He hung their bodies on five trees and they were there until evening.";
csb[27] = "At sunset Joshua commanded that they be taken down from the trees and thrown into the cave where they had hidden. Then large stones were placed against the mouth of the cave, and the stones are still there today.";
csb[28] = "On that day Joshua captured Makkedah and struck it down with the sword, including its king. He completely destroyed it and everyone in it, leaving no survivors. So he treated the king of Makkedah as he had the king of Jericho.";
csb[29] = "Joshua and all Israel with him crossed from Makkedah to Libnah and fought against Libnah.";
csb[30] = "The LORD also handed it and its king over to Israel. He struck it down, putting everyone in it to the sword, and left no survivors in it. He treated Libnah\'s king as he had the king of Jericho.";
csb[31] = "From Libnah, Joshua and all Israel with him crossed to Lachish. They laid siege to it and attacked it.";
csb[32] = "The LORD handed Lachish over to Israel, and Joshua captured it on the second day. He struck it down, putting everyone in it to the sword, just as he had done to Libnah.";
csb[33] = "At that time King Horam of Gezer went to help Lachish, but Joshua struck him down along with his people, leaving no survivors.";
csb[34] = "Then Joshua crossed from Lachish to Eglon and all Israel with him. They laid siege to it and attacked it.";
csb[35] = "On that day they captured it and struck it down, putting everyone in it to the sword. He completely destroyed it that day, just as he had done to Lachish.";
csb[36] = "Next, Joshua and all Israel with him went up from Eglon to Hebron and attacked it.";
csb[37] = "They captured it and struck down its king, all its villages, and everyone in it with the sword. He left no survivors, just as he had done at Eglon. He completely destroyed Hebron and everyone in it.";
csb[38] = "Finally, Joshua turned toward Debir and attacked it. And all Israel was with him.";
csb[39] = "He captured it -- its king and all its villages. They struck them down with the sword and completely destroyed everyone in it, leaving no survivors. He treated Debir and its king as he had treated Hebron and as he had treated Libnah and its king.";
csb[40] = "So Joshua conquered the whole region -- the hill country, the Negev, the Judean foothills, and the slopes -- with all their kings, leaving no survivors. He completely destroyed every living being, as the LORD, the God of Israel, had commanded.";
csb[41] = "Joshua conquered everyone from Kadesh-barnea to Gaza, and all the land of Goshen as far as Gibeon.";
csb[42] = "Joshua captured all these kings and their land in one campaign, because the LORD, the God of Israel, fought for Israel.";
csb[43] = "Then Joshua returned with all Israel to the camp at Gilgal.";
kjv[1] = "Now it came to pass, when Adonizedek king of Jerusalem had heard how Joshua had taken Ai, and had utterly destroyed it; as he had done to Jericho and her king, so he had done to Ai and her king; and how the inhabitants of Gibeon had made peace with Israel, and were among them;";
rsv[1] = "When Ado\'ni-ze\'dek king of Jerusalem heard how Joshua had taken Ai, and had utterly destroyed it, doing to Ai and its king as he had done to Jericho and its king, and how the inhabitants of Gibeon had made peace with Israel and were among them,";
asv[1] = "Now it came to pass, when Adoni-zedek king of Jerusalem heard how Joshua had taken Ai, and had utterly destroyed it (as he had done to Jericho and her king, so he had done to Ai and her king), and how the inhabitants of Gibeon had made peace with Israel, and were among them;";
yng[1] = "And it cometh to pass, when Adoni-Zedek king of Jerusalem heareth that Joshua hath captured Ai, and doth devote it (as he had done to Jericho and to her king so he hath done to Ai and to her king), and that the inhabitants of Gibeon have made peace with Israel, and are in their midst, --";
dby[1] = "And it came to pass when Adoni-zedek king of Jerusalem heard that Joshua had taken Ai and had utterly destroyed it, that he had done to Ai and its king as he had done to Jericho and its king, and that the inhabitants of Gibeon had made peace with Israel, and were among them,";
web[1] = "Now it came to pass, when Adoni-zedec king of Jerusalem had heard how Joshua had taken Ai, and had utterly destroyed it; as he had done to Jericho and her king, so he had done to Ai and her king; and how the inhabitants of Gibeon had made peace with Israel, and were among them;";
hnv[1] = "Now it happened, when Adoni-Tzedek king of Yerushalayim heard how Yehoshua had taken `Ai, and had utterly destroyed it; as he had done to Yericho and her king, so he had done to `Ai and her king; and how the inhabitants of Giv`on had made shalom with Yisra\'el, and were among them;";
vul[1] = "quae cum audisset Adonisedec rex Hierusalem quod scilicet cepisset Iosue Ahi et subvertisset eam sicut enim fecerat Hiericho et regi eius sic fecit Ahi et regi illius et quod transfugissent Gabaonitae ad Israhel et essent foederati eorum";
kjv[2] = "That they feared greatly, because Gibeon [was] a great city, as one of the royal cities, and because it [was] greater than Ai, and all the men thereof [were] mighty.";
rsv[2] = "he feared greatly, because Gibeon was a great city, like one of the royal cities, and because it was greater than Ai, and all its men were mighty.";
asv[2] = "that they feared greatly, because Gibeon was a great city, as one of the royal cities, and because it was greater than Ai, and all the men thereof were mighty.";
yng[2] = "that they are greatly afraid, because Gibeon [is] a great city, as one of the royal cities, and because it [is] greater than Ai, and all its men -- heroes.";
dby[2] = "that they feared greatly; for Gibeon was a great city, as one of the royal cities, and it was greater than Ai, and all its men were mighty.";
web[2] = "That they feared greatly, because Gibeon [was] a great city, as one of the royal cities, and because it [was] greater than Ai, and all the men of it [were] mighty.";
hnv[2] = "that they feared greatly, because Giv`on was a great city, as one of the royal cities, and because it was greater than `Ai, and all the men of it were mighty.";
vul[2] = "timuit valde urbs enim magna erat Gabaon et una regalium civitatum et maior oppido Ahi omnesque bellatores eius fortissimi";

hnv[3] = "Therefore Adoni-Tzedek king of Yerushalayim sent to Hoham king of Hevron, and to Pir\'am king of Yarmut, and to Yafia king of Lakhish, and to Devir king of `Eglon, saying,";
vul[3] = "misit ergo Adonisedec rex Hierusalem ad Oham regem Hebron et ad Pharam regem Hieremoth ad Iaphie quoque regem Lachis et ad Dabir regem Eglon dicens";
kjv[4] = "Come up unto me, and help me, that we may smite Gibeon: for it hath made peace with Joshua and with the children of Israel.";
rsv[4] = "&quot;Come up to me, and help me, and let us smite Gibeon; for it has made peace with Joshua and with the people of Israel.&quot;";
asv[4] = "Come up unto me, and help me, and let us smite Gibeon; for it hath made peace with Joshua and with the children of Israel.";
yng[4] = "`Come up unto me, and help me, and we smite Gibeon, for it hath made peace with Joshua, and with the sons of Israel.\'";
dby[4] = "Come up to me, and help me, that we may smite Gibeon; for it has made peace with Joshua and with the children of Israel.";
web[4] = "Come up to me, and help me, that we may smite Gibeon: for it hath made peace with Joshua and with the children of Israel.";
hnv[4] = "Come up to me, and help me, and let us strike Giv`on; for it has made shalom with Yehoshua and with the children of Yisra\'el.";
vul[4] = "ascendite ad me et ferte praesidium ut expugnemus Gabaon quare transfugerit ad Iosue et filios Israhel";
kjv[5] = "Therefore the five kings of the Amorites, the king of Jerusalem, the king of Hebron, the king of Jarmuth, the king of Lachish, the king of Eglon, gathered themselves together, and went up, they and all their hosts, and encamped before Gibeon, and made war against it.";
rsv[5] = "Then the five kings of the Amorites, the king of Jerusalem, the king of Hebron, the king of Jarmuth, the king of Lachish, and the king of Eglon, gathered their forces, and went up with all their armies and encamped against Gibeon, and made war against it.";
asv[5] = "Therefore the five kings of the Amorites, the king of Jerusalem, the king of Hebron, the king of Jarmuth, the king of Lachish, the king of Eglon, gathered themselves together, and went up, they and all their hosts, and encamped against Gibeon, and made war against it.";
yng[5] = "And five kings of the Amorite (the king of Jerusalem, the king of Hebron, the king of Jarmuth, the king of Lachish, the king of Eglon) are gathered together, and go up, they and all their camps, and encamp against Gibeon, and fight against it.";
dby[5] = "And the five kings of the Amorites, the king of Jerusalem, the king of Hebron, the king of Jarmuth, the king of Lachish, [and] the king of Eglon, gathered themselves together, and went up, they and all their armies, and they encamped before Gibeon, and made war against it.";
web[5] = "Therefore the five kings of the Amorites, the king of Jerusalem, the king of Hebron, the king of Jarmuth, the king of Lachish, the king of Eglon, assembled themselves, and went up, they and all their hosts, and encamped before Gibeon, and made war against it.";
hnv[5] = "Therefore the five kings of the Amori, the king of Yerushalayim, the king of Hevron, the king of Yarmut, the king of Lakhish, the king of `Eglon, gathered themselves together, and went up, they and all their hosts, and encamped against Giv`on, and made war against it.";
vul[5] = "congregati igitur ascenderunt quinque reges Amorreorum rex Hierusalem rex Hebron rex Hieremoth rex Lachis rex Eglon simul cum exercitibus suis et castrametati sunt circa Gabaon obpugnantes eam";
kjv[6] = "And the men of Gibeon sent unto Joshua to the camp to Gilgal, saying, Slack not thy hand from thy servants; come up to us quickly, and save us, and help us: for all the kings of the Amorites that dwell in the mountains are gathered together against us.";
rsv[6] = "And the men of Gibeon sent to Joshua at the camp in Gilgal, saying, &quot;Do not relax your hand from your servants; come up to us quickly, and save us, and help us; for all the kings of the Amorites that dwell in the hill country are gathered against us.&quot;";
asv[6] = "And the men of Gibeon sent unto Joshua to the camp to Gilgal, saying, Slack not thy hand from thy servants; come up to us quickly, and save us, and help us: for all the kings of the Amorites that dwell in the hill-country are gathered together against us.";
yng[6] = "And the men of Gibeon send unto Joshua, unto the camp at Gilgal, saying, `Let not thy hand cease from thy servants; come up unto us [with] haste, and give safety to us, and help us; for all the kings of the Amorite, dwelling in the hill-country, have been assembled against us.\'";
dby[6] = "And the men of Gibeon sent to Joshua, to the camp at Gilgal, saying, Withdraw not thy hand from thy servants: come up to us quickly, and save us and help us; for all the kings of the Amorites that dwell in the hill-country are gathered against us.";
web[6] = "And the men of Gibeon sent to Joshua to the camp at Gilgal, saying, Slack not thy hand from thy servants; come up to us quickly, and save us, and help us: for all the kings of the Amorites that dwell in the mountains, are assembled against us.";
hnv[6] = "The men of Giv`on sent to Yehoshua to the camp to Gilgal, saying, Don\'t slack your hand from your servants; come up to us quickly, and save us, and help us: for all the kings of the Amori that dwell in the hill-country are gathered together against us.";
vul[6] = "habitatores autem Gabaon urbis obsessae miserunt ad Iosue qui tunc morabatur in castris apud Galgalam et dixerunt ei ne retrahas manus tuas ab auxilio servorum tuorum ascende cito et libera nos ferque praesidium convenerunt enim adversum nos omnes reges Amorreorum qui habitant in montanis";
kjv[7] = "So Joshua ascended from Gilgal, he, and all the people of war with him, and all the mighty men of valour.";
rsv[7] = "So Joshua went up from Gilgal, he and all the people of war with him, and all the mighty men of valor.";
asv[7] = "So Joshua went up from Gilgal, he, and all the people of war with him, and all the mighty men of valor.";
yng[7] = "And Joshua goeth up from Gilgal, he, and all the people of war with him, even all the mighty men of valour.";
dby[7] = "So Joshua went up from Gilgal, he and all the people of war with him, even all the valiant men.";
web[7] = "So Joshua ascended from Gilgal, he, and all the people of war with him, and all the mighty men of valor.";
hnv[7] = "So Yehoshua went up from Gilgal, he, and all the people of war with him, and all the mighty men of valor.";
vul[7] = "ascenditque Iosue de Galgalis et omnis exercitus bellatorum cum eo viri fortissimi";
kjv[8] = "And the LORD said unto Joshua, Fear them not: for I have delivered them into thine hand; there shall not a man of them stand before thee.";
rsv[8] = "And the LORD said to Joshua, &quot;Do not fear them, for I have given them into your hands; there shall not a man of them stand before you.&quot;";
asv[8] = "And Jehovah said unto Joshua, Fear them not: for I have delivered them into thy hands; there shall not a man of them stand before thee.";
yng[8] = "And Jehovah saith unto Joshua, `Be not afraid of them, for into thy hand I have given them, there doth not stand a man of them in thy presence.\'";
dby[8] = "And Jehovah said to Joshua, Fear them not; for into thy hand have I given them: not a man of them shall stand before thee.";
web[8] = "And the LORD said to Joshua, Fear them not: for I have delivered them into thy hand; there shall not a man of them stand before thee.";
hnv[8] = "The LORD said to Yehoshua, Don\'t fear them: for I have delivered them into your hands; there shall not a man of them stand before you.";
vul[8] = "dixitque Dominus ad Iosue ne timeas eos in manus enim tuas tradidi illos nullus tibi ex eis resistere poterit";
kjv[9] = "Joshua therefore came unto them suddenly, [and] went up from Gilgal all night.";
rsv[9] = "So Joshua came upon them suddenly, having marched up all night from Gilgal.";
asv[9] = "Joshua therefore came upon them suddenly; [for] he went up from Gilgal all the night.";
yng[9] = "And Joshua cometh in unto them suddenly (all the night he hath gone up from Gilgal),";
dby[9] = "And Joshua came upon them suddenly; he went up from Gilgal all night.";
web[9] = "Joshua therefore came to them suddenly, [and] went up from Gilgal all night.";
hnv[9] = "Yehoshua therefore came on them suddenly; [for] he went up from Gilgal all the night.";
vul[9] = "inruit itaque Iosue super eos repente tota ascendens nocte de Galgalis";
kjv[10] = "And the LORD discomfited them before Israel, and slew them with a great slaughter at Gibeon, and chased them along the way that goeth up to Bethhoron, and smote them to Azekah, and unto Makkedah.";
rsv[10] = "And the LORD threw them into a panic before Israel, who slew them with a great slaughter at Gibeon, and chased them by the way of the ascent of Beth-hor\'on, and smote them as far as Aze\'kah and Makke\'dah.";
asv[10] = "And Jehovah discomfited them before Israel, and he slew them with a great slaughter at Gibeon, and chased them by the way of the ascent of Beth-horon, and smote them to Azekah, and unto Makkedah.";
yng[10] = "and Jehovah doth crush them before Israel, and it smiteth them -- a great smiting -- at Gibeon, and pursueth them the way of the ascent of Beth-Horon, and smiteth them unto Azekah, and unto Makkedah.";
dby[10] = "And Jehovah discomfited them before Israel, and smote them [with] a great slaughter at Gibeon; and he chased them on the way of the ascent of Beth-horon, and smote them up to Azekah and Makkedah.";
web[10] = "And the LORD discomfited them before Israel, and slew them with a great slaughter at Gibeon, and chased them along the way that goeth up to Beth-horon, and smote them to Azekah, and to Makkedah.";
hnv[10] = "The LORD confused them before Yisra\'el, and he killed them with a great slaughter at Giv`on, and chased them by the way of the ascent of Beit-Horon, and struck them to `Azeka, and to Makkedah.";
vul[10] = "et conturbavit eos Dominus a facie Israhel contrivitque plaga magna in Gabaon ac persecutus est per viam ascensus Bethoron et percussit usque Azeca et Maceda";
kjv[11] = "And it came to pass, as they fled from before Israel, [and] were in the going down to Bethhoron, that the LORD cast down great stones from heaven upon them unto Azekah, and they died: [they were] more which died with hailstones than [they] whom the children of Israel slew with the sword.";
rsv[11] = "And as they fled before Israel, while they were going down the ascent of Beth-hor\'on, the LORD threw down great stones from heaven upon them as far as Aze\'kah, and they died; there were more who died because of the hailstones than the men of Israel killed with the sword.";
asv[11] = "And it came to pass, as they fled from before Israel, while they were at the descent of Beth-horon, that Jehovah cast down great stones from heaven upon them unto Azekah, and they died: they were more who died with the hailstones than they whom the children of Israel slew with the sword.";
yng[11] = "And it cometh to pass, in their fleeing from the face of Israel -- they [are] in the descent of Beth-Horon -- and Jehovah hath cast upon them great stones out of the heavens, unto Azekah, and they die; more are they who have died by the hailstones than they whom the sons of Israel have slain by the sword.";
dby[11] = "And it came to pass, as they fled from before Israel, -- they were at the descent of Beth-horon, -- that Jehovah cast down great stones from heaven upon them up to Azekah, and they died. They were more who died with the hailstones than they whom the children of Israel had slain with the sword.";
web[11] = "And it came to pass as they fled from before Israel, [and] were in the descent to Beth-horon, that the LORD cast down great stones from heaven upon them to Azekah, and they died: [they were] more who died with hailstones than [they] whom the children of Israel slew with the sword.";
hnv[11] = "It happened, as they fled from before Yisra\'el, while they were at the descent of Beit-Horon, that the LORD cast down great stones from the sky on them to `Azeka, and they died: they were more who died with the hailstones than they whom the children of Yisra\'el killed with the sword.";
vul[11] = "cumque fugerent filios Israhel et essent in descensu Bethoron Dominus misit super eos lapides magnos de caelo usque Azeca et mortui sunt multo plures lapidibus grandinis quam quos gladio percusserant filii Israhel";
kjv[12] = "Then spake Joshua to the LORD in the day when the LORD delivered up the Amorites before the children of Israel, and he said in the sight of Israel, Sun, stand thou still upon Gibeon; and thou, Moon, in the valley of Ajalon.";
rsv[12] = "Then spoke Joshua to the LORD in the day when the LORD gave the Amorites over to the men of Israel; and he said in the sight of Israel, &quot;Sun, stand thou still at Gibeon, and thou Moon in the valley of Ai\'jalon.&quot;";
asv[12] = "Then spake Joshua to Jehovah in the day when Jehovah delivered up the Amorites before the children of Israel; and he said in the sight of Israel, Sun, stand thou still upon Gibeon; And thou, Moon, in the valley of Aijalon. ";
yng[12] = "Then speaketh Joshua to Jehovah in the day of Jehovah\'s giving up the Amorites before the sons of Israel, and he saith, before the eyes of Israel, `Sun -- in Gibeon stand still; and moon -- in the valley of Ajalon;\'";
dby[12] = "Then spoke Joshua to Jehovah in the day when Jehovah gave up the Amorites before the children of Israel, and he said in the sight of Israel, Sun, stand still upon Gibeon; And thou, moon, in the valley of Ajalon!";
web[12] = "Then spoke Joshua to the LORD in the day when the LORD delivered up the Amorites before the children of Israel, and he said in the sight of Israel, Sun, stand thou still upon Gibeon, and thou Moon, in the valley of Ajalon.";
hnv[12] = "Then spoke Yehoshua to the LORD in the day when the LORD delivered up the Amori before the children of Yisra\'el; and he said in the sight of Yisra\'el, Sun, stand you still on Giv`on; You, Moon, in the valley of Ayalon.";
vul[12] = "tunc locutus est Iosue Domino in die qua tradidit Amorreum in conspectu filiorum Israhel dixitque coram eis sol contra Gabaon ne movearis et luna contra vallem Ahialon";
kjv[13] = "And the sun stood still, and the moon stayed, until the people had avenged themselves upon their enemies. [Is] not this written in the book of Jasher? So the sun stood still in the midst of heaven, and hasted not to go down about a whole day.";
rsv[13] = "And the sun stood still, and the moon stayed, until the nation took vengeance on their enemies. Is this not written in the Book of Jashar? The sun stayed in the midst of heaven, and did not hasten to go down for about a whole day.";
asv[13] = "And the sun stood still, and the moon stayed, Until the nation had avenged themselves of their enemies. Is not this written in the book of Jashar? And the sun stayed in the midst of heaven, and hasted not to go down about a whole day.";
yng[13] = "and the sun standeth still, and the moon hath stood -- till the nation taketh vengeance [on] its enemies; is it not written on the Book of the Upright, `and the sun standeth in the midst of the heavens, and hath not hasted to go in -- as a perfect day?\'";
dby[13] = "And the sun stood still, and the moon remained where it was, until the nation had avenged themselves upon their enemies. Is not this written in the book of Jasher? And the sun remained standing in the midst of heaven, and hasted not to go down about a full day.";
web[13] = "And the sun stood still, and the moon stayed, until the people had avenged themselves upon their enemies. [Is] not this written in the book of Jasher? So the sun stood still in the midst of heaven, and hasted not to go down about a whole day.";
hnv[13] = "The sun stood still, and the moon stayed, Until the nation had avenged themselves of their enemies. Isn\'t this written in the book of Yashar? The sun stayed in the midst of the sky, and didn\'t hurry to go down about a whole day.";
vul[13] = "steteruntque sol et luna donec ulcisceretur se gens de inimicis suis nonne scriptum est hoc in libro Iustorum stetit itaque sol in medio caeli et non festinavit occumbere spatio unius diei";
kjv[14] = "And there was no day like that before it or after it, that the LORD hearkened unto the voice of a man: for the LORD fought for Israel.";
rsv[14] = "There has been no day like it before or since, when the LORD hearkened to the voice of a man; for the LORD fought for Israel.";
asv[14] = "And there was no day like that before it or after it, that Jehovah hearkened unto the voice of a man: for Jehovah fought for Israel.";
yng[14] = "And there hath not been like that day before it or after it, for Jehovah\'s hearkening to the voice of a man; for Jehovah is fighting for Israel.";
dby[14] = "And there was no day like that before it or after it, that Jehovah hearkened to the voice of a man; for Jehovah fought for Israel.";
web[14] = "And there was no day like that before it or after it, that the LORD hearkened to the voice of a man: for the LORD fought for Israel.";
hnv[14] = "There was no day like that before it or after it, that the LORD listened to the voice of a man: for the LORD fought for Yisra\'el.";
vul[14] = "non fuit ante et postea tam longa dies oboediente Domino voci hominis et pugnante pro Israhel";

rsv[15] = "Then Joshua returned, and all Israel with him, to the camp at Gilgal.";
asv[15] = "And Joshua returned, and all Israel with him, unto the camp to Gilgal.";
yng[15] = "And Joshua turneth back, and all Israel with him, unto the camp at Gilgal.";
dby[15] = "And Joshua returned, and all Israel with him, to the camp, to Gilgal.";
web[15] = "And Joshua returned, and all Israel with him, to the camp at Gilgal.";
hnv[15] = "Yehoshua returned, and all Yisra\'el with him, to the camp to Gilgal.";
vul[15] = "reversusque est Iosue cum omni Israhel in castra Galgalae";

asv[16] = "And these five kings fled, and hid themselves in the cave at Makkedah.";
yng[16] = "And these five kings flee, and are hidden in a cave at Makkedah,";

web[16] = "But these five kings fled, and hid themselves in a cave at Makkedah.";
hnv[16] = "These five kings fled, and hid themselves in the cave at Makkedah.";
vul[16] = "fugerant enim quinque reges et se absconderant in spelunca urbis Maceda";
kjv[17] = "And it was told Joshua, saying, The five kings are found hid in a cave at Makkedah.";
rsv[17] = "And it was told Joshua, &quot;The five kings have been found, hidden in the cave at Makke\'dah.&quot;";
asv[17] = "And it was told Joshua, saying, The five kings are found, hidden in the cave at Makkedah.";
yng[17] = "and it is declared to Joshua, saying, `The five kings have been found hidden in a cave at Makkedah.\'";
dby[17] = "And it was told Joshua, saying, The five kings have been found, hid in the cave at Makkedah.";
web[17] = "And it was told Joshua, saying, The five kings are found hid in a cave at Makkedah.";
hnv[17] = "It was told Yehoshua, saying, The five kings are found, hidden in the cave at Makkedah.";
vul[17] = "nuntiatumque est Iosue quod inventi essent quinque reges latentes in spelunca Maceda";
kjv[18] = "And Joshua said, Roll great stones upon the mouth of the cave, and set men by it for to keep them:";
rsv[18] = "And Joshua said, &quot;Roll great stones against the mouth of the cave, and set men by it to guard them;";
asv[18] = "And Joshua said, Roll great stones unto the mouth of the cave, and set men by it to keep them:";
yng[18] = "And Joshua saith, `Roll great stones unto the mouth of the cave, and appoint over it men to watch them;";
dby[18] = "And Joshua said, Roll great stones before the mouth of the cave, and set men before it to keep them.";
web[18] = "And Joshua said, Roll great stones upon the mouth of the cave, and set men by it to keep them:";
hnv[18] = "Yehoshua said, Roll great stones to the mouth of the cave, and set men by it to keep them:";
vul[18] = "qui praecepit sociis et ait volvite saxa ingentia ad os speluncae et ponite viros industrios qui clausos custodiant";
kjv[19] = "And stay ye not, [but] pursue after your enemies, and smite the hindmost of them; suffer them not to enter into their cities: for the LORD your God hath delivered them into your hand.";
rsv[19] = "but do not stay there yourselves, pursue your enemies, fall upon their rear, do not let them enter their cities; for the LORD your God has given them into your hand.&quot;";
asv[19] = "but stay not ye; pursue after your enemies, and smite the hindmost of them; suffer them not to enter into their cities: for Jehovah your God hath delivered them into your hand.";
yng[19] = "and ye, stand not, pursue after your enemies, and ye have smitten the hindmost of them; suffer them not to go in unto their cities, for Jehovah your God hath given them into your hand.\'";
dby[19] = "And ye, stay not, pursue after your enemies, and smite the hindmost of them; suffer them not to enter into their cities; for Jehovah your God has given them into your hand.";
web[19] = "And stay you not, [but] pursue your enemies, and smite the hindmost of them; suffer them not to enter into their cities: for the LORD your God hath delivered them into your hand.";
hnv[19] = "but don\'t stay; pursue after your enemies, and strike the hindmost of them; don\'t allow them to enter into their cities: for the LORD your God has delivered them into your hand.";
vul[19] = "vos autem nolite stare sed persequimini hostes et extremos quosque fugientium caedite ne dimittatis eos urbium suarum intrare praesidia quos tradidit Dominus Deus in manus vestras";
kjv[20] = "And it came to pass, when Joshua and the children of Israel had made an end of slaying them with a very great slaughter, till they were consumed, that the rest [which] remained of them entered into fenced cities.";
rsv[20] = "When Joshua and the men of Israel had finished slaying them with a very great slaughter, until they were wiped out, and when the remnant which remained of them had entered into the fortified cities,";
asv[20] = "And it came to pass, when Joshua and the children of Israel had made an end of slaying them with a very great slaughter, till they were consumed, and the remnant which remained of them had entered into the fortified cities,";
yng[20] = "And it cometh to pass, when Joshua and the sons of Israel finish to smite them -- a very great smiting, till they are consumed, and the remnant who have remained of them go in unto the fenced cities,";
dby[20] = "And it came to pass when Joshua and the children of Israel had ended smiting them with a very great slaughter, until they were consumed, that the remnant which remained of them entered into fortified cities;";
web[20] = "And it came to pass, when Joshua and the children of Israel had made an end of slaying them with a very great slaughter, till they were consumed, that the rest [who] remained of them entered into fortified cities.";
hnv[20] = "It happened, when Yehoshua and the children of Yisra\'el had made an end of killing them with a very great slaughter, until they were consumed, and the remnant which remained of them had entered into the fortified cities,";
vul[20] = "caesis igitur adversariis plaga magna et usque ad internicionem paene consumptis hii qui Israhel effugere potuerunt ingressi sunt civitates munitas";
kjv[21] = "And all the people returned to the camp to Joshua at Makkedah in peace: none moved his tongue against any of the children of Israel.";
rsv[21] = "all the people returned safe to Joshua in the camp at Makke\'dah; not a man moved his tongue against any of the people of Israel.";
asv[21] = "that all the people returned to the camp to Joshua at Makkedah in peace: none moved his tongue against any of the children of Israel.";
yng[21] = "that all the people turn back to the camp, unto Joshua, [at] Makkedah, in peace; none moved sharply his tongue against the sons of Israel.";
dby[21] = "and all the people returned to the camp to Joshua, at Makkedah, in peace; none moved his tongue against the children of Israel.";
web[21] = "And all the people returned to the camp to Joshua at Makkedah in peace: none moved his tongue against any of the children of Israel.";
hnv[21] = "that all the people returned to the camp to Yehoshua at Makkedah in shalom: none moved his tongue against any of the children of Yisra\'el.";
vul[21] = "reversusque est omnis exercitus ad Iosue in Maceda ubi tunc erant castra sani et integro numero nullusque contra filios Israhel muttire ausus est";
kjv[22] = "Then said Joshua, Open the mouth of the cave, and bring out those five kings unto me out of the cave.";
rsv[22] = "Then Joshua said, &quot;Open the mouth of the cave, and bring those five kings out to me from the cave.&quot;";
asv[22] = "Then said Joshua, Open the mouth of the cave, and bring forth those five kings unto me out of the cave.";
yng[22] = "And Joshua saith, `Open ye the mouth of the cave, and bring out unto me these five kings from the cave;\'";
dby[22] = "And Joshua said, Open the mouth of the cave, and bring forth to me those five kings out of the cave.";
web[22] = "Then said Joshua, Open the mouth of the cave, and bring those five kings to me out of the cave.";
hnv[22] = "Then said Yehoshua, Open the mouth of the cave, and bring forth those five kings to me out of the cave.";
vul[22] = "praecepitque Iosue dicens aperite os speluncae et producite ad me quinque reges qui in ea latitant";
kjv[23] = "And they did so, and brought forth those five kings unto him out of the cave, the king of Jerusalem, the king of Hebron, the king of Jarmuth, the king of Lachish, [and] the king of Eglon.";
rsv[23] = "And they did so, and brought those five kings out to him from the cave, the king of Jerusalem, the king of Hebron, the king of Jarmuth, the king of Lachish, and the king of Eglon.";
asv[23] = "And they did so, and brought forth those five kings unto him out of the cave, the king of Jerusalem, the king of Hebron, the king of Jarmuth, the king of Lachish, the king of Eglon.";
yng[23] = "and they do so, and bring out unto him these five kings from the cave: the king of Jerusalem, the king of Hebron, the king of Jarmuth, the king of Lachish, the king of Eglon.";
dby[23] = "And they did so, and brought forth to him those five kings out of the cave, the king of Jerusalem, the king of Hebron, the king of Jarmuth, the king of Lachish, the king of Eglon.";
web[23] = "And they did so, and brought those five kings to him out of the cave, the king of Jerusalem, the king of Hebron, the king of Jarmuth, the king of Lachish, [and] the king of Eglon.";
hnv[23] = "They did so, and brought forth those five kings to him out of the cave, the king of Yerushalayim, the king of Hevron, the king of Yarmut, the king of Lakhish, the king of `Eglon.";
vul[23] = "fecerunt ministri ut sibi fuerat imperatum et eduxerunt ad eum quinque reges de spelunca regem Hierusalem regem Hebron regem Hieremoth regem Lachis regem Eglon";
kjv[24] = "And it came to pass, when they brought out those kings unto Joshua, that Joshua called for all the men of Israel, and said unto the captains of the men of war which went with him, Come near, put your feet upon the necks of these kings. And they came near, and put their feet upon the necks of them.";
rsv[24] = "And when they brought those kings out to Joshua, Joshua summoned all the men of Israel, and said to the chiefs of the men of war who had gone with him, &quot;Come near, put your feet upon the necks of these kings.&quot; Then they came near, and put their feet on their necks.";
asv[24] = "And it came to pass, when they brought forth those kings unto Joshua, that Joshua called for all the men of Israel, and said unto the chiefs of the men of war that went with him, Come near, put your feet upon the necks of these kings. And they came near, and put their feet upon the necks of them.";
yng[24] = "And it cometh to pass, when they bring out these kings unto Joshua, that Joshua calleth unto every man of Israel, and saith unto the captains of the men of war, who have gone with him, `Draw near, set your feet on the necks of these kings;\' and they draw near, and set their feet on their necks.";
dby[24] = "And it came to pass when they had brought forth those kings to Joshua, that Joshua called to all the men of Israel, and said to the captains of the men of war who went with him, Come forward, put your feet on the necks of these kings. And they came forward and put their feet on their necks.";
web[24] = "And it came to pass, when they brought out those kings to Joshua, that Joshua called for all the men of Israel, and said to the captains of the men of war who went with him, Come near, put your feet upon the necks of these kings. And they came near, and put their feet upon the necks of them.";
hnv[24] = "It happened, when they brought forth those kings to Yehoshua, that Yehoshua called for all the men of Yisra\'el, and said to the chiefs of the men of war who went with him, Come near, put your feet on the necks of these kings. They came near, and put their feet on the necks of them.";
vul[24] = "cumque educti essent ad eum vocavit omnes viros Israhel et ait ad principes exercitus qui secum erant ite et ponite pedes super colla regum istorum qui cum perrexissent et subiectorum pedibus colla calcarent";
kjv[25] = "And Joshua said unto them, Fear not, nor be dismayed, be strong and of good courage: for thus shall the LORD do to all your enemies against whom ye fight.";
rsv[25] = "And Joshua said to them, &quot;Do not be afraid or dismayed; be strong and of good courage; for thus the LORD will do to all your enemies against whom you fight.&quot;";
asv[25] = "And Joshua said unto them, Fear not, nor be dismayed; be strong and of good courage: for thus shall Jehovah do to all your enemies against whom ye fight.";
yng[25] = "And Joshua saith unto them, `Fear not, nor be affrighted; be strong and courageous; for thus doth Jehovah do to all your enemies with whom ye are fighting;\'";
dby[25] = "And Joshua said to them, Fear not, neither be dismayed; be strong and courageous, for thus will Jehovah do to all your enemies against whom ye fight.";
web[25] = "And Joshua said to them, Fear not, nor be dismayed, be strong and of good courage: for thus shall the LORD do to all your enemies against whom ye fight.";
hnv[25] = "Yehoshua said to them, Don\'t be afraid, nor be dismayed; be strong and of good courage: for thus shall the LORD do to all your enemies against whom you fight.";
vul[25] = "rursum ait ad eos nolite timere nec paveatis confortamini et estote robusti sic enim faciet Dominus cunctis hostibus vestris adversum quos dimicatis";
kjv[26] = "And afterward Joshua smote them, and slew them, and hanged them on five trees: and they were hanging upon the trees until the evening.";
rsv[26] = "And afterward Joshua smote them and put them to death, and he hung them on five trees. And they hung upon the trees until evening;";
asv[26] = "And afterward Joshua smote them, and put them to death, and hanged them on five trees: and they were hanging upon the trees until the evening.";
yng[26] = "and Joshua smiteth them afterwards, and putteth them to death, and hangeth them on five trees; and they are hanging on the trees till the evening.";
dby[26] = "And afterwards Joshua smote them, and put them to death, and hanged them on five trees; and they were hanging upon the trees until the evening.";
web[26] = "And afterward Joshua smote them, and slew them, and hanged them on five trees: and they were hanging upon the trees until the evening.";
hnv[26] = "Afterward Yehoshua struck them, and put them to death, and hanged them on five trees: and they were hanging on the trees until the evening.";
vul[26] = "percussitque Iosue et interfecit eos atque suspendit super quinque stipites fueruntque suspensi usque ad vesperum";
kjv[27] = "And it came to pass at the time of the going down of the sun, [that] Joshua commanded, and they took them down off the trees, and cast them into the cave wherein they had been hid, and laid great stones in the cave\'s mouth, [which remain] until this very day.";
rsv[27] = "but at the time of the going down of the sun, Joshua commanded, and they took them down from the trees, and threw them into the cave where they had hidden themselves, and they set great stones against the mouth of the cave, which remain to this very day.";
asv[27] = "And it came to pass at the time of the going down of the sun, that Joshua commanded, and they took them down off the trees, and cast them into the cave wherein they had hidden themselves, and laid great stones on the mouth of the cave, unto this very day.";
yng[27] = "And it cometh to pass, at the time of the going in of the sun, Joshua hath commanded, and they take them down from off the trees, and cast them unto the cave where they had been hid, and put great stones on the mouth of the cave till this very day.";
dby[27] = "And it came to pass at the time of the going down of the sun, that Joshua commanded, and they took them down off the trees, and cast them into the cave where they had been hid, and laid great stones before the cave\'s mouth, [which remain] to this very day.";
web[27] = "And it came to pass at the time of the setting of the sun, [that] Joshua commanded, and they took them down from the trees, and cast them into the cave in which they had been hid, and laid great stones upon the cave\'s mouth, [which remain] until this very day.";
hnv[27] = "It happened at the time of the going down of the sun, that Yehoshua commanded, and they took them down off the trees, and cast them into the cave in which they had hidden themselves, and laid great stones on the mouth of the cave, to this very day.";
vul[27] = "cumque occumberet sol praecepit sociis ut deponerent eos de patibulis qui depositos proiecerunt in speluncam in qua latuerant et posuerunt super os eius saxa ingentia quae permanent usque in praesens";
kjv[28] = "And that day Joshua took Makkedah, and smote it with the edge of the sword, and the king thereof he utterly destroyed, them, and all the souls that [were] therein; he let none remain: and he did to the king of Makkedah as he did unto the king of Jericho.";
rsv[28] = "And Joshua took Makke\'dah on that day, and smote it and its king with the edge of the sword; he utterly destroyed every person in it, he left none remaining; and he did to the king of Makke\'dah as he had done to the king of Jericho.";
asv[28] = "And Joshua took Makkedah on that day, and smote it with the edge of the sword, and the king thereof: he utterly destroyed them and all the souls that were therein; he left none remaining; and he did to the king of Makkedah as he had done unto the king of Jericho.";
yng[28] = "And Makkedah hath Joshua captured on that day, and he smiteth it by the mouth of the sword, and its king he hath devoted, them and every person who [is] in it -- he hath not left a remnant; and he doth to the king of Makkedah as he did to the king of Jericho.";
dby[28] = "And Joshua took Makkedah on that day, and smote it with the edge of the sword, and the king thereof, him and all the souls that were therein he utterly destroyed; he let none remain; and he did to the king of Makkedah as he had done to the king of Jericho.";
web[28] = "And that day Joshua took Makkedah, and smote it with the edge of the sword, and the king of it he utterly destroyed, them, and all the souls that [were] in it; he let none remain: and he did to the king of Makkedah as he did to the king of Jericho.";
hnv[28] = "Yehoshua took Makkedah on that day, and struck it with the edge of the sword, and the king of it: he utterly destroyed them and all the souls who were therein; he left none remaining; and he did to the king of Makkedah as he had done to the king of Yericho.";
vul[28] = "eodem die Macedam quoque cepit Iosue et percussit in ore gladii regemque illius interfecit et omnes habitatores eius non dimisit in ea saltim parvas reliquias fecitque regi Maceda sicut fecerat regi Hiericho";
kjv[29] = "Then Joshua passed from Makkedah, and all Israel with him, unto Libnah, and fought against Libnah:";
rsv[29] = "Then Joshua passed on from Makke\'dah, and all Israel with him, to Libnah, and fought against Libnah;";
asv[29] = "And Joshua passed from Makkedah, and all Israel with him, unto Libnah, and fought against Libnah:";
yng[29] = "And Joshua passeth over, and all Israel with him, from Makkedah [to] Libnah, and fighteth with Libnah;";
dby[29] = "And Joshua passed, and all Israel with him, from Makkedah to Libnah, and fought against Libnah.";
web[29] = "Then Joshua passed from Makkedah, and all Israel with him, to Libnah, and fought against Libnah:";
hnv[29] = "Yehoshua passed from Makkedah, and all Yisra\'el with him, to Livna, and fought against Livna:";
vul[29] = "transivit cum omni Israhel de Maceda in Lebna et pugnabat contra eam";
kjv[30] = "And the LORD delivered it also, and the king thereof, into the hand of Israel; and he smote it with the edge of the sword, and all the souls that [were] therein; he let none remain in it; but did unto the king thereof as he did unto the king of Jericho.";
rsv[30] = "and the LORD gave it also and its king into the hand of Israel; and he smote it with the edge of the sword, and every person in it; he left none remaining in it; and he did to its king as he had done to the king of Jericho.";
asv[30] = "and Jehovah delivered it also, and the king thereof, into the hand of Israel; and he smote it with the edge of the sword, and all the souls that were therein; he left none remaining in it; and he did unto the king thereof as he had done unto the king of Jericho.";
yng[30] = "and Jehovah giveth also it into the hand of Israel, and its king, and it smiteth it by the mouth of the sword, and every person who [is] in it -- it left not in it a remnant; and it doth to its king as it did to the king of Jericho.";
dby[30] = "And Jehovah gave it also and the king thereof into the hand of Israel; and he smote it with the edge of the sword, and all the souls that were therein; he let none remain in it: and he did to the king thereof as he had done to the king of Jericho.";
web[30] = "And the LORD delivered it also, and its king, into the hand of Israel; and he smote it with the edge of the sword, and all the souls that [were] in it; he let none remain in it; but did to the king of it as he did to the king of Jericho.";
hnv[30] = "and the LORD delivered it also, and the king of it, into the hand of Yisra\'el; and he struck it with the edge of the sword, and all the souls who were therein; he left none remaining in it; and he did to the king of it as he had done to the king of Yericho.";
vul[30] = "quam tradidit Dominus cum rege suo in manu Israhel percusseruntque urbem in ore gladii et omnes habitatores eius non dimiserunt in ea ullas reliquias feceruntque regi Lebna sicut fecerant regi Hiericho";
kjv[31] = "And Joshua passed from Libnah, and all Israel with him, unto Lachish, and encamped against it, and fought against it:";
rsv[31] = "And Joshua passed on from Libnah, and all Israel with him, to Lachish, and laid siege to it, and assaulted it:";
asv[31] = "And Joshua passed from Libnah, and all Israel with him, unto Lachish, and encamped against it, and fought against it:";
yng[31] = "And Joshua passeth over, and all Israel with him, from Libnah to Lachish, and encampeth against it, and fighteth against it;";
dby[31] = "And Joshua passed, and all Israel with him, from Libnah to Lachish, and encamped against it, and fought against it.";
web[31] = "And Joshua passed from Libnah, and all Israel with him, to Lachish, and encamped against it, and fought against it:";
hnv[31] = "Yehoshua passed from Livna, and all Yisra\'el with him, to Lakhish, and encamped against it, and fought against it:";
vul[31] = "de Lebna transivit in Lachis et exercitu per gyrum disposito obpugnabat eam";
kjv[32] = "And the LORD delivered Lachish into the hand of Israel, which took it on the second day, and smote it with the edge of the sword, and all the souls that [were] therein, according to all that he had done to Libnah.";
rsv[32] = "and the LORD gave Lachish into the hand of Israel, and he took it on the second day, and smote it with the edge of the sword, and every person in it, as he had done to Libnah.";
asv[32] = "and Jehovah delivered Lachish into the hand of Israel; and he took it on the second day, and smote it with the edge of the sword, and all the souls that were therein, according to all that he had done to Libnah.";
yng[32] = "And Jehovah giveth Lachish into the hand of Israel, and it captureth it on the second day, and smiteth it by the mouth of the sword, and every person who [is] in it, according to all that it did to Libnah.";
dby[32] = "And Jehovah gave Lachish into the hand of Israel; and they took it on the second day, and smote it with the edge of the sword, and all the souls that were therein, according to all that he had done to Libnah.";
web[32] = "And the LORD delivered Lachish into the hand of Israel, who took it on the second day, and smote it with the edge of the sword, and all the souls that [were] in it, according to all that he had done to Libnah.";
hnv[32] = "and the LORD delivered Lakhish into the hand of Yisra\'el; and he took it on the second day, and struck it with the edge of the sword, and all the souls who were therein, according to all that he had done to Livna.";
vul[32] = "tradiditque Dominus Lachis in manu Israhel et cepit eam die altero atque percussit in ore gladii omnemque animam quae fuerat in ea sicut fecerat Lebna";
kjv[33] = "Then Horam king of Gezer came up to help Lachish; and Joshua smote him and his people, until he had left him none remaining.";
rsv[33] = "Then Horam king of Gezer came up to help Lachish; and Joshua smote him and his people, until he left none remaining.";
asv[33] = "Then Horam king of Gezer came up to help Lachish; and Joshua smote him and his people, until he had left him none remaining.";
yng[33] = "Than hath Horam king of Gezer come up to help Lachish, and Joshua smiteth him and his people, till he hath not left to him a remnant.";
dby[33] = "Then Horam king of Gezer came up to help Lachish; and Joshua smote him and his people, until he had left him none remaining.";
web[33] = "Then Horam king of Gezer came up to help Lachish; and Joshua smote him and his people, until he had left him none remaining.";
hnv[33] = "Then Horam king of Gezer came up to help Lakhish; and Yehoshua struck him and his people, until he had left him none remaining.";
vul[33] = "eo tempore ascendit Hiram rex Gazer ut auxiliaretur Lachis quem percussit Iosue cum omni populo eius usque ad internicionem";

kjv[35] = "And they took it on that day, and smote it with the edge of the sword, and all the souls that [were] therein he utterly destroyed that day, according to all that he had done to Lachish.";

yng[35] = "and capture it on that day, and smite it by the mouth of the sword, and every person who [is] in it on that day he hath devoted, according to all that he did to Lachish.";
dby[35] = "And they took it on that day, and smote it with the edge of the sword; and all the souls that were therein he utterly destroyed on that day, according to all that he had done to Lachish.";
web[35] = "And they took it on that day, and smote it with the edge of the sword, and all the souls that [were] in it he utterly destroyed that day, according to all that he had done to Lachish.";

dby[36] = "And Joshua went up, and all Israel with him, from Eglon to Hebron; and they fought against it.";
web[36] = "And Joshua went up from Eglon, and all Israel with him, to Hebron; and they fought against it:";
hnv[36] = " Yehoshua went up from `Eglon, and all Yisra\'el with him, to Hevron; and they fought against it:";
vul[36] = "ascendit quoque cum omni Israhele de Eglon in Hebron et pugnavit contra eam";
kjv[37] = "And they took it, and smote it with the edge of the sword, and the king thereof, and all the cities thereof, and all the souls that [were] therein; he left none remaining, according to all that he had done to Eglon; but destroyed it utterly, and all the souls that [were] therein.";
rsv[37] = "and took it, and smote it with the edge of the sword, and its king and its towns, and every person in it; he left none remaining, as he had done to Eglon, and utterly destroyed it with every person in it.";
asv[37] = "and they took it, and smote it with the edge of the sword, and the king thereof, and all the cities thereof, and all the souls that were therein; he left none remaining, according to all that he had done to Eglon; but he utterly destroyed it, and all the souls that were therein.";
yng[37] = "and capture it, and smite it by the mouth of the sword, and its king, and all its cities, and every person who [is] in it -- he hath not left a remnant -- according to all that he did to Eglon -- and doth devote it, and every person who [is] in it.";
dby[37] = "And they took it, and smote it with the edge of the sword, and the king thereof, and all the cities thereof, and all the souls that were therein: he let none remain, according to all that he had done to Eglon; and he utterly destroyed it, and all the souls that were therein.";
web[37] = "And they took it, and smote it with the edge of the sword, and its king, and all its cities, and all the souls that [were] in them; he left none remaining (according to all that he had done to Eglon) but destroyed it utterly, and all the souls that [were] in it.";
hnv[37] = "and they took it, and struck it with the edge of the sword, and the king of it, and all the cities of it, and all the souls who were therein; he left none remaining, according to all that he had done to `Eglon; but he utterly destroyed it, and all the souls who were therein.";
vul[37] = "cepitque et percussit in ore gladii regem quoque eius et omnia oppida regionis illius universasque animas quae in ea fuerant commoratae non reliquit in ea ullas reliquias sicut fecerat Eglon sic fecit et Hebron cuncta quae in ea repperit consumens gladio";

kjv[39] = "And he took it, and the king thereof, and all the cities thereof; and they smote them with the edge of the sword, and utterly destroyed all the souls that [were] therein; he left none remaining: as he had done to Hebron, so he did to Debir, and to the king thereof; as he had done also to Libnah, and to her king.";
rsv[39] = "and he took it with its king and all its towns; and they smote them with the edge of the sword, and utterly destroyed every person in it; he left none remaining; as he had done to Hebron and to Libnah and its king, so he did to Debir and to its king.";
asv[39] = "and he took it, and the king thereof, and all the cities thereof; and they smote them with the edge of the sword, and utterly destroyed all the souls that were therein; he left none remaining: as he had done to Hebron, so he did to Debir, and to the king thereof; as he had done also to Libnah, and to the king thereof.";
yng[39] = "and captureth it, and its king, and all its cities, and they smite them by the mouth of the sword, and devote every person who [is] in it -- he hath not left a remnant; as he did to Hebron so he did to Debir, and to its king, and as he did to Libnah, and to its king.";
dby[39] = "And he took it, and the king thereof, and all the cities thereof, and they smote them with the edge of the sword, and utterly destroyed all the souls that were therein; he let none remain: as he had done to Hebron, and as he had done to Libnah, and to the king thereof, so he did to Debir and to the king thereof.";
web[39] = "And he took it, and its king, and all its cities, and they smote them with the edge of the sword, and utterly destroyed all the souls that [were] in them; he left none remaining: as he had done to Hebron, so he did to Debir, and to its king; as he had done also to Libnah, and to its king.";
hnv[39] = "and he took it, and the king of it, and all the cities of it; and they struck them with the edge of the sword, and utterly destroyed all the souls who were therein; he left none remaining: as he had done to Hevron, so he did to Devir, and to the king of it; as he had done also to Livna, and to the king of it.";
vul[39] = "[Vulgate 10:40] regem quoque eius et omnia per circuitum oppida percussit in ore gladii non dimisit in ea ullas reliquias sicut fecerat Hebron et Lebna et regibus earum sic fecit Dabir et regi illius";
kjv[40] = "So Joshua smote all the country of the hills, and of the south, and of the vale, and of the springs, and all their kings: he left none remaining, but utterly destroyed all that breathed, as the LORD God of Israel commanded.";
rsv[40] = "So Joshua defeated the whole land, the hill country and the Negeb and the lowland and the slopes, and all their kings; he left none remaining, but utterly destroyed all that breathed, as the LORD God of Israel commanded.";
asv[40] = "So Joshua smote all the land, the hill-country, and the South, and the lowland, and the slopes, and all their kings: he left none remaining, but he utterly destroyed all that breathed, as Jehovah, the God of Israel, commanded.";
yng[40] = "And Joshua smiteth all the land of the hill-country, and of the south, and of the low-country, and of the springs, and all their kings -- he hath not left a remnant, and all that doth breathe he hath devoted, as Jehovah, God of Israel, commanded.";
dby[40] = "And Joshua smote the whole country, the mountain, and the south, and the lowland, and the hill-slopes, and all their kings: he let none remain, but he utterly destroyed all that breathed, as Jehovah the God of Israel had commanded.";
web[40] = "So Joshua smote all the country of the hills, and of the south, and of the vale, and of the springs, and all their kings: he left none remaining, but utterly destroyed all that breathed, as the LORD God of Israel commanded.";
hnv[40] = "So Yehoshua struck all the land, the hill-country, and the South, and the lowland, and the slopes, and all their kings: he left none remaining, but he utterly destroyed all that breathed, as the LORD, the God of Yisra\'el, commanded.";
vul[40] = "[Vulgate 10:41] percussit itaque Iosue omnem terram montanam et meridianam atque campestrem et Asedoth cum regibus suis non dimisit in ea ullas reliquias sed omne quod spirare poterat interfecit sicut praeceperat ei Dominus Deus Israhel";
