csb[1] = "Before the Passover Festival, Jesus knew that his hour had come to depart from this world to the Father. Having loved his own who were in the world, he loved them to the end.";
csb[2] = "Now when it was time for supper, the devil had already put it into the heart of Judas, Simon Iscariot\'s son, to betray him.";
csb[3] = "Jesus knew that the Father had given everything into his hands, that he had come from God, and that he was going back to God.";
csb[4] = "So he got up from supper, laid aside his outer clothing, took a towel, and tied it around himself.";
csb[5] = "Next, he poured water into a basin and began to wash his disciples\' feet and to dry them with the towel tied around him.";
csb[6] = "He came to Simon Peter, who asked him, &quot;Lord, are you going to wash my feet? &quot;";
csb[7] = "Jesus answered him, &quot;What I\'m doing you don\'t realize now, but afterward you will understand.&quot;";
csb[8] = "&quot;You will never wash my feet,&quot; Peter said. Jesus replied, &quot;If I don\'t wash you, you have no part with me.&quot;";
csb[9] = "Simon Peter said to him, &quot;Lord, not only my feet, but also my hands and my head.&quot;";
csb[10] = "&quot;One who has bathed,&quot; Jesus told him, &quot;doesn\'t need to wash anything except his feet, but he is completely clean. You are clean, but not all of you.&quot;";
csb[11] = "For he knew who would betray him. This is why he said, &quot;Not all of you are clean.&quot;";
csb[12] = "When Jesus had washed their feet and put on his outer clothing, he reclined again and said to them, &quot;Do you know what I have done for you?";
csb[13] = "&quot;You call me Teacher and Lord -- and you are speaking rightly, since that is what I am.";
csb[14] = "&quot;So if I, your Lord and Teacher, have washed your feet, you also ought to wash one another\'s feet.";
csb[15] = "&quot;For I have given you an example, that you also should do just as I have done for you.";
csb[16] = "&quot;Truly I tell you, a servant is not greater than his master, and a messenger is not greater than the one who sent him.";
csb[17] = "&quot;If you know these things, you are blessed if you do them.";
csb[18] = "&quot;I\'m not speaking about all of you; I know those I have chosen. But the Scripture must be fulfilled: The one who eats my bread has raised his heel against me.";
csb[19] = "&quot;I am telling you now before it happens, so that when it does happen you will believe that I am he.";
csb[20] = "&quot;Truly I tell you, whoever receives anyone I send receives me, and the one who receives me receives him who sent me.&quot;";
csb[21] = "When Jesus had said this, he was troubled in his spirit and testified, &quot;Truly I tell you, one of you will betray me.&quot;";
csb[22] = "The disciples started looking at one another -- uncertain which one he was speaking about.";
csb[23] = "One of his disciples, the one Jesus loved, was reclining close beside Jesus.";
csb[24] = "Simon Peter motioned to him to find out who it was he was talking about.";
csb[25] = "So he leaned back against Jesus and asked him, &quot;Lord, who is it? &quot;";
csb[26] = "Jesus replied, &quot;He\'s the one I give the piece of bread to after I have dipped it.&quot; When he had dipped the bread, he gave it to Judas, Simon Iscariot\'s son.";
csb[27] = "After Judas ate the piece of bread, Satan entered him. So Jesus told him, &quot;What you\'re doing, do quickly.&quot;";
csb[28] = "None of those reclining at the table knew why he said this to him.";
csb[29] = "Since Judas kept the money-bag, some thought that Jesus was telling him, &quot;Buy what we need for the festival,&quot; or that he should give something to the poor.";
csb[30] = "After receiving the piece of bread, he immediately left. And it was night.";
csb[31] = "When he had left, Jesus said, &quot;Now the Son of Man is glorified, and God is glorified in him.";
csb[32] = "&quot;If God is glorified in him, God will also glorify him in himself and will glorify him at once.";
csb[33] = "&quot;Children, I am with you a little while longer. You will look for me, and just as I told the Jews, so now I tell you: \'Where I am going, you cannot come.\'";
csb[34] = "&quot;I give you a new command: Love one another. Just as I have loved you, you are also to love one another.";
csb[35] = "&quot;By this everyone will know that you are my disciples, if you love one another.&quot;";
csb[36] = "&quot;Lord,&quot; Simon Peter said to him, &quot;where are you going? &quot; Jesus answered, &quot;Where I am going you cannot follow me now, but you will follow later.&quot;";
csb[37] = "&quot;Lord,&quot; Peter asked, &quot;why can\'t I follow you now? I will lay down my life for you.&quot;";
csb[38] = "Jesus replied, &quot;Will you lay down your life for me? Truly I tell you, a rooster will not crow until you have denied me three times.";
