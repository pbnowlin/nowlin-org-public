csb[1] = "There was a man from the Pharisees named Nicodemus, a ruler of the Jews.";
csb[2] = "This man came to him at night and said, &quot;Rabbi, we know that you are a teacher who has come from God, for no one could perform these signs you do unless God were with him.&quot;";
csb[3] = "Jesus replied, &quot;Truly I tell you, unless someone is born again, he cannot see the kingdom of God.&quot;";
csb[4] = "&quot;How can anyone be born when he is old? &quot; Nicodemus asked him. &quot;Can he enter his mother\'s womb a second time and be born? &quot;";
csb[5] = "Jesus answered, &quot;Truly I tell you, unless someone is born of water and the Spirit, he cannot enter the kingdom of God.";
csb[6] = "&quot;Whatever is born of the flesh is flesh, and whatever is born of the Spirit is spirit.";
csb[7] = "&quot;Do not be amazed that I told you that you must be born again.";
csb[8] = "&quot;The wind blows where it pleases, and you hear its sound, but you don\'t know where it comes from or where it is going. So it is with everyone born of the Spirit.&quot;";
csb[9] = "&quot;How can these things be? &quot; asked Nicodemus.";
csb[10] = "&quot;Are you a teacher of Israel and don\'t know these things? &quot; Jesus replied.";
csb[11] = "&quot;Truly I tell you, we speak what we know and we testify to what we have seen, but you do not accept our testimony.";
csb[12] = "&quot;If I have told you about earthly things and you don\'t believe, how will you believe if I tell you about heavenly things?";
csb[13] = "&quot;No one has ascended into heaven except the one who descended from heaven -- the Son of Man.";
csb[14] = "&quot;Just as Moses lifted up the snake in the wilderness, so the Son of Man must be lifted up,";
csb[15] = "&quot;so that everyone who believes in him may have eternal life.";
csb[16] = "&quot;For God loved the world in this way: He gave his one and only Son, so that everyone who believes in him will not perish but have eternal life.";
csb[17] = "&quot;For God did not send his Son into the world to condemn the world, but to save the world through him.";
csb[18] = "&quot;Anyone who believes in him is not condemned, but anyone who does not believe is already condemned, because he has not believed in the name of the one and only Son of God.";
csb[19] = "&quot;This is the judgment: The light has come into the world, and people loved darkness rather than the light because their deeds were evil.";
csb[20] = "&quot;For everyone who does evil hates the light and avoids it, so that his deeds may not be exposed.";
csb[21] = "&quot;But anyone who lives by the truth comes to the light, so that his works may be shown to be accomplished by God.&quot;";
csb[22] = "After this, Jesus and his disciples went to the Judean countryside, where he spent time with them and baptized.";
csb[23] = "John also was baptizing in Aenon near Salim, because there was plenty of water there. People were coming and being baptized,";
csb[24] = "since John had not yet been thrown into prison.";
csb[25] = "Then a dispute arose between John\'s disciples and a Jew about purification.";
csb[26] = "So they came to John and told him, &quot;Rabbi, the one you testified about, and who was with you across the Jordan, is baptizing -- and everyone is going to him.&quot;";
csb[27] = "John responded, &quot;No one can receive anything unless it has been given to him from heaven.";
csb[28] = "&quot;You yourselves can testify that I said, \'I am not the Messiah, but I\'ve been sent ahead of him.\'";
csb[29] = "&quot;He who has the bride is the groom. But the groom\'s friend, who stands by and listens for him, rejoices greatly at the groom\'s voice. So this joy of mine is complete.";
csb[30] = "&quot;He must increase, but I must decrease.&quot;";
csb[31] = "The one who comes from above is above all. The one who is from the earth is earthly and speaks in earthly terms. The one who comes from heaven is above all.";
csb[32] = "He testifies to what he has seen and heard, and yet no one accepts his testimony.";
csb[33] = "The one who has accepted his testimony has affirmed that God is true.";
csb[34] = "For the one whom God sent speaks God\'s words, since he gives the Spirit without measure.";
csb[35] = "The Father loves the Son and has given all things into his hands.";
csb[36] = "The one who believes in the Son has eternal life, but the one who rejects the Son will not see life; instead, the wrath of God remains on him.";
