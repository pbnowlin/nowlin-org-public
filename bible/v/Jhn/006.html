csb[1] = "After this, Jesus crossed the Sea of Galilee (or Tiberias).";
csb[2] = "A huge crowd was following him because they saw the signs that he was performing by healing the sick.";
csb[3] = "Jesus went up a mountain and sat down there with his disciples.";
csb[4] = "Now the Passover, a Jewish festival, was near.";
csb[5] = "So when Jesus looked up and noticed a huge crowd coming toward him, he asked Philip, &quot;Where will we buy bread so that these people can eat? &quot;";
csb[6] = "He asked this to test him, for he himself knew what he was going to do.";
csb[7] = "Philip answered him, &quot;Two hundred denarii worth of bread wouldn\'t be enough for each of them to have a little.&quot;";
csb[8] = "One of his disciples, Andrew, Simon Peter\'s brother, said to him,";
csb[9] = "&quot;There\'s a boy here who has five barley loaves and two fish -- but what are they for so many? &quot;";
csb[10] = "Jesus said, &quot;Have the people sit down.&quot; There was plenty of grass in that place; so they sat down. The men numbered about five thousand.";
csb[11] = "Then Jesus took the loaves, and after giving thanks he distributed them to those who were seated -- so also with the fish, as much as they wanted.";
csb[12] = "When they were full, he told his disciples, &quot;Collect the leftovers so that nothing is wasted.&quot;";
csb[13] = "So they collected them and filled twelve baskets with the pieces from the five barley loaves that were left over by those who had eaten.";
csb[14] = "When the people saw the sign he had done, they said, &quot;This truly is the Prophet who is to come into the world.&quot;";
csb[15] = "Therefore, when Jesus realized that they were about to come and take him by force to make him king, he withdrew again to the mountain by himself.";
csb[16] = "When evening came, his disciples went down to the sea,";
csb[17] = "got into a boat, and started across the sea to Capernaum. Darkness had already set in, but Jesus had not yet come to them.";
csb[18] = "A high wind arose, and the sea began to churn.";
csb[19] = "After they had rowed about three or four miles, they saw Jesus walking on the sea. He was coming near the boat, and they were afraid.";
csb[20] = "But he said to them, &quot;It is I. Don\'t be afraid.&quot;";
csb[21] = "Then they were willing to take him on board, and at once the boat was at the shore where they were heading.";
csb[22] = "The next day, the crowd that had stayed on the other side of the sea saw there had been only one boat. They also saw that Jesus had not boarded the boat with his disciples, but that his disciples had gone off alone.";
csb[23] = "Some boats from Tiberias came near the place where they had eaten the bread after the Lord had given thanks.";
csb[24] = "When the crowd saw that neither Jesus nor his disciples were there, they got into the boats and went to Capernaum looking for Jesus.";
csb[25] = "When they found him on the other side of the sea, they said to him, &quot;Rabbi, when did you get here? &quot;";
csb[26] = "Jesus answered, &quot;Truly I tell you, you are looking for me, not because you saw the signs, but because you ate the loaves and were filled.";
csb[27] = "&quot;Don\'t work for the food that perishes but for the food that lasts for eternal life, which the Son of Man will give you, because God the Father has set his seal of approval on him.&quot;";
csb[28] = "&quot;What can we do to perform the works of God? &quot; they asked.";
csb[29] = "Jesus replied, &quot;This is the work of God -- that you believe in the one he has sent.&quot;";
csb[30] = "&quot;What sign, then, are you going to do so we may see and believe you? &quot; they asked. &quot;What are you going to perform?";
csb[31] = "&quot;Our ancestors ate the manna in the wilderness, just as it is written: He gave them bread from heaven to eat.&quot;";
csb[32] = "Jesus said to them, &quot;Truly I tell you, Moses didn\'t give you the bread from heaven, but my Father gives you the true bread from heaven.";
csb[33] = "&quot;For the bread of God is the one who comes down from heaven and gives life to the world.&quot;";
csb[34] = "Then they said, &quot;Sir, give us this bread always.&quot;";
csb[35] = "&quot;I am the bread of life,&quot; Jesus told them. &quot;No one who comes to me will ever be hungry, and no one who believes in me will ever be thirsty again.";
csb[36] = "&quot;But as I told you, you\'ve seen me, and yet you do not believe.";
csb[37] = "&quot;Everyone the Father gives me will come to me, and the one who comes to me I will never cast out.";
csb[38] = "&quot;For I have come down from heaven, not to do my own will, but the will of him who sent me.";
csb[39] = "&quot;This is the will of him who sent me: that I should lose none of those he has given me but should raise them up on the last day.";
csb[40] = "&quot;For this is the will of my Father: that everyone who sees the Son and believes in him will have eternal life, and I will raise him up on the last day.&quot;";
csb[41] = "Therefore the Jews started complaining about him because he said, &quot;I am the bread that came down from heaven.&quot;";
csb[42] = "They were saying, &quot;Isn\'t this Jesus the son of Joseph, whose father and mother we know? How can he now say, \'I have come down from heaven\'? &quot;";
csb[43] = "Jesus answered them, &quot;Stop complaining among yourselves.";
csb[44] = "&quot;No one can come to me unless the Father who sent me draws him, and I will raise him up on the last day.";
csb[45] = "&quot;It is written in the Prophets: And they will all be taught by God. Everyone who has listened to and learned from the Father comes to me --";
csb[46] = "&quot;not that anyone has seen the Father except the one who is from God. He has seen the Father.";
csb[47] = "&quot;Truly I tell you, anyone who believes has eternal life.";
csb[48] = "&quot;I am the bread of life.";
csb[49] = "&quot;Your ancestors ate the manna in the wilderness, and they died.";
csb[50] = "&quot;This is the bread that comes down from heaven so that anyone may eat of it and not die.";
csb[51] = "&quot;I am the living bread that came down from heaven. If anyone eats of this bread he will live forever. The bread that I will give for the life of the world is my flesh.&quot;";
csb[52] = "At that, the Jews argued among themselves, &quot;How can this man give us his flesh to eat? &quot;";
csb[53] = "So Jesus said to them, &quot;Truly I tell you, unless you eat the flesh of the Son of Man and drink his blood, you do not have life in yourselves.";
csb[54] = "&quot;The one who eats my flesh and drinks my blood has eternal life, and I will raise him up on the last day,";
csb[55] = "&quot;because my flesh is true food and my blood is true drink.";
csb[56] = "&quot;The one who eats my flesh and drinks my blood remains in me, and I in him.";
csb[57] = "&quot;Just as the living Father sent me and I live because of the Father, so the one who feeds on me will live because of me.";
csb[58] = "&quot;This is the bread that came down from heaven; it is not like the manna your ancestors ate -- and they died. The one who eats this bread will live forever.&quot;";
csb[59] = "He said these things while teaching in the synagogue in Capernaum.";
csb[60] = "Therefore, when many of his disciples heard this, they said, &quot;This teaching is hard. Who can accept it? &quot;";
csb[61] = "Jesus, knowing in himself that his disciples were complaining about this, asked them, &quot;Does this offend you?";
csb[62] = "&quot;Then what if you were to observe the Son of Man ascending to where he was before?";
csb[63] = "&quot;The Spirit is the one who gives life. The flesh doesn\'t help at all. The words that I have spoken to you are spirit and are life.";
csb[64] = "&quot;But there are some among you who don\'t believe.&quot; (For Jesus knew from the beginning those who did not believe and the one who would betray him.)";
csb[65] = "He said, &quot;This is why I told you that no one can come to me unless it is granted to him by the Father.&quot;";
csb[66] = "From that moment many of his disciples turned back and no longer accompanied him.";
csb[67] = "So Jesus said to the Twelve, &quot;You don\'t want to go away too, do you? &quot;";
csb[68] = "Simon Peter answered, &quot;Lord, to whom will we go? You have the words of eternal life.";
csb[69] = "&quot;We have come to believe and know that you are the Holy One of God.&quot;";
csb[70] = "Jesus replied to them, &quot;Didn\'t I choose you, the Twelve? Yet one of you is a devil.&quot;";
csb[71] = "He was referring to Judas, Simon Iscariot\'s son, one of the Twelve, because he was going to betray him.";
