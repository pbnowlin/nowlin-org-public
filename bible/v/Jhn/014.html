csb[1] = "&quot;Don\'t let your heart be troubled. Believe in God; believe also in me.";
csb[2] = "&quot;In my Father\'s house are many rooms; if not, I would have told you. I am going away to prepare a place for you.";
csb[3] = "&quot;If I go away and prepare a place for you, I will come again and take you to myself, so that where I am you may be also.";
csb[4] = "&quot;You know the way to where I am going.&quot;";
csb[5] = "&quot;Lord,&quot; Thomas said, &quot;we don\'t know where you\'re going. How can we know the way? &quot;";
csb[6] = "Jesus told him, &quot;I am the way, the truth, and the life. No one comes to the Father except through me.";
csb[7] = "&quot;If you know me, you will also know my Father. From now on you do know him and have seen him.&quot;";
csb[8] = "&quot;Lord,&quot; said Philip, &quot;show us the Father, and that\'s enough for us.&quot;";
csb[9] = "Jesus said to him, &quot;Have I been among you all this time and you do not know me, Philip? The one who has seen me has seen the Father. How can you say, \'Show us the Father\'?";
csb[10] = "&quot;Don\'t you believe that I am in the Father and the Father is in me? The words I speak to you I do not speak on my own. The Father who lives in me does his works.";
csb[11] = "&quot;Believe me that I am in the Father and the Father is in me. Otherwise, believe because of the works themselves.";
csb[12] = "&quot;Truly I tell you, the one who believes in me will also do the works that I do. And he will do even greater works than these, because I am going to the Father.";
csb[13] = "&quot;Whatever you ask in my name, I will do it so that the Father may be glorified in the Son.";
csb[14] = "&quot;If you ask me anything in my name, I will do it.";
csb[15] = "&quot;If you love me, you will keep my commands.";
csb[16] = "&quot;And I will ask the Father, and he will give you another Counselor to be with you forever.";
csb[17] = "&quot;He is the Spirit of truth. The world is unable to receive him because it doesn\'t see him or know him. But you do know him, because he remains with you and will be in you.";
csb[18] = "&quot;I will not leave you as orphans; I am coming to you.";
csb[19] = "&quot;In a little while the world will no longer see me, but you will see me. Because I live, you will live too.";
csb[20] = "&quot;On that day you will know that I am in my Father, you are in me, and I am in you.";
csb[21] = "&quot;The one who has my commands and keeps them is the one who loves me. And the one who loves me will be loved by my Father. I also will love him and will reveal myself to him.&quot;";
csb[22] = "Judas (not Iscariot) said to him, &quot;Lord, how is it you\'re going to reveal yourself to us and not to the world? &quot;";
csb[23] = "Jesus answered, &quot;If anyone loves me, he will keep my word. My Father will love him, and we will come to him and make our home with him.";
csb[24] = "&quot;The one who doesn\'t love me will not keep my words. The word that you hear is not mine but is from the Father who sent me.";
csb[25] = "&quot;I have spoken these things to you while I remain with you.";
csb[26] = "&quot;But the Counselor, the Holy Spirit, whom the Father will send in my name, will teach you all things and remind you of everything I have told you.";
csb[27] = "&quot;Peace I leave with you. My peace I give to you. I do not give to you as the world gives. Don\'t let your heart be troubled or fearful.";
csb[28] = "&quot;You have heard me tell you, \'I am going away and I am coming to you.\' If you loved me, you would rejoice that I am going to the Father, because the Father is greater than I.";
csb[29] = "&quot;I have told you now before it happens so that when it does happen you may believe.";
csb[30] = "&quot;I will not talk with you much longer, because the ruler of the world is coming. He has no power over me.";
csb[31] = "&quot;On the contrary, so that the world may know that I love the Father, I do as the Father commanded me. &quot;Get up; let\'s leave this place.";
kjv[1] = "Let not your heart be troubled: ye believe in God, believe also in me.";
kjv[2] = "In my Father\'s house are many mansions: if [it were] not [so], I would have told you. I go to prepare a place for you.";
kjv[3] = "And if I go and prepare a place for you, I will come again, and receive you unto myself; that where I am, [there] ye may be also.";
kjv[4] = "And whither I go ye know, and the way ye know.";

kjv[6] = "Jesus saith unto him, I am the way, the truth, and the life: no man cometh unto the Father, but by me.";
kjv[7] = "If ye had known me, ye should have known my Father also: and from henceforth ye know him, and have seen him.";
kjv[8] = "Philip saith unto him, Lord, shew us the Father, and it sufficeth us.";
kjv[9] = "Jesus saith unto him, Have I been so long time with you, and yet hast thou not known me, Philip? he that hath seen me hath seen the Father; and how sayest thou [then], Shew us the Father?";
kjv[10] = "Believest thou not that I am in the Father, and the Father in me? the words that I speak unto you I speak not of myself: but the Father that dwelleth in me, he doeth the works.";
kjv[11] = "Believe me that I [am] in the Father, and the Father in me: or else believe me for the very works\' sake.";
kjv[12] = "Verily, verily, I say unto you, He that believeth on me, the works that I do shall he do also; and greater [works] than these shall he do; because I go unto my Father.";
kjv[13] = "And whatsoever ye shall ask in my name, that will I do, that the Father may be glorified in the Son.";
kjv[14] = "If ye shall ask any thing in my name, I will do [it].";
kjv[15] = "If ye love me, keep my commandments.";
kjv[16] = "And I will pray the Father, and he shall give you another Comforter, that he may abide with you for ever;";
kjv[17] = "[Even] the Spirit of truth; whom the world cannot receive, because it seeth him not, neither knoweth him: but ye know him; for he dwelleth with you, and shall be in you.";
kjv[18] = "I will not leave you comfortless: I will come to you.";
kjv[19] = "Yet a little while, and the world seeth me no more; but ye see me: because I live, ye shall live also.";
kjv[20] = "At that day ye shall know that I [am] in my Father, and ye in me, and I in you.";
kjv[21] = "He that hath my commandments, and keepeth them, he it is that loveth me: and he that loveth me shall be loved of my Father, and I will love him, and will manifest myself to him.";
kjv[22] = "Judas saith unto him, not Iscariot, Lord, how is it that thou wilt manifest thyself unto us, and not unto the world?";
kjv[23] = "Jesus answered and said unto him, If a man love me, he will keep my words: and my Father will love him, and we will come unto him, and make our abode with him.";
kjv[24] = "He that loveth me not keepeth not my sayings: and the word which ye hear is not mine, but the Father\'s which sent me.";
kjv[25] = "These things have I spoken unto you, being [yet] present with you.";
kjv[26] = "But the Comforter, [which is] the Holy Ghost, whom the Father will send in my name, he shall teach you all things, and bring all things to your remembrance, whatsoever I have said unto you.";
kjv[27] = "Peace I leave with you, my peace I give unto you: not as the world giveth, give I unto you. Let not your heart be troubled, neither let it be afraid.";
kjv[28] = "Ye have heard how I said unto you, I go away, and come [again] unto you. If ye loved me, ye would rejoice, because I said, I go unto the Father: for my Father is greater than I.";
kjv[29] = "And now I have told you before it come to pass, that, when it is come to pass, ye might believe.";
kjv[30] = "Hereafter I will not talk much with you: for the prince of this world cometh, and hath nothing in me.";
kjv[31] = "But that the world may know that I love the Father; and as the Father gave me commandment, even so I do. Arise, let us go hence.";

hnv[21] = "One who has my mitzvot, and keeps them, that person is one who loves me. One who loves me will be loved by my Father, and I will love him, and will reveal myself to him.&quot;";
vul[21] = "qui habet mandata mea et servat ea ille est qui diligit me qui autem diligit me diligetur a Patre meo et ego diligam eum et manifestabo ei me ipsum";
rsv[22] = "Judas (not Iscariot) said to him, &quot;Lord, how is it that you will manifest yourself to us, and not to the world?&quot;";
asv[22] = "Judas (not Iscariot) saith unto him, Lord, what is come to pass that thou wilt manifest thyself unto us, and not unto the world?";
yng[22] = "Judas saith to him, (not the Iscariot), `Sir, what hath come to pass, that to us thou are about to manifest thyself, and not to the world?\'";
dby[22] = "Judas, not the Iscariote, says to him, Lord, how is it that thou wilt manifest thyself to us and not to the world?";
web[22] = "Judas, not Iscariot, saith to him, Lord, how is it that thou wilt manifest thyself to us, and not to the world?";
hnv[22] = "Yehudah (not of K\'riot) said to him, &quot;Lord, what has happened that you are about to reveal yourself to us, and not to the world?&quot;";
vul[22] = "dicit ei Iudas non ille Scariotis Domine quid factum est quia nobis manifestaturus es te ipsum et non mundo";
rsv[23] = "Jesus answered him, &quot;If a man loves me, he will keep my word, and my Father will love him, and we will come to him and make our home with him.";
asv[23] = "Jesus answered and said unto him, If a man love me, he will keep my word: and my Father will love him, and we will come unto him, and make our abode with him.";
yng[23] = "Jesus answered and said to him, `If any one may love me, my word he will keep, and my Father will love him, and unto him we will come, and abode with him we will make;";
dby[23] = "Jesus answered and said to him, If any one love me, he will keep my word, and my Father will love him, and we will come to him and make our abode with him.";
web[23] = "Jesus answered and said to him, If a man loveth me, he will keep my words: and my Father will love him, and we will come to him, and make our abode with him.";
hnv[23] = "Yeshua answered him, &quot;If a man loves me, he will keep my word. My Father will love him, and we will come to him, and make our home with him.";
vul[23] = "respondit Iesus et dixit ei si quis diligit me sermonem meum servabit et Pater meus diliget eum et ad eum veniemus et mansiones apud eum faciemus";
rsv[24] = "He who does not love me does not keep my words; and the word which you hear is not mine but the Father\'s who sent me.";
asv[24] = "He that loveth me not keepeth not my words: and the word which ye hear is not mine, but the Father\'s who sent me.";
yng[24] = "he who is not loving me, my words doth not keep; and the word that ye hear is not mine, but the Father\'s who sent me.";
dby[24] = "He that loves me not does not keep my words; and the word which ye hear is not mine, but [that] of the Father who has sent me.";
web[24] = "He that loveth me not, keepeth not my sayings: and the word which ye hear is not mine, but that of the Father who sent me.";
hnv[24] = "He who doesn\'t love me doesn\'t keep my words. The word which you hear isn\'t mine, but the Father\'s who sent me.";
vul[24] = "qui non diligit me sermones meos non servat et sermonem quem audistis non est meus sed eius qui misit me Patris";
rsv[25] = "&quot;These things I have spoken to you, while I am still with you.";
asv[25] = "These things have I spoken unto you, while [yet] abiding with you.";
yng[25] = "`These things I have spoken to you, remaining with you,";
dby[25] = "These things I have said to you, abiding with you;";
web[25] = "These things have I spoken to you, being [yet] present with you.";
hnv[25] = "I have said these things to you, while still living with you.";
vul[25] = "haec locutus sum vobis apud vos manens";
rsv[26] = "But the Counselor, the Holy Spirit, whom the Father will send in my name, he will teach you all things, and bring to your remembrance all that I have said to you.";
asv[26] = "But the Comforter, [even] the Holy Spirit, whom the Father will send in my name, he shall teach you all things, and bring to your remembrance all that I said unto you.";
yng[26] = "and the Comforter, the Holy Spirit, whom the Father will send in my name, he will teach you all things, and remind you of all things that I said to you.";
dby[26] = "but the Comforter, the Holy Spirit, whom the Father will send in my name, *he* shall teach you all things, and will bring to your remembrance all the things which I have said to you.";
web[26] = "But the Comforter, [who is] the Holy Spirit, whom the Father will send in my name, he will teach you all things, and bring all things to your remembrance, whatever I have said to you.";
hnv[26] = "But the Counselor, the Ruach HaKodesh, whom the Father will send in my name, he will teach you all things, and will remind you of all that I said to you.";
vul[26] = "paracletus autem Spiritus Sanctus quem mittet Pater in nomine meo ille vos docebit omnia et suggeret vobis omnia quaecumque dixero vobis";
rsv[27] = "Peace I leave with you; my peace I give to you; not as the world gives do I give to you. Let not your hearts be troubled, neither let them be afraid.";
asv[27] = "Peace I leave with you; my peace I give unto you: not as the world giveth, give I unto you. Let not your heart be troubled, neither let it be fearful.";
yng[27] = "`Peace I leave to you; my peace I give to you, not according as the world doth give do I give to you; let not your heart be troubled, nor let it be afraid;";
dby[27] = "I leave peace with you; I give *my* peace to you: not as the world gives do I give to you. Let not your heart be troubled, neither let it fear.";
web[27] = "Peace I leave with you, my peace I give to you: not as the world giveth, give I to you. Let not your heart be troubled, neither let it be afraid.";
hnv[27] = "Shalom I leave with you. My shalom I give to you; not as the world gives, give I to you. Don\'t let your heart be troubled, neither let it be fearful.";
vul[27] = "pacem relinquo vobis pacem meam do vobis non quomodo mundus dat ego do vobis non turbetur cor vestrum neque formidet";
rsv[28] = "You heard me say to you, \'I go away, and I will come to you.\' If you loved me, you would have rejoiced, because I go to the Father; for the Father is greater than I.";
asv[28] = "Ye heard how I said to you, I go away, and I come unto you. If ye loved me, ye would have rejoiced, because I go unto the Father: for the Father is greater than I.";
yng[28] = "ye heard that I said to you -- I go away, and I come unto you; if ye did love me, ye would have rejoiced that I said -- I go on to the Father, because my Father is greater than I.";
dby[28] = "Ye have heard that I have said unto you, I go away and I am coming to you. If ye loved me ye would rejoice that I go to the Father, for [my] Father is greater than I.";
web[28] = "Ye have heard that I said to you, I go away, and come [again] to you. If ye loved me, ye would rejoice, because I said, I go to the Father: for my Father is greater than I.";
hnv[28] = "You heard how I told you, \'I go away, and I come to you.\' If you loved me, you would have rejoiced, because I said \'I am going to my Father;\' for the Father is greater than I.";
vul[28] = "audistis quia ego dixi vobis vado et venio ad vos si diligeretis me gauderetis utique quia vado ad Patrem quia Pater maior me est";
rsv[29] = "And now I have told you before it takes place, so that when it does take place, you may believe.";
asv[29] = "And now I have told you before it come to pass, that, when it is come to pass, ye may believe.";
yng[29] = "`And now I have said [it] to you before it come to pass, that when it may come to pass, ye may believe;";
dby[29] = "And now I have told you before it comes to pass, that when it shall have come to pass ye may believe.";
web[29] = "And now I have told you before it cometh to pass, that when it hath come to pass, ye may believe.";
hnv[29] = "Now I have told you before it happens so that, when it happens, you may believe.";
vul[29] = "et nunc dixi vobis priusquam fiat ut cum factum fuerit credatis";
rsv[30] = "I will no longer talk much with you, for the ruler of this world is coming. He has no power over me;";
asv[30] = "I will no more speak much with you, for the prince of the world cometh: and he hath nothing in me;";
yng[30] = "I will no more talk much with you, for the ruler of this world doth come, and in me he hath nothing;";
dby[30] = "I will no longer speak much with you, for the ruler of the world comes, and in me he has nothing;";
web[30] = "Hereafter I will not talk much with you: for the prince of this world cometh, and hath nothing in me.";
hnv[30] = "I will no more speak much with you, for the prince of the world comes, and he has nothing in me.";
vul[30] = "iam non multa loquar vobiscum venit enim princeps mundi huius et in me non habet quicquam";
rsv[31] = "but I do as the Father has commanded me, so that the world may know that I love the Father. Rise, let us go hence.";
asv[31] = "but that the world may know that I love the Father, and as the Father gave me commandment, even so I do. Arise, let us go hence.";
yng[31] = "but that the world may know that I love the Father, and according as the Father gave me command so I do; arise, we may go hence.";
dby[31] = "but that the world may know that I love the Father, and as the Father has commanded me, thus I do. Rise up, let us go hence.";
web[31] = "But that the world may know that I love the Father; and as the Father gave me commandment, even so I do. Arise, let us go hence.";
hnv[31] = "But that the world may know that I love the Father, and as the Father commanded me, even so I do. Arise, let us go from here.";
