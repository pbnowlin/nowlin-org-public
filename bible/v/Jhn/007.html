csb[1] = "After this, Jesus traveled in Galilee, since he did not want to travel in Judea because the Jews were trying to kill him.";
csb[2] = "The Jewish Festival of Shelters was near.";
csb[3] = "So his brothers said to him, &quot;Leave here and go to Judea so your disciples can see your works that you are doing.";
csb[4] = "&quot;For no one does anything in secret while he\'s seeking public recognition. If you do these things, show yourself to the world.&quot;";
csb[5] = "(For not even his brothers believed in him.)";
csb[6] = "Jesus told them, &quot;My time has not yet arrived, but your time is always at hand.";
csb[7] = "&quot;The world cannot hate you, but it does hate me because I testify about it -- that its works are evil.";
csb[8] = "&quot;Go up to the festival yourselves. I\'m not going up to this festival, because my time has not yet fully come.&quot;";
csb[9] = "After he had said these things, he stayed in Galilee.";
csb[10] = "After his brothers had gone up to the festival, then he also went up, not openly but secretly.";
csb[11] = "The Jews were looking for him at the festival and saying, &quot;Where is he? &quot;";
csb[12] = "And there was a lot of murmuring about him among the crowds. Some were saying, &quot;He\'s a good man.&quot; Others were saying, &quot;No, on the contrary, he\'s deceiving the people.&quot;";
csb[13] = "Still, nobody was talking publicly about him for fear of the Jews.";
csb[14] = "When the festival was already half over, Jesus went up into the temple and began to teach.";
csb[15] = "Then the Jews were amazed and said, &quot;How is this man so learned, since he hasn\'t been trained? &quot;";
csb[16] = "Jesus answered them, &quot;My teaching isn\'t mine but is from the one who sent me.";
csb[17] = "&quot;If anyone wants to do his will, he will know whether the teaching is from God or whether I am speaking on my own.";
csb[18] = "&quot;The one who speaks on his own seeks his own glory; but he who seeks the glory of the one who sent him is true, and there is no unrighteousness in him.";
csb[19] = "&quot;Didn\'t Moses give you the law? Yet none of you keeps the law. Why are you trying to kill me? &quot;";
csb[20] = "&quot;You have a demon! &quot; the crowd responded. &quot;Who is trying to kill you? &quot;";
csb[21] = "&quot;I performed one work, and you are all amazed,&quot; Jesus answered.";
csb[22] = "&quot;This is why Moses has given you circumcision -- not that it comes from Moses but from the fathers -- and you circumcise a man on the Sabbath.";
csb[23] = "&quot;If a man receives circumcision on the Sabbath so that the law of Moses won\'t be broken, are you angry at me because I made a man entirely well on the Sabbath?";
csb[24] = "&quot;Stop judging according to outward appearances; rather judge according to righteous judgment.&quot;";
csb[25] = "Some of the people of Jerusalem were saying, &quot;Isn\'t this the man they are trying to kill?";
csb[26] = "&quot;Yet, look, he\'s speaking publicly and they\'re saying nothing to him. Can it be true that the authorities know he is the Messiah?";
csb[27] = "&quot;But we know where this man is from. When the Messiah comes, nobody will know where he is from.&quot;";
csb[28] = "As he was teaching in the temple, Jesus cried out, &quot;You know me and you know where I am from. Yet I have not come on my own, but the one who sent me is true. You don\'t know him;";
csb[29] = "&quot;I know him because I am from him, and he sent me.&quot;";
csb[30] = "Then they tried to seize him. Yet no one laid a hand on him because his hour had not yet come.";
csb[31] = "However, many from the crowd believed in him and said, &quot;When the Messiah comes, he won\'t perform more signs than this man has done, will he? &quot;";
csb[32] = "The Pharisees heard the crowd murmuring these things about him, and so the chief priests and the Pharisees sent servants to arrest him.";
csb[33] = "Then Jesus said, &quot;I am only with you for a short time. Then I\'m going to the one who sent me.";
csb[34] = "&quot;You will look for me, but you will not find me; and where I am, you cannot come.&quot;";
csb[35] = "Then the Jews said to one another, &quot;Where does he intend to go so we won\'t find him? He doesn\'t intend to go to the Jewish people dispersed among the Greeks and teach the Greeks, does he?";
csb[36] = "&quot;What is this remark he made: \'You will look for me, and you will not find me; and where I am, you cannot come\'? &quot;";
csb[37] = "On the last and most important day of the festival, Jesus stood up and cried out, &quot;If anyone is thirsty, let him come to me and drink.";
csb[38] = "&quot;The one who believes in me, as the Scripture has said, will have streams of living water flow from deep within him.&quot;";
csb[39] = "He said this about the Spirit. Those who believed in Jesus were going to receive the Spirit, for the Spirit had not yet been given because Jesus had not yet been glorified.";
csb[40] = "When some from the crowd heard these words, they said, &quot;This truly is the Prophet.&quot;";
csb[41] = "Others said, &quot;This is the Messiah.&quot; But some said, &quot;Surely the Messiah doesn\'t come from Galilee, does he?";
csb[42] = "&quot;Doesn\'t the Scripture say that the Messiah comes from David\'s offspring and from the town of Bethlehem, where David lived? &quot;";
csb[43] = "So the crowd was divided because of him.";
csb[44] = "Some of them wanted to seize him, but no one laid hands on him.";
csb[45] = "Then the servants came to the chief priests and Pharisees, who asked them, &quot;Why didn\'t you bring him? &quot;";
csb[46] = "The servants answered, &quot;No man ever spoke like this! &quot;";
csb[47] = "Then the Pharisees responded to them: &quot;Are you fooled too?";
csb[48] = "&quot;Have any of the rulers or Pharisees believed in him?";
csb[49] = "&quot;But this crowd, which doesn\'t know the law, is accursed.&quot;";
csb[50] = "Nicodemus -- the one who came to him previously and who was one of them -- said to them,";
csb[51] = "&quot;Our law doesn\'t judge a man before it hears from him and knows what he\'s doing, does it? &quot;";
csb[52] = "&quot;You aren\'t from Galilee too, are you? &quot; they replied. &quot;Investigate and you will see that no prophet arises from Galilee.&quot;";
