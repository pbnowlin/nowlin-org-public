csb[1] = "Then Pilate took Jesus and had him flogged.";
csb[2] = "The soldiers also twisted together a crown of thorns, put it on his head, and clothed him in a purple robe.";
csb[3] = "And they kept coming up to him and saying, &quot;Hail, King of the Jews! &quot; and were slapping his face.";
csb[4] = "Pilate went outside again and said to them, &quot;Look, I\'m bringing him out to you to let you know I find no grounds for charging him.&quot;";
csb[5] = "Then Jesus came out wearing the crown of thorns and the purple robe. Pilate said to them, &quot;Here is the man! &quot;";
csb[6] = "When the chief priests and the temple servants saw him, they shouted, &quot;Crucify! Crucify! &quot; Pilate responded, &quot;Take him and crucify him yourselves, since I find no grounds for charging him.&quot;";
csb[7] = "&quot;We have a law,&quot; the Jews replied to him, &quot;and according to that law he ought to die, because he made himself the Son of God.&quot;";
csb[8] = "When Pilate heard this statement, he was more afraid than ever.";
csb[9] = "He went back into the headquarters and asked Jesus, &quot;Where are you from? &quot; But Jesus did not give him an answer.";
csb[10] = "So Pilate said to him, &quot;Do you refuse to speak to me? Don\'t you know that I have the authority to release you and the authority to crucify you? &quot;";
csb[11] = "&quot;You would have no authority over me at all,&quot; Jesus answered him, &quot;if it hadn\'t been given you from above. This is why the one who handed me over to you has the greater sin.&quot;";
csb[12] = "From that moment Pilate kept trying to release him. But the Jews shouted, &quot;If you release this man, you are not Caesar\'s friend. Anyone who makes himself a king opposes Caesar! &quot;";
csb[13] = "When Pilate heard these words, he brought Jesus outside. He sat down on the judge\'s seat in a place called the Stone Pavement (but in Aramaic, Gabbatha).";
csb[14] = "It was the preparation day for the Passover, and it was about noon. Then he told the Jews, &quot;Here is your king! &quot;";
csb[15] = "They shouted, &quot;Take him away! Take him away! Crucify him! &quot; Pilate said to them, &quot;Should I crucify your king? &quot; &quot;We have no king but Caesar! &quot; the chief priests answered.";
csb[16] = "Then he handed him over to be crucified. Then they took Jesus away.";
csb[17] = "Carrying the cross by himself, he went out to what is called Place of the Skull, which in Aramaic is called Golgotha.";
csb[18] = "There they crucified him and two others with him, one on either side, with Jesus in the middle.";
csb[19] = "Pilate also had a sign made and put on the cross. It said: JESUS OF NAZARETH, THE KING OF THE JEWS.";
csb[20] = "Many of the Jews read this sign, because the place where Jesus was crucified was near the city, and it was written in Aramaic, Latin, and Greek.";
csb[21] = "So the chief priests of the Jews said to Pilate, &quot;Don\'t write, \'The King of the Jews,\' but that he said, \'I am the King of the Jews.\' &quot;";
csb[22] = "Pilate replied, &quot;What I have written, I have written.&quot;";
csb[23] = "When the soldiers crucified Jesus, they took his clothes and divided them into four parts, a part for each soldier. They also took the tunic, which was seamless, woven in one piece from the top.";
csb[24] = "So they said to one another, &quot;Let\'s not tear it, but cast lots for it, to see who gets it.&quot; This happened that the Scripture might be fulfilled that says: They divided my clothes among themselves, and they cast lots for my clothing. This is what the soldiers did.";
csb[25] = "Standing by the cross of Jesus were his mother, his mother\'s sister, Mary the wife of Clopas, and Mary Magdalene.";
csb[26] = "When Jesus saw his mother and the disciple he loved standing there, he said to his mother, &quot;Woman, here is your son.&quot;";
csb[27] = "Then he said to the disciple, &quot;Here is your mother.&quot; And from that hour the disciple took her into his home.";
csb[28] = "After this, when Jesus knew that everything was now finished that the Scripture might be fulfilled, he said, &quot;I\'m thirsty.&quot;";
csb[29] = "A jar full of sour wine was sitting there; so they fixed a sponge full of sour wine on a hyssop branch and held it up to his mouth.";
csb[30] = "When Jesus had received the sour wine, he said, &quot;It is finished.&quot; Then bowing his head, he gave up his spirit.";
csb[31] = "Since it was the preparation day, the Jews did not want the bodies to remain on the cross on the Sabbath (for that Sabbath was a special day). They requested that Pilate have the men\'s legs broken and that their bodies be taken away.";
csb[32] = "So the soldiers came and broke the legs of the first man and of the other one who had been crucified with him.";
csb[33] = "When they came to Jesus, they did not break his legs since they saw that he was already dead.";
csb[34] = "But one of the soldiers pierced his side with a spear, and at once blood and water came out.";
csb[35] = "He who saw this has testified so that you also may believe. His testimony is true, and he knows he is telling the truth.";
csb[36] = "For these things happened so that the Scripture would be fulfilled: Not one of his bones will be broken.";
csb[37] = "Also, another Scripture says: They will look at the one they pierced.";
csb[38] = "After this, Joseph of Arimathea, who was a disciple of Jesus -- but secretly because of his fear of the Jews -- asked Pilate that he might remove Jesus\'s body. Pilate gave him permission; so he came and took his body away.";
csb[39] = "Nicodemus (who had previously come to him at night) also came, bringing a mixture of about seventy-five pounds of myrrh and aloes.";
csb[40] = "They took Jesus\'s body and wrapped it in linen cloths with the fragrant spices, according to the burial custom of the Jews.";
csb[41] = "There was a garden in the place where he was crucified. A new tomb was in the garden; no one had yet been placed in it.";
csb[42] = "They placed Jesus there because of the Jewish day of preparation and since the tomb was nearby.";

asv[19] = "And Pilate wrote a title also, and put it on the cross. And there was written, JESUS OF NAZARETH, THE KING OF THE JEWS.";
yng[19] = "And Pilate also wrote a title, and put [it] on the cross, and it was written, `Jesus the Nazarene, the king of the Jews;\'";
dby[19] = "And Pilate wrote a title also and put it on the cross. But there was written: Jesus the Nazaraean, the King of the Jews.";
web[19] = "And Pilate wrote a title, and put [it] on the cross. And the writing was, JESUS OF NAZARETH THE KING OF THE JEWS.";
hnv[19] = "Pilate wrote a title also, and put it on the cross. There was written, &quot;YESHUA OF NATZERET, THE KING OF THE YEHUDIM.&quot;";
vul[19] = "scripsit autem et titulum Pilatus et posuit super crucem erat autem scriptum Iesus Nazarenus rex Iudaeorum";
kjv[20] = "This title then read many of the Jews: for the place where Jesus was crucified was nigh to the city: and it was written in Hebrew, [and] Greek, [and] Latin.";
rsv[20] = "Many of the Jews read this title, for the place where Jesus was crucified was near the city; and it was written in Hebrew, in Latin, and in Greek.";
asv[20] = "This title therefore read many of the Jews, for the place where Jesus was crucified was nigh to the city; and it was written in Hebrew, [and] in Latin, [and] in Greek.";
yng[20] = "this title, therefore, read many of the Jews, because the place was nigh to the city where Jesus was crucified, and it was having been written in Hebrew, in Greek, in Roman.";
dby[20] = "This title therefore many of the Jews read, for the place of the city where Jesus was crucified was near; and it was written in Hebrew, Greek, Latin.";
web[20] = "Many of the Jews then read this title: for the place where Jesus was crucified was nigh to the city: and it was written in Hebrew, Greek, [and] Latin.";
hnv[20] = "Therefore many of the Yehudim read this title, for the place where Yeshua was crucified was near the city; and it was written in Hebrew, in Latin, and in Yevanit.";
vul[20] = "hunc ergo titulum multi legerunt Iudaeorum quia prope civitatem erat locus ubi crucifixus est Iesus et erat scriptum hebraice graece et latine";

asv[21] = "The chief priests of the Jews therefore said to Pilate, Write not, The King of the Jews; but, that he said, I am King of the Jews.";
yng[21] = "The chief priests of the Jews said, therefore, to Pilate, `Write not -- The king of the Jews, but that one said, I am king of the Jews;\'";
dby[21] = "The chief priests of the Jews therefore said to Pilate, Do not write, The king of the Jews, but that *he* said, I am king of the Jews.";
web[21] = "Then said the chief priests of the Jews to Pilate, Write not, The King of the Jews; but that he said, I am King of the Jews.";

yng[24] = "they said, therefore, to one another, `We may not rend it, but cast a lot for it, whose it shall be;\' that the Writing might be fulfilled, that is saying, `They divided my garments to themselves, and upon my raiment they did cast a lot;\' the soldiers, therefore, indeed, did these things.";
