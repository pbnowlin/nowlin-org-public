csb[1] = "When Jesus learned that the Pharisees had heard he was making and baptizing more disciples than John";
csb[2] = "(though Jesus himself was not baptizing, but his disciples were),";
csb[3] = "he left Judea and went again to Galilee.";
csb[4] = "He had to travel through Samaria;";
csb[5] = "so he came to a town of Samaria called Sychar near the property that Jacob had given his son Joseph.";
csb[6] = "Jacob\'s well was there, and Jesus, worn out from his journey, sat down at the well. It was about noon.";
csb[7] = "A woman of Samaria came to draw water. &quot;Give me a drink,&quot; Jesus said to her,";
csb[8] = "because his disciples had gone into town to buy food.";
csb[9] = "&quot;How is it that you, a Jew, ask for a drink from me, a Samaritan woman? &quot; she asked him. For Jews do not associate with Samaritans.";
csb[10] = "Jesus answered, &quot;If you knew the gift of God, and who is saying to you, \'Give me a drink,\' you would ask him, and he would give you living water.&quot;";
csb[11] = "&quot;Sir,&quot; said the woman, &quot;you don\'t even have a bucket, and the well is deep. So where do you get this \'living water\'?";
csb[12] = "&quot;You aren\'t greater than our father Jacob, are you? He gave us the well and drank from it himself, as did his sons and livestock.&quot;";
csb[13] = "Jesus said, &quot;Everyone who drinks from this water will get thirsty again.";
csb[14] = "&quot;But whoever drinks from the water that I will give him will never get thirsty again. In fact, the water I will give him will become a well of water springing up in him for eternal life.&quot;";
csb[15] = "&quot;Sir,&quot; the woman said to him, &quot;give me this water so that I won\'t get thirsty and come here to draw water.&quot;";
csb[16] = "&quot;Go call your husband,&quot; he told her, &quot;and come back here.&quot;";
csb[17] = "&quot;I don\'t have a husband,&quot; she answered. &quot;You have correctly said, \'I don\'t have a husband,\' &quot; Jesus said.";
csb[18] = "&quot;For you\'ve had five husbands, and the man you now have is not your husband. What you have said is true.&quot;";
csb[19] = "&quot;Sir,&quot; the woman replied, &quot;I see that you are a prophet.";
csb[20] = "&quot;Our fathers worshiped on this mountain, but you Jews say that the place to worship is in Jerusalem.&quot;";
csb[21] = "Jesus told her, &quot;Believe me, woman, an hour is coming when you will worship the Father neither on this mountain nor in Jerusalem.";
csb[22] = "&quot;You Samaritans worship what you do not know. We worship what we do know, because salvation is from the Jews.";
csb[23] = "&quot;But an hour is coming, and is now here, when the true worshipers will worship the Father in Spirit and in truth. Yes, the Father wants such people to worship him.";
csb[24] = "&quot;God is spirit, and those who worship him must worship in Spirit and in truth.&quot;";
csb[25] = "The woman said to him, &quot;I know that the Messiah is coming&quot; (who is called Christ). &quot;When he comes, he will explain everything to us.&quot;";
csb[26] = "Jesus told her, &quot;I, the one speaking to you, am he.&quot;";
csb[27] = "Just then his disciples arrived, and they were amazed that he was talking with a woman. Yet no one said, &quot;What do you want? &quot; or &quot;Why are you talking with her? &quot;";
csb[28] = "Then the woman left her water jar, went into town, and told the people,";
csb[29] = "&quot;Come, see a man who told me everything I ever did. Could this be the Messiah? &quot;";
csb[30] = "They left the town and made their way to him.";
csb[31] = "In the meantime the disciples kept urging him, &quot;Rabbi, eat something.&quot;";
csb[32] = "But he said, &quot;I have food to eat that you don\'t know about.&quot;";
csb[33] = "The disciples said to one another, &quot;Could someone have brought him something to eat? &quot;";
csb[34] = "&quot;My food is to do the will of him who sent me and to finish his work,&quot; Jesus told them.";
csb[35] = "&quot;Don\'t you say, \'There are still four more months, and then comes the harvest\'? Listen to what I\'m telling you: Open your eyes and look at the fields, because they are ready for harvest.";
csb[36] = "&quot;The reaper is already receiving pay and gathering fruit for eternal life, so that the sower and reaper can rejoice together.";
csb[37] = "&quot;For in this case the saying is true: \'One sows and another reaps.\'";
csb[38] = "&quot;I sent you to reap what you didn\'t labor for; others have labored, and you have benefited from their labor.&quot;";
csb[39] = "Now many Samaritans from that town believed in him because of what the woman said when she testified, &quot;He told me everything I ever did.&quot;";
csb[40] = "So when the Samaritans came to him, they asked him to stay with them, and he stayed there two days.";
csb[41] = "Many more believed because of what he said.";
csb[42] = "And they told the woman, &quot;We no longer believe because of what you said, since we have heard for ourselves and know that this really is the Savior of the world.&quot;";
csb[43] = "After two days he left there for Galilee.";
csb[44] = "(Jesus himself had testified that a prophet has no honor in his own country.)";
csb[45] = "When they entered Galilee, the Galileans welcomed him because they had seen everything he did in Jerusalem during the festival. For they also had gone to the festival.";
csb[46] = "He went again to Cana of Galilee, where he had turned the water into wine. There was a certain royal official whose son was ill at Capernaum.";
csb[47] = "When this man heard that Jesus had come from Judea into Galilee, he went to him and pleaded with him to come down and heal his son, since he was about to die.";
csb[48] = "Jesus told him, &quot;Unless you people see signs and wonders, you will not believe.&quot;";
csb[49] = "&quot;Sir,&quot; the official said to him, &quot;come down before my boy dies.&quot;";
csb[50] = "&quot;Go,&quot; Jesus told him, &quot;your son will live.&quot; The man believed what Jesus said to him and departed.";
csb[51] = "While he was still going down, his servants met him saying that his boy was alive.";
csb[52] = "He asked them at what time he got better. &quot;Yesterday at one in the afternoon the fever left him,&quot; they answered.";
csb[53] = "The father realized this was the very hour at which Jesus had told him, &quot;Your son will live.&quot; So he himself believed, along with his whole household.";
csb[54] = "Now this was also the second sign Jesus performed after he came from Judea to Galilee.";
