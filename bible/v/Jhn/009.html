csb[1] = "As he was passing by, he saw a man blind from birth.";
csb[2] = "His disciples asked him: &quot;Rabbi, who sinned, this man or his parents, that he was born blind? &quot;";
csb[3] = "&quot;Neither this man nor his parents sinned,&quot; Jesus answered. &quot;This came about so that God\'s works might be displayed in him.";
csb[4] = "&quot;We must do the works of him who sent me while it is day. Night is coming when no one can work.";
csb[5] = "&quot;As long as I am in the world, I am the light of the world.&quot;";
csb[6] = "After he said these things he spit on the ground, made some mud from the saliva, and spread the mud on his eyes.";
csb[7] = "&quot;Go,&quot; he told him, &quot;wash in the pool of Siloam&quot; (which means &quot;Sent&quot;). So he left, washed, and came back seeing.";
csb[8] = "His neighbors and those who had seen him before as a beggar said, &quot;Isn\'t this the one who used to sit begging? &quot;";
csb[9] = "Some said, &quot;He\'s the one.&quot; Others were saying, &quot;No, but he looks like him.&quot; He kept saying, &quot;I\'m the one.&quot;";
csb[10] = "So they asked him, &quot;Then how were your eyes opened? &quot;";
csb[11] = "He answered, &quot;The man called Jesus made mud, spread it on my eyes, and told me, \'Go to Siloam and wash.\' So when I went and washed I received my sight.&quot;";
csb[12] = "&quot;Where is he? &quot; they asked. &quot;I don\'t know,&quot; he said.";
csb[13] = "They brought the man who used to be blind to the Pharisees.";
csb[14] = "The day that Jesus made the mud and opened his eyes was a Sabbath.";
csb[15] = "Then the Pharisees asked him again how he received his sight. &quot;He put mud on my eyes,&quot; he told them. &quot;I washed and I can see.&quot;";
csb[16] = "Some of the Pharisees said, &quot;This man is not from God, because he doesn\'t keep the Sabbath.&quot; But others were saying, &quot;How can a sinful man perform such signs? &quot; And there was a division among them.";
csb[17] = "Again they asked the blind man, &quot;What do you say about him, since he opened your eyes? &quot; &quot;He\'s a prophet,&quot; he said.";
csb[18] = "The Jews did not believe this about him -- that he was blind and received sight -- until they summoned the parents of the one who had received his sight.";
csb[19] = "They asked them, &quot;Is this your son, the one you say was born blind? How then does he now see? &quot;";
csb[20] = "&quot;We know this is our son and that he was born blind,&quot; his parents answered.";
csb[21] = "&quot;But we don\'t know how he now sees, and we don\'t know who opened his eyes. Ask him; he\'s of age. He will speak for himself.&quot;";
csb[22] = "His parents said these things because they were afraid of the Jews, since the Jews had already agreed that if anyone confessed him as the Messiah, he would be banned from the synagogue.";
csb[23] = "This is why his parents said, &quot;He\'s of age; ask him.&quot;";
csb[24] = "So a second time they summoned the man who had been blind and told him, &quot;Give glory to God. We know that this man is a sinner.&quot;";
csb[25] = "He answered, &quot;Whether or not he\'s a sinner, I don\'t know. One thing I do know: I was blind, and now I can see! &quot;";
csb[26] = "Then they asked him, &quot;What did he do to you? How did he open your eyes? &quot;";
csb[27] = "&quot;I already told you,&quot; he said, &quot;and you didn\'t listen. Why do you want to hear it again? You don\'t want to become his disciples too, do you? &quot;";
csb[28] = "They ridiculed him: &quot;You\'re that man\'s disciple, but we\'re Moses\'s disciples.";
csb[29] = "&quot;We know that God has spoken to Moses. But this man -- we don\'t know where he\'s from.&quot;";
csb[30] = "&quot;This is an amazing thing! &quot; the man told them. &quot;You don\'t know where he is from, and yet he opened my eyes.";
csb[31] = "&quot;We know that God doesn\'t listen to sinners, but if anyone is God-fearing and does his will, he listens to him.";
csb[32] = "&quot;Throughout history no one has ever heard of someone opening the eyes of a person born blind.";
csb[33] = "&quot;If this man were not from God, he wouldn\'t be able to do anything.&quot;";
csb[34] = "&quot;You were born entirely in sin,&quot; they replied, &quot;and are you trying to teach us? &quot; Then they threw him out.";
csb[35] = "Jesus heard that they had thrown the man out, and when he found him, he asked, &quot;Do you believe in the Son of Man? &quot;";
csb[36] = "&quot;Who is he, Sir, that I may believe in him? &quot; he asked.";
csb[37] = "Jesus answered, &quot;You have seen him; in fact, he is the one speaking with you.&quot;";
csb[38] = "&quot;I believe, Lord! &quot; he said, and he worshiped him.";
csb[39] = "Jesus said, &quot;I came into this world for judgment, in order that those who do not see will see and those who do see will become blind.&quot;";
csb[40] = "Some of the Pharisees who were with him heard these things and asked him, &quot;We aren\'t blind too, are we? &quot;";
csb[41] = "&quot;If you were blind,&quot; Jesus told them, &quot;you wouldn\'t have sin. But now that you say, \'We see,\' your sin remains.";
