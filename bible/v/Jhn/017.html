csb[1] = "Jesus spoke these things, looked up to heaven, and said: &quot;Father, the hour has come. Glorify your Son so that the Son may glorify you,";
csb[2] = "&quot;since you gave him authority over all flesh, so that he may give eternal life to everyone you have given him.";
csb[3] = "&quot;This is eternal life: that they may know you, the only true God, and the one you have sent -- Jesus Christ.";
csb[4] = "&quot;I have glorified you on the earth by completing the work you gave me to do.";
csb[5] = "&quot;Now, Father, glorify me in your presence with that glory I had with you before the world existed.";
csb[6] = "&quot;I have revealed your name to the people you gave me from the world. They were yours, you gave them to me, and they have kept your word.";
csb[7] = "&quot;Now they know that everything you have given is from you,";
csb[8] = "&quot;because I have given them the words you gave me. They have received them and have known for certain that I came from you. They have believed that you sent me.";
csb[9] = "&quot;I pray for them. I am not praying for the world but for those you have given me, because they are yours.";
csb[10] = "&quot;Everything I have is yours, and everything you have is mine, and I am glorified in them.";
csb[11] = "&quot;I am no longer in the world, but they are in the world, and I am coming to you. Holy Father, protect them by your name that you have given me, so that they may be one as we are one.";
csb[12] = "&quot;While I was with them, I was protecting them by your name that you have given me. I guarded them and not one of them is lost, except the son of destruction, so that the Scripture may be fulfilled.";
csb[13] = "&quot;Now I am coming to you, and I speak these things in the world so that they may have my joy completed in them.";
csb[14] = "&quot;I have given them your word. The world hated them because they are not of the world, just as I am not of the world.";
csb[15] = "&quot;I am not praying that you take them out of the world but that you protect them from the evil one.";
csb[16] = "&quot;They are not of the world, just as I am not of the world.";
csb[17] = "&quot;Sanctify them by the truth; your word is truth.";
csb[18] = "&quot;As you sent me into the world, I also have sent them into the world.";
csb[19] = "&quot;I sanctify myself for them, so that they also may be sanctified by the truth.";
csb[20] = "&quot;I pray not only for these, but also for those who believe in me through their word.";
csb[21] = "&quot;May they all be one, as you, Father, are in me and I am in you. May they also be in us, so that the world may believe you sent me.";
csb[22] = "&quot;I have given them the glory you have given me, so that they may be one as we are one.";
csb[23] = "&quot;I am in them and you are in me, so that they may be made completely one, that the world may know you have sent me and have loved them as you have loved me.";
csb[24] = "&quot;Father, I want those you have given me to be with me where I am, so that they will see my glory, which you have given me because you loved me before the world\'s foundation.";
csb[25] = "&quot;Righteous Father, the world has not known you. However, I have known you, and they have known that you sent me.";
csb[26] = "&quot;I made your name known to them and will continue to make it known, so that the love you have loved me with may be in them and I may be in them.&quot;";

vul[23] = "ego in eis et tu in me ut sint consummati in unum et cognoscat mundus quia tu me misisti et dilexisti eos sicut me dilexisti";
