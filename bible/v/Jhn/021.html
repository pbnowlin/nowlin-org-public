csb[1] = "After this, Jesus revealed himself again to his disciples by the Sea of Tiberias. He revealed himself in this way:";
csb[2] = "Simon Peter, Thomas (called &quot;Twin&quot;), Nathanael from Cana of Galilee, Zebedee\'s sons, and two others of his disciples were together.";
csb[3] = "&quot;I\'m going fishing,&quot; Simon Peter said to them. &quot;We\'re coming with you,&quot; they told him. They went out and got into the boat, but that night they caught nothing.";
csb[4] = "When daybreak came, Jesus stood on the shore, but the disciples did not know it was Jesus.";
csb[5] = "&quot;Friends,&quot; Jesus called to them, &quot;you don\'t have any fish, do you? &quot; &quot;No,&quot; they answered.";
csb[6] = "&quot;Cast the net on the right side of the boat,&quot; he told them, &quot;and you\'ll find some.&quot; So they did, and they were unable to haul it in because of the large number of fish.";
csb[7] = "The disciple, the one Jesus loved, said to Peter, &quot;It is the Lord! &quot; When Simon Peter heard that it was the Lord, he tied his outer clothing around him (for he had taken it off) and plunged into the sea.";
csb[8] = "Since they were not far from land (about a hundred yards away), the other disciples came in the boat, dragging the net full of fish.";
csb[9] = "When they got out on land, they saw a charcoal fire there, with fish lying on it, and bread.";
csb[10] = "&quot;Bring some of the fish you\'ve just caught,&quot; Jesus told them.";
csb[11] = "So Simon Peter climbed up and hauled the net ashore, full of large fish -- 153 of them. Even though there were so many, the net was not torn.";
csb[12] = "&quot;Come and have breakfast,&quot; Jesus told them. None of the disciples dared ask him, &quot;Who are you? &quot; because they knew it was the Lord.";
csb[13] = "Jesus came, took the bread, and gave it to them. He did the same with the fish.";
csb[14] = "This was now the third time Jesus appeared to the disciples after he was raised from the dead.";
csb[15] = "When they had eaten breakfast, Jesus asked Simon Peter, &quot;Simon, son of John, do you love me more than these? &quot; &quot;Yes, Lord,&quot; he said to him, &quot;you know that I love you.&quot; &quot;Feed my lambs,&quot; he told him.";
csb[16] = "A second time he asked him, &quot;Simon, son of John, do you love me? &quot; &quot;Yes, Lord,&quot; he said to him, &quot;you know that I love you.&quot; &quot;Shepherd my sheep,&quot; he told him.";
csb[17] = "He asked him the third time, &quot;Simon, son of John, do you love me? &quot; Peter was grieved that he asked him the third time, &quot;Do you love me? &quot; He said, &quot;Lord, you know everything; you know that I love you.&quot; &quot;Feed my sheep,&quot; Jesus said.";
csb[18] = "&quot;Truly I tell you, when you were younger, you would tie your belt and walk wherever you wanted. But when you grow old, you will stretch out your hands and someone else will tie you and carry you where you don\'t want to go.&quot;";
csb[19] = "He said this to indicate by what kind of death Peter would glorify God. After saying this, he told him, &quot;Follow me.&quot;";
csb[20] = "So Peter turned around and saw the disciple Jesus loved following them, the one who had leaned back against Jesus at the supper and asked, &quot;Lord, who is the one that\'s going to betray you? &quot;";
csb[21] = "When Peter saw him, he said to Jesus, &quot;Lord, what about him? &quot;";
csb[22] = "&quot;If I want him to remain until I come,&quot; Jesus answered, &quot;what is that to you? As for you, follow me.&quot;";
csb[23] = "So this rumor spread to the brothers and sisters that this disciple would not die. Yet Jesus did not tell him that he would not die, but, &quot;If I want him to remain until I come, what is that to you? &quot;";
csb[24] = "This is the disciple who testifies to these things and who wrote them down. We know that his testimony is true.";
csb[25] = "And there are also many other things that Jesus did, which, if every one of them were written down, I suppose not even the world itself could contain the books that would be written.";

yng[18] = "verily, verily, I say to thee, When thou wast younger, thou wast girding thyself and wast walking whither thou didst will, but when thou mayest be old, thou shalt stretch forth thy hands, and another will gird thee, and shall carry [thee] whither thou dost not will;\'";
dby[18] = "Verily, verily, I say to thee, When thou wast young, thou girdedst thyself, and walkedst where thou desiredst; but when thou shalt be old, thou shalt stretch forth thy hands, and another shall gird thee, and bring thee where thou dost not desire.";
web[18] = "Verily, verily, I say to thee, When thou wast young, thou didst gird thyself and walk whither thou wouldest: but when thou shalt be old, thou shalt stretch forth thy hands, and another shall gird thee, and carry [thee] whither thou wouldst not.";

vul[18] = "amen amen dico tibi cum esses iunior cingebas te et ambulabas ubi volebas cum autem senueris extendes manus tuas et alius te cinget et ducet quo non vis";

kjv[20] = "Then Peter, turning about, seeth the disciple whom Jesus loved following; which also leaned on his breast at supper, and said, Lord, which is he that betrayeth thee?";
rsv[20] = "Peter turned and saw following them the disciple whom Jesus loved, who had lain close to his breast at the supper and had said, &quot;Lord, who is it that is going to betray you?&quot;";
asv[20] = "Peter, turning about, seeth the disciple whom Jesus loved following; who also leaned back on his breast at the supper, and said, Lord, who is he that betrayeth thee?";
yng[20] = "And Peter having turned about doth see the disciple whom Jesus was loving following, (who also reclined in the supper on his breast, and said, `Sir, who is he who is delivering thee up?\')";
dby[20] = "Peter, turning round, sees the disciple whom Jesus loved following, who also leaned at supper on his breast, and said, Lord, who is it that delivers thee up?";

vul[20] = "conversus Petrus vidit illum discipulum quem diligebat Iesus sequentem qui et recubuit in cena super pectus eius et dixit Domine quis est qui tradit te";

yng[21] = "Peter having seen this one, saith to Jesus, `Lord, and what of this one?\'";

kjv[22] = "Jesus saith unto him, If I will that he tarry till I come, what [is that] to thee? follow thou me.";

dby[23] = "This word therefore went out among the brethren, That disciple does not die. And Jesus did not say to him, He does not die; but, If I will that he abide until I come, what [is that] to thee?";
