csb[1] = "On the first day of the week Mary Magdalene came to the tomb early, while it was still dark. She saw that the stone had been removed from the tomb.";
csb[2] = "So she went running to Simon Peter and to the other disciple, the one Jesus loved, and said to them, &quot;They\'ve taken the Lord out of the tomb, and we don\'t know where they\'ve put him! &quot;";
csb[3] = "At that, Peter and the other disciple went out, heading for the tomb.";
csb[4] = "The two were running together, but the other disciple outran Peter and got to the tomb first.";
csb[5] = "Stooping down, he saw the linen cloths lying there, but he did not go in.";
csb[6] = "Then, following him, Simon Peter also came. He entered the tomb and saw the linen cloths lying there.";
csb[7] = "The wrapping that had been on his head was not lying with the linen cloths but was folded up in a separate place by itself.";
csb[8] = "The other disciple, who had reached the tomb first, then also went in, saw, and believed.";
csb[9] = "For they did not yet understand the Scripture that he must rise from the dead.";
csb[10] = "Then the disciples returned to the place where they were staying.";
csb[11] = "But Mary stood outside the tomb, crying. As she was crying, she stooped to look into the tomb.";
csb[12] = "She saw two angels in white sitting where Jesus\'s body had been lying, one at the head and the other at the feet.";
csb[13] = "They said to her, &quot;Woman, why are you crying? &quot; &quot;Because they\'ve taken away my Lord,&quot; she told them, &quot;and I don\'t know where they\'ve put him.&quot;";
csb[14] = "Having said this, she turned around and saw Jesus standing there, but she did not know it was Jesus.";
csb[15] = "&quot;Woman,&quot; Jesus said to her, &quot;why are you crying? Who is it that you\'re seeking? &quot; Supposing he was the gardener, she replied, &quot;Sir, if you\'ve carried him away, tell me where you\'ve put him, and I will take him away.&quot;";
csb[16] = "Jesus said to her, &quot;Mary.&quot; Turning around, she said to him in Aramaic, &quot;Rabboni! &quot; -- which means &quot;Teacher.&quot;";
csb[17] = "&quot;Don\'t cling to me,&quot; Jesus told her, &quot;since I have not yet ascended to the Father. But go to my brothers and tell them that I am ascending to my Father and your Father, to my God and your God.&quot;";
csb[18] = "Mary Magdalene went and announced to the disciples, &quot;I have seen the Lord! &quot; And she told them what he had said to her.";
csb[19] = "When it was evening of that first day of the week, the disciples were gathered together with the doors locked because they feared the Jews. Jesus came, stood among them, and said to them, &quot;Peace be with you.&quot;";
csb[20] = "Having said this, he showed them his hands and his side. So the disciples rejoiced when they saw the Lord.";
csb[21] = "Jesus said to them again, &quot;Peace to you. As the Father has sent me, I also send you.&quot;";
csb[22] = "After saying this, he breathed on them and said, &quot;Receive the Holy Spirit.";
csb[23] = "&quot;If you forgive the sins of any, they are forgiven them; if you retain the sins of any, they are retained.&quot;";
csb[24] = "But Thomas (called &quot;Twin&quot;), one of the Twelve, was not with them when Jesus came.";
csb[25] = "So the other disciples were telling him, &quot;We\'ve seen the Lord! &quot; But he said to them, &quot;If I don\'t see the mark of the nails in his hands, put my finger into the mark of the nails, and put my hand into his side, I will never believe.&quot;";
csb[26] = "A week later his disciples were indoors again, and Thomas was with them. Even though the doors were locked, Jesus came and stood among them and said, &quot;Peace be with you.&quot;";
csb[27] = "Then he said to Thomas, &quot;Put your finger here and look at my hands. Reach out your hand and put it into my side. Don\'t be faithless, but believe.&quot;";
csb[28] = "Thomas responded to him, &quot;My Lord and my God! &quot;";
csb[29] = "Jesus said, &quot;Because you have seen me, you have believed. Blessed are those who have not seen and yet believe.&quot;";
csb[30] = "Jesus performed many other signs in the presence of his disciples that are not written in this book.";
csb[31] = "But these are written so that you may believe that Jesus is the Messiah, the Son of God, and that by believing you may have life in his name.";
