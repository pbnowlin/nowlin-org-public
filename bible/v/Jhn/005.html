csb[1] = "After this, a Jewish festival took place, and Jesus went up to Jerusalem.";
csb[2] = "By the Sheep Gate in Jerusalem there is a pool, called Bethesda in Aramaic, which has five colonnades.";
csb[3] = "Within these lay a large number of the disabled -- blind, lame, and paralyzed.";
csb[4] = " ";
csb[5] = "One man was there who had been disabled for thirty-eight years.";
csb[6] = "When Jesus saw him lying there and realized he had already been there a long time, he said to him, &quot;Do you want to get well? &quot;";
csb[7] = "&quot;Sir,&quot; the disabled man answered, &quot;I have no one to put me into the pool when the water is stirred up, but while I\'m coming, someone goes down ahead of me.&quot;";
csb[8] = "&quot;Get up,&quot; Jesus told him, &quot;pick up your mat and walk.&quot;";
csb[9] = "Instantly the man got well, picked up his mat, and started to walk. Now that day was the Sabbath,";
csb[10] = "and so the Jews said to the man who had been healed, &quot;This is the Sabbath. The law prohibits you from picking up your mat.&quot;";
csb[11] = "He replied, &quot;The man who made me well told me, \'Pick up your mat and walk.\' &quot;";
csb[12] = "&quot;Who is this man who told you, \'Pick up your mat and walk\'? &quot; they asked.";
csb[13] = "But the man who was healed did not know who it was, because Jesus had slipped away into the crowd that was there.";
csb[14] = "After this, Jesus found him in the temple and said to him, &quot;See, you are well. Do not sin anymore, so that something worse doesn\'t happen to you.&quot;";
csb[15] = "The man went and reported to the Jews that it was Jesus who had made him well.";
csb[16] = "Therefore, the Jews began persecuting Jesus because he was doing these things on the Sabbath.";
csb[17] = "Jesus responded to them, &quot;My Father is still working, and I am working also.&quot;";
csb[18] = "This is why the Jews began trying all the more to kill him: Not only was he breaking the Sabbath, but he was even calling God his own Father, making himself equal to God.";
csb[19] = "Jesus replied, &quot;Truly I tell you, the Son is not able to do anything on his own, but only what he sees the Father doing. For whatever the Father does, the Son likewise does these things.";
csb[20] = "&quot;For the Father loves the Son and shows him everything he is doing, and he will show him greater works than these so that you will be amazed.";
csb[21] = "&quot;And just as the Father raises the dead and gives them life, so the Son also gives life to whom he wants.";
csb[22] = "&quot;The Father, in fact, judges no one but has given all judgment to the Son,";
csb[23] = "&quot;so that all people may honor the Son just as they honor the Father. Anyone who does not honor the Son does not honor the Father who sent him.";
csb[24] = "&quot;Truly I tell you, anyone who hears my word and believes him who sent me has eternal life and will not come under judgment but has passed from death to life.";
csb[25] = "&quot;Truly I tell you, an hour is coming, and is now here, when the dead will hear the voice of the Son of God, and those who hear will live.";
csb[26] = "&quot;For just as the Father has life in himself, so also he has granted to the Son to have life in himself.";
csb[27] = "&quot;And he has granted him the right to pass judgment, because he is the Son of Man.";
csb[28] = "&quot;Do not be amazed at this, because a time is coming when all who are in the graves will hear his voice";
csb[29] = "&quot;and come out -- those who have done good things, to the resurrection of life, but those who have done wicked things, to the resurrection of condemnation.";
csb[30] = "&quot;I can do nothing on my own. I judge only as I hear, and my judgment is just, because I do not seek my own will, but the will of him who sent me.";
csb[31] = "&quot;If I testify about myself, my testimony is not true.";
csb[32] = "&quot;There is another who testifies about me, and I know that the testimony he gives about me is true.";
csb[33] = "&quot;You sent messengers to John, and he testified to the truth.";
csb[34] = "&quot;I don\'t receive human testimony, but I say these things so that you may be saved.";
csb[35] = "&quot;John was a burning and shining lamp, and you were willing to rejoice for a while in his light.";
csb[36] = "&quot;But I have a greater testimony than John\'s because of the works that the Father has given me to accomplish. These very works I am doing testify about me that the Father has sent me.";
csb[37] = "&quot;The Father who sent me has himself testified about me. You have not heard his voice at any time, and you haven\'t seen his form.";
csb[38] = "&quot;You don\'t have his word residing in you, because you don\'t believe the one he sent.";
csb[39] = "&quot;You pore over the Scriptures because you think you have eternal life in them, and yet they testify about me.";
csb[40] = "&quot;But you are not willing to come to me so that you may have life.";
csb[41] = "&quot;I do not accept glory from people,";
csb[42] = "&quot;but I know you -- that you have no love for God within you.";
csb[43] = "&quot;I have come in my Father\'s name, and yet you don\'t accept me. If someone else comes in his own name, you will accept him.";
csb[44] = "&quot;How can you believe, since you accept glory from one another but don\'t seek the glory that comes from the only God?";
csb[45] = "&quot;Do not think that I will accuse you to the Father. Your accuser is Moses, on whom you have set your hope.";
csb[46] = "&quot;For if you believed Moses, you would believe me, because he wrote about me.";
csb[47] = "&quot;But if you don\'t believe what he wrote, how will you believe my words? &quot;";

kjv[21] = "For as the Father raiseth up the dead, and quickeneth [them]; even so the Son quickeneth whom he will.";
rsv[21] = "For as the Father raises the dead and gives them life, so also the Son gives life to whom he will.";
asv[21] = "For as the Father raiseth the dead and giveth them life, even so the Son also giveth life to whom he will.";
yng[21] = "`For, as the Father doth raise the dead, and doth make alive, so also the Son doth make alive whom he willeth;";
dby[21] = "For even as the Father raises the dead and quickens [them], thus the Son also quickens whom he will:";
web[21] = "For as the Father raiseth the dead, and reviveth [them]; even so the Son reviveth whom he will.";
hnv[21] = "For as the Father raises the dead and gives them life, even so the Son also gives life to whom he desires.";
vul[21] = "sicut enim Pater suscitat mortuos et vivificat sic et Filius quos vult vivificat";
kjv[22] = "For the Father judgeth no man, but hath committed all judgment unto the Son:";
rsv[22] = "The Father judges no one, but has given all judgment to the Son,";
asv[22] = "For neither doth the Father judge any man, but he hath given all judgment unto the Son;";
yng[22] = "for neither doth the Father judge any one, but all the judgment He hath given to the Son,";
dby[22] = "for neither does the Father judge any one, but has given all judgment to the Son;";
web[22] = "For the Father judgeth no man; but hath committed all judgment to the Son:";
hnv[22] = "For the Father judges no one, but he has given all judgment to the Son,";
vul[22] = "neque enim Pater iudicat quemquam sed iudicium omne dedit Filio";
kjv[23] = "That all [men] should honour the Son, even as they honour the Father. He that honoureth not the Son honoureth not the Father which hath sent him.";
rsv[23] = "that all may honor the Son, even as they honor the Father. He who does not honor the Son does not honor the Father who sent him.";
asv[23] = "that all may honor the Son, even as they honor the Father. He that honoreth not the Son honoreth not the Father that sent him.";
yng[23] = "that all may honour the Son according as they honour the Father; he who is not honouring the Son, doth not honour the Father who sent him.";
dby[23] = "that all may honour the Son, even as they honour the Father. He who honours not the Son, honours not the Father who has sent him.";
web[23] = "That all [men] should honor the Son, even as they honor the Father. He that honoreth not the Son, honoreth not the Father who hath sent him.";
hnv[23] = " that all may honor the Son, even as they honor the Father. He who doesn\'t honor the Son doesn\'t honor the Father who sent him.";
vul[23] = "ut omnes honorificent Filium sicut honorificant Patrem qui non honorificat Filium non honorificat Patrem qui misit illum";
kjv[24] = "Verily, verily, I say unto you, He that heareth my word, and believeth on him that sent me, hath everlasting life, and shall not come into condemnation; but is passed from death unto life.";
rsv[24] = "Truly, truly, I say to you, he who hears my word and believes him who sent me, has eternal life; he does not come into judgment, but has passed from death to life.";
asv[24] = "Verily, verily, I say unto you, He that heareth my word, and believeth him that sent me, hath eternal life, and cometh not into judgment, but hath passed out of death into life.";
yng[24] = "`Verily, verily, I say to you -- He who is hearing my word, and is believing Him who sent me, hath life age-during, and to judgment he doth not come, but hath passed out of the death to the life.";
dby[24] = "Verily, verily, I say unto you, that he that hears my word, and believes him that has sent me, has life eternal, and does not come into judgment, but is passed out of death into life.";
web[24] = "Verily, verily, I say to you, He that heareth my word, and believeth on him that sent me, hath everlasting life, and shall not come into condemnation; but hath passed from death to life.";
hnv[24] = "&quot;Most assuredly I tell you, he who hears my word, and believes him who sent me, has eternal life, and doesn\'t come into judgment, but has passed out of death into life.";
vul[24] = "amen amen dico vobis quia qui verbum meum audit et credit ei qui misit me habet vitam aeternam et in iudicium non venit sed transit a morte in vitam";
kjv[25] = "Verily, verily, I say unto you, The hour is coming, and now is, when the dead shall hear the voice of the Son of God: and they that hear shall live.";
rsv[25] = "&quot;Truly, truly, I say to you, the hour is coming, and now is, when the dead will hear the voice of the Son of God, and those who hear will live.";
asv[25] = "Verily, verily, I say unto you, The hour cometh, and now is, when the dead shall hear the voice of the Son of God; and they that hear shall live.";
yng[25] = "`Verily, verily, I say to you -- There cometh an hour, and it now is, when the dead shall hear the voice of the Son of God, and those having heard shall live;";
dby[25] = "Verily, verily, I say unto you, that an hour is coming, and now is, when the dead shall hear the voice of the Son of God, and they that have heard shall live.";
web[25] = "Verily, verily, I say to you, The hour is coming, and now is, when the dead shall hear the voice of the Son of God: and they that hear shall live.";
hnv[25] = "Most assuredly, I tell you, the hour comes, and now is, when the dead will hear the Son of God\'s voice; and those who hear will live.";
vul[25] = "amen amen dico vobis quia venit hora et nunc est quando mortui audient vocem Filii Dei et qui audierint vivent";
kjv[26] = "For as the Father hath life in himself; so hath he given to the Son to have life in himself;";
rsv[26] = "For as the Father has life in himself, so he has granted the Son also to have life in himself,";
asv[26] = "For as the Father hath life in himself, even so gave he to the Son also to have life in himself:";
yng[26] = "for, as the Father hath life in himself, so He gave also to the Son to have life in himself,";
dby[26] = "For even as the Father has life in himself, so he has given to the Son also to have life in himself,";
web[26] = "For as the Father hath life in himself, so hath he given to the Son to have life in himself;";
hnv[26] = "For as the Father has life in himself, even so he gave to the Son also to have life in himself.";
vul[26] = "sicut enim Pater habet vitam in semet ipso sic dedit et Filio vitam habere in semet ipso";
kjv[27] = "And hath given him authority to execute judgment also, because he is the Son of man.";
rsv[27] = "and has given him authority to execute judgment, because he is the Son of man.";
asv[27] = "and he gave him authority to execute judgment, because he is a son of man.";
yng[27] = "and authority He gave him also to do judgment, because he is Son of Man.";
dby[27] = "and has given him authority to execute judgment [also], because he is Son of man.";
web[27] = "And hath given him authority to execute judgment also, because he is the Son of man.";
hnv[27] = "He also gave him authority to execute judgment, because he is a son of man.";
vul[27] = "et potestatem dedit ei et iudicium facere quia Filius hominis est";
kjv[28] = "Marvel not at this: for the hour is coming, in the which all that are in the graves shall hear his voice,";
rsv[28] = "Do not marvel at this; for the hour is coming when all who are in the tombs will hear his voice";
asv[28] = "Marvel not at this: for the hour cometh, in which all that are in the tombs shall hear his voice,";
yng[28] = "`Wonder not at this, because there doth come an hour in which all those in the tombs shall hear his voice,";
dby[28] = "Wonder not at this, for an hour is coming in which all who are in the tombs shall hear his voice,";
web[28] = "Marvel not at this: for the hour is coming, in which all that are in the graves shall hear his voice,";
hnv[28] = "Don\'t marvel at this, for the hour comes, in which all that are in the tombs will hear his voice,";
vul[28] = "nolite mirari hoc quia venit hora in qua omnes qui in monumentis sunt audient vocem eius";
kjv[29] = "And shall come forth; they that have done good, unto the resurrection of life; and they that have done evil, unto the resurrection of damnation.";
rsv[29] = "and come forth, those who have done good, to the resurrection of life, and those who have done evil, to the resurrection of judgment.";
asv[29] = "and shall come forth; they that have done good, unto the resurrection of life; and they that have done evil, unto the resurrection of judgment.";
yng[29] = "and they shall come forth; those who did the good things to a rising again of life, and those who practised the evil things to a rising again of judgment.";
dby[29] = "and shall go forth; those that have practised good, to resurrection of life, and those that have done evil, to resurrection of judgment.";
web[29] = "And shall come forth; they that have done good to the resurrection of life; and they that have done evil, to the resurrection of damnation.";
hnv[29] = "and will come out; those who have done good, to the resurrection of life; and those who have done evil, to the resurrection of judgment.";
vul[29] = "et procedent qui bona fecerunt in resurrectionem vitae qui vero mala egerunt in resurrectionem iudicii";
kjv[30] = "I can of mine own self do nothing: as I hear, I judge: and my judgment is just; because I seek not mine own will, but the will of the Father which hath sent me.";
rsv[30] = "&quot;I can do nothing on my own authority; as I hear, I judge; and my judgment is just, because I seek not my own will but the will of him who sent me.";
asv[30] = "I can of myself do nothing: as I hear, I judge: and my judgment is righteous; because I seek not mine own will, but the will of him that sent me.";
yng[30] = "`I am not able of myself to do anything; according as I hear I judge, and my judgment is righteous, because I seek not my own will, but the will of the Father who sent me.";
dby[30] = "I cannot do anything of myself; as I hear, I judge, and my judgment is righteous, because I do not seek my will, but the will of him that has sent me.";
web[30] = "I can of my own self do nothing: as I hear, I judge: and my judgment is just; because I seek not my own will, but the will of the Father who hath sent me.";
hnv[30] = "I can of myself do nothing. As I hear, I judge, and my judgment is righteous; because I don\'t seek my own will, but the will of my Father who sent me.";
vul[30] = "non possum ego a me ipso facere quicquam sicut audio iudico et iudicium meum iustum est quia non quaero voluntatem meam sed voluntatem eius qui misit me";
kjv[31] = "If I bear witness of myself, my witness is not true.";
rsv[31] = "If I bear witness to myself, my testimony is not true;";
asv[31] = "If I bear witness of myself, my witness is not true.";
yng[31] = "`If I testify concerning myself, my testimony is not true;";
dby[31] = "If I bear witness concerning myself, my witness is not true.";
web[31] = "If I testify concerning myself, my testimony is not true.";
hnv[31] = "&quot;If I testify about myself, my witness is not valid.";
vul[31] = "si ego testimonium perhibeo de me testimonium meum non est verum";
kjv[32] = "There is another that beareth witness of me; and I know that the witness which he witnesseth of me is true.";
rsv[32] = "there is another who bears witness to me, and I know that the testimony which he bears to me is true.";
asv[32] = "It is another that beareth witness of me; and I know that the witness which he witnesseth of me is true.";
yng[32] = "another there is who is testifying concerning me, and I have known that the testimony that he doth testify concerning me is true;";
dby[32] = "It is another who bears witness concerning me, and I know that the witness which he bears concerning me is true.";
web[32] = "There is another that testifieth concerning me, and I know that the testimony which he beareth concerning me is true.";
hnv[32] = " It is another who testifies about me. I know that the testimony which he testifies about me is true.";
vul[32] = "alius est qui testimonium perhibet de me et scio quia verum est testimonium quod perhibet de me";
kjv[33] = "Ye sent unto John, and he bare witness unto the truth.";
rsv[33] = "You sent to John, and he has borne witness to the truth.";
asv[33] = "Ye have sent unto John, and he hath borne witness unto the truth.";
yng[33] = "ye have sent unto John, and he hath testified to the truth.";
dby[33] = "Ye have sent unto John, and he has borne witness to the truth.";
web[33] = "Ye sent to John, and he testified to the truth.";
hnv[33] = "You have sent to Yochanan, and he has testified to the truth.";
vul[33] = "vos misistis ad Iohannem et testimonium perhibuit veritati";
kjv[34] = "But I receive not testimony from man: but these things I say, that ye might be saved.";
rsv[34] = "Not that the testimony which I receive is from man; but I say this that you may be saved.";
asv[34] = "But the witness which I receive is not from man: howbeit I say these things, that ye may be saved.";
yng[34] = "`But I do not receive testimony from man, but these things I say that ye may be saved;";
dby[34] = "But I do not receive witness from man, but I say this that *ye* might be saved.";
web[34] = "But I receive not testimony from man: but these things I say, that ye may be saved.";
hnv[34] = "But the testimony which I receive is not from man. However, I say these things that you may be saved.";
vul[34] = "ego autem non ab homine testimonium accipio sed haec dico ut vos salvi sitis";
kjv[35] = "He was a burning and a shining light: and ye were willing for a season to rejoice in his light.";
rsv[35] = "He was a burning and shining lamp, and you were willing to rejoice for a while in his light.";
asv[35] = "He was the lamp that burneth and shineth; and ye were willing to rejoice for a season in his light.";
yng[35] = "he was the burning and shining lamp, and ye did will to be glad, for an hour, in his light.";
dby[35] = "*He* was the burning and shining lamp, and ye were willing for a season to rejoice in his light.";
web[35] = "He was a burning and a shining light: and ye were willing for a season to rejoice in his light.";
hnv[35] = " He was the burning and shining lamp, and you were willing to rejoice for a while in his light.";
vul[35] = "ille erat lucerna ardens et lucens vos autem voluistis exultare ad horam in luce eius";
kjv[36] = "But I have greater witness than [that] of John: for the works which the Father hath given me to finish, the same works that I do, bear witness of me, that the Father hath sent me.";
rsv[36] = "But the testimony which I have is greater than that of John; for the works which the Father has granted me to accomplish, these very works which I am doing, bear me witness that the Father has sent me.";
asv[36] = "But the witness which I have is greater than [that of] John; for the works which the Father hath given me to accomplish, the very works that I do, bear witness of me, that the Father hath sent me.";
yng[36] = "`But I have the testimony greater than John\'s, for the works that the Father gave me, that I might finish them, the works themselves that I do, they testify concerning me, that the Father hath sent me.";
dby[36] = "But I have the witness [that is] greater than [that] of John; for the works which the Father has given me that I should complete them, the works themselves which I do, bear witness concerning me that the Father has sent me.";
web[36] = "But I have greater testimony than [that] of John: for the works which the Father hath given me to finish, the same works that I do, bear testimony concerning me, that the Father hath sent me.";
hnv[36] = "But the testimony which I have is greater than that of Yochanan, for the works which the Father gave me to accomplish, the very works that I do, testify about me, that the Father has sent me.";
vul[36] = "ego autem habeo testimonium maius Iohanne opera enim quae dedit mihi Pater ut perficiam ea ipsa opera quae ego facio testimonium perhibent de me quia Pater me misit";
kjv[37] = "And the Father himself, which hath sent me, hath borne witness of me. Ye have neither heard his voice at any time, nor seen his shape.";
rsv[37] = "And the Father who sent me has himself borne witness to me. His voice you have never heard, his form you have never seen;";
asv[37] = "And the Father that sent me, he hath borne witness of me. Ye have neither heard his voice at any time, nor seen his form.";
yng[37] = "`And the Father who sent me Himself hath testified concerning me; ye have neither heard His voice at any time, nor His appearance have ye seen;";
dby[37] = "And the Father who has sent me himself has borne witness concerning me. Ye have neither heard his voice at any time, nor have seen his shape,";
web[37] = "And the Father himself who hath sent me, hath borne testimony concerning me. Ye have neither heard his voice at any time, nor seen his shape.";
hnv[37] = "The Father himself, who sent me, has testified about me. You have neither heard his voice at any time, nor seen his form.";
vul[37] = "et qui misit me Pater ipse testimonium perhibuit de me neque vocem eius umquam audistis neque speciem eius vidistis";
kjv[38] = "And ye have not his word abiding in you: for whom he hath sent, him ye believe not.";
rsv[38] = "and you do not have his word abiding in you, for you do not believe him whom he has sent.";
asv[38] = "And ye have not his word abiding in you: for whom he sent, him ye believe not.";
yng[38] = "and His word ye have not remaining in you, because whom He sent, him ye do not believe.";
dby[38] = "and ye have not his word abiding in you; for whom *he* hath sent, him ye do not believe.";
web[38] = "And ye have not his word abiding in you: for whom he hath sent, him ye believe not.";
hnv[38] = "You don\'t have his word living in you; because you don\'t believe him whom he sent.";
vul[38] = "et verbum eius non habetis in vobis manens quia quem misit ille huic vos non creditis";
kjv[39] = "Search the scriptures; for in them ye think ye have eternal life: and they are they which testify of me.";
rsv[39] = "You search the scriptures, because you think that in them you have eternal life; and it is they that bear witness to me;";
asv[39] = "Ye search the scriptures, because ye think that in them ye have eternal life; and these are they which bear witness of me;";
yng[39] = "`Ye search the Writings, because ye think in them to have life age-during, and these are they that are testifying concerning me;";
dby[39] = "Ye search the scriptures, for ye think that in them ye have life eternal, and they it is which bear witness concerning me;";
web[39] = "Search the scriptures; for in them ye think ye have eternal life: and they are they which testify of me.";
hnv[39] = "&quot;You search the Scriptures, because you think that in them you have eternal life; and these are they which testify about me.";
vul[39] = "scrutamini scripturas quia vos putatis in ipsis vitam aeternam habere et illae sunt quae testimonium perhibent de me";
kjv[40] = "And ye will not come to me, that ye might have life.";
rsv[40] = "yet you refuse to come to me that you may have life.";
asv[40] = "and ye will not come to me, that ye may have life.";
yng[40] = "and ye do not will to come unto me, that ye may have life;";
dby[40] = "and ye will not come to me that ye might have life.";
web[40] = "And ye will not come to me, that ye may have life.";
hnv[40] = "Yet you will not come to me, that you may have life.";
vul[40] = "et non vultis venire ad me ut vitam habeatis";
kjv[41] = "I receive not honour from men.";
rsv[41] = "I do not receive glory from men.";
asv[41] = "I receive not glory from men.";
yng[41] = "glory from man I do not receive,";
dby[41] = "I do not receive glory from men,";
web[41] = "I receive not honor from men.";
hnv[41] = "I don\'t receive glory from men.";
vul[41] = "claritatem ab hominibus non accipio";
kjv[42] = "But I know you, that ye have not the love of God in you.";
rsv[42] = "But I know that you have not the love of God within you.";
asv[42] = "But I know you, that ye have not the love of God in yourselves.";
yng[42] = "but I have known you, that the love of God ye have not in yourselves.";
dby[42] = "but I know you, that ye have not the love of God in you.";
web[42] = "But I know you, that ye have not the love of God in you.";
hnv[42] = "But I know you, that you don\'t have God\'s love in yourselves.";
vul[42] = "sed cognovi vos quia dilectionem Dei non habetis in vobis";
kjv[43] = "I am come in my Father\'s name, and ye receive me not: if another shall come in his own name, him ye will receive.";
rsv[43] = "I have come in my Father\'s name, and you do not receive me; if another comes in his own name, him you will receive.";
asv[43] = "I am come in my Father\'s name, and ye receive me not: if another shall come in his own name, him ye will receive.";
yng[43] = "`I have come in the name of my Father, and ye do not receive me; if another may come in his own name, him ye will receive;";
dby[43] = "I am come in my Father\'s name, and ye receive me not; if another come in his own name, him ye will receive.";
web[43] = "I am come in my Father\'s name, and ye receive me not: if another shall come in his own name, him ye will receive.";
hnv[43] = "I have come in my Father\'s name, and you don\'t receive me. If another comes in his own name, you will receive him.";
vul[43] = "ego veni in nomine Patris mei et non accipitis me si alius venerit in nomine suo illum accipietis";
kjv[44] = "How can ye believe, which receive honour one of another, and seek not the honour that [cometh] from God only?";
rsv[44] = "How can you believe, who receive glory from one another and do not seek the glory that comes from the only God?";
asv[44] = "How can ye believe, who receive glory one of another, and the glory that [cometh] from the only God ye seek not?";
yng[44] = "how are ye able -- ye -- to believe, glory from one another receiving, and the glory that [is] from God alone ye seek not?";
dby[44] = "How can ye believe, who receive glory one of another, and seek not the glory which [comes] from God alone?";
web[44] = "How can ye believe, who receive honor one from another, and seek not the honor that [cometh] from God only?";
hnv[44] = "How can you believe, who receive glory from one another, and you don\'t seek the glory that comes from the only God?";
vul[44] = "quomodo potestis vos credere qui gloriam ab invicem accipitis et gloriam quae a solo est Deo non quaeritis";
kjv[45] = "Do not think that I will accuse you to the Father: there is [one] that accuseth you, [even] Moses, in whom ye trust.";
rsv[45] = "Do not think that I shall accuse you to the Father; it is Moses who accuses you, on whom you set your hope.";
asv[45] = "Think not that I will accuse you to the Father: there is one that accuseth you, [even] Moses, on whom ye have set your hope.";
yng[45] = "`Do not think that I will accuse you unto the Father; there is who is accusing you, Moses -- in whom ye have hoped;";
dby[45] = "Think not that I will accuse you to the Father: there is [one] who accuses you, Moses, on whom ye trust;";
web[45] = "Do not think that I will accuse you to the Father: there is [one] that accuseth you, [even] Moses, in whom ye trust.";
hnv[45] = "&quot;Don\'t think that I will accuse you to the Father. There is one who accuses you, even Moshe, on whom you have set your hope.";
vul[45] = "nolite putare quia ego accusaturus sim vos apud Patrem est qui accuset vos Moses in quo vos speratis";
kjv[46] = "For had ye believed Moses, ye would have believed me: for he wrote of me.";
rsv[46] = "If you believed Moses, you would believe me, for he wrote of me.";
asv[46] = "For if ye believed Moses, ye would believe me; for he wrote of me.";
yng[46] = "for if ye were believing Moses, ye would have been believing me, for he wrote concerning me;";
dby[46] = "for if ye had believed Moses, ye would have believed me, for he wrote of me.";
web[46] = "For had ye believed Moses, ye would have believed me: for he wrote concerning me.";
hnv[46] = " For if you believed Moshe, you would believe me; for he wrote about me.";
vul[46] = "si enim crederetis Mosi crederetis forsitan et mihi de me enim ille scripsit";
kjv[47] = "But if ye believe not his writings, how shall ye believe my words?";
rsv[47] = "But if you do not believe his writings, how will you believe my words?&quot;";
asv[47] = "But if ye believe not his writings, how shall ye believe my words?";
yng[47] = "but if his writings ye believe not, how shall ye believe my sayings?\'";
dby[47] = "But if ye do not believe his writings, how shall ye believe my words?";
web[47] = "But if ye believe not his writings, how shall ye believe my words?";
hnv[47] = "But if you don\'t believe his writings, how will you believe my words?&quot;";
vul[47] = "si autem illius litteris non creditis quomodo meis verbis credetis";
</script>
