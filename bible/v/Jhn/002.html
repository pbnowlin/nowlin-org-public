csb[1] = "On the third day a wedding took place in Cana of Galilee. Jesus\'s mother was there, and";
csb[2] = "Jesus and his disciples were invited to the wedding as well.";
csb[3] = "When the wine ran out, Jesus\'s mother told him, &quot;They don\'t have any wine.&quot;";
csb[4] = "&quot;What does that have to do with you and me, woman? &quot; Jesus asked. &quot;My hour has not yet come.&quot;";
csb[5] = "&quot;Do whatever he tells you,&quot; his mother told the servants.";
csb[6] = "Now six stone water jars had been set there for Jewish purification. Each contained twenty or thirty gallons.";
csb[7] = "&quot;Fill the jars with water,&quot; Jesus told them. So they filled them to the brim.";
csb[8] = "Then he said to them, &quot;Now draw some out and take it to the headwaiter.&quot; And they did.";
csb[9] = "When the headwaiter tasted the water (after it had become wine), he did not know where it came from -- though the servants who had drawn the water knew. He called the groom";
csb[10] = "and told him, &quot;Everyone sets out the fine wine first, then, after people are drunk, the inferior. But you have kept the fine wine until now.&quot;";
csb[11] = "Jesus did this, the first of his signs, in Cana of Galilee. He revealed his glory, and his disciples believed in him.";
csb[12] = "After this, he went down to Capernaum, together with his mother, his brothers, and his disciples, and they stayed there only a few days.";
csb[13] = "The Jewish Passover was near, and so Jesus went up to Jerusalem.";
csb[14] = "In the temple he found people selling oxen, sheep, and doves, and he also found the money changers sitting there.";
csb[15] = "After making a whip out of cords, he drove everyone out of the temple with their sheep and oxen. He also poured out the money changers\' coins and overturned the tables.";
csb[16] = "He told those who were selling doves, &quot;Get these things out of here! Stop turning my Father\'s house into a marketplace! &quot;";
csb[17] = "And his disciples remembered that it is written: Zeal for your house will consume me.";
csb[18] = "So the Jews replied to him, &quot;What sign will you show us for doing these things? &quot;";
csb[19] = "Jesus answered, &quot;Destroy this temple, and I will raise it up in three days.&quot;";
csb[20] = "Therefore the Jews said, &quot;This temple took forty-six years to build, and will you raise it up in three days? &quot;";
csb[21] = "But he was speaking about the temple of his body.";
csb[22] = "So when he was raised from the dead, his disciples remembered that he had said this, and they believed the Scripture and the statement Jesus had made.";
csb[23] = "While he was in Jerusalem during the Passover Festival, many believed in his name when they saw the signs he was doing.";
csb[24] = "Jesus, however, would not entrust himself to them, since he knew them all";
csb[25] = "and because he did not need anyone to testify about man; for he himself knew what was in man.";
