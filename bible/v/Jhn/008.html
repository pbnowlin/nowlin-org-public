csb[1] = "But Jesus went to the Mount of Olives.";
csb[2] = "At dawn he went to the temple again, and all the people were coming to him. He sat down and began to teach them.";
csb[3] = "Then the scribes and the Pharisees brought a woman caught in adultery, making her stand in the center.";
csb[4] = "&quot;Teacher,&quot; they said to him, &quot;this woman was caught in the act of committing adultery.";
csb[5] = "&quot;In the law Moses commanded us to stone such women. So what do you say? &quot;";
csb[6] = "They asked this to trap him, in order that they might have evidence to accuse him. Jesus stooped down and started writing on the ground with his finger.";
csb[7] = "When they persisted in questioning him, he stood up and said to them, &quot;The one without sin among you should be the first to throw a stone at her.&quot;";
csb[8] = "Then he stooped down again and continued writing on the ground.";
csb[9] = "When they heard this, they left one by one, starting with the older men. Only he was left, with the woman in the center.";
csb[10] = "When Jesus stood up, he said to her, &quot;Woman, where are they? Has no one condemned you? &quot;";
csb[11] = "&quot;No one, Lord,&quot; she answered. &quot;Neither do I condemn you,&quot; said Jesus. &quot;Go, and from now on do not sin anymore.&quot;]";
csb[12] = "Jesus spoke to them again: &quot;I am the light of the world. Anyone who follows me will never walk in the darkness but will have the light of life.&quot;";
csb[13] = "So the Pharisees said to him, &quot;You are testifying about yourself. Your testimony is not valid.&quot;";
csb[14] = "&quot;Even if I testify about myself,&quot; Jesus replied, &quot;My testimony is true, because I know where I came from and where I\'m going. But you don\'t know where I come from or where I\'m going.";
csb[15] = "&quot;You judge by human standards. I judge no one.";
csb[16] = "&quot;And if I do judge, my judgment is true, because it is not I alone who judge, but I and the Father who sent me.";
csb[17] = "&quot;Even in your law it is written that the testimony of two witnesses is true.";
csb[18] = "&quot;I am the one who testifies about myself, and the Father who sent me testifies about me.&quot;";
csb[19] = "Then they asked him, &quot;Where is your Father? &quot; &quot;You know neither me nor my Father,&quot; Jesus answered. &quot;If you knew me, you would also know my Father.&quot;";
csb[20] = "He spoke these words by the treasury, while teaching in the temple. But no one seized him, because his hour had not yet come.";
csb[21] = "Then he said to them again, &quot;I\'m going away; you will look for me, and you will die in your sin. Where I\'m going, you cannot come.&quot;";
csb[22] = "So the Jews said again, &quot;He won\'t kill himself, will he, since he says, \'Where I\'m going, you cannot come\'? &quot;";
csb[23] = "&quot;You are from below,&quot; he told them, &quot;I am from above. You are of this world; I am not of this world.";
csb[24] = "&quot;Therefore I told you that you will die in your sins. For if you do not believe that I am he, you will die in your sins.&quot;";
csb[25] = "&quot;Who are you? &quot; they questioned. &quot;Exactly what I\'ve been telling you from the very beginning,&quot; Jesus told them.";
csb[26] = "&quot;I have many things to say and to judge about you, but the one who sent me is true, and what I have heard from him -- these things I tell the world.&quot;";
csb[27] = "They did not know he was speaking to them about the Father.";
csb[28] = "So Jesus said to them, &quot;When you lift up the Son of Man, then you will know that I am he, and that I do nothing on my own. But just as the Father taught me, I say these things.";
csb[29] = "&quot;The one who sent me is with me. He has not left me alone, because I always do what pleases him.&quot;";
csb[30] = "As he was saying these things, many believed in him.";
csb[31] = "Then Jesus said to the Jews who had believed him, &quot;If you continue in my word, you really are my disciples.";
csb[32] = "&quot;You will know the truth, and the truth will set you free.&quot;";
csb[33] = "&quot;We are descendants of Abraham,&quot; they answered him, &quot;and we have never been enslaved to anyone. How can you say, \'You will become free\'? &quot;";
csb[34] = "Jesus responded, &quot;Truly I tell you, everyone who commits sin is a slave of sin.";
csb[35] = "&quot;A slave does not remain in the household forever, but a son does remain forever.";
csb[36] = "&quot;So if the Son sets you free, you really will be free.";
csb[37] = "&quot;I know you are descendants of Abraham, but you are trying to kill me because my word has no place among you.";
csb[38] = "&quot;I speak what I have seen in the presence of the Father; so then, you do what you have heard from your father.&quot;";
csb[39] = "&quot;Our father is Abraham,&quot; they replied. &quot;If you were Abraham\'s children,&quot; Jesus told them, &quot;you would do what Abraham did.";
csb[40] = "&quot;But now you are trying to kill me, a man who has told you the truth that I heard from God. Abraham did not do this.";
csb[41] = "&quot;You\'re doing what your father does.&quot; &quot;We weren\'t born of sexual immorality,&quot; they said. &quot;We have one Father -- God.&quot;";
csb[42] = "Jesus said to them, &quot;If God were your Father, you would love me, because I came from God and I am here. For I didn\'t come on my own, but he sent me.";
csb[43] = "&quot;Why don\'t you understand what I say? Because you cannot listen to my word.";
csb[44] = "&quot;You are of your father the devil, and you want to carry out your father\'s desires. He was a murderer from the beginning and does not stand in the truth, because there is no truth in him. When he tells a lie, he speaks from his own nature, because he is a liar and the father of lies.";
csb[45] = "&quot;Yet because I tell the truth, you do not believe me.";
csb[46] = "&quot;Who among you can convict me of sin? If I am telling the truth, why don\'t you believe me?";
csb[47] = "&quot;The one who is from God listens to God\'s words. This is why you don\'t listen, because you are not from God.&quot;";
csb[48] = "The Jews responded to him, &quot;Aren\'t we right in saying that you\'re a Samaritan and have a demon? &quot;";
csb[49] = "&quot;I do not have a demon,&quot; Jesus answered. &quot;On the contrary, I honor my Father and you dishonor me.";
csb[50] = "&quot;I do not seek my own glory; there is one who seeks it and judges.";
csb[51] = "&quot;Truly I tell you, if anyone keeps my word, he will never see death.&quot;";
csb[52] = "Then the Jews said, &quot;Now we know you have a demon. Abraham died and so did the prophets. You say, \'If anyone keeps my word, he will never taste death.\'";
csb[53] = "&quot;Are you greater than our father Abraham who died? And the prophets died. Who do you claim to be? &quot;";
csb[54] = "&quot;If I glorify myself,&quot; Jesus answered, &quot;my glory is nothing. My Father -- about whom you say, \'He is our God\' -- he is the one who glorifies me.";
csb[55] = "&quot;You do not know him, but I know him. If I were to say I don\'t know him, I would be a liar like you. But I do know him, and I keep his word.";
csb[56] = "&quot;Your father Abraham rejoiced to see my day; he saw it and was glad.&quot;";
csb[57] = "The Jews replied, &quot;You aren\'t fifty years old yet, and you\'ve seen Abraham? &quot;";
csb[58] = "Jesus said to them, &quot;Truly I tell you, before Abraham was, I am.&quot;";
csb[59] = "So they picked up stones to throw at him. But Jesus was hidden and went out of the temple.";
