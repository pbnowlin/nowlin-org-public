csb[1] = "&quot;Truly I tell you, anyone who doesn\'t enter the sheep pen by the gate but climbs in some other way is a thief and a robber.";
csb[2] = "&quot;The one who enters by the gate is the shepherd of the sheep.";
csb[3] = "&quot;The gatekeeper opens it for him, and the sheep hear his voice. He calls his own sheep by name and leads them out.";
csb[4] = "&quot;When he has brought all his own outside, he goes ahead of them. The sheep follow him because they know his voice.";
csb[5] = "&quot;They will never follow a stranger; instead they will run away from him, because they don\'t know the voice of strangers.&quot;";
csb[6] = "Jesus gave them this figure of speech, but they did not understand what he was telling them.";
csb[7] = "Jesus said again, &quot;Truly I tell you, I am the gate for the sheep.";
csb[8] = "&quot;All who came before me are thieves and robbers, but the sheep didn\'t listen to them.";
csb[9] = "&quot;I am the gate. If anyone enters by me, he will be saved and will come in and go out and find pasture.";
csb[10] = "&quot;A thief comes only to steal and kill and destroy. I have come so that they may have life and have it in abundance.";
csb[11] = "&quot;I am the good shepherd. The good shepherd lays down his life for the sheep.";
csb[12] = "&quot;The hired hand, since he is not the shepherd and doesn\'t own the sheep, leaves them and runs away when he sees a wolf coming. The wolf then snatches and scatters them.";
csb[13] = "&quot;This happens because he is a hired hand and doesn\'t care about the sheep.";
csb[14] = "&quot;I am the good shepherd. I know my own, and my own know me,";
csb[15] = "&quot;just as the Father knows me, and I know the Father. I lay down my life for the sheep.";
csb[16] = "&quot;But I have other sheep that are not from this sheep pen; I must bring them also, and they will listen to my voice. Then there will be one flock, one shepherd.";
csb[17] = "&quot;This is why the Father loves me, because I lay down my life so that I may take it up again.";
csb[18] = "&quot;No one takes it from me, but I lay it down on my own. I have the right to lay it down, and I have the right to take it up again. I have received this command from my Father.&quot;";
csb[19] = "Again the Jews were divided because of these words.";
csb[20] = "Many of them were saying, &quot;He has a demon and he\'s crazy. Why do you listen to him? &quot;";
csb[21] = "Others were saying, &quot;These aren\'t the words of someone who is demon-possessed. Can a demon open the eyes of the blind? &quot;";
csb[22] = "Then the Festival of Dedication took place in Jerusalem, and it was winter.";
csb[23] = "Jesus was walking in the temple in Solomon\'s Colonnade.";
csb[24] = "The Jews surrounded him and asked, &quot;How long are you going to keep us in suspense? If you are the Messiah, tell us plainly.&quot;";
csb[25] = "&quot;I did tell you and you don\'t believe,&quot; Jesus answered them. &quot;The works that I do in my Father\'s name testify about me.";
csb[26] = "&quot;But you don\'t believe because you are not of my sheep.";
csb[27] = "&quot;My sheep hear my voice, I know them, and they follow me.";
csb[28] = "&quot;I give them eternal life, and they will never perish. No one will snatch them out of my hand.";
csb[29] = "&quot;My Father, who has given them to me, is greater than all. No one is able to snatch them out of the Father\'s hand.";
csb[30] = "&quot;I and the Father are one.&quot;";
csb[31] = "Again the Jews picked up rocks to stone him.";
csb[32] = "Jesus replied, &quot;I have shown you many good works from the Father. For which of these works are you stoning me? &quot;";
csb[33] = "&quot;We aren\'t stoning you for a good work,&quot; the Jews answered, &quot;but for blasphemy, because you -- being a man -- make yourself God.&quot;";
csb[34] = "Jesus answered them, &quot;Isn\'t it written in your law, I said, you are gods?";
csb[35] = "&quot;If he called those whom the word of God came to \'gods\' -- and the Scripture cannot be broken --";
csb[36] = "&quot;do you say, \'You are blaspheming\' to the one the Father set apart and sent into the world, because I said: I am the Son of God?";
csb[37] = "&quot;If I am not doing my Father\'s works, don\'t believe me.";
csb[38] = "&quot;But if I am doing them and you don\'t believe me, believe the works. This way you will know and understand that the Father is in me and I in the Father.&quot;";
csb[39] = "Then they were trying again to seize him, but he eluded their grasp.";
csb[40] = "So he departed again across the Jordan to the place where John had been baptizing earlier, and he remained there.";
csb[41] = "Many came to him and said, &quot;John never did a sign, but everything John said about this man was true.&quot;";
csb[42] = "And many believed in him there.";
kjv[1] = "Verily, verily, I say unto you, He that entereth not by the door into the sheepfold, but climbeth up some other way, the same is a thief and a robber.";

kjv[4] = "And when he putteth forth his own sheep, he goeth before them, and the sheep follow him: for they know his voice.";
kjv[5] = "And a stranger will they not follow, but will flee from him: for they know not the voice of strangers.";

kjv[14] = "I am the good shepherd, and know my [sheep], and am known of mine.";
kjv[15] = "As the Father knoweth me, even so know I the Father: and I lay down my life for the sheep.";
kjv[16] = "And other sheep I have, which are not of this fold: them also I must bring, and they shall hear my voice; and there shall be one fold, [and] one shepherd.";
kjv[17] = "Therefore doth my Father love me, because I lay down my life, that I might take it again.";
kjv[18] = "No man taketh it from me, but I lay it down of myself. I have power to lay it down, and I have power to take it again. This commandment have I received of my Father.";

kjv[42] = "And many believed on him there.";
