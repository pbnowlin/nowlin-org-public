csb[1] = "&quot;I have told you these things to keep you from stumbling.";
csb[2] = "&quot;They will ban you from the synagogues. In fact, a time is coming when anyone who kills you will think he is offering service to God.";
csb[3] = "&quot;They will do these things because they haven\'t known the Father or me.";
csb[4] = "&quot;But I have told you these things so that when their time comes you will remember I told them to you. I didn\'t tell you these things from the beginning, because I was with you.";
csb[5] = "&quot;But now I am going away to him who sent me, and not one of you asks me, \'Where are you going? \'";
csb[6] = "&quot;Yet, because I have spoken these things to you, sorrow has filled your heart.";
csb[7] = "&quot;Nevertheless, I am telling you the truth. It is for your benefit that I go away, because if I don\'t go away the Counselor will not come to you. If I go, I will send him to you.";
csb[8] = "&quot;When he comes, he will convict the world about sin, righteousness, and judgment:";
csb[9] = "&quot;About sin, because they do not believe in me;";
csb[10] = "&quot;about righteousness, because I am going to the Father and you will no longer see me;";
csb[11] = "&quot;and about judgment, because the ruler of this world has been judged.";
csb[12] = "&quot;I still have many things to tell you, but you can\'t bear them now.";
csb[13] = "&quot;When the Spirit of truth comes, he will guide you into all the truth. For he will not speak on his own, but he will speak whatever he hears. He will also declare to you what is to come.";
csb[14] = "&quot;He will glorify me, because he will take from what is mine and declare it to you.";
csb[15] = "&quot;Everything the Father has is mine. This is why I told you that he takes from what is mine and will declare it to you.";
csb[16] = "&quot;A little while and you will no longer see me; again a little while and you will see me.&quot;";
csb[17] = "Then some of his disciples said to one another, &quot;What is this he\'s telling us: \'A little while and you will not see me; again a little while and you will see me\' and, \'because I am going to the Father\'? &quot;";
csb[18] = "They said, &quot;What is this he is saying, \'A little while\'? We don\'t know what he\'s talking about.&quot;";
csb[19] = "Jesus knew they wanted to ask him, and so he said to them, &quot;Are you asking one another about what I said, \'A little while and you will not see me; again a little while and you will see me\'?";
csb[20] = "&quot;Truly I tell you, you will weep and mourn, but the world will rejoice. You will become sorrowful, but your sorrow will turn to joy.";
csb[21] = "&quot;When a woman is in labor, she has pain because her time has come. But when she has given birth to a child, she no longer remembers the suffering because of the joy that a person has been born into the world.";
csb[22] = "&quot;So you also have sorrow now. But I will see you again. Your hearts will rejoice, and no one will take away your joy from you.";
csb[23] = "&quot;In that day you will not ask me anything. Truly I tell you, anything you ask the Father in my name, he will give you.";
csb[24] = "&quot;Until now you have asked for nothing in my name. Ask and you will receive, so that your joy may be complete.";
csb[25] = "&quot;I have spoken these things to you in figures of speech. A time is coming when I will no longer speak to you in figures, but I will tell you plainly about the Father.";
csb[26] = "&quot;On that day you will ask in my name, and I am not telling you that I will ask the Father on your behalf.";
csb[27] = "&quot;For the Father himself loves you, because you have loved me and have believed that I came from God.";
csb[28] = "&quot;I came from the Father and have come into the world. Again, I am leaving the world and going to the Father.&quot;";
csb[29] = "His disciples said, &quot;Look, now you\'re speaking plainly and not using any figurative language.";
csb[30] = "&quot;Now we know that you know everything and don\'t need anyone to question you. By this we believe that you came from God.&quot;";
csb[31] = "Jesus responded to them, &quot;Do you now believe?";
csb[32] = "&quot;Indeed, an hour is coming, and has come, when each of you will be scattered to his own home, and you will leave me alone. Yet I am not alone, because the Father is with me.";
csb[33] = "&quot;I have told you these things so that in me you may have peace. You will have suffering in this world. Be courageous! I have conquered the world.&quot;";

hnv[21] = "A woman, when she gives birth, has sorrow, because her time has come. But when she has delivered the child, she doesn\'t remember the anguish any more, for the joy that a human being is born into the world.";
vul[21] = "mulier cum parit tristitiam habet quia venit hora eius cum autem pepererit puerum iam non meminit pressurae propter gaudium quia natus est homo in mundum";

kjv[23] = "And in that day ye shall ask me nothing. Verily, verily, I say unto you, Whatsoever ye shall ask the Father in my name, he will give [it] you.";
