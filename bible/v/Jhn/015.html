csb[1] = "&quot;I am the true vine, and my Father is the gardener.";
csb[2] = "&quot;Every branch in me that does not produce fruit he removes, and he prunes every branch that produces fruit so that it will produce more fruit.";
csb[3] = "&quot;You are already clean because of the word I have spoken to you.";
csb[4] = "&quot;Remain in me, and I in you. Just as a branch is unable to produce fruit by itself unless it remains on the vine, neither can you unless you remain in me.";
csb[5] = "&quot;I am the vine; you are the branches. The one who remains in me and I in him produces much fruit, because you can do nothing without me.";
csb[6] = "&quot;If anyone does not remain in me, he is thrown aside like a branch and he withers. They gather them, throw them into the fire, and they are burned.";
csb[7] = "&quot;If you remain in me and my words remain in you, ask whatever you want and it will be done for you.";
csb[8] = "&quot;My Father is glorified by this: that you produce much fruit and prove to be my disciples.";
csb[9] = "&quot;As the Father has loved me, I have also loved you. Remain in my love.";
csb[10] = "&quot;If you keep my commands you will remain in my love, just as I have kept my Father\'s commands and remain in his love.";
csb[11] = "&quot;I have told you these things so that my joy may be in you and your joy may be complete.";
csb[12] = "&quot;This is my command: Love one another as I have loved you.";
csb[13] = "&quot;No one has greater love than this: to lay down his life for his friends.";
csb[14] = "&quot;You are my friends if you do what I command you.";
csb[15] = "&quot;I do not call you servants anymore, because a servant doesn\'t know what his master is doing. I have called you friends, because I have made known to you everything I have heard from my Father.";
csb[16] = "&quot;You did not choose me, but I chose you. I appointed you to go and produce fruit and that your fruit should remain, so that whatever you ask the Father in my name, he will give you.";
csb[17] = "&quot;This is what I command you: Love one another.";
csb[18] = "&quot;If the world hates you, understand that it hated me before it hated you.";
csb[19] = "&quot;If you were of the world, the world would love you as its own. However, because you are not of the world, but I have chosen you out of it, the world hates you.";
csb[20] = "&quot;Remember the word I spoke to you: \'A servant is not greater than his master.\' If they persecuted me, they will also persecute you. If they kept my word, they will also keep yours.";
csb[21] = "&quot;But they will do all these things to you on account of my name, because they don\'t know the one who sent me.";
csb[22] = "&quot;If I had not come and spoken to them, they would not be guilty of sin. Now they have no excuse for their sin.";
csb[23] = "&quot;The one who hates me also hates my Father.";
csb[24] = "&quot;If I had not done the works among them that no one else has done, they would not have sin. Now they have seen and hated both me and my Father.";
csb[25] = "&quot;But this happened so that the statement written in their law might be fulfilled: They hated me for no reason.";
csb[26] = "&quot;When the Counselor comes, the one I will send to you from the Father -- the Spirit of truth who proceeds from the Father -- he will testify about me.";
csb[27] = "&quot;You also will testify, because you have been with me from the beginning.";

yng[24] = "if I did not do among them the works that no other hath done, they were not having sin, and now they have both seen and hated both me and my Father;";
dby[24] = "If I had not done among them the works which no other one has done, they had not had sin; but now they have both seen and hated both me and my Father.";
web[24] = "If I had not done among them the works which no other man hath done, they had not had sin: but now have they both seen, and hated both me and my Father.";
hnv[24] = "If I hadn\'t done among them the works which no one else did, they wouldn\'t have had sin. But now have they seen and also hated both me and my Father.";
vul[24] = "si opera non fecissem in eis quae nemo alius fecit peccatum non haberent nunc autem et viderunt et oderunt et me et Patrem meum";
kjv[25] = "But [this cometh to pass], that the word might be fulfilled that is written in their law, They hated me without a cause.";
rsv[25] = "It is to fulfil the word that is written in their law, \'They hated me without a cause.\'";
asv[25] = "But [this cometh to pass], that the word may be fulfilled that is written in their law, They hated me without a cause.";
yng[25] = "but -- that the word may be fulfilled that was written in their law -- They hated me without a cause.";
dby[25] = "But that the word written in their law might be fulfilled, They hated me without a cause.";
web[25] = "But [this cometh to pass], that the word might be fulfilled that is written in their law, They hated me without a cause.";
hnv[25] = "But this happened so that the word may be fulfilled which was written in their law, \'They hated me without a cause.\'";
vul[25] = "sed ut impleatur sermo qui in lege eorum scriptus est quia odio me habuerunt gratis";
kjv[26] = "But when the Comforter is come, whom I will send unto you from the Father, [even] the Spirit of truth, which proceedeth from the Father, he shall testify of me:";

asv[26] = "But when the Comforter is come, whom I will send unto you from the Father, [even] the Spirit of truth, which proceedeth from the Father, he shall bear witness of me:";
yng[26] = "`And when the Comforter may come, whom I will send to you from the Father -- the Spirit of truth, who from the Father doth come forth, he will testify of me;";
dby[26] = "But when the Comforter is come, whom I will send to you from the Father, the Spirit of truth who goes forth from with the Father, *he* shall bear witness concerning me;";

hnv[26] = "&quot;When the Counselor has come, whom I will send to you from the Father, the Spirit of truth, who proceeds from the Father, he will testify about me.";
