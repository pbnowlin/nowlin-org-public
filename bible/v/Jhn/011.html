csb[1] = "Now a man was sick, Lazarus from Bethany, the village of Mary and her sister Martha.";
csb[2] = "Mary was the one who anointed the Lord with perfume and wiped his feet with her hair, and it was her brother Lazarus who was sick.";
csb[3] = "So the sisters sent a message to him: &quot;Lord, the one you love is sick.&quot;";
csb[4] = "When Jesus heard it, he said, &quot;This sickness will not end in death but is for the glory of God, so that the Son of God may be glorified through it.&quot;";
csb[5] = "Now Jesus loved Martha, her sister, and Lazarus.";
csb[6] = "So when he heard that he was sick, he stayed two more days in the place where he was.";
csb[7] = "Then after that, he said to the disciples, &quot;Let\'s go to Judea again.&quot;";
csb[8] = "&quot;Rabbi,&quot; the disciples told him, &quot;just now the Jews tried to stone you, and you\'re going there again? &quot;";
csb[9] = "&quot;Aren\'t there twelve hours in a day? &quot; Jesus answered. &quot;If anyone walks during the day, he doesn\'t stumble, because he sees the light of this world.";
csb[10] = "&quot;But if anyone walks during the night, he does stumble, because the light is not in him.&quot;";
csb[11] = "He said this, and then he told them, &quot;Our friend Lazarus has fallen asleep, but I\'m on my way to wake him up.&quot;";
csb[12] = "Then the disciples said to him, &quot;Lord, if he has fallen asleep, he will get well.&quot;";
csb[13] = "Jesus, however, was speaking about his death, but they thought he was speaking about natural sleep.";
csb[14] = "So Jesus then told them plainly, &quot;Lazarus has died.";
csb[15] = "&quot;I\'m glad for you that I wasn\'t there so that you may believe. But let\'s go to him.&quot;";
csb[16] = "Then Thomas (called &quot;Twin&quot;) said to his fellow disciples, &quot;Let\'s go too so that we may die with him.&quot;";
csb[17] = "When Jesus arrived, he found that Lazarus had already been in the tomb four days.";
csb[18] = "Bethany was near Jerusalem (less than two miles away).";
csb[19] = "Many of the Jews had come to Martha and Mary to comfort them about their brother.";
csb[20] = "As soon as Martha heard that Jesus was coming, she went to meet him, but Mary remained seated in the house.";
csb[21] = "Then Martha said to Jesus, &quot;Lord, if you had been here, my brother wouldn\'t have died.";
csb[22] = "&quot;Yet even now I know that whatever you ask from God, God will give you.&quot;";
csb[23] = "&quot;Your brother will rise again,&quot; Jesus told her.";
csb[24] = "Martha said to him, &quot;I know that he will rise again in the resurrection at the last day.&quot;";
csb[25] = "Jesus said to her, &quot;I am the resurrection and the life. The one who believes in me, even if he dies, will live.";
csb[26] = "&quot;Everyone who lives and believes in me will never die. Do you believe this? &quot;";
csb[27] = "&quot;Yes, Lord,&quot; she told him, &quot;I believe you are the Messiah, the Son of God, who comes into the world.&quot;";
csb[28] = "Having said this, she went back and called her sister Mary, saying in private, &quot;The Teacher is here and is calling for you.&quot;";
csb[29] = "As soon as Mary heard this, she got up quickly and went to him.";
csb[30] = "Jesus had not yet come into the village but was still in the place where Martha had met him.";
csb[31] = "The Jews who were with her in the house consoling her saw that Mary got up quickly and went out. They followed her, supposing that she was going to the tomb to cry there.";
csb[32] = "As soon as Mary came to where Jesus was and saw him, she fell at his feet and told him, &quot;Lord, if you had been here, my brother would not have died! &quot;";
csb[33] = "When Jesus saw her crying, and the Jews who had come with her crying, he was deeply moved in his spirit and troubled.";
csb[34] = "&quot;Where have you put him? &quot; he asked. &quot;Lord,&quot; they told him, &quot;come and see.&quot;";
csb[35] = "Jesus wept.";
csb[36] = "So the Jews said, &quot;See how he loved him! &quot;";
csb[37] = "But some of them said, &quot;Couldn\'t he who opened the blind man\'s eyes also have kept this man from dying? &quot;";
csb[38] = "Then Jesus, deeply moved again, came to the tomb. It was a cave, and a stone was lying against it.";
csb[39] = "&quot;Remove the stone,&quot; Jesus said. Martha, the dead man\'s sister, told him, &quot;Lord, there is already a stench because he has been dead four days.&quot;";
csb[40] = "Jesus said to her, &quot;Didn\'t I tell you that if you believed you would see the glory of God? &quot;";
csb[41] = "So they removed the stone. Then Jesus raised his eyes and said, &quot;Father, I thank you that you heard me.";
csb[42] = "&quot;I know that you always hear me, but because of the crowd standing here I said this, so that they may believe you sent me.&quot;";
csb[43] = "After he said this, he shouted with a loud voice, &quot;Lazarus, come out! &quot;";
csb[44] = "The dead man came out bound hand and foot with linen strips and with his face wrapped in a cloth. Jesus said to them, &quot;Unwrap him and let him go.&quot;";
csb[45] = "Therefore, many of the Jews who came to Mary and saw what he did believed in him.";
csb[46] = "But some of them went to the Pharisees and told them what Jesus had done.";
csb[47] = "So the chief priests and the Pharisees convened the Sanhedrin and were saying, &quot;What are we going to do since this man is doing many signs?";
csb[48] = "&quot;If we let him go on like this, everyone will believe in him, and the Romans will come and take away both our place and our nation.&quot;";
csb[49] = "One of them, Caiaphas, who was high priest that year, said to them, &quot;You know nothing at all!";
csb[50] = "&quot;You\'re not considering that it is to your advantage that one man should die for the people rather than the whole nation perish.&quot;";
csb[51] = "He did not say this on his own, but being high priest that year he prophesied that Jesus was going to die for the nation,";
csb[52] = "and not for the nation only, but also to unite the scattered children of God.";
csb[53] = "So from that day on they plotted to kill him.";
csb[54] = "Jesus therefore no longer walked openly among the Jews but departed from there to the countryside near the wilderness, to a town called Ephraim, and he stayed there with the disciples.";
csb[55] = "Now the Jewish Passover was near, and many went up to Jerusalem from the country to purify themselves before the Passover.";
csb[56] = "They were looking for Jesus and asking one another as they stood in the temple: &quot;What do you think? He won\'t come to the festival, will he? &quot;";
csb[57] = "The chief priests and the Pharisees had given orders that if anyone knew where he was, he should report it so that they could arrest him.";
