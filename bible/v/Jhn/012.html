csb[1] = "Six days before the Passover, Jesus came to Bethany where Lazarus was, the one Jesus had raised from the dead.";
csb[2] = "So they gave a dinner for him there; Martha was serving them, and Lazarus was one of those reclining at the table with him.";
csb[3] = "Then Mary took a pound of perfume, pure and expensive nard, anointed Jesus\'s feet, and wiped his feet with her hair. So the house was filled with the fragrance of the perfume.";
csb[4] = "Then one of his disciples, Judas Iscariot (who was about to betray him), said,";
csb[5] = "&quot;Why wasn\'t this perfume sold for three hundred denarii and given to the poor? &quot;";
csb[6] = "He didn\'t say this because he cared about the poor but because he was a thief. He was in charge of the money-bag and would steal part of what was put in it.";
csb[7] = "Jesus answered, &quot;Leave her alone; she has kept it for the day of my burial.";
csb[8] = "&quot;For you always have the poor with you, but you do not always have me.&quot;";
csb[9] = "Then a large crowd of the Jews learned he was there. They came not only because of Jesus but also to see Lazarus, the one he had raised from the dead.";
csb[10] = "But the chief priests had decided to kill Lazarus also,";
csb[11] = "because he was the reason many of the Jews were deserting them and believing in Jesus.";
csb[12] = "The next day, when the large crowd that had come to the festival heard that Jesus was coming to Jerusalem,";
csb[13] = "they took palm branches and went out to meet him. They kept shouting: &quot;Hosanna! Blessed is he who comes in the name of the Lord -- the King of Israel! &quot;";
csb[14] = "Jesus found a young donkey and sat on it, just as it is written:";
csb[15] = "Do not be afraid, Daughter Zion. Look, your King is coming, sitting on a donkey\'s colt.";
csb[16] = "His disciples did not understand these things at first. However, when Jesus was glorified, then they remembered that these things had been written about him and that they had done these things to him.";
csb[17] = "Meanwhile, the crowd, which had been with him when he called Lazarus out of the tomb and raised him from the dead, continued to testify.";
csb[18] = "This is also why the crowd met him, because they heard he had done this sign.";
csb[19] = "Then the Pharisees said to one another, &quot;You see? You\'ve accomplished nothing. Look, the world has gone after him! &quot;";
csb[20] = "Now some Greeks were among those who went up to worship at the festival.";
csb[21] = "So they came to Philip, who was from Bethsaida in Galilee, and requested of him, &quot;Sir, we want to see Jesus.&quot;";
csb[22] = "Philip went and told Andrew; then Andrew and Philip went and told Jesus.";
csb[23] = "Jesus replied to them, &quot;The hour has come for the Son of Man to be glorified.";
csb[24] = "&quot;Truly I tell you, unless a grain of wheat falls to the ground and dies, it remains by itself. But if it dies, it produces much fruit.";
csb[25] = "&quot;The one who loves his life will lose it, and the one who hates his life in this world will keep it for eternal life.";
csb[26] = "&quot;If anyone serves me, he must follow me. Where I am, there my servant also will be. If anyone serves me, the Father will honor him.";
csb[27] = "&quot;Now my soul is troubled. What should I say -- Father, save me from this hour? But that is why I came to this hour.";
csb[28] = "&quot;Father, glorify your name.&quot; Then a voice came from heaven: &quot;I have glorified it, and I will glorify it again.&quot;";
csb[29] = "The crowd standing there heard it and said it was thunder. Others said, &quot;An angel has spoken to him.&quot;";
csb[30] = "Jesus responded, &quot;This voice came, not for me, but for you.";
csb[31] = "&quot;Now is the judgment of this world. Now the ruler of this world will be cast out.";
csb[32] = "&quot;As for me, if I am lifted up from the earth I will draw all people to myself.&quot;";
csb[33] = "He said this to indicate what kind of death he was about to die.";
csb[34] = "Then the crowd replied to him, &quot;We have heard from the law that the Messiah will remain forever. So how can you say, \'The Son of Man must be lifted up\'? Who is this Son of Man? &quot;";
csb[35] = "Jesus answered, &quot;The light will be with you only a little longer. Walk while you have the light so that darkness doesn\'t overtake you. The one who walks in darkness doesn\'t know where he\'s going.";
csb[36] = "&quot;While you have the light, believe in the light so that you may become children of light.&quot; Jesus said this, then went away and hid from them.";
csb[37] = "Even though he had performed so many signs in their presence, they did not believe in him.";
csb[38] = "This was to fulfill the word of Isaiah the prophet, who said: Lord, who has believed our message? And to whom has the arm of the Lord been revealed?";
csb[39] = "This is why they were unable to believe, because Isaiah also said:";
csb[40] = "He has blinded their eyes and hardened their hearts, so that they would not see with their eyes or understand with their hearts, and turn, and I would heal them.";
csb[41] = "Isaiah said these things because he saw his glory and spoke about him.";
csb[42] = "Nevertheless, many did believe in him even among the rulers, but because of the Pharisees they did not confess him, so that they would not be banned from the synagogue.";
csb[43] = "For they loved human praise more than praise from God.";
csb[44] = "Jesus cried out, &quot;The one who believes in me believes not in me, but in him who sent me.";
csb[45] = "&quot;And the one who sees me sees him who sent me.";
csb[46] = "&quot;I have come as light into the world, so that everyone who believes in me would not remain in darkness.";
csb[47] = "&quot;If anyone hears my words and doesn\'t keep them, I do not judge him; for I did not come to judge the world but to save the world.";
csb[48] = "&quot;The one who rejects me and doesn\'t receive my sayings has this as his judge: The word I have spoken will judge him on the last day.";
csb[49] = "&quot;For I have not spoken on my own, but the Father himself who sent me has given me a command to say everything I have said.";
csb[50] = "&quot;I know that his command is eternal life. So the things that I speak, I speak just as the Father has told me.&quot;";
