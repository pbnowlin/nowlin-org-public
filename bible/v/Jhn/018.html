csb[1] = "After Jesus had said these things, he went out with his disciples across the Kidron Valley, where there was a garden, and he and his disciples went into it.";
csb[2] = "Judas, who betrayed him, also knew the place, because Jesus often met there with his disciples.";
csb[3] = "So Judas took a company of soldiers and some officials from the chief priests and the Pharisees and came there with lanterns, torches, and weapons.";
csb[4] = "Then Jesus, knowing everything that was about to happen to him, went out and said to them, &quot;Who is it that you\'re seeking? &quot;";
csb[5] = "&quot;Jesus of Nazareth,&quot; they answered. &quot;I am he,&quot; Jesus told them. Judas, who betrayed him, was also standing with them.";
csb[6] = "When Jesus told them, &quot;I am he,&quot; they stepped back and fell to the ground.";
csb[7] = "Then he asked them again, &quot;Who is it that you\'re seeking? &quot; &quot;Jesus of Nazareth,&quot; they said.";
csb[8] = "&quot;I told you I am he,&quot; Jesus replied. &quot;So if you\'re looking for me, let these men go.&quot;";
csb[9] = "This was to fulfill the words he had said: &quot;I have not lost one of those you have given me.&quot;";
csb[10] = "Then Simon Peter, who had a sword, drew it, struck the high priest\'s servant, and cut off his right ear. (The servant\'s name was Malchus.)";
csb[11] = "At that, Jesus said to Peter, &quot;Put your sword away! Am I not to drink the cup the Father has given me? &quot;";
csb[12] = "Then the company of soldiers, the commander, and the Jewish officials arrested Jesus and tied him up.";
csb[13] = "First they led him to Annas, since he was the father-in-law of Caiaphas, who was high priest that year.";
csb[14] = "Caiaphas was the one who had advised the Jews that it would be better for one man to die for the people.";
csb[15] = "Simon Peter was following Jesus, as was another disciple. That disciple was an acquaintance of the high priest; so he went with Jesus into the high priest\'s courtyard.";
csb[16] = "But Peter remained standing outside by the door. So the other disciple, the one known to the high priest, went out and spoke to the girl who was the doorkeeper and brought Peter in.";
csb[17] = "Then the servant girl who was the doorkeeper said to Peter, &quot;You aren\'t one of this man\'s disciples too, are you? &quot; &quot;I am not.&quot; he said.";
csb[18] = "Now the servants and the officials had made a charcoal fire, because it was cold. They were standing there warming themselves, and Peter was standing with them, warming himself.";
csb[19] = "The high priest questioned Jesus about his disciples and about his teaching.";
csb[20] = "&quot;I have spoken openly to the world,&quot; Jesus answered him. &quot;I have always taught in the synagogue and in the temple, where all the Jews congregate, and I haven\'t spoken anything in secret.";
csb[21] = "&quot;Why do you question me? Question those who heard what I told them. Look, they know what I said.&quot;";
csb[22] = "When he had said these things, one of the officials standing by slapped Jesus, saying, &quot;Is this the way you answer the high priest? &quot;";
csb[23] = "&quot;If I have spoken wrongly,&quot; Jesus answered him, &quot;give evidence about the wrong; but if rightly, why do you hit me? &quot;";
csb[24] = "Then Annas sent him bound to Caiaphas the high priest.";
csb[25] = "Now Simon Peter was standing and warming himself. They said to him, &quot;You aren\'t one of his disciples too, are you? &quot; He denied it and said, &quot;I am not.&quot;";
csb[26] = "One of the high priest\'s servants, a relative of the man whose ear Peter had cut off, said, &quot;Didn\'t I see you with him in the garden? &quot;";
csb[27] = "Peter denied it again. Immediately a rooster crowed.";
csb[28] = "Then they led Jesus from Caiaphas to the governor\'s headquarters. It was early morning. They did not enter the headquarters themselves; otherwise they would be defiled and unable to eat the Passover.";
csb[29] = "So Pilate came out to them and said, &quot;What charge do you bring against this man? &quot;";
csb[30] = "They answered him, &quot;If this man weren\'t a criminal, we wouldn\'t have handed him over to you.&quot;";
csb[31] = "Pilate told them, &quot;You take him and judge him according to your law.&quot; &quot;It\'s not legal for us to put anyone to death,&quot; the Jews declared.";
csb[32] = "They said this so that Jesus\'s words might be fulfilled indicating what kind of death he was going to die.";
csb[33] = "Then Pilate went back into the headquarters, summoned Jesus, and said to him, &quot;Are you the King of the Jews? &quot;";
csb[34] = "Jesus answered, &quot;Are you asking this on your own, or have others told you about me? &quot;";
csb[35] = "&quot;I\'m not a Jew, am I? &quot; Pilate replied. &quot;Your own nation and the chief priests handed you over to me. What have you done? &quot;";
csb[36] = "&quot;My kingdom is not of this world,&quot; said Jesus. &quot;If my kingdom were of this world, my servants would fight, so that I wouldn\'t be handed over to the Jews. But as it is, my kingdom is not from here.&quot;";
csb[37] = "&quot;You are a king then? &quot; Pilate asked. &quot;You say that I\'m a king,&quot; Jesus replied. &quot;I was born for this, and I have come into the world for this: to testify to the truth. Everyone who is of the truth listens to my voice.&quot;";
csb[38] = "&quot;What is truth? &quot; said Pilate. After he had said this, he went out to the Jews again and told them, &quot;I find no grounds for charging him.";
csb[39] = "&quot;You have a custom that I release one prisoner to you at the Passover. So, do you want me to release to you the King of the Jews? &quot;";
csb[40] = "They shouted back, &quot;Not this man, but Barabbas! &quot; Now Barabbas was a revolutionary.";
