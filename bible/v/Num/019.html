rsv[21] = "And it shall be a perpetual statute for them. He who sprinkles the water for impurity shall wash his clothes; and he who touches the water for impurity shall be unclean until evening.";
asv[21] = "And it shall be a perpetual statute unto them: and he that sprinkleth the water for impurity shall wash his clothes, and he that toucheth the water for impurity shall be unclean until even.";

dby[21] = "And it shall be an everlasting statute unto them. And he that sprinkleth the water of separation shall wash his garments, and he that toucheth the water of separation shall be unclean until even.";

dby[22] = "And whatever the unclean person toucheth shall be unclean; and the soul that toucheth it shall be unclean until even.";

csb[1] = "The LORD spoke to Moses and Aaron,";
csb[2] = "&quot;This is the legal statute that the LORD has commanded: Instruct the Israelites to bring you an unblemished red cow that has no defect and has never been yoked.";
csb[3] = "&quot;Give it to the priest Eleazar, and he will have it brought outside the camp and slaughtered in his presence.";
csb[4] = "&quot; The priest Eleazar is to take some of its blood with his finger and sprinkle it seven times toward the front of the tent of meeting.";
csb[5] = "&quot;The cow is to be burned in his sight. Its hide, flesh, and blood, are to be burned along with its waste.";
csb[6] = "&quot;The priest is to take cedar wood, hyssop, and crimson yarn, and throw them onto the fire where the cow is burning.";
csb[7] = "&quot;Then the priest must wash his clothes and bathe his body in water; after that he may enter the camp, but he will remain ceremonially unclean until evening.";
csb[8] = "&quot;The one who burned the cow must also wash his clothes and bathe his body in water, and he will remain unclean until evening.";
csb[9] = "&quot;A man who is clean is to gather up the cow\'s ashes and deposit them outside the camp in a ceremonially clean place. The ashes will be kept by the Israelite community for preparing the water to remove impurity; it is a sin offering.";
csb[10] = "&quot;Then the one who gathers up the cow\'s ashes must wash his clothes, and he will remain unclean until evening. This is a permanent statute for the Israelites and for the alien who resides among them.";
csb[11] = "&quot;The person who touches any human corpse will be unclean for seven days.";
csb[12] = "&quot;He is to purify himself with the water on the third day and the seventh day; then he will be clean. But if he does not purify himself on the third and seventh days, he will not be clean.";
csb[13] = "&quot;Anyone who touches a body of a person who has died, and does not purify himself, defiles the tabernacle of the LORD. That person will be cut off from Israel. He remains unclean because the water for impurity has not been sprinkled on him, and his uncleanness is still on him.";
csb[14] = "&quot;This is the law when a person dies in a tent: everyone who enters the tent and everyone who is already in the tent will be unclean for seven days,";
csb[15] = "&quot;and any open container without a lid tied on it is unclean.";
csb[16] = "&quot;Anyone in the open field who touches a person who has been killed by the sword or has died, or who even touches a human bone, or a grave, will be unclean for seven days.";
csb[17] = "&quot;For the purification of the unclean person, they are to take some of the ashes of the burnt sin offering, put them in a jar, and add fresh water to them.";
csb[18] = "&quot;A person who is clean is to take hyssop, dip it in the water, and sprinkle the tent, all the furnishings, and the people who were there. He is also to sprinkle the one who touched a bone, a grave, a corpse, or a person who had been killed.";
csb[19] = "&quot;The one who is clean is to sprinkle the unclean person on the third day and the seventh day. After he purifies the unclean person on the seventh day, the one being purified must wash his clothes and bathe in water, and he will be clean by evening.";
csb[20] = "&quot;But a person who is unclean and does not purify himself, that person will be cut off from the assembly because he has defiled the sanctuary of the LORD. The water for impurity has not been sprinkled on him; he is unclean.";
csb[21] = "&quot;This is a permanent statute for them. The person who sprinkles the water for impurity is to wash his clothes, and whoever touches the water for impurity will be unclean until evening.";
csb[22] = "&quot;Anything the unclean person touches will become unclean, and anyone who touches it will be unclean until evening.&quot;";
