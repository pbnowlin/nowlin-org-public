kjv[54] = "And ye shall divide the land by lot for an inheritance among your families: [and] to the more ye shall give the more inheritance, and to the fewer ye shall give the less inheritance: every man\'s [inheritance] shall be in the place where his lot falleth; according to the tribes of your fathers ye shall inherit.";
rsv[54] = "You shall inherit the land by lot according to your families; to a large tribe you shall give a large inheritance, and to a small tribe you shall give a small inheritance; wherever the lot falls to any man, that shall be his; according to the tribes of your fathers you shall inherit.";
asv[54] = "And ye shall inherit the land by lot according to your families; to the more ye shall give the more inheritance, and to the fewer thou shalt give the less inheritance: wheresoever the lot falleth to any man, that shall be his; according to the tribes of your fathers shall ye inherit.";
yng[54] = "`And ye have inherited the land by lot, by your families; to the many ye increase their inheritance, and to the few ye diminish their inheritance; whither the lot goeth out to him, it is his; by the tribes of your fathers ye inherit.";
dby[54] = "And ye shall take for yourselves the land as an inheritance by lot according to your families: to the many ye shall increase their inheritance, and to the few thou shalt diminish their inheritance: where the lot falleth to him, there shall be each man\'s [inheritance]; according to the tribes of your fathers shall ye take for yourselves the inheritance.";

csb[1] = "These were the stages of the Israelites\' journey when they went out of the land of Egypt by their military divisions under the leadership of Moses and Aaron.";
csb[2] = "At the LORD\'s command, Moses wrote down the starting points for the stages of their journey; these are the stages listed by their starting points:";
csb[3] = "They traveled from Rameses in the first month, on the fifteenth day of the month. On the day after the Passover the Israelites went out defiantly in the sight of all the Egyptians.";
csb[4] = "Meanwhile, the Egyptians were burying every firstborn male the LORD had struck down among them, for the LORD had executed judgment against their gods.";
csb[5] = "The Israelites traveled from Rameses and camped at Succoth.";
csb[6] = "They traveled from Succoth and camped at Etham, which is on the edge of the wilderness.";
csb[7] = "They traveled from Etham and turned back to Pi-hahiroth, which faces Baal-zephon, and they camped before Migdol.";
csb[8] = "They traveled from Pi-hahiroth and crossed through the middle of the sea into the wilderness. They took a three-day journey into the Wilderness of Etham and camped at Marah.";
csb[9] = "They traveled from Marah and came to Elim. There were twelve springs and seventy date palms at Elim, so they camped there.";
csb[10] = "They traveled from Elim and camped by the Red Sea.";
csb[11] = "They traveled from the Red Sea and camped in the Wilderness of Sin.";
csb[12] = "They traveled from the Wilderness of Sin and camped in Dophkah.";

csb[34] = "They traveled from Jotbathah and camped at Abronah.";
csb[35] = "They traveled from Abronah and camped at Ezion-geber.";
csb[36] = "They traveled from Ezion-geber and camped in the Wilderness of Zin (that is, Kadesh).";
csb[37] = "They traveled from Kadesh and camped at Mount Hor on the edge of the land of Edom.";
csb[38] = "At the LORD\'s command, the priest Aaron climbed Mount Hor and died there on the first day of the fifth month in the fortieth year after the Israelites went out of the land of Egypt.";
csb[39] = "Aaron was 123 years old when he died on Mount Hor.";
csb[40] = "At that time the Canaanite king of Arad, who lived in the Negev in the land of Canaan, heard the Israelites were coming.";
csb[41] = "They traveled from Mount Hor and camped at Zalmonah.";
csb[42] = "They traveled from Zalmonah and camped at Punon.";
csb[43] = "They traveled from Punon and camped at Oboth.";
csb[44] = "They traveled from Oboth and camped at Iye-abarim on the border of Moab.";
csb[45] = "They traveled from Iyim and camped at Dibon-gad.";
csb[46] = "They traveled from Dibon-gad and camped at Almon-diblathaim.";
csb[47] = "They traveled from Almon-diblathaim and camped in the Abarim range facing Nebo.";
csb[48] = "They traveled from the Abarim range and camped on the plains of Moab by the Jordan across from Jericho.";
csb[49] = "They camped by the Jordan from Beth-jeshimoth to the Acacia Meadow on the plains of Moab.";
csb[50] = "The LORD spoke to Moses in the plains of Moab by the Jordan across from Jericho,";
csb[51] = "&quot;Tell the Israelites: When you cross the Jordan into the land of Canaan,";
csb[52] = "&quot;you must drive out all the inhabitants of the land before you, destroy all their stone images and cast images, and demolish all their high places.";
csb[53] = "&quot;You are to take possession of the land and settle in it because I have given you the land to possess.";
csb[54] = "&quot;You are to receive the land as an inheritance by lot according to your clans. Increase the inheritance for a large clan and decrease it for a small one. Whatever place the lot indicates for someone will be his. You will receive an inheritance according to your ancestral tribes.";
csb[55] = "&quot;But if you don\'t drive out the inhabitants of the land before you, those you allow to remain will become barbs for your eyes and thorns for your sides; they will harass you in the land where you will live.";
csb[56] = "&quot;And what I had planned to do to them, I will do to you.&quot;";
</script>
