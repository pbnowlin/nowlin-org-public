rsv[50] = "but appoint the Levites over the tabernacle of the testimony, and over all its furnishings, and over all that belongs to it; they are to carry the tabernacle and all its furnishings, and they shall tend it, and shall encamp around the tabernacle.";

yng[50] = "and thou, appoint the Levites over the tabernacle of the testimony, and over all its vessels, and over all that it hath; they bear the tabernacle, and all its vessels, and they serve it; and round about the tabernacle they encamp.";
dby[50] = "But thou, appoint the Levites over the tabernacle of testimony, and over all the vessels thereof, and over all things that belong to it: they shall bear the tabernacle, and all its vessels; and they shall serve it, and round about the tabernacle shall they encamp;";
web[50] = "But thou shalt appoint the Levites over the tabernacle of testimony, and over all its vessels, and over all things that [belong] to it: they shall bear the tabernacle, and all its vessels, and they shall minister to it, and shall encamp around the tabernacle.";
hnv[50] = " but appoint the Levites over the Tabernacle of the Testimony, and over all its furnishings, and over all that belongs to it. They shall carry the tabernacle, and all its furnishings; and they shall take care of it, and shall encamp around it.";
vul[50] = "sed constitue eos super tabernaculum testimonii cuncta vasa eius et quicquid ad caerimonias pertinet ipsi portabunt tabernaculum et omnia utensilia eius et erunt in ministerio ac per gyrum tabernaculi metabuntur";
rsv[51] = "When the tabernacle is to set out, the Levites shall take it down; and when the tabernacle is to be pitched, the Levites shall set it up. And if any one else comes near, he shall be put to death.";
asv[51] = "And when the tabernacle setteth forward, the Levites shall take it down; and when the tabernacle is to be pitched, the Levites shall set it up: and the stranger that cometh nigh shall be put to death.";
yng[51] = "`And in the journeying of the tabernacle, the Levites take it down, and in the encamping of the tabernacle, the Levites raise it up; and the stranger who is coming near is put to death.\'";
dby[51] = "and when the tabernacle setteth forward, the Levites shall take it down; and when the tabernacle encampeth, the Levites shall set it up; and the stranger that cometh near shall be put to death.";
web[51] = "And when the tabernacle moveth forward, the Levites shall take it down; and when the tabernacle is to be pitched, the Levites shall set it up: and the stranger that cometh nigh shall be put to death.";
hnv[51] = "When the tabernacle is to move, the Levites shall take it down; and when the tabernacle is to be set up, the Levites shall set it up. The stranger who comes near shall be put to death.";
vul[51] = "cum proficiscendum fuerit deponent Levitae tabernaculum cum castra metanda erigent quisquis externorum accesserit occidetur";

csb[1] = "The LORD spoke to Moses in the tent of meeting in the Wilderness of Sinai, on the first day of the second month of the second year after Israel\'s departure from the land of Egypt:";
csb[2] = "&quot;Take a census of the entire Israelite community by their clans and their fathers\' families, counting the names of every male one by one.";
csb[3] = "&quot;You and Aaron are to register those who are twenty years old or more by their military divisions -- everyone who can serve in Israel\'s army.";
csb[4] = "&quot;A man from each tribe is to be with you, each one the head of his ancestral family.";
csb[5] = "&quot;These are the names of the men who are to assist you: Elizur son of Shedeur from Reuben;";
csb[6] = "&quot;Shelumiel son of Zurishaddai from Simeon;";
csb[7] = "&quot;Nahshon son of Amminadab from Judah;";
csb[8] = "&quot;Nethanel son of Zuar from Issachar;";
csb[9] = "&quot;Eliab son of Helon from Zebulun;";
csb[10] = "&quot;from the sons of Joseph: Elishama son of Ammihud from Ephraim, Gamaliel son of Pedahzur from Manasseh;";
csb[11] = "&quot;Abidan son of Gideoni from Benjamin;";
csb[12] = "&quot;Ahiezer son of Ammishaddai from Dan;";
csb[13] = "&quot;Pagiel son of Ochran from Asher;";
csb[14] = "&quot;Eliasaph son of Deuel from Gad;";
csb[15] = "&quot;Ahira son of Enan from Naphtali.";
csb[16] = "&quot;These are the men called from the community; they are leaders of their ancestral tribes, the heads of Israel\'s clans.&quot;";
csb[17] = "So Moses and Aaron took these men who had been designated by name,";
csb[18] = "and they assembled the whole community on the first day of the second month. They recorded their ancestry by their clans and their ancestral families, counting one by one the names of those twenty years old or more,";
csb[19] = "just as the LORD commanded Moses. He registered them in the Wilderness of Sinai:";
csb[20] = "The descendants of Reuben, the firstborn of Israel: according to their family records by their clans and their ancestral families, counting one by one the names of every male twenty years old or more, everyone who could serve in the army,";
csb[21] = "those registered for the tribe of Reuben numbered 46,500.";
csb[22] = "The descendants of Simeon: according to their family records by their clans and their ancestral families, those registered counting one by one the names of every male twenty years old or more, everyone who could serve in the army,";

csb[30] = "The descendants of Zebulun: according to their family records by their clans and their ancestral families, counting the names of those twenty years old or more, everyone who could serve in the army,";

csb[32] = "The descendants of Joseph: The descendants of Ephraim: according to their family records by their clans and their ancestral families, counting the names of those twenty years old or more, everyone who could serve in the army,";
csb[33] = "those registered for the tribe of Ephraim numbered 40,500.";
csb[34] = "The descendants of Manasseh: according to their family records by their clans and their ancestral families, counting the names of those twenty years old or more, everyone who could serve in the army,";
csb[35] = "those registered for the tribe of Manasseh numbered 32,200.";
csb[36] = "The descendants of Benjamin: according to their family records by their clans and their ancestral families, counting the names of those twenty years old or more, everyone who could serve in the army,";
csb[37] = "those registered for the tribe of Benjamin numbered 35,400.";
csb[38] = "The descendants of Dan: according to their family records by their clans and their ancestral families, counting the names of those twenty years old or more, everyone who could serve in the army,";
csb[39] = "those registered for the tribe of Dan numbered 62,700.";
csb[40] = "The descendants of Asher: according to their family records by their clans and their ancestral families, counting the names of those twenty years old or more, everyone who could serve in the army,";
csb[41] = "those registered for the tribe of Asher numbered 41,500.";
csb[42] = "The descendants of Naphtali: according to their family records by their clans and their ancestral families, counting the names of those twenty years old or more, everyone who could serve in the army,";
csb[43] = "those registered for the tribe of Naphtali numbered 53,400.";
csb[44] = "These are the men Moses and Aaron registered, with the assistance of the twelve leaders of Israel; each represented his ancestral family.";
csb[45] = "So all the Israelites twenty years old or more, everyone who could serve in Israel\'s army, were registered by their ancestral families.";
csb[46] = "All those registered numbered 603,550.";
csb[47] = "But the Levites were not registered with them by their ancestral tribe.";
csb[48] = "For the LORD had told Moses:";
csb[49] = "&quot;Do not register or take a census of the tribe of Levi with the other Israelites.";
csb[50] = "&quot;Appoint the Levites over the tabernacle of the testimony, all its furnishings, and everything in it. They are to transport the tabernacle and all its articles, take care of it, and camp around it.";
csb[51] = "&quot;Whenever the tabernacle is to move, the Levites are to take it down, and whenever it is to stop at a campsite, the Levites are to set it up. Any unauthorized person who comes near it is to be put to death.";
csb[52] = "&quot;The Israelites are to camp by their military divisions, each man with his encampment and under his banner.";
csb[53] = "&quot;The Levites are to camp around the tabernacle of the testimony and watch over it, so that no wrath will fall on the Israelite community.&quot;";
csb[54] = "The Israelites did everything just as the LORD had commanded Moses.";
kjv[1] = "And the LORD spake unto Moses in the wilderness of Sinai, in the tabernacle of the congregation, on the first [day] of the second month, in the second year after they were come out of the land of Egypt, saying,";
kjv[2] = "Take ye the sum of all the congregation of the children of Israel, after their families, by the house of their fathers, with the number of [their] names, every male by their polls;";
kjv[3] = "From twenty years old and upward, all that are able to go forth to war in Israel: thou and Aaron shall number them by their armies.";
kjv[4] = "And with you there shall be a man of every tribe; every one head of the house of his fathers.";
kjv[5] = "And these [are] the names of the men that shall stand with you: of [the tribe of] Reuben; Elizur the son of Shedeur.";
kjv[6] = "Of Simeon; Shelumiel the son of Zurishaddai.";
kjv[7] = "Of Judah; Nahshon the son of Amminadab.";
kjv[8] = "Of Issachar; Nethaneel the son of Zuar.";
kjv[9] = "Of Zebulun; Eliab the son of Helon.";
kjv[10] = "Of the children of Joseph: of Ephraim; Elishama the son of Ammihud: of Manasseh; Gamaliel the son of Pedahzur.";
kjv[11] = "Of Benjamin; Abidan the son of Gideoni.";
kjv[12] = "Of Dan; Ahiezer the son of Ammishaddai.";
kjv[13] = "Of Asher; Pagiel the son of Ocran.";
kjv[14] = "Of Gad; Eliasaph the son of Deuel.";
kjv[15] = "Of Naphtali; Ahira the son of Enan.";
kjv[16] = "These [were] the renowned of the congregation, princes of the tribes of their fathers, heads of thousands in Israel.";
kjv[17] = "And Moses and Aaron took these men which are expressed by [their] names:";
kjv[18] = "And they assembled all the congregation together on the first [day] of the second month, and they declared their pedigrees after their families, by the house of their fathers, according to the number of the names, from twenty years old and upward, by their polls.";
kjv[19] = "As the LORD commanded Moses, so he numbered them in the wilderness of Sinai.";
kjv[20] = "And the children of Reuben, Israel\'s eldest son, by their generations, after their families, by the house of their fathers, according to the number of the names, by their polls, every male from twenty years old and upward, all that were able to go forth to war;";
kjv[21] = "Those that were numbered of them, [even] of the tribe of Reuben, [were] forty and six thousand and five hundred.";
kjv[22] = "Of the children of Simeon, by their generations, after their families, by the house of their fathers, those that were numbered of them, according to the number of the names, by their polls, every male from twenty years old and upward, all that were able to go forth to war;";
kjv[23] = "Those that were numbered of them, [even] of the tribe of Simeon, [were] fifty and nine thousand and three hundred.";
kjv[24] = "Of the children of Gad, by their generations, after their families, by the house of their fathers, according to the number of the names, from twenty years old and upward, all that were able to go forth to war;";
kjv[25] = "Those that were numbered of them, [even] of the tribe of Gad, [were] forty and five thousand six hundred and fifty.";
kjv[26] = "Of the children of Judah, by their generations, after their families, by the house of their fathers, according to the number of the names, from twenty years old and upward, all that were able to go forth to war;";
kjv[27] = "Those that were numbered of them, [even] of the tribe of Judah, [were] threescore and fourteen thousand and six hundred.";
kjv[28] = "Of the children of Issachar, by their generations, after their families, by the house of their fathers, according to the number of the names, from twenty years old and upward, all that were able to go forth to war;";
kjv[29] = "Those that were numbered of them, [even] of the tribe of Issachar, [were] fifty and four thousand and four hundred.";
kjv[30] = "Of the children of Zebulun, by their generations, after their families, by the house of their fathers, according to the number of the names, from twenty years old and upward, all that were able to go forth to war;";
kjv[31] = "Those that were numbered of them, [even] of the tribe of Zebulun, [were] fifty and seven thousand and four hundred.";
kjv[32] = "Of the children of Joseph, [namely], of the children of Ephraim, by their generations, after their families, by the house of their fathers, according to the number of the names, from twenty years old and upward, all that were able to go forth to war;";
kjv[33] = "Those that were numbered of them, [even] of the tribe of Ephraim, [were] forty thousand and five hundred.";
kjv[34] = "Of the children of Manasseh, by their generations, after their families, by the house of their fathers, according to the number of the names, from twenty years old and upward, all that were able to go forth to war;";
kjv[35] = "Those that were numbered of them, [even] of the tribe of Manasseh, [were] thirty and two thousand and two hundred.";
kjv[36] = "Of the children of Benjamin, by their generations, after their families, by the house of their fathers, according to the number of the names, from twenty years old and upward, all that were able to go forth to war;";
kjv[37] = "Those that were numbered of them, [even] of the tribe of Benjamin, [were] thirty and five thousand and four hundred.";
kjv[38] = "Of the children of Dan, by their generations, after their families, by the house of their fathers, according to the number of the names, from twenty years old and upward, all that were able to go forth to war;";
kjv[39] = "Those that were numbered of them, [even] of the tribe of Dan, [were] threescore and two thousand and seven hundred.";
kjv[40] = "Of the children of Asher, by their generations, after their families, by the house of their fathers, according to the number of the names, from twenty years old and upward, all that were able to go forth to war;";
kjv[41] = "Those that were numbered of them, [even] of the tribe of Asher, [were] forty and one thousand and five hundred.";
kjv[42] = "Of the children of Naphtali, throughout their generations, after their families, by the house of their fathers, according to the number of the names, from twenty years old and upward, all that were able to go forth to war;";
kjv[43] = "Those that were numbered of them, [even] of the tribe of Naphtali, [were] fifty and three thousand and four hundred.";
kjv[44] = "These [are] those that were numbered, which Moses and Aaron numbered, and the princes of Israel, [being] twelve men: each one was for the house of his fathers.";
kjv[45] = "So were all those that were numbered of the children of Israel, by the house of their fathers, from twenty years old and upward, all that were able to go forth to war in Israel;";
kjv[46] = "Even all they that were numbered were six hundred thousand and three thousand and five hundred and fifty.";
kjv[47] = "But the Levites after the tribe of their fathers were not numbered among them.";
kjv[48] = "For the LORD had spoken unto Moses, saying,";
kjv[49] = "Only thou shalt not number the tribe of Levi, neither take the sum of them among the children of Israel:";
kjv[50] = "But thou shalt appoint the Levites over the tabernacle of testimony, and over all the vessels thereof, and over all things that [belong] to it: they shall bear the tabernacle, and all the vessels thereof; and they shall minister unto it, and shall encamp round about the tabernacle.";
kjv[51] = "And when the tabernacle setteth forward, the Levites shall take it down: and when the tabernacle is to be pitched, the Levites shall set it up: and the stranger that cometh nigh shall be put to death.";
kjv[52] = "And the children of Israel shall pitch their tents, every man by his own camp, and every man by his own standard, throughout their hosts.";
kjv[53] = "But the Levites shall pitch round about the tabernacle of testimony, that there be no wrath upon the congregation of the children of Israel: and the Levites shall keep the charge of the tabernacle of testimony.";
kjv[54] = "And the children of Israel did according to all that the LORD commanded Moses, so did they.";
</script>
