kjv[1] = "And Moses spake unto the heads of the tribes concerning the children of Israel, saying, This [is] the thing which the LORD hath commanded.";
rsv[1] = "Moses said to the heads of the tribes of the people of Israel, &quot;This is what the LORD has commanded.";
asv[1] = "And Moses spake unto the heads of the tribes of the children of Israel, saying, This is the thing which Jehovah hath commanded.";
yng[1] = "And Moses speaketh unto the heads of the tribes of the sons of Israel, saying, `This [is] the thing which Jehovah hath commanded:";
dby[1] = "And Moses spoke to the heads of the tribes of the children of Israel, saying, This is what Jehovah hath commanded.";
web[1] = "And Moses spoke to the heads of the tribes concerning the children of Israel, saying, This [is] the thing which the LORD hath commanded.";
hnv[1] = "Moshe spoke to the heads of the tribes of the children of Yisra\'el, saying, This is the thing which the LORD has commanded.";
vul[1] = "[Vulgate 30:2] et locutus est ad principes tribuum filiorum Israhel iste est sermo quem praecepit Dominus";
kjv[2] = "If a man vow a vow unto the LORD, or swear an oath to bind his soul with a bond; he shall not break his word, he shall do according to all that proceedeth out of his mouth.";
rsv[2] = "When a man vows a vow to the LORD, or swears an oath to bind himself by a pledge, he shall not break his word; he shall do according to all that proceeds out of his mouth.";
asv[2] = "When a man voweth a vow unto Jehovah, or sweareth an oath to bind his soul with a bond, he shall not break his word; he shall do according to all that proceedeth out of his mouth.";
yng[2] = "`When a man voweth a vow to Jehovah, or hath sworn an oath to bind a bond on his soul, he doth not pollute his word; according to all that is going out from his mouth he doth.";
dby[2] = "If a man vow a vow to Jehovah, or swear an oath to bind his soul with a bond, he shall not break his word; according to all that hath gone out of his mouth shall he do.";
web[2] = "If a man shall vow a vow to the LORD, or swear an oath to bind his soul with a bond; he shall not break his word; he shall do according to all that proceedeth out of his mouth.";
hnv[2] = "When a man vows a vow to the LORD, or swears an oath to bind his soul with a bond, he shall not break his word; he shall do according to all that proceeds out of his mouth.";
vul[2] = "[Vulgate 30:3] si quis virorum votum Domino voverit aut se constrinxerit iuramento non faciet irritum verbum suum sed omne quod promisit implebit";
kjv[3] = "If a woman also vow a vow unto the LORD, and bind herself by a bond, [being] in her father\'s house in her youth;";
rsv[3] = "Or when a woman vows a vow to the LORD, and binds herself by a pledge, while within her father\'s house, in her youth,";
asv[3] = "Also when a woman voweth a vow unto Jehovah, and bindeth herself by a bond, being in her father\'s house, in her youth,";
yng[3] = "`And when a woman voweth a vow to Jehovah, and hath bound a bond in the house of her father in her youth,";
dby[3] = "If a woman also vow a vow to Jehovah, and bind herself by a bond, in her father\'s house in her youth,";
web[3] = "If a woman also shall vow a vow to the LORD, and bind [herself] by a bond, [being] in her father\'s house in her youth;";
hnv[3] = "Also when a woman vows a vow to the LORD, and binds herself by a bond, being in her father\'s house, in her youth,";
vul[3] = "[Vulgate 30:4] mulier si quippiam voverit et se constrinxerit iuramento quae est in domo patris sui et in aetate adhuc puellari si cognoverit pater votum quod pollicita est et iuramentum quo obligavit animam suam et tacuerit voti rea erit";
kjv[4] = "And her father hear her vow, and her bond wherewith she hath bound her soul, and her father shall hold his peace at her: then all her vows shall stand, and every bond wherewith she hath bound her soul shall stand.";
rsv[4] = "and her father hears of her vow and of her pledge by which she has bound herself, and says nothing to her; then all her vows shall stand, and every pledge by which she has bound herself shall stand.";
asv[4] = "and her father heareth her vow, and her bond wherewith she hath bound her soul, and her father holdeth his peace at her; then all her vows shall stand, and every bond wherewith she hath bound her soul shall stand.";
yng[4] = "and her father hath heard her vow, and her bond which she hath bound on her soul, and her father hath kept silent at her, then have all her vows been established, and every bond which she hath bound on her soul is established.";
dby[4] = "and her father hear her vow, and her bond wherewith she hath bound her soul, and her father shall be silent at her, then all her vows shall stand, and every bond wherewith she hath bound her soul shall stand.";
web[4] = "And her father shall hear her vow, and her bond with which she hath bound her soul, and her father shall hold his peace at her: then all her vows shall stand, and every bond with which she hath bound her soul shall stand.";
hnv[4] = "and her father hears her vow, and her bond with which she has bound her soul, and her father holds his shalom at her; then all her vows shall stand, and every bond with which she has bound her soul shall stand.";
vul[4] = "[Vulgate 30:5] quicquid pollicita est et iuravit opere conplebit";
kjv[5] = "But if her father disallow her in the day that he heareth; not any of her vows, or of her bonds wherewith she hath bound her soul, shall stand: and the LORD shall forgive her, because her father disallowed her.";
rsv[5] = "But if her father expresses disapproval to her on the day that he hears of it, no vow of hers, no pledge by which she has bound herself, shall stand; and the LORD will forgive her, because her father opposed her.";
asv[5] = "But if her father disallow her in the day that he heareth, none of her vows, or of her bonds wherewith she hath bound her soul, shall stand: and Jehovah will forgive her, because her father disallowed her.";
yng[5] = "`And if her father hath disallowed her in the day of his hearing, none of her vows and her bonds which she hath bound on her soul is established, and Jehovah is propitious to her, for her father hath disallowed her.";
dby[5] = "But if her father prohibited her in the day that he heard, none of her vows, or of her bonds wherewith she hath bound her soul, shall stand; and Jehovah shall pardon her, because her father prohibited her.";
web[5] = "But if her father shall disallow her in the day that he heareth; not any of her vows or of her bonds with which she hath bound her soul shall stand: and the LORD shall forgive her, because her father disallowed her.";
hnv[5] = "But if her father disallow her in the day that he hears, none of her vows, or of her bonds with which she has bound her soul, shall stand: and the LORD will forgive her, because her father disallowed her.";
vul[5] = "[Vulgate 30:6] sin autem statim ut audierit contradixerit pater et vota et iuramenta eius irrita erunt nec obnoxia tenebitur sponsioni eo quod contradixerit pater";
kjv[6] = "And if she had at all an husband, when she vowed, or uttered ought out of her lips, wherewith she bound her soul;";
rsv[6] = "And if she is married to a husband, while under her vows or any thoughtless utterance of her lips by which she has bound herself,";
asv[6] = "And if she be [married] to a husband, while her vows are upon her, or the rash utterance of her lips, wherewith she hath bound her soul,";
yng[6] = "`And if she be at all to a husband, and her vows [are] on her, or a wrongful utterance [on] her lips, which she hath bound on her soul,";
dby[6] = "And if she have a husband, when she hath her vow upon her or ought that hath passed her lips wherewith she hath bound her soul,";
web[6] = "And if she had a husband when she vowed, or uttered aught from her lips, with which she bound her soul;";
hnv[6] = "If she be [married] to a husband, while her vows are on her, or the rash utterance of her lips, with which she has bound her soul,";
vul[6] = "[Vulgate 30:7] si maritum habuerit et voverit aliquid et semel verbum de ore eius egrediens animam illius obligaverit iuramento";
kjv[7] = "And her husband heard [it,] and held his peace at her in the day that he heard [it]: then her vows shall stand, and her bonds wherewith she bound her soul shall stand.";
rsv[7] = "and her husband hears of it, and says nothing to her on the day that he hears; then her vows shall stand, and her pledges by which she has bound herself shall stand.";
asv[7] = "and her husband hear it, and hold his peace at her in the day that he heareth it; then her vows shall stand, and her bonds wherewith she hath bound her soul shall stand.";
yng[7] = "and her husband hath heard, and in the day of his hearing, he hath kept silent at her, then have her vows been established, and her bonds which she hath bound on her soul are established.";
dby[7] = "and her husband hear it and be silent at her in the day that he heareth it, then her vows shall stand, and her bonds wherewith she bound her soul shall stand.";
web[7] = "And her husband heard [it], and held his peace at her in the day that he heard [it]: then her vows shall stand, and her bonds with which she bound her soul shall stand.";
hnv[7] = "and her husband hear it, and hold his shalom at her in the day that he hears it; then her vows shall stand, and her bonds with which she has bound her soul shall stand.";
vul[7] = "[Vulgate 30:8] quo die audierit vir et non contradixerit voti rea erit reddet quodcumque promiserat";
kjv[8] = "But if her husband disallowed her on the day that he heard [it]; then he shall make her vow which she vowed, and that which she uttered with her lips, wherewith she bound her soul, of none effect: and the LORD shall forgive her.";
rsv[8] = "But if, on the day that her husband comes to hear of it, he expresses disapproval, then he shall make void her vow which was on her, and the thoughtless utterance of her lips, by which she bound herself; and the LORD will forgive her.";
asv[8] = "But if her husband disallow her in the day that he heareth it, then he shall make void her vow which is upon her, and the rash utterance of her lips, wherewith she hath bound her soul: and Jehovah will forgive her.";
yng[8] = "`And if in the day of her husband\'s hearing he disalloweth her, then he hath broken her vow which [is] on her, and the wrongful utterance of her lips which she hath bound on her soul, and Jehovah is propitious to her.";
dby[8] = "But if her husband prohibit her on the day that he heareth it, and annul her vow which is upon her, and what hath passed her lips, wherewith she hath bound her soul, then Jehovah shall pardon her.";
web[8] = "But if her husband disallowed her on the day that he heard [it]; then he shall make of no effect her vow which she vowed, and that which she uttered with her lips, with which she bound her soul: and the LORD shall forgive her.";
hnv[8] = "But if her husband disallow her in the day that he hears it, then he shall make void her vow which is on her, and the rash utterance of her lips, with which she has bound her soul: and the LORD will forgive her.";
vul[8] = "[Vulgate 30:9] sin autem audiens statim contradixerit et irritas fecerit pollicitationes eius verbaque quibus obstrinxerat animam suam propitius ei erit Dominus";
kjv[9] = "But every vow of a widow, and of her that is divorced, wherewith they have bound their souls, shall stand against her.";
rsv[9] = "But any vow of a widow or of a divorced woman, anything by which she has bound herself, shall stand against her.";
asv[9] = "But the vow of a widow, or of her that is divorced, [even] everything wherewith she hath bound her soul, shall stand against her.";
yng[9] = "`As to the vow of a widow or cast-out woman, all that she hath bound on her soul is established on her.";
dby[9] = "But the vow of a widow, and of her that is divorced, -- everything wherewith she hath bound her soul shall stand against her.";
web[9] = "But every vow of a widow, and of her that is divorced, with which they have bound their souls, shall stand against her.";
hnv[9] = "But the vow of a widow, or of her who is divorced, [even] everything with which she has bound her soul, shall stand against her.";
vul[9] = "[Vulgate 30:10] vidua et repudiata quicquid voverint reddent";
kjv[10] = "And if she vowed in her husband\'s house, or bound her soul by a bond with an oath;";
rsv[10] = "And if she vowed in her husband\'s house, or bound herself by a pledge with an oath,";
asv[10] = "And if she vowed in her husband\'s house, or bound her soul by a bond with an oath,";
yng[10] = "`And if [in] the house of her husband she hath vowed, or hath bound a bond on her soul with an oath,";
dby[10] = "And if she have vowed in her husband\'s house, or have bound her soul by an oath with a bond,";
web[10] = "And if she vowed in her husband\'s house, or bound her soul by a bond with an oath;";
hnv[10] = "If she vowed in her husband\'s house, or bound her soul by a bond with an oath,";
vul[10] = "[Vulgate 30:11] uxor in domo viri cum se voto constrinxerit et iuramento";
kjv[11] = "And her husband heard [it], and held his peace at her, [and] disallowed her not: then all her vows shall stand, and every bond wherewith she bound her soul shall stand.";
rsv[11] = "and her husband heard of it, and said nothing to her, and did not oppose her; then all her vows shall stand, and every pledge by which she bound herself shall stand.";
asv[11] = "and her husband heard it, and held his peace at her, and disallowed her not; then all her vows shall stand, and every bond wherewith she bound her soul shall stand.";
yng[11] = "and her husband hath heard, and hath kept silent at her -- he hath not disallowed her -- then have all her vows been established, and every bond which she hath bound on her soul is established.";
dby[11] = "and her husband have heard it, and been silent at her, and hath not prohibited her, then all her vows shall stand, and every bond wherewith she hath bound her soul shall stand.";
web[11] = "And her husband heard [it], and held his peace at her, [and] disallowed her not: then all her vows shall stand, and every bond with which she bound her soul shall stand.";
hnv[11] = "and her husband heard it, and held his shalom at her, and didn\'t disallow her; then all her vows shall stand, and every bond with which she bound her soul shall stand.";
vul[11] = "[Vulgate 30:12] si audierit vir et tacuerit nec contradixerit sponsioni reddet quodcumque promiserat";
kjv[12] = "But if her husband hath utterly made them void on the day he heard [them; then] whatsoever proceeded out of her lips concerning her vows, or concerning the bond of her soul, shall not stand: her husband hath made them void; and the LORD shall forgive her.";
rsv[12] = "But if her husband makes them null and void on the day that he hears them, then whatever proceeds out of her lips concerning her vows, or concerning her pledge of herself, shall not stand: her husband has made them void, and the LORD will forgive her.";
asv[12] = "But if her husband made them null and void in the day that he heard them, then whatsoever proceeded out of her lips concerning her vows, or concerning the bond of her soul, shall not stand: her husband hath made them void; and Jehovah will forgive her.";
yng[12] = "`And if her husband doth certainly break them in the day of his hearing, none of the outgoing of her lips concerning her vows, or concerning the bond of her soul, is established -- her husband hath broken them -- and Jehovah is propitious to her.";
dby[12] = "But if her husband have expressly annulled them on the day that he heard them, then nothing of that which is gone out of her lips as to her vows or the bond on her soul, shall stand: her husband hath annulled them; and Jehovah will pardon her.";
web[12] = "But if her husband hath utterly made them void on the day he heard [them]; [then] whatever proceeded out of her lips concerning her vows, or concerning the bond of her soul, shall not stand: her husband hath made them void; and the LORD shall forgive her.";
hnv[12] = "But if her husband made them null and void in the day that he heard them, then whatever proceeded out of her lips concerning her vows, or concerning the bond of her soul, shall not stand: her husband has made them void; and the LORD will forgive her.";
vul[12] = "[Vulgate 30:13] sin autem extemplo contradixerit non tenebitur promissionis rea quia maritus contradixit et Dominus ei propitius erit";
kjv[13] = "Every vow, and every binding oath to afflict the soul, her husband may establish it, or her husband may make it void.";
rsv[13] = "Any vow and any binding oath to afflict herself, her husband may establish, or her husband may make void.";
asv[13] = "Every vow, and every binding oath to afflict the soul, her husband may establish it, or her husband may make it void.";
yng[13] = "`Every vow and every oath -- a bond to humble a soul -- her husband doth establish it, or her husband doth break it;";
dby[13] = "Every vow, and every binding oath to afflict the soul, her husband can establish it, or her husband can annul it.";
web[13] = "Every vow, and every binding oath to afflict the soul, her husband may establish it, or her husband may make it void.";
hnv[13] = "Every vow, and every binding oath to afflict the soul, her husband may establish it, or her husband may make it void.";
vul[13] = "[Vulgate 30:14] si voverit et iuramento se constrinxerit ut per ieiunium vel ceterarum rerum abstinentiam adfligat animam suam in arbitrio viri erit ut faciat sive non faciat";
kjv[14] = "But if her husband altogether hold his peace at her from day to day; then he establisheth all her vows, or all her bonds, which [are] upon her: he confirmeth them, because he held his peace at her in the day that he heard [them].";
rsv[14] = "But if her husband says nothing to her from day to day, then he establishes all her vows, or all her pledges, that are upon her; he has established them, because he said nothing to her on the day that he heard of them.";
asv[14] = "But if her husband altogether hold his peace at her from day to day, then he establisheth all her vows, or all her bonds, which are upon her: he hath established them, because he held his peace at her in the day that he heard them.";
yng[14] = "and if her husband certainly keep silent at her, from day unto day, then he hath established all her vows, or all her bonds which [are] upon her; he hath established them, for he hath kept silent at her in the day of his hearing;";
dby[14] = "And if her husband be altogether silent at her from day to day, then he hath established all her vows or all her bonds which are upon her; he hath confirmed them, for he hath been silent at her in the day that he heard them.";
web[14] = "But if her husband altogether holds his peace at her from day to day; then he establisheth all her vows, or all her bonds, which [are] upon her: he confirmeth them, because he held his peace at her in the day that he heard [them].";
hnv[14] = "But if her husband altogether hold his shalom at her from day to day, then he establishes all her vows, or all her bonds, which are on her: he has established them, because he held his shalom at her in the day that he heard them.";
vul[14] = "[Vulgate 30:15] quod si audiens vir tacuerit et in alteram diem distulerit sententiam quicquid voverat atque promiserat reddet quia statim ut audivit tacuit";
kjv[15] = "But if he shall any ways make them void after that he hath heard [them]; then he shall bear her iniquity.";
rsv[15] = "But if he makes them null and void after he has heard of them, then he shall bear her iniquity.&quot;";
asv[15] = "But if he shall make them null and void after that he hath heard them, then he shall bear her iniquity.";
yng[15] = "and if he doth at all break them after his hearing, then he hath borne her iniquity.\'";
dby[15] = "But if he in any way annul them after he hath heard them, then he shall bear her iniquity.";
web[15] = "But if he shall any way make them void after that he hath heard [them]; then he shall bear her iniquity.";
hnv[15] = "But if he shall make them null and void after that he has heard them, then he shall bear her iniquity.";
vul[15] = "[Vulgate 30:16] sin autem contradixerit postquam rescivit portabit ipse iniquitatem eius";
kjv[16] = "These [are] the statutes, which the LORD commanded Moses, between a man and his wife, between the father and his daughter, [being yet] in her youth in her father\'s house.";
rsv[16] = "These are the statutes which the LORD commanded Moses, as between a man and his wife, and between a father and his daughter, while in her youth, within her father\'s house.";
asv[16] = "These are the statutes, which Jehovah commanded Moses, between a man and his wife, between a father and his daughter, being in her youth, in her father\'s house.";
yng[16] = "These [are] the statutes which Jehovah hath commanded Moses between a man and his wife, between a father and his daughter, in her youth, [in] the house of her father.";
dby[16] = "These are the statutes, which Jehovah commanded Moses, between a man and his wife, between a father and his daughter, in her youth in her father\'s house.";
web[16] = "These [are] the statutes which the LORD commanded Moses, between a man and his wife, between the father and his daughter, [being yet] in her youth in her father\'s house.";
hnv[16] = "These are the statutes, which the LORD commanded Moshe, between a man and his wife, between a father and his daughter, being in her youth, in her father\'s house.";
vul[16] = "[Vulgate 30:17] istae sunt leges quas constituit Dominus Mosi inter virum et uxorem inter patrem et filiam quae in puellari adhuc aetate est vel quae manet in parentis domo";
csb[1] = "Moses told the leaders of the Israelite tribes, &quot;This is what the LORD has commanded:";
csb[2] = "&quot;When a man makes a vow to the LORD or swears an oath to put himself under an obligation, he must not break his word; he must do whatever he has promised.";
csb[3] = "&quot;When a woman in her father\'s house during her youth makes a vow to the LORD or puts herself under an obligation,";
csb[4] = "&quot;and her father hears about her vow or the obligation she put herself under, and he says nothing to her, all her vows and every obligation she put herself under are binding.";
csb[5] = "&quot;But if her father prohibits her on the day he hears about it, none of her vows and none of the obligations she put herself under are binding. The LORD will release her because her father has prohibited her.";
csb[6] = "&quot;If a woman marries while her vows or the rash commitment she herself made are binding,";
csb[7] = "&quot;and her husband hears about it and says nothing to her when he finds out, her vows are binding, and the obligations she put herself under are binding.";
csb[8] = "&quot;But if her husband prohibits her when he hears about it, he will cancel her vow that is binding or the rash commitment she herself made, and the LORD will release her.";
csb[9] = "&quot;Every vow a widow or divorced woman puts herself under is binding on her.";
csb[10] = "&quot;If a woman in her husband\'s house has made a vow or put herself under an obligation with an oath,";
csb[11] = "&quot;and her husband hears about it, says nothing to her, and does not prohibit her, all her vows are binding, and every obligation she put herself under is binding.";
csb[12] = "&quot;But if her husband cancels them on the day he hears about it, nothing that came from her lips, whether her vows or her obligation, is binding. Her husband has canceled them, and the LORD will release her.";
csb[13] = "&quot;Her husband may confirm or cancel any vow or any sworn obligation to deny herself.";
csb[14] = "&quot;If her husband says nothing at all to her from day to day, he confirms all her vows and obligations, which are binding. He has confirmed them because he said nothing to her when he heard about them.";
csb[15] = "&quot;But if he cancels them after he hears about them, he will be responsible for her commitment.&quot;";
csb[16] = "These are the statutes that the LORD commanded Moses concerning the relationship between a man and his wife, or between a father and his daughter in his house during her youth.";
