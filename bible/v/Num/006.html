asv[3] = "he shall separate himself from wine and strong drink; he shall drink no vinegar of wine, or vinegar of strong drink, neither shall he drink any juice of grapes, nor eat fresh grapes or dried.";
yng[3] = "from wine and strong drink he doth keep separate; vinegar of wine, and vinegar of strong drink he doth not drink, and any juice of grapes he doth not drink, and grapes moist or dry he doth not eat;";
dby[3] = "he shall separate himself from wine and strong drink: he shall drink no vinegar of wine, nor vinegar of strong drink, neither shall he drink any liquor of grapes, nor eat grapes, fresh or dried.";

csb[1] = "The LORD instructed Moses:";
csb[2] = "&quot;Speak to the Israelites and tell them: When a man or woman makes a special vow, a Nazirite vow, to consecrate himself to the LORD,";
csb[3] = "&quot;he is to abstain from wine and beer. He must not drink vinegar made from wine or from beer. He must not drink any grape juice or eat fresh grapes or raisins.";
csb[4] = "&quot;He is not to eat anything produced by the grapevine, from seeds to skin, during the period of his consecration.";
csb[5] = "&quot;You must not cut his hair throughout the time of his vow of consecration. He may be holy until the time is completed during which he consecrates himself to the LORD; he is to let the hair of his head grow long.";
csb[6] = "&quot;He must not go near a dead body during the time he consecrates himself to the LORD.";
csb[7] = "&quot;He is not to defile himself for his father or mother, or his brother or sister, when they die, while the mark of consecration to his God is on his head.";
csb[8] = "&quot;He is holy to the LORD during the time of consecration.";
csb[9] = "&quot;If someone suddenly dies near him, defiling his consecrated head, he must shave his head on the day of his purification; he is to shave it on the seventh day.";
csb[10] = "&quot;On the eighth day he is to bring two turtledoves or two young pigeons to the priest at the entrance to the tent of meeting.";
csb[11] = "&quot;The priest is to offer one as a sin offering and the other as a burnt offering to make atonement on behalf of the Nazirite, since he incurred guilt because of the corpse. On that day he is to consecrate his head again.";
csb[12] = "&quot;He is to rededicate his time of consecration to the LORD and to bring a year-old male lamb as a guilt offering. But do not count the initial period of consecration because it became defiled.";
csb[13] = "&quot;This is the law of the Nazirite: On the day his time of consecration is completed, he is to be brought to the entrance to the tent of meeting.";
csb[14] = "&quot;He is to present an offering to the LORD of one unblemished year-old male lamb as a burnt offering, one unblemished year-old female lamb as a sin offering, one unblemished ram as a fellowship offering,";
csb[15] = "&quot;along with their grain offerings and drink offerings, and a basket of unleavened cakes made from fine flour mixed with oil, and unleavened wafers coated with oil.";
csb[16] = "&quot;The priest is to present these before the LORD and sacrifice the Nazirite\'s sin offering and burnt offering.";
csb[17] = "&quot;He will also offer the ram as a fellowship sacrifice to the LORD, together with the basket of unleavened bread. Then the priest will offer the accompanying grain offering and drink offering.";
csb[18] = "&quot;The Nazirite is to shave his consecrated head at the entrance to the tent of meeting, take the hair from his head, and put it on the fire under the fellowship sacrifice.";
csb[19] = "&quot;The priest is to take the boiled shoulder from the ram, one unleavened cake from the basket, and one unleavened wafer, and put them into the hands of the Nazirite after he has shaved his consecrated head.";
csb[20] = "&quot;The priest is to present them as a presentation offering before the LORD. It is a holy portion for the priest, in addition to the breast of the presentation offering and the thigh of the contribution. After that, the Nazirite may drink wine.";
csb[21] = "&quot;These are the instructions about the Nazirite who vows his offering to the LORD for his consecration, in addition to whatever else he can afford; he must fulfill whatever vow he makes in keeping with the instructions for his consecration.&quot;";
csb[22] = "The LORD spoke to Moses:";
csb[23] = "&quot;Tell Aaron and his sons, \'This is how you are to bless the Israelites. You should say to them,";
csb[24] = "&quot;May the LORD bless you and protect you;";
csb[25] = "&quot;may the LORD make his face shine on you and be gracious to you;";
csb[26] = "&quot;may the LORD look with favor on you and give you peace.&quot; \'";
csb[27] = "In this way they will pronounce my name over the Israelites, and I will bless them.&quot;";
