kjv[54] = "And Moses and Eleazar the priest took the gold of the captains of thousands and of hundreds, and brought it into the tabernacle of the congregation, [for] a memorial for the children of Israel before the LORD.";
rsv[54] = "And Moses and Elea\'zar the priest received the gold from the commanders of thousands and of hundreds, and brought it into the tent of meeting, as a memorial for the people of Israel before the LORD.";
asv[54] = "And Moses and Eleazar the priest took the gold of the captains of thousands and of hundreds, and brought it into the tent of meeting, for a memorial for the children of Israel before Jehovah.";
yng[54] = "and Moses taketh -- Eleazar the priest also -- the gold from the heads of the thousands and of the hundreds, and they bring it in unto the tent of meeting -- a memorial for the sons of Israel before Jehovah.";
dby[54] = "And Moses and Eleazar the priest took the gold of the captains of thousands and of hundreds, and brought it into the tent of meeting, as a memorial for the children of Israel before Jehovah.";
web[54] = "And Moses and Eleazar the priest took the gold of the captains of thousands, and of hundreds, and brought it into the tabernacle of the congregation, [for] a memorial for the children of Israel before the LORD.";
hnv[54] = "Moshe and El`azar the Kohen took the gold of the captains of thousands and of hundreds, and brought it into the tent of meeting, for a memorial for the children of Yisra\'el before the LORD.";
vul[54] = "et susceptum intulerunt in tabernaculum testimonii in monumentum filiorum Israhel coram Domino";
csb[1] = "The LORD spoke to Moses,";
csb[2] = "&quot;Execute vengeance for the Israelites against the Midianites. After that, you will be gathered to your people.&quot;";
csb[3] = "So Moses spoke to the people, &quot;Equip some of your men for war. They will go against Midian to inflict the LORD\'s vengeance on them.";
csb[4] = "&quot;Send one thousand men to war from each Israelite tribe.&quot;";
csb[5] = "So one thousand were recruited from each Israelite tribe out of the thousands in Israel -- twelve thousand equipped for war.";
csb[6] = "Moses sent one thousand from each tribe to war. They went with Phinehas son of Eleazar the priest, in whose care were the holy objects and signal trumpets.";
csb[7] = "They waged war against Midian, as the LORD had commanded Moses, and killed every male.";
csb[8] = "Along with the others slain by them, they killed the Midianite kings -- Evi, Rekem, Zur, Hur, and Reba, the five kings of Midian. They also killed Balaam son of Beor with the sword.";
csb[9] = "The Israelites took the Midianite women and their dependents captive, and they plundered all their cattle, flocks, and property.";
csb[10] = "Then they burned all the cities where the Midianites lived, as well as all their encampments,";
csb[11] = "and took away all the spoils of war and the captives, both people and animals.";
csb[12] = "They brought the prisoners, animals, and spoils of war to Moses, the priest Eleazar, and the Israelite community at the camp on the plains of Moab by the Jordan across from Jericho.";
csb[13] = "Moses, the priest Eleazar, and all the leaders of the community went to meet them outside the camp.";
csb[14] = "But Moses became furious with the officers, the commanders of thousands and commanders of hundreds, who were returning from the military campaign.";
csb[15] = "&quot;Have you let every female live? &quot; he asked them.";
csb[16] = "&quot;Yet they are the ones who, at Balaam\'s advice, incited the Israelites to unfaithfulness against the LORD in the Peor incident, so that the plague came against the LORD\'s community.";
csb[17] = "&quot;So now, kill every male among the dependents and kill every woman who has gone to bed with a man,";
csb[18] = "&quot;but keep alive for yourselves all the young females who have not gone to bed with a man.";
csb[19] = "&quot;You are to remain outside the camp for seven days. All of you and your prisoners who have killed a person or touched the dead are to purify yourselves on the third day and the seventh day.";
csb[20] = "&quot;Also purify everything: garments, leather goods, things made of goat hair, and every article of wood.&quot;";
csb[21] = "Then the priest Eleazar said to the soldiers who had gone to battle, &quot;This is the legal statute the LORD commanded Moses:";
csb[22] = "&quot;The gold, silver, bronze, iron, tin, and lead --";
csb[23] = "&quot;everything that can withstand fire -- you are to pass through fire, and it will be clean. It must still be purified with the purification water. Anything that cannot withstand fire, pass through the water.";
csb[24] = "&quot;On the seventh day wash your clothes, and you will be clean. After that you may enter the camp.&quot;";
csb[25] = "The LORD told Moses,";
csb[26] = "&quot;You, the priest Eleazar, and the family heads of the community are to take a count of what was captured, people and animals.";
csb[27] = "&quot;Then divide the captives between the troops who went out to war and the entire community.";
csb[28] = "&quot;Set aside a tribute for the LORD from what belongs to the fighting men who went out to war: one out of every five hundred people, cattle, donkeys, sheep, and goats.";
csb[29] = "&quot;Take the tribute from their half and give it to the priest Eleazar as a contribution to the LORD.";
csb[30] = "&quot;From the Israelites\' half, take one out of every fifty from the people, cattle, donkeys, sheep, and goats, all the livestock, and give them to the Levites who perform the duties of the LORD\'s tabernacle.&quot;";
csb[31] = "So Moses and the priest Eleazar did as the LORD commanded Moses.";
csb[32] = "The captives remaining from the plunder the army had taken totaled: 675,000 sheep and goats,";
csb[33] = "72,000 cattle,";
csb[34] = "61,000 donkeys,";
csb[35] = "and 32,000 people, all the females who had not gone to bed with a man.";
csb[36] = "The half portion for those who went out to war numbered: 337,500 sheep and goats,";
csb[37] = "and the tribute to the LORD was 675 from the sheep and goats;";
csb[38] = "from the 36,000 cattle, the tribute to the LORD was 72;";
csb[39] = "from the 30,500 donkeys, the tribute to the LORD was 61;";
csb[40] = "and from the 16,000 people, the tribute to the LORD was 32 people.";
csb[41] = "Moses gave the tribute to the priest Eleazar as a contribution for the LORD, as the LORD had commanded Moses.";
csb[42] = "From the Israelites\' half, which Moses separated from the men who fought,";
csb[43] = "the community\'s half was: 337,500 sheep and goats,";
csb[44] = "36,000 cattle,";
csb[45] = "30,500 donkeys,";
csb[46] = "and 16,000 people.";
csb[47] = "Moses took one out of every fifty, selected from the people and the livestock of the Israelites\' half. He gave them to the Levites who perform the duties of the LORD\'s tabernacle, as the LORD had commanded him.";
csb[48] = "The officers who were over the thousands of the army, the commanders of thousands and of hundreds, approached Moses";
csb[49] = "and told him, &quot;Your servants have taken a census of the fighting men under our command, and not one of us is missing.";
csb[50] = "&quot;So we have presented to the LORD an offering of the gold articles each man found -- armlets, bracelets, rings, earrings, and necklaces -- to make atonement for ourselves before the LORD.&quot;";
csb[51] = "Moses and the priest Eleazar received from them all the articles made out of gold.";
csb[52] = "All the gold of the contribution they offered to the LORD, from the commanders of thousands and of hundreds, was 420 pounds.";
csb[53] = "Each of the soldiers had taken plunder for himself.";
csb[54] = "Moses and the priest Eleazar received the gold from the commanders of thousands and of hundreds and brought it into the tent of meeting as a memorial for the Israelites before the LORD.";
</script>
