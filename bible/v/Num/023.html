kjv[23] = "Surely [there is] no enchantment against Jacob, neither [is there] any divination against Israel: according to this time it shall be said of Jacob and of Israel, What hath God wrought!";
rsv[23] = "For there is no enchantment against Jacob, no divination against Israel; now it shall be said of Jacob and Israel, \'What has God wrought!\'";
asv[23] = "Surely there is no enchantment with Jacob; Neither is there any divination with Israel: Now shalt it be said of Jacob and of Israel, What hath God wrought! ";
yng[23] = "For no enchantment [is] against Jacob, Nor divination against Israel, At the time it is said of Jacob and Israel, What hath God wrought!";
dby[23] = "For there is no enchantment against Jacob, neither is there any divination against Israel. At this time it shall be said of Jacob and of Israel, What hath God wrought!";
web[23] = "Surely [there is] no enchantment against Jacob, neither [is there] any divination against Israel: according to this time it shall be said of Jacob and of Israel, What hath God wrought!";
hnv[23] = "Surely there is no enchantment with Ya`akov; Neither is there any divination with Yisra\'el: Now shall it be said of Ya`akov and of Yisra\'el, What has God done!";
vul[23] = "non est augurium in Iacob nec divinatio in Israhel temporibus suis dicetur Iacob et Israheli quid operatus sit Deus";
kjv[24] = "Behold, the people shall rise up as a great lion, and lift up himself as a young lion: he shall not lie down until he eat [of] the prey, and drink the blood of the slain.";
rsv[24] = "Behold, a people! As a lioness it rises up and as a lion it lifts itself; it does not lie down till it devours the prey, and drinks the blood of the slain.&quot;";
asv[24] = "Behold, the people riseth up as a lioness, And as a lion doth he lift himself up: He shall not lie down until he eat of the prey, And drink the blood of the slain. ";
yng[24] = "Lo, the people as a lioness riseth, And as a lion he lifteth himself up, He lieth not down till he eateth prey, And blood of pierced ones doth drink.\'";
dby[24] = "Lo, the people will rise up as a lioness, and lift himself up as a lion. He shall not lie down until he have eaten the prey and drunk the blood of the slain.";
web[24] = "Behold, the people shall rise up as a great lion, and lift up himself as a young lion: he shall not lie down until he shall eat [of] the prey, and drink the blood of the slain.";
hnv[24] = "Behold, the people rises up as a lioness, As a lion does he lift himself up: He shall not lie down until he eat of the prey, Drink the blood of the slain.";
vul[24] = "ecce populus ut leaena consurget et quasi leo erigetur non accubabit donec devoret praedam et occisorum sanguinem bibat";
kjv[25] = "And Balak said unto Balaam, Neither curse them at all, nor bless them at all.";
rsv[25] = "And Balak said to Balaam, &quot;Neither curse them at all, nor bless them at all.&quot;";
asv[25] = "And Balak said unto Balaam, Neither curse them at all, nor bless them at all.";
yng[25] = "And Balak saith unto Balaam, `Neither pierce it at all, nor bless it at all;\'";
dby[25] = "And Balak said to Balaam, Neither curse them at all, nor bless them at all.";
web[25] = "And Balak said to Balaam, Neither curse them at all, nor bless them at all.";
hnv[25] = "Balak said to Bil`am, Neither curse them at all, nor bless them at all.";
vul[25] = "dixitque Balac ad Balaam nec maledicas ei nec benedicas";
kjv[26] = "But Balaam answered and said unto Balak, Told not I thee, saying, All that the LORD speaketh, that I must do?";
rsv[26] = "But Balaam answered Balak, &quot;Did I not tell you, \'All that the LORD says, that I must do\'?&quot;";
asv[26] = "But Balaam answered and said unto Balak, Told not I thee, saying, All that Jehovah speaketh, that I must do?";
yng[26] = "and Balaam answereth and saith unto Balak, `Have I not spoken unto thee, saying, All that Jehovah speaketh -- it I do?\'";
dby[26] = "And Balaam answered and said to Balak, Did I not tell thee, saying, All that Jehovah shall speak, that will I do?";
web[26] = "But Balaam answered and said to Balak, Did I not tell thee, saying, All that the LORD speaketh, that I must do?";
hnv[26] = "But Bil`am answered Balak, Didn\'t I tell you, saying, All that the LORD speaks, that I must do?";
vul[26] = "et ille nonne ait dixi tibi quod quicquid mihi Deus imperaret hoc facerem";
kjv[27] = "And Balak said unto Balaam, Come, I pray thee, I will bring thee unto another place; peradventure it will please God that thou mayest curse me them from thence.";
rsv[27] = "And Balak said to Balaam, &quot;Come now, I will take you to another place; perhaps it will please God that you may curse them for me from there.&quot;";
asv[27] = "And Balak said unto Balaam, Come now, I will take thee unto another place; peradventure it will please God that thou mayest curse me them from thence.";
yng[27] = "And Balak saith unto Balaam, `Come, I pray thee, I take thee unto another place; it may be it is right in the eyes of God -- to pierce it for me from thence.\'";
dby[27] = "And Balak said to Balaam, Come, I pray thee, I will bring thee to another place; perhaps it will be right in the sight of God that thou curse me them from thence.";
web[27] = "And Balak said to Balaam, Come, I pray thee, I will bring thee to another place; perhaps it will please God that thou mayest from thence curse them for me.";
hnv[27] = "Balak said to Bil`am, Come now, I will take you to another place; peradventure it will please God that you may curse me them from there.";
vul[27] = "et ait Balac ad eum veni et ducam te ad alium locum si forte placeat Deo ut inde maledicas eis";
kjv[28] = "And Balak brought Balaam unto the top of Peor, that looketh toward Jeshimon.";
rsv[28] = "So Balak took Balaam to the top of Pe\'or, that overlooks the desert.";
asv[28] = "And Balak took Balaam unto the top of Peor, that looketh down upon the desert.";
yng[28] = "And Balak taketh Balaam to the top of Peor, which is looking on the front of the wilderness,";
dby[28] = "And Balak brought Balaam to the top of Peor, which looks over the surface of the waste.";
web[28] = "And Balak brought Balaam to the top of Peor, that looketh towards Jeshimon.";
hnv[28] = "Balak took Bil`am to the top of Pe`or, that looks down on the desert.";
vul[28] = "cumque duxisset eum super verticem montis Phogor qui respicit solitudinem";
kjv[29] = "And Balaam said unto Balak, Build me here seven altars, and prepare me here seven bullocks and seven rams.";
rsv[29] = "And Balaam said to Balak, &quot;Build for me here seven altars, and provide for me here seven bulls and seven rams.&quot;";
asv[29] = "And Balaam said unto Balak, Build me here seven altars, and prepare me here seven bullocks and seven rams.";
yng[29] = "and Balaam saith unto Balak, `Build for me in this [place] seven altars, and make ready for me in this [place] seven bullocks and seven rams;\'";
dby[29] = "And Balaam said to Balak, Build me here seven altars, and prepare me here seven bullocks and seven rams.";
web[29] = "And Balaam said to Balak, Build me here seven altars, and prepare me here seven bullocks and seven rams.";
hnv[29] = " Bil`am said to Balak, Build me here seven altars, and prepare me here seven bulls and seven rams.";
vul[29] = "dixit ei Balaam aedifica mihi hic septem aras et para totidem vitulos eiusdemque numeri arietes";
kjv[30] = "And Balak did as Balaam had said, and offered a bullock and a ram on [every] altar.";
rsv[30] = "And Balak did as Balaam had said, and offered a bull and a ram on each altar.";
asv[30] = "And Balak did as Balaam had said, and offered up a bullock and a ram on every altar.";
yng[30] = "and Balak doth as Balaam said, and he offereth a bullock and a ram on an altar.";
dby[30] = "And Balak did as Balaam had said, and offered up a bullock and a ram on each altar.";
web[30] = "And Balak did as Balaam had said, and offered a bullock and a ram on [every] altar.";
hnv[30] = "Balak did as Bil`am had said, and offered up a bull and a ram on every altar.";
vul[30] = "fecit Balac ut Balaam dixerat inposuitque vitulos et arietes per singulas aras";
csb[1] = "Then Balaam said to Balak, &quot;Build me seven altars here and prepare seven bulls and seven rams for me.&quot;";
csb[2] = "So Balak did as Balaam directed, and they offered a bull and a ram on each altar.";
csb[3] = "Balaam said to Balak, &quot;Stay here by your burnt offering while I am gone. Maybe the LORD will meet with me. I will tell you whatever he reveals to me.&quot; So he went to a barren hill.";
csb[4] = "God met with him and Balaam said to him, &quot;I have arranged seven altars and offered a bull and a ram on each altar.&quot;";
csb[5] = "Then the LORD put a message in Balaam\'s mouth and said, &quot;Return to Balak and say what I tell you.&quot;";
csb[6] = "So he returned to Balak, who was standing there by his burnt offering with all the officials of Moab.";
csb[7] = "Balaam proclaimed his poem: Balak brought me from Aram; the king of Moab, from the eastern mountains: &quot;Come, put a curse on Jacob for me; come, denounce Israel! &quot;";
csb[8] = "How can I curse someone God has not cursed? How can I denounce someone the LORD has not denounced?";
csb[9] = "I see them from the top of rocky cliffs, and I watch them from the hills. There is a people living alone; it does not consider itself among the nations.";
csb[10] = "Who has counted the dust of Jacob or numbered even one-fourth of Israel? Let me die the death of the upright; let the end of my life be like theirs.";
csb[11] = "&quot;What have you done to me? &quot; Balak asked Balaam. &quot;I brought you to curse my enemies, but look, you have only blessed them! &quot;";
csb[12] = "He answered, &quot;Shouldn\'t I say exactly what the LORD puts in my mouth? &quot;";
csb[13] = "Then Balak said to him, &quot;Please come with me to another place where you can see them. You will only see the outskirts of their camp; you won\'t see all of them. From there, put a curse on them for me.&quot;";
csb[14] = "So Balak took him to Lookout Field on top of Pisgah, built seven altars, and offered a bull and a ram on each altar.";
csb[15] = "Balaam said to Balak, &quot;Stay here by your burnt offering while I seek the LORD over there.&quot;";
csb[16] = "The LORD met with Balaam and put a message in his mouth. Then he said, &quot;Return to Balak and say what I tell you.&quot;";
csb[17] = "So he returned to Balak, who was standing there by his burnt offering with the officials of Moab. Balak asked him, &quot;What did the LORD say? &quot;";
csb[18] = "Balaam proclaimed his poem: Balak, get up and listen; son of Zippor, pay attention to what I say!";
csb[19] = "God is not a man, that he might lie, or a son of man, that he might change his mind. Does he speak and not act, or promise and not fulfill?";
csb[20] = "I have indeed received a command to bless; since he has blessed, I cannot change it.";
csb[21] = "He considers no disaster for Jacob; he sees no trouble for Israel. The LORD their God is with them, and there is rejoicing over the King among them.";
csb[22] = "God brought them out of Egypt; he is like the horns of a wild ox for them.";
csb[23] = "There is no magic curse against Jacob and no divination against Israel. It will now be said about Jacob and Israel, &quot;What great things God has done! &quot;";
csb[24] = "A people rise up like a lioness; they rouse themselves like a lion. They will not lie down until they devour the prey and drink the blood of the slain.";
csb[25] = "Then Balak told Balaam, &quot;Don\'t curse them and don\'t bless them! &quot;";
csb[26] = "But Balaam answered him, &quot;Didn\'t I tell you: Whatever the LORD says, I must do? &quot;";
csb[27] = "Again Balak said to Balaam, &quot;Please come. I will take you to another place. Maybe it will be agreeable to God that you can put a curse on them for me there.&quot;";
csb[28] = "So Balak took Balaam to the top of Peor, which overlooks the wasteland.";
csb[29] = "Balaam told Balak, &quot;Build me seven altars here and prepare seven bulls and seven rams for me.&quot;";
csb[30] = "So Balak did as Balaam said and offered a bull and a ram on each altar.";
</script>
