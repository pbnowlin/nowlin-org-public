rsv[26] = "his host as numbered being sixty-two thousand seven hundred.";
asv[26] = "And his host, and those that were numbered of them, were threescore and two thousand and seven hundred.";
yng[26] = "and his host, and their numbered ones, [are] two and sixty thousand and seven hundred.";
dby[26] = "and his host, even those that were numbered of them, sixty-two thousand seven hundred.";
web[26] = "And his host, and those that were numbered of them, [were] sixty and two thousand and seven hundred.";
hnv[26] = "His division, and those who were numbered of them, were sixty-two thousand seven hundred.";
vul[26] = "cunctus exercitus pugnatorum eius qui numerati sunt sexaginta duo milia septingenti";
kjv[27] = "And those that encamp by him [shall be] the tribe of Asher: and the captain of the children of Asher [shall be] Pagiel the son of Ocran.";
rsv[27] = "And those to encamp next to him shall be the tribe of Asher, the leader of the people of Asher being Pa\'giel the son of Ochran,";
asv[27] = "And those that encamp next unto him shall be the tribe of Asher: and the prince of the children of Asher shall be Pagiel the son of Ochran.";
yng[27] = "And those encamping by him [are of] the tribe of Asher; and the prince of the sons of Asher [is] Pagiel son of Ocran;";
dby[27] = "And those that encamp by him shall be the tribe of Asher; and the prince of the sons of Asher shall be Pagiel the son of Ocran;";
web[27] = "And those that encamp by him [shall be] the tribe of Asher: and the captain of the children of Asher [shall be] Pagiel the son of Ocran.";
hnv[27] = "&quot;Those who encamp next to him shall be the tribe of Asher: and the prince of the children of Asher shall be Pag`i\'el the son of `Okhran.";
vul[27] = "iuxta eum fixere tentoria de tribu Aser quorum princeps fuit Phegihel filius Ochran";
kjv[28] = "And his host, and those that were numbered of them, [were] forty and one thousand and five hundred.";
rsv[28] = "his host as numbered being forty-one thousand five hundred.";
asv[28] = "And his hosts, and those that were numbered of them, were forty and one thousand and five hundred.";
yng[28] = "and his host, and their numbered ones, [are] one and forty thousand and five hundred.";
dby[28] = "and his host, even those that were numbered of them, forty-one thousand five hundred.";
web[28] = "And his host, and those that were numbered of them, [were] forty and one thousand and five hundred.";
hnv[28] = "His division, and those who were numbered of them, were forty-one thousand and five hundred.";
vul[28] = "cunctus exercitus pugnatorum eius qui numerati sunt quadraginta milia et mille quingenti";
kjv[29] = "Then the tribe of Naphtali: and the captain of the children of Naphtali [shall be] Ahira the son of Enan.";
rsv[29] = "Then the tribe of Naph\'tali, the leader of the people of Naph\'tali being Ahi\'ra the son of Enan,";
asv[29] = "And the tribe of Naphtali: and the prince of the children of Naphtali shall be Ahira the son of Enan.";
yng[29] = "And the tribe of Naphtali; and the prince of the sons of Naphtali [is] Ahira son of Enan;";
dby[29] = "And [with them shall be] the tribe of Naphtali; and the prince of the sons of Naphtali shall be Ahira the son of Enan;";
web[29] = "Then the tribe of Naphtali: and the captain of the children of Naphtali [shall be] Ahira the son of Enan.";
hnv[29] = "&quot;The tribe of Naftali: and the prince of the children of Naftali shall be Achira the son of `Enan.";
vul[29] = "de tribu filiorum Nepthalim princeps fuit Ahira filius Henan";
kjv[30] = "And his host, and those that were numbered of them, [were] fifty and three thousand and four hundred.";
rsv[30] = "his host as numbered being fifty-three thousand four hundred.";
asv[30] = "And his host, and those that were numbered of them, were fifty and three thousand and four hundred.";
yng[30] = "and his host, and their numbered ones, [are] three and fifty thousand and four hundred.";
dby[30] = "and his host, even those that were numbered of them, fifty-three thousand four hundred.";
web[30] = "And his host, and those that were numbered of them, [were] fifty and three thousand and four hundred.";
hnv[30] = "His division, and those who were numbered of them, were fifty-three thousand four hundred.";
vul[30] = "cunctus exercitus pugnatorum eius quinquaginta tria milia quadringenti";
kjv[31] = "All they that were numbered in the camp of Dan [were] an hundred thousand and fifty and seven thousand and six hundred. They shall go hindmost with their standards.";
rsv[31] = "The whole number of the camp of Dan is a hundred and fifty-seven thousand six hundred. They shall set out last, standard by standard.&quot;";
asv[31] = "All that were numbered of the camp of Dan were a hundred thousand and fifty and seven thousand and six hundred. They shall set forth hindmost by their standards.";
yng[31] = "All those numbered of the camp of Dan [are] a hundred thousand, and seven and fifty thousand, and six hundred; at the rear they journey, by their standards.";
dby[31] = "All that were numbered of the camp of Dan were a hundred and fifty-seven thousand six hundred. They shall set forth last according to their standards.";
web[31] = "All they that were numbered in the camp of Dan [were] a hundred thousand and fifty and seven thousand and six hundred: they shall go hindmost with their standards.";
hnv[31] = "&quot;All who were numbered of the camp of Dan were one hundred fifty-seven thousand six hundred. They shall set out last by their standards.&quot;";
vul[31] = "omnes qui numerati sunt in castris Dan fuerunt centum quinquaginta septem milia sescenti et novissimi proficiscentur";
kjv[32] = "These [are] those which were numbered of the children of Israel by the house of their fathers: all those that were numbered of the camps throughout their hosts [were] six hundred thousand and three thousand and five hundred and fifty.";
rsv[32] = "These are the people of Israel as numbered by their fathers\' houses; all in the camps who were numbered by their companies were six hundred and three thousand five hundred and fifty.";
asv[32] = "These are they that were numbered of the children of Israel by their fathers\' houses: all that were numbered of the camps according to their hosts were six hundred thousand and three thousand and five hundred and fifty.";
yng[32] = "These [are] those numbered of the sons of Israel by the house of their fathers; all those numbered of the camps by their hosts [are] six hundred thousand, and three thousand, and five hundred and fifty.";
dby[32] = "These are those that were numbered of the children of Israel, according to their fathers\' houses: all those that were numbered of the camps, according to their hosts, were six hundred and three thousand five hundred and fifty.";
web[32] = "These [are] those who were numbered of the children of Israel by the house of their fathers. All those that were numbered of the camps throughout their hosts, [were] six hundred thousand and three thousand and five hundred and fifty.";
hnv[32] = "These are those who were numbered of the children of Yisra\'el by their fathers\' houses. All who were numbered of the camps according to their hosts were six hundred three thousand five hundred fifty.";
vul[32] = "hic numerus filiorum Israhel per domos cognationum suarum et turmas divisi exercitus sescenta tria milia quingenti quinquaginta";
kjv[33] = "But the Levites were not numbered among the children of Israel; as the LORD commanded Moses.";
rsv[33] = "But the Levites were not numbered among the people of Israel, as the LORD commanded Moses.";
asv[33] = "But the Levites were not numbered among the children of Israel; as Jehovah commanded Moses.";
yng[33] = "And the Levites have not numbered themselves in the midst of the sons of Israel, as Jehovah hath commanded Moses.";
dby[33] = "But the Levites were not numbered among the children of Israel; as Jehovah had commanded Moses.";
web[33] = "But the Levites were not numbered among the children of Israel; as the LORD commanded Moses.";
hnv[33] = "But the Levites were not numbered among the children of Yisra\'el; as the LORD commanded Moshe.";
vul[33] = "Levitae autem non sunt numerati inter filios Israhel sic enim praecepit Dominus Mosi";
kjv[34] = "And the children of Israel did according to all that the LORD commanded Moses: so they pitched by their standards, and so they set forward, every one after their families, according to the house of their fathers.";
rsv[34] = "Thus did the people of Israel. According to all that the LORD commanded Moses, so they encamped by their standards, and so they set out, every one in his family, according to his fathers\' house.";
asv[34] = "Thus did the children of Israel; according to all that Jehovah commanded Moses, so they encamped by their standards, and so they set forward, every one by their families, according to their fathers\' houses.";
yng[34] = "And the sons of Israel do according to all that Jehovah hath commanded Moses; so they have encamped by their standards, and so they have journeyed; each by his families, by the house of his fathers.";
dby[34] = "And the children of Israel did according to all that Jehovah had commanded Moses: so they encamped according to their standards, and so they journeyed, every one according to their families, according to their fathers\' houses.";
web[34] = "And the children of Israel did according to all that the LORD commanded Moses: so they pitched by their standards, and so they moved forward, every one after their families, according to the house of their fathers.";
hnv[34] = "Thus the children of Yisra\'el did. According to all that the LORD commanded Moshe, so they encamped by their standards, and so they set out, everyone by their families, according to their fathers\' houses.";
vul[34] = "feceruntque filii Israhel iuxta omnia quae mandaverat Dominus castrametati sunt per turmas suas et profecti per familias ac domos patrum suorum";
csb[1] = "The LORD spoke to Moses and Aaron:";
csb[2] = "&quot;The Israelites are to camp under their respective banners beside the flags of their ancestral families. They are to camp around the tent of meeting at a distance from it:";
csb[3] = "&quot;Judah\'s military divisions will camp on the east side toward the sunrise under their banner. The leader of the descendants of Judah is Nahshon son of Amminadab.";
csb[4] = "&quot;His military division numbers 74,600.";
csb[5] = "&quot;The tribe of Issachar will camp next to it. The leader of the Issacharites is Nethanel son of Zuar.";
csb[6] = "&quot;His military division numbers 54,400.";
csb[7] = "&quot;The tribe of Zebulun will be next. The leader of the Zebulunites is Eliab son of Helon.";
csb[8] = "&quot;His military division numbers 57,400.";
csb[9] = "&quot;The total number in their military divisions who belong to Judah\'s encampment is 186,400; they will move out first.";
csb[10] = "&quot;Reuben\'s military divisions will camp on the south side under their banner. The leader of the Reubenites is Elizur son of Shedeur.";
csb[11] = "&quot;His military division numbers 46,500.";
csb[12] = "&quot;The tribe of Simeon will camp next to it. The leader of the Simeonites is Shelumiel son of Zurishaddai.";
csb[13] = "&quot;His military division numbers 59,300.";
csb[14] = "&quot;The tribe of Gad will be next. The leader of the Gadites is Eliasaph son of Deuel.";
csb[15] = "&quot;His military division numbers 45,650.";
csb[16] = "&quot;The total number in their military divisions who belong to Reuben\'s encampment is 151,450; they will move out second.";
csb[17] = "&quot;The tent of meeting is to move out with the Levites\' camp, which is in the middle of the camps. They are to move out just as they camp, each in his place, with their banners.";
csb[18] = "&quot;Ephraim\'s military divisions will camp on the west side under their banner. The leader of the Ephraimites is Elishama son of Ammihud.";
csb[19] = "&quot;His military division numbers 40,500.";
csb[20] = "&quot;The tribe of Manasseh will be next to it. The leader of the Manassites is Gamaliel son of Pedahzur.";
csb[21] = "&quot;His military division numbers 32,200.";
csb[22] = "&quot;The tribe of Benjamin will be next. The leader of the Benjaminites is Abidan son of Gideoni.";
csb[23] = "&quot;His military division numbers 35,400.";
csb[24] = "&quot;The total in their military divisions who belong to Ephraim\'s encampment number 108,100; they will move out third.";
csb[25] = "&quot;Dan\'s military divisions will camp on the north side under their banner. The leader of the Danites is Ahiezer son of Ammishaddai.";
csb[26] = "&quot;His military division numbers 62,700.";
csb[27] = "&quot;The tribe of Asher will camp next to it. The leader of the Asherites is Pagiel son of Ochran.";
csb[28] = "&quot;His military division numbers 41,500.";
csb[29] = "&quot;The tribe of Naphtali will be next. The leader of the Naphtalites is Ahira son of Enan.";
csb[30] = "&quot;His military division numbers 53,400.";
csb[31] = "&quot;The total number who belong to Dan\'s encampment is 157,600; they are to move out last, with their banners.&quot;";
csb[32] = "These are the Israelites registered by their ancestral families. The total number in the camps by their military divisions is 603,550.";
csb[33] = "But the Levites were not registered among the Israelites, just as the LORD had commanded Moses.";
csb[34] = "The Israelites did everything the LORD commanded Moses; they camped by their banners in this way and moved out the same way, each man by his clan and by his ancestral family.";
