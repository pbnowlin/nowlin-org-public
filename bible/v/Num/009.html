kjv[13] = "But the man that [is] clean, and is not in a journey, and forbeareth to keep the passover, even the same soul shall be cut off from among his people: because he brought not the offering of the LORD in his appointed season, that man shall bear his sin.";
rsv[13] = "But the man who is clean and is not on a journey, yet refrains from keeping the passover, that person shall be cut off from his people, because he did not offer the LORD\'s offering at its appointed time; that man shall bear his sin.";
asv[13] = "But the man that is clean, and is not on a journey, and forbeareth to keep the passover, that soul shall be cut off from his people; because he offered not the oblation of Jehovah in its appointed season, that man shall bear his sin.";
yng[13] = "`And the man who is clean, and hath not been on a journey, and hath ceased to prepare the passover, even that person hath been cut off from his people; because the offering of Jehovah he hath not brought near, in its appointed season, that man doth bear his sin.";
dby[13] = "But a man that is clean, and is not on a journey, and forbeareth to hold the passover, that soul shall be cut off from among his peoples; because he presented not the offering of Jehovah at its set time: that man shall bear his sin.";
web[13] = "But the man that [is] clean, and is not in a journey, and forbeareth to keep the passover, even the same soul shall be cut off from among his people: because he brought not the offering of the LORD in its appointed season, that man shall bear his sin.";
hnv[13] = "But the man who is clean, and is not on a journey, and fails to keep the Pesach, that soul shall be cut off from his people. Because he didn\'t offer the offering of the LORD in its appointed season, that man shall bear his sin.";
vul[13] = "si quis autem et mundus est et in itinere non fuit et tamen non fecit phase exterminabitur anima illa de populis suis quia sacrificium Domino non obtulit tempore suo peccatum suum ipse portabit";
kjv[14] = "And if a stranger shall sojourn among you, and will keep the passover unto the LORD; according to the ordinance of the passover, and according to the manner thereof, so shall he do: ye shall have one ordinance, both for the stranger, and for him that was born in the land.";
rsv[14] = "And if a stranger sojourns among you, and will keep the passover to the LORD, according to the statute of the passover and according to its ordinance, so shall he do; you shall have one statute, both for the sojourner and for the native.&quot;";
asv[14] = "And if a stranger shall sojourn among you, and will keep the passover unto Jehovah; according to the statute of the passover, and according to the ordinance thereof, so shall he do: ye shall have one statute, both for the sojourner, and for him that is born in the land.";
yng[14] = "`And when a sojourner sojourneth with you, then he hath prepared a passover to Jehovah, according to the statute of the passover, and according to its ordinance, so he doth; one statute is to you, even to a sojourner, and to a native of the land.\'";
dby[14] = "And if a stranger shall sojourn among you, and would hold the passover to Jehovah, according to the rite of the passover, and according to the ordinance thereof, so shall he do. Ye shall have one rite, both for the stranger and for him that is born in the land.";
web[14] = "And if a stranger shall sojourn among you, and will keep the passover to the LORD; according to the ordinance of the passover, and according to the manner of it, so shall he do: ye shall have one ordinance both for the stranger, and for him that was born in the land.";
hnv[14] = "If a foreigner lives among you, and desires to keep the Pesach to the LORD; according to the statute of the Pesach, and according to its ordinance, so shall he do. You shall have one statute, both for the foreigner, and for him who is born in the land.\'&quot;";
vul[14] = "peregrinus quoque et advena si fuerit apud vos faciet phase Domini iuxta caerimonias et iustificationes eius praeceptum idem erit apud vos tam advenae quam indigenae";
kjv[15] = "And on the day that the tabernacle was reared up the cloud covered the tabernacle, [namely], the tent of the testimony: and at even there was upon the tabernacle as it were the appearance of fire, until the morning.";

asv[15] = "And on the day that the tabernacle was reared up the cloud covered the tabernacle, even the tent of the testimony: and at even it was upon the tabernacle as it were the appearance of fire, until morning.";
yng[15] = "And in the day of the raising up of the tabernacle hath the cloud covered the tabernacle, even the tent of the testimony; and in the evening there is on the tabernacle as an appearance of fire till morning;";
dby[15] = "And on the day that the tabernacle was set up, the cloud covered the tabernacle of the tent of testimony; and at even it was upon the tabernacle as the appearance of fire, until the morning.";
web[15] = "And on the day that the tabernacle was erected the cloud covered the tabernacle, [namely], the tent of the testimony: and at evening there was upon the tabernacle as it were the appearance of fire, until the morning.";
hnv[15] = "On the day that the tabernacle was raised up, the cloud covered the tabernacle, even the Tent of the Testimony: and at evening it was over the tabernacle as it were the appearance of fire, until morning.";
vul[15] = "igitur die qua erectum est tabernaculum operuit illud nubes a vespere autem super tentorium erat quasi species ignis usque mane";

rsv[16] = "So it was continually; the cloud covered it by day, and the appearance of fire by night.";
asv[16] = "So it was alway: the cloud covered it, and the appearance of fire by night.";
yng[16] = "so it is continually; the cloud covereth it, also the appearance of fire by night.";
dby[16] = "So it was continually: the cloud covered it, and at night it was as the appearance of fire.";
web[16] = "So it was always; the cloud covered it [by day], and the appearance of fire by night.";
hnv[16] = "So it was continually. The cloud covered it, and the appearance of fire by night.";
vul[16] = "sic fiebat iugiter per diem operiebat illud nubes et per noctem quasi species ignis";
kjv[17] = "And when the cloud was taken up from the tabernacle, then after that the children of Israel journeyed: and in the place where the cloud abode, there the children of Israel pitched their tents.";
rsv[17] = "And whenever the cloud was taken up from over the tent, after that the people of Israel set out; and in the place where the cloud settled down, there the people of Israel encamped.";
asv[17] = "And whenever the cloud was taken up from over the Tent, then after that the children of Israel journeyed: and in the place where the cloud abode, there the children of Israel encamped.";
yng[17] = "And according to the going up of the cloud from off the tent and afterwards do the sons of Israel journey; and in the place where the cloud doth tabernacle, there do the sons of Israel encamp;";
dby[17] = "And when the cloud rose from the tent, then the children of Israel journeyed; and at the place where the cloud stood still, there the children of Israel encamped.";
web[17] = "And when the cloud was taken up from the tabernacle, then after that the children of Israel journeyed: and in the place where the cloud abode, there the children of Israel pitched their tents.";
hnv[17] = "Whenever the cloud was taken up from over the Tent, then after that the children of Yisra\'el traveled; and in the place where the cloud remained, there the children of Yisra\'el encamped.";
vul[17] = "cumque ablata fuisset nubes quae tabernaculum protegebat tunc proficiscebantur filii Israhel et in loco ubi stetisset nubes ibi castrametabantur";
kjv[18] = "At the commandment of the LORD the children of Israel journeyed, and at the commandment of the LORD they pitched: as long as the cloud abode upon the tabernacle they rested in their tents.";
rsv[18] = "At the command of the LORD the people of Israel set out, and at the command of the LORD they encamped; as long as the cloud rested over the tabernacle, they remained in camp.";
asv[18] = "At the commandment of Jehovah the children of Israel journeyed, and at the commandment of Jehovah they encamped: as long as the cloud abode upon the tabernacle they remained encamped.";
yng[18] = "by the command of Jehovah the sons of Israel journey, and by the command of Jehovah they encamp; all the days that the cloud doth tabernacle over the tabernacle they encamp.";
dby[18] = "According to the commandment of Jehovah the children of Israel journeyed, and according to the commandment of Jehovah they [remained] encamped; all the days that the cloud dwelt upon the tabernacle they encamped.";
web[18] = "At the commandment of the LORD the children of Israel journeyed, and at the commandment of the LORD they encamped: as long as the cloud abode upon the tabernacle they rested in their tents.";
hnv[18] = "At the mitzvah of the LORD, the children of Yisra\'el traveled, and at the mitzvah of the LORD they encamped. As long as the cloud remained on the tabernacle they remained encamped.";
vul[18] = "ad imperium Domini proficiscebantur et ad imperium illius figebant tabernaculum cunctis diebus quibus stabat nubes super tabernaculum manebant in eodem loco";
kjv[19] = "And when the cloud tarried long upon the tabernacle many days, then the children of Israel kept the charge of the LORD, and journeyed not.";
rsv[19] = "Even when the cloud continued over the tabernacle many days, the people of Israel kept the charge of the LORD, and did not set out.";
asv[19] = "And when the cloud tarried upon the tabernacle many days, then the children of Israel kept the charge of Jehovah, and journeyed not.";
yng[19] = "And in the cloud prolonging itself over the tabernacle many days, then have the sons of Israel kept the charge of Jehovah, and journey not,";
dby[19] = "And when the cloud was long upon the tabernacle many days, then the children of Israel kept the charge of Jehovah, and journeyed not.";
web[19] = "And when the cloud tarried long upon the tabernacle many days, then the children of Israel kept the charge of the LORD, and journeyed not.";
hnv[19] = "When the cloud stayed on the tabernacle many days, then the children of Yisra\'el kept the charge of the LORD, and didn\'t travel.";
vul[19] = "et si evenisset ut multo tempore maneret super illud erant filii Israhel in excubiis Domini et non proficiscebantur";
kjv[20] = "And [so] it was, when the cloud was a few days upon the tabernacle; according to the commandment of the LORD they abode in their tents, and according to the commandment of the LORD they journeyed.";
rsv[20] = "Sometimes the cloud was a few days over the tabernacle, and according to the command of the LORD they remained in camp; then according to the command of the LORD they set out.";
asv[20] = "And sometimes the cloud was a few days upon the tabernacle; then according to the commandment of Jehovah they remained encamped, and according to the commandment of Jehovah they journeyed.";
yng[20] = "and so when the cloud is a number of days over the tabernacle; by the command of Jehovah they encamp, and by the command of Jehovah they journey.";
dby[20] = "And if it were so that the cloud was a few days upon the tabernacle, according to the commandment of Jehovah they encamped, and according to the commandment of Jehovah they journeyed.";
web[20] = "And [so] it was, when the cloud was a few days upon the tabernacle; according to the commandment of the LORD they abode in their tents, and according to the commandment of the LORD they journeyed.";
hnv[20] = "Sometimes the cloud was a few days on the tabernacle; then according to the mitzvah of the LORD they remained encamped, and according to the mitzvah of the LORD they traveled.";
vul[20] = "quotquot diebus fuisset nubes super tabernaculum ad imperium Domini erigebant tentoria et ad imperium illius deponebant";
kjv[21] = "And [so] it was, when the cloud abode from even unto the morning, and [that] the cloud was taken up in the morning, then they journeyed: whether [it was] by day or by night that the cloud was taken up, they journeyed.";
rsv[21] = "And sometimes the cloud remained from evening until morning; and when the cloud was taken up in the morning, they set out, or if it continued for a day and a night, when the cloud was taken up they set out.";
asv[21] = "And sometimes the cloud was from evening until morning; and when the cloud was taken up in the morning, they journeyed: or [if it continued] by day and by night, when the cloud was taken up, they journeyed.";
yng[21] = "And so when the cloud is from evening till morning, when the cloud hath gone up in the morning, then they have journeyed; whether by day or by night, when the cloud hath gone up, then they have journeyed.";
dby[21] = "And if it were so that the cloud was there from the evening until the morning, and that the cloud was taken up in the morning, then they journeyed; or a day and a night, and the cloud was taken up, they journeyed;";
web[21] = "And [so] it was, when the cloud abode from evening to the morning, and [that] the cloud was taken up in the morning, then they journeyed: whether [it was] by day or by night that the cloud was taken up, they journeyed.";
hnv[21] = "Sometimes the cloud was from evening until morning; and when the cloud was taken up in the morning, they traveled: or by day and by night, when the cloud was taken up, they traveled.";
vul[21] = "si fuisset nubes a vespere usque mane et statim diluculo tabernaculum reliquisset proficiscebantur et si post diem et noctem recessisset dissipabant tentoria";
kjv[22] = "Or [whether it were] two days, or a month, or a year, that the cloud tarried upon the tabernacle, remaining thereon, the children of Israel abode in their tents, and journeyed not: but when it was taken up, they journeyed.";
rsv[22] = "Whether it was two days, or a month, or a longer time, that the cloud continued over the tabernacle, abiding there, the people of Israel remained in camp and did not set out; but when it was taken up they set out.";
asv[22] = "Whether it were two days, or a month, or a year, that the cloud tarried upon the tabernacle, abiding thereon, the children of Israel remained encamped, and journeyed not; but when it was taken up, they journeyed.";
yng[22] = "Whether two days, or a month, or days, in the cloud prolonging itself over the tabernacle, to tabernacle over it, the sons of Israel encamp, and journey not; and in its being lifted up they journey;";
dby[22] = "or two days, or a month, or many days, when the cloud was long upon the tabernacle, dwelling upon it, the children of Israel [remained] encamped, and journeyed not; but when it was taken up, they journeyed.";
web[22] = "Or [whether it was] two days, or a month, or a year, that the cloud tarried upon the tabernacle, remaining upon it, the children of Israel abode in their tents, and journeyed not: but when it was taken up, they journeyed.";
hnv[22] = "Whether it was two days, or a month, or a year that the cloud stayed on the tabernacle, remaining on it, the children of Yisra\'el remained encamped, and didn\'t travel; but when it was taken up, they traveled.";
vul[22] = "si biduo aut uno mense vel longiori tempore fuisset super tabernaculum manebant filii Israhel in eodem loco et non proficiscebantur statim autem ut recessisset movebant castra";
kjv[23] = "At the commandment of the LORD they rested in the tents, and at the commandment of the LORD they journeyed: they kept the charge of the LORD, at the commandment of the LORD by the hand of Moses.";
rsv[23] = "At the command of the LORD they encamped, and at the command of the LORD they set out; they kept the charge of the LORD, at the command of the LORD by Moses.";
asv[23] = "At the commandment of Jehovah they encamped, and at the commandment of Jehovah they journeyed: they kept the charge of Jehovah, at the commandment of Jehovah by Moses.";
yng[23] = "by the command of Jehovah they encamp, and by the command of Jehovah they journey; the charge of Jehovah they have kept, by the command of Jehovah in the hand of Moses.";
dby[23] = "At the commandment of Jehovah they encamped, and at the commandment of Jehovah they journeyed: they kept the charge of Jehovah according to the commandment of Jehovah through Moses.";
web[23] = "At the commandment of the LORD they rested in the tents, and at the commandment of the LORD they journeyed: they kept the charge of the LORD, at the commandment of the LORD by the hand of Moses.";
hnv[23] = "At the mitzvah of the LORD they encamped, and at the mitzvah of the LORD they traveled. They kept the charge of the LORD, at the mitzvah of the LORD by Moshe.";
vul[23] = "per verbum Domini figebant tentoria et per verbum illius proficiscebantur erantque in excubiis Domini iuxta imperium eius per manum Mosi";
csb[1] = "In the first month of the second year after their departure from the land of Egypt, the LORD told Moses in the Wilderness of Sinai:";
csb[2] = "&quot;The Israelites are to observe the Passover at its appointed time.";
csb[3] = "&quot;You must observe it at its appointed time on the fourteenth day of this month at twilight; you are to observe it according to all its statutes and ordinances.&quot;";
csb[4] = "So Moses told the Israelites to observe the Passover,";
csb[5] = "and they observed it in the first month on the fourteenth day at twilight in the Wilderness of Sinai. The Israelites did everything as the LORD had commanded Moses.";
csb[6] = "But there were some men who were unclean because of a human corpse, so they could not observe the Passover on that day. These men came before Moses and Aaron the same day";
csb[7] = "and said to him, &quot;We are unclean because of a human corpse. Why should we be excluded from presenting the LORD\'s offering at its appointed time with the other Israelites? &quot;";
csb[8] = "Moses replied to them, &quot;Wait here until I hear what the LORD commands for you.&quot;";
csb[9] = "Then the LORD spoke to Moses:";
csb[10] = "&quot;Tell the Israelites: When any one of you or your descendants is unclean because of a corpse or is on a distant journey, he may still observe the Passover to the LORD.";
csb[11] = "&quot;Such people are to observe it in the second month, on the fourteenth day at twilight. They are to eat the animal with unleavened bread and bitter herbs;";
csb[12] = "&quot;they may not leave any of it until morning or break any of its bones. They must observe the Passover according to all its statutes.";
csb[13] = "&quot;But the man who is ceremonially clean, is not on a journey, and yet fails to observe the Passover is to be cut off from his people, because he did not present the LORD\'s offering at its appointed time. That man will bear the consequences of his sin.";
csb[14] = "&quot;If an alien resides with you and wants to observe the Passover to the LORD, he is to do it according to the Passover statute and its ordinances. You are to apply the same statute to both the resident alien and the native of the land.&quot;";
csb[15] = "On the day the tabernacle was set up, the cloud covered the tabernacle, the tent of the testimony, and it appeared like fire above the tabernacle from evening until morning.";
csb[16] = "It remained that way continuously: the cloud would cover it, appearing like fire at night.";
csb[17] = "Whenever the cloud was lifted up above the tent, the Israelites would set out; at the place where the cloud stopped, there the Israelites camped.";
csb[18] = "At the LORD\'s command the Israelites set out, and at the LORD\'s command they camped. As long as the cloud stayed over the tabernacle, they camped.";
csb[19] = "Even when the cloud stayed over the tabernacle many days, the Israelites carried out the LORD\'s requirement and did not set out.";
csb[20] = "Sometimes the cloud remained over the tabernacle for only a few days. They would camp at the LORD\'s command and set out at the LORD\'s command.";
csb[21] = "Sometimes the cloud remained only from evening until morning; when the cloud lifted in the morning, they set out. Or if it remained a day and a night, they moved out when the cloud lifted.";
csb[22] = "Whether it was two days, a month, or longer, the Israelites camped and did not set out as long as the cloud stayed over the tabernacle. But when it was lifted, they set out.";
csb[23] = "They camped at the LORD\'s command, and they set out at the LORD\'s command. They carried out the LORD\'s requirement according to his command through Moses.";
