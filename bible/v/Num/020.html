csb[1] = "The entire Israelite community entered the Wilderness of Zin in the first month, and they settled in Kadesh. Miriam died and was buried there.";
csb[2] = "There was no water for the community, so they assembled against Moses and Aaron.";
csb[3] = "The people quarreled with Moses and said, &quot;If only we had perished when our brothers perished before the LORD.";
csb[4] = "&quot;Why have you brought the LORD\'s assembly into this wilderness for us and our livestock to die here?";
csb[5] = "&quot;Why have you led us up from Egypt to bring us to this evil place? It\'s not a place of grain, figs, vines, and pomegranates, and there is no water to drink! &quot;";
csb[6] = "Then Moses and Aaron went from the presence of the assembly to the doorway of the tent of meeting. They fell facedown, and the glory of the LORD appeared to them.";
csb[7] = "The LORD spoke to Moses,";
csb[8] = "&quot;Take the staff and assemble the community. You and your brother Aaron are to speak to the rock while they watch, and it will yield its water. You will bring out water for them from the rock and provide drink for the community and their livestock.&quot;";
csb[9] = "So Moses took the staff from the LORD\'s presence just as he had commanded him.";
csb[10] = "Moses and Aaron summoned the assembly in front of the rock, and Moses said to them, &quot;Listen, you rebels! Must we bring water out of this rock for you? &quot;";
csb[11] = "Then Moses raised his hand and struck the rock twice with his staff, so that abundant water gushed out, and the community and their livestock drank.";
csb[12] = "But the LORD said to Moses and Aaron, &quot;Because you did not trust me to demonstrate my holiness in the sight of the Israelites, you will not bring this assembly into the land I have given them.&quot;";
csb[13] = "These are the Waters of Meribah, where the Israelites quarreled with the LORD, and he demonstrated his holiness to them.";
csb[14] = "Moses sent messengers from Kadesh to the king of Edom, &quot;This is what your brother Israel says, \'You know all the hardships that have overtaken us.";
csb[15] = "&quot;Our fathers went down to Egypt, and we lived in Egypt many years, but the Egyptians treated us and our fathers badly.";
csb[16] = "&quot;When we cried out to the LORD, he heard our plea, and sent an angel, and brought us out of Egypt. Now look, we are in Kadesh, a city on the border of your territory.";
csb[17] = "&quot;Please let us travel through your land. We won\'t travel through any field or vineyard, or drink any well water. We will travel the King\'s Highway; we won\'t turn to the right or the left until we have traveled through your territory.\' &quot;";
csb[18] = "But Edom answered him, &quot;You will not travel through our land, or we will come out and confront you with the sword.&quot;";
csb[19] = "&quot;We will go on the main road,&quot; the Israelites replied to them, &quot;and if we or our herds drink your water, we will pay its price. There will be no problem; only let us travel through on foot.&quot;";
csb[20] = "Yet Edom insisted, &quot;You may not travel through.&quot; And they came out to confront them with a large force of heavily-armed people.";
csb[21] = "Edom refused to allow Israel to travel through their territory, and Israel turned away from them.";
csb[22] = "After they set out from Kadesh, the entire Israelite community came to Mount Hor.";
csb[23] = "The LORD said to Moses and Aaron at Mount Hor on the border of the land of Edom,";
csb[24] = "&quot;Aaron will be gathered to his people; he will not enter the land I have given the Israelites, because you both rebelled against my command at the Waters of Meribah.";
csb[25] = "&quot;Take Aaron and his son Eleazar and bring them up Mount Hor.";
csb[26] = "&quot;Remove Aaron\'s garments and put them on his son Eleazar. Aaron will be gathered to his people and die there.&quot;";
csb[27] = "So Moses did as the LORD commanded, and they climbed Mount Hor in the sight of the whole community.";
csb[28] = "After Moses removed Aaron\'s garments and put them on his son Eleazar, Aaron died there on top of the mountain. Then Moses and Eleazar came down from the mountain.";
csb[29] = "When the whole community saw that Aaron had passed away, the entire house of Israel mourned for him thirty days.";
