csb[1] = "Now Korah son of Izhar, son of Kohath, son of Levi, with Dathan and Abiram, sons of Eliab, and On son of Peleth, sons of Reuben, took";
csb[2] = "two hundred and fifty prominent Israelite men who were leaders of the community and representatives in the assembly, and they rebelled against Moses.";
csb[3] = "They came together against Moses and Aaron and told them, &quot;You have gone too far! Everyone in the entire community is holy, and the LORD is among them. Why then do you exalt yourselves above the LORD\'s assembly? &quot;";
csb[4] = "When Moses heard this, he fell facedown.";
csb[5] = "Then he said to Korah and all his followers, &quot;Tomorrow morning the LORD will reveal who belongs to him, who is set apart, and the one he will let come near him. He will let the one he chooses come near him.";
csb[6] = "&quot;Korah, you and all your followers are to do this: take firepans, and tomorrow";
csb[7] = "&quot;place fire in them and put incense on them before the LORD. Then the man the LORD chooses will be the one who is set apart. It is you Levites who have gone too far! &quot;";
csb[8] = "Moses also told Korah, &quot;Now listen, Levites!";
csb[9] = "&quot;Isn\'t it enough for you that the God of Israel has separated you from the Israelite community to bring you near to himself, to perform the work at the LORD\'s tabernacle, and to stand before the community to minister to them?";
csb[10] = "&quot;He has brought you near, and all your fellow Levites who are with you, but you are pursuing the priesthood as well.";
csb[11] = "&quot;Therefore, it is you and all your followers who have conspired against the LORD! As for Aaron, who is he that you should complain about him? &quot;";
csb[12] = "Moses sent for Dathan and Abiram, the sons of Eliab, but they said, &quot;We will not come!";
csb[13] = "&quot;Is it not enough that you brought us up from a land flowing with milk and honey to kill us in the wilderness? Do you also have to appoint yourself as ruler over us?";
csb[14] = "&quot;Furthermore, you didn\'t bring us to a land flowing with milk and honey or give us an inheritance of fields and vineyards. Will you gouge out the eyes of these men? We will not come! &quot;";
csb[15] = "Then Moses became angry and said to the LORD, &quot;Don\'t respect their offering. I have not taken one donkey from them or mistreated a single one of them.&quot;";
csb[16] = "So Moses told Korah, &quot;You and all your followers are to appear before the LORD tomorrow -- you, they, and Aaron.";
csb[17] = "&quot;Each of you is to take his firepan, place incense on it, and present his firepan before the LORD -- 250 firepans. You and Aaron are each to present your firepan also.&quot;";
csb[18] = "Each man took his firepan, placed fire in it, put incense on it, and stood at the entrance to the tent of meeting along with Moses and Aaron.";
csb[19] = "After Korah assembled the whole community against them at the entrance to the tent of meeting, the glory of the LORD appeared to the whole community.";
csb[20] = "The LORD spoke to Moses and Aaron,";
csb[21] = "&quot;Separate yourselves from this community so I may consume them instantly.&quot;";
csb[22] = "But Moses and Aaron fell facedown and said, &quot;God, God who gives breath to all, when one man sins, will you vent your wrath on the whole community? &quot;";
csb[23] = "The LORD replied to Moses,";
csb[24] = "&quot;Tell the community: Get away from the dwellings of Korah, Dathan, and Abiram.&quot;";
csb[25] = "Moses got up and went to Dathan and Abiram, and the elders of Israel followed him.";
csb[26] = "He warned the community, &quot;Get away now from the tents of these wicked men. Don\'t touch anything that belongs to them, or you will be swept away because of all their sins.&quot;";
csb[27] = "So they got away from the dwellings of Korah, Dathan, and Abiram. Meanwhile, Dathan and Abiram came out and stood at the entrance of their tents with their wives, children, and infants.";
csb[28] = "Then Moses said, &quot;This is how you will know that the LORD sent me to do all these things and that it was not of my own will:";
csb[29] = "&quot;If these men die naturally as all people would, and suffer the fate of all, then the LORD has not sent me.";
csb[30] = "&quot;But if the LORD brings about something unprecedented, and the ground opens its mouth and swallows them along with all that belongs to them so that they go down alive into Sheol, then you will know that these men have despised the LORD.&quot;";
csb[31] = "Just as he finished speaking all these words, the ground beneath them split open.";
csb[32] = "The earth opened its mouth and swallowed them and their households, all Korah\'s people, and all their possessions.";
csb[33] = "They went down alive into Sheol with all that belonged to them. The earth closed over them, and they vanished from the assembly.";
csb[34] = "At their cries, all the people of Israel who were around them fled because they thought, &quot;The earth may swallow us too! &quot;";
csb[35] = "Fire also came out from the LORD and consumed the 250 men who were presenting the incense.";
csb[36] = "Then the LORD spoke to Moses:";
csb[37] = "&quot;Tell Eleazar son of Aaron the priest to remove the firepans from the burning debris, because they are holy, and scatter the fire far away.";
csb[38] = "&quot;As for the firepans of those who sinned at the cost of their own lives, make them into hammered sheets as plating for the altar, for they presented them before the LORD, and the firepans are holy. They will be a sign to the Israelites.&quot;";
csb[39] = "So the priest Eleazar took the bronze firepans that those who were burned had presented, and they were hammered into plating for the altar,";
csb[40] = "just as the LORD commanded him through Moses. It was to be a reminder for the Israelites that no unauthorized person outside the lineage of Aaron should approach to offer incense before the LORD and become like Korah and his followers.";
csb[41] = "The next day the entire Israelite community complained about Moses and Aaron, saying, &quot;You have killed the LORD\'s people! &quot;";
csb[42] = "When the community assembled against them, Moses and Aaron turned toward the tent of meeting, and suddenly the cloud covered it, and the LORD\'s glory appeared.";
csb[43] = "Moses and Aaron went to the front of the tent of meeting,";
csb[44] = "and the LORD said to Moses,";
csb[45] = "&quot;Get away from this community so that I may consume them instantly.&quot; But they fell facedown.";
csb[46] = "Then Moses told Aaron, &quot;Take your firepan, place fire from the altar in it, and add incense. Go quickly to the community and make atonement for them, because wrath has come from the LORD; the plague has begun.&quot;";
csb[47] = "So Aaron took his firepan as Moses had ordered, ran into the middle of the assembly, and saw that the plague had begun among the people. After he added incense, he made atonement for the people.";
csb[48] = "He stood between the dead and the living, and the plague was halted.";
csb[49] = "But those who died from the plague numbered 14,700, in addition to those who died because of the Korah incident.";
csb[50] = "Aaron then returned to Moses at the entrance to the tent of meeting, since the plague had been halted.";
