asv[25] = "And the priest shall make atonement for all the congregation of the children of Israel, and they shall be forgiven; for it was an error, and they have brought their oblation, an offering made by fire unto Jehovah, and their sin-offering before Jehovah, for their error:";

hnv[25] = "The Kohen shall make atonement for all the congregation of the children of Yisra\'el, and they shall be forgiven; for it was an error, and they have brought their offering, an offering made by fire to the LORD, and their sin-offering before the LORD, for their error:";
vul[25] = "et rogabit sacerdos pro omni multitudine filiorum Israhel et dimittetur eis quoniam non sponte peccaverunt nihilominus offerentes incensum Domino pro se et pro peccato atque errore suo";

rsv[28] = "And the priest shall make atonement before the LORD for the person who commits an error, when he sins unwittingly, to make atonement for him; and he shall be forgiven.";
asv[28] = "And the priest shall make atonement for the soul that erreth, when he sinneth unwittingly, before Jehovah, to make atonement for him; and he shall be forgiven.";
yng[28] = "and the priest hath made atonement for the person who is erring, in his sinning in ignorance before Jehovah, by making atonement for him, and it hath been forgiven him;";
dby[28] = "And the priest shall make atonement for the soul that hath done inadvertently, when he sinneth by inadvertence before Jehovah, to make atonement for him; and it shall be forgiven him.";

kjv[29] = "Ye shall have one law for him that sinneth through ignorance, [both for] him that is born among the children of Israel, and for the stranger that sojourneth among them.";
rsv[29] = "You shall have one law for him who does anything unwittingly, for him who is native among the people of Israel, and for the stranger who sojourns among them.";

yng[29] = "for the native among the sons of Israel, and for the sojourner who is sojourning in their midst -- one law is to you, for him who is doing [anything] through ignorance.";

csb[1] = "The LORD instructed Moses:";
csb[2] = "&quot;Speak to the Israelites and tell them: When you enter the land I am giving you to settle in,";
csb[3] = "&quot;and you make a fire offering to the LORD from the herd or flock -- either a burnt offering or a sacrifice, to fulfill a vow, or as a freewill offering, or at your appointed festivals -- to produce a pleasing aroma for the LORD,";
csb[4] = "&quot;the one presenting his offering to the LORD is also to present a grain offering of two quarts of fine flour mixed with a quart of oil.";
csb[5] = "&quot;Prepare a quart of wine as a drink offering with the burnt offering or sacrifice of each lamb.";
csb[6] = "&quot;If you prepare a grain offering with a ram, it is to be four quarts of fine flour mixed with a third of a gallon of oil.";
csb[7] = "&quot;Also present a third of a gallon of wine for a drink offering as a pleasing aroma to the LORD.";
csb[8] = "&quot;If you prepare a young bull as a burnt offering or as a sacrifice, to fulfill a vow, or as a fellowship offering to the LORD,";
csb[9] = "&quot;a grain offering of six quarts of fine flour mixed with two quarts of oil is to be presented with the bull.";
csb[10] = "&quot;Also present two quarts of wine as a drink offering. It is a fire offering of pleasing aroma to the LORD.";
csb[11] = "&quot;This is to be done for each ox, ram, lamb, or goat.";
csb[12] = "&quot;This is how you are to prepare each of them, no matter how many.";
csb[13] = "&quot;Every Israelite is to prepare these things in this way when he presents a fire offering as a pleasing aroma to the LORD.";
csb[14] = "&quot;When an alien resides with you or someone else is among you and wants to prepare a fire offering as a pleasing aroma to the LORD, he is to do exactly as you do throughout your generations.";
csb[15] = "&quot;The assembly is to have the same statute for both you and the resident alien as a permanent statute throughout your generations. You and the alien will be alike before the LORD.";
csb[16] = "&quot;The same law and the same ordinance will apply to both you and the alien who resides with you.&quot;";
csb[17] = "The LORD instructed Moses:";
csb[18] = "&quot;Speak to the Israelites and tell them: After you enter the land where I am bringing you,";
csb[19] = "&quot;you are to offer a contribution to the LORD when you eat from the food of the land.";
csb[20] = "&quot;You are to offer a loaf from your first batch of dough as a contribution; offer it just like a contribution from the threshing floor.";
csb[21] = "&quot;Throughout your generations, you are to give the LORD a contribution from the first batch of your dough.";
csb[22] = "&quot;When you sin unintentionally and do not obey all these commands that the LORD spoke to Moses --";
csb[23] = "&quot;all that the LORD has commanded you through Moses, from the day the LORD issued the commands and onward throughout your generations --";
csb[24] = "&quot;and if it was done unintentionally without the community\'s awareness, the entire community is to prepare one young bull for a burnt offering as a pleasing aroma to the LORD, with its grain offering and drink offering according to the regulation, and one male goat as a sin offering.";
csb[25] = "&quot;The priest will then make atonement for the entire Israelite community so that they may be forgiven, for the sin was unintentional. They are to bring their offering, one made by fire to the LORD, and their sin offering before the LORD for their unintentional sin.";
csb[26] = "&quot;The entire Israelite community and the alien who resides among them will be forgiven, since it happened to all the people unintentionally.";
csb[27] = "&quot;If one person sins unintentionally, he is to present a year-old female goat as a sin offering.";
csb[28] = "&quot;The priest will then make atonement before the LORD on behalf of the person who acts in error sinning unintentionally, and when he makes atonement for him, he will be forgiven.";
csb[29] = "&quot;You are to have the same law for the person who acts in error, whether he is an Israelite or an alien who resides among you.";
csb[30] = "&quot;But the person who acts defiantly, whether native or resident alien, blasphemes the LORD. That person is to be cut off from his people.";
csb[31] = "&quot;He will certainly be cut off, because he has despised the LORD\'s word and broken his command; his guilt remains on him.&quot;";
csb[32] = "While the Israelites were in the wilderness, they found a man gathering wood on the Sabbath day.";
csb[33] = "Those who found him gathering wood brought him to Moses, Aaron, and the entire community.";
csb[34] = "They placed him in custody because it had not been decided what should be done to him.";
csb[35] = "Then the LORD told Moses, &quot;The man is to be put to death. The entire community is to stone him outside the camp.&quot;";
csb[36] = "So the entire community brought him outside the camp and stoned him to death, as the LORD had commanded Moses.";
csb[37] = "The LORD said to Moses,";
csb[38] = "&quot;Speak to the Israelites and tell them that throughout their generations they are to make tassels for the corners of their garments, and put a blue cord on the tassel at each corner.";
csb[39] = "&quot;These will serve as tassels for you to look at, so that you may remember all the LORD\'s commands and obey them and not prostitute yourselves by following your own heart and your own eyes.";
csb[40] = "&quot;This way you will remember and obey all my commands and be holy to your God.";
csb[41] = "&quot;I am the LORD your God who brought you out of the land of Egypt to be your God; I am the LORD your God.&quot;";
</script>
