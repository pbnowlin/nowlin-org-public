rsv[19] = "And I have given the Levites as a gift to Aaron and his sons from among the people of Israel, to do the service for the people of Israel at the tent of meeting, and to make atonement for the people of Israel, that there may be no plague among the people of Israel in case the people of Israel should come near the sanctuary.&quot;";
asv[19] = "And I have given the Levites as a gift to Aaron and to his sons from among the children of Israel, to do the service of the children of Israel in the tent of meeting, and to make atonement for the children of Israel; that there be no plague among the children of Israel, when the children of Israel come nigh unto the sanctuary.";
yng[19] = "`And I give the Levites gifts to Aaron and to his sons, from the midst of the sons of Israel, to do the service of the sons of Israel in the tent of meeting, and to make atonement for the sons of Israel, and there is no plague among the sons of Israel in the sons of Israel\'s drawing nigh unto the sanctuary.\'";
dby[19] = "And I have given the Levites as a gift to Aaron and to his sons, from among the children of Israel, to perform the service of the children of Israel in the tent of meeting, and to make atonement for the children of Israel; that there be no plague among the children of Israel, when the children of Israel draw near to the sanctuary.";
web[19] = "And I have given the Levites [as] a gift to Aaron and to his sons from among the children of Israel, to do the service of the children of Israel in the tabernacle of the congregation, and to make an atonement for the children of Israel: that there may be no plague among the children of Israel, when the children of Israel come nigh to the sanctuary.";
hnv[19] = "I have given the Levites as a gift to Aharon and to his sons from among the children of Yisra\'el, to do the service of the children of Yisra\'el in the Tent of Meeting, and to make atonement for the children of Yisra\'el; that there be no plague among the children of Yisra\'el, when the children of Yisra\'el come near to the sanctuary.&quot;";
vul[19] = "tradidique eos dono Aaroni et filiis eius de medio populi ut serviant mihi pro Israhel in tabernaculo foederis et orent pro eis ne sit in populo plaga si ausi fuerint accedere ad sanctuarium";

web[20] = "And Moses, and Aaron, and all the congregation of the children of Israel, did to the Levites according to all that the LORD commanded Moses concerning the Levites, so did the children of Israel to them.";

csb[2] = "&quot;Speak to Aaron and tell him: When you set up the lamps, the seven lamps are to give light in front of the lampstand.&quot;";
csb[3] = "So Aaron did this; he set up its lamps to give light in front of the lampstand just as the LORD had commanded Moses.";
csb[4] = "This is the way the lampstand was made: it was a hammered work of gold, hammered from its base to its flower petals. The lampstand was made according to the pattern the LORD had shown Moses.";
csb[5] = "The LORD spoke to Moses:";
csb[6] = "&quot;Take the Levites from among the Israelites and ceremonially cleanse them.";
csb[7] = "&quot;Do this to them for their purification: Sprinkle them with the purification water. Have them shave their entire bodies and wash their clothes, and so purify themselves.";
csb[8] = "&quot;They are to take a young bull and its grain offering of fine flour mixed with oil, and you are to take a second young bull for a sin offering.";
csb[9] = "&quot;Bring the Levites before the tent of meeting and assemble the entire Israelite community.";
csb[10] = "&quot;Then present the Levites before the LORD, and have the Israelites lay their hands on them.";
csb[11] = "&quot;Aaron is to present the Levites before the LORD as a presentation offering from the Israelites, so that they may perform the LORD\'s work.";
csb[12] = "&quot;Next the Levites are to lay their hands on the heads of the bulls. Sacrifice one as a sin offering and the other as a burnt offering to the LORD, to make atonement for the Levites.";
csb[13] = "&quot;You are to have the Levites stand before Aaron and his sons, and you are to present them before the LORD as a presentation offering.";
csb[14] = "&quot;In this way you are to separate the Levites from the rest of the Israelites so that the Levites will belong to me.";
csb[15] = "&quot;After that the Levites may come to serve at the tent of meeting, once you have ceremonially cleansed them and presented them as a presentation offering.";
csb[16] = "&quot;For they have been exclusively assigned to me from the Israelites. I have taken them for myself in place of all who come first from the womb, every Israelite firstborn.";
csb[17] = "&quot;For every firstborn among the Israelites is mine, both man and animal. I consecrated them to myself on the day I struck down every firstborn in the land of Egypt.";
csb[18] = "&quot;But I have taken the Levites in place of every firstborn among the Israelites.";
csb[19] = "&quot;From the Israelites, I have given the Levites exclusively to Aaron and his sons to perform the work for the Israelites at the tent of meeting and to make atonement on their behalf, so that no plague will come against the Israelites when they approach the sanctuary.&quot;";
csb[20] = "Moses, Aaron, and the entire Israelite community did this to the Levites. The Israelites did everything to them the LORD commanded Moses regarding the Levites.";
csb[21] = "The Levites purified themselves and washed their clothes; then Aaron presented them before the LORD as a presentation offering. Aaron also made atonement for them to cleanse them ceremonially.";
csb[22] = "After that, the Levites came to do their work at the tent of meeting in the presence of Aaron and his sons. So they did to them as the LORD had commanded Moses concerning the Levites.";
csb[23] = "The LORD spoke to Moses:";
csb[24] = "&quot;In regard to the Levites: From twenty-five years old or more, a man enters the service in the work at the tent of meeting.";
csb[25] = "&quot;But at fifty years old he is to retire from his service in the work and no longer serve.";
csb[26] = "&quot;He may assist his brothers to fulfill responsibilities at the tent of meeting, but he must not do the work. This is how you are to deal with the Levites regarding their duties.&quot;";
kjv[1] = "And the LORD spake unto Moses, saying,";
kjv[2] = "Speak unto Aaron, and say unto him, When thou lightest the lamps, the seven lamps shall give light over against the candlestick.";
kjv[3] = "And Aaron did so; he lighted the lamps thereof over against the candlestick, as the LORD commanded Moses.";
kjv[4] = "And this work of the candlestick [was of] beaten gold, unto the shaft thereof, unto the flowers thereof, [was] beaten work: according unto the pattern which the LORD had shewed Moses, so he made the candlestick.";
kjv[5] = "And the LORD spake unto Moses, saying,";
kjv[6] = "Take the Levites from among the children of Israel, and cleanse them.";
kjv[7] = "And thus shalt thou do unto them, to cleanse them: Sprinkle water of purifying upon them, and let them shave all their flesh, and let them wash their clothes, and [so] make themselves clean.";
kjv[8] = "Then let them take a young bullock with his meat offering, [even] fine flour mingled with oil, and another young bullock shalt thou take for a sin offering.";
kjv[9] = "And thou shalt bring the Levites before the tabernacle of the congregation: and thou shalt gather the whole assembly of the children of Israel together:";
kjv[10] = "And thou shalt bring the Levites before the LORD: and the children of Israel shall put their hands upon the Levites:";
kjv[11] = "And Aaron shall offer the Levites before the LORD [for] an offering of the children of Israel, that they may execute the service of the LORD.";
kjv[12] = "And the Levites shall lay their hands upon the heads of the bullocks: and thou shalt offer the one [for] a sin offering, and the other [for] a burnt offering, unto the LORD, to make an atonement for the Levites.";
kjv[13] = "And thou shalt set the Levites before Aaron, and before his sons, and offer them [for] an offering unto the LORD.";
kjv[14] = "Thus shalt thou separate the Levites from among the children of Israel: and the Levites shall be mine.";
kjv[15] = "And after that shall the Levites go in to do the service of the tabernacle of the congregation: and thou shalt cleanse them, and offer them [for] an offering.";
kjv[16] = "For they [are] wholly given unto me from among the children of Israel; instead of such as open every womb, [even instead of] the firstborn of all the children of Israel, have I taken them unto me.";
kjv[17] = "For all the firstborn of the children of Israel [are] mine, [both] man and beast: on the day that I smote every firstborn in the land of Egypt I sanctified them for myself.";
kjv[18] = "And I have taken the Levites for all the firstborn of the children of Israel.";
kjv[19] = "And I have given the Levites [as] a gift to Aaron and to his sons from among the children of Israel, to do the service of the children of Israel in the tabernacle of the congregation, and to make an atonement for the children of Israel: that there be no plague among the children of Israel, when the children of Israel come nigh unto the sanctuary.";
kjv[20] = "And Moses, and Aaron, and all the congregation of the children of Israel, did to the Levites according unto all that the LORD commanded Moses concerning the Levites, so did the children of Israel unto them.";
kjv[21] = "And the Levites were purified, and they washed their clothes; and Aaron offered them [as] an offering before the LORD; and Aaron made an atonement for them to cleanse them.";
kjv[22] = "And after that went the Levites in to do their service in the tabernacle of the congregation before Aaron, and before his sons: as the LORD had commanded Moses concerning the Levites, so did they unto them.";
kjv[23] = "And the LORD spake unto Moses, saying,";
kjv[24] = "This [is it] that [belongeth] unto the Levites: from twenty and five years old and upward they shall go in to wait upon the service of the tabernacle of the congregation:";
kjv[25] = "And from the age of fifty years they shall cease waiting upon the service [thereof], and shall serve no more:";
kjv[26] = "But shall minister with their brethren in the tabernacle of the congregation, to keep the charge, and shall do no service. Thus shalt thou do unto the Levites touching their charge.";
</script>
