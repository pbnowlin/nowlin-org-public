rsv[38] = "And those to encamp before the tabernacle on the east, before the tent of meeting toward the sunrise, were Moses and Aaron and his sons, having charge of the rites within the sanctuary, whatever had to be done for the people of Israel; and any one else who came near was to be put to death.";

yng[38] = "And those encamping before the tabernacle eastward, before the tent of meeting, at the east, [are] Moses and Aaron, and his sons, keeping the charge of the sanctuary for the charge of the sons of Israel, and the stranger who cometh near is put to death.";
dby[38] = "And those who encamped before the tabernacle eastward, before the tent of meeting toward the sunrising, were Moses, and Aaron and his sons, who kept the charge of the sanctuary for the charge of the children of Israel; and the stranger that cometh near shall be put to death.";
web[38] = "But those that encamp before the tabernacle towards the east, [even] before the tabernacle of the congregation eastward [shall be] Moses and Aaron, and his sons, keeping the charge of the sanctuary, for the charge of the children of Israel; and the stranger that cometh nigh shall be put to death.";
hnv[38] = "Those who encamp before the tabernacle eastward, in front of the Tent of Meeting toward the sunrise, shall be Moshe, and Aharon and his sons, keeping the charge of the sanctuary for the charge of the children of Yisra\'el. The stranger who comes near shall be put to death.";

csb[1] = "These are the family records of Aaron and Moses at the time the LORD spoke with Moses on Mount Sinai.";
csb[2] = "These are the names of Aaron\'s sons: Nadab, the firstborn, and Abihu, Eleazar, and Ithamar.";
csb[3] = "These are the names of Aaron\'s sons, the anointed priests, who were ordained to serve as priests.";
csb[4] = "But Nadab and Abihu died in the LORD\'s presence when they presented unauthorized fire before the LORD in the Wilderness of Sinai, and they had no sons. So Eleazar and Ithamar served as priests under the direction of Aaron their father.";
csb[5] = "The LORD spoke to Moses:";
csb[6] = "&quot;Bring the tribe of Levi near and present them to the priest Aaron to assist him.";
csb[7] = "&quot;They are to perform duties for him and the entire community before the tent of meeting by attending to the service of the tabernacle.";
csb[8] = "&quot;They are to take care of all the furnishings of the tent of meeting and perform duties for the Israelites by attending to the service of the tabernacle.";
csb[9] = "&quot;Assign the Levites to Aaron and his sons; they have been assigned exclusively to him from the Israelites.";
csb[10] = "&quot;You are to appoint Aaron and his sons to carry out their priestly responsibilities, but any unauthorized person who comes near the sanctuary is to be put to death.&quot;";
csb[11] = "The LORD spoke to Moses:";
csb[12] = "&quot;See, I have taken the Levites from the Israelites in place of every firstborn Israelite from the womb. The Levites belong to me,";
csb[13] = "&quot;because every firstborn belongs to me. At the time I struck down every firstborn in the land of Egypt, I consecrated every firstborn in Israel to myself, both man and animal. They are mine; I am the LORD.&quot;";
csb[14] = "The LORD spoke to Moses in the Wilderness of Sinai:";
csb[15] = "&quot;Register the Levites by their ancestral families and their clans. You are to register every male one month old or more.&quot;";
csb[16] = "So Moses registered them in obedience to the LORD as he had been commanded:";
csb[17] = "These were Levi\'s sons by name: Gershon, Kohath, and Merari.";
csb[18] = "These were the names of Gershon\'s sons by their clans: Libni and Shimei.";
csb[19] = "Kohath\'s sons by their clans were Amram, Izhar, Hebron, and Uzziel.";
csb[20] = "Merari\'s sons by their clans were Mahli and Mushi. These were the Levite clans by their ancestral families.";
csb[21] = "The Libnite clan and the Shimeite clan came from Gershon; these were the Gershonite clans.";
csb[22] = "Those registered, counting every male one month old or more, numbered 7,500.";
csb[23] = "The Gershonite clans camped behind the tabernacle on the west side,";
csb[24] = "and the leader of the Gershonite families was Eliasaph son of Lael.";
csb[25] = "The Gershonites\' duties at the tent of meeting involved the tabernacle, the tent, its covering, the screen for the entrance to the tent of meeting,";
csb[26] = "the hangings of the courtyard, the screen for the entrance to the courtyard that surrounds the tabernacle and the altar, and the tent ropes -- all the work relating to these.";
csb[27] = "The Amramite clan, the Izharite clan, the Hebronite clan, and the Uzzielite clan came from Kohath; these were the Kohathites.";
csb[28] = "Counting every male one month old or more, there were 8,600 responsible for the duties of the sanctuary.";
csb[29] = "The clans of the Kohathites camped on the south side of the tabernacle,";
csb[30] = "and the leader of the families of the Kohathite clans was Elizaphan son of Uzziel.";
csb[31] = "Their duties involved the ark, the table, the lampstand, the altars, the sanctuary utensils that were used with these, and the screen -- and all the work relating to them.";
csb[32] = "The chief of the Levite leaders was Eleazar son of Aaron the priest; he had oversight of those responsible for the duties of the sanctuary.";
csb[33] = "The Mahlite clan and the Mushite clan came from Merari; these were the Merarite clans.";
csb[34] = "Those registered, counting every male one month old or more, numbered 6,200.";
csb[35] = "The leader of the families of the Merarite clans was Zuriel son of Abihail; they camped on the north side of the tabernacle.";
csb[36] = "The assigned duties of Merari\'s descendants involved the tabernacle\'s supports, crossbars, pillars, bases, all its equipment, and all the work related to these,";
csb[37] = "in addition to the posts of the surrounding courtyard with their bases, tent pegs, and ropes.";
csb[38] = "Moses, Aaron, and his sons, who performed the duties of the sanctuary as a service on behalf of the Israelites, camped in front of the tabernacle on the east, in front of the tent of meeting toward the sunrise. Any unauthorized person who came near it was to be put to death.";
csb[39] = "The total number of all the Levite males one month old or more that Moses and Aaron registered by their clans at the LORD\'s command was 22,000.";
csb[40] = "The LORD told Moses: &quot;Register every firstborn male of the Israelites one month old or more, and list their names.";
csb[41] = "&quot;You are to take the Levites for me -- I am the LORD -- in place of every firstborn among the Israelites, and the Levites\' cattle in place of every firstborn among the Israelites\' cattle.&quot;";
csb[42] = "So Moses registered every firstborn among the Israelites, as the LORD commanded him.";
csb[43] = "The total number of the firstborn males one month old or more listed by name was 22,273.";
csb[44] = "The LORD spoke to Moses again:";
csb[45] = "&quot;Take the Levites in place of every firstborn among the Israelites, and the Levites\' cattle in place of their cattle. The Levites belong to me; I am the LORD.";
csb[46] = "&quot;As the redemption price for the 273 firstborn Israelites who outnumber the Levites,";
csb[47] = "&quot;collect five shekels for each person, according to the standard sanctuary shekel -- twenty gerahs to the shekel.";
csb[48] = "&quot;Give the silver to Aaron and his sons as the redemption price for those who are in excess among the Israelites.&quot;";
csb[49] = "So Moses collected the redemption amount from those in excess of the ones redeemed by the Levites.";
csb[50] = "He collected the silver from the firstborn Israelites: 1,365 shekels measured by the standard sanctuary shekel.";
csb[51] = "He gave the redemption silver to Aaron and his sons in obedience to the LORD, just as the LORD commanded Moses.";
kjv[1] = "These also [are] the generations of Aaron and Moses in the day [that] the LORD spake with Moses in mount Sinai.";
kjv[2] = "And these [are] the names of the sons of Aaron; Nadab the firstborn, and Abihu, Eleazar, and Ithamar.";
kjv[3] = "These [are] the names of the sons of Aaron, the priests which were anointed, whom he consecrated to minister in the priest\'s office.";
kjv[4] = "And Nadab and Abihu died before the LORD, when they offered strange fire before the LORD, in the wilderness of Sinai, and they had no children: and Eleazar and Ithamar ministered in the priest\'s office in the sight of Aaron their father.";
kjv[5] = "And the LORD spake unto Moses, saying,";
kjv[6] = "Bring the tribe of Levi near, and present them before Aaron the priest, that they may minister unto him.";
kjv[7] = "And they shall keep his charge, and the charge of the whole congregation before the tabernacle of the congregation, to do the service of the tabernacle.";
kjv[8] = "And they shall keep all the instruments of the tabernacle of the congregation, and the charge of the children of Israel, to do the service of the tabernacle.";
kjv[9] = "And thou shalt give the Levites unto Aaron and to his sons: they [are] wholly given unto him out of the children of Israel.";
kjv[10] = "And thou shalt appoint Aaron and his sons, and they shall wait on their priest\'s office: and the stranger that cometh nigh shall be put to death.";
kjv[11] = "And the LORD spake unto Moses, saying,";
kjv[12] = "And I, behold, I have taken the Levites from among the children of Israel instead of all the firstborn that openeth the matrix among the children of Israel: therefore the Levites shall be mine;";
kjv[13] = "Because all the firstborn [are] mine; [for] on the day that I smote all the firstborn in the land of Egypt I hallowed unto me all the firstborn in Israel, both man and beast: mine shall they be: I [am] the LORD.";
kjv[14] = "And the LORD spake unto Moses in the wilderness of Sinai, saying,";
kjv[15] = "Number the children of Levi after the house of their fathers, by their families: every male from a month old and upward shalt thou number them.";
kjv[16] = "And Moses numbered them according to the word of the LORD, as he was commanded.";
kjv[17] = "And these were the sons of Levi by their names; Gershon, and Kohath, and Merari.";
kjv[18] = "And these [are] the names of the sons of Gershon by their families; Libni, and Shimei.";
kjv[19] = "And the sons of Kohath by their families; Amram, and Izehar, Hebron, and Uzziel.";
kjv[20] = "And the sons of Merari by their families; Mahli, and Mushi. These [are] the families of the Levites according to the house of their fathers.";
kjv[21] = "Of Gershon [was] the family of the Libnites, and the family of the Shimites: these [are] the families of the Gershonites.";
kjv[22] = "Those that were numbered of them, according to the number of all the males, from a month old and upward, [even] those that were numbered of them [were] seven thousand and five hundred.";
kjv[23] = "The families of the Gershonites shall pitch behind the tabernacle westward.";
kjv[24] = "And the chief of the house of the father of the Gershonites [shall be] Eliasaph the son of Lael.";
kjv[25] = "And the charge of the sons of Gershon in the tabernacle of the congregation [shall be] the tabernacle, and the tent, the covering thereof, and the hanging for the door of the tabernacle of the congregation,";
kjv[26] = "And the hangings of the court, and the curtain for the door of the court, which [is] by the tabernacle, and by the altar round about, and the cords of it for all the service thereof.";
kjv[27] = "And of Kohath [was] the family of the Amramites, and the family of the Izeharites, and the family of the Hebronites, and the family of the Uzzielites: these [are] the families of the Kohathites.";
kjv[28] = "In the number of all the males, from a month old and upward, [were] eight thousand and six hundred, keeping the charge of the sanctuary.";
kjv[29] = "The families of the sons of Kohath shall pitch on the side of the tabernacle southward.";
kjv[30] = "And the chief of the house of the father of the families of the Kohathites [shall be] Elizaphan the son of Uzziel.";
kjv[31] = "And their charge [shall be] the ark, and the table, and the candlestick, and the altars, and the vessels of the sanctuary wherewith they minister, and the hanging, and all the service thereof.";
kjv[32] = "And Eleazar the son of Aaron the priest [shall be] chief over the chief of the Levites, [and have] the oversight of them that keep the charge of the sanctuary.";
kjv[33] = "Of Merari [was] the family of the Mahlites, and the family of the Mushites: these [are] the families of Merari.";
kjv[34] = "And those that were numbered of them, according to the number of all the males, from a month old and upward, [were] six thousand and two hundred.";
kjv[35] = "And the chief of the house of the father of the families of Merari [was] Zuriel the son of Abihail: [these] shall pitch on the side of the tabernacle northward.";
kjv[36] = "And [under] the custody and charge of the sons of Merari [shall be] the boards of the tabernacle, and the bars thereof, and the pillars thereof, and the sockets thereof, and all the vessels thereof, and all that serveth thereto,";
kjv[37] = "And the pillars of the court round about, and their sockets, and their pins, and their cords.";
kjv[38] = "But those that encamp before the tabernacle toward the east, [even] before the tabernacle of the congregation eastward, [shall be] Moses, and Aaron and his sons, keeping the charge of the sanctuary for the charge of the children of Israel; and the stranger that cometh nigh shall be put to death.";
kjv[39] = "All that were numbered of the Levites, which Moses and Aaron numbered at the commandment of the LORD, throughout their families, all the males from a month old and upward, [were] twenty and two thousand.";
kjv[40] = "And the LORD said unto Moses, Number all the firstborn of the males of the children of Israel from a month old and upward, and take the number of their names.";
kjv[41] = "And thou shalt take the Levites for me (I [am] the LORD) instead of all the firstborn among the children of Israel; and the cattle of the Levites instead of all the firstlings among the cattle of the children of Israel.";
kjv[42] = "And Moses numbered, as the LORD commanded him, all the firstborn among the children of Israel.";
kjv[43] = "And all the firstborn males by the number of names, from a month old and upward, of those that were numbered of them, were twenty and two thousand two hundred and threescore and thirteen.";
kjv[44] = "And the LORD spake unto Moses, saying,";
kjv[45] = "Take the Levites instead of all the firstborn among the children of Israel, and the cattle of the Levites instead of their cattle; and the Levites shall be mine: I [am] the LORD.";
kjv[46] = "And for those that are to be redeemed of the two hundred and threescore and thirteen of the firstborn of the children of Israel, which are more than the Levites;";
kjv[47] = "Thou shalt even take five shekels apiece by the poll, after the shekel of the sanctuary shalt thou take [them]: (the shekel [is] twenty gerahs:)";
kjv[48] = "And thou shalt give the money, wherewith the odd number of them is to be redeemed, unto Aaron and to his sons.";
kjv[49] = "And Moses took the redemption money of them that were over and above them that were redeemed by the Levites:";
kjv[50] = "Of the firstborn of the children of Israel took he the money; a thousand three hundred and threescore and five [shekels], after the shekel of the sanctuary:";
kjv[51] = "And Moses gave the money of them that were redeemed unto Aaron and to his sons, according to the word of the LORD, as the LORD commanded Moses.";
</script>
