kjv[1] = "And the LORD said unto Aaron, Thou and thy sons and thy father\'s house with thee shall bear the iniquity of the sanctuary: and thou and thy sons with thee shall bear the iniquity of your priesthood.";
rsv[1] = "So the LORD said to Aaron, &quot;You and your sons and your fathers\' house with you shall bear iniquity in connection with the sanctuary; and you and your sons with you shall bear iniquity in connection with your priesthood.";
asv[1] = "And Jehovah said unto Aaron, Thou and thy sons and thy fathers\' house with thee shall bear the iniquity of the sanctuary; and thou and thy sons with thee shall bear the iniquity of your priesthood.";
yng[1] = "And Jehovah saith unto Aaron, `Thou, and thy sons, and the house of thy father with thee, do bear the iniquity of the sanctuary; and thou, and thy sons with thee, do bear the iniquity of your priesthood;";
dby[1] = "And Jehovah said to Aaron, Thou and thy sons and thy father\'s house with thee shall bear the iniquity of the sanctuary; and thou and thy sons with thee shall bear the iniquity of your priesthood.";
web[1] = "And the LORD said to Aaron, Thou and thy sons and thy father\'s house with thee shall bear the iniquity of the sanctuary: and thou and thy sons with thee shall bear the iniquity of your priesthood.";
hnv[1] = "The LORD said to Aharon, You and your sons and your fathers\' house with you shall bear the iniquity of the sanctuary; and you and your sons with you shall bear the iniquity of your priesthood.";
vul[1] = "dixitque Dominus ad Aaron tu et filii tui et domus patris tui tecum portabitis iniquitatem sanctuarii et tu et filii tui simul sustinebitis peccata sacerdotii vestri";
kjv[2] = "And thy brethren also of the tribe of Levi, the tribe of thy father, bring thou with thee, that they may be joined unto thee, and minister unto thee: but thou and thy sons with thee [shall minister] before the tabernacle of witness.";
rsv[2] = "And with you bring your brethren also, the tribe of Levi, the tribe of your father, that they may join you, and minister to you while you and your sons with you are before the tent of the testimony.";
asv[2] = "And thy brethren also, the tribe of Levi, the tribe of thy father, bring thou near with thee, that they may be joined unto thee, and minister unto thee: but thou and thy sons with thee shall be before the tent of the testimony.";
yng[2] = "and also thy brethren, the tribe of Levi, the tribe of thy father, bring near with thee, and they are joined unto thee, and serve thee, even thou and thy sons with thee, before the tent of the testimony.";
dby[2] = "And thy brethren also, the tribe of Levi, the tribe of thy father, bring near with thee, that they may unite with thee, and minister unto thee; but thou and thy sons with thee [shall serve] before the tent of the testimony.";
web[2] = "And thy brethren also of the tribe of Levi, the tribe of thy father, bring thou with thee, that they may be joined to thee, and minister to thee: but thou and thy sons with thee [shall minister] before the tabernacle of witness.";
hnv[2] = " Your brothers also, the tribe of Levi, the tribe of your father, bring you near with you, that they may be joined to you, and minister to you: but you and your sons with you shall be before the tent of the testimony.";
vul[2] = "sed et fratres tuos de tribu Levi et sceptro patris tui sume tecum praestoque sint et ministrent tibi tu autem et filii tui ministrabitis in tabernaculo testimonii";
kjv[3] = "And they shall keep thy charge, and the charge of all the tabernacle: only they shall not come nigh the vessels of the sanctuary and the altar, that neither they, nor ye also, die.";
rsv[3] = "They shall attend you and attend to all duties of the tent; but shall not come near to the vessels of the sanctuary or to the altar, lest they, and you, die.";
asv[3] = "And they shall keep thy charge, and the charge of all the Tent: only they shall not come nigh unto the vessels of the sanctuary and unto the altar, that they die not, neither they, nor ye.";
yng[3] = "`And they have kept thy charge, and the charge of all the tent; only, unto the vessels of the sanctuary and unto the altar they do not come near, and they die not, either they or you;";
dby[3] = "And they shall keep thy charge, and the charge of the whole tent: only they shall not come near to the vessels of the sanctuary and to the altar, that they may not die, and you as well as they.";
web[3] = "And they shall keep thy charge, and the charge of all the tabernacle: only they shall not come nigh the vessels of the sanctuary and the altar, that neither they, nor ye also, die.";
hnv[3] = "They shall keep your charge, and the charge of all the Tent: only they shall not come near to the vessels of the sanctuary and to the altar, that they not die, neither they, nor you.";
vul[3] = "excubabuntque Levitae ad praecepta tua et ad cuncta opera tabernaculi ita dumtaxat ut ad vasa sanctuarii et altare non accedant ne et illi moriantur et vos pereatis simul";
kjv[4] = "And they shall be joined unto thee, and keep the charge of the tabernacle of the congregation, for all the service of the tabernacle: and a stranger shall not come nigh unto you.";
rsv[4] = "They shall join you, and attend to the tent of meeting, for all the service of the tent; and no one else shall come near you.";
asv[4] = "And they shall be joined unto thee, and keep the charge of the tent of meeting, for all the service of the Tent: and a stranger shall not come nigh unto you.";
yng[4] = "and they have been joined unto thee, and have kept the charge of the tent of meeting, for all the service of the tent; and a stranger doth not come near unto you;";
dby[4] = "And they shall unite with thee, and keep the charge of the tent of meeting, for all the service of the tent; and no stranger shall come near to you.";
web[4] = "And they shall be joined to thee, and keep the charge of the tabernacle of the congregation, for all the service of the tabernacle: and a stranger shall not come nigh to you.";
hnv[4] = "They shall be joined to you, and keep the charge of the tent of meeting, for all the service of the Tent: and a stranger shall not come near to you.";
vul[4] = "sint autem tecum et excubent in custodiis tabernaculi et in omnibus caerimoniis eius alienigena non miscebitur vobis";
kjv[5] = "And ye shall keep the charge of the sanctuary, and the charge of the altar: that there be no wrath any more upon the children of Israel.";
rsv[5] = "And you shall attend to the duties of the sanctuary and the duties of the altar, that there be wrath no more upon the people of Israel.";
asv[5] = "And ye shall keep the charge of the sanctuary, and the charge of the altar; that there be wrath no more upon the children of Israel.";
yng[5] = "and ye have kept the charge of the sanctuary, and the charge of the altar, and there is no more wrath against the sons of Israel.";
dby[5] = "And ye shall keep the charge of the sanctuary, and the charge of the altar; that there come no wrath any more upon the children of Israel.";
web[5] = "And ye shall keep the charge of the sanctuary, and the charge of the altar: that there be no wrath any more upon the children of Israel.";
hnv[5] = "You shall keep the charge of the sanctuary, and the charge of the altar; that there be wrath no more on the children of Yisra\'el.";
vul[5] = "excubate in custodia sanctuarii et in ministerio altaris ne oriatur indignatio super filios Israhel";
kjv[6] = "And I, behold, I have taken your brethren the Levites from among the children of Israel: to you [they are] given [as] a gift for the LORD, to do the service of the tabernacle of the congregation.";
rsv[6] = "And behold, I have taken your brethren the Levites from among the people of Israel; they are a gift to you, given to the LORD, to do the service of the tent of meeting.";
asv[6] = "And I, behold, I have taken your brethren the Levites from among the children of Israel: to you they are a gift, given unto Jehovah, to do the service of the tent of meeting.";
yng[6] = "`And I, lo, I have taken your brethren the Levites from the midst of the sons of Israel; to you a gift they are given by Jehovah, to do the service of the tent of meeting;";
dby[6] = "And I, behold, I have taken your brethren, the Levites, from among the children of Israel; to you are they given as a gift for Jehovah to perform the service of the tent of meeting.";
web[6] = "And I, behold, I have taken your brethren the Levites from among the children of Israel: to you [they are] given [as] a gift for the LORD, to do the service of the tabernacle of the congregation.";
hnv[6] = "I, behold, I have taken your brothers the Levites from among the children of Yisra\'el: to you they are a gift, given to the LORD, to do the service of the tent of meeting.";
vul[6] = "ego dedi vobis fratres vestros Levitas de medio filiorum Israhel et tradidi donum Domino ut serviant in ministeriis tabernaculi eius";
kjv[7] = "Therefore thou and thy sons with thee shall keep your priest\'s office for every thing of the altar, and within the vail; and ye shall serve: I have given your priest\'s office [unto you] as a service of gift: and the stranger that cometh nigh shall be put to death.";
rsv[7] = "And you and your sons with you shall attend to your priesthood for all that concerns the altar and that is within the veil; and you shall serve. I give your priesthood as a gift, and any one else who comes near shall be put to death.&quot;";
asv[7] = "And thou and thy sons with thee shall keep your priesthood for everything of the altar, and for that within the veil; and ye shall serve: I give you the priesthood as a service of gift: and the stranger that cometh nigh shall be put to death.";
yng[7] = "and thou, and thy sons with thee, do keep your priesthood, for everything of the altar, and within the vail, and ye have served; a service of gift I make your priesthood; and the stranger who is coming near is put to death.\'";
dby[7] = "But thou and thy sons with thee shall attend to your priesthood for all that concerneth the altar, and for that which is inside the veil; and ye shall perform the service: I give you your priesthood as a service of gift, and the stranger that cometh near shall be put to death.";
web[7] = "Therefore thou and thy sons with thee shall keep your priest\'s office for every thing of the altar, and within the vail; and ye shall serve: I have given your priest\'s office [to you as] a service of gift: and the stranger that cometh nigh shall be put to death.";
hnv[7] = "You and your sons with you shall keep your priesthood for everything of the altar, and for that within the veil; and you shall serve: I give you the priesthood as a service of gift: and the stranger who comes near shall be put to death.";
vul[7] = "tu autem et filii tui custodite sacerdotium vestrum et omnia quae ad cultum altaris pertinent et intra velum sunt per sacerdotes administrabuntur si quis externus accesserit occidetur";
kjv[8] = "And the LORD spake unto Aaron, Behold, I also have given thee the charge of mine heave offerings of all the hallowed things of the children of Israel; unto thee have I given them by reason of the anointing, and to thy sons, by an ordinance for ever.";
rsv[8] = "Then the LORD said to Aaron, &quot;And behold, I have given you whatever is kept of the offerings made to me, all the consecrated things of the people of Israel; I have given them to you as a portion, and to your sons as a perpetual due.";
asv[8] = "And Jehovah spake unto Aaron, And I, behold, I have given thee the charge of my heave-offerings, even all the hallowed things of the children of Israel; unto thee have I given them by reason of the anointing, and to thy sons, as a portion for ever.";
yng[8] = "And Jehovah speaketh unto Aaron: `And I, lo, I have given to thee the charge of My heave-offerings, of all the hallowed things of the sons of Israel -- to thee I have given them for the anointing, and to thy sons, by a statute age-during.";
dby[8] = "And Jehovah spoke to Aaron, And I, behold, I have given thee the charge of my heave-offerings, of all the hallowed things of the children of Israel; to thee have I given them, because of the anointing, and to thy sons by an everlasting statute.";
web[8] = "And the LORD spoke to Aaron, Behold, I also have given thee the charge of my heave-offerings of all the hallowed things of the children of Israel; to thee have I given them by reason of the anointing, and to thy sons, by an ordinance for ever.";
hnv[8] = "The LORD spoke to Aharon, I, behold, I have given you the charge of my heave-offerings, even all the holy things of the children of Yisra\'el; to you have I given them by reason of the anointing, and to your sons, as a portion forever.";
vul[8] = "locutus est Dominus ad Aaron ecce dedi tibi custodiam primitiarum mearum omnia quae sanctificantur a filiis Israhel tibi tradidi et filiis tuis pro officio sacerdotali legitima sempiterna";
kjv[9] = "This shall be thine of the most holy things, [reserved] from the fire: every oblation of theirs, every meat offering of theirs, and every sin offering of theirs, and every trespass offering of theirs, which they shall render unto me, [shall be] most holy for thee and for thy sons.";
rsv[9] = "This shall be yours of the most holy things, reserved from the fire; every offering of theirs, every cereal offering of theirs and every sin offering of theirs and every guilt offering of theirs, which they render to me, shall be most holy to you and to your sons.";
asv[9] = "This shall be thine of the most holy things, [reserved] from the fire: every oblation of theirs, even every meal-offering of theirs, and every sin-offering of theirs, and every trespass-offering of theirs, which they shall render unto me, shall be most holy for thee and for thy sons.";
yng[9] = "This is thine of the most holy things, from the fire: all their offering, to all their present, and to all their sin-offering, and to all their guilt-offering, which they give back to Me, is most holy to thee, and to thy sons;";
dby[9] = "This shall be thine of the most holy things, [reserved] from the fire: every offering of theirs, of all their oblations, and of all their sin-offerings, and of all their trespass-offerings, which they render unto me, it is most holy for thee and for thy sons.";
web[9] = "This shall be thine of the most holy things [reserved] from the fire: every oblation of theirs, every meat-offering of theirs, and every sin-offering of theirs, and every trespass-offering of theirs, which they shall render to me, [shall be] most holy for thee and for thy sons.";
hnv[9] = "This shall be your of the most holy things, [reserved] from the fire: every offering of theirs, even every meal-offering of theirs, and every sin-offering of theirs, and every trespass-offering of theirs, which they shall render to me, shall be most holy for you and for your sons.";
vul[9] = "haec ergo accipies de his quae sanctificantur et oblata sunt Domino omnis oblatio et sacrificium et quicquid pro peccato atque delicto redditur mihi et cedet in sancta sanctorum tuum erit et filiorum tuorum";
kjv[10] = "In the most holy [place] shalt thou eat it; every male shall eat it: it shall be holy unto thee.";
rsv[10] = "In a most holy place shall you eat of it; every male may eat of it; it is holy to you.";
asv[10] = "As the most holy things shalt thou eat thereof; every male shall eat thereof: it shall be holy unto thee.";
yng[10] = "in the holy of holies thou dost eat it; every male doth eat it; holy it is to thee.";
dby[10] = "As most holy shalt thou eat it: every male shall eat it; it shall be holy unto thee.";
web[10] = "In the most holy [place] shalt thou eat it; every male shall eat it: it shall be holy to thee.";
hnv[10] = "As the most holy things shall you eat of it; every male shall eat of it: it shall be holy to you.";
vul[10] = "in sanctuario comedes illud mares tantum edent ex eo quia consecratum est tibi";
kjv[11] = "And this [is] thine; the heave offering of their gift, with all the wave offerings of the children of Israel: I have given them unto thee, and to thy sons and to thy daughters with thee, by a statute for ever: every one that is clean in thy house shall eat of it.";
rsv[11] = "This also is yours, the offering of their gift, all the wave offerings of the people of Israel; I have given them to you, and to your sons and daughters with you, as a perpetual due; every one who is clean in your house may eat of it.";
asv[11] = "And this is thine: the heave-offering of their gift, even all the wave-offerings of the children of Israel; I have given them unto thee, and to thy sons and to thy daughters with thee, as a portion for ever; every one that is clean in thy house shall eat thereof.";
yng[11] = "`And this [is] thine: the heave-offering of their gift, to all the wave-offerings of the sons of Israel, to thee I have given them, and to thy sons, and to thy daughters with thee, by a statute age-during; every clean one in thy house doth eat it;";
dby[11] = "And this shall be thine: the heave-offering of their gift, with all the wave-offerings of the children of Israel; I have given them unto thee, and to thy sons and to thy daughters with thee, by an everlasting statute; every one that is clean in thy house shall eat of it.";
web[11] = "And this [is] thine; the heave-offering of their gift, with all the wave-offerings of the children of Israel: I have given them to thee, and to thy sons, and to thy daughters with thee, by a statute for ever: every one that is clean in thy house shall eat of it.";
hnv[11] = "This is your: the heave-offering of their gift, even all the wave-offerings of the children of Yisra\'el; I have given them to you, and to your sons and to your daughters with you, as a portion forever; everyone who is clean in your house shall eat of it.";
vul[11] = "primitias autem quas voverint et obtulerint filii Israhel tibi dedi et filiis ac filiabus tuis iure perpetuo qui mundus est in domo tua vescetur eis";
kjv[12] = "All the best of the oil, and all the best of the wine, and of the wheat, the firstfruits of them which they shall offer unto the LORD, them have I given thee.";
rsv[12] = "All the best of the oil, and all the best of the wine and of the grain, the first fruits of what they give to the LORD, I give to you.";
asv[12] = "All the best of the oil, and all the best of the vintage, and of the grain, the first-fruits of them which they give unto Jehovah, to thee have I given them.";
yng[12] = "all the best of the oil, and all the best of the new wine, and wheat -- their first-[fruits] which they give to Jehovah -- to thee I have given them.";
dby[12] = "All the best of the oil, and all the best of the new wine, and of the wheat, the firstfruits of them which they give to Jehovah, have I given thee.";
web[12] = "All the best of the oil, and all the best of the wine, and of the wheat, the first-fruits of them which they shall offer to the LORD, them have I given to thee.";
hnv[12] = " All the best of the oil, and all the best of the vintage, and of the grain, the first fruits of them which they give to the LORD, to you have I given them.";
vul[12] = "omnem medullam olei et vini ac frumenti quicquid offerunt primitiarum Domino tibi dedi";
kjv[13] = "[And] whatsoever is first ripe in the land, which they shall bring unto the LORD, shall be thine; every one that is clean in thine house shall eat [of] it.";
rsv[13] = "The first ripe fruits of all that is in their land, which they bring to the LORD, shall be yours; every one who is clean in your house may eat of it.";
asv[13] = "The first-ripe fruits of all that is in their land, which they bring unto Jehovah, shall be thine; every one that is clean in thy house shall eat thereof.";
yng[13] = "`The first-fruits of all that [is] in their land, which they bring in to Jehovah, are thine; every clean one in thy house doth eat it;";
dby[13] = "The first ripe of everything that is in their land, which they shall bring to Jehovah, shall be thine; every one that is clean in thy house shall eat of it.";
web[13] = "[And] whatever is first ripe in the land, which they shall bring to the LORD, shall be thine; every one that is clean in thy house shall eat [of] it.";
hnv[13] = "The first-ripe fruits of all that is in their land, which they bring to the LORD, shall be your; everyone who is clean in your house shall eat of it.";
vul[13] = "universa frugum initia quas gignit humus et Domino deportantur cedent in usus tuos qui mundus est in domo tua vescetur eis";
kjv[14] = "Every thing devoted in Israel shall be thine.";
rsv[14] = "Every devoted thing in Israel shall be yours.";
asv[14] = "Everything devoted in Israel shall be thine.";
yng[14] = "every devoted thing in Israel is thine,";
dby[14] = "Every devoted thing in Israel shall be thine.";
web[14] = "Every thing devoted in Israel shall be thine.";
hnv[14] = "Everything devoted in Yisra\'el shall be your.";
vul[14] = "omne quod ex voto reddiderint filii Israhel tuum erit";
kjv[15] = "Every thing that openeth the matrix in all flesh, which they bring unto the LORD, [whether it be] of men or beasts, shall be thine: nevertheless the firstborn of man shalt thou surely redeem, and the firstling of unclean beasts shalt thou redeem.";
rsv[15] = "Everything that opens the womb of all flesh, whether man or beast, which they offer to the LORD, shall be yours; nevertheless the first-born of man you shall redeem, and the firstling of unclean beasts you shall redeem.";
asv[15] = "Everything that openeth the womb, of all flesh which they offer unto Jehovah, both of man and beast shall be thine: nevertheless the first-born of man shalt thou surely redeem, and the firstling of unclean beasts shalt thou redeem.";
yng[15] = "every one opening a womb of all flesh which they bring near to Jehovah, among man and among beast, is thine; only, thou dost certainly ransom the first-born of man, and the firstling of the unclean beast thou dost ransom.";
dby[15] = "Everything that breaketh open the womb of all flesh, which they present to Jehovah, of men or of beasts, shall be thine; nevertheless the firstborn of man shalt thou in any case ransom, and the firstborn of unclean beasts shalt thou ransom.";
web[15] = "Every thing that openeth the matrix in all flesh, which they bring to the LORD, [whether] of men or beast, shall be thine: nevertheless, the first born of man shalt thou surely redeem, and the firstling of unclean beasts shalt thou redeem.";
hnv[15] = "Everything that opens the womb, of all flesh which they offer to the LORD, both of man and animal shall be your: nevertheless the firstborn of man shall you surely redeem, and the firstborn of unclean animals shall you redeem.";
vul[15] = "quicquid primum erumpet e vulva cunctae carnis quam offerunt Domino sive ex hominibus sive de pecoribus fuerit tui iuris erit ita dumtaxat ut pro hominis primogenito pretium accipias et omne animal quod inmundum est redimi facias";
kjv[16] = "And those that are to be redeemed from a month old shalt thou redeem, according to thine estimation, for the money of five shekels, after the shekel of the sanctuary, which [is] twenty gerahs.";
rsv[16] = "And their redemption price (at a month old you shall redeem them) you shall fix at five shekels in silver, according to the shekel of the sanctuary, which is twenty gerahs.";
asv[16] = "And those that are to be redeemed of them from a month old shalt thou redeem, according to thine estimation, for the money of five shekels, after the shekel of the sanctuary (the same is twenty gerahs).";
yng[16] = "`And their ransomed ones from a son of a month, thou dost ransom with thy valuation, of silver, five shekels, by the shekel of the sanctuary, twenty gerahs it [is].";
dby[16] = "And those that are to be ransomed from a month old shalt thou ransom, according to thy valuation, for the money of five shekels, after the shekel of the sanctuary, which is twenty gerahs.";
web[16] = "And those that are to be redeemed from a month old shalt thou redeem, according to thy estimation, for the money of five shekels, after the shekel of the sanctuary, which [is] twenty gerahs.";
hnv[16] = "Those who are to be redeemed of them from a month old shall you redeem, according to your estimation, for the money of five shekels, after the shekel of the sanctuary (the same is twenty gerahs).";
vul[16] = "cuius redemptio erit post unum mensem siclis argenti quinque pondere sanctuarii siclus viginti obolos habet";
kjv[17] = "But the firstling of a cow, or the firstling of a sheep, or the firstling of a goat, thou shalt not redeem; they [are] holy: thou shalt sprinkle their blood upon the altar, and shalt burn their fat [for] an offering made by fire, for a sweet savour unto the LORD.";
rsv[17] = "But the firstling of a cow, or the firstling of a sheep, or the firstling of a goat, you shall not redeem; they are holy. You shall sprinkle their blood upon the altar, and shall burn their fat as an offering by fire, a pleasing odor to the LORD;";
asv[17] = "But the firstling of a cow, or the firstling of a sheep, or the firstling of a goat, thou shalt not redeem; they are holy: thou shalt sprinkle their blood upon the altar, and shalt burn their fat for an offering made by fire, for a sweet savor unto Jehovah.";
yng[17] = "`Only, the firstling of a cow, or the firstling of a sheep, or the firstling of a goat, thou dost not ransom, holy they [are]: their blood thou dost sprinkle on the altar, and of their fat thou makest perfume, a fire-offering of sweet fragrance to Jehovah,";
dby[17] = "But the firstborn of a cow, or the firstborn of a sheep, or the firstborn of a goat, thou shalt not ransom: they are holy. Thou shalt sprinkle their blood on the altar, and their fat shalt thou burn as an offering by fire for a sweet odour to Jehovah.";
web[17] = "But the firstling of a cow, or the firstling of a sheep, or the firstling of a goat, thou shalt not redeem; they [are] holy: thou shalt sprinkle their blood upon the altar, and shalt burn their fat [for] an offering made by fire, for a sweet savor to the LORD.";
hnv[17] = "But the firstborn of a cow, or the firstborn of a sheep, or the firstborn of a goat, you shall not redeem; they are holy: you shall sprinkle their blood on the altar, and shall burn their fat for an offering made by fire, for a sweet savor to the LORD.";
vul[17] = "primogenitum autem bovis et ovis et caprae non facies redimi quia sanctificata sunt Domino sanguinem tantum eorum fundes super altare et adipes adolebis in suavissimum odorem Domino";
kjv[18] = "And the flesh of them shall be thine, as the wave breast and as the right shoulder are thine.";
rsv[18] = "but their flesh shall be yours, as the breast that is waved and as the right thigh are yours.";
asv[18] = "And the flesh of them shall be thine, as the wave-breast and as the right thigh, it shall be thine.";
yng[18] = "and their flesh is thine, as the breast of the wave-offering, and as the right leg, it is thine;";
dby[18] = "And their flesh shall be thine; as the wave-breast and as the right shoulder shall it be thine.";
web[18] = "And the flesh of them shall be thine, as the wave-breast and as the right shoulder are thine";
hnv[18] = "The flesh of them shall be your, as the wave-breast and as the right thigh, it shall be your.";
vul[18] = "carnes vero in usum tuum cedent sicut pectusculum consecratum et armus dexter tua erunt";
kjv[19] = "All the heave offerings of the holy things, which the children of Israel offer unto the LORD, have I given thee, and thy sons and thy daughters with thee, by a statute for ever: it [is] a covenant of salt for ever before the LORD unto thee and to thy seed with thee.";
rsv[19] = "All the holy offerings which the people of Israel present to the LORD I give to you, and to your sons and daughters with you, as a perpetual due; it is a covenant of salt for ever before the LORD for you and for your offspring with you.&quot;";
asv[19] = "All the heave-offerings of the holy things, which the children of Israel offer unto Jehovah, have I given thee, and thy sons and thy daughters with thee, as a portion for ever: it is a covenant of salt for ever before Jehovah unto thee and to thy seed with thee.";
yng[19] = "all the heave-offerings of the holy things which the sons of Israel lift up to Jehovah I have given to thee and to thy sons, and to thy daughters with thee, by a statute age-during, a covenant of salt, age-during it [is] before Jehovah, to thee and to thy seed with thee.\'";
dby[19] = "All the heave-offerings of the holy things, which the children of Israel offer to Jehovah, have I given thee, and to thy sons and to thy daughters with thee, by an everlasting statute: it shall be an everlasting covenant of salt before Jehovah unto thee and thy seed with thee.";

csb[1] = "The LORD said to Aaron, &quot;You, your sons, and your ancestral family will be responsible for iniquity against the sanctuary. You and your sons will be responsible for iniquity involving your priesthood.";
csb[2] = "&quot;But also bring your relatives with you from the tribe of Levi, your ancestral tribe, so they may join you and assist you and your sons in front of the tent of the testimony.";
csb[3] = "&quot;They are to perform duties for you and for the whole tent. They must not come near the sanctuary equipment or the altar; otherwise, both they and you will die.";
csb[4] = "&quot;They are to join you and guard the tent of meeting, doing all the work at the tent, but no unauthorized person may come near you.";
csb[5] = "&quot;You are to guard the sanctuary and the altar so that wrath may not fall on the Israelites again.";
csb[6] = "&quot;Look, I have selected your fellow Levites from the Israelites as a gift for you, assigned by the LORD to work at the tent of meeting.";
csb[7] = "&quot;But you and your sons will carry out your priestly responsibilities for everything concerning the altar and for what is inside the curtain, and you will do that work. I am giving you the work of the priesthood as a gift, but an unauthorized person who comes near the sanctuary will be put to death.&quot;";
csb[8] = "Then the LORD spoke to Aaron, &quot;Look, I have put you in charge of the contributions brought to me. As for all the holy offerings of the Israelites, I have given them to you and your sons as a portion and a permanent statute.";
csb[9] = "&quot;A portion of the holiest offerings kept from the fire will be yours; every one of their offerings that they give me, whether the grain offering, sin offering, or guilt offering will be most holy for you and your sons.";
csb[10] = "&quot;You are to eat it as a most holy offering. Every male may eat it; it is to be holy to you.";
csb[11] = "&quot;The contribution of their gifts also belongs to you. I have given all the Israelites\' presentation offerings to you and to your sons and daughters as a permanent statute. Every ceremonially clean person in your house may eat it.";
csb[12] = "&quot;I am giving you all the best of the fresh oil, new wine, and grain, which the Israelites give to the LORD as their firstfruits.";
csb[13] = "&quot;The firstfruits of all that is in their land, which they bring to the LORD, belong to you. Every clean person in your house may eat them.";
csb[14] = "&quot;Everything in Israel that is permanently dedicated to the LORD belongs to you.";
csb[15] = "&quot;The firstborn of every living thing, human or animal, presented to the LORD belongs to you. But you must certainly redeem a human firstborn, and redeem the firstborn of an unclean animal.";
csb[16] = "&quot;You will pay the redemption price for a month-old male according to your assessment: five shekels of silver by the standard sanctuary shekel, which is twenty gerahs.";
csb[17] = "&quot;However, you must not redeem the firstborn of an ox, a sheep, or a goat; they are holy. You are to splatter their blood on the altar and burn their fat as a fire offering for a pleasing aroma to the LORD.";
csb[18] = "&quot;But their meat belongs to you. It belongs to you like the breast of the presentation offering and the right thigh.";
csb[19] = "&quot;I give to you and to your sons and daughters all the holy contributions that the Israelites present to the LORD as a permanent statute. It is a permanent covenant of salt before the LORD for you as well as your offspring.&quot;";
csb[20] = "The LORD told Aaron, &quot;You will not have an inheritance in their land; there will be no portion among them for you. I am your portion and your inheritance among the Israelites.";
csb[21] = "&quot;Look, I have given the Levites every tenth in Israel as an inheritance in return for the work they do, the work of the tent of meeting.";
csb[22] = "&quot;The Israelites must never again come near the tent of meeting, or they will incur guilt and die.";
csb[23] = "&quot;The Levites will do the work of the tent of meeting, and they will bear the consequences of their iniquity. The Levites will not receive an inheritance among the Israelites; this is a permanent statute throughout your generations.";
csb[24] = "&quot;For I have given them the tenth that the Israelites present to the LORD as a contribution for their inheritance. That is why I told them that they would not receive an inheritance among the Israelites.&quot;";
csb[25] = "The LORD instructed Moses,";
csb[26] = "&quot;Speak to the Levites and tell them: When you receive from the Israelites the tenth that I have given you as your inheritance, you are to present part of it as an offering to the LORD -- a tenth of the tenth.";
csb[27] = "&quot;Your offering will be credited to you as if it were your grain from the threshing floor or the full harvest from the winepress.";
csb[28] = "&quot;You are to present an offering to the LORD from every tenth you receive from the Israelites. Give some of it to the priest Aaron as an offering to the LORD.";
csb[29] = "&quot;You must present the entire offering due the LORD from all your gifts. The best part of the tenth is to be consecrated.";
csb[30] = "&quot;Tell them further: Once you have presented the best part of the tenth, and it is credited to you Levites as the produce of the threshing floor or the winepress,";
csb[31] = "&quot;then you and your household may eat it anywhere. It is your wage in return for your work at the tent of meeting.";
csb[32] = "&quot;You will not incur guilt because of it once you have presented the best part of it, but you must not defile the Israelites\' holy offerings, so that you will not die.&quot;";
