csb[1] = "&quot;You are to hold a sacred assembly in the seventh month, on the first day of the month, and you are not to do any daily work. This will be a day of trumpet blasts for you.";
csb[2] = "&quot;Offer a burnt offering as a pleasing aroma to the LORD: one young bull, one ram, seven male lambs a year old -- all unblemished --";
csb[3] = "&quot;with their grain offering of fine flour mixed with oil, six quarts with the bull, four quarts with the ram,";
csb[4] = "&quot;and two quarts with each of the seven male lambs.";
csb[5] = "&quot;Also offer one male goat as a sin offering to make atonement for yourselves.";
csb[6] = "&quot;These are in addition to the monthly and regular burnt offerings with their prescribed grain offerings and drink offerings. They are a pleasing aroma, a fire offering to the LORD.";
csb[7] = "&quot;You are to hold a sacred assembly on the tenth day of this seventh month and practice self-denial; do not do any work.";
csb[8] = "&quot;Present a burnt offering to the LORD, a pleasing aroma: one young bull, one ram, and seven male lambs a year old. All your animals are to be unblemished.";
csb[9] = "&quot;Their grain offering is to be of fine flour mixed with oil, six quarts with the bull, four quarts with the ram,";
csb[10] = "&quot;and two quarts with each of the seven lambs.";
csb[11] = "&quot;Offer one male goat for a sin offering. The regular burnt offering with its grain offering and drink offerings are in addition to the sin offering of atonement.";
csb[12] = "&quot;You are to hold a sacred assembly on the fifteenth day of the seventh month; you do not do any daily work. You are to celebrate a seven-day festival for the LORD.";
csb[13] = "&quot;Present a burnt offering, a fire offering as a pleasing aroma to the LORD: thirteen young bulls, two rams, and fourteen male lambs a year old. They are to be unblemished.";
csb[14] = "&quot;Their grain offering is to be of fine flour mixed with oil, six quarts with each of the thirteen bulls, four quarts with each of the two rams,";
csb[15] = "&quot;and two quarts with each of the fourteen lambs.";
csb[16] = "&quot;Also offer one male goat as a sin offering. These are in addition to the regular burnt offering with its grain and drink offerings.";
csb[17] = "&quot;On the second day present twelve young bulls, two rams, and fourteen male lambs a year old -- all unblemished --";
csb[18] = "&quot;with their grain and drink offerings for the bulls, rams, and lambs, in proportion to their number.";
csb[19] = "&quot;Also offer one male goat as a sin offering. These are in addition to the regular burnt offering with its grain and drink and their drink offerings.";
csb[20] = "&quot;On the third day present eleven bulls, two rams, fourteen male lambs a year old -- all unblemished --";
csb[21] = "&quot;with their grain and drink offerings for the bulls, rams, and lambs, in proportion to their number.";
csb[22] = "&quot;Also offer one male goat as a sin offering. These are in addition to the regular burnt offering with its grain and drink offerings.";

csb[24] = "&quot;with their grain and drink offerings for the bulls, rams, and lambs, in proportion to their number.";

csb[28] = "&quot;Also offer one male goat as a sin offering. These are in addition to the regular burnt offering with its grain and drink offerings.";
