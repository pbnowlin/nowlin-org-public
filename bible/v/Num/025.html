rsv[18] = "for they have harassed you with their wiles, with which they beguiled you in the matter of Pe\'or, and in the matter of Cozbi, the daughter of the prince of Mid\'ian, their sister, who was slain on the day of the plague on account of Pe\'or.&quot;";

csb[1] = "While Israel was staying in the Acacia Grove, the people began to prostitute themselves with the women of Moab.";
csb[2] = "The women invited them to the sacrifices for their gods, and the people ate and bowed in worship to their gods.";
csb[3] = "So Israel aligned itself with Baal of Peor, and the LORD\'s anger burned against Israel.";
csb[4] = "The LORD said to Moses, &quot;Take all the leaders of the people and execute them in broad daylight before the LORD so that his burning anger may turn away from Israel.&quot;";
csb[5] = "So Moses told Israel\'s judges, &quot;Kill each of the men who aligned themselves with Baal of Peor.&quot;";
csb[6] = "An Israelite man came bringing a Midianite woman to his relatives in the sight of Moses and the whole Israelite community while they were weeping at the entrance to the tent of meeting.";
csb[7] = "When Phinehas son of Eleazar, son of Aaron the priest, saw this, he got up from the assembly, took a spear in his hand,";
csb[8] = "followed the Israelite man into the tent, and drove it through both the Israelite man and the woman -- through her belly. Then the plague on the Israelites was stopped,";
csb[9] = "but those who died in the plague numbered twenty-four thousand.";
csb[10] = "The LORD spoke to Moses,";
csb[11] = "&quot;Phinehas son of Eleazar, son of Aaron the priest, has turned back my wrath from the Israelites because he was zealous among them with my zeal, so that I did not destroy the Israelites in my zeal.";
csb[12] = "&quot;Therefore declare: I grant him my covenant of peace.";
csb[13] = "&quot;It will be a covenant of perpetual priesthood for him and his future descendants, because he was zealous for his God and made atonement for the Israelites.&quot;";
csb[14] = "The name of the slain Israelite man, who was struck dead with the Midianite woman, was Zimri son of Salu, the leader of a Simeonite family.";
csb[15] = "The name of the slain Midianite woman was Cozbi, the daughter of Zur, a tribal head of a family in Midian.";
csb[16] = "The LORD told Moses:";
csb[17] = "&quot;Attack the Midianites and strike them dead.";
csb[18] = "&quot;For they attacked you with the treachery that they used against you in the Peor incident. They did the same in the case involving their sister Cozbi, daughter of the Midianite leader who was killed the day the plague came at Peor.&quot;";
