csb[1] = "The daughters of Zelophehad approached; Zelophehad was the son of Hepher, son of Gilead, son of Machir, son of Manasseh from the clans of Manasseh, the son of Joseph. These were the names of his daughters: Mahlah, Noah, Hoglah, Milcah, and Tirzah.";
csb[2] = "They stood before Moses, the priest Eleazar, the leaders, and the entire community at the entrance to the tent of meeting and said,";
csb[3] = "&quot;Our father died in the wilderness, but he was not among Korah\'s followers, who gathered together against the LORD. Instead, he died because of his own sin, and he had no sons.";
csb[4] = "&quot;Why should the name of our father be taken away from his clan? Since he had no son, give us property among our father\'s brothers.&quot;";
csb[5] = "Moses brought their case before the LORD,";
csb[6] = "and the LORD answered him,";
csb[7] = "&quot;What Zelophehad\'s daughters say is correct. You are to give them hereditary property among their father\'s brothers and transfer their father\'s inheritance to them.";
csb[8] = "&quot;Tell the Israelites: When a man dies without having a son, transfer his inheritance to his daughter.";
csb[9] = "&quot;If he has no daughter, give his inheritance to his brothers.";
csb[10] = "&quot;If he has no brothers, give his inheritance to his father\'s brothers.";
csb[11] = "&quot;If his father has no brothers, give his inheritance to the nearest relative of his clan, and he will take possession of it. This is to be a statutory ordinance for the Israelites as the LORD commanded Moses.&quot;";
csb[12] = "Then the LORD said to Moses, &quot;Go up this mountain of the Abarim range and see the land that I have given the Israelites.";
csb[13] = "&quot;After you have seen it, you will also be gathered to your people, as Aaron your brother was.";
csb[14] = "&quot;When the community quarreled in the Wilderness of Zin, both of you rebelled against my command to demonstrate my holiness in their sight at the waters.&quot; Those were the Waters of Meribah-kadesh in the Wilderness of Zin.";
csb[15] = "So Moses appealed to the LORD,";
csb[16] = "&quot;May the LORD, the God who gives breath to all, appoint a man over the community";
csb[17] = "&quot;who will go out before them and come back in before them, and who will bring them out and bring them in, so that the LORD\'s community won\'t be like sheep without a shepherd.&quot;";
csb[18] = "The LORD replied to Moses, &quot;Take Joshua son of Nun, a man who has the Spirit in him, and lay your hands on him.";
csb[19] = "&quot;Have him stand before the priest Eleazar and the whole community, and commission him in their sight.";
csb[20] = "&quot;Confer some of your authority on him so that the entire Israelite community will obey him.";
csb[21] = "&quot;He will stand before the priest Eleazar who will consult the LORD for him with the decision of the Urim. He and all the Israelites with him, even the entire community, will go out and come back in at his command.&quot;";
csb[22] = "Moses did as the LORD commanded him. He took Joshua, had him stand before the priest Eleazar and the entire community,";
csb[23] = "laid his hands on him, and commissioned him, as the LORD had spoken through Moses.";
</script>
