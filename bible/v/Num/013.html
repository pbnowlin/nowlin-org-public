dby[27] = "And they told him, and said, We came to the land to which thou didst send us, and surely it floweth with milk and honey; and this is the fruit of it.";
web[27] = "And they told him, and said, We came to the land whither thou sentest us, and surely it floweth with milk and honey; and this [is] the fruit of it.";
hnv[27] = " They told him, and said, We came to the land where you sent us; and surely it flows with milk and honey; and this is the fruit of it.";
vul[27] = "[Vulgate 13:28] et narraverunt dicentes venimus in terram ad quam misisti nos quae re vera fluit lacte et melle ut ex his fructibus cognosci potest";

rsv[28] = "Yet the people who dwell in the land are strong, and the cities are fortified and very large; and besides, we saw the descendants of Anak there.";
asv[28] = "Howbeit the people that dwell in the land are strong, and the cities are fortified, [and] very great: and moreover we saw the children of Anak there.";
yng[28] = "only, surely the people which is dwelling in the land [is] strong; and the cities are fenced, very great; and also children of Anak we have seen there.";
dby[28] = "Only, the people are strong that dwell in the land, and the cities are walled, very great; moreover we saw the children of Anak there.";
web[28] = "Nevertheless, the people [are] strong that dwell in the land, and the cities [are] walled, [and] very great: and moreover, we saw the children of Anak there.";
hnv[28] = "However the people who dwell in the land are strong, and the cities are fortified, [and] very great: and moreover we saw the children of `Anak there.";
vul[28] = "[Vulgate 13:29] sed cultores fortissimos habet et urbes grandes atque muratas stirpem Enach vidimus ibi";
kjv[29] = "The Amalekites dwell in the land of the south: and the Hittites, and the Jebusites, and the Amorites, dwell in the mountains: and the Canaanites dwell by the sea, and by the coast of Jordan.";
rsv[29] = "The Amal\'ekites dwell in the land of the Negeb; the Hittites, the Jeb\'usites, and the Amorites dwell in the hill country; and the Canaanites dwell by the sea, and along the Jordan.&quot;";
asv[29] = "Amalek dwelleth in the land of the South: and the Hittite, and the Jebusite, and the Amorite, dwell in the hill-country; and the Canaanite dwelleth by the sea, and along by the side of the Jordan.";
yng[29] = "Amalek is dwelling in the land of the south, and the Hittite, and the Jebusite, and the Amorite is dwelling in the hill country, and the Canaanite is dwelling by the sea, and by the side of the Jordan.\'";
dby[29] = "Amalek dwells in the land of the south; and the Hittites, and the Jebusites, and the Amorites dwell in the hill-country; and the Canaanites dwell by the sea, and by the side of the Jordan.";
web[29] = "The Amalekites dwell in the land of the south: and the Hittites, and the Jebusites, and the Amorites, dwell in the mountains: and the Canaanites dwell by the sea, and by the coast of Jordan.";
hnv[29] = "`Amalek dwells in the land of the South: and the Hittite, and the Yevusi, and the Amori, dwell in the hill-country; and the Kana`ani dwells by the sea, and along by the side of the Yarden.";
vul[29] = "[Vulgate 13:30] Amalech habitat in meridie Hettheus et Iebuseus et Amorreus in montanis Chananeus vero moratur iuxta mare et circa fluenta Iordanis";
kjv[30] = "And Caleb stilled the people before Moses, and said, Let us go up at once, and possess it; for we are well able to overcome it.";
rsv[30] = "But Caleb quieted the people before Moses, and said, &quot;Let us go up at once, and occupy it; for we are well able to overcome it.&quot;";
asv[30] = "And Caleb stilled the people before Moses, and said, Let us go up at once, and possess it; for we are well able to overcome it.";
yng[30] = "And Caleb stilleth the people concerning Moses, and saith, `Let us certainly go up -- and we have possessed it; for we are thoroughly able for it.\'";
dby[30] = "And Caleb stilled the people before Moses, and said, Let us go up boldly and possess it, for we are well able to do it.";
web[30] = "And Caleb stilled the people before Moses, and said, Let us go up at once, and possess it; for we are well able to overcome it.";
hnv[30] = "Kalev stilled the people before Moshe, and said, Let us go up at once, and possess it; for we are well able to overcome it.";
vul[30] = "[Vulgate 13:31] inter haec Chaleb conpescens murmur populi qui oriebatur contra Mosen ait ascendamus et possideamus terram quoniam poterimus obtinere eam";
kjv[31] = "But the men that went up with him said, We be not able to go up against the people; for they [are] stronger than we.";
rsv[31] = "Then the men who had gone up with him said, &quot;We are not able to go up against the people; for they are stronger than we.&quot;";
asv[31] = "But the men that went up with him said, We are not able to go up against the people; for they are stronger than we.";
yng[31] = "And the men who have gone up with him said, `We are not able to go up against the people, for it [is] stronger than we;\'";
dby[31] = "But the men that went up with him said, We are not able to go up against the people, for they are stronger than we.";
web[31] = "But the men that went up with him said, We are not able to go up against the people; for they [are] stronger than we.";
hnv[31] = "But the men who went up with him said, We aren\'t able to go up against the people; for they are stronger than we.";
vul[31] = "[Vulgate 13:32] alii vero qui fuerant cum eo dicebant nequaquam ad hunc populum valemus ascendere quia fortior nobis est";
kjv[32] = "And they brought up an evil report of the land which they had searched unto the children of Israel, saying, The land, through which we have gone to search it, [is] a land that eateth up the inhabitants thereof; and all the people that we saw in it [are] men of a great stature.";
rsv[32] = "So they brought to the people of Israel an evil report of the land which they had spied out, saying, &quot;The land, through which we have gone, to spy it out, is a land that devours its inhabitants; and all the people that we saw in it are men of great stature.";
asv[32] = "And they brought up an evil report of the land which they had spied out unto the children of Israel, saying, The land, through which we have gone to spy it out, is a land that eateth up the inhabitants thereof; and all the people that we saw in it are men of great stature.";
yng[32] = "and they bring out an evil account of the land which they have spied unto the sons of Israel, saying, `The land into which we passed over to spy it, is a land eating up its inhabitants; and all the people whom we saw in its midst [are] men of stature;";
dby[32] = "And they brought to the children of Israel an evil report of the land which they had searched out, saying, The land, which we have passed through to search it out, is a land that eateth up its inhabitants; and all the people that we have seen in it are men of great stature;";
web[32] = "And they brought an evil report of the land which they had searched to the children of Israel, saying, The land through which we have passed to search it, [is] a land that eateth up its inhabitants; and all the people that we saw in it, [are] men of a great stature.";
hnv[32] = "They brought up an evil report of the land which they had spied out to the children of Yisra\'el, saying, The land, through which we have gone to spy it out, is a land that eats up the inhabitants of it; and all the people who we saw in it are men of great stature.";
vul[32] = "[Vulgate 13:33] detraxeruntque terrae quam inspexerant apud filios Israhel dicentes terram quam lustravimus devorat habitatores suos populum quem aspeximus procerae staturae est";
kjv[33] = "And there we saw the giants, the sons of Anak, [which come] of the giants: and we were in our own sight as grasshoppers, and so we were in their sight.";
rsv[33] = "And there we saw the Nephilim (the sons of Anak, who come from the Nephilim); and we seemed to ourselves like grasshoppers, and so we seemed to them.&quot;";
asv[33] = "And there we saw the Nephilim, the sons of Anak, who come of the Nephilim: and we were in our own sight as grasshoppers, and so we were in their sight.";
yng[33] = "and there we saw the Nephilim, sons of Anak, of the Nephilim; and we are in our own eyes as grasshoppers; and so we were in their eyes.\'";
dby[33] = "and there have we seen giants -- the sons of Anak are of the giants -- and we were in our sight as grasshoppers, and so we were also in their sight.";
web[33] = "And there we saw the giants, the sons of Anak, [who come] of the giants: and we were in our own sight as grasshoppers, and so we were in their sight.";
hnv[33] = "There we saw the Nefilim, the sons of `Anak, who come of the Nefilim: and we were in our own sight as grasshoppers, and so we were in their sight.";
vul[33] = "[Vulgate 13:34] ibi vidimus monstra quaedam filiorum Enach de genere giganteo quibus conparati quasi lucustae videbamur";
csb[1] = "The LORD spoke to Moses:";
csb[2] = "&quot;Send men to scout out the land of Canaan I am giving to the Israelites. Send one man who is a leader among them from each of their ancestral tribes.&quot;";
csb[3] = "Moses sent them from the Wilderness of Paran at the LORD\'s command. All the men were leaders in Israel.";
csb[4] = "These were their names: Shammua son of Zaccur from the tribe of Reuben;";
csb[5] = "Shaphat son of Hori from the tribe of Simeon;";
csb[6] = "Caleb son of Jephunneh from the tribe of Judah;";
csb[7] = "Igal son of Joseph from the tribe of Issachar;";
csb[8] = "Hoshea son of Nun from the tribe of Ephraim;";
csb[9] = "Palti son of Raphu from the tribe of Benjamin;";
csb[10] = "Gaddiel son of Sodi from the tribe of Zebulun;";
csb[11] = "Gaddi son of Susi from the tribe of Manasseh (from the tribe of Joseph);";
csb[12] = "Ammiel son of Gemalli from the tribe of Dan;";
csb[13] = "Sethur son of Michael from the tribe of Asher;";
csb[14] = "Nahbi son of Vophsi from the tribe of Naphtali;";
csb[15] = "Geuel son of Machi from the tribe of Gad.";
csb[16] = "These were the names of the men Moses sent to scout out the land, and Moses renamed Hoshea son of Nun, Joshua.";
csb[17] = "When Moses sent them to scout out the land of Canaan, he told them, &quot;Go up this way to the Negev, then go up into the hill country.";
csb[18] = "&quot;See what the land is like, and whether the people who live there are strong or weak, few or many.";
csb[19] = "&quot;Is the land they live in good or bad? Are the cities they live in encampments or fortifications?";
csb[20] = "&quot;Is the land fertile or unproductive? Are there trees in it or not? Be courageous. Bring back some fruit from the land.&quot; It was the season for the first ripe grapes.";
csb[21] = "So they went up and scouted out the land from the Wilderness of Zin as far as Rehob near the entrance to Hamath.";
csb[22] = "They went up through the Negev and came to Hebron, where Ahiman, Sheshai, and Talmai, the descendants of Anak, were living. Hebron was built seven years before Zoan in Egypt.";
csb[23] = "When they came to the Valley of Eshcol, they cut down a branch with a single cluster of grapes, which was carried on a pole by two men. They also took some pomegranates and figs.";
csb[24] = "That place was called the Valley of Eshcol because of the cluster of grapes the Israelites cut there.";
csb[25] = "At the end of forty days they returned from scouting out the land.";
csb[26] = "The men went back to Moses, Aaron, and the entire Israelite community in the Wilderness of Paran at Kadesh. They brought back a report for them and the whole community, and they showed them the fruit of the land.";
csb[27] = "They reported to Moses: &quot;We went into the land where you sent us. Indeed it is flowing with milk and honey, and here is some of its fruit.";
csb[28] = "&quot;However, the people living in the land are strong, and the cities are large and fortified. We also saw the descendants of Anak there.";
csb[29] = "&quot;The Amalekites are living in the land of the Negev; the Hethites, Jebusites, and Amorites live in the hill country; and the Canaanites live by the sea and along the Jordan.&quot;";
csb[30] = "Then Caleb quieted the people in the presence of Moses and said, &quot;Let\'s go up now and take possession of the land because we can certainly conquer it! &quot;";
csb[31] = "But the men who had gone up with him responded, &quot;We can\'t attack the people because they are stronger than we are! &quot;";
csb[32] = "So they gave a negative report to the Israelites about the land they had scouted: &quot;The land we passed through to explore is one that devours its inhabitants, and all the people we saw in it are men of great size.";
csb[33] = "&quot;We even saw the Nephilim there -- the descendants of Anak come from the Nephilim! To ourselves we seemed like grasshoppers, and we must have seemed the same to them.&quot;";
</script>
