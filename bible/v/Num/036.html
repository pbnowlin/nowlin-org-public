kjv[1] = "And the chief fathers of the families of the children of Gilead, the son of Machir, the son of Manasseh, of the families of the sons of Joseph, came near, and spake before Moses, and before the princes, the chief fathers of the children of Israel:";
rsv[1] = "The heads of the fathers\' houses of the families of the sons of Gilead the son of Machir, son of Manas\'seh, of the fathers\' houses of the sons of Joseph, came near and spoke before Moses and before the leaders, the heads of the fathers\' houses of the people of Israel;";
asv[1] = "And the heads of the fathers\' [houses] of the family of the children of Gilead, the son of Machir, the son of Manasseh, of the families of the sons of Joseph, came near, and spake before Moses, and before the princes, the heads of the fathers\' [houses] of the children of Israel:";
yng[1] = "And the heads of the fathers of the families of the sons of Gilead, son of Machir, son of Manasseh, of the families of the sons of Joseph, come near, and speak before Moses, and before the princes, heads of the fathers of the sons of Israel,";
dby[1] = "And the chief fathers of families of the sons of Gilead, the son of Machir, the son of Manasseh, of the families of the sons of Joseph, came near, and spoke before Moses, and before the princes, the chief fathers of the children of Israel:";
web[1] = "And the chief fathers of the families of the children of Gilead, the son of Machir, the son of Manasseh, of the families of the sons of Joseph, came near, and spoke before Moses, and before the princes, the chief fathers of the children of Israel:";
hnv[1] = "The heads of the fathers\' [houses] of the family of the children of Gil`ad, the son of Makhir, the son of Menashsheh, of the families of the sons of Yosef, came near, and spoke before Moshe, and before the princes, the heads of the fathers\' [houses] of the children of Yisra\'el:";
vul[1] = "accesserunt autem et principes familiarum Galaad filii Machir filii Manasse de stirpe filiorum Ioseph locutique sunt Mosi coram principibus Israhel atque dixerunt";
kjv[2] = "And they said, The LORD commanded my lord to give the land for an inheritance by lot to the children of Israel: and my lord was commanded by the LORD to give the inheritance of Zelophehad our brother unto his daughters.";
rsv[2] = "they said, &quot;The LORD commanded my lord to give the land for inheritance by lot to the people of Israel; and my lord was commanded by the LORD to give the inheritance of Zeloph\'ehad our brother to his daughters.";
asv[2] = "and they said, Jehovah commanded my lord to give the land for inheritance by lot to the children of Israel: and my lord was commanded by Jehovah to give the inheritance of Zelophehad our brother unto his daughters.";
yng[2] = "and say, Jehovah commanded my lord to give the land for inheritance by lot to the sons of Israel, and my lord hath been commanded by Jehovah to give the inheritance of Zelophehad our brother to his daughters.";
dby[2] = "and they said, Jehovah commanded my lord to give the land for an inheritance by lot to the children of Israel; and my lord was commanded by Jehovah to give the inheritance of Zelophehad our brother to his daughters.";
web[2] = "And they said, The LORD commanded my lord to give the land for an inheritance by lot to the children of Israel: and my lord was commanded by the LORD to give the inheritance of Zelophehad our brother to his daughters.";
hnv[2] = "and they said, the LORD commanded my lord to give the land for inheritance by lot to the children of Yisra\'el: and my lord was commanded by the LORD to give the inheritance of Tzelohchad our brother to his daughters.";
vul[2] = "tibi domino nostro praecepit Dominus ut terram sorte divideres filiis Israhel et ut filiabus Salphaad fratris nostri dares possessionem debitam patri";
kjv[3] = "And if they be married to any of the sons of the [other] tribes of the children of Israel, then shall their inheritance be taken from the inheritance of our fathers, and shall be put to the inheritance of the tribe whereunto they are received: so shall it be taken from the lot of our inheritance.";
rsv[3] = "But if they are married to any of the sons of the other tribes of the people of Israel then their inheritance will be taken from the inheritance of our fathers, and added to the inheritance of the tribe to which they belong; so it will be taken away from the lot of our inheritance.";
asv[3] = "And if they be married to any of the sons of the [other] tribes of the children of Israel, then will their inheritance be taken away from the inheritance of our fathers, and will be added to the inheritance of the tribe whereunto they shall belong: so will it be taken away from the lot of our inheritance.";
yng[3] = "`And -- they have been to one of the sons of the [other] tribes of the sons of Israel for wives, and their inheritance hath been withdrawn from the inheritance of our fathers, and hath been added to the inheritance of the tribe which is theirs, and from the lot of our inheritance it is withdrawn,";
dby[3] = "Now if they be married to any of the sons of the [other] tribes of the children of Israel, then shall their inheritance be taken from the inheritance of our fathers, and shall be added to the inheritance of the tribe to which they shall belong; and it shall be taken from the lot of our inheritance.";
web[3] = "And if they shall be married to any of the sons of the [other] tribes of the children of Israel, then will their inheritance be taken from the inheritance of our fathers, and will be put to the inheritance of the tribe into which they are received: so it will be taken from the lot of our inheritance.";
hnv[3] = "If they be married to any of the sons of the [other] tribes of the children of Yisra\'el, then will their inheritance be taken away from the inheritance of our fathers, and will be added to the inheritance of the tribe whereunto they shall belong: so will it be taken away from the lot of our inheritance.";
vul[3] = "quas si alterius tribus homines uxores acceperint sequetur possessio sua et translata ad aliam tribum de nostra hereditate minuetur";
kjv[4] = "And when the jubile of the children of Israel shall be, then shall their inheritance be put unto the inheritance of the tribe whereunto they are received: so shall their inheritance be taken away from the inheritance of the tribe of our fathers.";
rsv[4] = "And when the jubilee of the people of Israel comes, then their inheritance will be added to the inheritance of the tribe to which they belong; and their inheritance will be taken from the inheritance of the tribe of our fathers.&quot;";
asv[4] = "And when the jubilee of the children of Israel shall be, then will their inheritance be added unto the inheritance of the tribe whereunto they shall belong: so will their inheritance be taken away from the inheritance of the tribe of our fathers.";
yng[4] = "and if it is the jubilee of the sons of Israel, then hath their inheritance been added to the inheritance of the tribe which is theirs, and from the inheritance of the tribe of our fathers is their inheritance withdrawn.\'";
dby[4] = "And when the jubilee of the children of Israel shall come, then shall their inheritance be added to the inheritance of the tribe to which they shall belong; and their inheritance shall be taken away from the inheritance of the tribe of our fathers.";
web[4] = "And when the jubilee of the children of Israel shall be, then will their inheritance be put to the inheritance of the tribe into which they are received: so shall their inheritance be taken away from the inheritance of the tribe of our fathers.";
hnv[4] = "When the jubilee of the children of Yisra\'el shall be, then will their inheritance be added to the inheritance of the tribe whereunto they shall belong: so will their inheritance be taken away from the inheritance of the tribe of our fathers.";
vul[4] = "atque ita fiet ut cum iobeleus id est quinquagesimus annus remissionis advenerit confundatur sortium distributio et aliorum possessio ad alios transeat";
kjv[5] = "And Moses commanded the children of Israel according to the word of the LORD, saying, The tribe of the sons of Joseph hath said well.";
rsv[5] = "And Moses commanded the people of Israel according to the word of the LORD, saying, &quot;The tribe of the sons of Joseph is right.";
asv[5] = "And Moses commanded the children of Israel according to the word of Jehovah, saying, The tribe of the sons of Joseph speaketh right.";
yng[5] = "And Moses commandeth the sons of Israel, by the command of Jehovah, saying, `Rightly are the tribe of the sons of Joseph speaking;";
dby[5] = "And Moses commanded the children of Israel according to the word of Jehovah, saying, The tribe of the sons of Joseph hath said well.";
web[5] = "And Moses commanded the children of Israel according to the word of the LORD, saying, The tribe of the sons of Joseph hath said well.";
hnv[5] = "Moshe commanded the children of Yisra\'el according to the word of the LORD, saying, The tribe of the sons of Yosef speaks right.";
vul[5] = "respondit Moses filiis Israhel et Domino praecipiente ait recte tribus filiorum Ioseph locuta est";
kjv[6] = "This [is] the thing which the LORD doth command concerning the daughters of Zelophehad, saying, Let them marry to whom they think best; only to the family of the tribe of their father shall they marry.";
rsv[6] = "This is what the LORD commands concerning the daughters of Zeloph\'ehad, \'Let them marry whom they think best; only, they shall marry within the family of the tribe of their father.";
asv[6] = "This is the thing which Jehovah doth command concerning the daughters of Zelophehad, saying, Let them be married to whom they think best; only into the family of the tribe of their father shall they be married.";
yng[6] = "this [is] the thing which Jehovah hath commanded concerning the daughters of Zelophehad, saying, To those good in their eyes let them be for wives; only, to a family of the tribe of their fathers let them be for wives;";
dby[6] = "This is the thing which Jehovah hath commanded concerning the daughters of Zelophehad, saying, Let them marry whom they please; only they shall marry one of the tribe of their father,";
web[6] = "This [is] the thing which the LORD doth command concerning the daughters of Zelophehad, saying, Let them marry to whom they think best; only to the family of the tribe of their father shall they marry.";
hnv[6] = "This is the thing which the LORD does command concerning the daughters of Tzelohchad, saying, Let them be married to whom they think best; only into the family of the tribe of their father shall they be married.";
vul[6] = "et haec lex super filiabus Salphaad a Domino promulgata est nubant quibus volunt tantum ut suae tribus hominibus";
kjv[7] = "So shall not the inheritance of the children of Israel remove from tribe to tribe: for every one of the children of Israel shall keep himself to the inheritance of the tribe of his fathers.";
rsv[7] = "The inheritance of the people of Israel shall not be transferred from one tribe to another; for every one of the people of Israel shall cleave to the inheritance of the tribe of his fathers.";
asv[7] = "So shall no inheritance of the children of Israel remove from tribe to tribe; for the children of Israel shall cleave every one to the inheritance of the tribe of his fathers.";
yng[7] = "and the inheritance of the sons of Israel doth not turn round from tribe unto tribe; for each to the inheritance of the tribe of his fathers, do the sons of Israel cleave.";
dby[7] = "that no inheritance of the children of Israel pass from tribe to tribe; for every one of the children of Israel shall keep to the inheritance of the tribe of his fathers.";
web[7] = "So shall not the inheritance of the children of Israel remove from tribe to tribe: for every one of the children of Israel shall keep himself to the inheritance of the tribe of his fathers.";
hnv[7] = "So shall no inheritance of the children of Yisra\'el remove from tribe to tribe; for the children of Yisra\'el shall cleave everyone to the inheritance of the tribe of his fathers.";
vul[7] = "ne commisceatur possessio filiorum Israhel de tribu in tribum omnes enim viri ducent uxores de tribu et cognatione sua";
kjv[8] = "And every daughter, that possesseth an inheritance in any tribe of the children of Israel, shall be wife unto one of the family of the tribe of her father, that the children of Israel may enjoy every man the inheritance of his fathers.";
rsv[8] = "And every daughter who possesses an inheritance in any tribe of the people of Israel shall be wife to one of the family of the tribe of her father, so that every one of the people of Israel may possess the inheritance of his fathers.";
asv[8] = "And every daughter, that possesseth an inheritance in any tribe of the children of Israel, shall be wife unto one of the family of the tribe of her father, that the children of Israel may possess every man the inheritance of his fathers.";
yng[8] = "`And every daughter possessing an inheritance, of the tribes of the sons of Israel, is to one of the family of the tribe of her father for a wife, so that the sons of Israel possess each the inheritance of his fathers,";
dby[8] = "And every daughter that possesseth an inheritance among the tribes of the children of Israel, shall be married to one of the family of the tribe of her father, that the children of Israel may possess every one the inheritance of his fathers,";
web[8] = "And every daughter, that possesseth an inheritance in any tribe of the children of Israel, shall be wife to one of the family of the tribe of her father, that the children of Israel may enjoy every man the inheritance of his fathers.";
hnv[8] = "Every daughter, who possesses an inheritance in any tribe of the children of Yisra\'el, shall be wife to one of the family of the tribe of her father, that the children of Yisra\'el may possess every man the inheritance of his fathers.";
vul[8] = "et cunctae feminae maritos de eadem tribu accipient ut hereditas permaneat in familiis";
kjv[9] = "Neither shall the inheritance remove from [one] tribe to another tribe; but every one of the tribes of the children of Israel shall keep himself to his own inheritance.";
rsv[9] = "So no inheritance shall be transferred from one tribe to another; for each of the tribes of the people of Israel shall cleave to its own inheritance.\'&quot;";
asv[9] = "So shall no inheritance remove from one tribe to another tribe; for the tribes of the children of Israel shall cleave every one to his own inheritance.";
yng[9] = "and the inheritance doth not turn round from [one] tribe to another tribe; for each to his inheritance do they cleave, the tribes of the sons of Israel.\'";
dby[9] = "and the inheritance shall not pass from one tribe to another tribe; for each of the tribes of the children of Israel shall keep to his inheritance.";
web[9] = "Neither shall the inheritance remove from [one] tribe to another tribe; but every one of the tribes of the children of Israel shall keep himself to his own inheritance.";
hnv[9] = " So shall no inheritance remove from one tribe to another tribe; for the tribes of the children of Yisra\'el shall cleave everyone to his own inheritance.";
vul[9] = "nec sibi misceantur tribus sed ita maneant";
kjv[10] = "Even as the LORD commanded Moses, so did the daughters of Zelophehad:";
rsv[10] = "The daughters of Zeloph\'ehad did as the LORD commanded Moses;";
asv[10] = "Even as Jehovah commanded Moses, so did the daughters of Zelophehad:";
yng[10] = "As Jehovah hath commanded Moses, so have the daughters of Zelophehad done,";
dby[10] = "Even as Jehovah had commanded Moses, so did the daughters of Zelophehad;";
web[10] = "Even as the LORD commanded Moses, so did the daughters of Zelophehad:";
hnv[10] = "Even as the LORD commanded Moshe, so did the daughters of Tzelohchad:";
vul[10] = "ut a Domino separatae sunt feceruntque filiae Salphaad ut fuerat imperatum";
kjv[11] = "For Mahlah, Tirzah, and Hoglah, and Milcah, and Noah, the daughters of Zelophehad, were married unto their father\'s brothers\' sons:";
rsv[11] = "for Mahlah, Tirzah, Hoglah, Milcah, and Noah, the daughters of Zeloph\'ehad, were married to sons of their father\'s brothers.";
asv[11] = "for Mahlah, Tirzah, and Hoglah, and Milcah, and Noah, the daughters of Zelophehad, were married unto their father\'s brothers\' sons.";
yng[11] = "and Mahlah, Tirzah, and Hoglah, and Milcah, and Noah, daughters of Zelophehad, are to the sons of their fathers\' brethren for wives;";
dby[11] = "and Mahlah, Tirzah, and Hoglah, and Milcah, and Noah, the daughters of Zelophehad, were married unto their uncles\' sons.";
web[11] = "For Mahlah, Tirzah, and Hoglah, and Milcah, and Noah, the daughters of Zelophehad, were married to their father\'s brothers\' sons:";
hnv[11] = "for Machlah, Tirtzah, and Hoglah, and Milkah, and Noach, the daughters of Tzelohchad, were married to their father\'s brothers\' sons.";
vul[11] = "et nupserunt Maala et Thersa et Egla et Melcha et Noa filiis patrui sui";
kjv[12] = "[And] they were married into the families of the sons of Manasseh the son of Joseph, and their inheritance remained in the tribe of the family of their father.";
rsv[12] = "They were married into the families of the sons of Manas\'seh the son of Joseph, and their inheritance remained in the tribe of the family of their father.";
asv[12] = "They were married into the families of the sons of Manasseh the son of Joseph; and their inheritance remained in the tribe of the family of their father.";
yng[12] = "[to men] of the families of the sons of Manasseh, son of Joseph, they have been for wives, and their inheritance is with the tribe of the family of their father.";
dby[12] = "To those that were of the families of the sons of Manasseh the son of Joseph were they married; and their inheritance remained in the tribe of the family of their father.";
web[12] = "[And] they were married into the families of the sons of Manasseh the son of Joseph, and their inheritance remained in the tribe of the family of their father.";
hnv[12] = "They were married into the families of the sons of Menashsheh the son of Yosef; and their inheritance remained in the tribe of the family of their father.";
vul[12] = "de familia Manasse qui fuit filius Ioseph et possessio quae illis fuerat adtributa mansit in tribu et familia patris earum";
kjv[13] = "These [are] the commandments and the judgments, which the LORD commanded by the hand of Moses unto the children of Israel in the plains of Moab by Jordan [near] Jericho.";
rsv[13] = "These are the commandments and the ordinances which the LORD commanded by Moses to the people of Israel in the plains of Moab by the Jordan at Jericho.";
asv[13] = "These are the commandments and the ordinances which Jehovah commanded by Moses unto the children of Israel in the plains of Moab by the Jordan at Jericho.";
yng[13] = "These [are] the commands and the judgments which Jehovah hath commanded, by the hand of Moses, concerning the sons of Israel, in the plains of Moab, by Jordan, [near] Jericho.";
dby[13] = "These are the commandments and the ordinances which Jehovah commanded through Moses to the children of Israel, in the plains of Moab, by the Jordan of Jericho.";
web[13] = "These [are] the commandments and the judgments, which the LORD commanded by the hand of Moses to the children of Israel in the plains of Moab by Jordan [near] Jericho.";
hnv[13] = "These are the mitzvot and the ordinances which the LORD commanded by Moshe to the children of Yisra\'el in the plains of Mo\'av by the Yarden at Yericho.";
vul[13] = "haec sunt mandata atque iudicia quae praecepit Dominus per manum Mosi ad filios Israhel in campestribus Moab super Iordanem contra Hiericho";
csb[1] = "The family heads from the clan of the descendants of Gilead -- the son of Machir, son of Manasseh -- who were from the clans of the sons of Joseph, approached and addressed Moses and the leaders who were heads of the Israelite families.";
csb[2] = "They said, &quot;The LORD commanded my lord to give the land as an inheritance by lot to the Israelites. My lord was further commanded by the LORD to give our brother Zelophehad\'s inheritance to his daughters.";
csb[3] = "&quot;If they marry any of the men from the other Israelite tribes, their inheritance will be taken away from our fathers\' inheritance and added to that of the tribe into which they marry. Therefore, part of our allotted inheritance would be taken away.";
csb[4] = "&quot;When the Jubilee comes for the Israelites, their inheritance will be added to that of the tribe into which they marry, and their inheritance will be taken away from the inheritance of our ancestral tribe.&quot;";
csb[5] = "So Moses commanded the Israelites at the word of the LORD, &quot;What the tribe of Joseph\'s descendants says is right.";
csb[6] = "&quot;This is what the LORD has commanded concerning Zelophehad\'s daughters: They may marry anyone they like provided they marry within a clan of their ancestral tribe.";
csb[7] = "&quot;No inheritance belonging to the Israelites is to transfer from tribe to tribe, because each of the Israelites is to retain the inheritance of his ancestral tribe.";
csb[8] = "&quot;Any daughter who possesses an inheritance from an Israelite tribe must marry someone from the clan of her ancestral tribe, so that each of the Israelites will possess the inheritance of his fathers.";
csb[9] = "&quot;No inheritance is to transfer from one tribe to another, because each of the Israelite tribes is to retain its inheritance.&quot;";
csb[10] = "The daughters of Zelophehad did as the LORD commanded Moses.";
csb[11] = "Mahlah, Tirzah, Hoglah, Milcah, and Noah, the daughters of Zelophehad, married cousins on their father\'s side.";
csb[12] = "They married men from the clans of the descendants of Manasseh son of Joseph, and their inheritance remained within the tribe of their father\'s clan.";
csb[13] = "These are the commands and ordinances the LORD commanded the Israelites through Moses in the plains of Moab by the Jordan across from Jericho.";
</script>
