csb[1] = "Miriam and Aaron criticized Moses because of the Cushite woman he married (for he had married a Cushite woman).";
csb[2] = "They said, &quot;Does the LORD speak only through Moses? Does he not also speak through us? &quot; And the LORD heard it.";
csb[3] = "Moses was a very humble man, more so than anyone on the face of the earth.";
csb[4] = "Suddenly the LORD said to Moses, Aaron, and Miriam, &quot;You three come out to the tent of meeting.&quot; So the three of them went out.";
csb[5] = "Then the LORD descended in a pillar of cloud, stood at the entrance to the tent, and summoned Aaron and Miriam. When the two of them came forward,";
csb[6] = "he said: &quot;Listen to what I say: If there is a prophet among you from the LORD, I make myself known to him in a vision; I speak with him in a dream.";
csb[7] = "&quot;Not so with my servant Moses; he is faithful in all my household.";
csb[8] = "&quot;I speak with him directly, openly, and not in riddles; he sees the form of the LORD. So why were you not afraid to speak against my servant Moses? &quot;";
csb[9] = "The LORD\'s anger burned against them, and he left.";
csb[10] = "As the cloud moved away from the tent, Miriam\'s skin suddenly became diseased, resembling snow. When Aaron turned toward her, he saw that she was diseased";
csb[11] = "and said to Moses, &quot;My lord, please don\'t hold against us this sin we have so foolishly committed.";
csb[12] = "&quot;Please don\'t let her be like a dead baby whose flesh is half eaten away when he comes out of his mother\'s womb.&quot;";
csb[13] = "Then Moses cried out to the LORD, &quot;God, please heal her! &quot;";
csb[14] = "The LORD answered Moses, &quot;If her father had merely spit in her face, wouldn\'t she remain in disgrace for seven days? Let her be confined outside the camp for seven days; after that she may be brought back in.&quot;";
csb[15] = "So Miriam was confined outside the camp for seven days, and the people did not move on until Miriam was brought back in.";
csb[16] = "After that, the people set out from Hazeroth and camped in the Wilderness of Paran.";
