kjv[26] = "And over the host of the tribe of the children of Asher [was] Pagiel the son of Ocran.";
rsv[26] = "And over the host of the tribe of the men of Asher was Pa\'giel the son of Ochran.";
asv[26] = "And over the host of the tribe of the children of Asher was Pagiel the son of Ochran.";
yng[26] = "And over the host of the tribe of the sons of Asher [is] Pagiel son of Ocran.";
dby[26] = "and over the host of the tribe of the children of Asher was Pagiel the son of Ocran;";
web[26] = "And over the host of the tribe of the children of Asher [was] Pagiel the son of Ocran.";
hnv[26] = "Over the host of the tribe of the children of Asher was Pag`i\'el the son of `Okhran.";
vul[26] = "in tribu autem filiorum Aser erat princeps Phagaihel filius Ochran";
kjv[27] = "And over the host of the tribe of the children of Naphtali [was] Ahira the son of Enan.";
rsv[27] = "And over the host of the tribe of the men of Naph\'tali was Ahi\'ra the son of Enan.";
asv[27] = "And over the host of the tribe of the children of Naphtali was Ahira the son of Enan.";
yng[27] = "And over the host of the tribe of the sons of Naphtali [is] Ahira son of Enan.";
dby[27] = "and over the host of the tribe of the children of Naphtali was Ahira the son of Enan.";
web[27] = "And over the host of the tribe of the children of Naphtali [was] Ahira the son of Enan.";

vul[27] = "et in tribu filiorum Nepthalim princeps Achira filius Henan";
kjv[28] = "Thus [were] the journeyings of the children of Israel according to their armies, when they set forward.";
rsv[28] = "This was the order of march of the people of Israel according to their hosts, when they set out.";
asv[28] = "Thus were the journeyings of the children of Israel according to their hosts; and they set forward.";
yng[28] = "These [are] journeyings of the sons of Israel by their hosts -- and they journey.";
dby[28] = "These were the settings forward of the children of Israel according to their hosts: so did they set forward.";
web[28] = "Thus [were] the journeyings of the children of Israel according to their armies, when they moved forward.";
hnv[28] = "Thus were the travels of the children of Yisra\'el according to their hosts; and they set forward.";
vul[28] = "haec sunt castra et profectiones filiorum Israhel per turmas suas quando egrediebantur";
kjv[29] = "And Moses said unto Hobab, the son of Raguel the Midianite, Moses\' father in law, We are journeying unto the place of which the LORD said, I will give it you: come thou with us, and we will do thee good: for the LORD hath spoken good concerning Israel.";
rsv[29] = "And Moses said to Hobab the son of Reu\'el the Mid\'ianite, Moses\' father-in-law, &quot;We are setting out for the place of which the LORD said, \'I will give it to you\'; come with us, and we will do you good; for the LORD has promised good to Israel.&quot;";
asv[29] = "And Moses said unto Hobab, the son of Reuel the Midianite, Moses\' father-in-law, We are journeying unto the place of which Jehovah said, I will give it you: come thou with us, and we will do thee good; for Jehovah hath spoken good concerning Israel.";
yng[29] = "And Moses saith to Hobab son of Raguel the Midianite, father-in-law of Moses, `We are journeying unto the place of which Jehovah hath said, I give it to you; go with us, and we have done good to thee; for Jehovah hath spoken good concerning Israel.\'";
dby[29] = "And Moses said to Hobab, the son of Reuel the Midianite, Moses\' father-in-law, We are journeying to the place of which Jehovah said, I will give it unto you: come with us, and we will do thee good; for Jehovah has spoken good concerning Israel.";
web[29] = "And Moses said to Hobab, the son of Raguel the Midianite, Moses\'s father-in-law, We are journeying to the place of which the LORD said, I will give it to you: come thou with us, and we will do thee good: for the LORD hath spoken good concerning Israel.";
hnv[29] = "Moshe said to Hovav, the son of Re`u\'el the Midyanite, Moshe\'s father-in-law, We are journeying to the place of which the LORD said, I will give it you: come you with us, and we will do you good; for the LORD has spoken good concerning Yisra\'el.";
vul[29] = "dixitque Moses Hobab filio Rahuhel Madianiti cognato suo proficiscimur ad locum quem Dominus daturus est nobis veni nobiscum ut benefaciamus tibi quia Dominus bona promisit Israheli";
kjv[30] = "And he said unto him, I will not go; but I will depart to mine own land, and to my kindred.";
rsv[30] = "But he said to him, &quot;I will not go; I will depart to my own land and to my kindred.&quot;";
asv[30] = "And he said unto him, I will not go; but I will depart to mine own land, and to my kindred.";
yng[30] = "And he saith unto him, `I do not go; but unto my land and unto my kindred do I go.\'";
dby[30] = "And he said to him, I will not go; but to mine own land, and to my kindred will I go.";
web[30] = "And he said to him, I will not go; but I will depart to my own land, and to my kindred.";
hnv[30] = "He said to him, I will not go; but I will depart to my own land, and to my relatives.";
vul[30] = "cui ille respondit non vadam tecum sed revertar in terram meam in qua natus sum";
kjv[31] = "And he said, Leave us not, I pray thee; forasmuch as thou knowest how we are to encamp in the wilderness, and thou mayest be to us instead of eyes.";
rsv[31] = "And he said, &quot;Do not leave us, I pray you, for you know how we are to encamp in the wilderness, and you will serve as eyes for us.";
asv[31] = "And he said, Leave us not, I pray thee; forasmuch as thou knowest how we are to encamp in the wilderness, and thou shalt be to us instead of eyes.";
yng[31] = "And he saith, `I pray thee, forsake us not, because thou hast known our encamping in the wilderness, and thou hast been to us for eyes;";
dby[31] = "And he said, Leave me not, I pray thee, because thou knowest where we are to encamp in the wilderness, and thou wilt be to us for eyes.";
web[31] = "And he said, Leave us not, I pray thee; forasmuch as thou knowest how we are to encamp in the wilderness, and thou mayest be to us instead of eyes.";
hnv[31] = "He said, Don\'t leave us, please; because you know how we are to encamp in the wilderness, and you shall be to us instead of eyes.";
vul[31] = "et ille noli inquit nos relinquere tu enim nosti in quibus locis per desertum castra ponere debeamus et eris ductor noster";
kjv[32] = "And it shall be, if thou go with us, yea, it shall be, that what goodness the LORD shall do unto us, the same will we do unto thee.";
rsv[32] = "And if you go with us, whatever good the LORD will do to us, the same will we do to you.&quot;";
asv[32] = "And it shall be, if thou go with us, yea, it shall be, that what good soever Jehovah shall do unto us, the same will we do unto thee.";
yng[32] = "and it hath come to pass when thou goest with us, yea, it hath come to pass -- that good which Jehovah doth kindly with us -- it we have done kindly to thee.\'";
dby[32] = "And it shall be, if thou come with us, that whatever good Jehovah doeth unto us, so will we do to thee.";
web[32] = "And it shall be, if thou wilt go with us, yea, it shall be, that what goodness the LORD shall do to us, the same will we do to thee.";
hnv[32] = "It shall be, if you go with us, yes, it shall be, that whatever good the LORD shall do to us, the same will we do to you.";
vul[32] = "cumque nobiscum veneris quicquid optimum fuerit ex opibus quas nobis traditurus est Dominus dabimus tibi";
kjv[33] = "And they departed from the mount of the LORD three days\' journey: and the ark of the covenant of the LORD went before them in the three days\' journey, to search out a resting place for them.";
rsv[33] = "So they set out from the mount of the LORD three days\' journey; and the ark of the covenant of the LORD went before them three days\' journey, to seek out a resting place for them.";
asv[33] = "And they set forward from the mount of Jehovah three days\' journey; and the ark of the covenant of Jehovah went before them three days\' journey, to seek out a resting-place for them.";
yng[33] = "And they journey from the mount of Jehovah a journey of three days; and the ark of the covenant of Jehovah is journeying before them the journey of three days, to spy out for them a resting-place;";
dby[33] = "And they set forward from the mountain of Jehovah [and went] three days\' journey; and the ark of the covenant of Jehovah went before them in the three days\' journey, to search out a resting-place for them.";
web[33] = "And they departed from the mount of the LORD three days\' journey: and the ark of the covenant of the LORD went before them in the three days\' journey, to seek a resting-place for them.";
hnv[33] = "They set forward from the Mount of the LORD three days\' journey; and the ark of the covenant of the LORD went before them three days\' journey, to seek out a resting-place for them.";
vul[33] = "profecti sunt ergo de monte Domini via trium dierum arcaque foederis Domini praecedebat eos per dies tres providens castrorum locum";
kjv[34] = "And the cloud of the LORD [was] upon them by day, when they went out of the camp.";
rsv[34] = "And the cloud of the LORD was over them by day, whenever they set out from the camp.";
asv[34] = "And the cloud of Jehovah was over them by day, when they set forward from the camp.";
yng[34] = "and the cloud of Jehovah [is] on them by day, in their journeying from the camp.";
dby[34] = "And the cloud of Jehovah was over them by day when they set forward out of the camp.";
web[34] = "And the cloud of the LORD [was] upon them by day, when they went out of the camp.";
hnv[34] = "The cloud of the LORD was over them by day, when they set forward from the camp.";
vul[34] = "nubes quoque Domini super eos erat per diem cum incederent";
kjv[35] = "And it came to pass, when the ark set forward, that Moses said, Rise up, LORD, and let thine enemies be scattered; and let them that hate thee flee before thee.";
rsv[35] = "And whenever the ark set out, Moses said, &quot;Arise, O LORD, and let thy enemies be scattered; and let them that hate thee flee before thee.&quot;";
asv[35] = "And it came to pass, when the ark set forward, that Moses said, Rise up, O Jehovah, and let thine enemies be scattered; and let them that hate thee flee before thee.";
yng[35] = "And it cometh to pass in the journeying of the ark, that Moses saith, `Rise, O Jehovah, and Thine enemies are scattered, and those hating Thee flee from Thy presence.\'";
dby[35] = "And it came to pass when the ark set forward, that Moses said, Rise up, Jehovah, and let thine enemies be scattered; And let them that hate thee flee before thy face.";
web[35] = "And it came to pass, when the ark moved forward, that Moses said, Arise, LORD, and let thy enemies be scattered; and let them that hate thee flee before thee.";
hnv[35] = "It happened, when the ark set forward, that Moshe said, Rise up, LORD, and let your enemies be scattered; and let those who hate you flee before you.";
vul[35] = "cumque elevaretur arca dicebat Moses surge Domine et dissipentur inimici tui et fugiant qui oderunt te a facie tua";
kjv[36] = "And when it rested, he said, Return, O LORD, unto the many thousands of Israel.";
rsv[36] = "And when it rested, he said, &quot;Return, O LORD, to the ten thousand thousands of Israel.&quot;";
asv[36] = "And when it rested, he said, Return, O Jehovah, unto the ten thousands of the thousands of Israel.";
yng[36] = "And in its resting he saith, `Return, O Jehovah, [to] the myriads, the thousands of Israel.\'";
dby[36] = "And when it rested, he said, Return, Jehovah, unto the myriads of the thousands of Israel.";
web[36] = "And when it rested, he said, Return, O LORD, to the many thousands of Israel.";
hnv[36] = "When it rested, he said, Return, LORD, to the ten thousands of the thousands of Yisra\'el.";
vul[36] = "cum autem deponeretur aiebat revertere Domine ad multitudinem exercitus Israhel";
csb[1] = "The LORD spoke to Moses:";
csb[2] = "&quot;Make two trumpets of hammered silver to summon the community and have the camps set out.";
csb[3] = "&quot;When both are sounded in long blasts, the entire community is to gather before you at the entrance to the tent of meeting.";
csb[4] = "&quot;However, if one is sounded, only the leaders, the heads of Israel\'s clans, are to gather before you.";
csb[5] = "&quot;When you sound short blasts, the camps pitched on the east are to set out.";
csb[6] = "&quot;When you sound short blasts a second time, the camps pitched on the south are to set out. Short blasts are to be sounded for them to set out.";
csb[7] = "&quot;When calling the assembly together, you are to sound long blasts, not short ones.";
csb[8] = "&quot;The sons of Aaron, the priests, are to sound the trumpets. Your use of these is a permanent statute throughout your generations.";
csb[9] = "&quot;When you enter into battle in your land against an adversary who is attacking you, sound short blasts on the trumpets, and you will be remembered before the LORD your God and be saved from your enemies.";
csb[10] = "&quot;You are to sound the trumpets over your burnt offerings and your fellowship sacrifices and on your joyous occasions, your appointed festivals, and the beginning of each of your months. They will serve as a reminder for you before your God: I am the LORD your God.&quot;";
csb[11] = "During the second year, in the second month on the twentieth day of the month, the cloud was lifted up above the tabernacle of the testimony.";
csb[12] = "The Israelites traveled on from the Wilderness of Sinai, moving from one place to the next until the cloud stopped in the Wilderness of Paran.";
csb[13] = "They set out for the first time according to the LORD\'s command through Moses.";
csb[14] = "The military divisions of the camp of Judah\'s descendants with their banner set out first, and Nahshon son of Amminadab was over their divisions.";
csb[15] = "Nethanel son of Zuar was over the division of the tribe of Issachar\'s descendants,";
csb[16] = "and Eliab son of Helon was over the division of the tribe of Zebulun\'s descendants.";
csb[17] = "The tabernacle was then taken down, and the Gershonites and the Merarites set out, transporting the tabernacle.";
csb[18] = "The military divisions of the camp of Reuben with their banner set out, and Elizur son of Shedeur was over their divisions.";
csb[19] = "Shelumiel son of Zurishaddai was over the division of the tribe of Simeon\'s descendants,";
csb[20] = "and Eliasaph son of Deuel was over the division of the tribe of Gad\'s descendants.";
csb[21] = "The Kohathites then set out, transporting the holy objects; the tabernacle was to be set up before their arrival.";
csb[22] = "Next the military divisions of the camp of Ephraim\'s descendants with their banner set out, and Elishama son of Ammihud was over their divisions.";
csb[23] = "Gamaliel son of Pedahzur was over the division of the tribe of Manasseh\'s descendants,";
csb[24] = "and Abidan son of Gideoni was over the division of the tribe of Benjamin\'s descendants.";
csb[25] = "The military divisions of the camp of Dan\'s descendants with their banner set out, serving as rear guard for all the camps, and Ahiezer son of Ammishaddai was over their divisions.";
csb[26] = "Pagiel son of Ochran was over the division of the tribe of Asher\'s descendants,";
csb[27] = "and Ahira son of Enan was over the division of the tribe of Naphtali\'s descendants.";
csb[28] = "This was the order of march for the Israelites by their military divisions as they set out.";
csb[29] = "Moses said to Hobab, descendant of Reuel the Midianite and Moses\'s relative by marriage: Reuel the Midianite: &quot;We\'re setting out for the place the LORD promised: \'I will give it to you.\' Come with us, and we will treat you well, for the LORD has promised good things to Israel.&quot;";
csb[30] = "But he replied to him, &quot;I don\'t want to go. Instead, I will go to my own land and my relatives.&quot;";
csb[31] = "&quot;Please don\'t leave us,&quot; Moses said, &quot;since you know where we should camp in the wilderness, and you can serve as our eyes.";
csb[32] = "&quot;If you come with us, whatever good the LORD does for us we will do for you.&quot;";
csb[33] = "They set out from the mountain of the LORD on a three-day journey with the ark of the LORD\'s covenant traveling ahead of them for those three days to seek a resting place for them.";
csb[34] = "Meanwhile, the cloud of the LORD was over them by day when they set out from the camp.";
csb[35] = "Whenever the ark set out, Moses would say: Arise, LORD! Let your enemies be scattered, and those who hate you flee from your presence.";
csb[36] = "When it came to rest, he would say: Return, LORD, to the countless thousands of Israel.";
