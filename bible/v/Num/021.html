yng[23] = "And Sihon hath not suffered Israel to pass through his border, and Sihon gathereth all his people, and cometh out to meet Israel into the wilderness, and cometh in to Jahaz, and fighteth against Israel.";
dby[23] = "But Sihon would not suffer Israel to go through his border; and Sihon gathered all his people, and went out against Israel into the wilderness, and came to Jahaz, and fought against Israel.";
web[23] = "And Sihon would not suffer Israel to pass through his border: but Sihon collected all his people, and went out against Israel into the wilderness: and he came to Jahaz, and fought against Israel:";
hnv[23] = "Sichon would not allow Yisra\'el to pass through his border: but Sichon gathered all his people together, and went out against Yisra\'el into the wilderness, and came to Yahatz; and he fought against Yisra\'el.";
vul[23] = "qui concedere noluit ut transiret Israhel per fines suos quin potius exercitu congregato egressus est obviam in desertum et venit in Iasa pugnavitque contra eum";
kjv[24] = "And Israel smote him with the edge of the sword, and possessed his land from Arnon unto Jabbok, even unto the children of Ammon: for the border of the children of Ammon [was] strong.";
rsv[24] = "And Israel slew him with the edge of the sword, and took possession of his land from the Arnon to the Jabbok, as far as to the Ammonites; for Jazer was the boundary of the Ammonites.";
asv[24] = "And Israel smote him with the edge of the sword, and possessed his land from the Arnon unto the Jabbok, even unto the children of Ammon; for the border of the children of Ammon was strong.";
yng[24] = "And Israel smiteth him by the mouth of the sword, and possesseth his land from Arnon unto Jabbok -- unto the sons of Ammon; for the border of the sons of Ammon [is] strong.";
dby[24] = "And Israel smote him with the edge of the sword, and took possession of his land from the Arnon to the Jabbok, even unto the children of Ammon; for the border of the children of Ammon was strong.";
web[24] = "And Israel smote him with the edge of the sword, and possessed his land from Arnon to Jabbok, even to the children of Ammon: for the border of the children of Ammon [was] strong.";
hnv[24] = "Yisra\'el struck him with the edge of the sword, and possessed his land from the Arnon to the Yabbok, even to the children of `Ammon; for the border of the children of `Ammon was strong.";
vul[24] = "a quo percussus est in ore gladii et possessa est terra eius ab Arnon usque Iebboc et filios Ammon quia forti praesidio tenebantur termini Ammanitarum";
kjv[25] = "And Israel took all these cities: and Israel dwelt in all the cities of the Amorites, in Heshbon, and in all the villages thereof.";
rsv[25] = "And Israel took all these cities, and Israel settled in all the cities of the Amorites, in Heshbon, and in all its villages.";
asv[25] = "And Israel took all these cities: and Israel dwelt in all the cities of the Amorites, in Heshbon, and in all the towns thereof.";
yng[25] = "And Israel taketh all these cities, and Israel dwelleth in all the cities of the Amorite, in Heshbon, and in all its villages;";
dby[25] = "And Israel took all these cities, and Israel dwelt in all the cities of the Amorites, at Heshbon, and in all its dependent villages.";
web[25] = "And Israel took all these cities: and Israel dwelt in all the cities of the Amorites, in Heshbon, and in all its villages.";
hnv[25] = "Yisra\'el took all these cities: and Yisra\'el lived in all the cities of the Amori, in Heshbon, and in all the towns of it.";
vul[25] = "tulit ergo Israhel omnes civitates eius et habitavit in urbibus Amorrei in Esebon scilicet et viculis eius";
kjv[26] = "For Heshbon [was] the city of Sihon the king of the Amorites, who had fought against the former king of Moab, and taken all his land out of his hand, even unto Arnon.";
rsv[26] = "For Heshbon was the city of Sihon the king of the Amorites, who had fought against the former king of Moab and taken all his land out of his hand, as far as the Arnon.";
asv[26] = "For Heshbon was the city of Sihon the king of the Amorites, who had fought against the former king of Moab, and taken all his land out of his hand, even unto the Arnon.";
yng[26] = "for Heshbon is a city of Sihon king of the Amorite, and he hath fought against the former king of Moab, and taketh all his land out of his hand, unto Arnon;";
dby[26] = "For Heshbon was the city of Sihon the king of the Amorites; and he had fought against the former king of Moab, and had taken all his land out of his hand, even unto the Arnon.";
web[26] = "For Heshbon [was] the city of Sihon the king of the Amorites, who had fought against the former king of Moab, and taken all his land out of his hand, even to Arnon.";
hnv[26] = "For Heshbon was the city of Sichon the king of the Amori, who had fought against the former king of Mo\'av, and taken all his land out of his hand, even to the Arnon.";
vul[26] = "urbs Esebon fuit regis Seon Amorrei qui pugnavit contra regem Moab et tulit omnem terram quae dicionis illius fuerat usque Arnon";
kjv[27] = "Wherefore they that speak in proverbs say, Come into Heshbon, let the city of Sihon be built and prepared:";
rsv[27] = "Therefore the ballad singers say, &quot;Come to Heshbon, let it be built, let the city of Sihon be established.";
asv[27] = "Wherefore they that speak in proverbs say, Come ye to Heshbon; Let the city of Sihon be built and established: ";
yng[27] = "therefore those using similes say -- `Enter ye Heshbon, Let the city of Sihon be built and ready,";
dby[27] = "Therefore the poets say, Come to Heshbon; let the city of Sihon be built and established.";
web[27] = "Wherefore they that speak in proverbs say, Come into Heshbon, let the city of Sihon be built and prepared.";
hnv[27] = " Therefore those who speak in proverbs say, Come you to Heshbon; Let the city of Sichon be built and established:";
vul[27] = "idcirco dicitur in proverbio venite in Esebon aedificetur et construatur civitas Seon";
kjv[28] = "For there is a fire gone out of Heshbon, a flame from the city of Sihon: it hath consumed Ar of Moab, [and] the lords of the high places of Arnon.";
rsv[28] = "For fire went forth from Heshbon, flame from the city of Sihon. It devoured Ar of Moab, the lords of the heights of the Arnon.";
asv[28] = "For a fire is gone out of Heshbon, A flame from the city of Sihon: It hath devoured Ar of Moab, The lords of the high places of the Arnon. ";
yng[28] = "For fire hath gone out from Heshbon, A flame from the city of Sihon, It hath consumed Ar of Moab, Owners of the high places of Arnon.";
dby[28] = "For there went forth fire from Heshbon, a flame from the city of Sihon; It consumed Ar of Moab, the lords of the high places of the Arnon.";
web[28] = "For there has a fire gone out of Heshbon, a flame from the city of Sihon: it hath consumed Ar of Moab, [and] the lords of the high places of Arnon.";
hnv[28] = "For a fire is gone out of Heshbon, A flame from the city of Sichon: It has devoured `Ar of Mo\'av, The lords of the high places of the Arnon.";
vul[28] = "ignis egressus est de Esebon flamma de oppido Seon et devoravit Ar Moabitarum et habitatores excelsorum Arnon";
kjv[29] = "Woe to thee, Moab! thou art undone, O people of Chemosh: he hath given his sons that escaped, and his daughters, into captivity unto Sihon king of the Amorites.";
rsv[29] = "Woe to you, O Moab! You are undone, O people of Chemosh! He has made his sons fugitives, and his daughters captives, to an Amorite king, Sihon.";
asv[29] = "Woe to thee, Moab! Thou art undone, O people of Chemosh: He hath given his sons as fugitives, And his daughters into captivity, Unto Sihon king of the Amorites. ";
yng[29] = "Wo to thee, O Moab, Thou hast perished, O people of Chemosh, He hath given his sons who escape -- Also his daughters -- Into captivity, to a king of the Amorite -- Sihon!";
dby[29] = "Woe to thee, Moab! thou art undone, people of Chemosh: He gave his sons that had escaped, and his daughters into captivity to Sihon the king of the Amorites.";
web[29] = "Woe to thee, Moab! thou art undone, O people of Chemosh: he hath given his sons that escaped, and his daughters, into captivity to Sihon king of the Amorites.";
hnv[29] = "Woe to you, Mo\'av! You are undone, people of Kemosh: He has given his sons as fugitives, His daughters into captivity, To Sichon king of the Amori.";
vul[29] = "vae tibi Moab peristi popule Chamos dedit filios eius in fugam et filias in captivitatem regi Amorreorum Seon";
kjv[30] = "We have shot at them; Heshbon is perished even unto Dibon, and we have laid them waste even unto Nophah, which [reacheth] unto Medeba.";
rsv[30] = "So their posterity perished from Heshbon, as far as Dibon, and we laid waste until fire spread to Med\'eba.&quot;";
asv[30] = "We have shot at them; Heshbon is perished even unto Dibon, And we have laid waste even unto Nophah, Which [reacheth] unto Medeba. ";
yng[30] = "And we shoot them, Perished hath Heshbon unto Dibon, And we make desolate unto Nophah, Which [is] unto Medeba.\'";
dby[30] = "And we have shot at them; Heshbon is perished even unto Dibon; and we have laid [them] waste even unto Nophah, which reacheth unto Medeba.";
web[30] = "We have shot at them; Heshbon has perished even to Dibon, and we have laid them waste even to Nophah, which [reacheth] to Medeba.";
hnv[30] = "We have shot at them; Heshbon is perished even to Divon, We have laid waste even to Nofach, Which [reaches] to Medeva.";
vul[30] = "iugum ipsorum disperiit ab Esebon usque Dibon lassi pervenerunt in Nophe et usque Medaba";
kjv[31] = "Thus Israel dwelt in the land of the Amorites.";
rsv[31] = "Thus Israel dwelt in the land of the Amorites.";
asv[31] = "Thus Israel dwelt in the land of the Amorites.";
yng[31] = "And Israel dwelleth in the land of the Amorite,";
dby[31] = "And Israel dwelt in the land of the Amorites.";
web[31] = "Thus Israel dwelt in the land of the Amorites.";
hnv[31] = "Thus Yisra\'el lived in the land of the Amori.";
vul[31] = "habitavit itaque Israhel in terra Amorrei";
kjv[32] = "And Moses sent to spy out Jaazer, and they took the villages thereof, and drove out the Amorites that [were] there.";
rsv[32] = "And Moses sent to spy out Jazer; and they took its villages, and dispossessed the Amorites that were there.";
asv[32] = "And Moses sent to spy out Jazer; and they took the towns thereof, and drove out the Amorites that were there.";
yng[32] = "and Moses sendeth to spy out Jaazer, and they capture its villages, and dispossess the Amorite who [is] there,";
dby[32] = "And Moses sent to spy out Jaazer, and they took its dependent villages, and he dispossessed the Amorites that were there.";
web[32] = "And Moses sent to explore Jaazer, and they took its villages, and drove out the Amorites that [were] there.";
hnv[32] = "Moshe sent to spy out Ya`zer; and they took the towns of it, and drove out the Amori who were there.";
vul[32] = "misitque Moses qui explorarent Iazer cuius ceperunt viculos et possederunt habitatores";
kjv[33] = "And they turned and went up by the way of Bashan: and Og the king of Bashan went out against them, he, and all his people, to the battle at Edrei.";
rsv[33] = "Then they turned and went up by the way to Bashan; and Og the king of Bashan came out against them, he and all his people, to battle at Ed\'re-i.";
asv[33] = "And they turned and went up by the way of Bashan: and Og the king of Bashan went out against them, he and all his people, to battle at Edrei.";
yng[33] = "and turn and go up the way of Bashan, and Og king of Bashan cometh out to meet them, he and all his people, to battle, [at] Edrei.";
dby[33] = "And they turned and went up by the way to Bashan; and Og the king of Bashan went out against them, he and all his people, for battle to Edrei.";
web[33] = "And they turned and went up by the way of Bashan: and Og the king of Bashan went out against them, he, and all his people, to the battle at Edrei.";
hnv[33] = "They turned and went up by the way of Bashan: and `Og the king of Bashan went out against them, he and all his people, to battle at Edre`i.";
vul[33] = "verteruntque se et ascenderunt per viam Basan et occurrit eis Og rex Basan cum omni populo suo pugnaturus in Edrai";
kjv[34] = "And the LORD said unto Moses, Fear him not: for I have delivered him into thy hand, and all his people, and his land; and thou shalt do to him as thou didst unto Sihon king of the Amorites, which dwelt at Heshbon.";
rsv[34] = "But the LORD said to Moses, &quot;Do not fear him; for I have given him into your hand, and all his people, and his land; and you shall do to him as you did to Sihon king of the Amorites, who dwelt at Heshbon.&quot;";
asv[34] = "And Jehovah said unto Moses, Fear him not: for I have delivered him into thy hand, and all his people, and his land; and thou shalt do to him as thou didst unto Sihon king of the Amorites, who dwelt at Heshbon.";
yng[34] = "And Jehovah saith unto Moses, `Fear him not, for into thy hand I have given him, and all his people, and his land, and thou hast done to him as thou hast done to Sihon king of the Amorite, who is dwelling in Heshbon.\'";
dby[34] = "And Jehovah said to Moses, Fear him not! for into thy hand have I given him, and all his people, and his land; and thou shalt do to him as thou didst unto Sihon the king of the Amorites, who dwelt at Heshbon.";
web[34] = "And the LORD said to Moses, Fear him not: for I have delivered him into thy hand, and all his people, and his land; and thou shalt do to him as thou didst to Sihon king of the Amorites, who dwelt at Heshbon.";
hnv[34] = "The LORD said to Moshe, Don\'t fear him: for I have delivered him into your hand, and all his people, and his land; and you shall do to him as you did to Sichon king of the Amori, who lived at Heshbon.";
vul[34] = "dixitque Dominus ad Mosen ne timeas eum quia in manu tua tradidi illum et omnem populum ac terram eius faciesque illi sicut fecisti Seon regi Amorreorum habitatori Esebon";
kjv[35] = "So they smote him, and his sons, and all his people, until there was none left him alive: and they possessed his land.";
rsv[35] = "So they slew him, and his sons, and all his people, until there was not one survivor left to him; and they possessed his land.";
asv[35] = "So they smote him, and his sons and all his people, until there was none left him remaining: and they possessed his land.";
yng[35] = "And they smite him, and his sons, and all his people, until he hath not left to him a remnant, and they possess his land.";
dby[35] = "And they smote him, and his sons, and all his people, so that they left him none remaining, and took possession of his land.";
web[35] = "So they smote him, and his sons, and all his people, until there was none left to him alive: and they possessed his land.";
hnv[35] = "So they struck him, and his sons and all his people, until there was none left him remaining: and they possessed his land.";
vul[35] = "percusserunt igitur et hunc cum filiis suis universumque populum eius usque ad internicionem et possederunt terram illius";
csb[1] = "When the Canaanite king of Arad, who lived in the Negev, heard that Israel was coming on the Atharim road, he fought against Israel and captured some prisoners.";
csb[2] = "Then Israel made a vow to the LORD, &quot;If you will hand this people over to us, we will completely destroy their cities.&quot;";
csb[3] = "The LORD listened to Israel\'s request and handed the Canaanites over to them, and Israel completely destroyed them and their cities. So they named the place Hormah.";
csb[4] = "Then they set out from Mount Hor by way of the Red Sea to bypass the land of Edom, but the people became impatient because of the journey.";
csb[5] = "The people spoke against God and Moses: &quot;Why have you led us up from Egypt to die in the wilderness? There is no bread or water, and we detest this wretched food! &quot;";
csb[6] = "Then the LORD sent poisonous snakes among the people, and they bit them so that many Israelites died.";
csb[7] = "The people then came to Moses and said, &quot;We have sinned by speaking against the LORD and against you. Intercede with the LORD so that he will take the snakes away from us.&quot; And Moses interceded for the people.";
csb[8] = "Then the LORD said to Moses, &quot;Make a snake image and mount it on a pole. When anyone who is bitten looks at it, he will recover.&quot;";
csb[9] = "So Moses made a bronze snake and mounted it on a pole. Whenever someone was bitten, and he looked at the bronze snake, he recovered.";
csb[10] = "The Israelites set out and camped at Oboth.";
csb[11] = "They set out from Oboth and camped at Iye-abarim in the wilderness that borders Moab on the east.";
csb[12] = "From there they went and camped at Zered Valley.";
csb[13] = "They set out from there and camped on the other side of the Arnon River, in the wilderness that extends from the Amorite border, because the Arnon was the Moabite border between Moab and the Amorites.";
csb[14] = "Therefore it is stated in the Book of the LORD\'s Wars: Waheb in Suphah and the ravines of the Arnon,";
csb[15] = "even the slopes of the ravines that extend to the site of Ar and lie along the border of Moab.";
csb[16] = "From there they went to Beer, the well the LORD told Moses about, &quot;Gather the people so I may give them water.&quot;";
csb[17] = "Then Israel sang this song: Spring up, well -- sing to it!";
csb[18] = "The princes dug the well; the nobles of the people hollowed it out with a scepter and with their staffs. They went from the wilderness to Mattanah,";
csb[19] = "from Mattanah to Nahaliel, from Nahaliel to Bamoth,";
csb[20] = "from Bamoth to the valley in the territory of Moab near the Pisgah highlands that overlook the wasteland.";
csb[21] = "Israel sent messengers to say to King Sihon of the Amorites:";
csb[22] = "&quot;Let us travel through your land. We won\'t go into the fields or vineyards. We won\'t drink any well water. We will travel the King\'s Highway until we have traveled through your territory.&quot;";
csb[23] = "But Sihon would not let Israel travel through his territory. Instead, he gathered his whole army and went out to confront Israel in the wilderness. When he came to Jahaz, he fought against Israel.";
csb[24] = "Israel struck him with the sword and took possession of his land from the Arnon to the Jabbok, but only up to the Ammonite border, because it was fortified.";
csb[25] = "Israel took all the cities and lived in all these Amorite cities, including Heshbon and all its surrounding villages.";
csb[26] = "Heshbon was the city of King Sihon of the Amorites, who had fought against the former king of Moab and had taken control of all his land as far as the Arnon.";
csb[27] = "Therefore the poets say: Come to Heshbon, let it be rebuilt; let the city of Sihon be restored.";
csb[28] = "For fire came out of Heshbon, a flame from the city of Sihon. It consumed Ar of Moab, the citizens of Arnon\'s heights.";
csb[29] = "Woe to you, Moab! You have been destroyed, people of Chemosh! He gave up his sons as refugees, and his daughters into captivity to Sihon the Amorite king.";
csb[30] = "We threw them down; Heshbon has been destroyed as far as Dibon. We caused desolation as far as Nophah, which reaches as far as Medeba.";
csb[31] = "So Israel lived in the Amorites\' land.";
csb[32] = "After Moses sent spies to Jazer, Israel captured its surrounding villages and drove out the Amorites who were there.";
csb[33] = "Then they turned and went up the road to Bashan, and King Og of Bashan came out against them with his whole army to do battle at Edrei.";
csb[34] = "But the LORD said to Moses, &quot;Do not fear him, for I have handed him over to you along with his whole army and his land. Do to him as you did to King Sihon of the Amorites, who lived in Heshbon.&quot;";
csb[35] = "So they struck him, his sons, and his whole army until no one was left, and they took possession of his land.";
