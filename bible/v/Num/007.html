csb[1] = "On the day Moses finished setting up the tabernacle, he anointed and consecrated it and all its furnishings, along with the altar and all its utensils. After he anointed and consecrated these things,";
csb[2] = "the leaders of Israel, the heads of their ancestral families, presented an offering. They were the tribal leaders who supervised the registration.";
csb[3] = "They brought as their offering before the LORD six covered carts and twelve oxen, a cart from every two leaders and an ox from each one, and presented them in front of the tabernacle.";
csb[4] = "The LORD said to Moses,";
csb[5] = "&quot;Accept these from them to be used in the work of the tent of meeting, and give this offering to the Levites, to each division according to their service.&quot;";
csb[6] = "So Moses took the carts and oxen and gave them to the Levites.";
csb[7] = "He gave the Gershonites two carts and four oxen corresponding to their service,";
csb[8] = "and gave the Merarites four carts and eight oxen corresponding to their service, under the direction of Ithamar son of Aaron the priest.";
csb[9] = "But he did not give any to the Kohathites, since their responsibility was service related to the holy objects carried on their shoulders.";
csb[10] = "The leaders also presented the dedication gift for the altar when it was anointed. The leaders presented their offerings in front of the altar.";
csb[11] = "The LORD told Moses, &quot;Each day have one leader present his offering for the dedication of the altar.&quot;";
