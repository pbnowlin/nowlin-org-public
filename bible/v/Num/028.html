yng[23] = "`Apart from the burnt-offering of the morning, which [is] for the continual burnt-offering, ye prepare these;";
dby[23] = "Besides the burnt-offering of the morning, which is for a continual burnt-offering, shall ye offer this.";
web[23] = "Ye shall offer these besides the burnt-offering in the morning, which [is] for a continual burnt-offering.";
hnv[23] = "You shall offer these besides the burnt offering of the morning, which is for a continual burnt offering.";
vul[23] = "praeter holocaustum matutinum quod semper offertis";
rsv[24] = "In the same way you shall offer daily, for seven days, the food of an offering by fire, a pleasing odor to the LORD; it shall be offered besides the continual burnt offering and its drink offering.";
asv[24] = "After this manner ye shall offer daily, for seven days, the food of the offering made by fire, of a sweet savor unto Jehovah: it shall be offered besides the continual burnt-offering, and the drink-offering thereof.";
yng[24] = "according to these ye prepare daily, seven days, bread of a fire-offering, a sweet fragrance, to Jehovah; besides the continual burnt-offering it is prepared, and its libation;";
dby[24] = "After this manner ye shall offer daily, seven days, the bread of the offering by fire of a sweet odour to Jehovah; it shall be offered besides the continual burnt-offering, and its drink-offering.";
web[24] = "After this manner ye shall offer daily throughout the seven days, the food of the sacrifice made by fire, of a sweet savor to the LORD: it shall be offered besides the continual burnt-offering, and his drink-offering.";
hnv[24] = "After this manner you shall offer daily, for seven days, the food of the offering made by fire, of a sweet savor to the LORD: it shall be offered besides the continual burnt offering, and the drink-offering of it.";
vul[24] = "ita facietis per singulos dies septem dierum in fomitem ignis et in odorem suavissimum Domino qui surget de holocausto et de libationibus singulorum";
rsv[25] = "And on the seventh day you shall have a holy convocation; you shall do no laborious work.";
asv[25] = "And on the seventh day ye shall have a holy convocation; ye shall do no servile work.";
yng[25] = "and on the seventh day a holy convocation ye have, ye do no servile work.";
dby[25] = "And on the seventh day ye shall have a holy convocation; no manner of servile work shall ye do.";
web[25] = "And on the seventh day ye shall have a holy convocation; ye shall do no servile work.";
hnv[25] = "On the seventh day you shall have a holy convocation: you shall do no servile work.";
vul[25] = "dies quoque septimus celeberrimus et sanctus erit vobis omne opus servile non facietis in eo";
rsv[26] = "&quot;On the day of the first fruits, when you offer a cereal offering of new grain to the LORD at your feast of weeks, you shall have a holy convocation; you shall do no laborious work,";
asv[26] = "Also in the day of the first-fruits, when ye offer a new meal-offering unto Jehovah in your [feast of] weeks, ye shall have a holy convocation; ye shall do no servile work;";
yng[26] = "`And in the day of the first-fruits, in your bringing near a new present to Jehovah, in your weeks, a holy convocation ye have; ye do no servile work;";
dby[26] = "And on the day of the first-fruits, when ye present a new oblation to Jehovah, after your weeks, ye shall have a holy convocation: no manner of servile work shall ye do.";
web[26] = "Also in the day of the first-fruits, when ye bring a new meat-offering to the LORD, after your weeks [are ended], ye shall have a holy convocation; ye shall do no servile work:";
hnv[26] = "Also in the day of the first fruits, when you offer a new meal-offering to the LORD in your [feast of] weeks, you shall have a holy convocation; you shall do no servile work;";
vul[26] = "dies etiam primitivorum quando offertis novas fruges Domino expletis ebdomadibus venerabilis et sancta erit omne opus servile non facietis in ea";
rsv[27] = "but offer a burnt offering, a pleasing odor to the LORD; two young bulls, one ram, seven male lambs a year old;";
asv[27] = "but ye shall offer a burnt-offering for a sweet savor unto Jehovah: two young bullocks, one ram, seven he-lambs a year old;";
yng[27] = "and ye have brought near a burnt-offering for sweet fragrance to Jehovah: two bullocks, sons of the herd, one ram, seven lambs, sons of a year,";
dby[27] = "And ye shall present a burnt-offering for a sweet odour to Jehovah: two young bullocks, one ram, seven yearling lambs;";
web[27] = "But ye shall offer the burnt-offering for a sweet savor to the LORD; two young bullocks, one ram, seven lambs of the first year;";
hnv[27] = "but you shall offer a burnt offering for a sweet savor to the LORD: two young bulls, one ram, seven he-lambs a year old;";
vul[27] = "offeretisque holocaustum in odorem suavissimum Domino vitulos de armento duos arietem unum et agnos anniculos inmaculatos septem";

hnv[28] = "and their meal-offering, fine flour mixed with oil, three tenth parts for each bull, two tenth parts for the one ram,";

rsv[31] = "Besides the continual burnt offering and its cereal offering, you shall offer them and their drink offering. See that they are without blemish.";
asv[31] = "Besides the continual burnt-offering, and the meal-offering thereof, ye shall offer them (they shall be unto you without blemish), and their drink-offerings.";
yng[31] = "apart from the continual burnt-offering and its present ye prepare [them] (perfect ones they are for you) and their libations.";
dby[31] = "Ye shall offer them besides the continual burnt-offering, and its oblation (without blemish shall they be unto you), and their drink-offerings.";
web[31] = "Ye shall offer [them] besides the continual burnt-offering and his meat-offering (they shall be to you without blemish) and their drink-offerings.";
hnv[31] = "Besides the continual burnt offering, and the meal-offering of it, you shall offer them (they shall be to you without blemish), and their drink-offerings.";

csb[1] = "The LORD spoke to Moses,";
csb[2] = "&quot;Command the Israelites and say to them: Be sure to present to me at its appointed time my offering and my food as my fire offering, a pleasing aroma to me.";
csb[3] = "&quot;And say to them: This is the fire offering you are to present to the LORD: &quot;Each day present two unblemished year-old male lambs as a regular burnt offering.";
csb[4] = "&quot;Offer one lamb in the morning and the other lamb at twilight,";
csb[5] = "&quot;along with two quarts of fine flour for a grain offering mixed with a quart of olive oil from crushed olives.";
csb[6] = "&quot;It is a regular burnt offering established at Mount Sinai for a pleasing aroma, a fire offering to the LORD.";
csb[7] = "&quot;The drink offering is to be a quart with each lamb. Pour out the offering of beer to the LORD in the sanctuary area.";
csb[8] = "&quot;Offer the second lamb at twilight, along with the same kind of grain offering and drink offering as in the morning. It is a fire offering, a pleasing aroma to the LORD.";
csb[9] = "&quot;On the Sabbath day present two unblemished year-old male lambs, four quarts of fine flour mixed with oil as a grain offering, and its drink offering.";
csb[10] = "&quot;It is the burnt offering for every Sabbath, in addition to the regular burnt offering and its drink offering.";
csb[11] = "&quot;At the beginning of each of your months present a burnt offering to the LORD: two young bulls, one ram, seven male lambs a year old -- all unblemished --";
csb[12] = "&quot;with six quarts of fine flour mixed with oil as a grain offering for each bull, four quarts of fine flour mixed with oil as a grain offering for the ram,";
csb[13] = "&quot;and two quarts of fine flour mixed with oil as a grain offering for each lamb. It is a burnt offering, a pleasing aroma, a fire offering to the LORD.";
csb[14] = "&quot;Their drink offerings are to be two quarts of wine with each bull, one and a third quarts with the ram, and one quart with each male lamb. This is the monthly burnt offering for all the months of the year.";
csb[15] = "&quot;And one male goat is to be offered as a sin offering to the LORD, in addition to the regular burnt offering with its drink offering.";
csb[16] = "&quot;The Passover to the LORD comes in the first month, on the fourteenth day of the month.";
csb[17] = "&quot;On the fifteenth day of this month there will be a festival; unleavened bread is to be eaten for seven days.";
csb[18] = "&quot;On the first day there is to be a sacred assembly; you are not to do any daily work.";
csb[19] = "&quot;Present a fire offering, a burnt offering to the LORD: two young bulls, one ram, and seven male lambs a year old. Your animals are to be unblemished.";
csb[20] = "&quot;The grain offering with them is to be of fine flour mixed with oil; offer six quarts with each bull and four quarts with the ram.";
csb[21] = "&quot;Offer two quarts with each of the seven lambs";
csb[22] = "&quot;and one male goat for a sin offering to make atonement for yourselves.";
csb[23] = "&quot;Offer these with the morning burnt offering that is part of the regular burnt offering.";
csb[24] = "&quot;You are to offer the same food each day for seven days as a fire offering, a pleasing aroma to the LORD. It is to be offered with its drink offering and the regular burnt offering.";
csb[25] = "&quot;On the seventh day you are to hold a sacred assembly; you are not to do any daily work.";
csb[26] = "&quot;On the day of firstfruits, you are to hold a sacred assembly when you present an offering of new grain to the LORD at your Festival of Weeks; you are not to do any daily work.";
csb[27] = "&quot;Present a burnt offering for a pleasing aroma to the LORD: two young bulls, one ram, and seven male lambs a year old,";
csb[28] = "&quot;with their grain offering of fine flour mixed with oil, six quarts with each bull, four quarts with the ram,";
csb[29] = "&quot;and two quarts with each of the seven lambs,";
csb[30] = "&quot;and one male goat to make atonement for yourselves.";
csb[31] = "&quot;Offer them with their drink offerings in addition to the regular burnt offering and its grain offering. Your animals are to be unblemished.";
