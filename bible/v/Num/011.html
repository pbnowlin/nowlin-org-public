kjv[1] = "And [when] the people complained, it displeased the LORD: and the LORD heard [it]; and his anger was kindled; and the fire of the LORD burnt among them, and consumed [them that were] in the uttermost parts of the camp.";
kjv[2] = "And the people cried unto Moses; and when Moses prayed unto the LORD, the fire was quenched.";
kjv[3] = "And he called the name of the place Taberah: because the fire of the LORD burnt among them.";
kjv[4] = "And the mixt multitude that [was] among them fell a lusting: and the children of Israel also wept again, and said, Who shall give us flesh to eat?";

kjv[9] = "And when the dew fell upon the camp in the night, the manna fell upon it.";
kjv[10] = "Then Moses heard the people weep throughout their families, every man in the door of his tent: and the anger of the LORD was kindled greatly; Moses also was displeased.";
kjv[11] = "And Moses said unto the LORD, Wherefore hast thou afflicted thy servant? and wherefore have I not found favour in thy sight, that thou layest the burden of all this people upon me?";
kjv[12] = "Have I conceived all this people? have I begotten them, that thou shouldest say unto me, Carry them in thy bosom, as a nursing father beareth the sucking child, unto the land which thou swarest unto their fathers?";
kjv[13] = "Whence should I have flesh to give unto all this people? for they weep unto me, saying, Give us flesh, that we may eat.";
kjv[14] = "I am not able to bear all this people alone, because [it is] too heavy for me.";
kjv[15] = "And if thou deal thus with me, kill me, I pray thee, out of hand, if I have found favour in thy sight; and let me not see my wretchedness.";
kjv[16] = "And the LORD said unto Moses, Gather unto me seventy men of the elders of Israel, whom thou knowest to be the elders of the people, and officers over them; and bring them unto the tabernacle of the congregation, that they may stand there with thee.";
kjv[17] = "And I will come down and talk with thee there: and I will take of the spirit which [is] upon thee, and will put [it] upon them; and they shall bear the burden of the people with thee, that thou bear [it] not thyself alone.";
kjv[18] = "And say thou unto the people, Sanctify yourselves against to morrow, and ye shall eat flesh: for ye have wept in the ears of the LORD, saying, Who shall give us flesh to eat? for [it was] well with us in Egypt: therefore the LORD will give you flesh, and ye shall eat.";
kjv[19] = "Ye shall not eat one day, nor two days, nor five days, neither ten days, nor twenty days;";
kjv[20] = "[But] even a whole month, until it come out at your nostrils, and it be loathsome unto you: because that ye have despised the LORD which [is] among you, and have wept before him, saying, Why came we forth out of Egypt?";
kjv[21] = "And Moses said, The people, among whom I [am], [are] six hundred thousand footmen; and thou hast said, I will give them flesh, that they may eat a whole month.";
kjv[22] = "Shall the flocks and the herds be slain for them, to suffice them? or shall all the fish of the sea be gathered together for them, to suffice them?";
kjv[23] = "And the LORD said unto Moses, Is the LORD\'S hand waxed short? thou shalt see now whether my word shall come to pass unto thee or not.";
kjv[24] = "And Moses went out, and told the people the words of the LORD, and gathered the seventy men of the elders of the people, and set them round about the tabernacle.";
kjv[25] = "And the LORD came down in a cloud, and spake unto him, and took of the spirit that [was] upon him, and gave [it] unto the seventy elders: and it came to pass, [that], when the spirit rested upon them, they prophesied, and did not cease.";
kjv[26] = "But there remained two [of the] men in the camp, the name of the one [was] Eldad, and the name of the other Medad: and the spirit rested upon them; and they [were] of them that were written, but went not out unto the tabernacle: and they prophesied in the camp.";
kjv[27] = "And there ran a young man, and told Moses, and said, Eldad and Medad do prophesy in the camp.";
kjv[28] = "And Joshua the son of Nun, the servant of Moses, [one] of his young men, answered and said, My lord Moses, forbid them.";
kjv[29] = "And Moses said unto him, Enviest thou for my sake? would God that all the LORD\'S people were prophets, [and] that the LORD would put his spirit upon them!";
kjv[30] = "And Moses gat him into the camp, he and the elders of Israel.";
kjv[31] = "And there went forth a wind from the LORD, and brought quails from the sea, and let [them] fall by the camp, as it were a day\'s journey on this side, and as it were a day\'s journey on the other side, round about the camp, and as it were two cubits [high] upon the face of the earth.";
kjv[32] = "And the people stood up all that day, and all [that] night, and all the next day, and they gathered the quails: he that gathered least gathered ten homers: and they spread [them] all abroad for themselves round about the camp.";
kjv[33] = "And while the flesh [was] yet between their teeth, ere it was chewed, the wrath of the LORD was kindled against the people, and the LORD smote the people with a very great plague.";
kjv[34] = "And he called the name of that place Kibrothhattaavah: because there they buried the people that lusted.";
kjv[35] = "[And] the people journeyed from Kibrothhattaavah unto Hazeroth; and abode at Hazeroth.";

rsv[20] = "but a whole month, until it comes out at your nostrils and becomes loathsome to you, because you have rejected the LORD who is among you, and have wept before him, saying, &quot;Why did we come forth out of Egypt?&quot;\'&quot;";
asv[20] = "but a whole month, until it come out at your nostrils, and it be loathsome unto you; because that ye have rejected Jehovah who is among you, and have wept before him, saying, Why came we forth out of Egypt?";
yng[20] = "unto a month of days, till that it come out from your nostrils, and it hath become to you an abomination; because that ye have loathed Jehovah, who [is] in your midst, and weep before Him, saying, Why is this? -- we have come out of Egypt!\'";
dby[20] = "[but] for a whole month, until it come out at your nostrils, and it become loathsome unto you; because that ye have despised Jehovah who is among you, and have wept before him, saying, Why came we forth out of Egypt?";
web[20] = "[But] even a whole month, until it shall come out at your nostrils, and it be lothsome to you; because ye have despised the LORD who [is] among you, and have wept before him, saying, Why came we forth out of Egypt?";
hnv[20] = "but a whole month, until it come out at your nostrils, and it be loathsome to you; because that you have rejected the LORD who is among you, and have wept before him, saying, Why came we forth out of Mitzrayim?";
vul[20] = "sed usque ad mensem dierum donec exeat per nares vestras et vertatur in nausiam eo quod reppuleritis Dominum qui in medio vestri est et fleveritis coram eo dicentes quare egressi sumus ex Aegypto";
rsv[21] = "But Moses said, &quot;The people among whom I am number six hundred thousand on foot; and thou hast said, \'I will give them meat, that they may eat a whole month!\'";
asv[21] = "And Moses said, The people, among whom I am, are six hundred thousand footmen; and thou hast said, I will give them flesh, that they may eat a whole month.";
yng[21] = "And Moses saith, `Six hundred thousand footmen [are] the people in whose midst I [am]; and Thou, Thou hast said, Flesh I give to them, and they have eaten, a month of days!";
dby[21] = "And Moses said, The people in whose midst I am are six hundred thousand footmen; and thou sayest, I will give them flesh that they may eat a whole month.";
web[21] = "And Moses said, The people among whom I [am], [are] six hundred thousand footmen; and thou hast said, I will give them flesh, that they may eat a whole month.";
hnv[21] = "Moshe said, The people, among whom I am, are six hundred thousand footmen; and you have said, I will give them flesh, that they may eat a whole month.";
vul[21] = "et ait Moses sescenta milia peditum huius populi sunt et tu dicis dabo eis esum carnium mense integro";
rsv[22] = "Shall flocks and herds be slaughtered for them, to suffice them? Or shall all the fish of the sea be gathered together for them, to suffice them?&quot;";
asv[22] = "Shall flocks and herds be slain for them, to suffice them? or shall all the fish of the sea be gathered together for them, to suffice them?";
yng[22] = "Is flock and herd slaughtered for them, that one hath found for them? -- are all the fishes of the sea gathered for them -- that one hath found for them?\'";
dby[22] = "Shall flocks and herds be slaughtered for them, to suffice them? or shall all the fish of the sea be gathered for them, to suffice them?";
web[22] = "Shall the flocks and the herds be slain for them, to suffice for them? or shall all the fish of the sea be gathered for them, to suffice for them?";
hnv[22] = "Shall flocks and herds be slain for them, to suffice them? or shall all the fish of the sea be gathered together for them, to suffice them?";
vul[22] = "numquid ovium et boum multitudo caedetur ut possit sufficere ad cibum vel omnes pisces maris in unum congregabuntur ut eos satient";
rsv[23] = "And the LORD said to Moses, &quot;Is the LORD\'s hand shortened? Now you shall see whether my word will come true for you or not.&quot;";
asv[23] = "And Jehovah said unto Moses, Is Jehovah\'s hand waxed short? now shalt thou see whether my word shall come to pass unto thee or not.";
yng[23] = "And Jehovah saith unto Moses, `Is the hand of Jehovah become short? now thou dost see whether My word meeteth thee or not.\'";
dby[23] = "And Jehovah said to Moses, Hath Jehovah\'s hand become short? Now shalt thou see whether my word will come to pass unto thee or not.";
web[23] = "And the LORD said to Moses, Is the LORD\'S hand shortened? thou shalt see now whether my word shall come to pass to thee, or not.";
hnv[23] = "The LORD said to Moshe, Has the LORD\'s hand grown short? now shall you see whether my word shall happen to you or not.";
vul[23] = "cui respondit Dominus numquid manus Domini invalida est iam nunc videbis utrum meus sermo opere conpleatur";
rsv[24] = "So Moses went out and told the people the words of the LORD; and he gathered seventy men of the elders of the people, and placed them round about the tent.";
asv[24] = "And Moses went out, and told the people the words of Jehovah: and he gathered seventy men of the elders of the people, and set them round about the Tent.";
yng[24] = "And Moses goeth out, and speaketh unto the people the words of Jehovah, and gathereth seventy men of the elders of the people, and causeth them to stand round about the tent,";
dby[24] = "And Moses went out and told the people the words of Jehovah; and he gathered the seventy men of the elders of the people, and set them round about the tent.";
web[24] = "And Moses went out, and told the people the words of the LORD, and gathered the seventy men of the elders of the people, and set them around the tabernacle.";
hnv[24] = "Moshe went out, and told the people the words of the LORD: and he gathered seventy men of the Zakenim of the people, and set them round about the Tent.";
vul[24] = "venit igitur Moses et narravit populo verba Domini congregans septuaginta viros de senibus Israhel quos stare fecit circa tabernaculum";
rsv[25] = "Then the LORD came down in the cloud and spoke to him, and took some of the spirit that was upon him and put it upon the seventy elders; and when the spirit rested upon them, they prophesied. But they did so no more.";
asv[25] = "And Jehovah came down in the cloud, and spake unto him, and took of the Spirit that was upon him, and put it upon the seventy elders: and it came to pass, that, when the Spirit rested upon them, they prophesied, but they did so no more.";
yng[25] = "and Jehovah cometh down in the cloud, and speaketh unto him, and keepeth back of the Spirit which [is] on him, and putteth on the seventy men of the elders; and it cometh to pass at the resting of the Spirit on them, that they prophesy, and do not cease.";
dby[25] = "And Jehovah came down in a cloud, and spoke to him, and took of the Spirit that was upon him, and put it upon the seventy men, the elders; and it came to pass, that when the Spirit rested on them, they prophesied, but they did not repeat [it].";
web[25] = "And the LORD came down in a cloud, and spoke to him, and took of the spirit that [was] upon him, and gave [it] to the seventy elders: and it came to pass, [that] when the spirit rested upon them; they prophesied, and did not cease.";
hnv[25] = "The LORD came down in the cloud, and spoke to him, and took of the Spirit that was on him, and put it on the seventy Zakenim: and it happened that when the Spirit rested on them, they prophesied, but they did so no more.";
vul[25] = "descenditque Dominus per nubem et locutus est ad eum auferens de spiritu qui erat in Mosen et dans septuaginta viris cumque requievisset in eis spiritus prophetaverunt nec ultra cessarunt";
rsv[26] = "Now two men remained in the camp, one named Eldad, and the other named Medad, and the spirit rested upon them; they were among those registered, but they had not gone out to the tent, and so they prophesied in the camp.";
asv[26] = "But there remained two men in the camp, the name of the one was Eldad, and the name of the other Medad: and the Spirit rested upon them; and they were of them that were written, but had not gone out unto the Tent; and they prophesied in the camp.";
yng[26] = "And two of the men are left in the camp, the name of the one [is] Eldad, and the name of the second Medad, and the spirit resteth upon them, (and they are among those written, and have not gone out to the tent), and they prophesy in the camp;";
dby[26] = "And two men remained in the camp, the name of the one, Eldad, and the name of the other, Medad; and the Spirit rested upon them (and they were among them that were written, but they had not gone out to the tent); and they prophesied in the camp.";
web[26] = "But there remained two [of the] men in the camp, the name of the one [was] Eldad, and the name of the other Medad: and the spirit rested upon them, and they [were] of them that were described, but went not out to the tabernacle: and they prophesied in the camp.";
hnv[26] = "But there remained two men in the camp, the name of the one was Eldad, and the name of the other Medad: and the Spirit rested on them; and they were of those who were written, but had not gone out to the Tent; and they prophesied in the camp.";
vul[26] = "remanserant autem in castris duo viri quorum unus vocabatur Heldad et alter Medad super quos requievit spiritus nam et ipsi descripti fuerant et non exierant ad tabernaculum";
rsv[27] = "And a young man ran and told Moses, &quot;Eldad and Medad are prophesying in the camp.&quot;";
asv[27] = "And there ran a young man, and told Moses, and said, Eldad and Medad do prophesy in the camp.";
yng[27] = "and the young man runneth, and declareth to Moses, and saith, `Eldad and Medad are prophesying in the camp.\'";
dby[27] = "And there ran a youth, and told Moses, and said, Eldad and Medad are prophesying in the camp.";
web[27] = "And there ran a young man, and told Moses, and said, Eldad and Medad do prophesy in the camp.";
hnv[27] = "There ran a young man, and told Moshe, and said, Eldad and Medad do prophesy in the camp.";
vul[27] = "cumque prophetarent in castris cucurrit puer et nuntiavit Mosi dicens Heldad et Medad prophetant in castris";
rsv[28] = "And Joshua the son of Nun, the minister of Moses, one of his chosen men, said, &quot;My lord Moses, forbid them.&quot;";
asv[28] = "And Joshua the son of Nun, the minister of Moses, one of his chosen men, answered and said, My lord Moses, forbid them.";
yng[28] = "And Joshua son of Nun, minister of Moses, [one] of his young men, answereth and saith, `My lord Moses, restrain them.\'";
dby[28] = "And Joshua the son of Nun, the attendant of Moses, one of his young men, answered and said, My lord Moses, forbid them!";
web[28] = "And Joshua the son of Nun, the servant of Moses, [one] of his young men, answered and said, My lord, Moses, forbid them.";
hnv[28] = "Yehoshua the son of Nun, the minister of Moshe, one of his chosen men, answered, My lord Moshe, forbid them.";
vul[28] = "statim Iosue filius Nun minister Mosi et electus e pluribus ait domine mi Moses prohibe eos";
rsv[29] = "But Moses said to him, &quot;Are you jealous for my sake? Would that all the LORD\'s people were prophets, that the LORD would put his spirit upon them!&quot;";
asv[29] = "And Moses said unto him, Art thou jealous for my sake? would that all Jehovah\'s people were prophets, that Jehovah would put his Spirit upon them!";
yng[29] = "And Moses saith to him, `Art thou zealous for me? O that all Jehovah\'s people were prophets! that Jehovah would put His Spirit upon them!\'";
dby[29] = "But Moses said to him, Enviest thou for my sake? would that all Jehovah\'s people were prophets, [and] that Jehovah would put his Spirit upon them!";
web[29] = "And Moses said to him, Enviest thou for my sake? I would that all the LORD\'S people were prophets, [and] that the LORD would put his spirit upon them.";
hnv[29] = " Moshe said to him, Are you jealous for my sake? would that all the LORD\'s people were prophets, that the LORD would put his Spirit on them!";
vul[29] = "at ille quid inquit aemularis pro me quis tribuat ut omnis populus prophetet et det eis Dominus spiritum suum";
rsv[30] = "And Moses and the elders of Israel returned to the camp.";
asv[30] = "And Moses gat him into the camp, he and the elders of Israel.";
yng[30] = "And Moses is gathered unto the camp, he and the elders of Israel.";
dby[30] = "And Moses withdrew into the camp, he and the elders of Israel.";
web[30] = "And Moses withdrew into the camp, he and the elders of Israel.";
hnv[30] = "Moshe got him into the camp, he and the Zakenim of Yisra\'el.";
vul[30] = "reversusque est Moses et maiores natu Israhel in castra";
rsv[31] = "And there went forth a wind from the LORD, and it brought quails from the sea, and let them fall beside the camp, about a day\'s journey on this side and a day\'s journey on the other side, round about the camp, and about two cubits above the face of the earth.";
asv[31] = "And there went forth a wind from Jehovah, and brought quails from the sea, and let them fall by the camp, about a day\'s journey on this side, and a day\'s journey on the other side, round about the camp, and about two cubits above the face of the earth.";
yng[31] = "And a spirit hath journeyed from Jehovah, and cutteth off quails from the sea, and leaveth by the camp, as a day\'s journey here, and as a day\'s journey there, round about the camp, and about two cubits, on the face of the land.";
dby[31] = "And there went forth a wind from Jehovah, and drove quails from the sea, and cast them about the camp, about a day\'s journey on this side, and about a day\'s journey on the other side, round about the camp, and about two cubits above the earth.";
web[31] = "And there went forth a wind from the LORD, and brought quails from the sea, and let [them] fall by the camp, as it were a day\'s journey on this side, and as it were a day\'s journey on the other side, around the camp, and as it were two cubits [high] upon the face of the earth.";
hnv[31] = "There went forth a wind from the LORD, and brought quails from the sea, and let them fall by the camp, about a day\'s journey on this side, and a day\'s journey on the other side, round about the camp, and about two cubits above the surface of the eretz.";
vul[31] = "ventus autem egrediens a Domino arreptas trans mare coturnices detulit et dimisit in castra itinere quantum uno die confici potest ex omni parte castrorum per circuitum volabantque in aere duobus cubitis altitudine super terram";
rsv[32] = "And the people rose all that day, and all night, and all the next day, and gathered the quails; he who gathered least gathered ten homers; and they spread them out for themselves all around the camp.";
asv[32] = "And the people rose up all that day, and all the night, and all the next day, and gathered the quails: he that gathered least gathered ten homers: and they spread them all abroad for themselves round about the camp.";
yng[32] = "And the people rise all that day, and all the night, and all the day after, and gather the quails -- he who hath least hath gathered ten homers -- and they spread them out for themselves round about the camp.";
dby[32] = "And the people rose up all that day, and the whole night, and all the next day, and they gathered the quails: he that gathered little gathered ten homers; and they spread them abroad for themselves round about the camp.";
web[32] = "And the people stood up all that day, and all [that] night, and all the next day, and they gathered the quails: he that gathered least gathered ten homers: and they spread [them] all abroad for themselves around the camp.";
hnv[32] = "The people rose up all that day, and all the night, and all the next day, and gathered the quails: he who gathered least gathered ten homers: and they spread them all abroad for themselves round about the camp.";
vul[32] = "surgens ergo populus toto die illo et nocte ac die altero congregavit coturnicum qui parum decem choros et siccaverunt eas per gyrum castrorum";
rsv[33] = "While the meat was yet between their teeth, before it was consumed, the anger of the LORD was kindled against the people, and the LORD smote the people with a very great plague.";
asv[33] = "While the flesh was yet between their teeth, ere it was chewed, the anger of Jehovah was kindled against the people, and Jehovah smote the people with a very great plague.";
yng[33] = "The flesh is yet between their teeth -- it is not yet cut off -- and the anger of Jehovah hath burned among the people, and Jehovah smiteth among the people -- a very great smiting;";
dby[33] = "The flesh was yet between their teeth, before it was chewed, when the wrath of Jehovah was kindled against the people, and Jehovah smote the people with a very great plague.";
web[33] = "And while the flesh [was] yet between their teeth, ere it was chewed, the wrath of the LORD was kindled against the people, and the LORD smote the people with a very great plague.";
hnv[33] = "While the flesh was yet between their teeth, before it was chewed, the anger of the LORD was kindled against the people, and the LORD struck the people with a very great plague.";
vul[33] = "adhuc carnes erant in dentibus eorum nec defecerat huiuscemodi cibus et ecce furor Domini concitatus in populum percussit eum plaga magna nimis";
rsv[34] = "Therefore the name of that place was called Kib\'roth-hatta\'avah, because there they buried the people who had the craving.";
asv[34] = "And the name of that place was called Kibroth-hattaavah, because there they buried the people that lusted.";
yng[34] = "and [one] calleth the name of that place Kibroth-Hattaavah, for there they have buried the people who lust.";
dby[34] = "And they called the name of that place Kibroth-hattaavah; because there they buried the people who lusted.";
web[34] = "And he called the name of that place Kibroth-hattaavah: because there they buried the people that lusted.";
hnv[34] = "The name of that place was called Kivrot-Hatta\'avah, because there they buried the people who lusted.";
vul[34] = "vocatusque est ille locus sepulchra Concupiscentiae ibi enim sepelierunt populum qui desideraverat egressi autem de sepulchris Concupiscentiae venerunt in Aseroth et manserunt ibi";
rsv[35] = "From Kib\'roth-hatta\'avah the people journeyed to Haze\'roth; and they remained at Haze\'roth.";
asv[35] = "From Kibroth-hattaavah the people journeyed unto Hazeroth; and they abode at Hazeroth.";
yng[35] = "From Kibroth-Hattaavah have the people journeyed to Hazeroth, and they are in Hazeroth.";
dby[35] = "From Kibroth-hattaavah the people journeyed to Hazeroth; and they were at Hazeroth.";
web[35] = "[And] the people journeyed from Kibroth-hattaavah to Hazeroth: and abode at Hazeroth.";
hnv[35] = "From Kivrot-Hatta\'avah the people traveled to Hatzerot; and they abode at Hatzerot.";
vul[35] = "";
csb[1] = "Now the people began complaining openly before the LORD about hardship. When the LORD heard, his anger burned, and fire from the LORD blazed among them and consumed the outskirts of the camp.";
csb[2] = "Then the people cried out to Moses, and he prayed to the LORD, and the fire died down.";
csb[3] = "So that place was named Taberah, because the LORD\'s fire had blazed among them.";
csb[4] = "The riffraff among them had a strong craving for other food. The Israelites wept again and said, &quot;Who will feed us meat?";
csb[5] = "&quot;We remember the free fish we ate in Egypt, along with the cucumbers, melons, leeks, onions, and garlic.";
csb[6] = "&quot;But now our appetite is gone; there\'s nothing to look at but this manna! &quot;";
csb[7] = "The manna resembled coriander seed, and its appearance was like that of bdellium.";
csb[8] = "The people walked around and gathered it. They ground it on a pair of grinding stones or crushed it in a mortar, then boiled it in a cooking pot and shaped it into cakes. It tasted like a pastry cooked with the finest oil.";
csb[9] = "When the dew fell on the camp at night, the manna would fall with it.";
csb[10] = "Moses heard the people, family after family, weeping at the entrance of their tents. The LORD was very angry; Moses was also provoked.";
csb[11] = "So Moses asked the LORD, &quot;Why have you brought such trouble on your servant? Why are you angry with me, and why do you burden me with all these people?";
csb[12] = "&quot;Did I conceive all these people? Did I give them birth so you should tell me, \'Carry them at your breast, as a nanny carries a baby,\' to the land that you swore to give their fathers?";
csb[13] = "&quot;Where can I get meat to give all these people? For they are weeping to me, \'Give us meat to eat! \'";
csb[14] = "&quot;I can\'t carry all these people by myself. They are too much for me.";
csb[15] = "&quot;If you are going to treat me like this, please kill me right now if I have found favor with you, and don\'t let me see my misery anymore.&quot;";
csb[16] = "The LORD answered Moses, &quot;Bring me seventy men from Israel known to you as elders and officers of the people. Take them to the tent of meeting and have them stand there with you.";
csb[17] = "&quot;Then I will come down and speak with you there. I will take some of the Spirit who is on you and put the Spirit on them. They will help you bear the burden of the people, so that you do not have to bear it by yourself.";
csb[18] = "&quot;Tell the people: Consecrate yourselves in readiness for tomorrow, and you will eat meat because you wept in the LORD\'s hearing, \'Who will feed us meat? We were better off in Egypt.\' The LORD will give you meat and you will eat.";
csb[19] = "&quot;You will eat, not for one day, or two days, or five days, or ten days, or twenty days,";
csb[20] = "&quot;but for a whole month -- until it comes out of your nostrils and becomes nauseating to you -- because you have rejected the LORD who is among you, and wept before him: \'Why did we ever leave Egypt? \' &quot;";
csb[21] = "But Moses replied, &quot;I\'m in the middle of a people with six hundred thousand foot soldiers, yet you say, \'I will give them meat, and they will eat for a month.\'";
csb[22] = "&quot;If flocks and herds were slaughtered for them, would they have enough? Or if all the fish in the sea were caught for them, would they have enough? &quot;";
csb[23] = "The LORD answered Moses, &quot;Is the LORD\'s arm weak? Now you will see whether or not what I have promised will happen to you.&quot;";
csb[24] = "Moses went out and told the people the words of the LORD. He brought seventy men from the elders of the people and had them stand around the tent.";
csb[25] = "Then the LORD descended in the cloud and spoke to him. He took some of the Spirit that was on Moses and placed the Spirit on the seventy elders. As the Spirit rested on them, they prophesied, but they never did it again.";
csb[26] = "Two men had remained in the camp, one named Eldad and the other Medad; the Spirit rested on them -- they were among those listed, but had not gone out to the tent -- and they prophesied in the camp.";
csb[27] = "A young man ran and reported to Moses, &quot;Eldad and Medad are prophesying in the camp.&quot;";
csb[28] = "Joshua son of Nun, assistant to Moses since his youth, responded, &quot;Moses, my lord, stop them! &quot;";
csb[29] = "But Moses asked him, &quot;Are you jealous on my account? If only all the LORD\'s people were prophets and the LORD would place his Spirit on them! &quot;";
csb[30] = "Then Moses returned to the camp along with the elders of Israel.";
csb[31] = "A wind sent by the LORD came up and blew quail in from the sea; it dropped them all around the camp. They were flying three feet off the ground for about a day\'s journey in every direction.";
csb[32] = "The people were up all that day and night and all the next day gathering the quail -- the one who took the least gathered fifty bushels -- and they spread them out all around the camp.";
csb[33] = "While the meat was still between their teeth, before it was chewed, the LORD\'s anger burned against the people, and the LORD struck them with a very severe plague.";
csb[34] = "So they named that place Kibroth-hattaavah, because there they buried the people who had craved the meat.";
csb[35] = "From Kibroth-hattaavah the people moved on to Hazeroth and remained there.";
</script>
