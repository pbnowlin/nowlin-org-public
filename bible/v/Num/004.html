kjv[15] = "And when Aaron and his sons have made an end of covering the sanctuary, and all the vessels of the sanctuary, as the camp is to set forward; after that, the sons of Kohath shall come to bear [it]: but they shall not touch [any] holy thing, lest they die. These [things are] the burden of the sons of Kohath in the tabernacle of the congregation.";
rsv[15] = "And when Aaron and his sons have finished covering the sanctuary and all the furnishings of the sanctuary, as the camp sets out, after that the sons of Kohath shall come to carry these, but they must not touch the holy things, lest they die. These are the things of the tent of meeting which the sons of Kohath are to carry.";
asv[15] = "And when Aaron and his sons have made an end of covering the sanctuary, and all the furniture of the sanctuary, as the camp is set forward; after that, the sons of Kohath shall come to bear it: but they shall not touch the sanctuary, lest they die. These things are the burden of the sons of Kohath in the tent of meeting.";
yng[15] = "`And Aaron hath finished -- his sons also -- covering the sanctuary, and all the vessels of the sanctuary, in the journeying of the camp, and afterwards do the sons of Kohath come in to bear [it], and they do not come unto the holy thing, that they have died; these [things are] the burden of the sons of Kohath in the tent of meeting.";
dby[15] = "And when Aaron and his sons have ended covering the sanctuary, and all the utensils of the sanctuary, when the camp setteth forward, then afterwards the sons of Kohath shall come to carry it; but they shall not touch the holy things, lest they die. This is what the sons of Kohath have to carry in the tent of meeting.";
web[15] = "And when Aaron and his sons have made an end of covering the sanctuary, and all the vessels of the sanctuary, as the camp is to move forward; after that, the sons of Kohath shall come to bear [it]: but they shall not touch [any] holy thing, lest they die. These [things are] the burden of the sons of Kohath in the tabernacle of the congregation.";
hnv[15] = "&quot;When Aharon and his sons have finished covering the sanctuary, and all the furniture of the sanctuary, as the camp moves forward; after that, the sons of Kehat shall come to carry it: but they shall not touch the sanctuary, lest they die. These things are the burden of the sons of Kehat in the Tent of Meeting.";
vul[15] = "cumque involverint Aaron et filii eius sanctuarium et omnia vasa eius in commotione castrorum tunc intrabunt filii Caath ut portent involuta et non tangant vasa sanctuarii ne moriantur ista sunt onera filiorum Caath in tabernaculo foederis";
kjv[16] = "And to the office of Eleazar the son of Aaron the priest [pertaineth] the oil for the light, and the sweet incense, and the daily meat offering, and the anointing oil, [and] the oversight of all the tabernacle, and of all that therein [is], in the sanctuary, and in the vessels thereof.";

asv[16] = "And the charge of Eleazar the son of Aaron the priest shall be the oil for the light, and the sweet incense, and the continual meal-offering, and the anointing oil, the charge of all the tabernacle, and of all that therein is, the sanctuary, and the furniture thereof.";
yng[16] = "`And the oversight of Eleazar, son of Aaron the priest, [is] the oil of the lamp, and the spice-perfume, and the present of continuity, and the anointing oil, the oversight of all the tabernacle, and of all that [is] in it, in the sanctuary, and in its vessels.\'";
dby[16] = "And Eleazar the son of Aaron the priest shall have the oversight of the oil for the light, and the fragrant incense, and the continual oblation, and the anointing oil, -- the oversight of the whole tabernacle, and of all that is therein, over the sanctuary, and over its furniture.";
web[16] = "And to the office of Eleazar the son of Aaron the priest [pertain] the oil for the light, and the sweet incense, and the daily meat-offering, and the anointing oil, [and] the oversight of all the tabernacle, and of all that [is] in it, in the sanctuary, and in its vessels.";
hnv[16] = "&quot;The charge of El`azar the son of Aharon the Kohen shall be the oil for the light, the sweet incense, the continual meal offering, and the anointing oil, the charge of all the tabernacle, and of all that is in it, the sanctuary, and its furnishings.&quot;";
vul[16] = "super quos erit Eleazar filius Aaron sacerdotis ad cuius pertinet curam oleum ad concinnandas lucernas et conpositionis incensum et sacrificium quod semper offertur et oleum unctionis et quicquid ad cultum tabernaculi pertinet omniumque vasorum quae in sanctuario sunt";

kjv[49] = "According to the commandment of the LORD they were numbered by the hand of Moses, every one according to his service, and according to his burden: thus were they numbered of him, as the LORD commanded Moses.";
rsv[49] = "According to the commandment of the LORD through Moses they were appointed, each to his task of serving or carrying; thus they were numbered by him, as the LORD commanded Moses.";
asv[49] = "According to the commandment of Jehovah they were numbered by Moses, every one according to his service, and according to his burden: thus were they numbered of him, as Jehovah commanded Moses.";
yng[49] = "by the command of Jehovah hath [one] numbered them, by the hand of Moses, each man by his service, and by his burden, with his numbered ones, as Jehovah hath commanded Moses.";
dby[49] = "According to the commandment of Jehovah they were numbered by Moses, every one for his service, and for his burden, and numbered by him, as Jehovah had commanded Moses.";
web[49] = "According to the commandment of the LORD they were numbered by the hand of Moses, every one according to his service, and according to his burden: thus were they numbered by him, as the LORD commanded Moses.";
hnv[49] = "According to the mitzvah of the LORD they were numbered by Moshe, everyone according to his service, and according to his burden. Thus were they numbered by him, as the LORD commanded Moshe.";
vul[49] = "iuxta verbum Domini recensuit eos Moses unumquemque iuxta officium et onera sua sicut praeceperat ei Dominus";
csb[1] = "The LORD spoke to Moses and Aaron:";
csb[2] = "&quot;Among the Levites, take a census of the Kohathites by their clans and their ancestral families,";
csb[3] = "&quot;men from thirty years old to fifty years old -- everyone who is qualified to do work at the tent of meeting.";
csb[4] = "&quot;The service of the Kohathites at the tent of meeting concerns the most holy objects.";
csb[5] = "&quot;Whenever the camp is about to move on, Aaron and his sons are to go in, take down the screening curtain, and cover the ark of the testimony with it.";
csb[6] = "&quot;They are to place over this a covering made of fine leather, spread a solid blue cloth on top, and insert its poles.";
csb[7] = "&quot;They are to spread a blue cloth over the table of the Presence and place the plates and cups on it, as well as the bowls and pitchers for the drink offering. The regular bread offering is to be on it.";
csb[8] = "&quot;They are to spread a scarlet cloth over them, cover them with a covering made of fine leather, and insert the poles in the table.";
csb[9] = "&quot;They are to take a blue cloth and cover the lampstand used for light, with its lamps, snuffers, and firepans, as well as its jars of oil by which they service it.";
csb[10] = "&quot;Then they are to place it with all its utensils inside a covering made of fine leather and put them on the carrying frame.";
csb[11] = "&quot;They are to spread a blue cloth over the gold altar, cover it with a covering made of fine leather, and insert its poles.";
csb[12] = "&quot;They are to take all the serving utensils they use in the sanctuary, place them in a blue cloth, cover them with a covering made of fine leather, and put them on a carrying frame.";
csb[13] = "&quot;They are to remove the ashes from the bronze altar, spread a purple cloth over it,";
csb[14] = "&quot;and place all the equipment on it that they use in serving: the firepans, meat forks, shovels, and basins -- all the equipment of the altar. They are to spread a covering made of fine leather over it and insert its poles.";
csb[15] = "&quot;Aaron and his sons are to finish covering the holy objects and all their equipment whenever the camp is to move on. The Kohathites will come and carry them, but they are not to touch the holy objects or they will die. These are the transportation duties of the Kohathites regarding the tent of meeting.";
csb[16] = "&quot;Eleazar, son of Aaron the priest, has oversight of the lamp oil, the fragrant incense, the daily grain offering, and the anointing oil. He has oversight of the entire tabernacle and everything in it, the holy objects and their utensils.&quot;";
csb[17] = "Then the LORD spoke to Moses and Aaron:";
csb[18] = "&quot;Do not allow the Kohathite tribal clans to be wiped out from the Levites.";
csb[19] = "&quot;Do this for them so that they may live and not die when they come near the most holy objects: Aaron and his sons are to go in and assign each man his task and transportation duty.";
csb[20] = "&quot;The Kohathites are not to go in and look at the holy objects as they are covered or they will die.&quot;";
csb[21] = "The LORD spoke to Moses:";
csb[22] = "&quot;Take a census of the Gershonites also, by their ancestral families and their clans.";
csb[23] = "&quot;Register men from thirty years old to fifty years old, everyone who is qualified to perform service, to do work at the tent of meeting.";
csb[24] = "&quot;This is the service of the Gershonite clans regarding work and transportation duties:";
csb[25] = "&quot;They are to transport the tabernacle curtains, the tent of meeting with its covering and the covering made of fine leather on top of it, the screen for the entrance to the tent of meeting,";
csb[26] = "&quot;the hangings of the courtyard, the screen for the entrance at the gate of the courtyard that surrounds the tabernacle and the altar, along with their ropes and all the equipment for their service. They will carry out everything that needs to be done with these items.";
csb[27] = "&quot;All the service of the Gershonites, all their transportation duties and all their other work, is to be done at the command of Aaron and his sons; you are to assign to them all that they are responsible to carry.";
csb[28] = "&quot;This is the service of the Gershonite clans at the tent of meeting, and their duties will be under the direction of Ithamar son of Aaron the priest.";
csb[29] = "&quot;As for the Merarites, you are to register them by their clans and their ancestral families.";
csb[30] = "&quot;Register men from thirty years old to fifty years old, everyone who is qualified to do the work of the tent of meeting.";
csb[31] = "&quot;This is what they are responsible to carry as the whole of their service at the tent of meeting: the supports of the tabernacle, with its crossbars, pillars, and bases,";
csb[32] = "&quot;the posts of the surrounding courtyard with their bases, tent pegs, and ropes, including all their equipment and all the work related to them. You are to assign by name the items that they are responsible to carry.";
csb[33] = "&quot;This is the service of the Merarite clans regarding all their work at the tent of meeting, under the direction of Ithamar son of Aaron the priest.&quot;";
csb[34] = "So Moses, Aaron, and the leaders of the community registered the Kohathites by their clans and their ancestral families,";
csb[35] = "men from thirty years old to fifty years old, everyone who was qualified for work at the tent of meeting.";
csb[36] = "The men registered by their clans numbered 2,750.";
csb[37] = "These were the registered men of the Kohathite clans, everyone who could serve at the tent of meeting. Moses and Aaron registered them at the LORD\'s command through Moses.";
csb[38] = "The Gershonites were registered by their clans and their ancestral families,";
csb[39] = "men from thirty years old to fifty years old, everyone who was qualified for work at the tent of meeting.";
csb[40] = "The men registered by their clans and their ancestral families numbered 2,630.";
csb[41] = "These were the registered men of the Gershonite clans. At the LORD\'s command Moses and Aaron registered everyone who could serve at the tent of meeting.";
csb[42] = "The men of the Merarite clans were registered by their clans and their ancestral families,";
csb[43] = "those from thirty years old to fifty years old, everyone who was qualified for work at the tent of meeting.";
csb[44] = "The men registered by their clans numbered 3,200.";
csb[45] = "These were the registered men of the Merarite clans; Moses and Aaron registered them at the LORD\'s command through Moses.";
csb[46] = "Moses, Aaron, and the leaders of Israel registered all the Levites by their clans and their ancestral families,";
csb[47] = "from thirty years old to fifty years old, everyone who was qualified to do the work of serving at the tent of meeting and transporting it.";
csb[48] = "Their registered men numbered 8,580.";
csb[49] = "At the LORD\'s command they were registered under the direction of Moses, each one according to his work and transportation duty, and his assignment was as the LORD commanded Moses.";
