yng[1] = "And all the company lifteth up and give forth their voice, and the people weep during that night;";
dby[1] = "And the whole assembly lifted up their voice, and cried; and the people wept that night.";

kjv[2] = "Doubtless ye shall not come into the land, [concerning] which I sware to make you dwell therein, save Caleb the son of Jephunneh, and Joshua the son of Nun.";
rsv[2] = "And all the people of Israel murmured against Moses and Aaron; the whole congregation said to them, &quot;Would that we had died in the land of Egypt! Or would that we had died in this wilderness!";
asv[2] = "And all the children of Israel murmured against Moses and against Aaron: and the whole congregation said unto them, Would that we had died in the land of Egypt! or would that we had died in this wilderness!";
yng[2] = "and all the sons of Israel murmur against Moses, and against Aaron, and all the company say unto them, `O that we had died in the land of Egypt, or in this wilderness, O that we had died!";
dby[2] = "And all the children of Israel murmured against Moses and against Aaron; and the whole assembly said to them, Would that we had died in the land of Egypt! or in this wilderness would that we had died!";

hnv[2] = "All the children of Yisra\'el murmured against Moshe and against Aharon: and the whole congregation said to them, Would that we had died in the land of Mitzrayim! or would that we had died in this wilderness!";

kjv[3] = "But your little ones, which ye said should be a prey, them will I bring in, and they shall know the land which ye have despised.";
rsv[3] = "Why does the LORD bring us into this land, to fall by the sword? Our wives and our little ones will become a prey; would it not be better for us to go back to Egypt?&quot;";
asv[3] = "And wherefore doth Jehovah bring us unto this land, to fall by the sword? Our wives and our little ones will be a prey: were it not better for us to return into Egypt?";
yng[3] = "and why is Jehovah bringing us in unto this land to fall by the sword? our wives and our infants are become a prey; is it not good for us to turn back to Egypt?\'";
dby[3] = "And why is Jehovah bringing us to this land that we may fall by the sword, that our wives and our little ones may become a prey? Is it not better for us to return to Egypt?";
web[3] = "And why hath the LORD brought us to this land, to fall by the sword, that our wives and our children should be a prey? were it not better for us to return into Egypt?";
hnv[3] = "Why does the LORD bring us to this land, to fall by the sword? Our wives and our little ones will be a prey: wouldn\'t it be better for us to return into Mitzrayim?";
vul[3] = "utinam mortui essemus in Aegypto et non in hac vasta solitudine utinam pereamus et non inducat nos Dominus in terram istam ne cadamus gladio et uxores ac liberi nostri ducantur captivi nonne melius est reverti in Aegyptum";
kjv[4] = "But [as for] you, your carcases, they shall fall in this wilderness.";
rsv[4] = "And they said to one another, &quot;Let us choose a captain, and go back to Egypt.&quot;";
asv[4] = "And they said one to another, Let us make a captain, and let us return into Egypt.";
yng[4] = "And they say one unto another, `Let us appoint a head, and turn back to Egypt.\'";
dby[4] = "And they said one to another, Let us make a captain, and let us return to Egypt.";
web[4] = "And they said one to another, Let us make a captain, and let us return into Egypt.";
hnv[4] = "They said one to another, Let us make a captain, and let us return into Mitzrayim.";
vul[4] = "dixeruntque alter ad alterum constituamus nobis ducem et revertamur in Aegyptum";
kjv[5] = "And your children shall wander in the wilderness forty years, and bear your whoredoms, until your carcases be wasted in the wilderness.";
rsv[5] = "Then Moses and Aaron fell on their faces before all the assembly of the congregation of the people of Israel.";
asv[5] = "Then Moses and Aaron fell on their faces before all the assembly of the congregation of the children of Israel.";
yng[5] = "And Moses falleth -- Aaron also -- on their faces, before all the assembly of the company of the sons of Israel.";
dby[5] = "Then Moses and Aaron fell upon their faces before the whole congregation of the assembly of the children of Israel.";
web[5] = "Then Moses and Aaron fell on their faces before all the assembly of the congregation of the children of Israel.";
hnv[5] = "Then Moshe and Aharon fell on their faces before all the assembly of the congregation of the children of Yisra\'el.";
vul[5] = "quo audito Moses et Aaron ceciderunt proni in terram coram omni multitudine filiorum Israhel";
kjv[6] = "After the number of the days in which ye searched the land, [even] forty days, each day for a year, shall ye bear your iniquities, [even] forty years, and ye shall know my breach of promise.";
rsv[6] = "And Joshua the son of Nun and Caleb the son of Jephun\'neh, who were among those who had spied out the land, rent their clothes,";
asv[6] = "And Joshua the son of Nun and Caleb the son of Jephunneh, who were of them that spied out the land, rent their clothes:";
yng[6] = "And Joshua son of Nun, and Caleb son of Jephunneh, of those spying the land, have rent their garments,";
dby[6] = "And Joshua the son of Nun, and Caleb the son of Jephunneh, of them that searched out the land, rent their garments.";
web[6] = "And Joshua the son of Nun, and Caleb the son of Jephunneh, [who were] of them that searched the land, rent their clothes:";
hnv[6] = "Yehoshua the son of Nun and Kalev the son of Yefunneh, who were of those who spied out the land, tore their clothes:";
vul[6] = "at vero Iosue filius Nun et Chaleb filius Iepphonne qui et ipsi lustraverant terram sciderunt vestimenta sua";
kjv[7] = "I the LORD have said, I will surely do it unto all this evil congregation, that are gathered together against me: in this wilderness they shall be consumed, and there they shall die.";
rsv[7] = "and said to all the congregation of the people of Israel, &quot;The land, which we passed through to spy it out, is an exceedingly good land.";
asv[7] = "and they spake unto all the congregation of the children of Israel, saying, The land, which we passed through to spy it out, is an exceeding good land.";
yng[7] = "and they speak unto all the company of the sons of Israel, saying, `The land into which we have passed over to spy it, [is] a very very good land;";
dby[7] = "And they spoke to the whole assembly of the children of Israel, saying, The land, which we passed through to search it out, is a very, very good land.";
web[7] = "And they spoke to all the company of the children of Israel, saying, The land, which we passed through to search it, [is] an exceeding good land.";
hnv[7] = " and they spoke to all the congregation of the children of Yisra\'el, saying, The land, which we passed through to spy it out, is an exceeding good land.";
vul[7] = "et ad omnem multitudinem filiorum Israhel locuti sunt terram quam circuivimus valde bona est";
kjv[8] = "And the men, which Moses sent to search the land, who returned, and made all the congregation to murmur against him, by bringing up a slander upon the land,";
rsv[8] = "If the LORD delights in us, he will bring us into this land and give it to us, a land which flows with milk and honey.";
asv[8] = "If Jehovah delight in us, then he will bring us into this land, and give it unto us; a land which floweth with milk and honey.";
yng[8] = "if Jehovah hath delighted in us, then He hath brought us in unto this land, and hath given it to us, a land which is flowing with milk and honey;";
dby[8] = "If Jehovah delight in us, he will bring us into this land, and give it us, a land that flows with milk and honey;";
web[8] = "If the LORD delighteth in us, then he will bring us into this land, and give it to us; a land which floweth with milk and honey.";
hnv[8] = "If the LORD delight in us, then he will bring us into this land, and give it to us; a land which flows with milk and honey.";
vul[8] = "si propitius fuerit Dominus inducet nos in eam et tradet humum lacte et melle manantem";
kjv[9] = "Even those men that did bring up the evil report upon the land, died by the plague before the LORD.";
rsv[9] = "Only, do not rebel against the LORD; and do not fear the people of the land, for they are bread for us; their protection is removed from them, and the LORD is with us; do not fear them.&quot;";
asv[9] = "Only rebel not against Jehovah, neither fear ye the people of the land; for they are bread for us: their defence is removed from over them, and Jehovah is with us: fear them not.";
yng[9] = "only, against Jehovah rebel not ye: and ye, fear not ye the people of the land, for our bread they [are]; their defence hath turned aside from off them, and Jehovah [is] with us; fear them not.\'";
dby[9] = "only rebel not against Jehovah; and fear not the people of the land; for they shall be our food. Their defence is departed from them, and Jehovah is with us: fear them not.";
web[9] = "Only rebel not ye against the LORD, neither fear ye the people of the land; for they [are] bread for us: their defense has departed from them, and the LORD [is] with us: fear them not.";
hnv[9] = "Only don\'t rebel against the LORD, neither fear the people of the land; for they are bread for us: their defense is removed from over them, and the LORD is with us: don\'t fear them.";
vul[9] = "nolite rebelles esse contra Dominum neque timeatis populum terrae huius quia sicut panem ita eos possumus devorare recessit ab illis omne praesidium Dominus nobiscum est nolite metuere";
kjv[10] = "But Joshua the son of Nun, and Caleb the son of Jephunneh, [which were] of the men that went to search the land, lived [still].";
rsv[10] = "But all the congregation said to stone them with stones. Then the glory of the LORD appeared at the tent of meeting to all the people of Israel.";
asv[10] = "But all the congregation bade stone them with stones. And the glory of Jehovah appeared in the tent of meeting unto all the children of Israel.";
yng[10] = "And all the company say to stone them with stones, and the honour of Jehovah hath appeared in the tent of meeting unto all the sons of Israel.";
dby[10] = "And the whole assembly said that they should be stoned with stones. And the glory of Jehovah appeared in the tent of meeting to all the children of Israel.";
web[10] = "But all the congregation required to stone them with stones: and the glory of the LORD appeared in the tabernacle of the congregation before all the children of Israel.";
hnv[10] = "But all the congregation bade stone them with stones. The glory of the LORD appeared in the tent of meeting to all the children of Yisra\'el.";
vul[10] = "cumque clamaret omnis multitudo et lapidibus eos vellet opprimere apparuit gloria Domini super tectum foederis cunctis filiis Israhel";
kjv[11] = "And Moses told these sayings unto all the children of Israel: and the people mourned greatly.";
rsv[11] = "And the LORD said to Moses, &quot;How long will this people despise me? And how long will they not believe in me, in spite of all the signs which I have wrought among them?";
asv[11] = "And Jehovah said unto Moses, How long will this people despise me? and how long will they not believe in me, for all the signs which I have wrought among them?";
yng[11] = "And Jehovah saith unto Moses, `Until when doth this people despise Me? and until when do they not believe in Me, for all the signs which I have done in its midst?";
dby[11] = "And Jehovah said to Moses, How long will this people despise me? and how long will they not believe me, for all the signs which I have done among them?";
web[11] = "And the LORD said to Moses, How long will this people provoke me? and how long will it be ere they believe me, for all the signs which I have shown among them?";
hnv[11] = "The LORD said to Moshe, How long will this people despise me? and how long will they not believe in me, for all the signs which I have worked among them?";
vul[11] = "et dixit Dominus ad Mosen usquequo detrahet mihi populus iste quousque non credent mihi in omnibus signis quae feci coram eis";
kjv[12] = "And they rose up early in the morning, and gat them up into the top of the mountain, saying, Lo, we [be here], and will go up unto the place which the LORD hath promised: for we have sinned.";
rsv[12] = "I will strike them with the pestilence and disinherit them, and I will make of you a nation greater and mightier than they.&quot;";
asv[12] = "I will smite them with the pestilence, and disinherit them, and will make of thee a nation greater and mightier than they.";
yng[12] = "I smite it with pestilence, and dispossess it, and make thee become a nation greater and mightier than it.\'";
dby[12] = "I will smite them with the pestilence, and destroy them, and will make of thee a nation greater and mightier than they.";
web[12] = "I will smite them with the pestilence, and disinherit them, and will make of thee a greater nation and mightier than they.";
hnv[12] = "I will strike them with the pestilence, and disinherit them, and will make of you a nation greater and mightier than they.";
vul[12] = "feriam igitur eos pestilentia atque consumam te autem faciam principem super gentem magnam et fortiorem quam haec est";
kjv[13] = "And Moses said, Wherefore now do ye transgress the commandment of the LORD? but it shall not prosper.";
rsv[13] = "But Moses said to the LORD, &quot;Then the Egyptians will hear of it, for thou didst bring up this people in thy might from among them,";
asv[13] = "And Moses said unto Jehovah, Then the Egyptians will hear it; for thou broughtest up this people in thy might from among them;";
yng[13] = "And Moses saith unto Jehovah, `Then have the Egyptians heard! for Thou hast brought up with Thy power this people out of their midst,";
dby[13] = "And Moses said to Jehovah, Then the Egyptians will hear it; for in thy might thou broughtest up this people from the midst of them;";
web[13] = "And Moses said to the LORD, Then the Egyptians will hear [it], (for thou broughtest up this people in thy might from among them;)";
hnv[13] = "Moshe said to the LORD, Then the Mitzrim will hear it; for you brought up this people in your might from among them;";
vul[13] = "et ait Moses ad Dominum ut audiant Aegyptii de quorum medio eduxisti populum istum";
kjv[14] = "Go not up, for the LORD [is] not among you; that ye be not smitten before your enemies.";
rsv[14] = "and they will tell the inhabitants of this land. They have heard that thou, O LORD, art in the midst of this people; for thou, O LORD, art seen face to face, and thy cloud stands over them and thou goest before them, in a pillar of cloud by day and in a pillar of fire by night.";
asv[14] = "and they will tell it to the inhabitants of this land. They have heard that thou Jehovah art in the midst of this people; for thou Jehovah art seen face to face, and thy cloud standeth over them, and thou goest before them, in a pillar of cloud by day, and in a pillar of fire by night.";
yng[14] = "and they have said [it] unto the inhabitant of this land, they have heard that Thou, Jehovah, [art] in the midst of this people, that eye to eye Thou art seen -- O Jehovah, and Thy cloud is standing over them, -- and in a pillar of cloud Thou art going before them by day, and in a pillar of fire by night.";
dby[14] = "and they will tell it to the inhabitants of this land, [who] have heard that thou, Jehovah, art in the midst of this people, that thou, Jehovah, lettest thyself be seen eye to eye, and that thy cloud standeth over them, and that thou goest before them, in a pillar of cloud by day, and in a pillar of fire by night;";
web[14] = "And they will tell [it] to the inhabitants of this land: [for] they have heard that thou LORD [art] among this people, that thou LORD art seen face to face, and [that] thy cloud standeth over them, and [that] thou goest before them, by day-time in a pillar of a cloud, and in a pillar of fire by night.";
hnv[14] = "and they will tell it to the inhabitants of this land. They have heard that you LORD are in the midst of this people; for you LORD are seen face to face, and your cloud stands over them, and you go before them, in a pillar of cloud by day, and in a pillar of fire by night.";
vul[14] = "et habitatores terrae huius qui audierunt quod tu Domine in populo isto sis et facie videaris ad faciem et nubes tua protegat illos et in columna nubis praecedas eos per diem et in columna ignis per noctem";
kjv[15] = "For the Amalekites and the Canaanites [are] there before you, and ye shall fall by the sword: because ye are turned away from the LORD, therefore the LORD will not be with you.";
rsv[15] = "Now if thou dost kill this people as one man, then the nations who have heard thy fame will say,";
asv[15] = "Now if thou shalt kill this people as one man, then the nations which have heard the fame of thee will speak, saying,";
yng[15] = "`And Thou hast put to death this people as one man, and the nations who have heard Thy fame have spoken, saying,";
dby[15] = "if thou now slayest this people as one man, then the nations that have heard thy fame will speak, saying,";
web[15] = "Now [if] thou shalt kill [all] this people as one man, then the nations which have heard the fame of thee will speak, saying,";
hnv[15] = "Now if you shall kill this people as one man, then the nations which have heard the fame of you will speak, saying,";
vul[15] = "quod occideris tantam multitudinem quasi unum hominem et dicant";
kjv[16] = "But they presumed to go up unto the hill top: nevertheless the ark of the covenant of the LORD, and Moses, departed not out of the camp.";
rsv[16] = "\'Because the LORD was not able to bring this people into the land which he swore to give to them, therefore he has slain them in the wilderness.\'";
asv[16] = "Because Jehovah was not able to bring this people into the land which he sware unto them, therefore he hath slain them in the wilderness.";
yng[16] = "From Jehovah\'s want of ability to bring in this people unto the land which He hath sworn to them -- He doth slaughter them in the wilderness.";
dby[16] = "Because Jehovah was not able to bring this people into the land that he had sworn unto them, he has therefore slain them in the wilderness.";
web[16] = "Because the LORD was not able to bring this people into the land which he swore to them, therefore he hath slain them in the wilderness.";
hnv[16] = "Because the LORD was not able to bring this people into the land which he swore to them, therefore he has slain them in the wilderness.";
vul[16] = "non poterat introducere populum in terram pro qua iuraverat idcirco occidit eos in solitudine";
kjv[17] = "Then the Amalekites came down, and the Canaanites which dwelt in that hill, and smote them, and discomfited them, [even] unto Hormah.";
rsv[17] = "And now, I pray thee, let the power of the LORD be great as thou hast promised, saying,";
asv[17] = "And now, I pray thee, let the power of the Lord be great, according as thou hast spoken, saying,";
yng[17] = "`And now, let, I pray Thee, the power of my Lord be great, as Thou hast spoken, saying:";
dby[17] = "And now, I beseech thee, let the power of the Lord be great, according as thou hast spoken, saying,";
web[17] = "And now, I beseech thee, let the power of my Lord be great, according as thou hast spoken, saying,";
hnv[17] = "Now please let the power of the Lord be great, according as you have spoken, saying,";
vul[17] = "magnificetur ergo fortitudo Domini sicut iurasti dicens";
kjv[18] = "And all the congregation lifted up their voice, and cried; and the people wept that night.";
rsv[18] = "\'The LORD is slow to anger, and abounding in steadfast love, forgiving iniquity and transgression, but he will by no means clear the guilty, visiting the iniquity of fathers upon children, upon the third and upon the fourth generation.\'";
asv[18] = "Jehovah is slow to anger, and abundant in lovingkindness, forgiving iniquity and transgression; and that will by no means clear [the guilty], visiting the iniquity of the fathers upon the children, upon the third and upon the fourth generation.";
yng[18] = "Jehovah [is] slow to anger, and of great kindness; bearing away iniquity and transgression, and not entirely acquitting, charging iniquity of fathers on sons, on a third [generation], and on a fourth; --";
dby[18] = "Jehovah is slow to anger, and abundant in goodness, forgiving iniquity and transgression, but by no means clearing [the guilty], visiting the iniquity of the fathers upon the children, upon the third and fourth [generation].";
web[18] = "The LORD [is] long-suffering, and of great mercy, forgiving iniquity and transgression, and by no means clearing [the guilty], visiting the iniquity of the fathers upon the children to the third and fourth [generation].";
hnv[18] = "The LORD is slow to anger, and abundant in lovingkindness, forgiving iniquity and disobedience; and that will by no means clear [the guilty], visiting the iniquity of the fathers on the children, on the third and on the fourth generation.";
vul[18] = "Dominus patiens et multae misericordiae auferens iniquitatem et scelera nullumque innoxium derelinquens qui visitas peccata patrum in filios in tertiam et quartam generationem";
kjv[19] = "And all the children of Israel murmured against Moses and against Aaron: and the whole congregation said unto them, Would God that we had died in the land of Egypt! or would God we had died in this wilderness!";
rsv[19] = "Pardon the iniquity of this people, I pray thee, according to the greatness of thy steadfast love, and according as thou hast forgiven this people, from Egypt even until now.&quot;";
asv[19] = "Pardon, I pray thee, the iniquity of this people according unto the greatness of thy lovingkindness, and according as thou hast forgiven this people, from Egypt even until now.";
yng[19] = "forgive, I pray Thee, the iniquity of this people, according to the greatness of Thy kindness, and as Thou hast borne with this people from Egypt, even until now.\'";
dby[19] = "Pardon, I beseech thee, the iniquity of this people according to the greatness of thy loving-kindness, and as thou hast forgiven this people, from Egypt even until now.";
web[19] = "Pardon, I beseech thee, the iniquity of this people according to the greatness of thy mercy, and as thou hast forgiven this people, from Egypt, even until now.";
hnv[19] = "Pardon, Please, the iniquity of this people according to the greatness of your lovingkindness, and according as you have forgiven this people, from Mitzrayim even until now.";
vul[19] = "dimitte obsecro peccatum populi tui huius secundum magnitudinem misericordiae tuae sicut propitius fuisti egredientibus de Aegypto usque ad locum istum";
kjv[20] = "And wherefore hath the LORD brought us unto this land, to fall by the sword, that our wives and our children should be a prey? were it not better for us to return into Egypt?";
rsv[20] = "Then the LORD said, &quot;I have pardoned, according to your word;";
asv[20] = "And Jehovah said, I have pardoned according to thy word:";
yng[20] = "And Jehovah saith, `I have forgiven, according to thy word;";
dby[20] = "And Jehovah said, I have pardoned according to thy word.";
web[20] = "And the LORD said, I have pardoned according to thy word:";
hnv[20] = "The LORD said, I have pardoned according to your word:";
vul[20] = "dixitque Dominus dimisi iuxta verbum tuum";
kjv[21] = "And they said one to another, Let us make a captain, and let us return into Egypt.";
rsv[21] = "but truly, as I live, and as all the earth shall be filled with the glory of the LORD,";
asv[21] = "but in very deed, as I live, and as all the earth shall be filled with the glory of Jehovah;";
yng[21] = "and yet, I live -- and it is filled -- the whole earth -- [with] the honour of Jehovah;";
dby[21] = "But as surely as I live, all the earth shall be filled with the glory of Jehovah!";
web[21] = "But [as] truly [as] I live, all the earth shall be filled with the glory of the LORD.";
hnv[21] = "but in very deed, as I live, and as all the eretz shall be filled with the glory of the LORD;";
vul[21] = "vivo ego et implebitur gloria Domini universa terra";
kjv[22] = "Then Moses and Aaron fell on their faces before all the assembly of the congregation of the children of Israel.";
rsv[22] = "none of the men who have seen my glory and my signs which I wrought in Egypt and in the wilderness, and yet have put me to the proof these ten times and have not hearkened to my voice,";
asv[22] = "because all those men that have seen my glory, and my signs, which I wrought in Egypt and in the wilderness, yet have tempted me these ten times, and have not hearkened to my voice;";
yng[22] = "for all the men who are seeing My honour, and My signs, which I have done in Egypt, and in the wilderness, and try Me these ten times, and have not hearkened to My voice --";
dby[22] = "for all those men who have seen my glory, and my signs, which I did in Egypt and in the wilderness, and have tempted me these ten times, and have not hearkened to my voice,";
web[22] = "Because all those men who have seen my glory, and my miracles, which I did in Egypt and in the wilderness, and have tempted me now these ten times, and have not hearkened to my voice;";
hnv[22] = "because all those men who have seen my glory, and my signs, which I worked in Mitzrayim and in the wilderness, yet have tempted me these ten times, and have not listened to my voice;";
vul[22] = "attamen omnes homines qui viderunt maiestatem meam et signa quae feci in Aegypto et in solitudine et temptaverunt me iam per decem vices nec oboedierunt voci meae";
kjv[23] = "And Joshua the son of Nun, and Caleb the son of Jephunneh, [which were] of them that searched the land, rent their clothes:";
rsv[23] = "shall see the land which I swore to give to their fathers; and none of those who despised me shall see it.";
asv[23] = "surely they shall not see the land which I sware unto their fathers, neither shall any of them that despised me see it:";
yng[23] = "they see not the land which I have sworn to their fathers, yea, none of those despising Me see it;";
dby[23] = "shall in no wise see the land which I did swear unto their fathers: none of them that despised me shall see it.";
web[23] = "Surely they shall not see the land which I swore to their fathers, neither shall any of them that provoked me see it:";
hnv[23] = " surely they shall not see the land which I swore to their fathers, neither shall any of those who despised me see it:";
vul[23] = "non videbunt terram pro qua iuravi patribus eorum nec quisquam ex illis qui detraxit mihi intuebitur eam";
kjv[24] = "And they spake unto all the company of the children of Israel, saying, The land, which we passed through to search it, [is] an exceeding good land.";
rsv[24] = "But my servant Caleb, because he has a different spirit and has followed me fully, I will bring into the land into which he went, and his descendants shall possess it.";
asv[24] = "but my servant Caleb, because he had another spirit with him, and hath followed me fully, him will I bring into the land whereinto he went; and his seed shall possess it.";
yng[24] = "and My servant Caleb, because there hath been another spirit with him, and he is fully after Me -- I have brought him in unto the land whither he hath entered, and his seed doth possess it.";
dby[24] = "But my servant Caleb, because he hath another spirit in him, and hath followed me fully, him will I bring into the land whereinto he came; and his seed shall possess it.";
web[24] = "But my servant Caleb, because he had another spirit with him, and hath followed me fully, him will I bring into the land into which he went; and his seed shall possess it.";
hnv[24] = "but my servant Kalev, because he had another spirit with him, and has followed me fully, him will I bring into the land into which he went; and his seed shall possess it.";
vul[24] = "servum meum Chaleb qui plenus alio spiritu secutus est me inducam in terram hanc quam circuivit et semen eius possidebit eam";
kjv[25] = "If the LORD delight in us, then he will bring us into this land, and give it us; a land which floweth with milk and honey.";
rsv[25] = "Now, since the Amal\'ekites and the Canaanites dwell in the valleys, turn tomorrow and set out for the wilderness by the way to the Red Sea.&quot;";
asv[25] = "Now the Amalekite and the Canaanite dwell in the valley: to-morrow turn ye, and get you into the wilderness by the way to the Red Sea.";
yng[25] = "`And the Amalekite and the Canaanite are dwelling in the valley; to-morrow turn ye and journey for yourselves into the wilderness -- the way of the Red Sea.\'";
dby[25] = "(Now the Amalekites and the Canaanites dwell in the valley.) To-morrow turn you, and take your journey into the wilderness, on the way to the Red sea.";
web[25] = "(Now the Amalekites, and the Canaanites dwelt in the valley.) To-morrow turn you, and pass into the wilderness, by the way of the Red sea.";
hnv[25] = "Now the `Amaleki and the Kana`ani dwell in the valley: tomorrow turn you, and get you into the wilderness by the way to the Sea of Suf.";
vul[25] = "quoniam Amalechites et Chananeus habitant in vallibus cras movete castra et revertimini in solitudinem per viam maris Rubri";
kjv[26] = "Only rebel not ye against the LORD, neither fear ye the people of the land; for they [are] bread for us: their defence is departed from them, and the LORD [is] with us: fear them not.";
rsv[26] = "And the LORD said to Moses and to Aaron,";
asv[26] = "And Jehovah spake unto Moses and unto Aaron, saying,";
yng[26] = "And Jehovah speaketh unto Moses, and unto Aaron, saying,";
dby[26] = "And Jehovah spoke to Moses and to Aaron, saying,";
web[26] = "And the LORD spoke to Moses and to Aaron, saying,";
hnv[26] = "The LORD spoke to Moshe and to Aharon, saying,";
vul[26] = "locutusque est Dominus ad Mosen et Aaron dicens";
kjv[27] = "But all the congregation bade stone them with stones. And the glory of the LORD appeared in the tabernacle of the congregation before all the children of Israel.";
rsv[27] = "&quot;How long shall this wicked congregation murmur against me? I have heard the murmurings of the people of Israel, which they murmur against me.";
asv[27] = "How long [shall I bear] with this evil congregation, that murmur against me? I have heard the murmurings of the children of Israel, which they murmur against me.";
yng[27] = "`Until when hath this evil company that which they are murmuring against Me? the murmurings of the sons of Israel, which they are murmuring against Me, I have heard;";
dby[27] = "How long [shall I bear] with this evil assembly, which murmur against me? I have heard the murmurings of the children of Israel, which they murmur against me.";
web[27] = "How long [shall I bear with] this evil congregation, which murmur against me? I have heard the murmurings of the children of Israel, which they murmur against me.";
hnv[27] = "How long [shall I bear] with this evil congregation, that murmur against me? I have heard the murmurings of the children of Yisra\'el, which they murmur against me.";
vul[27] = "usquequo multitudo haec pessima murmurat contra me querellas filiorum Israhel audivi";
kjv[28] = "And the LORD said unto Moses, How long will this people provoke me? and how long will it be ere they believe me, for all the signs which I have shewed among them?";
rsv[28] = "Say to them, \'As I live,\' says the LORD, \'what you have said in my hearing I will do to you:";
asv[28] = "Say unto them, As I live, saith Jehovah, surely as ye have spoken in mine ears, so will I do to you:";
yng[28] = "say unto them, I live -- an affirmation of Jehovah -- if, as ye have spoken in Mine ears -- so I do not to you;";
dby[28] = "Say unto them, As surely as I live, saith Jehovah, if I do not do unto you as ye have spoken in mine ears!";
web[28] = "Say to them, [As truly as] I live, saith the LORD, as ye have spoken in my ears, so will I do to you:";
hnv[28] = "Tell them, As I live, says the LORD, surely as you have spoken in my ears, so will I do to you:";
vul[28] = "dic ergo eis vivo ego ait Dominus sicut locuti estis audiente me sic faciam vobis";
kjv[29] = "I will smite them with the pestilence, and disinherit them, and will make of thee a greater nation and mightier than they.";
rsv[29] = "your dead bodies shall fall in this wilderness; and of all your number, numbered from twenty years old and upward, who have murmured against me,";
asv[29] = "your dead bodies shall fall in this wilderness; and all that were numbered of you, according to your whole number, from twenty years old and upward, that have murmured against me,";
yng[29] = "in this wilderness do your carcases fall, even all your numbered ones, to all your number, from a son of twenty years and upward, who have murmured against Me;";
dby[29] = "In this wilderness shall your carcases fall; and all that were numbered of you, according to your whole number from twenty years old and upwards, who have murmured against me,";
web[29] = "Your carcasses shall fall in this wilderness; and all that were numbered of you, according to your whole number, from twenty years old and upward, who have murmured against me,";
hnv[29] = "your dead bodies shall fall in this wilderness; and all who were numbered of you, according to your whole number, from twenty years old and upward, who have murmured against me,";
vul[29] = "in solitudine hac iacebunt cadavera vestra omnes qui numerati estis a viginti annis et supra et murmurastis contra me";
kjv[30] = "And Moses said unto the LORD, Then the Egyptians shall hear [it], (for thou broughtest up this people in thy might from among them;)";
rsv[30] = "not one shall come into the land where I swore that I would make you dwell, except Caleb the son of Jephun\'neh and Joshua the son of Nun.";
asv[30] = "surely ye shall not come into the land, concerning which I sware that I would make you dwell therein, save Caleb the son of Jephunneh, and Joshua the son of Nun.";
yng[30] = "ye -- ye come not in unto the land which I have lifted up My hand to cause you to tabernacle in it, except Caleb son of Jephunneh, and Joshua son of Nun.";
dby[30] = "shall in no wise come into the land, concerning which I have lifted up my hand to make you dwell in it; save Caleb the son of Jephunneh, and Joshua the son of Nun.";
web[30] = "Doubtless ye shall not come into the land [concerning] which I swore to make you dwell therein, save Caleb the son of Jephunneh, and Joshua the son of Nun.";
hnv[30] = "surely you shall not come into the land, concerning which I swore that I would make you dwell therein, save Kalev the son of Yefunneh, and Yehoshua the son of Nun.";
vul[30] = "non intrabitis terram super quam levavi manum meam ut habitare vos facerem praeter Chaleb filium Iepphonne et Iosue filium Nun";
kjv[31] = "And they will tell [it] to the inhabitants of this land: [for] they have heard that thou LORD [art] among this people, that thou LORD art seen face to face, and [that] thy cloud standeth over them, and [that] thou goest before them, by day time in a pillar of a cloud, and in a pillar of fire by night.";
rsv[31] = "But your little ones, who you said would become a prey, I will bring in, and they shall know the land which you have despised.";
asv[31] = "But your little ones, that ye said should be a prey, them will I bring in, and they shall know the land which ye have rejected.";
yng[31] = "`As to your infants -- of whom ye have said, A spoil they are become -- I have even brought them in, and they have known the land which ye have kicked against;";
dby[31] = "But your little ones, of whom ye said they should be a prey, them will I bring in, and they shall know the land that ye have despised.";
web[31] = "But your little ones, which ye said should be a prey, them will I bring in, and they shall know the land which ye have despised.";
hnv[31] = "But your little ones, that you said should be a prey, them will I bring in, and they shall know the land which you have rejected.";
vul[31] = "parvulos autem vestros de quibus dixistis quod praedae hostibus forent introducam ut videant terram quae vobis displicuit";
kjv[32] = "Now [if] thou shalt kill [all] this people as one man, then the nations which have heard the fame of thee will speak, saying,";
rsv[32] = "But as for you, your dead bodies shall fall in this wilderness.";
asv[32] = "But as for you, your dead bodies shall fall in this wilderness.";
yng[32] = "as to you -- your carcases do fall in this wilderness,";
dby[32] = "And as to you, your carcases shall fall in this wilderness.";
web[32] = "But [as for] you, your carcasses, they shall fall in this wilderness.";
hnv[32] = "But as for you, your dead bodies shall fall in this wilderness.";
vul[32] = "vestra cadavera iacebunt in solitudine";
kjv[33] = "Because the LORD was not able to bring this people into the land which he sware unto them, therefore he hath slain them in the wilderness.";
rsv[33] = "And your children shall be shepherds in the wilderness forty years, and shall suffer for your faithlessness, until the last of your dead bodies lies in the wilderness.";
asv[33] = "And your children shall be wanderers in the wilderness forty years, and shall bear your whoredoms, until your dead bodies be consumed in the wilderness.";
yng[33] = "and your sons are evil in the wilderness forty years, and have borne your whoredoms till your carcases are consumed in the wilderness;";
dby[33] = "And your children shall wander in the wilderness forty years, and bear your whoredoms, until your carcases be wasted in the wilderness.";
web[33] = "And your children shall wander in the wilderness forty years, and bear your lewd deeds, until your carcasses shall be wasted in the wilderness.";
hnv[33] = "Your children shall be wanderers in the wilderness forty years, and shall bear your prostitution, until your dead bodies be consumed in the wilderness.";
vul[33] = "filii vestri erunt vagi in deserto annis quadraginta et portabunt fornicationem vestram donec consumantur cadavera patrum in deserto";
kjv[34] = "And now, I beseech thee, let the power of my Lord be great, according as thou hast spoken, saying,";
rsv[34] = "According to the number of the days in which you spied out the land, forty days, for every day a year, you shall bear your iniquity, forty years, and you shall know my displeasure.\'";
asv[34] = "After the number of the days in which ye spied out the land, even forty days, for every day a year, shall ye bear your iniquities, even forty years, and ye shall know my alienation.";
yng[34] = "by the number of the days [in] which ye spied the land, forty days, -- a day for a year, a day for a year -- ye do bear your iniquities, forty years, and ye have known my breaking off;";
dby[34] = "After the number of the days in which ye have searched out the land, forty days, each day for a year shall ye bear your iniquities forty years, and ye shall know mine estrangement [from you].";
web[34] = "After the number of the days in which ye searched the land, [even] forty days (each day for a year) shall ye bear your iniquities, [even] forty years, and ye shall know my breach of promise.";
hnv[34] = "After the number of the days in which you spied out the land, even forty days, for every day a year, shall you bear your iniquities, even forty years, and you shall know my alienation.";
vul[34] = "iuxta numerum quadraginta dierum quibus considerastis terram annus pro die inputabitur et quadraginta annis recipietis iniquitates vestras et scietis ultionem meam";
kjv[35] = "The LORD [is] longsuffering, and of great mercy, forgiving iniquity and transgression, and by no means clearing [the guilty], visiting the iniquity of the fathers upon the children unto the third and fourth [generation].";
rsv[35] = "I, the LORD, have spoken; surely this will I do to all this wicked congregation that are gathered together against me: in this wilderness they shall come to a full end, and there they shall die.&quot;";
asv[35] = "I, Jehovah, have spoken, surely this will I do unto all this evil congregation, that are gathered together against me: in this wilderness they shall be consumed, and there they shall die.";
yng[35] = "I [am] Jehovah, I have spoken; if I do not this to all this evil company who are meeting against me; -- in this wilderness they are consumed, and there they die.\'";
dby[35] = "I Jehovah have spoken; I will surely do it unto all this evil assembly which have gathered together against me! in this wilderness they shall be consumed, and there they shall die.";
web[35] = "I the LORD have said, I will surely do it to all this evil congregation, that are gathered against me: in this wilderness, they shall be consumed, and there they shall die.";
hnv[35] = "I, the LORD, have spoken, surely this will I do to all this evil congregation, who are gathered together against me: in this wilderness they shall be consumed, and there they shall die.";
vul[35] = "quoniam sicut locutus sum ita faciam omni multitudini huic pessimae quae consurrexit adversum me in solitudine hac deficiet et morietur";
kjv[36] = "Pardon, I beseech thee, the iniquity of this people according unto the greatness of thy mercy, and as thou hast forgiven this people, from Egypt even until now.";
rsv[36] = "And the men whom Moses sent to spy out the land, and who returned and made all the congregation to murmur against him by bringing up an evil report against the land,";
asv[36] = "And the men, whom Moses sent to spy out the land, who returned, and made all the congregation to murmur against him, by bringing up an evil report against the land,";
yng[36] = "And the men whom Moses hath sent to spy the land, and they turn back and cause all the company to murmur against him, by bringing out an evil account concerning the land,";
dby[36] = "And the men whom Moses had sent to search out the land, who returned, and made the whole assembly to murmur against him, by bringing up an evil report upon the land,";
web[36] = "And the men whom Moses sent to search the land, who returned, and made all the congregation to murmur against him, by bringing a slander upon the land,";
hnv[36] = "The men, whom Moshe sent to spy out the land, who returned, and made all the congregation to murmur against him, by bringing up an evil report against the land,";
vul[36] = "igitur omnes viri quos miserat Moses ad contemplandam terram et qui reversi murmurare fecerant contra eum omnem multitudinem detrahentes terrae quod esset mala";
kjv[37] = "And the LORD said, I have pardoned according to thy word:";
rsv[37] = "the men who brought up an evil report of the land, died by plague before the LORD.";
asv[37] = "even those men that did bring up an evil report of the land, died by the plague before Jehovah.";
yng[37] = "even the men bringing out an evil account of the land die by the plague before Jehovah;";
dby[37] = "even those men who had brought up an evil report upon the land, died by a plague before Jehovah.";
web[37] = "Even those men that brought the evil report upon the land, died by the plague before the LORD.";
hnv[37] = " even those men who did bring up an evil report of the land, died by the plague before the LORD.";
vul[37] = "mortui sunt atque percussi in conspectu Domini";
kjv[38] = "But [as] truly [as] I live, all the earth shall be filled with the glory of the LORD.";
rsv[38] = "But Joshua the son of Nun and Caleb the son of Jephun\'neh remained alive, of those men who went to spy out the land.";
asv[38] = "But Joshua the son of Nun, and Caleb the son of Jephunneh, remained alive of those men that went to spy out the land.";
yng[38] = "and Joshua son of Nun, and Caleb son of Jephunneh, have lived of those men who go to spy out the land.";
dby[38] = "But Joshua the son of Nun, and Caleb the son of Jephunneh, lived still of the men that had gone to search out the land.";
web[38] = "But Joshua the son of Nun, and Caleb the son of Jephunneh, [who were] of the men that went to search the land, lived [still].";
hnv[38] = "But Yehoshua the son of Nun, and Kalev the son of Yefunneh, remained alive of those men who went to spy out the land.";
vul[38] = "Iosue autem filius Nun et Chaleb filius Iepphonne vixerunt ex omnibus qui perrexerant ad considerandam terram";
kjv[39] = "Because all those men which have seen my glory, and my miracles, which I did in Egypt and in the wilderness, and have tempted me now these ten times, and have not hearkened to my voice;";
rsv[39] = "And Moses told these words to all the people of Israel, and the people mourned greatly.";
asv[39] = "And Moses told these words unto all the children of Israel: and the people mourned greatly.";
yng[39] = "And Moses speaketh these words unto all the sons of Israel, and the people mourn exceedingly,";
dby[39] = "And Moses told all these sayings to all the children of Israel; then the people mourned greatly.";
web[39] = "And Moses told these sayings to all the children of Israel: and the people mourned greatly.";
hnv[39] = "Moshe told these words to all the children of Yisra\'el: and the people mourned greatly.";
vul[39] = "locutusque est Moses universa verba haec ad omnes filios Israhel et luxit populus nimis";
kjv[40] = "Surely they shall not see the land which I sware unto their fathers, neither shall any of them that provoked me see it:";
rsv[40] = "And they rose early in the morning, and went up to the heights of the hill country, saying, &quot;See, we are here, we will go up to the place which the LORD has promised; for we have sinned.&quot;";
asv[40] = "And they rose up early in the morning, and gat them up to the top of the mountain, saying, Lo, we are here, and will go up unto the place which Jehovah hath promised: for we have sinned.";
yng[40] = "and they rise early in the morning, and go up unto the top of the mountain, saying, `Here we [are], and we have come up unto the place which Jehovah hath spoken of, for we have sinned.\'";
dby[40] = "And they rose up early in the morning, and went up to the hill-top, saying, Here are we, and we will go up to the place of which Jehovah has spoken; for we have sinned.";
web[40] = "And they rose early in the morning, and ascended to the top of the mountain, saying, Lo, we [are here], and will go up to the place which the LORD hath promised: for we have sinned.";
hnv[40] = "They rose up early in the morning, and got them up to the top of the mountain, saying, Behold, we are here, and will go up to the place which the LORD has promised: for we have sinned.";
vul[40] = "et ecce mane primo surgentes ascenderunt verticem montis atque dixerunt parati sumus ascendere ad locum de quo Dominus locutus est quia peccavimus";
kjv[41] = "But my servant Caleb, because he had another spirit with him, and hath followed me fully, him will I bring into the land whereinto he went; and his seed shall possess it.";
rsv[41] = "But Moses said, &quot;Why now are you transgressing the command of the LORD, for that will not succeed?";
asv[41] = "And Moses said, Wherefore now do ye transgress the commandment of Jehovah, seeing it shall not prosper?";
yng[41] = "And Moses saith, `Why [is] this? -- ye are transgressing the command of Jehovah, and it doth not prosper;";
dby[41] = "And Moses said, Why now do ye transgress the commandment of Jehovah? but it shall not prosper!";
web[41] = "And Moses said, Why now do ye transgress the commandment of the LORD? but it shall not prosper.";
hnv[41] = "Moshe said, Why now do you disobey the mitzvah of the LORD, seeing it shall not prosper?";
vul[41] = "quibus Moses cur inquit transgredimini verbum Domini quod vobis non cedet in prosperum";
kjv[42] = "(Now the Amalekites and the Canaanites dwelt in the valley.) To morrow turn you, and get you into the wilderness by the way of the Red sea.";
rsv[42] = "Do not go up lest you be struck down before your enemies, for the LORD is not among you.";
asv[42] = "Go not up, for Jehovah is not among you; that ye be not smitten down before your enemies.";
yng[42] = "go not up, for Jehovah is not in your midst, and ye are not smitten before your enemies;";
dby[42] = "Go not up, for Jehovah is not among you; that ye be not smitten before your enemies;";
web[42] = "Go not up, for the LORD is not among you; that ye be not smitten before your enemies.";
hnv[42] = " Don\'t go up, for the LORD isn\'t among you; that you not be struck down before your enemies.";
vul[42] = "nolite ascendere non enim est Dominus vobiscum ne corruatis coram inimicis vestris";
kjv[43] = "And the LORD spake unto Moses and unto Aaron, saying,";
rsv[43] = "For there the Amal\'ekites and the Canaanites are before you, and you shall fall by the sword; because you have turned back from following the LORD, the LORD will not be with you.&quot;";
asv[43] = "For there the Amalekite and the Canaanite are before you, and ye shall fall by the sword: because ye are turned back from following Jehovah, therefore Jehovah will not be with you.";
yng[43] = "for the Amalekite and the Canaanite [are] there before you, and ye have fallen by the sword, because that ye have turned back from after Jehovah, and Jehovah is not with you.\'";
dby[43] = "for the Amalekites and the Canaanites are there before you, and ye shall fall by the sword; for as ye have turned away from Jehovah, Jehovah will not be with you.";
web[43] = "For the Amalekites and the Canaanites [are] there before you, and ye shall fall by the sword: because ye are turned away from the LORD, therefore the LORD will not be with you.";
hnv[43] = "For there the `Amaleki and the Kana`ani are before you, and you shall fall by the sword: because you are turned back from following the LORD, therefore the LORD will not be with you.";
vul[43] = "Amalechites et Chananeus ante vos sunt quorum gladio corruetis eo quod nolueritis adquiescere Domino nec erit Dominus vobiscum";
kjv[44] = "How long [shall I bear with] this evil congregation, which murmur against me? I have heard the murmurings of the children of Israel, which they murmur against me.";
rsv[44] = "But they presumed to go up to the heights of the hill country, although neither the ark of the covenant of the LORD, nor Moses, departed out of the camp.";
asv[44] = "But they presumed to go up to the top of the mountain: nevertheless the ark of the covenant of Jehovah, and Moses, departed not out of the camp.";
yng[44] = "And they presume to go up unto the top of the mountain, and the ark of the covenant of Jehovah and Moses have not departed out of the midst of the camp.";
dby[44] = "Yet they presumed to go up to the hill-top; but the ark of the covenant of Jehovah, and Moses, did not depart from the midst of the camp.";
web[44] = "But they presumed to go up to the hill-top: nevertheless the ark of the covenant of the LORD, and Moses, departed not out of the camp.";
hnv[44] = "But they presumed to go up to the top of the mountain: nevertheless the ark of the covenant of the LORD, and Moshe, didn\'t depart out of the camp.";
vul[44] = "at illi contenebrati ascenderunt in verticem montis arca autem testamenti Domini et Moses non recesserunt de castris";
kjv[45] = "Say unto them, [As truly as] I live, saith the LORD, as ye have spoken in mine ears, so will I do to you:";
rsv[45] = "Then the Amal\'ekites and the Canaanites who dwelt in that hill country came down, and defeated them and pursued them, even to Hormah.";
asv[45] = "Then the Amalekite came down, and the Canaanite who dwelt in that mountain, and smote them and beat them down, even unto Hormah.";
yng[45] = "And the Amalekite and the Canaanite who are dwelling in that mountain come down and smite them, and beat them down -- unto Hormah.";
dby[45] = "And the Amalekites and the Canaanites who dwelt on that hill, came down and smote them, and cut them to pieces, as far as Hormah.";
web[45] = "Then the Amalekites came down, and the Canaanites which dwelt in that hill, and smote them, and discomfited them, [even] to Hormah.";
hnv[45] = "Then the `Amaleki came down, and the Kana`ani who lived in that mountain, and struck them and beat them down, even to Hormah.";
vul[45] = "descenditque Amalechites et Chananeus qui habitabant in monte et percutiens eos atque concidens persecutus est usque Horma";
csb[1] = "Then the whole community broke into loud cries, and the people wept that night.";
csb[2] = "All the Israelites complained about Moses and Aaron, and the whole community told them, &quot;If only we had died in the land of Egypt, or if only we had died in this wilderness!";
csb[3] = "&quot;Why is the LORD bringing us into this land to die by the sword? Our wives and children will become plunder. Wouldn\'t it be better for us to go back to Egypt? &quot;";
csb[4] = "So they said to one another, &quot;Let\'s appoint a leader and go back to Egypt.&quot;";
csb[5] = "Then Moses and Aaron fell facedown in front of the whole assembly of the Israelite community.";
csb[6] = "Joshua son of Nun and Caleb son of Jephunneh, who were among those who scouted out the land, tore their clothes";
csb[7] = "and said to the entire Israelite community: &quot;The land we passed through and explored is an extremely good land.";
csb[8] = "&quot;If the LORD is pleased with us, he will bring us into this land, a land flowing with milk and honey, and give it to us.";
csb[9] = "&quot;Only don\'t rebel against the LORD, and don\'t be afraid of the people of the land, for we will devour them. Their protection has been removed from them, and the LORD is with us. Don\'t be afraid of them! &quot;";
csb[10] = "While the whole community threatened to stone them, the glory of the LORD appeared to all the Israelites at the tent of meeting.";
csb[11] = "The LORD said to Moses, &quot;How long will these people despise me? How long will they not trust in me despite all the signs I have performed among them?";
csb[12] = "&quot;I will strike them with a plague and destroy them. Then I will make you into a greater and mightier nation than they are.&quot;";
csb[13] = "But Moses replied to the LORD, &quot;The Egyptians will hear about it, for by your strength you brought up this people from them.";
csb[14] = "&quot;They will tell it to the inhabitants of this land. They have heard that you, LORD, are among these people, how you, LORD, are seen face to face, how your cloud stands over them, and how you go before them in a pillar of cloud by day and in a pillar of fire by night.";
csb[15] = "&quot;If you kill this people with a single blow, the nations that have heard of your fame will declare,";
csb[16] = "&quot;\'Since the LORD wasn\'t able to bring this people into the land he swore to give them, he has slaughtered them in the wilderness.\'";
csb[17] = "&quot;So now, may my Lord\'s power be magnified just as you have spoken:";
csb[18] = "&quot;The LORD is slow to anger and abounding in faithful love, forgiving iniquity and rebellion. But he will not leave the guilty unpunished, bringing the consequences of the fathers\' iniquity on the children to the third and fourth generation.";
csb[19] = "&quot;Please pardon the iniquity of this people, in keeping with the greatness of your faithful love, just as you have forgiven them from Egypt until now.&quot;";
csb[20] = "The LORD responded, &quot;I have pardoned them as you requested.";
csb[21] = "&quot;Yet as surely as I live and as the whole earth is filled with the LORD\'s glory,";
csb[22] = "&quot;none of the men who have seen my glory and the signs I performed in Egypt and in the wilderness, and have tested me these ten times and did not obey me,";
csb[23] = "&quot;will ever see the land I swore to give their fathers. None of those who have despised me will see it.";
csb[24] = "&quot;But since my servant Caleb has a different spirit and has remained loyal to me, I will bring him into the land where he has gone, and his descendants will inherit it.";
csb[25] = "&quot;Since the Amalekites and Canaanites are living in the lowlands, turn back tomorrow and head for the wilderness in the direction of the Red Sea.&quot;";
csb[26] = "Then the LORD spoke to Moses and Aaron:";
csb[27] = "&quot;How long must I endure this evil community that keeps complaining about me? I have heard the Israelites\' complaints that they make against me.";
csb[28] = "&quot;Tell them: As surely as I live -- this is the LORD\'s declaration -- I will do to you exactly as I heard you say.";
csb[29] = "&quot;Your corpses will fall in this wilderness -- all of you who were registered in the census, the entire number of you twenty years old or more -- because you have complained about me.";
csb[30] = "&quot;I swear that none of you will enter the land I promised to settle you in, except Caleb son of Jephunneh and Joshua son of Nun.";
csb[31] = "&quot;I will bring your children whom you said would become plunder into the land you rejected, and they will enjoy it.";
csb[32] = "&quot;But as for you, your corpses will fall in this wilderness.";
csb[33] = "&quot;Your children will be shepherds in the wilderness for forty years and bear the penalty for your acts of unfaithfulness until all your corpses lie scattered in the wilderness.";
csb[34] = "&quot;You will bear the consequences of your iniquities forty years based on the number of the forty days that you scouted the land, a year for each day. You will know my displeasure.";
csb[35] = "&quot;I, the LORD, have spoken. I swear that I will do this to the entire evil community that has conspired against me. They will come to an end in the wilderness, and there they will die.&quot;";
csb[36] = "So the men Moses sent to scout out the land, and who returned and incited the entire community to complain about him by spreading a negative report about the land --";
csb[37] = "those men who spread the negative report about the land were struck down by the LORD.";
csb[38] = "Only Joshua son of Nun and Caleb son of Jephunneh remained alive of those men who went to scout out the land.";
csb[39] = "When Moses reported these words to all the Israelites, the people were overcome with grief.";
csb[40] = "They got up early the next morning and went up the ridge of the hill country, saying, &quot;Let\'s go to the place the LORD promised, for we were wrong.&quot;";
csb[41] = "But Moses responded, &quot;Why are you going against the LORD\'s command? It won\'t succeed.";
csb[42] = "&quot;Don\'t go, because the LORD is not among you and you will be defeated by your enemies.";
csb[43] = "&quot;The Amalekites and Canaanites are right in front of you, and you will fall by the sword. The LORD won\'t be with you, since you have turned from following him.&quot;";
csb[44] = "But they dared to go up the ridge of the hill country, even though the ark of the LORD\'s covenant and Moses did not leave the camp.";
csb[45] = "Then the Amalekites and Canaanites who lived in that part of the hill country came down, attacked them, and routed them as far as Hormah.";
kjv[1] = "And all the congregation lifted up their voice, and cried; and the people wept that night.";
kjv[2] = "And all the children of Israel murmured against Moses and against Aaron: and the whole congregation said unto them, Would God that we had died in the land of Egypt! or would God we had died in this wilderness!";
kjv[3] = "And wherefore hath the LORD brought us unto this land, to fall by the sword, that our wives and our children should be a prey? were it not better for us to return into Egypt?";
kjv[4] = "And they said one to another, Let us make a captain, and let us return into Egypt.";
kjv[5] = "Then Moses and Aaron fell on their faces before all the assembly of the congregation of the children of Israel.";
kjv[6] = "And Joshua the son of Nun, and Caleb the son of Jephunneh, [which were] of them that searched the land, rent their clothes:";
kjv[7] = "And they spake unto all the company of the children of Israel, saying, The land, which we passed through to search it, [is] an exceeding good land.";
kjv[8] = "If the LORD delight in us, then he will bring us into this land, and give it us; a land which floweth with milk and honey.";
kjv[9] = "Only rebel not ye against the LORD, neither fear ye the people of the land; for they [are] bread for us: their defence is departed from them, and the LORD [is] with us: fear them not.";
kjv[10] = "But all the congregation bade stone them with stones. And the glory of the LORD appeared in the tabernacle of the congregation before all the children of Israel.";
kjv[11] = "And the LORD said unto Moses, How long will this people provoke me? and how long will it be ere they believe me, for all the signs which I have shewed among them?";
kjv[12] = "I will smite them with the pestilence, and disinherit them, and will make of thee a greater nation and mightier than they.";
kjv[13] = "And Moses said unto the LORD, Then the Egyptians shall hear [it], (for thou broughtest up this people in thy might from among them;)";
kjv[14] = "And they will tell [it] to the inhabitants of this land: [for] they have heard that thou LORD [art] among this people, that thou LORD art seen face to face, and [that] thy cloud standeth over them, and [that] thou goest before them, by day time in a pillar of a cloud, and in a pillar of fire by night.";
kjv[15] = "Now [if] thou shalt kill [all] this people as one man, then the nations which have heard the fame of thee will speak, saying,";
kjv[16] = "Because the LORD was not able to bring this people into the land which he sware unto them, therefore he hath slain them in the wilderness.";
kjv[17] = "And now, I beseech thee, let the power of my Lord be great, according as thou hast spoken, saying,";
kjv[18] = "The LORD [is] longsuffering, and of great mercy, forgiving iniquity and transgression, and by no means clearing [the guilty], visiting the iniquity of the fathers upon the children unto the third and fourth [generation].";
kjv[19] = "Pardon, I beseech thee, the iniquity of this people according unto the greatness of thy mercy, and as thou hast forgiven this people, from Egypt even until now.";
kjv[20] = "And the LORD said, I have pardoned according to thy word:";
kjv[21] = "But [as] truly [as] I live, all the earth shall be filled with the glory of the LORD.";
kjv[22] = "Because all those men which have seen my glory, and my miracles, which I did in Egypt and in the wilderness, and have tempted me now these ten times, and have not hearkened to my voice;";
kjv[23] = "Surely they shall not see the land which I sware unto their fathers, neither shall any of them that provoked me see it:";
kjv[24] = "But my servant Caleb, because he had another spirit with him, and hath followed me fully, him will I bring into the land whereinto he went; and his seed shall possess it.";
kjv[25] = "(Now the Amalekites and the Canaanites dwelt in the valley.) To morrow turn you, and get you into the wilderness by the way of the Red sea.";
kjv[26] = "And the LORD spake unto Moses and unto Aaron, saying,";
kjv[27] = "How long [shall I bear with] this evil congregation, which murmur against me? I have heard the murmurings of the children of Israel, which they murmur against me.";
kjv[28] = "Say unto them, [As truly as] I live, saith the LORD, as ye have spoken in mine ears, so will I do to you:";
kjv[29] = "Your carcases shall fall in this wilderness; and all that were numbered of you, according to your whole number, from twenty years old and upward, which have murmured against me,";
kjv[30] = "Doubtless ye shall not come into the land, [concerning] which I sware to make you dwell therein, save Caleb the son of Jephunneh, and Joshua the son of Nun.";
kjv[31] = "But your little ones, which ye said should be a prey, them will I bring in, and they shall know the land which ye have despised.";
kjv[32] = "But [as for] you, your carcases, they shall fall in this wilderness.";
kjv[33] = "And your children shall wander in the wilderness forty years, and bear your whoredoms, until your carcases be wasted in the wilderness.";
kjv[34] = "After the number of the days in which ye searched the land, [even] forty days, each day for a year, shall ye bear your iniquities, [even] forty years, and ye shall know my breach of promise.";
kjv[35] = "I the LORD have said, I will surely do it unto all this evil congregation, that are gathered together against me: in this wilderness they shall be consumed, and there they shall die.";
kjv[36] = "And the men, which Moses sent to search the land, who returned, and made all the congregation to murmur against him, by bringing up a slander upon the land,";
kjv[37] = "Even those men that did bring up the evil report upon the land, died by the plague before the LORD.";
kjv[38] = "But Joshua the son of Nun, and Caleb the son of Jephunneh, [which were] of the men that went to search the land, lived [still].";
kjv[39] = "And Moses told these sayings unto all the children of Israel: and the people mourned greatly.";
kjv[40] = "And they rose up early in the morning, and gat them up into the top of the mountain, saying, Lo, we [be here], and will go up unto the place which the LORD hath promised: for we have sinned.";
kjv[41] = "And Moses said, Wherefore now do ye transgress the commandment of the LORD? but it shall not prosper.";
kjv[42] = "Go not up, for the LORD [is] not among you; that ye be not smitten before your enemies.";
kjv[43] = "For the Amalekites and the Canaanites [are] there before you, and ye shall fall by the sword: because ye are turned away from the LORD, therefore the LORD will not be with you.";
kjv[44] = "But they presumed to go up unto the hill top: nevertheless the ark of the covenant of the LORD, and Moses, departed not out of the camp.";
kjv[45] = "Then the Amalekites came down, and the Canaanites which dwelt in that hill, and smote them, and discomfited them, [even] unto Hormah.";
</script>
