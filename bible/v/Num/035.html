csb[1] = "The LORD again spoke to Moses in the plains of Moab by the Jordan across from Jericho:";
csb[2] = "&quot;Command the Israelites to give cities out of their hereditary property for the Levites to live in and pastureland around the cities.";
csb[3] = "&quot;The cities will be for them to live in, and their pasturelands will be for their herds, flocks, and all their other animals.";
csb[4] = "&quot;The pasturelands of the cities you are to give the Levites will extend from the city wall five hundred yards on every side.";
csb[5] = "&quot;Measure a thousand yards outside the city for the east side, a thousand yards for the south side, a thousand yards for the west side, and a thousand yards for the north side, with the city in the center. This will belong to them as pasturelands for the cities.";
csb[6] = "&quot;The cities you give the Levites will include six cities of refuge, which you will provide so that the one who kills someone may flee there; in addition to these, give forty-two other cities.";
csb[7] = "&quot;The total number of cities you give the Levites will be forty-eight, along with their pasturelands.";
csb[8] = "&quot;Of the cities that you give from the Israelites\' territory, you should take more from a larger tribe and less from a smaller one. Each tribe is to give some of its cities to the Levites in proportion to the inheritance it receives.&quot;";
csb[9] = "The LORD said to Moses,";
csb[10] = "&quot;Speak to the Israelites and tell them: When you cross the Jordan into the land of Canaan,";
csb[11] = "&quot;designate cities to serve as cities of refuge for you, so that a person who kills someone unintentionally may flee there.";
csb[12] = "&quot;You will have the cities as a refuge from the avenger, so that the one who kills someone will not die until he stands trial before the assembly.";
csb[13] = "&quot;The cities you select will be your six cities of refuge.";
csb[14] = "&quot;Select three cities across the Jordan and three cities in the land of Canaan to be cities of refuge.";
csb[15] = "&quot;These six cities will serve as a refuge for the Israelites and for the alien or temporary resident among them, so that anyone who kills a person unintentionally may flee there.";
csb[16] = "&quot;If anyone strikes a person with an iron object and death results, he is a murderer; the murderer must be put to death.";
csb[17] = "&quot;If anyone has in his hand a stone capable of causing death and strikes another person and he dies, the murderer must be put to death.";
csb[18] = "&quot;If anyone has in his hand a wooden object capable of causing death and strikes another person and he dies, the murderer must be put to death.";
csb[19] = "&quot;The avenger of blood himself is to kill the murderer; when he finds him, he is to kill him.";
csb[20] = "&quot;Likewise, if anyone in hatred pushes a person or throws an object at him with malicious intent and he dies,";
csb[21] = "&quot;or if in hostility he strikes him with his hand and he dies, the one who struck him must be put to death; he is a murderer. The avenger of blood is to kill the murderer when he finds him.";
csb[22] = "&quot;But if anyone suddenly pushes a person without hostility or throws any object at him without malicious intent";
csb[23] = "&quot;or without looking drops a stone that could kill a person and he dies, but he was not his enemy and didn\'t intend to harm him,";
csb[24] = "&quot;the assembly is to judge between the person who kills someone and the avenger of blood according to these ordinances.";
csb[25] = "&quot;The assembly is to protect the one who kills someone from the avenger of blood. Then the assembly will return him to the city of refuge he fled to, and he must live there until the death of the high priest who was anointed with the holy oil.";
csb[26] = "&quot;If the one who kills someone ever goes outside the border of the city of refuge he fled to,";
csb[27] = "&quot;and the avenger of blood finds him outside the border of his city of refuge and kills him, the avenger will not be guilty of bloodshed,";
csb[28] = "&quot;for the one who killed a person was supposed to live in his city of refuge until the death of the high priest. Only after the death of the high priest may the one who has killed a person return to the land he possesses.";
csb[29] = "&quot;These instructions will be a statutory ordinance for you throughout your generations wherever you live.";
csb[30] = "&quot;If anyone kills a person, the murderer is to be put to death based on the word of witnesses. But no one is to be put to death based on the testimony of one witness.";
csb[31] = "&quot;You are not to accept a ransom for the life of someone who is guilty of murder; he must be put to death.";
csb[32] = "&quot;Neither should you accept a ransom for the person who flees to his city of refuge, allowing him to return and live in the land before the death of the high priest.";
csb[33] = "&quot;Do not defile the land where you live, for bloodshed defiles the land, and there can be no atonement for the land because of the blood that is shed on it, except by the blood of the person who shed it.";
csb[34] = "&quot;Do not make the land unclean where you live and where I dwell; for I, the LORD, reside among the Israelites.&quot;";
