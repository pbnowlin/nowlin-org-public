kjv[29] = "And Moses said unto them, If the children of Gad and the children of Reuben will pass with you over Jordan, every man armed to battle, before the LORD, and the land shall be subdued before you; then ye shall give them the land of Gilead for a possession:";
rsv[29] = "And Moses said to them, &quot;If the sons of Gad and the sons of Reuben, every man who is armed to battle before the LORD, will pass with you over the Jordan and the land shall be subdued before you, then you shall give them the land of Gilead for a possession;";
asv[29] = "And Moses said unto them, If the children of Gad and the children of Reuben will pass with you over the Jordan, every man that is armed to battle, before Jehovah, and the land shall be subdued before you; then ye shall give them the land of Gilead for a possession:";
yng[29] = "and Moses saith unto them, `If the sons of Gad and the sons of Reuben pass over with you the Jordan, every one armed for battle, before Jehovah, and the land hath been subdued before you, then ye have given to them the land of Gilead for a possession;";
dby[29] = "And Moses said unto them, If the children of Gad and the children of Reuben pass with you over the Jordan, every one armed for battle, before Jehovah, and the land be subdued before you, then ye shall give them the land of Gilead for a possession;";

hnv[29] = "Moshe said to them, If the children of Gad and the children of Re\'uven will pass with you over the Yarden, every man who is armed to battle, before the LORD, and the land shall be subdued before you; then you shall give them the land of Gil`ad for a possession:";
vul[29] = "si transierint filii Gad et filii Ruben vobiscum Iordanem omnes armati ad bellum coram Domino et vobis fuerit terra subiecta date eis Galaad in possessionem";

kjv[33] = "And Moses gave unto them, [even] to the children of Gad, and to the children of Reuben, and unto half the tribe of Manasseh the son of Joseph, the kingdom of Sihon king of the Amorites, and the kingdom of Og king of Bashan, the land, with the cities thereof in the coasts, [even] the cities of the country round about.";
rsv[33] = "And Moses gave to them, to the sons of Gad and to the sons of Reuben and to the half-tribe of Manas\'seh the son of Joseph, the kingdom of Sihon king of the Amorites and the kingdom of Og king of Bashan, the land and its cities with their territories, the cities of the land throughout the country.";

yng[33] = "And Moses giveth to them, to the sons of Gad, and to the sons of Reuben, and to the half of the tribe of Manasseh son of Joseph, the kingdom of Sihon king of the Amorite, and the kingdom of Og king of Bashan, the land by its cities, in the borders, the cities of the land round about.";
dby[33] = "And Moses gave to them, to the children of Gad, and to the children of Reuben, and to half the tribe of Manasseh the son of Joseph, the kingdom of Sihon king of the Amorites, and the kingdom of Og the king of Bashan, the land, according to its cities and territories, the cities of the land round about.";
web[33] = "And Moses gave to them, [even] to the children of Gad, and to the children of Reuben, and to half the tribe of Manasseh the son of Joseph, the kingdom of Sihon king of the Amorites, and the kingdom of Og king of Bashan, the land, with its cities in the borders, [even] the cities of the country around.";

csb[1] = "The Reubenites and Gadites had a very large number of livestock. When they surveyed the lands of Jazer and Gilead, they saw that the region was a good one for livestock.";
csb[2] = "So the Gadites and Reubenites came to Moses, the priest Eleazar, and the leaders of the community and said:";
csb[3] = "&quot;The territory of Ataroth, Dibon, Jazer, Nimrah, Heshbon, Elealeh, Sebam, Nebo, and Beon,";
csb[4] = "&quot;which the LORD struck down before the community of Israel, is good land for livestock, and your servants own livestock.&quot;";
csb[5] = "They said, &quot;If we have found favor with you, let this land be given to your servants as a possession. Don\'t make us cross the Jordan.&quot;";
csb[6] = "But Moses asked the Gadites and Reubenites, &quot;Should your brothers go to war while you stay here?";
csb[7] = "&quot;Why are you discouraging the Israelites from crossing into the land the LORD has given them?";
csb[8] = "&quot;That\'s what your fathers did when I sent them from Kadesh-barnea to see the land.";
csb[9] = "&quot;After they went up as far as Eshcol Valley and saw the land, they discouraged the Israelites from entering the land the LORD had given them.";
csb[10] = "&quot;So the LORD\'s anger burned that day, and he swore an oath:";
csb[11] = "&quot;\'Because they did not remain loyal to me, none of the men twenty years old or more who came up from Egypt will see the land I swore to give Abraham, Isaac, and Jacob --";
csb[12] = "&quot;none except Caleb son of Jephunneh the Kenizzite and Joshua son of Nun, because they did remain loyal to the LORD.\'";
csb[13] = "&quot;The LORD\'s anger burned against Israel, and he made them wander in the wilderness forty years until the whole generation that had done what was evil in the LORD\'s sight was gone.";
csb[14] = "&quot;And here you, a brood of sinners, stand in your fathers\' place adding even more to the LORD\'s burning anger against Israel.";
csb[15] = "&quot;If you turn back from following him, he will once again leave this people in the wilderness, and you will destroy all of them.&quot;";
csb[16] = "Then they approached him and said, &quot;We want to build sheep pens here for our livestock and cities for our dependents.";
csb[17] = "&quot;But we will arm ourselves and be ready to go ahead of the Israelites until we have brought them into their place. Meanwhile, our dependents will remain in the fortified cities because of the inhabitants of the land.";
csb[18] = "&quot;We will not return to our homes until each of the Israelites has taken possession of his inheritance.";
csb[19] = "&quot;Yet we will not have an inheritance with them across the Jordan and beyond, because our inheritance will be across the Jordan to the east.&quot;";
csb[20] = "Moses replied to them, &quot;If you do this -- if you arm yourselves for battle before the LORD,";
csb[21] = "&quot;and every one of your armed men crosses the Jordan before the LORD until he has driven his enemies from his presence,";
csb[22] = "&quot;and the land is subdued before the LORD -- afterward you may return and be free from obligation to the LORD and to Israel. And this land will belong to you as a possession before the LORD.";
csb[23] = "&quot;But if you don\'t do this, you will certainly sin against the LORD; be sure your sin will catch up with you.";
csb[24] = "&quot;Build cities for your dependents and pens for your flocks, but do what you have promised.&quot;";
csb[25] = "The Gadites and Reubenites answered Moses, &quot;Your servants will do just as my lord commands.";
csb[26] = "&quot;Our dependents, wives, livestock, and all our animals will remain here in the cities of Gilead,";
csb[27] = "&quot;but your servants are equipped for war before the LORD and will go across to the battle as my lord orders.&quot;";
csb[28] = "So Moses gave orders about them to the priest Eleazar, Joshua son of Nun, and the family heads of the Israelite tribes.";
csb[29] = "Moses told them, &quot;If the Gadites and Reubenites cross the Jordan with you, every man in battle formation before the LORD, and the land is subdued before you, you are to give them the land of Gilead as a possession.";
csb[30] = "&quot;But if they don\'t go across with you in battle formation, they must accept land in Canaan with you.&quot;";
csb[31] = "The Gadites and Reubenites replied, &quot;What the LORD has spoken to your servants is what we will do.";
csb[32] = "&quot;We will cross over in battle formation before the LORD into the land of Canaan, but we will keep our hereditary possession across the Jordan.&quot;";
csb[33] = "So Moses gave them -- the Gadites, Reubenites, and half the tribe of Manasseh son of Joseph -- the kingdom of King Sihon of the Amorites and the kingdom of King Og of Bashan, the land including its cities with the territories surrounding them.";
csb[34] = "The Gadites rebuilt Dibon, Ataroth, Aroer,";
csb[35] = "Atroth-shophan, Jazer, Jogbehah,";
csb[36] = "Beth-nimrah, and Beth-haran as fortified cities, and built sheep pens.";
csb[37] = "The Reubenites rebuilt Heshbon, Elealeh, Kiriathaim,";
csb[38] = "as well as Nebo and Baal-meon (whose names were changed), and Sibmah. They gave names to the cities they rebuilt.";
csb[39] = "The descendants of Machir son of Manasseh went to Gilead, captured it, and drove out the Amorites who were there.";
csb[40] = "So Moses gave Gilead to the clan of Machir son of Manasseh, and they settled in it.";
csb[41] = "Jair, a descendant of Manasseh, went and captured their villages, which he renamed Jair\'s Villages.";
csb[42] = "Nobah went and captured Kenath with its surrounding villages and called it Nobah after his own name.";
