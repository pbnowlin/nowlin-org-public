kjv[5] = "And Balaam said unto the ass, Because thou hast mocked me: I would there were a sword in mine hand, for now would I kill thee.";
rsv[5] = "sent messengers to Balaam the son of Be\'or at Pethor, which is near the River, in the land of Amaw to call him, saying, &quot;Behold, a people has come out of Egypt; they cover the face of the earth, and they are dwelling opposite me.";
asv[5] = "And he sent messengers unto Balaam the son of Beor, to Pethor, which is by the River, to the land of the children of his people, to call him, saying, Behold, there is a people come out from Egypt: behold, they cover the face of the earth, and they abide over against me.";
yng[5] = "and he sendeth messengers unto Balaam son of Beor, to Pethor, which [is] by the River of the land of the sons of his people, to call for him, saying, `Lo, a people hath come out of Egypt; lo, it hath covered the eye of the land, and it is abiding over-against me;";
dby[5] = "And he sent messengers to Balaam the son of Beor, to Pethor, which is on the river in the land of the children of his people, to call him, saying, Behold, a people is come out from Egypt; behold, they cover the face of the land, and they abide over against me.";
web[5] = "He sent messengers therefore to Balaam the son of Beor to Pethor, which [is] by the river of the land of the children of his people, to call him, saying, Behold, there has a people come out from Egypt: behold, they cover the face of the earth, and they abide over against me:";
hnv[5] = "He sent messengers to Bil`am the son of Be\'or, to Petor, which is by the River, to the land of the children of his people, to call him, saying, Behold, there is a people come out from Mitzrayim: behold, they cover the surface of the eretz, and they abide over against me.";
vul[5] = "misit ergo nuntios ad Balaam filium Beor ariolum qui habitabat super flumen terrae filiorum Ammon ut vocarent eum et dicerent ecce egressus est populus ex Aegypto qui operuit superficiem terrae sedens contra me";
kjv[6] = "And the ass said unto Balaam, [Am] not I thine ass, upon which thou hast ridden ever since [I was] thine unto this day? was I ever wont to do so unto thee? And he said, Nay.";
rsv[6] = "Come now, curse this people for me, since they are too mighty for me; perhaps I shall be able to defeat them and drive them from the land; for I know that he whom you bless is blessed, and he whom you curse is cursed.&quot;";
asv[6] = "Come now therefore, I pray thee, curse me this people; for they are too mighty for me: peradventure I shall prevail, that we may smite them, and that I may drive them out of the land; for I know that he whom thou blessest is blessed, and he whom thou cursest is cursed.";
yng[6] = "and now, come, I pray thee, curse for me this people, for it [is] mightier than I; it may be I prevail -- we smite it -- and I cast it out from the land; for I have known -- that which thou blessest is blessed, and that which thou cursest is cursed.\'";
dby[6] = "And now come, I pray thee, curse me this people; for they are mightier than I: perhaps I may be able to smite them, and drive them out of the land; for I know that he whom thou blessest is blessed, and he whom thou cursest is cursed.";

hnv[6] = "Please come now therefore curse me this people; for they are too mighty for me: peradventure I shall prevail, that we may strike them, and that I may drive them out of the land; for I know that he whom you bless is blessed, and he whom you curse is cursed.";

vul[21] = "surrexit Balaam mane et strata asina profectus est cum eis";
kjv[22] = "He sent messengers therefore unto Balaam the son of Beor to Pethor, which [is] by the river of the land of the children of his people, to call him, saying, Behold, there is a people come out from Egypt: behold, they cover the face of the earth, and they abide over against me:";
rsv[22] = "But God\'s anger was kindled because he went; and the angel of the LORD took his stand in the way as his adversary. Now he was riding on the ass, and his two servants were with him.";
asv[22] = "And God\'s anger was kindled because he went; and the angel of Jehovah placed himself in the way for an adversary against him. Now he was riding upon his ass, and his two servants were with him.";
yng[22] = "and the anger of God burneth because he is going, and a messenger of Jehovah stationeth himself in the way for an adversary to him, and he is riding on his ass, and two of his servants [are] with him,";
dby[22] = "And God\'s anger was kindled because he went; and the Angel of Jehovah set himself in the way to withstand him. Now he was riding upon his ass, and his two young men were with him.";
web[22] = "And God\'s anger was kindled because he went: and the angel of the LORD stood in the way for an adversary against him. Now he was riding upon his ass, and his two servants [were] with him.";
hnv[22] = " God\'s anger was kindled because he went; and the angel of the LORD placed himself in the way for an adversary against him. Now he was riding on his donkey, and his two servants were with him.";
vul[22] = "et iratus est Deus stetitque angelus Domini in via contra Balaam qui sedebat asinae et duos pueros habebat secum";
kjv[23] = "Come now therefore, I pray thee, curse me this people; for they [are] too mighty for me: peradventure I shall prevail, [that] we may smite them, and [that] I may drive them out of the land: for I wot that he whom thou blessest [is] blessed, and he whom thou cursest is cursed.";
rsv[23] = "And the ass saw the angel of the LORD standing in the road, with a drawn sword in his hand; and the ass turned aside out of the road, and went into the field; and Balaam struck the ass, to turn her into the road.";
asv[23] = "And the ass saw the angel of Jehovah standing in the way, with his sword drawn in his hand; and the ass turned aside out of the way, and went into the field: and Balaam smote the ass, to turn her into the way.";
yng[23] = "and the ass seeth the messenger of Jehovah standing in the way, and his drawn sword in his hand, and the ass turneth aside out of the way, and goeth into a field, and Balaam smiteth the ass to turn it aside into the way.";
dby[23] = "And the ass saw the Angel of Jehovah standing in the way, and his sword drawn in his hand; and the ass turned aside out of the way, and went into the field, and Balaam smote the ass to turn her into the way.";
web[23] = "And the ass saw the angel of the LORD standing in the way, and his sword drawn in his hand: and the ass turned aside out of the way, and went into the field: and Balaam smote the ass, to turn her into the way.";
hnv[23] = "The donkey saw the angel of the LORD standing in the way, with his sword drawn in his hand; and the donkey turned aside out of the way, and went into the field: and Bil`am struck the donkey, to turn her into the way.";
vul[23] = "cernens asina angelum stantem in via evaginato gladio avertit se de itinere et ibat per agrum quam cum verberaret Balaam et vellet ad semitam reducere";
kjv[24] = "And the elders of Moab and the elders of Midian departed with the rewards of divination in their hand; and they came unto Balaam, and spake unto him the words of Balak.";
rsv[24] = "Then the angel of the LORD stood in a narrow path between the vineyards, with a wall on either side.";
asv[24] = "Then the angel of Jehovah stood in a narrow path between the vineyards, a wall being on this side, and a wall on that side.";
yng[24] = "And the messenger of Jehovah standeth in a narrow path of the vineyards -- a wall on this [side] and a wall on that --";
dby[24] = "And the Angel of Jehovah stood in a hollow of the vineyards, a wall being on this side, and a wall on that side.";
web[24] = "But the angel of the LORD stood in a path of the vineyards, a wall [being] on this side, and a wall on that side.";
hnv[24] = "Then the angel of the LORD stood in a narrow path between the vineyards, a wall being on this side, and a wall on that side.";
vul[24] = "stetit angelus in angustiis duarum maceriarum quibus vineae cingebantur";
kjv[25] = "And he said unto them, Lodge here this night, and I will bring you word again, as the LORD shall speak unto me: and the princes of Moab abode with Balaam.";
rsv[25] = "And when the ass saw the angel of the LORD, she pushed against the wall, and pressed Balaam\'s foot against the wall; so he struck her again.";
asv[25] = "And the ass saw the angel of Jehovah, and she thrust herself unto the wall, and crushed Balaam\'s foot against the wall: and he smote her again.";
yng[25] = "and the ass seeth the messenger of Jehovah, and is pressed unto the wall, and presseth Balaam\'s foot unto the wall, and he addeth to smite her;";
dby[25] = "And the ass saw the Angel of Jehovah, and she pressed herself against the wall, and crushed Balaam\'s foot against the wall; and he smote her again.";
web[25] = "And when the ass saw the angel of the LORD, she thrust herself against the wall, and crushed Balaam\'s foot against the wall: and he smote her again.";
hnv[25] = " The donkey saw the angel of the LORD, and she thrust herself to the wall, and crushed Bil`am\'s foot against the wall: and he struck her again.";
vul[25] = "quem videns asina iunxit se parieti et adtrivit sedentis pedem at ille iterum verberabat";
kjv[26] = "And God came unto Balaam, and said, What men [are] these with thee?";
rsv[26] = "Then the angel of the LORD went ahead, and stood in a narrow place, where there was no way to turn either to the right or to the left.";
asv[26] = "And the angel of Jehovah went further, and stood in a narrow place, where was no way to turn either to the right hand or to the left.";
yng[26] = "and the messenger of Jehovah addeth to pass over, and standeth in a strait place where there is no way to turn aside -- right or left --";
dby[26] = "Then the Angel of Jehovah went still further, and stood in a narrow place, where was no way to turn either to the right hand or to the left.";
web[26] = "And the angel of the LORD went further, and stood in a narrow place, where [was] no way to turn either to the right hand or to the left.";
hnv[26] = "The angel of the LORD went further, and stood in a narrow place, where was no way to turn either to the right hand or to the left.";
vul[26] = "et nihilominus angelus ad locum angustum transiens ubi nec ad dextram nec ad sinistram poterat deviari obvius stetit";
kjv[27] = "And Balaam said unto God, Balak the son of Zippor, king of Moab, hath sent unto me, [saying],";
rsv[27] = "When the ass saw the angel of the LORD, she lay down under Balaam; and Balaam\'s anger was kindled, and he struck the ass with his staff.";
asv[27] = "And the ass saw the angel of Jehovah, and she lay down under Balaam: and Balaam\'s anger was kindled, and he smote the ass with his staff.";
yng[27] = "and the ass seeth the messenger of Jehovah, and croucheth under Balaam, and the anger of Balaam burneth, and he smiteth the ass with a staff.";
dby[27] = "And the ass saw the Angel of Jehovah, and lay down under Balaam; and Balaam\'s anger was kindled, and he smote the ass with his staff.";
web[27] = "And when the ass saw the angel of the LORD, she fell down under Balaam: and Balaam\'s anger was kindled, and he smote the ass with a staff.";
hnv[27] = "The donkey saw the angel of the LORD, and she lay down under Bil`am: and Bil`am\'s anger was kindled, and he struck the donkey with his staff.";
vul[27] = "cumque vidisset asina stantem angelum concidit sub pedibus sedentis qui iratus vehementius caedebat fuste latera";
kjv[28] = "Behold, [there is] a people come out of Egypt, which covereth the face of the earth: come now, curse me them; peradventure I shall be able to overcome them, and drive them out.";
rsv[28] = "Then the LORD opened the mouth of the ass, and she said to Balaam, &quot;What have I done to you, that you have struck me these three times?&quot;";
asv[28] = "And Jehovah opened the mouth of the ass, and she said unto Balaam, What have I done unto thee, that thou hast smitten me these three times?";
yng[28] = "And Jehovah openeth the mouth of the ass, and she saith to Balaam, `What have I done to thee that thou hast smitten me these three times?\'";
dby[28] = "And Jehovah opened the mouth of the ass, and she said to Balaam, What have I done to thee, that thou hast smitten me these three times?";
web[28] = "And the LORD opened the mouth of the ass, and she said to Balaam, What have I done to thee, that thou hast smitten me these three times?";
hnv[28] = "The LORD opened the mouth of the donkey, and she said to Bil`am, What have I done to you, that you have struck me these three times?";
vul[28] = "aperuitque Dominus os asinae et locuta est quid feci tibi cur percutis me ecce iam tertio";
kjv[29] = "And God said unto Balaam, Thou shalt not go with them; thou shalt not curse the people: for they [are] blessed.";
rsv[29] = "And Balaam said to the ass, &quot;Because you have made sport of me. I wish I had a sword in my hand, for then I would kill you.&quot;";
asv[29] = "And Balaam said unto the ass, Because thou hast mocked me: I would there were a sword in my hand, for now I had killed thee.";
yng[29] = "and Balaam saith to the ass, `Because thou hast rolled thyself against me; oh that there were a sword in my hand, for now I had slain thee;\'";
dby[29] = "And Balaam said to the ass, Because thou hast mocked me: I would there were a sword in my hand, for now would I kill thee!";
web[29] = "And Balaam said to the ass, Because thou hast mocked me: I would there were a sword in my hand, for now would I kill thee.";
hnv[29] = "Bil`am said to the donkey, Because you have mocked me, I would there were a sword in my hand, for now I had killed you.";
vul[29] = "respondit Balaam quia commeruisti et inlusisti mihi utinam haberem gladium ut te percuterem";
kjv[30] = "And Balaam rose up in the morning, and said unto the princes of Balak, Get you into your land: for the LORD refuseth to give me leave to go with you.";
rsv[30] = "And the ass said to Balaam, &quot;Am I not your ass, upon which you have ridden all your life long to this day? Was I ever accustomed to do so to you?&quot; And he said, &quot;No.&quot;";
asv[30] = "And the ass said unto Balaam, Am not I thine ass, upon which thou hast ridden all thy life long unto this day? was I ever wont to do so unto thee? and he said, Nay.";
yng[30] = "and the ass saith unto Balaam, `Am not I thine ass, upon which thou hast ridden since [I was] thine unto this day? have I at all been accustomed to do to thee thus?\' and he saith, `No.\'";
dby[30] = "And the ass said to Balaam, Am not I thine ass, upon which thou hast ridden ever since I was thine to this day? was I ever wont to do so to thee? And he said, No.";
web[30] = "And the ass said to Balaam, [Am] not I thy ass, upon which thou hast rid ever since [I was] thine to this day? was I ever wont to do so to thee? And he said, Nay.";
hnv[30] = "The donkey said to Bil`am, Am I not your donkey, on which you have ridden all your life long to this day? was I ever wont to do so to you? and he said, No.";
vul[30] = "dixit asina nonne animal tuum sum cui semper sedere consuesti usque in praesentem diem dic quid simile umquam fecerim tibi at ille ait numquam";
kjv[31] = "And the princes of Moab rose up, and they went unto Balak, and said, Balaam refuseth to come with us.";
rsv[31] = "Then the LORD opened the eyes of Balaam, and he saw the angel of the LORD standing in the way, with his drawn sword in his hand; and he bowed his head, and fell on his face.";
asv[31] = "Then Jehovah opened the eyes of Balaam, and he saw the angel of Jehovah standing in the way, with his sword drawn in his hand; and he bowed his head, and fell on his face.";
yng[31] = "And Jehovah uncovereth the eyes of Balaam, and he seeeth the messenger of Jehovah standing in the way, and his drawn sword in his hand, and he boweth and doth obeisance, to his face;";
dby[31] = "Then Jehovah opened the eyes of Balaam, and he saw the Angel of Jehovah standing in the way, and his sword drawn in his hand; and he bowed and prostrated himself on his face.";
web[31] = "Then the LORD opened the eyes of Balaam, and he saw the angel of the LORD standing in the way, and his sword drawn in his hand: and he bowed down his head, and fell flat on his face.";
hnv[31] = "Then the LORD opened the eyes of Bil`am, and he saw the angel of the LORD standing in the way, with his sword drawn in his hand; and he bowed his head, and fell on his face.";
vul[31] = "protinus aperuit Dominus oculos Balaam et vidit angelum stantem in via evaginato gladio adoravitque eum pronus in terram";
kjv[32] = "And Balak sent yet again princes, more, and more honourable than they.";
rsv[32] = "And the angel of the LORD said to him, &quot;Why have you struck your ass these three times? Behold, I have come forth to withstand you, because your way is perverse before me;";
asv[32] = "And the angel of Jehovah said unto him, Wherefore hast thou smitten thine ass these three times? behold, I am come forth for an adversary, because thy way is perverse before me:";
yng[32] = "and the messenger of Jehovah saith unto him, `Wherefore hast thou smitten thine ass these three times? lo, I -- I have come out for an adversary, for [thy] way hath been perverse before me,";
dby[32] = "And the Angel of Jehovah said to him, Wherefore hast thou smitten thine ass these three times? behold, it was I who came forth to withstand thee, for the way [thou walkest in] is for ruin before me.";
web[32] = "And the angel of the LORD said to him, Why hast thou smitten thy ass these three times? behold, I went out to withstand thee, because [thy] way is perverse before me:";
hnv[32] = "The angel of the LORD said to him, Why have you struck your donkey these three times? behold, I am come forth for an adversary, because your way is perverse before me:";
vul[32] = "cui angelus cur inquit tertio verberas asinam tuam ego veni ut adversarer tibi quia perversa est via tua mihique contraria";
kjv[33] = "And they came to Balaam, and said to him, Thus saith Balak the son of Zippor, Let nothing, I pray thee, hinder thee from coming unto me:";
rsv[33] = "and the ass saw me, and turned aside before me these three times. If she had not turned aside from me, surely just now I would have slain you and let her live.&quot;";
asv[33] = "and the ass saw me, and turned aside before me these three times: unless she had turned aside from me, surely now I had even slain thee, and saved her alive.";
yng[33] = "and the ass seeth me, and turneth aside at my presence these three times; unless she had turned aside from my presence, surely now also, thee I had slain, and her kept alive.\'";
dby[33] = "And the ass saw me, and turned from me these three times; had she not turned from me, I had now certainly slain thee, and saved her alive.";
web[33] = "And the ass saw me, and turned from me these three times: unless she had turned from me, surely now also I had slain thee, and saved her alive.";
hnv[33] = "and the donkey saw me, and turned aside before me these three times: unless she had turned aside from me, surely now I had even slain you, and saved her alive.";
vul[33] = "et nisi asina declinasset de via dans locum resistenti te occidissem et illa viveret";
kjv[34] = "For I will promote thee unto very great honour, and I will do whatsoever thou sayest unto me: come therefore, I pray thee, curse me this people.";
rsv[34] = "Then Balaam said to the angel of the LORD, &quot;I have sinned, for I did not know that thou didst stand in the road against me. Now therefore, if it is evil in thy sight, I will go back again.&quot;";
asv[34] = "And Balaam said unto the angel of Jehovah, I have sinned; for I knew not that thou stoodest in the way against me: now therefore, if it displease thee, I will get me back again.";
yng[34] = "And Balaam saith unto the messenger of Jehovah, `I have sinned, for I did not know that thou [art] standing to meet me in the way; and now, if evil in thine eyes -- I turn back by myself.\'";
dby[34] = "And Balaam said to the Angel of Jehovah, I have sinned; for I knew not that thou stoodest in the way against me; and now, if it be evil in thine eyes, I will get me back again.";
web[34] = "And Balaam said to the angel of the LORD, I have sinned; for I knew not that thou stoodest in the way against me: now therefore, if it displeaseth thee, I will return again.";
hnv[34] = "Bil`am said to the angel of the LORD, I have sinned; for I didn\'t know that you stood in the way against me: now therefore, if it displease you, I will get me back again.";
vul[34] = "dixit Balaam peccavi nesciens quod tu stares contra me et nunc si displicet tibi ut vadam revertar";
kjv[35] = "And Balaam answered and said unto the servants of Balak, If Balak would give me his house full of silver and gold, I cannot go beyond the word of the LORD my God, to do less or more.";
rsv[35] = "And the angel of the LORD said to Balaam, &quot;Go with the men; but only the word which I bid you, that shall you speak.&quot; So Balaam went on with the princes of Balak.";
asv[35] = "And the angel of Jehovah said unto Balaam, Go with the men; but only the word that I shall speak unto thee, that thou shalt speak. So Balaam went with the princes of Balak.";
yng[35] = "And the messenger of Jehovah saith unto Balaam, `Go with the men; and only the word which I speak unto thee -- it thou dost speak;\' and Balaam goeth with the princes of Balak.";
dby[35] = "And the Angel of Jehovah said to Balaam, Go with the men, but only the word that I shall speak unto thee, that shalt thou speak. And Balaam went with the princes of Balak.";
web[35] = "And the angel of the LORD said to Balaam, Go with the men: but only the word that I shall speak to thee, that thou shalt speak: So Balaam went with the princes of Balak.";
hnv[35] = "The angel of the LORD said to Bil`am, Go with the men; but only the word that I shall speak to you, that you shall speak. So Bil`am went with the princes of Balak.";
vul[35] = "ait angelus vade cum istis et cave ne aliud quam praecepero tibi loquaris ivit igitur cum principibus";
kjv[36] = "Now therefore, I pray you, tarry ye also here this night, that I may know what the LORD will say unto me more.";
rsv[36] = "When Balak heard that Balaam had come, he went out to meet him at the city of Moab, on the boundary formed by the Arnon, at the extremity of the boundary.";
asv[36] = "And when Balak heard that Balaam was come, he went out to meet him unto the City of Moab, which is on the border of the Arnon, which is in the utmost part of the border.";
yng[36] = "And Balak heareth that Balaam hath come, and goeth out to meet him, unto a city of Moab, which [is] on the border of Arnon, which [is] in the extremity of the border;";
dby[36] = "And when Balak heard that Balaam came, he went out to meet him, to the city of Moab, which is on the border of the Arnon, which is at the extremity of the border.";
web[36] = "And when Balak heard that Balaam had come, he went out to meet him to a city of Moab, which [is] in the border of Arnon, which [is] in the utmost limit.";
hnv[36] = "When Balak heard that Bil`am was come, he went out to meet him to the City of Mo\'av, which is on the border of the Arnon, which is in the utmost part of the border.";
vul[36] = "quod cum audisset Balac egressus est in occursum eius in oppido Moabitarum quod situm est in extremis finibus Arnon";
kjv[37] = "And God came unto Balaam at night, and said unto him, If the men come to call thee, rise up, [and] go with them; but yet the word which I shall say unto thee, that shalt thou do.";
rsv[37] = "And Balak said to Balaam, &quot;Did I not send to you to call you? Why did you not come to me? Am I not able to honor you?&quot;";
asv[37] = "And Balak said unto Balaam, Did I not earnestly send unto thee to call thee? wherefore camest thou not unto me? am I not able indeed to promote thee to honor?";
yng[37] = "and Balak saith unto Balaam, `Did I not diligently sent unto thee to call for thee? why didst thou not come unto me? am I not truly able to honour thee?\'";
dby[37] = "And Balak said to Balaam, Did I not earnestly send to thee to call thee? why didst thou not come to me? am I not surely able to honour thee?";
web[37] = "And Balak said to Balaam, Did I not earnestly send to thee to call thee? why camest thou not to me? am I not able indeed to promote thee to honor?";
hnv[37] = "Balak said to Bil`am, Didn\'t I earnestly send to you to call you? why didn\'t you come to me? am I not able indeed to promote you to honor?";
vul[37] = "dixitque ad Balaam misi nuntios ut vocarent te cur non statim venisti ad me an quia mercedem adventui tuo reddere nequeo";
kjv[38] = "And Balaam rose up in the morning, and saddled his ass, and went with the princes of Moab.";
rsv[38] = "Balaam said to Balak, &quot;Lo, I have come to you! Have I now any power at all to speak anything? The word that God puts in my mouth, that must I speak.&quot;";
asv[38] = "And Balaam said unto Balak, Lo, I am come unto thee: have I now any power at all to speak anything? the word that God putteth in my mouth, that shall I speak.";
yng[38] = "And Balaam saith unto Balak, `Lo, I have come unto thee; now -- am I at all able to speak anything? the word which God setteth in my mouth -- it I do speak.\'";
dby[38] = "And Balaam said to Balak, Lo, I am come to thee; but shall I now be able at all to say anything? the word that God puts in my mouth, that shall I speak.";
web[38] = "And Balaam said to Balak, Lo, I have come to thee: have I now any power at all to say any thing? the word that God putteth in my mouth, that shall I speak.";
hnv[38] = "Bil`am said to Balak, Behold, I have come to you: have I now any power at all to speak anything? the word that God puts in my mouth, that shall I speak.";
vul[38] = "cui ille respondit ecce adsum numquid loqui potero aliud nisi quod Deus posuerit in ore meo";
kjv[39] = "And God\'s anger was kindled because he went: and the angel of the LORD stood in the way for an adversary against him. Now he was riding upon his ass, and his two servants [were] with him.";
rsv[39] = "Then Balaam went with Balak, and they came to Kir\'iath-hu\'zoth.";
asv[39] = "And Balaam went with Balak, and they came unto Kiriath-huzoth.";
yng[39] = "And Balaam goeth with Balak, and they come to Kirjath-Huzoth,";
dby[39] = "And Balaam went with Balak, and they came to Kirjath-huzoth.";
web[39] = "And Balaam went with Balak, and they came to Kirjath-huzoth.";
hnv[39] = "Bil`am went with Balak, and they came to Kiryat-Hutzot.";
vul[39] = "perrexerunt ergo simul et venerunt in urbem quae in extremis regni eius finibus erat";
kjv[40] = "And the ass saw the angel of the LORD standing in the way, and his sword drawn in his hand: and the ass turned aside out of the way, and went into the field: and Balaam smote the ass, to turn her into the way.";
rsv[40] = "And Balak sacrificed oxen and sheep, and sent to Balaam and to the princes who were with him.";
asv[40] = "And Balak sacrificed oxen and sheep, and sent to Balaam, and to the princes that were with him.";
yng[40] = "and Balak sacrificeth oxen and sheep, and sendeth to Balaam, and to the princes who [are] with him;";
dby[40] = "And Balak offered oxen and small cattle, and sent to Balaam and to the princes that were with him.";
web[40] = "And Balak offered oxen and sheep, and sent to Balaam, and to the princes that [were] with him.";
hnv[40] = "Balak sacrificed oxen and sheep, and sent to Bil`am, and to the princes who were with him.";
vul[40] = "cumque occidisset Balac boves et oves misit ad Balaam et principes qui cum eo erant munera";
kjv[41] = "But the angel of the LORD stood in a path of the vineyards, a wall [being] on this side, and a wall on that side.";
rsv[41] = "And on the morrow Balak took Balaam and brought him up to Bamoth-ba\'al; and from there he saw the nearest of the people.";
asv[41] = "And it came to pass in the morning, that Balak took Balaam, and brought him up into the high places of Baal; and he saw from thence the utmost part of the people.";
yng[41] = "and it cometh to pass in the morning, that Balak taketh Balaam, and causeth him to go up the high places of Baal, and he seeth from thence the extremity of the people.";
dby[41] = "And it came to pass on the morrow, that Balak took Balaam, and brought him up to the high places of Baal, and he saw from thence the extremity of the people.";
web[41] = "And it came to pass on the morrow, that Balak took Balaam, and conducted him to the high places of Baal, that thence he might see the utmost [part] of the people.";
hnv[41] = "It happened in the morning, that Balak took Bil`am, and brought him up into the high places of Ba`al; and he saw from there the utmost part of the people.";
vul[41] = "mane autem facto duxit eum ad excelsa Baal et intuitus est extremam partem populi";
csb[1] = "The Israelites traveled on and camped in the plains of Moab near the Jordan across from Jericho.";
csb[2] = "Now Balak son of Zippor saw all that Israel had done to the Amorites.";
csb[3] = "Moab was terrified of the people because they were numerous, and Moab dreaded the Israelites.";
csb[4] = "So the Moabites said to the elders of Midian, &quot;This horde will devour everything around us like an ox eats up the green plants in the field.&quot; Since Balak son of Zippor was Moab\'s king at that time,";
csb[5] = "he sent messengers to Balaam son of Beor at Pethor, which is by the Euphrates in the land of his people. Balak said to him: &quot;Look, a people has come out of Egypt; they cover the surface of the land and are living right across from me.";
csb[6] = "&quot;Please come and put a curse on these people for me because they are more powerful than I am. I may be able to defeat them and drive them out of the land, for I know that those you bless are blessed and those you curse are cursed.&quot;";
csb[7] = "The elders of Moab and Midian departed with fees for divination in hand. They came to Balaam and reported Balak\'s words to him.";
csb[8] = "He said to them, &quot;Spend the night here, and I will give you the answer the LORD tells me.&quot; So the officials of Moab stayed with Balaam.";
csb[9] = "Then God came to Balaam and asked, &quot;Who are these men with you? &quot;";
csb[10] = "Balaam replied to God, &quot;Balak son of Zippor, king of Moab, sent this message to me:";
csb[11] = "&quot;\'Look, a people has come out of Egypt, and they cover the surface of the land. Now come and put a curse on them for me. I may be able to fight against them and drive them away.\' &quot;";
csb[12] = "Then God said to Balaam, &quot;You are not to go with them. You are not to curse this people, for they are blessed.&quot;";
csb[13] = "So Balaam got up the next morning and said to Balak\'s officials, &quot;Go back to your land, because the LORD has refused to let me go with you.&quot;";
csb[14] = "The officials of Moab arose, returned to Balak, and reported, &quot;Balaam refused to come with us.&quot;";
csb[15] = "Balak sent officials again who were more numerous and higher in rank than the others.";
csb[16] = "They came to Balaam and said to him, &quot;This is what Balak son of Zippor says: \'Let nothing keep you from coming to me,";
csb[17] = "&quot;for I will greatly honor you and do whatever you ask me. So please come and put a curse on these people for me! \' &quot;";
csb[18] = "But Balaam responded to the servants of Balak, &quot;If Balak were to give me his house full of silver and gold, I could not go against the command of the LORD my God to do anything small or great.";
csb[19] = "&quot;Please stay here overnight as the others did, so that I may find out what else the LORD has to tell me.&quot;";
csb[20] = "God came to Balaam at night and said to him, &quot;Since these men have come to summon you, get up and go with them, but you must only do what I tell you.&quot;";
csb[21] = "When he got up in the morning, Balaam saddled his donkey and went with the officials of Moab.";
csb[22] = "But God was incensed that Balaam was going, and the angel of the LORD took his stand on the path to oppose him. Balaam was riding his donkey, and his two servants were with him.";
csb[23] = "When the donkey saw the angel of the LORD standing on the path with a drawn sword in his hand, she turned off the path and went into the field. So Balaam hit her to return her to the path.";
csb[24] = "Then the angel of the LORD stood in a narrow passage between the vineyards, with a stone wall on either side.";
csb[25] = "The donkey saw the angel of the LORD and pressed herself against the wall, squeezing Balaam\'s foot against it. So he hit her once again.";
csb[26] = "The angel of the LORD went ahead and stood in a narrow place where there was no room to turn to the right or the left.";
csb[27] = "When the donkey saw the angel of the LORD, she crouched down under Balaam. So he became furious and beat the donkey with his stick.";
csb[28] = "Then the LORD opened the donkey\'s mouth, and she asked Balaam, &quot;What have I done to you that you have beaten me these three times? &quot;";
csb[29] = "Balaam answered the donkey, &quot;You made me look like a fool. If I had a sword in my hand, I\'d kill you now! &quot;";
csb[30] = "But the donkey said, &quot;Am I not the donkey you\'ve ridden all your life until today? Have I ever treated you this way before? &quot; &quot;No,&quot; he replied.";
csb[31] = "Then the LORD opened Balaam\'s eyes, and he saw the angel of the LORD standing in the path with a drawn sword in his hand. Balaam knelt low and bowed in worship on his face.";
csb[32] = "The angel of the LORD asked him, &quot;Why have you beaten your donkey these three times? Look, I came out to oppose you, because I consider what you are doing to be evil.";
csb[33] = "&quot;The donkey saw me and turned away from me these three times. If she had not turned away from me, I would have killed you by now and let her live.&quot;";
csb[34] = "Balaam said to the angel of the LORD, &quot;I have sinned, for I did not know that you were standing in the path to confront me. And now, if it is evil in your sight, I will go back.&quot;";
csb[35] = "Then the angel of the LORD said to Balaam, &quot;Go with the men, but you are to say only what I tell you.&quot; So Balaam went with Balak\'s officials.";
csb[36] = "When Balak heard that Balaam was coming, he went out to meet him at the Moabite city on the Arnon border at the edge of his territory.";
csb[37] = "Balak asked Balaam, &quot;Did I not send you an urgent summons? Why didn\'t you come to me? Am I really not able to reward you? &quot;";
csb[38] = "Balaam said to him, &quot;Look, I have come to you, but can I say anything I want? I must speak only the message God puts in my mouth.&quot;";
csb[39] = "So Balaam went with Balak, and they came to Kiriath-huzoth.";
csb[40] = "Balak sacrificed cattle, sheep, and goats and sent for Balaam and the officials who were with him.";
csb[41] = "In the morning, Balak took Balaam and brought him to Bamoth-baal. From there he saw the outskirts of the people\'s camp.";
kjv[1] = "And the children of Israel set forward, and pitched in the plains of Moab on this side Jordan [by] Jericho.";
kjv[2] = "And Balak the son of Zippor saw all that Israel had done to the Amorites.";
kjv[3] = "And Moab was sore afraid of the people, because they [were] many: and Moab was distressed because of the children of Israel.";
kjv[4] = "And Moab said unto the elders of Midian, Now shall this company lick up all [that are] round about us, as the ox licketh up the grass of the field. And Balak the son of Zippor [was] king of the Moabites at that time.";
kjv[5] = "He sent messengers therefore unto Balaam the son of Beor to Pethor, which [is] by the river of the land of the children of his people, to call him, saying, Behold, there is a people come out from Egypt: behold, they cover the face of the earth, and they abide over against me:";
kjv[6] = "Come now therefore, I pray thee, curse me this people; for they [are] too mighty for me: peradventure I shall prevail, [that] we may smite them, and [that] I may drive them out of the land: for I wot that he whom thou blessest [is] blessed, and he whom thou cursest is cursed.";
kjv[7] = "And the elders of Moab and the elders of Midian departed with the rewards of divination in their hand; and they came unto Balaam, and spake unto him the words of Balak.";
kjv[8] = "And he said unto them, Lodge here this night, and I will bring you word again, as the LORD shall speak unto me: and the princes of Moab abode with Balaam.";
kjv[9] = "And God came unto Balaam, and said, What men [are] these with thee?";
kjv[10] = "And Balaam said unto God, Balak the son of Zippor, king of Moab, hath sent unto me, [saying],";
kjv[11] = "Behold, [there is] a people come out of Egypt, which covereth the face of the earth: come now, curse me them; peradventure I shall be able to overcome them, and drive them out.";
kjv[12] = "And God said unto Balaam, Thou shalt not go with them; thou shalt not curse the people: for they [are] blessed.";
kjv[13] = "And Balaam rose up in the morning, and said unto the princes of Balak, Get you into your land: for the LORD refuseth to give me leave to go with you.";
kjv[14] = "And the princes of Moab rose up, and they went unto Balak, and said, Balaam refuseth to come with us.";
kjv[15] = "And Balak sent yet again princes, more, and more honourable than they.";
kjv[16] = "And they came to Balaam, and said to him, Thus saith Balak the son of Zippor, Let nothing, I pray thee, hinder thee from coming unto me:";
kjv[17] = "For I will promote thee unto very great honour, and I will do whatsoever thou sayest unto me: come therefore, I pray thee, curse me this people.";
kjv[18] = "And Balaam answered and said unto the servants of Balak, If Balak would give me his house full of silver and gold, I cannot go beyond the word of the LORD my God, to do less or more.";
kjv[19] = "Now therefore, I pray you, tarry ye also here this night, that I may know what the LORD will say unto me more.";
kjv[20] = "And God came unto Balaam at night, and said unto him, If the men come to call thee, rise up, [and] go with them; but yet the word which I shall say unto thee, that shalt thou do.";
kjv[21] = "And Balaam rose up in the morning, and saddled his ass, and went with the princes of Moab.";
kjv[22] = "And God\'s anger was kindled because he went: and the angel of the LORD stood in the way for an adversary against him. Now he was riding upon his ass, and his two servants [were] with him.";
kjv[23] = "And the ass saw the angel of the LORD standing in the way, and his sword drawn in his hand: and the ass turned aside out of the way, and went into the field: and Balaam smote the ass, to turn her into the way.";
kjv[24] = "But the angel of the LORD stood in a path of the vineyards, a wall [being] on this side, and a wall on that side.";
kjv[25] = "And when the ass saw the angel of the LORD, she thrust herself unto the wall, and crushed Balaam\'s foot against the wall: and he smote her again.";
kjv[26] = "And the angel of the LORD went further, and stood in a narrow place, where [was] no way to turn either to the right hand or to the left.";
kjv[27] = "And when the ass saw the angel of the LORD, she fell down under Balaam: and Balaam\'s anger was kindled, and he smote the ass with a staff.";
kjv[28] = "And the LORD opened the mouth of the ass, and she said unto Balaam, What have I done unto thee, that thou hast smitten me these three times?";
kjv[29] = "And Balaam said unto the ass, Because thou hast mocked me: I would there were a sword in mine hand, for now would I kill thee.";
kjv[30] = "And the ass said unto Balaam, [Am] not I thine ass, upon which thou hast ridden ever since [I was] thine unto this day? was I ever wont to do so unto thee? And he said, Nay.";
kjv[31] = "Then the LORD opened the eyes of Balaam, and he saw the angel of the LORD standing in the way, and his sword drawn in his hand: and he bowed down his head, and fell flat on his face.";
kjv[32] = "And the angel of the LORD said unto him, Wherefore hast thou smitten thine ass these three times? behold, I went out to withstand thee, because [thy] way is perverse before me:";
kjv[33] = "And the ass saw me, and turned from me these three times: unless she had turned from me, surely now also I had slain thee, and saved her alive.";
kjv[34] = "And Balaam said unto the angel of the LORD, I have sinned; for I knew not that thou stoodest in the way against me: now therefore, if it displease thee, I will get me back again.";
kjv[35] = "And the angel of the LORD said unto Balaam, Go with the men: but only the word that I shall speak unto thee, that thou shalt speak. So Balaam went with the princes of Balak.";
kjv[36] = "And when Balak heard that Balaam was come, he went out to meet him unto a city of Moab, which [is] in the border of Arnon, which [is] in the utmost coast.";
kjv[37] = "And Balak said unto Balaam, Did I not earnestly send unto thee to call thee? wherefore camest thou not unto me? am I not able indeed to promote thee to honour?";
kjv[38] = "And Balaam said unto Balak, Lo, I am come unto thee: have I now any power at all to say any thing? the word that God putteth in my mouth, that shall I speak.";
kjv[39] = "And Balaam went with Balak, and they came unto Kirjathhuzoth.";
kjv[40] = "And Balak offered oxen and sheep, and sent to Balaam, and to the princes that [were] with him.";
kjv[41] = "And it came to pass on the morrow, that Balak took Balaam, and brought him up into the high places of Baal, that thence he might see the utmost [part] of the people.";
</script>
