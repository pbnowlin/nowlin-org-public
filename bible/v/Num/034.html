csb[1] = "The LORD spoke to Moses,";
csb[2] = "&quot;Command the Israelites and say to them: When you enter the land of Canaan, it will be allotted to you as an inheritance with these borders:";
csb[3] = "&quot;Your southern side will be from the Wilderness of Zin along the boundary of Edom. Your southern border on the east will begin at the east end of the Dead Sea.";
csb[4] = "&quot;Your border will turn south of the Scorpions\' Ascent, proceed to Zin, and end south of Kadesh-barnea. It will go to Hazar-addar and proceed to Azmon.";
csb[5] = "&quot;The border will turn from Azmon to the Brook of Egypt, where it will end at the Mediterranean Sea.";
csb[6] = "&quot;Your western border will be the coastline of the Mediterranean Sea; this will be your western border.";
csb[7] = "&quot;This will be your northern border: From the Mediterranean Sea draw a line to Mount Hor;";
csb[8] = "&quot;from Mount Hor draw a line to the entrance of Hamath, and the border will reach Zedad.";
csb[9] = "&quot;Then the border will go to Ziphron and end at Hazar-enan. This will be your northern border.";
csb[10] = "&quot;For your eastern border, draw a line from Hazar-enan to Shepham.";
csb[11] = "&quot;The border will go down from Shepham to Riblah east of Ain. It will continue down and reach the eastern slope of the Sea of Chinnereth.";
csb[12] = "&quot;Then the border will go down to the Jordan and end at the Dead Sea. This will be your land defined by its borders on all sides.&quot;";
csb[13] = "So Moses commanded the Israelites, &quot;This is the land you are to receive by lot as an inheritance, which the LORD commanded to be given to the nine and a half tribes.";
csb[14] = "&quot;For the tribe of Reuben\'s descendants and the tribe of Gad\'s descendants have received their inheritance according to their ancestral families, and half the tribe of Manasseh has received its inheritance.";
csb[15] = "&quot;The two and a half tribes have received their inheritance across the Jordan east of Jericho, toward the sunrise.&quot;";
csb[16] = "The LORD spoke to Moses,";
csb[17] = "&quot;These are the names of the men who are to distribute the land as an inheritance for you: the priest Eleazar and Joshua son of Nun.";
csb[18] = "&quot;Take one leader from each tribe to distribute the land.";
csb[19] = "&quot;These are the names of the men: Caleb son of Jephunneh from the tribe of Judah;";
csb[20] = "&quot;Shemuel son of Ammihud from the tribe of Simeon\'s descendants;";
csb[21] = "&quot;Elidad son of Chislon from the tribe of Benjamin;";
csb[22] = "&quot;Bukki son of Jogli, a leader from the tribe of Dan\'s descendants;";
csb[23] = "&quot;from the sons of Joseph: Hanniel son of Ephod, a leader from the tribe of Manasseh\'s descendants,";
csb[24] = "&quot;Kemuel son of Shiphtan, a leader from the tribe of Ephraim\'s descendants;";
csb[25] = "&quot;Eli-zaphan son of Parnach, a leader from the tribe of Zebulun\'s descendants;";
csb[26] = "&quot;Paltiel son of Azzan, a leader from the tribe of Issachar\'s descendants;";
csb[27] = "&quot;Ahihud son of Shelomi, a leader from the tribe of Asher\'s descendants;";
csb[28] = "&quot;Pedahel son of Ammihud, a leader from the tribe of Naphtali\'s descendants.&quot;";
csb[29] = "These are the ones the LORD commanded to distribute the inheritance to the Israelites in the land of Canaan.";
