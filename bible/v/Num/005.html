kjv[18] = "And the priest shall set the woman before the LORD, and uncover the woman\'s head, and put the offering of memorial in her hands, which [is] the jealousy offering: and the priest shall have in his hand the bitter water that causeth the curse:";
rsv[18] = "And the priest shall set the woman before the LORD, and unbind the hair of the woman\'s head, and place in her hands the cereal offering of remembrance, which is the cereal offering of jealousy. And in his hand the priest shall have the water of bitterness that brings the curse.";

yng[18] = "and the priest hath caused the woman to stand before Jehovah, and hath uncovered the woman\'s head, and hath given into her hands the present of the memorial, it [is] a present of jealousy, and in the hand of the priest are the bitter waters which cause the curse.";
dby[18] = "And the priest shall set the woman before Jehovah, and uncover the woman\'s head, and put the memorial oblation in her hands, which is the jealousy offering; and in the hand of the priest shall be the bitter water that bringeth the curse.";
web[18] = "And the priest shall set the woman before the LORD, and uncover the woman\'s head, and put the offering of memorial in her hands, which [is] the jealousy-offering: and the priest shall have in his hand the bitter water that causeth the curse:";
hnv[18] = "The Kohen shall set the woman before the LORD, and let the hair of the woman\'s head go loose, and put the meal offering of memorial in her hands, which is the meal offering of jealousy. The Kohen shall have in his hand the water of bitterness that brings a curse.";
vul[18] = "cumque steterit mulier in conspectu Domini discoperiet caput eius et ponet super manus illius sacrificium recordationis et oblationem zelotypiae ipse autem tenebit aquas amarissimas in quibus cum execratione maledicta congessit";
kjv[19] = "And the priest shall charge her by an oath, and say unto the woman, If no man have lain with thee, and if thou hast not gone aside to uncleanness [with another] instead of thy husband, be thou free from this bitter water that causeth the curse:";
rsv[19] = "Then the priest shall make her take an oath, saying, \'If no man has lain with you, and if you have not turned aside to uncleanness, while you were under your husband\'s authority, be free from this water of bitterness that brings the curse.";
asv[19] = "And the priest shall cause her to swear, and shall say unto the woman, If no man have lain with thee, and if thou have not gone aside to uncleanness, being under thy husband, be thou free from this water of bitterness that causeth the curse.";
yng[19] = "`And the priest hath caused her to swear, and hath said unto the woman, If no man hath lain with thee, and if thou hast not turned aside [to] uncleanness under thy husband, be free from these bitter waters which cause the curse;";
dby[19] = "And the priest shall adjure her, and say unto the woman, If no man have lain with thee, and if thou hast not gone astray in uncleanness, in being with another instead of thy husband, be free from this bitter water that bringeth the curse.";
web[19] = "And the priest shall charge her by an oath, and say to the woman, If no man hath lain with thee, and if thou hast not gone aside to uncleanness [with another] instead of thy husband, be thou free from this bitter water that causeth the curse:";
hnv[19] = "The Kohen shall cause her to swear, and shall tell the woman, \'If no man has lain with you, and if you haven\'t gone aside to uncleanness, being under your husband, be free from this water of bitterness that brings a curse.";
vul[19] = "adiurabitque eam et dicet si non dormivit vir alienus tecum et si non polluta es deserto mariti toro non te nocebunt aquae istae amarissimae in quas maledicta congessi";

asv[21] = "then the priest shall cause the woman to swear with the oath of cursing, and the priest shall say unto the woman, Jehovah make thee a curse and an oath among thy people, when Jehovah doth make thy thigh to fall away, and thy body to swell;";
yng[21] = "(then the priest hath caused the woman to swear with an oath of execration, and the priest hath said to the woman) -- Jehovah doth give thee for an execration, and for a curse, in the midst of thy people, in Jehovah\'s giving thy thigh to fall, and thy belly to swell,";

web[21] = "Then the priest shall charge the woman with an oath of cursing, and the priest shall say to the woman, The LORD make thee a curse and an oath among thy people, when the LORD doth make thy thigh to perish, and thy belly to swell;";
hnv[21] = "then the Kohen shall cause the woman to swear with the oath of cursing, and the Kohen shall tell the woman, \'The LORD make you a curse and an oath among your people, when the LORD allows your thigh to fall away, and your body to swell;";
vul[21] = "his maledictionibus subiacebis det te Dominus in maledictionem exemplumque cunctorum in populo suo putrescere faciat femur tuum et tumens uterus disrumpatur";
kjv[22] = "And this water that causeth the curse shall go into thy bowels, to make [thy] belly to swell, and [thy] thigh to rot: And the woman shall say, Amen, amen.";

dby[26] = "And the priest shall take a handful of the oblation as a memorial thereof, and burn it upon the altar; and afterwards he shall make the woman drink the water.";
web[26] = "And the priest shall take a handful of the offering, [even] the memorial of it, and burn [it] upon the altar, and afterward shall cause the woman to drink the water.";

vul[26] = "pugillum sacrificii tollat de eo quod offertur et incendat super altare et sic potum det mulieri aquas amarissimas";
kjv[27] = "And when he hath made her to drink the water, then it shall come to pass, [that], if she be defiled, and have done trespass against her husband, that the water that causeth the curse shall enter into her, [and become] bitter, and her belly shall swell, and her thigh shall rot: and the woman shall be a curse among her people.";
rsv[27] = "And when he has made her drink the water, then, if she has defiled herself and has acted unfaithfully against her husband, the water that brings the curse shall enter into her and cause bitter pain, and her body shall swell, and her thigh shall fall away, and the woman shall become an execration among her people.";
asv[27] = "And when he hath made her drink the water, then it shall come to pass, if she be defiled, and have committed a trespass against her husband, that the water that causeth the curse shall enter into her [and become] bitter, and her body shall swell, and her thigh shall fall away: and the woman shall be a curse among her people.";
yng[27] = "yea, he hath caused her to drink the water, and it hath come to pass, if she hath been defiled, and doth commit a trespass against her husband, that the waters which cause the curse have gone into her for bitter things, and her belly hath swelled, and her thigh hath fallen, and the woman hath become an execration in the midst of her people.";
dby[27] = "And when he hath made her to drink the water, then it shall come to pass, if she have been defiled, and have committed unfaithfulness against her husband, that the water that bringeth the curse shall enter into her, for bitterness, and her belly shall swell, and her thigh shall shrink; and the woman shall become a curse among her people.";
web[27] = "And when he hath made her to drink the water, then it shall come to pass, [that], if she is defiled, and hath done trespass against her husband, that the water that causeth the curse shall enter into her, [and become] bitter, and her belly shall swell, and her thigh shall perish: and the woman shall be a curse among her people.";
hnv[27] = "When he has made her drink the water, then it shall happen, if she is defiled, and has committed a trespass against her husband, that the water that causes the curse will enter into her and become bitter, and her body will swell, and her thigh will fall away: and the woman will be a curse among her people.";
vul[27] = "quas cum biberit si polluta est et contempto viro adulterii rea pertransibunt eam aquae maledictionis et inflato ventre conputrescet femur eritque mulier in maledictionem et in exemplum omni populo";

asv[28] = "And if the woman be not defiled, but be clean; then she shall be free, and shall conceive seed.";

web[28] = "And if the woman is not defiled, but is clean; then she shall be free, and shall conceive seed.";
hnv[28] = "If the woman isn\'t defiled, but is clean; then she shall be free, and shall conceive seed.";
vul[28] = "quod si polluta non fuerit erit innoxia et faciet liberos";

rsv[29] = "&quot;This is the law in cases of jealousy, when a wife, though under her husband\'s authority, goes astray and defiles herself,";
asv[29] = "This is the law of jealousy, when a wife, being under her husband, goeth aside, and is defiled;";
yng[29] = "`This [is] the law of jealousies, when a wife turneth aside under her husband, and hath been defiled,";
dby[29] = "This is the law of jealousies, when a wife goeth astray to another instead of her husband and is defiled,";
web[29] = "This [is] the law of jealousies, when a wife goeth astray [to another] instead of her husband, and is defiled;";
hnv[29] = "&quot;This is the law of jealousy, when a wife, being under her husband, goes astray, and is defiled;";

yng[30] = "or when a spirit of jealousy passeth over a man, and he hath been jealous of his wife, then he hath caused the woman to stand before Jehovah, and the priest hath done to her all this law,";
dby[30] = "or when the spirit of jealousy cometh upon a man, and he is jealous as regards his wife; then shall he set the woman before Jehovah, and the priest shall do to her according to all this law.";
web[30] = "Or when the spirit of jealousy cometh upon him, and he is jealous over his wife, and shall set the woman before the LORD, and the priest shall execute upon her all this law.";

rsv[31] = "The man shall be free from iniquity, but the woman shall bear her iniquity.&quot;";
asv[31] = "And the man shall be free from iniquity, and that woman shall bear her iniquity.";
yng[31] = "and the man hath been acquitted from iniquity, and that woman doth bear her iniquity.\'";
dby[31] = "Then shall the man be free from iniquity, but that woman shall bear her iniquity.";
web[31] = "Then shall the man be guiltless from iniquity, and this woman shall bear her iniquity.";
hnv[31] = "The man shall be free from iniquity, and that woman shall bear her iniquity.&quot;";

csb[1] = "The LORD instructed Moses:";
csb[2] = "&quot;Command the Israelites to send away anyone from the camp who is afflicted with a skin disease, anyone who has a discharge, or anyone who is defiled because of a corpse.";
csb[3] = "&quot;Send away both male or female; send them outside the camp, so that they will not defile their camps where I dwell among them.&quot;";
csb[4] = "The Israelites did this, sending them outside the camp. The Israelites did as the LORD instructed Moses.";
csb[5] = "The LORD spoke to Moses:";
csb[6] = "&quot;Tell the Israelites: When a man or woman commits any sin against another, that person acts unfaithfully toward the LORD and is guilty.";
csb[7] = "&quot;The person is to confess the sin he has committed. He is to pay full compensation, add a fifth of its value to it, and give it to the individual he has wronged.";
csb[8] = "&quot;But if that individual has no relative to receive compensation, the compensation goes to the LORD for the priest, along with the atonement ram by which the priest will make atonement for the guilty person.";
csb[9] = "&quot;Every holy contribution the Israelites present to the priest will be his.";
csb[10] = "&quot;Each one\'s holy contribution is his to give; what each one gives to the priest will be his.&quot;";
csb[11] = "The LORD spoke to Moses:";
csb[12] = "&quot;Speak to the Israelites and tell them: If any man\'s wife goes astray, is unfaithful to him,";
csb[13] = "&quot;and sleeps with another, but it is concealed from her husband, and she is undetected, even though she has defiled herself, since there is no witness against her, and she wasn\'t caught in the act;";
csb[14] = "&quot;and if a feeling of jealousy comes over the husband and he becomes jealous because of his wife who has defiled herself -- or if a feeling of jealousy comes over him and he becomes jealous of her though she has not defiled herself --";
csb[15] = "&quot;then the man is to bring his wife to the priest. He is also to bring an offering for her of two quarts of barley flour. He is not to pour oil over it or put frankincense on it because it is a grain offering of jealousy, a grain offering for remembrance to draw attention to guilt.";
csb[16] = "&quot;The priest is to bring her forward and have her stand before the LORD.";
csb[17] = "&quot;Then the priest is to take holy water in a clay bowl, take some of the dust from the tabernacle floor, and put it in the water.";
csb[18] = "&quot;After the priest has the woman stand before the LORD, he is to let down her hair and place in her hands the grain offering for remembrance, which is the grain offering of jealousy. The priest is to hold the bitter water that brings a curse.";
csb[19] = "&quot;The priest will require the woman to take an oath and will say to her, \'If no man has slept with you, if you have not gone astray and become defiled while under your husband\'s authority, be unaffected by this bitter water that brings a curse.";
csb[20] = "&quot;But if you have gone astray while under your husband\'s authority, if you have defiled yourself and a man other than your husband has slept with you\' --";
csb[21] = "&quot;at this point the priest will make the woman take the oath with the sworn curse, and he is to say to her -- \'May the LORD make you into an object of your people\'s cursing and swearing when he makes your womb shrivel and your belly swell.";
csb[22] = "&quot;May this water that brings a curse enter your stomach, causing your belly to swell and your womb to shrivel.\' &quot;And the woman will reply, \'Amen, Amen.\'";
csb[23] = "&quot;Then the priest is to write these curses on a scroll and wash them off into the bitter water.";
csb[24] = "&quot;He will require the woman to drink the bitter water that brings a curse, and it will enter her to cause bitter suffering.";
csb[25] = "&quot;The priest is to take the grain offering of jealousy from the woman, present the offering before the LORD, and bring it to the altar.";
csb[26] = "&quot;The priest is to take a handful of the grain offering as a memorial portion and burn it on the altar. Afterward, he will require the woman to drink the water.";
csb[27] = "&quot;When he makes her drink the water, if she has defiled herself and been unfaithful to her husband, the water that brings a curse will enter her to cause bitter suffering; her belly will swell, and her womb will shrivel. She will become a curse among her people.";
csb[28] = "&quot;But if the woman has not defiled herself and is pure, she will be unaffected and will be able to conceive children.";
csb[29] = "&quot;This is the law regarding jealousy when a wife goes astray and defiles herself while under her husband\'s authority,";
csb[30] = "&quot;or when a feeling of jealousy comes over a husband and he becomes jealous of his wife. He is to have the woman stand before the LORD, and the priest will carry out all these instructions for her.";
csb[31] = "&quot;The husband will be free of guilt, but that woman will bear her iniquity.&quot;";
