csb[1] = "When the seventh month arrived, and the Israelites were in their towns, the people gathered as one in Jerusalem.";
csb[2] = "Jeshua son of Jozadak and his brothers the priests along with Zerubbabel son of Shealtiel and his brothers began to build the altar of Israel\'s God in order to offer burnt offerings on it, as it is written in the law of Moses, the man of God.";
csb[3] = "They set up the altar on its foundation and offered burnt offerings for the morning and evening on it to the LORD even though they feared the surrounding peoples.";
csb[4] = "They celebrated the Festival of Shelters as prescribed, and offered burnt offerings each day, based on the number specified by ordinance for each festival day.";
csb[5] = "After that, they offered the regular burnt offering and the offerings for the beginning of each month and for all the LORD\'s appointed holy occasions, as well as the freewill offerings brought to the LORD.";
csb[6] = "On the first day of the seventh month they began to offer burnt offerings to the LORD, even though the foundation of the LORD\'s temple had not yet been laid.";
csb[7] = "They gave money to the stonecutters and artisans, and gave food, drink, and oil to the people of Sidon and Tyre, so they would bring cedar wood from Lebanon to Joppa by sea, according to the authorization given them by King Cyrus of Persia.";
csb[8] = "In the second month of the second year after they arrived at God\'s house in Jerusalem, Zerubbabel son of Shealtiel, Jeshua son of Jozadak, and the rest of their brothers, including the priests, the Levites, and all who had returned to Jerusalem from the captivity, began to build. They appointed the Levites who were twenty years old or more to supervise the work on the LORD\'s house.";
csb[9] = "Jeshua with his sons and brothers, Kadmiel with his sons, and the sons of Judah and of Henadad, with their sons and brothers, the Levites, joined together to supervise those working on the house of God.";
csb[10] = "When the builders had laid the foundation of the LORD\'s temple, the priests, dressed in their robes and holding trumpets, and the Levites descended from Asaph, holding cymbals, took their positions to praise the LORD, as King David of Israel had instructed.";
csb[11] = "They sang with praise and thanksgiving to the LORD: &quot;For he is good; his faithful love to Israel endures forever.&quot; Then all the people gave a great shout of praise to the LORD because the foundation of the LORD\'s house had been laid.";
csb[12] = "But many of the older priests, Levites, and family heads, who had seen the first temple, wept loudly when they saw the foundation of this temple, but many others shouted joyfully.";
csb[13] = "The people could not distinguish the sound of the joyful shouting from that of the weeping, because the people were shouting so loudly. And the sound was heard far away.";
kjv[1] = "And when the seventh month was come, and the children of Israel [were] in the cities, the people gathered themselves together as one man to Jerusalem.";
rsv[1] = "When the seventh month came, and the sons of Israel were in the towns, the people gathered as one man to Jerusalem.";
asv[1] = "And when the seventh month was come, and the children of Israel were in the cities, the people gathered themselves together as one man to Jerusalem.";
yng[1] = "And the seventh month cometh, and the sons of Israel [are] in the cities, and the people are gathered, as one men, unto Jerusalem.";
dby[1] = "And when the seventh month came, and the children of Israel were in the cities, the people gathered together as one man to Jerusalem.";
web[1] = "And when the seventh month had come, and the children of Israel [were] in the cities, the people assembled themselves as one man at Jerusalem.";
hnv[1] = "When the seventh month was come, and the children of Yisra\'el were in the cities, the people gathered themselves together as one man to Yerushalayim.";
vul[1] = "iamque venerat mensis septimus et erant filii Israhel in civitatibus suis congregatus est ergo populus quasi vir unus in Hierusalem";
kjv[2] = "Then stood up Jeshua the son of Jozadak, and his brethren the priests, and Zerubbabel the son of Shealtiel, and his brethren, and builded the altar of the God of Israel, to offer burnt offerings thereon, as [it is] written in the law of Moses the man of God.";
rsv[2] = "Then arose Jeshua the son of Jo\'zadak, with his fellow priests, and Zerub\'babel the son of She-al\'ti-el with his kinsmen, and they built the altar of the God of Israel, to offer burnt offerings upon it, as it is written in the law of Moses the man of God.";
asv[2] = "Then stood up Jeshua the son of Jozadak, and his brethren the priests, and Zerubbabel the son of Shealtiel, and his brethren, and builded the altar of the God of Israel, to offer burnt-offerings thereon, as it is written in the law of Moses the man of God.";
yng[2] = "And rise doth Jeshua son of Jozadak, and his brethren the priests, and Zerubbabel son of Shealtiel, and his brethren, and they build the altar of the God of Israel, to cause to ascend upon it burnt-offerings, as it is written in the law of Moses, the man of God.";
dby[2] = "Then stood up Jeshua the son of Jozadak, and his brethren the priests, and Zerubbabel the son of Shealtiel, and his brethren, and built the altar of the God of Israel, to offer up burnt-offerings on it, as it is written in the law of Moses the man of God.";
web[2] = "Then stood up Jeshua the son of Jozadak, and his brethren the priests, and Zerubbabel the son of Shealtiel, and his brethren, and built the altar of the God of Israel, to offer burnt-offerings on it as [it is] written in the law of Moses the man of God.";
hnv[2] = "Then stood up Yeshua the son of Yotzadak, and his brothers the Kohanim, and Zerubbavel the son of She\'alti\'el, and his brothers, and built the altar of the God of Yisra\'el, to offer burnt offerings thereon, as it is written in the law of Moshe the man of God.";
vul[2] = "et surrexit Iosue filius Iosedech et fratres eius sacerdotes et Zorobabel filius Salathihel et fratres eius et aedificaverunt altare Dei Israhel ut offerrent in eo holocaustomata sicut scriptum est in lege Mosi viri Dei";
kjv[3] = "And they set the altar upon his bases; for fear [was] upon them because of the people of those countries: and they offered burnt offerings thereon unto the LORD, [even] burnt offerings morning and evening.";
rsv[3] = "They set the altar in its place, for fear was upon them because of the peoples of the lands, and they offered burnt offerings upon it to the LORD, burnt offerings morning and evening.";
asv[3] = "And they set the altar upon its base; for fear was upon them because of the peoples of the countries: and they offered burnt-offerings thereon unto Jehovah, even burnt-offerings morning and evening.";
yng[3] = "And they establish the altar on its bases, because of the fear upon them of the peoples of the lands, and he causeth burnt-offerings to ascend upon it to Jehovah, burnt-offerings for the morning and for the evening.";
dby[3] = "And they set the altar on its base; for fear was upon them because of the people of the countries; and they offered up burnt-offerings on it to Jehovah, the morning and evening burnt-offerings.";
web[3] = "And they set the altar upon its bases; for fear [was] upon them because of the people of those countries: and they offered burnt-offerings on it to the LORD, [even] burnt-offerings morning and evening.";
hnv[3] = "They set the altar on its base; for fear was on them because of the peoples of the countries: and they offered burnt offerings thereon to the LORD, even burnt offerings morning and evening.";
vul[3] = "conlocaverunt autem altare super bases suas deterrentibus eos per circuitum populis terrarum et obtulerunt super illud holocaustum Domino mane et vespere";
kjv[4] = "They kept also the feast of tabernacles, as [it is] written, and [offered] the daily burnt offerings by number, according to the custom, as the duty of every day required;";
rsv[4] = "And they kept the feast of booths, as it is written, and offered the daily burnt offerings by number according to the ordinance, as each day required,";
asv[4] = "And they kept the feast of tabernacles, as it is written, and [offered] the daily burnt-offerings by number, according to the ordinance, as the duty of every day required;";
yng[4] = "And they make the feast of the booths as it is written, and the burnt-offering of the day daily in number according to the ordinance, the matter of a day in its day;";
dby[4] = "And they held the feast of tabernacles as it is written, and [offered] daily burnt-offerings by number, according to the ordinance, as the duty of every day required;";
web[4] = "They kept also the feast of tabernacles, as [it is] written, and [offered] the daily burnt-offerings by number, according to the custom, as the duty of every day required;";
hnv[4] = "They kept the feast of booths, as it is written, and [offered] the daily burnt offerings by number, according to the ordinance, as the duty of every day required;";
vul[4] = "feceruntque sollemnitatem tabernaculorum sicut scriptum est et holocaustum diebus singulis per ordinem secundum praeceptum opus diei in die suo";
kjv[5] = "And afterward [offered] the continual burnt offering, both of the new moons, and of all the set feasts of the LORD that were consecrated, and of every one that willingly offered a freewill offering unto the LORD.";
rsv[5] = "and after that the continual burnt offerings, the offerings at the new moon and at all the appointed feasts of the LORD, and the offerings of every one who made a freewill offering to the LORD.";
asv[5] = "and afterward the continual burnt-offering, and [the offerings] of the new moons, and of all the set feasts of Jehovah that were consecrated, and of every one that willingly offered a freewill-offering unto Jehovah.";
yng[5] = "and after this a continual burnt-offering, and for new moons, and for all appointed seasons of Jehovah that are sanctified; and for every one who is willingly offering a willing-offering to Jehovah.";
dby[5] = "and afterwards the continual burnt-offering, and those of the new moons, and of all the set feasts of Jehovah that were consecrated, and of every one that willingly offered a voluntary offering to Jehovah.";
web[5] = "And afterward [offered] the continual burnt-offering, both of the new moons, and of all the set feasts of the LORD that were consecrated, and of every one that willingly offered a free-will-offering to the LORD.";
hnv[5] = "and afterward the continual burnt-offering, and [the offerings] of the new moons, and of all the set feasts of the LORD that were consecrated, and of everyone who willingly offered a freewill-offering to the LORD.";
vul[5] = "et post haec holocaustum iuge tam in kalendis quam in universis sollemnitatibus Domini quae erant consecratae et in omnibus in quibus ultro offerebatur munus Deo";
kjv[6] = "From the first day of the seventh month began they to offer burnt offerings unto the LORD. But the foundation of the temple of the LORD was not [yet] laid.";
rsv[6] = "From the first day of the seventh month they began to offer burnt offerings to the LORD. But the foundation of the temple of the LORD was not yet laid.";
asv[6] = "From the first day of the seventh month began they to offer burnt-offerings unto Jehovah: but the foundation of the temple of Jehovah was not yet laid.";
yng[6] = "From the first day of the seventh month they have begun to cause burnt-offerings to ascend to Jehovah, and the temple of Jehovah hath not been founded,";
dby[6] = "From the first day of the seventh month they began to offer up burnt-offerings to Jehovah. But the foundation of the temple of Jehovah was not [yet] laid.";
web[6] = "From the first day of the seventh month they began to offer burnt-offerings to the LORD. But the foundation of the temple of the LORD was not [yet] laid.";
hnv[6] = "From the first day of the seventh month began they to offer burnt offerings to the LORD: but the foundation of the temple of the LORD was not yet laid.";
vul[6] = "a primo die mensis septimi coeperunt offerre holocaustum Domino porro templum Dei fundatum necdum erat";
kjv[7] = "They gave money also unto the masons, and to the carpenters; and meat, and drink, and oil, unto them of Zidon, and to them of Tyre, to bring cedar trees from Lebanon to the sea of Joppa, according to the grant that they had of Cyrus king of Persia.";
rsv[7] = "So they gave money to the masons and the carpenters, and food, drink, and oil to the Sido\'nians and the Tyrians to bring cedar trees from Lebanon to the sea, to Joppa, according to the grant which they had from Cyrus king of Persia.";
asv[7] = "They gave money also unto the masons, and to the carpenters; and food, and drink, and oil, unto them of Sidon, and to them of Tyre, to bring cedar-trees from Lebanon to the sea, unto Joppa, according to the grant that they had of Cyrus king of Persia.";
yng[7] = "and they give money to hewers and to artificers, and food, and drink, and oil to Zidonians and to Tyrians, to bring in cedar-trees from Lebanon unto the sea of Joppa, according to the permission of Cyrus king of Persia concerning them.";
dby[7] = "And they gave money to the masons and to the carpenters; and meat and drink and oil to the Zidonians and to the Tyrians, to bring cedar-trees from Lebanon to the sea at Joppa, according to the grant that they had of Cyrus king of Persia.";
web[7] = "They gave money also to the masons, and to the carpenters; and provisions, and drink, and oil, to them of Zidon, and to them of Tyre, to bring cedar trees from Lebanon to the sea of Joppa, according to the grant that they had of Cyrus king of Persia.";
hnv[7] = "They gave money also to the masons, and to the carpenters; and food, and drink, and oil, to them of Tzidon, and to them of Tzor, to bring cedar trees from Levanon to the sea, to Yafo, according to the grant that they had of Koresh king of Paras.";
vul[7] = "dederunt autem pecunias latomis et cementariis cibum quoque et potum et oleum Sidoniis Tyriisque ut deferrent ligna cedrina de Libano ad mare Ioppes iuxta quod praeceperat Cyrus rex Persarum eis";
kjv[8] = "Now in the second year of their coming unto the house of God at Jerusalem, in the second month, began Zerubbabel the son of Shealtiel, and Jeshua the son of Jozadak, and the remnant of their brethren the priests and the Levites, and all they that were come out of the captivity unto Jerusalem; and appointed the Levites, from twenty years old and upward, to set forward the work of the house of the LORD.";
rsv[8] = "Now in the second year of their coming to the house of God at Jerusalem, in the second month, Zerub\'babel the son of She-al\'ti-el and Jeshua the son of Jo\'zadak made a beginning, together with the rest of their brethren, the priests and the Levites and all who had come to Jerusalem from the captivity. They appointed the Levites, from twenty years old and upward, to have the oversight of the work of the house of the LORD.";
asv[8] = "Now in the second year of their coming unto the house of God at Jerusalem, in the second month, began Zerubbabel the son of Shealtiel, and Jeshua the son of Jozadak, and the rest of their brethren the priests and the Levites, and all they that were come out of the captivity unto Jerusalem, and appointed the Levites, from twenty years old and upward, to have the oversight of the work of the house of Jehovah.";
yng[8] = "And in the second year of their coming in unto the house of God, to Jerusalem, in the second month, began Zerubbabel son of Shealtiel, and Jeshua son of Jozadak, and the remnant of their brethren the priests and the Levites, and all those coming from the captivity to Jerusalem, and they appoint the Levites from a son of twenty years and upward, to overlook the work of the house of Jehovah.";
dby[8] = "And in the second year of their coming to the house of God at Jerusalem, in the second month, began Zerubbabel the son of Shealtiel, and Jeshua the son of Jozadak, and the remnant of their brethren the priests and the Levites, and all they that had come out of the captivity to Jerusalem; and they appointed the Levites, from twenty years old and upward, to superintend the work of the house of Jehovah.";
web[8] = "Now in the second year of their coming to the house of God at Jerusalem, in the second month, began Zerubbabel the son of Shealtiel, and Jeshua the son of Jozadak, and the remnant of their brethren the priests and the Levites, and all they that had come out of the captivity to Jerusalem; and appointed the Levites, from twenty years old and upward, to set forward the work of the house of the LORD.";
hnv[8] = "Now in the second year of their coming to the house of God at Yerushalayim, in the second month, began Zerubbavel the son of She\'alti\'el, and Yeshua the son of Yotzadak, and the rest of their brothers the Kohanim and the Levites, and all those who were come out of the captivity to Yerushalayim, and appointed the Levites, from twenty years old and upward, to have the oversight of the work of the house of the LORD.";
vul[8] = "anno autem secundo adventus eorum ad templum Dei in Hierusalem mense secundo coeperunt Zorobabel filius Salathihel et Iosue filius Iosedech et reliqui de fratribus eorum sacerdotes et Levitae et omnes qui venerant de captivitate in Hierusalem et constituerunt Levitas a viginti annis et supra ut urguerent opus Domini";
kjv[9] = "Then stood Jeshua [with] his sons and his brethren, Kadmiel and his sons, the sons of Judah, together, to set forward the workmen in the house of God: the sons of Henadad, [with] their sons and their brethren the Levites.";
rsv[9] = "And Jeshua with his sons and his kinsmen, and Kad\'mi-el and his sons, the sons of Judah, together took the oversight of the workmen in the house of God, along with the sons of Hen\'adad and the Levites, their sons and kinsmen.";
asv[9] = "Then stood Jeshua with his sons and his brethren, Kadmiel and his sons, the sons of Judah, together, to have the oversight of the workmen in the house of God: the sons of Henadad, with their sons and their brethren the Levites.";
yng[9] = "And Jeshua standeth, [and] his sons, and his brethren, Kadmiel and his sons, sons of Judah together, to overlook those doing the work in the house of God; the sons of Henadad, [and] their sons and their brethren the Levites.";
dby[9] = "And Jeshua stood up, his sons and his brethren, Kadmiel and his sons, the sons of Judah, as one [man], to superintend the workmen in the house of God; [also] the sons of Henadad, their sons and their brethren, the Levites.";
web[9] = "Then stood Jeshua [with] his sons and his brethren, Kadmiel and his sons, the sons of Judah, together, to set forward the workmen in the house of God: the sons of Henadad, [with] their sons and their brethren the Levites.";
hnv[9] = "Then stood Yeshua with his sons and his brothers, Kadmi\'el and his sons, the sons of Yehudah, together, to have the oversight of the workmen in the house of God: the sons of Henadad, with their sons and their brothers the Levites.";
vul[9] = "stetitque Iosue filii eius et fratres eius Cedmihel et filii eius et filii Iuda quasi unus ut instarent super eos qui faciebant opus in templo Dei filii Enadad filii eorum et fratres eorum Levitae";
kjv[10] = "And when the builders laid the foundation of the temple of the LORD, they set the priests in their apparel with trumpets, and the Levites the sons of Asaph with cymbals, to praise the LORD, after the ordinance of David king of Israel.";
rsv[10] = "And when the builders laid the foundation of the temple of the LORD, the priests in their vestments came forward with trumpets, and the Levites, the sons of Asaph, with cymbals, to praise the LORD, according to the directions of David king of Israel;";
asv[10] = "And when the builders laid the foundation of the temple of Jehovah, they set the priests in their apparel with trumpets, and the Levites the sons of Asaph with cymbals, to praise Jehovah, after the order of David king of Israel.";
yng[10] = "And those building have founded the temple of Jehovah, and they appoint the priests, clothed, with trumpets, and the Levites, sons of Asaph, with cymbals, to praise Jehovah, by means of [the instruments of] David king of Israel.";
dby[10] = "And when the builders laid the foundation of the temple of Jehovah, they set the priests in their apparel, with trumpets, and the Levites the sons of Asaph, with cymbals, to praise Jehovah according to the directions of David king of Israel.";
web[10] = "And when the builders laid the foundation of the temple of the LORD, they set the priests in their apparel with trumpets, and the Levites the sons of Asaph with cymbals, to praise the LORD, after the ordinance of David king of Israel.";
hnv[10] = "When the builders laid the foundation of the temple of the LORD, they set the Kohanim in their clothing with trumpets, and the Levites the sons of Asaf with cymbals, to praise the LORD, after the order of David king of Yisra\'el.";
vul[10] = "fundato igitur a cementariis templo Domini steterunt sacerdotes in ornatu suo cum tubis et Levitae filii Asaph in cymbalis ut laudarent Deum per manus David regis Israhel";
kjv[11] = "And they sang together by course in praising and giving thanks unto the LORD; because [he is] good, for his mercy [endureth] for ever toward Israel. And all the people shouted with a great shout, when they praised the LORD, because the foundation of the house of the LORD was laid.";
rsv[11] = "and they sang responsively, praising and giving thanks to the LORD, &quot;For he is good, for his steadfast love endures for ever toward Israel.&quot; And all the people shouted with a great shout, when they praised the LORD, because the foundation of the house of the LORD was laid.";
asv[11] = "And they sang one to another in praising and giving thanks unto Jehovah, [saying], For he is good, for his lovingkindness [endureth] for ever toward Israel. And all the people shouted with a great shout, when they praised Jehovah, because the foundation of the house of Jehovah was laid.";
yng[11] = "And they respond in praising and in giving thanks to Jehovah, for good, for to the age His kindness [is] over Israel, and all the people have shouted -- a great shout -- in giving praise to Jehovah, because the house of Jehovah hath been founded.";
dby[11] = "And they sang alternately together in praising and giving thanks to Jehovah: For he is good, for his loving-kindness [endureth] for ever toward Israel. And all the people shouted with a great shout to the praise of Jehovah, because the foundation of the house of Jehovah was laid.";
web[11] = "And they sang together by course in praising and giving thanks to the LORD; because [he is] good, for his mercy [endureth] for ever towards Israel. And all the people shouted with a great shout, when they praised the LORD, because the foundation of the house of the LORD was laid.";
hnv[11] = "They sang one to another in praising and giving thanks to the LORD, [saying], For he is good, for his lovingkindness endures forever toward Yisra\'el. All the people shouted with a great shout, when they praised the LORD, because the foundation of the house of the LORD was laid.";
vul[11] = "et concinebant in hymnis et confessione Domino quoniam bonus quoniam in aeternum misericordia eius super Israhel omnis quoque populus vociferabatur clamore magno in laudando Dominum eo quod fundatum esset templum Domini";
kjv[12] = "But many of the priests and Levites and chief of the fathers, [who were] ancient men, that had seen the first house, when the foundation of this house was laid before their eyes, wept with a loud voice; and many shouted aloud for joy:";
rsv[12] = "But many of the priests and Levites and heads of fathers\' houses, old men who had seen the first house, wept with a loud voice when they saw the foundation of this house being laid, though many shouted aloud for joy;";
asv[12] = "But many of the priests and Levites and heads of fathers\' [houses], the old men that had seen the first house, when the foundation of this house was laid before their eyes, wept with a loud voice; and many shouted aloud for joy:";
yng[12] = "And many of the priests, and the Levites, and the heads of the fathers, the aged men who had seen the first house -- in this house being founded before their eyes -- are weeping with a loud voice, and many with a shout, in joy, lifting up the voice;";
dby[12] = "But many of the priests and Levites and chief fathers, the ancient men that had seen the first house, wept with a loud voice, [when] the foundation of this house was laid in their sight; and many shouted aloud for joy.";
web[12] = "But many of the priests and Levites and chief of the fathers, old men, that had seen the first house, when the foundation of this house was laid before their eyes, wept with a loud voice; and many shouted aloud for joy:";
hnv[12] = "But many of the Kohanim and Levites and heads of fathers\' [houses], the old men who had seen the first house, when the foundation of this house was laid before their eyes, wept with a loud voice; and many shouted aloud for joy:";
vul[12] = "plurimi etiam de sacerdotibus et Levitis et principes patrum seniores qui viderant templum prius cum fundatum esset et hoc templum in oculis eorum flebant voce magna et multi vociferantes in laetitia elevabant vocem";
kjv[13] = "So that the people could not discern the noise of the shout of joy from the noise of the weeping of the people: for the people shouted with a loud shout, and the noise was heard afar off.";
rsv[13] = "so that the people could not distinguish the sound of the joyful shout from the sound of the people\'s weeping, for the people shouted with a great shout, and the sound was heard afar.";
asv[13] = "so that the people could not discern the noise of the shout of joy from the noise of the weeping of the people; for the people shouted with a loud shout, and the noise was heard afar off.";
yng[13] = "and the people are not discerning the noise of the shout of joy from the noise of the weeping of the people, for the people are shouting -- a great shout -- and the noise hath been heard unto a distance.";
dby[13] = "And the people could not discern the noise of the shout of joy from the noise of the weeping of the people; for the people shouted with a great shout, and the noise was heard afar off.";
web[13] = "So that the people could not discern the noise of the shout of the joy from the noise of the weeping of the people: for the people shouted with a loud shout, and the noise was heard afar off.";
hnv[13] = "so that the people could not discern the noise of the shout of joy from the noise of the weeping of the people; for the people shouted with a loud shout, and the noise was heard afar off.";
vul[13] = "nec poterat quisquam agnoscere vocem clamoris laetantium et vocem fletus populi commixtim enim populus vociferabatur clamore magno et vox audiebatur procul";
