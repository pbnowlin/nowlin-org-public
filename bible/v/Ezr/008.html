csb[1] = "These are the family heads and the genealogical records of those who returned with me from Babylon during the reign of King Artaxerxes:";
csb[2] = "Gershom, from Phinehas\'s descendants; Daniel, from Ithamar\'s descendants; Hattush, from David\'s descendants,";
csb[3] = "who was of Shecaniah\'s descendants; Zechariah, from Parosh\'s descendants, and 150 men with him who were registered by genealogy;";
csb[4] = "Eliehoenai son of Zerahiah from Pahath-moab\'s descendants, and 200 men with him;";
csb[5] = "Shecaniah son of Jahaziel from Zattu\'s descendants, and 300 men with him;";
csb[6] = "Ebed son of Jonathan from Adin\'s descendants, and 50 men with him;";
csb[7] = "Jeshaiah son of Athaliah from Elam\'s descendants, and 70 men with him;";
csb[8] = "Zebadiah son of Michael from Shephatiah\'s descendants, and 80 men with him;";
csb[9] = "Obadiah son of Jehiel from Joab\'s descendants, and 218 men with him;";
csb[10] = "Shelomith son of Josiphiah from Bani\'s descendants, and 160 men with him;";
csb[11] = "Zechariah son of Bebai from Bebai\'s descendants, and 28 men with him;";
csb[12] = "Johanan son of Hakkatan from Azgad\'s descendants, and 110 men with him;";
csb[13] = "these are the last ones, from Adonikam\'s descendants, and their names are Eliphelet, Jeuel, and Shemaiah, and 60 men with them;";
csb[14] = "Uthai and Zaccur from Bigvai\'s descendants, and 70 men with them.";
csb[15] = "I gathered them at the river that flows to Ahava, and we camped there for three days. I searched among the people and priests, but found no Levites there.";
csb[16] = "Then I summoned the leaders: Eliezer, Ariel, Shemaiah, Elnathan, Jarib, Elnathan, Nathan, Zechariah, and Meshullam, as well as the teachers Joiarib and Elnathan.";
csb[17] = "I sent them to Iddo, the leader at Casiphia, with a message for him and his brothers, the temple servants at Casiphia, that they should bring us ministers for the house of our God.";
csb[18] = "Since the gracious hand of our God was on us, they brought us Sherebiah -- a man of insight from the descendants of Mahli, a descendant of Levi son of Israel -- along with his sons and brothers, 18 men,";
csb[19] = "plus Hashabiah, along with Jeshaiah, from the descendants of Merari, and his brothers and their sons, 20 men.";
csb[20] = "There were also 220 of the temple servants, who had been appointed by David and the leaders for the work of the Levites. All were identified by name.";
csb[21] = "I proclaimed a fast by the Ahava River, so that we might humble ourselves before our God and ask him for a safe journey for us, our dependents, and all our possessions.";
csb[22] = "I did this because I was ashamed to ask the king for infantry and cavalry to protect us from enemies during the journey, since we had told him, &quot;The hand of our God is gracious to all who seek him, but his fierce anger is against all who abandon him.&quot;";
csb[23] = "So we fasted and pleaded with our God about this, and he was receptive to our prayer.";
csb[24] = "I selected twelve of the leading priests, along with Sherebiah, Hashabiah, and ten of their brothers.";
csb[25] = "I weighed out to them the silver, the gold, and the articles -- the contribution for the house of our God that the king, his counselors, his leaders, and all the Israelites who were present had offered.";
csb[26] = "I weighed out to them 24 tons of silver, silver articles weighing 7,500 pounds, 7,500 pounds of gold,";
csb[27] = "twenty gold bowls worth a thousand gold coins, and two articles of fine gleaming bronze, as valuable as gold.";
csb[28] = "Then I said to them, &quot;You are holy to the LORD, and the articles are holy. The silver and gold are a freewill offering to the LORD God of your fathers.";
csb[29] = "&quot;Guard them carefully until you weigh them out in the chambers of the LORD\'s house before the leading priests, Levites, and heads of the Israelite families in Jerusalem.&quot;";
csb[30] = "So the priests and Levites took charge of the silver, the gold, and the articles that had been weighed out, to bring them to the house of our God in Jerusalem.";
csb[31] = "We set out from the Ahava River on the twelfth day of the first month to go to Jerusalem. We were strengthened by our God, and he kept us from the grasp of the enemy and from ambush along the way.";
csb[32] = "So we arrived at Jerusalem and rested there for three days.";
csb[33] = "On the fourth day the silver, the gold, and the articles were weighed out in the house of our God into the care of the priest Meremoth son of Uriah. Eleazar son of Phinehas was with him. The Levites Jozabad son of Jeshua and Noadiah son of Binnui were also with them.";
csb[34] = "Everything was verified by number and weight, and the total weight was recorded at that time.";
csb[35] = "The exiles who had returned from the captivity offered burnt offerings to the God of Israel: twelve bulls for all Israel, ninety-six rams, and seventy-seven lambs, along with twelve male goats as a sin offering. All this was a burnt offering for the LORD.";
csb[36] = "They also delivered the king\'s edicts to the royal satraps and governors of the region west of the Euphrates, so that they would support the people and the house of God.";

kjv[15] = "And I gathered them together to the river that runneth to Ahava; and there abode we in tents three days: and I viewed the people, and the priests, and found there none of the sons of Levi.";
rsv[15] = "I gathered them to the river that runs to Aha\'va, and there we encamped three days. As I reviewed the people and the priests, I found there none of the sons of Levi.";
asv[15] = "And I gathered them together to the river that runneth to Ahava; and there we encamped three days: and I viewed the people, and the priests, and found there none of the sons of Levi.";
yng[15] = "And I gather them unto the river that is going unto Ahava, and we encamp there three days; and I consider about the people, and about the priests, and of the sons of Levi I have found none there;";
dby[15] = "And I gathered them together at the river that runs to Ahava; and there we encamped three days; and I surveyed the people and the priests, and found none of the sons of Levi there.";

kjv[16] = "Then sent I for Eliezer, for Ariel, for Shemaiah, and for Elnathan, and for Jarib, and for Elnathan, and for Nathan, and for Zechariah, and for Meshullam, chief men; also for Joiarib, and for Elnathan, men of understanding.";

yng[16] = "and I send for Eliezer, for Ariel, for Shemaiah, and for Elnathan, and for Jarib, and for Elnathan, and for Nathan, and for Zechariah, and for Meshullam, heads, and for Joiarib, and for Elnathan, men of understanding;";

vul[16] = "itaque misi Heliezer et Arihel et Semeam et Helnathan et Iarib et alterum Helnathan et Nathan et Zacchariam et Mesolam principes et Ioarib et Helnathan sapientes";
kjv[17] = "And I sent them with commandment unto Iddo the chief at the place Casiphia, and I told them what they should say unto Iddo, [and] to his brethren the Nethinims, at the place Casiphia, that they should bring unto us ministers for the house of our God.";
rsv[17] = "and sent them to Iddo, the leading man at the place Casiphi\'a, telling them what to say to Iddo and his brethren the temple servants at the place Casiphi\'a, namely, to send us ministers for the house of our God.";
asv[17] = "And I sent them forth unto Iddo the chief at the place Casiphia; and I told them what they should say unto Iddo, [and] his brethren the Nethinim, at the place Casiphia, that they should bring unto us ministers for the house of our God.";
yng[17] = "and I charge them for Iddo the head, in the place Casiphia, and put in their mouth words to speak unto Iddo, [and] his brethren the Nethinim, in the place Casiphia, to bring to us ministrants for the house of our God.";
dby[17] = "And I gave them a commission to Iddo the chief, at the place Casiphia, and I put words in their mouths to say to Iddo [and] his brethren the Nethinim, at the place Casiphia, that they should bring to us ministers for the house of our God.";
web[17] = "And I sent them with commandment to Iddo the chief at the place Casiphia, and I told them what they should say to Iddo, [and] to his brethren the Nethinims, at the place Casiphia, that they should bring to us ministers for the house of our God.";
hnv[17] = "I sent them forth to `Iddo the chief at the place Kasifyah; and I told them what they should tell `Iddo, [and] his brothers the temple servants, at the place Kasifyah, that they should bring to us ministers for the house of our God.";
vul[17] = "et misi eos ad Heddo qui est primus in Casphiae loco et posui in ore eorum verba quae loquerentur ad Addom et ad fratres eius Nathinneos in loco Casphiae ut adducerent nobis ministros domus Dei nostri";
kjv[18] = "And by the good hand of our God upon us they brought us a man of understanding, of the sons of Mahli, the son of Levi, the son of Israel; and Sherebiah, with his sons and his brethren, eighteen;";
rsv[18] = "And by the good hand of our God upon us, they brought us a man of discretion, of the sons of Mahli the son of Levi, son of Israel, namely Sherebi\'ah with his sons and kinsmen, eighteen;";

yng[18] = "And they bring to us, according to the good hand of our God upon us, a man of understanding, of the sons of Mahli, son of Levi, son of Israel, and Sherebiah, and his sons, and his brethren, eighteen;";

hnv[18] = "According to the good hand of our God on us they brought us a man of discretion, of the sons of Machli, the son of Levi, the son of Yisra\'el; and Sherevyah, with his sons and his brothers, eighteen;";
vul[18] = "et adduxerunt nobis per manum Dei nostri bonam super nos virum doctissimum de filiis Moolli filii Levi filii Israhel et Sarabiam et filios eius et fratres eius decem et octo";
kjv[19] = "And Hashabiah, and with him Jeshaiah of the sons of Merari, his brethren and their sons, twenty;";
rsv[19] = "also Hashabi\'ah and with him Jeshai\'ah of the sons of Merar\'i, with his kinsmen and their sons, twenty;";
asv[19] = "and Hashabiah, and with him Jeshaiah of the sons of Merari, his brethren and their sons, twenty;";
yng[19] = "and Hashabiah, and with him Jeshaiah, of the sons of Merari, his brethren, and their sons, twenty;";
dby[19] = "and Hashabiah, and with him Isaiah of the sons of Merari, his brethren and their sons, twenty;";
web[19] = "And Hashabiah, and with him Jeshaiah of the sons of Merari, his brethren and their sons, twenty;";
hnv[19] = "and Hashavyah, and with him Yesha`yah of the sons of Merari, his brothers and their sons, twenty;";
vul[19] = "et Asabiam et cum eo Isaiam de filiis Merari fratres eius et filios eius viginti";
kjv[20] = "Also of the Nethinims, whom David and the princes had appointed for the service of the Levites, two hundred and twenty Nethinims: all of them were expressed by name.";
rsv[20] = "besides two hundred and twenty of the temple servants, whom David and his officials had set apart to attend the Levites. These were all mentioned by name.";
asv[20] = "and of the Nethinim, whom David and the princes had given for the service of the Levites, two hundred and twenty Nethinim: all of them were mentioned by name.";
yng[20] = "and from the Nethinim, whom David and the heads gave for the service of the Levites, two hundred and twenty Nethinim, all of them defined by name.";
dby[20] = "and of the Nethinim, whom David and the princes had appointed for the service of the Levites, two hundred and twenty Nethinim: all of them were expressed by name.";
web[20] = "Also of the Nethinims, whom David and the princes had appointed for the service of the Levites, two hundred and twenty Nethinims: all of them were expressed by name.";
hnv[20] = "and of the temple servants, whom David and the princes had given for the service of the Levites, two hundred and twenty temple servants: all of them were mentioned by name.";
vul[20] = "et de Nathinneis quos dederat David et principes ad ministeria Levitarum Nathinneos ducentos viginti omnes hii suis nominibus vocabantur";
kjv[21] = "Then I proclaimed a fast there, at the river of Ahava, that we might afflict ourselves before our God, to seek of him a right way for us, and for our little ones, and for all our substance.";
rsv[21] = "Then I proclaimed a fast there, at the river Aha\'va, that we might humble ourselves before our God, to seek from him a straight way for ourselves, our children, and all our goods.";
asv[21] = "Then I proclaimed a fast there, at the river Ahava, that we might humble ourselves before our God, to seek of him a straight way for us, and for our little ones, and for all our substance.";
yng[21] = "And I proclaim there a fast, by the river Ahava, to afflict ourselves before our God, to seek from Him a right way for us, and for our infants, and for all our substance,";
dby[21] = "And I proclaimed a fast there, at the river Ahava, that we might humble ourselves before our God, to seek of him a right way for us, and for our little ones, and for all our substance.";
web[21] = "Then I proclaimed a fast there, at the river Ahava, that we might afflict ourselves before our God, to seek of him a right way for us, and for our little ones, and for all our substance.";
hnv[21] = "Then I proclaimed a fast there, at the river Ahava, that we might humble ourselves before our God, to seek of him a straight way for us, and for our little ones, and for all our substance.";
vul[21] = "et praedicavi ibi ieiunium iuxta fluvium Ahavva ut adfligeremur coram Domino Deo nostro et peteremus ab eo viam rectam nobis et filiis nostris universaeque substantiae nostrae";
kjv[22] = "For I was ashamed to require of the king a band of soldiers and horsemen to help us against the enemy in the way: because we had spoken unto the king, saying, The hand of our God [is] upon all them for good that seek him; but his power and his wrath [is] against all them that forsake him.";
rsv[22] = "For I was ashamed to ask the king for a band of soldiers and horsemen to protect us against the enemy on our way; since we had told the king, &quot;The hand of our God is for good upon all that seek him, and the power of his wrath is against all that forsake him.&quot;";
asv[22] = "For I was ashamed to ask of the king a band of soldiers and horsemen to help us against the enemy in the way, because we had spoken unto the king, saying, The hand of our God is upon all them that seek him, for good; but his power and his wrath is against all them that forsake him.";
yng[22] = "for I was ashamed to ask from the king a force and horsemen to help us because of the enemy in the way, for we spake to the king, saying, `The hand of our God [is] upon all seeking Him for good, and His strength and His wrath [is] upon all forsaking Him.\'";
dby[22] = "For I was ashamed to require of the king a band of soldiers and horsemen to help us against the enemy in the way; for we had spoken to the king saying, The hand of our God is upon all them for good that seek him; but his power and his anger is against all them that forsake him.";
web[22] = "For I was ashamed to require of the king a band of soldiers and horsemen to help us against the enemy in the way: because we had spoken to the king, saying, The hand of our God [is] upon all them for good that seek him; but his power and his wrath [is] against all them that forsake him.";
hnv[22] = "For I was ashamed to ask of the king a band of soldiers and horsemen to help us against the enemy in the way, because we had spoken to the king, saying, The hand of our God is on all those who seek him, for good; but his power and his wrath is against all those who forsake him.";
vul[22] = "erubui enim petere regem auxilium et equites qui defenderent nos ab inimico in via quia dixeramus regi manus Dei nostri est super omnes qui quaerunt eum in bonitate et imperium eius et fortitudo eius et furor super omnes qui derelinquunt eum";
kjv[23] = "So we fasted and besought our God for this: and he was intreated of us.";
rsv[23] = "So we fasted and besought our God for this, and he listened to our entreaty.";
asv[23] = "So we fasted and besought our God for this: and he was entreated of us.";
yng[23] = "And we fast, and seek from our God for this, and He is entreated of us.";
dby[23] = "And we fasted, and besought our God for this; and he was entreated of us.";
web[23] = "So we fasted and besought our God for this: and he was entreated by us.";
hnv[23] = "So we fasted and begged our God for this: and he was entreated of us.";
vul[23] = "ieiunavimus autem et rogavimus Deum nostrum pro hoc et evenit nobis prospere";
kjv[24] = "Then I separated twelve of the chief of the priests, Sherebiah, Hashabiah, and ten of their brethren with them,";
rsv[24] = "Then I set apart twelve of the leading priests: Sherebi\'ah, Hashabi\'ah, and ten of their kinsmen with them.";
asv[24] = "Then I set apart twelve of the chiefs of the priests, even Sherebiah, Hashabiah, and ten of their brethren with them,";
yng[24] = "And I separate from the heads of the priests, twelve, even Sherebiah, Hashabiah, and with them of their brethren ten,";
dby[24] = "And I separated twelve of the chiefs of the priests, Sherebiah, Hashabiah, and ten of their brethren with them,";
web[24] = "Then I separated twelve of the chief of the priests, Sherebiah, Hashabiah, and ten of their brethren with them,";
hnv[24] = "Then I set apart twelve of the chiefs of the Kohanim, even Sherevyah, Hashavyah, and ten of their brothers with them,";
vul[24] = "et separavi de principibus sacerdotum duodecim Sarabian Asabian et cum eis de fratribus eorum decem";
kjv[25] = "And weighed unto them the silver, and the gold, and the vessels, [even] the offering of the house of our God, which the king, and his counsellors, and his lords, and all Israel [there] present, had offered:";
rsv[25] = "And I weighed out to them the silver and the gold and the vessels, the offering for the house of our God which the king and his counselors and his lords and all Israel there present had offered;";
asv[25] = "and weighed unto them the silver, and the gold, and the vessels, even the offering for the house of our God, which the king, and his counsellors, and his princes, and all Israel there present, had offered:";
yng[25] = "and I weigh to them the silver, and the gold, and the vessels, a heave-offering of the house of our God, that the king, and his counsellors, and his heads, and all Israel -- those present -- lifted up;";
dby[25] = "and I weighed to them the silver and the gold and the vessels, the heave-offering for the house of our God, which the king and his counsellors and his princes, and all Israel present, had offered.";
web[25] = "And weighed to them the silver, and the gold, and the vessels, [even] the offering of the house of our God, which the king, and his counselors, and his lords, and all Israel [there] present, had offered:";
hnv[25] = "and weighed to them the silver, and the gold, and the vessels, even the offering for the house of our God, which the king, and his counselors, and his princes, and all Yisra\'el there present, had offered:";
vul[25] = "adpendique eis argentum et aurum et vasa consecrata domus Dei nostri quae obtulerat rex et consiliatores eius et principes eius universusque Israhel eorum qui inventi fuerant";
kjv[26] = "I even weighed unto their hand six hundred and fifty talents of silver, and silver vessels an hundred talents, [and] of gold an hundred talents;";
rsv[26] = "I weighed out into their hand six hundred and fifty talents of silver, and silver vessels worth a hundred talents, and a hundred talents of gold,";
asv[26] = "I weighed into their hand six hundred and fifty talents of silver, and silver vessels a hundred talents; of gold a hundred talents;";
yng[26] = "and I weigh to their hand, of silver, talents six hundred and fifty, and of vessels of silver a hundred talents, of gold a hundred talents,";
dby[26] = "And I weighed into their hand six hundred and fifty talents of silver; and silver vessels a hundred talents, [and] of gold a hundred talents;";
web[26] = "I even weighed to their hand six hundred and fifty talents of silver, and silver vessels a hundred talents, [and] of gold a hundred talents;";
hnv[26] = "I weighed into their hand six hundred fifty talents of silver, and silver vessels one hundred talents; of gold one hundred talents;";
vul[26] = "et adpendi in manibus eorum argenti talenta sescenta quinquaginta et vasa argentea centum auri centum talenta";
kjv[27] = "Also twenty basons of gold, of a thousand drams; and two vessels of fine copper, precious as gold.";
rsv[27] = "twenty bowls of gold worth a thousand darics, and two vessels of fine bright bronze as precious as gold.";
asv[27] = "and twenty bowls of gold, of a thousand darics; and two vessels of fine bright brass, precious as gold.";
yng[27] = "and basins of gold twenty, of a thousand drams, and two vessels of good shining brass, desirable as gold.";
dby[27] = "and twenty basons of gold, of a thousand darics; and two vessels of shining copper, precious as gold.";
web[27] = "Also twenty basins of gold, of a thousand drams; and two vessels of fine copper, precious as gold.";
hnv[27] = "and twenty bowls of gold, of one thousand darics; and two vessels of fine bright brass, precious as gold.";
vul[27] = "et crateras aureos viginti qui habebant solidos millenos et vasa aeris fulgentis optimi duo pulchra ut aurum";
kjv[28] = "And I said unto them, Ye [are] holy unto the LORD; the vessels [are] holy also; and the silver and the gold [are] a freewill offering unto the LORD God of your fathers.";
rsv[28] = "And I said to them, &quot;You are holy to the LORD, and the vessels are holy; and the silver and the gold are a freewill offering to the LORD, the God of your fathers.";
asv[28] = "And I said unto them, Ye are holy unto Jehovah, and the vessels are holy; and the silver and the gold are a freewill-offering unto Jehovah, the God of your fathers.";
yng[28] = "And I say unto them, `Ye [are] holy to Jehovah, and the vessels [are] holy, and the silver and the gold [are] a willing-offering to Jehovah, God of your fathers;";
dby[28] = "And I said to them, Ye are holy unto Jehovah; the vessels also are holy; and the silver and the gold is a voluntary offering to Jehovah the God of your fathers.";
web[28] = "And I said to them, Ye [are] holy to the LORD; the vessels [are] holy also; and the silver and the gold [are] a free-will-offering to the LORD God of your fathers.";
hnv[28] = "I said to them, You are holy to the LORD, and the vessels are holy; and the silver and the gold are a freewill-offering to the LORD, the God of your fathers.";
vul[28] = "et dixi eis vos sancti Domini et vasa sancta et argentum et aurum quod sponte oblatum est Domino Deo patrum vestrorum";
kjv[29] = "Watch ye, and keep [them], until ye weigh [them] before the chief of the priests and the Levites, and chief of the fathers of Israel, at Jerusalem, in the chambers of the house of the LORD.";
rsv[29] = "Guard them and keep them until you weigh them before the chief priests and the Levites and the heads of fathers\' houses in Israel at Jerusalem, within the chambers of the house of the LORD.&quot;";
asv[29] = "Watch ye, and keep them, until ye weigh them before the chiefs of the priests and the Levites, and the princes of the fathers\' [houses] of Israel, at Jerusalem, in the chambers of the house of Jehovah.";
yng[29] = "watch, and keep, till ye weigh before the heads of the priests, and of the Levites, and the heads of the fathers of Israel, in Jerusalem, in the chambers of the house of Jehovah.\'";
dby[29] = "Watch and keep [them] until ye weigh them before the chiefs of the priests and the Levites, and the chiefs of the fathers of Israel, at Jerusalem, in the chambers of the house of Jehovah.";
web[29] = "Watch ye, and keep [them], until ye weigh [them], before the chief of the priests and the Levites, and chief of the fathers of Israel, at Jerusalem, in the chambers of the house of the LORD.";
hnv[29] = "Watch you, and keep them, until you weigh them before the chiefs of the Kohanim and the Levites, and the princes of the fathers\' [houses] of Yisra\'el, at Yerushalayim, in the chambers of the house of the LORD.";
vul[29] = "vigilate et custodite donec adpendatis coram principibus sacerdotum et Levitarum et ducibus familiarum Israhel in Hierusalem et thesaurum domus Domini";
kjv[30] = "So took the priests and the Levites the weight of the silver, and the gold, and the vessels, to bring [them] to Jerusalem unto the house of our God.";
rsv[30] = "So the priests and the Levites took over the weight of the silver and the gold and the vessels, to bring them to Jerusalem, to the house of our God.";
asv[30] = "So the priests and the Levites received the weight of the silver and the gold, and the vessels, to bring them to Jerusalem unto the house of our God.";
yng[30] = "And the priests and the Levites took the weight of the silver, and of the gold, and of the vessels, to bring to Jerusalem to the house of our God.";
dby[30] = "And the priests and the Levites received by weight the silver and the gold and the vessels, to bring them to Jerusalem unto the house of our God.";
web[30] = "So the priests and the Levites took the weight of the silver, and the gold, and the vessels, to bring [them] to Jerusalem to the house of our God.";
hnv[30] = "So the Kohanim and the Levites received the weight of the silver and the gold, and the vessels, to bring them to Yerushalayim to the house of our God.";
vul[30] = "susceperunt autem sacerdotes et Levitae pondus argenti et auri et vasorum ut deferrent in Hierusalem in domum Dei nostri";
kjv[31] = "Then we departed from the river of Ahava on the twelfth [day] of the first month, to go unto Jerusalem: and the hand of our God was upon us, and he delivered us from the hand of the enemy, and of such as lay in wait by the way.";
rsv[31] = "Then we departed from the river Aha\'va on the twelfth day of the first month, to go to Jerusalem; the hand of our God was upon us, and he delivered us from the hand of the enemy and from ambushes by the way.";
asv[31] = "Then we departed from the river Ahava on the twelfth [day] of the first month, to go unto Jerusalem: and the hand of our God was upon us, and he delivered us from the hand of the enemy and the lier-in-wait by the way.";
yng[31] = "And we journey from the river Ahava, on the twelfth of the first month, to go to Jerusalem, and the hand of our God hath been upon us, and He delivereth us from the hand of the enemy and the lier in wait by the way;";
dby[31] = "And we departed from the river Ahava on the twelfth of the first month, to go to Jerusalem; and the hand of our God was upon us, and he delivered us from the hand of the enemy, and of such as lay in wait by the way.";
web[31] = "Then we departed from the river Ahava on the twelfth [day] of the first month, to go to Jerusalem: and the hand of our God was upon us, and he delivered us from the hand of the enemy, and of such as lay in wait by the way.";
hnv[31] = " Then we departed from the river Ahava on the twelfth [day] of the first month, to go to Yerushalayim: and the hand of our God was on us, and he delivered us from the hand of the enemy and the bandit by the way.";
vul[31] = "promovimus ergo a flumine Ahavva duodecimo die mensis primi ut pergeremus Hierusalem et manus Dei nostri fuit super nos et liberavit nos de manu inimici et insidiatoris in via";
kjv[32] = "And we came to Jerusalem, and abode there three days.";
rsv[32] = "We came to Jerusalem, and there we remained three days.";
asv[32] = "And we came to Jerusalem, and abode there three days.";
yng[32] = "and we come in to Jerusalem, and dwell there three days.";
dby[32] = "And we came to Jerusalem, and abode there three days.";
web[32] = "And we came to Jerusalem, and abode there three days.";
hnv[32] = "We came to Yerushalayim, and abode there three days.";
vul[32] = "et venimus Hierusalem et mansimus ibi diebus tribus";
kjv[33] = "Now on the fourth day was the silver and the gold and the vessels weighed in the house of our God by the hand of Meremoth the son of Uriah the priest; and with him [was] Eleazar the son of Phinehas; and with them [was] Jozabad the son of Jeshua, and Noadiah the son of Binnui, Levites;";
rsv[33] = "On the fourth day, within the house of our God, the silver and the gold and the vessels were weighed into the hands of Mer\'emoth the priest, son of Uri\'ah, and with him was Elea\'zar the son of Phin\'ehas, and with them were the Levites, Jo\'zabad the son of Jeshua and No-adi\'ah the son of Bin\'nui.";
asv[33] = "And on the fourth day the silver and the gold and the vessels were weighed in the house of our God into the hand of Meremoth the son of Uriah the priest (and with him was Eleazar the son of Phinehas: and with them was Jozabad the son of Jeshua, and Noadiah the son of Binnui, the Levites)--";
yng[33] = "And on the fourth day hath been weighed the silver, and the gold, and the vessels, in the house of our God, unto the hand of Meremoth son of Uriah the priest, and with him Eleazar son of Phinehas, and with them Jozabad son of Jeshua, and Noadiah son of Binnui, the Levites:";
dby[33] = "And on the fourth day the silver and the gold and the vessels were weighed in the house of our God into the hand of Meremoth the son of Urijah the priest; and with him was Eleazar the son of Phinehas; and with them were Jozabad the son of Jeshua, and Noadiah the son of Binnui, Levites:";
web[33] = "Now on the fourth day was the silver and the gold and the vessels weighed in the house of our God by the hand of Meremoth the son of Uriah the priest; and with him [was] Eleazar the son of Phinehas; and with them [was] Jozabad the son of Jeshua, and Noadiah the son of Binnui, Levites;";
hnv[33] = "On the fourth day the silver and the gold and the vessels were weighed in the house of our God into the hand of Meremot the son of Uriyah the Kohen; and with him was El`azar the son of Pinechas; and with them was Yozavad the son of Yeshua, and No`adyah the son of Binnui, the Levite;";
vul[33] = "die autem quarta adpensum est argentum et aurum et vasa in domo Dei nostri per manum Meremoth filii Uriae sacerdotis et cum eo Eleazar filius Finees cumque eis Iozaded filius Iosue et Noadaia filius Bennoi Levitae";
kjv[34] = "By number [and] by weight of every one: and all the weight was written at that time.";
rsv[34] = "The whole was counted and weighed, and the weight of everything was recorded.";
asv[34] = "the whole by number and by weight: and all the weight was written at that time.";
yng[34] = "by number, by weight of every one, and all the weight is written at that time.";
dby[34] = "the whole by number and by weight; and all the weight was written down at that time.";
web[34] = "By number [and] by weight of every one: and all the weight was written at that time.";
hnv[34] = "the whole by number and by weight: and all the weight was written at that time.";
vul[34] = "iuxta numerum et pondus omnium descriptumque est omne pondus in tempore illo";
kjv[35] = "[Also] the children of those that had been carried away, which were come out of the captivity, offered burnt offerings unto the God of Israel, twelve bullocks for all Israel, ninety and six rams, seventy and seven lambs, twelve he goats [for] a sin offering: all [this was] a burnt offering unto the LORD.";
rsv[35] = "At that time those who had come from captivity, the returned exiles, offered burnt offerings to the God of Israel, twelve bulls for all Israel, ninety-six rams, seventy-seven lambs, and as a sin offering twelve he-goats; all this was a burnt offering to the LORD.";
asv[35] = "The children of the captivity, that were come out of exile, offered burnt-offerings unto the God of Israel, twelve bullocks for all Israel, ninety and six rams, seventy and seven lambs, twelve he-goats for a sin-offering: all this was a burnt-offering unto Jehovah.";
yng[35] = "Those coming in of the captives -- sons of the removal -- have brought near burnt-offerings to the God of Israel, bullocks twelve, for all Israel, rams ninety and six, lambs seventy and seven, young he-goats for a sin-offering twelve -- the whole a burnt-offering to Jehovah;";
dby[35] = "The children of those that had been carried away, who had come out of the captivity, presented burnt-offerings to the God of Israel, twelve bullocks for all Israel, ninety-six rams, seventy-seven lambs, twelve he-goats for a sin-offering: all for a burnt-offering to Jehovah.";
web[35] = "[Also] the children of those that had been carried away, who had come out of the captivity, offered burnt-offerings to the God of Israel, twelve bullocks for all Israel, ninety and six rams, seventy and seven lambs, twelve he-goats [for] a sin-offering: all [this was] a burnt-offering to the LORD.";
hnv[35] = "The children of the captivity, who had come out of exile, offered burnt offerings to the God of Yisra\'el, twelve bulls for all Yisra\'el, ninety-six rams, seventy-seven lambs, and twelve male goats for a sin-offering: all this was a burnt offering to the LORD.";
vul[35] = "sed et qui venerant de captivitate filii transmigrationis obtulerunt holocaustomata Deo Israhel vitulos duodecim pro omni Israhel arietes nonaginta sex agnos septuaginta septem hircos pro peccato duodecim omnia in holocaustum Domino";
kjv[36] = "And they delivered the king\'s commissions unto the king\'s lieutenants, and to the governors on this side the river: and they furthered the people, and the house of God.";
rsv[36] = "They also delivered the king\'s commissions to the king\'s satraps and to the governors of the province Beyond the River; and they aided the people and the house of God.";
asv[36] = "And they delivered the king\'s commissions unto the king\'s satraps, and to the governors beyond the River: and they furthered the people and the house of God.";
yng[36] = "and they give the laws of the king to the lieutenants of the king and the governors beyond the river, and they have lifted up the people and the house of God.";
dby[36] = "And they delivered the king\'s edicts to the king\'s satraps, and to the governors on this side the river. And they furthered the people and the house of God.";
web[36] = "And they delivered the king\'s commissions to the king\'s lieutenants, and to the governors on this side of the river: and they furthered the people, and the house of God.";
hnv[36] = "They delivered the king\'s commissions to the king\'s satraps, and to the governors beyond the River: and they furthered the people and the house of God.";
vul[36] = "dederunt autem edicta regis satrapis qui erant de conspectu regis et ducibus trans Flumen et elevaverunt populum et domum Dei";
