kjv[59] = "And these [were] they which went up from Telmelah, Telharsa, Cherub, Addan, [and] Immer: but they could not shew their father\'s house, and their seed, whether they [were] of Israel:";
rsv[59] = "The following were those who came up from Tel-me\'lah, Tel-har\'sha, Cherub, Addan, and Immer, though they could not prove their fathers\' houses or their descent, whether they belonged to Israel:";
asv[59] = "And these were they that went up from Tel-melah, Tel-harsha, Cherub, Addan, [and] Immer; but they could not show their fathers\' houses, and their seed, whether they were of Israel:";
yng[59] = "And these [are] those going up from Tel-Melah, Tel-Harsa, Cherub, Addan, Immer, and they have not been able to declare the house of their fathers, and their seed, whether they [are] of Israel:";
dby[59] = "And these are they that went up from Tel-melah, Tel-harsha, Cherub-Addan, Immer; but they could not shew their fathers\' house, nor their seed, whether they were of Israel.";
web[59] = "And these [were] they who went up from Tel-melah, Tel-harsa, Cherub, Addan, [and] Immer: but they could not show their fathers\' house, and their seed, whether they [were] of Israel:";
hnv[59] = "These were those who went up from Tel-melah, Tel-Harsha, Keruv, Addan, [and] Immer; but they could not show their fathers\' houses, and their seed, whether they were of Yisra\'el:";
vul[59] = "et hii qui ascenderunt de Thelmela Thelarsa Cherub et Don et Mer et non potuerunt indicare domum patrum suorum et semen suum utrum ex Israhel essent";
