csb[1] = "While Ezra prayed and confessed, weeping and falling facedown before the house of God, an extremely large assembly of Israelite men, women, and children gathered around him. The people also wept bitterly.";
csb[2] = "Then Shecaniah son of Jehiel, an Elamite, responded to Ezra: &quot;We have been unfaithful to our God by marrying foreign women from the surrounding peoples, but there is still hope for Israel in spite of this.";
csb[3] = "&quot;Let us therefore make a covenant before our God to send away all the foreign wives and their children, according to the counsel of my lord and of those who tremble at the command of our God. Let it be done according to the law.";
csb[4] = "&quot;Get up, for this matter is your responsibility, and we support you. Be strong and take action! &quot;";
csb[5] = "Then Ezra got up and made the leading priests, Levites, and all Israel take an oath to do what had been said; so they took the oath.";
csb[6] = "Ezra then went from the house of God and walked to the chamber of Jehohanan son of Eliashib, where he spent the night. He did not eat food or drink water, because he was mourning over the unfaithfulness of the exiles.";
csb[7] = "They circulated a proclamation throughout Judah and Jerusalem that all the exiles should gather at Jerusalem.";
csb[8] = "Whoever did not come within three days would forfeit all his possessions, according to the decision of the leaders and elders, and would be excluded from the assembly of the exiles.";
csb[9] = "So all the men of Judah and Benjamin gathered in Jerusalem within the three days. On the twentieth day of the ninth month, all the people sat in the square at the house of God, trembling because of this matter and because of the heavy rain.";
csb[10] = "Then the priest Ezra stood up and said to them, &quot;You have been unfaithful by marrying foreign women, adding to Israel\'s guilt.";
csb[11] = "&quot;Therefore, make a confession to the LORD, the God of your fathers, and do his will. Separate yourselves from the surrounding peoples and your foreign wives.&quot;";
csb[12] = "Then all the assembly responded loudly: &quot;Yes, we will do as you say!";
csb[13] = "&quot;But there are many people, and it is the rainy season. We don\'t have the stamina to stay out in the open. This isn\'t something that can be done in a day or two, for we have rebelled terribly in this matter.";
csb[14] = "&quot;Let our leaders represent the entire assembly. Then let all those in our towns who have married foreign women come at appointed times, together with the elders and judges of each town, in order to avert the fierce anger of our God concerning this matter.&quot;";
csb[15] = "Only Jonathan son of Asahel and Jahzeiah son of Tikvah opposed this, with Meshullam and Shabbethai the Levite supporting them.";
csb[16] = "The exiles did what had been proposed. The priest Ezra selected men who were family heads, all identified by name, to represent their ancestral families. They convened on the first day of the tenth month to investigate the matter,";
csb[17] = "and by the first day of the first month they had dealt with all the men who had married foreign women.";
csb[18] = "The following were found to have married foreign women from the descendants of the priests: from the descendants of Jeshua son of Jozadak and his brothers: Maaseiah, Eliezer, Jarib, and Gedaliah.";
csb[19] = "They pledged to send their wives away, and being guilty, they offered a ram from the flock for their guilt;";
csb[20] = "Hanani and Zebadiah from Immer\'s descendants;";
csb[21] = "Maaseiah, Elijah, Shemaiah, Jehiel, and Uzziah from Harim\'s descendants;";
csb[22] = "Elioenai, Maaseiah, Ishmael, Nethanel, Jozabad, and Elasah from Pashhur\'s descendants.";
csb[23] = "The Levites: Jozabad, Shimei, Kelaiah (that is Kelita), Pethahiah, Judah, and Eliezer.";
csb[24] = "The singers: Eliashib. The gatekeepers: Shallum, Telem, and Uri.";
csb[25] = "The Israelites: Parosh\'s descendants: Ramiah, Izziah, Malchijah, Mijamin, Eleazar, Malchijah, and Benaiah;";
csb[26] = "Elam\'s descendants: Mattaniah, Zechariah, Jehiel, Abdi, Jeremoth, and Elijah;";
csb[27] = "Zattu\'s descendants: Elioenai, Eliashib, Mattaniah, Jeremoth, Zabad, and Aziza;";
csb[28] = "Bebai\'s descendants: Jehohanan, Hananiah, Zabbai, and Athlai;";
csb[29] = "Bani\'s descendants: Meshullam, Malluch, Adaiah, Jashub, Sheal, and Jeremoth;";
csb[30] = "Pahath-moab\'s descendants: Adna, Chelal, Benaiah, Maaseiah, Mattaniah, Bezalel, Binnui, and Manasseh;";
csb[31] = "Harim\'s descendants: Eliezer, Isshijah, Malchijah, Shemaiah, Shimeon,";
csb[32] = "Benjamin, Malluch, and Shemariah;";
csb[33] = "Hashum\'s descendants: Mattenai, Mattattah, Zabad, Eliphelet, Jeremai, Manasseh, and Shimei;";
csb[34] = "Bani\'s descendants: Maadai, Amram, Uel,";
csb[35] = "Benaiah, Bedeiah, Cheluhi,";
csb[36] = "Vaniah, Meremoth, Eliashib,";
csb[37] = "Mattaniah, Mattenai, Jaasu,";
csb[38] = "Bani, Binnui, Shimei,";
csb[39] = "Shelemiah, Nathan, Adaiah,";
csb[40] = "Machnadebai, Shashai, Sharai,";
csb[41] = "Azarel, Shelemiah, Shemariah,";
csb[42] = "Shallum, Amariah, and Joseph;";
csb[43] = "Nebo\'s descendants: Jeiel, Mattithiah, Zabad, Zebina, Jaddai, Joel, and Benaiah.";
csb[44] = "All of these had married foreign women, and some of the wives had given birth to children.";
kjv[1] = "Now when Ezra had prayed, and when he had confessed, weeping and casting himself down before the house of God, there assembled unto him out of Israel a very great congregation of men and women and children: for the people wept very sore.";
rsv[1] = "While Ezra prayed and made confession, weeping and casting himself down before the house of God, a very great assembly of men, women, and children, gathered to him out of Israel; for the people wept bitterly.";
asv[1] = "Now while Ezra prayed and made confession, weeping and casting himself down before the house of God, there was gathered together unto him out of Israel a very great assembly of men and women and children; for the people wept very sore.";
yng[1] = "And at Ezra\'s praying, and at his making confession, weeping and casting himself down before the house of God, there have been gathered unto him out of Israel an assembly very great -- men and women and children -- for the people have wept, multiplying weeping.";
dby[1] = "And while Ezra prayed, and made confession, weeping and falling down before the house of God, there were gathered to him out of Israel a very great congregation of men and women and children; for the people wept very much.";
web[1] = "Now when Ezra had prayed, and when he had confessed, weeping and casting himself down before the house of God, there assembled to him out of Israel a very great congregation of men and women and children: for the people wept very bitterly.";
hnv[1] = "Now while Ezra prayed and made confession, weeping and casting himself down before the house of God, there was gathered together to him out of Yisra\'el a very great assembly of men and women and children; for the people wept very sore.";
vul[1] = "sic ergo orante Ezra et inplorante eo et flente et iacente ante templum Dei collectus est ad eum de Israhel coetus grandis nimis virorum et mulierum puerorumque et flevit populus multo fletu";
kjv[2] = "And Shechaniah the son of Jehiel, [one] of the sons of Elam, answered and said unto Ezra, We have trespassed against our God, and have taken strange wives of the people of the land: yet now there is hope in Israel concerning this thing.";
rsv[2] = "And Shecani\'ah the son of Jehi\'el, of the sons of Elam, addressed Ezra: &quot;We have broken faith with our God and have married foreign women from the peoples of the land, but even now there is hope for Israel in spite of this.";
asv[2] = "And Shecaniah the son of Jehiel, one of the sons of Elam, answered and said unto Ezra, We have trespassed against our God, and have married foreign women of the peoples of the land: yet now there is hope for Israel concerning this thing.";
yng[2] = "And Shechaniah son of Jehiel, of the sons of Elam, answereth and saith to Ezra, `We -- we have trespassed against our God, and we settle strange women of the peoples of the land; and now there is hope for Israel concerning this,";
dby[2] = "And Shechaniah the son of Jehiel, of the sons of Elam, answered and said to Ezra, We have acted unfaithfully toward our God, and have taken foreign wives of the peoples of the land; yet now there is hope for Israel concerning this thing.";
web[2] = "And Shechaniah the son of Jehiel, [one] of the sons of Elam, answered and said to Ezra, We have trespassed against our God, and have taken foreign wives of the people of the land: yet now there is hope in Israel concerning this thing.";
hnv[2] = "Shekhanyahu the son of Yechi\'el, one of the sons of `Elam, answered Ezra, We have trespassed against our God, and have married foreign women of the peoples of the land: yet now there is hope for Yisra\'el concerning this thing.";
vul[2] = "et respondit Sechenia filius Iehihel de filiis Helam et dixit Ezrae nos praevaricati sumus in Deum nostrum et duximus uxores alienigenas de populis terrae et nunc si est paenitentia Israhel super hoc";
kjv[3] = "Now therefore let us make a covenant with our God to put away all the wives, and such as are born of them, according to the counsel of my lord, and of those that tremble at the commandment of our God; and let it be done according to the law.";
rsv[3] = "Therefore let us make a covenant with our God to put away all these wives and their children, according to the counsel of my lord and of those who tremble at the commandment of our God; and let it be done according to the law.";
asv[3] = "Now therefore let us make a covenant with our God to put away all the wives, and such as are born of them, according to the counsel of my lord, and of those that tremble at the commandment of our God; and let it be done according to the law.";
yng[3] = "and now, let us make a covenant with our God, to cause all the women to go out, and that which is born of them, by the counsel of the Lord, and of those trembling at the command of our God, and according to law it is done;";
dby[3] = "And now let us make a covenant with our God to put away all the wives, and such as are born of them, according to the counsel of [my] lord, and of those that tremble at the commandments of our God; and let it be done according to the law.";
web[3] = "Now therefore let us make a covenant with our God to put away all the wives, and such as are born of them, according to the counsel of my lord, and of those that tremble at the commandment of our God; and let it be done according to the law.";
hnv[3] = "Now therefore let us make a covenant with our God to put away all the wives, and such as are born of them, according to the counsel of my lord, and of those who tremble at the mitzvah of our God; and let it be done according to the law.";
vul[3] = "percutiamus foedus cum Deo nostro ut proiciamus universas uxores et eos qui de his nati sunt iuxta voluntatem Domini et eorum qui timent praeceptum Dei nostri secundum legem fiat";
kjv[4] = "Arise; for [this] matter [belongeth] unto thee: we also [will be] with thee: be of good courage, and do [it].";
rsv[4] = "Arise, for it is your task, and we are with you; be strong and do it.&quot;";
asv[4] = "Arise; for the matter belongeth unto thee, and we are with thee: be of good courage, and do it.";
yng[4] = "rise, for on thee [is] the matter, and we [are] with thee; be strong, and do.\'";
dby[4] = "Arise, for this matter is incumbent on thee, and we will be with thee: be of good courage, and do [it].";
web[4] = "Arise; for [this] matter [belongeth] to thee: we also [will be] with thee: be of good courage, and do [it].";
hnv[4] = "Arise; for the matter belongs to you, and we are with you: be of good courage, and do it.";
vul[4] = "surge tuum est decernere nosque erimus tecum confortare et fac";
kjv[5] = "Then arose Ezra, and made the chief priests, the Levites, and all Israel, to swear that they should do according to this word. And they sware.";
rsv[5] = "Then Ezra arose and made the leading priests and Levites and all Israel take oath that they would do as had been said. So they took the oath.";
asv[5] = "Then arose Ezra, and made the chiefs of the priests, the Levites, and all Israel, to swear that they would do according to this word. So they sware.";
yng[5] = "And Ezra riseth, and causeth the heads of the priests, the Levites, and all Israel, to swear to do according to this word -- and they swear.";
dby[5] = "Then Ezra arose, and made the chiefs of the priests, of the Levites, and of all Israel, to swear that they would do according to this word. And they swore.";
web[5] = "Then arose Ezra, and made the chief priests, the Levites, and all Israel, to swear that they would do according to this word. And they swore.";
hnv[5] = "Then arose Ezra, and made the chiefs of the Kohanim, the Levites, and all Yisra\'el, to swear that they would do according to this word. So they swore.";
vul[5] = "surrexit ergo Ezras et adiuravit principes sacerdotum Levitarum et omnem Israhel ut facerent secundum verbum hoc et iuraverunt";
kjv[6] = "Then Ezra rose up from before the house of God, and went into the chamber of Johanan the son of Eliashib: and [when] he came thither, he did eat no bread, nor drink water: for he mourned because of the transgression of them that had been carried away.";
rsv[6] = "Then Ezra withdrew from before the house of God, and went to the chamber of Jehoha\'nan the son of Eli\'ashib, where he spent the night, neither eating bread nor drinking water; for he was mourning over the faithlessness of the exiles.";
asv[6] = "Then Ezra rose up from before the house of God, and went into the chamber of Jehohanan the son of Eliashib: and [when] he came thither, he did eat no bread, nor drink water; for he mourned because of the trespass of them of the captivity.";
yng[6] = "And Ezra riseth from before the house of God, and goeth unto the chamber of Jehohanan son of Eliashib; yea, he goeth there, bread he hath not eaten, and water he hath not drunk, for he is mourning because of the trespass of the removal.";
dby[6] = "And Ezra arose from before the house of God, and went into the chamber of Jehohanan the son of Eliashib; and when he came thither, he ate no bread and drank no water; for he mourned because of the unfaithfulness of them that had been carried away.";
web[6] = "Then Ezra arose from before the house of God, and went into the chamber of Johanan the son of Eliashib: and [when] he came thither, he ate no bread, nor drank water: for he mourned because of the transgression of them that had been carried away.";
hnv[6] = "Then Ezra rose up from before the house of God, and went into the chamber of Yehochanan the son of Elyashiv: and [when] he came there, he ate no bread, nor drink water; for he mourned because of the trespass of them of the captivity.";
vul[6] = "et surrexit Ezras ante domum Dei et abiit ad cubiculum Iohanan filii Eliasib et ingressus est illuc panem non comedit et aquam non bibit lugebat enim in transgressione eorum qui de captivitate venerant";
kjv[7] = "And they made proclamation throughout Judah and Jerusalem unto all the children of the captivity, that they should gather themselves together unto Jerusalem;";
rsv[7] = "And a proclamation was made throughout Judah and Jerusalem to all the returned exiles that they should assemble at Jerusalem,";
asv[7] = "And they made proclamation throughout Judah and Jerusalem unto all the children of the captivity, that they should gather themselves together unto Jerusalem;";
yng[7] = "And they cause a voice to pass over into Judah and Jerusalem, to all sons of the removal, to be gathered to Jerusalem,";
dby[7] = "And they made proclamation in Judah and Jerusalem to all the children of the captivity, that they should gather themselves together unto Jerusalem;";
web[7] = "And they made proclamation throughout Judah and Jerusalem to all the children of the captivity, that they should assemble at Jerusalem;";
hnv[7] = " They made proclamation throughout Yehudah and Yerushalayim to all the children of the captivity, that they should gather themselves together to Yerushalayim;";
vul[7] = "et missa est vox in Iuda et in Hierusalem omnibus filiis transmigrationis ut congregarentur in Hierusalem";
kjv[8] = "And that whosoever would not come within three days, according to the counsel of the princes and the elders, all his substance should be forfeited, and himself separated from the congregation of those that had been carried away.";
rsv[8] = "and that if any one did not come within three days, by order of the officials and the elders all his property should be forfeited, and he himself banned from the congregation of the exiles.";
asv[8] = "and that whosoever came not within three days, according to the counsel of the princes and the elders, all his substance should be forfeited, and himself separated from the assembly of the captivity.";
yng[8] = "and every one who cometh not in by the third day, according to the counsel of the heads and of the elders, all his substance is devoted, and himself separated from the assembly of the removal.";
dby[8] = "and that whosoever would not come within three days, according to the counsel of the princes and the elders, all his substance should be confiscated, and himself separated from the congregation of those that had been carried away.";
web[8] = "And that whoever would not come within three days, according to the counsel of the princes and the elders, all his substance should be forfeited, and himself separated from the congregation of those that had been carried away.";
hnv[8] = "and that whoever didn\'t come within three days, according to the counsel of the princes and the Zakenim, all his substance should be forfeited, and himself separated from the assembly of the captivity.";
vul[8] = "et omnis qui non venerit in tribus diebus iuxta consilium principum et seniorum auferetur universa substantia eius et ipse abicietur de coetu transmigrationis";
kjv[9] = "Then all the men of Judah and Benjamin gathered themselves together unto Jerusalem within three days. It [was] the ninth month, on the twentieth [day] of the month; and all the people sat in the street of the house of God, trembling because of [this] matter, and for the great rain.";
rsv[9] = "Then all the men of Judah and Benjamin assembled at Jerusalem within the three days; it was the ninth month, on the twentieth day of the month. And all the people sat in the open square before the house of God, trembling because of this matter and because of the heavy rain.";
asv[9] = "Then all the men of Judah and Benjamin gathered themselves together unto Jerusalem within the three days (it was the ninth month, on the twentieth [day] of the month); and all the people sat in the broad place before the house of God, trembling because of this matter, and for the great rain.";
yng[9] = "And gathered are all the men of Judah and Benjamin to Jerusalem by the third day, it [is] the ninth month, on the twentieth of the month, and all the people sit in the broad place of the house of God, trembling on account of the matter and of the showers.";
dby[9] = "Then were all the men of Judah and Benjamin gathered together at Jerusalem within three days. It was the ninth month, on the twentieth of the month; and all the people sat in the open space of the house of God, trembling because of the matter, and because of the pouring rain.";
web[9] = "Then all the men of Judah and Benjamin assembled at Jerusalem within three days. It [was] the ninth month, and the twentieth [day] of the month; and all the people sat in the street of the house of God, trembling because of [this] matter, and for the great rain.";
hnv[9] = "Then all the men of Yehudah and Binyamin gathered themselves together to Yerushalayim within the three days; it was the ninth month, on the twentieth [day] of the month: and all the people sat in the broad place before the house of God, trembling because of this matter, and for the great rain.";
vul[9] = "convenerunt igitur omnes viri Iuda et Beniamin in Hierusalem tribus diebus ipse est mensis nonus vicesimo die mensis et sedit omnis populus in platea domus Dei trementes pro peccato et pluviis";
kjv[10] = "And Ezra the priest stood up, and said unto them, Ye have transgressed, and have taken strange wives, to increase the trespass of Israel.";
rsv[10] = "And Ezra the priest stood up and said to them, &quot;You have trespassed and married foreign women, and so increased the guilt of Israel.";
asv[10] = "And Ezra the priest stood up, and said unto them, Ye have trespassed, and have married foreign women, to increase the guilt of Israel.";
yng[10] = "And Ezra the priest riseth, and saith unto them, `Ye -- ye have trespassed, and ye settle strange women, to add to the guilt of Israel;";
dby[10] = "And Ezra the priest stood up and said to them, Ye have acted unfaithfully, and have taken foreign wives, to increase the trespass of Israel.";
web[10] = "And Ezra the priest stood up, and said to them, Ye have transgressed, and have taken foreign wives to increase the trespass of Israel.";
hnv[10] = "Ezra the Kohen stood up, and said to them, You have trespassed, and have married foreign women, to increase the guilt of Yisra\'el.";
vul[10] = "et surrexit Ezras sacerdos et dixit ad eos vos transgressi estis et duxistis uxores alienigenas ut adderetis super delictum Israhel";
kjv[11] = "Now therefore make confession unto the LORD God of your fathers, and do his pleasure: and separate yourselves from the people of the land, and from the strange wives.";
rsv[11] = "Now then make confession to the LORD the God of your fathers, and do his will; separate yourselves from the peoples of the land and from the foreign wives.&quot;";
asv[11] = "Now therefore make confession unto Jehovah, the God of your fathers, and do his pleasure; and separate yourselves from the peoples of the land, and from the foreign women.";
yng[11] = "and, now, make confession to Jehovah, God of your fathers, and do His good pleasure, and be separated from the peoples of the land, and from the strange women.\'";
dby[11] = "And now make confession to Jehovah the God of your fathers, and do his pleasure, and separate yourselves from the peoples of the land, and from the foreign wives.";
web[11] = "Now therefore make confession to the LORD God of your fathers, and do his pleasure: and separate yourselves from the people of the land, and from the foreign wives.";
hnv[11] = "Now therefore make confession to the LORD, the God of your fathers, and do his pleasure; and separate yourselves from the peoples of the land, and from the foreign women.";
vul[11] = "et nunc date confessionem Domino Deo patrum vestrorum et facite placitum eius et separamini a populis terrae et ab uxoribus alienigenis";
kjv[12] = "Then all the congregation answered and said with a loud voice, As thou hast said, so must we do.";
rsv[12] = "Then all the assembly answered with a loud voice, &quot;It is so; we must do as you have said.";
asv[12] = "Then all the assembly answered and said with a loud voice, As thou hast said concerning us, so must we do.";
yng[12] = "And all the assembly answer and say [with] a great voice, `Right; according to thy word -- on us to do;";
dby[12] = "And the whole congregation answered and said with a loud voice, Yes, it is for us to do according to thy words.";
web[12] = "Then all the congregation answered and said with a loud voice, As thou hast said, so must we do.";
hnv[12] = "Then all the assembly answered with a loud voice, As you have said concerning us, so must we do.";
vul[12] = "et respondit universa multitudo dixitque voce magna iuxta verbum tuum ad nos sic fiat";
kjv[13] = "But the people [are] many, and [it is] a time of much rain, and we are not able to stand without, neither [is this] a work of one day or two: for we are many that have transgressed in this thing.";
rsv[13] = "But the people are many, and it is a time of heavy rain; we cannot stand in the open. Nor is this a work for one day or for two; for we have greatly transgressed in this matter.";
asv[13] = "But the people are many, and it is a time of much rain, and we are not able to stand without: neither is this a work of one day or two; for we have greatly transgressed in this matter.";
yng[13] = "but the people [are] many, and [it is] the time of showers, and there is no power to stand without, and the work [is] not for one day, nor for two, for we have multiplied to transgress in this thing.";
dby[13] = "But the people are many, and it is a time of pouring rain, and it is not possible to stand without: neither is this a work for one day or two; for we are many that have transgressed in this thing.";
web[13] = "But the people [are] many, and [it is] a time of much rain, and we are not able to stand abroad, neither [is this] a work of one day or two: for we are many that have transgressed in this thing.";
hnv[13] = "But the people are many, and it is a time of much rain, and we are not able to stand outside: neither is this a work of one day or two; for we have greatly transgressed in this matter.";
vul[13] = "verumtamen quia populus multus est et tempus pluviae et non sustinemus stare foris et opus non est diei unius vel duorum vehementer quippe peccavimus in sermone isto";
kjv[14] = "Let now our rulers of all the congregation stand, and let all them which have taken strange wives in our cities come at appointed times, and with them the elders of every city, and the judges thereof, until the fierce wrath of our God for this matter be turned from us.";
rsv[14] = "Let our officials stand for the whole assembly; let all in our cities who have taken foreign wives come at appointed times, and with them the elders and judges of every city, till the fierce wrath of our God over this matter be averted from us.&quot;";
asv[14] = "Let now our princes be appointed for all the assembly, and let all them that are in our cities that have married foreign women come at appointed times, and with them the elders of every city, and the judges thereof, until the fierce wrath of our God be turned from us, until this matter be despatched.";
yng[14] = "`Let, we pray thee, our heads of all the assembly stand, and all who [are] in our cities, who have settled strange wives, do come in at the times appointed, and with them the elders of city and city, and its judges, till the turning back of the fury of the wrath of our God from us, for this thing.\'";
dby[14] = "Let now our princes, while this matter is going on, stand for all the congregation, and let all those that have taken foreign wives in our cities come at the appointed times, and with them the elders of every city, and the judges thereof, until the fierce anger of our God be turned from us.";
web[14] = "Let now our rulers of all the congregation stand, and let all them who have taken foreign wives in our cities come at appointed times, and with them the elders of every city, and its judges, until the fierce wrath of our God for this matter shall be turned from us.";
hnv[14] = "Let now our princes be appointed for all the assembly, and let all those who are in our cities who have married foreign women come at appointed times, and with them the Zakenim of every city, and the judges of it, until the fierce wrath of our God be turned from us, until this matter be dispatched.";
vul[14] = "constituantur principes in universa multitudine et omnes in civitatibus nostris qui duxerunt uxores alienigenas veniant in temporibus statutis et cum his seniores per civitatem et civitatem et iudices eius donec avertatur ira Dei nostri a nobis super peccato hoc";
kjv[15] = "Only Jonathan the son of Asahel and Jahaziah the son of Tikvah were employed about this [matter]: and Meshullam and Shabbethai the Levite helped them.";
rsv[15] = "Only Jonathan the son of As\'ahel and Jahzei\'ah the son of Tikvah opposed this, and Meshul\'lum and Shab\'bethai the Levite supported them.";
asv[15] = "Only Jonathan the son of Asahel and Jahzeiah the son of Tikvah stood up against this [matter]: and Meshullam and Shabbethai the Levite helped them.";

kjv[16] = "And the children of the captivity did so. And Ezra the priest, [with] certain chief of the fathers, after the house of their fathers, and all of them by [their] names, were separated, and sat down in the first day of the tenth month to examine the matter.";
rsv[16] = "Then the returned exiles did so. Ezra the priest selected men, heads of fathers\' houses, according to their fathers\' houses, each of them designated by name. On the first day of the tenth month they sat down to examine the matter;";
asv[16] = "And the children of the captivity did so. And Ezra the priest, [with] certain heads of fathers\' [houses], after their fathers\' houses, and all of them by their names, were set apart; and they sat down in the first day of the tenth month to examine the matter.";

dby[16] = "And the children of the captivity did so. And Ezra the priest [and] certain of the chief fathers were separated according to their fathers\' houses, and all of them [expressed] by name; and they sat down on the first day of the tenth month to examine the matter.";
web[16] = "And the children of the captivity did so. And Ezra the priest, [with] certain chief of the fathers, after the house of their fathers, and all of them by [their] names, were separated, and sat down in the first day of the tenth month to examine the matter.";

vul[16] = "feceruntque sic filii transmigrationis et abierunt Ezras sacerdos et viri principes familiarum in domum patrum suorum et omnes per nomina sua et sederunt in die primo mensis decimi ut quaererent rem";
