csb[1] = "When the enemies of Judah and Benjamin heard that the returned exiles were building a temple for the LORD, the God of Israel,";
csb[2] = "they approached Zerubbabel and the family heads and said to them, &quot;Let us build with you, for we also worship your God and have been sacrificing to him since the time King Esar-haddon of Assyria brought us here.&quot;";
csb[3] = "But Zerubbabel, Jeshua, and the other heads of Israel\'s families answered them, &quot;You may have no part with us in building a house for our God, since we alone will build it for the LORD, the God of Israel, as King Cyrus, the king of Persia has commanded us.&quot;";
csb[4] = "Then the people who were already in the land discouraged the people of Judah and made them afraid to build.";
csb[5] = "They also bribed officials to act against them to frustrate their plans throughout the reign of King Cyrus of Persia and until the reign of King Darius of Persia.";
csb[6] = "At the beginning of the reign of Ahasuerus, the people who were already in the land wrote an accusation against the residents of Judah and Jerusalem.";
csb[7] = "During the time of King Artaxerxes of Persia, Bishlam, Mithredath, Tabeel and the rest of his colleagues wrote to King Artaxerxes. The letter was written in Aramaic and translated.";
csb[8] = "Rehum the chief deputy and Shimshai the scribe wrote a letter to King Artaxerxes concerning Jerusalem as follows:";
csb[9] = "From Rehum the chief deputy, Shimshai the scribe, and the rest of their colleagues -- the judges and magistrates from Tripolis, Persia, Erech, Babylon, Susa (that is, the people of Elam),";
csb[10] = "and the rest of the peoples whom the great and illustrious Ashurbanipal deported and settled in the cities of Samaria and the region west of the Euphrates River.";
csb[11] = "This is the text of the letter they sent to him: To King Artaxerxes from your servants, the men from the region west of the Euphrates River:";
csb[12] = "Let it be known to the king that the Jews who came from you have returned to us at Jerusalem. They are rebuilding that rebellious and evil city, finishing its walls, and repairing its foundations.";
csb[13] = "Let it now be known to the king that if that city is rebuilt and its walls are finished, they will not pay tribute, duty, or land tax, and the royal revenue will suffer.";
csb[14] = "Since we have taken an oath of loyalty to the king, and it is not right for us to witness his dishonor, we have sent to inform the king";
csb[15] = "that a search should be made in your fathers\' record books. In these record books you will discover and verify that the city is a rebellious city, harmful to kings and provinces. There have been revolts in it since ancient times. That is why this city was destroyed.";
csb[16] = "We advise the king that if this city is rebuilt and its walls are finished, you will not have any possession west of the Euphrates.";
csb[17] = "The king sent a reply to his chief deputy Rehum, Shimshai the scribe, and the rest of their colleagues living in Samaria and elsewhere in the region west of the Euphrates River: Greetings.";
csb[18] = "The letter you sent us has been translated and read in my presence.";
csb[19] = "I issued a decree and a search was conducted. It was discovered that this city has had uprisings against kings since ancient times, and there have been rebellions and revolts in it.";
csb[20] = "Powerful kings have also ruled over Jerusalem and exercised authority over the whole region west of the Euphrates River, and tribute, duty, and land tax were paid to them.";
csb[21] = "Therefore, issue an order for these men to stop, so that this city will not be rebuilt until a further decree has been pronounced by me.";
csb[22] = "See that you not neglect this matter. Otherwise, the damage will increase and the royal interests will suffer.";
csb[23] = "As soon as the text of King Artaxerxes\'s letter was read to Rehum, Shimshai the scribe, and their colleagues, they immediately went to the Jews in Jerusalem and forcibly stopped them.";
csb[24] = "Now the construction of God\'s house in Jerusalem had stopped and remained at a standstill until the second year of the reign of King Darius of Persia.";
kjv[1] = "Now when the adversaries of Judah and Benjamin heard that the children of the captivity builded the temple unto the LORD God of Israel;";
rsv[1] = "Now when the adversaries of Judah and Benjamin heard that the returned exiles were building a temple to the LORD, the God of Israel,";
asv[1] = "Now when the adversaries of Judah and Benjamin heard that the children of the captivity were building a temple unto Jehovah, the God of Israel;";
yng[1] = "And adversaries of Judah and Benjamin hear that the sons of the captivity are building a temple to Jehovah, God of Israel,";
dby[1] = "And the adversaries of Judah and Benjamin heard that the children of the captivity were building the temple to Jehovah the God of Israel;";
web[1] = "Now when the adversaries of Judah and Benjamin heard that the children of the captivity were building the temple to the LORD God of Israel;";
hnv[1] = "Now when the adversaries of Yehudah and Binyamin heard that the children of the captivity were building a temple to the LORD, the God of Yisra\'el;";

kjv[2] = "Then they came to Zerubbabel, and to the chief of the fathers, and said unto them, Let us build with you: for we seek your God, as ye [do]; and we do sacrifice unto him since the days of Esarhaddon king of Assur, which brought us up hither.";
rsv[2] = "they approached Zerub\'babel and the heads of fathers\' houses and said to them, &quot;Let us build with you; for we worship your God as you do, and we have been sacrificing to him ever since the days of E\'sar-had\'don king of Assyria who brought us here.&quot;";
asv[2] = "then they drew near to Zerubbabel, and to the heads of fathers\' [houses], and said unto them, Let us build with you; for we seek your God, as ye do; and we sacrifice unto him since the days of Esar-haddon king of Assyria, who brought us up hither.";
yng[2] = "and they draw nigh unto Zerubbabel, and unto heads of the fathers, and say to them, `Let us build with you; for, like you, we seek to your God, and we are not sacrificing since the days of Esar-Haddon king of Asshur, who brought us up hither.\'";
dby[2] = "and they came to Zerubbabel and to the chief fathers, and said to them, We would build with you; for we seek your God, as ye; and we have sacrificed to him since the days of Esar-haddon king of Assyria, who brought us up hither.";
web[2] = "Then they came to Zerubbabel, and to the chief of the fathers, and said to them, Let us build with you: for we seek your God, as ye [do]; and we do sacrifice to him since the days of Esar-haddon king of Assur, who brought us up hither.";
hnv[2] = "then they drew near to Zerubbavel, and to the heads of fathers\' [houses], and said to them, Let us build with you; for we seek your God, as you do; and we sacrifice to him since the days of Esar-Haddon king of Ashshur, who brought us up here.";
vul[2] = "et accedentes ad Zorobabel et ad principes patrum dixerunt eis aedificemus vobiscum quia ita ut vos quaerimus Deum vestrum ecce nos immolamus victimas ex diebus Asoraddan regis Assur qui adduxit nos huc";
kjv[3] = "But Zerubbabel, and Jeshua, and the rest of the chief of the fathers of Israel, said unto them, Ye have nothing to do with us to build an house unto our God; but we ourselves together will build unto the LORD God of Israel, as king Cyrus the king of Persia hath commanded us.";
rsv[3] = "But Zerub\'babel, Jeshua, and the rest of the heads of fathers\' houses in Israel said to them, &quot;You have nothing to do with us in building a house to our God; but we alone will build to the LORD, the God of Israel, as King Cyrus the king of Persia has commanded us.&quot;";
asv[3] = "But Zerubbabel, and Jeshua, and the rest of the heads of fathers\' [houses] of Israel, said unto them, Ye have nothing to do with us in building a house unto our God; but we ourselves together will build unto Jehovah, the God of Israel, as king Cyrus the king of Persia hath commanded us.";
yng[3] = "And Zerubbabel saith to them, also Jeshua, and the rest of the heads of the fathers of Israel, `Not for you, and for us, to build a house to our God; but we ourselves together do build to Jehovah God of Israel, as the king Cyrus, king of Persia, commanded us.\'";
dby[3] = "But Zerubbabel and Jeshua and the rest of the chief fathers of Israel said to them, Ye have nothing to do with us to build a house to our God, but we alone will build to Jehovah the God of Israel, as king Cyrus, the king of Persia, has commanded us.";
web[3] = "But Zerubbabel, and Jeshua, and the rest of the chief of the fathers of Israel, said to them, Ye have nothing to do with us to build a house to our God; but we ourselves together will build to the LORD God of Israel, as king Cyrus the king of Persia hath commanded us.";
hnv[3] = "But Zerubbavel, and Yeshua, and the rest of the heads of fathers\' [houses] of Yisra\'el, said to them, You have nothing to do with us in building a house to our God; but we ourselves together will build to the LORD, the God of Yisra\'el, as king Koresh the king of Paras has commanded us.";
vul[3] = "et dixit eis Zorobabel et Iosue et reliqui principes patrum Israhel non est vobis et nobis ut aedificemus domum Deo nostro sed nos ipsi soli aedificabimus Domino Deo nostro sicut praecepit nobis rex Cyrus rex Persarum";

rsv[5] = "and hired counselors against them to frustrate their purpose, all the days of Cyrus king of Persia, even until the reign of Darius king of Persia.";

dby[5] = "and they hired counsellors against them, to frustrate their purpose, all the days of Cyrus king of Persia, even until the reign of Darius king of Persia.";

yng[6] = "And in the reign of Ahasuerus, in the commencement of his reign, they have written an accusation against the inhabitants of Judah and Jerusalem;";

kjv[7] = "And in the days of Artaxerxes wrote Bishlam, Mithredath, Tabeel, and the rest of their companions, unto Artaxerxes king of Persia; and the writing of the letter [was] written in the Syrian tongue, and interpreted in the Syrian tongue.";
rsv[7] = "And in the days of Ar-ta-xerx\'es, Bishlam and Mith\'redath and Tab\'eel and the rest of their associates wrote to Ar-ta-xerx\'es king of Persia; the letter was written in Aramaic and translated.";
asv[7] = "And in the days of Artaxerxes wrote Bishlam, Mithredath, Tabeel, and the rest of his companions, unto Artaxerxes king of Persia; and the writing of the letter was written in the Syrian [character], and set forth in the Syrian [tongue].";
yng[7] = "and in the days of Artaxerxes have Bishlam, Mithredath, Tabeel, and the rest of his companions written unto Artaxerxes king of Persia, and the writing of the letter is written in Aramaean, and interpreted in Aramaean.";
dby[7] = "And in the days of Artaxerxes, Bishlam, Mithredath, Tabeel, and the rest of his companions, wrote to Artaxerxes king of Persia; and the writing of the letter was written in Aramaic, and interpreted in Aramaic.";
web[7] = "And in the days of Artaxerxes wrote Bishlam, Mithredath, Tabeel, and the rest of their companions to Artaxerxes king of Persia, and the writing of the letter [was] written in the Syrian language, and interpreted in the Syrian language.";
hnv[7] = " In the days of Artachshasta wrote Bishlam, Mitredat, Tav\'el, and the rest of his companions, to Artachshasta king of Paras; and the writing of the letter was written in the Arammian [character], and set forth in the Arammian [language].";

rsv[9] = "then wrote Rehum the commander, Shim\'shai the scribe, and the rest of their associates, the judges, the governors, the officials, the Persians, the men of Erech, the Babylonians, the men of Susa, that is, the Elamites,";
asv[9] = "then [wrote] Rehum the chancellor, and Shimshai the scribe, and the rest of their companions, the Dinaites, and the Apharsathchites, the Tarpelites, the Apharsites, the Archevites, the Babylonians, the Shushanchites, the Dehaites, the Elamites,";
yng[9] = "Then Rehum counsellor, and Shimshai scribe, and the rest of their companions, Dinaites, and Apharsathchites, Tarpelites, Apharsites, Archevites, Babylonians, Susanchites, (who are Elamites),";
dby[9] = "Rehum the chancellor, and Shimshai the scribe, and the rest of their companions, the Dinaites, and the Apharsathchites, the Tarpelites, the Apharsites, the Archevites, the Babylonians, the Shushanchites, the Dehaites, the Elamites,";
web[9] = "Then [wrote] Rehum the chancellor, and Shimshai the scribe, and the rest of their companions; the Dianites, the Apharsathchites, the Tarpelites, the Apharsites, the Archevites, the Babylonians, the Susanchites, the Dehavites, [and] the Elamites,";

kjv[12] = "Be it known unto the king, that the Jews which came up from thee to us are come unto Jerusalem, building the rebellious and the bad city, and have set up the walls [thereof], and joined the foundations.";
rsv[12] = "be it known to the king that the Jews who came up from you to us have gone to Jerusalem. They are rebuilding that rebellious and wicked city; they are finishing the walls and repairing the foundations.";
asv[12] = "Be it known unto the king, that the Jews that came up from thee are come to us unto Jerusalem; they are building the rebellious and the bad city, and have finished the walls, and repaired the foundations.";
yng[12] = "Be it known to the king, that the Jews who have come up from thee unto us, have come in to Jerusalem, the rebellious and base city they are building, and the walls they have finished, and the foundations they join.";
dby[12] = "Be it known to the king that the Jews who came up from thee unto us have come to Jerusalem; they are building the rebellious and the bad city, and they complete the walls and join up the foundations.";
web[12] = "Be it known to the king, that the Jews who came from thee to us are come to Jerusalem, building the rebellious and the noxious city, and have set up its walls, and joined the foundations.";
hnv[12] = "Be it known to the king, that the Yehudim who came up from you are come to us to Yerushalayim; they are building the rebellious and the bad city, and have finished the walls, and repaired the foundations.";
vul[12] = "notum sit regi quia Iudaei qui ascenderunt a te ad nos venerunt in Hierusalem civitatem rebellem et pessimam quam aedificant extruentes muros eius et parietes conponentes";
kjv[13] = "Be it known now unto the king, that, if this city be builded, and the walls set up [again, then] will they not pay toll, tribute, and custom, and [so] thou shalt endamage the revenue of the kings.";
rsv[13] = "Now be it known to the king that, if this city is rebuilt and the walls finished, they will not pay tribute, custom, or toll, and the royal revenue will be impaired.";
asv[13] = "Be it known now unto the king, that, if this city be builded, and the walls finished, they will not pay tribute, custom, or toll, and in the end it will be hurtful unto the kings.";
yng[13] = "`Now, be it known to the king, that if this city be builded, and the walls finished, toll, tribute, and custom they do not give; and at length [to] the kings it doth cause loss.";
dby[13] = "Be it known therefore unto the king, that, if this city be built and the walls be completed, they will not pay tribute, tax, and toll, and in the end it will bring damage to the kings.";
web[13] = "Be it known now to the king, that, if this city shall be built, and the walls set up [again], [then] they will not pay toll, tribute, and custom, and [so] thou wilt endamage the revenue of the kings.";
hnv[13] = "Be it known now to the king that if this city is built, and the walls finished, they will not pay tribute, custom, or toll, and in the end it will be hurtful to the kings.";
vul[13] = "nunc igitur notum sit regi quia si civitas illa aedificata fuerit et muri eius instaurati tributum et vectigal et annuos reditus non dabunt et usque ad reges haec noxa perveniet";
kjv[14] = "Now because we have maintenance from [the king\'s] palace, and it was not meet for us to see the king\'s dishonour, therefore have we sent and certified the king;";
rsv[14] = "Now because we eat the salt of the palace and it is not fitting for us to witness the king\'s dishonor, therefore we send and inform the king,";
asv[14] = "Now because we eat the salt of the palace, and it is not meet for us to see the king\'s dishonor, therefore have we sent and certified the king;";
yng[14] = "Now, because that the salt of the palace [is] our salt, and the nakedness of the king we have no patience to see, therefore we have sent and made known to the king;";
dby[14] = "Now, since we eat the salt of the palace, and it is not right for us to see the king\'s injury, therefore have we sent and informed the king;";
web[14] = "Now because we have maintenance from [the king\'s] palace, and it was not meet for us to see the king\'s dishonor, therefore have we sent and certified the king;";
hnv[14] = "Now because we eat the salt of the palace, and it is not appropriate for us to see the king\'s dishonor, therefore have we sent and informed the king;";
vul[14] = "nos ergo memores salis quod in palatio comedimus et quia laesiones regis videre nefas ducimus idcirco misimus et nuntiavimus regi";
kjv[15] = "That search may be made in the book of the records of thy fathers: so shalt thou find in the book of the records, and know that this city [is] a rebellious city, and hurtful unto kings and provinces, and that they have moved sedition within the same of old time: for which cause was this city destroyed.";
rsv[15] = "in order that search may be made in the book of the records of your fathers. You will find in the book of the records and learn that this city is a rebellious city, hurtful to kings and provinces, and that sedition was stirred up in it from of old. That was why this city was laid waste.";
asv[15] = "that search may be made in the book of the records of thy fathers: so shalt thou find in the book of the records, and know that this city is a rebellious city, and hurtful unto kings and provinces, and that they have moved sedition within the same of old time; for which cause was this city laid waste.";
yng[15] = "so that he doth seek in the book of the records of thy fathers, and thou dost find in the book of the records, and dost know, that this city [is] a rebellious city, and causing loss [to] kings and provinces, and makers of sedition [are] in its midst from the days of old, therefore hath this city been wasted.";
dby[15] = "that search may be made in the book of the annals of thy fathers: so shalt thou find in the book of the annals and know that this city is a rebellious city, which has done damage to kings and provinces, and that they have raised sedition within the same of old time, for which cause this city was destroyed.";
web[15] = "That search may be made in the book of the records of thy fathers: so wilt thou find in the book of the records, and know that this city [is] a rebellious city, and hurtful to kings and provinces, and that they have moved sedition within the same of old time: for which cause was this city destroyed.";
hnv[15] = "that search may be made in the book of the records of your fathers: so shall you find in the book of the records, and know that this city is a rebellious city, and hurtful to kings and provinces, and that they have moved sedition within the same of old time; for which cause was this city laid waste.";
vul[15] = "ut recenseas in libris historiarum patrum tuorum et invenies scriptum in commentariis et scies quoniam urbs illa urbs rebellis est et nocens regibus et provinciis et bella concitant in ea ex diebus antiquis quam ob rem et civitas ipsa destructa est";
kjv[16] = "We certify the king that, if this city be builded [again], and the walls thereof set up, by this means thou shalt have no portion on this side the river.";
rsv[16] = "We make known to the king that, if this city is rebuilt and its walls finished, you will then have no possession in the province Beyond the River.&quot;";
asv[16] = "We certify the king that, if this city be builded, and the walls finished, by this means thou shalt have no portion beyond the River.";
yng[16] = "We are making known to the king that, if this city be builded and the walls finished, by this means a portion beyond the river thou hast none.\'";
dby[16] = "We inform the king that if this city be built and its walls be completed, by this means thou shalt have no portion on this side the river.";
web[16] = "We certify the king that, if this city shall be built [again], and its walls set up, by this means thou wilt have no portion on this side of the river.";
hnv[16] = "We inform the king that, if this city be built, and the walls finished, by this means you shall have no portion beyond the River.";
vul[16] = "nuntiamus nos regi quoniam si civitas illa aedificata fuerit et muri ipsius instaurati possessionem trans Fluvium non habebis";
kjv[17] = "[Then] sent the king an answer unto Rehum the chancellor, and [to] Shimshai the scribe, and [to] the rest of their companions that dwell in Samaria, and [unto] the rest beyond the river, Peace, and at such a time.";
rsv[17] = "The king sent an answer: &quot;To Rehum the commander and Shim\'shai the scribe and the rest of their associates who live in Sama\'ria and in the rest of the province Beyond the River, greeting. And now";
asv[17] = "[Then] sent the king an answer unto Rehum the chancellor, and to Shimshai the scribe, and to the rest of their companions that dwell in Samaria, and in the rest [of the country] beyond the River: Peace, and so forth.";
yng[17] = "An answer hath the king sent unto Rehum counsellor, and Shimshai scribe, and the rest of their companions who are dwelling in Samaria, and the rest beyond the river, `Peace, and at such a time:";
dby[17] = "The king sent an answer to Rehum the chancellor, and Shimshai the scribe, and the rest of their companions that dwell in Samaria, and the other places beyond the river: Peace, and so forth.";
web[17] = "[Then] the king sent an answer to Rehum the chancellor, and [to] Shimshai the scribe, and [to] the rest of their companions that dwell in Samaria, and [to] the rest beyond the river, Peace, and at such a time.";
hnv[17] = "[Then] sent the king an answer to Rechum the chancellor, and to Shimshai the Sofer, and to the rest of their companions who dwell in Shomron, and in the rest [of the country] beyond the River: Shalom, and so forth.";
vul[17] = "verbum misit rex ad Reum Beelteem et Samsai scribam et ad reliquos qui erant in consilio eorum habitatores Samariae et ceteris trans Fluvium salutem dicens et pacem";
kjv[18] = "The letter which ye sent unto us hath been plainly read before me.";
rsv[18] = "the letter which you sent to us has been plainly read before me.";
asv[18] = "The letter which ye sent unto us hath been plainly read before me.";
yng[18] = "The letter that ye sent unto us, explained, hath been read before me,";
dby[18] = "The letter that ye sent to us has been read before me distinctly.";
web[18] = "The letter which ye sent to us hath been plainly read before me.";
hnv[18] = "The letter which you sent to us has been plainly read before me.";
vul[18] = "accusationem quam misistis ad nos manifeste lecta est coram me";
kjv[19] = "And I commanded, and search hath been made, and it is found that this city of old time hath made insurrection against kings, and [that] rebellion and sedition have been made therein.";
rsv[19] = "And I made a decree, and search has been made, and it has been found that this city from of old has risen against kings, and that rebellion and sedition have been made in it.";
asv[19] = "And I decreed, and search hath been made, and it is found that this city of old time hath made insurrection against kings, and that rebellion and sedition have been made therein.";
yng[19] = "and by me a decree hath been made, and they sought, and have found that this city from the days of old against kings is lifting up itself, and rebellion and sedition is made in it,";
dby[19] = "And I gave orders, and search has been made, and it has been found that this city of old time has made insurrection against the kings, and that rebellion and sedition have been raised therein.";
web[19] = "And I commanded, and search hath been made, and it is found that this city of old time hath made insurrection against kings, and [that] rebellion and sedition have been made in it.";
hnv[19] = "I decreed, and search has been made, and it is found that this city of old time has made insurrection against kings, and that rebellion and sedition have been made therein.";
vul[19] = "et a me praeceptum est et recensuerunt inveneruntque quoniam civitas illa a diebus antiquis adversum reges rebellat et seditiones et proelia concitantur in ea";
kjv[20] = "There have been mighty kings also over Jerusalem, which have ruled over all [countries] beyond the river; and toll, tribute, and custom, was paid unto them.";
rsv[20] = "And mighty kings have been over Jerusalem, who ruled over the whole province Beyond the River, to whom tribute, custom, and toll were paid.";
asv[20] = "There have been mighty kings also over Jerusalem, who have ruled over all [the country] beyond the River; and tribute, custom, and toll, was paid unto them.";
yng[20] = "and mighty kings have been over Jerusalem, even rulers over all beyond the river, and toll, tribute, and custom is given to them.";
dby[20] = "And there have been mighty kings over Jerusalem, who have ruled over all beyond the river; and tribute, tax, and toll were paid to them.";
web[20] = "There have also been mighty kings over Jerusalem, who have ruled over all [countries] beyond the river; and toll, tribute, and custom, was paid to them.";
hnv[20] = "There have been mighty kings also over Yerushalayim, who have ruled over all [the country] beyond the River; and tribute, custom, and toll, was paid to them.";
vul[20] = "nam et reges fortissimi fuerunt in Hierusalem qui et dominati sunt omni regioni quae trans Fluvium est tributum quoque et vectigal et reditus accipiebant";
kjv[21] = "Give ye now commandment to cause these men to cease, and that this city be not builded, until [another] commandment shall be given from me.";
rsv[21] = "Therefore make a decree that these men be made to cease, and that this city be not rebuilt, until a decree is made by me.";
asv[21] = "Make ye now a decree to cause these men to cease, and that this city be not builded, until a decree shall be made by me.";
yng[21] = "`Now, make ye a decree to cause these men to cease, and this city is not builded, till by me a decree is made.";
dby[21] = "Now give order to make these men to cease, and that this city be not built, until the order shall be given from me;";
web[21] = "Give ye now commandment to cause these men to cease, and that this city be not built, until [another] commandment shall be given from me.";
hnv[21] = "Make you now a decree to cause these men to cease, and that this city not be built, until a decree shall be made by me.";
vul[21] = "nunc ergo audite sententiam ut prohibeatis viros illos et urbs illa non aedificetur donec si forte a me iussum fuerit";
kjv[22] = "Take heed now that ye fail not to do this: why should damage grow to the hurt of the kings?";
rsv[22] = "And take care not to be slack in this matter; why should damage grow to the hurt of the king?&quot;";
asv[22] = "And take heed that ye be not slack herein: why should damage grow to the hurt of the kings?";
yng[22] = "And beware ye of negligence in doing this; why doth the hurt become great to the loss of the kings?\'";
dby[22] = "and take heed that ye fail not to do this: why should harm grow to the damage of the kings?";
web[22] = "Take heed now that ye fail not to do this: why should damage grow to the hurt of the kings?";
hnv[22] = "Take heed that you not be slack herein: why should damage grow to the hurt of the kings?";
vul[22] = "videte ne neglegenter hoc impleatis et paulatim crescat malum contra reges";
kjv[23] = "Now when the copy of king Artaxerxes\' letter [was] read before Rehum, and Shimshai the scribe, and their companions, they went up in haste to Jerusalem unto the Jews, and made them to cease by force and power.";
rsv[23] = "Then, when the copy of King Ar-ta-xerx\'es\' letter was read before Rehum and Shim\'shai the scribe and their associates, they went in haste to the Jews at Jerusalem and by force and power made them cease.";
asv[23] = "Then when the copy of king Artaxerxes\' letter was read before Rehum, and Shimshai the scribe, and their companions, they went in haste to Jerusalem unto the Jews, and made them to cease by force and power.";
yng[23] = "Then from the time that a copy of the letter of king Artaxerxes is read before Rehum, and Shimshai the scribe, and their companions, they have gone in haste to Jerusalem, unto the Jews, and caused them to cease by force and strength;";
dby[23] = "As soon as the copy of king Artaxerxes\' letter was read before Rehum, and Shimshai the scribe, and their companions, they went up in haste to Jerusalem to the Jews, and made them cease by force and power.";
web[23] = "Now when the copy of king Artaxerxes\' letter [was] read before Rehum, and Shimshai the scribe, and their companions, they went up in haste to Jerusalem to the Jews, and made them to cease by force and power.";
hnv[23] = " Then when the copy of king Artachshasta\' letter was read before Rechum, and Shimshai the Sofer, and their companions, they went in haste to Yerushalayim to the Yehudim, and made them to cease by force and power.";
vul[23] = "itaque exemplum edicti Artarxersis regis lectum est coram Reum et Samsai scriba et consiliariis eorum et abierunt festini in Hierusalem ad Iudaeos et prohibuerunt eos in brachio et robore";
kjv[24] = "Then ceased the work of the house of God which [is] at Jerusalem. So it ceased unto the second year of the reign of Darius king of Persia.";
rsv[24] = "Then the work on the house of God which is in Jerusalem stopped; and it ceased until the second year of the reign of Darius king of Persia.";
asv[24] = "Then ceased the work of the house of God which is at Jerusalem; and it ceased until the second year of the reign of Darius king of Persia.";
yng[24] = "then ceased the service of the house of God that [is] in Jerusalem, and it ceased till the second year of the reign of Darius king of Persia.";
dby[24] = "Then ceased the work of the house of God which is at Jerusalem; and it ceased until the second year of the reign of Darius king of Persia.";
web[24] = "Then ceased the work of the house of God which [is] at Jerusalem. So it ceased until the second year of the reign of Darius king of Persia.";
hnv[24] = "Then ceased the work of the house of God which is at Yerushalayim; and it ceased until the second year of the reign of Daryavesh king of Paras.";
vul[24] = "tunc intermissum est opus domus Dei in Hierusalem et non fiebat usque ad annum secundum regni Darii regis Persarum";
