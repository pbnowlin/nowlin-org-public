csb[1] = "After these events, during the reign of King Artaxerxes of Persia, Ezra -- Seraiah\'s son, Azariah\'s son, Hilkiah\'s son,";
csb[2] = "Shallum\'s son, Zadok\'s son, Ahitub\'s son,";
csb[3] = "Amariah\'s son, Azariah\'s son, Meraioth\'s son,";
csb[4] = "Zerahiah\'s son, Uzzi\'s son, Bukki\'s son,";
csb[5] = "Abishua\'s son, Phinehas\'s son, Eleazar\'s son, the chief priest Aaron\'s son";
csb[6] = "-- came up from Babylon. He was a scribe skilled in the law of Moses, which the LORD, the God of Israel, had given. The king had granted him everything he requested because the hand of the LORD his God was on him.";
csb[7] = "Some of the Israelites, priests, Levites, singers, gatekeepers, and temple servants accompanied him to Jerusalem in the seventh year of King Artaxerxes.";
csb[8] = "Ezra came to Jerusalem in the fifth month, during the seventh year of the king.";
csb[9] = "He began the journey from Babylon on the first day of the first month and arrived in Jerusalem on the first day of the fifth month since the gracious hand of his God was on him.";
csb[10] = "Now Ezra had determined in his heart to study the law of the LORD, obey it, and teach its statutes and ordinances in Israel.";
csb[11] = "This is the text of the letter King Artaxerxes gave to Ezra the priest and scribe, an expert in matters of the LORD\'s commands and statutes for Israel:";
csb[12] = "Artaxerxes, king of kings, to Ezra the priest, an expert in the law of the God of the heavens: Greetings.";
csb[13] = "I issue a decree that any of the Israelites in my kingdom, including their priests and Levites, who want to go to Jerusalem, may go with you.";
csb[14] = "You are sent by the king and his seven counselors to evaluate Judah and Jerusalem according to the law of your God, which is in your possession.";
csb[15] = "You are also to bring the silver and gold the king and his counselors have willingly given to the God of Israel, whose dwelling is in Jerusalem,";
csb[16] = "and all the silver and gold you receive throughout the province of Babylon, together with the freewill offerings given by the people and the priests to the house of their God in Jerusalem.";
csb[17] = "Then you are to be diligent to buy with this money bulls, rams, and lambs, along with their grain and drink offerings, and offer them on the altar at the house of your God in Jerusalem.";
csb[18] = "You may do whatever seems best to you and your brothers with the rest of the silver and gold, according to the will of your God.";
csb[19] = "Deliver to the God of Jerusalem all the articles given to you for the service of the house of your God.";
csb[20] = "You may use the royal treasury to pay for anything else needed for the house of your God.";
csb[21] = "I, King Artaxerxes, issue a decree to all the treasurers in the region west of the Euphrates River: Whatever Ezra the priest, an expert in the law of the God of the heavens, asks of you must be provided in full,";
csb[22] = "up to 7,500 pounds of silver, 500 bushels of wheat, 550 gallons of wine, 550 gallons of oil, and salt without limit.";
csb[23] = "Whatever is commanded by the God of heaven must be done diligently for the house of the God of the heavens, so that wrath will not fall on the realm of the king and his sons.";
csb[24] = "Be advised that you do not have authority to impose tribute, duty, and land tax on any priests, Levites, singers, doorkeepers, temple servants, or other servants of this house of God.";
csb[25] = "And you, Ezra, according to God\'s wisdom that you possess, appoint magistrates and judges to judge all the people in the region west of the Euphrates who know the laws of your God and to teach anyone who does not know them.";
csb[26] = "Anyone who does not keep the law of your God and the law of the king, let the appropriate judgment be executed against him, whether death, banishment, confiscation of property, or imprisonment.";
csb[27] = "Blessed be the LORD, the God of our fathers, who has put it into the king\'s mind to glorify the house of the LORD in Jerusalem,";
csb[28] = "and who has shown favor to me before the king, his counselors, and all his powerful officers. So I took courage because I was strengthened by the hand of the LORD my God, and I gathered Israelite leaders to return with me.";

kjv[6] = "This Ezra went up from Babylon; and he [was] a ready scribe in the law of Moses, which the LORD God of Israel had given: and the king granted him all his request, according to the hand of the LORD his God upon him.";

yng[6] = "Ezra himself hath come up from Babylon, and he [is] a scribe ready in the law of Moses, that Jehovah God of Israel gave, and the king giveth to him -- according to the hand of Jehovah his God upon him -- all his request.";

asv[9] = "For upon the first [day] of the first month began he to go up from Babylon; and on the first [day] of the fifth month came he to Jerusalem, according to the good hand of his God upon him.";
yng[9] = "for on the first of the month he hath founded the ascent from Babylon, and on the first of the fifth month he hath come in unto Jerusalem, according to the good hand of his God upon him,";

kjv[13] = "I make a decree, that all they of the people of Israel, and [of] his priests and Levites, in my realm, which are minded of their own freewill to go up to Jerusalem, go with thee.";

asv[13] = "I make a decree, that all they of the people of Israel, and their priests and the Levites, in my realm, that are minded of their own free will to go to Jerusalem, go with thee.";
yng[13] = "By me hath been made a decree that every one who is willing, in my kingdom, of the people of Israel and of its priests and Levites, to go to Jerusalem with thee, doth go;";
dby[13] = "I have given orders that all they of the people of Israel, and of their priests and the Levites, in my realm, who are disposed to go to Jerusalem, go with thee.";

yng[17] = "therefore thou dost speedily buy with this money, bullocks, rams, lambs, and their presents, and their libations, and dost bring them near to the altar of the house of your God that [is] in Jerusalem,";
dby[17] = "Therefore thou shalt buy diligently with this money bullocks, rams, lambs, with their oblations and their drink-offerings, and offer them upon the altar of the house of your God which is at Jerusalem.";

asv[18] = "And whatsoever shall seem good to thee and to thy brethren to do with the rest of the silver and the gold, that do ye after the will of your God.";

hnv[18] = "Whatever shall seem good to you and to your brothers to do with the rest of the silver and the gold, that do you after the will of your God.";
vul[18] = "sed et si quid tibi et fratribus tuis placuerit de reliquo argento et auro ut faciatis iuxta voluntatem Dei vestri facite";
kjv[19] = "The vessels also that are given thee for the service of the house of thy God, [those] deliver thou before the God of Jerusalem.";
rsv[19] = "The vessels that have been given you for the service of the house of your God, you shall deliver before the God of Jerusalem.";
asv[19] = "And the vessels that are given thee for the service of the house of thy God, deliver thou before the God of Jerusalem.";
yng[19] = "`And the vessels that are given to thee, for the service of the house of thy God, make perfect before the God of Jerusalem;";
dby[19] = "And the vessels that have been given thee for the service of the house of thy God, deliver before the God of Jerusalem.";
web[19] = "The vessels also that are given thee for the service of the house of thy God, [those] deliver thou before the God of Jerusalem.";
hnv[19] = "The vessels that are given you for the service of the house of your God, deliver you before the God of Yerushalayim.";
vul[19] = "vasa quoque quae dantur tibi in ministerium domus Dei tui trade in conspectu Dei Hierusalem";
kjv[20] = "And whatsoever more shall be needful for the house of thy God, which thou shalt have occasion to bestow, bestow [it] out of the king\'s treasure house.";
rsv[20] = "And whatever else is required for the house of your God, which you have occasion to provide, you may provide it out of the king\'s treasury.";
asv[20] = "And whatsoever more shall be needful for the house of thy God, which thou shalt have occasion to bestow, bestow it out of the king\'s treasure-house.";
yng[20] = "and the rest of the needful things of the house of thy God, that it falleth to thee to give, thou dost give from the treasure-house of the king.";
dby[20] = "And whatever more shall be needful for the house of thy God which thou shalt have occasion to bestow, bestow it out of the king\'s treasure house.";
web[20] = "And whatever more shall be needful for the house of thy God, which thou shalt have occasion to bestow, bestow [it] out of the king\'s treasure-house.";
hnv[20] = "Whatever more shall be needful for the house of your God, which you shall have occasion to bestow, bestow it out of the king\'s treasure-house.";
vul[20] = "sed et cetera quibus opus fuerit in domo Dei tui quantumcumque necesse est ut expendas dabis de thesauro et de fisco regis";
kjv[21] = "And I, [even] I Artaxerxes the king, do make a decree to all the treasurers which [are] beyond the river, that whatsoever Ezra the priest, the scribe of the law of the God of heaven, shall require of you, it be done speedily,";
rsv[21] = "&quot;And I, Ar-ta-xerx\'es the king, make a decree to all the treasurers in the province Beyond the River: Whatever Ezra the priest, the scribe of the law of the God of heaven, requires of you, be it done with all diligence,";
asv[21] = "And I, even I Artaxerxes the king, do make a decree to all the treasurers that are beyond the River, that whatsoever Ezra the priest, the scribe of the law of the God of heaven, shall require of you, it be done with all diligence,";
yng[21] = "`And by me -- I Artaxerxes the king -- is made a decree to all treasurers who [are] beyond the river, that all that Ezra the priest, scribe of the law of the God of heaven, doth ask of you, be done speedily:";
dby[21] = "And I, I Artaxerxes the king, do give orders to all the treasurers that are beyond the river, that whatever Ezra the priest and scribe of the law of the God of the heavens shall require of you, it be done diligently,";
web[21] = "And I, [even] I Artaxerxes the king, do make a decree to all the treasurers who [are] beyond the river, that whatever Ezra the priest, the scribe of the law of the God of heaven, shall require of you, it be done speedily,";
hnv[21] = "I, even I Artachshasta the king, do make a decree to all the treasurers who are beyond the River, that whatever Ezra the Kohen, the Sofer of the law of the God of heaven, shall require of you, it be done with all diligence,";
vul[21] = "et a me ego Artarxersis rex statui atque decrevi omnibus custodibus arcae publicae qui sunt trans Flumen ut quodcumque petierit a vobis Ezras sacerdos scriba legis Dei caeli absque mora detis";
kjv[22] = "Unto an hundred talents of silver, and to an hundred measures of wheat, and to an hundred baths of wine, and to an hundred baths of oil, and salt without prescribing [how much].";
rsv[22] = "up to a hundred talents of silver, a hundred cors of wheat, a hundred baths of wine, a hundred baths of oil, and salt without prescribing how much.";
asv[22] = "unto a hundred talents of silver, and to a hundred measures of wheat, and to a hundred baths of wine, and to a hundred baths of oil, and salt without prescribing how much.";
yng[22] = "Unto silver a hundred talents, and unto wheat a hundred cors, and unto wine a hundred baths, and unto oil a hundred baths, and salt without reckoning;";
dby[22] = "unto a hundred talents of silver, and to a hundred measures of wheat, and to a hundred baths of wine, and to a hundred baths of oil, and salt without prescribing [how much].";
web[22] = "To a hundred talents of silver, and to a hundred measures of wheat, and to a hundred baths of wine, and to a hundred baths of oil, and salt without prescribing [how much].";
hnv[22] = "to one hundred talents of silver, and to one hundred measures of wheat, and to one hundred baths of wine, and to one hundred baths of oil, and salt without prescribing how much.";
vul[22] = "usque ad argenti talenta centum et usque ad frumenti choros centum et usque ad vini batos centum et usque ad batos olei centum sal vero absque mensura";
kjv[23] = "Whatsoever is commanded by the God of heaven, let it be diligently done for the house of the God of heaven: for why should there be wrath against the realm of the king and his sons?";
rsv[23] = "Whatever is commanded by the God of heaven, let it be done in full for the house of the God of heaven, lest his wrath be against the realm of the king and his sons.";
asv[23] = "Whatsoever is commanded by the God of heaven, let it be done exactly for the house of the God of heaven; for why should there be wrath against the realm of the king and his sons?";
yng[23] = "all that [is] by the decree of the God of heaven, let be done diligently for the house of the God of heaven; for why is there wrath against the kingdom of the king and his sons?";
dby[23] = "Whatever is commanded by the God of the heavens, let it be carefully done for the house of the God of the heavens; for why should there be wrath against the realm of the king and his sons?";
web[23] = "Whatever is commanded by the God of heaven, let it be diligently done for the house of the God of heaven: for why should there be wrath against the realm of the king and his sons?";
hnv[23] = "Whatever is commanded by the God of heaven, let it be done exactly for the house of the God of heaven; for why should there be wrath against the realm of the king and his sons?";
vul[23] = "omne quod ad ritum Dei caeli pertinet tribuatur diligenter in domo Dei caeli ne forte irascatur contra regnum regis et filiorum eius";
kjv[24] = "Also we certify you, that touching any of the priests and Levites, singers, porters, Nethinims, or ministers of this house of God, it shall not be lawful to impose toll, tribute, or custom, upon them.";
rsv[24] = "We also notify you that it shall not be lawful to impose tribute, custom, or toll upon any one of the priests, the Levites, the singers, the doorkeepers, the temple servants, or other servants of this house of God.";
asv[24] = "Also we certify you, that touching any of the priests and Levites, the singers, porters, Nethinim, or servants of this house of God, it shall not be lawful to impose tribute, custom, or toll, upon them.";
yng[24] = "`And to you we are making known, that upon any of the priests and Levites, singers, gatekeepers, Nethinim, and servants of the house of God, tribute and custom there is no authority to lift up.";
dby[24] = "Also we inform you, as regards all the priests and Levites, singers, doorkeepers, Nethinim, and ministers of this house of God, it shall not be lawful to impose tribute, tax, and toll upon them.";
web[24] = "Also we certify you, that concerning any of the priests and Levites, singers, porters, Nethinims, or ministers of this house of God, it shall not be lawful to impose toll, tribute, or custom upon them.";
hnv[24] = "Also we inform you, that touching any of the Kohanim and Levites, the singers, porters, temple servants, or servants of this house of God, it shall not be lawful to impose tribute, custom, or toll, on them.";
vul[24] = "vobisque notum facimus de universis sacerdotibus et Levitis cantoribus ianitoribus Nathinneis et ministris domus Dei huius ut vectigal et tributum et annonas non habeatis potestatem inponendi super eos";
kjv[25] = "And thou, Ezra, after the wisdom of thy God, that [is] in thine hand, set magistrates and judges, which may judge all the people that [are] beyond the river, all such as know the laws of thy God; and teach ye them that know [them] not.";
rsv[25] = "&quot;And you, Ezra, according to the wisdom of your God which is in your hand, appoint magistrates and judges who may judge all the people in the province Beyond the River, all such as know the laws of your God; and those who do not know them, you shall teach.";
asv[25] = "And thou, Ezra, after the wisdom of thy God that is in thy hand, appoint magistrates and judges, who may judge all the people that are beyond the River, all such as know the laws of thy God; and teach ye him that knoweth them not.";
yng[25] = "`And thou, Ezra, according to the wisdom of thy God, that [is] in thy hand, appoint magistrates and judges who may be judges to all the people who are beyond the river, to all knowing the law of thy God, and he who hath not known ye cause to know;";
dby[25] = "And thou, Ezra, after the wisdom of thy God, which is in thy hand, set magistrates and judges who may judge all the people that are beyond the river, all such as know the laws of thy God; and teach ye him that knows [them] not.";
web[25] = "And thou, Ezra, after the wisdom of thy God, that [is] in thy hand, set magistrates and judges, who may judge all the people that [are] beyond the river, all such as know the laws of thy God; and teach ye them that know [them] not.";
hnv[25] = "You, Ezra, after the wisdom of your God who is in your hand, appoint magistrates and judges, who may judge all the people who are beyond the River, all such as know the laws of your God; and teach you him who doesn\'t know them.";
vul[25] = "tu autem Ezras secundum sapientiam Dei tui quae est in manu tua constitue iudices et praesides ut iudicent omni populo qui est trans Flumen his videlicet qui noverunt legem Dei tui sed et inperitos docete libere";
kjv[26] = "And whosoever will not do the law of thy God, and the law of the king, let judgment be executed speedily upon him, whether [it be] unto death, or to banishment, or to confiscation of goods, or to imprisonment.";
rsv[26] = "Whoever will not obey the law of your God and the law of the king, let judgment be strictly executed upon him, whether for death or for banishment or for confiscation of his goods or for imprisonment.&quot;";
asv[26] = "And whosoever will not do the law of thy God, and the law of the king, let judgment be executed upon him with all diligence, whether it be unto death, or to banishment, or to confiscation of goods, or to imprisonment.";
yng[26] = "and any who doth not do the law of thy God, and the law of the king, speedily is judgment done upon him, whether to death, or to banishment, or to confiscation of riches, and to bonds.\'";
dby[26] = "And whosoever will not do the law of thy God and the law of the king, let judgment be executed diligently upon him, whether unto death, or to banishment, or to confiscation of goods, or to imprisonment.";
web[26] = "And whoever will not do the law of thy God, and the law of the king, let judgment be executed speedily upon him, whether [it be] to death, or to banishment, or to confiscation of goods, or to imprisonment.";
hnv[26] = "Whoever will not do the law of your God, and the law of the king, let judgment be executed on him with all diligence, whether it be to death, or to banishment, or to confiscation of goods, or to imprisonment.";
vul[26] = "et omnis qui non fecerit legem Dei tui et legem regis diligenter iudicium erit de eo sive in mortem sive in exilium sive in condemnationem substantiae eius vel certe in carcerem";
kjv[27] = "Blessed [be] the LORD God of our fathers, which hath put [such a thing] as this in the king\'s heart, to beautify the house of the LORD which [is] in Jerusalem:";
rsv[27] = "Blessed be the LORD, the God of our fathers, who put such a thing as this into the heart of the king, to beautify the house of the LORD which is in Jerusalem,";
asv[27] = "Blessed be Jehovah, the God of our fathers, who hath put such a thing as this in the king\'s heart, to beautify the house of Jehovah which is in Jerusalem;";
yng[27] = "Blessed [is] Jehovah, God of our fathers, who hath given such a thing as this in the heart of the king, to beautify the house of Jehovah that [is] in Jerusalem,";
dby[27] = "Blessed be Jehovah the God of our fathers, who has put [such a thing] as this in the king\'s heart, to beautify the house of Jehovah which is at Jerusalem;";
web[27] = "Blessed [be] the LORD God of our fathers, who hath put [such a thing] as this in the king\'s heart, to beautify the house of the LORD which [is] in Jerusalem:";
hnv[27] = "Blessed be the LORD, the God of our fathers, who has put such a thing as this in the king\'s heart, to beautify the house of the LORD which is in Yerushalayim;";
vul[27] = "benedictus Dominus Deus patrum nostrorum qui dedit hoc in corde regis ut glorificaret domum Domini quae est in Hierusalem";
kjv[28] = "And hath extended mercy unto me before the king, and his counsellors, and before all the king\'s mighty princes. And I was strengthened as the hand of the LORD my God [was] upon me, and I gathered together out of Israel chief men to go up with me.";
rsv[28] = "and who extended to me his steadfast love before the king and his counselors, and before all the king\'s mighty officers. I took courage, for the hand of the LORD my God was upon me, and I gathered leading men from Israel to go up with me.";
asv[28] = "and hath extended lovingkindness unto me before the king, and his counsellors, and before all the king\'s mighty princes. And I was strengthened according to the hand of Jehovah my God upon me, and I gathered together out of Israel chief men to go up with me.";
yng[28] = "and unto me hath stretched out kindness before the king and his counsellors, and before all the mighty heads of the king: and I have strengthened myself as the hand of Jehovah my God [is] upon me, and I gather out of Israel heads to go up with me.";
dby[28] = "and has extended mercy to me before the king and his counsellors, and before all the king\'s mighty princes. And I was strengthened, as the hand of Jehovah my God was upon me; and I gathered together out of Israel chief men to go up with me.";
web[28] = "And hath extended mercy to me before the king, and his counselors, and before all the king\'s mighty princes. And I was strengthened as the hand of the LORD my God [was] upon me, and I assembled out of Israel chief men to go up with me.";
hnv[28] = "and has extended lovingkindness to me before the king, and his counselors, and before all the king\'s mighty princes. I was strengthened according to the hand of the LORD my God on me, and I gathered together out of Yisra\'el chief men to go up with me.";
vul[28] = "et in me inclinavit misericordiam coram rege et consiliatoribus eius et universis principibus regis potentibus et ego confortatus manu Domini Dei mei quae erat in me congregavi de Israhel principes qui ascenderent mecum";
