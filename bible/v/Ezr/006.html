csb[1] = "King Darius gave the order, and they searched in the library of Babylon in the archives.";
csb[2] = "But it was in the fortress of Ecbatana in the province of Media that a scroll was found with this record written on it:";
csb[3] = "In the first year of King Cyrus, he issued a decree concerning the house of God in Jerusalem: Let the house be rebuilt as a place for offering sacrifices, and let its original foundations be retained. Its height is to be ninety feet and its width ninety feet,";
csb[4] = "with three layers of cut stones and one of timber. The cost is to be paid from the royal treasury.";
csb[5] = "The gold and silver articles of God\'s house that Nebuchadnezzar took from the temple in Jerusalem and carried to Babylon must also be returned. They are to be brought to the temple in Jerusalem where they belong and put into the house of God.";
csb[6] = "Therefore, you must stay away from that place, Tattenai governor of the region west of the Euphrates River, Shethar-bozenai, and your colleagues, the officials in the region.";
csb[7] = "Leave the construction of the house of God alone. Let the governor and elders of the Jews rebuild this house of God on its original site.";
csb[8] = "I hereby issue a decree concerning what you are to do, so that the elders of the Jews can rebuild the house of God: The cost is to be paid in full to these men out of the royal revenues from the taxes of the region west of the Euphrates River, so that the work will not stop.";
csb[9] = "Whatever is needed -- young bulls, rams, and lambs for burnt offerings to the God of the heavens, or wheat, salt, wine, and oil, as requested by the priests in Jerusalem -- let it be given to them every day without fail,";
csb[10] = "so that they can offer sacrifices of pleasing aroma to the God of the heavens and pray for the life of the king and his sons.";
csb[11] = "I also issue a decree concerning any man who interferes with this directive: Let a beam be torn from his house and raised up; he will be impaled on it, and his house will be made into a garbage dump because of this offense.";
csb[12] = "May the God who caused his name to dwell there overthrow any king or people who dares to harm or interfere with this house of God in Jerusalem. I, Darius, have issued the decree. Let it be carried out diligently.";
csb[13] = "Then Tattenai governor of the region west of the Euphrates River, Shethar-bozenai, and their colleagues diligently carried out what King Darius had decreed.";
csb[14] = "So the Jewish elders continued successfully with the building under the prophesying of Haggai the prophet and Zechariah son of Iddo. They finished the building according to the command of the God of Israel and the decrees of Cyrus, Darius, and King Artaxerxes of Persia.";
csb[15] = "This house was completed on the third day of the month of Adar in the sixth year of the reign of King Darius.";
csb[16] = "Then the Israelites, including the priests, the Levites, and the rest of the exiles, celebrated the dedication of the house of God with joy.";
csb[17] = "For the dedication of God\'s house they offered one hundred bulls, two hundred rams, and four hundred lambs, as well as twelve male goats as a sin offering for all Israel -- one for each Israelite tribe.";
csb[18] = "They also appointed the priests by their divisions and the Levites by their groups to the service of God in Jerusalem, according to what is written in the book of Moses.";
csb[19] = "The exiles observed the Passover on the fourteenth day of the first month.";
csb[20] = "All of the priests and Levites were ceremonially clean, because they had purified themselves. They killed the Passover lamb for themselves, their priestly brothers, and all the exiles.";
csb[21] = "The Israelites who had returned from exile ate it, together with all who had separated themselves from the uncleanness of the Gentiles of the land in order to worship the LORD, the God of Israel.";
csb[22] = "They observed the Festival of Unleavened Bread for seven days with joy, because the LORD had made them joyful, having changed the Assyrian king\'s attitude toward them, so that he supported them in the work on the house of the God of Israel.";
kjv[1] = "Then Darius the king made a decree, and search was made in the house of the rolls, where the treasures were laid up in Babylon.";
rsv[1] = "Then Darius the king made a decree, and search was made in Babylonia, in the house of the archives where the documents were stored.";
asv[1] = "Then Darius the king made a decree, and search was made in the house of the archives, where the treasures were laid up in Babylon.";
yng[1] = "Then Darius the king made a decree, and they sought in the house of the books of the treasuries placed there in Babylon,";
dby[1] = "Then king Darius gave orders, and search was made in the house of the rolls, where the treasures were laid up in Babylon.";
web[1] = "Then Darius the king made a decree, and search was made in the house of the rolls, where the treasures were laid up in Babylon.";
hnv[1] = "Then Daryavesh the king made a decree, and search was made in the house of the archives, where the treasures were laid up in Bavel.";
vul[1] = "tunc Darius rex praecepit et recensuerunt in bibliotheca librorum qui erant repositi in Babylone";
kjv[2] = "And there was found at Achmetha, in the palace that [is] in the province of the Medes, a roll, and therein [was] a record thus written:";
rsv[2] = "And in Ecbat\'ana, the capital which is in the province of Media, a scroll was found on which this was written: &quot;A record.";
asv[2] = "And there was found at Achmetha, in the palace that is in the province of Media, a roll, and therein was thus written for a record:";
yng[2] = "and there hath been found at Achmetha, in a palace that [is] in the province of Media, a roll, and a record thus written within it [is]:";
dby[2] = "And there was found at Achmetha in the fortress that is in the province of Media a roll, and therein was a record thus written:";
web[2] = "And there was found at Achmetha, in the palace that [is] in the province of the Medes, a roll, and in it [was] a record thus written:";
hnv[2] = "There was found at Achmeta, in the palace that is in the province of Madai, a scroll, and therein was thus written for a record:";
vul[2] = "et inventum est in Ecbathanis quod est castrum in Madena provincia volumen unum talisque scriptus erat in eo commentarius";
kjv[3] = "In the first year of Cyrus the king [the same] Cyrus the king made a decree [concerning] the house of God at Jerusalem, Let the house be builded, the place where they offered sacrifices, and let the foundations thereof be strongly laid; the height thereof threescore cubits, [and] the breadth thereof threescore cubits;";
rsv[3] = "In the first year of Cyrus the king, Cyrus the king issued a decree: Concerning the house of God at Jerusalem, let the house be rebuilt, the place where sacrifices are offered and burnt offerings are brought; its height shall be sixty cubits and its breadth sixty cubits,";
asv[3] = "In the first year of Cyrus the king, Cyrus the king made a decree: Concerning the house of God at Jerusalem, let the house be builded, the place where they offer sacrifices, and let the foundations thereof be strongly laid; the height thereof threescore cubits, and the breadth thereof threescore cubits;";
yng[3] = "`In the first year of Cyrus the king, Cyrus the king hath made a decree concerning the house of God in Jerusalem: the house let be builded in the place where they are sacrificing sacrifices, and its foundations strongly laid; its height sixty cubits, its breadth sixty cubits;";
dby[3] = "In the first year of king Cyrus, king Cyrus made a decree [concerning] the house of God at Jerusalem: Let the house be built for a place where they offer sacrifices, and let its foundations be solidly laid; its height sixty cubits, its breadth sixty cubits,";
web[3] = "In the first year of Cyrus the king, [the same] Cyrus the king made a decree [concerning] the house of God at Jerusalem, Let the house be built, the place where they offered sacrifices, and let the foundations of it be strongly laid; the hight of it sixty cubits, [and] the breadth of it sixty cubits;";
hnv[3] = "In the first year of Koresh the king, Koresh the king made a decree: Concerning the house of God at Yerushalayim, let the house be built, the place where they offer sacrifices, and let the foundations of it be strongly laid; the height of it sixty cubits, and the breadth of it sixty cubits;";
vul[3] = "anno primo Cyri regis Cyrus rex decrevit ut domus Dei quae est in Hierusalem aedificaretur in loco ubi immolent hostias et ut ponant fundamenta subportantia altitudinem cubitorum sexaginta et latitudinem cubitorum sexaginta";
kjv[4] = "[With] three rows of great stones, and a row of new timber: and let the expenses be given out of the king\'s house:";
rsv[4] = "with three courses of great stones and one course of timber; let the cost be paid from the royal treasury.";
asv[4] = "with three courses of great stones, and a course of new timber: and let the expenses be given out of the king\'s house.";
yng[4] = "three rows of rolled stones, and a row of new wood, and the outlay let be given out of the king\'s house.";
dby[4] = "[with] three rows of great stones, and a row of new timber; and let the expenses be given out of the king\'s house:";
web[4] = "[With] three rows of great stones, and a row of new timber: and let the expenses be given out of the king\'s house:";
hnv[4] = "with three courses of great stones, and a course of new timber: and let the expenses be given out of the king\'s house.";
vul[4] = "ordines de lapidibus inpolitis tres et sic ordines de lignis novis sumptus autem de domo regis dabuntur";
kjv[5] = "And also let the golden and silver vessels of the house of God, which Nebuchadnezzar took forth out of the temple which [is] at Jerusalem, and brought unto Babylon, be restored, and brought again unto the temple which [is] at Jerusalem, [every one] to his place, and place [them] in the house of God.";
rsv[5] = "And also let the gold and silver vessels of the house of God, which Nebuchadnez\'zar took out of the temple that is in Jerusalem and brought to Babylon, be restored and brought back to the temple which is in Jerusalem, each to its place; you shall put them in the house of God.&quot;";
asv[5] = "And also let the gold and silver vessels of the house of God, which Nebuchadnezzar took forth out of the temple which is at Jerusalem, and brought unto Babylon, be restored, and brought again unto the temple which is at Jerusalem, every one to its place; and thou shalt put them in the house of God.";
yng[5] = "`And also, the vessels of the house of God, of gold and silver, that Nebuchadnezzar took forth out of the temple that [is] in Jerusalem, and brought to Babylon, let be given back, and go to the temple that [is] in Jerusalem, [each] to its place, and put [them] down in the house of God.";
dby[5] = "and also let the golden and silver vessels of the house of God, which Nebuchadnezzar took out of the temple that is at Jerusalem and brought to Babylon, be restored and brought again to the temple that is at Jerusalem, in their place; and thou shalt put [them] in the house of God.";
web[5] = "And also let the golden and silver vessels of the house of God, which Nebuchadnezzar took out of the temple which [is] at Jerusalem, and brought to Babylon, be restored, and brought again to the temple which [is] at Jerusalem, [every one] to its place, and place [them] in the house of God.";
hnv[5] = "Also let the gold and silver vessels of the house of God, which Nevukhadnetztzar took forth out of the temple which is at Yerushalayim, and brought to Bavel, be restored, and brought again to the temple which is at Yerushalayim, everyone to its place; and you shall put them in the house of God.";
vul[5] = "sed et vasa templi Dei aurea et argentea quae Nabuchodonosor tulerat de templo Hierusalem et adtulerat ea in Babylonem reddantur et referantur in templo Hierusalem in locum suum quae et posita sunt in templo Dei";
kjv[6] = "Now [therefore], Tatnai, governor beyond the river, Shetharboznai, and your companions the Apharsachites, which [are] beyond the river, be ye far from thence:";
rsv[6] = "&quot;Now therefore, Tat\'tenai, governor of the province Beyond the River, She\'thar-boz\'enai, and your associates the governors who are in the province Beyond the River, keep away;";
asv[6] = "Now therefore, Tattenai, governor beyond the River, Shethar-bozenai, and your companions the Apharsachites, who are beyond the River, be ye far from thence:";
yng[6] = "`Now, Tatnai, governor beyond the river, Shethar-Boznai, and their companions, the Apharsachites, who [are] beyond the river, be ye far from hence;";
dby[6] = "Therefore Tatnai, governor beyond the river, Shethar-boznai, and your companions the Apharsachites, who are beyond the river, be ye far from thence:";
web[6] = "Now [therefore], Tatnai governor beyond the river, Shethar-boznai, and your companions the Apharsachites, who [are] beyond the river, be ye far from thence:";
hnv[6] = "Now therefore, Tattenai, governor beyond the River, Shetar-Bozenai, and your companions the Afarsekhi, who are beyond the River, be you far from there:";
vul[6] = "nunc ergo Tatannai dux regionis quae est trans Flumen Starbuzannai et consiliarii vestri Apharsacei qui estis trans Flumen procul recedite ab illis";
kjv[7] = "Let the work of this house of God alone; let the governor of the Jews and the elders of the Jews build this house of God in his place.";
rsv[7] = "let the work on this house of God alone; let the governor of the Jews and the elders of the Jews rebuild this house of God on its site.";
asv[7] = "let the work of this house of God alone; let the governor of the Jews and the elders of the Jews build this house of God in its place.";
yng[7] = "let alone the work of this house of God, let the governor of the Jews, and the elders of the Jews, build this house of God on its place.";
dby[7] = "let the work of this house of God alone; let the governor of the Jews and the elders of the Jews build this house of God in its place.";
web[7] = "Let the work of this house of God alone; let the governor of the Jews, and the elders of the Jews, build this house of God in its place.";
hnv[7] = "let the work of this house of God alone; let the governor of the Yehudim and the Zakenim of the Yehudim build this house of God in its place.";
vul[7] = "et dimittite fieri templum Dei illud a duce Iudaeorum et a senioribus eorum domum Dei illam aedificent in loco suo";
kjv[8] = "Moreover I make a decree what ye shall do to the elders of these Jews for the building of this house of God: that of the king\'s goods, [even] of the tribute beyond the river, forthwith expenses be given unto these men, that they be not hindered.";
rsv[8] = "Moreover I make a decree regarding what you shall do for these elders of the Jews for the rebuilding of this house of God; the cost is to be paid to these men in full and without delay from the royal revenue, the tribute of the province from Beyond the River.";
asv[8] = "Moreover I make a decree what ye shall do to these elders of the Jews for the building of this house of God: that of the king\'s goods, even of the tribute beyond the River, expenses be given with all diligence unto these men, that they be not hindered.";
yng[8] = "`And by me is made a decree concerning that which ye do with the elders of these Jews to build this house of God, that of the riches of the king, that [are] of the tribute beyond the river, speedily let the outlay be given to these men, that they cease not;";
dby[8] = "Moreover, I give orders what ye shall do to these elders of the Jews, for the building of this house of God: that of the king\'s goods, of the tribute beyond the river, expenses be diligently given to these men, that they be not hindered.";
web[8] = "Moreover, I make a decree what ye shall do to the elders of these Jews for the building of this house of God: that of the king\'s goods, [even] of the tribute beyond the river, forthwith expenses be given to these men, that they be not hindered.";
hnv[8] = "Moreover I make a decree what you shall do to these Zakenim of the Yehudim for the building of this house of God: that of the king\'s goods, even of the tribute beyond the River, expenses be given with all diligence to these men, that they be not hindered.";
vul[8] = "sed et a me praeceptum est quid oporteat fieri a presbyteris Iudaeorum illis ut aedificetur domus Dei scilicet ut de arca regis id est de tributis quae dantur de regione trans Flumen studiose sumptus dentur viris illis ne inpediatur opus";
kjv[9] = "And that which they have need of, both young bullocks, and rams, and lambs, for the burnt offerings of the God of heaven, wheat, salt, wine, and oil, according to the appointment of the priests which [are] at Jerusalem, let it be given them day by day without fail:";
rsv[9] = "And whatever is needed--young bulls, rams, or sheep for burnt offerings to the God of heaven, wheat, salt, wine, or oil, as the priests at Jerusalem require--let that be given to them day by day without fail,";
asv[9] = "And that which they have need of, both young bullocks, and rams, and lambs, for burnt-offerings to the God of heaven; [also] wheat, salt, wine, and oil, according to the word of the priests that are at Jerusalem, let it be given them day by day without fail;";
yng[9] = "and what they are needing -- both young bullocks, and rams, and lambs for burnt-offerings to the God of heaven, wheat, salt, wine, and oil according to the saying of the priests who [are] in Jerusalem -- let be given to them day by day without fail,";
dby[9] = "And that which they have need of, both young bullocks and rams and lambs, for the burnt-offerings to the God of the heavens, wheat, salt, wine, and oil, according to the appointment of the priests that are at Jerusalem, let it be given them day by day without fail;";
web[9] = "And that which they have need of, both young bullocks, and rams, and lambs, for the burnt-offerings of the God of heaven, wheat, salt, wine, and oil, according to the appointment of the priests who [are] at Jerusalem, let it be given to them day by day without fail:";
hnv[9] = "That which they have need of, both young bulls, and rams, and lambs, for burnt offerings to the God of heaven; [also] wheat, salt, wine, and oil, according to the word of the Kohanim who are at Yerushalayim, let it be given them day by day without fail;";
vul[9] = "quod si necesse fuerit et vitulos et agnos et hedos in holocaustum Deo caeli frumentum sal vinum et oleum secundum ritum sacerdotum qui sunt in Hierusalem detur eis per dies singulos ne sit in aliquo querimonia";
kjv[10] = "That they may offer sacrifices of sweet savours unto the God of heaven, and pray for the life of the king, and of his sons.";
rsv[10] = "that they may offer pleasing sacrifices to the God of heaven, and pray for the life of the king and his sons.";
asv[10] = "that they may offer sacrifices of sweet savor unto the God of heaven, and pray for the life of the king, and of his sons.";
yng[10] = "that they be bringing near sweet savours to the God of heaven, and praying for the life of the king, and of his sons.";
dby[10] = "that they may present sweet odours to the God of the heavens, and pray for the life of the king and of his sons.";
web[10] = "That they may offer sacrifices of sweet savors to the God of heaven, and pray for the life of the king, and of his sons.";
hnv[10] = "that they may offer sacrifices of sweet savor to the God of heaven, and pray for the life of the king, and of his sons.";
vul[10] = "et offerant oblationes Deo caeli orentque pro vita regis et filiorum eius";
kjv[11] = "Also I have made a decree, that whosoever shall alter this word, let timber be pulled down from his house, and being set up, let him be hanged thereon; and let his house be made a dunghill for this.";
rsv[11] = "Also I make a decree that if any one alters this edict, a beam shall be pulled out of his house, and he shall be impaled upon it, and his house shall be made a dunghill.";
asv[11] = "Also I have made a decree, that whosoever shall alter this word, let a beam be pulled out from his house, and let him be lifted up and fastened thereon; and let his house be made a dunghill for this:";
yng[11] = "`And by me is made a decree, that any one who changeth this thing, let wood be pulled down from his house, and being raised up, let him be smitten on it, and his house let be made a dunghill for this.";
dby[11] = "Also I have given order that whosoever shall alter this rescript, let timber be pulled down from his house, and being set up, let him be hanged thereon, and let his house be made a dunghill for this.";
web[11] = "Also I have made a decree, that whoever shall alter this word, let timber be pulled down from his house, and being set up, let him be hanged upon it; and let his house be made a dunghill for this.";
hnv[11] = "Also I have made a decree, that whoever shall alter this word, let a beam be pulled out from his house, and let him be lifted up and fastened thereon; and let his house be made a dunghill for this:";
vul[11] = "a me ergo positum est decretum ut omnis homo qui hanc mutaverit iussionem tollatur lignum de domo ipsius et erigatur et configatur in eo domus autem eius publicetur";
kjv[12] = "And the God that hath caused his name to dwell there destroy all kings and people, that shall put to their hand to alter [and] to destroy this house of God which [is] at Jerusalem. I Darius have made a decree; let it be done with speed.";
rsv[12] = "May the God who has caused his name to dwell there overthrow any king or people that shall put forth a hand to alter this, or to destroy this house of God which is in Jerusalem. I Darius make a decree; let it be done with all diligence.&quot;";
asv[12] = "and the God that hath caused his name to dwell there overthrow all kings and peoples that shall put forth their hand to alter [the same], to destroy this house of God which is at Jerusalem. I Darius have made a decree; let it be done with all diligence.";
yng[12] = "And God, who caused His name to dwell there, doth cast down any king and people that putteth forth his hand to change, to destroy this house of God that [is] in Jerusalem; I Darius have made a decree; speedily let it be done.\'";
dby[12] = "And the God that has caused his name to dwell there overthrow every king and people that shall put forth their hand to alter [or] to destroy this house of God which is at Jerusalem. I Darius have given [this] order; let it be done diligently.";
web[12] = "And the God that hath caused his name to dwell there destroy all kings and people, that shall attempt to alter and to destroy this house of God which [is] at Jerusalem. I Darius have made a decree; let it be done with speed.";
hnv[12] = " and the God who has caused his name to dwell there overthrow all kings and peoples who shall put forth their hand to alter [the same], to destroy this house of God which is at Yerushalayim. I Daryavesh have made a decree; let it be done with all diligence.";
vul[12] = "Deus autem qui habitare fecit nomen suum ibi dissipet omnia regna et populum qui extenderit manum suam ut repugnet et dissipet domum Dei illam quae est in Hierusalem ego Darius statui decretum quod studiose impleri volo";
kjv[13] = "Then Tatnai, governor on this side the river, Shetharboznai, and their companions, according to that which Darius the king had sent, so they did speedily.";
rsv[13] = "Then, according to the word sent by Darius the king, Tat\'tenai, the governor of the province Beyond the River, She\'thar-boz\'enai, and their associates did with all diligence what Darius the king had ordered.";
asv[13] = "Then Tattenai, the governor beyond the River, Shethar-bozenai, and their companions, because that Darius the king had sent, did accordingly with all diligence.";
yng[13] = "Then Tatnai, governor beyond the river, Shethar-Boznai, and their companions, according to that which Darius the king hath sent, so they have done speedily;";
dby[13] = "Then Tatnai, governor on this side the river, Shethar-boznai, and their companions, because of that which king Darius had sent, did so diligently.";
web[13] = "Then Tatnai governor on this side the river, Shethar-boznai, and their companions, according to that which Darius the king had sent, so they did speedily.";
hnv[13] = "Then Tattenai, the governor beyond the River, Shetar-Bozenai, and their companions, because that Daryavesh the king had sent, did accordingly with all diligence.";
vul[13] = "igitur Tatannai dux regionis trans Flumen et Starbuzannai et consiliarii eius secundum quod praeceperat Darius rex sic diligenter exsecuti sunt";
kjv[14] = "And the elders of the Jews builded, and they prospered through the prophesying of Haggai the prophet and Zechariah the son of Iddo. And they builded, and finished [it], according to the commandment of the God of Israel, and according to the commandment of Cyrus, and Darius, and Artaxerxes king of Persia.";
rsv[14] = "And the elders of the Jews built and prospered, through the prophesying of Haggai the prophet and Zechari\'ah the son of Iddo. They finished their building by command of the God of Israel and by decree of Cyrus and Darius and Ar-ta-xerx\'es king of Persia;";
asv[14] = "And the elders of the Jews builded and prospered, through the prophesying of Haggai the prophet and Zechariah the son of Iddo. And they builded and finished it, according to the commandment of the God of Israel, and according to the decree of Cyrus, and Darius, and Artaxerxes king of Persia.";
yng[14] = "and the elders of the Jews are building and prospering through the prophecy of Haggai the prophet, and Zechariah son of Iddo, and they have built and finished by the decree of the God of Israel, and by the decree of Cyrus, and Darius, and Artaxerxes king of Persia.";
dby[14] = "And the elders of the Jews built; and they prospered through the prophesying of Haggai the prophet and Zechariah the son of Iddo. And they built and completed [it] according to the commandment of the God of Israel, and according to the commandment of Cyrus, and Darius, and Artaxerxes king of Persia.";
web[14] = "And the elders of the Jews built, and they prospered through the prophesying of Haggai the prophet and Zechariah the son of Iddo. And they built, and finished [it], according to the commandment of the God of Israel, and according to the commandment of Cyrus, and Darius, and Artaxerxes king of Persia.";
hnv[14] = "The Zakenim of the Yehudim built and prospered, through the prophesying of Haggai the prophet and Zekharyah the son of `Iddo. They built and finished it, according to the mitzvah of the God of Yisra\'el, and according to the decree of Koresh, and Daryavesh, and Artachshasta king of Paras.";
vul[14] = "seniores autem Iudaeorum aedificabant et prosperabantur iuxta prophetiam Aggei prophetae et Zacchariae filii Addo et aedificaverunt et construxerunt iubente Deo Israhel et iubente Cyro et Dario et Artarxerse regibus Persarum";
kjv[15] = "And this house was finished on the third day of the month Adar, which was in the sixth year of the reign of Darius the king.";
rsv[15] = "and this house was finished on the third day of the month of Adar, in the sixth year of the reign of Darius the king.";
asv[15] = "And this house was finished on the third day of the month Adar, which was in the sixth year of the reign of Darius the king.";
yng[15] = "And this house hath gone out till the third day of the month Adar, that is [in] the sixth year of the reign of Darius the king.";
dby[15] = "And this house was finished on the third day of the month Adar, which was in the sixth year of the reign of king Darius.";
web[15] = "And this house was finished on the third day of the month Adar, which was in the sixth year of the reign of Darius the king.";
hnv[15] = "This house was finished on the third day of the month Adar, which was in the sixth year of the reign of Daryavesh the king.";
vul[15] = "et conpleverunt domum Dei istam usque ad diem tertium mensis adar qui est annus sextus regni Darii regis";
kjv[16] = "And the children of Israel, the priests, and the Levites, and the rest of the children of the captivity, kept the dedication of this house of God with joy,";
rsv[16] = "And the people of Israel, the priests and the Levites, and the rest of the returned exiles, celebrated the dedication of this house of God with joy.";
asv[16] = "And the children of Israel, the priests and the Levites, and the rest of the children of the captivity, kept the dedication of this house of God with joy.";
yng[16] = "And the sons of Israel have made, [and] the priests, and the Levites, and the rest of the sons of the captivity, a dedication of this house of God with joy,";
dby[16] = "And the children of Israel, the priests and the Levites, and the rest of the children of the captivity, kept the dedication of this house of God with joy;";
web[16] = "And the children of Israel, the priests, and the Levites, and the rest of the children of the captivity, kept the dedication of this house of God with joy,";
hnv[16] = "The children of Yisra\'el, the Kohanim, and the Levites, and the rest of the children of the captivity, kept the dedication of this house of God with joy.";
vul[16] = "fecerunt autem filii Israhel sacerdotes et Levitae et reliqui filiorum transmigrationis dedicationem domus Dei in gaudio";
kjv[17] = "And offered at the dedication of this house of God an hundred bullocks, two hundred rams, four hundred lambs; and for a sin offering for all Israel, twelve he goats, according to the number of the tribes of Israel.";
rsv[17] = "They offered at the dedication of this house of God one hundred bulls, two hundred rams, four hundred lambs, and as a sin offering for all Israel twelve he-goats, according to the number of the tribes of Israel.";
asv[17] = "And they offered at the dedication of this house of God a hundred bullocks, two hundred rams, four hundred lambs; and for a sin-offering for all Israel, twelve he-goats, according to the number of the tribes of Israel.";
yng[17] = "and have brought near for the dedication of this house of God, bullocks a hundred, rams two hundred, lambs four hundred; and young he-goats for a sin-offering for all Israel, twelve, according to the number of the tribes of Israel;";
dby[17] = "and they presented at the dedication of this house of God a hundred bullocks, two hundred rams, four hundred lambs, and for a sin-offering for all Israel, twelve he-goats, according to the number of the tribes of Israel.";
web[17] = "And offered at the dedication of this house of God a hundred bullocks, two hundred rams, four hundred lambs; and for a sin-offering for all Israel, twelve he-goats, according to the number of the tribes of Israel.";
hnv[17] = "They offered at the dedication of this house of God one hundred bulls, two hundred rams, four hundred lambs; and for a sin-offering for all Yisra\'el, twelve male goats, according to the number of the tribes of Yisra\'el.";
vul[17] = "et obtulerunt in dedicationem domus Dei vitulos centum arietes ducentos agnos quadringentos hircos caprarum pro peccato totius Israhel duodecim iuxta numerum tribuum Israhel";
kjv[18] = "And they set the priests in their divisions, and the Levites in their courses, for the service of God, which [is] at Jerusalem; as it is written in the book of Moses.";
rsv[18] = "And they set the priests in their divisions and the Levites in their courses, for the service of God at Jerusalem, as it is written in the book of Moses.";
asv[18] = "And they set the priests in their divisions, and the Levites in their courses, for the service of God, which is at Jerusalem; as it is written in the book of Moses.";
yng[18] = "and they have established the priests in their divisions, and the Levites in their courses, over the service of God that [is] in Jerusalem, as it is written in the book of Moses.";
dby[18] = "And they set the priests in their classes, and the Levites in their divisions, for the service of God, which is at Jerusalem: as it is written in the book of Moses.";
web[18] = "And they set the priests in their divisions, and the Levites in their courses, for the service of God, who [is] at Jerusalem; as it is written in the book of Moses.";
hnv[18] = " They set the Kohanim in their divisions, and the Levites in their courses, for the service of God, which is at Yerushalayim; as it is written in the book of Moshe.";
vul[18] = "et statuerunt sacerdotes in ordinibus suis et Levitas in vicibus suis super opera Dei in Hierusalem sicut scriptum est in libro Mosi";
kjv[19] = "And the children of the captivity kept the passover upon the fourteenth [day] of the first month.";
rsv[19] = "On the fourteenth day of the first month the returned exiles kept the passover.";
asv[19] = "And the children of the captivity kept the passover upon the fourteenth [day] of the first month.";
yng[19] = "And the sons of the captivity make the passover on the fourteenth of the first month,";
dby[19] = "And the children of the captivity held the passover upon the fourteenth of the first month.";
web[19] = "And the children of the captivity kept the passover upon the fourteenth [day] of the first month.";
hnv[19] = "The children of the captivity kept the Pesach on the fourteenth [day] of the first month.";
vul[19] = "fecerunt autem filii transmigrationis pascha quartadecima die mensis primi";
kjv[20] = "For the priests and the Levites were purified together, all of them [were] pure, and killed the passover for all the children of the captivity, and for their brethren the priests, and for themselves.";
rsv[20] = "For the priests and the Levites had purified themselves together; all of them were clean. So they killed the passover lamb for all the returned exiles, for their fellow priests, and for themselves;";
asv[20] = "For the priests and the Levites had purified themselves together; all of them were pure: and they killed the passover for all the children of the captivity, and for their brethren the priests, and for themselves.";
yng[20] = "for the priests and the Levites have been purified together -- all of them [are] pure -- and they slaughter the passover for all the sons of the captivity, and for their brethren the priests, and for themselves.";
dby[20] = "For the priests and the Levites had purified themselves as one [man]: they were all pure; and they killed the passover for all the children of the captivity, and for their brethren the priests, and for themselves.";
web[20] = "For the priests and the Levites were purified together, all of them [were] pure, and [they] killed the passover for all the children of the captivity, and for their brethren the priests, and for themselves.";
hnv[20] = "For the Kohanim and the Levites had purified themselves together; all of them were pure: and they killed the Pesach for all the children of the captivity, and for their brothers the Kohanim, and for themselves.";
vul[20] = "purificati enim fuerant sacerdotes et Levitae quasi unus omnes mundi ad immolandum pascha universis filiis transmigrationis et fratribus suis sacerdotibus et sibi";
kjv[21] = "And the children of Israel, which were come again out of captivity, and all such as had separated themselves unto them from the filthiness of the heathen of the land, to seek the LORD God of Israel, did eat,";
rsv[21] = "it was eaten by the people of Israel who had returned from exile, and also by every one who had joined them and separated himself from the pollutions of the peoples of the land to worship the LORD, the God of Israel.";
asv[21] = "And the children of Israel that were come again out of the captivity, and all such as had separated themselves unto them from the filthiness of the nations of the land, to seek Jehovah, the God of Israel, did eat,";
yng[21] = "And the sons of Israel, those returning from the captivity, and every one who is separated from the uncleanness of the nations of the land unto them, to seek to Jehovah, God of Israel, do eat,";
dby[21] = "And the children of Israel that were come back out of captivity, and all such as had separated themselves to them from the filthiness of the nations of the land, to seek Jehovah the God of Israel, did eat;";
web[21] = "And the children of Israel, who had returned from captivity, and all such as had separated themselves to them from the filthiness of the heathen of the land, to seek the LORD God of Israel, did eat,";
hnv[21] = "The children of Yisra\'el who had come again out of the captivity, and all such as had separated themselves to them from the filthiness of the nations of the land, to seek the LORD, the God of Yisra\'el, ate,";
vul[21] = "et comederunt filii Israhel qui reversi fuerant de transmigratione et omnis qui se separaverat a coinquinatione gentium terrae ad eos ut quaererent Dominum Deum Israhel";
kjv[22] = "And kept the feast of unleavened bread seven days with joy: for the LORD had made them joyful, and turned the heart of the king of Assyria unto them, to strengthen their hands in the work of the house of God, the God of Israel.";
rsv[22] = "And they kept the feast of unleavened bread seven days with joy; for the LORD had made them joyful, and had turned the heart of the king of Assyria to them, so that he aided them in the work of the house of God, the God of Israel.";
asv[22] = "and kept the feast of unleavened bread seven days with joy: for Jehovah had made them joyful, and had turned the heart of the king of Assyria unto them, to strengthen their hands in the work of the house of God, the God of Israel.";
yng[22] = "and they make the feast of unleavened things seven days with joy, for Jehovah made them to rejoice, and turned round the heart of the king of Asshur unto them, to strengthen their hands in the work of the house of God, the God of Israel.";
dby[22] = "and they kept the feast of unleavened bread seven days with joy; for Jehovah had made them joyful, and turned the heart of the king of Assyria to them, to strengthen their hands in the work of the house of God, the God of Israel.";
web[22] = "And kept the feast of unleavened bread seven days with joy: for the LORD had made them joyful, and turned the heart of the king of Assyria to them, to strengthen their hands in the work of the house of God, the God of Israel.";
hnv[22] = "and kept the feast of matzah seven days with joy: for the LORD had made them joyful, and had turned the heart of the king of Ashshur to them, to strengthen their hands in the work of the house of God, the God of Yisra\'el.";
vul[22] = "et fecerunt sollemnitatem azymorum septem diebus in laetitia quoniam laetificaverat eos Dominus et converterat cor regis Assur ad eos ut adiuvaret manus eorum in opere domus Domini Dei Israhel";
