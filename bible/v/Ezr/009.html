csb[1] = "After these things had been done, the leaders approached me and said: &quot;The people of Israel, the priests, and the Levites have not separated themselves from the surrounding peoples whose detestable practices are like those of the Canaanites, Hethites, Perizzites, Jebusites, Ammonites, Moabites, Egyptians, and Amorites.";
csb[2] = "&quot;Indeed, the Israelite men have taken some of their daughters as wives for themselves and their sons, so that the holy seed has become mixed with the surrounding peoples. The leaders and officials have taken the lead in this unfaithfulness! &quot;";
csb[3] = "When I heard this report, I tore my tunic and robe, pulled out some of the hair from my head and beard, and sat down devastated.";
csb[4] = "Everyone who trembled at the words of the God of Israel gathered around me, because of the unfaithfulness of the exiles, while I sat devastated until the evening offering.";
csb[5] = "At the evening offering, I got up from my time of humiliation, with my tunic and robe torn. Then I fell on my knees and spread out my hands to the LORD my God.";
csb[6] = "And I said: My God, I am ashamed and embarrassed to lift my face toward you, my God, because our iniquities are higher than our heads and our guilt is as high as the heavens.";
csb[7] = "Our guilt has been terrible from the days of our fathers until the present. Because of our iniquities we have been handed over, along with our kings and priests, to the surrounding kings, and to the sword, captivity, plundering, and open shame, as it is today.";
csb[8] = "But now, for a brief moment, grace has come from the LORD our God to preserve a remnant for us and give us a stake in his holy place. Even in our slavery, God has given us a little relief and light to our eyes.";
csb[9] = "Though we are slaves, our God has not abandoned us in our slavery. He has extended grace to us in the presence of the Persian kings, giving us relief, so that we can rebuild the house of our God and repair its ruins, to give us a wall in Judah and Jerusalem.";
csb[10] = "Now, our God, what can we say in light of this? For we have abandoned the commands";
csb[11] = "you gave through your servants the prophets, saying: &quot;The land you are entering to possess is an impure land. The surrounding peoples have filled it from end to end with their uncleanness by their impurity and detestable practices.";
csb[12] = "&quot;So do not give your daughters to their sons in marriage or take their daughters for your sons. Never pursue their welfare or prosperity, so that you will be strong, eat the good things of the land, and leave it as an inheritance to your sons forever.&quot;";
csb[13] = "After all that has happened to us because of our evil deeds and terrible guilt -- though you, our God, have punished us less than our iniquities deserve and have allowed us to survive --";
csb[14] = "should we break your commands again and intermarry with the peoples who commit these detestable practices? Wouldn\'t you become so angry with us that you would destroy us, leaving neither remnant nor survivor?";
csb[15] = "LORD God of Israel, you are righteous, for we survive as a remnant today. Here we are before you with our guilt, though no one can stand in your presence because of this.";
kjv[1] = "Now when these things were done, the princes came to me, saying, The people of Israel, and the priests, and the Levites, have not separated themselves from the people of the lands, [doing] according to their abominations, [even] of the Canaanites, the Hittites, the Perizzites, the Jebusites, the Ammonites, the Moabites, the Egyptians, and the Amorites.";

asv[1] = "Now when these things were done, the princes drew near unto me, saying, The people of Israel, and the priests and the Levites, have not separated themselves from the peoples of the lands, [doing] according to their abominations, even of the Canaanites, the Hittites, the Perizzites, the Jebusites, the Ammonites, the Moabites, the Egyptians, and the Amorites.";
yng[1] = "And at the completion of these things, drawn nigh unto me have the heads, saying, `The people of Israel, and the priests, and the Levites, have not been separated from the peoples of the lands, as to their abominations, even the Canaanite, the Hittite, the Perizzite, the Jebusite, the Ammonite, the Moabite, the Egyptian, and the Amorite,";
dby[1] = "Now when these things were completed, the princes came to me, saying, The people of Israel, and the priests and the Levites, have not separated themselves from the peoples of the lands, according to their abominations, [even] of the Canaanites, the Hittites, the Perizzites, the Jebusites, the Ammonites, the Moabites, the Egyptians, and the Amorites;";
web[1] = "Now when these things were done, the princes came to me, saying, The people of Israel, and the priests, and the Levites, have not separated themselves from the people of the lands, [doing] according to their abominations, [even] of the Canaanites, the Hittites, the Perizzites, the Jebusites, the Ammonites, the Moabites, the Egyptians, and the Amorites.";

vul[1] = "postquam autem haec conpleta sunt accesserunt ad me principes dicentes non est separatus populus Israhel et sacerdotes et Levitae a populis terrarum et de abominationibus eorum Chananei videlicet et Hetthei et Ferezei et Iebusei et Ammanitarum et Moabitarum et Aegyptiorum et Amorreorum";

rsv[2] = "For they have taken some of their daughters to be wives for themselves and for their sons; so that the holy race has mixed itself with the peoples of the lands. And in this faithlessness the hand of the officials and chief men has been foremost.&quot;";

kjv[7] = "Since the days of our fathers [have] we [been] in a great trespass unto this day; and for our iniquities have we, our kings, [and] our priests, been delivered into the hand of the kings of the lands, to the sword, to captivity, and to a spoil, and to confusion of face, as [it is] this day.";
rsv[7] = "From the days of our fathers to this day we have been in great guilt; and for our iniquities we, our kings, and our priests have been given into the hand of the kings of the lands, to the sword, to captivity, to plundering, and to utter shame, as at this day.";
asv[7] = "Since the days of our fathers we have been exceeding guilty unto this day; and for our iniquities have we, our kings, and our priests, been delivered into the hand of the kings of the lands, to the sword, to captivity, and to plunder, and to confusion of face, as it is this day.";
yng[7] = "`From the days of our fathers we [are] in great guilt unto this day, and in our iniquities we have been given -- we, our kings, our priests -- into the hand of the kings of the lands, with sword, with captivity, and with spoiling, and with shame of face, as [at] this day.";
dby[7] = "Since the days of our fathers, we have been in great trespass to this day; and for our iniquities we, our kings, our priests, have been given into the hand of the kings of the lands, to the sword, and to captivity, and to spoil, and to confusion of face, as it is this day.";
web[7] = "Since the days of our fathers [have] we [been] in a great trespass to this day; and for our iniquities have we, our kings, [and] our priests, been delivered into the hand of the kings of the lands, to the sword, to captivity, and to a spoil, and to confusion of face, as [it is] this day.";
hnv[7] = "Since the days of our fathers we have been exceeding guilty to this day; and for our iniquities have we, our kings, and our Kohanim, been delivered into the hand of the kings of the lands, to the sword, to captivity, and to plunder, and to confusion of face, as it is this day.";
vul[7] = "a diebus patrum nostrorum sed et nos ipsi peccavimus granditer usque ad diem hanc et in iniquitatibus nostris traditi sumus ipsi et reges nostri et sacerdotes nostri in manum regum terrarum in gladium in captivitatem in rapinam et in confusionem vultus sicut et die hac";
kjv[8] = "And now for a little space grace hath been [shewed] from the LORD our God, to leave us a remnant to escape, and to give us a nail in his holy place, that our God may lighten our eyes, and give us a little reviving in our bondage.";
rsv[8] = "But now for a brief moment favor has been shown by the LORD our God, to leave us a remnant, and to give us a secure hold within his holy place, that our God may brighten our eyes and grant us a little reviving in our bondage.";
asv[8] = "And now for a little moment grace hath been showed from Jehovah our God, to leave us a remnant to escape, and to give us a nail in his holy place, that our God may lighten our eyes, and give us a little reviving in our bondage.";
yng[8] = "`And now, as a small moment hath grace been from Jehovah our God, to leave to us an escape, and to give to us a nail in His holy place, by our God\'s enlightening our eyes, and by giving us a little quickening in our servitude;";
dby[8] = "And now for a little space there hath been favour from Jehovah our God, to leave us a remnant to escape, and to give us a nail in his holy place, that our God may lighten our eyes, and give us a little reviving in our bondage.";
web[8] = "And now for a little space grace hath been [shown] from the LORD our God, to leave us a remnant to escape, and to give us a nail in his holy place, that our God may lighten our eyes, and give us a little reviving in our bondage.";
hnv[8] = "Now for a little moment grace has been shown from the LORD our God, to leave us a remnant to escape, and to give us a nail in his holy place, that our God may lighten our eyes, and give us a little reviving in our bondage.";
vul[8] = "et nunc quasi parum et ad momentum facta est deprecatio nostra apud Dominum Deum nostrum ut dimitterentur nobis reliquiae et daretur paxillus in loco sancto eius et inluminaret oculos nostros Deus noster et daret nobis vitam modicam in servitute nostra";
kjv[9] = "For we [were] bondmen; yet our God hath not forsaken us in our bondage, but hath extended mercy unto us in the sight of the kings of Persia, to give us a reviving, to set up the house of our God, and to repair the desolations thereof, and to give us a wall in Judah and in Jerusalem.";
rsv[9] = "For we are bondmen; yet our God has not forsaken us in our bondage, but has extended to us his steadfast love before the kings of Persia, to grant us some reviving to set up the house of our God, to repair its ruins, and to give us protection in Judea and Jerusalem.";
asv[9] = "For we are bondmen; yet our God hath not forsaken us in our bondage, but hath extended lovingkindness unto us in the sight of the kings of Persia, to give us a reviving, to set up the house of our God, and to repair the ruins thereof, and to give us a wall in Judah and in Jerusalem.";
yng[9] = "for servants we [are], and in our servitude our God hath not forsaken us, and stretcheth out unto us kindness before the kings of Persia, to give to us a quickening to lift up the house of our God, and to cause its wastes to cease, and to give to us a wall in Judah and in Jerusalem.";
dby[9] = "For we are bondmen; yet our God hath not forsaken us in our bondage, but hath extended mercy unto us before the kings of Persia, to give us a reviving, to set up the house of our God and to repair the ruins thereof, and to give us a wall in Judah and in Jerusalem.";
web[9] = "For we [were] bond-men; yet our God hath not forsaken us in our bondage, but hath extended mercy to us in the sight of the kings of Persia, to give us a reviving, to set up the house of our God, and to repair the desolations of it, and to give us a wall in Judah and in Jerusalem.";
hnv[9] = "For we are bondservants; yet our God has not forsaken us in our bondage, but has extended lovingkindness to us in the sight of the kings of Paras, to give us a reviving, to set up the house of our God, and to repair the ruins of it, and to give us a wall in Yehudah and in Yerushalayim.";
vul[9] = "quia servi sumus et in servitute nostra non dereliquit nos Deus noster et inclinavit super nos misericordiam coram rege Persarum ut daret nobis vitam et sublimaret domum Dei nostri et extrueret solitudines eius et daret nobis sepem in Iuda et in Hierusalem";

kjv[11] = "Which thou hast commanded by thy servants the prophets, saying, The land, unto which ye go to possess it, is an unclean land with the filthiness of the people of the lands, with their abominations, which have filled it from one end to another with their uncleanness.";

kjv[12] = "Now therefore give not your daughters unto their sons, neither take their daughters unto your sons, nor seek their peace or their wealth for ever: that ye may be strong, and eat the good of the land, and leave [it] for an inheritance to your children for ever.";

vul[12] = "nunc ergo filias vestras ne detis filiis eorum et filias eorum non accipiatis filiis vestris et non quaeratis pacem eorum et prosperitatem eorum usque in aeternum ut confortemini et comedatis quae bona sunt terrae et heredes habeatis filios vestros usque in saeculum";

yng[13] = "`And after all that hath come upon us for our evil works, and for our great guilt (for Thou, O our God, hast kept back of the rod from our iniquities, and hast given to us an escape like this),";

vul[13] = "et post omnia quae venerunt super nos in operibus nostris pessimis et in delicto nostro magno quia tu Deus noster liberasti nos de iniquitate nostra et dedisti nobis salutem sicut est hodie";
kjv[14] = "Should we again break thy commandments, and join in affinity with the people of these abominations? wouldest not thou be angry with us till thou hadst consumed [us], so that [there should be] no remnant nor escaping?";

yng[14] = "do we turn back to break Thy commands, and to join ourselves in marriage with the people of these abominations? art not Thou angry against us -- even to consumption -- till there is no remnant and escaped part?";
dby[14] = "should we again break thy commandments, and join in affinity with the peoples of these abominations? wouldest thou not be angry with us till thou hadst consumed us, so that there should be no remnant nor any to escape?";

hnv[14] = "shall we again break your mitzvot, and join in affinity with the peoples that do these abominations? would not you be angry with us until you had consumed us, so that there should be no remnant, nor any to escape?";
vul[14] = "ut non converteremur et irrita faceremus mandata tua neque matrimonia iungeremus cum populis abominationum istarum numquid iratus es nobis usque ad consummationem ne dimitteres nobis reliquias et salutem";
kjv[15] = "O LORD God of Israel, thou [art] righteous: for we remain yet escaped, as [it is] this day: behold, we [are] before thee in our trespasses: for we cannot stand before thee because of this.";
rsv[15] = "O LORD the God of Israel, thou art just, for we are left a remnant that has escaped, as at this day. Behold, we are before thee in our guilt, for none can stand before thee because of this.&quot;";
asv[15] = "O Jehovah, the God of Israel, thou art righteous; for we are left a remnant that is escaped, as it is this day: behold, we are before thee in our guiltiness; for none can stand before thee because of this.";
yng[15] = "`O Jehovah, God of Israel, righteous [art] Thou, for we have been left an escape, as [it is] this day; lo, we [are] before Thee in our guilt, for there is none to stand before Thee concerning this.\'";
dby[15] = "Jehovah, God of Israel, thou art righteous; for we are a remnant that is escaped, as [it is] this day. Behold, we are before thee in our trespasses; for there is no standing before thee because of this.";
web[15] = "O LORD God of Israel, thou [art] righteous: for we having escaped, remain yet, as [it is] this day: behold, we [are] before thee in our trespasses: for we cannot stand before thee because of this.";
hnv[15] = "LORD, the God of Yisra\'el, you are righteous; for we are left a remnant that is escaped, as it is this day: behold, we are before you in our guiltiness; for none can stand before you because of this.";
vul[15] = "Domine Deus Israhel iustus tu quoniam derelicti sumus qui salvaremur sicut die hac ecce coram te sumus in delicto nostro non enim stari potest coram te super hoc";
