csb[1] = "But when the prophets Haggai and Zechariah son of Iddo prophesied to the Jews who were in Judah and Jerusalem, in the name of the God of Israel who was over them,";
csb[2] = "Zerubbabel son of Shealtiel and Jeshua son of Jozadak began to rebuild God\'s house in Jerusalem. The prophets of God were with them, helping them.";
csb[3] = "At that time Tattenai the governor of the region west of the Euphrates River, Shethar-bozenai, and their colleagues came to the Jews and asked, &quot;Who gave you the order to rebuild this temple and finish this structure? &quot;";
csb[4] = "They also asked them, &quot;What are the names of the workers who are constructing this building? &quot;";
csb[5] = "But God was watching over the Jewish elders. These men wouldn\'t stop them until a report was sent to Darius, so that they could receive written instructions about this matter.";
csb[6] = "This is the text of the letter that Tattenai the governor of the region west of the Euphrates River, Shethar-bozenai, and their colleagues, the officials in the region, sent to King Darius.";
csb[7] = "They sent him a report, written as follows: To King Darius: All greetings.";
csb[8] = "Let it be known to the king that we went to the house of the great God in the province of Judah. It is being built with cut stones, and its beams are being set in the walls. This work is being done diligently and succeeding through the people\'s efforts.";
csb[9] = "So we questioned the elders and asked, &quot;Who gave you the order to rebuild this temple and finish this structure? &quot;";
csb[10] = "We also asked them for their names, so that we could write down the names of their leaders for your information.";
csb[11] = "This is the reply they gave us: We are the servants of the God of the heavens and earth, and we are rebuilding the temple that was built many years ago, which a great king of Israel built and finished.";
csb[12] = "But since our fathers angered the God of the heavens, he handed them over to King Nebuchadnezzar of Babylon, the Chaldean, who destroyed this temple and deported the people to Babylon.";
csb[13] = "However, in the first year of King Cyrus of Babylon, he issued a decree to rebuild the house of God.";
csb[14] = "He also took from the temple in Babylon the gold and silver articles of God\'s house that Nebuchadnezzar had taken from the temple in Jerusalem and carried them to the temple in Babylon. He released them from the temple in Babylon to a man named Sheshbazzar, the governor by the appointment of King Cyrus.";
csb[15] = "Cyrus told him, &quot;Take these articles, put them in the temple in Jerusalem, and let the house of God be rebuilt on its original site.&quot;";
csb[16] = "Then this same Sheshbazzar came and laid the foundation of God\'s house in Jerusalem. It has been under construction from that time until now, but it has not been completed.";
csb[17] = "So if it pleases the king, let a search of the royal archives in Babylon be conducted to see if it is true that a decree was issued by King Cyrus to rebuild the house of God in Jerusalem. Let the king\'s decision regarding this matter be sent to us.";
kjv[1] = "Then the prophets, Haggai the prophet, and Zechariah the son of Iddo, prophesied unto the Jews that [were] in Judah and Jerusalem in the name of the God of Israel, [even] unto them.";
rsv[1] = "Now the prophets, Haggai and Zechari\'ah the son of Iddo, prophesied to the Jews who were in Judah and Jerusalem, in the name of the God of Israel who was over them.";
asv[1] = "Now the prophets, Haggai the prophet, and Zechariah the son of Iddo, prophesied unto the Jews that were in Judah and Jerusalem; in the name of the God of Israel [prophesied they] unto them.";
yng[1] = "And prophesied have the prophets, (Haggai the prophet, and Zechariah son of Iddo) unto the Jews who [are] in Judah and in Jerusalem, in the name of the God of Israel -- unto them.";
dby[1] = "Now the prophets, Haggai the prophet and Zechariah the son of Iddo, prophesied to the Jews that were in Judah and Jerusalem; in the name of the God of Israel [did they prophesy] to them.";
web[1] = "Then the prophets, Haggai the prophet, and Zechariah the son of Iddo, prophesied to the Jews that [were] in Judah and Jerusalem in the name of the God of Israel, [even] to them.";
hnv[1] = "Now the prophets, Haggai the prophet, and Zekharyah the son of `Iddo, prophesied to the Yehudim who were in Yehudah and Yerushalayim; in the name of the God of Yisra\'el [prophesied they] to them.";
vul[1] = "prophetaverunt autem Aggeus propheta et Zaccharias filius Addo prophetantes ad Iudaeos qui erant in Iudaea et Hierusalem in nomine Dei Israhel";
kjv[2] = "Then rose up Zerubbabel the son of Shealtiel, and Jeshua the son of Jozadak, and began to build the house of God which [is] at Jerusalem: and with them [were] the prophets of God helping them.";
rsv[2] = "Then Zerub\'babel the son of She-al\'ti-el and Jeshua the son of Jo\'zadak arose and began to rebuild the house of God which is in Jerusalem; and with them were the prophets of God, helping them.";
asv[2] = "Then rose up Zerubbabel the son of Shealtiel, and Jeshua the son of Jozadak, and began to build the house of God which is at Jerusalem; and with them were the prophets of God, helping them.";
yng[2] = "Then have Zerubbabel son of Shealtiel, and Jeshua son of Jozadak, risen, and begun to build the house of God, that [is] in Jerusalem, and with them are the prophets of God supporting them.";
dby[2] = "Then rose up Zerubbabel the son of Shealtiel, and Jeshua the son of Jozadak, and began to build the house of God which is at Jerusalem; and with them were the prophets of God, who helped them.";
web[2] = "Then rose up Zerubbabel the son of Shealtiel, and Jeshua the son of Jozadak, and began to build the house of God which [is] at Jerusalem: and with them [were] the prophets of God helping them.";
hnv[2] = "Then rose up Zerubbavel the son of She\'alti\'el, and Yeshua the son of Yotzadak, and began to build the house of God which is at Yerushalayim; and with them were the prophets of God, helping them.";
vul[2] = "tunc surrexerunt Zorobabel filius Salathihel et Iosue filius Iosedech et coeperunt aedificare templum Dei in Hierusalem et cum eis prophetae Dei adiuvantes eos";
kjv[3] = "At the same time came to them Tatnai, governor on this side the river, and Shetharboznai, and their companions, and said thus unto them, Who hath commanded you to build this house, and to make up this wall?";
rsv[3] = "At the same time Tat\'tenai the governor of the province Beyond the River and She\'thar-boz\'enai and their associates came to them and spoke to them thus, &quot;Who gave you a decree to build this house and to finish this structure?&quot;";
asv[3] = "At the same time came to them Tattenai, the governor beyond the River, and Shethar-bozenai, and their companions, and said thus unto them, Who gave you a decree to build this house, and to finish this wall?";
yng[3] = "At that time come to them hath Tatnai, governor beyond the river, and Shethar-Boznai, and their companions, and thus they are saying to them, `Who hath made for you a decree this house to build, and this wall to finish?\'";
dby[3] = "At that time came to them Tatnai, governor on this side the river, and Shethar-boznai, and their companions, and said thus to them: Who gave you orders to build this house and to complete this wall?";
web[3] = "At the same time came to them Tatnai, governor on this side of the river, and Shethar-boznai, and their companions, and said thus to them, Who hath commanded you to build this house, and to make up this wall?";
hnv[3] = "At the same time came to them Tattenai, the governor beyond the River, and Shetar-Bozenai, and their companions, and said thus to them, Who gave you a decree to build this house, and to finish this wall?";
vul[3] = "in ipso tempore venit ad eos Tatannai qui erat dux trans Flumen et Starbuzannai et consiliarii eorum sicque dixerunt eis quis dedit vobis consilium ut domum hanc aedificaretis et muros hos instauraretis";
kjv[4] = "Then said we unto them after this manner, What are the names of the men that make this building?";
rsv[4] = "They also asked them this, &quot;What are the names of the men who are building this building?&quot;";
asv[4] = "Then we told them after this manner, what the names of the men were that were making this building.";
yng[4] = "Then thus we have said to them, `What [are] the names of the men who are building this building?\'";
dby[4] = "And they said to them after this manner: What are the names of the men that build this building?";
web[4] = "Then said we to them after this manner, What are the names of the men that make this building?";
hnv[4] = "Then we told them after this manner, what the names of the men were who were making this building.";
vul[4] = "ad quod respondimus eis quae essent nomina hominum auctorum illius aedificationis";
kjv[5] = "But the eye of their God was upon the elders of the Jews, that they could not cause them to cease, till the matter came to Darius: and then they returned answer by letter concerning this [matter].";
rsv[5] = "But the eye of their God was upon the elders of the Jews, and they did not stop them till a report should reach Darius and then answer be returned by letter concerning it.";
asv[5] = "But the eye of their God was upon the elders of the Jews, and they did not make them cease, till the matter should come to Darius, and then answer should be returned by letter concerning it.";
yng[5] = "And the eye of their God hath been upon the elders of the Jews, and they have not caused them to cease till the matter goeth to Darius, and then they send back a letter concerning this thing.";
dby[5] = "But the eye of their God was upon the elders of the Jews, and they did not make them cease till the matter came to Darius; and then they returned answer by letter concerning it.";
web[5] = "But the eye of their God was upon the elders of the Jews, that they could not cause them to cease, till the matter came to Darius: and then they returned answer by letter concerning this [matter].";
hnv[5] = "But the eye of their God was on the Zakenim of the Yehudim, and they did not make them cease, until the matter should come to Daryavesh, and then answer should be returned by letter concerning it.";
vul[5] = "oculus autem Dei eorum factus est super senes Iudaeorum et non potuerunt inhibere eos placuitque ut res ad Darium referretur et tunc satisfacerent adversus accusationem illam";
kjv[6] = "The copy of the letter that Tatnai, governor on this side the river, and Shetharboznai, and his companions the Apharsachites, which [were] on this side the river, sent unto Darius the king:";
rsv[6] = "The copy of the letter which Tat\'tenai the governor of the province Beyond the River and She\'thar-boz\'enai and his associates the governors who were in the province Beyond the River sent to Darius the king;";
asv[6] = "The copy of the letter that Tattenai, the governor beyond the River, and Shethar-bozenai, and his companions the Apharsachites, who were beyond the River, sent unto Darius the king;";
yng[6] = "The copy of a letter that Tatnai, governor beyond the river, hath sent, and Shethar-Boznai and his companions, the Apharsachites who [are] beyond the river, unto Darius the king.";
dby[6] = "The copy of the letter that Tatnai, governor on this side the river, and Shethar-boznai, and his companions the Apharsachites, who were on this side the river, sent to Darius the king.";
web[6] = "The copy of the letter that Tatnai, governor on this side of the river, and Shethar-boznai, and his companions the Apharsachites, who [were] on this side of the river, sent to Darius the king:";
hnv[6] = "The copy of the letter that Tattenai, the governor beyond the River, and Shetar-Bozenai, and his companions the Afarsekhi, who were beyond the River, sent to Daryavesh the king;";
vul[6] = "exemplar epistulae quam misit Tatannai dux regionis trans Flumen et Starbuzannai et consiliatores eius Apharsacei qui erant trans Flumen ad Darium regem";
kjv[7] = "They sent a letter unto him, wherein was written thus; Unto Darius the king, all peace.";
rsv[7] = "they sent him a report, in which was written as follows: &quot;To Darius the king, all peace.";
asv[7] = "they sent a letter unto him, wherein was written thus: Unto Darius the king, all peace.";
yng[7] = "A letter they have sent unto him, and thus is it written in it:";
dby[7] = "They sent a report to him in which was written thus: To Darius the king, all peace!";
web[7] = "They sent a letter to him, in which was written thus; To Darius the king, all peace.";
hnv[7] = "they sent a letter to him, in which was written thus: To Daryavesh the king, all shalom.";
vul[7] = "sermo quem miserant ei sic scriptus erat Dario regi pax omnis";
kjv[8] = "Be it known unto the king, that we went into the province of Judea, to the house of the great God, which is builded with great stones, and timber is laid in the walls, and this work goeth fast on, and prospereth in their hands.";
rsv[8] = "Be it known to the king that we went to the province of Judah, to the house of the great God. It is being built with huge stones, and timber is laid in the walls; this work goes on diligently and prospers in their hands.";
asv[8] = "Be it known unto the king, that we went into the province of Judah, to the house of the great God, which is builded with great stones, and timber is laid in the walls; and this work goeth on with diligence and prospereth in their hands.";
yng[8] = "`To Darius the king, all peace! be it known to the king that we have gone to the province of Judah, to the great house of God, and it is built [with] rolled stones, and wood is placed in the walls, and this work is done speedily, and prospering in their hand.";
dby[8] = "Be it known to the king that we went into the province of Judah, to the house of the great God, which is being built with great stones, and timber is laid in the walls, and this work is being carried on with diligence, and prospers in their hand.";
web[8] = "Be it known to the king, that we went into the province of Judea, to the house of the great God, which is built with great stones, and timber is laid in the walls, and this work proceedeth rapidly, and prospereth in their hands.";
hnv[8] = "Be it known to the king, that we went into the province of Yehudah, to the house of the great God, which is built with great stones, and timber is laid in the walls; and this work goes on with diligence and prospers in their hands.";
vul[8] = "notum sit regi isse nos ad Iudaeam provinciam ad domum Dei magni quae aedificatur lapide inpolito et ligna ponuntur in parietibus opusque illud diligenter extruitur et crescit in manibus eorum";
kjv[9] = "Then asked we those elders, [and] said unto them thus, Who commanded you to build this house, and to make up these walls?";
rsv[9] = "Then we asked those elders and spoke to them thus, \'Who gave you a decree to build this house and to finish this structure?\'";
asv[9] = "Then asked we those elders, and said unto them thus, Who gave you a decree to build this house, and to finish this wall?";
yng[9] = "Then we have asked of these elders, thus we have said to them, Who hath made for you a decree this house to build, and this wall to finish?";
dby[9] = "Then asked we those elders: thus we said to them, Who gave you orders to build this house and to complete this wall?";
web[9] = "Then we asked those elders, [and] said to them thus, Who commanded you to build this house, and to erect these walls?";
hnv[9] = "Then asked we those Zakenim, and said to them thus, Who gave you a decree to build this house, and to finish this wall?";
vul[9] = "interrogavimus ergo senes illos et ita diximus eis quis dedit vobis potestatem ut domum hanc aedificaretis et muros instauraretis";
kjv[10] = "We asked their names also, to certify thee, that we might write the names of the men that [were] the chief of them.";
rsv[10] = "We also asked them their names, for your information, that we might write down the names of the men at their head.";
asv[10] = "We asked them their names also, to certify thee, that we might write the names of the men that were at the head of them.";
yng[10] = "And also their names we have asked of them, to let thee know, that we might write the names of the men who [are] at their head.";
dby[10] = "We asked their names also, to inform thee, that we might write the names of the men that were the chief of them.";
web[10] = "We asked their names also, to certify thee, that we might write the names of the men that [were] the chief of them.";
hnv[10] = "We asked them their names also, to inform you that we might write the names of the men who were at the head of them.";
vul[10] = "sed et nomina eorum quaesivimus ab eis ut nuntiaremus tibi quae scripsimus nomina virorum qui sunt principes in eis";
kjv[11] = "And thus they returned us answer, saying, We are the servants of the God of heaven and earth, and build the house that was builded these many years ago, which a great king of Israel builded and set up.";
rsv[11] = "And this was their reply to us: \'We are the servants of the God of heaven and earth, and we are rebuilding the house that was built many years ago, which a great king of Israel built and finished.";
asv[11] = "And thus they returned us answer, saying, We are the servants of the God of heaven and earth, and are building the house that was builded these many years ago, which a great king of Israel builded and finished.";
yng[11] = "`And thus they have returned us word, saying, We [are] servants of the God of heaven and earth, and are building the house that was built many years before this, that a great king of Israel built and finished:";
dby[11] = "And thus they returned us answer, saying, We are the servants of the God of the heavens and the earth, and build the house that was built these many years ago; and a great king of Israel built and completed it.";
web[11] = "And thus they returned us answer, saying, We are the servants of the God of heaven and earth, and build the house that was erected these many years ago, which a great king of Israel built and set up.";
hnv[11] = "Thus they returned us answer, saying, We are the servants of the God of heaven and eretz, and are building the house that was built these many years ago, which a great king of Yisra\'el built and finished.";
vul[11] = "huiuscemodi autem sermonem responderunt nobis dicentes nos sumus servi Dei caeli et terrae et aedificamus templum quod erat extructum ante hos annos multos quodque rex Israhel magnus aedificaverat et extruxerat";
kjv[12] = "But after that our fathers had provoked the God of heaven unto wrath, he gave them into the hand of Nebuchadnezzar the king of Babylon, the Chaldean, who destroyed this house, and carried the people away into Babylon.";
rsv[12] = "But because our fathers had angered the God of heaven, he gave them into the hand of Nebuchadnez\'zar king of Babylon, the Chalde\'an, who destroyed this house and carried away the people to Babylonia.";
asv[12] = "But after that our fathers had provoked the God of heaven unto wrath, he gave them into the hand of Nebuchadnezzar king of Babylon, the Chaldean, who destroyed this house, and carried the people away into Babylon.";
yng[12] = "but after that our fathers made the God of heaven angry, he gave them into the hand of Nebuchadnezzar king of Babylon the Chaldean, and this house he destroyed, and the people he removed to Babylon;";
dby[12] = "But after that our fathers had provoked the God of the heavens to wrath, he gave them into the hand of Nebuchadnezzar king of Babylon, the Chaldean, and he destroyed this house, and carried the people away unto Babylon.";
web[12] = "But after that our fathers had provoked the God of heaven to wrath, he gave them into the hand of Nebuchadnezzar the king of Babylon, the Chaldean, who destroyed this house, and carried the people away into Babylon.";
hnv[12] = "But after that our fathers had provoked the God of heaven to wrath, he gave them into the hand of Nevukhadnetztzar king of Bavel, the Kasdai, who destroyed this house, and carried the people away into Bavel.";
vul[12] = "postquam autem ad iracundiam provocaverunt patres nostri Deum caeli et tradidit eos in manu Nabuchodonosor regis Babylonis Chaldei domum quoque hanc destruxit et populum eius transtulit in Babylonem";
kjv[13] = "But in the first year of Cyrus the king of Babylon [the same] king Cyrus made a decree to build this house of God.";
rsv[13] = "However in the first year of Cyrus king of Babylon, Cyrus the king made a decree that this house of God should be rebuilt.";
asv[13] = "But in the first year of Cyrus king of Babylon, Cyrus the king made a decree to build this house of God.";
yng[13] = "but in the first year of Cyrus king of Babylon, Cyrus the king made a decree to build this house of God,";
dby[13] = "But in the first year of Cyrus king of Babylon, king Cyrus gave orders to build this house of God.";
web[13] = "But in the first year of Cyrus the king of Babylon, [the same] king Cyrus made a decree to build this house of God.";
hnv[13] = "But in the first year of Koresh king of Bavel, Koresh the king made a decree to build this house of God.";
vul[13] = "anno autem primo Cyri regis Babylonis Cyrus rex proposuit edictum ut domus Dei aedificaretur";
kjv[14] = "And the vessels also of gold and silver of the house of God, which Nebuchadnezzar took out of the temple that [was] in Jerusalem, and brought them into the temple of Babylon, those did Cyrus the king take out of the temple of Babylon, and they were delivered unto [one], whose name [was] Sheshbazzar, whom he had made governor;";
rsv[14] = "And the gold and silver vessels of the house of God, which Nebuchadnez\'zar had taken out of the temple that was in Jerusalem and brought into the temple of Babylon, these Cyrus the king took out of the temple of Babylon, and they were delivered to one whose name was Shesh-baz\'zar, whom he had made governor;";
asv[14] = "And the gold and silver vessels also of the house of God, which Nebuchadnezzar took out of the temple that was in Jerusalem, and brought into the temple of Babylon, those did Cyrus the king take out of the temple of Babylon, and they were delivered unto one whose name was Sheshbazzar, whom he had made governor;";
yng[14] = "and also, the vessels of the house of God, of gold and silver, that Nebuchadnezzar had taken forth out of the temple that [is] in Jerusalem, and brought them to the temple of Babylon, them hath Cyrus the king brought forth out of the temple of Babylon, and they have been given to [one], Sheshbazzar [is] his name, whom he made governor,";
dby[14] = "And the vessels also of gold and silver of the house of God, which Nebuchadnezzar took out of the temple that was at Jerusalem and brought into the temple of Babylon, those did king Cyrus take out of the temple of Babylon, and they were delivered to one Sheshbazzar by name, whom he had appointed governor.";
web[14] = "And the vessels also of gold and silver of the house of God, which Nebuchadnezzar took out of the temple that [was] in Jerusalem, and brought them into the temple of Babylon, those did Cyrus the king take out of the temple of Babylon, and they were delivered to [one], whose name [was] Sheshbazzar, whom he had made governor;";
hnv[14] = "The gold and silver vessels also of the house of God, which Nevukhadnetztzar took out of the temple that was in Yerushalayim, and brought into the temple of Bavel, those did Koresh the king take out of the temple of Bavel, and they were delivered to one whose name was Sheshbatztzer, whom he had made governor;";
vul[14] = "nam et vasa templi Dei aurea et argentea quae Nabuchodonosor tulerat de templo quod erat in Hierusalem et asportaverat ea in templum Babylonis protulit Cyrus rex de templo Babylonis et data sunt Sasabassar vocabulo quem et principem constituit";
kjv[15] = "And said unto him, Take these vessels, go, carry them into the temple that [is] in Jerusalem, and let the house of God be builded in his place.";
rsv[15] = "and he said to him, &quot;Take these vessels, go and put them in the temple which is in Jerusalem, and let the house of God be rebuilt on its site.&quot;";
asv[15] = "and he said unto him, Take these vessels, go, put them in the temple that is in Jerusalem, and let the house of God be builded in its place.";
yng[15] = "and said to him, These vessels lift up, go, put them down in the temple that [is] in Jerusalem, and the house of God is builded on its place.";
dby[15] = "And he said to him, Take these vessels, go, carry them into the temple that is at Jerusalem, and let the house of God be built in its place.";
web[15] = "And said to him, Take these vessels, go, carry them into the temple that [is] in Jerusalem, and let the house of God be built in its place.";
hnv[15] = "and he said to him, Take these vessels, go, put them in the temple that is in Yerushalayim, and let the house of God be built in its place.";
vul[15] = "dixitque ei haec vasa tolle et vade et pone ea in templo quod est in Hierusalem et domus Dei aedificetur in loco suo";
kjv[16] = "Then came the same Sheshbazzar, [and] laid the foundation of the house of God which [is] in Jerusalem: and since that time even until now hath it been in building, and [yet] it is not finished.";
rsv[16] = "Then this Shesh-baz\'zar came and laid the foundations of the house of God which is in Jerusalem; and from that time until now it has been in building, and it is not yet finished.\'";
asv[16] = "Then came the same Sheshbazzar, and laid the foundations of the house of God which is in Jerusalem: and since that time even until now hath it been in building, and yet it is not completed.";
yng[16] = "Then hath this Sheshbazzar come -- he hath laid the foundations of the house of God that [is] in Jerusalem, and from thence even till now it hath been building, and is not finished.";
dby[16] = "Then came the same Sheshbazzar, [and] laid the foundation of the house of God which is at Jerusalem; and since that time even until now has it been in building, and it is not completed.";
web[16] = "Then came the same Sheshbazzar, [and] laid the foundation of the house of God which [is] in Jerusalem: and since that time even until now hath it been in building, and [yet] it is not finished.";
hnv[16] = " Then came the same Sheshbatztzer, and laid the foundations of the house of God which is in Yerushalayim: and since that time even until now has it been in building, and yet it is not completed.";
vul[16] = "tunc itaque Sasabassar ille venit et posuit fundamenta templi Dei in Hierusalem et ex eo tempore usque nunc aedificatur et necdum conpletum est";
kjv[17] = "Now therefore, if [it seem] good to the king, let there be search made in the king\'s treasure house, which [is] there at Babylon, whether it be [so], that a decree was made of Cyrus the king to build this house of God at Jerusalem, and let the king send his pleasure to us concerning this matter.";
rsv[17] = "Therefore, if it seem good to the king, let search be made in the royal archives there in Babylon, to see whether a decree was issued by Cyrus the king for the rebuilding of this house of God in Jerusalem. And let the king send us his pleasure in this matter.&quot;";
asv[17] = "Now therefore, if it seem good to the king, let there be search made in the king\'s treasure-house, which is there at Babylon, whether it be so, that a decree was made of Cyrus the king to build this house of God at Jerusalem; and let the king send his pleasure to us concerning this matter.";
yng[17] = "`And now, if to the king it be good, let search be made in the treasure-house of the king, that [is] there in Babylon, whether it be that of Cyrus the king there was made a decree to build this house of God in Jerusalem, and the will of the king concerning this thing he doth send unto us.\'";
dby[17] = "And now, if it seem good to the king, let search be made in the king\'s treasure-house, which is there at Babylon, whether it be so, that orders were given by king Cyrus to build this house of God at Jerusalem; and let the king send his pleasure to us concerning this matter.";
web[17] = "Now therefore, if it [seemeth] good to the king, let there be search made in the king\'s treasure-house, which [is] there at Babylon, whether it is [so], that a decree was made by Cyrus the king to build this house of God at Jerusalem, and let the king send his pleasure to us concerning this matter.";
hnv[17] = "Now therefore, if it seem good to the king, let there be search made in the king\'s treasure-house, which is there at Bavel, whether it be so, that a decree was made of Koresh the king to build this house of God at Yerushalayim; and let the king send his pleasure to us concerning this matter.";
vul[17] = "nunc ergo si videtur regi bonum recenseat in bibliotheca regis quae est in Babylone utrumnam a Cyro rege iussum sit ut aedificaretur domus Dei in Hierusalem et voluntatem regis super hac re mittat ad nos";
</script>
