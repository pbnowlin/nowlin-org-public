csb[1] = "In the first year of King Cyrus of Persia, in order to fulfill the word of the LORD spoken through Jeremiah, the LORD roused the spirit of King Cyrus to issue a proclamation throughout his entire kingdom and to put it in writing:";
csb[2] = "This is what King Cyrus of Persia says: &quot;The LORD, the God of the heavens, has given me all the kingdoms of the earth and has appointed me to build him a house at Jerusalem in Judah.";
csb[3] = "&quot;Any of his people among you, may his God be with him, and may he go to Jerusalem in Judah and build the house of the LORD, the God of Israel, the God who is in Jerusalem.";
csb[4] = "&quot;Let every survivor, wherever he resides, be assisted by the men of that region with silver, gold, goods, and livestock, along with a freewill offering for the house of God in Jerusalem.&quot;";
csb[5] = "So the family heads of Judah and Benjamin, along with the priests and Levites -- everyone whose spirit God had roused -- prepared to go up and rebuild the LORD\'s house in Jerusalem.";
csb[6] = "All their neighbors supported them with silver articles, gold, goods, livestock, and valuables, in addition to all that was given as a freewill offering.";
csb[7] = "King Cyrus also brought out the articles of the LORD\'s house that Nebuchadnezzar had taken from Jerusalem and had placed in the house of his gods.";
csb[8] = "King Cyrus of Persia had them brought out under the supervision of Mithredath the treasurer, who counted them out to Sheshbazzar the prince of Judah.";
csb[9] = "This was the inventory: 30 gold basins, 1,000 silver basins, 29 silver knives,";
csb[10] = "30 gold bowls, 410 various silver bowls, and 1,000 other articles.";
csb[11] = "The gold and silver articles totaled 5,400. Sheshbazzar brought all of them when the exiles went up from Babylon to Jerusalem.";
kjv[1] = "Thus saith Cyrus king of Persia, The LORD God of heaven hath given me all the kingdoms of the earth; and he hath charged me to build him an house at Jerusalem, which [is] in Judah.";
rsv[1] = "In the first year of Cyrus king of Persia, that the word of the LORD by the mouth of Jeremiah might be accomplished, the LORD stirred up the spirit of Cyrus king of Persia so that he made a proclamation throughout all his kingdom and also put it in writing:";
asv[1] = "Now in the first year of Cyrus king of Persia, that the word of Jehovah by the mouth of Jeremiah might be accomplished, Jehovah stirred up the spirit of Cyrus king of Persia, so that he made a proclamation throughout all his kingdom, and [put it] also in writing, saying,";
yng[1] = "And in the first year of Cyrus king of Persia, at the completion of the word of Jehovah from the mouth of Jeremiah, hath Jehovah waked up the spirit of Cyrus king of Persia, and he causeth an intimation to pass over into all his kingdom, and also in writing, saying,";
dby[1] = "And in the first year of Cyrus king of Persia, that the word of Jehovah by the mouth of Jeremiah might be accomplished, Jehovah stirred up the spirit of Cyrus king of Persia, and he made a proclamation throughout his kingdom, and also in writing, saying,";
web[1] = "Now in the first year of Cyrus king of Persia, that the word of the LORD by the mouth of Jeremiah might be fulfilled, the LORD stirred up the spirit of Cyrus king of Persia, that he made a proclamation throughout all his kingdom, and [put it] also in writing, saying,";
hnv[1] = "Now in the first year of Koresh king of Paras, that the word of the LORD by the mouth of Yirmeyahu might be accomplished, the LORD stirred up the spirit of Koresh king of Paras, so that he made a proclamation throughout all his kingdom, and [put it] also in writing, saying,";
vul[1] = "in anno primo Cyri regis Persarum ut conpleretur verbum Domini ex ore Hieremiae suscitavit Dominus spiritum Cyri regis Persarum et transduxit vocem in universo regno suo etiam per scripturam dicens";
kjv[2] = "Who [is there] among you of all his people? his God be with him, and let him go up to Jerusalem, which [is] in Judah, and build the house of the LORD God of Israel, (he [is] the God,) which [is] in Jerusalem.";
rsv[2] = "&quot;Thus says Cyrus king of Persia: The LORD, the God of heaven, has given me all the kingdoms of the earth, and he has charged me to build him a house at Jerusalem, which is in Judah.";
asv[2] = "Thus saith Cyrus king of Persia, All the kingdoms of the earth hath Jehovah, the God of heaven, given me; and he hath charged me to build him a house in Jerusalem, which is in Judah.";
yng[2] = "`Thus said Cyrus king of Persia, All kingdoms of the earth hath Jehovah, God of the heavens, given to me, and He hath laid a charge on me to build to Him a house in Jerusalem, that [is] in Judah;";
dby[2] = "Thus says Cyrus king of Persia: All the kingdoms of the earth has Jehovah the God of the heavens given to me, and he has charged me to build him a house at Jerusalem, which is in Judah.";
web[2] = "Thus saith Cyrus king of Persia, The LORD God of heaven hath given me all the kingdoms of the earth; and he hath charged me to build him a house at Jerusalem, which [is] in Judah.";
hnv[2] = "Thus says Koresh king of Paras, All the kingdoms of the eretz has the LORD, the God of heaven, given me; and he has charged me to build him a house in Yerushalayim, which is in Yehudah.";
vul[2] = "haec dicit Cyrus rex Persarum omnia regna terrae dedit mihi Dominus Deus caeli et ipse praecepit mihi ut aedificarem ei domum in Hierusalem quae est in Iudaea";
kjv[3] = "And whosoever remaineth in any place where he sojourneth, let the men of his place help him with silver, and with gold, and with goods, and with beasts, beside the freewill offering for the house of God that [is] in Jerusalem.";
rsv[3] = "Whoever is among you of all his people, may his God be with him, and let him go up to Jerusalem, which is in Judah, and rebuild the house of the LORD, the God of Israel--he is the God who is in Jerusalem;";
asv[3] = "Whosoever there is among you of all his people, his God be with him, and let him go up to Jerusalem, which is in Judah, and build the house of Jehovah, the God of Israel (he is God), which is in Jerusalem.";
yng[3] = "who [is] among you of all His people? His God is with him, and he doth go up to Jerusalem, that [is] in Judah, and build the house of Jehovah, God of Israel -- He [is] God -- that [is] in Jerusalem.";
dby[3] = "Whosoever there is among you of all his people, his God be with him, and let him go up to Jerusalem, which is in Judah, and build the house of Jehovah the God of Israel -- he is God -- which is at Jerusalem.";
web[3] = "Who [is there] among you of all his people? his God be with him, and let him go up to Jerusalem, which [is] in Judah, and build the house of the LORD God of Israel, (he [is] the God,) who [is] in Jerusalem.";
hnv[3] = " Whoever there is among you of all his people, his God be with him, and let him go up to Yerushalayim, which is in Yehudah, and build the house of the LORD, the God of Yisra\'el (he is God), which is in Yerushalayim.";
vul[3] = "quis est in vobis de universo populo eius sit Deus illius cum ipso ascendat Hierusalem quae est in Iudaea et aedificet domum Domini Dei Israhel ipse est Deus qui est in Hierusalem";
kjv[4] = "Then rose up the chief of the fathers of Judah and Benjamin, and the priests, and the Levites, with all [them] whose spirit God had raised, to go up to build the house of the LORD which [is] in Jerusalem.";
rsv[4] = "and let each survivor, in whatever place he sojourns, be assisted by the men of his place with silver and gold, with goods and with beasts, besides freewill offerings for the house of God which is in Jerusalem.&quot;";
asv[4] = "And whosoever is left, in any place where he sojourneth, let the men of his place help him with silver, and with gold, and with goods, and with beasts, besides the freewill-offering for the house of God which is in Jerusalem.";
yng[4] = "`And every one who is left, of any of the places where he [is] a sojourner, assist him do the men of his place with silver, and with gold, and with goods, and with beasts, along with a free-will offering for the house of God, that [is] in Jerusalem.\'";
dby[4] = "And whosoever remains in any place where he sojourns, let the men of his place help him with silver, and with gold, and with goods, and with beasts, besides the voluntary offering for the house of God which is at Jerusalem.";
web[4] = "And whoever remaineth in any place where he sojourneth, let the men of his place help him with silver, and with gold, and with goods, and with beasts, besides the free-will-offering for the house of God that [is] in Jerusalem.";
hnv[4] = "Whoever is left, in any place where he sojourns, let the men of his place help him with silver, and with gold, and with goods, and with animals, besides the freewill-offering for the house of God which is in Yerushalayim.";
vul[4] = "et omnes reliqui in cunctis locis ubicumque habitant adiuvent eum viri de loco suo argento et auro et substantia et pecoribus excepto quod voluntarie offerunt templo Dei quod est in Hierusalem";
kjv[5] = "And all they that [were] about them strengthened their hands with vessels of silver, with gold, with goods, and with beasts, and with precious things, beside all [that] was willingly offered.";
rsv[5] = "Then rose up the heads of the fathers\' houses of Judah and Benjamin, and the priests and the Levites, every one whose spirit God had stirred to go up to rebuild the house of the LORD which is in Jerusalem;";

yng[5] = "And heads of the fathers of Judah and Benjamin rise, and the priests and the Levites, even every one whose spirit God hath waked, to go up to build the house of Jehovah, that [is] in Jerusalem;";
dby[5] = "And the chief fathers of Judah and Benjamin rose up, and the priests, and the Levites, even all those whose spirit God had stirred, to go up to build the house of Jehovah which is at Jerusalem.";
web[5] = "Then arose the chief of the fathers of Judah and Benjamin, and the priests, and the Levites, with all [them] whose spirit God had raised, to go up to build the house of the LORD which [is] in Jerusalem.";
hnv[5] = "Then rose up the heads of fathers\' [houses] of Yehudah and Binyamin, and the Kohanim, and the Levites, even all whose spirit God had stirred to go up to build the house of the LORD which is in Yerushalayim.";
vul[5] = "et surrexerunt principes patrum de Iuda et Beniamin et sacerdotes et Levitae omnis cuius suscitavit Deus spiritum ut ascenderent ad aedificandum templum Domini quod erat in Hierusalem";
kjv[6] = "Also Cyrus the king brought forth the vessels of the house of the LORD, which Nebuchadnezzar had brought forth out of Jerusalem, and had put them in the house of his gods;";

asv[6] = "And all they that were round about them strengthened their hands with vessels of silver, with gold, with goods, and with beasts, and with precious things, besides all that was willingly offered.";

hnv[6] = "All those who were round about them strengthened their hands with vessels of silver, with gold, with goods, and with animals, and with precious things, besides all that was willingly offered.";

yng[7] = "And the king Cyrus hath brought out the vessels of the house of Jehovah that Nebuchadnezzar hath brought out of Jerusalem, and putteth them in the house of his gods;";
dby[7] = "And king Cyrus brought forth the vessels of the house of Jehovah, which Nebuchadnezzar had brought forth out of Jerusalem and had put in the house of his god.";
