csb[1] = "Then Job replied to the LORD:";
csb[2] = "I know that you can do anything and no plan of yours can be thwarted.";
csb[3] = "You asked, &quot;Who is this who conceals my counsel with ignorance? &quot; Surely I spoke about things I did not understand, things too wondrous for me to know.";
csb[4] = "You said, &quot;Listen now, and I will speak. When I question you, you will inform me.&quot;";
csb[5] = "I had heard reports about you, but now my eyes have seen you.";
csb[6] = "Therefore, I reject my words and am sorry for them; I am dust and ashes.";
csb[7] = "After the LORD had finished speaking to Job, he said to Eliphaz the Temanite: &quot;I am angry with you and your two friends, for you have not spoken the truth about me, as my servant Job has.";
csb[8] = "&quot;Now take seven bulls and seven rams, go to my servant Job, and offer a burnt offering for yourselves. Then my servant Job will pray for you. I will surely accept his prayer and not deal with you as your folly deserves. For you have not spoken the truth about me, as my servant Job has.&quot;";
csb[9] = "Then Eliphaz the Temanite, Bildad the Shuhite, and Zophar the Naamathite went and did as the LORD had told them, and the LORD accepted Job\'s prayer.";
csb[10] = "After Job had prayed for his friends, the LORD restored his fortunes and doubled his previous possessions.";
csb[11] = "All his brothers, sisters, and former acquaintances came to him and dined with him in his house. They sympathized with him and comforted him concerning all the adversity the LORD had brought on him. Each one gave him a piece of silver and a gold earring.";
csb[12] = "So the LORD blessed the last part of Job\'s life more than the first. He owned fourteen thousand sheep and goats, six thousand camels, one thousand yoke of oxen, and one thousand female donkeys.";
csb[13] = "He also had seven sons and three daughters.";
csb[14] = "He named his first daughter Jemimah, his second Keziah, and his third Keren-happuch.";
csb[15] = "No women as beautiful as Job\'s daughters could be found in all the land, and their father granted them an inheritance with their brothers.";
csb[16] = "Job lived 140 years after this and saw his children and their children to the fourth generation.";
csb[17] = "Then Job died, old and full of days.";

kjv[7] = "And it was [so], that after the LORD had spoken these words unto Job, the LORD said to Eliphaz the Temanite, My wrath is kindled against thee, and against thy two friends: for ye have not spoken of me [the thing that is] right, as my servant Job [hath].";

asv[7] = "And it was so, that, after Jehovah had spoken these words unto Job, Jehovah said to Eliphaz the Temanite, My wrath is kindled against thee, and against thy two friends; for ye have not spoken of me the thing that is right, as my servant Job hath.";
yng[7] = "And it cometh to pass after Jehovah\'s speaking these words unto Job, that Jehovah saith unto Eliphaz the Temanite, `Burned hath Mine anger against thee, and against thy two friends, because ye have not spoken concerning Me rightly, like My servant Job.";

hnv[7] = "It was so, that after the LORD had spoken these words to Iyov, the LORD said to Elifaz the Temanite, &quot;My wrath is kindled against you, and against your two friends; for you have not spoken of me the thing that is right, as my servant Iyov has.";
vul[7] = "postquam autem locutus est Dominus verba haec ad Iob dixit ad Eliphaz Themaniten iratus est furor meus in te et in duos amicos tuos quoniam non estis locuti coram me rectum sicut servus meus Iob";
kjv[8] = "Therefore take unto you now seven bullocks and seven rams, and go to my servant Job, and offer up for yourselves a burnt offering; and my servant Job shall pray for you: for him will I accept: lest I deal with you [after your] folly, in that ye have not spoken of me [the thing which is] right, like my servant Job.";
rsv[8] = "Now therefore take seven bulls and seven rams, and go to my servant Job, and offer up for yourselves a burnt offering; and my servant Job shall pray for you, for I will accept his prayer not to deal with you according to your folly; for you have not spoken of me what is right, as my servant Job has.&quot;";
asv[8] = "Now therefore, take unto you seven bullocks and seven rams, and go to my servant Job, and offer up for yourselves a burnt-offering; and my servant Job shall pray for you; for him will I accept, that I deal not with you after your folly; for ye have not spoken of me the thing that is right, as my servant Job hath.";
yng[8] = "And now, take to you seven bullocks and seven rams, and go ye unto My servant Job, and ye have caused a burnt-offering to ascend for you; and Job My servant doth pray for you, for surely his face I accept, so as not to do with you folly, because ye have not spoken concerning Me rightly, like My servant Job.";
dby[8] = "And now, take for yourselves seven bullocks and seven rams, and go to my servant Job, and offer up for yourselves a burnt-offering; and my servant Job shall pray for you, for him will I accept: lest I deal with you [after your] folly, for ye have not spoken of me rightly, like my servant Job.";

hnv[8] = "Now therefore, take to yourselves seven bulls and seven rams, and go to my servant Iyov, and offer up for yourselves a burnt offering; and my servant Iyov shall pray for you, for I will accept him, that I not deal with you according to your folly. For you have not spoken of me the thing that is right, as my servant Iyov has.&quot;";

kjv[11] = "Then came there unto him all his brethren, and all his sisters, and all they that had been of his acquaintance before, and did eat bread with him in his house: and they bemoaned him, and comforted him over all the evil that the LORD had brought upon him: every man also gave him a piece of money, and every one an earring of gold.";
rsv[11] = "Then came to him all his brothers and sisters and all who had known him before, and ate bread with him in his house; and they showed him sympathy and comforted him for all the evil that the LORD had brought upon him; and each of them gave him a piece of money and a ring of gold.";
asv[11] = "Then came there unto him all his brethren, and all his sisters, and all they that had been of his acquaintance before, and did eat bread with him in his house: and they bemoaned him, and comforted him concerning all the evil that Jehovah had brought upon him: every man also gave him a piece of money, and every one a ring of gold.";
yng[11] = "And come unto him do all his brethren, and all his sisters, and all his former acquaintances, and they eat bread with him in his house, and bemoan him, and comfort him concerning all the evil that Jehovah had brought upon him, and they gave to him each one kesitah, and each one ring of gold.";
dby[11] = "And all his brethren, and all his sisters, and all they that had been of his acquaintance before, came to him, and they ate bread with him in his house, and they condoled with him, and comforted him concerning all the evil that Jehovah had brought upon him; and every one gave him a piece of money, and every one a golden ring.";

hnv[11] = " Then came there to him all his brothers, and all his sisters, and all those who had been of his acquaintance before, and ate bread with him in his house. They comforted him, and consoled him concerning all the evil that the LORD had brought on him. Everyone also gave him a piece of money, and everyone a ring of gold.";
