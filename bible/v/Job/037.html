csb[1] = "My heart pounds at this and leaps from my chest.";
csb[2] = "Just listen to his thunderous voice and the rumbling that comes from his mouth.";
csb[3] = "He lets it loose beneath the entire sky; his lightning to the ends of the earth.";
csb[4] = "Then there comes a roaring sound; God thunders with his majestic voice. He does not restrain the lightning when his rumbling voice is heard.";
csb[5] = "God thunders wondrously with his voice; he does great things that we cannot comprehend.";
csb[6] = "For he says to the snow, &quot;Fall to the earth,&quot; and the torrential rains, his mighty torrential rains,";
csb[7] = "serve as his sign to all mankind, so that all men may know his work.";
csb[8] = "The wild animals enter their lairs and stay in their dens.";
csb[9] = "The windstorm comes from its chamber, and the cold from the driving north winds.";
csb[10] = "Ice is formed by the breath of God, and watery expanses are frozen.";
csb[11] = "He saturates clouds with moisture; he scatters his lightning through them.";
csb[12] = "They swirl about, turning round and round at his direction, accomplishing everything he commands them over the surface of the inhabited world.";
csb[13] = "He causes this to happen for punishment, for his land, or for his faithful love.";
csb[14] = "Listen to this, Job. Stop and consider God\'s wonders.";
csb[15] = "Do you know how God directs his clouds or makes their lightning flash?";
csb[16] = "Do you understand how the clouds float, those wonderful works of him who has perfect knowledge?";
csb[17] = "You whose clothes get hot when the south wind brings calm to the land,";
csb[18] = "can you help God spread out the skies as hard as a cast metal mirror?";
csb[19] = "Teach us what we should say to him; we cannot prepare our case because of our darkness.";
csb[20] = "Should he be told that I want to speak? Can a man speak when he is confused?";
csb[21] = "Now no one can even look at the sun when it is in the skies, after a wind has swept through and cleared the clouds away.";
csb[22] = "Yet out of the north he comes, shrouded in a golden glow; awesome majesty surrounds him.";
csb[23] = "The Almighty -- we cannot reach him -- he is exalted in power! He will not violate justice and abundant righteousness,";
csb[24] = "therefore, men fear him. He does not look favorably on any who are wise in heart.";
kjv[1] = "At this also my heart trembleth, and is moved out of his place.";
rsv[1] = "&quot;At this also my heart trembles, and leaps out of its place.";
asv[1] = "Yea, at this my heart trembleth, And is moved out of its place. ";
yng[1] = "Also, at this my heart trembleth, And it moveth from its place.";
dby[1] = "Aye, my heart trembleth at this also, and leapeth up out of its place:";
web[1] = "At this also my heart trembleth, and is moved out of its place.";
hnv[1] = "&quot;Yes, at this my heart trembles, And is moved out of its place.";
vul[1] = "super hoc expavit cor meum et emotum est de loco suo";
kjv[2] = "Hear attentively the noise of his voice, and the sound [that] goeth out of his mouth.";
rsv[2] = "Hearken to the thunder of his voice and the rumbling that comes from his mouth.";
asv[2] = "Hear, oh, hear the noise of his voice, And the sound that goeth out of his mouth. ";
yng[2] = "Hearken diligently to the trembling of His voice, Yea, the sound from His mouth goeth forth.";
dby[2] = "Hear attentively the roar of his voice, and the murmur going forth from his mouth.";
web[2] = "Hear attentively the noise of his voice, and the sound [that] goeth out of his mouth.";
hnv[2] = "Hear, oh, hear the noise of his voice, The sound that goes out of his mouth.";
vul[2] = "audite auditionem in terrore vocis eius et sonum de ore illius procedentem";
kjv[3] = "He directeth it under the whole heaven, and his lightning unto the ends of the earth.";
rsv[3] = "Under the whole heaven he lets it go, and his lightning to the corners of the earth.";
asv[3] = "He sendeth it forth under the whole heaven, And his lightning unto the ends of the earth. ";
yng[3] = "Under the whole heavens He directeth it, And its light [is] over the skirts of the earth.";
dby[3] = "He sendeth it forth under the whole heaven, and his lightning unto the ends of the earth.";
web[3] = "He directeth it under the whole heaven, and his lightning to the ends of the earth.";
hnv[3] = "He sends it forth under the whole sky, And his lightning to the ends of the eretz.";
vul[3] = "subter omnes caelos ipse considerat et lumen illius super terminos terrae";
kjv[4] = "After it a voice roareth: he thundereth with the voice of his excellency; and he will not stay them when his voice is heard.";
rsv[4] = "After it his voice roars; he thunders with his majestic voice and he does not restrain the lightnings when his voice is heard.";
asv[4] = "After it a voice roareth; He thundereth with the voice of his majesty; And he restraineth not [the lightnings] when his voice is heard. ";
yng[4] = "After it roar doth a voice -- He thundereth with the voice of His excellency, And He doth not hold them back, When His voice is heard.";
dby[4] = "After it a voice roareth: he thundereth with the voice of his excellency, and holdeth not back the flashes when his voice is heard.";
web[4] = "After it a voice roareth: he thundereth with the voice of his excellence; and he will not stay them when his voice is heard.";
hnv[4] = "After it a voice roars. He thunders with the voice of his majesty; He doesn\'t hold back anything when his voice is heard.";
vul[4] = "post eum rugiet sonitus tonabit voce magnitudinis suae et non investigabitur cum audita fuerit vox eius";
kjv[5] = "God thundereth marvellously with his voice; great things doeth he, which we cannot comprehend.";
rsv[5] = "God thunders wondrously with his voice; he does great things which we cannot comprehend.";
asv[5] = "God thundereth marvellously with his voice; Great things doeth he, which we cannot comprehend. ";
yng[5] = "God thundereth with His voice wonderfully, Doing great things and we know not.";
dby[5] = "God thundereth marvellously with his voice, doing great things which we do not comprehend.";
web[5] = "God thundereth marvelously with his voice; great things he doeth, which we cannot comprehend.";
hnv[5] = "God thunders marvelously with his voice. He does great things, which we can\'t comprehend.";
vul[5] = "tonabit Deus in voce sua mirabiliter qui facit magna et inscrutabilia";
kjv[6] = "For he saith to the snow, Be thou [on] the earth; likewise to the small rain, and to the great rain of his strength.";
rsv[6] = "For to the snow he says, \'Fall on the earth\'; and to the shower and the rain, \'Be strong.\'";
asv[6] = "For he saith to the snow, Fall thou on the earth; Likewise to the shower of rain, And to the showers of his mighty rain. ";
yng[6] = "For to snow He saith, `Be [on] the earth.\' And the small rain and great rain of His power.";
dby[6] = "For he saith to the snow, Fall on the earth! and to the pouring rain, even the pouring rains of his might.";
web[6] = "For he saith to the snow, Be thou [on] the earth; likewise to the small rain, and to the great rain of his strength.";
hnv[6] = "For he says to the snow, \'Fall on the eretz;\' Likewise to the shower of rain, And to the showers of his mighty rain.";
vul[6] = "qui praecipit nivi ut descendat in terram et hiemis pluviis et imbri fortitudinis suae";
kjv[7] = "He sealeth up the hand of every man; that all men may know his work.";
rsv[7] = "He seals up the hand of every man, that all men may know his work.";
asv[7] = "He sealeth up the hand of every man, That all men whom he hath made may know [it]. ";
yng[7] = "Into the hand of every man he sealeth, For the knowledge by all men of His work.";
dby[7] = "He sealeth up the hand of every man; that all men may know his work.";
web[7] = "He sealeth up the hand of every man; that all men may know his work.";
hnv[7] = "He seals up the hand of every man, That all men whom he has made may know it.";
vul[7] = "qui in manu omnium hominum signat ut noverint singuli opera sua";

rsv[8] = "Then the beasts go into their lairs, and remain in their dens.";
asv[8] = "Then the beasts go into coverts, And remain in their dens. ";
yng[8] = "And enter doth the beast into covert, And in its habitations it doth continue.";
dby[8] = "And the wild beast goeth into its lair, and they remain in their dens.";
web[8] = "Then the beasts go into dens, and remain in their places.";
hnv[8] = "Then the animals go into coverts, And remain in their dens.";

kjv[9] = "Out of the south cometh the whirlwind: and cold out of the north.";
rsv[9] = "From its chamber comes the whirlwind, and cold from the scattering winds.";
asv[9] = "Out of the chamber [of the south] cometh the storm, And cold out of the north. ";
yng[9] = "From the inner chamber cometh a hurricane, And from scatterings winds -- cold,";
dby[9] = "From the chamber [of the south] cometh the whirlwind; and cold from the winds of the north.";
web[9] = "From the south cometh the whirlwind: and cold from the north.";
hnv[9] = "Out of its chamber comes the storm, And cold out of the north.";

rsv[10] = "By the breath of God ice is given, and the broad waters are frozen fast.";
asv[10] = "By the breath of God ice is given; And the breadth of the waters is straitened. ";
yng[10] = "From the breath of God is frost given, And the breadth of waters is straitened,";
dby[10] = "By the breath of God ice is given; and the breadth of the waters is straitened.";
web[10] = "By the breath of God frost is given: and the breadth of the waters is straitened.";
hnv[10] = "By the breath of God, ice is given, And the breadth of the waters is frozen.";
vul[10] = "flante Deo concrescit gelu et rursum latissimae funduntur aquae";
kjv[11] = "Also by watering he wearieth the thick cloud: he scattereth his bright cloud:";
rsv[11] = "He loads the thick cloud with moisture; the clouds scatter his lightning.";
asv[11] = "Yea, he ladeth the thick cloud with moisture; He spreadeth abroad the cloud of his lightning: ";
yng[11] = "Yea, by filling He doth press out a cloud, Scatter a cloud doth His light.";
dby[11] = "Also with plentiful moisture he loadeth the thick clouds, his light dispels the cloud;";
web[11] = "Also by watering he wearieth the thick cloud: he scattereth his bright cloud:";
hnv[11] = "Yes, he loads the thick cloud with moisture. He spreads abroad the cloud of his lightning.";
vul[11] = "frumentum desiderat nubes et nubes spargunt lumen suum";
kjv[12] = "And it is turned round about by his counsels: that they may do whatsoever he commandeth them upon the face of the world in the earth.";
rsv[12] = "They turn round and round by his guidance, to accomplish all that he commands them on the face of the habitable world.";
asv[12] = "And it is turned round about by his guidance, That they may do whatsoever he commandeth them Upon the face of the habitable world, ";
yng[12] = "And it is turning itself round by His counsels, For their doing all He commandeth them, On the face of the habitable earth.";
dby[12] = "And they are turned every way by his guidance, that they may do whatsoever he commandeth them upon the face of the circuit of the earth,";

kjv[13] = "He causeth it to come, whether for correction, or for his land, or for mercy.";

asv[13] = "Whether it be for correction, or for his land, Or for lovingkindness, that he cause it to come. ";
yng[13] = "Whether for a rod, or for His land, Or for kindness -- He doth cause it to come.";
dby[13] = "Whether he cause it to come as a rod, or for his land, or in mercy.";
web[13] = "He causeth it to come, whether for correction, or for his land, or for mercy.";
hnv[13] = "Whether it is for correction, or for his land, Or for lovingkindness, that he causes it to come.";

kjv[14] = "Hearken unto this, O Job: stand still, and consider the wondrous works of God.";
rsv[14] = "&quot;Hear this, O Job; stop and consider the wondrous works of God.";
asv[14] = "Hearken unto this, O Job: Stand still, and consider the wondrous works of God. ";
yng[14] = "Hear this, O Job, Stand and consider the wonders of God.";
dby[14] = "Hearken unto this, Job; stand still and discern the wondrous works of God.";
web[14] = "Hearken to this, O Job: stand still, and consider the wondrous works of God.";
hnv[14] = "&quot;Listen to this, Iyov: Stand still, and consider the wondrous works of God.";
vul[14] = "ausculta haec Iob sta et considera miracula Dei";
kjv[15] = "Dost thou know when God disposed them, and caused the light of his cloud to shine?";
rsv[15] = "Do you know how God lays his command upon them, and causes the lightning of his cloud to shine?";
asv[15] = "Dost thou know how God layeth [his charge] upon them, And causeth the lightning of his cloud to shine? ";
yng[15] = "Dost thou know when God doth place them, And caused to shine the light of His cloud?";
dby[15] = "Dost thou know how God hath disposed them, and how he causeth the lightning of his cloud to flash?";
web[15] = "Dost thou know when God disposed them, and caused the light of his cloud to shine?";
hnv[15] = "Do you know how God controls them, And causes the lightning of his cloud to shine?";
vul[15] = "numquid scis quando praeceperit Deus pluviis ut ostenderent lucem nubium eius";
kjv[16] = "Dost thou know the balancings of the clouds, the wondrous works of him which is perfect in knowledge?";
rsv[16] = "Do you know the balancings of the clouds, the wondrous works of him who is perfect in knowledge,";
asv[16] = "Dost thou know the balancings of the clouds, The wondrous works of him who is perfect in knowledge? ";
yng[16] = "Dost thou know the balancings of a cloud? The wonders of the Perfect in knowledge?";
dby[16] = "Dost thou know about the balancings of the clouds, the wondrous works of him that is perfect in knowledge?";
web[16] = "Dost thou know the balancings of the clouds, the wondrous works of him who is perfect in knowledge?";
hnv[16] = "Do you know the workings of the clouds, The wondrous works of him who is perfect in knowledge?";
vul[16] = "numquid nosti semitas nubium magnas et perfectas scientias";

yng[17] = "How thy garments [are] warm, In the quieting of the earth from the south?";

hnv[17] = "You whose clothing is warm, When the eretz is still by reason of the south wind?";

asv[18] = "Canst thou with him spread out the sky, Which is strong as a molten mirror? ";
yng[18] = "Thou hast made an expanse with Him For the clouds -- strong as a hard mirror!";

yng[19] = "Let us know what we say to Him, We set not in array because of darkness.";
dby[19] = "Teach us what we shall say unto him! We cannot order [our words] by reason of darkness.";

rsv[23] = "The Almighty--we cannot find him; he is great in power and justice, and abundant righteousness he will not violate.";
asv[23] = " [Touching] the Almighty, we cannot find him out: He is excellent in power; And in justice and plenteous righteousness he will not afflict. ";
yng[23] = "The Mighty! we have not found Him out, High in power and judgment, He doth not answer! And abundant in righteousness,";
dby[23] = "The Almighty, we cannot find him out: excellent in power, and in judgment, and in abundance of justice, he doth not afflict.";

asv[24] = "Men do therefore fear him: He regardeth not any that are wise of heart. ";

dby[24] = "Men do therefore fear him: he respecteth not any that are wise of heart.";
