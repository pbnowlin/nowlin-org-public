csb[1] = "My spirit is broken. My days are extinguished. A graveyard awaits me.";
csb[2] = "Surely mockers surround me, and my eyes must gaze at their rebellion.";
csb[3] = "Accept my pledge! Put up security for me. Who else will be my sponsor?";
csb[4] = "You have closed their minds to understanding, therefore you will not honor them.";
csb[5] = "If a man denounces his friends for a price, the eyes of his children will fail.";
csb[6] = "He has made me an object of scorn to the people; I have become a man people spit at.";
csb[7] = "My eyes have grown dim from grief, and my whole body has become but a shadow.";
csb[8] = "The upright are appalled at this, and the innocent are roused against the godless.";
csb[9] = "Yet the righteous person will hold to his way, and the one whose hands are clean will grow stronger.";
csb[10] = "But come back and try again, all of you. I will not find a wise man among you.";
csb[11] = "My days have slipped by; my plans have been ruined, even the things dear to my heart.";
csb[12] = "They turned night into day and made light seem near in the face of darkness.";
csb[13] = "If I await Sheol as my home, spread out my bed in darkness,";
csb[14] = "and say to corruption, &quot;You are my father,&quot; and to the maggot, &quot;My mother&quot; or &quot;My sister,&quot;";
csb[15] = "where then is my hope? Who can see any hope for me?";
csb[16] = "Will it go down to the gates of Sheol, or will we descend together to the dust?";

asv[1] = "My spirit is consumed, my days are extinct, The grave is [ready] for me. ";
yng[1] = "My spirit hath been destroyed, My days extinguished -- graves [are] for me.";

hnv[1] = "&quot;My spirit is consumed, my days are extinct, And the grave is ready for me.";
vul[1] = "spiritus meus adtenuabitur dies mei breviabuntur et solum mihi superest sepulchrum";

asv[2] = "Surely there are mockers with me, And mine eye dwelleth upon their provocation. ";

hnv[2] = "Surely there are mockers with me, My eye dwells on their provocation.";
vul[2] = "non peccavi et in amaritudinibus moratur oculus meus";
kjv[3] = "Lay down now, put me in a surety with thee; who [is] he [that] will strike hands with me?";
rsv[3] = "&quot;Lay down a pledge for me with thyself; who is there that will give surety for me?";
asv[3] = "Give now a pledge, be surety for me with thyself; Who is there that will strike hands with me? ";
yng[3] = "Place, I pray Thee, my pledge with Thee; Who is he that striketh hand with me?";
dby[3] = "Lay down now [a pledge], be thou surety for me with thyself: who is he that striketh hands with me?";
web[3] = "Lay down now, put me in a surety with thee; who [is] he [that] will strike hands with me?";
hnv[3] = "&quot;Now give a pledge, be collateral for me with yourself. Who is there who will strike hands with me?";
vul[3] = "libera me et pone iuxta te et cuiusvis manus pugnet contra me";
kjv[4] = "For thou hast hid their heart from understanding: therefore shalt thou not exalt [them].";
rsv[4] = "Since thou hast closed their minds to understanding, therefore thou wilt not let them triumph.";
asv[4] = "For thou hast hid their heart from understanding: Therefore shalt thou not exalt [them]. ";
yng[4] = "For their heart Thou hast hidden From understanding, Therefore Thou dost not exalt them.";

asv[5] = "He that denounceth his friends for a prey, Even the eyes of his children shall fail. ";

asv[7] = "Mine eye also is dim by reason of sorrow, And all my members are as a shadow. ";

dby[7] = "And mine eye is dim by reason of grief, and all my members are as a shadow.";

asv[8] = "Upright men shall be astonished at this, And the innocent shall stir up himself against the godless. ";
