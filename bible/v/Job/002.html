csb[1] = "One day the sons of God came again to present themselves before the LORD, and Satan also came with them to present himself before the LORD.";
csb[2] = "The LORD asked Satan, &quot;Where have you come from? &quot; &quot;From roaming through the earth,&quot; Satan answered him, &quot;and walking around on it.&quot;";
csb[3] = "Then the LORD said to Satan, &quot;Have you considered my servant Job? No one else on earth is like him, a man of perfect integrity, who fears God and turns away from evil. He still retains his integrity, even though you incited me against him, to destroy him for no good reason.&quot;";
csb[4] = "&quot;Skin for skin! &quot; Satan answered the LORD. &quot;A man will give up everything he owns in exchange for his life.";
csb[5] = "&quot;But stretch out your hand and strike his flesh and bones, and he will surely curse you to your face.&quot;";
csb[6] = "&quot;Very well,&quot; the LORD told Satan, &quot;he is in your power; only spare his life.&quot;";
csb[7] = "So Satan left the LORD\'s presence and infected Job with terrible boils from the soles of his feet to the top of his head.";
csb[8] = "Then Job took a piece of broken pottery to scrape himself while he sat among the ashes.";
csb[9] = "His wife said to him, &quot;Are you still holding on to your integrity? Curse God and die! &quot;";
csb[10] = "&quot;You speak as a foolish woman speaks,&quot; he told her. &quot;Should we accept only good from God and not adversity? &quot; Throughout all this Job did not sin in what he said.";
csb[11] = "Now when Job\'s three friends -- Eliphaz the Temanite, Bildad the Shuhite, and Zophar the Naamathite -- heard about all this adversity that had happened to him, each of them came from his home. They met together to go and sympathize with him and comfort him.";
csb[12] = "When they looked from a distance, they could barely recognize him. They wept aloud, and each man tore his robe and threw dust into the air and on his head.";
csb[13] = "Then they sat on the ground with him seven days and nights, but no one spoke a word to him because they saw that his suffering was very intense.";
kjv[1] = "Again there was a day when the sons of God came to present themselves before the LORD, and Satan came also among them to present himself before the LORD.";

kjv[3] = "And the LORD said unto Satan, Hast thou considered my servant Job, that [there is] none like him in the earth, a perfect and an upright man, one that feareth God, and escheweth evil? and still he holdeth fast his integrity, although thou movedst me against him, to destroy him without cause.";
rsv[3] = "And the LORD said to Satan, &quot;Have you considered my servant Job, that there is none like him on the earth, a blameless and upright man, who fears God and turns away from evil? He still holds fast his integrity, although you moved me against him, to destroy him without cause.&quot;";
asv[3] = "And Jehovah said unto Satan, Hast thou considered my servant Job? for there is none like him in the earth, a perfect and an upright man, one that feareth God, and turneth away from evil: and he still holdeth fast his integrity, although thou movedst me against him, to destroy him without cause.";
yng[3] = "And Jehovah saith unto the Adversary, `Hast thou set thy heart unto My servant Job because there is none like him in the land, a man perfect and upright, fearing God and turning aside from evil? and still he is keeping hold on his integrity, and thou dost move Me against him to swallow him up for nought!\'";
dby[3] = "And Jehovah said to Satan, Hast thou considered my servant Job, that there is none like him on the earth, a perfect and an upright man, one that feareth God and abstaineth from evil? and still he remaineth firm in his integrity, though thou movedst me against him, to swallow him up without cause.";
web[3] = "And the LORD said to Satan, Hast thou considered my servant Job, that [there is] none like him on the earth, a perfect and an upright man, one that feareth God, and shunneth evil? and still he holdeth fast his integrity, although thou movedst me against him, to destroy him without cause.";
hnv[3] = "The LORD said to Hasatan, &quot;Have you considered my servant Iyov? For there is none like him in the eretz, a blameless and an upright man, one who fears God, and turns away from evil. He still maintains his integrity, although you incited me against him, to ruin him without cause.&quot;";
vul[3] = "et dixit Dominus ad Satan numquid considerasti servum meum Iob quod non sit ei similis in terra vir simplex et rectus timens Deum ac recedens a malo et adhuc retinens innocentiam tu autem commovisti me adversus eum ut adfligerem illum frustra";

kjv[11] = "Now when Job\'s three friends heard of all this evil that was come upon him, they came every one from his own place; Eliphaz the Temanite, and Bildad the Shuhite, and Zophar the Naamathite: for they had made an appointment together to come to mourn with him and to comfort him.";
rsv[11] = "Now when Job\'s three friends heard of all this evil that had come upon him, they came each from his own place, Eli\'phaz the Te\'manite, Bildad the Shuhite, and Zophar the Na\'amathite. They made an appointment together to come to condole with him and comfort him.";
asv[11] = "Now when Job\'s three friends heard of all this evil that was come upon him, they came every one from his own place: Eliphaz the Temanite, and Bildad the Shuhite, and Zophar the Naamathite; and they made an appointment together to come to bemoan him and to comfort him.";
yng[11] = "And three of the friends of Job hear of all this evil that hath come upon him, and they come in each from his place -- Eliphaz the Temanite, and Bildad the Shuhite, and Zophar the Naamathite -- and they are met together to come in to bemoan him, and to comfort him;";

web[11] = "Now when Job\'s three friends heard of all this evil that had come upon him, they came every one from his own place; Eliphaz the Temanite, and Bildad the Shuhite, and Zophar the Naamathite; for they had made an appointment together to come to mourn with him, and to comfort him.";
hnv[11] = "Now when Iyov\'s three friends heard of all this evil that had come on him, they each came from his own place: Elifaz the Temanite, Bildad the Shuchite, and Tzofar the Na`amatite, and they made an appointment together to come to sympathize with him and to comfort him.";
