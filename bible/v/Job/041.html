csb[1] = "Can you pull in Leviathan with a hook or tie his tongue down with a rope?";
csb[2] = "Can you put a cord through his nose or pierce his jaw with a hook?";
csb[3] = "Will he beg you for mercy or speak softly to you?";
csb[4] = "Will he make a covenant with you so that you can take him as a slave forever?";
csb[5] = "Can you play with him like a bird or put him on a leash for your girls?";
csb[6] = "Will traders bargain for him or divide him among the merchants?";
csb[7] = "Can you fill his hide with harpoons or his head with fishing spears?";
csb[8] = "Lay a hand on him. You will remember the battle and never repeat it!";
csb[9] = "Any hope of capturing him proves false. Does a person not collapse at the very sight of him?";
csb[10] = "No one is ferocious enough to rouse Leviathan; who then can stand against me?";
csb[11] = "Who confronted me, that I should repay him? Everything under heaven belongs to me.";
csb[12] = "I cannot be silent about his limbs, his power, and his graceful proportions.";
csb[13] = "Who can strip off his outer covering? Who can penetrate his double layer of armor?";
csb[14] = "Who can open his jaws, surrounded by those terrifying teeth?";
csb[15] = "His pride is in his rows of scales, closely sealed together.";
csb[16] = "One scale is so close to another that no air can pass between them.";
csb[17] = "They are joined to one another, so closely connected they cannot be separated.";
csb[18] = "His snorting flashes with light, while his eyes are like the rays of dawn.";
csb[19] = "Flaming torches shoot from his mouth; fiery sparks fly out!";
csb[20] = "Smoke billows from his nostrils as from a boiling pot or burning reeds.";
csb[21] = "His breath sets coals ablaze, and flames pour out of his mouth.";
csb[22] = "Strength resides in his neck, and dismay dances before him.";
csb[23] = "The folds of his flesh are joined together, solid as metal and immovable.";
csb[24] = "His heart is as hard as a rock, as hard as a lower millstone!";
csb[25] = "When Leviathan rises, the mighty are terrified; they withdraw because of his thrashing.";
csb[26] = "The sword that reaches him will have no effect, nor will a spear, dart, or arrow.";
csb[27] = "He regards iron as straw, and bronze as rotten wood.";
csb[28] = "No arrow can make him flee; slingstones become like stubble to him.";
csb[29] = "A club is regarded as stubble, and he laughs at the sound of a javelin.";
csb[30] = "His undersides are jagged potsherds, spreading the mud like a threshing sledge.";
csb[31] = "He makes the depths seethe like a cauldron; he makes the sea like an ointment jar.";
csb[32] = "He leaves a shining wake behind him; one would think the deep had gray hair!";
csb[33] = "He has no equal on earth -- a creature devoid of fear!";
csb[34] = "He surveys everything that is haughty; he is king over all the proud beasts.";
