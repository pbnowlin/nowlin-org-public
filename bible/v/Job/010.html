csb[1] = "I am disgusted with my life. I will give vent to my complaint and speak in the bitterness of my soul.";
csb[2] = "I will say to God, &quot;Do not declare me guilty! Let me know why you prosecute me.";
csb[3] = "&quot;Is it good for you to oppress, to reject the work of your hands, and favor the plans of the wicked?";
csb[4] = "&quot;Do you have eyes of flesh, or do you see as a human sees?";
csb[5] = "&quot;Are your days like those of a human, or your years like those of a man,";
csb[6] = "&quot;that you look for my iniquity and search for my sin,";
csb[7] = "&quot;even though you know that I am not wicked and that there is no one who can rescue from your power?";
csb[8] = "&quot;Your hands shaped me and formed me. Will you now turn and destroy me?";
csb[9] = "&quot;Please remember that you formed me like clay. Will you now return me to dust?";
csb[10] = "&quot;Did you not pour me out like milk and curdle me like cheese?";
csb[11] = "&quot;You clothed me with skin and flesh, and wove me together with bones and tendons.";
csb[12] = "&quot;You gave me life and faithful love, and your care has guarded my life.";
csb[13] = "&quot;Yet you concealed these thoughts in your heart; I know that this was your hidden plan:";
csb[14] = "&quot;if I sin, you would notice, and would not acquit me of my iniquity.";
csb[15] = "&quot;If I am wicked, woe to me! And even if I am righteous, I cannot lift up my head. I am filled with shame and have drunk deeply of my affliction.";
csb[16] = "&quot;If I am proud, you hunt me like a lion and again display your miraculous power against me.";
csb[17] = "&quot;You produce new witnesses against me and multiply your anger toward me. Hardships assault me, wave after wave.";
csb[18] = "&quot;Why did you bring me out of the womb? I should have died and never been seen.";
csb[19] = "&quot;I wish I had never existed but had been carried from the womb to the grave.";
csb[20] = "&quot;Are my days not few? Stop it! Leave me alone, so that I can smile a little";
csb[21] = "&quot;before I go to a land of darkness and gloom, never to return.";
csb[22] = "&quot;It is a land of blackness like the deepest darkness, gloomy and chaotic, where even the light is like the darkness.&quot;";
kjv[1] = "My soul is weary of my life; I will leave my complaint upon myself; I will speak in the bitterness of my soul.";

yng[1] = "My soul hath been weary of my life, I leave off my talking to myself, I speak in the bitterness of my soul.";
dby[1] = "My soul is weary of my life: I will give free course to my complaint; I will speak in the bitterness of my soul.";

hnv[1] = "&quot;My soul is weary of my life; I will give free course to my complaint. I will speak in the bitterness of my soul.";

rsv[2] = "I will say to God, Do not condemn me; let me know why thou dost contend against me.";

kjv[3] = "[Is it] good unto thee that thou shouldest oppress, that thou shouldest despise the work of thine hands, and shine upon the counsel of the wicked?";

hnv[3] = "Is it good to you that you should oppress, That you should despise the work of your hands, And smile on the counsel of the wicked?";
vul[3] = "numquid bonum tibi videtur si calumnieris et opprimas me opus manuum tuarum et consilium impiorum adiuves";

rsv[8] = "Thy hands fashioned and made me; and now thou dost turn about and destroy me.";
asv[8] = "Thy hands have framed me and fashioned me Together round about; yet thou dost destroy me. ";

hnv[8] = "\'Your hands have framed me and fashioned me altogether; Yet you destroy me.";

dby[10] = "Hast thou not poured me out as milk, and curdled me like cheese?";
