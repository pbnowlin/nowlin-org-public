csb[1] = "Then Elihu continued, saying:";
csb[2] = "Be patient with me a little longer, and I will inform you, for there is still more to be said on God\'s behalf.";
csb[3] = "I will get my knowledge from a distant place and ascribe justice to my Maker.";
csb[4] = "Indeed, my words are not false; one who has complete knowledge is with you.";
csb[5] = "Yes, God is mighty, but he despises no one; he understands all things.";
csb[6] = "He does not keep the wicked alive, but he gives justice to the oppressed.";
csb[7] = "He does not withdraw his gaze from the righteous, but he seats them forever with enthroned kings, and they are exalted.";
csb[8] = "If people are bound with chains and trapped by the cords of affliction,";
csb[9] = "God tells them what they have done and how arrogantly they have transgressed.";
csb[10] = "He opens their ears to correction and tells them to repent from iniquity.";
csb[11] = "If they listen and serve him, they will end their days in prosperity and their years in happiness.";
csb[12] = "But if they do not listen, they will cross the river of death and die without knowledge.";
csb[13] = "Those who have a godless heart harbor anger; even when God binds them, they do not cry for help.";
csb[14] = "They die in their youth; their life ends among male cult prostitutes.";
csb[15] = "God rescues the afflicted by their affliction; he instructs them by their torment.";
csb[16] = "Indeed, he lured you from the jaws of distress to a spacious and unconfined place. Your table was spread with choice food.";
csb[17] = "Yet now you are obsessed with the judgment due the wicked; judgment and justice have seized you.";
csb[18] = "Be careful that no one lures you with riches; do not let a large ransom lead you astray.";
csb[19] = "Can your wealth or all your physical exertion keep you from distress?";
csb[20] = "Do not long for the night when nations will disappear from their places.";
csb[21] = "Be careful that you do not turn to iniquity, for that is why you have been tested by affliction.";
csb[22] = "Look, God shows himself exalted by his power. Who is a teacher like him?";
csb[23] = "Who has appointed his way for him, and who has declared, &quot;You have done wrong&quot;?";
csb[24] = "Remember that you should praise his work, which people have sung about.";
csb[25] = "All mankind has seen it; people have looked at it from a distance.";
csb[26] = "Yes, God is exalted beyond our knowledge; the number of his years cannot be counted.";
csb[27] = "For he makes waterdrops evaporate; they distill the rain into its mist,";
csb[28] = "which the clouds pour out and shower abundantly on mankind.";
csb[29] = "Can anyone understand how the clouds spread out or how the thunder roars from God\'s pavilion?";
csb[30] = "See how he spreads his lightning around him and covers the depths of the sea.";
csb[31] = "For he judges the nations with these; he gives food in abundance.";
csb[32] = "He covers his hands with lightning and commands it to hit its mark.";
csb[33] = "The thunder declares his presence; the cattle also, the approaching storm.";
