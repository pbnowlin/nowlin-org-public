csb[1] = "Then the LORD answered Job from the whirlwind. He said:";
csb[2] = "Who is this who obscures my counsel with ignorant words?";
csb[3] = "Get ready to answer me like a man; when I question you, you will inform me.";
csb[4] = "Where were you when I established the earth? Tell me, if you have understanding.";
csb[5] = "Who fixed its dimensions? Certainly you know! Who stretched a measuring line across it?";
csb[6] = "What supports its foundations? Or who laid its cornerstone";
csb[7] = "while the morning stars sang together and all the sons of God shouted for joy?";
csb[8] = "Who enclosed the sea behind doors when it burst from the womb,";
csb[9] = "when I made the clouds its garment and total darkness its blanket,";
csb[10] = "when I determined its boundaries and put its bars and doors in place,";
csb[11] = "when I declared: &quot;You may come this far, but no farther; your proud waves stop here&quot;?";
csb[12] = "Have you ever in your life commanded the morning or assigned the dawn its place,";
csb[13] = "so it may seize the edges of the earth and shake the wicked out of it?";
csb[14] = "The earth is changed as clay is by a seal; its hills stand out like the folds of a garment.";
csb[15] = "Light is withheld from the wicked, and the arm raised in violence is broken.";
csb[16] = "Have you traveled to the sources of the sea or walked in the depths of the oceans?";
csb[17] = "Have the gates of death been revealed to you? Have you seen the gates of deep darkness?";
csb[18] = "Have you comprehended the extent of the earth? Tell me, if you know all this.";
csb[19] = "Where is the road to the home of light? Do you know where darkness lives,";
csb[20] = "so you can lead it back to its border? Are you familiar with the paths to its home?";
csb[21] = "Don\'t you know? You were already born; you have lived so long!";
csb[22] = "Have you entered the place where the snow is stored? Or have you seen the storehouses of hail,";
csb[23] = "which I hold in reserve for times of trouble, for the day of warfare and battle?";
csb[24] = "What road leads to the place where light is dispersed? Where is the source of the east wind that spreads across the earth?";
csb[25] = "Who cuts a channel for the flooding rain or clears the way for lightning,";
csb[26] = "to bring rain on an uninhabited land, on a desert with no human life,";
csb[27] = "to satisfy the parched wasteland and cause the grass to sprout?";
csb[28] = "Does the rain have a father? Who fathered the drops of dew?";
csb[29] = "Whose womb did the ice come from? Who gave birth to the frost of heaven";
csb[30] = "when water becomes as hard as stone, and the surface of the watery depths is frozen?";
csb[31] = "Can you fasten the chains of the Pleiades or loosen the belt of Orion?";
csb[32] = "Can you bring out the constellations in their season and lead the Bear and her cubs?";
csb[33] = "Do you know the laws of heaven? Can you impose its authority on earth?";
csb[34] = "Can you command the clouds so that a flood of water covers you?";
csb[35] = "Can you send out lightning bolts, and they go? Do they report to you: &quot;Here we are&quot;?";
csb[36] = "Who put wisdom in the heart or gave the mind understanding?";
csb[37] = "Who has the wisdom to number the clouds? Or who can tilt the water jars of heaven";
csb[38] = "when the dust hardens like cast metal and the clods of dirt stick together?";
csb[39] = "Can you hunt prey for a lioness or satisfy the appetite of young lions";
csb[40] = "when they crouch in their dens and lie in wait within their lairs?";
csb[41] = "Who provides the raven\'s food when its young cry out to God and wander about for lack of food?";
