csb[1] = "But now, Job, pay attention to my speech, and listen to all my words.";
csb[2] = "I am going to open my mouth; my tongue will form words on my palate.";
csb[3] = "My words come from my upright heart, and my lips speak with sincerity what they know.";
csb[4] = "The Spirit of God has made me, and the breath of the Almighty gives me life.";

csb[10] = "&quot;But he finds reasons to oppose me; he regards me as his enemy.";
csb[11] = "&quot;He puts my feet in the stocks; he stands watch over all my paths.&quot;";
csb[12] = "But I tell you that you are wrong in this matter, since God is greater than man.";

csb[14] = "For God speaks time and again, but a person may not notice it.";
csb[15] = "In a dream, a vision in the night, when deep sleep comes over people as they slumber on their beds,";

csb[17] = "in order to turn a person from his actions and suppress the pride of a person.";
csb[18] = "God spares his soul from the Pit, his life from crossing the river of death.";
csb[19] = "A person may be disciplined on his bed with pain and constant distress in his bones,";
csb[20] = "so that he detests bread, and his soul despises his favorite food.";
