csb[1] = "Why does the Almighty not reserve times for judgment? Why do those who know him never see his days?";
csb[2] = "The wicked displace boundary markers. They steal a flock and provide pasture for it.";
csb[3] = "They drive away the donkeys owned by the fatherless and take the widow\'s ox as collateral.";
csb[4] = "They push the needy off the road; the poor of the land are forced into hiding.";
csb[5] = "Like wild donkeys in the wilderness, the poor go out to their task of foraging for food; the desert provides nourishment for their children.";
csb[6] = "They gather their fodder in the field and glean the vineyards of the wicked.";
csb[7] = "Without clothing, they spend the night naked, having no covering against the cold.";
csb[8] = "Drenched by mountain rains, they huddle against the rocks, shelterless.";
csb[9] = "The fatherless infant is snatched from the breast; the nursing child of the poor is seized as collateral.";
csb[10] = "Without clothing, they wander about naked. They carry sheaves but go hungry.";
csb[11] = "They crush olives in their presses; they tread the winepresses, but go thirsty.";
csb[12] = "From the city, men groan; the mortally wounded cry for help, yet God pays no attention to this crime.";
csb[13] = "The wicked are those who rebel against the light. They do not recognize its ways or stay on its paths.";
csb[14] = "The murderer rises at dawn to kill the poor and needy, and by night he becomes a thief.";
csb[15] = "The adulterer\'s eye watches for twilight, thinking, &quot;No eye will see me,&quot; and he covers his face.";
csb[16] = "In the dark they break into houses; by day they lock themselves in, never experiencing the light.";
csb[17] = "For the morning is like darkness to them. Surely they are familiar with the terrors of darkness!";
csb[18] = "They float on the surface of the water. Their section of the land is cursed, so that they never go to their vineyards.";
csb[19] = "As dry ground and heat snatch away the melted snow, so Sheol steals those who have sinned.";
csb[20] = "The womb forgets them; worms feed on them; they are remembered no more. So injustice is broken like a tree.";
csb[21] = "They prey on the childless woman who is unable to conceive, and do not deal kindly with the widow.";
csb[22] = "Yet God drags away the mighty by his power; when he rises up, they have no assurance of life.";
csb[23] = "He gives them a sense of security, so they can rely on it, but his eyes watch over their ways.";
csb[24] = "They are exalted for a moment, then gone; they are brought low and shrivel up like everything else. They wither like heads of grain.";
csb[25] = "If this is not true, then who can prove me a liar and show that my speech is worthless?";
kjv[1] = "Why, seeing times are not hidden from the Almighty, do they that know him not see his days?";
rsv[1] = "&quot;Why are not times of judgment kept by the Almighty, and why do those who know him never see his days?";
asv[1] = "Why are times not laid up by the Almighty? And why do not they that know him see his days? ";
yng[1] = "Wherefore from the Mighty One Times have not been hidden, And those knowing Him have not seen His days.";
dby[1] = "Why are not times treasured up with the Almighty? why do not they that know him see his days?";
web[1] = "Why, seeing times [are] not hid from the Almighty, do they that know him not see his days?";
hnv[1] = "&quot;Why aren\'t times laid up by Shaddai? Why don\'t those who know him see his days?";
vul[1] = "ab Omnipotente non sunt abscondita tempora qui autem noverunt eum ignorant dies illius";

yng[13] = "They have been among rebellious ones of light, They have not discerned His ways, Nor abode in His paths.";
