csb[1] = "Do you know when mountain goats give birth? Have you watched the deer in labor?";
csb[2] = "Can you count the months they are pregnant so you can know the time they give birth?";
csb[3] = "They crouch down to give birth to their young; they deliver their newborn.";
csb[4] = "Their offspring are healthy and grow up in the open field. They leave and do not return.";
csb[5] = "Who set the wild donkey free? Who released the swift donkey from its harness?";
csb[6] = "I made the desert its home, and the salty wasteland its dwelling.";
csb[7] = "It scoffs at the noise of the village and never hears the shouts of a driver.";
csb[8] = "It roams the mountains for its pastureland, searching for anything green.";
csb[9] = "Would the wild ox be willing to serve you? Would it spend the night by your feeding trough?";
csb[10] = "Can you hold the wild ox to a furrow by its harness? Will it plow the valleys behind you?";
csb[11] = "Can you depend on it because its strength is great? Would you leave it to do your hard work?";
csb[12] = "Can you trust the wild ox to harvest your grain and bring it to your threshing floor?";
csb[13] = "The wings of the ostrich flap joyfully, but are her feathers and plumage like the stork\'s?";
csb[14] = "She abandons her eggs on the ground and lets them be warmed in the sand.";
csb[15] = "She forgets that a foot may crush them or that some wild animal may trample them.";
csb[16] = "She treats her young harshly, as if they were not her own, with no fear that her labor may have been in vain.";
csb[17] = "For God has deprived her of wisdom; he has not endowed her with understanding.";
csb[18] = "When she proudly spreads her wings, she laughs at the horse and its rider.";
csb[19] = "Do you give strength to the horse? Do you adorn his neck with a mane?";
csb[20] = "Do you make him leap like a locust? His proud snorting fills one with terror.";
csb[21] = "He paws in the valley and rejoices in his strength; he charges into battle.";
csb[22] = "He laughs at fear, since he is afraid of nothing; he does not run from the sword.";
csb[23] = "A quiver rattles at his side, along with a flashing spear and a javelin.";
csb[24] = "He charges ahead with trembling rage; he cannot stand still at the trumpet\'s sound.";
csb[25] = "When the trumpet blasts, he snorts defiantly. He smells the battle from a distance; he hears the officers\' shouts and the battle cry.";
csb[26] = "Does the hawk take flight by your understanding and spread its wings to the south?";
csb[27] = "Does the eagle soar at your command and make its nest on high?";
csb[28] = "It lives on a cliff where it spends the night; its stronghold is on a rocky crag.";
csb[29] = "From there it searches for prey; its eyes penetrate the distance.";
csb[30] = "Its brood gulps down blood, and where the slain are, it is there.";
