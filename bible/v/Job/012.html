csb[1] = "Then Job answered:";
csb[2] = "No doubt you are the people, and wisdom will die with you!";
csb[3] = "But I also have a mind like you; I am not inferior to you. Who doesn\'t know the things you are talking about?";
csb[4] = "I am a laughingstock to my friends, by calling on God, who answers me. The righteous and upright man is a laughingstock.";
csb[5] = "The one who is at ease holds calamity in contempt and thinks it is prepared for those whose feet are slipping.";
csb[6] = "The tents of robbers are safe, and those who trouble God are secure; God holds them in his hands.";
csb[7] = "But ask the animals, and they will instruct you; ask the birds of the sky, and they will tell you.";
csb[8] = "Or speak to the earth, and it will instruct you; let the fish of the sea inform you.";
csb[9] = "Which of all these does not know that the hand of the LORD has done this?";
csb[10] = "The life of every living thing is in his hand, as well as the breath of all mankind.";
csb[11] = "Doesn\'t the ear test words as the palate tastes food?";
csb[12] = "Wisdom is found with the elderly, and understanding comes with long life.";
csb[13] = "Wisdom and strength belong to God; counsel and understanding are his.";
csb[14] = "Whatever he tears down cannot be rebuilt; whoever he imprisons cannot be released.";
csb[15] = "When he withholds water, everything dries up, and when he releases it, it destroys the land.";
csb[16] = "True wisdom and power belong to him. The deceived and the deceiver are his.";
csb[17] = "He leads counselors away barefoot and makes judges go mad.";
csb[18] = "He releases the bonds put on by kings and fastens a belt around their waists.";
csb[19] = "He leads priests away barefoot and overthrows established leaders.";
csb[20] = "He deprives trusted advisers of speech and takes away the elders\' good judgment.";
csb[21] = "He pours out contempt on nobles and disarms the strong.";
csb[22] = "He reveals mysteries from the darkness and brings the deepest darkness into the light.";
csb[23] = "He makes nations great, then destroys them; he enlarges nations, then leads them away.";
csb[24] = "He deprives the world\'s leaders of reason, and makes them wander in a trackless wasteland.";
csb[25] = "They grope around in darkness without light; he makes them stagger like a drunkard.";

dby[3] = "I also have understanding as well as you; I am not inferior to you; and who knoweth not such things as these?";
web[3] = "But I have understanding as well as you; I [am] not inferior to you: yes, who knoweth not such things as these?";

kjv[4] = "I am [as] one mocked of his neighbour, who calleth upon God, and he answereth him: the just upright [man is] laughed to scorn.";

yng[4] = "A laughter to his friend I am: `He calleth to God, and He answereth him,\' A laughter [is] the perfect righteous one.";
dby[4] = "I am to be one that is a derision to his friend, I who call upon God, and whom he will answer: a derision is the just upright [man].";

hnv[4] = "I am like one who is a joke to his neighbor, I, who called on God, and he answered. The just, the blameless man is a joke.";

kjv[5] = "He that is ready to slip with [his] feet [is as] a lamp despised in the thought of him that is at ease.";
rsv[5] = "In the thought of one who is at ease there is contempt for misfortune; it is ready for those whose feet slip.";

yng[5] = "A torch -- despised in the thoughts of the secure Is prepared for those sliding with the feet.";
dby[5] = "He that is ready to stumble with the foot is a lamp despised in the thought of him that is at ease.";

hnv[5] = "In the thought of him who is at ease there is contempt for misfortune, It is ready for them whose foot slips.";
vul[5] = "lampas contempta apud cogitationes divitum parata ad tempus statutum";
