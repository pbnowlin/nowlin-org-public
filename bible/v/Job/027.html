csb[1] = "Job continued his discourse, saying:";
csb[2] = "As God lives, who has deprived me of justice, and the Almighty who has made me bitter,";
csb[3] = "as long as my breath is still in me and the breath from God remains in my nostrils,";
csb[4] = "my lips will not speak unjustly, and my tongue will not utter deceit.";
csb[5] = "I will never affirm that you are right. I will maintain my integrity until I die.";
csb[6] = "I will cling to my righteousness and never let it go. My conscience will not accuse me as long as I live!";
csb[7] = "May my enemy be like the wicked and my opponent like the unjust.";
csb[8] = "For what hope does the godless person have when he is cut off, when God takes away his life?";
csb[9] = "Will God hear his cry when distress comes on him?";
csb[10] = "Will he delight in the Almighty? Will he call on God at all times?";
csb[11] = "I will teach you about God\'s power. I will not conceal what the Almighty has planned.";
csb[12] = "All of you have seen this for yourselves, why do you keep up this empty talk?";
csb[13] = "This is a wicked man\'s lot from God, the inheritance the ruthless receive from the Almighty.";
csb[14] = "Even if his children increase, they are destined for the sword; his descendants will never have enough food.";
csb[15] = "Those who survive him will be buried by the plague, yet their widows will not weep for them.";
csb[16] = "Though he piles up silver like dust and heaps up fine clothing like clay --";
csb[17] = "he may heap it up, but the righteous will wear it, and the innocent will divide up his silver.";
csb[18] = "The house he built is like a moth\'s cocoon or a shelter set up by a watchman.";
csb[19] = "He lies down wealthy, but will do so no more; when he opens his eyes, it is gone.";
csb[20] = "Terrors overtake him like a flood; a storm wind sweeps him away at night.";
csb[21] = "An east wind picks him up, and he is gone; it carries him away from his place.";
csb[22] = "It blasts at him without mercy, while he flees desperately from its force.";
csb[23] = "It claps its hands at him and scoffs at him from its place.";
