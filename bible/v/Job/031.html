csb[1] = "I have made a covenant with my eyes. How then could I look at a young woman?";
csb[2] = "For what portion would I have from God above, or what inheritance from the Almighty on high?";
csb[3] = "Doesn\'t disaster come to the unjust and misfortune to evildoers?";
csb[4] = "Does he not see my ways and number all my steps?";
csb[5] = "If I have walked in falsehood or my foot has rushed to deceit,";
csb[6] = "let God weigh me on accurate scales, and he will recognize my integrity.";
csb[7] = "If my step has turned from the way, my heart has followed my eyes, or impurity has stained my hands,";
csb[8] = "let someone else eat what I have sown, and let my crops be uprooted.";
csb[9] = "If my heart has gone astray over a woman or I have lurked at my neighbor\'s door,";
csb[10] = "let my own wife grind grain for another man, and let other men sleep with her.";
csb[11] = "For that would be a disgrace; it would be an iniquity deserving punishment.";
csb[12] = "For it is a fire that consumes down to Abaddon; it would destroy my entire harvest.";
csb[13] = "If I have dismissed the case of my male or female servants when they made a complaint against me,";
csb[14] = "what could I do when God stands up to judge? How should I answer him when he calls me to account?";
csb[15] = "Did not the one who made me in the womb also make them? Did not the same God form us both in the womb?";
csb[16] = "If I have refused the wishes of the poor or let the widow\'s eyes go blind,";
csb[17] = "if I have eaten my few crumbs alone without letting the fatherless eat any of it --";
csb[18] = "for from my youth, I raised him as his father, and since the day I was born I guided the widow --";
csb[19] = "if I have seen anyone dying for lack of clothing or a needy person without a cloak,";
csb[20] = "if he did not bless me while warming himself with the fleece from my sheep,";
csb[21] = "if I ever cast my vote against a fatherless child when I saw that I had support in the city gate,";
csb[22] = "then let my shoulder blade fall from my back, and my arm be pulled from its socket.";
csb[23] = "For disaster from God terrifies me, and because of his majesty I could not do these things.";
csb[24] = "If I placed my confidence in gold or called fine gold my trust,";
csb[25] = "if I have rejoiced because my wealth is great or because my own hand has acquired so much,";
csb[26] = "if I have gazed at the sun when it was shining or at the moon moving in splendor,";
csb[27] = "so that my heart was secretly enticed and I threw them a kiss,";
csb[28] = "this would also be an iniquity deserving punishment, for I would have denied God above.";
csb[29] = "Have I rejoiced over my enemy\'s distress, or become excited when trouble came his way?";
csb[30] = "I have not allowed my mouth to sin by asking for his life with a curse.";
csb[31] = "Haven\'t the members of my household said, &quot;Who is there who has not had enough to eat at Job\'s table? &quot;";
csb[32] = "No stranger had to spend the night on the street, for I opened my door to the traveler.";
csb[33] = "Have I covered my transgressions as others do by hiding my iniquity in my heart";
csb[34] = "because I greatly feared the crowds and because the contempt of the clans terrified me, so I grew silent and would not go outside?";
csb[35] = "If only I had someone to hear my case! Here is my signature; let the Almighty answer me. Let my Opponent compose his indictment.";
csb[36] = "I would surely carry it on my shoulder and wear it like a crown.";
csb[37] = "I would give him an account of all my steps; I would approach him like a prince.";
csb[38] = "If my land cries out against me and its furrows join in weeping,";
csb[39] = "if I have consumed its produce without payment or shown contempt for its tenants,";
csb[40] = "then let thorns grow instead of wheat and stinkweed instead of barley. The words of Job are concluded.";
