csb[1] = "After this, Job began to speak and cursed the day he was born.";
csb[2] = "He said:";
csb[3] = "May the day I was born perish, and the night that said, &quot;A boy is conceived.&quot;";
csb[4] = "If only that day had turned to darkness! May God above not care about it, or light shine on it.";
csb[5] = "May darkness and gloom reclaim it, and a cloud settle over it. May what darkens the day terrify it.";
csb[6] = "If only darkness had taken that night away! May it not appear among the days of the year or be listed in the calendar.";
csb[7] = "Yes, may that night be barren; may no joyful shout be heard in it.";
csb[8] = "Let those who curse days condemn it, those who are ready to rouse Leviathan.";
csb[9] = "May its morning stars grow dark. May it wait for daylight but have none; may it not see the breaking of dawn.";
csb[10] = "For that night did not shut the doors of my mother\'s womb, and hide sorrow from my eyes.";
csb[11] = "Why was I not stillborn; why didn\'t I die as I came from the womb?";
csb[12] = "Why did the knees receive me, and why were there breasts for me to nurse?";
csb[13] = "Now I would certainly be lying down in peace; I would be asleep. Then I would be at rest";
csb[14] = "with the kings and counselors of the earth, who rebuilt ruined cities for themselves,";
csb[15] = "or with princes who had gold, who filled their houses with silver.";
csb[16] = "Or why was I not hidden like a miscarried child, like infants who never see daylight?";
csb[17] = "There the wicked cease to make trouble, and there the weary find rest.";
csb[18] = "The captives are completely at rest; they do not hear a taskmaster\'s voice.";
csb[19] = "Both small and great are there, and the slave is set free from his master.";
csb[20] = "Why is light given to one burdened with grief, and life to those whose existence is bitter,";
csb[21] = "who wait for death, but it does not come, and search for it more than for hidden treasure,";
csb[22] = "who are filled with much joy and are glad when they reach the grave?";
csb[23] = "Why is life given to a man whose path is hidden, whom God has hedged in?";
csb[24] = "I sigh when food is put before me, and my groans pour out like water.";
csb[25] = "For the thing I feared has overtaken me, and what I dreaded has happened to me.";
csb[26] = "I cannot relax or be calm; I have no rest, for turmoil has come.";
