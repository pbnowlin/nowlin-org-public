csb[1] = "Then Job answered:";
csb[2] = "Yes, I know what you\'ve said is true, but how can a person be justified before God?";
csb[3] = "If one wanted to take him to court, he could not answer God once in a thousand times.";
csb[4] = "God is wise and all-powerful. Who has opposed him and come out unharmed?";
csb[5] = "He removes mountains without their knowledge, overturning them in his anger.";
csb[6] = "He shakes the earth from its place so that its pillars tremble.";
csb[7] = "He commands the sun not to shine and seals off the stars.";
csb[8] = "He alone stretches out the heavens and treads on the waves of the sea.";
csb[9] = "He makes the stars: the Bear, Orion, the Pleiades, and the constellations of the southern sky.";
csb[10] = "He does great and unsearchable things, wonders without number.";
csb[11] = "If he passed by me, I wouldn\'t see him; if he went by, I wouldn\'t recognize him.";
csb[12] = "If he snatches something, who can stop him? Who can ask him, &quot;What are you doing? &quot;";
csb[13] = "God does not hold back his anger; Rahab\'s assistants cringe in fear beneath him!";
csb[14] = "How then can I answer him or choose my arguments against him?";
csb[15] = "Even if I were in the right, I could not answer. I could only beg my Judge for mercy.";
csb[16] = "If I summoned him and he answered me, I do not believe he would pay attention to what I said.";
csb[17] = "He batters me with a whirlwind and multiplies my wounds without cause.";
csb[18] = "He doesn\'t let me catch my breath but fills me with bitter experiences.";
csb[19] = "If it is a matter of strength, look, he is the powerful one! If it is a matter of justice, who can summon him?";
csb[20] = "Even if I were in the right, my own mouth would condemn me; if I were blameless, my mouth would declare me guilty.";
csb[21] = "Though I am blameless, I no longer care about myself; I renounce my life.";
csb[22] = "It is all the same. Therefore I say, &quot;He destroys both the blameless and the wicked.&quot;";
csb[23] = "When catastrophe brings sudden death, he mocks the despair of the innocent.";
csb[24] = "The earth is handed over to the wicked; he blindfolds its judges. If it isn\'t he, then who is it?";
csb[25] = "My days fly by faster than a runner; they flee without seeing any good.";
csb[26] = "They sweep by like boats made of papyrus, like an eagle swooping down on its prey.";
csb[27] = "If I said, &quot;I will forget my complaint, change my expression, and smile,&quot;";
csb[28] = "I would still live in terror of all my pains. I know you will not acquit me.";
csb[29] = "Since I will be found guilty, why should I struggle in vain?";
csb[30] = "If I wash myself with snow, and cleanse my hands with lye,";
csb[31] = "then you dip me in a pit of mud, and my own clothes despise me!";
csb[32] = "For he is not a man like me, that I can answer him, that we can take each other to court.";
csb[33] = "There is no mediator between us, to lay his hand on both of us.";
csb[34] = "Let him take his rod away from me so his terror will no longer frighten me.";
csb[35] = "Then I would speak and not fear him. But that is not the case; I am on my own.";

web[29] = "[If] I am wicked, why then do I labor in vain?";
hnv[29] = "I shall be condemned; Why then do I labor in vain?";
vul[29] = "si autem et sic impius sum quare frustra laboravi";

rsv[30] = "If I wash myself with snow, and cleanse my hands with lye,";
asv[30] = "If I wash myself with snow water, And make my hands never so clean; ";
yng[30] = "If I have washed myself with snow-water, And purified with soap my hands,";

hnv[30] = "If I wash myself with snow, And cleanse my hands with lye,";

dby[31] = "Then wouldest thou plunge me in the ditch, and mine own clothes would abhor me.";

rsv[32] = "For he is not a man, as I am, that I might answer him, that we should come to trial together.";
asv[32] = "For he is not a man, as I am, that I should answer him, That we should come together in judgment. ";
yng[32] = "But if a man like myself -- I answer him, We come together into judgment.";
dby[32] = "For he is not a man, as I am, that I should answer him; that we should come together in judgment.";

hnv[32] = "For he is not a man, as I am, that I should answer him, That we should come together in judgment.";

kjv[33] = "Neither is there any daysman betwixt us, [that] might lay his hand upon us both.";

asv[33] = "There is no umpire betwixt us, That might lay his hand upon us both. ";

dby[33] = "There is not an umpire between us, who should lay his hand upon us both.";
web[33] = "Neither is there any judge between us, [that] might lay his hand upon us both.";
hnv[33] = "There is no umpire between us, That might lay his hand on us both.";
vul[33] = "non est qui utrumque valeat arguere et ponere manum suam in ambobus";

web[34] = "Let him take away his rod from me, and let not his fear terrify me:";
hnv[34] = "Let him take his rod away from me, Let his terror not make me afraid:";

web[35] = "[Then] would I speak, and not fear him; but [it is] not so with me.";
