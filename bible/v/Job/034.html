csb[1] = "Then Elihu continued, saying:";
csb[2] = "Hear my words, you wise ones, and listen to me, you knowledgeable ones.";
csb[3] = "Doesn\'t the ear test words as the palate tastes food?";
csb[4] = "Let us judge for ourselves what is right; let us decide together what is good.";
csb[5] = "For Job has declared, &quot;I am righteous, yet God has deprived me of justice.";
csb[6] = "&quot;Would I lie about my case? My wound is incurable, though I am without transgression.&quot;";
csb[7] = "What man is like Job? He drinks derision like water.";
csb[8] = "He keeps company with evildoers and walks with wicked men.";
csb[9] = "For he has said, &quot;A man gains nothing when he becomes God\'s friend.&quot;";
csb[10] = "Therefore listen to me, you men of understanding. It is impossible for God to do wrong, and for the Almighty to act unjustly.";
csb[11] = "For he repays a person according to his deeds, and he gives him what his conduct deserves.";
csb[12] = "Indeed, it is true that God does not act wickedly and the Almighty does not pervert justice.";
csb[13] = "Who gave him authority over the earth? Who put him in charge of the entire world?";
csb[14] = "If he put his mind to it and withdrew the spirit and breath he gave,";
csb[15] = "every living thing would perish together and mankind would return to the dust.";
csb[16] = "If you have understanding, hear this; listen to what I have to say.";
csb[17] = "Could one who hates justice govern the world? Will you condemn the mighty Righteous One,";
csb[18] = "who says to a king, &quot;Worthless man! &quot; and to nobles, &quot;Wicked men! &quot;?";
csb[19] = "God is not partial to princes and does not favor the rich over the poor, for they are all the work of his hands.";
csb[20] = "They die suddenly in the middle of the night; people shudder, then pass away. Even the mighty are removed without effort.";
csb[21] = "For his eyes watch over a man\'s ways, and he observes all his steps.";
csb[22] = "There is no darkness, no deep darkness, where evildoers can hide.";
csb[23] = "God does not need to examine a person further, that one should approach him in court.";
csb[24] = "He shatters the mighty without an investigation and sets others in their place.";
csb[25] = "Therefore, he recognizes their deeds and overthrows them by night, and they are crushed.";
csb[26] = "In full view of the public, he strikes them for their wickedness,";
csb[27] = "because they turned aside from following him and did not understand any of his ways";
csb[28] = "but caused the poor to cry out to him, and he heard the outcry of the needy.";
csb[29] = "But when God is silent, who can declare him guilty? When he hides his face, who can see him? Yet he watches over both individuals and nations,";
csb[30] = "so that godless men should not rule or ensnare the people.";
csb[31] = "Suppose someone says to God, &quot;I have endured my punishment; I will no longer act wickedly.";
csb[32] = "&quot;Teach me what I cannot see; if I have done wrong, I won\'t do it again.&quot;";
csb[33] = "Should God repay you on your terms when you have rejected his? You must choose, not I! So declare what you know.";
csb[34] = "Reasonable men will say to me, along with the wise men who hear me,";
csb[35] = "&quot;Job speaks without knowledge; his words are without insight.&quot;";
csb[36] = "If only Job were tested to the limit, because his answers are like those of wicked men.";
csb[37] = "For he adds rebellion to his sin; he scornfully claps in our presence, while multiplying his words against God.";

yng[33] = "By thee doth He recompense, That thou hast refused -- That thou dost choose, and not I? And what thou hast known, speak.";
