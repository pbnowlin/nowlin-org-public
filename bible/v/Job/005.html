csb[1] = "Call out! Will anyone answer you? Which of the holy ones will you turn to?";
csb[2] = "For anger kills a fool, and jealousy slays the gullible.";
csb[3] = "I have seen a fool taking root, but I immediately pronounced a curse on his home.";
csb[4] = "His children are far from safety. They are crushed at the city gate, with no one to rescue them.";
csb[5] = "The hungry consume his harvest, even taking it out of the thorns. The thirsty pant for his children\'s wealth.";
csb[6] = "For distress does not grow out of the soil, and trouble does not sprout from the ground.";
csb[7] = "But humans are born for trouble as surely as sparks fly upward.";
csb[8] = "However, if I were you, I would appeal to God and would present my case to him.";
csb[9] = "He does great and unsearchable things, wonders without number.";
csb[10] = "He gives rain to the earth and sends water to the fields.";
csb[11] = "He sets the lowly on high, and mourners are lifted to safety.";
csb[12] = "He frustrates the schemes of the crafty so that they achieve no success.";
csb[13] = "He traps the wise in their craftiness so that the plans of the deceptive are quickly brought to an end.";
csb[14] = "They encounter darkness by day, and they grope at noon as if it were night.";
csb[15] = "He saves the needy from their sharp words and from the clutches of the powerful.";
csb[16] = "So the poor have hope, and injustice shuts its mouth.";
csb[17] = "See how happy is the person whom God corrects; so do not reject the discipline of the Almighty.";
csb[18] = "For he wounds but he also bandages; he strikes, but his hands also heal.";
csb[19] = "He will rescue you from six calamities; no harm will touch you in seven.";
csb[20] = "In famine he will redeem you from death, and in battle, from the power of the sword.";
csb[21] = "You will be safe from slander and not fear destruction when it comes.";
csb[22] = "You will laugh at destruction and hunger and not fear the land\'s wild creatures.";
csb[23] = "For you will have a covenant with the stones of the field, and the wild animals will be at peace with you.";
csb[24] = "You will know that your tent is secure, and nothing will be missing when you inspect your home.";
csb[25] = "You will also know that your offspring will be many and your descendants like the grass of the earth.";
csb[26] = "You will approach the grave in full vigor, as a stack of sheaves is gathered in its season.";
csb[27] = "We have investigated this, and it is true! Hear it and understand it for yourself.";
