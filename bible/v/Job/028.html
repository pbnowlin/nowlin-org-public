csb[1] = "Surely there is a mine for silver and a place where gold is refined.";
csb[2] = "Iron is taken from the ground, and copper is smelted from ore.";
csb[3] = "A miner puts an end to the darkness; he probes the deepest recesses for ore in the gloomy darkness.";
csb[4] = "He cuts a shaft far from human habitation, in places unknown to those who walk above ground. Suspended far away from people, the miners swing back and forth.";
csb[5] = "Food may come from the earth, but below the surface the earth is transformed as by fire.";
csb[6] = "Its rocks are a source of lapis lazuli, containing flecks of gold.";
csb[7] = "No bird of prey knows that path; no falcon\'s eye has seen it.";
csb[8] = "Proud beasts have never walked on it; no lion has ever prowled over it.";
csb[9] = "The miner uses a flint tool and turns up ore from the root of the mountains.";
csb[10] = "He cuts out channels in the rocks, and his eyes spot every treasure.";
csb[11] = "He dams up the streams from flowing so that he may bring to light what is hidden.";
csb[12] = "But where can wisdom be found, and where is understanding located?";
csb[13] = "No one can know its value, since it cannot be found in the land of the living.";
csb[14] = "The ocean depths say, &quot;It\'s not in me,&quot; while the sea declares, &quot;I don\'t have it.&quot;";
csb[15] = "Gold cannot be exchanged for it, and silver cannot be weighed out for its price.";
csb[16] = "Wisdom cannot be valued in the gold of Ophir, in precious onyx or lapis lazuli.";
csb[17] = "Gold and glass do not compare with it, and articles of fine gold cannot be exchanged for it.";
csb[18] = "Coral and quartz are not worth mentioning. The price of wisdom is beyond pearls.";
csb[19] = "Topaz from Cush cannot compare with it, and it cannot be valued in pure gold.";
csb[20] = "Where then does wisdom come from, and where is understanding located?";
csb[21] = "It is hidden from the eyes of every living thing and concealed from the birds of the sky.";
csb[22] = "Abaddon and Death say, &quot;We have heard news of it with our ears.&quot;";
csb[23] = "But God understands the way to wisdom, and he knows its location.";
csb[24] = "For he looks to the ends of the earth and sees everything under the heavens.";
csb[25] = "When God fixed the weight of the wind and distributed the water by measure,";
csb[26] = "when he established a limit for the rain and a path for the lightning,";
csb[27] = "he considered wisdom and evaluated it; he established it and examined it.";
csb[28] = "He said to mankind, &quot;The fear of the LORD --that is wisdom. And to turn from evil is understanding.&quot;";
