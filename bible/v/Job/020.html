csb[1] = "Then Zophar the Naamathite replied:";
csb[2] = "This is why my unsettling thoughts compel me to answer, because I am upset!";
csb[3] = "I have heard a rebuke that insults me, and my understanding makes me reply.";
csb[4] = "Don\'t you know that ever since antiquity, from the time a human was placed on earth,";
csb[5] = "the joy of the wicked has been brief and the happiness of the godless has lasted only a moment?";
csb[6] = "Though his arrogance reaches heaven, and his head touches the clouds,";
csb[7] = "he will vanish forever like his own dung. Those who know him will ask, &quot;Where is he? &quot;";
csb[8] = "He will fly away like a dream and never be found; he will be chased away like a vision in the night.";
csb[9] = "The eye that saw him will see him no more, and his household will no longer see him.";
csb[10] = "His children will beg from the poor, for his own hands must give back his wealth.";
csb[11] = "His frame may be full of youthful vigor, but it will lie down with him in dust.";
csb[12] = "Though evil tastes sweet in his mouth and he conceals it under his tongue,";
csb[13] = "though he cherishes it and will not let it go but keeps it in his mouth,";
csb[14] = "yet the food in his stomach turns into cobras\' venom inside him.";
csb[15] = "He swallows wealth but must vomit it up; God will force it from his stomach.";
csb[16] = "He will suck the poison of cobras; a viper\'s fangs will kill him.";
csb[17] = "He will not enjoy the streams, the rivers flowing with honey and curds.";
csb[18] = "He must return the fruit of his labor without consuming it; he doesn\'t enjoy the profits from his trading.";
csb[19] = "For he oppressed and abandoned the poor; he seized a house he did not build.";
csb[20] = "Because his appetite is never satisfied, he does not let anything he desires escape.";
csb[21] = "Nothing is left for him to consume; therefore, his prosperity will not last.";
csb[22] = "At the height of his success distress will come to him; the full weight of misery will crush him.";
csb[23] = "When he fills his stomach, God will send his burning anger against him, raining it down on him while he is eating.";
csb[24] = "If he flees from an iron weapon, an arrow from a bronze bow will pierce him.";
csb[25] = "He pulls it out of his back, the flashing tip out of his liver. Terrors come over him.";
csb[26] = "Total darkness is reserved for his treasures. A fire unfanned by human hands will consume him; it will feed on what is left in his tent.";
csb[27] = "The heavens will expose his iniquity, and the earth will rise up against him.";
csb[28] = "The possessions in his house will be removed, flowing away on the day of God\'s anger.";
csb[29] = "This is the wicked person\'s lot from God, the inheritance God ordained for him.";
