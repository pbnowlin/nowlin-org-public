csb[1] = "Then Eliphaz the Temanite replied:";
csb[2] = "Can a man be of any use to God? Can even a wise man be of use to him?";
csb[3] = "Does it delight the Almighty if you are righteous? Does he profit if you perfect your behavior?";
csb[4] = "Does he correct you and take you to court because of your piety?";
csb[5] = "Isn\'t your wickedness abundant and aren\'t your iniquities endless?";
csb[6] = "For you took collateral from your brothers without cause, stripping off their clothes and leaving them naked.";
csb[7] = "You gave no water to the thirsty and withheld food from the famished,";
csb[8] = "while the land belonged to a powerful man and an influential man lived on it.";
csb[9] = "You sent widows away empty-handed, and the strength of the fatherless was crushed.";
csb[10] = "Therefore snares surround you, and sudden dread terrifies you,";
csb[11] = "or darkness, so you cannot see, and a flood of water covers you.";
csb[12] = "Isn\'t God as high as the heavens? And look at the highest stars -- how lofty they are!";
csb[13] = "Yet you say, &quot;What does God know? Can he judge through total darkness?";
csb[14] = "&quot;Clouds veil him so that he cannot see, as he walks on the circle of the sky.&quot;";
csb[15] = "Will you continue on the ancient path that wicked men have walked?";
csb[16] = "They were snatched away before their time, and their foundations were washed away by a river.";
csb[17] = "They were the ones who said to God, &quot;Leave us alone! &quot; and &quot;What can the Almighty do to us? &quot;";
csb[18] = "But it was he who filled their houses with good things. The counsel of the wicked is far from me!";
csb[19] = "The righteous see this and rejoice; the innocent mock them, saying,";
csb[20] = "&quot;Surely our opponents are destroyed, and fire has consumed what they left behind.&quot;";
csb[21] = "Come to terms with God and be at peace; in this way good will come to you.";
csb[22] = "Receive instruction from his mouth, and place his sayings in your heart.";
csb[23] = "If you return to the Almighty, you will be renewed. If you banish injustice from your tent";
csb[24] = "and consign your gold to the dust, the gold of Ophir to the stones in the wadis,";
csb[25] = "the Almighty will be your gold and your finest silver.";
csb[26] = "Then you will delight in the Almighty and lift up your face to God.";
csb[27] = "You will pray to him, and he will hear you, and you will fulfill your vows.";
csb[28] = "When you make a decision, it will be carried out, and light will shine on your ways.";
csb[29] = "When others are humiliated and you say, &quot;Lift them up,&quot; God will save the humble.";
csb[30] = "He will even rescue the guilty one, who will be rescued by the purity of your hands.";
