csb[1] = "But now they mock me, men younger than I am, whose fathers I would have refused to put with my sheep dogs.";
csb[2] = "What use to me was the strength of their hands? Their vigor had left them.";
csb[3] = "Emaciated from poverty and hunger, they gnawed the dry land, the desolate wasteland by night.";
csb[4] = "They plucked mallow among the shrubs, and the roots of the broom tree were their food.";
csb[5] = "They were banished from human society; people shouted at them as if they were thieves.";
csb[6] = "They are living on the slopes of the wadis, among the rocks and in holes in the ground.";
csb[7] = "They bray among the shrubs; they huddle beneath the thistles.";
csb[8] = "Foolish men, without even a name. They were forced to leave the land.";
csb[9] = "Now I am mocked by their songs; I have become an object of scorn to them.";
csb[10] = "They despise me and keep their distance from me; they do not hesitate to spit in my face.";
csb[11] = "Because God has loosened my bowstring and oppressed me, they have cast off restraint in my presence.";
csb[12] = "The rabble rise up at my right; they trap my feet and construct their siege ramp against me.";
csb[13] = "They tear up my path; they contribute to my destruction, without anyone to help them.";
csb[14] = "They advance as through a gaping breach; they keep rolling in through the ruins.";
csb[15] = "Terrors are turned loose against me; they chase my dignity away like the wind, and my prosperity has passed by like a cloud.";
csb[16] = "Now my life is poured out before me, and days of suffering have seized me.";
csb[17] = "Night pierces my bones, but my gnawing pains never rest.";
csb[18] = "My clothing is distorted with great force; he chokes me by the neck of my garment.";
csb[19] = "He throws me into the mud, and I have become like dust and ashes.";
csb[20] = "I cry out to you for help, but you do not answer me; when I stand up, you merely look at me.";
csb[21] = "You have turned against me with cruelty; you harass me with your strong hand.";
csb[22] = "You lift me up on the wind and make me ride it; you scatter me in the storm.";
csb[23] = "Yes, I know that you will lead me to death -- the place appointed for all who live.";
csb[24] = "Yet no one would stretch out his hand against a ruined person when he cries out to him for help because of his distress.";
csb[25] = "Have I not wept for those who have fallen on hard times? Has my soul not grieved for the needy?";
csb[26] = "But when I hoped for good, evil came; when I looked for light, darkness came.";
csb[27] = "I am churning within and cannot rest; days of suffering confront me.";
csb[28] = "I walk about blackened, but not by the sun. I stood in the assembly and cried out for help.";
csb[29] = "I have become a brother to jackals and a companion of ostriches.";
csb[30] = "My skin blackens and flakes off, and my bones burn with fever.";
csb[31] = "My lyre is used for mourning and my flute for the sound of weeping.";

hnv[2] = "Of what use is the strength of their hands to me, Men in whom ripe age has perished?";
vul[2] = "quorum virtus manuum erat mihi pro nihilo et vita ipsa putabantur indigni";

dby[3] = "Withered up through want and hunger, they flee into waste places long since desolate and desert:";

hnv[3] = "They are gaunt from lack and famine. They gnaw the dry ground, in the gloom of waste and desolation.";
