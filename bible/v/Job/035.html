csb[1] = "Then Elihu continued, saying:";
csb[2] = "Do you think it is just when you say, &quot;I am righteous before God&quot;?";
csb[3] = "For you ask, &quot;What does it profit you, and what benefit comes to me, if I do not sin? &quot;";
csb[4] = "I will answer you and your friends with you.";
csb[5] = "Look at the heavens and see; gaze at the clouds high above you.";
csb[6] = "If you sin, how does it affect God? If you multiply your transgressions, what does it do to him?";
csb[7] = "If you are righteous, what do you give him, or what does he receive from your hand?";
csb[8] = "Your wickedness affects a person like yourself, and your righteousness, a son of man.";
csb[9] = "People cry out because of severe oppression; they shout for help because of the power of the mighty.";
csb[10] = "But no one asks, &quot;Where is God my Maker, who provides us with songs in the night,";
csb[11] = "&quot;who gives us more understanding than the animals of the earth and makes us wiser than the birds of the sky? &quot;";
csb[12] = "There they cry out, but he does not answer, because of the pride of evil people.";
csb[13] = "Indeed, God does not listen to empty cries, and the Almighty does not take note of it --";
csb[14] = "how much less when you complain that you do not see him, that your case is before him and you are waiting for him.";
csb[15] = "But now, because God\'s anger does not punish and he does not pay attention to transgression,";
csb[16] = "Job opens his mouth in vain and multiplies words without knowledge.";
