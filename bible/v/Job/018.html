csb[1] = "Then Bildad the Shuhite replied:";
csb[2] = "How long until you stop talking? Show some sense, and then we can talk.";
csb[3] = "Why are we regarded as cattle, as stupid in your sight?";
csb[4] = "You who tear yourself in anger -- should the earth be abandoned on your account, or a rock be removed from its place?";
csb[5] = "Yes, the light of the wicked is extinguished; the flame of his fire does not glow.";
csb[6] = "The light in his tent grows dark, and the lamp beside him is put out.";
csb[7] = "His powerful stride is shortened, and his own schemes trip him up.";
csb[8] = "For his own feet lead him into a net, and he strays into its mesh.";
csb[9] = "A trap catches him by the heel; a noose seizes him.";
csb[10] = "A rope lies hidden for him on the ground, and a snare waits for him along the path.";
csb[11] = "Terrors frighten him on every side and harass him at every step.";
csb[12] = "His strength is depleted; disaster lies ready for him to stumble.";
csb[13] = "Parts of his skin are eaten away; death\'s firstborn consumes his limbs.";
csb[14] = "He is ripped from the security of his tent and marched away to the king of terrors.";
csb[15] = "Nothing he owned remains in his tent. Burning sulfur is scattered over his home.";
csb[16] = "His roots below dry up, and his branches above wither away.";
csb[17] = "All memory of him perishes from the earth; he has no name anywhere.";
csb[18] = "He is driven from light to darkness and chased from the inhabited world.";
csb[19] = "He has no children or descendants among his people, no survivor where he used to live.";
csb[20] = "Those in the west are appalled at his fate, while those in the east tremble in horror.";
csb[21] = "Indeed, such is the dwelling of the unjust man, and this is the place of the one who does not know God.";
