csb[1] = "There was a man in the country of Uz named Job. He was a man of complete integrity, who feared God and turned away from evil.";
csb[2] = "He had seven sons and three daughters.";
csb[3] = "His estate included seven thousand sheep and goats, three thousand camels, five hundred yoke of oxen, five hundred female donkeys, and a very large number of servants. Job was the greatest man among all the people of the east.";
csb[4] = "His sons used to take turns having banquets at their homes. They would send an invitation to their three sisters to eat and drink with them.";
csb[5] = "Whenever a round of banqueting was over, Job would send for his children and purify them, rising early in the morning to offer burnt offerings for all of them. For Job thought, &quot;Perhaps my children have sinned, having cursed God in their hearts.&quot; This was Job\'s regular practice.";
csb[6] = "One day the sons of God came to present themselves before the LORD, and Satan also came with them.";
csb[7] = "The LORD asked Satan, &quot;Where have you come from? &quot; &quot;From roaming through the earth,&quot; Satan answered him, &quot;and walking around on it.&quot;";
csb[8] = "Then the LORD said to Satan, &quot;Have you considered my servant Job? No one else on earth is like him, a man of perfect integrity, who fears God and turns away from evil.&quot;";
csb[9] = "Satan answered the LORD, &quot;Does Job fear God for nothing?";
csb[10] = "&quot;Haven\'t you placed a hedge around him, his household, and everything he owns? You have blessed the work of his hands, and his possessions have increased in the land.";
csb[11] = "&quot;But stretch out your hand and strike everything he owns, and he will surely curse you to your face.&quot;";
csb[12] = "&quot;Very well,&quot; the LORD told Satan, &quot;everything he owns is in your power. However, do not lay a hand on Job himself.&quot; So Satan left the LORD\'s presence.";
csb[13] = "One day when Job\'s sons and daughters were eating and drinking wine in their oldest brother\'s house,";
csb[14] = "a messenger came to Job and reported: &quot;While the oxen were plowing and the donkeys grazing nearby,";
csb[15] = "&quot;the Sabeans swooped down and took them away. They struck down the servants with the sword, and I alone have escaped to tell you! &quot;";
csb[16] = "He was still speaking when another messenger came and reported: &quot;God\'s fire fell from heaven. It burned the sheep and the servants and devoured them, and I alone have escaped to tell you! &quot;";
csb[17] = "That messenger was still speaking when yet another came and reported: &quot;The Chaldeans formed three bands, made a raid on the camels, and took them away. They struck down the servants with the sword, and I alone have escaped to tell you! &quot;";
csb[18] = "He was still speaking when another messenger came and reported: &quot;Your sons and daughters were eating and drinking wine in their oldest brother\'s house.";
csb[19] = "&quot;Suddenly a powerful wind swept in from the desert and struck the four corners of the house. It collapsed on the young people so that they died, and I alone have escaped to tell you! &quot;";
csb[20] = "Then Job stood up, tore his robe, and shaved his head. He fell to the ground and worshiped,";
csb[21] = "saying: Naked I came from my mother\'s womb, and naked I will leave this life. The LORD gives, and the LORD takes away. Blessed be the name of the LORD.";
csb[22] = "Throughout all this Job did not sin or blame God for anything.";
