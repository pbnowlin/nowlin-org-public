csb[1] = "Then Job answered:";
csb[2] = "Pay close attention to my words; let this be the consolation you offer.";
csb[3] = "Bear with me while I speak; then after I have spoken, you may continue mocking.";
csb[4] = "As for me, is my complaint against a human being? Then why shouldn\'t I be impatient?";
csb[5] = "Look at me and shudder; put your hand over your mouth.";
csb[6] = "When I think about it, I am terrified and my body trembles in horror.";
csb[7] = "Why do the wicked continue to live, growing old and becoming powerful?";
csb[8] = "Their children are established while they are still alive, and their descendants, before their eyes.";
csb[9] = "Their homes are secure and free of fear; no rod from God strikes them.";
csb[10] = "Their bulls breed without fail; their cows calve and do not miscarry.";
csb[11] = "They let their little ones run around like lambs; their children skip about,";
csb[12] = "singing to the tambourine and lyre and rejoicing at the sound of the flute.";
csb[13] = "They spend their days in prosperity and go down to Sheol in peace.";
csb[14] = "Yet they say to God, &quot;Leave us alone! We don\'t want to know your ways.";
csb[15] = "&quot;Who is the Almighty, that we should serve him, and what will we gain by pleading with him? &quot;";
csb[16] = "But their prosperity is not of their own doing. The counsel of the wicked is far from me!";
csb[17] = "How often is the lamp of the wicked put out? Does disaster come on them? Does he apportion destruction in his anger?";
csb[18] = "Are they like straw before the wind, like chaff a storm sweeps away?";
csb[19] = "God reserves a person\'s punishment for his children. Let God repay the person himself, so that he may know it.";
csb[20] = "Let his own eyes see his demise; let him drink from the Almighty\'s wrath!";
csb[21] = "For what does he care about his family once he is dead, when the number of his months has run out?";
csb[22] = "Can anyone teach God knowledge, since he judges the exalted ones?";
csb[23] = "One person dies in excellent health, completely secure and at ease.";
csb[24] = "His body is well fed, and his bones are full of marrow.";
csb[25] = "Yet another person dies with a bitter soul, having never tasted prosperity.";
csb[26] = "But they both lie in the dust, and worms cover them.";
csb[27] = "I know your thoughts very well, the schemes by which you would wrong me.";
csb[28] = "For you say, &quot;Where now is the nobleman\'s house? &quot; and &quot;Where are the tents the wicked lived in? &quot;";
csb[29] = "Have you never consulted those who travel the roads? Don\'t you accept their reports?";
csb[30] = "Indeed, the evil person is spared from the day of disaster, rescued from the day of wrath.";
csb[31] = "Who would denounce his behavior to his face? Who would repay him for what he has done?";
csb[32] = "He is carried to the grave, and someone keeps watch over his tomb.";
csb[33] = "The dirt on his grave is sweet to him. Everyone follows behind him, and those who go before him are without number.";
csb[34] = "So how can you offer me such futile comfort? Your answers are deceptive.";
