csb[1] = "Isn\'t each person consigned to forced labor on earth? Are not his days like those of a hired worker?";
csb[2] = "Like a slave he longs for shade; like a hired worker he waits for his pay.";
csb[3] = "So I have been made to inherit months of futility, and troubled nights have been assigned to me.";
csb[4] = "When I lie down I think, &quot;When will I get up? &quot; But the evening drags on endlessly, and I toss and turn until dawn.";
csb[5] = "My flesh is clothed with maggots and encrusted with dirt. My skin forms scabs and then oozes.";
csb[6] = "My days pass more swiftly than a weaver\'s shuttle; they come to an end without hope.";
csb[7] = "Remember that my life is but a breath. My eye will never again see anything good.";
csb[8] = "The eye of anyone who looks on me will no longer see me. Your eyes will look for me, but I will be gone.";
csb[9] = "As a cloud fades away and vanishes, so the one who goes down to Sheol will never rise again.";
csb[10] = "He will never return to his house; his hometown will no longer remember him.";
csb[11] = "Therefore I will not restrain my mouth. I will speak in the anguish of my spirit; I will complain in the bitterness of my soul.";
csb[12] = "Am I the sea or a sea monster, that you keep me under guard?";
csb[13] = "When I say, &quot;My bed will comfort me, and my couch will ease my complaint,&quot;";
csb[14] = "then you frighten me with dreams, and terrify me with visions,";
csb[15] = "so that I prefer strangling -- death rather than life in this body.";
csb[16] = "I give up! I will not live forever. Leave me alone, for my days are a breath.";
csb[17] = "What is a mere human, that you think so highly of him and pay so much attention to him?";
csb[18] = "You inspect him every morning, and put him to the test every moment.";
csb[19] = "Will you ever look away from me, or leave me alone long enough to swallow?";
csb[20] = "If I have sinned, what have I done to you, Watcher of humanity? Why have you made me your target, so that I have become a burden to you?";
csb[21] = "Why not forgive my sin and pardon my iniquity? For soon I will lie down in the grave. You will eagerly seek me, but I will be gone.";
