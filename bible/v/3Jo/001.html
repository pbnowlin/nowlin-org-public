csb[1] = "The elder: To my dear friend Gaius, whom I love in the truth.";
csb[2] = "Dear friend, I pray that you are prospering in every way and are in good health, just as your whole life is going well. ";
csb[3] = "For I was very glad when fellow believers came and testified to your fidelity to the truth -- how you are walking in truth.";
csb[4] = "I have no greater joy than this: to hear that my children are walking in truth.";
csb[5] = "Dear friend, you are acting faithfully in whatever you do for the brothers and sisters, especially when they are strangers.";
csb[6] = "They have testified to your love before the church. You will do well to send them on their journey in a manner worthy of God,";
csb[7] = "since they set out for the sake of the Name, accepting nothing from pagans. ";
csb[8] = "Therefore, we ought to support such people so that we can be coworkers with the truth.";
csb[9] = "I wrote something to the church, but Diotrephes, who loves to have first place among them, does not receive our authority.";
csb[10] = "This is why, if I come, I will remind him of the works he is doing, slandering us with malicious words. And he is not satisfied with that! He not only refuses to welcome fellow believers, but he even stops those who want to do so and expels them from the church.";
csb[11] = "Dear friend, do not imitate what is evil, but what is good. The one who does good is of God; the one who does evil has not seen God.";
csb[12] = "Everyone speaks well of Demetrius -- even the truth itself. And we also speak well of him, and you know that our testimony is true.";
csb[13] = "I have many things to write you, but I don\'t want to write to you with pen and ink.";
csb[14] = "I hope to see you soon, and we will talk face to face.";
csb[15] = "Peace to you. The friends send you greetings. Greet the friends by name.";
kjv[1] = "The elder unto the wellbeloved Gaius, whom I love in the truth.";
rsv[1] = "The elder to the beloved Ga\'ius, whom I love in the truth.";
asv[1] = "The elder unto Gaius the beloved, whom I love in truth.";
yng[1] = "The Elder to Gaius the beloved, whom I love in truth!";
dby[1] = "The elder to the beloved Gaius, whom I love in truth.";
web[1] = "The elder to the well-beloved Gaius, whom I love in truth.";
hnv[1] = "The elder to Gaius the beloved, whom I love in truth.";
vul[1] = "senior Gaio carissimo quem ego diligo in veritate";
kjv[2] = "Beloved, I wish above all things that thou mayest prosper and be in health, even as thy soul prospereth.";
rsv[2] = "Beloved, I pray that all may go well with you and that you may be in health; I know that it is well with your soul.";
asv[2] = "Beloved, I pray that in all things thou mayest prosper and be in health, even as thy soul prospereth.";
yng[2] = "beloved, concerning all things I desire thee to prosper, and to be in health, even as thy soul doth prosper,";
dby[2] = "Beloved, I desire that in all things thou shouldest prosper and be in health, even as thy soul prospers.";
web[2] = "Beloved, I wish above all things that thou mayest prosper and be in health, even as thy soul prospereth.";
hnv[2] = "Beloved, I pray that you may prosper in all things and be healthy, even as your soul prospers.";
vul[2] = "carissime de omnibus orationem facio prospere te ingredi et valere sicut prospere agit anima tua";
kjv[3] = "For I rejoiced greatly, when the brethren came and testified of the truth that is in thee, even as thou walkest in the truth.";
rsv[3] = "For I greatly rejoiced when some of the brethren arrived and testified to the truth of your life, as indeed you do follow the truth.";
asv[3] = "For I rejoiced greatly, when brethren came and bare witness unto thy truth, even as thou walkest in truth.";
yng[3] = "for I rejoiced exceedingly, brethren coming and testifying of the truth in thee, even as thou in truth dost walk;";
dby[3] = "For I rejoiced exceedingly when [the] brethren came and bore testimony to thy [holding fast the] truth, even as *thou* walkest in truth.";
web[3] = "For I rejoiced greatly, when the brethren came and testified of the truth that is in thee, even as thou walkest in the truth.";
hnv[3] = "For I rejoiced greatly, when brothers came and testified about your truth, even as you walk in truth.";
vul[3] = "gavisus sum valde venientibus fratribus et testimonium perhibentibus veritati tuae sicut tu in veritate ambulas";
kjv[4] = "I have no greater joy than to hear that my children walk in truth.";
rsv[4] = "No greater joy can I have than this, to hear that my children follow the truth.";
asv[4] = "Greater joy have I none than this, to hear of my children walking in the truth.";
yng[4] = "greater than these things I have no joy, that I may hear of my children in truth walking.";
dby[4] = "I have no greater joy than these things that I hear of my children walking in the truth.";
web[4] = "I have no greater joy than to hear that my children walk in truth.";
hnv[4] = "I have no greater joy than this, to hear about my children walking in truth.";
vul[4] = "maiorem horum non habeo gratiam quam ut audiam filios meos in veritate ambulantes";
kjv[5] = "Beloved, thou doest faithfully whatsoever thou doest to the brethren, and to strangers;";
rsv[5] = "Beloved, it is a loyal thing you do when you render any service to the brethren, especially to strangers,";
asv[5] = "Beloved, thou doest a faithful work in whatsoever thou doest toward them that are brethren and strangers withal;";
yng[5] = "Beloved, faithfully dost thou do whatever thou mayest work to the brethren and to the strangers,";
dby[5] = "Beloved, thou doest faithfully [in] whatever thou mayest have wrought towards the brethren and that strangers,";
web[5] = "Beloved, thou doest faithfully whatever thou doest to the brethren, and to strangers;";
hnv[5] = "Beloved, you do a faithful work in whatever you accomplish for those who are brothers and strangers.";
vul[5] = "carissime fideliter facis quicquid operaris in fratres et hoc in peregrinos";
kjv[6] = "Which have borne witness of thy charity before the church: whom if thou bring forward on their journey after a godly sort, thou shalt do well:";
rsv[6] = "who have testified to your love before the church. You will do well to send them on their journey as befits God\'s service.";
asv[6] = "who bare witness to thy love before the church: whom thou wilt do well to set forward on their journey worthily of God:";
yng[6] = "who did testify of thy love before an assembly, whom thou wilt do well, having sent forward worthily of God,";
dby[6] = "(who have witnessed of thy love before [the] assembly,) in setting forward whom on their journey worthily of God, thou wilt do well;";
web[6] = "Who have borne testimony of thy charity before the church: whom if thou shalt bring forward on their journey after a godly sort, thou wilt do well:";
hnv[6] = "They have testified about your love before the assembly. You will do well to send them forward on their journey in a manner worthy of God,";
vul[6] = "qui testimonium reddiderunt caritati tuae in conspectu ecclesiae quos bene facies deducens digne Deo";
kjv[7] = "Because that for his name\'s sake they went forth, taking nothing of the Gentiles.";
rsv[7] = "For they have set out for his sake and have accepted nothing from the heathen.";
asv[7] = "because that for the sake of the Name they went forth, taking nothing of the Gentiles.";
yng[7] = "because for [His] name they went forth, nothing receiving from the nations;";
dby[7] = "for for the name have they gone forth, taking nothing of those of the nations.";
web[7] = "Because for his name\'s sake they went forth, taking nothing from the Gentiles.";
hnv[7] = "because for the sake of the Name they went out, taking nothing from the Goyim.";
vul[7] = "pro nomine enim profecti sunt nihil accipientes a gentibus";
kjv[8] = "We therefore ought to receive such, that we might be fellowhelpers to the truth.";
rsv[8] = "So we ought to support such men, that we may be fellow workers in the truth.";
asv[8] = "We therefore ought to welcome such, that we may be fellow-workers for the truth.";
yng[8] = "we, then, ought to receive such, that fellow-workers we may become to the truth.";
dby[8] = "*We* therefore ought to receive such, that we may be fellow-workers with the truth.";
web[8] = "We therefore ought to receive such, that we may be fellow-helpers to the truth.";
hnv[8] = "We therefore ought to receive such, that we may be fellow workers for the truth.";
vul[8] = "nos ergo debemus suscipere huiusmodi ut cooperatores simus veritatis";
kjv[9] = "I wrote unto the church: but Diotrephes, who loveth to have the preeminence among them, receiveth us not.";
rsv[9] = "I have written something to the church; but Diot\'rephes, who likes to put himself first, does not acknowledge my authority.";
asv[9] = "I wrote somewhat unto the church: but Diotrephes, who loveth to have the preeminence among them, receiveth us not.";
yng[9] = "I did write to the assembly, but he who is loving the first place among them -- Diotrephes -- doth not receive us;";
dby[9] = "I wrote something to the assembly; but Diotrephes, who loves to have the first place among them, receives us not.";
web[9] = "I wrote to the church: but Diotrephes, who loveth to have the pre-eminence among them, receiveth us not.";
hnv[9] = "I wrote to the assembly, but Diotrephes, who loves to be first among them, doesn\'t accept what we say.";
vul[9] = "scripsissem forsitan ecclesiae sed is qui amat primatum gerere in eis Diotrepes non recipit nos";
kjv[10] = "Wherefore, if I come, I will remember his deeds which he doeth, prating against us with malicious words: and not content therewith, neither doth he himself receive the brethren, and forbiddeth them that would, and casteth [them] out of the church.";
rsv[10] = "So if I come, I will bring up what he is doing, prating against me with evil words. And not content with that, he refuses himself to welcome the brethren, and also stops those who want to welcome them and puts them out of the church.";
asv[10] = "Therefore, if I come, I will bring to remembrance his works which he doeth, prating against us with wicked words: and not content therewith, neither doth he himself receive the brethren, and them that would he forbiddeth and casteth [them] out of the church.";
yng[10] = "because of this, if I may come, I will cause him to remember his works that he doth, with evil words prating against us; and not content with these, neither doth he himself receive the brethren, and those intending he doth forbid, and out of the assembly he doth cast.";
dby[10] = "For this reason, if I come, I will bring to remembrance his works which he does, babbling against us with wicked words; and not content with these, neither does he himself receive the brethren; and those who would he prevents, and casts [them] out of the assembly.";
web[10] = "Wherefore, if I come, I will remember his deeds which he doeth, prating against us with malicious words: and not content with that, neither doth he himself receive the brethren, and forbiddeth them that would, and casteth [them] out of the church.";
hnv[10] = "Therefore, if I come, I will call attention to his deeds which he does, unjustly accusing us with wicked words. Not content with this, neither does he himself receive the brothers, and those who would, he forbids and throws out of the assembly.";
vul[10] = "propter hoc si venero commoneam eius opera quae facit verbis malignis garriens in nos et quasi non ei ista sufficiant nec ipse suscipit fratres et eos qui cupiunt prohibet et de ecclesia eicit";
kjv[11] = "Beloved, follow not that which is evil, but that which is good. He that doeth good is of God: but he that doeth evil hath not seen God.";
rsv[11] = "Beloved, do not imitate evil but imitate good. He who does good is of God; he who does evil has not seen God.";
asv[11] = "Beloved, imitate not that which is evil, but that which is good. He that doeth good is of God: he that doeth evil hath not seen God.";
yng[11] = "Beloved, be not thou following that which is evil, but that which is good; he who is doing good, of God he is, and he who is doing evil hath not seen God;";
dby[11] = "Beloved, do not imitate what is evil, but what is good. He that does good is of God. He that does evil has not seen God.";
web[11] = "Beloved, follow not that which is evil, but that which is good. He that doeth good is of God: but he that doeth evil hath not seen God.";
hnv[11] = "Beloved, don\'t imitate that which is evil, but that which is good. He who does good is of God. He who does evil hasn\'t seen God.";
vul[11] = "carissime noli imitari malum sed quod bonum est qui benefacit ex Deo est qui malefacit non vidit Deum";
kjv[12] = "Demetrius hath good report of all [men], and of the truth itself: yea, and we [also] bear record; and ye know that our record is true.";
rsv[12] = "Deme\'trius has testimony from every one, and from the truth itself; I testify to him too, and you know my testimony is true.";
asv[12] = "Demetrius hath the witness of all [men], and of the truth itself: yea, we also bear witness; and thou knowest that our witness is true.";
yng[12] = "to Demetrius testimony hath been given by all, and by the truth itself, and we also -- we do testify, and ye have known that our testimony is true.";
dby[12] = "Demetrius has witness borne to him by all, and by the truth itself; and *we* also bear witness, and thou knowest that our witness is true.";
web[12] = "Demetrius hath good report by all [men], and by the truth itself: and we [also] bear testimony; and ye know that our testimony is true.";
hnv[12] = "Demetrius has the testimony of all, and of the truth itself; yes, we also testify, and you know that our testimony is true.";
vul[12] = "Demetrio testimonium redditur ab omnibus et ab ipsa veritate et nos autem testimonium perhibemus et nosti quoniam testimonium nostrum verum est";
kjv[13] = "I had many things to write, but I will not with ink and pen write unto thee:";
rsv[13] = "I had much to write to you, but I would rather not write with pen and ink;";
asv[13] = "I had many things to write unto thee, but I am unwilling to write [them] to thee with ink and pen:";
yng[13] = "Many things I had to write, but I do not wish through ink and pen to write to thee,";
dby[13] = "I had many things to write to thee, but I will not with ink and pen write to thee;";
web[13] = "I had many things to write, but I will not with ink and pen write to thee:";
hnv[13] = "I had many things to write to you, but I am unwilling to write to you with ink and pen;";
vul[13] = "multa habui scribere tibi sed nolui per atramentum et calamum scribere tibi";
kjv[14] = "But I trust I shall shortly see thee, and we shall speak face to face. Peace [be] to thee. [Our] friends salute thee. Greet the friends by name.";
rsv[14] = "I hope to see you soon, and we will talk together face to face.";
asv[14] = "but I hope shortly to see thee, and we shall speak face to face. Peace [be] unto thee. The friends salute thee. Salute the friends by name.";
yng[14] = "and I hope straightway to see thee, and mouth to mouth we shall speak. Peace to thee! salute thee do the friends; be saluting the friends by name.";
dby[14] = "but I hope soon to see thee, and we will speak mouth to mouth. Peace [be] to thee. The friends greet thee. Greet the friends by name.";
web[14] = "But I trust I shall shortly see thee, and we shall speak face to face. Peace [be] to thee. [Our] friends salute thee. Greet the friends by name.";
hnv[14] = "but I hope to see you soon, and we will speak face to face. Shalom be to you. The friends greet you. Greet the friends by name.";
vul[14] = "spero autem protinus te videre et os ad os loquemur [Vulgate 1:15] pax tibi salutant te amici saluta amicos per nomen";
