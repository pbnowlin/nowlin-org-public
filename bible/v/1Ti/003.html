csb[1] = "This saying is trustworthy: &quot;If anyone aspires to be an overseer, he desires a noble work.&quot;";
csb[2] = "An overseer, therefore, must be above reproach, the husband of one wife, self-controlled, sensible, respectable, hospitable, able to teach,";
csb[3] = "not an excessive drinker, not a bully but gentle, not quarrelsome, not greedy.";
csb[4] = "He must manage his own household competently and have his children under control with all dignity.";
csb[5] = "(If anyone does not know how to manage his own household, how will he take care of God\'s church?)";
csb[6] = "He must not be a new convert, or he might become conceited and incur the same condemnation as the devil.";
csb[7] = "Furthermore, he must have a good reputation among outsiders, so that he does not fall into disgrace and the devil\'s trap.";
csb[8] = "Deacons, likewise, should be worthy of respect, not hypocritical, not drinking a lot of wine, not greedy for money,";
csb[9] = "holding the mystery of the faith with a clear conscience.";
csb[10] = "They must also be tested first; if they prove blameless, then they can serve as deacons.";
csb[11] = "Wives, too, must be worthy of respect, not slanderers, self-controlled, faithful in everything.";
csb[12] = "Deacons are to be husbands of one wife, managing their children and their own households competently.";
csb[13] = "For those who have served well as deacons acquire a good standing for themselves and great boldness in the faith that is in Christ Jesus.";
csb[14] = "I write these things to you, hoping to come to you soon.";
csb[15] = "But if I should be delayed, I have written so that you will know how people ought to conduct themselves in God\'s household, which is the church of the living God, the pillar and foundation of the truth.";
csb[16] = "And most certainly, the mystery of godliness is great: He was manifested in the flesh, vindicated in the Spirit, seen by angels, preached among the nations, believed on in the world, taken up in glory.";
