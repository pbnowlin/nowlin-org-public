csb[1] = "All who are under the yoke as slaves should regard their own masters as worthy of all respect, so that God\'s name and his teaching will not be blasphemed.";
csb[2] = "Let those who have believing masters not be disrespectful to them because they are brothers, but serve them even better, since those who benefit from their service are believers and dearly loved. Teach and encourage these things.";
csb[3] = "If anyone teaches false doctrine and does not agree with the sound teaching of our Lord Jesus Christ and with the teaching that promotes godliness,";
csb[4] = "he is conceited and understands nothing, but has an unhealthy interest in disputes and arguments over words. From these come envy, quarreling, slander, evil suspicions,";
csb[5] = "and constant disagreement among people whose minds are depraved and deprived of the truth, who imagine that godliness is a way to material gain.";
csb[6] = "But godliness with contentment is great gain.";
csb[7] = "For we brought nothing into the world, and we can take nothing out.";
csb[8] = "If we have food and clothing, we will be content with these.";
csb[9] = "But those who want to be rich fall into temptation, a trap, and many foolish and harmful desires, which plunge people into ruin and destruction.";
csb[10] = "For the love of money is a root of all kinds of evil, and by craving it, some have wandered away from the faith and pierced themselves with many griefs.";
csb[11] = "But you, man of God, flee from these things, and pursue righteousness, godliness, faith, love, endurance, and gentleness.";
csb[12] = "Fight the good fight of the faith. Take hold of eternal life to which you were called and about which you have made a good confession in the presence of many witnesses.";
csb[13] = "In the presence of God, who gives life to all, and of Christ Jesus, who gave a good confession before Pontius Pilate, I charge you";
csb[14] = "to keep this command without fault or failure until the appearing of our Lord Jesus Christ.";
csb[15] = "God will bring this about in his own time. He is the blessed and only Sovereign, the King of kings, and the Lord of lords,";
csb[16] = "who alone is immortal and who lives in unapproachable light, whom no one has seen or can see, to him be honor and eternal power. Amen.";
csb[17] = "Instruct those who are rich in the present age not to be arrogant or to set their hope on the uncertainty of wealth, but on God, who richly provides us with all things to enjoy.";
csb[18] = "Instruct them to do what is good, to be rich in good works, to be generous and willing to share,";
csb[19] = "storing up treasure for themselves as a good foundation for the coming age, so that they may take hold of what is truly life.";
csb[20] = "Timothy, guard what has been entrusted to you, avoiding irreverent and empty speech and contradictions from what is falsely called knowledge.";
csb[21] = "By professing it, some people have departed from the faith. Grace be with you all.";
