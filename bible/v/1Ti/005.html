csb[1] = "Don\'t rebuke an older man, but exhort him as a father, younger men as brothers,";
csb[2] = "older women as mothers, and the younger women as sisters with all purity.";
csb[3] = "Support widows who are genuinely in need.";
csb[4] = "But if any widow has children or grandchildren, let them learn to practice godliness toward their own family first and to repay their parents, for this pleases God.";
csb[5] = "The widow who is truly in need and left all alone has put her hope in God and continues night and day in her petitions and prayers;";
csb[6] = "however, she who is self-indulgent is dead even while she lives.";
csb[7] = "Command this also, so that they will be above reproach.";
csb[8] = "But if anyone does not provide for his own family, especially for his own household, he has denied the faith and is worse than an unbeliever.";
csb[9] = "No widow is to be enrolled on the list for support unless she is at least sixty years old, has been the wife of one husband,";
csb[10] = "and is well known for good works -- that is, if she has brought up children, shown hospitality, washed the saints\' feet, helped the afflicted, and devoted herself to every good work.";
csb[11] = "But refuse to enroll younger widows, for when they are drawn away from Christ by desire, they want to marry";
csb[12] = "and will therefore receive condemnation because they have renounced their original pledge.";
csb[13] = "At the same time, they also learn to be idle, going from house to house; they are not only idle, but are also gossips and busybodies, saying things they shouldn\'t say.";
csb[14] = "Therefore, I want younger women to marry, have children, manage their households, and give the adversary no opportunity to accuse us.";
csb[15] = "For some have already turned away to follow Satan.";
csb[16] = "If any believing woman has widows in her family, let her help them. Let the church not be burdened, so that it can help widows in genuine need.";
csb[17] = "The elders who are good leaders are to be considered worthy of double honor, especially those who work hard at preaching and teaching.";
csb[18] = "For the Scripture says: Do not muzzle an ox while it is treading out the grain, and the worker is worthy of his wages.";
csb[19] = "Don\'t accept an accusation against an elder unless it is supported by two or three witnesses.";
csb[20] = "Publicly rebuke those who sin, so that the rest will be afraid.";
csb[21] = "I solemnly charge you before God and Christ Jesus and the elect angels to observe these things without prejudice, doing nothing out of favoritism.";
csb[22] = "Don\'t be too quick to appoint anyone as an elder, and don\'t share in the sins of others. Keep yourself pure.";
csb[23] = "Don\'t continue drinking only water, but use a little wine because of your stomach and your frequent illnesses.";
csb[24] = "Some people\'s sins are obvious, preceding them to judgment, but the sins of others surface later.";
csb[25] = "Likewise, good works are obvious, and those that are not obvious cannot remain hidden.";

kjv[4] = "But if any widow have children or nephews, let them learn first to shew piety at home, and to requite their parents: for that is good and acceptable before God.";
rsv[4] = "If a widow has children or grandchildren, let them first learn their religious duty to their own family and make some return to their parents; for this is acceptable in the sight of God.";

yng[4] = "and if any widow have children or grandchildren, let them learn first to their own house to show piety, and to give back a recompense to the parents, for this is right and acceptable before God.";
dby[4] = "but if any widow have children or descendants, let them learn first to be pious as regards their own house, and to render a return on their side to [their] parents; for this is acceptable in the sight of God.";

kjv[16] = "If any man or woman that believeth have widows, let them relieve them, and let not the church be charged; that it may relieve them that are widows indeed.";
