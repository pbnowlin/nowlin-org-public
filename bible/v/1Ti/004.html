csb[1] = "Now the Spirit explicitly says that in later times some will depart from the faith, paying attention to deceitful spirits and the teachings of demons,";
csb[2] = "through the hypocrisy of liars whose consciences are seared.";
csb[3] = "They forbid marriage and demand abstinence from foods that God created to be received with gratitude by those who believe and know the truth.";
csb[4] = "For everything created by God is good, and nothing is to be rejected if it is received with thanksgiving,";
csb[5] = "since it is sanctified by the word of God and by prayer.";
csb[6] = "If you point these things out to the brothers and sisters, you will be a good servant of Christ Jesus, nourished by the words of the faith and the good teaching that you have followed.";
csb[7] = "But have nothing to do with pointless and silly myths. Rather, train yourself in godliness.";
csb[8] = "For the training of the body has limited benefit, but godliness is beneficial in every way, since it holds promise for the present life and also for the life to come.";

csb[10] = "For this reason we labor and strive, because we have put our hope in the living God, who is the Savior of all people, especially of those who believe.";

csb[12] = "Don\'t let anyone despise your youth, but set an example for the believers in speech, in conduct, in love, in faith, and in purity.";

csb[15] = "Practice these things; be committed to them, so that your progress may be evident to all.";
csb[16] = "Pay close attention to your life and your teaching; persevere in these things, for in doing this you will save both yourself and your hearers.";
