asv[1] = "Now these are they that came to David to Ziklag, while he yet kept himself close because of Saul the son of Kish; and they were among the mighty men, his helpers in war.";
asv[2] = "They were armed with bows, and could use both the right hand and the left in slinging stones and in shooting arrows from the bow: they were of Saul\'s brethren of Benjamin.";
asv[3] = "The chief was Ahiezer; then Joash, the sons of Shemaah the Gibeathite, and Jeziel, and Pelet, the sons of Azmaveth, and Beracah, and Jehu the Anathothite,";
asv[4] = "and Ishmaiah the Gibeonite, a mighty man among the thirty, and over the thirty, and Jeremiah, and Jahaziel, and Johanan, and Jozabad the Gederathite,";
asv[5] = "Eluzai, and Jerimoth, and Bealiah, and Shemariah, and Shephatiah the Haruphite,";
asv[6] = "Elkanah, and Isshiah, and Azarel, and Joezer, and Jashobeam, the Korahites,";
asv[7] = "and Joelah, and Zebadiah, the sons of Jeroham of Gedor.";
asv[8] = "And of the Gadites there separated themselves unto David to the stronghold in the wilderness, mighty men of valor, men trained for war, that could handle shield and spear; whose faces were like the faces of lions, and they were as swift as the roes upon the mountains:";
asv[9] = "Ezer the chief, Obadiah the second, Eliab the third,";
asv[10] = "Mishmannah the fourth, Jeremiah the fifth,";
asv[11] = "Attai the sixth, Eliel the seventh,";
asv[12] = "Johanan the eighth, Elzabad the ninth,";
asv[13] = "Jeremiah the tenth, Machbannai the eleventh.";
asv[14] = "These of the sons of Gad were captains of the host: he that was least was equal to a hundred, and the greatest to a thousand.";
asv[15] = "These are they that went over the Jordan in the first month, when it had overflowed all its banks; and they put to flight all them of the valleys, both toward the east and toward the west.";
asv[16] = "And there came of the children of Benjamin and Judah to the stronghold unto David.";
asv[17] = "And David went out to meet them, and answered and said unto them, If ye be come peaceably unto me to help me, my heart shall be knit unto you; but if [ye be come] to betray me to mine adversaries, seeing there is no wrong in my hands, the God of our fathers look thereon, and rebuke it.";
asv[18] = "Then the Spirit came upon Amasai, who was chief of the thirty, [and he said], Thine are we, David, and on thy side, thou son of Jesse: peace, peace be unto thee, and peace be to thy helpers; for thy God helpeth thee. Then David received them, and made them captains of the band.";
asv[19] = "Of Manasseh also there fell away some to David, when he came with the Philistines against Saul to battle: but they helped them not; for the lords of the Philistines upon advisement sent him away, saying, He will fall away to his master Saul to the jeopardy of our heads.";
asv[20] = "As he went to Ziklag, there fell to him of Manasseh, Adnah, and Jozabad, and Jediael, and Michael, and Jozabad, and Elihu, and Zillethai, captains of thousands that were of Manasseh.";
asv[21] = "And they helped David against the band of rovers: for they were all mighty men of valor, and were captains in the host.";
asv[22] = "For from day to day men came to David to help him, until there was a great host, like the host of God.";
asv[23] = "And these are the numbers of the heads of them that were armed for war, who came to David to Hebron, to turn the kingdom of Saul to him, according to the word of Jehovah.";
asv[24] = "The children of Judah that bare shield and spear were six thousand and eight hundred, armed for war.";
asv[25] = "Of the children of Simeon, mighty men of valor for the war, seven thousand and one hundred.";
asv[26] = "Of the children of Levi four thousand and six hundred.";
asv[27] = "And Jehoiada was the leader of [the house of] Aaron; and with him were three thousand and seven hundred,";
asv[28] = "and Zadok, a young man mighty of valor, and of his father\'s house twenty and two captains.";
asv[29] = "And of the children of Benjamin, the brethren of Saul, three thousand: for hitherto the greatest part of them had kept their allegiance to the house of Saul.";
asv[30] = "And of the children of Ephraim twenty thousand and eight hundred, mighty men of valor, famous men in their fathers\' houses.";
asv[31] = "And of the half-tribe of Manasseh eighteen thousand, who were mentioned by name, to come and make David king.";
asv[32] = "And of the children of Issachar, men that had understanding of the times, to know what Israel ought to do, the heads of them were two hundred; and all their brethren were at their commandment.";
asv[33] = "Of Zebulun, such as were able to go out in the host, that could set the battle in array, with all manner of instruments of war, fifty thousand, and that could order [the battle array, and were] not of double heart.";
asv[34] = "And of Naphtali a thousand captains, and with them with shield and spear thirty and seven thousand.";
asv[35] = "And of the Danites that could set the battle in array, twenty and eight thousand and six hundred.";
asv[36] = "And of Asher, such as were able to go out in the host, that could set the battle in array, forty thousand.";
asv[37] = "And on the other side of the Jordan, of the Reubenites, and the Gadites, and of the half-tribe of Manasseh, with all manner of instruments of war for the battle, a hundred and twenty thousand.";
asv[38] = "All these, being men of war, that could order the battle array, came with a perfect heart to Hebron, to make David king over all Israel: and all the rest also of Israel were of one heart to make David king.";
asv[39] = "And they were there with David three days, eating and drinking; for their brethren had made preparation for them.";
asv[40] = "Moreover they that were nigh unto them, [even] as far as Issachar and Zebulun and Naphtali, brought bread on asses, and on camels, and on mules, and on oxen, victuals of meal, cakes of figs, and clusters of raisins, and wine, and oil, and oxen, and sheep in abundance: for there was joy in Israel.";

hnv[1] = "Now these are those who came to David to Tziklag, while he yet kept himself close because of Sha\'ul the son of Kish; and they were among the mighty men, his helpers in war.";
hnv[2] = "They were armed with bows, and could use both the right hand and the left in slinging stones and in shooting arrows from the bow: they were of Sha\'ul\'s brothers of Binyamin.";
hnv[3] = "The chief was Achi`ezer; then Yo\'ash, the sons of Shema`ah the Giv`atite, and Yezi\'el, and Pelet, the sons of `Azmavet, and Berakha, and Yehu the `Antotite,";
hnv[4] = "and Yishma`yahu the Giv`oni, a mighty man among the thirty, and over the thirty, and Yirmeyahu, and Yachazi\'el, and Yochanan, and Yozavad the Gederatite,";
hnv[5] = "Eluzai, and Yerimot, and Bealiah, and Shemaryahu, and Shefatyah the Harufite,";
hnv[6] = "Elkana, and Yishshiyah, and `Azar\'el, and Yoezer, and Yashov`am, the Korchi,";
hnv[7] = "and Yo`elah, and Zevadyah, the sons of Yerocham of Gedor.";
hnv[8] = "Of the Gadi there separated themselves to David to the stronghold in the wilderness, mighty men of valor, men trained for war, that could handle shield and spear; whose faces were like the faces of lions, and they were as swift as the roes on the mountains;";
hnv[9] = "Etzer the chief, `Ovadyah the second, Eli\'av the third,";
hnv[10] = "Mishmannah the fourth, Yirmeyahu the fifth,";
hnv[11] = " `Attai the sixth, Eli\'el the seventh,";
hnv[12] = "Yochanan the eighth, Elzavad the ninth,";
hnv[13] = "Yirmeyahu the tenth, Makhbannai the eleventh.";
hnv[14] = "These of the sons of Gad were captains of the host: he who was least was equal to one hundred, and the greatest to one thousand.";
hnv[15] = "These are those who went over the Yarden in the first month, when it had overflowed all its banks; and they put to flight all them of the valleys, both toward the east, and toward the west.";
hnv[16] = " There came of the children of Binyamin and Yehudah to the stronghold to David.";
hnv[17] = "David went out to meet them, and answered them, If you be come peaceably to me to help me, my heart shall be knit to you; but if [you be come] to betray me to my adversaries, seeing there is no wrong in my hands, the God of our fathers look thereon, and rebuke it.";
hnv[18] = "Then the Spirit came on `Amasai, who was chief of the thirty, [and he said], Your are we, David, and on your side, you son of Yishai: shalom, shalom be to you, and shalom be to your helpers; for your God helps you. Then David received them, and made them captains of the band.";
hnv[19] = "Of Menashsheh also there fell away some to David, when he came with the Pelishtim against Sha\'ul to battle: but they didn\'t help them; for the lords of the Pelishtim on advise sent him away, saying, He will fall away to his master Sha\'ul to the jeopardy of our heads.";
hnv[20] = "As he went to Tziklag, there fell to him of Menashsheh, `Adnach, and Yozavad, and Yedi`a\'el, and Mikha\'el, and Yozavad, and Elihu, and Tzilletai, captains of thousands who were of Menashsheh.";
hnv[21] = "They helped David against the band of rovers: for they were all mighty men of valor, and were captains in the host.";
hnv[22] = "For from day to day men came to David to help him, until there was a great host, like the host of God.";
hnv[23] = "These are the numbers of the heads of those who were armed for war, who came to David to Hevron, to turn the kingdom of Sha\'ul to him, according to the word of the LORD.";
hnv[24] = " The children of Yehudah who bore shield and spear were six thousand and eight hundred, armed for war.";
hnv[25] = "Of the children of Shim`on, mighty men of valor for the war, seven thousand and one hundred.";
hnv[26] = "Of the children of Levi four thousand and six hundred.";
hnv[27] = " Yehoiada was the leader of [the house of] Aharon; and with him were three thousand and seven hundred,";
hnv[28] = "and Tzadok, a young man mighty of valor, and of his father\'s house twenty-two captains.";
hnv[29] = " Of the children of Binyamin, the brothers of Sha\'ul, three thousand: for hitherto the greatest part of them had kept their allegiance to the house of Sha\'ul.";
hnv[30] = "Of the children of Efrayim twenty thousand eight hundred, mighty men of valor, famous men in their fathers\' houses.";
hnv[31] = "Of the half-tribe of Menashsheh eighteen thousand, who were mentioned by name, to come and make David king.";
hnv[32] = "Of the children of Yissakhar, men who had understanding of the times, to know what Yisra\'el ought to do, the heads of them were two hundred; and all their brothers were at their mitzvah.";
hnv[33] = "Of Zevulun, such as were able to go out in the host, who could set the battle in array, with all manner of instruments of war, fifty thousand, and who could order [the battle array, and were] not of double heart.";
hnv[34] = "Of Naftali one thousand captains, and with them with shield and spear thirty-seven thousand.";
hnv[35] = "Of the Dani who could set the battle in array, twenty-eight thousand six hundred.";
hnv[36] = "Of Asher, such as were able to go out in the host, who could set the battle in array, forty thousand.";
hnv[37] = "On the other side of the Yarden, of the Re\'uveni, and the Gadi, and of the half-tribe of Menashsheh, with all manner of instruments of war for the battle, one hundred twenty thousand.";
hnv[38] = " All these being men of war, who could order the battle array, came with a perfect heart to Hevron, to make David king over all Yisra\'el: and all the rest also of Yisra\'el were of one heart to make David king.";
hnv[39] = "They were there with David three days, eating and drinking; for their brothers had made preparation for them.";
hnv[40] = "Moreover those who were near to them, [even] as far as Yissakhar and Zevulun and Naftali, brought bread on donkeys, and on camels, and on mules, and on oxen, victuals of meal, cakes of figs, and clusters of raisins, and wine, and oil, and oxen, and sheep in abundance: for there was joy in Yisra\'el.";

rsv[1] = "Now these are the men who came to David at Ziklag, while he could not move about freely because of Saul the son of Kish; and they were among the mighty men who helped him in war.";
rsv[2] = "They were bowmen, and could shoot arrows and sling stones with either the right or the left hand; they were Benjaminites, Saul\'s kinsmen.";
rsv[3] = "The chief was Ahi-e\'zer, then Jo\'ash, both sons of Shema\'ah of Gib\'e-ah; also Je\'zi-el and Pelet the sons of Az\'maveth; Ber\'acah, Jehu of An\'athoth,";
rsv[4] = "Ishma\'iah of Gibeon, a mighty man among the thirty and a leader over the thirty; Jeremiah, Jaha\'ziel, Joha\'nan, Joz\'abad of Gede\'rah,";
rsv[5] = "Elu\'zai, Jer\'imoth, Beali\'ah, Shemari\'ah, Shephati\'ah the Har\'uphite;";
rsv[6] = "Elka\'nah, Isshi\'ah, Az\'arel, Jo-e\'zer, and Jasho\'be-am, the Ko\'rahites;";
rsv[7] = "and Joe\'lah and Zebadi\'ah, the sons of Jero\'ham of Gedor.";
rsv[8] = "From the Gadites there went over to David at the stronghold in the wilderness mighty and experienced warriors, expert with shield and spear, whose faces were like the faces of lions, and who were swift as gazelles upon the mountains:";
rsv[9] = "Ezer the chief, Obadi\'ah second, Eli\'ab third,";
rsv[10] = "Mishman\'nah fourth, Jeremiah fifth,";
rsv[11] = "Attai sixth, Eli\'el seventh,";
rsv[12] = "Joha\'nan eighth, Elza\'bad ninth,";
rsv[13] = "Jeremiah tenth, Mach\'bannai eleventh.";
rsv[14] = "These Gadites were officers of the army, the lesser over a hundred and the greater over a thousand.";
rsv[15] = "These are the men who crossed the Jordan in the first month, when it was overflowing all its banks, and put to flight all those in the valleys, to the east and to the west.";
rsv[16] = "And some of the men of Benjamin and Judah came to the stronghold to David.";
rsv[17] = "David went out to meet them and said to them, &quot;If you have come to me in friendship to help me, my heart will be knit to you; but if to betray me to my adversaries, although there is no wrong in my hands, then may the God of our fathers see and rebuke you.&quot;";
rsv[18] = "Then the Spirit came upon Ama\'sai, chief of the thirty, and he said, &quot;We are yours, O David; and with you, O son of Jesse! Peace, peace to you, and peace to your helpers! For your God helps you.&quot; Then David received them, and made them officers of his troops.";
rsv[19] = "Some of the men of Manas\'seh deserted to David when he came with the Philistines for the battle against Saul. (Yet he did not help them, for the rulers of the Philistines took counsel and sent him away, saying, &quot;At peril to our heads he will desert to his master Saul.&quot;)";
rsv[20] = "As he went to Ziklag these men of Manas\'seh deserted to him: Adnah, Joz\'abad, Jedi\'a-el, Michael, Joz\'abad, Eli\'hu, and Zil\'lethai, chiefs of thousands in Manas\'seh.";
rsv[21] = "They helped David against the band of raiders; for they were all mighty men of valor, and were commanders in the army.";
rsv[22] = "For from day to day men kept coming to David to help him, until there was a great army, like an army of God.";
rsv[23] = "These are the numbers of the divisions of the armed troops, who came to David in Hebron, to turn the kingdom of Saul over to him, according to the word of the LORD.";
rsv[24] = "The men of Judah bearing shield and spear were six thousand eight hundred armed troops.";
rsv[25] = "Of the Simeonites, mighty men of valor for war, seven thousand one hundred.";
rsv[26] = "Of the Levites four thousand six hundred.";
rsv[27] = "The prince Jehoi\'ada, of the house of Aaron, and with him three thousand seven hundred.";
rsv[28] = "Zadok, a young man mighty in valor, and twenty-two commanders from his own father\'s house.";
rsv[29] = "Of the Benjaminites, the kinsmen of Saul, three thousand, of whom the majority had hitherto kept their allegiance to the house of Saul.";
rsv[30] = "Of the E\'phraimites twenty thousand eight hundred, mighty men of valor, famous men in their fathers\' houses.";
rsv[31] = "Of the half-tribe of Manas\'seh eighteen thousand, who were expressly named to come and make David king.";
rsv[32] = "Of Is\'sachar men who had understanding of the times, to know what Israel ought to do, two hundred chiefs, and all their kinsmen under their command.";
rsv[33] = "Of Zeb\'ulun fifty thousand seasoned troops, equipped for battle with all the weapons of war, to help David with singleness of purpose.";
rsv[34] = "Of Naph\'tali a thousand commanders with whom were thirty-seven thousand men armed with shield and spear.";
rsv[35] = "Of the Danites twenty-eight thousand six hundred men equipped for battle.";
rsv[36] = "Of Asher forty thousand seasoned troops ready for battle.";
rsv[37] = "Of the Reubenites and Gadites and the half-tribe of Manas\'seh from beyond the Jordan, one hundred and twenty thousand men armed with all the weapons of war.";
rsv[38] = "All these, men of war, arrayed in battle order, came to Hebron with full intent to make David king over all Israel; likewise all the rest of Israel were of a single mind to make David king.";
rsv[39] = "And they were there with David for three days, eating and drinking, for their brethren had made preparation for them.";
rsv[40] = "And also their neighbors, from as far as Is\'sachar and Zeb\'ulun and Naph\'tali, came bringing food on asses and on camels and on mules and on oxen, abundant provisions of meal, cakes of figs, clusters of raisins, and wine and oil, oxen and sheep, for there was joy in Israel.";
vul[1] = "hii quoque venerunt ad David in Siceleg cum adhuc fugeret Saul filium Cis qui erant fortissimi et egregii pugnatores";
vul[2] = "tendentes arcum et utraque manu fundis saxa iacientes et dirigentes sagittas de fratribus Saul ex Beniamin";
vul[3] = "princeps Ahiezer et Ioas filii Sammaa Gabathites et Iazihel et Phallet filii Azmoth et Baracha et Ieu Anathothites";
vul[4] = "Samaias quoque Gabaonites fortissimus inter triginta et super triginta Hieremias et Iezihel et Iohanan et Iezbad Gaderothites";
vul[5] = "Eluzai et Ierimuth et Baalia et Samaria et Saphatia Aruphites";
vul[6] = "Helcana et Iesia et Azrahel et Ioezer et Iesbaam de Careim";
vul[7] = "Ioeela quoque et Zabadia filii Ieroam de Gedor";
vul[8] = "sed et de Gaddi transfugerunt ad David cum lateret in deserto viri robustissimi et pugnatores optimi tenentes clypeum et hastam facies eorum quasi facies leonis et veloces quasi capreae in montibus";
vul[9] = "Ezer princeps Obdias secundus Eliab tertius";
vul[10] = "Masmana quartus Hieremias quintus";
vul[11] = "Hetthi sextus Helihel septimus";
vul[12] = "Iohanan octavus Helzebad nonus";
vul[13] = "Hieremias decimus Bachannai undecimus";
vul[14] = "hii de filiis Gad principes exercitus novissimus centum militibus praeerat et maximus mille";
vul[15] = "isti sunt qui transierunt Iordanem mense primo quando inundare consuevit super ripas suas et omnes fugaverunt qui morabantur in vallibus ad orientalem plagam et occidentalem";
vul[16] = "venerunt autem et de Beniamin et de Iuda ad praesidium in quo morabatur David";
vul[17] = "egressusque est David obviam eis et ait si pacifice venistis ad me ut auxiliemini mihi cor meum iungatur vobis si autem insidiamini mihi pro adversariis meis cum ego iniquitatem in manibus non habeam videat Deus patrum nostrorum et iudicet";
vul[18] = "spiritus vero induit Amessai principem inter triginta et ait tui sumus o David et tecum fili Isai pax pax tibi et pax adiutoribus tuis te enim adiuvat Deus tuus suscepit ergo eos David et constituit principes turmae";
vul[19] = "porro de Manasse transfugerunt ad David quando veniebat cum Philisthim adversum Saul ut pugnaret et non dimicavit cum eis quia inito consilio remiserunt eum principes Philisthinorum dicentes periculo capitis nostri revertetur ad dominum suum Saul";
vul[20] = "quando igitur reversus est in Siceleg transfugerunt ad eum de Manasse Ednas et Iozabad et Iedihel et Michahel et Iozabad et Heliu et Salathi principes milium in Manasse";
vul[21] = "hii praebuerunt auxilium David adversum latrunculos omnes enim erant viri fortissimi et facti sunt principes in exercitu";
vul[22] = "sed et per singulos dies veniebant ad David ad auxiliandum ei usque dum fieret grandis numerus quasi exercitus Dei";
vul[23] = "iste quoque est numerus principum exercitus qui venerunt ad David cum esset in Hebron ut transferrent regnum Saul ad eum iuxta verbum Domini";
vul[24] = "filii Iuda portantes clypeum et hastam sex milia octingenti expediti ad proelium";
vul[25] = "de filiis Symeon virorum fortissimorum ad pugnandum septem milia centum";
vul[26] = "de filiis Levi quattuor milia sescenti";
vul[27] = "Ioiada quoque princeps de stirpe Aaron et cum eo tria milia septingenti";
vul[28] = "Sadoc etiam puer egregiae indolis et domus patris eius principes viginti duo";
vul[29] = "de filiis autem Beniamin fratribus Saul tria milia magna enim pars eorum adhuc sequebatur domum Saul";
vul[30] = "porro de filiis Ephraim viginti milia octingenti fortissimi robore viri nominati in cognationibus suis";
vul[31] = "et ex dimidia parte tribus Manasse decem et octo milia singuli per nomina sua venerunt ut constituerent regem David";
vul[32] = "de filiis quoque Isachar viri eruditi qui norant singula tempora ad praecipiendum quid facere deberet Israhel principes ducenti omnis autem reliqua tribus eorum consilium sequebatur";
vul[33] = "porro de Zabulon qui egrediebantur ad proelium et stabant in acie instructi armis bellicis quinquaginta milia venerunt in auxilium non in corde duplici";
vul[34] = "et de Nepthali principes mille et cum eis instructa clypeo et hasta triginta septem milia";
vul[35] = "de Dan etiam praeparata ad proelium viginti octo milia sescentorum";
vul[36] = "et de Aser egredientes ad pugnam et in acie provocantes quadraginta milia";
vul[37] = "trans Iordanem autem de filiis Ruben et Gad et dimidia parte tribus Manasse instructa armis bellicis centum viginti milia";
vul[38] = "omnes isti viri bellatores et expediti ad pugnandum corde perfecto venerunt in Hebron ut constituerent regem David super universum Israhel sed et omnes reliqui ex Israhel uno corde erant ut rex fieret David";
vul[39] = "fueruntque ibi apud David tribus diebus comedentes et bibentes praeparaverunt enim eis fratres sui";
vul[40] = "sed et qui iuxta eos erant usque ad Isachar et Zabulon et Nepthalim adferebant panes in asinis et camelis et mulis et bubus ad vescendum farinam palatas uvam passam vinum oleum boves arietes ad omnem copiam gaudium quippe erat in Israhel";
web[1] = "Now these [are] they that came to David to Ziklag, while he yet kept himself close because of Saul the son of Kish: and they [were] among the mighty men, helpers of the war.";
web[2] = "[They were] armed with bows, and could use both the right hand and the left in [hurling] stones, and [shooting] arrows from a bow, [even] of Saul\'s brethren of Benjamin.";
web[3] = "The chief [was] Ahiezer, then Joash, the sons of Shemaah the Gibeathite; and Jeziel, and Pelet, the sons of Azmaveth; and Berachah, and Jehu the Antothite,";
web[4] = "And Ismaiah the Gibeonite, a mighty man among the thirty, and over the thirty; and Jeremiah, and Jahaziel, and Johanan, and Josabad the Gederathite,";
web[5] = "Eluzai, and Jerimoth, and Bealiah, and Shemariah, and Shephatiah the Haruphite,";
web[6] = "Elkanah, and Jesiah, and Azareel, and Joezer, and Jashobeam, the Korhites.";
web[7] = "And Joelah, and Zebadiah, the sons of Jeroham of Gedor.";
web[8] = "And of the Gadites there separated themselves to David in the hold in the wilderness men of might, [and] men of war [fit] for the battle, that could handle shield and buckler, whose faces [were like] the faces of lions, and [were] as swift as the roes upon the mountains;";
web[9] = "Ezer the first, Obadiah the second, Eliab the third,";
web[10] = "Mishmannah the fourth, Jeremiah the fifth,";
web[11] = "Attai the sixth, Eliel the seventh,";
web[12] = "Johanan the eighth, Elzabad the ninth,";
web[13] = "Jeremiah the tenth, Machbanai the eleventh.";
web[14] = "These [were] of the sons of Gad, captains of the host: one of the least [was] over a hundred, and the greatest over a thousand.";
web[15] = "These [are] they that went over Jordan in the first month, when it had overflowed all its banks; and they put to flight all [them] of the valleys, [both] towards the east, and towards the west.";
web[16] = "And there came of the children of Benjamin and Judah to the hold to David.";
web[17] = "And David went out to meet them, and answered and said to them, If ye have come peaceably to me to help me, my heart shall be knit to you: but if [ye have come] to betray me to my enemies, seeing [there is] no wrong in my hands, the God of our fathers look [on it], and rebuke [it].";
web[18] = "Then the spirit came upon Amasai, [who was] chief of the captains, [and he said], Thine [are we], David, and on thy side, thou son of Jesse: peace, peace [be] to thee, and peace [be] to thy helpers; for thy God helpeth thee. Then David received them, and made them captains of the band.";
web[19] = "And there fell [some] of Manasseh to David, when he came with the Philistines against Saul to battle: but they helped them not: for the lords of the Philistines upon advisement sent him away, saying, He will fall to his master Saul to [the jeopardy of] our heads.";
web[20] = "And as he went to Ziklag, there fell to him of Manasseh, Adnah, and Jozabad, and Jediael, and Michael, and Jozabad, and Elihu, and Zilthai, captains of the thousands that [were] of Manasseh.";
web[21] = "And they helped David against the band [of the rovers]: for they [were] all mighty men of valor, and were captains in the host.";
web[22] = "For at [that] time day by day there came to David to help him, until [it was] a great host, like the host of God.";
web[23] = "And these [are] the numbers of the bands [that were] ready armed to the war, [and] came to David to Hebron, to turn the kingdom of Saul to him, according to the word of the LORD.";
web[24] = "The children of Judah that bore shield and spear [were] six thousand and eight hundred, ready armed for war.";
web[25] = "Of the children of Simeon, mighty men of valor for war, seven thousand and one hundred.";
web[26] = "Of the children of Levi four thousand and six hundred.";
web[27] = "And Jehoiada [was] the leader of the Aaronites, and with him [were] three thousand and seven hundred;";
web[28] = "And Zadok, a young man mighty of valor, and of his father\'s house twenty and two captains.";
web[29] = "And of the children of Benjamin, the kindred of Saul, three thousand: for hitherto the greatest part of them had kept the ward of the house of Saul.";
web[30] = "And of the children of Ephraim twenty thousand and eight hundred, mighty men of valor, famous throughout the house of their fathers.";
web[31] = "And of the half tribe of Manasseh eighteen thousand, who were expressed by name, to come and make David king.";
web[32] = "And of the children of Issachar, [who were men] that had understanding of the times, to know what Israel ought to do; the heads of them [were] two hundred; and all their brethren [were] at their command.";
web[33] = "Of Zebulun, such as went forth to battle, expert in war, with all instruments of war, fifty thousand, who could keep rank: [they were] not of double heart.";
web[34] = "And of Naphtali a thousand captains, and with them with shield and spear thirty and seven thousand.";
web[35] = "And of the Danites expert in war twenty and eight thousand and six hundred.";
web[36] = "And of Asher, such as went forth to battle, expert in war, forty thousand.";
web[37] = "And on the other side of Jordan, of the Reubenites, and the Gadites, and of the half tribe of Manasseh, with all manner of instruments of war for the battle, a hundred and twenty thousand.";
web[38] = "All these men of war, that could keep rank, came with a perfect heart to Hebron, to make David king over all Israel: and all the rest also of Israel [were] of one heart to make David king.";
web[39] = "And there they were with David three days, eating and drinking: for their brethren had prepared for them.";
web[40] = "Moreover, they that were nigh them, [even] to Issachar, and Zebulun, and Naphtali, brought bread on asses, and on camels, and on mules, and on oxen, [and] provision, meal, cakes of figs, and bunches of raisins, and wine, and oil, and oxen, and sheep abundantly: for [there was] joy in Israel.";
yng[1] = "And these [are] those coming in unto David to Ziklag, while shut up because of Saul son of Kish, and they [are] among the mighty ones, helping the battle,";
yng[2] = "armed with bow, right and left handed, with stones, and with arrows, with bows, of the brethren of Saul, of Benjamin.";
yng[3] = "The head [is] Ahiezer, and Joash, sons of Shemaab the Gibeathite, and Jeziel, and Pelet, sons of Azmaveth, and Berachah, and Jehu the Antothite,";
yng[4] = "and Ishmaiah the Gibeonite, a mighty one among the thirty, and over the thirty, and Jeremiah, and Jahaziel, and Johanan, and Josabad the Gederathite.";
yng[5] = "Eluzai, and Jerimoth, and Bealiah, and Shemariah, and Shephatiah the Haruphite;";
yng[6] = "Elkanah, and Jesiah, and Azareel, and Joezer, and Jashobeam the Korhites,";
yng[7] = "and Joelah, and Zebadiah, sons of Jeroham of Gedor.";
yng[8] = "And of the Gadite there have been separated unto David, to the fortress, to the wilderness, mighty of valour, men of the host for battle, setting in array target and buckler, and their faces the face of the lion, and as roes on the mountains for speed:";
yng[9] = "Ezer the head, Obadiah the second, Eliab the third,";
yng[10] = "Mishmannah the fourth, Jeremiah the fifth,";
yng[11] = "Attai the sixth, Eliel the seventh,";
yng[12] = "Johanan the eighth, Elzabad the ninth,";
yng[13] = "Jeremiah the tenth, Machbannai the eleventh.";
yng[14] = "These [are] of the sons of Gad, heads of the host, one of a hundred [is] the least, and the greatest, of a thousand;";
yng[15] = "these [are] they who have passed over the Jordan in the first month, -- and it is full over all its banks -- and cause all [they of] the valley to flee to the east and to the west.";
yng[16] = "And there come of the sons of Benjamin and Judah unto the stronghold to David,";
yng[17] = "and David goeth out before them, and answereth and saith to them, `If for peace ye have come in unto me, to help me, I have a heart to unite with you; and if to betray me to mine adversaries -- without violence in my hands -- the God of our fathers doth see and reprove.\'";
yng[18] = "And the Spirit hath clothed Amasai, head of the captains: `To thee, O David, and with thee, O son of Jesse -- peace! peace to thee, and peace to thy helper, for thy God hath helped thee;\' and David receiveth them, and putteth them among the heads of the troop.";
yng[19] = "And of Manasseh there have fallen unto David in his coming with the Philistines against Israel to battle -- and they helped them not, for by counsel the princes of the Philistines sent him away, saying, `With our heads he doth fall unto his master Saul.\' --";
yng[20] = "In his going unto Ziglag there have fallen unto him of Manasseh, Adnah, and Jozabad, and Jediael, and Michael, and Jozabad, and Elihu, and Zillthai, heads of the thousands that [are] of Manasseh;";
yng[21] = "and they have helped with David over the troop, for mighty of valour [are] all of them, and they are captains in the host,";
yng[22] = "for at that time, day by day, they come in unto David to help him, till it is a great camp, like a camp of God.";
yng[23] = "And these [are] the numbers of the head, of the armed men of the host; they have come in unto David to Hebron to turn round the kingdom of Saul unto him, according to the mouth of Jehovah.";
yng[24] = "The sons of Judah, bearing target and spear, [are] six thousand and eight hundred, armed ones of the host.";
yng[25] = "Of the sons of Simeon, mighty ones of valour for the host, [are] seven thousand and a hundred.";
yng[26] = "Of the sons of Levi [are] four thousand and six hundred;";
yng[27] = "and Jehoiada [is] the leader of the Aaronite, and with him [are] three thousand and seven hundred,";
yng[28] = "and Zadok, a young man, mighty of valour, and of the house of his father [are] twenty and two heads.";
yng[29] = "And of the sons of Benjamin, brethren of Saul, [are] three thousand, and hitherto their greater part are keeping the charge of the house of Saul.";
yng[30] = "And of the sons of Ephraim [are] twenty thousand and eight hundred, mighty of valour, men of name, according to the house of their fathers.";
yng[31] = "And of the half of the tribe of Manasseh [are] eighteen thousand, who have been defined by name, to come in to cause David to reign.";
yng[32] = "And of the sons of Issachar, having understanding for the times, to know what Israel should do; their heads [are] two hundred, and all their brethren [are] at their command.";
yng[33] = "Of Zebulun, going forth to the host, arranging battle with all instruments of battle, [are] fifty thousand, and keeping rank without a double heart.";
yng[34] = "And of Naphtali, a thousand heads, and with them, with target and spear, [are] thirty and seven thousand.";
yng[35] = "And of the Danite, arranging battle, [are] twenty and eight thousand and six hundred.";
yng[36] = "And of Asher, going forth to the host, to arrange battle, [are] forty thousand.";
yng[37] = "And from beyond the Jordan, of the Reubenite, and of the Gadite, and of the half of the tribe of Manasseh, with all instruments of the host for battle, [are] a hundred and twenty thousand.";
yng[38] = "All these [are] men of war, keeping rank -- with a perfect heart they have come to Hebron, to cause David to reign over all Israel, and also all the rest of Israel [are] of one heart, to cause David to reign,";
yng[39] = "and they are there, with David, three days, eating and drinking, for their brethren have prepared for them.";
yng[40] = "And also those near unto them, unto Issachar, and Zebulun, and Naphtali, are bringing in bread on asses, and on camels, and on mules, and on oxen -- food of fine flour, fig-cakes and grape-cakes, and wine, and oil, and oxen, and sheep, in abundance, for joy [is] in Israel.";
csb[1] = "The following were the men who came to David at Ziklag while he was still banned from the presence of Saul son of Kish. They were among the warriors who helped him in battle.";
csb[2] = "They were archers who could use either the right or left hand, both to sling stones and shoot arrows from a bow. They were Saul\'s relatives from Benjamin:";
csb[3] = "Their chief was Ahiezer son of Shemaah the Gibeathite. Then there was his brother Joash; Jeziel and Pelet sons of Azmaveth; Beracah, Jehu the Anathothite;";
csb[4] = "Ishmaiah the Gibeonite, a warrior among the Thirty and a leader over the Thirty; Jeremiah, Jahaziel, Johanan, Jozabad the Gederathite;";
csb[5] = "Eluzai, Jerimoth, Bealiah, Shemariah, Shephatiah the Haruphite;";
csb[6] = "Elkanah, Isshiah, Azarel, Joezer, and Jashobeam, the Korahites;";
csb[7] = "and Joelah and Zebadiah, the sons of Jeroham from Gedor.";
csb[8] = "Some Gadites defected to David at his stronghold in the desert. They were valiant warriors, trained for battle, expert with shield and spear. Their faces were like the faces of lions, and they were as swift as gazelles on the mountains.";
csb[9] = "Ezer was the chief, Obadiah second, Eliab third,";
csb[10] = "Mishmannah fourth, Jeremiah fifth,";
csb[11] = "Attai sixth, Eliel seventh,";
csb[12] = "Johanan eighth, Elzabad ninth,";
csb[13] = "Jeremiah tenth, and Machbannai eleventh.";
csb[14] = "These Gadites were army commanders; the least of them was a match for a hundred, and the greatest of them for a thousand.";
csb[15] = "These are the men who crossed the Jordan in the first month when it was overflowing all its banks, and put to flight all those in the valleys to the east and to the west.";
csb[16] = "Other Benjaminites and men from Judah also went to David at the stronghold.";
csb[17] = "David went out to meet them and said to them, &quot;If you have come in peace to help me, my heart will be united with you, but if you have come to betray me to my enemies even though my hands have done no wrong, may the God of our ancestors look on it and judge.&quot;";
csb[18] = "Then the Spirit enveloped Amasai, chief of the Thirty, and he said: We are yours, David, we are with you, son of Jesse! Peace, peace to you, and peace to him who helps you, for your God helps you. So David received them and made them leaders of his troops.";
csb[19] = "Some Manassites defected to David when he went with the Philistines to fight against Saul. However, they did not help the Philistines because the Philistine rulers sent David away after a discussion. They said, &quot;It will be our heads if he defects to his master Saul.&quot;";
csb[20] = "When David went to Ziklag, some men from Manasseh defected to him: Adnah, Jozabad, Jediael, Michael, Jozabad, Elihu, and Zillethai, chiefs of thousands in Manasseh.";
csb[21] = "They helped David against the raiders, for they were all valiant warriors and commanders in the army.";
csb[22] = "At that time, men came day after day to help David until there was a great army, like an army of God.";
csb[23] = "The numbers of the armed troops who came to David at Hebron to turn Saul\'s kingdom over to him, according to the LORD\'s word, were as follows:";
csb[24] = "From the Judahites: 6,800 armed troops bearing shields and spears.";
csb[25] = "From the Simeonites: 7,100 valiant warriors ready for war.";
csb[26] = "From the Levites: 4,600";
csb[27] = "in addition to Jehoiada, leader of the house of Aaron, with 3,700 men;";
csb[28] = "and Zadok, a young valiant warrior, with 22 commanders from his father\'s family.";
csb[29] = "From the Benjaminites, the relatives of Saul: 3,000 (up to that time the majority of the Benjaminites maintained their allegiance to the house of Saul).";
csb[30] = "From the Ephraimites: 20,800 valiant warriors who were famous men in their ancestral families.";
csb[31] = "From half the tribe of Manasseh: 18,000 designated by name to come and make David king.";
csb[32] = "From the Issacharites, who understood the times and knew what Israel should do: 200 chiefs with all their relatives under their command.";
csb[33] = "From Zebulun: 50,000 who could serve in the army, trained for battle with all kinds of weapons of war, with one purpose to help David.";
csb[34] = "From Naphtali: 1,000 commanders accompanied by 37,000 men with shield and spear.";
csb[35] = "From the Danites: 28,600 trained for battle.";
csb[36] = "From Asher: 40,000 who could serve in the army, trained for battle.";
csb[37] = "From across the Jordan -- from the Reubenites, Gadites, and half the tribe of Manasseh: 120,000 men equipped with all the military weapons of war.";
csb[38] = "All these warriors, lined up in battle formation, came to Hebron wholeheartedly determined to make David king over all Israel. All the rest of Israel was also of one mind to make David king.";
csb[39] = "They spent three days there eating and drinking with David, for their relatives had provided for them.";
csb[40] = "In addition, their neighbors from as far away as Issachar, Zebulun, and Naphtali came and brought food on donkeys, camels, mules, and oxen -- abundant provisions of flour, fig cakes, raisins, wine and oil, herds, and flocks. Indeed, there was joy in Israel.";
</script>
