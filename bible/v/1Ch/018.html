asv[1] = "And after this it came to pass, that David smote the Philistines, and subdued them, and took Gath and its towns out of the hand of the Philistines.";
asv[2] = "And he smote Moab; and the Moabites became servants to David, and brought tribute.";
asv[3] = "And David smote Hadarezer king of Zobah unto Hamath, as he went to establish his dominion by the river Euphrates.";
asv[4] = "And David took from him a thousand chariots, and seven thousand horsemen, and twenty thousand footmen; and David hocked all the chariot horses, but reserved of them for a hundred chariots.";
asv[5] = "And when the Syrians of Damascus came to succor Hadarezer king of Zobah, David smote of the Syrians two and twenty thousand men.";
asv[6] = "Then David put [garrisons] in Syria of Damascus; and the Syrians became servants to David, and brought tribute. And Jehovah gave victory to David whithersoever he went.";
asv[7] = "And David took the shields of gold that were on the servants of Hadarezer, and brought them to Jerusalem.";
asv[8] = "And from Tibhath and from Cun, cities of Hadarezer, David took very much brass, wherewith Solomon made the brazen sea, and the pillars, and the vessels of brass.";
asv[9] = "And when Tou king of Hamath heard that David had smitten all the host of Hadarezer king of Zobah,";
asv[10] = "he sent Hadoram his son to king David, to salute him, and to bless him, because he had fought against Hadarezer and smitten him (for Hadarezer had wars with Tou); and [he had with him] all manner of vessels of gold and silver and brass.";
asv[11] = "These also did king David dedicate unto Jehovah, with the silver and the gold that he carried away from all the nations; from Edom, and from Moab, and from the children of Ammon, and from the Philistines, and from Amalek.";
asv[12] = "Moreover Abishai the son of Zeruiah smote of the Edomites in the Valley of Salt eighteen thousand.";
asv[13] = "And he put garrisons in Edom; and all the Edomites became servants to David. And Jehovah gave victory to David whithersoever he went.";
asv[14] = "And David reigned over all Israel; and he executed justice and righteousness unto all his people.";
asv[15] = "And Joab the son of Zeruiah was over the host; and Jehoshaphat the son of Ahilud was recorder;";
asv[16] = "and Zadok the son of Ahitub, and Abimelech the son of Abiathar, were priests; and Shavsha was scribe;";
asv[17] = "and Benaiah the son of Jehoiada was over the Cherethites and the Pelethites; and the sons of David were chief about the king.";
dby[1] = "And after this it came to pass that David smote the Philistines, and subdued them, and took Gath and its towns out of the hand of the Philistines.";
dby[2] = "And he smote the Moabites; and the Moabites became David\'s servants, [and] brought gifts.";
dby[3] = "And David smote Hadarezer king of Zobah, at Hamath, as he went to establish his dominion by the river Euphrates.";
dby[4] = "And David took from him a thousand chariots, and seven thousand horsemen, and twenty thousand footmen; and David houghed all the chariot [horses], but reserved of them [for] a hundred chariots.";
dby[5] = "And the Syrians of Damascus came to help Hadarezer king of Zobah, and David smote of the Syrians twenty-two thousand men.";
dby[6] = "And David put [garrisons] in Syria of Damascus; and the Syrians became servants to David, [and] brought gifts. And Jehovah preserved David whithersoever he went.";
dby[7] = "And David took the shields of gold that were on the servants of Hadarezer, and brought them to Jerusalem.";
dby[8] = "And from Tibhath, and from Chun, cities of Hadarezer, David took very much brass, of which Solomon made the brazen sea, and the pillars, and the vessels of brass.";
dby[9] = "And Tou king of Hamath heard that David had smitten all the forces of Hadarezer king of Zobah;";
dby[10] = "and he sent Hadoram his son to king David to inquire of his welfare, and to congratulate him, because he had fought against Hadarezer and smitten him; for Hadarezer was continually at war with Tou; [he sent] also all manner of vessels of gold and silver and bronze.";
dby[11] = "Them also king David dedicated to Jehovah, with the silver and the gold that he had brought from all the nations: from the Edomites, and from the Moabites, and from the children of Ammon, and from the Philistines, and from the Amalekites.";
dby[12] = "And Abishai the son of Zeruiah smote of the Edomites in the valley of salt eighteen thousand.";
dby[13] = "And he put garrisons in Edom; and all they of Edom became servants to David. And Jehovah preserved David whithersoever he went.";
dby[14] = "And David reigned over all Israel, and executed judgment and justice to all his people.";
dby[15] = "And Joab the son of Zeruiah was over the host; and Jehoshaphat the son of Ahilud was chronicler;";
dby[16] = "and Zadok the son of Ahitub, and Abimelech the son of Abiathar, were the priests; and Shavsha was scribe;";
dby[17] = "and Benaiah the son of Jehoiada was over the Cherethites and the Pelethites; and the sons of David were the first at the king\'s hand.";
hnv[1] = "After this it happened, that David struck the Pelishtim, and subdued them, and took Gat and its towns out of the hand of the Pelishtim.";
hnv[2] = "He struck Mo\'av; and the Mo`avim became servants to David, and brought tribute.";
hnv[3] = "David struck Hadad`ezer king of Tzovah to Hamat, as he went to establish his dominion by the river Perat.";
hnv[4] = "David took from him one thousand chariots, and seven thousand horsemen, and twenty thousand footmen; and David hamstrung all the chariot horses, but reserved of them for one hundred chariots.";
hnv[5] = "When the Aram of Dammesek came to help Hadad`ezer king of Tzovah, David struck of the Aram twenty-two thousand men.";
hnv[6] = "Then David put [garrisons] in Aram of Dammesek; and the Aram became servants to David, and brought tribute. The LORD gave victory to David wherever he went.";
hnv[7] = "David took the shields of gold that were on the servants of Hadad`ezer, and brought them to Yerushalayim.";
hnv[8] = "From Tivchat and from Cun, cities of Hadad`ezer, David took very much brass, with which Shlomo made the brazen sea, and the pillars, and the vessels of brass.";
hnv[9] = "When To`u king of Hamat heard that David had struck all the host of Hadad`ezer king of Tzovah,";
hnv[10] = "he sent Hadoram his son to king David, to Greet him, and to bless him, because he had fought against Hadad`ezer and struck him; (for Hadad`ezer had wars with To`u;) and [he had with him] all manner of vessels of gold and silver and brass.";
hnv[11] = "These also did king David dedicate to the LORD, with the silver and the gold that he carried away from all the nations; from Edom, and from Mo\'av, and from the children of `Ammon, and from the Pelishtim, and from `Amalek.";
hnv[12] = "Moreover Avishai the son of Tzeru\'yah struck of the Edom in the Valley of Salt eighteen thousand.";
hnv[13] = "He put garrisons in Edom; and all the Edom became servants to David. The LORD gave victory to David wherever he went.";
hnv[14] = "David reigned over all Yisra\'el; and he executed justice and righteousness to all his people.";
hnv[15] = "Yo\'av the son of Tzeru\'yah was over the host; and Yehoshafat the son of Achilud was recorder;";
hnv[16] = "and Tzadok the son of Achituv, and Avimelekh the son of Avyatar, were Kohanim; and Shavsha was Sofer;";
hnv[17] = "and Benayah the son of Yehoiada was over the Kereti and the Peleti; and the sons of David were chief about the king.";

rsv[1] = "After this David defeated the Philistines and subdued them, and he took Gath and its villages out of the hand of the Philistines.";
rsv[2] = "And he defeated Moab, and the Mo\'abites became servants to David and brought tribute.";
rsv[3] = "David also defeated Hadade\'zer king of Zobah, toward Hamath, as he went to set up his monument at the river Euphra\'tes.";
rsv[4] = "And David took from him a thousand chariots, seven thousand horsemen, and twenty thousand foot soldiers; and David hamstrung all the chariot horses, but left enough for a hundred chariots.";
rsv[5] = "And when the Syrians of Damascus came to help Hadade\'zer king of Zobah, David slew twenty-two thousand men of the Syrians.";
rsv[6] = "Then David put garrisons in Syria of Damascus; and the Syrians became servants to David, and brought tribute. And the LORD gave victory to David wherever he went.";
rsv[7] = "And David took the shields of gold which were carried by the servants of Hadade\'zer, and brought them to Jerusalem.";
rsv[8] = "And from Tibhath and from Cun, cities of Hadade\'zer, David took very much bronze; with it Solomon made the bronze sea and the pillars and the vessels of bronze.";
rsv[9] = "When To\'u king of Hamath heard that David had defeated the whole army of Hadade\'zer, king of Zobah,";
rsv[10] = "he sent his son Hador\'am to King David, to greet him, and to congratulate him because he had fought against Hadade\'zer and defeated him; for Hadade\'zer had often been at war with To\'u. And he sent all sorts of articles of gold, of silver, and of bronze;";
rsv[11] = "these also King David dedicated to the LORD, together with the silver and gold which he had carried off from all the nations, from Edom, Moab, the Ammonites, the Philistines, and Am\'alek.";
rsv[12] = "And Abi\'shai, the son of Zeru\'iah, slew eighteen thousand E\'domites in the Valley of Salt.";
rsv[13] = "And he put garrisons in Edom; and all the E\'domites became David\'s servants. And the LORD gave victory to David wherever he went.";
rsv[14] = "So David reigned over all Israel; and he administered justice and equity to all his people.";
rsv[15] = "And Jo\'ab the son of Zeru\'iah was over the army; and Jehosh\'aphat the son of Ahi\'lud was recorder;";
rsv[16] = "and Zadok the son of Ahi\'tub and Ahim\'elech the son of Abi\'athar were priests; and Shavsha was secretary;";
rsv[17] = "and Benai\'ah the son of Jehoi\'ada was over the Cher\'ethites and the Pel\'ethites; and David\'s sons were the chief officials in the service of the king.";
vul[1] = "factum est autem post haec ut percuteret David Philisthim et humiliaret eos et tolleret Geth et filias eius de manu Philisthim";
vul[2] = "percuteretque Moab et fierent Moabitae servi David offerentes ei munera";
vul[3] = "eo tempore percussit David etiam Adadezer regem Suba regionis Emath quando perrexit ut dilataret imperium suum usque ad flumen Eufraten";
vul[4] = "cepit ergo David mille quadrigas eius et septem milia equites ac viginti milia virorum peditum subnervavitque omnes equos curruum exceptis centum quadrigis quas reservavit sibi";
vul[5] = "supervenit autem et Syrus damascenus ut auxilium praeberet Adadezer regi Suba sed et huius percussit David viginti duo milia virorum";
vul[6] = "et posuit milites in Damasco ut Syria quoque serviret sibi et offerret munera adiuvitque eum Dominus in cunctis ad quae perrexerat";
vul[7] = "tulit quoque David faretras aureas quas habuerant servi Adadezer et adtulit eas in Hierusalem";
vul[8] = "necnon de Thebath et Chun urbibus Adadezer aeris plurimum de quo fecit Salomon mare aeneum et columnas et vasa aenea";
vul[9] = "quod cum audisset Thou rex Emath percussisse videlicet David omnem exercitum Adadezer regis Suba";
vul[10] = "misit Aduram filium suum ad regem David ut postularet ab eo pacem et congratularetur ei eo quod expugnasset et percussisset Adadezer adversarius quippe Thou erat Adadezer";
vul[11] = "sed et omnia vasa aurea et argentea et aenea consecravit rex David Domino cum argento et auro quod tulerat ex universis gentibus tam de Idumea et Moab et filiis Ammon quam de Philisthim et Amalech";
vul[12] = "Abisai vero filius Sarviae percussit Edom in valle Salinarum decem et octo milia";
vul[13] = "et constituit in Edom praesidium ut serviret Idumea David salvavitque Dominus David in cunctis ad quae perrexerat";
vul[14] = "regnavit ergo David super universum Israhel et faciebat iudicium atque iustitiam cuncto populo suo";
vul[15] = "porro Ioab filius Sarviae erat super exercitum et Iosaphat filius Ahilud a commentariis";
vul[16] = "Sadoc autem filius Ahitob et Ahimelech filius Abiathar sacerdotes et Susa scriba";
vul[17] = "Banaias vero filius Ioiada super legiones Cherethi et Felethi porro filii David primi ad manum regis";

yng[1] = "And it cometh to pass after this, that David smiteth the Philistines, and humbleth them, and taketh Gath and its small towns out of the hand of the Philistines;";
yng[2] = "and he smiteth Moab, and the Moabites are servants to David, bringing a present.";
yng[3] = "And David smiteth Hadarezer king of Zobah, at Hamath, in his going to establish his power by the river Phrat,";
yng[4] = "and David captureth from him a thousand chariots, and seven thousand horsemen, and twenty thousand footmen, and David destroyeth utterly all the chariots, and leaveth of them a hundred chariots [only].";
yng[5] = "And Aram of Damascus cometh in to give help to Hadarezer king of Zobah, and David smiteth in Aram twenty and two thousand men,";
yng[6] = "and David putteth [garrisons] in Aram of Damascus, and the Aramaeans are to David for servants, bearing a present, and Jehovah giveth salvation to David whithersoever he hath gone.";
yng[7] = "And David taketh the shields of gold that have been on the servants of Hadarezer, and bringeth them in to Jerusalem;";
yng[8] = "and from Tibhath, and from Chun, cities of Hadarezer, hath David taken very much brass; with it hath Solomon made the brazen sea, and the pillars, and the vessels of brass.";
yng[9] = "And Tou king of Hamath heareth that David hath smitten the whole force of Hadarezer king of Zobah,";
yng[10] = "and he sendeth Hadoram his son unto king David, to ask of him of peace, and to bless him (because that he hath fought against Hadarezer, and smiteth him, for a man of wars with Tou had Hadarezer been,) and all kinds of vessels, of gold, and silver, and brass;";
yng[11] = "also them hath king David sanctified to Jehovah with the silver and the gold that he hath taken from all the nations, from Edom, and from Moab, and from the sons of Ammon, and from the Philistines, and from Amalek.";
yng[12] = "And Abishai son of Zeruiah hath smitten Edom in the valley of salt -- eighteen thousand,";
yng[13] = "and he putteth in Edom garrisons, and all the Edomites are servants to David; and Jehovah saveth David whithersoever he hath gone.";
yng[14] = "And David reigneth over all Israel, and he is doing judgment and righteousness to all his people,";
yng[15] = "and Joab son of Zeruiah [is] over the host, and Jehoshaphat son of Ahilud [is] remembrancer,";
yng[16] = "and Zadok son of Ahitub, and Abimelech son of Abiathar, [are] priests, and Shavsha [is] scribe,";
yng[17] = "and Benaiah son of Jehoiada [is] over the Cherethite and the Pelethite, and the elder sons of David [are] at the hand of the king.";
csb[1] = "After this, David defeated the Philistines, subdued them, and took Gath and its surrounding villages from Philistine control.";
csb[2] = "He also defeated the Moabites, and they became David\'s subjects and brought tribute.";
csb[3] = "David also defeated King Hadadezer of Zobah at Hamath when he went to establish his control at the Euphrates River.";
csb[4] = "David captured one thousand chariots, seven thousand horsemen, and twenty thousand foot soldiers from him, hamstrung all the horses, and kept a hundred chariots.";
csb[5] = "When the Arameans of Damascus came to assist King Hadadezer of Zobah, David struck down twenty-two thousand Aramean men.";
csb[6] = "Then he placed garrisons in Aram of Damascus, and the Arameans became David\'s subjects and brought tribute. The LORD made David victorious wherever he went.";
csb[7] = "David took the gold shields carried by Hadadezer\'s officers and brought them to Jerusalem.";
csb[8] = "From Tibhath and Cun, Hadadezer\'s cities, David also took huge quantities of bronze, from which Solomon made the bronze basin, the pillars, and the bronze articles.";
csb[9] = "When King Tou of Hamath heard that David had defeated the entire army of King Hadadezer of Zobah,";
csb[10] = "he sent his son Hadoram to King David to greet him and to congratulate him because David had fought against Hadadezer and defeated him, for Tou and Hadadezer had fought many wars. Hadoram brought all kinds of gold, silver, and bronze items.";
csb[11] = "King David also dedicated these to the LORD, along with the silver and gold he had carried off from all the nations -- from Edom, Moab, the Ammonites, the Philistines, and the Amalekites.";
csb[12] = "Abishai son of Zeruiah struck down eighteen thousand Edomites in the Salt Valley.";
csb[13] = "He put garrisons in Edom, and all the Edomites were subject to David. The LORD made David victorious wherever he went.";
csb[14] = "So David reigned over all Israel, administering justice and righteousness for all his people.";
csb[15] = "Joab son of Zeruiah was over the army; Jehoshaphat son of Ahilud was court historian;";
csb[16] = "Zadok son of Ahitub and Ahimelech son of Abiathar were priests; Shavsha was court secretary;";
csb[17] = "Benaiah son of Jehoiada was over the Cherethites and the Pelethites; and David\'s sons were the chief officials at the king\'s side.";
