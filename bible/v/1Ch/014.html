asv[1] = "And Hiram king of Tyre sent messengers to David, and cedar-trees, and masons, and carpenters, to build him a house.";
asv[2] = "And David perceived that Jehovah had established him king over Israel; for his kingdom was exalted on high, for his people Israel\'s sake.";
asv[3] = "And David took more wives at Jerusalem; and David begat more sons and daughters.";
asv[4] = "And these are the names of the children whom he had in Jerusalem: Shammua, and Shobab, Nathan, and Solomon,";
asv[5] = "and Ibhar, and Elishua, and Elpelet,";
asv[6] = "and Nogah, and Nepheg, and Japhia,";
asv[7] = "and Elishama, and Beeliada, and Eliphelet.";
asv[8] = "And when the Philistines heard that David was anointed king over all Israel, all the Philistines went up to seek David: and David heard of it, and went out against them.";
asv[9] = "Now the Philistines had come and made a raid in the valley of Rephaim.";
asv[10] = "And David inquired of God, saying, Shall I go up against the Philistines? and wilt thou deliver them into my hand? And Jehovah said unto him, Go up; for I will deliver them into thy hand.";
asv[11] = "So they came up to Baal-perazim, and David smote them there; and David said, God hath broken mine enemies by my hand, like the breach of waters. Therefore they called the name of that place Baal-perazim.";
asv[12] = "And they left their gods there; and David gave commandment, and they were burned with fire.";
asv[13] = "And the Philistines yet again made a raid in the valley.";
asv[14] = "And David inquired again of God; and God said unto him, Thou shalt not go up after them: turn away from them, and come upon them over against the mulberry-trees.";
asv[15] = "And it shall be, when thou hearest the sound of marching in the tops of the mulberry-trees, that then thou shalt go out to battle; for God is gone out before thee to smite the host of the Philistines.";
asv[16] = "And David did as God commanded him: and they smote the host of the Philistines from Gibeon even to Gezer.";
asv[17] = "And the fame of David went out into all lands; and Jehovah brought the fear of him upon all nations.";

hnv[1] = "Hiram king of Tzor sent messengers to David, and cedar trees, and masons, and carpenters, to build him a house.";
hnv[2] = "David perceived that the LORD had established him king over Yisra\'el; for his kingdom was exalted on high, for his people Yisra\'el\'s sake.";
hnv[3] = " David took more wives at Yerushalayim; and David became the father of more sons and daughters.";
hnv[4] = "These are the names of the children whom he had in Yerushalayim: Shammua, and Shovav, Natan, and Shlomo,";
hnv[5] = "and Yivchar, and Elishua, and Elpelet,";
hnv[6] = "and Nogah, and Nefeg, and Yafia,";
hnv[7] = "and Elishama, and Be`elyada, and Elifelet.";
hnv[8] = "When the Pelishtim heard that David was anointed king over all Yisra\'el, all the Pelishtim went up to seek David: and David heard of it, and went out against them.";
hnv[9] = "Now the Pelishtim had come and made a raid in the valley of Refa\'im.";
hnv[10] = "David inquired of God, saying, Shall I go up against the Pelishtim? and will you deliver them into my hand? the LORD said to him, Go up; for I will deliver them into your hand.";
hnv[11] = "So they came up to Ba`al-Peratzim, and David struck them there; and David said, God has broken my enemies by my hand, like the breach of waters. Therefore they called the name of that place Ba`al-Peratzim.";
hnv[12] = "They left their gods there; and David gave mitzvah, and they were burned with fire.";
hnv[13] = "The Pelishtim yet again made a raid in the valley.";
hnv[14] = "David inquired again of God; and God said to him, You shall not go up after them: turn away from them, and come on them over against the mulberry trees.";

hnv[16] = "David did as God commanded him: and they struck the host of the Pelishtim from Giv`on even to Gezer.";
hnv[17] = "The fame of David went out into all lands; and the LORD brought the fear of him on all nations.";

vul[1] = "misit quoque Hiram rex Tyri nuntios ad David et ligna cedrina et artifices parietum lignorumque ut aedificarent ei domum";
vul[2] = "cognovitque David eo quod confirmasset eum Dominus in regem super Israhel et sublevatum esset regnum suum super populum eius Israhel";
vul[3] = "accepit quoque David alias uxores in Hierusalem genuitque filios et filias";
vul[4] = "et haec nomina eorum qui nati sunt ei in Hierusalem Sammu et Sobab Nathan et Salomon";
vul[5] = "Iebar et Helisu et Eliphaleth";
vul[6] = "Noga quoque et Napheg et Iaphiae";
vul[7] = "Elisama et Baliada et Eliphaleth";
vul[8] = "audientes autem Philisthim eo quod unctus esset David in regem super universum Israhel ascenderunt omnes ut quaererent eum quod cum audisset David egressus est obviam eis";
vul[9] = "porro Philisthim venientes diffusi sunt in valle Raphaim";
vul[10] = "consuluitque David Deum dicens si ascendam ad Philistheos si trades eos in manu mea et dixit ei Dominus ascende et tradam eos in manu tua";
vul[11] = "cumque illi ascendissent in Baalpharasim percussit eos ibi David et dixit divisit Deus inimicos meos per manum meam sicuti dividuntur aquae et idcirco vocatum est nomen loci illius Baalpharasim";
vul[12] = "dereliqueruntque ibi deos suos quos David iussit exuri";
vul[13] = "alia etiam vice Philisthim inruerunt et diffusi sunt in valle";
vul[14] = "consuluitque rursum David Deum et dixit ei Deus non ascendas post eos recede ab eis et venies contra illos ex adverso pirorum";
vul[15] = "cumque audieris sonitum gradientis in cacumine pirorum tunc egredieris ad bellum egressus est enim Deus ante te ut percutiat castra Philisthim";
vul[16] = "fecit ergo David sicut praeceperat ei Deus et percussit castra Philisthinorum de Gabaon usque Gazera";
vul[17] = "divulgatumque est nomen David in universis regionibus et Dominus dedit pavorem eius super omnes gentes";

yng[1] = "And Huram king of Tyre sendeth messengers unto David, and cedar-wood, and artificers of walls, and artificers of wood, to build to him a house.";
yng[2] = "And David knoweth that Jehovah hath established him for king over Israel, because of the lifting up on high of his kingdom, for the sake of His people Israel.";
yng[3] = "And David taketh again wives in Jerusalem, and David begetteth again sons and daughters;";
yng[4] = "and these [are] the names of the children whom he hath in Jerusalem: Shammua, and Shobab, Nathan, and Solomon,";
yng[5] = "and Ibhar, and Elishua, and Elpalet,";
yng[6] = "and Nogah, and Nepheg, and Japhia,";
yng[7] = "and Elishama, and Beeliada, and Eliphalet.";
yng[8] = "And the Philistines hear that David hath been anointed for king over all Israel, and all the Philistines go up to seek David, and David heareth, and goeth out before them.";
yng[9] = "And the Philistines have come, and rush into the valley of Rephaim,";
yng[10] = "and David asketh of God, saying, `Do I go up against the Philistines -- and hast Thou given them into my hand?\' And Jehovah saith to him, `Go up, and I have given them into thy hand.\'";
yng[11] = "And they go up into Baal-Perazim, and David smiteth them there, and David saith, `God hath broken up mine enemies by my hand, like the breaking up of waters;\' therefore they have called the name of that place Baal-Perazim.";
yng[12] = "And they leave there their gods, and David speaketh, and they are burnt with fire.";
yng[13] = "And the Philistines add again, and rush into the valley,";
yng[14] = "and David asketh again of God, and God saith to him, `Do not go up after them, turn round from them, and thou hast come to them from over-against the mulberries;";
yng[15] = "and it cometh to pass, when thou hearest the sound of the stepping at the heads of the mulberries, then thou goest out into battle, for God hath gone out before thee to smite the camp of the Philistines.\'";
yng[16] = "And David doth as God commanded him, and they smite the camp of the Philistines from Gibeon even unto Gazer;";
yng[17] = "and the name of David goeth out into all the lands, and Jehovah hath put his fear on all the nations.";
csb[1] = "King Hiram of Tyre sent envoys to David, along with cedar logs, stonemasons, and carpenters to build a palace for him.";
csb[2] = "Then David knew that the LORD had established him as king over Israel and that his kingdom had been exalted for the sake of his people Israel.";
csb[3] = "David took more wives in Jerusalem, and he became the father of more sons and daughters.";
csb[4] = "These are the names of the children born to him in Jerusalem: Shammua, Shobab, Nathan, Solomon,";
csb[5] = "Ibhar, Elishua, Elpelet,";
csb[6] = "Nogah, Nepheg, Japhia,";
csb[7] = "Elishama, Beeliada, and Eliphelet.";
csb[8] = "When the Philistines heard that David had been anointed king over all Israel, they all went in search of David; when David heard of this, he went out to face them.";
csb[9] = "Now the Philistines had come and raided in the Valley of Rephaim,";
csb[10] = "so David inquired of God, &quot;Should I attack the Philistines? Will you hand them over to me? &quot; The LORD replied, &quot;Attack, and I will hand them over to you.&quot;";
csb[11] = "So the Israelites went up to Baal-perazim, and David defeated the Philistines there. Then David said, &quot;Like a bursting flood, God has used me to burst out against my enemies.&quot; Therefore, they named that place The Lord Bursts Out.";
csb[12] = "The Philistines abandoned their idols there, and David ordered that they be burned in the fire.";
csb[13] = "Once again the Philistines raided in the valley.";
csb[14] = "So David again inquired of God, and God answered him, &quot;Do not pursue them directly. Circle around them and attack them opposite the balsam trees.";
csb[15] = "&quot;When you hear the sound of marching in the tops of the balsam trees, then go out to battle, for God will have gone out ahead of you to strike down the army of the Philistines.&quot;";
csb[16] = "So David did as God commanded him, and they struck down the Philistine army from Gibeon to Gezer.";
csb[17] = "Then David\'s fame spread throughout the lands, and the LORD caused all the nations to be terrified of him.";
