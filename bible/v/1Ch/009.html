asv[1] = "So all Israel were reckoned by genealogies; and, behold, they are written in the book of the kings of Israel: and Judah was carried away captive to Babylon for their transgression.";
asv[2] = "Now the first inhabitants that dwelt in their possessions in their cities were Israel, the priests, the Levites, and the Nethinim.";
asv[3] = "And in Jerusalem dwelt of the children of Judah, and of the children of Benjamin, and of the children of Ephraim and Manasseh:";
asv[4] = "Uthai the son of Ammihud, the son of Omri, the son of Imri, the son of Bani, of the children of Perez the son of Judah.";
asv[5] = "And of the Shilonites: Asaiah the first-born, and his sons.";
asv[6] = "And of the sons of Zerah: Jeuel, and their brethren, six hundred and ninety.";
asv[7] = "And of the sons of Benjamin: Sallu the son of Meshullam, the son of Hodaviah, the son of Hassenuah,";
asv[8] = "and Ibneiah the son of Jeroham, and Elah the son of Uzzi, the son of Michri, and Meshullam the son of Shephatiah, the son of Reuel, the son of Ibnijah;";
asv[9] = "and their brethren, according to their generations, nine hundred and fifty and six. All these men were heads of fathers\' [houses] by their fathers\' houses.";
asv[10] = "And of the priests: Jedaiah, and Jehoiarib, Jachin,";
asv[11] = "and Azariah the son of Hilkiah, the son of Meshullam, the son of Zadok, the son of Meraioth, the son of Ahitub, the ruler of the house of God;";
asv[12] = "and Adaiah the son of Jeroham, the son of Pashhur, the son of Malchijah, and Maasai the son of Adiel, the son of Jahzerah, the son of Meshullam, the son of Meshillemith, the son of Immer;";
asv[13] = "and their brethren, heads of their fathers\' houses, a thousand and seven hundred and threescore; very able men for the work of the service of the house of God.";
asv[14] = "And of the Levites: Shemaiah the son of Hasshub, the son of Azrikam, the son of Hashabiah, of the sons of Merari;";
asv[15] = "and Bakbakkar, Heresh, and Galal, and Mattaniah the son of Mica, the son of Zichri, the son of Asaph,";
asv[16] = "and Obadiah the son of Shemaiah, the son of Galal, the son of Jeduthun, and Berechiah the son of Asa, the son of Elkanah, that dwelt in the villages of the Netophathites.";
asv[17] = "And the porters: Shallum, and Akkub, and Talmon, and Ahiman, and their brethren (Shallum was the chief),";
asv[18] = "who hitherto [waited] in the king\'s gate eastward: they were the porters for the camp of the children of Levi.";
asv[19] = "And Shallum the son of Kore, the son of Ebiasaph, the son of Korah, and his brethren, of his father\'s house, the Korahites, were over the work of the service, keepers of the thresholds of the tent: and their fathers had been over the camp of Jehovah, keepers of the entry.";
asv[20] = "And Phinehas the son of Eleazar was ruler over them in time past, [and] Jehovah was with him.";
asv[21] = "Zechariah the son of Meshelemiah was porter of the door of the tent of meeting.";
asv[22] = "All these that were chosen to be porters in the thresholds were two hundred and twelve. These were reckoned by genealogy in their villages, whom David and Samuel the seer did ordain in their office of trust.";
asv[23] = "So they and their children had the oversight of the gates of the house of Jehovah, even the house of the tent, by wards.";
asv[24] = "On the four sides were the porters, toward the east, west, north, and south.";
asv[25] = "And their brethren, in their villages, were to come in every seven days from time to time to be with them:";
asv[26] = "for the four chief porters, who were Levites, were in an office of trust, and were over the chambers and over the treasuries in the house of God.";
asv[27] = "And they lodged round about the house of God, because the charge [thereof] was upon them; and to them pertained the opening thereof morning by morning.";
asv[28] = "And certain of them had charge of the vessels of service; for by count were these brought in and by count were these taken out.";
asv[29] = "Some of them also were appointed over the furniture, and over all the vessels of the sanctuary, and over the fine flour, and the wine, and the oil, and the frankincense, and the spices.";
asv[30] = "And some of the sons of the priests prepared the confection of the spices.";
asv[31] = "And Mattithiah, one of the Levites, who was the first-born of Shallum the Korahite, had the office of trust over the things that were baked in pans.";
asv[32] = "And some of their brethren, of the sons of the Kohathites, were over the showbread, to prepare it every sabbath.";
asv[33] = "And these are the singers, heads of fathers\' [houses] of the Levites, [who dwelt] in the chambers [and were] free [from other service]; for they were employed in their work day and night.";
asv[34] = "These were heads of fathers\' [houses] of the Levites, throughout their generations, chief men: these dwelt at Jerusalem.";
asv[35] = "And in Gibeon there dwelt the father of Gibeon, Jeiel, whose wife\'s name was Maacah;";
asv[36] = "and his first-born son Abdon, and Zur, and Kish, and Baal, and Ner, and Nadab,";
asv[37] = "and Gedor, and Ahio, and Zechariah, and Mikloth.";
asv[38] = "And Mikloth begat Shimeam. And they also dwelt with their brethren in Jerusalem, over against their brethren.";
asv[39] = "And Ner begat Kish; and Kish begat Saul; and Saul begat Jonathan, and Malchishua, and Abinadab, and Eshbaal.";
asv[40] = "And the son of Jonathan was Merib-baal; and Merib-baal begat Micah.";
asv[41] = "And the sons of Micah: Pithon, and Melech, and Tahrea, [and Ahaz].";
asv[42] = "And Ahaz begat Jarah; and Jarah begat Alemeth, and Azmaveth, and Zimri; and Zimri begat Moza;";
asv[43] = "and Moza begat Binea; and Rephaiah his son, Eleasah his son, Azel his son.";
asv[44] = "And Azel had six sons, whose names are these: Azrikam, Bocheru, and Ishmael, and Sheariah, and Obadiah, and Hanan: these were the sons of Azel.";
dby[1] = "And all Israel were registered by genealogy; and behold, they are written in the book of the kings of Israel. And Judah was carried away to Babylon because of their transgression.";
dby[2] = "And the inhabitants that were first in their possessions in their cities were the Israelites, the priests, the Levites, and the Nethinim.";
dby[3] = "And in Jerusalem dwelt of the children of Judah, and of the children of Benjamin, and of the children of Ephraim, and Manasseh:";
dby[4] = "Uthai the son of Ammihud, the son of Omri, the son of Imri, the son of Bani, of the children of Pherez the son of Judah.";
dby[5] = "And of the Shilonites: Asaiah the firstborn, and his sons.";

dby[10] = "And of the priests: Jedaiah, and Jehoiarib, and Jachin,";
dby[11] = "and Azariah the son of Hilkijah, the son of Meshullam, the son of Zadok, the son of Meraioth, the son of Ahitub, the ruler of the house of God;";
dby[12] = "and Adaiah the son of Jeroham, the son of Pashhur, the son of Malchijah, and Masai the son of Adiel, the son of Jahzerah, the son of Meshullam, the son of Meshillemith, the son of Immer;";
dby[13] = "and their brethren, heads of their fathers\' houses, a thousand and seven hundred and sixty; able men for the work of the service of the house of God.";
dby[14] = "And of the Levites: Shemaiah the son of Hasshub, the son of Azrikam, the son of Hashabiah, of the sons of Merari;";
dby[15] = "and Bakbakkar, Heresh, and Galal; and Mattaniah the son of Micah, the son of Zichri, the son of Asaph;";
dby[16] = "and Obadiah the son of Shemaiah, the son of Galal, the son of Jeduthun; and Berechiah the son of Asa, the son of Elkanah, who dwelt in the villages of the Netophathites.";
dby[17] = "And the doorkeepers: Shallum, and Akkub, and Talmon, and Ahiman, and their brethren; Shallum was the chief.";
dby[18] = "And they have been hitherto in the king\'s gate eastward: they were the doorkeepers in the camps of the children of Levi.";
dby[19] = "And Shallum the son of Kore, the son of Ebiasaph, the son of Korah, and his brethren, of the house of his father, the Korahites, were over the work of the service, keepers of the thresholds of the tent, and their fathers, set over the camp of Jehovah, were keepers of the entrance.";
dby[20] = "And Phinehas the son of Eleazar was the ruler over them formerly; Jehovah was with him.";
dby[21] = "Zechariah the son of Meshelemiah was doorkeeper at the entrance to the tent of meeting.";
dby[22] = "All these chosen to be doorkeepers at the thresholds were two hundred and twelve. These were registered by genealogy according to their villages: David and Samuel the seer had instituted them in their trust.";
dby[23] = "And they and their sons were at the gates of the house of Jehovah, the house of the tent, to keep watch there.";
dby[24] = "At the four quarters were the doorkeepers, toward the east, west, north, and south.";
dby[25] = "And their brethren, in their villages, were to come after [every] seven days from time to time with them.";
dby[26] = "For in their trust these four were the chief doorkeepers: they were Levites; and they were over the chambers and over the treasuries of the house of God;";
dby[27] = "for they stayed round about the house of God during the night, because the charge was upon them, and the opening thereof every morning [pertained] to them.";
dby[28] = "And [part] of them had the charge of the instruments of service, for by number they brought them in and by number they brought them out.";
dby[29] = "[Part] of them also were appointed over the vessels, and over all the holy instruments, and over the fine flour, and the wine, and the oil, and the frankincense, and the spices.";
dby[30] = "And it was [some one] of the sons of the priests who compounded the ointment of the spices.";
dby[31] = "And Mattithiah of the Levites, who was the firstborn of Shallum the Korahite, was in trust over the things that were made in the pans.";
dby[32] = "And [some] of the sons of the Kohathites, their brethren, were over the loaves to be set in rows, to prepare them every sabbath.";
dby[33] = "And these were the singers, chief fathers of the Levites, [who were] in the chambers free from service; for they were employed day and night.";
dby[34] = "These are the chief fathers of the Levites, heads according to their families; these dwelt in Jerusalem.";
dby[35] = "And at Gibeon dwelt the father of Gibeon, Jeiel, and his wife\'s name was Maachah.";
dby[36] = "And his son, the firstborn, was Abdon, and Zur, and Kish, and Baal, and Ner, and Nadab,";
dby[37] = "and Gedor, and Ahio, and Zechariah, and Mikloth;";
dby[38] = "and Mikloth begot Shimeam. And they also dwelt beside their brethren in Jerusalem, with their brethren.";
dby[39] = "And Ner begot Kish; and Kish begot Saul; and Saul begot Jonathan, and Malchishua, and Abinadab, and Esh-baal.";
dby[40] = "And the son of Jonathan was Merib-Baal; and Merib-Baal begot Micah.";
dby[41] = "And the sons of Micah: Pithon, and Melech, and Tahrea.";
dby[42] = "And Ahaz begot Jarah: and Jarah begot Alemeth, and Azmaveth, and Zimri; and Zimri begot Moza;";
dby[43] = "and Moza begot Binea; and Rephaiah his son, Eleasah his son, Azel his son.";
dby[44] = "And Azel had six sons, and these are their names: Azrikam, Bochru, and Ishmael, and Sheariah, and Obadiah, and Hanan; these were the sons of Azel.";
hnv[1] = "So all Yisra\'el were reckoned by genealogies; and, behold, they are written in the book of the kings of Yisra\'el: and Yehudah was carried away captive to Bavel for their disobedience.";
hnv[2] = "Now the first inhabitants who lived in their possessions in their cities were Yisra\'el, the Kohanim, the Levites, and the temple servants.";
hnv[3] = "In Yerushalayim lived of the children of Yehudah, and of the children of Binyamin, and of the children of Efrayim and Menashsheh:";
hnv[4] = "`Utai the son of `Ammihud, the son of `Omri, the son of Imri, the son of Bani, of the children of Peretz the son of Yehudah.";
hnv[5] = "Of the Shiloni: `Asayah the firstborn, and his sons.";
hnv[6] = "Of the sons of Zerach: Ye`u\'el, and their brothers, six hundred ninety.";
hnv[7] = "Of the sons of Binyamin: Sallu the son of Meshullam, the son of Hodavyah, the son of Senu\'ah,";
hnv[8] = "and Yivneyah the son of Yerocham, and Elah the son of `Uzzi, the son of Mikhri, and Meshullam the son of Shefatyah, the son of Re`u\'el, the son of Yivniyah;";
hnv[9] = "and their brothers, according to their generations, nine hundred fifty-six. All these men were heads of fathers\' [houses] by their fathers\' houses.";
hnv[10] = "Of the Kohanim: Yedayah, and Yehoiariv, Yakhin,";
hnv[11] = "and `Azaryah the son of Hilkiyah, the son of Meshullam, the son of Tzadok, the son of Merayot, the son of Achituv, the ruler of the house of God;";
hnv[12] = "and `Adayah the son of Yerocham, the son of Pashchur, the son of Malkiyah, and Ma`asai the son of `Adi\'el, the son of Yachzerah, the son of Meshullam, the son of Meshillemit, the son of Immer;";
hnv[13] = "and their brothers, heads of their fathers\' houses, one thousand seven hundred sixty; very able men for the work of the service of the house of God.";
hnv[14] = "Of the Levites: Shemayah the son of Hashshuv, the son of `Azrikam, the son of Hashavyah, of the sons of Merari;";
hnv[15] = "and Bakbakkar, Heresh, and Galal, and Mattanyah the son of Mikha, the son of Zikhri, the son of Asaf,";
hnv[16] = "and `Ovadyah the son of Shemayah, the son of Galal, the son of Yedutun, and Berekhyah the son of Asa, the son of Elkana, who lived in the villages of the Netofati.";
hnv[17] = "The porters: Shallum, and `Akkuv, and Talmon, and Achiman, and their brothers (Shallum was the chief),";
hnv[18] = "who hitherto [waited] in the king\'s gate eastward: they were the porters for the camp of the children of Levi.";
hnv[19] = "Shallum the son of Kore, the son of Avi\'asaf, the son of Korach, and his brothers, of his father\'s house, the Korchi, were over the work of the service, keepers of the thresholds of the tent: and their fathers had been over the camp of the LORD, keepers of the entry.";
hnv[20] = "Pinechas the son of El`azar was ruler over them in time past, [and] the LORD was with him.";
hnv[21] = "Zekharyah the son of Meshelemyah was porter of the door of the tent of meeting.";
hnv[22] = "All these who were chosen to be porters in the thresholds were two hundred and twelve. These were reckoned by genealogy in their villages, whom David and Shemu\'el the seer did ordain in their office of trust.";
hnv[23] = "So they and their children had the oversight of the gates of the house of the LORD, even the house of the tent, by wards.";
hnv[24] = "On the four sides were the porters, toward the east, west, north, and south.";
hnv[25] = "Their brothers, in their villages, were to come in every seven days from time to time to be with them:";
hnv[26] = "for the four chief porters, who were Levites, were in an office of trust, and were over the chambers and over the treasuries in the house of God.";
hnv[27] = "They lodged round about the house of God, because the charge [of it] was on them; and to them pertained the opening of it morning by morning.";
hnv[28] = "Certain of them had charge of the vessels of service; for by count were these brought in and by count were these taken out.";
hnv[29] = "Some of them also were appointed over the furniture, and over all the vessels of the sanctuary, and over the fine flour, and the wine, and the oil, and the frankincense, and the spices.";
hnv[30] = "Some of the sons of the Kohanim prepared the confection of the spices.";
hnv[31] = "Mattityah, one of the Levites, who was the firstborn of Shallum the Korchite, had the office of trust over the things that were baked in pans.";
hnv[32] = "Some of their brothers, of the sons of the Kehati, were over the show bread, to prepare it every Shabbat.";
hnv[33] = "These are the singers, heads of fathers\' [houses] of the Levites, [who lived] in the chambers [and were] free [from other service]; for they were employed in their work day and night.";
hnv[34] = "These were heads of fathers\' [houses] of the Levites, throughout their generations, chief men: these lived at Yerushalayim.";
hnv[35] = "In Giv`on there lived the father of Giv`on, Ye`i\'el, whose wife\'s name was Ma`akhah:";
hnv[36] = "and his firstborn son `Avdon, and Tzur, and Kish, and Ba`al, and Ner, and Nadav,";
hnv[37] = "and Gedor, and Achyo, and Zekharyah, and Miklot.";
hnv[38] = "Miklot became the father of Shim\'am. They also lived with their brothers in Yerushalayim, over against their brothers.";
hnv[39] = "Ner became the father of Kish; and Kish became the father of Sha\'ul; and Sha\'ul became the father of Yonatan, and Malki-Shua, and Avinadav, and Eshba`al.";
hnv[40] = "The son of Yonatan was Meriv-Ba`al; and Meriv-Ba`al became the father of Mikhah.";
hnv[41] = "The sons of Mikhah: Piton, and Melekh, and Tachre`a, [and Achaz].";
hnv[42] = "Achaz became the father of Ya`rah; and Ya`rah became the father of `Alemet, and `Azmavet, and Zimri; and Zimri became the father of Motzah;";
hnv[43] = "and Motzah became the father of Bin`a; and Refayah his son, El`asah his son, Atzel his son.";
hnv[44] = "Atzel had six sons, whose names are these: `Azrikam, Bokhru, and Yishma\'el, and She`aryah, and `Ovadyah, and Hanan: these were the sons of Atzel.";
kjv[1] = "So all Israel were reckoned by genealogies; and, behold, they [were] written in the book of the kings of Israel and Judah, [who] were carried away to Babylon for their transgression.";
kjv[2] = "Now the first inhabitants that [dwelt] in their possessions in their cities [were], the Israelites, the priests, Levites, and the Nethinims.";
kjv[3] = "And in Jerusalem dwelt of the children of Judah, and of the children of Benjamin, and of the children of Ephraim, and Manasseh;";
kjv[4] = "Uthai the son of Ammihud, the son of Omri, the son of Imri, the son of Bani, of the children of Pharez the son of Judah.";
kjv[5] = "And of the Shilonites; Asaiah the firstborn, and his sons.";
kjv[6] = "And of the sons of Zerah; Jeuel, and their brethren, six hundred and ninety.";
kjv[7] = "And of the sons of Benjamin; Sallu the son of Meshullam, the son of Hodaviah, the son of Hasenuah,";
kjv[8] = "And Ibneiah the son of Jeroham, and Elah the son of Uzzi, the son of Michri, and Meshullam the son of Shephathiah, the son of Reuel, the son of Ibnijah;";
kjv[9] = "And their brethren, according to their generations, nine hundred and fifty and six. All these men [were] chief of the fathers in the house of their fathers.";
kjv[10] = "And of the priests; Jedaiah, and Jehoiarib, and Jachin,";
kjv[11] = "And Azariah the son of Hilkiah, the son of Meshullam, the son of Zadok, the son of Meraioth, the son of Ahitub, the ruler of the house of God;";
kjv[12] = "And Adaiah the son of Jeroham, the son of Pashur, the son of Malchijah, and Maasiai the son of Adiel, the son of Jahzerah, the son of Meshullam, the son of Meshillemith, the son of Immer;";
kjv[13] = "And their brethren, heads of the house of their fathers, a thousand and seven hundred and threescore; very able men for the work of the service of the house of God.";
kjv[14] = "And of the Levites; Shemaiah the son of Hasshub, the son of Azrikam, the son of Hashabiah, of the sons of Merari;";
kjv[15] = "And Bakbakkar, Heresh, and Galal, and Mattaniah the son of Micah, the son of Zichri, the son of Asaph;";
kjv[16] = "And Obadiah the son of Shemaiah, the son of Galal, the son of Jeduthun, and Berechiah the son of Asa, the son of Elkanah, that dwelt in the villages of the Netophathites.";
kjv[17] = "And the porters [were], Shallum, and Akkub, and Talmon, and Ahiman, and their brethren: Shallum [was] the chief;";
kjv[18] = "Who hitherto [waited] in the king\'s gate eastward: they [were] porters in the companies of the children of Levi.";
kjv[19] = "And Shallum the son of Kore, the son of Ebiasaph, the son of Korah, and his brethren, of the house of his father, the Korahites, [were] over the work of the service, keepers of the gates of the tabernacle: and their fathers, [being] over the host of the LORD, [were] keepers of the entry.";
kjv[20] = "And Phinehas the son of Eleazar was the ruler over them in time past, [and] the LORD [was] with him.";
kjv[21] = "[And] Zechariah the son of Meshelemiah [was] porter of the door of the tabernacle of the congregation.";
kjv[22] = "All these [which were] chosen to be porters in the gates [were] two hundred and twelve. These were reckoned by their genealogy in their villages, whom David and Samuel the seer did ordain in their set office.";
kjv[23] = "So they and their children [had] the oversight of the gates of the house of the LORD, [namely], the house of the tabernacle, by wards.";
kjv[24] = "In four quarters were the porters, toward the east, west, north, and south.";
kjv[25] = "And their brethren, [which were] in their villages, [were] to come after seven days from time to time with them.";
kjv[26] = "For these Levites, the four chief porters, were in [their] set office, and were over the chambers and treasuries of the house of God.";
kjv[27] = "And they lodged round about the house of God, because the charge [was] upon them, and the opening thereof every morning [pertained] to them.";
kjv[28] = "And [certain] of them had the charge of the ministering vessels, that they should bring them in and out by tale.";
kjv[29] = "[Some] of them also [were] appointed to oversee the vessels, and all the instruments of the sanctuary, and the fine flour, and the wine, and the oil, and the frankincense, and the spices.";
kjv[30] = "And [some] of the sons of the priests made the ointment of the spices.";
kjv[31] = "And Mattithiah, [one] of the Levites, who [was] the firstborn of Shallum the Korahite, had the set office over the things that were made in the pans.";
kjv[32] = "And [other] of their brethren, of the sons of the Kohathites, [were] over the shewbread, to prepare [it] every sabbath.";
kjv[33] = "And these [are] the singers, chief of the fathers of the Levites, [who remaining] in the chambers [were] free: for they were employed in [that] work day and night.";
kjv[34] = "These chief fathers of the Levites [were] chief throughout their generations; these dwelt at Jerusalem.";
kjv[35] = "And in Gibeon dwelt the father of Gibeon, Jehiel, whose wife\'s name [was] Maachah:";
kjv[36] = "And his firstborn son Abdon, then Zur, and Kish, and Baal, and Ner, and Nadab,";
kjv[37] = "And Gedor, and Ahio, and Zechariah, and Mikloth.";
kjv[38] = "And Mikloth begat Shimeam. And they also dwelt with their brethren at Jerusalem, over against their brethren.";
kjv[39] = "And Ner begat Kish; and Kish begat Saul; and Saul begat Jonathan, and Malchishua, and Abinadab, and Eshbaal.";
kjv[40] = "And the son of Jonathan [was] Meribbaal: and Meribbaal begat Micah.";
kjv[41] = "And the sons of Micah [were], Pithon, and Melech, and Tahrea, [and Ahaz].";
kjv[42] = "And Ahaz begat Jarah; and Jarah begat Alemeth, and Azmaveth, and Zimri; and Zimri begat Moza;";
kjv[43] = "And Moza begat Binea; and Rephaiah his son, Eleasah his son, Azel his son.";
kjv[44] = "And Azel had six sons, whose names [are] these, Azrikam, Bocheru, and Ishmael, and Sheariah, and Obadiah, and Hanan: these [were] the sons of Azel.";
rsv[1] = "So all Israel was enrolled by genealogies; and these are written in the Book of the Kings of Israel. And Judah was taken into exile in Babylon because of their unfaithfulness.";
rsv[2] = "Now the first to dwell again in their possessions in their cities were Israel, the priests, the Levites, and the temple servants.";
rsv[3] = "And some of the people of Judah, Benjamin, E\'phraim, and Manas\'seh dwelt in Jerusalem:";
rsv[4] = "Uthai the son of Ammi\'hud, son of Omri, son of Imri, son of Bani, from the sons of Perez the son of Judah.";
rsv[5] = "And of the Shi\'lonites: Asai\'ah the first-born, and his sons.";
rsv[6] = "Of the sons of Zerah: Jeu\'el and their kinsmen, six hundred and ninety.";
rsv[7] = "Of the Benjaminites: Sallu the son of Meshul\'lam, son of Hodavi\'ah, son of Hassenu\'ah,";
rsv[8] = "Ibne\'iah the son of Jero\'ham, Elah the son of Uzzi, son of Michri, and Meshul\'lam the son of Shephati\'ah, son of Reu\'el, son of Ibni\'jah;";
rsv[9] = "and their kinsmen according to their generations, nine hundred and fifty-six. All these were heads of fathers\' houses according to their fathers\' houses.";
rsv[10] = "Of the priests: Jedai\'ah, Jehoi\'arib, Jachin,";
rsv[11] = "and Azari\'ah the son of Hilki\'ah, son of Meshul\'lam, son of Zadok, son of Merai\'oth, son of Ahi\'tub, the chief officer of the house of God;";
rsv[12] = "and Adai\'ah the son of Jero\'ham, son of Pashhur, son of Malchi\'jah, and Ma\'asai the son of Ad\'i-el, son of Jah\'zerah, son of Meshul\'lam, son of Meshil\'lemith, son of Immer;";
rsv[13] = "besides their kinsmen, heads of their fathers\' houses, one thousand seven hundred and sixty, very able men for the work of the service of the house of God.";
rsv[14] = "Of the Levites: Shemai\'ah the son of Hasshub, son of Azri\'kam, son of Hashabi\'ah, of the sons of Merar\'i;";
rsv[15] = "and Bakbak\'kar, Heresh, Galal, and Mattani\'ah the son of Mica, son of Zichri, son of Asaph;";
rsv[16] = "and Obadi\'ah the son of Shemai\'ah, son of Galal, son of Jedu\'thun, and Berechi\'ah the son of Asa, son of Elka\'nah, who dwelt in the villages of the Netoph\'athites.";
rsv[17] = "The gatekeepers were: Shallum, Akkub, Talmon, Ahi\'man, and their kinsmen (Shallum being the chief),";
rsv[18] = "stationed hitherto in the king\'s gate on the east side. These were the gatekeepers of the camp of the Levites.";
rsv[19] = "Shallum the son of Ko\'re, son of Ebi\'asaph, son of Korah, and his kinsmen of his fathers\' house, the Ko\'rahites, were in charge of the work of the service, keepers of the thresholds of the tent, as their fathers had been in charge of the camp of the LORD, keepers of the entrance.";
rsv[20] = "And Phin\'ehas the son of Elea\'zar was the ruler over them in time past; the LORD was with him.";
rsv[21] = "Zechari\'ah the son of Meshelemi\'ah was gatekeeper at the entrance of the tent of meeting.";
rsv[22] = "All these, who were chosen as gatekeepers at the thresholds, were two hundred and twelve. They were enrolled by genealogies in their villages. David and Samuel the seer established them in their office of trust.";
rsv[23] = "So they and their sons were in charge of the gates of the house of the LORD, that is, the house of the tent, as guards.";
rsv[24] = "The gatekeepers were on the four sides, east, west, north, and south;";
rsv[25] = "and their kinsmen who were in their villages were obliged to come in every seven days, from time to time, to be with these;";
rsv[26] = "for the four chief gatekeepers, who were Levites, were in charge of the chambers and the treasures of the house of God.";
rsv[27] = "And they lodged round about the house of God; for upon them lay the duty of watching, and they had charge of opening it every morning.";
rsv[28] = "Some of them had charge of the utensils of service, for they were required to count them when they were brought in and taken out.";
rsv[29] = "Others of them were appointed over the furniture, and over all the holy utensils, also over the fine flour, the wine, the oil, the incense, and the spices.";
rsv[30] = "Others, of the sons of the priests, prepared the mixing of the spices,";
rsv[31] = "and Mattithi\'ah, one of the Levites, the first-born of Shallum the Ko\'rahite, was in charge of making the flat cakes.";
rsv[32] = "Also some of their kinsmen of the Ko\'hathites had charge of the showbread, to prepare it every sabbath.";
rsv[33] = "Now these are the singers, the heads of fathers\' houses of the Levites, dwelling in the chambers of the temple free from other service, for they were on duty day and night.";
rsv[34] = "These were heads of fathers\' houses of the Levites, according to their generations, leaders, who lived in Jerusalem.";
rsv[35] = "In Gibeon dwelt the father of Gibeon, Je-i\'el, and the name of his wife was Ma\'acah,";
rsv[36] = "and his first-born son Abdon, then Zur, Kish, Ba\'al, Ner, Nadab,";
rsv[37] = "Gedor, Ahi\'o, Zech-ari\'ah and Mikloth;";
rsv[38] = "and Mikloth was the father of Shim\'e-am; and these also dwelt opposite their kinsmen in Jerusalem, with their kinsmen.";
rsv[39] = "Ner was the father of Kish, Kish of Saul, Saul of Jonathan, Mal\'chishu\'a, Abin\'adab, and Eshba\'al;";
rsv[40] = "and the son of Jonathan was Mer\'ib-ba\'al; and Mer\'ib-ba\'al was the father of Micah.";
rsv[41] = "The sons of Micah: Pithon, Melech, Tahr\'e-a, and Ahaz;";
rsv[42] = "and Ahaz was the father of Jarah, and Jarah of Al\'emeth, Az\'maveth, and Zimri; and Zimri was the father of Moza.";
rsv[43] = "Moza was the father of Bin\'e-a; and Rephai\'ah was his son, Ele-a\'sah his son, Azel his son.";
rsv[44] = "Azel had six sons and these are their names: Azri\'kam, Bo\'cheru, Ish\'mael, She-ari\'ah, Obadi\'ah, and Hanan; these were the sons of Azel.";
vul[1] = "universus ergo Israhel dinumeratus est et summa eorum scripta est in libro regum Israhel et Iuda translatique sunt in Babylonem propter delictum suum";
vul[2] = "qui autem habitaverunt primi in possessionibus et in urbibus suis Israhel et sacerdotes Levitae et Nathinnei";
vul[3] = "commorati sunt in Hierusalem de filiis Iuda et de filiis Beniamin de filiis quoque Ephraim et Manasse";
vul[4] = "Othei filius Amiud filius Emri filii Omrai filii Bonni de filiis Phares filii Iuda";
vul[5] = "et de Siloni Asaia primogenitus et filii eius";
vul[6] = "de filiis autem Zara Ieuhel et fratres eorum sescenti nonaginta";
vul[7] = "porro de filiis Beniamin Salo filius Mosollam filii Oduia filii Asana";
vul[8] = "et Iobania filius Hieroam et Hela filius Ozi filii Mochori et Mosollam filius Saphatiae filii Rahuhel filii Iebaniae";
vul[9] = "et fratres eorum per familias suas nongenti quinquaginta sex omnes hii principes cognationum per domos patrum suorum";
vul[10] = "de sacerdotibus autem Iedaia Ioiarib et Iachin";
vul[11] = "Azarias quoque filius Helciae filii Mosollam filii Sadoc filii Maraioth filii Ahitob pontifex domus Dei";
vul[12] = "porro Adaias filius Hieroam filii Phasor filii Melchia et Masaia filius Adihel filii Iezra filii Mosollam filii Mosollamoth filii Emmer";
vul[13] = "fratres quoque eorum principes per familias suas mille septingenti sexaginta fortissimi robore ad faciendum opus ministerii in domo Dei";
vul[14] = "de Levitis autem Semeia filius Assub filii Ezricam filii Asebiu de filiis Merari";
vul[15] = "Bacbacar quoque carpentarius et Galal et Mathania filius Micha filii Zechri filii Asaph";
vul[16] = "et Obdia filius Semeiae filii Galal filii Idithun et Barachia filius Asa filii Helcana qui habitavit in atriis Netophathi";
vul[17] = "ianitores autem Sellum et Acub et Telmon et Ahiman et frater eorum Sellum princeps";
vul[18] = "usque ad illud tempus in porta Regis ad orientem observabant per vices suas de filiis Levi";
vul[19] = "Sellum vero filius Core filii Abiasaph filii Core cum fratribus suis et domo patris sui hii sunt Coritae super opera ministerii custodes vestibulorum tabernaculi et familiae eorum per vices castrorum Domini custodientes introitum";
vul[20] = "Finees autem filius Eleazar erat dux eorum coram Domino";
vul[21] = "porro Zaccharias filius Mosollamia ianitor portae tabernaculi testimonii";
vul[22] = "omnes hii electi in ostiarios per portas ducenti duodecim et descripti in villis propriis quos constituerunt David et Samuhel videns in fide sua";
vul[23] = "tam ipsos quam filios eorum in ostiis domus Domini et in tabernaculo vicibus suis";
vul[24] = "per quattuor ventos erant ostiarii id est ad orientem et ad occidentem ad aquilonem et ad austrum";
vul[25] = "fratres autem eorum in viculis morabantur et veniebant in sabbatis suis de tempore usque ad tempus";
vul[26] = "his quattuor Levitis creditus erat omnis numerus ianitorum et erant super exedras et thesauros domus Domini";
vul[27] = "per gyrum quoque templi Domini morabantur in custodiis suis ut cum tempus fuisset ipsi mane aperirent fores";
vul[28] = "de horum grege erant et super vasa ministerii ad numerum enim et inferebantur vasa et efferebantur";
vul[29] = "de ipsis et qui credita habebant utensilia sanctuarii praeerant similae et vino et oleo et turi et aromatibus";
vul[30] = "filii autem sacerdotum unguenta ex aromatibus conficiebant";
vul[31] = "et Matthathias Levites primogenitus Sellum Coritae praefectus erat eorum quae in sartagine frigebantur";
vul[32] = "porro de filiis Caath fratribus eorum super panes erant propositionis ut semper novos per singula sabbata praepararent";
vul[33] = "hii sunt principes cantorum per familias Levitarum qui in exedris morabantur ita ut die et nocte iugiter suo ministerio deservirent";
vul[34] = "capita Levitarum per familias suas principes manserunt in Hierusalem";
vul[35] = "in Gabaon autem commorati sunt pater Gabaon Iaihel et nomen uxoris eius Maacha";
vul[36] = "filius primogenitus eius Abdon et Sur et Cis et Baal et Ner et Nadab";
vul[37] = "Gedor quoque et Ahio et Zaccharias et Macelloth";
vul[38] = "porro Macelloth genuit Semmaam isti habitaverunt e regione fratrum suorum in Hierusalem cum fratribus suis";
vul[39] = "Ner autem genuit Cis et Cis genuit Saul et Saul genuit Ionathan et Melchisuae et Abinadab et Esbaal";
vul[40] = "filius autem Ionathan Meribbaal et Meribbaal genuit Micha";
vul[41] = "porro filii Micha Phiton et Malech et Thara";
vul[42] = "Ahaz autem genuit Iara et Iara genuit Alamath et Azmoth et Zamri et Zamri genuit Mosa";
vul[43] = "Mosa vero genuit Baana cuius filius Raphaia genuit Elasa de quo ortus est Esel";
vul[44] = "porro Esel sex filios habuit his nominibus Ezricam Bochru Ismahel Saria Obdia Anan hii filii Esel";
web[1] = "So all Israel were reckoned by genealogies; and behold, they [were] written in the book of the kings of Israel and Judah, [who] were carried away to Babylon for their transgression.";
web[2] = "Now the first inhabitants that [dwelt] in their possessions in their cities [were], the Israelites, the priests, Levites, and the Nethinims.";
web[3] = "And in Jerusalem dwelt of the children of Judah, and of the children of Benjamin, and of the children of Ephraim, and Manasseh;";
web[4] = "Uthai the son of Ammihud, the son of Omri, the son of Imri, the son of Bani, of the children of Pharez the son of Judah.";
web[5] = "And of the Shilonites; Asaiah the first-born, and his sons.";
web[6] = "And of the sons of Zerah; Jeuel, and their brethren, six hundred and ninety.";
web[7] = "And of the sons of Benjamin; Sallu the son of Meshullam, the son of Hodaviah, the son of Hasenuah,";
web[8] = "And Ibneiah the son of Jeroham, and Elah the son of Uzzi, the son of Michri, and Meshullam the son of Shephatiah, the son of Reuel, the son of Ibnijah;";
web[9] = "And their brethren, according to their generations, nine hundred and fifty and six. All these men [were] chief of the fathers in the house of their fathers.";
web[10] = "And of the priests; Jedaiah, and Jehoiarib, and Jachin,";
web[11] = "And Azariah the son of Hilkiah, the son of Meshullam, the son of Zadok, the son of Meraioth, the son of Ahitub, the ruler of the house of God;";
web[12] = "And Adaiah the son of Jeroham, the son of Pashur, the son of Malchijah, and Maasiai the son of Adiel, the son of Jahzerah, the son of Meshullam, the son of Meshillemith, the son of Immer;";
web[13] = "And their brethren, heads of the house of their fathers, a thousand and seven hundred and sixty; very able men for the work of the service of the house of God.";
web[14] = "And of the Levites; Shemaiah the son of Hasshub, the son of Azrikam, the son of Hashabiah, of the sons of Merari;";
web[15] = "And Bakbakkar, Heresh, and Galal, and Mattaniah the son of Micah, the son of Zichri, the son of Asaph;";
web[16] = "And Obadiah the son of Shemaiah, the son of Galal, the son of Jeduthun, and Berechiah the son of Asa, the son of Elkanah, that dwelt in the villages of the Netophathites.";
web[17] = "And the porters [were] Shallum, and Akkub, and Talmon, and Ahiman, and their brethren: Shallum [was] the chief;";
web[18] = "Who hitherto [waited] in the king\'s gate eastward: they [were] porters in the companies of the children of Levi.";
web[19] = "And Shallum the son of Kore, the son of Ebiasaph, the son of Korah, and his brethren of the house of his father, the Korahites, [were] over the work of the service, keepers of the gates of the tabernacle: and their fathers, [being] over the host of the LORD, [were] keepers of the entry.";
web[20] = "And Phinehas the son of Eleazar was the ruler over them in time past, [and] the LORD [was] with him.";
web[21] = "[And] Zechariah the son of Meshelemiah [was] porter of the door of the tabernacle of the congregation.";
web[22] = "All these [who were] chosen to be porters in the gates [were] two hundred and twelve. These were reckoned by their genealogy in their villages, whom David and Samuel the seer ordained in their set office.";
web[23] = "So they and their children [had] the oversight of the gates of the house of the LORD, [namely], the house of the tabernacle, by wards.";
web[24] = "In four quarters were the porters, towards the east, west, north and south.";
web[25] = "And their brethren, [who were] in their villages, [were] to come after seven days from time to time with them.";
web[26] = "For these Levites, the four chief porters, were in [their] set office, and were over the chambers and treasuries of the house of God.";
web[27] = "And they lodged about the house of God, because the charge [was] upon them, and the opening of it every morning [pertained] to them.";
web[28] = "And [certain] of them had the charge of the ministering vessels, that they should bring them in and out by number.";
web[29] = "[Some] of them also [were] appointed to oversee the vessels, and all the instruments of the sanctuary, and the fine flour, and the wine, and the oil, and the frankincense, and the spices.";
web[30] = "And [some] of the sons of the priests made the ointment of the spices.";
web[31] = "And Mattithiah, [one] of the Levites, who [was] the first-born of Shallum the Korahite, had the set office over the things that were made in the pans.";
web[32] = "And [others] of their brethren, of the sons of the Kohathites, [were] over the show-bread, to prepare [it] every sabbath.";
web[33] = "And these [are] the singers, chief of the fathers of the Levites, [who remaining] in the chambers [were] free: for they were employed in [that] work day and night.";
web[34] = "These chief fathers of the Levites [were] chief throughout their generations; these dwelt at Jerusalem.";
web[35] = "And in Gibeon dwelt the father of Gibeon, Jehiel, whose wife\'s name [was] Maachah:";
web[36] = "And his first-born son Abdon, then Zur, and Kish, and Baal, and Ner, and Nadab,";
web[37] = "And Gedor, and Ahio, and Zechariah, and Mikloth.";
web[38] = "And Mikloth begat Shimeam. And they also dwelt with their brethren at Jerusalem, over against their brethren.";
web[39] = "And Ner begat Kish; and Kish begat Saul; and Saul begat Jonathan, and Malchi-shua, and Abinadab, and Esh-baal.";
web[40] = "And the son of Jonathan [was] Merib-baal: and Merib-baal begat Micah.";
web[41] = "And the sons of Micah [were], Pithon, and Melech, and Tahrea, [and Ahaz].";
web[42] = "And Ahaz begat Jarah; and Jarah begat Alemeth, and Azmaveth, and Zimri; and Zimri begat Moza;";
web[43] = "And Moza begat Binea; and Rephaiah his son, Eleasah his son, Azel his son.";
web[44] = "And Azel had six sons, whose names [are] these, Azrikam, Bocheru, and Ishmael, and Sheariah, and Obadiah, and Hanan: these [were] the sons of Azel.";
yng[1] = "And all Israel have reckoned themselves by genealogy, and lo, they are written on the book of the kings of Israel and Judah -- they were removed to Babylon for their trespass.";
yng[2] = "And the first inhabitants, who [are] in their possession, in their cities, of Israel, [are] the priests, the Levites, and the Nethinim.";
yng[3] = "And in Jerusalem dwelt of the sons of Judah, and of the sons of Benjamin, and of the sons of Ephraim and Manasseh:";
yng[4] = "Uthai son of Ammihud, son of Omri, son of Imri, son of Bani, of the sons of Pharez, son of Judah.";
yng[5] = "And of the Shilonite: Asaiah the first-born, and his sons.";
yng[6] = "And of the sons of Zerah: Jeuel, and their brethren, six hundred and ninety.";
yng[7] = "And of the sons of Benjamin: Sallu son of Meshullam, son of Hodaviah, son of Hassenuah,";
yng[8] = "and Ibneiah son of Jeroham, and Elah son of Uzzi, son of Michri, and Meshullam son of Shephatiah, son of Reuel, son of Ibnijah.";
yng[9] = "And their brethren, according to their generations, [are] nine hundred and fifty and six. All these [are] men, heads of fathers, according to the house of their fathers.";
yng[10] = "And of the priests: Jedaiah, and Jehoiarib, and Jachin,";
yng[11] = "and Azariah son of Hilkiah, son of Meshullam, son of Zadok, son of Meraioth, son of Ahitub, leader in the house of God;";
yng[12] = "and Adaiah son of Jeroham, son of Pashhur, son of Malchijah, and Maasai son of Adiel, son of Jahzerah, son of Meshullam, son of Meshillemith, son of Immer.";
yng[13] = "And their brethren, heads to the house of their fathers, a thousand and seven hundred and sixty, mighty in valour, [are] for the work of the service of the house of God.";
yng[14] = "And of the Levites: Shemaiah son of Hashshub, son of Azrikam, son of Hashabiah, of the sons of Merari;";
yng[15] = "and Bakbakkar, Heresh, and Galal, and Mattaniah son of Micah, son of Zichri, son of Asaph;";
yng[16] = "and Obadiah son of Shemariah, son of Galal, son of Jeduthun, and Berechiah, son of Asa, son of Elkanah, who is dwelling in the villages of the Netophathite.";
yng[17] = "And the gatekeepers [are] Shallum, and Akkub, and Talmon, and Ahiman, and their brethren -- Shallum [is] the head;";
yng[18] = "and hitherto they [are] at the gate of the king eastward; they [are] the gatekeepers for the companies of the sons of Levi.";
yng[19] = "And Shallum son of Kore, son of Ebiasaph, son of Korah, and his brethren, of the house of his father, the Korahites, [are] over the work of the service, keepers of the thresholds of the tent, and their fathers [are] over the camp of Jehovah, keepers of the entrance;";
yng[20] = "and Phinehas son of Eleazar hath been leader over them formerly; Jehovah [is] with him.";
yng[21] = "Zechariah son of Meshelemiah [is] gatekeeper at the opening of the tent of meeting.";
yng[22] = "All of those who are chosen for gatekeepers at the thresholds [are] two hundred and twelve; they [are] in their villages, by their genealogy; they whom David and Samuel the seer appointed in their office.";
yng[23] = "And they and their sons [are] over the gates of the house of Jehovah, even of the house of the tent, by watches.";
yng[24] = "At four sides are the gatekeepers, east, west, north, and south.";
yng[25] = "And their brethren in their villages [are] to come in for seven days from time to time with these.";
yng[26] = "For in office [are] the four chiefs of the gatekeepers, they are Levites, and they have been over the chambers, and over the treasuries of the house of God,";
yng[27] = "and round about the house of God they lodge, for on them [is] the watch, and they [are] over the opening, even morning by morning.";
yng[28] = "And [some] of them [are] over the vessels of service, for by number they bring them in, and by number they take them out.";
yng[29] = "And [some] of them are appointed over the vessels, even over all the vessels of the sanctuary, and over the fine flour, and the wine, and the oil, and the frankincense, and the spices.";
yng[30] = "And [some] of the sons of the priests are mixing the mixture for spices.";
yng[31] = "And Mattithiah, of the Levites (he [is] the first-born to Shallum the Korahite), [is] in office over the work of the pans.";
yng[32] = "And of the sons of the Kohathite, [some] of their brethren [are] over the bread of the arrangement, to prepare [it] sabbath by sabbath.";
yng[33] = "And these who sing, heads of fathers of the Levites, in the chambers, [are] free, for by day and by night [they are] over them in the work.";
yng[34] = "These heads of the fathers of the Levites throughout their generations [are] heads. These have dwelt in Jerusalem.";
yng[35] = "And in Gibeon dwelt hath the father of Gibeon, Jehiel, and the name of his wife [is] Maachah;";
yng[36] = "and his son, the first-born, [is] Abdon, and Zur, and Kish, and Baal, and Ner, and Nadab,";
yng[37] = "and Gedor, and Ahio, and Zechariah, and Mikloth.";
yng[38] = "And Mikloth begat Shimeam, and they also, over-against their brethren, have dwelt in Jerusalem with their brethren.";
yng[39] = "And Ner begat Kish, and Kish begat Saul, and Saul begat Jonathan, and Malchi-Shua, and Abinadab, and Esh-Baal.";
yng[40] = "And a son of Jonathan [is] Merib-Baal, and Merib-Baal begat Micah.";
yng[41] = "And sons of Micah: Pithon, and Melech, and Tahrea,";
yng[42] = "and Ahaz -- he begat Jaarah, and Jaarah begat Alemeth, and Azmaveth, and Zimri, and Zimri begat Moza,";
yng[43] = "and Moza begat Binea, and Rephaiah [is] his son. Eleasah his son, Azel his son.";
yng[44] = "And to Azel [are] six sons, and these their names: Azrikam, Bocheru, and Ishmael, and Sheariah, and Obadiah, and Hanan: these [are] sons of Azel.";
csb[1] = "All Israel was registered in the genealogies that are written in the Book of the Kings of Israel. But Judah was exiled to Babylon because of their unfaithfulness.";
csb[2] = "The first to live in their towns on their own property again were Israelites, priests, Levites, and temple servants.";
csb[3] = "These people from the descendants of Judah, Benjamin, Ephraim, and Manasseh settled in Jerusalem:";
csb[4] = "Uthai son of Ammihud, son of Omri, son of Imri, son of Bani, a descendant of Perez son of Judah;";
csb[5] = "from the Shilonites: Asaiah the firstborn and his sons;";
csb[6] = "and from the descendants of Zerah: Jeuel and their relatives -- 690 in all.";
csb[7] = "The Benjaminites: Sallu son of Meshullam, son of Hodaviah, son of Hassenuah;";
csb[8] = "Ibneiah son of Jeroham; Elah son of Uzzi, son of Michri; Meshullam son of Shephatiah, son of Reuel, son of Ibnijah;";
csb[9] = "and their relatives according to their family records -- 956 in all. All these men were heads of their ancestral families.";
csb[10] = "The priests: Jedaiah; Jehoiarib; Jachin;";
csb[11] = "Azariah son of Hilkiah, son of Meshullam, son of Zadok, son of Meraioth, son of Ahitub, the chief official of God\'s temple;";
csb[12] = "Adaiah son of Jeroham, son of Pashhur, son of Malchijah; Maasai son of Adiel, son of Jahzerah, son of Meshullam, son of Meshillemith, son of Immer;";
csb[13] = "and their relatives, the heads of their ancestral families -- 1,760 in all. They were capable men employed in the ministry of God\'s temple.";
csb[14] = "The Levites: Shemaiah son of Hasshub, son of Azrikam, son of Hashabiah of the Merarites;";
csb[15] = "Bakbakkar, Heresh, Galal, and Mattaniah, son of Mica, son of Zichri, son of Asaph;";
csb[16] = "Obadiah son of Shemaiah, son of Galal, son of Jeduthun; and Berechiah son of Asa, son of Elkanah who lived in the settlements of the Netophathites.";
csb[17] = "The gatekeepers: Shallum, Akkub, Talmon, Ahiman, and their relatives. Shallum was their chief;";
csb[18] = "he was previously stationed at the King\'s Gate on the east side. These were the gatekeepers from the camp of the Levites.";
csb[19] = "Shallum son of Kore, son of Ebiasaph, son of Korah and his relatives from his father\'s family, the Korahites, were assigned to guard the thresholds of the tent. Their ancestors had been assigned to the LORD\'s camp as guardians of the entrance.";
csb[20] = "In earlier times Phinehas son of Eleazar had been their leader, and the LORD was with him.";
csb[21] = "Zechariah son of Meshelemiah was the gatekeeper at the entrance to the tent of meeting.";
csb[22] = "The total number of those chosen to be gatekeepers at the thresholds was 212. They were registered by genealogy in their settlements. David and the seer Samuel had appointed them to their trusted positions.";
csb[23] = "So they and their sons were assigned as guards to the gates of the LORD\'s temple, which had been the tent-temple.";
csb[24] = "The gatekeepers were on the four sides: east, west, north, and south.";
csb[25] = "Their relatives came from their settlements at fixed times to be with them seven days,";
csb[26] = "but the four chief gatekeepers, who were Levites, were entrusted with the rooms and the treasuries of God\'s temple.";
csb[27] = "They spent the night in the vicinity of God\'s temple, because they had guard duty and were in charge of opening it every morning.";
csb[28] = "Some of them were in charge of the utensils used in worship. They would count them when they brought them in and when they took them out.";
csb[29] = "Others were put in charge of the furnishings and all the utensils of the sanctuary, as well as the fine flour, wine, oil, incense, and spices.";
csb[30] = "Some of the priests\' sons mixed the spices.";
csb[31] = "A Levite called Mattithiah, the firstborn of Shallum the Korahite, was entrusted with baking the bread.";
csb[32] = "Some of the Kohathites\' relatives were responsible for preparing the rows of the Bread of the Presence every Sabbath.";
csb[33] = "The singers, the heads of the Levite families, stayed in the temple chambers and were exempt from other tasks because they were on duty day and night.";
csb[34] = "These were the heads of the Levite families, chiefs according to their family records; they lived in Jerusalem.";
csb[35] = "Jeiel fathered Gibeon and lived in Gibeon. His wife\'s name was Maacah.";
csb[36] = "Abdon was his firstborn son, then Zur, Kish, Baal, Ner, Nadab,";
csb[37] = "Gedor, Ahio, Zechariah, and Mikloth.";
csb[38] = "Mikloth fathered Shimeam. These also lived opposite their relatives in Jerusalem with their other relatives.";
csb[39] = "Ner fathered Kish, Kish fathered Saul, and Saul fathered Jonathan, Malchishua, Abinadab, and Esh-baal.";
csb[40] = "Jonathan\'s son was Merib-baal, and Merib-baal fathered Micah.";
csb[41] = "Micah\'s sons: Pithon, Melech, Tahrea, and Ahaz.";
csb[42] = "Ahaz fathered Jarah; Jarah fathered Alemeth, Azmaveth, and Zimri; Zimri fathered Moza.";
csb[43] = "Moza fathered Binea. His son was Rephaiah, his son Elasah, and his son Azel.";
csb[44] = "Azel had six sons, and these were their names: Azrikam, Bocheru, Ishmael, Sheariah, Obadiah, and Hanan. These were Azel\'s sons.";
