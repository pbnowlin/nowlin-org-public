asv[1] = "Now the children of Israel after their number, [to wit], the heads of fathers\' [houses] and the captains of thousands and of hundreds, and their officers that served the king, in any matter of the courses which came in and went out month by month throughout all the months of the year-of every course were twenty and four thousand.";
asv[2] = "Over the first course for the first month was Jashobeam the son of Zabdiel: and in his course were twenty and four thousand.";
asv[3] = "[He was] of the children of Perez, the chief of all the captains of the host for the first month.";
asv[4] = "And over the course of the second month was Dodai the Ahohite, and his course; and Mikloth the ruler: and in his course were twenty and four thousand.";
asv[5] = "The third captain of the host for the third month was Benaiah, the son of Jehoiada the priest, chief: and in his course were twenty and four thousand.";
asv[6] = "This is that Benaiah, who was the mighty man of the thirty, and over the thirty: and [of] his course was Ammizabad his son.";
asv[7] = "The fourth [captain] for the fourth month was Asahel the brother of Joab, and Zebadiah his son after him: and in his course were twenty and four thousand.";
asv[8] = "The fifth captain for the fifth month was Shamhuth the Izrahite: and in his course were twenty and four thousand.";
asv[9] = "The sixth [captain] for the sixth month was Ira the son of Ikkesh the Tekoite: and in his course were twenty and four thousand.";
asv[10] = "The seventh [captain] for the seventh month was Helez the Pelonite, of the children of Ephraim: and in his course were twenty and four thousand.";
asv[11] = "The eighth [captain] for the eighth month was Sibbecai the Hushathite, of the Zerahites: and in his course were twenty and four thousand.";
asv[12] = "The ninth [captain] for the ninth month was Abiezer the Anathothite, of the Benjamites: and in his course were twenty and four thousand.";
asv[13] = "The tenth [captain] for the tenth month was Maharai the Netophathite, of the Zerahites: and in his course were twenty and four thousand.";
asv[14] = "The eleventh [captain] for the eleventh month was Benaiah the Pirathonite, of the children of Ephraim: and in his course were twenty and four thousand.";
asv[15] = "The twelfth [captain] for the twelfth month was Heldai the Netophathite, of Othniel: and in his course were twenty and four thousand.";
asv[16] = "Furthermore over the tribes of Israel: of the Reubenites was Eliezer the son of Zichri the ruler: of the Simeonites, Shephatiah the son of Maacah:";
asv[17] = "of Levi, Hashabiah the son of Kemuel: of Aaron, Zadok:";
asv[18] = "of Judah, Elihu, one of the brethren of David: of Issachar, Omri the son of Michael:";
asv[19] = "of Zebulun, Ishmaiah the son of Obadiah: of Naphtali, Jeremoth the son of Azriel:";
asv[20] = "of the children of Ephraim, Hoshea the son of Azaziah: of the half-tribe of Manasseh, Joel the son of Pedaiah:";
asv[21] = "of the half-[tribe] of Manasseh in Gilead, Iddo the son of Zechariah: of Benjamin, Jaasiel the son of Abner:";
asv[22] = "of Dan, Azarel the son of Jeroham. These were the captains of the tribes of Israel.";
asv[23] = "But David took not the number of them from twenty years old and under, because Jehovah had said he would increase Israel like to the stars of heaven.";
asv[24] = "Joab the son of Zeruiah began to number, but finished not; and there came wrath for this upon Israel; neither was the number put into the account in the chronicles of king David.";
asv[25] = "And over the king\'s treasures was Azmaveth the son of Adiel: and over the treasures in the fields, in the cities, and in the villages, and in the castles, was Jonathan the son of Uzziah:";
asv[26] = "And over them that did the work of the field for tillage of the ground was Ezri the son of Chelub:";
asv[27] = "and over the vineyards was Shimei the Ramathite: and over the increase of the vineyards for the wine-cellars was Zabdi the Shiphmite:";
asv[28] = "and over the olive-trees and the sycomore-trees that were in the lowland was Baal-hanan the Gederite: and over the cellars of oil was Joash:";
asv[29] = "and over the herds that fed in Sharon was Shitrai the Sharonite: and over the herds that were in the valleys was Shaphat the son of Adlai:";
asv[30] = "and over the camels was Obil the Ishmaelite: and over the asses was Jehdeiah the Meronothite: and over the flocks was Jaziz the Hagrite.";
asv[31] = "All these were the rulers of the substance which was king David\'s.";
asv[32] = "Also Jonathan, David\'s uncle, was a counsellor, a man of understanding, and a scribe: and Jehiel the son of Hachmoni was with the king\'s sons:";
asv[33] = "And Ahithophel was the king\'s counsellor: and Hushai the Archite was the king\'s friend:";
asv[34] = "and after Ahithophel was Jehoiada the son of Benaiah, and Abiathar: and the captain of the king\'s host was Joab.";
dby[1] = "And [these] are the children of Israel after their number, the chief fathers and captains of thousands and hundreds, and their officers that served the king in every matter of the divisions, which came in and went out month by month throughout the months of the year; in every division were twenty-four thousand.";
dby[2] = "Over the first division for the first month was Jashobeam the son of Zabdiel; and in his division were twenty-four thousand.";
dby[3] = "He was of the children of Pherez, the head of all the captains of the hosts for the first month.";
dby[4] = "And over the division of the second month was Dodai the Ahohite; and in his division was Mikloth ruler; and in his division were twenty-four thousand.";
dby[5] = "The third captain of the host for the third month was Benaiah (the son of Jehoiada, a principal officer): [he was] head; and in his division were twenty-four thousand.";
dby[6] = "This Benaiah was a mighty man among the thirty, and above the thirty; and in his division was Ammizabad his son.";
dby[7] = "The fourth for the fourth month was Asahel the brother of Joab, and Zebadiah his son after him; and in his division were twenty-four thousand.";
dby[8] = "The fifth for the fifth month was the captain Shamhuth the Jizrahite; and in his division were twenty-four thousand.";
dby[9] = "The sixth for the sixth month was Ira the son of Ikkesh the Tekoite; and in his division were twenty-four thousand.";
dby[10] = "The seventh for the seventh month was Helez the Pelonite, of the children of Ephraim; and in his division were twenty-four thousand.";
dby[11] = "The eighth for the eighth month was Sibbechai the Hushathite, of the Zarhites; and in his division were twenty-four thousand.";
dby[12] = "The ninth for the ninth month was Abiezer the Anathothite, of the Benjaminites; and in his division were twenty-four thousand.";
dby[13] = "The tenth for the tenth month was Maharai the Netophathite, of the Zarhites; and in his division were twenty-four thousand.";
dby[14] = "The eleventh for the eleventh month was Benaiah the Pirathonite, of the children of Ephraim; and in his division were twenty-four thousand.";
dby[15] = "The twelfth for the twelfth month was Heldai the Netophathite, of Othniel; and in his division were twenty-four thousand.";
dby[16] = "And over the tribes of Israel were: for the Reubenites Eliezer the son of Zichri was the prince; for the Simeonites, Shephatiah the son of Maachah;";
dby[17] = "for the Levites, Hashabiah the son of Kemuel; for Aaron, Zadok;";
dby[18] = "for Judah, Elihu of the brethren of David; for Issachar, Omri the son of Michael;";
dby[19] = "for Zebulun, Jishmaiah the son of Obadiah; for Naphtali, Jerimoth the son of Azriel;";
dby[20] = "for the children of Ephraim, Hosea the son of Azaziah; for the half tribe of Manasseh, Joel the son of Pedaiah;";
dby[21] = "for the half [tribe] of Manasseh in Gilead, Jiddo the son of Zechariah; for Benjamin, Jaasiel the son of Abner;";
dby[22] = "for Dan, Azareel the son of Jeroham. These were the princes of the tribes of Israel.";
dby[23] = "And David took not their number from twenty years old and under; for Jehovah had said he would increase Israel as the stars of heaven.";
dby[24] = "Joab the son of Zeruiah began to number, but he did not finish; and there fell wrath for it upon Israel; and the number was not put in the account of the chronicles of king David.";
dby[25] = "And over the king\'s treasures was Azmaveth the son of Adiel; and over the storehouses in the country, in the cities, and in the villages, and in the towers was Jonathan the son of Uzziah.";
dby[26] = "And over them that worked in the field for tillage of the ground was Ezri the son of Chelub.";
dby[27] = "And over the vineyards was Shimei the Ramathite; and over what was in the vineyards of stores of wine was Zabdi the Shiphmite:";
dby[28] = "and over the olive-trees and the sycamore-trees that were in the lowland was Baal-hanan the Gederite; and over the cellars of oil was Joash.";
dby[29] = "And over the herds that fed in Sharon was Shitrai the Sharonite; and over the herds in the valleys was Shaphat the son of Adlai.";
dby[30] = "And over the camels was Obil the Ishmaelite; and over the asses was Jehdiah the Meronothite.";
dby[31] = "And over the flocks was Jaziz the Hagarite. All these were comptrollers of the substance which was king David\'s.";
dby[32] = "And Jonathan, David\'s uncle, was counsellor, a wise man, and a scribe; and Jehiel the son of Hachmoni was with the king\'s sons;";
dby[33] = "and Ahithophel was the king\'s counsellor; and Hushai the Archite was the king\'s friend;";
dby[34] = "and after Ahithophel was Jehoiada the son of Benaiah, and Abiathar; and Joab was captain of the king\'s army.";
hnv[1] = "Now the children of Yisra\'el after their number, [to wit], the heads of fathers\' [houses] and the captains of thousands and of hundreds, and their officers who served the king, in any matter of the courses which came in and went out month by month throughout all the months of the year-of every course were twenty-four thousand.";
hnv[2] = " Over the first course for the first month was Yashov`am the son of Zavdi\'el: and in his course were twenty-four thousand.";
hnv[3] = "[He was] of the children of Peretz, the chief of all the captains of the host for the first month.";
hnv[4] = "Over the course of the second month was Dodo the Achochi, and his course; and Miklot the ruler: and in his course were twenty-four thousand.";
hnv[5] = "The third captain of the host for the third month was Benayah, the son of Yehoiada the Kohen, chief: and in his course were twenty-four thousand.";
hnv[6] = "This is that Benayah, who was the mighty man of the thirty, and over the thirty: and [of] his course was `Ammizavad his son.";
hnv[7] = "The fourth [captain] for the fourth month was `Asa\'el the brother of Yo\'av, and Zevadyah his son after him: and in his course were twenty-four thousand.";
hnv[8] = "The fifth captain for this fifth month was Shamhuth the Izrahite: and in his course were twenty-four thousand.";
hnv[9] = "The sixth [captain] for the sixth month was `Ira the son of `Ikkesh the Tekoite: and in his course were twenty-four thousand.";
hnv[10] = "The seventh [captain] for the seventh month was Heletz the Pelonite, of the children of Efrayim: and in his course were twenty-four thousand.";
hnv[11] = "The eighth [captain] for the eighth month was Sibbekhai the Hushatite, of the Zarchi: and in his course were twenty-four thousand.";
hnv[12] = "The ninth [captain] for the ninth month was Avi-Ezer the `Antotite, of the Binyamini: and in his course were twenty-four thousand.";
hnv[13] = "The tenth [captain] for the tenth month was Maharai the Netofatite, of the Zarchi: and in his course were Twenty-four thousand.";
hnv[14] = "The eleventh [captain] for the eleventh month was Benayah the Pir`atonite, of the children of Efrayim: and in his course were Twenty-four thousand.";
hnv[15] = "The twelfth [captain] for the twelfth month was Heldai the Netofatite, of `Otni\'el: and in his course were twenty-four thousand.";
hnv[16] = " Furthermore over the tribes of Yisra\'el: of the Re\'uveni was Eli`ezer the son of Zikhri the ruler: of the Shim`oni, Shefatyah the son of Ma`akhah:";
hnv[17] = "of Levi, Hashavyah the son of Kemu\'el: of Aharon, Tzadok:";
hnv[18] = "of Yehudah, Elihu, one of the brothers of David: of Yissakhar, `Omri the son of Mikha\'el:";
hnv[19] = "of Zevulun, Yishma`yahu the son of `Ovadyah: of Naftali, Yeremot the son of `Azri\'el:";
hnv[20] = " of the children of Efrayim, Hoshea the son of `Azazyahu: of the half-tribe of Menashsheh, Yo\'el the son of Pedayahu:";
hnv[21] = "of the half -[tribe] of Menashsheh in Gil`ad, `Iddo the son of Zekharyah: of Binyamin, Ya`asi\'el the son of Aviner:";
hnv[22] = "of Dan, `Azar\'el the son of Yerocham. These were the captains of the tribes of Yisra\'el.";
hnv[23] = " But David didn\'t take the number of them from twenty years old and under, because the LORD had said he would increase Yisra\'el like the stars of the sky.";
hnv[24] = "Yo\'av the son of Tzeru\'yah began to number, but didn\'t finish; and there came wrath for this on Yisra\'el; neither was the number put into the account in the chronicles of king David.";
hnv[25] = "Over the king\'s treasures was `Azmavet the son of `Adi\'el: and over the treasures in the fields, in the cities, and in the villages, and in the castles, was Yonatan the son of `Uzziyah:";
hnv[26] = "Over those who did the work of the field for tillage of the ground was `Ezri the son of Kelub:";
hnv[27] = "and over the vineyards was Shim`i the Ramatite: and over the increase of the vineyards for the wine-cellars was Zavdi the Shifmite:";
hnv[28] = "and over the olive trees and the sycamore trees that were in the lowland was Ba`al-Hanan the Gederite: and over the cellars of oil was Yo\'ash:";
hnv[29] = "and over the herds that fed in Sharon was Shirtai the Sharonite: and over the herds that were in the valleys was Shafat the son of `Adlai:";
hnv[30] = "and over the camels was Ovil the Yishme`elite: and over the donkeys was Yechdeyahu the Meronotite: and over the flocks was Yaziz the Hagrite.";
hnv[31] = "All these were the rulers of the substance which was king David\'s.";
hnv[32] = " Also Yonatan, David\'s uncle, was a counselor, a man of understanding, and a Sofer: and Yechi\'el the son of Hakhmoni was with the king\'s sons:";
hnv[33] = "Achitofel was the king\'s counselor: and Hushai the Arki was the king\'s friend:";
hnv[34] = "and after Achitofel was Yehoiada the son of Benayah, and Avyatar: and the captain of the king\'s host was Yo\'av.";
kjv[1] = "Now the children of Israel after their number, [to wit], the chief fathers and captains of thousands and hundreds, and their officers that served the king in any matter of the courses, which came in and went out month by month throughout all the months of the year, of every course [were] twenty and four thousand.";
kjv[2] = "Over the first course for the first month [was] Jashobeam the son of Zabdiel: and in his course [were] twenty and four thousand.";
kjv[3] = "Of the children of Perez [was] the chief of all the captains of the host for the first month.";
kjv[4] = "And over the course of the second month [was] Dodai an Ahohite, and of his course [was] Mikloth also the ruler: in his course likewise [were] twenty and four thousand.";
kjv[5] = "The third captain of the host for the third month [was] Benaiah the son of Jehoiada, a chief priest: and in his course [were] twenty and four thousand.";
kjv[6] = "This [is that] Benaiah, [who was] mighty [among] the thirty, and above the thirty: and in his course [was] Ammizabad his son.";
kjv[7] = "The fourth [captain] for the fourth month [was] Asahel the brother of Joab, and Zebadiah his son after him: and in his course [were] twenty and four thousand.";
kjv[8] = "The fifth captain for the fifth month [was] Shamhuth the Izrahite: and in his course [were] twenty and four thousand.";
kjv[9] = "The sixth [captain] for the sixth month [was] Ira the son of Ikkesh the Tekoite: and in his course [were] twenty and four thousand.";
kjv[10] = "The seventh [captain] for the seventh month [was] Helez the Pelonite, of the children of Ephraim: and in his course [were] twenty and four thousand.";
kjv[11] = "The eighth [captain] for the eighth month [was] Sibbecai the Hushathite, of the Zarhites: and in his course [were] twenty and four thousand.";
kjv[12] = "The ninth [captain] for the ninth month [was] Abiezer the Anetothite, of the Benjamites: and in his course [were] twenty and four thousand.";
kjv[13] = "The tenth [captain] for the tenth month [was] Maharai the Netophathite, of the Zarhites: and in his course [were] twenty and four thousand.";
kjv[14] = "The eleventh [captain] for the eleventh month [was] Benaiah the Pirathonite, of the children of Ephraim: and in his course [were] twenty and four thousand.";
kjv[15] = "The twelfth [captain] for the twelfth month [was] Heldai the Netophathite, of Othniel: and in his course [were] twenty and four thousand.";
kjv[16] = "Furthermore over the tribes of Israel: the ruler of the Reubenites [was] Eliezer the son of Zichri: of the Simeonites, Shephatiah the son of Maachah:";
kjv[17] = "Of the Levites, Hashabiah the son of Kemuel: of the Aaronites, Zadok:";
kjv[18] = "Of Judah, Elihu, [one] of the brethren of David: of Issachar, Omri the son of Michael:";
kjv[19] = "Of Zebulun, Ishmaiah the son of Obadiah: of Naphtali, Jerimoth the son of Azriel:";
kjv[20] = "Of the children of Ephraim, Hoshea the son of Azaziah: of the half tribe of Manasseh, Joel the son of Pedaiah:";
kjv[21] = "Of the half [tribe] of Manasseh in Gilead, Iddo the son of Zechariah: of Benjamin, Jaasiel the son of Abner:";
kjv[22] = "Of Dan, Azareel the son of Jeroham. These [were] the princes of the tribes of Israel.";
kjv[23] = "But David took not the number of them from twenty years old and under: because the LORD had said he would increase Israel like to the stars of the heavens.";
kjv[24] = "Joab the son of Zeruiah began to number, but he finished not, because there fell wrath for it against Israel; neither was the number put in the account of the chronicles of king David.";
kjv[25] = "And over the king\'s treasures [was] Azmaveth the son of Adiel: and over the storehouses in the fields, in the cities, and in the villages, and in the castles, [was] Jehonathan the son of Uzziah:";
kjv[26] = "And over them that did the work of the field for tillage of the ground [was] Ezri the son of Chelub:";
kjv[27] = "And over the vineyards [was] Shimei the Ramathite: over the increase of the vineyards for the wine cellars [was] Zabdi the Shiphmite:";
kjv[28] = "And over the olive trees and the sycomore trees that [were] in the low plains [was] Baalhanan the Gederite: and over the cellars of oil [was] Joash:";
kjv[29] = "And over the herds that fed in Sharon [was] Shitrai the Sharonite: and over the herds [that were] in the valleys [was] Shaphat the son of Adlai:";
kjv[30] = "Over the camels also [was] Obil the Ishmaelite: and over the asses [was] Jehdeiah the Meronothite:";
kjv[31] = "And over the flocks [was] Jaziz the Hagerite. All these [were] the rulers of the substance which [was] king David\'s.";
kjv[32] = "Also Jonathan David\'s uncle was a counsellor, a wise man, and a scribe: and Jehiel the son of Hachmoni [was] with the king\'s sons:";
kjv[33] = "And Ahithophel [was] the king\'s counsellor: and Hushai the Archite [was] the king\'s companion:";
kjv[34] = "And after Ahithophel [was] Jehoiada the son of Benaiah, and Abiathar: and the general of the king\'s army [was] Joab.";
rsv[1] = "This is the list of the people of Israel, the heads of fathers\' houses, the commanders of thousands and hundreds, and their officers who served the king in all matters concerning the divisions that came and went, month after month throughout the year, each division numbering twenty-four thousand:";
rsv[2] = "Jasho\'beam the son of Zab\'di-el was in charge of the first division in the first month; in his division were twenty-four thousand.";
rsv[3] = "He was a descendant of Perez, and was chief of all the commanders of the army for the first month.";
rsv[4] = "Dodai the Aho\'hite was in charge of the division of the second month; in his division were twenty-four thousand.";
rsv[5] = "The third commander, for the third month, was Benai\'ah, the son of Jehoi\'ada the priest, as chief; in his division were twenty-four thousand.";
rsv[6] = "This is the Benai\'ah who was a mighty man of the thirty and in command of the thirty; Ammiz\'abad his son was in charge of his division.";
rsv[7] = "As\'ahel the brother of Jo\'ab was fourth, for the fourth month, and his son Zebadi\'ah after him; in his division were twenty-four thousand.";
rsv[8] = "The fifth commander, for the fifth month, was Shamhuth, the Iz\'rahite; in his division were twenty-four thousand.";
rsv[9] = "Sixth, for the sixth month, was Ira, the son of Ikkesh the Teko\'ite; in his division were twenty-four thousand.";
rsv[10] = "Seventh, for the seventh month, was Helez the Pel\'onite, of the sons of E\'phraim; in his division were twenty-four thousand.";
rsv[11] = "Eighth, for the eighth month, was Sib\'becai the Hu\'shathite, of the Ze\'rahites; in his division were twenty-four thousand.";
rsv[12] = "Ninth, for the ninth month, was Abi-e\'zer of An\'athoth, a Benjaminite; in his division were twenty-four thousand.";
rsv[13] = "Tenth, for the tenth month, was Ma\'harai of Netoph\'ah, of the Ze\'rahites; in his division were twenty-four thousand.";
rsv[14] = "Eleventh, for the eleventh month, was Benai\'ah of Pira\'thon, of the sons of E\'phraim; in his division were twenty-four thousand.";
rsv[15] = "Twelfth, for the twelfth month, was Heldai the Netoph\'athite, of Oth\'ni-el; in his division were twenty-four thousand.";
rsv[16] = "Over the tribes of Israel, for the Reubenites Elie\'zer the son of Zichri was chief officer; for the Simeonites, Shephati\'ah the son of Ma\'acah;";
rsv[17] = "for Levi, Hashabi\'ah the son of Kem\'uel; for Aaron, Zadok;";
rsv[18] = "for Judah, Eli\'hu, one of David\'s brothers; for Is\'sachar, Omri the son of Michael;";
rsv[19] = "for Zeb\'ulun, Ishma\'iah the son of Obadi\'ah; for Naph\'tali, Jer\'emoth the son of Az\'riel;";
rsv[20] = "for the E\'phraimites, Hoshe\'a the son of Azazi\'ah; for the half-tribe of Manas\'seh, Jo\'el the son of Pedai\'ah;";
rsv[21] = "for the half-tribe of Manas\'seh in Gilead, Iddo the son of Zechari\'ah; for Benjamin, Ja-a\'si-el the son of Abner;";
rsv[22] = "for Dan, Az\'arel the son of Jero\'ham. These were the leaders of the tribes of Israel.";
rsv[23] = "David did not number those below twenty years of age, for the LORD had promised to make Israel as many as the stars of heaven.";
rsv[24] = "Jo\'ab the son of Zeru\'iah began to number, but did not finish; yet wrath came upon Israel for this, and the number was not entered in the chronicles of King David.";
rsv[25] = "Over the king\'s treasuries was Az\'maveth the son of Ad\'i-el; and over the treasuries in the country, in the cities, in the villages and in the towers, was Jonathan the son of Uzzi\'ah;";
rsv[26] = "and over those who did the work of the field for tilling the soil was Ezri the son of Chelub;";
rsv[27] = "and over the vineyards was Shim\'e-i the Ra\'mathite; and over the produce of the vineyards for the wine cellars was Zabdi the Shiphmite.";
rsv[28] = "Over the olive and sycamore trees in the Shephe\'lah was Ba\'al-ha\'nan the Gede\'rite; and over the stores of oil was Jo\'ash.";
rsv[29] = "Over the herds that pastured in Sharon was Shitrai the Shar\'onite; over the herds in the valleys was Shaphat the son of Adlai.";
rsv[30] = "Over the camels was Obil the Ish\'maelite; and over the she-asses was Jehde\'iah the Meron\'othite. Over the flocks was Jaziz the Hagrite.";
rsv[31] = "All these were stewards of King David\'s property.";
rsv[32] = "Jonathan, David\'s uncle, was a counselor, being a man of understanding and a scribe; he and Jehi\'el the son of Hach\'moni attended the king\'s sons.";
rsv[33] = "Ahith\'ophel was the king\'s counselor, and Hushai the Archite was the king\'s friend.";
rsv[34] = "Ahith\'ophel was succeeded by Jehoi\'ada the son of Benai\'ah, and Abi\'athar. Jo\'ab was commander of the king\'s army.";
vul[1] = "filii autem Israhel secundum numerum suum principes familiarum tribuni et centuriones et praefecti qui ministrabant regi iuxta turmas suas ingredientes et egredientes per singulos menses in anno viginti quattuor milibus singuli praeerant";
vul[2] = "primae turmae in primo mense Isboam praeerat filius Zabdihel et sub eo viginti quattuor milia";
vul[3] = "de filiis Phares princeps cunctorum principum in exercitu mense primo";
vul[4] = "secundi mensis habebat turmam Dudi Ahohites et post se alterum nomine Macelloth qui regebat partem exercitus viginti quattuor milium";
vul[5] = "dux quoque turmae tertiae in mense tertio erat Banaias filius Ioiadae sacerdos et in divisione sua viginti quattuor milia";
vul[6] = "ipse est Banaias fortissimus inter triginta et super triginta praeerat autem turmae ipsius Amizabad filius eius";
vul[7] = "quartus mense quarto Asahel frater Ioab et Zabadias filius eius post eum et in turma eius viginti quattuor milia";
vul[8] = "quintus mense quinto princeps Samaoth Iezarites et in turma eius viginti quattuor milia";
vul[9] = "sextus mense sexto Hira filius Acces Thecuites et in turma eius viginti quattuor milia";
vul[10] = "septimus mense septimo Helles Phallonites de filiis Ephraim et in turma eius viginti quattuor milia";
vul[11] = "octavus mense octavo Sobochai Asothites de stirpe Zarai et in turma eius viginti quattuor milia";
vul[12] = "nonus mense nono Abiezer Anathothites de filiis Iemini et in turma eius viginti quattuor milia";
vul[13] = "decimus mense decimo Marai et ipse Netophathites de stirpe Zarai et in turma eius viginti quattuor milia";
vul[14] = "undecimus mense undecimo Banaias Pharathonites de filiis Ephraim et in turma eius viginti quattuor milia";
vul[15] = "duodecimus mense duodecimo Holdai Netophathites de stirpe Gothonihel et in turma eius viginti quattuor milia";
vul[16] = "porro tribubus praeerant Israhel Rubenitis dux Eliezer filius Zechri Symeonitis dux Saphatias filius Macha";
vul[17] = "Levitis Asabias filius Camuhel Aaronitis Sadoc";
vul[18] = "Iuda Heliu frater David Isachar Amri filius Michahel";
vul[19] = "Zabulonitis Iesmaias filius Abdiae Nepthalitibus Ierimoth filius Ozihel";
vul[20] = "filiis Ephraim Osee filius Ozaziu dimidio tribus Manasse Iohel filius Phadiae";
vul[21] = "et dimidio tribus Manasse in Galaad Iaddo filius Zacchariae Beniamin autem Iasihel filius Abner";
vul[22] = "Dan vero Ezrihel filius Hieroam hii principes filiorum Israhel";
vul[23] = "noluit autem David numerare eos a viginti annis inferius quia dixerat Dominus ut multiplicaret Israhel quasi stellas caeli";
vul[24] = "Ioab filius Sarviae coeperat numerare nec conplevit quia super hoc ira inruerat in Israhel et idcirco numerus eorum qui fuerant recensiti non est relatus in fastos regis David";
vul[25] = "super thesauros autem regis fuit Azmoth filius Adihel his autem thesauris qui erant in urbibus et in vicis et in turribus praesidebat Ionathan filius Oziae";
vul[26] = "operi autem rustico et agricolis qui exercebant terram praeerat Ezri filius Chelub";
vul[27] = "vinearumque cultoribus Semeias Ramathites cellis autem vinariis Zabdias Aphonites";
vul[28] = "nam super oliveta et ficeta quae erant in campestribus Balanan Gaderites super apothecas autem olei Ioas";
vul[29] = "porro armentis quae pascebantur in Sarona praepositus fuit Setrai Saronites et super boves in vallibus Saphat filius Adli";
vul[30] = "super camelos vero Ubil Ismahelites et super asinos Iadias Meronathites";
vul[31] = "super oves quoque Iaziz Agarenus omnes hii principes substantiae regis David";
vul[32] = "Ionathan autem patruus David consiliarius vir prudens et litteratus ipse et Iaihel filius Achamoni erant cum filiis regis";
vul[33] = "Ahitophel etiam consiliarius regis et Husi Arachites amicus regis";
vul[34] = "post Ahitophel fuit Ioiada filius Banaiae et Abiathar princeps autem exercitus regis erat Ioab";
web[1] = "Now the children of Israel after their number, [to wit], the chief fathers, and captains of thousands and hundreds, and their officers that served the king in any matter of the courses, which came in and went out month by month throughout all the months of the year, of every course [were] twenty and four thousand.";
web[2] = "Over the first course for the first month [was] Jashobeam the son of Zabdiel: and in his course [were] twenty and four thousand.";
web[3] = "Of the children of Perez, [was] the chief of all the captains of the host for the first month.";
web[4] = "And over the course of the second month [was] Dodai an Ahohite, and of his course [was] Mikloth also the ruler: in his course likewise [were] twenty and four thousand.";
web[5] = "The third captain of the host for the third month [was] Benaiah the son of Jehoiada, a chief priest: and in his course [were] twenty and four thousand.";
web[6] = "This [is that] Benaiah, [who was] mighty [among] the thirty, and above the thirty: and in his course [was] Ammizabad his son.";
web[7] = "The fourth [captain] for the fourth month [was] Asahel the brother of Joab, and Zebadiah his son after him: and in his course [were] twenty and four thousand.";
web[8] = "The fifth captain for the fifth month [was] Shamhuth the Izrahite: and in his course [were] twenty and four thousand.";
web[9] = "The sixth [captain] for the sixth month [was] Ira the son of Ikkesh the Tekoite: and in his course [were] twenty and four thousand.";
web[10] = "The seventh [captain] for the seventh month [was] Helez the Pelonite, of the children of Ephraim: and in his course [were] twenty and four thousand.";
web[11] = "The eighth [captain] for the eighth month [was] Sibbecai the Hushathite, of the Zarhites: and in his course [were] twenty and four thousand.";
web[12] = "The ninth [captain] for the ninth month [was] Abiezer the Anetothite, of the Benjaminites: and in his course [were] twenty and four thousand.";
web[13] = "The tenth [captain] for the tenth month [was] Maharai the Netophathite, of the Zarhites: and in his course [were] twenty and four thousand.";
web[14] = "The eleventh [captain] for the eleventh month [was] Benaiah the Pirathonite, of the children of Ephraim: and in his course [were] twenty and four thousand.";
web[15] = "The twelfth [captain] for the twelfth month [was] Heldai the Netophathite, of Othniel: and in his course [were] twenty and four thousand.";
web[16] = "Furthermore over the tribes of Israel: the ruler of the Reubenites [was] Eliezer the son of Zichri: of the Simeonites, Shephatiah the son of Maachah:";
web[17] = "Of the Levites, Hashabiah the son of Kemuel: of the Aaronites, Zadok:";
web[18] = "Of Judah, Elihu, [one] of the brethren of David: of Issachar, Omri the son of Michael:";
web[19] = "Of Zebulun, Ishmaiah the son of Obadiah: of Naphtali, Jerimoth the son of Azriel:";
web[20] = "Of the children of Ephraim, Hoshea the son of Azaziah: of the half tribe of Manasseh, Joel the son of Pedaiah:";
web[21] = "Of the half [tribe] of Manasseh in Gilead, Iddo the son of Zechariah: of Benjamin, Jaasiel the son of Abner:";
web[22] = "Of Dan, Azareel the son of Jeroham. These [were] the princes of the tribes of Israel.";
web[23] = "But David took not the number of them from twenty years old and under: because the LORD had said he would increase Israel like to the stars of the heavens.";
web[24] = "Joab the son of Zeruiah began to number, but he finished not, because there fell wrath for it against Israel; neither was the number put in the account of the chronicles of king David.";
web[25] = "And over the king\'s treasures [was] Azmaveth the son of Adiel: and over the store-houses in the fields, in the cities, and in the villages, and in the castles, [was] Jehonathan the son of Uzziah:";
web[26] = "And over them that did the work of the field for tillage of the ground [was] Ezri the son of Chelub:";
web[27] = "And over the vineyards [was] Shimei the Ramathite: over the increase of the vineyards for the wine cellars [was] Zabdi the Shiphmite:";
web[28] = "And over the olive trees and the sycamore trees that [were] in the low plains [was] Baal-hanan the Gederite: and over the cellars of oil [was] Joash:";
web[29] = "And over the herds that fed in Sharon [was] Shitrai the Sharonite: and over the herds [that were] in the valleys [was] Shaphat the son of Adlai:";
web[30] = "Over the camels also [was] Obil the Ishmaelite: and over the asses [was] Jehdeiah the Meronothite:";
web[31] = "And over the flocks [was] Jaziz the Hagerite. All these [were] the rulers of the substance which [was] king David\'s.";
web[32] = "Also Jonathan, David\'s uncle, was a counselor, a wise man, and a scribe: and Jehiel the son of Hachmoni [was] with the king\'s sons:";
web[33] = "And Ahithophel [was] the king\'s counselor: and Hushai the Archite [was] the king\'s companion:";
web[34] = "And after Ahithophel [was] Jehoiada the son of Benaiah, and Abiathar: and the general of the king\'s army [was] Joab.";
yng[1] = "And the sons of Israel, after their number, heads of the fathers, and princes of the thousands and of the hundreds, and their officers, those serving the king in any matter of the courses, that are coming in and going out month by month, throughout all months of the year -- [are] in each course twenty and four thousand.";
yng[2] = "Over the first course, for the first month, [is] Jashobeam son of Zabdiel, and on his course [are] twenty and four thousand;";
yng[3] = "of the sons of Perez [is] the head of all princes of the hosts for the first month.";
yng[4] = "And over the course of the second month [is] Dodai the Ahohite, and his course, and Mikloth [is] the president, and on his course [are] twenty and four thousand.";
yng[5] = "Head of the third host, for the third month, [is] Benaiah son of Jehoiada, the head priest, and on his course [are] twenty and four thousand.";
yng[6] = "This Benaiah [is] a mighty one of the thirty, and over the thirty, and [in] his course [is] Ammizabad his son.";
yng[7] = "The fourth, for the fourth month, [is] Asahel brother of Joab, and Zebadiah his son after him, and on his course [are] twenty and four thousand.";
yng[8] = "The fifth, for the fifth month, [is] the prince Shamhuth the Izrahite, and on his course [are] twenty and four thousand.";
yng[9] = "The sixth, for the sixth month, [is] Ira son of Ikkesh the Tekoite, and on his course [are] twenty and four thousand.";
yng[10] = "The seventh, for the seventh month, [is] Helez the Pelonite, of the sons of Ephraim, and on his course [are] twenty and four thousand.";
yng[11] = "The eighth, for the eighth month, [is] Sibbecai the Hushathite, of the Zarhite, and on his course [are] twenty and four thousand.";
yng[12] = "The ninth, for the ninth month, [is] Abiezer the Antothite, of the Benjamite, and on his course [are] twenty and four thousand.";
yng[13] = "The tenth, for the tenth month, [is] Maharai the Netophathite, of the Zarhite, and on his course [are] twenty and four thousand.";
yng[14] = "Eleventh, for the eleventh month, [is] Benaiah the Pirathonite, of the sons of Ephraim, and on his course [are] twenty and four thousand.";
yng[15] = "The twelfth, for the twelfth month, [is] Heldai the Netophathite, of Othniel, and on his course [are] twenty and four thousand.";
yng[16] = "And over the tribes of Israel: Of the Reubenite, a leader [is] Eliezer son of Zichri; of the Simeonite, Shephatiah son of Maachah;";
yng[17] = "of the Levite, Hashabiah son of Kemuel; of the Aaronite, Zadok;";
yng[18] = "of Judah, Elihu, of the brethren of David; of Issachar, Omri son of Michael;";
yng[19] = "of Zebulun, Ishmaiah son of Obadiah; of Naphtali, Jerimoth son of Azriel;";
yng[20] = "of the sons of Ephraim, Hoshea son of Azaziah; of the half of the tribe of Manasseh, Joel son of Pedaiah;";
yng[21] = "of the half of Manasseh in Gilead, Iddo son of Zechariah; of Benjamin, Jaasiel son of Abner; of Dan, Azareel son of Jeroham:";
yng[22] = "these [are] heads of the tribes of Israel.";
yng[23] = "And David hath not taken up their number from a son of twenty years and under, for Jehovah said to multiply Israel as the stars of the heavens.";
yng[24] = "Joab son of Zeruiah hath begun to number -- and hath not finished -- and there is for this wrath against Israel, and the number hath not gone up in the account of the Chronicles of king David.";
yng[25] = "And over the treasures of the king [is] Azmaveth son of Adiel; and over the treasures in the field, in the cities, and in the villages, and in the towers, [is] Jehonathan son of Uzziah;";
yng[26] = "and over workmen of the field for the service of the ground [is] Ezri son of Chelub;";
yng[27] = "and over the vineyards [is] Shimei the Ramathite; and over what [is] in the vineyards for the treasures of wine [is] Zabdi the Shiphmite;";
yng[28] = "and over the olives, and the sycamores, that [are] in the low country, [is] Baal-Hanan the Gederite; and over the treasures of oil [is] Joash;";
yng[29] = "and over the herds that are feeding in Sharon [is] Shitrai the Sharonite; and over the herds in the valleys [is] Shaphat son of Adlai;";
yng[30] = "and over the camels [is] Obil the Ishmeelite; and over the asses [is] Jehdeiah the Meronothite;";
yng[31] = "and over the flock [is] Jaziz the Hagerite; all these [are] heads of the substance that king David hath.";
yng[32] = "And Jonathan, uncle of David, [is] counsellor, a man of understanding, he is also a scribe; and Jehiel son of Hachmoni [is] with the sons of the king;";
yng[33] = "and Ahithophel [is] counsellor to the king; and Hushai the Archite [is] the friend of the king;";
yng[34] = "and after Ahithophel [is] Jehoiada son of Benaiah, and Abiathar; and the head of the host of the king [is] Joab.";
csb[1] = "This is the list of the Israelites, the family heads, the commanders of thousands and the commanders of hundreds, and their officers who served the king in every matter to do with the divisions that were on rotated military duty each month throughout the year. There were 24,000 in each division:";
csb[2] = "Jashobeam son of Zabdiel was in charge of the first division, for the first month; 24,000 were in his division.";
csb[3] = "He was a descendant of Perez and chief of all the army commanders for the first month.";
csb[4] = "Dodai the Ahohite was in charge of the division for the second month, and Mikloth was the leader; 24,000 were in his division.";
csb[5] = "The third army commander, as chief for the third month, was Benaiah son of the priest Jehoiada; 24,000 were in his division.";
csb[6] = "This Benaiah was a mighty man among the Thirty and over the Thirty, and his son Ammizabad was in charge of his division.";
csb[7] = "The fourth commander, for the fourth month, was Joab\'s brother Asahel, and his son Zebadiah was commander after him; 24,000 were in his division.";
csb[8] = "The fifth, for the fifth month, was the commander Shamhuth the Izrahite; 24,000 were in his division.";
csb[9] = "The sixth, for the sixth month, was Ira son of Ikkesh the Tekoite; 24,000 were in his division.";
csb[10] = "The seventh, for the seventh month, was Helez the Pelonite from the descendants of Ephraim; 24,000 were in his division.";
csb[11] = "The eighth, for the eighth month, was Sibbecai the Hushathite, a Zerahite; 24,000 were in his division.";
csb[12] = "The ninth, for the ninth month, was Abiezer the Anathothite, a Benjaminite; 24,000 were in his division.";
csb[13] = "The tenth, for the tenth month, was Maharai the Netophathite, a Zerahite; 24,000 were in his division.";
csb[14] = "The eleventh, for the eleventh month, was Benaiah the Pirathonite from the descendants of Ephraim; 24,000 were in his division.";
csb[15] = "The twelfth, for the twelfth month, was Heldai the Netophathite, of Othniel\'s family; 24,000 were in his division.";
csb[16] = "The following were in charge of the tribes of Israel: For the Reubenites, Eliezer son of Zichri was the chief official; for the Simeonites, Shephatiah son of Maacah;";
csb[17] = "for the Levites, Hashabiah son of Kemuel; for Aaron, Zadok;";
csb[18] = "for Judah, Elihu, one of David\'s brothers; for Issachar, Omri son of Michael;";
csb[19] = "for Zebulun, Ishmaiah son of Obadiah; for Naphtali, Jerimoth son of Azriel;";
csb[20] = "for the Ephraimites, Hoshea son of Azaziah; for half the tribe of Manasseh, Joel son of Pedaiah;";
csb[21] = "for half the tribe of Manasseh in Gilead, Iddo son of Zechariah; for Benjamin, Jaasiel son of Abner;";
csb[22] = "for Dan, Azarel son of Jeroham. Those were the leaders of the tribes of Israel.";
csb[23] = "David didn\'t count the men aged twenty or under, for the LORD had said he would make Israel as numerous as the stars of the sky.";
csb[24] = "Joab son of Zeruiah began to count them, but he didn\'t complete it. There was wrath against Israel because of this census, and the number was not entered in the Historical Record of King David.";
csb[25] = "Azmaveth son of Adiel was in charge of the king\'s storehouses. Jonathan son of Uzziah was in charge of the storehouses in the country, in the cities, in the villages, and in the fortresses.";
csb[26] = "Ezri son of Chelub was in charge of those who worked in the fields tilling the soil.";
csb[27] = "Shimei the Ramathite was in charge of the vineyards. Zabdi the Shiphmite was in charge of the produce of the vineyards for the wine cellars.";
csb[28] = "Baal-hanan the Gederite was in charge of the olive and sycamore trees in the Judean foothills. Joash was in charge of the stores of olive oil.";
csb[29] = "Shitrai the Sharonite was in charge of the herds that grazed in Sharon, while Shaphat son of Adlai was in charge of the herds in the valleys.";
csb[30] = "Obil the Ishmaelite was in charge of the camels. Jehdeiah the Meronothite was in charge of the donkeys.";
csb[31] = "Jaziz the Hagrite was in charge of the flocks. All these were officials in charge of King David\'s property.";
csb[32] = "David\'s uncle Jonathan was a counselor; he was a man of understanding and a scribe. Jehiel son of Hachmoni attended the king\'s sons.";
csb[33] = "Ahithophel was the king\'s counselor. Hushai the Archite was the king\'s friend.";
csb[34] = "After Ahithophel came Jehoiada son of Benaiah, then Abiathar. Joab was the commander of the king\'s army.";
