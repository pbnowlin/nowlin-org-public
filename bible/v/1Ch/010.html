asv[1] = "Now the Philistines fought against Israel: and the men of Israel fled from before the Philistines, and fell down slain in mount Gilboa.";
asv[2] = "And the Philistines followed hard after Saul and after his sons; and the Philistines slew Jonathan, and Abinadab, and Malchi-shua, the sons of Saul.";
asv[3] = "And the battle went sore against Saul, and the archers overtook him; and he was distressed by reason of the archers.";
asv[4] = "Then said Saul unto his armor-bearer, Draw thy sword, and thrust me through therewith, lest these uncircumcised come and abuse me. But his armor-bearer would not; for he was sore afraid. Therefore Saul took his sword, and fell upon it.";
asv[5] = "And when his armor-bearer saw that Saul was dead, he likewise fell upon his sword, and died.";
asv[6] = "So Saul died, and his three sons; and all his house died together.";
asv[7] = "And when all the men of Israel that were in the valley saw that they fled, and that Saul and his sons were dead, they forsook their cities, and fled; and the Philistines came and dwelt in them.";
asv[8] = "And it came to pass on the morrow, when the Philistines came to strip the slain, that they found Saul and his sons fallen in mount Gilboa.";
asv[9] = "And they stripped him, and took his head, and his armor, and sent into the land of the Philistines round about, to carry the tidings unto their idols, and to the people.";
asv[10] = "And they put his armor in the house of their gods, and fastened his head in the house of Dagon.";
asv[11] = "And when all Jabesh-gilead heard all that the Philistines had done to Saul,";
asv[12] = "all the valiant men arose, and took away the body of Saul, and the bodies of his sons, and brought them to Jabesh, and buried their bones under the oak in Jabesh, and fasted seven days.";
asv[13] = "So Saul died for his trespass which he committed against Jehovah, because of the word of Jehovah, which he kept not; and also for that he asked counsel of one that had a familiar spirit, to inquire [thereby],";
asv[14] = "and inquired not of Jehovah: therefore he slew him, and turned the kingdom unto David the son of Jesse.";

dby[11] = "And when all they of Jabesh-Gilead heard of all that the Philistines had done to Saul,";
dby[12] = "all the valiant men arose, and took up the body of Saul and the bodies of his sons, and brought them to Jabesh, and buried their bones under the terebinth of Jabesh, and fasted seven days.";

hnv[1] = "Now the Pelishtim fought against Yisra\'el: and the men of Yisra\'el fled from before the Pelishtim, and fell down slain on Mount Gilboa.";
hnv[2] = "The Pelishtim followed hard after Sha\'ul and after his sons; and the Pelishtim killed Yonatan, and Avinadav, and Malki-Shua, the sons of Sha\'ul.";
hnv[3] = "The battle went sore against Sha\'ul, and the archers overtook him; and he was distressed by reason of the archers.";
hnv[4] = "Then said Sha\'ul to his armor-bearer, Draw your sword, and thrust me through therewith, lest these uncircumcised come and abuse me. But his armor-bearer would not; for he was sore afraid. Therefore Sha\'ul took his sword, and fell on it.";
hnv[5] = "When his armor-bearer saw that Sha\'ul was dead, he likewise fell on his sword, and died.";
hnv[6] = " So Sha\'ul died, and his three sons; and all his house died together.";
hnv[7] = "When all the men of Yisra\'el who were in the valley saw that they fled, and that Sha\'ul and his sons were dead, they forsook their cities, and fled; and the Pelishtim came and lived in them.";
hnv[8] = "It happened on the next day, when the Pelishtim came to strip the slain, that they found Sha\'ul and his sons fallen on Mount Gilboa.";
hnv[9] = "They stripped him, and took his head, and his armor, and sent into the land of the Pelishtim round about, to carry the news to their idols, and to the people.";
hnv[10] = "They put his armor in the house of their gods, and fastened his head in the house of Dagon.";
hnv[11] = "When all Yavesh-Gil`ad heard all that the Pelishtim had done to Sha\'ul,";
hnv[12] = "all the valiant men arose, and took away the body of Sha\'ul, and the bodies of his sons, and brought them to Yavesh, and buried their bones under the oak in Yavesh, and fasted seven days.";
hnv[13] = "So Sha\'ul died for his trespass which he committed against the LORD, because of the word of the LORD, which he didn\'t keep; and also because he asked counsel of one who had a familiar spirit, to inquire [thereby],";
hnv[14] = "and didn\'t inquire of the LORD: therefore he killed him, and turned the kingdom to David the son of Yishai.";

rsv[1] = "Now the Philistines fought against Israel; and the men of Israel fled before the Philistines, and fell slain on Mount Gilbo\'a.";
rsv[2] = "And the Philistines overtook Saul and his sons; and the Philistines slew Jonathan and Abin\'adab and Mal\'chishu\'a, the sons of Saul.";
rsv[3] = "The battle pressed hard upon Saul, and the archers found him; and he was wounded by the archers.";
rsv[4] = "Then Saul said to his armor-bearer, &quot;Draw your sword, and thrust me through with it, lest these uncircumcised come and make sport of me.&quot; But his armor-bearer would not; for he feared greatly. Therefore Saul took his own sword, and fell upon it.";
rsv[5] = "And when his armor-bearer saw that Saul was dead, he also fell upon his sword, and died.";
rsv[6] = "Thus Saul died; he and his three sons and all his house died together.";
rsv[7] = "And when all the men of Israel who were in the valley saw that the army had fled and that Saul and his sons were dead, they forsook their cities and fled; and the Philistines came and dwelt in them.";
rsv[8] = "On the morrow, when the Philistines came to strip the slain, they found Saul and his sons fallen on Mount Gilbo\'a.";
rsv[9] = "And they stripped him and took his head and his armor, and sent messengers throughout the land of the Philistines, to carry the good news to their idols and to the people.";
rsv[10] = "And they put his armor in the temple of their gods, and fastened his head in the temple of Dagon.";
rsv[11] = "But when all Ja\'besh-gil\'ead heard all that the Philistines had done to Saul,";
rsv[12] = "all the valiant men arose, and took away the body of Saul and the bodies of his sons, and brought them to Jabesh. And they buried their bones under the oak in Jabesh, and fasted seven days.";
rsv[13] = "So Saul died for his unfaithfulness; he was unfaithful to the LORD in that he did not keep the command of the LORD, and also consulted a medium, seeking guidance,";
rsv[14] = "and did not seek guidance from the LORD. Therefore the LORD slew him, and turned the kingdom over to David the son of Jesse.";
vul[1] = "Philisthim autem pugnabant contra Israhel fugeruntque viri Israhel Palestinos et ceciderunt vulnerati in monte Gelboe";
vul[2] = "cumque adpropinquassent Philisthei persequentes Saul et filios eius percusserunt Ionathan et Abinadab et Melchisuae filios Saul";
vul[3] = "et adgravatum est proelium contra Saul inveneruntque eum sagittarii et vulneraverunt iaculis";
vul[4] = "et dixit Saul ad armigerum suum evagina gladium tuum et interfice me ne forte veniant incircumcisi isti et inludant mihi noluit autem armiger eius hoc facere timore perterritus arripuit igitur Saul ensem et inruit in eum";
vul[5] = "quod cum vidisset armiger eius videlicet mortuum esse Saul inruit etiam ipse in gladium suum et mortuus est";
vul[6] = "interiit ergo Saul et tres filii eius et omnis domus illius pariter concidit";
vul[7] = "quod cum vidissent viri Israhel qui habitabant in campestribus fugerunt et Saul ac filiis eius mortuis dereliquerunt urbes suas et huc illucque dispersi sunt veneruntque Philisthim et habitaverunt in eis";
vul[8] = "die igitur altero detrahentes Philisthim spolia caesorum invenerunt Saul et filios eius iacentes in monte Gelboe";
vul[9] = "cumque spoliassent eum et amputassent caput armisque nudassent miserunt in terram suam ut circumferretur et ostenderetur idolorum templis et populis";
vul[10] = "arma autem eius consecraverunt in fano dei sui et caput adfixerunt in templo Dagon";
vul[11] = "hoc cum audissent viri Iabesgalaad omnia scilicet quae Philisthim fecerunt super Saul";
vul[12] = "consurrexerunt singuli virorum fortium et tulerunt cadavera Saul et filiorum eius adtuleruntque ea in Iabes et sepelierunt ossa eorum subter quercum quae erat in Iabes et ieiunaverunt septem diebus";
vul[13] = "mortuus est ergo Saul propter iniquitates suas eo quod praevaricatus sit mandatum Domini quod praeceperat et non custodierit illud sed insuper etiam pythonissam consuluerit";
vul[14] = "nec speraverit in Domino propter quod et interfecit eum et transtulit regnum eius ad David filium Isai";

yng[1] = "And the Philistines have fought with Israel, and the men of Israel flee from the face of the Philistines, and fall wounded in mount Gilboa,";
yng[2] = "and the Philistines pursue after Saul, and after his sons, and the Philistines smite Jonathan, and Abinadab, and Malchi-Shua, sons of Saul.";
yng[3] = "And the battle [is] heavy on Saul, and those shooting with the bow find him, and he is wounded by those shooting,";
yng[4] = "and Saul saith unto the bearer of his weapons, `Draw thy sword, and pierce me with it, lest these uncircumcised come -- and have abused me.\' And the bearer of his weapons hath not been willing, for he feareth exceedingly, and Saul taketh the sword, and falleth upon it;";
yng[5] = "and the bearer of his weapons seeth that Saul [is] dead, and falleth, he also, on the sword, and dieth;";
yng[6] = "and Saul dieth, and his three sons, and all his house -- together they died.";
yng[7] = "And all the men of Israel who [are] in the valley see that they have fled, and that Saul and his sons have died, and they forsake their cities and flee, and the Philistines come and dwell in them.";
yng[8] = "And it cometh to pass, on the morrow, that the Philistines come to strip the wounded, and find Saul and his sons fallen in mount Gilboa,";
yng[9] = "and strip him, and bear away his head, and his weapons, and send into the land of the Philistines round about to proclaim tidings [to] their idols and the people,";
yng[10] = "and put his weapons in the house of their gods, and his skull they have fixed in the house of Dagon.";
yng[11] = "And all Jabesh-Gilead hear of all that the Philistines have done to Saul,";
yng[12] = "and all the men of valour rise and bear away the body of Saul, and the bodies of his sons, and bring them in to Jabesh, and bury their bones under the oak in Jabesh, and fast seven days.";
yng[13] = "And Saul dieth because of his trespass that he trespassed against Jehovah, against the word of Jehovah that he kept not, and also for asking at a familiar spirit -- to inquire, --";
yng[14] = "and he inquired not at Jehovah, and He putteth him to death, and turneth round the kingdom to David son of Jesse.";
csb[1] = "The Philistines fought against Israel, and Israel\'s men fled from them. Many were killed on Mount Gilboa.";
csb[2] = "The Philistines pursued Saul and his sons and killed his sons Jonathan, Abinadab, and Malchishua.";
csb[3] = "When the battle intensified against Saul, the archers spotted him and severely wounded him.";
csb[4] = "Then Saul said to his armor-bearer, &quot;Draw your sword and run me through with it, or these uncircumcised men will come and torture me.&quot; But his armor-bearer would not do it because he was terrified. Then Saul took his sword and fell on it.";
csb[5] = "When his armor-bearer saw that Saul was dead, he also fell on his own sword and died.";
csb[6] = "So Saul and his three sons died -- his whole house died together.";
csb[7] = "When all the men of Israel in the valley saw that the army had fled and that Saul and his sons were dead, they abandoned their cities and fled. So the Philistines came and settled in them.";
csb[8] = "The next day when the Philistines came to strip the slain, they found Saul and his sons dead on Mount Gilboa.";
csb[9] = "They stripped Saul, cut off his head, took his armor, and sent messengers throughout the land of the Philistines to spread the good news to their idols and the people.";
csb[10] = "Then they put his armor in the temple of their gods and hung his skull in the temple of Dagon.";
csb[11] = "When all Jabesh-gilead heard of everything the Philistines had done to Saul,";
csb[12] = "all their brave men set out and retrieved the body of Saul and the bodies of his sons and brought them to Jabesh. They buried their bones under the oak in Jabesh and fasted seven days.";
csb[13] = "Saul died for his unfaithfulness to the LORD because he did not keep the LORD\'s word. He even consulted a medium for guidance,";
csb[14] = "but he did not inquire of the LORD. So the LORD put him to death and turned the kingdom over to David son of Jesse.";
