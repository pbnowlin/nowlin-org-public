asv[1] = "The sons of Judah: Perez, Hezron, and Carmi, and Hur, and Shobal.";
asv[2] = "And Reaiah the son of Shobal begat Jahath; and Jahath begat Ahumai and Lahad. These are the families of the Zorathites.";
asv[3] = "And these were [the sons of] the father of Etam: Jezreel, and Ishma, and Idbash; and the name of their sister was Hazzelelponi;";
asv[4] = "and Penuel the father of Gedor, and Ezer the father of Hushah. These are the sons of Hur, the first-born of Ephrathah, the father of Beth-lehem.";
asv[5] = "And Ashhur the father of Tekoa had two wives, Helah and Naarah.";
asv[6] = "And Naarah bare him Ahuzzam, and Hepher, and Temeni, and Haahashtari. These were the sons of Naarah.";
asv[7] = "And the sons of Helah were Zereth, Izhar, and Ethnan.";
asv[8] = "And Hakkoz begat Anub, and Zobebah, and the families of Aharhel the son of Harum.";
asv[9] = "And Jabez was more honorable than his brethren: and his mother called his name Jabez, saying, Because I bare him with sorrow.";
asv[10] = "And Jabez called on the God of Israel, saying, Oh that thou wouldest bless me indeed, and enlarge my border, and that thy hand might be with me, and that thou wouldest keep me from evil, that it be not to my sorrow! And God granted him that which he requested.";
asv[11] = "And Chelub the brother of Shuhah begat Mehir, who was the father of Eshton.";
asv[12] = "And Eshton begat Beth-rapha, and Paseah, and Tehinnah the father of Ir-nahash. These are the men of Recah.";
asv[13] = "And the sons of Kenaz: Othniel, and Seraiah. And the sons of Othniel: Hathath.";
asv[14] = "And Meonothai begat Ophrah: and Seraiah begat Joab the father of Ge-harashim; for they were craftsmen.";
asv[15] = "And the sons of Caleb the son of Jephunneh: Iru, Elah, and Naam; and the sons of Elah; and Kenaz.";
asv[16] = "And the sons of Jehallelel: Ziph, and Ziphah, Tiria, and Asarel.";
asv[17] = "And the sons of Ezrah: Jether, and Mered, and Epher, and Jalon; and she bare Miriam, and Shammai, and Ishbah the father of Eshtemoa.";
asv[18] = "And his wife the Jewess bare Jered the father of Gedor, and Heber the father of Soco, and Jekuthiel the father of Zanoah. And these are the sons of Bithiah the daughter of Pharaoh, whom Mered took.";
asv[19] = "And the sons of the wife of Hodiah, the sister of Naham, were the father of Keilah the Garmite, and Eshtemoa the Maacathite.";
asv[20] = "And the sons of Shimon: Amnon, and Rinnah, Ben-hanan, and Tilon. And the sons of Ishi: Zoheth, and Ben-zoheth.";
asv[21] = "The sons of Shelah the son of Judah: Er the father of Lecah, and Laadah the father of Mareshah, and the families of the house of them that wrought fine linen, of the house of Ashbea;";
asv[22] = "and Jokim, and the men of Cozeba, and Joash, and Saraph, who had dominion in Moab, and Jashubilehem. And the records are ancient.";
asv[23] = "These were the potters, and the inhabitants of Netaim and Gederah: there they dwelt with the king for his work.";
asv[24] = "The sons of Simeon: Nemuel, and Jamin, Jarib, Zerah, Shaul;";
asv[25] = "Shallum his son, Mibsam his son, Mishma his son.";
asv[26] = "And the sons of Mishma: Hammuel his son, Zaccur his son, Shimei his son.";
asv[27] = "And Shimei had sixteen sons and six daughters; but his brethren had not many children, neither did all their family multiply like to the children of Judah.";
asv[28] = "And they dwelt at Beer-sheba, and Moladah, and Hazarshual,";
asv[29] = "and at Bilhah, and at Ezem, and at Tolad,";
asv[30] = "and at Bethuel, and at Hormah, and at Ziklag,";
asv[31] = "and at Beth-marcaboth, and Hazar-susim, and at Beth-biri, and at Shaaraim. These were their cities unto the reign of David.";
asv[32] = "And their villages were Etam, and Ain, Rimmon, and Tochen, and Ashan, five cities;";
asv[33] = "and all their villages that were round about the same cities, unto Baal. These were their habitations, and they have their genealogy.";
asv[34] = "And Meshobab, and Jamlech, and Joshah the son of Amaziah,";
asv[35] = "and Joel, and Jehu the son of Joshibiah, the son of Seraiah, the son of Asiel,";
asv[36] = "and Elioenai, and Jaakobah, and Jeshohaiah, and Asaiah, and Adiel, and Jesimiel, and Benaiah,";
asv[37] = "and Ziza the son of Shiphi, the son of Allon, the son of Jedaiah, the son of Shimri, the son of Shemaiah--";
asv[38] = "these mentioned by name were princes in their families: and their fathers\' houses increased greatly.";
asv[39] = "And they went to the entrance of Gedor, even unto the east side of the valley, to seek pasture for their flocks.";
asv[40] = "And they found fat pasture and good, and the land was wide, and quiet, and peaceable; for they that dwelt there aforetime were of Ham.";
asv[41] = "And these written by name came in the days of Hezekiah king of Judah, and smote their tents, and the Meunim that were found there, and destroyed them utterly unto this day, and dwelt in their stead; because there was pasture there for their flocks.";
asv[42] = "And some of them, even of the sons of Simeon, five hundred men, went to mount Seir, having for their captains Pelatiah, and Neariah, and Rephaiah, and Uzziel, the sons of Ishi.";
asv[43] = "And they smote the remnant of the Amalekites that escaped, and have dwelt there unto this day.";

hnv[1] = "The sons of Yehudah: Peretz, Hetzron, and Karmi, and Hur, and Shoval.";
hnv[2] = "Re\'ayah the son of Shoval became the father of Yachat; and Yachat became the father of Achumai and Lahad. These are the families of the Tzor`ati.";
hnv[3] = "These were [the sons of] the father of `Etam: Yizre`el, and Yishma, and Yidbash; and the name of their sister was Hatztzelel-Poni;";
hnv[4] = "and Penu\'el the father of Gedor, and Etzer the father of Hushah. These are the sons of Hur, the firstborn of Efratah, the father of Beit-Lechem.";
hnv[5] = "Ashshur the father of Tekoa had two wives, Hel\'ah and Na`arah.";
hnv[6] = "Na`arah bore him Achuzzam, and Hefer, and Timni, and Achashtari. These were the sons of Na`arah.";
hnv[7] = " The sons of Hel\'ah were Tzeret, Tzochar, and Etnan.";
hnv[8] = "Kotz became the father of `Anuv, and Tzovevah, and the families of Acharchel the son of Harum.";
hnv[9] = "Ya`betz was more honorable than his brothers: and his mother named him Ya`betz, saying, Because I bore him with sorrow.";
hnv[10] = "Ya`betz called on the God of Yisra\'el, saying, Oh that you would bless me indeed, and enlarge my border, and that your hand might be with me, and that you would keep me from evil, that it not be to my sorrow! God granted him that which he requested.";
hnv[11] = "Kelub the brother of Shuchah became the father of Mechir, who was the father of Eshton.";
hnv[12] = "Eshton became the father of Beit-Rafa, and Pase\'ach, and Techinnah the father of Ir-Nachash. These are the men of Rekhah.";
hnv[13] = " The sons of Kenaz: `Otni\'el, and Serayah. The sons of `Otni\'el: Hatat.";
hnv[14] = "Me`onotai became the father of Ofrat: and Serayah became the father of Yo\'av the father of Ge-Harashim; for they were craftsmen.";
hnv[15] = "The sons of Kalev the son of Yefunneh: Iru, Elah, and Na`am; and the sons of Elah; and Kenaz.";
hnv[16] = "The sons of Yehallel\'el: Zif, and Zifah, Tiryah, and Asar\'el.";
hnv[17] = "The sons of Ezrah: Yeter, and Mered, and `Efer, and Yalon; and she bore Miryam, and Shammai, and Yishbach the father of Eshtemoa.";
hnv[18] = "His wife Yehudiyah bore Yered the father of Gedor, and Hever the father of Sokho, and Yekuti\'el the father of Zanoach. These are the sons of Bityah the daughter of Par`oh, whom Mered took.";
hnv[19] = "The sons of the wife of Hodiyah, the sister of Nacham, were the father of Ke`ilah the Garmite, and Eshtemoa the Ma`akhatite.";
hnv[20] = "The sons of Shimon: Amnon, and Rinnah, Ben-Hanan, and Tilon. The sons of Yish`i: Zochet, and Ben-Zochet.";
hnv[21] = "The sons of Shelah, the son of Yehudah: `Er the father of Lekha, and La`adah the father of Mareshah, and the families of the house of those who worked fine linen, of the house of Ashbea;";
hnv[22] = "and Yokim, and the men of Kozeva, and Yo\'ash, and Saraf, who had dominion in Mo\'av, and Yashuvi-Lechem. The records are ancient.";
hnv[23] = "These were the potters, and the inhabitants of Netaim and Gederah: there they lived with the king for his work.";
hnv[24] = "The sons of Shim`on: Nemu\'el, and Yamin, Yariv, Zerach, Sha\'ul;";
hnv[25] = "Shallum his son, Mivsam his son, Mishma his son.";
hnv[26] = "The sons of Mishma: Hammuel his son, Zakkur his son, Shim`i his son.";
hnv[27] = "Shim`i had sixteen sons and six daughters; but his brothers didn\'t have many children, neither did all their family multiply like the children of Yehudah.";
hnv[28] = "They lived at Be\'er-Sheva, and Moladah, and Hatzar-Shu`al,";
hnv[29] = "and at Bilhah, and at `Etzem, and at Tolad,";
hnv[30] = "and at Betu\'el, and at Hormah, and at Tziklag,";
hnv[31] = "and at Beit-Markavot, and Hatzar-Susim, and at Beit-Bir\'i, and at Sha`arayim. These were their cities to the reign of David.";
hnv[32] = "Their villages were `Etam, and `Ayin, Rimmon, and Tokhen, and `Ashan, five cities;";
hnv[33] = "and all their villages that were round about the same cities, to Ba`al. These were their habitations, and they have their genealogy.";
hnv[34] = "Meshovav, and Yamlekh, and Yoshah the son of Amatzyah,";
hnv[35] = "and Yo\'el, and Yehu the son of Yoshivyah, the son of Serayah, the son of `Asi\'el,";
hnv[36] = "and Elyo`enai, and Ya`akovah, and Yeshochayah, and `Asayah, and `Adi\'el, and Yesimi\'el, and Benayah,";
hnv[37] = "and Ziza the son of Shif`i, the son of Allon, the son of Yedayah, the son of Shimri, the son of Shemayah--";
hnv[38] = "these mentioned by name were princes in their families: and their fathers\' houses increased greatly.";
hnv[39] = "They went to the entrance of Gedor, even to the east side of the valley, to seek pasture for their flocks.";
hnv[40] = " They found fat pasture and good, and the land was wide, and quiet, and peaceable; for those who lived there before were of Ham.";
hnv[41] = "These written by name came in the days of Hizkiyahu king of Yehudah, and struck their tents, and the Me`unim who were found there, and destroyed them utterly to this day, and lived in their place; because there was pasture there for their flocks.";
hnv[42] = "Some of them, even of the sons of Shim`on, five hundred men, went to Mount Se`ir, having for their captains Pelatyah, and Ne`aryah, and Refayah, and `Uzzi\'el, the sons of Yish`i.";
hnv[43] = "They struck the remnant of the `Amaleki who escaped, and have lived there to this day.";

rsv[1] = "The sons of Judah: Perez, Hezron, Carmi, Hur, and Shobal.";

rsv[12] = "Eshton was the father of Bethra\'pha, Pase\'ah, and Tehin\'nah the father of Irna\'hash. These are the men of Recah.";
rsv[13] = "The sons of Kenaz: Oth\'ni-el and Serai\'ah; and the sons of Oth\'ni-el: Hathath and Meo\'nothai.";
rsv[14] = "Meo\'nothai was the father of Ophrah; and Serai\'ah was the father of Jo\'ab the father of Ge-har\'ashim, so-called because they were craftsmen.";
rsv[15] = "The sons of Caleb the son of Jephun\'neh: Iru, Elah, and Na\'am; and the sons of Elah: Kenaz.";
rsv[16] = "The sons of Jehal\'lelel: Ziph, Ziphah, Tir\'i-a, and As\'arel.";
rsv[17] = "The sons of Ezrah: Jether, Mered, Epher, and Jalon. These are the sons of Bith\'i-ah, the daughter of Pharaoh, whom Mered married; and she conceived and bore Miriam, Sham\'mai, and Ishbah, the father of Eshtemo\'a.";
rsv[18] = "And his Jewish wife bore Jered the father of Gedor, Heber the father of Soco, and Jeku\'thiel the father of Zano\'ah.";
rsv[19] = "The sons of the wife of Hodi\'ah, the sister of Naham, were the fathers of Kei\'lah the Garmite and Eshtemo\'a the Ma-ac\'athite.";
rsv[20] = "The sons of Shimon: Amnon, Rinnah, Ben-ha\'nan, and Tilon. The sons of Ishi: Zoheth and Ben-zo\'heth.";
rsv[21] = "The sons of Shelah the son of Judah: Er the father of Lecah, La\'adah the father of Mare\'shah, and the families of the house of linen workers at Beth-ashbe\'a;";
rsv[22] = "and Jokim, and the men of Coze\'ba, and Jo\'ash, and Saraph, who ruled in Moab and returned to Lehem (now the records are ancient).";
rsv[23] = "These were the potters and inhabitants of Neta\'im and Gede\'rah; they dwelt there with the king for his work.";
rsv[24] = "The sons of Simeon: Nem\'uel, Jamin, Jarib, Zerah, Sha\'ul;";
rsv[25] = "Shallum was his son, Mibsam his son, Mishma his son.";
rsv[26] = "The sons of Mishma: Ham\'mu-el his son, Zac\'cur his son, Shim\'e-i his son.";
rsv[27] = "Shim\'e-i had sixteen sons and six daughters; but his brothers had not many children, nor did all their family multiply like the men of Judah.";
rsv[28] = "They dwelt in Beer-sheba, Mola\'dah, Ha\'zar-shu\'al,";
rsv[29] = "Bilhah, Ezem, Tolad,";
rsv[30] = "Bethu\'el, Hormah, Ziklag,";
rsv[31] = "Beth-mar\'caboth, Ha\'zar-su\'sim, Beth-biri, and Sha-ara\'im. These were their cities until David reigned.";
rsv[32] = "And their villages were Etam, A\'in, Rimmon, Tochen, and Ashan, five cities,";
rsv[33] = "along with all their villages which were round about these cities as far as Ba\'al. These were their settlements, and they kept a genealogical record.";
rsv[34] = "Mesho\'bab, Jamlech, Joshah the son of Amazi\'ah,";
rsv[35] = "Jo\'el, Jehu the son of Joshibi\'ah, son of Serai\'ah, son of As\'i-el,";
rsv[36] = "Eli-o-e\'nai, Ja-ako\'bah, Jeshohai\'ah, Asai\'ah, Ad\'i-el, Jesim\'iel, Benai\'ah,";
rsv[37] = "Ziza the son of Shiphi, son of Allon, son of Jedai\'ah, son of Shimri, son of Shemai\'ah--";
rsv[38] = "these mentioned by name were princes in their families, and their fathers\' houses increased greatly.";
rsv[39] = "They journeyed to the entrance of Gedor, to the east side of the valley, to seek pasture for their flocks,";
rsv[40] = "where they found rich, good pasture, and the land was very broad, quiet, and peaceful; for the former inhabitants there belonged to Ham.";
rsv[41] = "These, registered by name, came in the days of Hezeki\'ah, king of Judah, and destroyed their tents and the Me-u\'nim who were found there, and exterminated them to this day, and settled in their place, because there was pasture there for their flocks.";
rsv[42] = "And some of them, five hundred men of the Simeonites, went to Mount Se\'ir, having as their leaders Pelati\'ah, Ne-ari\'ah, Rephai\'ah, and Uz\'ziel, the sons of Ishi;";
rsv[43] = "and they destroyed the remnant of the Amal\'ekites that had escaped, and they have dwelt there to this day.";
vul[1] = "filii Iuda Phares Esrom et Carmi et Ur et Subal";
vul[2] = "Reaia vero filius Subal genuit Ieth de quo nati sunt Ahimai et Laed hae cognationes Sarathi";
vul[3] = "ista quoque stirps Hetam Iezrahel et Iesema et Iedebos nomenque sororis eorum Asalelphuni";
vul[4] = "Phunihel autem pater Gedor et Ezer pater Osa isti sunt filii Ur primogeniti Ephrata patris Bethleem";
vul[5] = "Asur vero patris Thecue erant duae uxores Halaa et Naara";
vul[6] = "peperit autem ei Naara Oozam et Epher et Themani et Asthari isti sunt filii Naara";
vul[7] = "porro filii Halaa Sereth Isaar et Ethnan";
vul[8] = "Cos autem genuit Anob et Sobaba et cognationem Aral filii Arum";
vul[9] = "fuit autem Iabes inclitus prae fratribus suis et mater eius vocavit nomen illius Iabes dicens quia peperi eum in dolore";
vul[10] = "invocavit vero Iabes Deum Israhel dicens si benedicens benedixeris mihi et dilataveris terminos meos et fuerit manus tua mecum et feceris me a malitia non opprimi et praestitit Deus quae precatus est";
vul[11] = "Chaleb autem frater Suaa genuit Machir qui fuit pater Esthon";
vul[12] = "porro Esthon genuit Bethrapha et Phesse et Thena patrem urbis Naas hii sunt viri Recha";
vul[13] = "filii autem Cenez Othonihel et Saraia porro filii Othonihel Athath";
vul[14] = "et Maonathi genuit Ophra Saraias autem genuit Ioab patrem vallis Artificum ibi quippe artifices erant";
vul[15] = "filii vero Chaleb filii Iephonne Hir et Hela et Nahem filiique Hela et Cenez";
vul[16] = "filii quoque Iallelel Ziph et Zipha Thiria et Asrahel";
vul[17] = "et filii Ezra Iether et Mered et Epher et Ialon genuitque Mariam et Sammai et Iesba patrem Esthamo";
vul[18] = "uxor quoque eius Iudaia peperit Iared patrem Gedor et Heber patrem Soccho et Hicuthihel patrem Zano hii autem filii Beththiae filiae Pharaonis quam accepit Mered";
vul[19] = "et filii uxoris Odaiae sororis Naham patris Ceila Garmi et Esthamo qui fuit de Machathi";
vul[20] = "filii quoque Simon Amnon et Rena filius Anan et Thilon et filii Iesi Zoeth et Benzoeth";
vul[21] = "filii Sela filii Iuda Her pater Lecha et Laada pater Maresa et cognationes Domus operantium byssum in domo Iuramenti";
vul[22] = "et Qui stare fecit solem virique Mendacii et Securus et Incendens qui principes fuerunt in Moab et qui reversi sunt in Leem haec autem verba vetera";
vul[23] = "hii sunt figuli habitantes in plantationibus et in praesepibus apud regem in operibus eius commoratique sunt ibi";
vul[24] = "filii Symeon Namuhel et Iamin Iarib Zara Saul";
vul[25] = "Sellum filius eius Mabsam filius eius Masma filius eius";
vul[26] = "filii Masma Amuhel filius eius Zacchur filius eius Semei filius eius";
vul[27] = "filii Semei sedecim et filiae sex fratres autem eius non habuerunt filios multos et universa cognatio non potuit adaequare summam filiorum Iuda";
vul[28] = "habitaverunt autem in Bersabee et Molada et Asarsual";
vul[29] = "et in Ballaa et in Asom et in Tholad";
vul[30] = "et in Bathuhel et in Orma et in Siceleg";
vul[31] = "et in Bethmarchaboth et in Asarsusim et in Bethberai et in Saarim hae civitates eorum usque ad regem David";
vul[32] = "villae quoque eorum Etham et Aen et Remmon et Thochen et Asan civitates quinque";
vul[33] = "et universi viculi eorum per circuitum civitatum istarum usque ad Baal haec est habitatio eorum et sedum distributio";
vul[34] = "Masobab quoque et Iemlech et Iosa filius Amasiae";
vul[35] = "et Iohel et Ieu filius Iosabiae filii Saraiae filii Asihel";
vul[36] = "et Helioenai et Iacoba et Isuaia et Asaia et Adihel et Isimihel et Banaia";
vul[37] = "Ziza quoque filius Sephei filii Allon filii Idaia filii Semri filii Samaia";
vul[38] = "isti sunt nominati principes in cognationibus suis et in domo adfinitatum suarum multiplicati sunt vehementer";
vul[39] = "et profecti sunt ut ingrederentur in Gador usque ad orientem vallis et ut quaererent pascua gregibus suis";
vul[40] = "inveneruntque pascuas uberes et valde bonas et terram latissimam et quietam et fertilem in qua ante habitaverunt de stirpe Ham";
vul[41] = "hii ergo venerunt quos supra descripsimus nominatim in diebus Ezechiae regis Iuda et percusserunt tabernacula eorum et habitatores qui inventi fuerant ibi et deleverunt eos usque in praesentem diem habitaveruntque pro eis quoniam uberrimas ibidem pascuas reppererunt";
vul[42] = "de filiis quoque Symeon abierunt in montem Seir viri quingenti habentes principes Phaltiam et Nahariam et Raphaiam et Ozihel filios Iesi";
vul[43] = "et percusserunt reliquias quae evadere potuerant Amalechitarum et habitaverunt ibi pro eis usque ad diem hanc";
web[1] = "The sons of Judah; Pharez, Hezron, and Carmi, and Hur, and Shobal.";
web[2] = "And Reaiah the son of Shobal begat Jahath; and Jahath begat Ahumai, and Lahad. These [are] the families of the Zorathites.";
web[3] = "And these [were of] the father of Etam; Jezreel, and Ishma, and Idbash: and the name of their sister [was] Hazelelponi:";
web[4] = "And Penuel the father of Gedor, and Ezer the father of Hushah. These [are] the sons of Hur, the first-born of Ephratah, the father of Beth-lehem.";
web[5] = "And Ashur the father of Tekoa had two wives, Helah and Naarah.";
web[6] = "And Naarah bore him Ahuzam, and Hepher, and Temeni, and Haahashtari. These [were] the sons of Naarah.";
web[7] = "And the sons of Helah [were], Zereth, and Jezoar, and Ethnan.";
web[8] = "And Coz begat Anub, and Zobebah, and the families of Aharhel the son of Harum.";
web[9] = "And Jabez was more honorable than his brethren: and his mother called his name Jabez, saying, Because I bore him with sorrow.";
web[10] = "And Jabez called on the God of Israel, saying, Oh that thou wouldst bless me indeed, and enlarge my border, and that thy hand might be with me, and that thou wouldst keep [me] from evil, that it may not grieve me! And God granted him that which he requested.";
web[11] = "And Chelub the brother of Shuah begat Mehir, who [was] the father of Eshton.";
web[12] = "And Eshton begat Beth-rapha, and Paseah, and Tehinnah the father of Ir-nahash. These [are] the men of Rechah.";
web[13] = "And the sons of Kenaz; Othniel, and Seraiah: and the sons of Othniel; Hathath.";
web[14] = "And Meonothai begat Ophrah: and Seraiah begat Joab, the father of the valley of Charashim; for they were artificers.";
web[15] = "And the sons of Caleb the son of Jephunneh; Iru, Elah, and Naam: and the sons of Elah, even Kenaz.";
web[16] = "And the sons of Jehaleleel; Ziph, and Ziphah, Tiria, and Asareel.";
web[17] = "And the sons of Ezra [were], Jethur, and Mered, and Epher, and Jalon: and she bore Miriam, and Shammai, and Ishbah the father of Eshtemoa.";
web[18] = "And his wife Jehudijah bore Jered the father of Gedor, and Heber the father of Socho, and Jekuthiel the father of Zanoah. And these [are] the sons of Bithiah the daughter of Pharaoh whom Mered took.";
web[19] = "And the sons of [his] wife Hodiah the sister of Naham, the father of Keilah the Garmite, and Eshtemoa the Maachathite.";
web[20] = "And the sons of Shimon [were], Amnon, and Rinnah, Ben-hanan, and Tilon. And the sons of Ishi [were], Zoheth, and Benzoheth.";
web[21] = "The sons of Shelah the son of Judah [were], Er the father of Lecah, and Laadah the father of Mareshah, and the families of the house of them that wrought fine linen, of the house of Ashbea,";
web[22] = "And Jokim, and the men of Chozeba, and Joash, and Saraph, who had the dominion in Moab, and Jashubi-lehem. And [these are] ancient things.";
web[23] = "These [were] the potters, and those that dwelt among plants and hedges: there they dwelt with the king for his work.";
web[24] = "The sons of Simeon [were] Nemuel, and Jamin, Jarib, Zerah, [and] Shaul:";
web[25] = "Shallum his son, Mibsam his son, Mishma his son.";
web[26] = "And the sons of Mishma; Hamuel his son, Zacchur his son, Shimei his son.";
web[27] = "And Shimei had sixteen sons and six daughters; but his brethren had not many children, neither did all their family multiply, like the children of Judah.";
web[28] = "And they dwelt at Beer-sheba, and Moladah, and Hazar-shual,";
web[29] = "And at Bilhah, and at Ezem, and at Tolad,";
web[30] = "And at Bethuel, and at Hormah, and at Ziklag,";
web[31] = "And at Beth-marcaboth, and Hazar-susim, and at Beth-birei, and at Shaaraim. These [were] their cities to the reign of David.";
web[32] = "And their villages [were], Etam, and Ain, Rimmon, and Tochen, and Ashan, five cities:";
web[33] = "And all their villages that [were] around the same cities to Baal. These [were] their habitations, and their genealogy.";
web[34] = "And Meshobab, and Jamlech, and Joshah the son of Amaziah,";
web[35] = "And Joel, and Jehu the son of Josibiah, the son of Seraiah, the son of Asiel,";
web[36] = "And Elioenai, and Jaakobah, and Jeshohaiah, and Asaiah, and Adiel, and Jesimiel, and Benaiah,";
web[37] = "And Ziza the son of Shiphi, the son of Allon, the son of Jedaiah, the son of Shimri, the son of Shemaiah;";
web[38] = "These mentioned by [their] names [were] princes in their families: and the house of their fathers increased greatly.";
web[39] = "And they went to the entrance of Gedor, [even] to the east side of the valley, to seek pasture for their flocks.";
web[40] = "And they found rich pasture and good, and the land [was] wide, and quiet, and peaceable; for [they] of Ham had dwelt there of old.";
web[41] = "And these written by name came in the days of Hezekiah king of Judah, and smote their tents, and the habitations that were found there, and destroyed them utterly to this day, and dwelt in their room: because [there was] pasture there for their flocks.";
web[42] = "And [some] of them, [even] of the sons of Simeon, five hundred men, went to mount Seir, having for their captains Pelatiah, and Neariah, and Rephaiah, and Uzziel, the sons of Ishi.";
web[43] = "And they smote the rest of the Amalekites that had escaped, and have dwelt there to this day.";
yng[1] = "Sons of Judah: Pharez, Hezron, and Carmi, and Hur, and Shobal.";
yng[2] = "And Reaiah son of Shobal begat Jahath, and Jahath begat Ahumai and Lahad; these [are] families of the Zorathite.";
yng[3] = "And these [are] of the father of Etam: Jezreel, and Ishma, and Idbash; and the name of their sister [is] Hazzelelponi,";
yng[4] = "and Penuel [is] father of Gedor, and Ezer father of Hushah. These [are] sons of Hur, first-born of Ephratah, father of Beth-Lehem.";
yng[5] = "And to Ashhur father of Tekoa were two wives, Helah and Naarah;";
yng[6] = "and Naarah beareth to him Ahuzzam, and Hepher, and Temeni, and Haahashtari: these [are] sons of Naarah.";
yng[7] = "And sons of Helah: Zereth, and Zohar, and Ethnan.";
yng[8] = "And Coz begat Anub, and Zobebah, and the families of Aharhel son of Harum.";
yng[9] = "And Jabez is honoured above his brethren, and his mother called his name Jabez, saying, `Because I have brought forth with grief.\'";
yng[10] = "And Jabez calleth to the God of Israel, saying, `If blessing Thou dost bless me, then Thou hast made great my border, and Thy hand hath been with me, and Thou hast kept [me] from evil -- not to grieve me;\' and God bringeth in that which he asked.";
yng[11] = "And Chelub brother of Shuah begat Mehir; he [is] father of Eshton.";
yng[12] = "And Eshton begat Beth-Rapha, and Paseah, and Tehinnah father of Ir-Nahash; these [are] men of Rechah.";
yng[13] = "And sons of Kenaz: Othniel, and Seraiah; and sons of Othniel: Hathath.";
yng[14] = "And Meonothai begat Ophrah, and Seraiah begat Joab father of the valley of artificers, for they were artificers.";
yng[15] = "And sons of Caleb son of Jephunneh: Iru, Elah, and Naam; and sons of Elah, even Kenaz.";
yng[16] = "And sons of Jehaleleel: Ziph and Ziphah, Tiria, and Asareel.";
yng[17] = "And sons of Ezra [are] Jether, and Mered, and Epher, and Jalon: and she beareth Miriam, and Shammai, and Ishbah father of Eshtemoa.";
yng[18] = "And his wife Jehudijah bare Jered father of Gedor, and Heber father of Socho, and Jekuthiel father of Zanoah. And these [are] sons of Bithiah daughter of Pharaoh, whom Mered took,";
yng[19] = "and sons of the wife of Hodiah sister of Nahom: Abi-Keilah the Garmite, and Eshtemoa the Maachathite.";
yng[20] = "And sons of Shimon [are] Amnon, and Rinnah, Ben-Hanon, and Tilon; and sons of Ishi: Zoheth, and Ben-Zoheth.";
yng[21] = "Sons of Shelah son of Judah: Er father of Lecah, and Laadah father of Mareshah, and the families of the house of the service of fine linen, of the house of Ashbea;";
yng[22] = "and Jokim, and the men of Chozeba, and Joash, and Saraph, who ruled over Moab and Jashubi-Lehem; and these things [are] ancient.";
yng[23] = "They [are] the potters and inhabitants of Netaim and Gedera; with the king in his work they dwelt there.";
yng[24] = "Sons of Simeon: Nemuel, and Jamin, Jarib, Zerah, Shaul;";
yng[25] = "Shallum his son, Mibsam his son, Mishma his son.";
yng[26] = "And sons of Mishma: Hammuel his son, Zacchur his son, Shimei his son.";
yng[27] = "And to Shimei [are] sixteen sons and six daughters, and to his brethren there are not many sons, and none of their families have multiplied as much as the sons of Judah.";
yng[28] = "And they dwell in Beer-Sheba, and Moladah, and Hazar-Shaul,";
yng[29] = "and in Bilhah, and in Ezem, and in Tolad,";
yng[30] = "and in Bethuel, and in Hormah, and in Ziklag,";
yng[31] = "and in Beth-Marcaboth, and in Hazar-Susim, and in Beth-Birei, and in Shaarim; these [are] their cities till the reigning of David.";
yng[32] = "And their villages [are] Etam, and Ain, Rimmon, and Tochen, and Ashan, five cities,";
yng[33] = "and all their villages that [are] round about these cities unto Baal; these [are] their dwellings, and they have their genealogy:";
yng[34] = "even Meshobab, and Jamlech, and Joshah son of Amaziah,";
yng[35] = "and Joel, and Jehu son of Josibiah, son of Seraiah, son of Asiel,";
yng[36] = "and Elioenai, and Jaakobah, and Jeshohaiah, and Asaiah, and Adiel, and Jesimiel, and Benaiah,";
yng[37] = "and Ziza son of Shiphi, son of Allon, son of Jedaiah, son of Shimri, son of Shemaiah.";
yng[38] = "These who are coming in by name [are] princes in their families, and the house of their fathers have broken forth into a multitude;";
yng[39] = "and they go to the entrance of Gedor, unto the east of the valley, to seek pasture for their flock,";
yng[40] = "and they find pasture, fat and good, and the land broad of sides, and quiet, and safe, for of Ham are those dwelling there before.";
yng[41] = "And these who are written by name come in the days of Hezekiah king of Judah, and smite their tents, and the habitations that have been found there, and devote them to destruction unto this day, and dwell in their stead, because pasture for their flock [is] there.";
yng[42] = "And of them, of the sons of Simeon, there have gone to mount Seir, five hundred men, and Pelatiah, and Neariah, and Rephaiah, and Uzziel, sons of Ishi, at their head,";
yng[43] = "and they smite the remnant of those escaped of Amalek, and dwell there unto this day.";
csb[1] = "Judah\'s sons: Perez, Hezron, Carmi, Hur, and Shobal.";
csb[2] = "Reaiah son of Shobal fathered Jahath, and Jahath fathered Ahumai and Lahad. These were the families of the Zorathites.";
csb[3] = "These were Etam\'s sons: Jezreel, Ishma, and Idbash, and their sister was named Hazzelelponi.";
csb[4] = "Penuel fathered Gedor, and Ezer fathered Hushah. These were the sons of Hur, Ephrathah\'s firstborn and the father of Bethlehem:";
csb[5] = "Ashhur fathered Tekoa and had two wives, Helah and Naarah.";
csb[6] = "Naarah bore Ahuzzam, Hepher, Temeni, and Haahashtari to him. These were Naarah\'s sons.";
csb[7] = "Helah\'s sons: Zereth, Zohar, and Ethnan.";
csb[8] = "Koz fathered Anub, Zobebah, and the families of Aharhel son of Harum.";
csb[9] = "Jabez was more honored than his brothers. His mother named him Jabez and said, &quot;I gave birth to him in pain.&quot;";
csb[10] = "Jabez called out to the God of Israel: &quot;If only you would bless me, extend my border, let your hand be with me, and keep me from harm, so that I will not experience pain.&quot; And God granted his request.";
csb[11] = "Chelub brother of Shuhah fathered Mehir, who was the father of Eshton.";
csb[12] = "Eshton fathered Beth-rapha, Paseah, and Tehinnah the father of Irnahash. These were the men of Recah.";
csb[13] = "Kenaz\'s sons: Othniel and Seraiah. Othniel\'s sons: Hathath and Meonothai.";
csb[14] = "Meonothai fathered Ophrah, and Seraiah fathered Joab, the ancestor of those in the Craftsmen\'s Valley, for they were craftsmen.";
csb[15] = "The sons of Caleb son of Jephunneh: Iru, Elah, and Naam. Elah\'s son: Kenaz.";
csb[16] = "Jehallelel\'s sons: Ziph, Ziphah, Tiria, and Asarel.";
csb[17] = "Ezrah\'s sons: Jether, Mered, Epher, and Jalon. Mered\'s wife Bithiah gave birth to Miriam, Shammai, and Ishbah the father of Eshtemoa.";
csb[18] = "These were the sons of Pharaoh\'s daughter Bithiah; Mered had married her. His Judean wife gave birth to Jered the father of Gedor, Heber the father of Soco, and Jekuthiel the father of Zanoah.";
csb[19] = "The sons of Hodiah\'s wife, the sister of Naham: the father of Keilah the Garmite and the father of Eshtemoa the Maacathite.";
csb[20] = "Shimon\'s sons: Amnon, Rinnah, Ben-hanan, and Tilon. Ishi\'s sons: Zoheth and Ben-zoheth.";
csb[21] = "The sons of Shelah son of Judah: Er the father of Lecah, Laadah the father of Mareshah, the families of the guild of linen workers at Beth-ashbea,";
csb[22] = "Jokim, the men of Cozeba; and Joash and Saraph, who married Moabites and returned to Lehem. These names are from ancient records.";
csb[23] = "They were the potters and residents of Netaim and Gederah. They lived there in the service of the king.";
csb[24] = "Simeon\'s sons: Nemuel, Jamin, Jarib, Zerah, and Shaul;";
csb[25] = "Shaul\'s sons: his son Shallum, his son Mibsam, and his son Mishma.";
csb[26] = "Mishma\'s sons: his son Hammuel, his son Zaccur, and his son Shimei.";
csb[27] = "Shimei had sixteen sons and six daughters, but his brothers did not have many children, so their whole family did not become as numerous as the Judeans.";
csb[28] = "They lived in Beer-sheba, Moladah, Hazar-shual,";
csb[29] = "Bilhah, Ezem, Tolad,";
csb[30] = "Bethuel, Hormah, Ziklag,";
csb[31] = "Beth-marcaboth, Hazar-susim, Beth-biri, and Shaaraim. These were their cities until David became king.";
csb[32] = "Their villages were Etam, Ain, Rimmon, Tochen, and Ashan -- five cities,";
csb[33] = "and all their surrounding villages as far as Baal. These were their settlements, and they kept a genealogical record for themselves.";
csb[34] = "Meshobab, Jamlech, Joshah son of Amaziah,";
csb[35] = "Joel, Jehu son of Joshibiah, son of Seraiah, son of Asiel,";
csb[36] = "Elioenai, Jaakobah, Jeshohaiah, Asaiah, Adiel, Jesimiel, Benaiah,";
csb[37] = "and Ziza son of Shiphi, son of Allon, son of Jedaiah, son of Shimri, son of Shemaiah --";
csb[38] = "these mentioned by name were leaders in their families. Their ancestral houses increased greatly.";
csb[39] = "They went to the entrance of Gedor, to the east side of the valley to seek pasture for their flocks.";
csb[40] = "They found rich, good pasture, and the land was broad, peaceful, and quiet, for some Hamites had lived there previously.";
csb[41] = "These who were recorded by name came in the days of King Hezekiah of Judah, attacked the Hamites\' tents and the Meunites who were found there, and set them apart for destruction, as they are today. Then they settled in their place because there was pasture for their flocks.";
csb[42] = "Now five hundred men from these sons of Simeon went with Pelatiah, Neariah, Rephaiah, and Uzziel, the descendants of Ishi, as their leaders to Mount Seir.";
csb[43] = "They struck down the remnant of the Amalekites who had escaped, and they still live there today.";
</script>
