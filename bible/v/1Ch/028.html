asv[1] = "And David assembled all the princes of Israel, the princes of the tribes, and the captains of the companies that served the king by course, and the captains of thousands, and the captains of hundreds, and the rulers over all the substance and possessions of the king and of his sons, with the officers, and the mighty men, even all the mighty men of valor, unto Jerusalem.";
asv[2] = "Then David the king stood up upon his feet, and said, Hear me, my brethren, and my people: as for me, it was in my heart to build a house of rest for the ark of the covenant of Jehovah, and for the footstool of our God; and I had made ready for the building.";
asv[3] = "But God said unto me, Thou shalt not build a house for my name, because thou art a man of war, and hast shed blood.";
asv[4] = "Howbeit Jehovah, the God of Israel, chose me out of all the house of my father to be king over Israel for ever: for he hath chosen Judah to be prince; and in the house of Judah, the house of my father; and among the sons of my father he took pleasure in me to make me king over all Israel;";
asv[5] = "And of all my sons (for Jehovah hath given me many sons), he hath chosen Solomon my son to sit upon the throne of the kingdom of Jehovah over Israel.";
asv[6] = "And he said unto me, Solomon thy son, he shall build my house and my courts; for I have chosen him to be my son, and I will be his father.";
asv[7] = "And I will establish his kingdom for ever, if he be constant to do my commandments and mine ordinances, as at this day.";
asv[8] = "Now therefore, in the sight of all Israel, the assembly of Jehovah, and in the audience of our God, observe and seek out all the commandments of Jehovah your God; that ye may possess this good land, and leave it for an inheritance to your children after you for ever.";
asv[9] = "And thou, Solomon my son, know thou the God of thy father, and serve him with a perfect heart and with a willing mind; for Jehovah searcheth all hearts, and understandeth all the imaginations of the thoughts: if thou seek him, he will be found of thee; but if thou forsake him, he will cast thee off for ever.";
asv[10] = "Take heed now; for Jehovah hath chosen thee to build a house for the sanctuary: be strong, and do it.";
asv[11] = "Then David gave to Solomon his son the pattern of the porch [of the temple], and of the houses thereof, and of the treasuries thereof, and of the upper rooms thereof, and of the inner chambers thereof, and of the place of the mercy-seat;";
asv[12] = "and the pattern of all that he had by the Spirit, for the courts of the house of Jehovah, and for all the chambers round about, for the treasuries of the house of God, and for the treasuries of the dedicated things;";
asv[13] = "also for the courses of the priests and the Levites, and for all the work of the service of the house of Jehovah, and for all the vessels of service in the house of Jehovah;";
asv[14] = "of gold by weight for the [vessels of] gold, for all vessels of every kind of service; [of silver] for all the vessels of silver by weight, for all vessels of every kind of service;";
asv[15] = "by weight also for the candlesticks of gold, and for the lamps thereof, of gold, by weight for every candlestick and for the lamps thereof; and for the candlesticks of silver, [silver] by weight for [every] candlestick and for the lamps thereof, according to the use of every candlestick;";
asv[16] = "and the gold by weight for the tables of showbread, for every table; and silver for the tables of silver;";
asv[17] = "and the flesh-hooks, and the basins, and the cups, of pure gold; and for the golden bowls by weight for every bowl; and for the silver bowls by weight for every bowl;";
asv[18] = "and for the altar of incense refined gold by weight; and gold for the pattern of the chariot, [even] the cherubim, that spread out [their wings], and covered the ark of the covenant of Jehovah.";
asv[19] = "All this, [said David], have I been made to understand in writing from the hand of Jehovah, even all the works of this pattern.";
asv[20] = "And David said to Solomon his son, Be strong and of good courage, and do it: fear not, nor be dismayed; for Jehovah God, even my God, is with thee; he will not fail thee, nor forsake thee, until all the work for the service of the house of Jehovah be finished.";
asv[21] = "And, behold, there are the courses of the priests and the Levites, for all the service of the house of God: and there shall be with thee in all manner of work every willing man that hath skill, for any manner of service: also the captains and all the people will be wholly at thy commandment.";
dby[1] = "And David assembled all the princes of Israel, the princes of the tribes, and the princes of the divisions that ministered to the king, and the captains over thousands, and the captains over hundreds, and the comptrollers of all the substance and possessions of the king and of his sons, with the chamberlains, and the mighty men, and all the men of valour, unto Jerusalem.";
dby[2] = "And king David stood up upon his feet, and said, Hear me, my brethren and my people! I had in my heart to build a house of rest for the ark of the covenant of Jehovah and for the footstool of our God, and I have prepared to build.";
dby[3] = "But God said to me, Thou shalt not build a house unto my name, for thou art a man of war, and hast shed blood.";
dby[4] = "And Jehovah the God of Israel chose me out of all the house of my father to be king over Israel for ever; for he has chosen Judah to be the prince; and of the house of Judah, the house of my father; and among the sons of my father he took pleasure in me to make me king over all Israel;";
dby[5] = "and of all my sons, (for Jehovah has given me many sons,) he has chosen Solomon my son to sit upon the throne of the kingdom of Jehovah over Israel.";
dby[6] = "And he said to me, Solomon thy son, he shall build my house and my courts; for I have chosen him to be my son, and I will be his father.";
dby[7] = "And I will establish his kingdom for ever, if he be firm to do my commandments and mine ordinances, as at this day.";
dby[8] = "And now in the sight of all Israel, the congregation of Jehovah, and in the audience of our God, -- keep and seek for all the commandments of Jehovah your God; that ye may possess the good land, and leave it as an inheritance to your children after you for ever.";
dby[9] = "And thou, Solomon my son, know the God of thy father, and serve him with a perfect heart and with a willing mind; for Jehovah searches all hearts, and discerns all the imaginations of the thoughts. If thou seek him, he will be found of thee; but if thou forsake him, he will cut thee off for ever.";
dby[10] = "Consider now, that Jehovah has chosen thee to build a house for the sanctuary: be strong, and do [it].";
dby[11] = "And David gave to Solomon his son the pattern of the porch, and of its houses, and of its treasuries, and of its upper chambers, and of its inner chambers, and of the house of the mercy-seat;";
dby[12] = "and the pattern of all that he had by the Spirit, of the courts of the house of Jehovah, and of all the chambers round about, for the treasuries of the house of God, and for the treasuries of the dedicated things;";
dby[13] = "and for the courses of the priests and the Levites, and for all the work of the service of the house of Jehovah, and for all the instruments of service in the house of Jehovah:";
dby[14] = "gold by weight for [things] of gold, for all utensils of each kind of service; for all utensils of silver, by weight, for all utensils of each kind of service;";
dby[15] = "and the weight of the golden candlesticks, and of their golden lamps, by weight for every candlestick, and for its lamps; and for the silver candlesticks, by weight, for the candlestick and for its lamps, according to the use of every candlestick;";
dby[16] = "and gold by weight for the tables of the [loaves] to be set in rows, for every table; and silver for the tables of silver;";
dby[17] = "and pure gold for the forks, and the bowls, and the goblets; and for the golden basons by weight for every bason; and for the silver basons by weight for every bason;";
dby[18] = "and for the altar of incense, refined gold by weight; and the pattern of the chariot of the cherubim of gold, which spread out [their wings] and cover the ark of the covenant of Jehovah.";
dby[19] = "All this [said David,] in writing, by Jehovah\'s hand upon me, instructing as to all the works of the pattern.";
dby[20] = "And David said to Solomon his son, Be strong and courageous, and do it; fear not nor be dismayed: for Jehovah Elohim, my God, will be with thee; he will not leave thee, neither forsake thee, until all the work for the service of the house of Jehovah is finished.";
dby[21] = "And behold, the courses of the priests and the Levites are for all the service of the house of God; and thou hast with thee for all manner of workmanship every willing man, skilful for every sort of service; and the princes and all the people are wholly at thy commandment.";
hnv[1] = "David assembled all the princes of Yisra\'el, the princes of the tribes, and the captains of the companies who served the king by course, and the captains of thousands, and the captains of hundreds, and the rulers over all the substance and possessions of the king and of his sons, with the officers, and the mighty men, even all the mighty men of valor, to Yerushalayim.";
hnv[2] = "Then David the king stood up on his feet, and said, Hear me, my brothers, and my people: as for me, it was in my heart to build a house of rest for the ark of the covenant of the LORD, and for the footstool of our God; and I had made ready for the building.";
hnv[3] = "But God said to me, You shall not build a house for my name, because you are a man of war, and have shed blood.";
hnv[4] = " However the LORD, the God of Yisra\'el, chose me out of all the house of my father to be king over Yisra\'el forever: for he has chosen Yehudah to be prince; and in the house of Yehudah, the house of my father; and among the sons of my father he took pleasure in me to make me king over all Yisra\'el;";
hnv[5] = "Of all my sons (for the LORD has given me many sons), he has chosen Shlomo my son to sit on the throne of the kingdom of the LORD over Yisra\'el.";
hnv[6] = "He said to me, Shlomo your son, he shall build my house and my courts; for I have chosen him to be my son, and I will be his father.";
hnv[7] = "I will establish his kingdom forever, if he be constant to do my mitzvot and my ordinances, as at this day.";
hnv[8] = "Now therefore, in the sight of all Yisra\'el, the assembly of the LORD, and in the audience of our God, observe and seek out all the mitzvot of the LORD your God; that you may possess this good land, and leave it for an inheritance to your children after you forever.";
hnv[9] = " You, Shlomo my son, know you the God of your father, and serve him with a perfect heart and with a willing mind; for the LORD searches all hearts, and understands all the imaginations of the thoughts: if you seek him, he will be found of you; but if you forsake him, he will cast you off forever.";
hnv[10] = "Take heed now; for the LORD has chosen you to build a house for the sanctuary: be strong, and do it.";
hnv[11] = "Then David gave to Shlomo his son the pattern of the porch [of the temple], and of the houses of it, and of the treasuries of it, and of the upper rooms of it, and of the inner chambers of it, and of the place of the mercy seat;";
hnv[12] = "and the pattern of all that he had by the Spirit, for the courts of the house of the LORD, and for all the chambers round about, for the treasuries of the house of God, and for the treasuries of the dedicated things;";
hnv[13] = "also for the courses of the Kohanim and the Levites, and for all the work of the service of the house of the LORD, and for all the vessels of service in the house of the LORD;";
hnv[14] = "of gold by weight for the [vessels of] gold, for all vessels of every kind of service; [of silver] for all the vessels of silver by weight, for all vessels of every kind of service;";
hnv[15] = "by weight also for the menorot of gold, and for the lamps of it, of gold, by weight for every menorah and for the lamps of it; and for the menorot of silver, [silver] by weight for [every] menorah and for the lamps of it, according to the use of every menorah;";
hnv[16] = "and the gold by weight for the tables of show bread, for every table; and silver for the tables of silver;";
hnv[17] = "and the flesh-hooks, and the basins, and the cups, of pure gold; and for the golden bowls by weight for every bowl; and for the silver bowls by weight for every bowl;";
hnv[18] = "and for the altar of incense refined gold by weight; and gold for the pattern of the chariot, [even] the Keruvim, that spread out [their wings], and covered the ark of the covenant of the LORD.";
hnv[19] = "All this, [said David], have I been made to understand in writing from the hand of the LORD, even all the works of this pattern.";
hnv[20] = "David said to Shlomo his son, Be strong and of good courage, and do it: don\'t be afraid, nor be dismayed; for the LORD God, even my God, is with you; he will not fail you, nor forsake you, until all the work for the service of the house of the LORD is finished.";
hnv[21] = "Behold, there are the courses of the Kohanim and the Levites, for all the service of the house of God: and there shall be with you in all manner of work every willing man who has skill, for any manner of service: also the captains and all the people will be wholly at your mitzvah.";
kjv[1] = "And David assembled all the princes of Israel, the princes of the tribes, and the captains of the companies that ministered to the king by course, and the captains over the thousands, and captains over the hundreds, and the stewards over all the substance and possession of the king, and of his sons, with the officers, and with the mighty men, and with all the valiant men, unto Jerusalem.";
kjv[2] = "Then David the king stood up upon his feet, and said, Hear me, my brethren, and my people: [As for me], I [had] in mine heart to build an house of rest for the ark of the covenant of the LORD, and for the footstool of our God, and had made ready for the building:";
kjv[3] = "But God said unto me, Thou shalt not build an house for my name, because thou [hast been] a man of war, and hast shed blood.";
kjv[4] = "Howbeit the LORD God of Israel chose me before all the house of my father to be king over Israel for ever: for he hath chosen Judah [to be] the ruler; and of the house of Judah, the house of my father; and among the sons of my father he liked me to make [me] king over all Israel:";
kjv[5] = "And of all my sons, (for the LORD hath given me many sons,) he hath chosen Solomon my son to sit upon the throne of the kingdom of the LORD over Israel.";
kjv[6] = "And he said unto me, Solomon thy son, he shall build my house and my courts: for I have chosen him [to be] my son, and I will be his father.";
kjv[7] = "Moreover I will establish his kingdom for ever, if he be constant to do my commandments and my judgments, as at this day.";
kjv[8] = "Now therefore in the sight of all Israel the congregation of the LORD, and in the audience of our God, keep and seek for all the commandments of the LORD your God: that ye may possess this good land, and leave [it] for an inheritance for your children after you for ever.";
kjv[9] = "And thou, Solomon my son, know thou the God of thy father, and serve him with a perfect heart and with a willing mind: for the LORD searcheth all hearts, and understandeth all the imaginations of the thoughts: if thou seek him, he will be found of thee; but if thou forsake him, he will cast thee off for ever.";
kjv[10] = "Take heed now; for the LORD hath chosen thee to build an house for the sanctuary: be strong, and do [it].";
kjv[11] = "Then David gave to Solomon his son the pattern of the porch, and of the houses thereof, and of the treasuries thereof, and of the upper chambers thereof, and of the inner parlours thereof, and of the place of the mercy seat,";
kjv[12] = "And the pattern of all that he had by the spirit, of the courts of the house of the LORD, and of all the chambers round about, of the treasuries of the house of God, and of the treasuries of the dedicated things:";
kjv[13] = "Also for the courses of the priests and the Levites, and for all the work of the service of the house of the LORD, and for all the vessels of service in the house of the LORD.";
kjv[14] = "[He gave] of gold by weight for [things] of gold, for all instruments of all manner of service; [silver also] for all instruments of silver by weight, for all instruments of every kind of service:";
kjv[15] = "Even the weight for the candlesticks of gold, and for their lamps of gold, by weight for every candlestick, and for the lamps thereof: and for the candlesticks of silver by weight, [both] for the candlestick, and [also] for the lamps thereof, according to the use of every candlestick.";
kjv[16] = "And by weight [he gave] gold for the tables of shewbread, for every table; and [likewise] silver for the tables of silver:";
kjv[17] = "Also pure gold for the fleshhooks, and the bowls, and the cups: and for the golden basons [he gave gold] by weight for every bason; and [likewise silver] by weight for every bason of silver:";
kjv[18] = "And for the altar of incense refined gold by weight; and gold for the pattern of the chariot of the cherubims, that spread out [their wings], and covered the ark of the covenant of the LORD.";
kjv[19] = "All [this, said David], the LORD made me understand in writing by [his] hand upon me, [even] all the works of this pattern.";
kjv[20] = "And David said to Solomon his son, Be strong and of good courage, and do [it]: fear not, nor be dismayed: for the LORD God, [even] my God, [will be] with thee; he will not fail thee, nor forsake thee, until thou hast finished all the work for the service of the house of the LORD.";
kjv[21] = "And, behold, the courses of the priests and the Levites, [even they shall be with thee] for all the service of the house of God: and [there shall be] with thee for all manner of workmanship every willing skilful man, for any manner of service: also the princes and all the people [will be] wholly at thy commandment.";
rsv[1] = "David assembled at Jerusalem all the officials of Israel, the officials of the tribes, the officers of the divisions that served the king, the commanders of thousands, the commanders of hundreds, the stewards of all the property and cattle of the king and his sons, together with the palace officials, the mighty men, and all the seasoned warriors.";
rsv[2] = "Then King David rose to his feet and said: &quot;Hear me, my brethren and my people. I had it in my heart to build a house of rest for the ark of the covenant of the LORD, and for the footstool of our God; and I made preparations for building.";
rsv[3] = "But God said to me, \'You may not build a house for my name, for you are a warrior and have shed blood.\'";
rsv[4] = "Yet the LORD God of Israel chose me from all my father\'s house to be king over Israel for ever; for he chose Judah as leader, and in the house of Judah my father\'s house, and among my father\'s sons he took pleasure in me to make me king over all Israel.";
rsv[5] = "And of all my sons (for the LORD has given me many sons) he has chosen Solomon my son to sit upon the throne of the kingdom of the LORD over Israel.";
rsv[6] = "He said to me, \'It is Solomon your son who shall build my house and my courts, for I have chosen him to be my son, and I will be his father.";
rsv[7] = "I will establish his kingdom for ever if he continues resolute in keeping my commandments and my ordinances, as he is today.\'";
rsv[8] = "Now therefore in the sight of all Israel, the assembly of the LORD, and in the hearing of our God, observe and seek out all the commandments of the LORD your God; that you may possess this good land, and leave it for an inheritance to your children after you for ever.";
rsv[9] = "&quot;And you, Solomon my son, know the God of your father, and serve him with a whole heart and with a willing mind; for the LORD searches all hearts, and understands every plan and thought. If you seek him, he will be found by you; but if you forsake him, he will cast you off for ever.";
rsv[10] = "Take heed now, for the LORD has chosen you to build a house for the sanctuary; be strong, and do it.&quot;";
rsv[11] = "Then David gave Solomon his son the plan of the vestibule of the temple, and of its houses, its treasuries, its upper rooms, and its inner chambers, and of the room for the mercy seat;";
rsv[12] = "and the plan of all that he had in mind for the courts of the house of the LORD, all the surrounding chambers, the treasuries of the house of God, and the treasuries for dedicated gifts;";
rsv[13] = "for the divisions of the priests and of the Levites, and all the work of the service in the house of the LORD; for all the vessels for the service in the house of the LORD,";
rsv[14] = "the weight of gold for all golden vessels for each service, the weight of silver vessels for each service,";
rsv[15] = "the weight of the golden lampstands and their lamps, the weight of gold for each lampstand and its lamps, the weight of silver for a lampstand and its lamps, according to the use of each lampstand in the service,";
rsv[16] = "the weight of gold for each table for the showbread, the silver for the silver tables,";
rsv[17] = "and pure gold for the forks, the basins, and the cups; for the golden bowls and the weight of each; for the silver bowls and the weight of each;";
rsv[18] = "for the altar of incense made of refined gold, and its weight; also his plan for the golden chariot of the cherubim that spread their wings and covered the ark of the covenant of the LORD.";
rsv[19] = "All this he made clear by the writing from the hand of the LORD concerning it, all the work to be done according to the plan.";
rsv[20] = "Then David said to Solomon his son, &quot;Be strong and of good courage, and do it. Fear not, be not dismayed; for the LORD God, even my God, is with you. He will not fail you or forsake you, until all the work for the service of the house of the LORD is finished.";
rsv[21] = "And behold the divisions of the priests and the Levites for all the service of the house of God; and with you in all the work will be every willing man who has skill for any kind of service; also the officers and all the people will be wholly at your command.&quot;";
vul[1] = "convocavit igitur David omnes principes Israhel duces tribuum et praepositos turmarum qui ministrabant regi tribunos quoque et centuriones et qui praeerant substantiae et possessionibus regis filiosque suos cum eunuchis et potentes et robustissimos quosque in exercitu Hierusalem";
vul[2] = "cumque surrexisset rex et stetisset ait audite me fratres mei et populus meus cogitavi ut aedificarem domum in qua requiesceret arca foederis Domini et scabillum pedum Dei nostri et ad aedificandum omnia praeparavi";
vul[3] = "Deus autem dixit mihi non aedificabis domum nomini meo eo quod sis vir bellator et sanguinem fuderis";
vul[4] = "sed elegit Dominus Deus Israhel me de universa domo patris mei ut essem rex super Israhel in sempiternum de Iuda enim elegit principes porro de domo Iuda domum patris mei et de filiis patris mei placuit ei ut me eligeret regem super cunctum Israhel";
vul[5] = "sed et de filiis meis filios enim multos dedit mihi Dominus elegit Salomonem filium meum ut sederet in throno regni Domini super Israhel";
vul[6] = "dixitque mihi Salomon filius tuus aedificabit domum meam et atria mea ipsum enim elegi mihi in filium et ego ero ei in patrem";
vul[7] = "et firmabo regnum eius usque in aeternum si perseveraverit facere praecepta mea et iudicia sicut et hodie";
vul[8] = "nunc igitur coram universo coetu Israhel audiente Deo nostro custodite et perquirite cuncta mandata Domini Dei nostri ut possideatis terram bonam et relinquatis eam filiis vestris post vos usque in sempiternum";
vul[9] = "tu autem Salomon fili mi scito Deum patris tui et servi ei corde perfecto et animo voluntario omnia enim corda scrutatur Dominus et universas mentium cogitationes intellegit si quaesieris eum invenies si autem dereliqueris illum proiciet te in aeternum";
vul[10] = "nunc ergo quia elegit te Dominus ut aedificares domum sanctuarii confortare et perfice";
vul[11] = "dedit autem David Salomoni filio suo descriptionem porticus et templi et cellariorum et cenaculi et cubiculorum in adytis et domus propitiationis";
vul[12] = "necnon et omnium quae cogitaverat atriorum et exedrarum per circuitum in thesauros domus Domini et in thesauros sanctorum";
vul[13] = "divisionumque sacerdotalium et leviticarum in omnia opera domus Domini et in universa vasa ministerii templi Domini";
vul[14] = "aurum in pondere per singula vasa ministerii argenti quoque pondus pro vasorum ad opera diversitate";
vul[15] = "sed et ad candelabra aurea et ad lucernas eorum aurum pro mensura uniuscuiusque candelabri et lucernarum similiter et in candelabris argenteis et in lucernis eorum pro diversitate mensurae pondus argenti tradidit";
vul[16] = "aurum quoque dedit in mensas propositionis pro diversitate mensarum similiter et argentum in alias mensas argenteas";
vul[17] = "ad fuscinulas quoque et fialas et turibula ex auro purissimo et leunculos aureos pro qualitate mensurae pondus distribuit in leunculum et leunculum similiter et in leones argenteos diversum argenti pondus separavit";
vul[18] = "altari autem in quo adoletur incensum aurum purissimum dedit ut ex ipso fieret similitudo quadrigae cherubin extendentium alas et velantium arcam foederis Domini";
vul[19] = "omnia inquit venerunt scripta manu Domini ad me ut intellegerem universa opera exemplaris";
vul[20] = "dixit quoque David Salomoni filio suo viriliter age et confortare et fac ne timeas et ne paveas Dominus enim Deus meus tecum erit et non dimittet te nec derelinquet donec perficias omne opus ministerii domus Domini";
vul[21] = "ecce divisiones sacerdotum et Levitarum in omne ministerium domus Domini adsistunt tibi et parati sunt et noverunt tam principes quam populus facere omnia praecepta tua";
web[1] = "And David assembled all the princes of Israel, the princes of the tribes, and the captains of the companies that ministered to the king by course, and the captains over the thousands, and captains over the hundreds, and the stewards over all the substance and possession of the king, and of his sons, with the officers, and with the mighty men, and with all the valiant men to Jerusalem.";

web[5] = "And of all my sons, (for the LORD hath given me many sons,) he hath chosen Solomon my son to sit upon the throne of the kingdom of the LORD over Israel.";

web[7] = "Moreover I will establish his kingdom for ever, if he shall be constant to do my commandments and my judgments, as at this day.";
web[8] = "Now therefore in the sight of all Israel the congregation of the LORD, and in the audience of our God, keep and seek for all the commandments of the LORD your God: that ye may possess this good land, and leave [it] for an inheritance for your children after you for ever.";
web[9] = "And thou, Solomon my son, know thou the God of thy father, and serve him with a perfect heart, and with a willing mind: for the LORD searcheth all hearts and understandeth all the imaginations of the thoughts: if thou shalt seek him, he will be found of thee; but if thou shalt forsake him, he will cast thee off for ever.";
web[10] = "Take heed now; for the LORD hath chosen thee to build a house for the sanctuary: be strong, and do [it].";
web[11] = "Then David gave to Solomon his son the pattern of the porch, and of the houses of it, and of its treasuries, and of its upper chambers, and of its inner parlors, and of the place of the mercy-seat,";
web[12] = "And the pattern of all that he had by the spirit, of the courts of the house of the LORD, and of all the chambers around, of the treasuries of the house of God, and of the treasuries of the dedicated things:";
web[13] = "Also for the courses of the priests and the Levites, and for all the work of the service of the house of the LORD, and for all the vessels of service in the house of the LORD.";
web[14] = "[He gave] of gold by weight for [things] of gold, for all instruments of all manner of service; [silver also] for all instruments of silver by weight, for all instruments of every kind of service:";
web[15] = "Even the weight for the candlesticks of gold, and for their lamps of gold, by weight for every candlestick, and for its lamps: and for the candlesticks of silver by weight, [both] for the candlestick, and [also] for its lamps, according to the use of every candlestick.";
web[16] = "And by weight [he gave] gold for the tables of show-bread, for every table; and [likewise] silver for the tables of silver:";
web[17] = "Also pure gold for the flesh-hooks, and the bowls, and the cups: and for the golden basins [he gave gold] by weight for every basin; and [likewise silver] by weight for every basin of silver:";
web[18] = "And for the altar of incense refined gold by weight; and gold for the pattern of the chariot of the cherubim, that spread out [their wings], and covered the ark of the covenant of the LORD.";
web[19] = "All [this], [said David], the LORD made me understand in writing by [his] hand upon me, [even] all the works of this pattern.";
web[20] = "And David said to Solomon his son, Be strong, and of good courage, and do [it]: fear not, nor be dismayed, for the LORD God, [even] my God, [will be] with thee; he will not fail thee, nor forsake thee, until thou hast finished all the work for the service of the house of the LORD.";
web[21] = "And behold, the courses of the priests and the Levites, [even they shall be with thee] for all the service of the house of God: and [there shall be] with thee for all manner of workmanship every willing skillful man, for any manner of service: also the princes and all the people [will be] wholly at thy command.";
yng[1] = "And David assembleth all the heads of Israel, heads of the tribes, and heads of the courses who are serving the king, and heads of the thousands, and heads of the hundreds, and heads of all the substance and possessions of the king, and of his sons, with the officers and the mighty ones, even to every mighty one of valour -- unto Jerusalem.";
yng[2] = "And David the king riseth on his feet, and saith, `Hear me, my brethren and my people, I -- with my heart -- to build a house of rest for the ark of the covenant of Jehovah, and for the footstool of our God, and I prepared to build,";
yng[3] = "and God hath said to me, Thou dost not build a house to My name, for a man of wars thou [art], and blood thou hast shed.";
yng[4] = "`And Jehovah, God of Israel, doth fix on me out of all the house of my father to be for king over Israel to the age, for on Judah He hath fixed for a leader, and in the house of Judah, the house of my father, and among the sons of my father, on me, [me] He hath been pleased to make king over all Israel;";
yng[5] = "and out of all my sons -- for many sons hath Jehovah given to me -- He also fixeth on Solomon my son, to sit on the throne of the kingdom of Jehovah over Israel,";
yng[6] = "and saith to me, Solomon thy son, he doth build My house, and My courts, for I have fixed on him to Me for a son, and I -- I am to him for a father,";
yng[7] = "and I have established his kingdom to the age, if he is strong to do My commands, and My judgments, as at this day.";
yng[8] = "`And now, before the eyes of all Israel, the assembly of Jehovah, and in the ears of our God, keep and seek all the commands of Jehovah your God, so that ye possess this good land, and have caused your sons to inherit after you unto the age.";
yng[9] = "`And thou, Solomon, my son, know the God of thy father, and serve Him with a perfect heart, and with a willing mind, for all hearts is Jehovah seeking, and every imagination of the thoughts He is understanding; if thou dost seek Him, He is found of thee, and if thou dost forsake Him, He casteth thee off for ever.";
yng[10] = "See, now, for Jehovah hath fixed on thee to build a house for a sanctuary; be strong, and do.\'";
yng[11] = "And David giveth to Solomon his son the pattern of the porch, and of its houses, and of its treasures, and of its upper chambers, and of its innermost chambers, and of the house of the atonement;";
yng[12] = "and the pattern of all that hath been by the Spirit with him, for the courts of the house of Jehovah, and for all the chambers round about, for the treasures of the house of God, and for the treasures of the things sacrificed;";
yng[13] = "and for the courses of the priests and of the Levites, and for all the work of the service of the house of Jehovah, and for all vessels of service of the house of Jehovah,";
yng[14] = "even gold by weight, for [things of] gold, for all instruments of service and service; for all instruments of silver by weight, for all instruments of service and service;";
yng[15] = "and [by] weight for the candlesticks of gold, and their lamps of gold, by weight [for] candlestick and candlestick, and its lamps; and for the candlesticks of silver, by weight for a candlestick and its lamps, according to the service of candlestick and candlestick;";
yng[16] = "and the gold [by] weight for tables of the arrangement, for table and table, and silver for the tables of silver;";
yng[17] = "and the forks, and the bowls, and the cups of pure gold, and for the basins of gold, by weight for basin and basin, and for the basins of silver, by weight for basin and basin,";
yng[18] = "and for the altar of perfume refined gold by weight, and for the pattern of the chariot of the cherubs of gold -- spreading and covering over the ark of the covenant of Jehovah.";
yng[19] = "The whole [is] in writing from the hand of Jehovah, `He caused me to understand all the work of the pattern,\' [said David.]";
yng[20] = "And David saith to Solomon his son, `Be strong, and courageous, and do; do not fear nor be affrighted, for Jehovah God, my God, [is] with thee; He doth not fail thee, nor forsake thee, unto the completion of all the work of the service of the house of Jehovah.";
yng[21] = "`And lo, courses of the priests and of the Levites [are] for all the service of the house of God; and with thee in all work [is] every willing one with wisdom, for every service; and the heads and all the people [are] according to all thy words.\'";
csb[1] = "David assembled all the leaders of Israel in Jerusalem: the leaders of the tribes, the leaders of the divisions in the king\'s service, the commanders of thousands and the commanders of hundreds, and the officials in charge of all the property and cattle of the king and his sons, along with the court officials, the fighting men, and all the best soldiers.";
csb[2] = "Then King David rose to his feet and said, &quot;Listen to me, my brothers and my people. It was in my heart to build a house as a resting place for the ark of the LORD\'s covenant and as a footstool for our God. I had made preparations to build,";
csb[3] = "&quot;but God said to me, \'You are not to build a house for my name because you are a man of war and have shed blood.\'";
csb[4] = "&quot;Yet the LORD God of Israel chose me out of all my father\'s family to be king over Israel forever. For he chose Judah as leader, and from the house of Judah, my father\'s family, and from my father\'s sons, he was pleased to make me king over all Israel.";
csb[5] = "&quot;And out of all my sons -- for the LORD has given me many sons -- he has chosen my son Solomon to sit on the throne of the LORD\'s kingdom over Israel.";
csb[6] = "&quot;He said to me, \'Your son Solomon is the one who is to build my house and my courts, for I have chosen him to be my son, and I will be his father.";
csb[7] = "&quot;I will establish his kingdom forever if he perseveres in keeping my commands and my ordinances as he is doing today.\'";
csb[8] = "&quot;So now in the sight of all Israel, the assembly of the LORD, and in the hearing of our God, observe and follow all the commands of the LORD your God so that you may possess this good land and leave it as an inheritance to your descendants forever.";
csb[9] = "&quot;As for you, Solomon my son, know the God of your father, and serve him wholeheartedly and with a willing mind, for the LORD searches every heart and understands the intention of every thought. If you seek him, he will be found by you, but if you abandon him, he will reject you forever.";
csb[10] = "&quot;Realize now that the LORD has chosen you to build a house for the sanctuary. Be strong, and do it.&quot;";
csb[11] = "Then David gave his son Solomon the plans for the portico of the temple and its buildings, treasuries, upstairs rooms, inner rooms, and a room for the mercy seat.";
csb[12] = "The plans contained everything he had in mind for the courts of the LORD\'s house, all the surrounding chambers, the treasuries of God\'s house, and the treasuries for what is dedicated.";
csb[13] = "Also included were plans for the divisions of the priests and the Levites; all the work of service in the LORD\'s house; all the articles of service of the LORD\'s house;";
csb[14] = "the weight of gold for all the articles for every kind of service; the weight of all the silver articles for every kind of service;";
csb[15] = "the weight of the gold lampstands and their gold lamps, including the weight of each lampstand and its lamps; the weight of each silver lampstand and its lamps, according to the service of each lampstand;";
csb[16] = "the weight of gold for each table for the rows of the Bread of the Presence and the silver for the silver tables;";
csb[17] = "the pure gold for the forks, sprinkling basins, and pitchers; the weight of each gold dish; the weight of each silver bowl;";
csb[18] = "the weight of refined gold for the altar of incense; and the plans for the chariot of the gold cherubim that spread out their wings and cover the ark of the LORD\'s covenant.";
csb[19] = "David concluded, &quot;By the LORD\'s hand on me, he enabled me to understand everything in writing, all the details of the plan.&quot;";
csb[20] = "Then David said to his son Solomon, &quot;Be strong and courageous, and do the work. Don\'t be afraid or discouraged, for the LORD God, my God, is with you. He won\'t leave you or abandon you until all the work for the service of the LORD\'s house is finished.";
csb[21] = "&quot;Here are the divisions of the priests and the Levites for all the service of God\'s house. Every willing person of any skill will be at your disposal for the work, and the leaders and all the people are at your every command.&quot;";
</script>
