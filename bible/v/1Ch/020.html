asv[1] = "And it came to pass, at the time of the return of the year, at the time when kings go out [to battle], that Joab led forth the army, and wasted the country of the children of Ammon, and came and besieged Rabbah. But David tarried at Jerusalem. And Joab smote Rabbah, and overthrew it.";
asv[2] = "And David took the crown of their king from off his head, and found it to weigh a talent of gold, and there were precious stones in it; and it was set upon David\'s head: and he brought forth the spoil of the city, exceeding much.";
asv[3] = "And he brought forth the people that were therein, and cut [them] with saws, and with harrows of iron, and with axes. And thus did David unto all the cities of the children of Ammon. And David and all the people returned to Jerusalem.";
asv[4] = "And it came to pass after this, that there arose war at Gezer with the Philistines: then Sibbecai the Hushathite slew Sippai, of the sons of the giant; and they were subdued.";
asv[5] = "And there was again war with the Philistines; and Elhanan the son of Jair slew Lahmi the brother of Goliath the Gittite, the staff of whose spear was like a weaver\'s beam.";
asv[6] = "And there was again war at Gath, where was a man of great stature, whose fingers and toes were four and twenty, six [on each hand], and six [on each foot]; and he also was born unto the giant.";
asv[7] = "And when he defied Israel, Jonathan the son of Shimea David\'s brother slew him.";
asv[8] = "These were born unto the giant in Gath; and they fell by the hand of David, and by the hand of his servants.";
dby[1] = "And it came to pass at the time of the return of the year, at the time when kings go forth, that Joab led forth the power of the army, and laid waste the land of the children of Ammon, and came and besieged Rabbah. But David abode at Jerusalem. And Joab smote Rabbah, and overthrew it.";
dby[2] = "And David took the crown of their king from off his head, and found it to weigh a talent of gold, and there were precious stones in it; and it was [set] upon David\'s head: and he brought forth the spoil of the city in great abundance.";

hnv[1] = "It happened, at the time of the return of the year, at the time when kings go out [to battle], that Yo\'av led forth the army, and wasted the country of the children of `Ammon, and came and besieged Rabbah. But David stayed at Yerushalayim. Yo\'av struck Rabbah, and overthrew it.";
hnv[2] = "David took the crown of their king from off his head, and found it to weigh a talent of gold, and there were precious stones in it; and it was set on David\'s head: and he brought forth the spoil of the city, exceeding much.";
hnv[3] = "He brought forth the people who were therein, and cut [them] with saws, and with harrows of iron, and with axes. Thus did David to all the cities of the children of `Ammon. David and all the people returned to Yerushalayim.";
hnv[4] = "It happened after this, that there arose war at Gezer with the Pelishtim: then Sibbekhai the Hushatite killed Sippai, of the sons of the Rafa; and they were subdued.";
hnv[5] = "There was again war with the Pelishtim; and Elchanan the son of Ya\'ir killed Lachmi the brother of Golyat the Gittite, the staff of whose spear was like a weaver\'s beam.";
hnv[6] = " There was again war at Gat, where was a man of great stature, whose fingers and toes were twenty-four, six [on each hand], and six [on each foot]; and he also was born to the Rafa.";
hnv[7] = "When he defied Yisra\'el, Yonatan the son of Shim`a David\'s brother killed him.";
hnv[8] = " These were born to the Rafa in Gat; and they fell by the hand of David, and by the hand of his servants.";
kjv[1] = "And it came to pass, that after the year was expired, at the time that kings go out [to battle], Joab led forth the power of the army, and wasted the country of the children of Ammon, and came and besieged Rabbah. But David tarried at Jerusalem. And Joab smote Rabbah, and destroyed it.";
kjv[2] = "And David took the crown of their king from off his head, and found it to weigh a talent of gold, and [there were] precious stones in it; and it was set upon David\'s head: and he brought also exceeding much spoil out of the city.";
kjv[3] = "And he brought out the people that [were] in it, and cut [them] with saws, and with harrows of iron, and with axes. Even so dealt David with all the cities of the children of Ammon. And David and all the people returned to Jerusalem.";
kjv[4] = "And it came to pass after this, that there arose war at Gezer with the Philistines; at which time Sibbechai the Hushathite slew Sippai, [that was] of the children of the giant: and they were subdued.";
kjv[5] = "And there was war again with the Philistines; and Elhanan the son of Jair slew Lahmi the brother of Goliath the Gittite, whose spear staff [was] like a weaver\'s beam.";
kjv[6] = "And yet again there was war at Gath, where was a man of [great] stature, whose fingers and toes [were] four and twenty, six [on each hand], and six [on each foot]: and he also was the son of the giant.";
kjv[7] = "But when he defied Israel, Jonathan the son of Shimea David\'s brother slew him.";
kjv[8] = "These were born unto the giant in Gath; and they fell by the hand of David, and by the hand of his servants.";
rsv[1] = "In the spring of the year, the time when kings go forth to battle, Jo\'ab led out the army, and ravaged the country of the Ammonites, and came and besieged Rabbah. But David remained at Jerusalem. And Jo\'ab smote Rabbah, and overthrew it.";
rsv[2] = "And David took the crown of their king from his head; he found that it weighed a talent of gold, and in it was a precious stone; and it was placed on David\'s head. And he brought forth the spoil of the city, a very great amount.";
rsv[3] = "And he brought forth the people who were in it, and set them to labor with saws and iron picks and axes; and thus David did to all the cities of the Ammonites. Then David and all the people returned to Jerusalem.";
rsv[4] = "And after this there arose war with the Philistines at Gezer; then Sib\'becai the Hu\'shathite slew Sip\'pai, who was one of the descendants of the giants; and the Philistines were subdued.";
rsv[5] = "And there was again war with the Philistines; and Elha\'nan the son of Ja\'ir slew Lahmi the brother of Goliath the Gittite, the shaft of whose spear was like a weaver\'s beam.";
rsv[6] = "And there was again war at Gath, where there was a man of great stature, who had six fingers on each hand, and six toes on each foot, twenty-four in number; and he also was descended from the giants.";
rsv[7] = "And when he taunted Israel, Jonathan the son of Shim\'e-a, David\'s brother, slew him.";
rsv[8] = "These were descended from the giants in Gath; and they fell by the hand of David and by the hand of his servants.";
vul[1] = "factum est autem post anni circulum eo tempore quo solent reges ad bella procedere congregavit Ioab exercitum et robur militiae et vastavit terram filiorum Ammon perrexitque et obsedit Rabba porro David manebat in Hierusalem quando Ioab percussit Rabba et destruxit eam";
vul[2] = "tulit autem David coronam Melchom de capite eius et invenit in ea auri pondo talentum et pretiosissimas gemmas fecitque sibi inde diadema manubias quoque urbis plurimas tulit";
vul[3] = "populum autem qui erat in ea eduxit et fecit super eos tribulas et trahas et ferrata carpenta transire ita ut dissicarentur et contererentur sic fecit David cunctis urbibus filiorum Ammon et reversus est cum omni populo suo in Hierusalem";
vul[4] = "post haec initum est bellum in Gazer adversus Philistheos in quo percussit Sobbochai Usathites Saphai de genere Raphaim et humiliavit eos";
vul[5] = "aliud quoque bellum gestum est adversum Philistheos in quo percussit Adeodatus filius Saltus Lehemites fratrem Goliath Getthei cuius hastae lignum erat quasi liciatorium texentium";
vul[6] = "sed et aliud bellum accidit in Geth in quo fuit homo longissimus habens digitos senos id est simul viginti quattuor qui et ipse de Rapha fuerat stirpe generatus";
vul[7] = "[Vulgate 20:7a] hic blasphemavit Israhel et percussit eum Ionathan filius Sammaa fratris David";
vul[8] = "[Vulgate 20:7b] hii sunt filii Rapha in Geth qui ceciderunt in manu David et servorum eius";
web[1] = "And it came to pass, that after the year had expired, at the time that kings go out [to battle], Joab led forth the power of the army, and wasted the country of the children of Ammon, and came and besieged Rabbah. But David tarried at Jerusalem. And Joab smote Rabbah, and destroyed it.";
web[2] = "And David took the crown of their king from his head, and found it to weigh a talent of gold, and [there were] precious stones in it; and it was set upon David\'s head: and he brought also a great quantity of spoil out of the city.";
web[3] = "And he brought out the people that [were] in it, and cut [them] with saws, and with harrows of iron, and with axes. Even so David dealt with all the cities of the children of Ammon. And David and all the people returned to Jerusalem.";
web[4] = "And it came to pass after this, that there arose war at Gezer with the Philistines: at which time Sibbechai the Hushathite slew Sippai, [that was] of the children of the giant: and they were subdued.";
web[5] = "And there was war again with the Philistines; and Elhanan the son of Jair slew Lahmi the brother of Goliath the Gittite, whose spear-staff [was] like a weaver\'s beam.";
web[6] = "And yet again there was war at Gath, where was a man of [great] stature, whose fingers and toes [were] four and twenty, six [on each hand], and six [on each foot]: and he also was the son of the giant.";
web[7] = "But when he defied Israel, Jonathan the son of Shimea, David\'s brother, slew him.";
web[8] = "These were born to the giant in Gath; and they fell by the hand of David, and by the hand of his servants.";
yng[1] = "And it cometh to pass, at the time of the turn of the year -- at the time of the going out of the messengers -- that Joab leadeth out the force of the host, and destroyeth the land of the sons of Ammon, and cometh in and beseigeth Rabbah -- David is abiding in Jerusalem -- and Joab smiteth Rabbah, and breaketh it down.";
yng[2] = "And David taketh the crown of their king from off his head, and findeth it [in] weight a talent of gold, and in it a precious stone, and it is on the head of David: and spoil of the city he hath brought out very much,";
yng[3] = "and the people who [are] in it he hath brought out, and setteth to the saw, and to cutting instruments of iron, and to axes; and thus doth David to all cities of the sons of Ammon, and David turneth back, and all the people, to Jerusalem.";
yng[4] = "And it cometh to pass, after this, that there remaineth war in Gezer with the Philistines, then hath Sibbechai the Hushathite smitten Sippai, of the children of the giant, and they are humbled.";
yng[5] = "And there is again war with the Philistines, and Elhanan son of Jair smiteth Lahmi, brother of Goliath the Gittite, the wood of whose spear [is] like a beam of weavers.";
yng[6] = "And there is again war in Gath, and there is a man of measure, and his fingers and his toes [are] six and six, twenty and four, and also, he hath been born to the giant.";
yng[7] = "And he reproacheth Israel, and smite him doth Jonathan son of Shimea, brother of David.";
yng[8] = "These were born to the giant in Gath, and they fall by the hand of David, and by the hand of his servants.";
csb[1] = "In the spring when kings march out to war, Joab led the army and destroyed the Ammonites\' land. He came to Rabbah and besieged it, but David remained in Jerusalem. Joab attacked Rabbah and demolished it.";
csb[2] = "Then David took the crown from the head of their king, and it was placed on David\'s head. He found that the crown weighed seventy-five pounds of gold, and there was a precious stone in it. In addition, David took away a large quantity of plunder from the city.";
csb[3] = "He brought out the people who were in it and put them to work with saws, iron picks, and axes. David did the same to all the Ammonite cities. Then he and all his troops returned to Jerusalem.";
csb[4] = "After this, a war broke out with the Philistines at Gezer. At that time Sibbecai the Hushathite killed Sippai, a descendant of the Rephaim, and the Philistines were subdued.";
csb[5] = "Once again there was a battle with the Philistines, and Elhanan son of Jair killed Lahmi the brother of Goliath of Gath. The shaft of his spear was like a weaver\'s beam.";
csb[6] = "There was still another battle at Gath where there was a man of extraordinary stature with six fingers on each hand and six toes on each foot -- twenty-four in all. He, too, was descended from the giant.";
csb[7] = "When he taunted Israel, Jonathan son of David\'s brother Shimei killed him.";
csb[8] = "These were the descendants of the giant in Gath killed by David and his soldiers.";
</script>
