asv[1] = "Then all Israel gathered themselves to David unto Hebron, saying, Behold, we are thy bone and thy flesh.";
asv[2] = "In times past, even when Saul was king, it was thou that leddest out and broughtest in Israel: and Jehovah thy God said unto thee, Thou shalt be shepherd of my people Israel, and thou shalt be prince over my people Israel.";
asv[3] = "So all the elders of Israel came to the king to Hebron; and David made a covenant with them in Hebron before Jehovah; and they anointed David king over Israel, according to the word of Jehovah by Samuel.";
asv[4] = "And David and all Israel went to Jerusalem (the same is Jebus); and the Jebusites, the inhabitants of the land, were there.";
asv[5] = "And the inhabitants of Jebus said to David, Thou shalt not come in hither. Nevertheless David took the stronghold of Zion; the same is the city of David.";
asv[6] = "And David said, Whosoever smiteth the Jebusites first shall be chief and captain. And Joab the son of Zeruiah went up first, and was made chief.";
asv[7] = "And David dwelt in the stronghold; therefore they called it the city of David.";
asv[8] = "And he built the city round about, from Millo even round about; and Joab repaired the rest of the city.";
asv[9] = "And David waxed greater and greater; for Jehovah of hosts was with him.";
asv[10] = "Now these are the chief of the mighty men whom David had, who showed themselves strong with him in his kingdom, together with all Israel, to make him king, according to the word of Jehovah concerning Israel.";
asv[11] = "And this is the number of the mighty men whom David had: Jashobeam, the son of a Hachmonite, the chief of the thirty; he lifted up his spear against three hundred and slew them at one time.";
asv[12] = "And after him was Eleazar the son of Dodo, the Ahohite, who was one of the three mighty men.";
asv[13] = "He was with David at Pasdammim, and there the Philistines were gathered together to battle, where was a plot of ground full of barley; and the people fled from before the Philistines.";
asv[14] = "And they stood in the midst of the plot, and defended it, and slew the Philistines; and Jehovah saved them by a great victory.";
asv[15] = "And three of the thirty chief men went down to the rock to David, into the cave of Adullam; and the host of the Philistines were encamped in the valley of Rephaim.";
asv[16] = "And David was then in the stronghold, and the garrison of the Philistines was then in Beth-lehem.";
asv[17] = "And David longed, and said, Oh that one would give me water to drink of the well of Beth-lehem, which is by the gate!";
asv[18] = "And the three brake through the host of the Philistines, and drew water out of the well of Beth-lehem, that was by the gate, and took it, and brought it to David: but David would not drink thereof, but poured it out unto Jehovah,";
asv[19] = "and said, My God forbid it me, that I should do this: shall I drink the blood of these men that have put their lives in jeopardy? for with [the jeopardy of] their lives they brought it. Therefore he would not drink it. These things did the three mighty men.";
asv[20] = "And Abishai, the brother of Joab, he was chief of the three; for he lifted up his spear against three hundred and slew them, and had a name among the three.";
asv[21] = "Of the three, he was more honorable than the two, and was made their captain: howbeit he attained not to the [first] three.";
asv[22] = "Benaiah the son of Jehoiada, the son of a valiant man of Kabzeel, who had done mighty deeds, he slew the two [sons of] Ariel of Moab: he went down also and slew a lion in the midst of a pit in time of snow.";
asv[23] = "And he slew an Egyptian, a man of great stature, five cubits high; and in the Egyptian\'s hand was a spear like a weaver\'s beam; and he went down to him with a staff, and plucked the spear out of the Egyptian\'s hand, and slew him with his own spear.";
asv[24] = "These things did Benaiah the son of Jehoiada, and had a name among the three mighty men.";
asv[25] = "Behold, he was more honorable than the thirty, but he attained not to the [first] three: and David set him over his guard.";
asv[26] = "Also the mighty men of the armies: Asahel the brother of Joab, Elhanan the son of Dodo of Beth-lehem,";
asv[27] = "Shammoth the Harorite, Helez the Pelonite,";
asv[28] = "Ira the son of Ikkesh the Tekoite, Abiezer the Anathothite,";
asv[29] = "Sibbecai the Hushathite, Ilai the Ahohite,";
asv[30] = "Maharai the Netophathite, Heled the son of Baanah the Netophathite,";
asv[31] = "Ithai the son of Ribai of Gibeah of the children of Benjamin, Benaiah the Pirathonite,";
asv[32] = "Hurai of the brooks of Gaash, Abiel the Arbathite,";
asv[33] = "Azmaveth the Baharumite, Eliahba the Shaalbonite,";
asv[34] = "the sons of Hashem the Gizonite, Jonathan the son of Shagee the Hararite,";
asv[35] = "Ahiam the son of Sacar the Hararite, Eliphal the son of Ur,";
asv[36] = "Hepher the Mecherathite, Ahijah the Pelonite,";
asv[37] = "Hezro the Carmelite, Naarai the son of Ezbai,";
asv[38] = "Joel the brother of Nathan, Mibhar the son of Hagri,";
asv[39] = "Zelek the Ammonite, Naharai the Berothite, the armorbearer of Joab the son of Zeruiah,";
asv[40] = "Ira the Ithrite, Gareb the Ithrite,";
asv[41] = "Uriah the Hittite, Zabad the son of Ahlai,";
asv[42] = "Adina the son of Shiza the Reubenite, a chief of the Reubenites, and thirty with him,";
asv[43] = "Hanan the son of Maacah, and Joshaphat the Mithnite,";
asv[44] = "Uzzia the Ashterathite, Shama and Jeiel the sons of Hotham the Aroerite,";
asv[45] = "Jediael the son of Shimri, and Joha his brother, the Tizite,";
asv[46] = "Eliel the Mahavite, and Jeribai, and Joshaviah, the sons of Elnaam, and Ithmah the Moabite,";
asv[47] = "Eliel, and Obed, and Jaasiel the Mezobaite.";

hnv[1] = "Then all Yisra\'el gathered themselves to David to Hevron, saying, Behold, we are your bone and your flesh.";
hnv[2] = "In times past, even when Sha\'ul was king, it was you who led out and brought in Yisra\'el: and the LORD your God said to you, You shall be shepherd of my people Yisra\'el, and you shall be prince over my people Yisra\'el.";
hnv[3] = "So all the Zakenim of Yisra\'el came to the king to Hevron; and David made a covenant with them in Hevron before the LORD; and they anointed David king over Yisra\'el, according to the word of the LORD by Shemu\'el.";
hnv[4] = "David and all Yisra\'el went to Yerushalayim (the same is Yevus); and the Yevusi, the inhabitants of the land, were there.";
hnv[5] = "The inhabitants of Yevus said to David, You shall not come in here. Nevertheless David took the stronghold of Tziyon; the same is the city of David.";
hnv[6] = "David said, Whoever strikes the Yevusi first shall be chief and captain. Yo\'av the son of Tzeru\'yah went up first, and was made chief.";
hnv[7] = "David lived in the stronghold; therefore they called it the city of David.";
hnv[8] = "He built the city round about, from Millo even round about; and Yo\'av repaired the rest of the city.";
hnv[9] = "David grew greater and greater; for the LORD of Hosts was with him.";
hnv[10] = "Now these are the chief of the mighty men whom David had, who shown themselves strong with him in his kingdom, together with all Yisra\'el, to make him king, according to the word of the LORD concerning Yisra\'el.";
hnv[11] = "This is the number of the mighty men whom David had: Yashov`am, the son of a Hakhmoni, the chief of the thirty; he lifted up his spear against three hundred and killed them at one time.";
hnv[12] = "After him was El`azar the son of Dodo, the Achochi, who was one of the three mighty men.";
hnv[13] = "He was with David at Pas-Dammim, and there the Pelishtim were gathered together to battle, where was a plot of ground full of barley; and the people fled from before the Pelishtim.";
hnv[14] = "They stood in the midst of the plot, and defended it, and killed the Pelishtim; and the LORD saved them by a great victory.";
hnv[15] = "Three of the thirty chief men went down to the rock to David, into the cave of `Adullam; and the host of the Pelishtim were encamped in the valley of Refa\'im.";
hnv[16] = "David was then in the stronghold, and the garrison of the Pelishtim was then in Beit-Lechem.";
hnv[17] = "David longed, and said, Oh that one would give me water to drink of the well of Beit-Lechem, which is by the gate!";
hnv[18] = "The three broke through the host of the Pelishtim, and drew water out of the well of Beit-Lechem, that was by the gate, and took it, and brought it to David: but David would not drink of it, but poured it out to the LORD,";
hnv[19] = "and said, My God forbid it me, that I should do this: shall I drink the blood of these men who have put their lives in jeopardy? for with [the jeopardy of] their lives they brought it. Therefore he would not drink it. These things did the three mighty men.";
hnv[20] = "Avishai, the brother of Yo\'av, he was chief of the three; for he lifted up his spear against three hundred and killed them, and had a name among the three.";
hnv[21] = "Of the three, he was more honorable than the two, and was made their captain: however he didn\'t attain to the [first] three.";
hnv[22] = "Benayah the son of Yehoiada, the son of a valiant man of Kavtz\'el, who had done mighty deeds, he killed the two [sons of] Ari\'el of Mo\'av: he went down also and killed a lion in the midst of a pit in time of snow.";
hnv[23] = "He killed a Mitzrian, a man of great stature, five cubits high; and in the Mitzrian\'s hand was a spear like a weaver\'s beam; and he went down to him with a staff, and plucked the spear out of the Mitzrian\'s hand, and killed him with his own spear.";
hnv[24] = "These things did Benayah the son of Yehoiada, and had a name among the three mighty men.";
hnv[25] = "Behold, he was more honorable than the thirty, but he didn\'t attain to the [first] three: and David set him over his guard.";
hnv[26] = "Also the mighty men of the armies: `Asa\'el the brother of Yo\'av, Elchanan the son of Dodo of Beit-Lechem,";

kjv[20] = "Then all Israel gathered themselves to David unto Hebron, saying, Behold, we [are] thy bone and thy flesh.";

kjv[22] = "Therefore came all the elders of Israel to the king to Hebron; and David made a covenant with them in Hebron before the LORD; and they anointed David king over Israel, according to the word of the LORD by Samuel.";

rsv[6] = "David said, &quot;Whoever shall smite the Jeb\'usites first shall be chief and commander.&quot; And Jo\'ab the son of Zeru\'iah went up first, so he became chief.";
rsv[7] = "And David dwelt in the stronghold; therefore it was called the city of David.";
rsv[8] = "And he built the city round about from the Millo in complete circuit; and Jo\'ab repaired the rest of the city.";
rsv[9] = "And David became greater and greater, for the LORD of hosts was with him.";
rsv[10] = "Now these are the chiefs of David\'s mighty men, who gave him strong support in his kingdom, together with all Israel, to make him king, according to the word of the LORD concerning Israel.";
rsv[11] = "This is an account of David\'s mighty men: Jasho\'be-am, a Hach\'monite, was chief of the three; he wielded his spear against three hundred whom he slew at one time.";
rsv[12] = "And next to him among the three mighty men was Elea\'zar the son of Dodo, the Aho\'hite.";
rsv[13] = "He was with David at Pas-dam\'mim when the Philistines were gathered there for battle. There was a plot of ground full of barley, and the men fled from the Philistines.";
rsv[14] = "But he took his stand in the midst of the plot, and defended it, and slew the Philistines; and the LORD saved them by a great victory.";
rsv[15] = "Three of the thirty chief men went down to the rock to David at the cave of Adullam, when the army of Philistines was encamped in the valley of Reph\'aim.";
rsv[16] = "David was then in the stronghold; and the garrison of the Philistines was then at Bethlehem.";
rsv[17] = "And David said longingly, &quot;O that some one would give me water to drink from the well of Bethlehem which is by the gate!&quot;";
rsv[18] = "Then the three mighty men broke through the camp of the Philistines, and drew water out of the well of Bethlehem which was by the gate, and took and brought it to David. But David would not drink of it; he poured it out to the LORD,";
rsv[19] = "and said, &quot;Far be it from me before my God that I should do this. Shall I drink the lifeblood of these men? For at the risk of their lives they brought it.&quot; Therefore he would not drink it. These things did the three mighty men.";
rsv[20] = "Now Abi\'shai, the brother of Jo\'ab, was chief of the thirty. And he wielded his spear against three hundred men and slew them, and won a name beside the three.";
rsv[21] = "He was the most renowned of the thirty, and became their commander; but he did not attain to the three.";
rsv[22] = "And Benai\'ah the son of Jehoi\'ada was a valiant man of Kabzeel, a doer of great deeds; he smote two ariels of Moab. He also went down and slew a lion in a pit on a day when snow had fallen.";
rsv[23] = "And he slew an Egyptian, a man of great stature, five cubits tall. The Egyptian had in his hand a spear like a weaver\'s beam; but Benai\'ah went down to him with a staff, and snatched the spear out of the Egyptian\'s hand, and slew him with his own spear.";
rsv[24] = "These things did Benai\'ah the son of Jehoi\'ada, and won a name beside the three mighty men.";
rsv[25] = "He was renowned among the thirty, but he did not attain to the three. And David set him over his bodyguard.";
rsv[26] = "The mighty men of the armies were As\'ahel the brother of Jo\'ab, Elha\'nan the son of Dodo of Bethlehem,";
rsv[27] = "Shammoth of Harod, Helez the Pel\'onite,";
rsv[28] = "Ira the son of Ikkesh of Teko\'a, Abi-e\'zer of An\'athoth,";
rsv[29] = "Sib\'becai the Hu\'shathite, I\'lai the Aho\'hite,";
rsv[30] = "Ma\'harai of Netoph\'ah, Heled the son of Ba\'anah of Netoph\'ah,";
rsv[31] = "Ithai the son of Ribai of Gib\'e-ah of the Benjaminites, Benai\'ah of Pira\'thon,";
rsv[32] = "Hurai of the brooks of Ga\'ash, Abi\'el the Ar\'bathite,";
rsv[33] = "Az\'maveth of Baha\'rum, Eli\'ahba of Sha-al\'bon,";
rsv[34] = "Hashem the Gi\'zonite, Jonathan the son of Shagee the Har\'arite,";
rsv[35] = "Ahi\'am the son of Sachar the Har\'arite, Eli\'phal the son of Ur,";
rsv[36] = "Hepher the Meche\'rathite, Ahi\'jah the Pel\'onite,";
rsv[37] = "Hezro of Carmel, Na\'arai the son of Ezbai,";
rsv[38] = "Jo\'el the brother of Nathan, Mibhar the son of Hagri,";
rsv[39] = "Zelek the Ammonite, Na\'harai of Be-er\'oth, the armor-bearer of Jo\'ab the son of Zeru\'iah,";
rsv[40] = "Ira the Ithrite, Gareb the Ithrite,";
rsv[41] = "Uri\'ah the Hittite, Zabad the son of Ahlai,";
rsv[42] = "Ad\'ina the son of Shiza the Reubenite, a leader of the Reubenites, and thirty with him,";
rsv[43] = "Hanan the son of Ma\'acah, and Josh\'aphat the Mithnite,";
rsv[44] = "Uzzi\'a the Ash\'terathite, Shama and Je-i\'el the sons of Hotham the Aro\'erite,";
rsv[45] = "Jedi\'a-el the son of Shimri, and Joha his brother, the Tizite,";
rsv[46] = "Eli\'el the Ma\'havite, and Jer\'ibai, and Joshavi\'ah, the sons of El\'na-am, and Ithmah the Mo\'abite,";
rsv[47] = "Eli\'el, and Obed, and Ja-asi\'el the Mezo\'ba-ite.";
vul[1] = "congregatus est igitur omnis Israhel ad David in Hebron dicens os tuum sumus et caro tua";
vul[2] = "heri quoque et nudius tertius cum adhuc regnaret Saul tu eras qui educebas et introducebas Israhel tibi enim dixit Dominus Deus tuus tu pasces populum meum Israhel et tu eris princeps super eum";
vul[3] = "venerunt ergo omnes maiores natu Israhel ad regem in Hebron et iniit David cum eis foedus coram Domino unxeruntque eum regem super Israhel iuxta sermonem Domini quem locutus est in manu Samuhel";
vul[4] = "abiit quoque David et omnis Israhel in Hierusalem haec est Iebus ubi erant Iebusei habitatores terrae";
vul[5] = "dixeruntque qui habitabant in Iebus ad David non ingredieris huc porro David cepit arcem Sion quae est civitas David";
vul[6] = "dixitque omnis qui percusserit Iebuseum in primis erit princeps et dux ascendit igitur primus Ioab filius Sarviae et factus est princeps";
vul[7] = "habitavit autem David in arce et idcirco appellata est civitas David";
vul[8] = "aedificavitque urbem in circuitu a Mello usque ad gyrum Ioab autem reliqua urbis extruxit";
vul[9] = "proficiebatque David vadens et crescens et Dominus exercituum erat cum eo";
vul[10] = "hii principes virorum fortium David qui adiuverunt eum ut rex fieret super omnem Israhel iuxta verbum Domini quod locutus est ad Israhel";
vul[11] = "et iste numerus robustorum David Iesbaam filius Achamoni princeps inter triginta iste levavit hastam suam super trecentos vulneratos una vice";
vul[12] = "et post eum Eleazar filius patrui eius Ahoites qui erat inter tres potentes";
vul[13] = "iste fuit cum David in Aphesdommim quando Philisthim congregati sunt ad locum illum in proelium et erat ager regionis illius plenus hordeo fugeratque populus a facie Philisthinorum";
vul[14] = "hic stetit in medio agri et defendit eum cumque percussisset Philistheos dedit Dominus salutem magnam populo suo";
vul[15] = "descenderunt autem tres de triginta principibus ad petram in qua erat David ad speluncam Odollam quando Philisthim fuerant castrametati in valle Raphaim";
vul[16] = "porro David erat in praesidio et statio Philisthinorum in Bethleem";
vul[17] = "desideravit igitur David et dixit o si quis daret mihi aquam de cisterna Bethleem quae est in porta";
vul[18] = "tres ergo isti per media castra Philisthinorum perrexerunt et hauserunt aquam de cisterna Bethleem quae erat in porta et adtulerunt ad David ut biberet qui noluit sed magis libavit illam Domino";
vul[19] = "dicens absit ut in conspectu Dei mei hoc faciam et sanguinem virorum istorum bibam quia in periculo animarum suarum adtulerunt mihi aquam et ob hanc causam noluit bibere haec fecerunt tres robustissimi";
vul[20] = "Abisai quoque frater Ioab ipse erat princeps trium et ipse levavit hastam suam contra trecentos vulneratos et ipse erat inter tres nominatissimus";
vul[21] = "inter tres secundos inclitus et princeps eorum verumtamen usque ad tres primos non pervenerat";
vul[22] = "Banaia filius Ioiadae viri robustissimi qui multa opera perpetrarat de Capsehel ipse percussit duos Arihel Moab et ipse descendit et interfecit leonem in media cisterna tempore nivis";
vul[23] = "et ipse percussit virum aegyptium cuius statura erat quinque cubitorum et habebat lanceam ut liciatorium texentium descendit ergo ad eum cum virga et rapuit hastam quam tenebat manu et interfecit eum hasta sua";
vul[24] = "haec fecit Banaia filius Ioiada qui erat inter tres robustos nominatissimus";
vul[25] = "inter triginta primus verumtamen ad tres usque non pervenerat posuit autem eum David ad auriculam suam";
vul[26] = "porro fortissimi in exercitu Asahel frater Ioab et Eleanan filius patrui eius de Bethleem";
vul[27] = "Semmoth Arorites Helles Phallonites";
vul[28] = "Iras filius Acces Thecuites Abiezer Anathothites";
vul[29] = "Sobbochai Asothites Ilai Ahoites";
vul[30] = "Marai Netophathites Heled filius Baana Netophathites";
vul[31] = "Ethai filius Ribai de Gabaath filiorum Beniamin Banaia Pharathonites";
vul[32] = "Uri de torrente Gaas Abial Arabathites Azmoth Bauramites Eliaba Salabonites";
vul[33] = "filii Asom Gezonites Ionathan filius Sega Ararites";
vul[34] = "Ahiam filius Sachar Ararites";
vul[35] = "Eliphal filius Ur";
vul[36] = "Apher Mechurathites Ahia Phellonites";
vul[37] = "Asrai Carmelites Noorai filius Azbi";
vul[38] = "Iohel frater Nathan Mabar filius Agarai";
vul[39] = "Sellec Ammonites Noorai Berothites armiger Ioab filii Sarviae";
vul[40] = "Iras Iethreus Gareb Iethreus";
vul[41] = "Urias Ettheus Zabad filius Ooli";
vul[42] = "Adina filius Seza Rubenites princeps Rubenitarum et cum eo triginta";
vul[43] = "Hanan filius Maacha et Iosaphat Mathanites";
vul[44] = "Ozias Astharothites Semma et Iaihel filii Hotam Aroerites";

web[1] = "Then all Israel gathered themselves to David to Hebron, saying, Behold, we [are] thy bone and thy flesh.";
web[2] = "And moreover in time past, even when Saul was king, thou [wast] he that leddest out and broughtest in Israel: and the LORD thy God said to thee, Thou shalt feed my people Israel, and thou shalt be ruler over my people Israel.";
web[3] = "Therefore came all the elders of Israel to the king to Hebron; and David made a covenant with them in Hebron before the LORD; and they anointed David king over Israel, according to the word of the LORD by Samuel.";
web[4] = "And David and all Israel went to Jerusalem, which [is] Jebus; where the Jebusites [were], the inhabitants of the land.";
web[5] = "And the inhabitants of Jebus said to David, Thou shalt not come hither. Nevertheless David took the castle of Zion, which [is] the city of David.";
web[6] = "And David said, Whoever smiteth the Jebusites first shall be chief and captain. So Joab the son of Zeruiah went up first, and was chief.";
web[7] = "And David dwelt in the castle; therefore they called it, The city of David.";
web[8] = "And he built the city around, even from Millo around: and Joab repaired the rest of the city.";
web[9] = "So David became greater and greater: for the LORD of hosts [was] with him.";
web[10] = "These also [are] the chief of the mighty men whom David had, who strengthened themselves with him in his kingdom, [and] with all Israel, to make him king according to the word of the LORD concerning Israel.";
web[11] = "And this [is] the number of the mighty men whom David had; Jashobeam a Hachmonite, the chief of the captains: he lifted his spear against three hundred slain [by him] at one time.";
web[12] = "And after him [was] Eleazar the son of Dodo, the Ahohite, who [was one] of the three mighties.";
web[13] = "He was with David at Pas-dammim, and there the Philistines were gathered to battle, where was a parcel of ground full of barley; and the people fled from before the Philistines.";
web[14] = "And they set themselves in the midst of [that] parcel, and delivered it, and slew the Philistines; and the LORD saved [them] by a great deliverance.";
web[15] = "Now three of the thirty captains went down to the rock to David, into the cave of Adullam; and the host of the Philistines encamped in the valley of Rephaim.";
web[16] = "And David [was] then in the hold, and the Philistines\' garrison [was] then at Beth-lehem.";
web[17] = "And David longed, and said, Oh that one would give me drink of the water of the well of Beth-lehem, that [is] at the gate!";
web[18] = "And the three broke through the host of the Philistines, and drew water out of the well of Beth-lehem, that [was] by the gate, and took [it], and brought [it] to David: but David would not drink [of] it, but poured it out to the LORD,";
web[19] = "And said, My God forbid it me, that I should do this thing: shall I drink the blood of these men that have put their lives in jeopardy? for with [the jeopardy of] their lives they brought it. Therefore he would not drink it. These things did these three mightiest.";
web[20] = "And Abishai the brother of Joab, he was chief of the three: for lifting his spear against three hundred, he slew [them], and had a name among the three.";
web[21] = "Of the three, he was more honorable than the two; for he was their captain: but he attained not to the [first] three.";
web[22] = "Benaiah the son of Jehoiada, the son of a valiant man of Kabzeel, who had done many acts; he slew two lion-like men of Moab: also he went down and slew a lion in a pit in a snowy day.";
web[23] = "And he slew an Egyptian, a man of [great] stature, five cubits high; and in the Egyptian\'s hand [was] a spear like a weaver\'s beam; and he went down to him with a staff, and plucked the spear out of the Egyptian\'s hand, and slew him with his own spear.";
web[24] = "These [things] did Benaiah the son of Jehoiada, and had the name among the three mighties.";
web[25] = "Behold, he was honorable among the thirty, but attained not to the [first] three: and David set him over his guard.";
web[26] = "Also the valiant men of the armies [were], Asahel the brother of Joab, Elhanan the son of Dodo of Beth-lehem,";
web[27] = "Shammoth the Harorite, Helez the Pelonite,";
web[28] = "Ira the son of Ikkesh the Tekoite, Abiezer the Antothite,";
web[29] = "Sibbecai the Hushathite, Ilai the Ahohite,";
web[30] = "Maharai the Netophathite, Heled the son of Baanah the Netophathite,";
web[31] = "Ithai the son of Ribai of Gibeah, [that pertained] to the children of Benjamin, Benaiah the Pirathonite,";
web[32] = "Hurai of the brooks of Gaash, Abiel the Arbathite,";
web[33] = "Azmaveth the Baharumite, Eliahba the Shaalbonite,";
web[34] = "The sons of Hashem the Gizonite, Jonathan the son of Shage the Hararite,";
web[35] = "Ahiam the son of Sacar the Hararite, Eliphel the son of Ur,";
web[36] = "Hepher the Mecherathite, Ahijah the Pelonite,";
web[37] = "Hezro the Carmelite, Naarai the son of Ezbai,";
web[38] = "Joel the brother of Nathan, Mibhar the son of Haggeri,";
web[39] = "Zelek the Ammonite, Naharai the Berothite, the armor-bearer of Joab the son of Zeruiah,";
web[40] = "Ira the Ithrite, Gareb the Ithrite,";
web[41] = "Uriah the Hittite, Zabad the son of Ahlai,";
web[42] = "Adina the son of Shiza the Reubenite, a captain of the Reubenites, and thirty with him,";
web[43] = "Hanan the son of Maachah, and Joshaphat the Mithnite,";
web[44] = "Uzzia the Ashterathite, Shama and Jehiel the sons of Hothan the Aroerite,";

web[47] = "Eliel, and Obed, and Jasiel the Mesobaite.";
yng[1] = "And gathered are all Israel unto David to Hebron, saying, `Lo, thy bone and thy flesh [are] we;";
yng[2] = "even in time past, even in Saul\'s being king, it is thou who art taking out and bringing in Israel, and Jehovah thy God saith to thee: Thou dost feed My people Israel, and thou art leader over My people Israel.\'";
yng[3] = "And all the elders of Israel come in unto the king to Hebron, and David maketh with them a covenant in Hebron before Jehovah, and they anoint David for king over Israel, according to the word of Jehovah by the hand of Samuel.";
yng[4] = "And David goeth, and all Israel, to Jerusalem -- it [is] Jebus -- and there the Jebusite, the inhabitants of the land.";
yng[5] = "And the inhabitants of Jebus say to David, `Thou dost not come in hither;\' and David captureth the fortress of Zion -- it [is] the city of David.";
yng[6] = "And David saith, `Whoever smiteth the Jebusite first doth become head and prince;\' and go up first doth Joab son of Zeruiah and becometh head.";
yng[7] = "And David dwelleth in the fortress, therefore they have called it, `City of David;\'";
yng[8] = "and he buildeth the city round about, from Millo, and unto the circumference, and Joab restoreth the rest of the city.";
yng[9] = "And David goeth, going on and becoming great, and Jehovah of Hosts [is] with him.";
yng[10] = "And these [are] heads of the mighty ones whom David hath, who are strengthening themselves with him in his kingdom, with all Israel, to cause him to reign, according to the word of Jehovah, over Israel.";
yng[11] = "And this [is] an account of the mighty ones whom David hath: Jashobeam son of a Hachmonite [is] head of the thirty; he is lifting up his spear against three hundred -- wounded, at one time.";
yng[12] = "And after him [is] Eleazar son of Dodo the Ahohite, he [is] among the three mighty;";
yng[13] = "he hath been with David in Pas-Dammim, and the Philistines have been gathered there to battle, and a portion of the field is full of barley, and the people have fled from the face of the Philistines,";
yng[14] = "and they station themselves in the midst of the portion, and deliver it, and smite the Philistines, and Jehovah saveth -- a great salvation.";
yng[15] = "And three of the thirty heads go down on the rock unto David, unto the cave of Adullam, and the host of the Philistines is encamping in the valley of Rephaim,";
yng[16] = "and David [is] then in the fortress, and the station of the Philistines [is] then in Beth-Lehem,";
yng[17] = "and David longeth, and saith, `Who doth give me to drink water from the well of Beth-Lehem, that [is] at the gate!\'";
yng[18] = "And the three break through the camp of the Philistines, and draw water from the well of Beth-Lehem, that [is] at the gate, and bear and bring in unto David, and David hath not been willing to drink it, and poureth it out to Jehovah,";
yng[19] = "and saith, `Far be it from me, by my God, to do this; the blood of these men do I drink with their lives? for with their lives they have brought it;\' and he was not willing to drink it; these [things] did the three mighty ones.";
yng[20] = "And Abishai brother of Joab, he hath been head of the three: and he is lifting up his spear against three hundred -- wounded, and hath a name among three.";
yng[21] = "Of the three by the two he is honoured, and becometh their head; and unto the [first] three he hath not come.";
yng[22] = "Benaiah son of Jehoiada, son of a man of valour, of great deeds, from Kabzeel: he hath smitten the two lion-like Moabites, and he hath gone down and smitten the lion in the midst of the pit, in the day of snow.";
yng[23] = "And he hath smitten the man, the Egyptian -- a man of measure, five by the cubit -- and in the hand of the Egyptian [is] a spear like a beam of weavers, and he goeth down unto him with a rod, and taketh violently away the spear out of the hand of the Egyptian, and slayeth him with his own spear.";
yng[24] = "These [things] hath Benaiah son of Jehoiada done, and hath a name among the three mighty ones.";
yng[25] = "Of the thirty, lo, he [is] honoured, and unto the [first] three he hath not come, and David setteth him over his guard.";
yng[26] = "And the mighty ones of the forces [are] Asahel brother of Joab, Elhanan son of Dodo of Beth-Lehem,";
yng[27] = "Shammoth the Harorite, Helez the Pelonite,";
yng[28] = "Ira son of Ikkesh the Tekoite, Abi-Ezer the Annethothite,";

csb[1] = "All Israel came together to David at Hebron and said, &quot;Here we are, your own flesh and blood.";
csb[2] = "&quot;Even previously when Saul was king, you were leading Israel out to battle and bringing us back. The LORD your God also said to you, \'You will shepherd my people Israel, and you will be ruler over my people Israel.\' &quot;";
csb[3] = "So all the elders of Israel came to the king at Hebron. David made a covenant with them at Hebron in the LORD\'s presence, and they anointed David king over Israel, in keeping with the LORD\'s word through Samuel.";
csb[4] = "David and all Israel marched to Jerusalem (that is, Jebus); the Jebusites who inhabited the land were there.";
csb[5] = "The inhabitants of Jebus said to David, &quot;You will never get in here.&quot; Yet David did capture the stronghold of Zion, that is, the city of David.";
csb[6] = "David said, &quot;Whoever is the first to kill a Jebusite will become chief commander.&quot; Joab son of Zeruiah went up first, so he became the chief.";
csb[7] = "Then David took up residence in the stronghold; therefore, it was called the city of David.";
csb[8] = "He built up the city all the way around, from the supporting terraces to the surrounding parts, and Joab restored the rest of the city.";
csb[9] = "David steadily grew more powerful, and the LORD of Armies was with him.";
csb[10] = "The following were the chiefs of David\'s warriors who, together with all Israel, strongly supported him in his reign to make him king according to the LORD\'s word about Israel.";
csb[11] = "This is the list of David\'s warriors: Jashobeam son of Hachmoni was chief of the Thirty; he wielded his spear against three hundred and killed them at one time.";
csb[12] = "After him, Eleazar son of Dodo the Ahohite was one of the three warriors.";
csb[13] = "He was with David at Pas-dammim when the Philistines had gathered there for battle. There was a portion of a field full of barley, where the troops had fled from the Philistines.";
csb[14] = "But Eleazar and David took their stand in the middle of the field and defended it. They killed the Philistines, and the LORD gave them a great victory.";
csb[15] = "Three of the thirty chief men went down to David, to the rock at the cave of Adullam, while the Philistine army was encamped in the Valley of Rephaim.";
csb[16] = "At that time David was in the stronghold, and a Philistine garrison was at Bethlehem.";
csb[17] = "David was extremely thirsty and said, &quot;If only someone would bring me water to drink from the well at the city gate of Bethlehem! &quot;";
csb[18] = "So the Three broke through the Philistine camp and drew water from the well at the gate of Bethlehem. They brought it back to David, but he refused to drink it. Instead, he poured it out to the LORD.";
csb[19] = "David said, &quot;I would never do such a thing in the presence of my God! How can I drink the blood of these men who risked their lives? &quot; For they brought it at the risk of their lives. So he would not drink it. Such were the exploits of the three warriors.";
csb[20] = "Abishai, Joab\'s brother, was the leader of the Three. He raised his spear against three hundred men and killed them, gaining a reputation among the Three.";
csb[21] = "He was more honored than the Three and became their commander even though he did not become one of the Three.";
csb[22] = "Benaiah son of Jehoiada was the son of a brave man from Kabzeel, a man of many exploits. Benaiah killed two sons of Ariel of Moab, and he went down into a pit on a snowy day and killed a lion.";
csb[23] = "He also killed an Egyptian who was seven and a half feet tall. Even though the Egyptian had a spear in his hand like a weaver\'s beam, Benaiah went down to him with a club, snatched the spear out of the Egyptian\'s hand, and then killed him with his own spear.";
csb[24] = "These were the exploits of Benaiah son of Jehoiada, who had a reputation among the three warriors.";
csb[25] = "He was the most honored of the Thirty, but he did not become one of the Three. David put him in charge of his bodyguard.";
csb[26] = "The best soldiers were Joab\'s brother Asahel, Elhanan son of Dodo of Bethlehem,";
csb[27] = "Shammoth the Harorite, Helez the Pelonite,";
csb[28] = "Ira son of Ikkesh the Tekoite, Abiezer the Anathothite,";
csb[29] = "Sibbecai the Hushathite, Ilai the Ahohite,";
csb[30] = "Maharai the Netophathite, Heled son of Baanah the Netophathite,";
csb[31] = "Ithai son of Ribai from Gibeah of the Benjaminites, Benaiah the Pirathonite,";
csb[32] = "Hurai from the wadis of Gaash, Abiel the Arbathite,";
csb[33] = "Azmaveth the Baharumite, Eliahba the Shaalbonite,";
csb[34] = "the sons of Hashem the Gizonite, Jonathan son of Shagee the Hararite,";
csb[35] = "Ahiam son of Sachar the Hararite, Eliphal son of Ur,";
csb[36] = "Hepher the Mecherathite, Ahijah the Pelonite,";
csb[37] = "Hezro the Carmelite, Naarai son of Ezbai,";
csb[38] = "Joel the brother of Nathan, Mibhar son of Hagri,";
csb[39] = "Zelek the Ammonite, Naharai the Beerothite, the armor-bearer for Joab son of Zeruiah,";
csb[40] = "Ira the Ithrite, Gareb the Ithrite,";
csb[41] = "Uriah the Hethite, Zabad son of Ahlai,";
csb[42] = "Adina son of Shiza the Reubenite, chief of the Reubenites, and thirty with him,";
csb[43] = "Hanan son of Maacah, Joshaphat the Mithnite,";
csb[44] = "Uzzia the Ashterathite, Shama and Jeiel the sons of Hotham the Aroerite,";
csb[45] = "Jediael son of Shimri and his brother Joha the Tizite,";
csb[46] = "Eliel the Mahavite, Jeribai and Joshaviah, the sons of Elnaam, Ithmah the Moabite,";
csb[47] = "Eliel, Obed, and Jaasiel the Mezobaite.";
