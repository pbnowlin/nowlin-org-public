asv[1] = "And it came to pass after this, that Nahash the king of the children of Ammon died, and his son reigned in his stead.";
asv[2] = "And David said, I will show kindness unto Hanun the son of Nahash, because his father showed kindness to me. So David sent messengers to comfort him concerning his father. And David\'s servants came into the land of the children of Ammon to Hanun, to comfort him.";
asv[3] = "But the princes of the children of Ammon said to Hanun, Thinkest thou that David doth honor thy father, in that he hath sent comforters unto thee? are not his servants come unto thee to search, and to overthrow, and to spy out the land?";
asv[4] = "So Hanun took David\'s servants, and shaved them, and cut off their garments in the middle, even to their buttocks, and sent them away.";
asv[5] = "Then there went certain persons, and told David how the men were served. And he sent to meet them; for the men were greatly ashamed. And the king said, Tarry at Jericho until your beards be grown, and then return.";
asv[6] = "And when the children of Ammon saw that they had made themselves odious to David, Hanun and the children of Ammon sent a thousand talents of silver to hire them chariots and horsemen out of Mesopotamia, and out of Aram-maacah, and out of Zobah.";
asv[7] = "So they hired them thirty and two thousand chariots, and the king of Maacah and his people, who came and encamped before Medeba. And the children of Ammon gathered themselves together from their cities, and came to battle.";
asv[8] = "And when David heard of it, he sent Joab, and all the host of the mighty men.";
asv[9] = "And the children of Ammon came out, and put the battle in array at the gate of the city: and the kings that were come were by themselves in the field.";
asv[10] = "Now when Joab saw that the battle was set against him before and behind, he chose of all the choice men of Israel, and put them in array against the Syrians.";
asv[11] = "And the rest of the people he committed into the hand of Abishai his brother; and they put themselves in array against the children of Ammon.";
asv[12] = "And he said, If the Syrians be too strong for me, then thou shalt help me; but if the children of Ammon be too strong for thee, then I will help thee.";
asv[13] = "Be of good courage, and let us play the man for our people, and for the cities of our God: and Jehovah do that which seemeth him good.";
asv[14] = "So Joab and the people that were with him drew nigh before the Syrians unto the battle; and they fled before him.";
asv[15] = "And when the children of Ammon saw that the Syrians were fled, they likewise fled before Abishai his brother, and entered into the city. Then Joab came to Jerusalem.";
asv[16] = "And when the Syrians saw that they were put to the worse before Israel, they sent messengers, and drew forth the Syrians that were beyond the River, with Shophach the captain of the host of Hadarezer at their head.";
asv[17] = "And it was told David; and he gathered all Israel together, and passed over the Jordan, and came upon them, and set the battle in array against them. So when David had put the battle in array against the Syrians, they fought with him.";
asv[18] = "And the Syrians fled before Israel; and David slew of the Syrians [the men of] seven thousand chariots, and forty thousand footmen, and killed Shophach the captain of the host.";
asv[19] = "And when the servants of Hadarezer saw that they were put to the worse before Israel, they made peace with David, and served him: neither would the Syrians help the children of Ammon any more.";

hnv[1] = "It happened after this, that Nachash the king of the children of `Ammon died, and his son reigned in his place.";
hnv[2] = "David said, I will show kindness to Hanun the son of Nachash, because his father shown kindness to me. So David sent messengers to comfort him concerning his father. David\'s servants came into the land of the children of `Ammon to Hanun, to comfort him.";
hnv[3] = "But the princes of the children of `Ammon said to Hanun, Think you that David does honor your father, in that he has sent comforters to you? Aren\'t his servants come to you to search, and to overthrow, and to spy out the land?";
hnv[4] = "So Hanun took David\'s servants, and shaved them, and cut off their garments in the middle, even to their buttocks, and sent them away.";
hnv[5] = "Then there went certain persons, and told David how the men were served. He sent to meet them; for the men were greatly ashamed. The king said, Stay at Yericho until your beards be grown, and then return.";
hnv[6] = "When the children of `Ammon saw that they had made themselves odious to David, Hanun and the children of `Ammon sent one thousand talents of silver to hire them chariots and horsemen out of Aram-Naharayim, and out of Arammaacah, and out of Tzovah.";
hnv[7] = "So they hired them thirty-two thousand chariots, and the king of Ma`akhah and his people, who came and encamped before Medeva. The children of `Ammon gathered themselves together from their cities, and came to battle.";
hnv[8] = "When David heard of it, he sent Yo\'av, and all the host of the mighty men.";
hnv[9] = "The children of `Ammon came out, and put the battle in array at the gate of the city: and the kings who had come were by themselves in the field.";
hnv[10] = "Now when Yo\'av saw that the battle was set against him before and behind, he chose of all the choice men of Yisra\'el, and put them in array against the Aram.";
hnv[11] = " The rest of the people he committed into the hand of Avishai his brother; and they put themselves in array against the children of `Ammon.";
hnv[12] = "He said, If the Aram be too strong for me, then you shall help me; but if the children of `Ammon be too strong for you, then I will help you.";
hnv[13] = "Be of good courage, and let us play the man for our people, and for the cities of our God: and the LORD do that which seems him good.";
hnv[14] = "So Yo\'av and the people who were with him drew near before the Aram to the battle; and they fled before him.";
hnv[15] = "When the children of `Ammon saw that the Aram were fled, they likewise fled before Avishai his brother, and entered into the city. Then Yo\'av came to Yerushalayim.";
hnv[16] = "When the Aram saw that they were put to the worse before Yisra\'el, they sent messengers, and drew forth the Aram who were beyond the River, with Shophach the captain of the host of Hadad`ezer at their head.";
hnv[17] = "It was told David; and he gathered all Yisra\'el together, and passed over the Yarden, and came on them, and set the battle in array against them. So when David had put the battle in array against the Aram, they fought with him.";
hnv[18] = "The Aram fled before Yisra\'el; and David killed of the Aram [the men of] seven thousand chariots, and forty thousand footmen, and killed Shophach the captain of the host.";
hnv[19] = "When the servants of Hadad`ezer saw that they were put to the worse before Yisra\'el, they made shalom with David, and served him: neither would the Aram help the children of `Ammon any more.";

rsv[1] = "Now after this Nahash the king of the Ammonites died, and his son reigned in his stead.";
rsv[2] = "And David said, &quot;I will deal loyally with Hanun the son of Nahash, for his father dealt loyally with me.&quot; So David sent messengers to console him concerning his father. And David\'s servants came to Hanun in the land of the Ammonites, to console him.";
rsv[3] = "But the princes of the Ammonites said to Hanun, &quot;Do you think, because David has sent comforters to you, that he is honoring your father? Have not his servants come to you to search and to overthrow and to spy out the land?&quot;";
rsv[4] = "So Hanun took David\'s servants, and shaved them, and cut off their garments in the middle, at their hips, and sent them away;";
rsv[5] = "and they departed. When David was told concerning the men, he sent to meet them, for the men were greatly ashamed. And the king said, &quot;Remain at Jericho until your beards have grown, and then return.&quot;";
rsv[6] = "When the Ammonites saw that they had made themselves odious to David, Hanun and the Ammonites sent a thousand talents of silver to hire chariots and horsemen from Mesopota\'mia, from Aram-ma\'acah, and from Zobah.";
rsv[7] = "They hired thirty-two thousand chariots and the king of Ma\'acah with his army, who came and encamped before Med\'eba. And the Ammonites were mustered from their cities and came to battle.";
rsv[8] = "When David heard of it, he sent Jo\'ab and all the army of the mighty men.";
rsv[9] = "And the Ammonites came out and drew up in battle array at the entrance of the city, and the kings who had come were by themselves in the open country.";
rsv[10] = "When Jo\'ab saw that the battle was set against him both in front and in the rear, he chose some of the picked men of Israel, and arrayed them against the Syrians;";
rsv[11] = "the rest of his men he put in the charge of Abi\'shai his brother, and they were arrayed against the Ammonites.";
rsv[12] = "And he said, &quot;If the Syrians are too strong for me, then you shall help me; but if the Ammonites are too strong for you, then I will help you.";
rsv[13] = "Be of good courage, and let us play the man for our people, and for the cities of our God; and may the LORD do what seems good to him.&quot;";
rsv[14] = "So Jo\'ab and the people who were with him drew near before the Syrians for battle; and they fled before him.";
rsv[15] = "And when the Ammonites saw that the Syrians fled, they likewise fled before Abi\'shai, Jo\'ab\'s brother, and entered the city. Then Jo\'ab came to Jerusalem.";
rsv[16] = "But when the Syrians saw that they had been defeated by Israel, they sent messengers and brought out the Syrians who were beyond the Euphra\'tes, with Shophach the commander of the army of Hadade\'zer at their head.";
rsv[17] = "And when it was told David, he gathered all Israel together, and crossed the Jordan, and came to them, and drew up his forces against them. And when David set the battle in array against the Syrians, they fought with him.";
rsv[18] = "And the Syrians fled before Israel; and David slew of the Syrians the men of seven thousand chariots, and forty thousand foot soldiers, and killed also Shophach the commander of their army.";
rsv[19] = "And when the servants of Hadade\'zer saw that they had been defeated by Israel, they made peace with David, and became subject to him. So the Syrians were not willing to help the Ammonites any more.";
vul[1] = "accidit autem ut moreretur Naas rex filiorum Ammon et regnaret filius eius pro eo";
vul[2] = "dixitque David faciam misericordiam cum Hanon filio Naas praestitit enim pater eius mihi gratiam misitque David nuntios ad consolandum eum super morte patris sui qui cum pervenissent in terram filiorum Ammon ut consolarentur Hanon";
vul[3] = "dixerunt principes filiorum Ammon ad Hanon tu forsitan putas quod David honoris causa in patrem tuum miserit qui consolentur te nec animadvertis quod ut explorent et investigent et scrutentur terram tuam venerint ad te servi eius";
vul[4] = "igitur Hanon pueros David decalvavit et rasit et praecidit tunicas eorum a natibus usque ad pedes et dimisit eos";
vul[5] = "qui cum abissent et hoc mandassent David misit in occursum eorum grandem enim contumeliam sustinuerant et praecepit ut manerent in Hiericho donec cresceret barba eorum et tunc reverterentur";
vul[6] = "videntes autem filii Ammon quod iniuriam fecissent David tam Hanon quam reliquus populus miserunt mille talenta argenti ut conducerent sibi de Mesopotamia et de Syria Macha et de Suba currus et equites";
vul[7] = "conduxeruntque triginta duo milia curruum et regem Macha cum populo eius qui cum venissent castrametati sunt e regione Medaba filii quoque Ammon congregati de urbibus suis venerunt ad bellum";
vul[8] = "quod cum audisset David misit Ioab et omnem exercitum virorum fortium";
vul[9] = "egressique filii Ammon direxerunt aciem iuxta portam civitatis reges autem qui ad auxilium venerant separatim in agro steterunt";
vul[10] = "igitur Ioab intellegens bellum et ex adverso et post tergum contra se fieri elegit viros fortissimos de universo Israhel et perrexit contra Syrum";
vul[11] = "reliquam autem partem populi dedit sub manu Abisai fratris sui et perrexerunt contra filios Ammon";
vul[12] = "dixitque si vicerit me Syrus auxilio eris mihi sin autem superaverint te filii Ammon ero tibi in praesidium";
vul[13] = "confortare et agamus viriliter pro populo nostro et pro urbibus Dei nostri Dominus autem quod in conspectu suo bonum est faciet";
vul[14] = "perrexit ergo Ioab et populus qui cum eo erat contra Syrum ad proelium et fugavit eos";
vul[15] = "porro filii Ammon videntes quod fugisset Syrus ipsi quoque fugerunt Abisai fratrem eius et ingressi sunt civitatem reversusque est etiam Ioab in Hierusalem";
vul[16] = "videns autem Syrus quod cecidisset coram Israhel misit nuntios et adduxit Syrum qui erat trans Fluvium Sophach autem princeps militiae Adadezer erat dux eorum";
vul[17] = "quod cum nuntiatum esset David congregavit universum Israhel et transivit Iordanem inruitque in eos et direxit ex adverso aciem illis contra pugnantibus";
vul[18] = "fugit autem Syrus Israhel et interfecit David de Syris septem milia curruum et quadraginta milia peditum et Sophach exercitus principem";
vul[19] = "videntes autem servi Adadezer se ab Israhel esse superatos transfugerunt ad David et servierunt ei noluitque ultra Syria auxilium praebere filiis Ammon";

yng[1] = "And it cometh to pass after this, that Nahash king of the sons of Ammon dieth, and his son reigneth in his stead,";
yng[2] = "and David saith, `I do kindness with Hanun son of Nahash, for his father did with me kindness;\' and David sendeth messengers to comfort him concerning his father. And the servants of David come in unto the land of the sons of Ammon, unto Hanun, to comfort him,";
yng[3] = "and the heads of the sons of Ammon say to Hanun, `Is David honouring thy father, in thine eyes, because he hath sent to thee comforters? in order to search, and to overthrow, and to spy out, the land, have not his servants come in unto thee?\'";
yng[4] = "And Hanun taketh the servants of David, and shaveth them, and cutteth their long robes in the midst, unto the buttocks, and sendeth them away.";
yng[5] = "And [some] go, and declare to David concerning the men, and he sendeth to meet them -- for the men have been greatly ashamed -- and the king saith, `Dwell in Jericho till that your beard is grown, then ye have returned.\'";
yng[6] = "And the sons of Ammon see that they have made themselves abhorred by David, and Hanun and the sons of Ammon send a thousand talents of silver, to hire to them, from Aram-Naharaim, and from Aram-Maachah, and from Zobah, chariots and horsemen;";
yng[7] = "and they hire to them two and thirty thousand chariots, and the king of Maachah and his people, and they come in and encamp before Medeba, and the sons of Ammon have been gathered out of their cities, and come in to the battle.";
yng[8] = "And David heareth, and sendeth Joab, and all the host of the mighty men,";
yng[9] = "and the sons of Ammon come out and set battle in array at the opening of the city, and the kings who have come [are] by themselves in the field.";
yng[10] = "And Joab seeth that the front of the battle hath been unto him, before and behind, and he chooseth out of all the choice in Israel, and setteth in array to meet Aram,";
yng[11] = "and the remnant of the people he hath given into the hand of Abishai his brother, and they set in array to meet the sons of Ammon.";
yng[12] = "And he saith, `If Aram be stronger than I, then thou hast been to me for salvation; and if the sons of Ammon be stronger than thou, then I have saved thee;";
yng[13] = "be strong, and we strengthen ourselves, for our people, and for the cities of our God, and Jehovah doth that which is good in His eyes.\'";
yng[14] = "And Joab draweth nigh, and the people who [are] with him, before Aram to battle, and they flee from his face;";
yng[15] = "and the sons of Ammon have seen that Aram hath fled, and they flee -- they also -- from the face of Abishai his brother, and go in to the city. And Joab cometh in to Jerusalem.";
yng[16] = "And Aram seeth that they have been smitten before Israel, and send messengers, and bring out Aram that [is] beyond the River, and Shophach head of the host of Hadarezer [is] before them.";
yng[17] = "And it is declared to David, and he gathereth all Israel, and passeth over the Jordan, and cometh in unto them, and setteth in array against them; yea, David setteth in array the battle to meet Aram, and they fight with him;";
yng[18] = "and Aram fleeth from the face of Israel, and David slayeth of Aram seven thousand charioteers, and forty thousand footmen, and Shophach head of the host he hath put to death.";
yng[19] = "And the servants of Hadarezer see that they have been smitten before Israel, and they make peace with David and serve him, and Aram hath not been willing to help the sons of Ammon any more.";
csb[1] = "Some time later, King Nahash of the Ammonites died, and his son became king in his place.";
csb[2] = "Then David said, &quot;I\'ll show kindness to Hanun son of Nahash, because his father showed kindness to me.&quot; So David sent messengers to console him concerning his father. However, when David\'s emissaries arrived in the land of the Ammonites to console him,";
csb[3] = "the Ammonite leaders said to Hanun, &quot;Just because David has sent men with condolences for you, do you really believe he\'s showing respect for your father? Instead, haven\'t his emissaries come in order to scout out, overthrow, and spy on the land? &quot;";
csb[4] = "So Hanun took David\'s emissaries, shaved them, cut their clothes in half at the hips, and sent them away.";
csb[5] = "It was reported to David about his men, so he sent messengers to meet them, since the men were deeply humiliated. The king said, &quot;Stay in Jericho until your beards grow back; then return.&quot;";
csb[6] = "When the Ammonites realized they had made themselves repulsive to David, Hanun and the Ammonites sent thirty-eight tons of silver to hire chariots and horsemen from Aram-naharaim, Aram-maacah, and Zobah.";
csb[7] = "They hired thirty-two thousand chariots and the king of Maacah with his army, who came and camped near Medeba. The Ammonites also came together from their cities for the battle.";
csb[8] = "David heard about this and sent Joab and all the elite troops.";
csb[9] = "The Ammonites marched out and lined up in battle formation at the entrance of the city while the kings who had come were in the field by themselves.";
csb[10] = "When Joab saw that there was a battle line in front of him and another behind him, he chose some of Israel\'s finest young men and lined up in formation to engage the Arameans.";
csb[11] = "He placed the rest of the forces under the command of his brother Abishai. They lined up in formation to engage the Ammonites.";
csb[12] = "&quot;If the Arameans are too strong for me,&quot; Joab said, &quot;then you\'ll be my help. However, if the Ammonites are too strong for you, I\'ll help you.";
csb[13] = "&quot;Be strong! Let\'s prove ourselves strong for our people and for the cities of our God. May the LORD\'s will be done.&quot;";
csb[14] = "Joab and the people with him approached the Arameans for battle, and they fled before him.";
csb[15] = "When the Ammonites saw that the Arameans had fled, they likewise fled before Joab\'s brother Abishai and entered the city. Then Joab went to Jerusalem.";
csb[16] = "When the Arameans realized that they had been defeated by Israel, they sent messengers to summon the Arameans who were beyond the Euphrates River. They were led by Shophach, the commander of Hadadezer\'s army.";
csb[17] = "When this was reported to David, he gathered all Israel and crossed the Jordan. He came up to the Arameans and lined up against them. When David lined up to engage them, they fought against him.";
csb[18] = "But the Arameans fled before Israel, and David killed seven thousand of their charioteers and forty thousand foot soldiers. He also killed Shophach, commander of the army.";
csb[19] = "When Hadadezer\'s subjects saw that they had been defeated by Israel, they made peace with David and became his subjects. After this, the Arameans were never willing to help the Ammonites again.";
