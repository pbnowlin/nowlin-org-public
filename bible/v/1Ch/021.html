asv[1] = "And Satan stood up against Israel, and moved David to number Israel.";
asv[2] = "And David said to Joab and to the princes of the people, Go, number Israel from Beer-sheba even to Dan; and bring me word, that I may know the sum of them.";
asv[3] = "And Joab said, Jehovah make his people a hundred times as many as they are: but, my lord the king, are they not all my lord\'s servants? why doth my lord require this thing? why will he be a cause of guilt unto Israel?";
asv[4] = "Nevertheless the king\'s word prevailed against Joab. Wherefore Joab departed, and went throughout all Israel, and came to Jerusalem.";
asv[5] = "And Joab gave up the sum of the numbering of the people unto David. And all they of Israel were a thousand thousand and a hundred thousand men that drew sword: and Judah was four hundred threescore and ten thousand men that drew sword.";
asv[6] = "But Levi and Benjamin counted he not among them; for the king\'s word was abominable to Joab.";
asv[7] = "And God was displeased with this thing; therefore he smote Israel.";
asv[8] = "And David said unto God, I have sinned greatly, in that I have done this thing: but now put away, I beseech thee, the iniquity of thy servant; for I have done very foolishly.";
asv[9] = "And Jehovah spake unto Gad, David\'s seer, saying,";
asv[10] = "Go and speak unto David, saying, Thus saith Jehovah, I offer thee three things: choose thee one of them, that I may do it unto thee.";
asv[11] = "So Gad came to David, and said unto him, Thus saith Jehovah, Take which thou wilt:";
asv[12] = "either three years of famine; or three months to be consumed before thy foes, while the sword of thine enemies overtaketh thee; or else three days the sword of Jehovah, even pestilence in the land, and the angel of Jehovah destroying throughout all the borders of Israel. Now therefore consider what answer I shall return to him that sent me.";
asv[13] = "And David said unto Gad, I am in a great strait: let me fall, I pray, into the hand of Jehovah; for very great are his mercies: and let me not fall into the hand of man.";
asv[14] = "So Jehovah sent a pestilence upon Israel; and there fell of Israel seventy thousand men.";
asv[15] = "And God sent an angel unto Jerusalem to destroy it: and as he was about to destroy, Jehovah beheld, and he repented him of the evil, and said to the destroying angel, It is enough; now stay thy hand. And the angel of Jehovah was standing by the threshing-floor of Ornan the Jebusite.";
asv[16] = "And David lifted up his eyes, and saw the angel of Jehovah standing between earth and heaven, having a drawn sword in his hand stretched out over Jerusalem. Then David and the elders, clothed in sackcloth, fell upon their faces.";
asv[17] = "And David said unto God, Is it not I that commanded the people to be numbered? even I it is that have sinned and done very wickedly; but these sheep, what have they done? let thy hand, I pray thee, O Jehovah my God, be against me, and against my father\'s house; but not against thy people, that they should be plagued.";
asv[18] = "Then the angel of Jehovah commanded Gad to say to David, that David should go up, and rear an altar unto Jehovah in the threshing-floor of Ornan the Jebusite.";
asv[19] = "And David went up at the saying of Gad, which he spake in the name of Jehovah.";
asv[20] = "And Ornan turned back, and saw the angel; and his four sons that were with him hid themselves. Now Ornan was threshing wheat.";
asv[21] = "And as David came to Ornan, Ornan looked and saw David, and went out of the threshing-floor, and bowed himself to David with his face to the ground.";
asv[22] = "Then David said to Ornan, Give me the place of this threshing-floor, that I may build thereon an altar unto Jehovah: for the full price shalt thou give it me, that the plague may be stayed from the people.";
asv[23] = "And Ornan said unto David, Take it to thee, and let my lord the king do that which is good in his eyes: lo, I give [thee] the oxen for burnt-offerings, and the threshing instruments for wood, and the wheat for the meal-offering; I give it all.";
asv[24] = "And king David said to Ornan, Nay; but I will verily buy it for the full price: for I will not take that which is thine for Jehovah, nor offer a burnt-offering without cost.";
asv[25] = "So David gave to Ornan for the place six hundred shekels of gold by weight.";
asv[26] = "And David built there an altar unto Jehovah, and offered burnt-offerings and peace-offerings, and called upon Jehovah; and he answered him from heaven by fire upon the altar of burnt-offering.";
asv[27] = "And Jehovah commanded the angel; and he put up his sword again into the sheath thereof.";
asv[28] = "At that time, when David saw that Jehovah had answered him in the threshing-floor of Ornan the Jebusite, then he sacrificed there.";
asv[29] = "For the tabernacle of Jehovah, which Moses made in the wilderness, and the altar of burnt-offering, were at that time in the high place at Gibeon.";
asv[30] = "But David could not go before it to inquire of God; for he was afraid because of the sword of the angel of Jehovah.";
dby[1] = "And Satan stood up against Israel, and moved David to number Israel.";

dby[4] = "But the king\'s word prevailed against Joab; and Joab departed, and went through all Israel, and came [again] to Jerusalem.";
dby[5] = "And Joab gave the sum of the number of the people to David. And all they of Israel were eleven hundred thousand men that drew sword; and of Judah, four hundred and seventy thousand men that drew sword.";

dby[11] = "And Gad came to David, and said to him, Thus saith Jehovah:";
dby[12] = "Choose thee, either three years of famine, or three months to be destroyed before thine adversaries while that the sword of thine enemies overtaketh thee, or three days the sword of Jehovah and the pestilence in the land, and the angel of Jehovah destroying through all the borders of Israel. And now consider what word I shall bring again to him that sent me.";

dby[16] = "And David lifted up his eyes, and saw the angel of Jehovah stand between the earth and the heavens, and his sword drawn in his hand, stretched out over Jerusalem. And David and the elders, clothed in sackcloth, fell on their faces.";
dby[17] = "And David said to God, Is it not I that commanded the people to be numbered? It is I that have sinned and done evil; but these sheep, what have they done? Let thy hand, I pray thee, Jehovah my God, be on me and on my father\'s house; but not on thy people, that they should be smitten.";
dby[18] = "And the angel of Jehovah commanded Gad to say to David, that David should go up and rear an altar to Jehovah in the threshing-floor of Ornan the Jebusite.";
dby[19] = "And David went up at the saying of Gad, which he had spoken in the name of Jehovah.";
dby[20] = "And Ornan turned back and saw the angel; and his four sons with him hid themselves. Now Ornan was threshing wheat.";

dby[22] = "And David said to Ornan, Grant me the place of the threshing-floor, that I may build an altar in it to Jehovah: grant it to me for the full money, that the plague may be stayed from the people.";
dby[23] = "And Ornan said to David, Take it to thee, and let my lord the king do that which is good in his sight: see, I give the oxen for the burnt-offering, and the threshing-sledges for wood, and the wheat for the oblation; I give it all.";
dby[24] = "And king David said to Ornan, No; but I will in any case buy [them] for the full money; for I will not take that which is thine for Jehovah, to offer up a burnt-offering without cost.";
dby[25] = "And David gave to Ornan for the place in shekels of gold the weight of six hundred [shekels].";
dby[26] = "And David built there an altar to Jehovah, and offered up burnt-offerings and peace-offerings, and called upon Jehovah; and he answered him from the heavens by fire upon the altar of burnt-offering.";
dby[27] = "And Jehovah spoke to the angel; and he put up his sword again into its sheath.";
dby[28] = "At that time when David saw that Jehovah had answered him in the threshing-floor of Ornan the Jebusite, then he sacrificed there.";
dby[29] = "And the tabernacle of Jehovah, which Moses had made in the wilderness, and the altar of burnt-offering, were at that time in the high place at Gibeon.";
dby[30] = "But David could not go before it to inquire of God; for he was afraid because of the sword of the angel of Jehovah.";
hnv[1] = "Hasatan stood up against Yisra\'el, and moved David to number Yisra\'el.";
hnv[2] = "David said to Yo\'av and to the princes of the people, Go, number Yisra\'el from Be\'er-Sheva even to Dan; and bring me word, that I may know the sum of them.";
hnv[3] = "Yo\'av said, the LORD make his people a hundred times as many as they are: but, my lord the king, aren\'t they all my lord\'s servants? why does my lord require this thing? why will he be a cause of guilt to Yisra\'el?";
hnv[4] = "Nevertheless the king\'s word prevailed against Yo\'av. Therefore Yo\'av departed, and went throughout all Yisra\'el, and came to Yerushalayim.";
hnv[5] = "Yo\'av gave up the sum of the numbering of the people to David. All those of Yisra\'el were one million one hundred thousand men who drew sword: and in Yehudah were four hundred seventy thousand men who drew sword.";
hnv[6] = "But he didn\'t count Levi and Binyamin among them; for the king\'s word was abominable to Yo\'av.";
hnv[7] = "God was displeased with this thing; therefore he struck Yisra\'el.";
hnv[8] = "David said to God, I have sinned greatly, in that I have done this thing: but now, put away, I beg you, the iniquity of your servant; for I have done very foolishly.";
hnv[9] = "The LORD spoke to Gad, David\'s seer, saying,";
hnv[10] = "Go and speak to David, saying, Thus says the LORD, I offer you three things: choose you one of them, that I may do it to you.";
hnv[11] = "So Gad came to David, and said to him, Thus says the LORD, Take which you will:";
hnv[12] = "either three years of famine; or three months to be consumed before your foes, while the sword of your enemies overtakes you; or else three days the sword of the LORD, even pestilence in the land, and the angel of the LORD destroying throughout all the borders of Yisra\'el. Now therefore consider what answer I shall return to him who sent me.";
hnv[13] = "David said to Gad, I am in a great strait: let me fall, I pray, into the hand of the LORD; for very great are his mercies: and let me not fall into the hand of man.";
hnv[14] = "So the LORD sent a pestilence on Yisra\'el; and there fell of Yisra\'el seventy thousand men.";
hnv[15] = "God sent an angel to Yerushalayim to destroy it: and as he was about to destroy, the LORD saw, and he repented him of the evil, and said to the destroying angel, It is enough; now stay your hand. The angel of the LORD was standing by the threshing floor of Ornan the Yevusi.";
hnv[16] = "David lifted up his eyes, and saw the angel of the LORD standing between eretz and the sky, having a drawn sword in his hand stretched out over Yerushalayim. Then David and the Zakenim, clothed in sackcloth, fell on their faces.";
hnv[17] = "David said to God, Isn\'t it I who commanded the people to be numbered? It is even I who have sinned and done very wickedly; but these sheep, what have they done? Please let your hand, O LORD my God, be against me, and against my father\'s house; but not against your people, that they should be plagued.";
hnv[18] = "Then the angel of the LORD commanded Gad to tell David, that David should go up, and raise an altar to the LORD in the threshing floor of Ornan the Yevusi.";
hnv[19] = "David went up at the saying of Gad, which he spoke in the name of the LORD.";
hnv[20] = "Ornan turned back, and saw the angel; and his four sons who were with him hid themselves. Now Ornan was threshing wheat.";
hnv[21] = "As David came to Ornan, Ornan looked and saw David, and went out of the threshing floor, and bowed himself to David with his face to the ground.";
hnv[22] = "Then David said to Ornan, Give me the place of this threshing floor, that I may build thereon an altar to the LORD: for the full price shall you give it me, that the plague may be stayed from the people.";
hnv[23] = " Ornan said to David, Take it to you, and let my lord the king do that which is good in his eyes: behold, I give [you] the oxen for burnt offerings, and the threshing instruments for wood, and the wheat for the meal-offering; I give it all.";
hnv[24] = "King David said to Ornan, No; but I will most assuredly buy it for the full price: for I will not take that which is your for the LORD, nor offer a burnt-offering without cost.";
hnv[25] = "So David gave to Ornan for the place six hundred shekels of gold by weight.";
hnv[26] = "David built there an altar to the LORD, and offered burnt offerings and peace-offerings, and called on the LORD; and he answered him from the sky by fire on the altar of burnt offering.";
hnv[27] = "The LORD commanded the angel; and he put up his sword again into the sheath of it.";
hnv[28] = "At that time, when David saw that the LORD had answered him in the threshing floor of Ornan the Yevusi, then he sacrificed there.";
hnv[29] = "For the tent of the LORD, which Moshe made in the wilderness, and the altar of burnt offering, were at that time in the high place at Giv`on.";

rsv[1] = "Satan stood up against Israel, and incited David to number Israel.";
rsv[2] = "So David said to Jo\'ab and the commanders of the army, &quot;Go, number Israel, from Beer-sheba to Dan, and bring me a report, that I may know their number.&quot;";
rsv[3] = "But Jo\'ab said, &quot;May the LORD add to his people a hundred times as many as they are! Are they not, my lord the king, all of them my lord\'s servants? Why then should my lord require this? Why should he bring guilt upon Israel?&quot;";
rsv[4] = "But the king\'s word prevailed against Jo\'ab. So Jo\'ab departed and went throughout all Israel, and came back to Jerusalem.";
rsv[5] = "And Jo\'ab gave the sum of the numbering of the people to David. In all Israel there were one million one hundred thousand men who drew the sword, and in Judah four hundred and seventy thousand who drew the sword.";
rsv[6] = "But he did not include Levi and Benjamin in the numbering, for the king\'s command was abhorrent to Jo\'ab.";
rsv[7] = "But God was displeased with this thing, and he smote Israel.";
rsv[8] = "And David said to God, &quot;I have sinned greatly in that I have done this thing. But now, I pray thee, take away the iniquity of thy servant; for I have done very foolishly.&quot;";
rsv[9] = "And the LORD spoke to Gad, David\'s seer, saying,";
rsv[10] = "&quot;Go and say to David, \'Thus says the LORD, Three things I offer you; choose one of them, that I may do it to you.\'&quot;";
rsv[11] = "So Gad came to David and said to him, &quot;Thus says the LORD, \'Take which you will:";
rsv[12] = "either three years of famine; or three months of devastation by your foes, while the sword of your enemies overtakes you; or else three days of the sword of the LORD, pestilence upon the land, and the angel of the LORD destroying throughout all the territory of Israel.\' Now decide what answer I shall return to him who sent me.&quot;";
rsv[13] = "Then David said to Gad, &quot;I am in great distress; let me fall into the hand of the LORD, for his mercy is very great; but let me not fall into the hand of man.&quot;";
rsv[14] = "So the LORD sent a pestilence upon Israel; and there fell seventy thousand men of Israel.";
rsv[15] = "And God sent the angel to Jerusalem to destroy it; but when he was about to destroy it, the LORD saw, and he repented of the evil; and he said to the destroying angel, &quot;It is enough; now stay your hand.&quot; And the angel of the LORD was standing by the threshing floor of Ornan the Jeb\'usite.";
rsv[16] = "And David lifted his eyes and saw the angel of the LORD standing between earth and heaven, and in his hand a drawn sword stretched out over Jerusalem. Then David and the elders, clothed in sackcloth, fell upon their faces.";
rsv[17] = "And David said to God, &quot;Was it not I who gave command to number the people? It is I who have sinned and done very wickedly. But these sheep, what have they done? Let thy hand, I pray thee, O LORD my God, be against me and against my father\'s house; but let not the plague be upon thy people.&quot;";
rsv[18] = "Then the angel of the LORD commanded Gad to say to David that David should go up and rear an altar to the LORD on the threshing floor of Ornan the Jeb\'usite.";
rsv[19] = "So David went up at Gad\'s word, which he had spoken in the name of the LORD.";
rsv[20] = "Now Ornan was threshing wheat; he turned and saw the angel, and his four sons who were with him hid themselves.";
rsv[21] = "As David came to Ornan, Ornan looked and saw David and went forth from the threshing floor, and did obeisance to David with his face to the ground.";
rsv[22] = "And David said to Ornan, &quot;Give me the site of the threshing floor that I may build on it an altar to the LORD--give it to me at its full price--that the plague may be averted from the people.&quot;";
rsv[23] = "Then Ornan said to David, &quot;Take it; and let my lord the king do what seems good to him; see, I give the oxen for burnt offerings, and the threshing sledges for the wood, and the wheat for a cereal offering. I give it all.&quot;";
rsv[24] = "But King David said to Ornan, &quot;No, but I will buy it for the full price; I will not take for the LORD what is yours, nor offer burnt offerings which cost me nothing.&quot;";
rsv[25] = "So David paid Ornan six hundred shekels of gold by weight for the site.";
rsv[26] = "And David built there an altar to the LORD and presented burnt offerings and peace offerings, and called upon the LORD, and he answered him with fire from heaven upon the altar of burnt offering.";
rsv[27] = "Then the LORD commanded the angel; and he put his sword back into its sheath.";
rsv[28] = "At that time, when David saw that the LORD had answered him at the threshing floor of Ornan the Jeb\'usite, he made his sacrifices there.";
rsv[29] = "For the tabernacle of the LORD, which Moses had made in the wilderness, and the altar of burnt offering were at that time in the high place at Gibeon;";
rsv[30] = "but David could not go before it to inquire of God, for he was afraid of the sword of the angel of the LORD.";
vul[1] = "consurrexit autem Satan contra Israhel et incitavit David ut numeraret Israhel";
vul[2] = "dixitque David ad Ioab et ad principes populi ite et numerate Israhel a Bersabee usque Dan et adferte mihi numerum ut sciam";
vul[3] = "responditque Ioab augeat Dominus populum suum centuplum quam sunt nonne domine mi rex omnes servi tui sunt quare hoc quaerit dominus meus quod in peccatum reputetur Israheli";
vul[4] = "sed sermo regis magis praevaluit egressusque est Ioab et circuivit universum Israhel et reversus est Hierusalem";
vul[5] = "deditque David numerum eorum quos circumierat et inventus est omnis Israhel numerus mille milia et centum milia virorum educentium gladium de Iuda autem trecenta septuaginta milia bellatorum";
vul[6] = "nam Levi et Beniamin non numeravit eo quod invitus exsequeretur regis imperium";
vul[7] = "displicuit autem Deo quod iussum erat et percussit Israhel";
vul[8] = "dixitque David ad Deum peccavi nimis ut hoc facerem obsecro aufer iniquitatem servi tui quia insipienter egi";
vul[9] = "et locutus est Dominus ad Gad videntem David dicens";
vul[10] = "vade et loquere ad David et dic haec dicit Dominus trium tibi optionem do unum quod volueris elige et faciam tibi";
vul[11] = "cumque venisset Gad ad David dixit ei haec dicit Dominus elige quod volueris";
vul[12] = "aut tribus annis pestilentiam aut tribus mensibus fugere te hostes tuos et gladium eorum non posse evadere aut tribus diebus gladium Domini et mortem versari in terra et angelum Domini interficere in universis finibus Israhel nunc igitur vide quid respondeam ei qui misit me";
vul[13] = "et dixit David ad Gad ex omni parte me angustiae premunt sed melius mihi est ut incidam in manus Domini quia multae sunt miserationes eius quam in manus hominum";
vul[14] = "misit ergo Dominus pestilentiam in Israhel et ceciderunt de Israhel septuaginta milia virorum";
vul[15] = "misit quoque angelum in Hierusalem ut percuteret eam cumque percuteretur vidit Dominus et misertus est super magnitudinem mali et imperavit angelo qui percutiebat sufficit iam cesset manus tua porro angelus Domini stabat iuxta aream Ornan Iebusei";
vul[16] = "levansque David oculos suos vidit angelum Domini stantem inter terram et caelum et evaginatum gladium in manu eius et versum contra Hierusalem et ceciderunt tam ipse quam maiores natu vestiti ciliciis et proni in terram";
vul[17] = "dixitque David ad Deum nonne ego sum qui iussi ut numeraretur populus ego qui peccavi ego qui malum feci iste grex quid commeruit Domine Deus meus vertatur obsecro manus tua in me et in domum patris mei populus autem tuus non percutiatur";
vul[18] = "angelus autem Domini praecepit Gad ut diceret David et ascenderet extrueretque altare Domino Deo in area Ornan Iebusei";
vul[19] = "ascendit ergo David iuxta sermonem Gad quem locutus fuerat ex nomine Domini";
vul[20] = "porro Ornan cum suspexisset et vidisset angelum quattuorque filii eius cum eo absconderunt se nam eo tempore terebat in area triticum";
vul[21] = "igitur cum venisset David ad Ornan conspexit eum Ornan et processit ei obviam de area et adoravit illum pronus in terram";
vul[22] = "dixitque ei David da mihi locum areae tuae ut aedificem in ea altare Domini ita ut quantum valet argenti accipias et cesset plaga a populo";
vul[23] = "dixit autem Ornan ad David tolle et faciat dominus meus rex quodcumque ei placet sed et boves do in holocaustum et tribulas in ligna et triticum in sacrificium omnia libens praebeo";
vul[24] = "dixitque ei rex David nequaquam ita fiet sed argentum dabo quantum valet neque enim tibi auferre debeo et sic offerre Domino holocausta gratuita";
vul[25] = "dedit ergo David Ornan pro loco siclos auri iustissimi ponderis sescentos";
vul[26] = "et aedificavit ibi altare Domino obtulitque holocausta et pacifica et invocavit Dominum et exaudivit eum in igne de caelo super altare holocausti";
vul[27] = "praecepitque Dominus angelo et convertit gladium suum in vaginam";
vul[28] = "protinus ergo David videns quod exaudisset eum Dominus in area Ornan Iebusei immolavit ibi victimas";
vul[29] = "tabernaculum autem Domini quod fecerat Moses in deserto et altare holocaustorum ea tempestate erat in excelso Gabaon";
vul[30] = "et non praevaluit David ire ad altare ut ibi obsecraret Deum nimio enim fuerat timore perterritus videns gladium angeli Domini";
web[1] = "And Satan stood up against Israel, and incited David to number Israel.";
web[2] = "And David said to Joab and to the rulers of the people, Go, number Israel from Beer-sheba even to Dan; and bring the number of them to me, that I may know [it].";
web[3] = "And Joab answered, the LORD make his people a hundred times more numerous than they [are]: but, my lord the king, [are] they not all my lord\'s servants? why then doth my lord require this thing? why will he be a cause of trespass to Israel?";
web[4] = "Nevertheless the king\'s word prevailed against Joab. Wherefore Joab departed, and went throughout all Israel, and came to Jerusalem.";
web[5] = "And Joab gave the sum of the number of the people to David. And all [they of] Israel were a thousand thousand and a hundred thousand men that drew sword: and Judah [was] four hundred and seventy thousand men that drew sword.";
web[6] = "But Levi and Benjamin he counted not among them: for the king\'s word was abominable to Joab.";
web[7] = "And God was displeased with this thing, therefore he smote Israel.";
web[8] = "And David said to God, I have sinned greatly, because I have done this thing: but now, I beseech thee, do away the iniquity of thy servant; for I have done very foolishly.";
web[9] = "And the LORD spoke to Gad, David\'s seer, saying,";
web[10] = "Go and tell David, saying, Thus saith the LORD, I offer thee [three] things; choose thee one of them, that I may do [it] to thee.";
web[11] = "So Gad came to David, and said to him, Thus saith the LORD, Choose thee";
web[12] = "Either three years\' famine; or three months to be destroyed before thy foes, while the sword of thy enemies overtaketh [thee]; or else three days the sword of the LORD, even the pestilence, in the land, and the angel of the LORD destroying throughout all the borders of Israel. Now therefore advise thyself what word I shall bring again to him that sent me.";
web[13] = "And David said to Gad, I am in a great strait: let me fall now into the hand of the LORD; for very great [are] his mercies: but let me not fall into the hand of man.";
web[14] = "So the LORD sent pestilence upon Israel: and there fell of Israel seventy thousand men.";
web[15] = "And God sent an angel to Jerusalem to destroy it: and as he was destroying, the LORD beheld, and he repented of the evil, and said to the angel that destroyed, It is enough, stay now thy hand. And the angel of the LORD stood by the threshing-floor of Ornan the Jebusite.";
web[16] = "And David lifted up his eyes, and saw the angel of the LORD stand between the earth and the heaven, having a drawn sword in his hand stretched out over Jerusalem. Then David and the elders [of Israel], [who were] clothed in sackcloth, fell upon their faces.";
web[17] = "And David said to God, [Is it] not I [that] commanded the people to be numbered? even I it is that have sinned and done evil indeed; but [as for] these sheep, what have they done? let thy hand, I pray thee, O LORD my God, be on me, and on my father\'s house; but not on thy people, that they should be afflicted.";
web[18] = "Then the angel of the LORD commanded Gad to say to David, that David should go up, and erect an altar to the LORD in the threshing-floor of Ornan the Jebusite.";
web[19] = "And David went up at the saying of Gad, which he spoke in the name of the LORD.";
web[20] = "And Ornan turned back, and saw the angel; and his four sons with him hid themselves. Now Ornan was threshing wheat.";
web[21] = "And as David came to Ornan, Ornan looked, and saw David, and went out of the threshing-floor, and bowed himself to David with [his] face to the ground.";
web[22] = "Then David said to Ornan, Grant me the place of [this] threshing-floor, that I may build an altar in it to the LORD: thou shalt grant it to me for the full price: that the plague may be stayed from the people.";
web[23] = "And Ornan said to David, Take [it] to thee, and let my lord the king do [that which is] good in his eyes: lo, I give [thee] the oxen [also] for burnt-offerings, and the threshing instruments for wood, and the wheat for the meat-offering; I give it all.";
web[24] = "And king David said to Ornan, No; but I will verily buy it for the full price: for I will not take [that] which [is] thine for the LORD, nor offer burnt-offerings without cost.";
web[25] = "So David gave to Ornan for the place six hundred shekels of gold by weight.";
web[26] = "And David built there an altar to the LORD, and offered burnt-offerings and peace-offerings, and called upon the LORD; and he answered him from heaven by fire upon the altar of burnt-offering.";
web[27] = "And the LORD commanded the angel; and he put up his sword again into its sheath.";
web[28] = "At that time when David saw that the LORD had answered him in the threshing-floor of Ornan the Jebusite, then he sacrificed there.";
web[29] = "For the tabernacle of the LORD, which Moses made in the wilderness, and the altar of the burnt-offering, [were] at that season in the high place at Gibeon.";
web[30] = "But David could not go before it to inquire of God: for he was afraid because of the sword of the angel of the LORD.";
yng[1] = "And there standeth up an adversary against Israel, and persuadeth David to number Israel,";
yng[2] = "And David saith unto Joab, and unto the heads of the people, `Go, number Israel from Beer-Sheba even unto Dan, and bring unto me, and I know their number.\'";
yng[3] = "And Joab saith, `Jehovah doth add to His people as they are a hundred times; are they not, my lord, O king, all of them to my lord for servants? why doth my lord seek this? why is he for a cause of guilt to Israel?\'";
yng[4] = "And the word of the king [is] severe against Joab, and Joab goeth out, and goeth up and down in all Israel, and cometh in to Jerusalem.";
yng[5] = "And Joab giveth the account of the numbering of the people unto David, and all Israel is a thousand thousand and a hundred thousand, each drawing sword, and Judah [is] four hundred and seventy thousand, each drawing sword.";
yng[6] = "And Levi and Benjamin he hath not numbered in their midst, for the word of the king was abominable with Joab.";
yng[7] = "And it is evil in the eyes of God concerning this thing, and He smiteth Israel,";
yng[8] = "and David saith unto God, `I have sinned exceedingly, in that I have done this thing; and now, cause to pass away, I pray Thee, the iniquity of Thy servant, for I have acted very foolishly.\'";
yng[9] = "And Jehovah speaketh unto Gad, seer of David, saying:";
yng[10] = "`Go, and thou hast spoken unto David, saying, Thus said Jehovah, Three -- I am stretching out unto thee; choose for thee one of these, and I do [it] to thee.\'";
yng[11] = "And Gad cometh in unto David, and saith to him, `Thus said Jehovah, Take for thee --";
yng[12] = "either for three years -- famine, or three months to be consumed from the face of thine adversaries, even the sword of thine enemies to overtake, or three days the sword of Jehovah, even pestilence in the land, and a messenger of Jehovah destroying in all the border of Israel; and now, see; what word do I return to Him who is sending me?\'";
yng[13] = "And David saith unto Gad, `I am greatly distressed, let me fall, I pray thee, into the hand of Jehovah, for very many [are] His mercies, and into the hand of man let me not fall.\'";
yng[14] = "And Jehovah giveth a pestilence in Israel, and there fall of Israel seventy thousand men,";
yng[15] = "and God sendeth a messenger to Jerusalem to destroy it, and as he is destroying Jehovah hath seen, and is comforted concerning the evil, and saith to the messenger who [is] destroying, `Enough, now, cease thy hand.\' And the messenger of Jehovah is standing by the threshing-floor of Ornan the Jebusite,";
yng[16] = "and David lifteth up his eyes, and seeth the messenger of Jehovah standing between the earth and the heavens, and his sword drawn in his hand, stretched out over Jerusalem, and David falleth, and the elders, covered with sackcloth, on their faces.";
yng[17] = "And David saith unto God, `Did not I -- I say to number the people? Yea, I it [is] who have sinned, and done great evil: and these, the flock, what did they? O Jehovah, my God, let, I pray Thee, Thy hand be on me, and on the house of my father, and not on Thy people -- to be plagued.\'";
yng[18] = "And the messenger of Jehovah spake unto Gad, saying for David, `Surely David doth go up to raise an altar to Jehovah in the threshing-floor of Ornan the Jebusite.\'";
yng[19] = "And David goeth up by the word of Gad, that he spake in the name of Jehovah.";
yng[20] = "And Ornan turneth back, and seeth the messenger, and his four sons [are] with him, hiding themselves, and Ornan is threshing wheat.";
yng[21] = "And David cometh in unto Ornan, and Ornan looketh attentively, and seeth David, and goeth out from the threshing-floor, and boweth himself to David -- face to the earth.";
yng[22] = "And David saith unto Ornan, `Give to me the place of the threshing-floor, and I build in it an altar to Jehovah; for full silver give it to me, and the plague is restrained from the people.\'";
yng[23] = "And Ornan saith unto David, `Take to thee -- and my lord the king doth that which is good in his eyes: see, I have given the oxen for burnt-offerings, and the threshing instruments for wood, and the wheat for a present; the whole I have given.\'";
yng[24] = "And king David saith to Ornan, `Nay, for I surely buy for full silver; for I do not lift up that which is thine to Jehovah, so as to offer a burnt-offering without cost.\'";
yng[25] = "And David giveth to Ornan for the place shekels of gold [in] weight six hundred;";
yng[26] = "and David buildeth there an altar to Jehovah, and offereth burnt-offerings and peace-offerings, and calleth unto Jehovah, and He answereth him with fire from the heavens on the altar of the burnt-offering.";
yng[27] = "And Jehovah saith to the messenger, and he turneth back his sword unto its sheath.";
yng[28] = "At that time when David seeth that Jehovah hath answered him in the threshing-floor of Ornan the Jebusite, then he sacrificeth there;";
yng[29] = "and the tabernacle of Jehovah that Moses made in the wilderness, and the altar of the burnt-offering, [are] at that time in a high place, in Gibeon;";
yng[30] = "and David is not able to go before it to seek God, for he hath been afraid because of the sword of the messenger of Jehovah.";
csb[1] = "Satan rose up against Israel and incited David to count the people of Israel.";
csb[2] = "So David said to Joab and the commanders of the troops, &quot;Go and count Israel from Beer-sheba to Dan and bring a report to me so I can know their number.&quot;";
csb[3] = "Joab replied, &quot;May the LORD multiply the number of his people a hundred times over! My lord the king, aren\'t they all my lord\'s servants? Why does my lord want to do this? Why should he bring guilt on Israel? &quot;";
csb[4] = "Yet the king\'s order prevailed over Joab. So Joab left and traveled throughout Israel and then returned to Jerusalem.";
csb[5] = "Joab gave the total troop registration to David. In all Israel there were one million one hundred thousand armed men and in Judah itself four hundred seventy thousand armed men.";
csb[6] = "But he did not include Levi and Benjamin in the count because the king\'s command was detestable to him.";
csb[7] = "This command was also evil in God\'s sight, so he afflicted Israel.";
csb[8] = "David said to God, &quot;I have sinned greatly because I have done this thing. Now, please take away your servant\'s guilt, for I\'ve been very foolish.&quot;";
csb[9] = "Then the LORD instructed Gad, David\'s seer,";
csb[10] = "&quot;Go and say to David, \'This is what the LORD says: I am offering you three choices. Choose one of them for yourself, and I will do it to you.\' &quot;";
csb[11] = "So Gad went to David and said to him, &quot;This is what the LORD says: \'Take your choice:";
csb[12] = "&quot;three years of famine, or three months of devastation by your foes with the sword of your enemy overtaking you, or three days of the sword of the LORD -- a plague on the land, the angel of the LORD bringing destruction to the whole territory of Israel.\' Now decide what answer I should take back to the one who sent me.&quot;";
csb[13] = "David answered Gad, &quot;I\'m in anguish. Please, let me fall into the LORD\'s hands because his mercies are very great, but don\'t let me fall into human hands.&quot;";
csb[14] = "So the LORD sent a plague on Israel, and seventy thousand Israelite men died.";
csb[15] = "Then God sent an angel to Jerusalem to destroy it, but when the angel was about to destroy the city, the LORD looked, relented concerning the destruction, and said to the angel who was destroying the people, &quot;Enough, withdraw your hand now! &quot; The angel of the LORD was then standing at the threshing floor of Ornan the Jebusite.";
csb[16] = "When David looked up and saw the angel of the LORD standing between earth and heaven, with his drawn sword in his hand stretched out over Jerusalem, David and the elders, clothed in sackcloth, fell facedown.";
csb[17] = "David said to God, &quot;Wasn\'t I the one who gave the order to count the people? I am the one who has sinned and acted very wickedly. But these sheep, what have they done? LORD my God, please let your hand be against me and against my father\'s family, but don\'t let the plague be against your people.&quot;";
csb[18] = "So the angel of the LORD ordered Gad to tell David to go and set up an altar to the LORD on the threshing floor of Ornan the Jebusite.";
csb[19] = "David went up at Gad\'s command spoken in the name of the LORD.";
csb[20] = "Ornan was threshing wheat when he turned and saw the angel. His four sons, who were with him, hid.";
csb[21] = "David came to Ornan, and when Ornan looked and saw David, he left the threshing floor and bowed to David with his face to the ground.";
csb[22] = "Then David said to Ornan, &quot;Give me this threshing-floor plot so that I may build an altar to the LORD on it. Give it to me for the full price, so the plague on the people may be stopped.&quot;";
csb[23] = "Ornan said to David, &quot;Take it! My lord the king may do whatever he wants. See, I give the oxen for the burnt offerings, the threshing sledges for the wood, and the wheat for the grain offering -- I give it all.&quot;";
csb[24] = "King David answered Ornan, &quot;No, I insist on paying the full price, for I will not take for the LORD what belongs to you or offer burnt offerings that cost me nothing.&quot;";
csb[25] = "So David gave Ornan fifteen pounds of gold for the plot.";
csb[26] = "He built an altar to the LORD there and offered burnt offerings and fellowship offerings. He called on the LORD, and he answered him with fire from heaven on the altar of burnt offering.";
csb[27] = "Then the LORD spoke to the angel, and he put his sword back into its sheath.";
csb[28] = "At that time, David offered sacrifices there when he saw that the LORD answered him at the threshing floor of Ornan the Jebusite.";
csb[29] = "The tabernacle of the LORD, which Moses made in the wilderness, and the altar of burnt offering were at the high place in Gibeon,";
csb[30] = "but David could not go before it to inquire of God, because he was terrified of the sword of the LORD\'s angel.";
</script>
