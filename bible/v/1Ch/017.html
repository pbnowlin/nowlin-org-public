asv[1] = "And it came to pass, when David dwelt in his house, that David said to Nathan the prophet, Lo, I dwell in a house of cedar, but the ark of the covenant of Jehovah [dwelleth] under curtains.";
asv[2] = "And Nathan said unto David, Do all that is in thy heart; for God is with thee.";
asv[3] = "And it came to pass the same night, that the word of God came to Nathan, saying,";
asv[4] = "Go and tell David my servant, Thus saith Jehovah, Thou shalt not build me a house to dwell in:";
asv[5] = "for I have not dwelt in a house since the day that I brought up Israel, unto this day, but have gone from tent to tent, and from [one] tabernacle [to another].";
asv[6] = "In all places wherein I have walked with all Israel, spake I a word with any of the judges of Israel, whom I commanded to be shepherd of my people, saying, Why have ye not built me a house of cedar?";
asv[7] = "Now therefore thus shalt thou say unto my servant David, Thus saith Jehovah of hosts, I took thee from the sheepcote, from following the sheep, that thou shouldest be prince over my people Israel:";
asv[8] = "and I have been with thee whithersoever thou hast gone, and have cut off all thine enemies from before thee; and I will make thee a name, like unto the name of the great ones that are in the earth.";
asv[9] = "And I will appoint a place for my people Israel, and will plant them, that they may dwell in their own place, and be moved no more; neither shall the children of wickedness waste them any more, as at the first,";
asv[10] = "and [as] from the day that I commanded judges to be over my people Israel; and I will subdue all thine enemies. Moreover I tell thee that Jehovah will build thee a house.";
asv[11] = "And it shall come to pass, when thy days are fulfilled that thou must go to be with thy fathers, that I will set up thy seed after thee, who shall be of thy sons; and I will establish his kingdom.";
asv[12] = "He shall build me a house, and I will establish his throne for ever.";
asv[13] = "I will be his father, and he shall be my son: and I will not take my lovingkindness away from him, as I took it from him that was before thee;";
asv[14] = "but I will settle him in my house and in my kingdom for ever; and his throne shall be established for ever.";
asv[15] = "According to all these words, and according to all this vision, so did Nathan speak unto David.";
asv[16] = "Then David the king went in, and sat before Jehovah; and he said, Who am I, O Jehovah God, and what is my house, that thou hast brought me thus far?";
asv[17] = "And this was a small thing in thine eyes, O God; but thou hast spoken of thy servant\'s house for a great while to come, and hast regarded me according to the estate of a man of high degree, O Jehovah God.";
asv[18] = "What can David [say] yet more unto thee concerning the honor which is done to thy servant? for thou knowest thy servant.";
asv[19] = "O Jehovah, for thy servant\'s sake, and according to thine own heart, hast thou wrought all this greatness, to make known all [these] great things.";
asv[20] = "O Jehovah, there is none like thee, neither is there any God besides thee, according to all that we have heard with our ears.";
asv[21] = "And what one nation in the earth is like thy people Israel, whom God went to redeem unto himself for a people, to make thee a name by great and terrible things, in driving out nations from before thy people, whom thou redeemest out of Egypt?";
asv[22] = "For thy people Israel didst thou make thine own people for ever; and thou, Jehovah, becamest their God.";
asv[23] = "And now, O Jehovah, let the word that thou hast spoken concerning thy servant, and concerning his house, be established for ever, and do as thou hast spoken.";
asv[24] = "And let thy name be established and magnified for ever, saying, Jehovah of hosts is the God of Israel, even a God to Israel: and the house of David thy servant is established before thee.";
asv[25] = "For thou, O my God, hast revealed to thy servant that thou wilt build him a house: therefore hath thy servant found [in his heart] to pray before thee.";
asv[26] = "And now, O Jehovah, thou art God, and hast promised this good thing unto thy servant:";
asv[27] = "and now it hath pleased thee to bless the house of thy servant, that it may continue for ever before thee: for thou, O Jehovah, hast blessed, and it is blessed for ever.";

hnv[1] = "It happened, when David lived in his house, that David said to Natan the prophet, Behold, I dwell in a house of cedar, but the ark of the covenant of the LORD [dwells] under curtains.";
hnv[2] = "Natan said to David, Do all that is in your heart; for God is with you.";
hnv[3] = "It happened the same night, that the word of God came to Natan, saying,";
hnv[4] = "Go and tell David my servant, Thus says the LORD, You shall not build me a house to dwell in:";
hnv[5] = "for I have not lived in a house since the day that I brought up Yisra\'el, to this day, but have gone from tent to tent, and from [one] tent [to another].";
hnv[6] = "In all places in which I have walked with all Yisra\'el, spoke I a word with any of the judges of Yisra\'el, whom I commanded to be shepherd of my people, saying, Why have you not built me a house of cedar?";
hnv[7] = "Now therefore thus shall you tell my servant David, Thus says the LORD of Hosts, I took you from the sheep pen, from following the sheep, that you should be prince over my people Yisra\'el:";
hnv[8] = "and I have been with you wherever you have gone, and have cut off all your enemies from before you; and I will make you a name, like the name of the great ones who are in the eretz.";
hnv[9] = "I will appoint a place for my people Yisra\'el, and will plant them, that they may dwell in their own place, and be moved no more; neither shall the children of wickedness waste them any more, as at the first,";
hnv[10] = "and [as] from the day that I commanded judges to be over my people Yisra\'el; and I will subdue all your enemies. Moreover I tell you that the LORD will build you a house.";
hnv[11] = "It shall happen, when your days are fulfilled that you must go to be with your fathers, that I will set up your seed after you, who shall be of your sons; and I will establish his kingdom.";
hnv[12] = "He shall build me a house, and I will establish his throne forever.";
hnv[13] = "I will be his father, and he shall be my son: and I will not take my lovingkindness away from him, as I took it from him that was before you;";
hnv[14] = "but I will settle him in my house and in my kingdom forever; and his throne shall be established forever.";
hnv[15] = "According to all these words, and according to all this vision, so did Natan speak to David.";
hnv[16] = "Then David the king went in, and sat before the LORD; and he said, Who am I, LORD God, and what is my house, that you have brought me thus far?";
hnv[17] = "This was a small thing in your eyes, God; but you have spoken of your servant\'s house for a great while to come, and have regarded me according to the estate of a man of high degree, LORD God.";
hnv[18] = "What can David [say] yet more to you concerning the honor which is done to your servant? for you know your servant.";
hnv[19] = "LORD, for your servant\'s sake, and according to your own heart, have you worked all this greatness, to make known all [these] great things.";
hnv[20] = "LORD, there is none like you, neither is there any God besides you, according to all that we have heard with our ears.";
hnv[21] = "What one nation in the eretz is like your people Yisra\'el, whom God went to redeem to himself for a people, to make you a name by great and awesome things, in driving out nations from before your people, whom you redeem out of Mitzrayim?";
hnv[22] = "For your people Yisra\'el did you make your own people forever; and you, LORD, became their God.";
hnv[23] = "Now, LORD, let the word that you have spoken concerning your servant, and concerning his house, be established forever, and do as you have spoken.";
hnv[24] = "Let your name be established and magnified forever, saying, the LORD of Hosts is the God of Yisra\'el, even a God to Yisra\'el: and the house of David your servant is established before you.";
hnv[25] = "For you, my God, have revealed to your servant that you will build him a house: therefore has your servant found [in his heart] to pray before you.";
hnv[26] = "Now, LORD, you are God, and have promised this good thing to your servant:";
hnv[27] = "and now it has pleased you to bless the house of your servant, that it may continue forever before you: for you, LORD, have blessed, and it is blessed forever.";

rsv[1] = "Now when David dwelt in his house, David said to Nathan the prophet, &quot;Behold, I dwell in a house of cedar, but the ark of the covenant of the LORD is under a tent.&quot;";
rsv[2] = "And Nathan said to David, &quot;Do all that is in your heart, for God is with you.&quot;";
rsv[3] = "But that same night the word of the LORD came to Nathan,";
rsv[4] = "&quot;Go and tell my servant David, \'Thus says the LORD: You shall not build me a house to dwell in.";
rsv[5] = "For I have not dwelt in a house since the day I led up Israel to this day, but I have gone from tent to tent and from dwelling to dwelling.";
rsv[6] = "In all places where I have moved with all Israel, did I speak a word with any of the judges of Israel, whom I commanded to shepherd my people, saying, &quot;Why have you not built me a house of cedar?&quot;\'";
rsv[7] = "Now therefore thus shall you say to my servant David, \'Thus says the LORD of hosts, I took you from the pasture, from following the sheep, that you should be prince over my people Israel;";
rsv[8] = "and I have been with you wherever you went, and have cut off all your enemies from before you; and I will make for you a name, like the name of the great ones of the earth.";
rsv[9] = "And I will appoint a place for my people Israel, and will plant them, that they may dwell in their own place, and be disturbed no more; and violent men shall waste them no more, as formerly,";
rsv[10] = "from the time that I appointed judges over my people Israel; and I will subdue all your enemies. Moreover I declare to you that the LORD will build you a house.";
rsv[11] = "When your days are fulfilled to go to be with your fathers, I will raise up your offspring after you, one of your own sons, and I will establish his kingdom.";
rsv[12] = "He shall build a house for me, and I will establish his throne for ever.";
rsv[13] = "I will be his father, and he shall be my son; I will not take my steadfast love from him, as I took it from him who was before you,";
rsv[14] = "but I will confirm him in my house and in my kingdom for ever and his throne shall be established for ever.\'&quot;";
rsv[15] = "In accordance with all these words, and in accordance with all this vision, Nathan spoke to David.";
rsv[16] = "Then King David went in and sat before the LORD, and said, &quot;Who am I, O LORD God, and what is my house, that thou hast brought me thus far?";
rsv[17] = "And this was a small thing in thy eyes, O God; thou hast also spoken of thy servant\'s house for a great while to come, and hast shown me future generations, O LORD God!";
rsv[18] = "And what more can David say to thee for honoring thy servant? For thou knowest thy servant.";
rsv[19] = "For thy servant\'s sake, O LORD, and according to thy own heart, thou hast wrought all this greatness, in making known all these great things.";
rsv[20] = "There is none like thee, O LORD, and there is no God besides thee, according to all that we have heard with our ears.";
rsv[21] = "What other nation on earth is like thy people Israel, whom God went to redeem to be his people, making for thyself a name for great and terrible things, in driving out nations before thy people whom thou didst redeem from Egypt?";
rsv[22] = "And thou didst make thy people Israel to be thy people for ever; and thou, O LORD, didst become their God.";
rsv[23] = "And now, O LORD, let the word which thou hast spoken concerning thy servant and concerning his house be established for ever, and do as thou hast spoken;";
rsv[24] = "and thy name will be established and magnified for ever, saying, \'The LORD of hosts, the God of Israel, is Israel\'s God,\' and the house of thy servant David will be established before thee.";
rsv[25] = "For thou, my God, hast revealed to thy servant that thou wilt build a house for him; therefore thy servant has found courage to pray before thee.";
rsv[26] = "And now, O LORD, thou art God, and thou hast promised this good thing to thy servant;";
rsv[27] = "now therefore may it please thee to bless the house of thy servant, that it may continue for ever before thee; for what thou, O LORD, hast blessed is blessed for ever.&quot;";
vul[1] = "cum autem habitaret David in domo sua dixit ad Nathan prophetam ecce ego habito in domo cedrina arca autem foederis Domini sub pellibus est";
vul[2] = "et ait Nathan ad David omnia quae in corde tuo sunt fac Deus enim tecum est";
vul[3] = "igitur nocte illa factus est sermo Dei ad Nathan dicens";
vul[4] = "vade et loquere David servo meo haec dicit Dominus non aedificabis tu mihi domum ad habitandum";
vul[5] = "neque enim mansi in domo ex eo tempore quo eduxi Israhel usque ad hanc diem sed fui semper mutans loca tabernaculi et in tentorio";
vul[6] = "manens cum omni Israhel numquid locutus sum saltim uni iudicum Israhel quibus praeceperam ut pascerent populum meum et dixi quare non aedificastis mihi domum cedrinam";
vul[7] = "nunc itaque sic loqueris ad servum meum David haec dicit Dominus exercituum ego tuli te cum in pascuis sequereris gregem ut esses dux populi mei Israhel";
vul[8] = "et fui tecum quocumque perrexisti et interfeci omnes inimicos tuos coram te fecique tibi nomen quasi unius magnorum qui celebrantur in terra";
vul[9] = "et dedi locum populo meo Israhel plantabitur et habitabit in eo et ultra non commovebitur nec filii iniquitatis adterent eos sicut a principio";
vul[10] = "ex diebus quibus dedi iudices populo meo Israhel et humiliavi universos inimicos tuos adnuntio ergo tibi quod aedificaturus sit domum tibi Dominus";
vul[11] = "cumque impleveris dies tuos ut vadas ad patres tuos suscitabo semen tuum post te quod erit de filiis tuis et stabiliam regnum eius";
vul[12] = "ipse aedificabit mihi domum et firmabo solium eius usque in aeternum";
vul[13] = "ego ero ei in patrem et ipse erit mihi in filium et misericordiam meam non auferam ab eo sicut abstuli ab eo qui ante te fuit";
vul[14] = "et statuam eum in domo mea et in regno meo usque in sempiternum et thronus eius erit firmissimus in perpetuum";
vul[15] = "iuxta omnia verba haec et iuxta universam visionem istam sic locutus est Nathan ad David";
vul[16] = "cumque venisset rex David et sedisset coram Domino dixit quis ego sum Domine Deus et quae domus mea ut praestares mihi talia";
vul[17] = "sed et hoc parum visum est in conspectu tuo ideoque locutus es super domum servi tui etiam in futurum et fecisti me spectabilem super omnes homines Domine Deus meus";
vul[18] = "quid ultra addere potest David cum ita glorificaveris servum tuum et cognoveris eum";
vul[19] = "Domine propter famulum tuum iuxta cor tuum fecisti omnem magnificentiam hanc et nota esse voluisti universa magnalia";
vul[20] = "Domine non est similis tui et non est alius deus absque te ex omnibus quos audivimus auribus nostris";
vul[21] = "quis autem est alius ut populus tuus Israhel gens una in terra ad quam perrexit Deus ut liberaret et faceret populum sibi et magnitudine sua atque terroribus eiceret nationes a facie eius quem de Aegypto liberarat";
vul[22] = "et posuisti populum tuum Israhel tibi in populum usque in aeternum et tu Domine factus es Deus eius";
vul[23] = "nunc igitur Domine sermo quem locutus es famulo tuo et super domum eius confirmetur in perpetuum et fac sicut locutus es";
vul[24] = "permaneatque et magnificetur nomen tuum usque in sempiternum et dicatur Dominus exercituum Deus Israhel et domus David servi eius permanens coram eo";
vul[25] = "tu enim Domine Deus meus revelasti auriculam servi tui ut aedificares ei domum et idcirco invenit servus tuus fiduciam ut oret coram te";
vul[26] = "nunc ergo Domine tu es Deus et locutus es ad servum tuum tanta beneficia";
vul[27] = "et coepisti benedicere domui servi tui ut sit semper coram te te enim Domine benedicente benedicta erit in perpetuum";

web[11] = "And it shall come to pass, when thy days shall be ended that thou must go [to be] with thy fathers, that I will raise up thy seed after thee, who shall be of thy sons; and I will establish his kingdom.";
web[12] = "He shall build me a house, and I will establish his throne for ever.";
web[13] = "I will be his father, and he shall be my son: and I will not take my mercy away from him, as I took [it] from [him] that was before thee:";
web[14] = "But I will settle him in my house and in my kingdom for ever: and his throne shall be established for evermore.";
web[15] = "According to all these words, and according to all this vision, so did Nathan speak to David.";
web[16] = "And David the king came and sat before the LORD, and said, Who [am] I, O LORD God, and what [is] my house, that thou hast brought me hitherto?";
web[17] = "And [yet] this was a small thing in thy eyes, O God; for thou hast [also] spoken of thy servant\'s house for a great while to come, and hast regarded me according to the estate of a man of high degree, O LORD God.";
web[18] = "What can David [speak] more to thee for the honor of thy servant? for thou knowest thy servant.";
web[19] = "O LORD, for thy servant\'s sake, and according to thy own heart, hast thou done all this greatness, in making known all [these] great things.";
web[20] = "O LORD, [there] is none like thee, neither [is there any] God besides thee, according to all that we have heard with our ears.";
web[21] = "And what one nation in the earth [is] like thy people Israel, whom God went to redeem [to be] his own people, to make thee a name of greatness and terribleness, by driving out nations from before thy people, whom thou hast redeemed out of Egypt?";
web[22] = "For thy people Israel didst thou make thy own people for ever; and thou, LORD, becamest their God.";
web[23] = "Therefore now, LORD, Let the thing that thou hast spoken concerning thy servant and concerning his house be established for ever, and do as thou hast said.";
web[24] = "Let it even be established, that thy name may be magnified for ever, saying, The LORD of hosts [is] the God of Israel, [even] a God to Israel: and [let] the house of David thy servant [be] established before thee.";
web[25] = "For thou, O my God, hast told thy servant that thou wilt build him a house: therefore thy servant hath found [in his heart] to pray before thee.";
web[26] = "And now, LORD, thou art God, and hast promised this goodness to thy servant:";
web[27] = "Now therefore let it please thee to bless the house of thy servant, that it may be before thee for ever: for thou blessest, O LORD, and [it shall be] blessed for ever.";
yng[1] = "And it cometh to pass as David sat in his house, that David saith unto Nathan the prophet, `Lo, I am dwelling in a house of cedars, and the ark of the covenant of Jehovah [is] under curtains;\'";
yng[2] = "and Nathan saith unto David, `All that [is] in thy heart do, for God [is] with thee.\'";
yng[3] = "And it cometh to pass on that night that a word of God is unto Nathan, saying,";
yng[4] = "`Go, and thou hast said unto David My servant, Thus said Jehovah, Thou dost not build for Me the house to dwell in:";
yng[5] = "for I have not dwelt in a house from the day that I brought up Israel till this day, and I am from tent unto tent: and from the tabernacle,";
yng[6] = "whithersoever I have walked up and down among all Israel, a word spake I, with one of the judges of Israel, whom I commanded to feed My people, saying, Why have ye not built for Me a house of cedars?";
yng[7] = "`And now, thus dost thou say to My servant, to David, Thus said Jehovah of Hosts, I have taken thee from the habitation, from after the sheep, to be leader over My people Israel,";
yng[8] = "and I am with thee whithersoever thou hast walked, and I cut off all thine enemies from thy presence, and have made for thee a name like the name of the great ones who [are] in the earth.";
yng[9] = "`And I have prepared a place for My people Israel, and planted it, and it hath dwelt in its place, and is not troubled any more, and the sons of perverseness add not to wear it out as at first,";
yng[10] = "yea, even from the days that I appointed judges over My people Israel. `And I have humbled all thine enemies, and I declare to thee that a house doth Jehovah build for thee,";
yng[11] = "and it hath come to pass, when thy days have been fulfilled to go with thy fathers, that I have raised up thy seed after thee, who is of thy sons, and I have established his kingdom,";
yng[12] = "he doth build for Me a house, and I have established his throne unto the age;";
yng[13] = "I am to him for a father, and he is to Me for a son, and My kindness I turn not aside from him as I turned it aside from him who was before thee,";
yng[14] = "and I have established him in My house, and in My kingdom unto the age, and his throne is established unto the age.\'";
yng[15] = "According to all these words, and according to all this vision, so spake Nathan unto David.";
yng[16] = "And David the king cometh in and sitteth before Jehovah, and saith, `Who [am] I, O Jehovah God, and what my house, that Thou hast brought me hitherto?";
yng[17] = "And this is small in Thine eyes, O God, and Thou speakest concerning the house of thy servant afar off, and hast seen me as a type of the man who is on high, O Jehovah God!";
yng[18] = "`What doth David add more unto Thee for the honour of Thy servant; and Thou Thy servant hast known.";
yng[19] = "O Jehovah, for Thy servant\'s sake, and according to Thine own heart Thou hast done all this greatness, to make known all these great things.";
yng[20] = "O Jehovah, there is none like Thee, and there is no god save Thee, according to all that we have heard with our ears.";
yng[21] = "`And who [is] as Thy people Israel, one nation in the earth whom God hath gone to ransom to Him for a people, to make for Thee a name great and fearful, to cast out from the presence of Thy people whom Thou hast ransomed out of Egypt -- nations?";
yng[22] = "Yea, Thou dost appoint Thy people Israel to Thee for a people unto the age, and Thou, O Jehovah, hast been to them for God.";
yng[23] = "`And now, O Jehovah, the word that Thou hast spoken concerning Thy servant, and concerning his house, let be stedfast unto the age, and do as Thou hast spoken;";
yng[24] = "and let it be stedfast, and Thy name is great unto the age, saying, Jehovah of Hosts, God of Israel, is God to Israel, and the house of Thy servant David is established before Thee;";
yng[25] = "for Thou, O my God, Thou hast uncovered the ear of Thy servant -- to build to him a house, therefore hath Thy servant found to pray before Thee.";
yng[26] = "`And now, Jehovah, Thou [art] God Himself, and Thou speakest concerning Thy servant this goodness;";
yng[27] = "and now, Thou hast been pleased to bless the house of Thy servant, to be to the age before Thee; for Thou, O Jehovah, hast blessed, and it is blessed to the age.\'";
csb[1] = "When David had settled into his palace, he said to the prophet Nathan, &quot;Look! I am living in a cedar house while the ark of the LORD\'s covenant is under tent curtains.&quot;";
csb[2] = "So Nathan told David, &quot;Do all that is on your mind, for God is with you.&quot;";
csb[3] = "But that night the word of God came to Nathan:";
csb[4] = "&quot;Go to David my servant and say, \'This is what the LORD says: You are not the one to build me a house to dwell in.";
csb[5] = "&quot;From the time I brought Israel out of Egypt until today I have not dwelt in a house; instead, I have moved from one tent site to another, and from one tabernacle location to another.";
csb[6] = "&quot;In all my journeys throughout Israel, have I ever spoken a word to even one of the judges of Israel, whom I commanded to shepherd my people, asking: Why haven\'t you built me a house of cedar? \'";
csb[7] = "&quot;So now this is what you are to say to my servant David: \'This is what the LORD of Armies says: I took you from the pasture, from tending the flock, to be ruler over my people Israel.";
csb[8] = "&quot;I have been with you wherever you have gone, and I have destroyed all your enemies before you. I will make a name for you like that of the greatest on the earth.";
csb[9] = "&quot;I will designate a place for my people Israel and plant them, so that they may live there and not be disturbed again. Evildoers will not continue to oppress them as they have done";
csb[10] = "&quot;ever since the day I ordered judges to be over my people Israel. I will also subdue all your enemies. &quot; \'Furthermore, I declare to you that the LORD himself will build a house for you.";
csb[11] = "&quot;When your time comes to be with your fathers, I will raise up after you your descendant, who is one of your own sons, and I will establish his kingdom.";
csb[12] = "&quot;He is the one who will build a house for me, and I will establish his throne forever.";
csb[13] = "&quot;I will be his father, and he will be my son. I will not remove my faithful love from him as I removed it from the one who was before you.";
csb[14] = "&quot;I will appoint him over my house and my kingdom forever, and his throne will be established forever.\' &quot;";
csb[15] = "Nathan reported all these words and this entire vision to David.";
csb[16] = "Then King David went in, sat in the LORD\'s presence, and said, Who am I, LORD God, and what is my house that you have brought me this far?";
csb[17] = "This was a little thing to you, God, for you have spoken about your servant\'s house in the distant future. You regard me as a man of distinction, LORD God.";
csb[18] = "What more can David say to you for honoring your servant? You know your servant.";
csb[19] = "LORD, you have done this whole great thing, making known all these great promises for the sake of your servant and according to your will.";
csb[20] = "LORD, there is no one like you, and there is no God besides you, as all we have heard confirms.";
csb[21] = "And who is like your people Israel? God, you came to one nation on earth to redeem a people for yourself, to make a name for yourself through great and awesome works by driving out nations before your people you redeemed from Egypt.";
csb[22] = "You made your people Israel your own people forever, and you, LORD, have become their God.";
csb[23] = "Now, LORD, let the word that you have spoken concerning your servant and his house be confirmed forever, and do as you have promised.";
csb[24] = "Let your name be confirmed and magnified forever in the saying, &quot;The LORD of Armies, the God of Israel, is God over Israel.&quot; May the house of your servant David be established before you.";
csb[25] = "Since you, my God, have revealed to your servant that you will build him a house, your servant has found courage to pray in your presence.";
csb[26] = "LORD, you indeed are God, and you have promised this good thing to your servant.";
csb[27] = "So now, you have been pleased to bless your servant\'s house that it may continue before you forever. For you, LORD, have blessed it, and it is blessed forever.";
</script>
