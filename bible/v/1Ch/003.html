hnv[1] = "Now these were the sons of David, who were born to him in Hevron: the firstborn, Amnon, of Achino\'am the Yizre`elite; the second, Daniyel, of Avigayil the Karmelite;";
hnv[2] = "the third, Avshalom the son of Ma`akhah the daughter of Talmai king of Geshur; the fourth, Adoniyahu the son of Haggit;";
hnv[3] = "the fifth, Shefatyah of Avital; the sixth, Yitre`am by `Eglah his wife:";
hnv[4] = "six were born to him in Hevron; and there he reigned seven years and six months. In Yerushalayim he reigned thirty-three years;";
hnv[5] = "and these were born to him in Yerushalayim: Shim`a, and Shovav, and Natan, and Shlomo, four, of Bat-Shua the daughter of `Ammi\'el;";
hnv[6] = "and Yivchar, and Elishama, and Elifelet,";
hnv[7] = "and Nogah, and Nefeg, and Yafia,";
hnv[8] = " and Elishama, and Elyada, and Elifelet, nine.";
hnv[9] = "All these were the sons of David, besides the sons of the concubines; and Tamar was their sister.";
hnv[10] = "Shlomo\'s son was Rechav`am, Aviyah his son, Asa his son, Yehoshafat his son,";
hnv[11] = "Yoram his son, Achazyah his son, Yo\'ash his son,";
hnv[12] = "Amatzyah his son, `Azaryah his son, Yotam his son,";
hnv[13] = " Achaz his son, Hizkiyahu his son, Menashsheh his son,";
hnv[14] = "Amon his son, Yoshiyahu his son.";
hnv[15] = "The sons of Yoshiyahu: the firstborn Yochanan, the second Yehoiakim, the third Tzidkiyahu, the fourth Shallum.";
hnv[16] = "The sons of Yehoiakim: Yekhonyah his son, Tzidkiyahu his son.";
hnv[17] = "The sons of Yekhonyah, the captive: She\'alti\'el his son,";
hnv[18] = "and Malkiram, and Pedayahu, and Shenazzar, Yekamyah, Hoshama, and Nedavyah.";
hnv[19] = "The sons of Pedayahu: Zerubbavel, and Shim`i. The sons of Zerubbavel: Meshullam, and Hananyah; and Shelomit was their sister;";
hnv[20] = "and Hashuvah, and Ohel, and Berekhyah, and Hasadyah, Yushav-Hesed, five.";
hnv[21] = "The sons of Hananyah: Pelatyah, and Yesha`yah; the sons of Refayah, the sons of Arnan, the sons of `Ovadyah, the sons of Shekhanyahu.";

rsv[1] = "These are the sons of David that were born to him in Hebron: the first-born Amnon, by Ahin\'o-am the Jezreelitess; the second Daniel, by Ab\'igail the Car\'melitess,";
rsv[2] = "the third Ab\'salom, whose mother was Ma\'acah, the daughter of Talmai, king of Geshur; the fourth Adoni\'jah, whose mother was Haggith;";
rsv[3] = "the fifth Shephati\'ah, by Abi\'tal; the sixth Ith\'ream, by his wife Eglah;";
rsv[4] = "six were born to him in Hebron, where he reigned for seven years and six months. And he reigned thirty-three years in Jerusalem.";
rsv[5] = "These were born to him in Jerusalem: Shim\'e-a, Shobab, Nathan and Solomon, four by Bath-shu\'a, the daughter of Am\'mi-el;";
rsv[6] = "then Ibhar, Eli\'shama, Eliph\'elet,";
rsv[7] = "Nogah, Nepheg, Japhi\'a,";
rsv[8] = "Eli\'shama, Eli\'ada, and Eliph\'elet, nine.";
rsv[9] = "All these were David\'s sons, besides the sons of the concubines; and Tamar was their sister.";
rsv[10] = "The descendants of Solomon: Rehobo\'am, Abi\'jah his son, Asa his son, Jehosh\'aphat his son,";
rsv[11] = "Joram his son, Ahazi\'ah his son, Jo\'ash his son,";
rsv[12] = "Amazi\'ah his son, Azari\'ah his son, Jotham his son,";
rsv[13] = "Ahaz his son, Hezeki\'ah his son, Manas\'seh his son,";
rsv[14] = "Amon his son, Josi\'ah his son.";
rsv[15] = "The sons of Josi\'ah: Joha\'nan the first-born, the second Jehoi\'akim, the third Zedeki\'ah, the fourth Shallum.";
rsv[16] = "The descendants of Jehoi\'akim: Jeconi\'ah his son, Zedeki\'ah his son;";
rsv[17] = "and the sons of Jeconi\'ah, the captive: Sheal\'tiel his son,";
rsv[18] = "Malchi\'ram, Pedai\'ah, Shenaz\'zar, Jekami\'ah, Hosh\'ama, and Nedabi\'ah;";
rsv[19] = "and the sons of Pedai\'ah: Zerub\'babel and Shim\'e-i; and the sons of Zerub\'babel: Meshul\'lam and Hanani\'ah, and Shelo\'mith was their sister;";
rsv[20] = "and Hashu\'bah, Ohel, Berechi\'ah, Hasadi\'ah, and Ju\'shab-he\'sed, five.";
rsv[21] = "The sons of Hanani\'ah: Pelati\'ah and Jeshai\'ah, his son Rephai\'ah, his son Arnan, his son Obadi\'ah, his son Shecani\'ah.";
rsv[22] = "The sons of Shecani\'ah: Shemai\'ah. And the sons of Shemai\'ah: Hattush, Igal, Bari\'ah, Neari\'ah, and Shaphat, six.";
rsv[23] = "The sons of Neari\'ah: Eli-o-e\'nai, Hizki\'ah, and Azri\'kam, three.";
rsv[24] = "The sons of Eli-o-e\'nai: Hod\'avi\'ah, Eli\'ashib, Pelai\'ah, Akkub, Joha\'nan, Delai\'ah, and Ana\'ni, seven.";
vul[1] = "David vero hos habuit filios qui ei nati sunt in Hebron primogenitum Amnon ex Achinaam Iezrahelitide secundum Danihel de Abigail Carmelitide";
vul[2] = "tertium Absalom filium Maacha filiae Tholmei regis Gessur quartum Adoniam filium Aggith";
vul[3] = "quintum Saphatiam ex Abital sextum Iethraam de Egla uxore sua";
vul[4] = "sex ergo nati sunt ei in Hebron ubi regnavit septem annis et sex mensibus triginta autem et tribus annis regnavit in Hierusalem";
vul[5] = "porro in Hierusalem nati sunt ei filii Samaa et Sobab et Nathan et Salomon quattuor de Bethsabee filia Amihel";
vul[6] = "Iebaar quoque et Elisama";
vul[7] = "et Eliphalet et Noge et Napheg et Iaphie";
vul[8] = "necnon Elisama et Heliade et Eliphalet novem";
vul[9] = "omnes hii filii David absque filiis concubinarum habuerunt sororem Thamar";
vul[10] = "filius autem Salomonis Roboam cuius Abia filius genuit Asa de hoc quoque natus est Iosaphat";
vul[11] = "pater Ioram qui Ioram genuit Ohoziam ex quo ortus est Ioas";
vul[12] = "et huius Amasias filius genuit Azariam porro Azariae filius Ioatham";
vul[13] = "procreavit Achaz patrem Ezechiae de quo natus est Manasses";
vul[14] = "sed et Manasses genuit Amon patrem Iosiae";
vul[15] = "filii autem Iosiae fuerunt primogenitus Iohanan secundus Ioacim tertius Sedecias quartus Sellum";
vul[16] = "de Ioacim natus est Iechonias et Sedecias";
vul[17] = "filii Iechoniae fuerunt Asir Salathihel";
vul[18] = "Melchiram Phadaia Sennaser et Iecemia Sama et Nadabia";
vul[19] = "de Phadaia orti sunt Zorobabel et Semei Zorobabel genuit Mosollam Ananiam et Salomith sororem eorum";
vul[20] = "Asabamque et Ohol et Barachiam et Asadiam Iosabesed quinque";
vul[21] = "filius autem Ananiae Phaltias pater Ieseiae cuius filius Raphaia huius quoque filius Arnam de quo natus est Obdia cuius filius fuit Sechenia";
vul[22] = "filius Secheniae Semeia cuius filii Attus et Iegal et Baria et Naaria et Saphat sex numero";
vul[23] = "filius Naariae Helioenai et Ezechias et Ezricam tres";
vul[24] = "filii Helioenai Oduia et Heliasub et Pheleia et Accub et Iohanan et Dalaia et Anani septem";

csb[1] = "These were David\'s sons who were born to him in Hebron: Amnon was the firstborn, by Ahinoam of Jezreel; Daniel was born second, by Abigail of Carmel;";
csb[2] = "Absalom son of Maacah, daughter of King Talmai of Geshur, was third; Adonijah son of Haggith was fourth;";
csb[3] = "Shephatiah, by Abital, was fifth; and Ithream, by David\'s wife Eglah, was sixth.";
csb[4] = "Six sons were born to David in Hebron, where he reigned seven years and six months, and he reigned in Jerusalem thirty-three years.";
csb[5] = "These sons were born to him in Jerusalem: Shimea, Shobab, Nathan, and Solomon. These four were born to him by Bath-shua daughter of Ammiel.";
csb[6] = "David\'s other sons: Ibhar, Elishua, Eliphelet,";
csb[7] = "Nogah, Nepheg, Japhia,";
csb[8] = "Elishama, Eliada, and Eliphelet -- nine sons.";
csb[9] = "These were all David\'s sons, with their sister Tamar, in addition to the sons by his concubines.";
csb[10] = "Solomon\'s son was Rehoboam; his son was Abijah, his son Asa, his son Jehoshaphat,";
csb[11] = "his son Jehoram, his son Ahaziah, his son Joash,";
csb[12] = "his son Amaziah, his son Azariah, his son Jotham,";
csb[13] = "his son Ahaz, his son Hezekiah, his son Manasseh,";
csb[14] = "his son Amon, and his son Josiah.";
csb[15] = "Josiah\'s sons: Johanan was the firstborn, Jehoiakim second, Zedekiah third, and Shallum fourth.";
csb[16] = "Jehoiakim\'s sons: his sons Jeconiah and Zedekiah.";
csb[17] = "The sons of Jeconiah the captive: his sons Shealtiel,";
csb[18] = "Malchiram, Pedaiah, Shenazzar, Jekamiah, Hoshama, and Nedabiah.";
csb[19] = "Pedaiah\'s sons: Zerubbabel and Shimei. Zerubbabel\'s sons: Meshullam and Hananiah, with their sister Shelomith;";
csb[20] = "and five others -- Hashubah, Ohel, Berechiah, Hasadiah, and Jushab-hesed.";
csb[21] = "Hananiah\'s descendants: Pelatiah, Jeshaiah, and the sons of Rephaiah, Arnan, Obadiah, and Shecaniah.";
csb[22] = "The son of Shecaniah: Shemaiah. Shemaiah\'s sons: Hattush, Igal, Bariah, Neariah, and Shaphat -- six.";
csb[23] = "Neariah\'s sons: Elioenai, Hizkiah, and Azrikam -- three.";
csb[24] = "Elioenai\'s sons: Hodaviah, Eliashib, Pelaiah, Akkub, Johanan, Delaiah, and Anani -- seven.";
