asv[1] = "And David consulted with the captains of thousands and of hundreds, even with every leader.";
asv[2] = "And David said unto all the assembly of Israel, If it seem good unto you, and if it be of Jehovah our God, let us send abroad every where unto our brethren that are left in all the land of Israel, with whom the priests and Levites are in their cities that have suburbs, that they may gather themselves unto us;";
asv[3] = "and let us bring again the ark of our God to us: for we sought not unto it in the days of Saul.";
asv[4] = "And all the assembly said that they would do so; for the thing was right in the eyes of all the people.";
asv[5] = "So David assembled all Israel together, from the Shihor [the brook] of Egypt even unto the entrance of Hamath, to bring the ark of God from Kiriath-jearim.";
asv[6] = "And David went up, and all Israel, to Baalah, [that is], to Kiriath-jearim, which belonged to Judah, to bring up from thence the ark of God Jehovah that sitteth [above] the cherubim, that is called by the Name.";
asv[7] = "And they carried the ark of God upon a new cart, [and brought it] out of the house of Abinadab: and Uzza and Ahio drove the cart.";
asv[8] = "And David and all Israel played before God with all their might, even with songs, and with harps, and with psalteries, and with timbrels, and with cymbals, and with trumpets.";
asv[9] = "And when they came unto the threshing-floor of Chidon, Uzza put forth his hand to hold the ark; for the oxen stumbled.";
asv[10] = "And the anger of Jehovah was kindled against Uzza, and he smote him, because he put forth his hand to the ark; and there he died before God.";
asv[11] = "And David was displeased, because Jehovah had broken forth upon Uzza: and he called that place Perez-uzza, unto this day.";
asv[12] = "And David was afraid of God that day, saying, How shall I bring the ark of God home to me?";
asv[13] = "So David removed not the ark unto him into the city of David, but carried it aside into the house of Obed-edom the Gittite.";
asv[14] = "And the ark of God remained with the family of Obed-edom in his house three months: and Jehovah blessed the house of Obed-edom, and all that he had.";

dby[5] = "And David assembled all Israel from the Shihor of Egypt unto the entrance of Hamath, to bring the ark of God from Kirjath-jearim.";
dby[6] = "And David went up, and all Israel, to Baalah, to Kirjath-jearim, which belonged to Judah, to bring up from thence the ark of God, of Jehovah, who sitteth between the cherubim, whose name is placed [there].";

dby[10] = "And the anger of Jehovah was kindled against Uzza, and he smote him, because he had put forth his hand to the ark; and there he died before God.";
dby[11] = "And David was indignant; for Jehovah had made a breach upon Uzza; and he called that place Perez-Uzza to this day.";
dby[12] = "And David was afraid of God that day, saying, How shall I bring the ark of God to me?";

hnv[1] = "David consulted with the captains of thousands and of hundreds, even with every leader.";
hnv[2] = "David said to all the assembly of Yisra\'el, If it seem good to you, and if it be of the LORD our God, let us send abroad everywhere to our brothers who are left in all Eretz-Yisra\'el, with whom the Kohanim and Levites are in their cities that have suburbs, that they may gather themselves to us;";
hnv[3] = "and let us bring again the ark of our God to us: for we didn\'t seek it in the days of Sha\'ul.";
hnv[4] = "All the assembly said that they would do so; for the thing was right in the eyes of all the people.";
hnv[5] = "So David assembled all Yisra\'el together, from the Shichor [the brook] of Mitzrayim even to the entrance of Hamat, to bring the ark of God from Kiryat-Ye`arim.";
hnv[6] = "David went up, and all Yisra\'el, to Ba`alah, [that is], to Kiryat-Ye`arim, which belonged to Yehudah, to bring up from there the ark of God the LORD that sits [above] the Keruvim, that is called by the Name.";
hnv[7] = "They carried the ark of God on a new cart, [and brought it] out of the house of Avinadav: and Uzza and Achyo drove the cart.";
hnv[8] = "David and all Yisra\'el played before God with all their might, even with songs, and with harps, and with psalteries, and with timbrels, and with cymbals, and with trumpets.";
hnv[9] = "When they came to the threshing floor of Chidon, Uzza put forth his hand to hold the ark; for the oxen stumbled.";
hnv[10] = "The anger of the LORD was kindled against Uzza, and he struck him, because he put forth his hand to the ark; and there he died before God.";
hnv[11] = "David was displeased, because the LORD had broken forth on Uzza; and he called that place Peretz-Uzzah, to this day.";
hnv[12] = "David was afraid of God that day, saying, How shall I bring the ark of God home to me?";
hnv[13] = "So David didn\'t move the ark to him into the city of David, but carried it aside into the house of Obed-edom the Gittite.";
hnv[14] = "The ark of God remained with the family of Obed-edom in his house three months: and the LORD blessed the house of Obed-edom, and all that he had.";

rsv[1] = "David consulted with the commanders of thousands and of hundreds, with every leader.";
rsv[2] = "And David said to all the assembly of Israel, &quot;If it seems good to you, and if it is the will of the LORD our God, let us send abroad to our brethren who remain in all the land of Israel, and with them to the priests and Levites in the cities that have pasture lands, that they may come together to us.";
rsv[3] = "Then let us bring again the ark of our God to us; for we neglected it in the days of Saul.&quot;";
rsv[4] = "All the assembly agreed to do so, for the thing was right in the eyes of all the people.";
rsv[5] = "So David assembled all Israel from the Shihor of Egypt to the entrance of Hamath, to bring the ark of God from Kir\'iath-je\'arim.";
rsv[6] = "And David and all Israel went up to Ba\'alah, that is, to Kir\'iath-je\'arim which belongs to Judah, to bring up from there the ark of God, which is called by the name of the LORD who sits enthroned above the cherubim.";
rsv[7] = "And they carried the ark of God upon a new cart, from the house of Abin\'adab, and Uzzah and Ahi\'o were driving the cart.";
rsv[8] = "And David and all Israel were making merry before God with all their might, with song and lyres and harps and tambourines and cymbals and trumpets.";
rsv[9] = "And when they came to the threshing floor of Chidon, Uzzah put out his hand to hold the ark, for the oxen stumbled.";
rsv[10] = "And the anger of the LORD was kindled against Uzzah; and he smote him because he put forth his hand to the ark; and he died there before God.";
rsv[11] = "And David was angry because the LORD had broken forth upon Uzzah; and that place is called Pe\'rez-uz\'za to this day.";
rsv[12] = "And David was afraid of God that day; and he said, &quot;How can I bring the ark of God home to me?&quot;";
rsv[13] = "So David did not take the ark home into the city of David, but took it aside to the house of O\'bed-e\'dom the Gittite.";
rsv[14] = "And the ark of God remained with the household of O\'bed-e\'dom in his house three months; and the LORD blessed the household of O\'bed-e\'dom and all that he had.";
vul[1] = "iniit autem consilium David cum tribunis et centurionibus et universis principibus";
vul[2] = "et ait ad omnem coetum Israhel si placet vobis et a Domino Deo nostro egreditur sermo quem loquor mittamus ad fratres nostros reliquos in universas regiones Israhel et ad sacerdotes et Levitas qui habitant in suburbanis urbium ut congregentur ad nos";
vul[3] = "et reducamus arcam Dei nostri ad nos non enim requisivimus eam in diebus Saul";
vul[4] = "et respondit universa multitudo ut ita fieret placuerat enim sermo omni populo";
vul[5] = "congregavit ergo David cunctum Israhel a Sior Aegypti usque dum ingrediaris Emath ut adduceret arcam Dei de Cariathiarim";
vul[6] = "et ascendit David et omnis vir Israhel ad collem Cariathiarim quae est in Iuda ut adferrent inde arcam Dei Domini sedentis super cherubin ubi invocatum est nomen eius";
vul[7] = "inposueruntque arcam Dei super plaustrum novum de domo Aminadab Oza autem et fratres eius minabant plaustrum";
vul[8] = "porro David et universus Israhel ludebant coram Deo omni virtute in canticis et in citharis et psalteriis et tympanis et cymbalis et tubis";
vul[9] = "cum autem pervenissent ad aream Chidon tetendit Oza manum suam ut sustentaret arcam bos quippe lasciviens paululum inclinaverat eam";
vul[10] = "iratus est itaque Dominus contra Ozam et percussit eum eo quod contigisset arcam et mortuus est ibi coram Deo";
vul[11] = "contristatusque David eo quod divisisset Dominus Ozam vocavit locum illum Divisio Oza usque in praesentem diem";
vul[12] = "et timuit Deum tunc temporis dicens quomodo possum ad me introducere arcam Dei";
vul[13] = "et ob hanc causam non eam adduxit ad se hoc est in civitatem David sed avertit in domum Obededom Getthei";
vul[14] = "mansit ergo arca Dei in domo Obededom tribus mensibus et benedixit Dominus domui eius et omnibus quae habebat";

yng[1] = "And David consulteth with the heads of the thousands, and of the hundreds, every leader,";
yng[2] = "and David saith to all the assembly of Israel, `If unto you it be good, and from Jehovah our God it hath broken forth -- we send unto our brethren, those left in all the lands of Israel, and with them the priests and the Levites, in the cities of their suburbs, and they are gathered unto us,";
yng[3] = "and we bring round the ark of our God unto us, for we sought Him not in the days of Saul.\'";
yng[4] = "And all the assembly say to do so, for the thing is right in the eyes of all the people.";
yng[5] = "And David assembleth all Israel from Shihor of Egypt even unto the entering in of Hamath, to bring in the ark of God from Kirjath-Jearim,";
yng[6] = "and David goeth up, and all Israel, to Baalah, unto Kirjath-Jearim that [is] to Judah, to bring up thence the ark of God Jehovah, inhabiting the cherubs, where the Name is called on.";
yng[7] = "And they place the ark of God on a new cart, from the house of Abinadab, and Uzza and Ahio are leading the cart,";
yng[8] = "and David and all Israel are playing before God, with all strength, and with songs, and with harps, and with psalteries, and with timbrels, and with cymbals, and with trumpets.";
yng[9] = "And they come in unto the threshing-floor of Chidon, and Uzza putteth forth his hand to seize the ark, for the oxen were released,";
yng[10] = "and the anger of Jehovah is kindled against Uzza, and He smiteth him, because that he hath put forth his hand on the ark, and he dieth there before God.";
yng[11] = "And it is displeasing to David, because Jehovah hath made a breach upon Uzza, and one calleth that place `Breach of Uzza\' unto this day.";
yng[12] = "And David feareth God on that day, saying, `How do I bring in unto me the ark of God?\'";
yng[13] = "And David hath not turned aside the ark unto himself, unto the city of David, and turneth it aside unto the house of Obed-Edom the Gittite.";
yng[14] = "And the ark of God dwelleth with the household of Obed-Edom, in his house, three months, and Jehovah blesseth the house of Obed-Edom, and all that he hath.";
csb[1] = "David consulted with all his leaders, the commanders of hundreds and of thousands.";
csb[2] = "Then he said to the whole assembly of Israel, &quot;If it seems good to you, and if this is from the LORD our God, let us spread out and send the message to the rest of our relatives in all the districts of Israel, including the priests and Levites in their cities with pasturelands, that they should gather together with us.";
csb[3] = "&quot;Then let us bring back the ark of our God, for we did not inquire of him in Saul\'s days.&quot;";
csb[4] = "Since the proposal seemed right to all the people, the whole assembly agreed to do it.";
csb[5] = "So David assembled all Israel, from the Shihor of Egypt to the entrance of Hamath, to bring the ark of God from Kiriath-jearim.";
csb[6] = "David and all Israel went to Baalah (that is, Kiriath-jearim that belongs to Judah) to take from there the ark of God, which bears the name of the LORD who is enthroned between the cherubim.";
csb[7] = "At Abinadab\'s house they set the ark of God on a new cart. Uzzah and Ahio were guiding the cart.";
csb[8] = "David and all Israel were dancing with all their might before God with songs and with lyres, harps, tambourines, cymbals, and trumpets.";
csb[9] = "When they came to Chidon\'s threshing floor, Uzzah reached out to hold the ark because the oxen had stumbled.";
csb[10] = "Then the LORD\'s anger burned against Uzzah, and he struck him dead because he had reached out to the ark. So he died there in the presence of God.";
csb[11] = "David was angry because of the LORD\'s outburst against Uzzah, so he named that place Outburst Against Uzzah, as it is still named today.";
csb[12] = "David feared God that day and said, &quot;How can I ever bring the ark of God to me? &quot;";
csb[13] = "So David did not bring the ark of God home to the city of David; instead, he diverted it to the house of Obed-edom of Gath.";
csb[14] = "The ark of God remained with Obed-edom\'s family in his house for three months, and the LORD blessed his family and all that he had.";
