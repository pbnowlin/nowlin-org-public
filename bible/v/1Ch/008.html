asv[1] = "And Benjamin begat Bela his first-born, Ashbel the second, and Aharah the third,";
asv[2] = "Nohah the fourth, and Rapha the fifth.";
asv[3] = "And Bela had sons: Addar, and Gera, and Abihud,";
asv[4] = "and Abishua, and Naaman, and Ahoah,";
asv[5] = "and Gera, and Shephuphan, and Huram.";
asv[6] = "And these are the sons of Ehud: these are the heads of fathers\' [houses] of the inhabitants of Geba, and they carried them captive to Manahath:";
asv[7] = "and Naaman, and Ahijah, and Gera, he carried them captive; and he begat Uzza and Ahihud.";
asv[8] = "And Shaharaim begat children in the field of Moab, after he had sent them away; Hushim and Baara were his wives.";
asv[9] = "And he begat of Hodesh his wife, Jobab, and Zibia, and Mesha, and Malcam,";
asv[10] = "and Jeuz, and Shachia, and Mirmah. These were his sons, heads of fathers\' [houses].";
asv[11] = "And of Hushim he begat Abitub and Elpaal.";
asv[12] = "And the sons of Elpaal: Eber, and Misham, and Shemed, who built Ono and Lod, with the towns thereof;";
asv[13] = "and Beriah, and Shema, who were heads of fathers\' [houses] of the inhabitants of Aijalon, who put to flight the inhabitants of Gath;";
asv[14] = "and Ahio, Shashak, and Jeremoth,";
asv[15] = "and Zebadiah, and Arad, and Eder,";
asv[16] = "and Michael, and Ishpah, and Joha, the sons of Beriah,";
asv[17] = "and Zebadiah, and Meshullam, and Hizki, and Heber,";
asv[18] = "and Ishmerai, and Izliah, and Jobab, the sons of Elpaal,";
asv[19] = "and Jakim, and Zichri, and Zabdi,";
asv[20] = "and Elienai, and Zillethai, and Eliel,";
asv[21] = "and Adaiah, and Beraiah, and Shimrath, the sons of Shimei,";
asv[22] = "and Ishpan, and Eber, and Eliel,";
asv[23] = "and Abdon, and Zichri, and Hanan,";
asv[24] = "and Hananiah, and Elam, and Anthothijah,";
asv[25] = "and Iphdeiah, and Penuel, the sons of Shashak,";
asv[26] = "and Shamsherai, and Shehariah, and Athaliah,";
asv[27] = "and Jaareshiah, and Elijah, and Zichri, the sons of Jeroham.";
asv[28] = "These were heads of fathers\' [houses] throughout their generations, chief men: these dwelt in Jerusalem.";
asv[29] = "And in Gibeon there dwelt the father of Gibeon, [Jeiel], whose wife\'s name was Maacah;";
asv[30] = "and his first-born son Abdon, and Zur, and Kish, and Baal, and Nadab,";
asv[31] = "and Gedor, and Ahio, and Zecher.";
asv[32] = "And Mikloth begat Shimeah. And they also dwelt with their brethren in Jerusalem, over against their brethren.";
asv[33] = "And Ner begat Kish; and Kish begat Saul; and Saul begat Jonathan, and Malchi-shua, and Abinadab, and Eshbaal.";
asv[34] = "And the son of Jonathan was Merib-baal; and Merib-baal begat Micah.";
asv[35] = "And the sons of Micah: Pithon, and Melech, and Tarea, and Ahaz.";
asv[36] = "And Ahaz begat Jehoaddah; and Jehoaddah begat Alemeth, and Azmaveth, and Zimri; and Zimri begat Moza.";
asv[37] = "And Moza begat Binea; Raphah was his son, Eleasah his son, Azel his son.";
asv[38] = "And Azel had six sons, whose names are these: Azrikam, Bocheru, and Ishmael, and Sheariah, and Obadiah, and Hanan. All these were the sons of Azel.";
asv[39] = "And the sons of Eshek his brother: Ulam his first-born, Jeush the second, and Eliphelet the third.";
asv[40] = "And the sons of Ulam were mighty men of valor, archers, and had many sons, and sons\' sons, a hundred and fifty. All these were of the sons of Benjamin.";

hnv[1] = "Binyamin became the father of Bela his firstborn, Ashbel the second, and Achrach the third,";
hnv[2] = "Nochah the fourth, and Rapha the fifth.";
hnv[3] = "Bela had sons: Addar, and Gera, and Avihud,";
hnv[4] = "and Avishua, and Na`aman, and Achoach,";
hnv[5] = "and Gera, and Shefufan, and Huram.";
hnv[6] = "These are the sons of Echud: these are the heads of fathers\' [houses] of the inhabitants of Geva, and they carried them captive to Manachat:";
hnv[7] = "and Na`aman, and Achiyah, and Gera, he carried them captive: and he became the father of Uzza and Achichud.";
hnv[8] = "Shacharayim became the father of children in the field of Mo\'av, after he had sent them away; Hushim and Ba`ara were his wives.";
hnv[9] = "He became the father of Hodesh his wife, Yovav, and Tzivyah, and Mesha, and Malkam,";
hnv[10] = "and Ye`utz, and Sokhyah, and Mirmah. These were his sons, heads of fathers\' [houses].";
hnv[11] = "Of Hushim he became the father of Avituv and Elpa`al.";
hnv[12] = "The sons of Elpa`al: `Ever, and Mish`am, and Shemed, who built Ono and Lod, with the towns of it;";
hnv[13] = "and Beri`ah, and Shema, who were heads of fathers\' [houses] of the inhabitants of Ayalon, who put to flight the inhabitants of Gat;";
hnv[14] = " and Achyo, Shashak, and Yeremot,";
hnv[15] = "and Zevadyah, and `Arad, and `Eder,";
hnv[16] = "and Mikha\'el, and Yishpah, and Yocha, the sons of Beri`ah,";
hnv[17] = "and Zevadyah, and Meshullam, and Hizki, and Hever,";
hnv[18] = "and Ishmerai, and Yizli\'ah, and Yovav, the sons of Elpa`al,";
hnv[19] = "and Yakim, and Zikhri, and Zavdi,";
hnv[20] = "and Eli`esenai, and Tzilletai, and Eli\'el,";
hnv[21] = "and `Adayah, and Berayah, and Shimrat, the sons of Shim`i,";
hnv[22] = "and Yishpan, and `Ever, and Eli\'el,";
hnv[23] = " and `Avdon, and Zikhri, and Hanan,";
hnv[24] = "and Hananyah, and `Elam, and `Antotiyah,";
hnv[25] = "and Yifdeyah, and Penu\'el, the sons of Shashak,";
hnv[26] = "and Shamsherai, and Shecharyah, and `Atalyah,";
hnv[27] = "and Ya`areshyah, and Eliyah, and Zikhri, the sons of Yerocham.";
hnv[28] = "These were heads of fathers\' [houses] throughout their generations, chief men: these lived in Yerushalayim.";
hnv[29] = "In Giv`on there lived the father of Giv`on, [Ye`i\'el], whose wife\'s name was Ma`akhah;";
hnv[30] = "and his firstborn son `Avdon, and Tzur, and Kish, and Ba`al, and Nadav,";
hnv[31] = "and Gedor, and Achyo, and Zekher.";
hnv[32] = "Miklot became the father of Shim`a. They also lived with their brothers in Yerushalayim, over against their brothers.";
hnv[33] = "Ner became the father of Kish; and Kish became the father of Sha\'ul; and Sha\'ul became the father of Yonatan, and Malki-Shua, and Avinadav, and Eshba`al.";
hnv[34] = "The son of Yonatan was Meriv-Ba`al; and Meriv-Ba`al became the father of Mikhah.";
hnv[35] = "The sons of Mikhah: Piton, and Melekh, and Ta\'rea, and Achaz.";
hnv[36] = "Achaz became the father of Yeho`addah; and Yeho`addah became the father of `Alemet, and `Azmavet, and Zimri; and Zimri became the father of Motzah.";
hnv[37] = "Motzah became the father of Bin`a; Rafah was his son, El`asah his son, Atzel his son.";
hnv[38] = "Atzel had six sons, whose names are these: `Azrikam, Bokhru, and Yishma\'el, and She`aryah, and `Ovadyah, and Hanan. All these were the sons of Atzel.";
hnv[39] = "The sons of Eshek his brother: Ulam his firstborn, Ye`ush the second, and Elifelet the third.";
hnv[40] = "The sons of Ulam were mighty men of valor, archers, and had many sons, and sons\' sons, one hundred fifty. All these were of the sons of Binyamin.";

rsv[1] = "Benjamin was the father of Bela his first-born, Ashbel the second, Ahar\'ah the third,";
rsv[2] = "Nohah the fourth, and Rapha the fifth.";
rsv[3] = "And Bela had sons: Addar, Gera, Abi\'hud,";
rsv[4] = "Abishu\'a, Na\'aman, Aho\'ah,";
rsv[5] = "Gera, Shephu\'phan, and Huram.";
rsv[6] = "These are the sons of Ehud (they were heads of fathers\' houses of the inhabitants of Geba, and they were carried into exile to Mana\'hath):";
rsv[7] = "Na\'aman, Ahi\'jah, and Gera, that is, Heglam, who was the father of Uzza and Ahi\'hud.";
rsv[8] = "And Shahara\'im had sons in the country of Moab after he had sent away Hushim and Ba\'ara his wives.";
rsv[9] = "He had sons by Hodesh his wife: Jobab, Zib\'i-a, Mesha, Malcam,";
rsv[10] = "Je\'uz, Sachi\'a, and Mirmah. These were his sons, heads of fathers\' houses.";
rsv[11] = "He also had sons by Hushim: Abi\'tub and Elpa\'al.";
rsv[12] = "The sons of Elpa\'al: Eber, Misham, and Shemed, who built Ono and Lod with its towns,";
rsv[13] = "and Beri\'ah and Shema (they were heads of fathers\' houses of the inhabitants of Ai\'jalon, who put to flight the inhabitants of Gath);";
rsv[14] = "and Ahi\'o, Shashak, and Jer\'emoth.";
rsv[15] = "Zebadi\'ah, Arad, Eder,";
rsv[16] = "Michael, Ishpah, and Joha were sons of Beri\'ah.";
rsv[17] = "Zebadi\'ah, Meshul\'lam, Hizki, Heber,";
rsv[18] = "Ish\'merai, Izli\'ah, and Jobab were the sons of Elpa\'al.";
rsv[19] = "Jakim, Zichri, Zabdi,";
rsv[20] = "Eli-e\'nai, Zil\'lethai, Eli\'el,";
rsv[21] = "Adai\'ah, Berai\'ah, and Shimrath were the sons of Shim\'e-i.";
rsv[22] = "Ishpan, Eber, Eli\'el,";
rsv[23] = "Abdon, Zichri, Hanan,";
rsv[24] = "Hanani\'ah, Elam, Anthothi\'jah,";
rsv[25] = "Iphdei\'ah, and Penu\'el were the sons of Shashak.";
rsv[26] = "Sham\'sherai, Shehari\'ah, Athali\'ah,";
rsv[27] = "Ja-areshi\'ah, Eli\'jah, and Zichri were the sons of Jero\'ham.";
rsv[28] = "These were the heads of fathers\' houses, according to their generations, chief men. These dwelt in Jerusalem.";
rsv[29] = "Je-i\'el the father of Gibeon dwelt in Gibeon, and the name of his wife was Ma\'acah.";
rsv[30] = "His first-born son: Abdon, then Zur, Kish, Ba\'al, Nadab,";
rsv[31] = "Gedor, Ahi\'o, Zecher,";
rsv[32] = "and Mikloth (he was the father of Shim\'e-ah). Now these also dwelt opposite their kinsmen in Jerusalem, with their kinsmen.";
rsv[33] = "Ner was the father of Kish, Kish of Saul, Saul of Jonathan, Mal\'chishu\'a, Abin\'adab, and Esh-ba\'al;";
rsv[34] = "and the son of Jonathan was Mer\'ib-ba\'al; and Mer\'ib-ba\'al was the father of Micah.";
rsv[35] = "The sons of Micah: Pithon, Melech, Tare\'a, and Ahaz.";
rsv[36] = "Ahaz was the father of Jeho\'addah; and Jeho\'addah was the father of Al\'emeth, Az\'maveth, and Zimri; Zimri was the father of Moza.";
rsv[37] = "Moza was the father of Bin\'e-a; Raphah was his son, Ele-a\'sah his son, Azel his son.";
rsv[38] = "Azel had six sons, and these are their names: Azri\'kam, Bo\'cheru, Ish\'mael, She-ari\'ah, Obadi\'ah, and Hanan. All these were the sons of Azel.";
rsv[39] = "The sons of Eshek his brother: Ulam his first-born, Je\'ush the second, and Eliph\'elet the third.";
rsv[40] = "The sons of Ulam were men who were mighty warriors, bowmen, having many sons and grandsons, one hundred and fifty. All these were Benjaminites.";
vul[1] = "Beniamin autem genuit Bale primogenitum suum Asbal secundum Ohora tertium";
vul[2] = "Nuaha quartum et Rapha quintum";
vul[3] = "fueruntque filii Bale Addaor et Gera et Abiud";
vul[4] = "Abisue quoque et Neman et Ahoe";
vul[5] = "sed et Gera et Sephuphan et Uram";
vul[6] = "hii sunt filii Aod principes cognationum habitantium in Gabaa qui translati sunt in Manath";
vul[7] = "Nooman autem et Achia et Gera ipse transtulit eos et genuit Oza et Ahiud";
vul[8] = "porro Saarim genuit in regione Moab postquam dimisit Usim et Bara uxores suas";
vul[9] = "genuit autem de Edes uxore sua Iobab et Sebia et Mosa et Molchom";
vul[10] = "Iehus quoque et Sechia et Marma hii sunt filii eius principes in familiis suis";
vul[11] = "Meusim vero genuit Abitob et Elphaal";
vul[12] = "porro filii Elphaal Heber et Misaam et Samad hic aedificavit Ono et Lod et filias eius";
vul[13] = "Bara autem et Samma principes cognationum habitantium in Aialon hii fugaverunt habitatores Geth";
vul[14] = "et Haio et Sesac et Ierimoth";
vul[15] = "et Zabadia et Arod et Eder";
vul[16] = "Michahel quoque et Iespha et Ioaa filii Baria";
vul[17] = "et Zabadia et Mosollam et Ezeci et Heber";
vul[18] = "et Iesamari et Iezlia et Iobab filii Elphaal";
vul[19] = "et Iacim et Zechri et Zabdi";
vul[20] = "et Helioenai et Selethai et Helihel";
vul[21] = "et Adaia et Baraia et Samarath filii Semei";
vul[22] = "et Iesphan et Heber et Helihel";
vul[23] = "et Abdon et Zechri et Hanan";
vul[24] = "et Anania et Ailam et Anathothia";
vul[25] = "et Iephdaia et Phanuhel filii Sesac";
vul[26] = "et Samsari et Sooria et Otholia";
vul[27] = "et Iersia et Helia et Zechri filii Ieroam";
vul[28] = "hii patriarchae et cognationum principes qui habitaverunt in Hierusalem";
vul[29] = "in Gabaon autem habitaverunt Abigabaon et nomen uxoris eius Maacha";
vul[30] = "filiusque eius primogenitus Abdon et Sur et Cis et Baal et Nadab";
vul[31] = "Gedor quoque et Ahio et Zacher";
vul[32] = "et Macelloth genuit Samaa habitaveruntque ex adverso fratrum suorum in Hierusalem cum fratribus suis";
vul[33] = "Ner autem genuit Cis et Cis genuit Saul porro Saul genuit Ionathan et Melchisuae et Abinadab et Esbaal";
vul[34] = "filius autem Ionathan Meribbaal et Meribbaal genuit Micha";
vul[35] = "filii Micha Phithon et Melech et Thara et Ahaz";
vul[36] = "et Ahaz genuit Ioada et Ioada genuit Almoth et Azmoth et Zamari porro Zamari genuit Mosa";
vul[37] = "et Mosa genuit Baana cuius filius fuit Rapha de quo ortus est Elasa qui genuit Asel";
vul[38] = "porro Asel sex filii fuere his nominibus Ezricam Bochru Ismahel Saria Abadia Anan omnes hii filii Asel";
vul[39] = "filii autem Esec fratris eius Ulam primogenitus et Us secundus et Eliphalet tertius";
vul[40] = "fueruntque filii Ulam viri robustissimi et magno robore tendentes arcum et multos habentes filios ac nepotes usque ad centum quinquaginta omnes hii filii Beniamin";
web[1] = "Now Benjamin begat Bela his first-born, Ashbel the second, and Aharah the third.";
web[2] = "Nohah the fourth, and Rapha the fifth.";
web[3] = "And the sons of Bela were Addar, and Gera, and Abihud,";
web[4] = "And Abishua, and Naaman, and Ahoah,";
web[5] = "And Gera, and Shephuphan, and Huram.";
web[6] = "And these [are] the sons of Ehud: these are the heads of the fathers of the inhabitants of Geba, and they removed them to Manahath:";
web[7] = "And Naaman, and Ahiah, and Gera, he removed them, and begat Uzza, and Ahihud.";
web[8] = "And Shaharaim begat [children] in the country of Moab, after he had sent them away; Hushim and Baara [were] his wives.";
web[9] = "And he begat of Hodesh his wife, Jobab, and Zibia, and Mesha, and Malcham,";
web[10] = "And Jeuz, and Shachia, and Mirma. These [were] his sons, heads of the fathers.";
web[11] = "And of Hushim he begat Ahitub, and Elpaal.";
web[12] = "The sons of Elpaal; Eber, and Misham, and Shamed, who built Ono, and Lod, with its town:";
web[13] = "Beriah also, and Shema, who [were] heads of the fathers of the inhabitants of Ajalon, who drove away the inhabitants of Gath:";
web[14] = "And Ahio, Shashak, and Jeremoth,";
web[15] = "And Zebadiah, and Arad, and Ader,";
web[16] = "And Michael, and Ispah, and Joha, the sons of Beriah;";
web[17] = "And Zebadiah, and Meshullam, and Hezeki, and Heber,";
web[18] = "Ishmerai also, and Jezliah, and Jobab, the sons of Elpaal;";
web[19] = "And Jakim, and Zichri, and Zabdi,";
web[20] = "And Elienai, and Zilthai, and Eliel,";
web[21] = "And Adaiah, and Beraiah, and Shimrath, the sons of Shimhi;";
web[22] = "And Ishpan, and Heber, and Eliel,";
web[23] = "And Abdon, and Zichri, and Hanan,";
web[24] = "And Hananiah, and Elam, and Antothijah,";
web[25] = "And Iphedeiah, and Penuel, the sons of Shashak;";
web[26] = "And Shamsherai, and Shehariah, and Athaliah,";
web[27] = "And Jaresiah, and Eliah, and Zichri, the sons of Jeroham.";
web[28] = "These [were] heads of the fathers, by their generations, chief [men]. These dwelt in Jerusalem.";
web[29] = "And at Gibeon dwelt the father of Gibeon; whose wife\'s name [was] Maachah:";
web[30] = "And his first-born son Abdon, and Zur, and Kish, and Baal, and Nadab,";
web[31] = "And Gedor, and Ahio, and Zacher.";
web[32] = "And Mikloth begat Shimeah. And these also dwelt with their brethren in Jerusalem, over against them.";
web[33] = "And Ner begat Kish, and Kish begat Saul, and Saul begat Jonathan, and Malchi-shua, and Abinadab, and Esh-baal.";
web[34] = "And the son of Jonathan [was] Merib-baal; and Merib-baal begat Micah.";
web[35] = "And the sons of Micah [were], Pithon, and Melech, and Tarea, and Ahaz.";
web[36] = "And Ahaz begat Jehoadah; and Jehoadah begat Alemeth, and Azmaveth, and Zimri; and Zimri begat Moza,";
web[37] = "And Moza begat Bineah: Rapha [was] his son, Eleasah his son, Azel his son:";
web[38] = "And Azel had six sons, whose names [are] these, Azrikam, Bocheru, and Ishmael, and Sheariah, and Obadiah, and Hanan. All these [were] the sons of Azel.";
web[39] = "And the sons of Eshek his brother [were], Ulam his first-born, Jehush the second, and Eliphelet the third.";
web[40] = "And the sons of Ulam were mighty men of valor, archers, and had many sons, and sons\' sons a hundred and fifty. All these [are] of the sons of Benjamin.";
yng[1] = "And Benjamin begat Bela his first-born, Ashbel the second, and Aharah the third,";

yng[11] = "And of Hushim he begat Ahitub and Elpaal.";

yng[13] = "and Beriah and Shema, (they [are] the heads of fathers to the inhabitants of Aijalon -- they caused to flee the inhabitants of Gath),";
yng[14] = "and Ahio, Shashak, and Jeremoth,";

yng[19] = "And Jakim, and Zichri, and Zabdi,";

yng[21] = "and Adaiah, and Beraiah, and Shimrath, sons of Shimei;";
yng[22] = "And Ishpan, and Heber, and Eliel,";
yng[23] = "and Abdon, and Zichri, and Hanan,";
yng[24] = "and Hananiah, and Elam, and Antothijah,";
yng[25] = "and Iphedeiah, and Penuel, sons of Shashak;";
yng[26] = "And Shamsherai, and Shehariah, and Athaliah,";
yng[27] = "and Jaareshiah, and Eliah, and Zichri, sons of Jeroham.";
yng[28] = "These [are] heads of fathers, by their generations, heads; these dwelt in Jerusalem.";
yng[29] = "And in Gibeon hath the father of Gibeon dwelt, and the name of his wife [is] Maachah;";

yng[33] = "And Ner begat Kish, and Kish begat Saul, and Saul begat Jonathan, and Malchi-Shua, and Abinadab, and Esh-Baal.";
yng[34] = "And a son of Jonathan [is] Merib-Baal, and Merib-Baal begat Micah;";
yng[35] = "and sons of Micah: Pithon, and Melech, and Tarea, and Ahaz:";
yng[36] = "and Ahaz begat Jehoadah, and Jehoadah begat Alemeth, and Azmaveth, and Zimri; and Zimri begat Moza,";
yng[37] = "and Moza begat Binea, Raphah [is] his son, Eleasah his son, Azel his son.";

yng[39] = "And sons of Eshek his brother: Ulam his first-born, Jehush the second, and Eliphelet the third.";
yng[40] = "And the sons of Ulam are men mighty in valour, treading bow, and multiplying sons and son\'s sons, a hundred and fifty. All these [are] of the sons of Benjamin.";
csb[1] = "Benjamin fathered Bela, his firstborn; Ashbel was born second, Aharah third,";
csb[2] = "Nohah fourth, and Rapha fifth.";
csb[3] = "Bela\'s sons: Addar, Gera, Abihud,";
csb[4] = "Abishua, Naaman, Ahoah,";
csb[5] = "Gera, Shephuphan, and Huram.";
csb[6] = "These were Ehud\'s sons, who were the heads of the families living in Geba and who were deported to Manahath:";
csb[7] = "Naaman, Ahijah, and Gera. Gera deported them and was the father of Uzza and Ahihud.";
csb[8] = "Shaharaim had sons in the territory of Moab after he had divorced his wives Hushim and Baara.";
csb[9] = "His sons by his wife Hodesh: Jobab, Zibia, Mesha, Malcam,";
csb[10] = "Jeuz, Sachia, and Mirmah. These were his sons, family heads.";
csb[11] = "He also had sons by Hushim: Abitub and Elpaal.";
csb[12] = "Elpaal\'s sons: Eber, Misham, and Shemed who built Ono and Lod and its surrounding villages,";
csb[13] = "Beriah and Shema, who were the family heads of Aijalon\'s residents and who drove out the residents of Gath,";
csb[14] = "Ahio, Shashak, and Jeremoth.";
csb[15] = "Zebadiah, Arad, Eder,";
csb[16] = "Michael, Ishpah, and Joha were Beriah\'s sons.";
csb[17] = "Zebadiah, Meshullam, Hizki, Heber,";
csb[18] = "Ishmerai, Izliah, and Jobab were Elpaal\'s sons.";
csb[19] = "Jakim, Zichri, Zabdi,";
csb[20] = "Elienai, Zillethai, Eliel,";
csb[21] = "Adaiah, Beraiah, and Shimrath were Shimei\'s sons.";
csb[22] = "Ishpan, Eber, Eliel,";
csb[23] = "Abdon, Zichri, Hanan,";
csb[24] = "Hananiah, Elam, Anthothijah,";
csb[25] = "Iphdeiah, and Penuel were Shashak\'s sons.";
csb[26] = "Shamsherai, Shehariah, Athaliah,";
csb[27] = "Jaareshiah, Elijah, and Zichri were Jeroham\'s sons.";
csb[28] = "These were family heads, chiefs according to their family records; they lived in Jerusalem.";
csb[29] = "Jeiel fathered Gibeon and lived in Gibeon. His wife\'s name was Maacah.";
csb[30] = "Abdon was his firstborn son, then Zur, Kish, Baal, Nadab,";
csb[31] = "Gedor, Ahio, Zecher,";
csb[32] = "and Mikloth who fathered Shimeah. These also lived opposite their relatives in Jerusalem, with their other relatives.";
csb[33] = "Ner fathered Kish, Kish fathered Saul, and Saul fathered Jonathan, Malchishua, Abinadab, and Esh-baal.";
csb[34] = "Jonathan\'s son was Merib-baal, and Merib-baal fathered Micah.";
csb[35] = "Micah\'s sons: Pithon, Melech, Tarea, and Ahaz.";
csb[36] = "Ahaz fathered Jehoaddah, Jehoaddah fathered Alemeth, Azmaveth, and Zimri, and Zimri fathered Moza.";
csb[37] = "Moza fathered Binea. His son was Raphah, his son Elasah, and his son Azel.";
csb[38] = "Azel had six sons, and these were their names: Azrikam, Bocheru, Ishmael, Sheariah, Obadiah, and Hanan. All these were Azel\'s sons.";
csb[39] = "His brother Eshek\'s sons: Ulam was his firstborn, Jeush second, and Eliphelet third.";
csb[40] = "Ulam\'s sons were valiant warriors and archers. They had many sons and grandsons -- 150 of them. All these were among Benjamin\'s sons.";
