asv[1] = "And the courses of the sons of Aaron [were these]. The sons of Aaron: Nadab and Abihu, Eleazar and Ithamar.";
asv[2] = "But Nadab and Abihu died before their father, and had no children: therefore Eleazar and Ithamar executed the priest\'s office.";
asv[3] = "And David with Zadok of the sons of Eleazar, and Ahimelech of the sons of Ithamar, divided them according to their ordering in their service.";
asv[4] = "And there were more chief men found of the sons of Eleazar than of the sons of Ithamar; and [thus] were they divided: of the sons of Eleazar there were sixteen, heads of fathers\' houses; and of the sons of Ithamar, according to their fathers\' houses, eight.";
asv[5] = "Thus were they divided by lot, one sort with another; for there were princes of the sanctuary, and princes of God, both of the sons of Eleazar, and of the sons of Ithamar.";
asv[6] = "And Shemaiah the son of Nethanel the scribe, who was of the Levites, wrote them in the presence of the king, and the princes, and Zadok the priest, and Ahimelech the son of Abiathar, and the heads of the fathers\' [houses] of the priests and of the Levites; one fathers\' house being taken for Eleazar, and one taken for Ithamar.";

asv[20] = "And of the rest of the sons of Levi: of the sons of Amram, Shubael; of the sons of Shubael, Jehdeiah.";

asv[22] = "Of the Izharites, Shelomoth; of the sons of Shelomoth, Jahath.";

asv[28] = "Of Mahli: Eleazar, who had no sons.";

asv[31] = "These likewise cast lots even as their brethren the sons of Aaron in the presence of David the king, and Zadok, and Ahimelech, and the heads of the fathers\' [houses] of the priests and of the Levites; the fathers\' [houses] of the chief even as those of his younger brother.";
dby[1] = "And the divisions of the sons of Aaron: the sons of Aaron, Nadab and Abihu, Eleazar and Ithamar.";
dby[2] = "And Nadab and Abihu died before their father, and had no children; and Eleazar and Ithamar exercised the priesthood.";
dby[3] = "And David distributed them, both Zadok of the sons of Eleazar, and Ahimelech of the sons of Ithamar, according to their office in their service.";
dby[4] = "And there were more head-men found of the sons of Eleazar than of the sons of Ithamar, and [thus] were they divided: of the sons of Eleazar there were sixteen heads of fathers\' houses, and eight of the sons of Ithamar according to their fathers\' houses.";

dby[21] = "Of Rehabiah, of the sons of Rehabiah, the head was Jishijah.";

hnv[1] = "The courses of the sons of Aharon [were these]. The sons of Aharon: Nadav and Avihu, El`azar and Itamar.";
hnv[2] = "But Nadav and Avihu died before their father, and had no children: therefore El`azar and Itamar executed the Kohen\'s office.";
hnv[3] = "David with Tzadok of the sons of El`azar, and Achimelekh of the sons of Itamar, divided them according to their ordering in their service.";
hnv[4] = "There were more chief men found of the sons of El`azar than of the sons of Itamar; and [thus] were they divided: of the sons of El`azar there were sixteen, heads of fathers\' houses; and of the sons of Itamar, according to their fathers\' houses, eight.";
hnv[5] = "Thus were they divided by lot, one sort with another; for there were princes of the sanctuary, and princes of God, both of the sons of El`azar, and of the sons of Itamar.";
hnv[6] = " Shemayah the son of Netan\'el the Sofer, who was of the Levites, wrote them in the presence of the king, and the princes, and Tzadok the Kohen, and Achimelekh the son of Avyatar, and the heads of the fathers\' [houses] of the Kohanim and of the Levites; one fathers\' house being taken for El`azar, and one taken for Itamar.";

hnv[8] = "the third to Harim, the fourth to Seorim,";
hnv[9] = "the fifth to Malkiyah, the sixth to Miyamin,";
hnv[10] = "the seventh to Hakkotz, the eighth to Aviyah,";
hnv[11] = " the ninth to Yeshua, the tenth to Shekhanyahu,";
hnv[12] = "the eleventh to Elyashiv, the twelfth to Yakim,";
hnv[13] = "the thirteenth to Huppah, the fourteenth to Jeshebeab,";
hnv[14] = "the fifteenth to Bilgah, the sixteenth to Immer,";
hnv[15] = "the seventeenth to Hetzir, the eighteenth to Happizzez,";
hnv[16] = "the nineteenth to Petachyah, the twentieth to Jehezkel,";
hnv[17] = "the one and twentieth to Yakhin, the two and twentieth to Gamul,";
hnv[18] = "the three and twentieth to Delayah, the four and twentieth to Ma`azyah.";
hnv[19] = "This was the ordering of them in their service, to come into the house of the LORD according to the ordinance [given] to them by Aharon their father, as the LORD, the God of Yisra\'el, had commanded him.";
hnv[20] = "Of the rest of the sons of Levi: of the sons of `Amram, Shuva\'el; of the sons of Shuva\'el, Yechdeyahu.";
hnv[21] = "Of Rechavyah: of the sons of Rechavyah, Yishshiyah the chief.";
hnv[22] = "Of the Izharites, Shelomit; of the sons of Shelomit, Yachat.";
hnv[23] = "The sons [of Hevron]: Yeriyahu [the chief], Amaryah the second, Yachazi\'el the third, Yekam`am the fourth.";
hnv[24] = "The sons of `Uzzi\'el, Mikhah; of the sons of Mikhah, Shamir.";
hnv[25] = "The brother of Mikhah, Yishshiyah; of the sons of Yishshiyah, Zekharyah.";
hnv[26] = "The sons of Merari: Machli and Mushi; the sons of Ya`aziyahu: Beno.";
hnv[27] = " The sons of Merari: of Ya`aziyahu, Beno, and Shoham, and Zakkur, and Ibri.";
hnv[28] = "Of Machli: El`azar, who had no sons.";
hnv[29] = "Of Kish; the sons of Kish: Yerachme\'el.";
hnv[30] = "The sons of Mushi: Machli, and `Eder, and Yerimot. These were the sons of the Levites after their fathers\' houses.";
hnv[31] = "These likewise cast lots even as their brothers the sons of Aharon in the presence of David the king, and Tzadok, and Achimelekh, and the heads of the fathers\' [houses] of the Kohanim and of the Levites; the fathers\' [houses] of the chief even as those of his younger brother.";
kjv[1] = "Now [these are] the divisions of the sons of Aaron. The sons of Aaron; Nadab, and Abihu, Eleazar, and Ithamar.";
kjv[2] = "But Nadab and Abihu died before their father, and had no children: therefore Eleazar and Ithamar executed the priest\'s office.";
kjv[3] = "And David distributed them, both Zadok of the sons of Eleazar, and Ahimelech of the sons of Ithamar, according to their offices in their service.";
kjv[4] = "And there were more chief men found of the sons of Eleazar than of the sons of Ithamar; and [thus] were they divided. Among the sons of Eleazar [there were] sixteen chief men of the house of [their] fathers, and eight among the sons of Ithamar according to the house of their fathers.";
kjv[5] = "Thus were they divided by lot, one sort with another; for the governors of the sanctuary, and governors [of the house] of God, were of the sons of Eleazar, and of the sons of Ithamar.";
kjv[6] = "And Shemaiah the son of Nethaneel the scribe, [one] of the Levites, wrote them before the king, and the princes, and Zadok the priest, and Ahimelech the son of Abiathar, and [before] the chief of the fathers of the priests and Levites: one principal household being taken for Eleazar, and [one] taken for Ithamar.";

kjv[12] = "The eleventh to Eliashib, the twelfth to Jakim,";

kjv[14] = "The fifteenth to Bilgah, the sixteenth to Immer,";

kjv[20] = "And the rest of the sons of Levi [were these]: Of the sons of Amram; Shubael: of the sons of Shubael; Jehdeiah.";
kjv[21] = "Concerning Rehabiah: of the sons of Rehabiah, the first [was] Isshiah.";
kjv[22] = "Of the Izharites; Shelomoth: of the sons of Shelomoth; Jahath.";
kjv[23] = "And the sons [of Hebron]; Jeriah [the first], Amariah the second, Jahaziel the third, Jekameam the fourth.";

kjv[25] = "The brother of Michah [was] Isshiah: of the sons of Isshiah; Zechariah.";

kjv[27] = "The sons of Merari by Jaaziah; Beno, and Shoham, and Zaccur, and Ibri.";

rsv[1] = "The divisions of the sons of Aaron were these. The sons of Aaron: Nadab, Abi\'hu, Elea\'zar, and Ith\'amar.";
rsv[2] = "But Nadab and Abi\'hu died before their father, and had no children, so Elea\'zar and Ith\'amar became the priests.";
rsv[3] = "With the help of Zadok of the sons of Elea\'zar, and Ahim\'elech of the sons of Ith\'amar, David organized them according to the appointed duties in their service.";
rsv[4] = "Since more chief men were found among the sons of Elea\'zar than among the sons of Ith\'amar, they organized them under sixteen heads of fathers\' houses of the sons of Elea\'zar, and eight of the sons of Ith\'amar.";
rsv[5] = "They organized them by lot, all alike, for there were officers of the sanctuary and officers of God among both the sons of Elea\'zar and the sons of Ith\'amar.";
rsv[6] = "And the scribe Shemai\'ah the son of Nethan\'el, a Levite, recorded them in the presence of the king, and the princes, and Zadok the priest, and Ahim\'elech the son of Abi\'athar, and the heads of the fathers\' houses of the priests and of the Levites; one father\'s house being chosen for Elea\'zar and one chosen for Ith\'amar.";
rsv[7] = "The first lot fell to Jehoi\'arib, the second to Jedai\'ah,";
rsv[8] = "the third to Harim, the fourth to Se-o\'rim,";
rsv[9] = "the fifth to Malchi\'jah, the sixth to Mij\'amin,";
rsv[10] = "the seventh to Hakkoz, the eighth to Abi\'jah,";
rsv[11] = "the ninth to Jeshua, the tenth to Shecani\'ah,";
rsv[12] = "the eleventh to Eli\'ashib, the twelfth to Jakim,";
rsv[13] = "the thirteenth to Huppah, the fourteenth to Jesheb\'e-ab,";
rsv[14] = "the fifteenth to Bilgah, the sixteenth to Immer,";
rsv[15] = "the seventeenth to Hezir, the eighteenth to Hap\'pizzez,";
rsv[16] = "the nineteenth to Pethahi\'ah, the twentieth to Jehez\'kel,";
rsv[17] = "the twenty-first to Jachin, the twenty-second to Gamul,";
rsv[18] = "the twenty-third to Delai\'ah, the twenty-fourth to Ma-azi\'ah.";
rsv[19] = "These had as their appointed duty in their service to come into the house of the LORD according to the procedure established for them by Aaron their father, as the LORD God of Israel had commanded him.";
rsv[20] = "And of the rest of the sons of Levi: of the sons of Amram, Shu\'ba-el; of the sons of Shu\'ba-el, Jehde\'iah.";
rsv[21] = "Of Rehabi\'ah: of the sons of Rehabi\'ah, Isshi\'ah the chief.";
rsv[22] = "Of the Iz\'harites, Shelo\'moth; of the sons of Shelo\'moth, Jahath.";
rsv[23] = "The sons of Hebron: Jeri\'ah the chief, Amari\'ah the second, Jaha\'ziel the third, Jekame\'am the fourth.";
rsv[24] = "The sons of Uz\'ziel, Micah; of the sons of Micah, Shamir.";
rsv[25] = "The brother of Micah, Isshi\'ah; of the sons of Isshi\'ah, Zechari\'ah.";
rsv[26] = "The sons of Merar\'i: Mahli and Mushi. The sons of Ja-azi\'ah: Beno.";
rsv[27] = "The sons of Merar\'i: of Ja-azi\'ah, Beno, Shoham, Zaccur, and Ibri.";
rsv[28] = "Of Mahli: Elea\'zar, who had no sons.";
rsv[29] = "Of Kish, the sons of Kish: Jerah\'meel.";
rsv[30] = "The sons of Mushi: Mahli, Eder, and Jer\'imoth. These were the sons of the Levites according to their fathers\' houses.";
rsv[31] = "These also, the head of each father\'s house and his younger brother alike, cast lots, just as their brethren the sons of Aaron, in the presence of King David, Zadok, Ahim\'elech, and the heads of fathers\' houses of the priests and of the Levites.";
vul[1] = "porro filiis Aaron hae partitiones erunt filii Aaron Nadab et Abiu et Eleazar et Ithamar";
vul[2] = "mortui sunt autem Nadab et Abiu ante patrem suum absque liberis sacerdotioque functus est Eleazar et Ithamar";
vul[3] = "et divisit eos David id est Sadoc de filiis Eleazar et Ahimelech de filiis Ithamar secundum vices suas et ministerium";
vul[4] = "inventique sunt multo plures filii Eleazar in principibus viris quam filii Ithamar divisit autem eis hoc est filiis Eleazar principes per familias sedecim et filiis Ithamar per familias et domos suas octo";
vul[5] = "porro divisit utrasque inter se familias sortibus erant enim principes sanctuarii et principes Dei tam de filiis Eleazar quam de filiis Ithamar";
vul[6] = "descripsitque eos Semeias filius Nathanahel scriba Levites coram rege et principibus et Sadoc sacerdote et Ahimelech filio Abiathar principibus quoque familiarum sacerdotalium et leviticarum unam domum quae ceteris praeerat Eleazar et alteram domum quae sub se habebat ceteros Ithamar";
vul[7] = "exivit autem sors prima Ioiarib secunda Iedeiae";
vul[8] = "tertia Arim quarta Seorim";
vul[9] = "quinta Melchia sexta Maiman";
vul[10] = "septima Accos octava Abia";
vul[11] = "nona Hiesu decima Sechenia";
vul[12] = "undecima Eliasib duodecima Iacim";
vul[13] = "tertiadecima Oppa quartadecima Isbaal";
vul[14] = "quintadecima Belga sextadecima Emmer";
vul[15] = "septimadecima Ezir octavadecima Hapses";
vul[16] = "nonadecima Phetheia vicesima Iezecel";
vul[17] = "vicesima prima Iachin vicesima secunda Gamul";
vul[18] = "vicesima tertia Dalaiau vicesima quarta Mazziau";
vul[19] = "hae vices eorum secundum ministeria sua ut ingrediantur domum Domini et iuxta ritum suum sub manu Aaron patris eorum sicut praecepit Dominus Deus Israhel";
vul[20] = "porro filiorum Levi qui reliqui fuerant de filiis Amram erat Subahel et filiis Subahel Iedeia";
vul[21] = "de filiis quoque Roobiae princeps Iesias";
vul[22] = "Isaaris vero Salemoth filiusque Salemoth Iaath";
vul[23] = "filiusque eius Ieriahu Amarias secundus Iazihel tertius Iecmaam quartus";
vul[24] = "filius Ozihel Micha filius Micha Samir";
vul[25] = "frater Micha Iesia filiusque Iesiae Zaccharias";
vul[26] = "filii Merari Mooli et Musi filius Ioziau Benno";
vul[27] = "filius quoque Merari Oziau et Soem et Zacchur et Hebri";
vul[28] = "porro Mooli filius Eleazar qui non habebat liberos";
vul[29] = "filius vero Cis Ierahemel";
vul[30] = "filii Musi Mooli Eder et Ierimoth isti filii Levi secundum domos familiarum suarum";
vul[31] = "miseruntque et ipsi sortes contra fratres suos filios Aaron coram David rege et Sadoc et Ahimelech et principibus familiarum sacerdotalium et leviticarum tam maiores quam minores omnes sors aequaliter dividebat";

web[29] = "Concerning Kish: the son of Kish [was] Jerahmeel.";
web[30] = "The sons also of Mushi; Mahli, and Eder, and Jerimoth. These [were] the sons of the Levites after the house of their fathers.";
web[31] = "These likewise cast lots over against their brethren the sons of Aaron in the presence of David the king, and Zadok, and Ahimelech, and the chief of the fathers of the priests and Levites, even the principal fathers over against their younger brethren.";
yng[1] = "And to the sons of Aaron [are] their courses: sons of Aaron [are] Nadab, and Abihu, Eleazar, and Ithamar,";
yng[2] = "and Nadab dieth, and Abihu, in the presence of their father, and they had no sons, and Eleazar and Ithamar act as priests.";
yng[3] = "And David distributeth them, and Zadok of the sons of Eleazar, and Ahimelech of the sons of Ithamar, according to their office in their service;";
yng[4] = "and there are found of the sons of Eleazar more for heads of the mighty men than of the sons of Ithamar; and they distribute them: Of the sons of Eleazar, heads for a house of fathers, sixteen; and of the sons of Ithamar, for a house of their fathers, eight.";
yng[5] = "And they distribute them, by lots, one with another, for princes of the sanctuary, and princes of God, have been of the sons of Eleazar, and of the sons of Ithamar.";
yng[6] = "And Shemaiah son of Nethaneel the scribe, of the Levites, writeth them before the king and the princes, and Zadok the priest, and Ahimelech son of Abiathar, and heads of the fathers, for priests and for Levites: one house of a father being taken possession of for Eleazar, and one being taken possession of for Ithamar.";
yng[7] = "And the first lot goeth out for Jehoiarib, for Jedaiah the second,";
yng[8] = "for Harim the third, for Seorim the fourth,";
yng[9] = "for Malchijah the fifth, for Mijamin the sixth,";
yng[10] = "for Hakkoz the seventh, for Abijah the eighth,";
yng[11] = "for Jeshuah the ninth, for Shecaniah the tenth,";
yng[12] = "for Eliashib the eleventh, for Jakim the twelfth,";
yng[13] = "for Huppah the thirteenth, for Jeshebeab the fourteenth,";
yng[14] = "for Bilgah the fifteenth, for Immer the sixteenth,";
yng[15] = "for Hezir the seventeenth, for Aphses the eighteenth,";
yng[16] = "for Pethahiah the nineteenth, for Jehezekel the twentieth,";
yng[17] = "for Jachin the one and twentieth, for Gamul the two and twentieth,";
yng[18] = "for Delaiah the three and twentieth, for Maaziah the four and twentieth.";
yng[19] = "These [are] their appointments for their service, to come in to the house of Jehovah, according to their ordinance by the hand of Aaron their father, as Jehovah God of Israel, commanded them.";
yng[20] = "And for the sons of Levi who are left: for sons of Amram, Shubael; for sons of Shubael: Jehdeiah.";
yng[21] = "For Rehabiah: for sons of Rehabiah, the head Ishshiah.";
yng[22] = "For the Izharite: Shelomoth; for sons of Shelomoth: Jahath.";
yng[23] = "And sons of Jeriah: Amariah the second, Jahaziel the third, Jekameam the fourth.";
yng[24] = "Sons of Uzziel: Michah; for sons of Michah: Shamir.";
yng[25] = "A brother of Michah [is] Ishshiah; for sons of Ishshiah: Zechariah;";
yng[26] = "sons of Merari: Mahli and Mushi; sons of Jaaziah: Beno;";
yng[27] = "sons of Merari: of Jaaziah: Beno, and Shoham, and Zaccur, and Ibri.";
yng[28] = "For Mahli: Eleazar, who had no sons;";
yng[29] = "for Kish: sons of Kish: Jerahmeel.";
yng[30] = "And sons of Mushi [are] Mahli, and Eder, and Jerimoth; these [are] sons of the Levites, for the house of their fathers,";
yng[31] = "and they cast, they also, lots over-against their brethren the sons of Aaron, before David the king, and Zadok, and Ahimelech, and heads of the fathers, for priests and for Levites; the chief father over-against his younger brother.";
csb[1] = "The divisions of the descendants of Aaron were as follows: Aaron\'s sons were Nadab, Abihu, Eleazar, and Ithamar.";
csb[2] = "But Nadab and Abihu died before their father, and they had no sons, so Eleazar and Ithamar served as priests.";
csb[3] = "Together with Zadok from the descendants of Eleazar and Ahimelech from the descendants of Ithamar, David divided them according to the assigned duties of their service.";
csb[4] = "Since more leaders were found among Eleazar\'s descendants than Ithamar\'s, they were divided accordingly: sixteen heads of ancestral families were from Eleazar\'s descendants, and eight heads of ancestral families were from Ithamar\'s.";
csb[5] = "They were assigned by lot, for there were officers of the sanctuary and officers of God among both Eleazar\'s and Ithamar\'s descendants.";
csb[6] = "The secretary, Shemaiah son of Nethanel, a Levite, recorded them in the presence of the king and the officers, the priest Zadok, Ahimelech son of Abiathar, and the heads of families of the priests and the Levites. One ancestral family was taken for Eleazar, and then one for Ithamar.";
csb[7] = "The first lot fell to Jehoiarib, the second to Jedaiah,";
csb[8] = "the third to Harim, the fourth to Seorim,";
csb[9] = "the fifth to Malchijah, the sixth to Mijamin,";
csb[10] = "the seventh to Hakkoz, the eighth to Abijah,";
csb[11] = "the ninth to Jeshua, the tenth to Shecaniah,";
csb[12] = "the eleventh to Eliashib, the twelfth to Jakim,";
csb[13] = "the thirteenth to Huppah, the fourteenth to Jeshebeab,";
csb[14] = "the fifteenth to Bilgah, the sixteenth to Immer,";
csb[15] = "the seventeenth to Hezir, the eighteenth to Happizzez,";
csb[16] = "the nineteenth to Pethahiah, the twentieth to Jehezkel,";
csb[17] = "the twenty-first to Jachin, the twenty-second to Gamul,";
csb[18] = "the twenty-third to Delaiah, and the twenty-fourth to Maaziah.";
csb[19] = "These had their assigned duties for service when they entered the LORD\'s temple, according to their regulations, which they received from their ancestor Aaron, as the LORD God of Israel had commanded him.";
csb[20] = "As for the rest of Levi\'s sons: from Amram\'s sons: Shubael; from Shubael\'s sons: Jehdeiah.";
csb[21] = "From Rehabiah: from Rehabiah\'s sons: Isshiah was the first.";
csb[22] = "From the Izharites: Shelomoth; from Shelomoth\'s sons: Jahath.";
csb[23] = "Hebron\'s sons: Jeriah the first, Amariah the second, Jahaziel the third, and Jekameam the fourth.";
csb[24] = "From Uzziel\'s sons: Micah; from Micah\'s sons: Shamir.";
csb[25] = "Micah\'s brother: Isshiah; from Isshiah\'s sons: Zechariah.";
csb[26] = "Merari\'s sons: Mahli and Mushi, and from his sons, Jaaziah his son.";
csb[27] = "Merari\'s sons, by his son Jaaziah: Shoham, Zaccur, and Ibri.";
csb[28] = "From Mahli: Eleazar, who had no sons.";
csb[29] = "From Kish, from Kish\'s sons: Jerahmeel.";
csb[30] = "Mushi\'s sons: Mahli, Eder, and Jerimoth. Those were the descendants of the Levites according to their ancestral families.";
csb[31] = "They also cast lots the same way as their relatives the descendants of Aaron did in the presence of King David, Zadok, Ahimelech, and the heads of the families of the priests and Levites -- the family heads and their younger brothers alike.";
</script>
