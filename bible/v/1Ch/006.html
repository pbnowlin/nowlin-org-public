asv[1] = "The sons of Levi: Gershon, Kohath, and Merari.";
asv[2] = "And the sons of Kohath: Amram, Izhar, and Hebron, and Uzziel.";
asv[3] = "And the children of Amram: Aaron, and Moses, and Miriam. And the sons of Aaron: Nadab, and Abihu, Eleazar, and Ithamar.";
asv[4] = "Eleazar begat Phinehas, Phinehas begat Abishua,";
asv[5] = "and Abishua begat Bukki, and Bukki begat Uzzi,";
asv[6] = "and Uzzi begat Zerahiah, and Zerahiah begat Meraioth,";
asv[7] = "Meraioth begat Amariah, and Amariah begat Ahitub,";
asv[8] = "and Ahitub begat Zadok, and Zadok begat Ahimaaz,";
asv[9] = "and Ahimaaz begat Azariah, and Azariah begat Johanan,";
asv[10] = "and Johanan begat Azariah (he it is that executed the priest\'s office in the house that Solomon built in Jerusalem),";
asv[11] = "and Azariah begat Amariah, and Amariah begat Ahitub,";
asv[12] = "and Ahitub begat Zadok, and Zadok begat Shallum,";
asv[13] = "and Shallum begat Hilkiah, and Hilkiah begat Azariah,";
asv[14] = "and Azariah begat Seraiah, and Seraiah begat Jehozadak;";
asv[15] = "And Jehozadak went [into captivity], when Jehovah carried away Judah and Jerusalem by the hand of Nebuchadnezzar.";
asv[16] = "The sons of Levi: Gershom, Kohath, and Merari.";
asv[17] = "And these are the names of the sons of Gershom: Libni and Shimei.";
asv[18] = "And the sons of Kohath were Amram, and Izhar, and Hebron, and Uzziel.";
asv[19] = "The sons of Merari: Mahli and Mushi. And these are the families of the Levites according to their fathers\' [houses].";
asv[20] = "Of Gershom: Libni his son, Jahath his son, Zimmah his son,";
asv[21] = "Joah his son, Iddo his son, Zerah his son, Jeatherai his son.";
asv[22] = "The sons of Kohath: Amminadab his son, Korah his son, Assir his son,";
asv[23] = "Elkanah his son, and Ebiasaph his son, and Assir his son,";
asv[24] = "Tahath his son, Uriel his son, Uzziah his son, and Shaul his son.";
asv[25] = "And the sons of Elkanah: Amasai, and Ahimoth.";
asv[26] = "As for Elkanah, the sons of Elkanah: Zophai his son, and Nahath his son,";
asv[27] = "Eliab his son, Jeroham his son, Elkanah his son.";
asv[28] = "And the sons of Samuel: the first-born, [Joel], and the second Abijah.";
asv[29] = "The sons of Merari: Mahli, Libni his son, Shimei his son, Uzzah his son,";
asv[30] = "Shimea his son, Haggiah his son, Asaiah his son.";
asv[31] = "And these are they whom David set over the service of song in the house of Jehovah, after that the ark had rest.";
asv[32] = "And they ministered with song before the tabernacle of the tent of meeting, until Solomon had built the house of Jehovah in Jerusalem: and they waited on their office according to their order.";
asv[33] = "And these are they that waited, and their sons. Of the sons of the Kohathites: Heman the singer, the son of Joel, the son of Samuel,";
asv[34] = "the son of Elkanah, the son of Jeroham, the son of Eliel, the son of Toah,";
asv[35] = "the son of Zuph, the son of Elkanah, the son of Mahath, the son of Amasai,";
asv[36] = "the son of Elkanah, the son of Joel, the son of Azariah, the son of Zephaniah,";
asv[37] = "the son of Tahath, the son of Assir, the son of Ebiasaph, the son of Korah,";
asv[38] = "the son of Izhar, the son of Kohath, the son of Levi, the son of Israel.";
asv[39] = "And his brother Asaph, who stood on his right hand, even Asaph the son of Berechiah, the son of Shimea,";
asv[40] = "the son of Michael, the son of Baaseiah, the son of Malchijah,";
asv[41] = "the son of Ethni, the son of Zerah, the son of Adaiah,";
asv[42] = "the son of Ethan, the son of Zimmah, the son of Shimei,";
asv[43] = "the son of Jahath, the son of Gershom, the son of Levi.";
asv[44] = "And on the left hand their brethren the sons of Merari: Ethan the son of Kishi, the son of Abdi, the son of Malluch,";
asv[45] = "the son of Hashabiah, the son of Amaziah, the son of Hilkiah,";
asv[46] = "the son of Amzi, the son of Bani, the son of Shemer,";
asv[47] = "the son of Mahli, the son of Mushi, the son of Merari, the son of Levi.";
asv[48] = "And their brethren the Levites were appointed for all the service of the tabernacle of the house of God.";
asv[49] = "But Aaron and his sons offered upon the altar of burnt-offering, and upon the altar of incense, for all the work of the most holy place, and to make atonement for Israel, according to all that Moses the servant of God had commanded.";
asv[50] = "And these are the sons of Aaron: Eleazar his son, Phinehas his son, Abishua his son,";
asv[51] = "Bukki his son, Uzzi his son, Zerahiah his son,";
asv[52] = "Meraioth his son, Amariah his son, Ahitub his son,";
asv[53] = "Zadok his son, Ahimaaz his son.";
asv[54] = "Now these are their dwelling-places according to their encampments in their borders: to the sons of Aaron, of the families of the Kohathites (for theirs was the [first] lot),";
asv[55] = "to them they gave Hebron in the land of Judah, and the suburbs thereof round about it;";
asv[56] = "but the fields of the city, and the villages thereof, they gave to Caleb the son of Jephunneh.";
asv[57] = "And to the sons of Aaron they gave the cities of refuge, Hebron; Libnah also with its suburbs, and Jattir, and Eshtemoa with its suburbs,";
asv[58] = "and Hilen with its suburbs, Debir with its suburbs,";
asv[59] = "and Ashan with its suburbs, and Beth-shemesh with its suburbs;";
asv[60] = "and out of the tribe of Benjamin, Geba with its suburbs, and Allemeth with its suburbs, and Anathoth with its suburbs. All their cities throughout their families were thirteen cities.";
asv[61] = "And unto the rest of the sons of Kohath [were given] by lot, out of the family of the tribe, out of the half-tribe, the half of Manasseh, ten cities.";
asv[62] = "And to the sons of Gershom, according to their families, out of the tribe of Issachar, and out of the tribe of Asher, and out of the tribe of Naphtali, and out of the tribe of Manasseh in Bashan, thirteen cities.";
asv[63] = "Unto the sons of Merari [were given] by lot, according to their families, out of the tribe of Reuben, and out of the tribe of Gad, and out of the tribe of Zebulun, twelve cities.";
asv[64] = "And the children of Israel gave to the Levites the cities with their suburbs.";
asv[65] = "And they gave by lot out of the tribe of the children of Judah, and out of the tribe of the children of Simeon, and out of the tribe of the children of Benjamin, these cities which are mentioned by name.";
asv[66] = "And some of the families of the sons of Kohath had cities of their borders out of the tribe of Ephraim.";
asv[67] = "And they gave unto them the cities of refuge, Shechem in the hill-country of Ephraim with its suburbs; Gezer also with its suburbs,";
asv[68] = "and Jokmeam with its suburbs, and Beth-horon with its suburbs,";
asv[69] = "and Aijalon with its suburbs, and Gath-rimmon with its suburbs;";
asv[70] = "and out of the half-tribe of Manasseh, Aner with its suburbs, and Bileam with its suburbs, for the rest of the family of the sons of Kohath.";
asv[71] = "Unto the sons of Gershom [were given], out of the family of the half-tribe of Manasseh, Golan in Bashan with its suburbs, and Ashtaroth with its suburbs;";
asv[72] = "and out of the tribe of Issachar, Kedesh with its suburbs, Daberath with its suburbs,";
asv[73] = "and Ramoth with its suburbs, and Anem with its suburbs;";
asv[74] = "and out of the tribe of Asher, Mashal with its suburbs, and Abdon with its suburbs,";
asv[75] = "and Hukok with its suburbs, and Rehob with its suburbs;";
asv[76] = "and out of the tribe of Naphtali, Kedesh in Galilee with its suburbs, and Hammon with its suburbs, and Kiriathaim with its suburbs.";
asv[77] = "Unto the rest of [the Levites], the sons of Merari, [were given], out of the tribe of Zebulun, Rimmono with its suburbs, Tabor with its suburbs;";
asv[78] = "and beyond the Jordan at Jericho, on the east side of the Jordan, [were given them], out of the tribe of Reuben, Bezer in the wilderness with its suburbs, and Jahzah with its suburbs,";
asv[79] = "and Kedemoth with its suburbs, and Mephaath with its suburbs;";
asv[80] = "and out of the tribe of Gad, Ramoth in Gilead with its suburbs, and Mahanaim with its suburbs,";
asv[81] = "and Heshbon with its suburbs, and Jazer with its suburbs.";

hnv[1] = "The sons of Levi: Gershon, Kehat, and Merari.";
hnv[2] = "The sons of Kehat: `Amram, Yitzhar, and Hevron, and `Uzzi\'el.";
hnv[3] = "The children of `Amram: Aharon, and Moshe, and Miryam. The sons of Aharon: Nadav, and Avihu, El`azar, and Itamar.";
hnv[4] = "El`azar became the father of Pinechas, Pinechas became the father of Avishua,";
hnv[5] = "and Avishua became the father of Bukki, and Bukki became the father of `Uzzi,";
hnv[6] = " and `Uzzi became the father of Zerachyah, and Zerachyah became the father of Merayot,";
hnv[7] = "Merayot became the father of Amaryah, and Amaryah became the father of Achituv,";
hnv[8] = "and Achituv became the father of Tzadok, and Tzadok became the father of Achima`atz,";
hnv[9] = "and Achima`atz became the father of `Azaryah, and `Azaryah became the father of Yochanan,";
hnv[10] = "and Yochanan became the father of `Azaryah, (he it is who executed the Kohen\'s office in the house that Shlomo built in Yerushalayim),";
hnv[11] = "and `Azaryah became the father of Amaryah, and Amaryah became the father of Achituv,";
hnv[12] = "and Achituv became the father of Tzadok, and Tzadok became the father of Shallum,";
hnv[13] = "and Shallum became the father of Hilkiyah, and Hilkiyah became the father of `Azaryah,";
hnv[14] = "and `Azaryah became the father of Serayah, and Serayah became the father of Yehotzadak;";
hnv[15] = "Yehotzadak went [into captivity], when the LORD carried away Yehudah and Yerushalayim by the hand of Nevukhadnetztzar.";
hnv[16] = "The sons of Levi: Gershom, Kehat, and Merari.";
hnv[17] = "These are the names of the sons of Gershom: Livni and Shim`i.";
hnv[18] = "The sons of Kehat were `Amram, and Yitzhar, and Hevron, and `Uzzi\'el.";
hnv[19] = "The sons of Merari: Machli and Mushi. These are the families of the Levites according to their fathers\' [houses].";
hnv[20] = "Of Gershom: Livni his son, Yachat his son, Zimmah his son,";
hnv[21] = "Yo\'ach his son, `Iddo his son, Zerach his son, Ye\'aterai his son.";
hnv[22] = "The sons of Kehat: `Amminadav his son, Korach his son, Assir his son,";
hnv[23] = "Elkana his son, and Avi\'asaf his son, and Assir his son,";
hnv[24] = "Tachat his son, Uri\'el his son, `Uzziyah his son, and Sha\'ul his son.";
hnv[25] = "The sons of Elkana: `Amasai, and Achimot.";
hnv[26] = "As for Elkana, the sons of Elkana: Tzafai his son, and Nachat his son,";
hnv[27] = "Eli\'av his son, Yerocham his son, Elkana his son.";
hnv[28] = "The sons of Shemu\'el: the firstborn [Yo\'el], and the second Aviyah.";
hnv[29] = "The sons of Merari: Machli, Livni his son, Shim`i his son, Uzzah his son,";
hnv[30] = "Shim`a his son, Haggiyah his son, `Asayah his son.";
hnv[31] = "These are they whom David set over the service of song in the house of the LORD, after that the ark had rest.";
hnv[32] = "They ministered with song before the tent of the tent of meeting, until Shlomo had built the house of the LORD in Yerushalayim: and they waited on their office according to their order.";
hnv[33] = "These are those who waited, and their sons. Of the sons of the Kehati: Heman the singer, the son of Yo\'el, the son of Shemu\'el,";
hnv[34] = "the son of Elkana, the son of Yerocham, the son of Eli\'el, the son of To\'ach,";
hnv[35] = "the son of Tzuf, the son of Elkana, the son of Machat, the son of `Amasai,";
hnv[36] = "the son of Elkana, the son of Yo\'el, the son of `Azaryah, the son of Tzefanyah,";
hnv[37] = "the son of Tachat, the son of Assir, the son of Avi\'asaf, the son of Korach,";
hnv[38] = "the son of Yitzhar, the son of Kehat, the son of Levi, the son of Yisra\'el.";
hnv[39] = "His brother Asaf, who stood on his right hand, even Asaf the son of Berekhyah, the son of Shim`a,";
hnv[40] = "the son of Mikha\'el, the son of Ba`aseyah, the son of Malkiyah,";
hnv[41] = "the son of Etni, the son of Zerach, the son of `Adayah,";
hnv[42] = "the son of Etan, the son of Zimmah, the son of Shim`i,";
hnv[43] = "the son of Yachat, the son of Gershom, the son of Levi.";
hnv[44] = " On the left hand their brothers the sons of Merari: Etan the son of Kishi, the son of `Avdi, the son of Mallukh,";
hnv[45] = "the son of Hashavyah, the son of Amatzyah, the son of Hilkiyah,";
hnv[46] = "the son of Amtzi, the son of Bani, the son of Shemer,";
hnv[47] = "the son of Machli, the son of Mushi, the son of Merari, the son of Levi.";
hnv[48] = "Their brothers the Levites were appointed for all the service of the tent of the house of God.";
hnv[49] = "But Aharon and his sons offered on the altar of burnt offering, and on the altar of incense, for all the work of the most holy place, and to make atonement for Yisra\'el, according to all that Moshe the servant of God had commanded.";
hnv[50] = "These are the sons of Aharon: El`azar his son, Pinechas his son, Avishua his son,";
hnv[51] = " Bukki his son, `Uzzi his son, Zerachyah his son,";
hnv[52] = "Merayot his son, Amaryah his son, Achituv his son,";
hnv[53] = "Tzadok his son, Achima`atz his son.";
hnv[54] = "Now these are their dwelling-places according to their encampments in their borders: to the sons of Aharon, of the families of the Kehati (for theirs was the [first] lot),";
hnv[55] = " to them they gave Hevron in the land of Yehudah, and the suburbs of it round about it;";
hnv[56] = "but the fields of the city, and the villages of it, they gave to Kalev the son of Yefunneh.";
hnv[57] = "To the sons of Aharon they gave the cities of refuge, Hevron; Livna also with its suburbs, and Yattir, and Eshtemoa with its suburbs,";
hnv[58] = "and Hilen with its suburbs, Devir with its suburbs,";
hnv[59] = "and `Ashan with its suburbs, and Beth-shemesh with its suburbs;";
hnv[60] = "and out of the tribe of Binyamin, Geva with its suburbs, and `Allemet with its suburbs, and `Anatot with its suburbs. All their cities throughout their families were thirteen cities.";
hnv[61] = "To the rest of the sons of Kehat [were given] by lot, out of the family of the tribe, out of the half-tribe, the half of Menashsheh, ten cities.";
hnv[62] = "To the sons of Gershom, according to their families, out of the tribe of Yissakhar, and out of the tribe of Asher, and out of the tribe of Naftali, and out of the tribe of Menashsheh in Bashan, thirteen cities.";
hnv[63] = "To the sons of Merari [were given] by lot, according to their families, out of the tribe of Re\'uven, and out of the tribe of Gad, and out of the tribe of Zevulun, twelve cities.";
hnv[64] = "The children of Yisra\'el gave to the Levites the cities with their suburbs.";
hnv[65] = "They gave by lot out of the tribe of the children of Yehudah, and out of the tribe of the children of Shim`on, and out of the tribe of the children of Binyamin, these cities which are mentioned by name.";
hnv[66] = "Some of the families of the sons of Kehat had cities of their borders out of the tribe of Efrayim.";
hnv[67] = "They gave to them the cities of refuge, Shekhem in the hill-country of Efrayim with its suburbs; Gezer also with its suburbs,";
hnv[68] = "and Yokme`am with its suburbs, and Beit-Horon with its suburbs,";
hnv[69] = "and Ayalon with its suburbs, and Gath-rimmon with its suburbs;";
hnv[70] = "and out of the half-tribe of Menashsheh, `Aner with its suburbs, and Bil`am with its suburbs, for the rest of the family of the sons of Kehat.";
hnv[71] = "To the sons of Gershom [were given], out of the family of the half-tribe of Menashsheh, Galon in Bashan with its suburbs, and `Ashtarot with its suburbs;";
hnv[72] = "and out of the tribe of Yissakhar, Kedesh with its suburbs, Daverat with its suburbs,";
hnv[73] = "and Ramot with its suburbs, and `Anam with its suburbs;";
hnv[74] = "and out of the tribe of Asher, Mashal with its suburbs, and `Avdon with its suburbs,";
hnv[75] = "and Hukok with its suburbs, and Rechov with its suburbs;";
hnv[76] = " and out of the tribe of Naftali, Kedesh in the Galil with its suburbs, and Hammon with its suburbs, and Kiryatayim with its suburbs.";
hnv[77] = "To the rest of [the Levites], the sons of Merari, [were given], out of the tribe of Zevulun, Rimmono with its suburbs, Tavor with its suburbs;";
hnv[78] = "and beyond the Yarden at Yericho, on the east side of the Yarden, [were given them], out of the tribe of Re\'uven, Betzer in the wilderness with its suburbs, and Yahtzah with its suburbs,";
hnv[79] = "and Kedemot with its suburbs, and Mefa`at with its suburbs;";
hnv[80] = "and out of the tribe of Gad, Ramot in Gil`ad with its suburbs, and Machanayim with its suburbs,";
hnv[81] = "and Heshbon with its suburbs, and Ya`zer with its suburbs.";
kjv[1] = "And the sons of Kohath [were], Amram, and Izhar, and Hebron, and Uzziel.";
kjv[2] = "The sons of Merari; Mahli, and Mushi. And these [are] the families of the Levites according to their fathers.";
kjv[3] = "Of Gershom; Libni his son, Jahath his son, Zimmah his son,";
kjv[4] = "Joah his son, Iddo his son, Zerah his son, Jeaterai his son.";
kjv[5] = "The sons of Kohath; Amminadab his son, Korah his son, Assir his son,";
kjv[6] = "Elkanah his son, and Ebiasaph his son, and Assir his son,";
kjv[7] = "Tahath his son, Uriel his son, Uzziah his son, and Shaul his son.";
kjv[8] = "And the sons of Elkanah; Amasai, and Ahimoth.";
kjv[9] = "[As for] Elkanah: the sons of Elkanah; Zophai his son, and Nahath his son,";
kjv[10] = "Eliab his son, Jeroham his son, Elkanah his son.";
kjv[11] = "And the sons of Samuel; the firstborn Vashni, and Abiah.";
kjv[12] = "The sons of Merari; Mahli, Libni his son, Shimei his son, Uzza his son,";
kjv[13] = "Shimea his son, Haggiah his son, Asaiah his son.";
kjv[14] = "And these [are they] whom David set over the service of song in the house of the LORD, after that the ark had rest.";
kjv[15] = "And they ministered before the dwelling place of the tabernacle of the congregation with singing, until Solomon had built the house of the LORD in Jerusalem: and [then] they waited on their office according to their order.";
kjv[16] = "And these [are] they that waited with their children. Of the sons of the Kohathites: Heman a singer, the son of Joel, the son of Shemuel,";
kjv[17] = "The son of Elkanah, the son of Jeroham, the son of Eliel, the son of Toah,";
kjv[18] = "The son of Zuph, the son of Elkanah, the son of Mahath, the son of Amasai,";
kjv[19] = "The son of Elkanah, the son of Joel, the son of Azariah, the son of Zephaniah,";
kjv[20] = "The son of Tahath, the son of Assir, the son of Ebiasaph, the son of Korah,";
kjv[21] = "The son of Izhar, the son of Kohath, the son of Levi, the son of Israel.";
kjv[22] = "And his brother Asaph, who stood on his right hand, [even] Asaph the son of Berachiah, the son of Shimea,";
kjv[23] = "The son of Michael, the son of Baaseiah, the son of Malchiah,";
kjv[24] = "The son of Ethni, the son of Zerah, the son of Adaiah,";
kjv[25] = "The son of Ethan, the son of Zimmah, the son of Shimei,";
kjv[26] = "The son of Jahath, the son of Gershom, the son of Levi.";
kjv[27] = "And their brethren the sons of Merari [stood] on the left hand: Ethan the son of Kishi, the son of Abdi, the son of Malluch,";
kjv[28] = "The son of Hashabiah, the son of Amaziah, the son of Hilkiah,";
kjv[29] = "The son of Amzi, the son of Bani, the son of Shamer,";
kjv[30] = "The son of Mahli, the son of Mushi, the son of Merari, the son of Levi.";
kjv[31] = "Their brethren also the Levites [were] appointed unto all manner of service of the tabernacle of the house of God.";
kjv[32] = "But Aaron and his sons offered upon the altar of the burnt offering, and on the altar of incense, [and were appointed] for all the work of the [place] most holy, and to make an atonement for Israel, according to all that Moses the servant of God had commanded.";
kjv[33] = "And these [are] the sons of Aaron; Eleazar his son, Phinehas his son, Abishua his son,";
kjv[34] = "Bukki his son, Uzzi his son, Zerahiah his son,";
kjv[35] = "Meraioth his son, Amariah his son, Ahitub his son,";
kjv[36] = "Zadok his son, Ahimaaz his son.";
kjv[37] = "Now these [are] their dwelling places throughout their castles in their coasts, of the sons of Aaron, of the families of the Kohathites: for theirs was the lot.";
kjv[38] = "And they gave them Hebron in the land of Judah, and the suburbs thereof round about it.";
kjv[39] = "But the fields of the city, and the villages thereof, they gave to Caleb the son of Jephunneh.";
kjv[40] = "And to the sons of Aaron they gave the cities of Judah, [namely], Hebron, [the city] of refuge, and Libnah with her suburbs, and Jattir, and Eshtemoa, with their suburbs,";
kjv[41] = "And Hilen with her suburbs, Debir with her suburbs,";
kjv[42] = "And Ashan with her suburbs, and Bethshemesh with her suburbs:";
kjv[43] = "And out of the tribe of Benjamin; Geba with her suburbs, and Alemeth with her suburbs, and Anathoth with her suburbs. All their cities throughout their families [were] thirteen cities.";
kjv[44] = "And unto the sons of Kohath, [which were] left of the family of that tribe, [were cities given] out of the half tribe, [namely, out of] the half [tribe] of Manasseh, by lot, ten cities.";
kjv[45] = "And to the sons of Gershom throughout their families out of the tribe of Issachar, and out of the tribe of Asher, and out of the tribe of Naphtali, and out of the tribe of Manasseh in Bashan, thirteen cities.";
kjv[46] = "Unto the sons of Merari [were given] by lot, throughout their families, out of the tribe of Reuben, and out of the tribe of Gad, and out of the tribe of Zebulun, twelve cities.";
kjv[47] = "And the children of Israel gave to the Levites [these] cities with their suburbs.";
kjv[48] = "And they gave by lot out of the tribe of the children of Judah, and out of the tribe of the children of Simeon, and out of the tribe of the children of Benjamin, these cities, which are called by [their] names.";
kjv[49] = "And [the residue] of the families of the sons of Kohath had cities of their coasts out of the tribe of Ephraim.";
kjv[50] = "And they gave unto them, [of] the cities of refuge, Shechem in mount Ephraim with her suburbs; [they gave] also Gezer with her suburbs,";
kjv[51] = "And Jokmeam with her suburbs, and Bethhoron with her suburbs,";
kjv[52] = "And Aijalon with her suburbs, and Gathrimmon with her suburbs:";
kjv[53] = "And out of the half tribe of Manasseh; Aner with her suburbs, and Bileam with her suburbs, for the family of the remnant of the sons of Kohath.";
kjv[54] = "Unto the sons of Gershom [were given] out of the family of the half tribe of Manasseh, Golan in Bashan with her suburbs, and Ashtaroth with her suburbs:";
kjv[55] = "And out of the tribe of Issachar; Kedesh with her suburbs, Daberath with her suburbs,";
kjv[56] = "And Ramoth with her suburbs, and Anem with her suburbs:";
kjv[57] = "And out of the tribe of Asher; Mashal with her suburbs, and Abdon with her suburbs,";
kjv[58] = "And Hukok with her suburbs, and Rehob with her suburbs:";
kjv[59] = "And out of the tribe of Naphtali; Kedesh in Galilee with her suburbs, and Hammon with her suburbs, and Kirjathaim with her suburbs.";
kjv[60] = "Unto the rest of the children of Merari [were given] out of the tribe of Zebulun, Rimmon with her suburbs, Tabor with her suburbs:";
kjv[61] = "And on the other side Jordan by Jericho, on the east side of Jordan, [were given them] out of the tribe of Reuben, Bezer in the wilderness with her suburbs, and Jahzah with her suburbs,";
kjv[62] = "Kedemoth also with her suburbs, and Mephaath with her suburbs:";
kjv[63] = "And out of the tribe of Gad; Ramoth in Gilead with her suburbs, and Mahanaim with her suburbs,";
kjv[64] = "And Heshbon with her suburbs, and Jazer with her suburbs.";
kjv[65] = "The sons of Levi; Gershon, Kohath, and Merari.";
kjv[66] = "And the sons of Kohath; Amram, Izhar, and Hebron, and Uzziel.";
kjv[67] = "And the children of Amram; Aaron, and Moses, and Miriam. The sons also of Aaron; Nadab, and Abihu, Eleazar, and Ithamar.";
kjv[68] = "Eleazar begat Phinehas, Phinehas begat Abishua,";
kjv[69] = "And Abishua begat Bukki, and Bukki begat Uzzi,";
kjv[70] = "And Uzzi begat Zerahiah, and Zerahiah begat Meraioth,";
kjv[71] = "Meraioth begat Amariah, and Amariah begat Ahitub,";
kjv[72] = "And Ahitub begat Zadok, and Zadok begat Ahimaaz,";
kjv[73] = "And Ahimaaz begat Azariah, and Azariah begat Johanan,";
kjv[74] = "And Johanan begat Azariah, (he [it is] that executed the priest\'s office in the temple that Solomon built in Jerusalem:)";
kjv[75] = "And Azariah begat Amariah, and Amariah begat Ahitub,";
kjv[76] = "And Ahitub begat Zadok, and Zadok begat Shallum,";
kjv[77] = "And Shallum begat Hilkiah, and Hilkiah begat Azariah,";
kjv[78] = "And Azariah begat Seraiah, and Seraiah begat Jehozadak,";
kjv[79] = "And Jehozadak went [into captivity], when the LORD carried away Judah and Jerusalem by the hand of Nebuchadnezzar.";
kjv[80] = "The sons of Levi; Gershom, Kohath, and Merari.";
kjv[81] = "And these [be] the names of the sons of Gershom; Libni, and Shimei.";
rsv[1] = "The sons of Levi: Gershom, Kohath, and Merar\'i.";
rsv[2] = "The sons of Kohath: Amram, Izhar, Hebron, and Uz\'ziel.";
rsv[3] = "The children of Amram: Aaron, Moses, and Miriam. The sons of Aaron: Nadab, Abi\'hu, Elea\'zar, and Ith\'amar.";
rsv[4] = "Elea\'zar was the father of Phin\'ehas, Phin\'ehas of Abishu\'a,";
rsv[5] = "Abishu\'a of Bukki, Bukki of Uzzi,";
rsv[6] = "Uzzi of Zerahi\'ah, Zerahi\'ah of Merai\'oth,";
rsv[7] = "Merai\'oth of Amari\'ah, Amari\'ah of Ahi\'tub,";
rsv[8] = "Ahi\'tub of Zadok, Zadok of Ahim\'a-az,";
rsv[9] = "Ahim\'a-az of Azari\'ah, Azari\'ah of Joha\'nan,";
rsv[10] = "and Joha\'nan of Azari\'ah (it was he who served as priest in the house that Solomon built in Jerusalem).";
rsv[11] = "Azari\'ah was the father of Amari\'ah, Amari\'ah of Ahi\'tub,";
rsv[12] = "Ahi\'tub of Zadok, Zadok of Shallum,";
rsv[13] = "Shallum of Hilki\'ah, Hilki\'ah of Azari\'ah,";
rsv[14] = "Azari\'ah of Serai\'ah, Serai\'ah of Jehoz\'adak;";
rsv[15] = "and Jehoz\'adak went into exile when the LORD sent Judah and Jerusalem into exile by the hand of Nebuchadnez\'zar.";
rsv[16] = "The sons of Levi: Gershom, Kohath, and Merar\'i.";
rsv[17] = "And these are the names of the sons of Gershom: Libni and Shim\'e-i.";
rsv[18] = "The sons of Kohath: Amram, Izhar, Hebron, and Uz\'ziel.";
rsv[19] = "The sons of Merar\'i: Mahli and Mushi. These are the families of the Levites according to their fathers.";
rsv[20] = "Of Gershom: Libni his son, Jahath his son, Zimmah his son,";
rsv[21] = "Jo\'ah his son, Iddo his son, Zerah his son, Je-ath\'erai his son.";
rsv[22] = "The sons of Kohath: Ammin\'adab his son, Korah his son, Assir his son,";
rsv[23] = "Elka\'nah his son, Ebi\'asaph his son, Assir his son,";
rsv[24] = "Tahath his son, Uri\'el his son, Uzzi\'ah his son, and Sha\'ul his son.";
rsv[25] = "The sons of Elka\'nah: Ama\'sai and Ahi\'moth,";
rsv[26] = "Elka\'nah his son, Zophai his son, Nahath his son,";
rsv[27] = "Eli\'ab his son, Jero\'ham his son, Elka\'nah his son.";
rsv[28] = "The sons of Samuel: Jo\'el his first-born, the second Abi\'jah.";
rsv[29] = "The sons of Merar\'i: Mahli, Libni his son, Shim\'e-i his son, Uzzah his son,";
rsv[30] = "Shim\'e-a his son, Haggi\'ah his son, and Asai\'ah his son.";
rsv[31] = "These are the men whom David put in charge of the service of song in the house of the LORD, after the ark rested there.";
rsv[32] = "They ministered with song before the tabernacle of the tent of meeting, until Solomon had built the house of the LORD in Jerusalem; and they performed their service in due order.";
rsv[33] = "These are the men who served and their sons. Of the sons of the Ko\'hathites: Heman the singer the son of Jo\'el, son of Samuel,";
rsv[34] = "son of Elka\'nah, son of Jero\'ham, son of Eli\'el, son of To\'ah,";
rsv[35] = "son of Zuph, son of Elka\'nah, son of Mahath, son of Ama\'sai,";
rsv[36] = "son of Elka\'nah, son of Jo\'el, son of Azari\'ah, son of Zephani\'ah,";
rsv[37] = "son of Tahath, son of Assir, son of Ebi\'asaph, son of Korah,";
rsv[38] = "son of Izhar, son of Kohath, son of Levi, son of Israel;";
rsv[39] = "and his brother Asaph, who stood on his right hand, namely, Asaph the son of Berechi\'ah, son of Shim\'e-a,";
rsv[40] = "son of Michael, son of Ba-ase\'iah, son of Malchi\'jah,";
rsv[41] = "son of Ethni, son of Zerah, son of Adai\'ah,";
rsv[42] = "son of Ethan, son of Zimmah, son of Shim\'e-i,";
rsv[43] = "son of Jahath, son of Gershom, son of Levi.";
rsv[44] = "On the left hand were their brethren the sons of Merar\'i: Ethan the son of Kishi, son of Abdi, son of Malluch,";
rsv[45] = "son of Hashabi\'ah, son of Amazi\'ah, son of Hilki\'ah,";
rsv[46] = "son of Amzi, son of Bani, son of Shemer,";
rsv[47] = "son of Mahli, son of Mushi, son of Merar\'i, son of Levi;";
rsv[48] = "and their brethren the Levites were appointed for all the service of the tabernacle of the house of God.";
rsv[49] = "But Aaron and his sons made offerings upon the altar of burnt offering and upon the altar of incense for all the work of the most holy place, and to make atonement for Israel, according to all that Moses the servant of God had commanded.";
rsv[50] = "These are the sons of Aaron: Elea\'zar his son, Phin\'ehas his son, Abishu\'a his son,";
rsv[51] = "Bukki his son, Uzzi his son, Zerahi\'ah his son,";
rsv[52] = "Merai\'oth his son, Amari\'ah his son, Ahi\'tub his son,";
rsv[53] = "Zadok his son, Ahim\'a-az his son.";
rsv[54] = "These are their dwelling places according to their settlements within their borders: to the sons of Aaron of the families of Ko\'hathites, for theirs was the lot,";
rsv[55] = "to them they gave Hebron in the land of Judah and its surrounding pasture lands,";
rsv[56] = "but the fields of the city and its villages they gave to Caleb the son of Jephun\'neh.";
rsv[57] = "To the sons of Aaron they gave the cities of refuge: Hebron, Libnah with its pasture lands, Jattir, Eshtemo\'a with its pasture lands,";
rsv[58] = "Hilen with its pasture lands, Debir with its pasture lands,";
rsv[59] = "Ashan with its pasture lands, and Beth-she\'mesh with its pasture lands;";
rsv[60] = "and from the tribe of Benjamin, Geba with its pasture lands, Al\'emeth with its pasture lands, and An\'athoth with its pasture lands. All their cities throughout their families were thirteen.";
rsv[61] = "To the rest of the Ko\'hathites were given by lot out of the family of the tribe, out of the half-tribe, the half of Manas\'seh, ten cities.";
rsv[62] = "To the Gershomites according to their families were allotted thirteen cities out of the tribes of Is\'sachar, Asher, Naph\'tali, and Manas\'seh in Bashan.";
rsv[63] = "To the Merar\'ites according to their families were allotted twelve cities out of the tribes of Reuben, Gad, and Zeb\'ulun.";
rsv[64] = "So the people of Israel gave the Levites the cities with their pasture lands.";
rsv[65] = "They also gave them by lot out of the tribes of Judah, Simeon, and Benjamin these cities which are mentioned by name.";
rsv[66] = "And some of the families of the sons of Kohath had cities of their territory out of the tribe of E\'phraim.";
rsv[67] = "They were given the cities of refuge: Shechem with its pasture lands in the hill country of E\'phraim, Gezer with its pasture lands,";
rsv[68] = "Jok\'me-am with its pasture lands, Beth-hor\'on with its pasture lands,";
rsv[69] = "Ai\'jalon with its pasture lands, Gath-rim\'mon with its pasture lands,";
rsv[70] = "and out of the half-tribe of Manas\'seh, Aner with its pasture lands, and Bil\'e-am with its pasture lands, for the rest of the families of the Ko\'hathites.";
rsv[71] = "To the Gershomites were given out of the half-tribe of Manas\'seh: Golan in Bashan with its pasture lands and Ash\'taroth with its pasture lands;";
rsv[72] = "and out of the tribe of Is\'sachar: Kedesh with its pasture lands, Dab\'erath with its pasture lands,";
rsv[73] = "Ramoth with its pasture lands, and Anem with its pasture lands;";
rsv[74] = "out of the tribe of Asher: Mashal with its pasture lands, Abdon with its pasture lands,";
rsv[75] = "Hukok with its pasture lands, and Rehob with its pasture lands;";
rsv[76] = "and out of the tribe of Naph\'tali: Kedesh in Galilee with its pasture lands, Ham\'mon with its pasture lands, and Kiriatha\'im with its pasture lands.";
rsv[77] = "To the rest of the Merar\'ites were allotted out of the tribe of Zeb\'ulun: Rim\'mono with its pasture lands, Tabor with its pasture lands,";
rsv[78] = "and beyond the Jordan at Jericho, on the east side of the Jordan, out of the tribe of Reuben: Bezer in the steppe with its pasture lands, Jahzah with its pasture lands,";
rsv[79] = "Ked\'emoth with its pasture lands, and Meph\'a-ath with its pasture lands;";
rsv[80] = "and out of the tribe of Gad: Ramoth in Gilead with its pasture lands, Mahana\'im with its pasture lands,";
rsv[81] = "Heshbon with its pasture lands, and Jazer with its pasture lands.";
vul[1] = "filii Levi Gersom Caath Merari";
vul[2] = "filii Caath Amram Isaar Hebron et Ozihel";
vul[3] = "filii Amram Aaron Moses et Maria filii Aaron Nadab et Abiu Eleazar et Ithamar";
vul[4] = "Eleazar genuit Finees et Finees genuit Abisue";
vul[5] = "Abisue vero genuit Bocci et Bocci genuit Ozi";
vul[6] = "Ozi genuit Zaraiam et Zaraias genuit Meraioth";
vul[7] = "porro Meraioth genuit Amariam et Amarias genuit Ahitob";
vul[8] = "Ahitob genuit Sadoc Sadoc genuit Achimaas";
vul[9] = "Achimaas genuit Azariam Azarias genuit Iohanan";
vul[10] = "Iohanan genuit Azariam ipse est qui sacerdotio functus est in domo quam aedificavit Salomon in Hierusalem";
vul[11] = "genuit autem Azarias Amariam et Amarias genuit Ahitob";
vul[12] = "Ahitob genuit Sadoc et Sadoc genuit Sellum";
vul[13] = "Sellum genuit Helciam et Helcias genuit Azariam";
vul[14] = "Azarias genuit Saraiam et Saraias genuit Iosedec";
vul[15] = "porro Iosedec egressus est quando transtulit Dominus Iudam et Hierusalem per manus Nabuchodonosor";
vul[16] = "filii ergo Levi Gersom Caath et Merari";
vul[17] = "et haec nomina filiorum Gersom Lobeni et Semei";
vul[18] = "filii Caath Amram et Isaar et Hebron et Ozihel";
vul[19] = "filii Merari Mooli et Musi hae autem cognationes Levi secundum familias eorum";
vul[20] = "Gersom Lobeni filius eius Iaath filius eius Zamma filius eius";
vul[21] = "Ioaa filius eius Addo filius eius Zara filius eius Iethrai filius eius";
vul[22] = "filii Caath Aminadab filius eius Core filius eius Asir filius eius";
vul[23] = "Helcana filius eius Abiasaph filius eius Asir filius eius";
vul[24] = "Thaath filius eius Urihel filius eius Ozias filius eius Saul filius eius";
vul[25] = "filii Helcana Amasai et Ahimoth";
vul[26] = "Helcana filii Helcana Sophai filius eius Naath filius eius";
vul[27] = "Heliab filius eius Hieroam filius eius Helcana filius eius";
vul[28] = "filii Samuhel primogenitus Vasseni et Abia";
vul[29] = "filii autem Merari Mooli Lobeni filius eius Semei filius eius Oza filius eius";
vul[30] = "Samaa filius eius Aggia filius eius Asaia filius eius";
vul[31] = "isti sunt quos constituit David super cantores domus Domini ex quo conlocata est arca";
vul[32] = "et ministrabant coram tabernaculo testimonii canentes donec aedificaret Salomon domum Domini in Hierusalem stabant autem iuxta ordinem suum in ministerio";
vul[33] = "hii vero sunt qui adsistebant cum filiis suis de filiis Caath Heman cantor filius Iohel filii Samuhel";
vul[34] = "filii Helcana filii Hieroam filii Helihel filii Thou";
vul[35] = "filii Suph filii Helcana filii Maath filii Amasai";
vul[36] = "filii Helcana filii Iohel filii Azariae filii Sophoniae";
vul[37] = "filii Thaath filii Asir filii Abiasaph filii Core";
vul[38] = "filii Isaar filii Caath filii Levi filii Israhel";
vul[39] = "et fratres eius Asaph qui stabat a dextris eius Asaph filius Barachiae filii Samaa";
vul[40] = "filii Michahel filii Basiae filii Melchiae";
vul[41] = "filii Athnai filii Zara filii Adaia";
vul[42] = "filii Ethan filii Zamma filii Semei";
vul[43] = "filii Ieth filii Gersom filii Levi";
vul[44] = "filii autem Merari fratres eorum ad sinistram Ethan filius Cusi filii Abdi filii Maloch";
vul[45] = "filii Asabiae filii Amasiae filii Helciae";
vul[46] = "filii Amasai filii Bonni filii Somer";
vul[47] = "filii Mooli filii Musi filii Merari filii Levi";
vul[48] = "fratres quoque eorum Levitae qui ordinati sunt in cunctum ministerium tabernaculi domus Domini";
vul[49] = "Aaron vero et filii eius adolebant incensum super altare holocausti et super altare thymiamatis in omne opus sancti sanctorum et ut precarentur pro Israhel iuxta omnia quae praecepit Moses servus Dei";
vul[50] = "hii sunt autem filii Aaron Eleazar filius eius Finees filius eius Abisue filius eius";
vul[51] = "Bocci filius eius Ozi filius eius Zaraia filius eius";
vul[52] = "Meraioth filius eius Amaria filius eius Ahitob filius eius";
vul[53] = "Sadoc filius eius Achimaas filius eius";
vul[54] = "et haec habitacula eorum per vicos atque confinia filiorum scilicet Aaron iuxta cognationes Caathitarum ipsis enim sorte contigerat";
vul[55] = "dederunt igitur eis Hebron in terra Iuda et suburbana eius per circuitum";
vul[56] = "agros autem civitatis et villas Chaleb filio Iephonne";
vul[57] = "porro filiis Aaron dederunt civitates ad confugiendum Hebron et Lobna et suburbana eius";
vul[58] = "Iether quoque et Esthmo cum suburbanis suis sed et Helon et Dabir cum suburbanis suis";
vul[59] = "Asan quoque et Bethsemes et suburbana eorum";
vul[60] = "de tribu autem Beniamin Gabee et suburbana eius et Almath cum suburbanis suis Anathoth quoque cum suburbanis suis omnes civitates tredecim per cognationes suas";
vul[61] = "filiis autem Caath residuis de cognatione sua dederunt ex dimidia tribu Manasse in possessionem urbes decem";
vul[62] = "porro filiis Gersom per cognationes suas de tribu Isachar et de tribu Aser et de tribu Nepthali et de tribu Manasse in Basan urbes tredecim";
vul[63] = "filiis autem Merari per cognationes suas de tribu Ruben et de tribu Gad et de tribu Zabulon dederunt sorte civitates duodecim";
vul[64] = "dederunt quoque filii Israhel Levitis civitates et suburbana earum";
vul[65] = "dederuntque per sortem ex tribu filiorum Iuda et ex tribu filiorum Symeon et ex tribu filiorum Beniamin urbes has quas vocaverunt nominibus suis";
vul[66] = "et his qui erant ex cognatione filiorum Caath fueruntque civitates in terminis eorum de tribu Ephraim";
vul[67] = "dederunt ergo eis urbes ad confugiendum Sychem cum suburbanis suis in monte Ephraim et Gazer cum suburbanis suis";
vul[68] = "Hicmaam quoque cum suburbanis suis et Bethoron similiter";
vul[69] = "necnon et Helon cum suburbanis suis et Gethremmon in eundem modum";
vul[70] = "porro ex dimidia tribu Manasse Aner et suburbana eius Balaam et suburbana eius his videlicet qui de cognatione filiorum Caath reliqui erant";
vul[71] = "filiis autem Gersom de cognatione dimidiae tribus Manasse Gaulon in Basan et suburbana eius et Astharoth cum suburbanis suis";
vul[72] = "de tribu Isachar Cedes et suburbana eius et Dabereth cum suburbanis suis";
vul[73] = "Ramoth quoque et suburbana illius et Anem cum suburbanis suis";
vul[74] = "de tribu vero Aser Masal cum suburbanis suis et Abdon similiter";
vul[75] = "Acac quoque et suburbana eius et Roob cum suburbanis suis";
vul[76] = "porro de tribu Nepthali Cedes in Galilea et suburbana eius Amon cum suburbanis suis et Cariathaim et suburbana eius";
vul[77] = "filiis autem Merari residuis de tribu Zabulon Remmono et suburbana eius et Thabor cum suburbanis suis";
vul[78] = "trans Iordanem quoque ex adverso Hiericho contra orientem Iordanis de tribu Ruben Bosor in solitudine cum suburbanis suis et Iasa cum suburbanis suis";
vul[79] = "Cademoth quoque et suburbana eius et Miphaath cum suburbanis suis";
vul[80] = "necnon de tribu Gad Ramoth in Galaad et suburbana eius et Manaim cum suburbanis suis";
vul[81] = "sed et Esbon cum suburbanis eius et Iezer cum suburbanis suis";
web[1] = "The sons of Levi; Gershon, Kohath, and Merari.";
web[2] = "And the sons of Kohath; Amram, Izhar, and Hebron, and Uzziel.";
web[3] = "And the children of Amram; Aaron, and Moses, and Miriam. The sons also of Aaron; Nadab, and Abihu, Eleazar, and Ithamar.";
web[4] = "Eleazar begat Phinehas, Phinehas begat Abishua,";
web[5] = "And Abishua begat Bukki, and Bukki begat Uzzi,";
web[6] = "And Uzzi begat Zerahiah, and Zerahiah begat Meraioth,";
web[7] = "Meraioth begat Amariah, and Amariah begat Ahitub,";
web[8] = "And Ahitub begat Zadok, and Zadok begat Ahimaaz,";
web[9] = "And Ahimaaz begat Azariah, and Azariah begat Johanan,";
web[10] = "And Johanan begat Azariah, (he [it is] that executed the priest\'s office in the temple that Solomon built in Jerusalem:)";
web[11] = "And Azariah begat Amariah, and Amariah begat Ahitub,";
web[12] = "And Ahitub begat Zadok, and Zadok begat Shallum,";
web[13] = "And Shallum begat Hilkiah, and Hilkiah begat Azariah,";
web[14] = "And Azariah begat Seraiah, and Seraiah begat Jehozadak,";
web[15] = "And Jehozadak went [into captivity], when the LORD carried away Judah and Jerusalem by the hand of Nebuchadnezzar.";
web[16] = "The sons of Levi; Gershom, Kohath, and Merari.";
web[17] = "And these [are] the names of the sons of Gershom; Libni, and Shimei.";
web[18] = "And the sons of Kohath [were], Amram, and Izhar, and Hebron, and Uzziel.";
web[19] = "The sons of Merari; Mahli, and Mushi. And these [are] the families of the Levites according to their fathers.";
web[20] = "Of Gershom; Libni his son, Jahath his son, Zimmah his son,";
web[21] = "Joah his son, Iddo his son, Zerah his son, Jeaterai his son.";
web[22] = "The sons of Kohath; Amminadab his son, Korah his son, Assir his son,";
web[23] = "Elkanah his son, and Ebiasaph his son, and Assir his son,";
web[24] = "Tahath his son, Uriel his son, Uzziah his son, and Shaul his son.";
web[25] = "And the sons of Elkanah; Amasai, and Ahimoth.";
web[26] = "[As for] Elkanah: the sons of Elkanah; Zophai his son, and Nahath his son,";
web[27] = "Eliab his son, Jeroham his son, Elkanah his son.";
web[28] = "And the sons of Samuel; the first-born Vashni, and Abiah.";
web[29] = "The sons of Merari; Mahli, Libni his son, Shimei his son, Uzza his son,";
web[30] = "Shimea his son, Haggiah his son, Asaiah his son.";
web[31] = "And these [are they] whom David set over the service of song in the house of the LORD, after that the ark had rest.";
web[32] = "And they ministered before the dwelling-place of the tabernacle of the congregation with singing, until Solomon had built the house of the LORD in Jerusalem: and [then] they waited on their office, according to their order.";
web[33] = "And these [are] they that waited with their children. Of the sons of the Kohathites: Heman a singer, the son of Joel, the son of Shemuel,";
web[34] = "The son of Elkanah, the son of Jeroham, the son of Eliel, the son of Toah,";
web[35] = "The son of Zuph, the son of Elkanah, the son of Mahath, the son of Amasai,";
web[36] = "The son of Elkanah, the son of Joel, the son of Azariah, the son of Zephaniah,";
web[37] = "The son of Tahath, the son of Assir, the son of Ebiasaph, the son of Korah,";
web[38] = "The son of Izhar, the son of Kohath, the son of Levi, the son of Israel.";
web[39] = "And his brother Asaph, who stood on his right hand, [even] Asaph the son of Berechiah, the son of Shimea,";
web[40] = "The son of Michael, the son of Baaseiah, the son of Malchiah,";
web[41] = "The son of Ethni, the son of Zerah, the son of Adaiah,";
web[42] = "The son of Ethan, the son of Zimmah, the son of Shimei,";
web[43] = "The son of Jahath, the son of Gershom, the son of Levi.";
web[44] = "And their brethren the sons of Merari [stood] on the left hand: Ethan the son of Kishi, the son of Abdi, the son of Malluch,";
web[45] = "The son of Hashabiah, the son of Amaziah, the son of Hilkiah,";
web[46] = "The son of Amzi, the son of Bani, the son of Shamer,";
web[47] = "The son of Mahli, the son of Mushi, the son of Merari, the son of Levi.";
web[48] = "Their brethren also the Levites [were] appointed to all manner of service of the tabernacle of the house of God.";
web[49] = "But Aaron and his sons offered upon the altar of the burnt-offering, and on the altar of incense, [and were appointed] for all the work of the [place] most holy, and to make an atonement for Israel, according to all that Moses the servant of God had commanded.";
web[50] = "And these [are] the sons of Aaron; Eleazar his son, Phinehas his son, Abishua his son,";
web[51] = "Bukki his son, Uzzi his son, Zerahiah his son,";
web[52] = "Meraioth his son, Amariah his son, Ahitub his son,";
web[53] = "Zadok his son, Ahimaaz his son.";
web[54] = "Now these [are] their dwelling-places throughout their castles in their limits, of the sons of Aaron, of the families of the Kohathites: for theirs was the lot.";
web[55] = "And they gave them Hebron in the land of Judah, and its suburbs around it.";
web[56] = "But the fields of the city, and its villages, they gave to Caleb the son of Jephunneh.";
web[57] = "And to the sons of Aaron they gave the cities of Judah, [namely], Hebron, [the city] of refuge, and Libnah with its suburbs, and Jattir, and Eshtemoa, with their suburbs,";
web[58] = "And Hilen with its suburbs, Debir with its suburbs,";
web[59] = "And Ashan with its suburbs, and Beth-shemesh with its suburbs:";
web[60] = "And out of the tribe of Benjamin; Geba with its suburbs, and Alemeth with its suburbs, and Anathoth with its suburbs. All their cities throughout their families [were] thirteen cities.";
web[61] = "And to the sons of Kohath [who were] left of the family of that tribe, [were cities given] out of the half tribe, [namely], [out of] the half [tribe] of Manasseh, by lot, ten cities.";
web[62] = "And to the sons of Gershom throughout their families [were given] out of the tribe of Issachar, and out of the tribe of Asher, and out of the tribe of Naphtali, and out of the tribe of Manasseh in Bashan, thirteen cities.";
web[63] = "To the sons of Merari [were given] by lot, throughout their families, out of the tribe of Reuben, and out of the tribe of Gad, and out of the tribe of Zebulun, twelve cities.";
web[64] = "And the children of Israel gave to the Levites [these] cities with their suburbs.";
web[65] = "And they gave by lot out of the tribe of the children of Judah, and out of the tribe of the children of Simeon, and out of the tribe of the children of Benjamin, these cities, which are called by [their] names.";
web[66] = "And [the residue] of the families of the sons of Kohath had cities of their borders out of the tribe of Ephraim.";
web[67] = "And they gave to them, [of] the cities of refuge, Shechem in mount Ephraim with its suburbs; [they gave] also Gezer with its suburbs,";
web[68] = "And Jokmeam with its suburbs, and Beth-horon with its suburbs,";
web[69] = "And Ajalon with its suburbs, and Gath-rimmon with its suburbs:";
web[70] = "And out of the half tribe of Manasseh; Aner with its suburbs, and Bileam with its suburbs, for the family of the remnant of the sons of Kohath.";
web[71] = "To the sons of Gershom [were given] out of the family of the half tribe of Manasseh, Golan in Bashan with its suburbs, and Ashtaroth with its suburbs:";
web[72] = "And out of the tribe of Issachar; Kedesh with its suburbs, Daberath with its suburbs,";
web[73] = "And Ramoth with its suburbs, and Anem with its suburbs:";
web[74] = "And out of the tribe of Asher; Mashal with its suburbs, and Abdon with its suburbs,";
web[75] = "And Hukok with its suburbs, and Rehob with its suburbs:";
web[76] = "And out of the tribe of Naphtali: Kedesh in Galilee with its suburbs, and Hammon with its suburbs, and Kirjathaim with its suburbs.";
web[77] = "To the rest of the children of Merari [were given] out of the tribe of Zebulun, Rimmon with its suburbs, Tabor with its suburbs:";
web[78] = "And on the other side of Jordan by Jericho, on the east side of Jordan, [were given them] out of the tribe of Reuben, Bezer in the wilderness with its suburbs, and Jahzah with its suburbs,";
web[79] = "Kedemoth also with its suburbs, and Mephaath with its suburbs:";
web[80] = "And out of the tribe of Gad; Ramoth in Gilead with its suburbs, and Mahanaim with its suburbs,";
web[81] = "And Heshbon with its suburbs, and Jazer with its suburbs.";

yng[50] = "And these [are] sons of Aaron: Eleazar his son, Phinehas his son, Abishua his son,";

yng[53] = "Zadok his son, Ahimaaz his son.";
yng[54] = "And these [are] their dwellings, throughout their towers, in their borders, of the sons of Aaron, of the family of the Kohathite, for theirs was the lot;";
yng[55] = "and they give to them Hebron in the land of Judah and its suburbs round about it;";
yng[56] = "and the field of the city and its villages they gave to Caleb son of Jephunneh.";
yng[57] = "And to the sons of Aaron they gave the cities of refuge: Hebron, and Libnah and its suburbs, and Jattir, and Eshtemoa and its suburbs,";
yng[58] = "and Hilen and its suburbs, Debir and its suburbs,";
yng[59] = "and Ashan and its suburbs, and Beth-Shemesh and its suburbs.";
yng[60] = "And from the tribe of Benjamin, Geba and its suburbs, and Allemeth and its suburbs, and Anathoth and its suburbs. All their cities [are] thirteen cities, for their families.";
yng[61] = "And to the sons of Kohath, those left of the family of the tribe, from the half of the tribe, the half of Manasseh, by lot, [are] ten cities.";

yng[64] = "And the sons of Israel give to the Levites the cities and their suburbs.";
yng[65] = "And they give by lot from the tribe of the sons of Judah, and from the tribe of the sons of Simeon, and from the tribe of the sons of Benjamin, these cities which they call by name;";
yng[66] = "and some of the families of the sons of Kohath have cities of their border from the tribe of Ephraim;";
yng[67] = "and they give to them the cities of refuge, Shechem and its suburbs in the hill-country of Ephraim, and Gezer and its suburbs,";
yng[68] = "and Jokmeam and its suburbs, and Beth-Horan and its suburbs,";
yng[69] = "and Aijalon and its suburbs, and Gath-Rimmon and its suburbs;";
yng[70] = "and from the half tribe of Manasseh, Aner and its suburbs, and Bileam and its suburbs, for the family of the sons of Kohath who are left.";
yng[71] = "To the sons of Gershom from the family of the half of the tribe of Manasseh [are] Golan in Bashan and its suburbs, and Ashtaroth and its suburbs;";
yng[72] = "and from the tribe of Issachar; Kedesh and its suburbs, Daberath and its suburbs,";
yng[73] = "and Ramoth and its suburbs, and Anem and its suburbs;";
yng[74] = "and from the tribe of Asher; Mashal and its suburbs, and Abdon and its suburbs,";
yng[75] = "and Hukok and its suburbs, and Rehob and its suburbs;";
yng[76] = "and from the tribe of Naphtali: Kedesh in Galilee and its suburbs, and Hammon and its suburbs, and Kirjathaim and its suburbs.";
yng[77] = "To the sons of Merari who are left, from the tribe of Zebulun, [are] Rimmon and its suburbs, Tabor and its suburbs;";
yng[78] = "and from beyond the Jordan by Jericho, at the east of the Jordan, from the tribe of Reuben, Bezer in the wilderness and its suburbs, and Jahzah and its suburbs,";

csb[41] = "son of Ethni, son of Zerah, son of Adaiah,";
csb[42] = "son of Ethan, son of Zimmah, son of Shimei,";
csb[43] = "son of Jahath, son of Gershom, son of Levi.";
csb[44] = "On the left, their relatives were Merari\'s sons: Ethan son of Kishi, son of Abdi, son of Malluch,";
csb[45] = "son of Hashabiah, son of Amaziah, son of Hilkiah,";
csb[46] = "son of Amzi, son of Bani, son of Shemer,";
csb[47] = "son of Mahli, son of Mushi, son of Merari, son of Levi.";
csb[48] = "Their relatives, the Levites, were assigned to all the service of the tabernacle, God\'s temple.";
csb[49] = "But Aaron and his sons did all the work of the most holy place. They presented the offerings on the altar of burnt offerings and on the altar of incense to make atonement for Israel according to all that Moses the servant of God had commanded.";
csb[50] = "These are Aaron\'s sons: his son Eleazar, his son Phinehas, his son Abishua,";
csb[51] = "his son Bukki, his son Uzzi, his son Zerahiah,";
csb[52] = "his son Meraioth, his son Amariah, his son Ahitub,";
csb[53] = "his son Zadok, and his son Ahimaaz.";
csb[54] = "These were the places assigned to Aaron\'s descendants from the Kohathite family for their settlements in their territory, because the first lot was for them.";
csb[55] = "They were given Hebron in the land of Judah and its surrounding pasturelands,";
csb[56] = "but the fields and settlements around the city were given to Caleb son of Jephunneh.";
csb[57] = "Aaron\'s descendants were given: Hebron (a city of refuge), Libnah and its pasturelands, Jattir, Eshtemoa and its pasturelands,";
csb[58] = "Hilen and its pasturelands, Debir and its pasturelands,";
csb[59] = "Ashan and its pasturelands, and Beth-shemesh and its pasturelands.";
csb[60] = "From the tribe of Benjamin they were given Geba and its pasturelands, Alemeth and its pasturelands, and Anathoth and its pasturelands. They had thirteen towns in all among their families.";
csb[61] = "To the rest of the Kohathites, ten towns from half the tribe of Manasseh were assigned by lot.";
csb[62] = "The Gershomites were assigned thirteen towns from the tribes of Issachar, Asher, Naphtali, and Manasseh in Bashan according to their families.";
csb[63] = "The Merarites were assigned by lot twelve towns from the tribes of Reuben, Gad, and Zebulun according to their families.";
csb[64] = "So the Israelites gave these towns and their pasturelands to the Levites.";
csb[65] = "They assigned by lot the towns named above from the tribes of the descendants of Judah, Simeon, and Benjamin.";
csb[66] = "Some of the families of the Kohathites were given towns from the tribe of Ephraim for their territory:";
csb[67] = "Shechem (a city of refuge) with its pasturelands in the hill country of Ephraim, Gezer and its pasturelands,";
csb[68] = "Jokmeam and its pasturelands, Beth-horon and its pasturelands,";
csb[69] = "Aijalon and its pasturelands, and Gath-rimmon and its pasturelands.";
csb[70] = "From half the tribe of Manasseh, Aner and its pasturelands, and Bileam and its pasturelands were given to the rest of the families of the Kohathites.";
csb[71] = "The Gershomites received: Golan in Bashan and its pasturelands, and Ashtaroth and its pasturelands from the families of half the tribe of Manasseh.";
csb[72] = "From the tribe of Issachar they received Kedesh and its pasturelands, Daberath and its pasturelands,";
csb[73] = "Ramoth and its pasturelands, and Anem and its pasturelands.";
csb[74] = "From the tribe of Asher they received Mashal and its pasturelands, Abdon and its pasturelands,";
csb[75] = "Hukok and its pasturelands, and Rehob and its pasturelands.";
csb[76] = "From the tribe of Naphtali they received Kedesh in Galilee and its pasturelands, Hammon and its pasturelands, and Kiriathaim and its pasturelands.";
csb[77] = "The rest of the Merarites received: From the tribe of Zebulun they received Rimmono and its pasturelands and Tabor and its pasturelands.";
csb[78] = "From the tribe of Reuben across the Jordan at Jericho, to the east of the Jordan, they received Bezer in the desert and its pasturelands, Jahzah and its pasturelands,";
csb[79] = "Kedemoth and its pasturelands, and Mephaath and its pasturelands.";
csb[80] = "From the tribe of Gad they received Ramoth in Gilead and its pasturelands, Mahanaim and its pasturelands,";
csb[81] = "Heshbon and its pasturelands, and Jazer and its pasturelands.";
</script>
