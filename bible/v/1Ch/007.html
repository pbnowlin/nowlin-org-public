asv[1] = "And of the sons of Issachar: Tola, and Puah, Jashub, and Shimron, four.";
asv[2] = "And the sons of Tola: Uzzi, and Rephaiah, and Jeriel, and Jahmai, and Ibsam, and Shemuel, heads of their fathers\' houses, [to wit], of Tola; mighty men of valor in their generations: their number in the days of David was two and twenty thousand and six hundred.";
asv[3] = "And the sons of Uzzi: Izrahiah. And the sons of Izrahiah: Michael, and Obadiah, and Joel, Isshiah, five; all of them chief men.";
asv[4] = "And with them, by their generations, after their fathers\' houses, were bands of the host for war, six and thirty thousand; for they had many wives and sons.";
asv[5] = "And their brethren among all the families of Issachar, mighty men of valor, reckoned in all by genealogy, were fourscore and seven thousand.";
asv[6] = "[The sons of] Benjamin: Bela, and Becher, and Jediael, three.";
asv[7] = "And the sons of Bela: Ezbon, and Uzzi, and Uzziel, and Jerimoth, and Iri, five; heads of fathers\' houses, mighty men of valor; and they were reckoned by genealogy twenty and two thousand and thirty and four.";
asv[8] = "And the sons of Becher: Zemirah, and Joash, and Eliezer, and Elioenai, and Omri, and Jeremoth, and Abijah, and Anathoth, and Alemeth. All these were the sons of Becher.";
asv[9] = "And they were reckoned by genealogy, after their generations, heads of their fathers\' houses, mighty men of valor, twenty thousand and two hundred.";
asv[10] = "And the sons of Jediael: Bilhan. And the sons of Bilhan: Jeush, and Benjamin, and Ehud, and Chenaanah, and Zethan, and Tarshish, and Ahishahar.";
asv[11] = "All these were sons of Jediael, according to the heads of their fathers\' [houses], mighty men of valor, seventeen thousand and two hundred, that were able to go forth in the host for war.";
asv[12] = "Shuppim also, and Huppim, the sons of Ir, Hushim, the sons of Aher.";
asv[13] = "The sons of Naphtali: Jahziel, and Guni, and Jezer, and Shallum, the sons of Bilhah.";
asv[14] = "The sons of Manasseh: Asriel, whom his concubine the Aramitess bare; she bare Machir the father of Gilead.";
asv[15] = "And Machir took a wife of Huppim and Shuppim, whose sister\'s name was Maacah; and the name of the second was Zelophehad: and Zelophehad had daughters.";
asv[16] = "And Maacah the wife of Machir bare a son, and she called his name Peresh; and the name of his brother was Sheresh; and his sons were Ulam and Rakem.";
asv[17] = "And the sons of Ulam: Bedan. These were the sons of Gilead the son of Machir, the son of Manasseh.";
asv[18] = "And his sister Hammolecheth bare Ishhod, and Abiezer, and Mahlah.";
asv[19] = "And the sons of Shemida were Ahian, and Shechem, and Likhi, and Aniam.";
asv[20] = "And the sons of Ephraim: Shuthelah, and Bered his son, and Tahath his son, and Eleadah his son, and Tahath his son,";
asv[21] = "and Zabad his son, and Shuthelah his son, and Ezer, and Elead, whom the men of Gath that were born in the land slew, because they came down to take away their cattle.";
asv[22] = "And Ephraim their father mourned many days, and his brethren came to comfort him.";
asv[23] = "And he went in to his wife, and she conceived, and bare a son, and he called his name Beriah, because it went evil with his house.";
asv[24] = "And his daughter was Sheerah, who built Beth-horon the nether and the upper, and Uzzen-sheerah.";
asv[25] = "And Rephah was his son, and Resheph, and Telah his son, and Tahan his son,";
asv[26] = "Ladan his son, Ammihud his son, Elishama his son,";
asv[27] = "Nun his son, Joshua his son.";
asv[28] = "And their possessions and habitations were Beth-el and the towns thereof, and eastward Naaran, and westward Gezer, with the towns thereof; Shechem also and the towns thereof, unto Azzah and the towns thereof;";
asv[29] = "and by the borders of the children of Manasseh, Beth-shean and its towns, Taanach and its towns, Megiddo and its towns, Dor and its towns. In these dwelt the children of Joseph the son of Israel.";
asv[30] = "The sons of Asher: Imnah, and Ishvah, and Ishvi, and Beriah, and Serah their sister.";
asv[31] = "And the sons of Beriah: Heber, and Malchiel, who was the father of Birzaith.";
asv[32] = "And Heber begat Japhlet, and Shomer, and Hotham, and Shua their sister.";
asv[33] = "And the sons of Japhlet: Pasach, and Bimhal, and Ashvath. These are the children of Japhlet.";
asv[34] = "And the sons of Shemer: Ahi, and Rohgah, Jehubbah, and Aram.";
asv[35] = "And the sons of Helem his brother: Zophah, and Imna, and Shelesh, and Amal.";
asv[36] = "The sons of Zophah: Suah, and Harnepher, and Shual, and Beri, and Imrah,";
asv[37] = "Bezer, and Hod, and Shamma, and Shilshah, and Ithran, and Beera.";
asv[38] = "And the sons of Jether: Jephunneh, and Pispa, and Ara.";
asv[39] = "And the sons of Ulla: Arah, and Hanniel, and Rizia.";
asv[40] = "All these were the children of Asher, heads of the fathers\' houses, choice and mighty men of valor, chief of the princes. And the number of them reckoned by genealogy for service in war was twenty and six thousand men.";
dby[1] = "And the sons of Issachar were Tola and Puah, Jashub and Shimron, four.";
dby[2] = "And the sons of Tola: Uzzi, and Rephaiah, and Jeriel, and Jahmai, and Jibsam, and Samuel, heads of their fathers\' houses, of Tola, valiant men of might in their generations; their number in the days of David was twenty-two thousand six hundred.";
dby[3] = "And the sons of Uzzi: Jizrahiah; and the sons of Jizrahiah: Michael, and Obadiah, and Joel, [and] Jishijah, five; all of them chief men.";
dby[4] = "And with them by their generations, according to their fathers\' houses, were military bands for war, thirty-six thousand; for they had many wives and sons.";
dby[5] = "And their brethren among all the families of Issachar valiant men of might, registered by genealogy, in all eighty-seven thousand.";
dby[6] = "[The sons of] Benjamin: Bela, and Becher, and Jediael, three.";
dby[7] = "And the sons of Bela: Ezbon, and Uzzi, and Uzziel, and Jerimoth, and Iri, five; heads of fathers\' houses, mighty men of valour; and they were registered by their genealogy twenty-two thousand and thirty-four.";
dby[8] = "And the sons of Becher: Zemirah, and Joash, and Eliezer, and Elioenai, and Omri, and Jeremoth, and Abijah, and Anathoth, and Alemeth; all these were the sons of Becher.";
dby[9] = "And they were registered by their genealogy by their generations, heads of their fathers\' houses, mighty men of valour, twenty thousand two hundred.";
dby[10] = "And the sons of Jediael: Bilhan; and the sons of Bilhan: Jeush, and Benjamin, and Ehud, and Chenaanah, and Zethan, and Tarshish, and Ahishahar.";
dby[11] = "All these were the sons of Jediael, by the heads of their fathers, mighty men of valour, seventeen thousand two hundred, fit for service for war.";
dby[12] = "And Shuppim, and Huppim, the children of Ir. -- Hushim: the sons of Aher.";
dby[13] = "The sons of Naphtali: Jahziel, and Guni, and Jezer, and Shallum, the sons of Bilhah.";
dby[14] = "The sons of Manasseh: Asriel, ... whom she bore; his Syrian concubine bore Machir the father of Gilead.";
dby[15] = "And Machir took a wife [the sister] of Huppim and Shuppim, and the name of their sister was Maachah. And the name of the second [son] was Zelophehad; and Zelophehad had daughters.";
dby[16] = "And Maachah the wife of Machir bore a son, and she called his name Peresh; and the name of his brother was Sheresh; and his sons were Ulam and Rakem.";
dby[17] = "And the sons of Ulam: Bedan. These were the sons of Gilead, the son of Machir, the son of Manasseh.";
dby[18] = "And his sister Moleketh bore Ishhod, and Abiezer, and Mahlah.";
dby[19] = "And the sons of Shemidah were Ahian, and Shechem, and Likhi, and Aniam.";
dby[20] = "And the sons of Ephraim: Shuthelah, and Bered his son, and Tahath his son, and Eladah his son, and Tahath his son,";
dby[21] = "and Zabad his son, and Shuthelah his son, and Ezer, and Elad. And the men of Gath born in the land slew them, because they came down to take their cattle.";
dby[22] = "And Ephraim their father mourned many days, and his brethren came to comfort him.";
dby[23] = "And he went in to his wife; and she conceived, and bore a son; and he called his name Beriah, for [he was born] when calamity was in his house.";
dby[24] = "And his daughter was Sheerah; and she built Beth-horon the nether, and the upper, and Uzzen-sheerah.";
dby[25] = "And his son was Rephah, and Resheph, and Telah his son, and Tahan his son,";
dby[26] = "Laadan his son, Ammihud his son, Elishama his son,";
dby[27] = "Nun his son, Joshua his son.";
dby[28] = "And their possession and dwelling-places were Bethel and its dependent villages, and eastward Naaran, and westward Gezer and its dependent villages, and Shechem and its dependent villages as far as to Gazah and its dependent villages.";
dby[29] = "And in the hands of the children of Manasseh, Beth-shean and its dependent villages, Taanach and its dependent villages, Megiddo and its dependent villages, Dor and its dependent villages. In these dwelt the children of Joseph the son of Israel.";
dby[30] = "The sons of Asher: Jimnah, and Jishvah, and Jishvi, and Beriah; Serah their sister.";
dby[31] = "And the sons of Beriah: Heber, and Malchiel, who is the father of Birzavith.";
dby[32] = "And Heber begot Japhlet, and Shomer, and Hotham, and Shua their sister.";
dby[33] = "And the sons of Japhlet: Pasach, and Bimhal, and Ashvath; these are the sons of Japhlet.";
dby[34] = "And the sons of Shemer: Ahi, and Rohgah, and Hubbah, and Aram.";
dby[35] = "And the sons of his brother Helem: Zophah, and Jimna, and Shelesh, and Amal.";
dby[36] = "The sons of Zophah: Suah, and Harnepher, and Shual, and Beri, and Jimrah,";
dby[37] = "Bezer, and Hod, and Shamma, and Shilshah, and Jithran, and Beera.";
dby[38] = "And the sons of Jether: Jephunneh, and Pispah, and Ara.";
dby[39] = "And the sons of Ulla: Arah, and Hanniel, and Rizia.";
dby[40] = "All these were the sons of Asher, heads of fathers\' houses, choice men, mighty of valour, chiefs of the princes. And their number according to their genealogy, registered as fit for service for war, was twenty-six thousand men.";
hnv[1] = "Of the sons of Yissakhar: Tola, and Pu`ah, Yashuv, and Shimron, four.";
hnv[2] = "The sons of Tola: `Uzzi, and Refayah, and Yeri\'el, and Yachmai, and Yivsam, and Shemu\'el, heads of their fathers\' houses, [to wit], of Tola; mighty men of valor in their generations: their number in the days of David was twenty-two thousand six hundred.";
hnv[3] = " The sons of `Uzzi: Yizrachyah. The sons of Yizrachyah: Mikha\'el, and `Ovadyah, and Yo\'el, Yishshiyah, five; all of them chief men.";
hnv[4] = " With them, by their generations, after their fathers\' houses, were bands of the host for war, thirty-six thousand; for they had many wives and sons.";
hnv[5] = "Their brothers among all the families of Yissakhar, mighty men of valor, reckoned in all by genealogy, were eighty-seven thousand.";
hnv[6] = "[The sons of] Binyamin: Bela, and Bekher, and Yedi`a\'el, three.";
hnv[7] = "The sons of Bela: Etzbon, and `Uzzi, and `Uzzi\'el, and Yerimot, and Iri, five; heads of fathers\' houses, mighty men of valor; and they were reckoned by genealogy twenty-two thousand thirty-four.";
hnv[8] = "The sons of Bekher: Zemirah, and Yo\'ash, and Eli`ezer, and Elyo`enai, and `Omri, and Yeremot, and Aviyah, and `Anatot, and `Alemet. All these were the sons of Bekher.";
hnv[9] = "They were reckoned by genealogy, after their generations, heads of their fathers\' houses, mighty men of valor, twenty thousand two hundred.";
hnv[10] = "The sons of Yedi`a\'el: Bilhan. The sons of Bilhan: Ye`ush, and Binyamin, and Ehud, and Kena`anah, and Zetan, and Tarshish, and Achishachar.";
hnv[11] = "All these were sons of Yedi`a\'el, according to the heads of their fathers\' [houses], mighty men of valor, seventeen thousand and two hundred, who were able to go forth in the host for war.";
hnv[12] = "Shuppim also, and Huppim, the sons of Ir, Hushim, the sons of Acher.";
hnv[13] = "The sons of Naftali: Yachtziel, and Guni, and Yetzer, and Shallum, the sons of Bilhah.";
hnv[14] = "The sons of Menashsheh: Asri\'el, whom his concubine the Arammian bore: she bore Makhir the father of Gil`ad:";
hnv[15] = "and Makhir took a wife of Huppim and Shuppim, whose sister\'s name was Ma`akhah; and the name of the second was Tzelohchad: and Tzelohchad had daughters.";
hnv[16] = "Ma`akhah the wife of Makhir bore a son, and she named him Peresh; and the name of his brother was Sheresh; and his sons were Ulam and Rakem.";
hnv[17] = "The sons of Ulam: Bedan. These were the sons of Gil`ad the son of Makhir, the son of Menashsheh.";
hnv[18] = "His sister Hammolekhet bore Ishhod, and Avi-Ezer, and Machlah.";
hnv[19] = "The sons of Shemida were Achyan, and Shekhem, and Likchi, and Ani`am.";
hnv[20] = "The sons of Efrayim: Shutelach, and Bered his son, and Tachat his son, and El\'adah his son, and Tachat his son,";
hnv[21] = "and Zavad his son, and Shutelach his son, and Etzer, and El\'ad, whom the men of Gat who were born in the land killed, because they came down to take away their cattle.";
hnv[22] = "Efrayim their father mourned many days, and his brothers came to comfort him.";
hnv[23] = " He went in to his wife, and she conceived, and bore a son, and he named him Beri`ah, because it went evil with his house.";
hnv[24] = "His daughter was She\'erah, who built Beit-Horon the lower and the upper, and Uzzen-She\'erah.";
hnv[25] = "Refach was his son, and Reshef, and Telach his son, and Tachan his son,";
hnv[26] = "La`dan his son, `Ammihud his son, Elishama his son,";
hnv[27] = "Nun his son, Yehoshua his son.";
hnv[28] = "Their possessions and habitations were Beit-El and the towns of it, and eastward Naaran, and westward Gezer, with the towns of it; Shekhem also and the towns of it, to Azzah and the towns of it;";
hnv[29] = "and by the borders of the children of Menashsheh, Beth-shean and its towns, Ta`nakh and its towns, Megiddo and its towns, Dor and its towns. In these lived the children of Yosef the son of Yisra\'el.";
hnv[30] = "The sons of Asher: Yimna, and Yishvah, and Yishvi, and Beri`ah, and Serach their sister.";
hnv[31] = "The sons of Beri`ah: Hever, and Malki\'el, who was the father of Birzaith.";
hnv[32] = "Hever became the father of Yaflet, and Shomer, and Hotam, and Shu`a their sister.";
hnv[33] = "The sons of Yaflet: Pasach, and Bimhal, and `Asvat. These are the children of Yaflet.";
hnv[34] = "The sons of Shemer: Achi, and Rohgah, Hubbah, and Aram.";
hnv[35] = " The sons of Helem his brother: Tzofach, and Yimna, and Shelesh, and Amal.";
hnv[36] = "The sons of Tzofach: Su\'ach, and Harnefer, and Shual, and Ber, and Yimrah,";
hnv[37] = "Betzer, and Hod, and Shamma, and Shilshah, and Yitran, and Beera.";
hnv[38] = "The sons of Yeter: Yefunneh, and Pispa, and Ara.";
hnv[39] = "The sons of Ulla: Arach, and Hanni\'el, and Ritzyah.";
hnv[40] = " All these were the children of Asher, heads of the fathers\' houses, choice and mighty men of valor, chief of the princes. The number of them reckoned by genealogy for service in war was twenty-six thousand men.";
kjv[1] = "Now the sons of Issachar [were], Tola, and Puah, Jashub, and Shimron, four.";
kjv[2] = "And the sons of Tola; Uzzi, and Rephaiah, and Jeriel, and Jahmai, and Jibsam, and Shemuel, heads of their father\'s house, [to wit], of Tola: [they were] valiant men of might in their generations; whose number [was] in the days of David two and twenty thousand and six hundred.";
kjv[3] = "And the sons of Uzzi; Izrahiah: and the sons of Izrahiah; Michael, and Obadiah, and Joel, Ishiah, five: all of them chief men.";
kjv[4] = "And with them, by their generations, after the house of their fathers, [were] bands of soldiers for war, six and thirty thousand [men]: for they had many wives and sons.";
kjv[5] = "And their brethren among all the families of Issachar [were] valiant men of might, reckoned in all by their genealogies fourscore and seven thousand.";
kjv[6] = "[The sons] of Benjamin; Bela, and Becher, and Jediael, three.";
kjv[7] = "And the sons of Bela; Ezbon, and Uzzi, and Uzziel, and Jerimoth, and Iri, five; heads of the house of [their] fathers, mighty men of valour; and were reckoned by their genealogies twenty and two thousand and thirty and four.";
kjv[8] = "And the sons of Becher; Zemira, and Joash, and Eliezer, and Elioenai, and Omri, and Jerimoth, and Abiah, and Anathoth, and Alameth. All these [are] the sons of Becher.";
kjv[9] = "And the number of them, after their genealogy by their generations, heads of the house of their fathers, mighty men of valour, [was] twenty thousand and two hundred.";
kjv[10] = "The sons also of Jediael; Bilhan: and the sons of Bilhan; Jeush, and Benjamin, and Ehud, and Chenaanah, and Zethan, and Tharshish, and Ahishahar.";
kjv[11] = "All these the sons of Jediael, by the heads of their fathers, mighty men of valour, [were] seventeen thousand and two hundred [soldiers], fit to go out for war [and] battle.";
kjv[12] = "Shuppim also, and Huppim, the children of Ir, [and] Hushim, the sons of Aher.";
kjv[13] = "The sons of Naphtali; Jahziel, and Guni, and Jezer, and Shallum, the sons of Bilhah.";
kjv[14] = "The sons of Manasseh; Ashriel, whom she bare: ([but] his concubine the Aramitess bare Machir the father of Gilead:";
kjv[15] = "And Machir took to wife [the sister] of Huppim and Shuppim, whose sister\'s name [was] Maachah;) and the name of the second [was] Zelophehad: and Zelophehad had daughters.";
kjv[16] = "And Maachah the wife of Machir bare a son, and she called his name Peresh; and the name of his brother [was] Sheresh; and his sons [were] Ulam and Rakem.";
kjv[17] = "And the sons of Ulam; Bedan. These [were] the sons of Gilead, the son of Machir, the son of Manasseh.";
kjv[18] = "And his sister Hammoleketh bare Ishod, and Abiezer, and Mahalah.";
kjv[19] = "And the sons of Shemida were, Ahian, and Shechem, and Likhi, and Aniam.";
kjv[20] = "And the sons of Ephraim; Shuthelah, and Bered his son, and Tahath his son, and Eladah his son, and Tahath his son,";
kjv[21] = "And Zabad his son, and Shuthelah his son, and Ezer, and Elead, whom the men of Gath [that were] born in [that] land slew, because they came down to take away their cattle.";
kjv[22] = "And Ephraim their father mourned many days, and his brethren came to comfort him.";
kjv[23] = "And when he went in to his wife, she conceived, and bare a son, and he called his name Beriah, because it went evil with his house.";
kjv[24] = "(And his daughter [was] Sherah, who built Bethhoron the nether, and the upper, and Uzzensherah.)";
kjv[25] = "And Rephah [was] his son, also Resheph, and Telah his son, and Tahan his son,";
kjv[26] = "Laadan his son, Ammihud his son, Elishama his son,";
kjv[27] = "Non his son, Jehoshua his son.";
kjv[28] = "And their possessions and habitations [were], Bethel and the towns thereof, and eastward Naaran, and westward Gezer, with the towns thereof; Shechem also and the towns thereof, unto Gaza and the towns thereof:";
kjv[29] = "And by the borders of the children of Manasseh, Bethshean and her towns, Taanach and her towns, Megiddo and her towns, Dor and her towns. In these dwelt the children of Joseph the son of Israel.";
kjv[30] = "The sons of Asher; Imnah, and Isuah, and Ishuai, and Beriah, and Serah their sister.";
kjv[31] = "And the sons of Beriah; Heber, and Malchiel, who [is] the father of Birzavith.";
kjv[32] = "And Heber begat Japhlet, and Shomer, and Hotham, and Shua their sister.";
kjv[33] = "And the sons of Japhlet; Pasach, and Bimhal, and Ashvath. These [are] the children of Japhlet.";
kjv[34] = "And the sons of Shamer; Ahi, and Rohgah, Jehubbah, and Aram.";
kjv[35] = "And the sons of his brother Helem; Zophah, and Imna, and Shelesh, and Amal.";
kjv[36] = "The sons of Zophah; Suah, and Harnepher, and Shual, and Beri, and Imrah,";
kjv[37] = "Bezer, and Hod, and Shamma, and Shilshah, and Ithran, and Beera.";
kjv[38] = "And the sons of Jether; Jephunneh, and Pispah, and Ara.";
kjv[39] = "And the sons of Ulla; Arah, and Haniel, and Rezia.";
kjv[40] = "All these [were] the children of Asher, heads of [their] father\'s house, choice [and] mighty men of valour, chief of the princes. And the number throughout the genealogy of them that were apt to the war [and] to battle [was] twenty and six thousand men.";
rsv[1] = "The sons of Is\'sachar: Tola, Pu\'ah, Jashub, and Shimron, four.";
rsv[2] = "The sons of Tola: Uzzi, Rephai\'ah, Je\'ri-el, Jah\'mai, Ibsam, and Shem\'uel, heads of their fathers\' houses, namely of Tola, mighty warriors of their generations, their number in the days of David being twenty-two thousand six hundred.";
rsv[3] = "The sons of Uzzi: Izrahi\'ah. And the sons of Izrahi\'ah: Michael, Obadi\'ah, Jo\'el, and Isshi\'ah, five, all of them chief men;";
rsv[4] = "and along with them, by their generations, according to their fathers\' houses, were units of the army for war, thirty-six thousand, for they had many wives and sons.";
rsv[5] = "Their kinsmen belonging to all the families of Is\'sachar were in all eighty-seven thousand mighty warriors, enrolled by genealogy.";
rsv[6] = "The sons of Benjamin: Bela, Becher, and Jedi\'a-el, three.";
rsv[7] = "The sons of Bela: Ezbon, Uzzi, Uz\'ziel, Jer\'imoth, and Iri, five, heads of fathers\' houses, mighty warriors; and their enrollment by genealogies was twenty-two thousand and thirty-four.";
rsv[8] = "The sons of Becher: Zemi\'rah, Jo\'ash, Elie\'zer, Eli-o-e\'nai, Omri, Jer\'emoth, Abi\'jah, An\'athoth, and Al\'emeth. All these were the sons of Becher;";
rsv[9] = "and their enrollment by genealogies, according to their generations, as heads of their fathers\' houses, mighty warriors, was twenty thousand two hundred.";
rsv[10] = "The sons of Jedi\'a-el: Bilhan. And the sons of Bilhan: Je\'ush, Benjamin, Ehud, Chena\'anah, Zethan, Tarshish, and Ahish\'ahar.";
rsv[11] = "All these were the sons of Jedi\'a-el according to the heads of their fathers\' houses, mighty warriors, seventeen thousand and two hundred, ready for service in war.";
rsv[12] = "And Shuppim and Huppim were the sons of Ir, Hushim the sons of Aher.";
rsv[13] = "The sons of Naph\'tali: Jah\'zi-el, Guni, Jezer, and Shallum, the offspring of Bilhah.";
rsv[14] = "The sons of Manas\'seh: As\'ri-el, whom his Aramean concubine bore; she bore Machir the father of Gilead.";
rsv[15] = "And Machir took a wife for Huppim and for Shuppim. The name of his sister was Ma\'acah. And the name of the second was Zeloph\'ehad; and Zeloph\'ehad had daughters.";
rsv[16] = "And Ma\'acah the wife of Machir bore a son, and she called his name Peresh; and the name of his brother was Sheresh; and his sons were Ulam and Rakem.";
rsv[17] = "The sons of Ulam: Bedan. These were the sons of Gilead the son of Machir, son of Manas\'seh.";
rsv[18] = "And his sister Hammo\'lecheth bore Ishhod, Abi-e\'zer, and Mahlah.";
rsv[19] = "The sons of Shemi\'da were Ahi\'an, Shechem, Likhi, and Ani\'am.";
rsv[20] = "The sons of E\'phraim: Shuthe\'lah, and Bered his son, Tahath his son, Ele-a\'dah his son, Tahath his son,";
rsv[21] = "Zabad his son, Shuthe\'lah his son, and Ezer and E\'le-ad, whom the men of Gath who were born in the land slew, because they came down to raid their cattle.";
rsv[22] = "And E\'phraim their father mourned many days, and his brothers came to comfort him.";
rsv[23] = "And E\'phraim went in to his wife, and she conceived and bore a son; and he called his name Beri\'ah, because evil had befallen his house.";
rsv[24] = "His daughter was She\'erah, who built both Lower and Upper Beth-hor\'on, and Uz\'zen-she\'erah.";
rsv[25] = "Rephah was his son, Resheph his son, Telah his son, Tahan his son,";
rsv[26] = "Ladan his son, Ammi\'hud his son, Eli\'shama his son,";
rsv[27] = "Nun his son, Joshua his son.";
rsv[28] = "Their possessions and settlements were Bethel and its towns, and eastward Na\'aran, and westward Gezer and its towns, Shechem and its towns, and Ayyah and its towns;";
rsv[29] = "also along the borders of the Manas\'sites, Beth-she\'an and its towns, Ta\'anach and its towns, Megid\'do and its towns, Dor and its towns. In these dwelt the sons of Joseph the son of Israel.";
rsv[30] = "The sons of Asher: Imnah, Ishvah, Ishvi, Beri\'ah, and their sister Serah.";
rsv[31] = "The sons of Beri\'ah: Heber and Mal\'chi-el, who was the father of Bir\'zaith.";
rsv[32] = "Heber was the father of Japhlet, Shomer, Hotham, and their sister Shu\'a.";
rsv[33] = "The sons of Japhlet: Pasach, Bimhal, and Ashvath. These are the sons of Japhlet.";
rsv[34] = "The sons of Shemer his brother: Rohgah, Jehub\'bah, and Aram.";
rsv[35] = "The sons of Helem his brother: Zophah, Imna, Shelesh, and Amal.";
rsv[36] = "The sons of Zophah: Su\'ah, Har\'nepher, Shu\'al, Beri, Imrah,";
rsv[37] = "Bezer, Hod, Shamma, Shilshah, Ithran, and Be-e\'ra.";
rsv[38] = "The sons of Jether: Jephun\'neh, Pispa, and Ara.";
rsv[39] = "The sons of Ulla: Arah, Han\'niel, and Rizi\'a.";
rsv[40] = "All of these were men of Asher, heads of fathers\' houses, approved, mighty warriors, chief of the princes. Their number enrolled by genealogies, for service in war, was twenty-six thousand men.";
vul[1] = "porro filii Isachar Thola et Phua Iasub et Samaron quattuor";
vul[2] = "filii Thola Ozi et Raphaia et Ierihel et Iemai et Iebsem et Samuhel principes per domos cognationum suarum de stirpe Thola viri fortissimi numerati sunt in diebus David viginti duo milia sescenti";
vul[3] = "filii Ozi Iezraia de quo nati sunt Michahel et Obadia et Iohel et Iesia quinque omnes principes";
vul[4] = "cumque eis per familias et populos suos accincti ad proelium viri fortissimi triginta sex milia multas enim habuere uxores et filios";
vul[5] = "fratresque eorum per omnem cognationem Isachar robustissimi ad pugnandum octoginta septem milia numerati sunt";
vul[6] = "Beniamin Bale et Bochor et Iadihel tres";
vul[7] = "filii Bale Esbon et Ozi et Ozihel et Ierimoth et Urai quinque principes familiarum et ad pugnandum robustissimi numerus autem eorum viginti duo milia et triginta quattuor";
vul[8] = "porro filii Bochor Zamira et Ioas et Eliezer et Helioenai et Amri et Ierimoth et Abia et Anathoth et Almathan omnes hii filii Bochor";
vul[9] = "numerati sunt autem per familias suas principes cognationum ad bella fortissimi viginti milia et ducenti";
vul[10] = "porro filii Iadihel Balan filii autem Balan Hieus et Beniamin et Ahoth et Chanana et Iothan et Tharsis et Haisaar";
vul[11] = "omnes hii filii Iadihel principes cognationum suarum viri fortissimi decem et septem milia et ducenti ad proelium procedentes";
vul[12] = "Sephan quoque et Apham filii Hir et Asim filii Aer";
vul[13] = "filii autem Nepthali Iasihel et Guni et Asar et Sellum filii Balaa";
vul[14] = "porro filius Manasse Esrihel concubinaque eius syra peperit Machir patrem Galaad";
vul[15] = "Machir autem accepit uxores filiis suis Happhim et Sepham et habuit sororem nomine Maacha nomen autem secundi Salphaad nataeque sunt Salphaad filiae";
vul[16] = "et peperit Maacha uxor Machir filium vocavitque nomen eius Phares porro nomen fratris eius Sares et filii eius Ulam et Recem";
vul[17] = "filius autem Ulam Badan hii sunt filii Galaad filii Machir filii Manasse";
vul[18] = "soror autem eius Regina peperit virum Decorum et Abiezer et Moola";
vul[19] = "erant autem filii Semida Ahin et Sechem et Leci et Aniam";
vul[20] = "filii autem Ephraim Suthala Bareth filius eius Thaath filius eius Elada filius eius Thaath filius eius et huius filius Zabad";
vul[21] = "et huius filius Suthala et huius filius Ezer et Elad occiderunt autem eos viri Geth indigenae quia descenderant ut invaderent possessiones eorum";
vul[22] = "luxit igitur Ephraim pater eorum multis diebus et venerunt fratres eius ut consolarentur eum";
vul[23] = "ingressusque est ad uxorem suam quae concepit et peperit filium et vocavit nomen eius Beria eo quod in malis domus eius ortus esset";
vul[24] = "filia autem eius fuit Sara quae aedificavit Bethoron inferiorem et superiorem et Ozensara";
vul[25] = "porro filius eius Rapha et Reseph et Thale de quo natus est Thaan";
vul[26] = "qui genuit Laadan huius quoque filius Ammiud genuit Elisama";
vul[27] = "de quo ortus est Nun qui habuit filium Iosue";
vul[28] = "possessio autem eorum et habitatio Bethel cum filiabus suis et contra orientem Noran ad occidentalem plagam Gazer et filiae eius Sychem quoque cum filiabus suis usque Aza et filias eius";
vul[29] = "iuxta filios quoque Manasse Bethsan et filias eius Thanach et filias eius Mageddo et filias eius Dor et filias eius in his habitaverunt filii Ioseph filii Israhel";
vul[30] = "filii Aser Iomna et Iesua et Isui et Baria et Sara soror eorum";
vul[31] = "filii autem Baria Heber et Melchihel ipse est pater Barzaith";
vul[32] = "Heber autem genuit Iephlat et Somer et Otham et Suaa sororem eorum";
vul[33] = "filii Iephlat Phosech et Chamaal et Asoth hii filii Iephlat";
vul[34] = "porro filii Somer Ahi et Roaga et Iaba et Aram";
vul[35] = "filii autem Helem fratris eius Supha et Iemna et Selles et Amal";
vul[36] = "filii Supha Sue Arnaphed et Sual et Beri et Iamra";
vul[37] = "Bosor et Od et Samma et Salusa et Iethran et Bera";
vul[38] = "filii Iether Iephonne et Phaspha et Ara";
vul[39] = "filii autem Olla Aree et Anihel et Resia";
vul[40] = "omnes hii filii Aser principes cognationum electi atque fortissimi duces ducum numerus autem eorum aetatis quae apta esset ad bellum viginti sex milia";
web[1] = "Now the sons of Issachar, [were], Tola, and Puah, Jashub, and Shimron, four.";
web[2] = "And the sons of Tola; Uzzi, and Rephaiah, and Jeriel, and Jahmai, and Jibsam, and Shemuel, heads of their father\'s house, [to wit], of Tola: [they were] valiant men of might in their generations; whose number [was] in the days of David two and twenty thousand and six hundred.";
web[3] = "And the sons of Uzzi; Izrahiah: and the sons of Izrahiah; Michael, and Obadiah, and Joel, Ishaiah, five: all of them chief men.";
web[4] = "And with them, by their generations, after the house of their fathers, [were] bands of soldiers for war, six and thirty thousand [men]: for they had many wives and sons.";
web[5] = "And their brethren among all the families of Issachar [were] valiant men of might, reckoned in all by their genealogies eighty and seven thousand.";
web[6] = "[The sons] of Benjamin; Bela, and Becher, and Jediael, three.";
web[7] = "And the sons of Bela; Ezbon, and Uzzi, and Uzziel, and Jerimoth, and Iri, five; heads of the house of [their] fathers, mighty men of valor; and were reckoned by their genealogies twenty and two thousand and thirty and four.";
web[8] = "And the sons of Becher; Zemira, and Joash, and Eliezer, and Elioenai, and Omri, and Jerimoth, and Abiah, and Anathoth, and Alameth. All these [are] the sons of Becher.";
web[9] = "And the number of them, after their genealogy by their generations, heads of the house of their fathers, mighty men of valor, [was] twenty thousand and two hundred.";
web[10] = "The sons also of Jediael; Bilhan: and the sons of Bilhan; Jeush, and Benjamin, and Ehud, and Chenaanah, and Zethan, and Tharshish, and Ahishahar.";
web[11] = "All these the sons of Jediael, by the heads of their fathers, mighty men of valor, [were] seventeen thousand and two hundred [soldiers], fit to go out for war [and] battle.";
web[12] = "Shuppim also, and Huppim, the children of Ir, [and] Hushim, the sons of Aher.";
web[13] = "The sons of Naphtali; Jahziel, and Guni, and Jezer, and Shallum, the sons of Bilhah.";
web[14] = "The sons of Manasseh; Ashriel, whom she bore: ([but] his concubine the Aramitess bore Machir the father of Gilead:";
web[15] = "And Machir took for a wife [the sister] of Huppim and Shuppim, whose sister\'s name [was] Maachah;) and the name of the second [was] Zelophehad: and Zelophehad had daughters.";
web[16] = "And Maachah the wife of Machir bore a son, and she called his name Peresh; and the name of his brother [was] Sheresh; and his sons [were] Ulam, and Rakem.";
web[17] = "And the sons of Ulam; Bedan. These [were] the sons of Gilead, the son of Machir, the son of Manasseh.";
web[18] = "And his sister Hammoleketh bore Ishod, and Abiezer, and Mahalah.";
web[19] = "And the sons of Shemida were, Ahian, and Shechem, and Likhi, and Aniam.";
web[20] = "And the sons of Ephraim; Shuthelah, and Bered his son, and Tahath his son, and Eladah his son, and Tahath his son,";
web[21] = "And Zabad his son, and Shuthelah his son, and Ezer, and Elead, whom the men of Gath [that were] born in [that] land slew, because they came down to take away their cattle.";
web[22] = "And Ephraim their father mourned many days, and his brethren came to comfort him.";
web[23] = "And when he went in to his wife, she conceived and bore a son, and he called his name Beriah, because it went evil with his house.";
web[24] = "(And his daughter [was] Sherah, who built Beth-horon the nether, and the upper, and Uzzen-sherah.)";
web[25] = "And Rephah [was] his son, also Resheph, and Telah his son, and Tahan his son,";
web[26] = "Laadan his son, Ammihud his son, Elishama his son,";
web[27] = "Non his son, Jehoshua his son.";
web[28] = "And their possessions and habitations [were], Beth-el, and its towns, and eastward Naaram, and westward Gezer, with its towns; Shechem also and its towns, to Gaza and its towns:";
web[29] = "And by the borders of the children of Manasseh, Beth-shean and its towns, Taanach and its towns, Megiddo and its towns, Dor and its towns. In these dwelt the children of Joseph the son of Israel.";
web[30] = "The sons of Asher; Imnah, and Isuah, and Ishua, and Beriah, and Serah their sister.";
web[31] = "And the sons of Beriah; Heber, and Malchiel, who [is] the father of Birzavith.";
web[32] = "And Heber begat Japhlet, and Shomer, and Hotham, and Shua their sister.";
web[33] = "And the sons of Japhlet; Pasach, and Bimhal, and Ashvath. These [are] the children of Japhlet.";
web[34] = "And the sons of Shamer; Ahi, and Rohgah, Jehubbah, and Aram.";
web[35] = "And the sons of his brother Helem; Zophah, and Imna, and Shelesh, and Amal.";
web[36] = "The sons of Zophah; Suah, and Harnepher, and Shual, and Beri, and Imrah,";
web[37] = "Bezer, and Hod, and Shamma, and Shilshah, and Ithran, and Beera.";
web[38] = "And the sons of Jether; Jephunneh, and Pispah, and Ara.";
web[39] = "And the sons of Ulla; Arah, and Haniel, and Rezia.";
web[40] = "All these [were] the children of Asher, heads of [their] father\'s house, choice [and] mighty men of valor, chief of the princes. And the number throughout the genealogy of them that were fit for war [and] for battle [was] twenty and six thousand men.";
yng[1] = "And sons of Issachar; Tola, and Puah, Jashub, and Shimron, four.";
yng[2] = "And sons of Tola: Uzzi, and Rephaiah, and Jeriel, and Jahmai, and Jibsam, and Shemuel, heads of the house of their fathers, [even] of Tola, mighty of valour in their generations: their number in the days of David [is] twenty and two thousand and six hundred.";
yng[3] = "And sons of Uzzi: Izrahiah; and sons of Izrahiah: Michael, and Obadiah, and Joel, Ishiah, Hamishah -- all of them heads.";
yng[4] = "And beside them, by their generations, of the house of their fathers, [are] troops of the host of battle, thirty and six thousand, for they multiplied wives and sons;";
yng[5] = "and their brethren of all the families of Issachar [are] mighty of valour, eighty and seven thousand, all have their genealogy.";
yng[6] = "Of Benjamin: Bela, and Becher, and Jediael, three.";
yng[7] = "And sons of Bela: Ezbon, and Uzzi, and Uzziel, and Jerimoth, and Iri, five; heads of a house of fathers, mighty of valour, with their genealogy, twenty and two thousand, and thirty and four.";
yng[8] = "And sons of Becher: Zemirah, and Joash, and Eliezar, and Elioenai, and Omri, and Jerimoth, and Abijah, and Anathoth, and Alameth. All these [are] sons of Becher,";
yng[9] = "with their genealogy, after their generations, heads of a house of their fathers, mighty of valour, twenty thousand and two hundred.";
yng[10] = "And sons of Jediael: Bilhan; and sons of Bilhan: Jeush, and Benjamin, and Ehud, and Chenaanah, and Zethan, and Tarshish, and Ahishahar.";
yng[11] = "All these [are] sons of Jediael, even heads of the fathers, mighty in valour, seventeen thousand and two hundred going out to the host for battle.";
yng[12] = "And Shuppim and Huppim [are] sons of Ir; Hushim son of Aher.";
yng[13] = "Sons of Naphtali: Jahziel, and Guni, and Jezer, and Shallum, sons of Bilhah.";
yng[14] = "Sons of Manasseh: Ashriel, whom Jaladah his Aramaean concubine bare, with Machir father of Gilead.";
yng[15] = "And Machir took wives for Huppim and for Shuppim, and the name of the one [is] Maachah, and the name of the second Zelophehad, and Zelophehad hath daughters.";
yng[16] = "And Maachah wife of Machir beareth a son and calleth his name Peresh, and the name of his brother [is] Sheresh, and his sons [are] Ulam and Rakem.";
yng[17] = "And son of Ulam: Bedan. These [are] sons of Gilead son of Machir, son of Manasseh.";
yng[18] = "And his sister Hammolecheth bare Ishhod, and Abiezer, and Mahalah.";
yng[19] = "And the sons of Shemida are Ahian, and Shechem, and Likhi, and Aniam.";
yng[20] = "And sons of Ephraim: Shuthelah, and Bered his son, and Tahath his son, and Eladah his son, and Tahath his son,";
yng[21] = "and Zabad his son, and Shuthelah his son, and Ezer, and Elead; and slain them have men of Gath who are born in the land, because they came down to take their cattle.";
yng[22] = "And Ephraim their father mourneth many days, and his brethren come in to comfort him,";
yng[23] = "and he goeth in unto his wife, and she conceiveth and beareth a son, and he calleth his name Beriah, because in evil had been his house, --";
yng[24] = "and his daughter [is] Sherah, and she buildeth Beth-Horon, the lower and the upper, and Uzzen-Sherah --";
yng[25] = "and Rephah [is] his son, and Resheph, and Telah his son, and Tahan his son,";
yng[26] = "Laadan his son, Ammihud his son, Elishama his son,";
yng[27] = "Non his son, Jehoshua his son.";
yng[28] = "And their possession and their dwellings [are] Beth-El and its small towns, and to the east Naaran, and to the west Gezer and its small towns, and Shechem and its small towns, unto Gaza and its small towns;";
yng[29] = "and by the parts of the sons of Manasseh, Beth-Shean and its small towns, Taanach and its small towns, Megiddo and its small towns, Dor and its small towns; in these dwelt the sons of Joseph son of Israel.";
yng[30] = "Son of Asher: Imnah, and Ishve, and Ishvi, and Beriah, and Serah their sister.";
yng[31] = "And sons of Beriah: Heber, and Malchiel -- he [is] father of Birzavith.";
yng[32] = "And Heber begat Japhlet, and Shomer, and Hotham, and Shua their sister.";
yng[33] = "And sons of Japhlet: Pasach, and Bimhal, and Ashvath; these [are] sons of Japhlet.";
yng[34] = "and sons of Shamer: Ahi, and Rohgah, Jehubbah, and Aram.";
yng[35] = "And son of Helem his brother: Zophah, and Imna, and Shelesh, and Amal.";
yng[36] = "Sons of Zophah: Suah, and Harnepher, and Shual, and Beri, and Imrah,";
yng[37] = "Bezer, and Hod, and Shamma, and Shilshah, and Ithran, and Beera.";
yng[38] = "And sons of Jether: Jephunneh, and Pispah, and Ara.";
yng[39] = "And sons of Ulla: Arah, and Hanniel, and Rezia.";
yng[40] = "All these [are] sons of Asher, heads of the house of the fathers, chosen ones, mighty in valour, heads of the princes, with their genealogy, for the host, for battle, their number [is] twenty and six thousand men.";
csb[1] = "Issachar\'s sons: Tola, Puah, Jashub, and Shimron -- four.";
csb[2] = "Tola\'s sons: Uzzi, Rephaiah, Jeriel, Jahmai, Ibsam, and Shemuel, the heads of their ancestral families. During David\'s reign, 22,600 descendants of Tola were recorded as valiant warriors in their family records.";
csb[3] = "Uzzi\'s son: Izrahiah. Izrahiah\'s sons: Michael, Obadiah, Joel, Isshiah. All five of them were chiefs.";
csb[4] = "Along with them, they had 36,000 troops for battle according to the family records of their ancestral families, for they had many wives and children.";
csb[5] = "Their tribesmen who were valiant warriors belonging to all the families of Issachar totaled 87,000 in their genealogies.";
csb[6] = "Three of Benjamin\'s sons: Bela, Becher, and Jediael.";
csb[7] = "Bela\'s sons: Ezbon, Uzzi, Uzziel, Jerimoth, and Iri -- five. They were valiant warriors and heads of their ancestral families; 22,034 were listed in their genealogies.";
csb[8] = "Becher\'s sons: Zemirah, Joash, Eliezer, Elioenai, Omri, Jeremoth, Abijah, Anathoth, and Alemeth; all these were Becher\'s sons.";
csb[9] = "Their family records were recorded according to the heads of their ancestral families -- 20,200 valiant warriors.";
csb[10] = "Jediael\'s son: Bilhan. Bilhan\'s sons: Jeush, Benjamin, Ehud, Chenaanah, Zethan, Tarshish, and Ahishahar.";
csb[11] = "All these sons of Jediael listed by family heads were valiant warriors; there were 17,200 who could serve in the army.";
csb[12] = "Shuppim and Huppim were sons of Ir, and the Hushim were the sons of Aher.";
csb[13] = "Naphtali\'s sons: Jahziel, Guni, Jezer, and Shallum -- Bilhah\'s sons.";
csb[14] = "Manasseh\'s sons through his Aramean concubine: Asriel and Machir the father of Gilead.";
csb[15] = "Machir took wives from Huppim and Shuppim. The name of his sister was Maacah. Another descendant was named Zelophehad, but he had only daughters.";
csb[16] = "Machir\'s wife Maacah gave birth to a son, and she named him Peresh. His brother was named Sheresh, and his sons were Ulam and Rekem.";
csb[17] = "Ulam\'s son: Bedan. These were the sons of Gilead son of Machir, son of Manasseh.";
csb[18] = "His sister Hammolecheth gave birth to Ishhod, Abiezer, and Mahlah.";
csb[19] = "Shemida\'s sons: Ahian, Shechem, Likhi, and Aniam.";
csb[20] = "Ephraim\'s sons: Shuthelah, and his son Bered, his son Tahath, his son Eleadah, his son Tahath,";
csb[21] = "his son Zabad, his son Shuthelah, also Ezer, and Elead. The men of Gath, born in the land, killed them because they went down to raid their cattle.";
csb[22] = "Their father Ephraim mourned a long time, and his relatives came to comfort him.";
csb[23] = "He slept with his wife, and she conceived and gave birth to a son. So he named him Beriah, because there had been misfortune in his home.";
csb[24] = "His daughter was Sheerah, who built Lower and Upper Beth-horon and Uzzen-sheerah,";
csb[25] = "his son Rephah, his son Resheph, his son Telah, his son Tahan,";
csb[26] = "his son Ladan, his son Ammihud, his son Elishama,";
csb[27] = "his son Nun, and his son Joshua.";
csb[28] = "Their holdings and settlements were Bethel and its surrounding villages; Naaran to the east, Gezer and its villages to the west, and Shechem and its villages as far as Ayyah and its villages,";
csb[29] = "and along the borders of the descendants of Manasseh, Beth-shean, Taanach, Megiddo, and Dor with their surrounding villages. The sons of Joseph son of Israel lived in these towns.";
csb[30] = "Asher\'s sons: Imnah, Ishvah, Ishvi, and Beriah, with their sister Serah.";
csb[31] = "Beriah\'s sons: Heber, and Malchiel, who fathered Birzaith.";
csb[32] = "Heber fathered Japhlet, Shomer, and Hotham, with their sister Shua.";
csb[33] = "Japhlet\'s sons: Pasach, Bimhal, and Ashvath. These were Japhlet\'s sons.";
csb[34] = "Shemer\'s sons: Ahi, Rohgah, Hubbah, and Aram.";
csb[35] = "His brother Helem\'s sons: Zophah, Imna, Shelesh, and Amal.";
csb[36] = "Zophah\'s sons: Suah, Harnepher, Shual, Beri, Imrah,";
csb[37] = "Bezer, Hod, Shamma, Shilshah, Ithran, and Beera.";
csb[38] = "Jether\'s sons: Jephunneh, Pispa, and Ara.";
csb[39] = "Ulla\'s sons: Arah, Hanniel, and Rizia.";
csb[40] = "All these were Asher\'s descendants. They were the heads of their ancestral families, chosen men, valiant warriors, and chiefs among the leaders. The number of men listed in their genealogies for military service was 26,000.";
