asv[1] = "For the courses of the doorkeepers: of the Korahites, Meshelemiah the son of Kore, of the sons of Asaph.";
asv[2] = "And Meshelemiah had sons: Zechariah the first-born, Jediael the second, Zebadiah the third, Jathniel the fourth,";
asv[3] = "Elam the fifth, Jehohanan the sixth, Eliehoenai the seventh.";
asv[4] = "And Obed-edom had sons: Shemaiah the first-born, Jehozabad the second, Joah the third, and Sacar the fourth, and Nethanel the fifth,";
asv[5] = "Ammiel the sixth, Issachar the seventh, Peullethai the eighth; for God blessed him.";
asv[6] = "Also unto Shemaiah his son were sons born, that ruled over the house of their father; for they were mighty men of valor.";
asv[7] = "The sons of Shemaiah: Othni, and Rephael, and Obed, Elzabad, whose brethren were valiant men, Elihu, and Semachiah.";
asv[8] = "All these were of the sons of Obed-edom: they and their sons and their brethren, able men in strength for the service; threescore and two of Obed-edom.";
asv[9] = "And Meshelemiah had sons and brethren, valiant men, eighteen.";
asv[10] = "Also Hosah, of the children of Merari, had sons: Shimri the chief (for though he was not the first-born, yet his father made him chief),";
asv[11] = "Hilkiah the second, Tebaliah the third, Zechariah the fourth: all the sons and brethren of Hosah were thirteen.";
asv[12] = "Of these were the courses of the doorkeepers, even of the chief men, having offices like their brethren, to minister in the house of Jehovah.";
asv[13] = "And they cast lots, as well the small as the great, according to their fathers\' houses, for every gate.";
asv[14] = "And the lot eastward fell to Shelemiah. Then for Zechariah his son, a discreet counsellor, they cast lots; and his lot came out northward.";
asv[15] = "To Obed-edom southward; and to his sons the store-house.";
asv[16] = "To Shuppim and Hosah westward, by the gate of Shallecheth, at the causeway that goeth up, watch against watch.";
asv[17] = "Eastward were six Levites, northward four a day, southward four a day, and for the store-house two and two.";
asv[18] = "For Parbar westward, four at the causeway, and two at Parbar.";
asv[19] = "These were the courses of the doorkeepers; of the sons of the Korahites, and of the sons of Merari.";
asv[20] = "And of the Levites, Ahijah was over the treasures of the house of God, and over the treasures of the dedicated things.";
asv[21] = "The sons of Ladan, the sons of the Gershonites belonging to Ladan, the heads of the fathers\' [houses] belonging to Ladan the Gershonite: Jehieli.";
asv[22] = "The sons of Jehieli: Zetham, and Joel his brother, over the treasures of the house of Jehovah.";
asv[23] = "Of the Amramites, of the Izharites, of the Hebronites, of the Uzzielites:";
asv[24] = "and Shebuel the son of Gershom, the son of Moses, was ruler over the treasures.";
asv[25] = "And his brethren: of Eliezer [came] Rehabiah his son, and Jeshaiah his son, and Joram his son, and Zichri his son, and Shelomoth his son.";
asv[26] = "This Shelomoth and his brethren were over all the treasures of the dedicated things, which David the king, and the heads of the fathers\' [houses], the captains over thousands and hundreds, and the captains of the host, had dedicated.";
asv[27] = "Out of the spoil won in battles did they dedicate to repair the house of Jehovah.";
asv[28] = "And all that Samuel the seer, and Saul the son of Kish, and Abner the son of Ner, and Joab the son of Zeruiah, had dedicated, whosoever had dedicated anything, it was under the hand of Shelomoth, and of his brethren.";
asv[29] = "Of the Izharites, Chenaniah and his sons were for the outward business over Israel, for officers and judges.";
asv[30] = "Of the Hebronites, Hashabiah and his brethren, men of valor, a thousand and seven hundred, had the oversight of Israel beyond the Jordan westward, for all the business of Jehovah, and for the service of the king.";
asv[31] = "Of the Hebronites was Jerijah the chief, even of the Hebronites, according to their generations by fathers\' [houses]. In the fortieth year of the reign of David they were sought for, and there were found among them mighty men of valor at Jazer of Gilead.";
asv[32] = "And his brethren, men of valor, were two thousand and seven hundred, heads of fathers\' [houses], whom king David made overseers over the Reubenites, and the Gadites, and the half-tribe of the Manassites, for every matter pertaining to God, and for the affairs of the king.";
dby[1] = "The divisions of the doorkeepers. Of the Korahites: Meshelemiah the son of Kore, of the sons of Asaph.";

dby[3] = "Elam the fifth, Johanan the sixth, Elioenai the seventh.";

dby[5] = "Ammiel the sixth, Issachar the seventh, Peulthai the eighth: for God had blessed him.";
dby[6] = "And to Shemaiah his son were sons born, who were rulers in their father\'s house; for they were mighty men of valour.";
dby[7] = "The sons of Shemaiah: Othni, and Rephael, and Obed, [and] Elzabad, whose brethren were valiant men, Elihu and Semachiah.";
dby[8] = "All these were of the sons of Obed-Edom: they and their sons and their brethren, able men in strength for the service, were sixty-two of Obed-Edom.";
dby[9] = "-- And Meshelemiah had sons and brethren, men of valour, eighteen.";
dby[10] = "-- And Hosah, of the sons of Merari, had sons: Shimri the head, for though he was not the firstborn, yet his father made him the head;";
dby[11] = "Hilkijah the second, Tebaliah the third, Zechariah the fourth: all the sons and brethren of Hosah were thirteen.";
dby[12] = "Among these were the divisions of the doorkeepers, among the head-men, as to the charges together with their brethren, for performing the service in the house of Jehovah.";
dby[13] = "And they cast lots, the small as well as the great, according to their fathers\' houses, for every gate.";
dby[14] = "And the lot eastward fell to Shelemiah; and they cast lots for Zechariah his son, a wise counsellor, and his lot came out northward;";
dby[15] = "to Obed-Edom southward; and to his sons the storehouse.";
dby[16] = "To Shuppim and Hosah westward, with the gate Shallecheth, by the causeway of the ascent, watch against watch.";

dby[18] = "At the portico westward, four at the causeway, two at the portico.";
dby[19] = "These are the divisions of the doorkeepers among the sons of the Korahites and among the sons of Merari.";
dby[20] = "And the Levites: Ahijah was over the treasures of the house of God, and over the treasures of the dedicated things.";
dby[21] = "The sons of Laadan, the sons of the Gershonites of Laadan, chief fathers of Laadan the Gershonite: Jehieli;";
dby[22] = "the sons of Jehieli: Zetham, and Joel his brother, over the treasures of the house of Jehovah.";
dby[23] = "As to the Amramites, the Jizharites, the Hebronites, the Uzzielites....";
dby[24] = "And Shebuel the son of Gershom, the son of Moses, was overseer of the treasures.";
dby[25] = "And his brethren, of Eliezer: Rehabiah his son, and Isaiah his son, and Joram his son, and Zichri his son, and Shelomith his son.";
dby[26] = "This Shelomith and his brethren were over all the treasures of the dedicated things, which king David, and the chief fathers, the captains over thousands and hundreds, and the captains of the host, had dedicated";
dby[27] = "(from the wars and out of the spoils had they dedicated [them], to maintain the house of Jehovah),";
dby[28] = "and all that Samuel the seer, and Saul the son of Kish, and Abner the son of Ner, and Joab the son of Zeruiah had dedicated: all that was dedicated was under the hand of Shelomith and of his brethren.";
dby[29] = "Of the Jizharites, Chenaniah and his sons were over Israel, for the outward business for officers and judges.";
dby[30] = "Of the Hebronites, Hashabiah and his brethren, men of valour, a thousand and seven hundred, for the administration of Israel on this side Jordan westward, for all the business of Jehovah, and for the service of the king.";
dby[31] = "Of the Hebronites was Jerijah the head; (as to the Hebronites, according to their families according to the fathers: in the fortieth year of the reign of David they were sought for, and there were found among them mighty men of valour at Jaazer in Gilead;)";
dby[32] = "and his brethren, men of valour, two thousand seven hundred chief fathers, whom king David made rulers over the Reubenites and the Gadites and the half tribe of the Manassites, for every matter pertaining to God, and the affairs of the king.";
hnv[1] = "For the courses of the doorkeepers: of the Korchi, Meshelemyah the son of Kore, of the sons of Asaf.";
hnv[2] = "Meshelemyah had sons: Zekharyah the firstborn, Yedi`a\'el the second, Zevadyah the third, Yatni\'el the fourth,";
hnv[3] = "`Elam the fifth, Yehochanan the sixth, Elyeho`enai the seventh.";
hnv[4] = "Obed-edom had sons: Shemayah the firstborn, Yehozavad the second, Yo\'ach the third, and Sacar the fourth, and Netan\'el the fifth,";
hnv[5] = "`Ammi\'el the sixth, Yissakhar the seventh, Peullethai the eighth; for God blessed him.";
hnv[6] = "Also to Shemayah his son were sons born, who ruled over the house of their father; for they were mighty men of valor.";
hnv[7] = "The sons of Shemayah: Othni, and Rephael, and `Oved, Elzavad, whose brothers were valiant men, Elihu, and Semachyahu.";
hnv[8] = "All these were of the sons of Obed-edom: they and their sons and their brothers, able men in strength for the service; sixty-two of Obed-edom.";
hnv[9] = "Meshelemyah had sons and brothers, valiant men, eighteen.";
hnv[10] = "Also Hosah, of the children of Merari, had sons: Shimri the chief, (for though he was not the firstborn, yet his father made him chief),";
hnv[11] = "Hilkiyah the second, Tevalyahu the third, Zekharyah the fourth: all the sons and brothers of Hosah were thirteen.";
hnv[12] = "Of these were the courses of the doorkeepers, even of the chief men, having offices like their brothers, to minister in the house of the LORD.";
hnv[13] = "They cast lots, as well the small as the great, according to their fathers\' houses, for every gate.";
hnv[14] = "The lot eastward fell to Shelemyahu. Then for Zekharyah his son, a discreet counselor, they cast lots; and his lot came out northward.";
hnv[15] = "To Obed-edom southward; and to his sons the store-house.";
hnv[16] = "To Shuppim and Hosah westward, by the gate of Shallecheth, at the causeway that goes up, watch against watch.";
hnv[17] = " Eastward were six Levites, northward four a day, southward four a day, and for the store-house two and two.";
hnv[18] = "For Parbar westward, four at the causeway, and two at Parbar.";
hnv[19] = "These were the courses of the doorkeepers; of the sons of the Korchi, and of the sons of Merari.";
hnv[20] = "Of the Levites, Achiyah was over the treasures of the house of God, and over the treasures of the dedicated things.";
hnv[21] = "The sons of La`dan, the sons of the Gershoni belonging to La`dan, the heads of the fathers\' [houses] belonging to La`dan the Gershonite: Yechie\'li.";
hnv[22] = "The sons of Yechie\'li: Zetham, and Yo\'el his brother, over the treasures of the house of the LORD.";
hnv[23] = "Of the `Amrami, of the Izharites, of the Hevroni, of the `Uzzi\'eli:";
hnv[24] = "and Shevu\'el the son of Gershom, the son of Moshe, was ruler over the treasures.";
hnv[25] = " His brothers: of Eli`ezer [came] Rechavyah his son, and Yesha`yah his son, and Yoram his son, and Zikhri his son, and Shelomit his son.";
hnv[26] = "This Shelomit and his brothers were over all the treasures of the dedicated things, which David the king, and the heads of the fathers\' [houses], the captains over thousands and hundreds, and the captains of the host, had dedicated.";
hnv[27] = "Out of the spoil won in battles did they dedicate to repair the house of the LORD.";
hnv[28] = "All that Shemu\'el the seer, and Sha\'ul the son of Kish, and Aviner the son of Ner, and Yo\'av the son of Tzeru\'yah, had dedicated, whoever had dedicated anything, it was under the hand of Shelomit, and of his brothers.";
hnv[29] = "Of the Izharites, Kananyah and his sons were for the outward business over Yisra\'el, for officers and judges.";
hnv[30] = "Of the Hevroni, Hashavyah and his brothers, men of valor, one thousand seven hundred, had the oversight of Yisra\'el beyond the Yarden westward, for all the business of the LORD, and for the service of the king.";
hnv[31] = " Of the Hevroni was Yeriyah the chief, even of the Hevroni, according to their generations by fathers\' [houses]. In the fortieth year of the reign of David they were sought for, and there were found among them mighty men of valor at Ya`zer of Gil`ad.";
hnv[32] = "His brothers, men of valor, were two thousand and seven hundred, heads of fathers\' [houses], whom king David made overseers over the Re\'uveni, and the Gadi, and the half-tribe of the Manashshi, for every matter pertaining to God, and for the affairs of the king.";
kjv[1] = "Concerning the divisions of the porters: Of the Korhites [was] Meshelemiah the son of Kore, of the sons of Asaph.";
kjv[2] = "And the sons of Meshelemiah [were], Zechariah the firstborn, Jediael the second, Zebadiah the third, Jathniel the fourth,";
kjv[3] = "Elam the fifth, Jehohanan the sixth, Elioenai the seventh.";
kjv[4] = "Moreover the sons of Obededom [were], Shemaiah the firstborn, Jehozabad the second, Joah the third, and Sacar the fourth, and Nethaneel the fifth,";
kjv[5] = "Ammiel the sixth, Issachar the seventh, Peulthai the eighth: for God blessed him.";
kjv[6] = "Also unto Shemaiah his son were sons born, that ruled throughout the house of their father: for they [were] mighty men of valour.";
kjv[7] = "The sons of Shemaiah; Othni, and Rephael, and Obed, Elzabad, whose brethren [were] strong men, Elihu, and Semachiah.";
kjv[8] = "All these of the sons of Obededom: they and their sons and their brethren, able men for strength for the service, [were] threescore and two of Obededom.";
kjv[9] = "And Meshelemiah had sons and brethren, strong men, eighteen.";
kjv[10] = "Also Hosah, of the children of Merari, had sons; Simri the chief, (for [though] he was not the firstborn, yet his father made him the chief;)";
kjv[11] = "Hilkiah the second, Tebaliah the third, Zechariah the fourth: all the sons and brethren of Hosah [were] thirteen.";
kjv[12] = "Among these [were] the divisions of the porters, [even] among the chief men, [having] wards one against another, to minister in the house of the LORD.";
kjv[13] = "And they cast lots, as well the small as the great, according to the house of their fathers, for every gate.";
kjv[14] = "And the lot eastward fell to Shelemiah. Then for Zechariah his son, a wise counsellor, they cast lots; and his lot came out northward.";
kjv[15] = "To Obededom southward; and to his sons the house of Asuppim.";
kjv[16] = "To Shuppim and Hosah [the lot came forth] westward, with the gate Shallecheth, by the causeway of the going up, ward against ward.";
kjv[17] = "Eastward [were] six Levites, northward four a day, southward four a day, and toward Asuppim two [and] two.";
kjv[18] = "At Parbar westward, four at the causeway, [and] two at Parbar.";
kjv[19] = "These [are] the divisions of the porters among the sons of Kore, and among the sons of Merari.";
kjv[20] = "And of the Levites, Ahijah [was] over the treasures of the house of God, and over the treasures of the dedicated things.";
kjv[21] = "[As concerning] the sons of Laadan; the sons of the Gershonite Laadan, chief fathers, [even] of Laadan the Gershonite, [were] Jehieli.";
kjv[22] = "The sons of Jehieli; Zetham, and Joel his brother, [which were] over the treasures of the house of the LORD.";
kjv[23] = "Of the Amramites, [and] the Izharites, the Hebronites, [and] the Uzzielites:";
kjv[24] = "And Shebuel the son of Gershom, the son of Moses, [was] ruler of the treasures.";
kjv[25] = "And his brethren by Eliezer; Rehabiah his son, and Jeshaiah his son, and Joram his son, and Zichri his son, and Shelomith his son.";
kjv[26] = "Which Shelomith and his brethren [were] over all the treasures of the dedicated things, which David the king, and the chief fathers, the captains over thousands and hundreds, and the captains of the host, had dedicated.";
kjv[27] = "Out of the spoils won in battles did they dedicate to maintain the house of the LORD.";
kjv[28] = "And all that Samuel the seer, and Saul the son of Kish, and Abner the son of Ner, and Joab the son of Zeruiah, had dedicated; [and] whosoever had dedicated [any thing, it was] under the hand of Shelomith, and of his brethren.";
kjv[29] = "Of the Izharites, Chenaniah and his sons [were] for the outward business over Israel, for officers and judges.";
kjv[30] = "[And] of the Hebronites, Hashabiah and his brethren, men of valour, a thousand and seven hundred, [were] officers among them of Israel on this side Jordan westward in all the business of the LORD, and in the service of the king.";
kjv[31] = "Among the Hebronites [was] Jerijah the chief, [even] among the Hebronites, according to the generations of his fathers. In the fortieth year of the reign of David they were sought for, and there were found among them mighty men of valour at Jazer of Gilead.";
kjv[32] = "And his brethren, men of valour, [were] two thousand and seven hundred chief fathers, whom king David made rulers over the Reubenites, the Gadites, and the half tribe of Manasseh, for every matter pertaining to God, and affairs of the king.";
rsv[1] = "As for the divisions of the gatekeepers: of the Ko\'rahites, Meshelemi\'ah the son of Ko\'re, of the sons of Asaph.";
rsv[2] = "And Meshelemi\'ah had sons: Zechari\'ah the first-born, Jedi\'a-el the second, Zebadi\'ah the third, Jath\'ni-el the fourth,";
rsv[3] = "Elam the fifth, Jehoha\'nan the sixth, Eli-e-ho-e\'nai the seventh.";
rsv[4] = "And O\'bed-e\'dom had sons: Shemai\'ah the first-born, Jehoz\'abad the second, Jo\'ah the third, Sachar the fourth, Nethan\'el the fifth,";
rsv[5] = "Am\'mi-el the sixth, Is\'sachar the seventh, Pe-ul\'lethai the eighth; for God blessed him.";
rsv[6] = "Also to his son Shemai\'ah were sons born who were rulers in their fathers\' houses, for they were men of great ability.";
rsv[7] = "The sons of Shemai\'ah: Othni, Reph\'a-el, Obed, and Elza\'bad, whose brethren were able men, Eli\'hu and Semachi\'ah.";
rsv[8] = "All these were of the sons of O\'bed-e\'dom with their sons and brethren, able men qualified for the service; sixty-two of O\'bed-e\'dom.";
rsv[9] = "And Meshelemi\'ah had sons and brethren, able men, eighteen.";
rsv[10] = "And Hosah, of the sons of Merar\'i, had sons: Shimri the chief (for though he was not the first-born, his father made him chief),";
rsv[11] = "Hilki\'ah the second, Tebali\'ah the third, Zechari\'ah the fourth: all the sons and brethren of Hosah were thirteen.";
rsv[12] = "These divisions of the gatekeepers, corresponding to their chief men, had duties, just as their brethren did, ministering in the house of the LORD;";
rsv[13] = "and they cast lots by fathers\' houses, small and great alike, for their gates.";
rsv[14] = "The lot for the east fell to Shelemi\'ah. They cast lots also for his son Zechari\'ah, a shrewd counselor, and his lot came out for the north.";
rsv[15] = "O\'bed-e\'dom\'s came out for the south, and to his sons was allotted the storehouse.";
rsv[16] = "For Shuppim and Hosah it came out for the west, at the gate of Shal\'lecheth on the road that goes up. Watch corresponded to watch.";
rsv[17] = "On the east there were six each day, on the north four each day, on the south four each day, as well as two and two at the storehouse;";
rsv[18] = "and for the parbar on the west there were four at the road and two at the parbar.";
rsv[19] = "These were the divisions of the gatekeepers among the Ko\'rahites and the sons of Merar\'i.";
rsv[20] = "And of the Levites, Ahi\'jah had charge of the treasuries of the house of God and the treasuries of the dedicated gifts.";
rsv[21] = "The sons of Ladan, the sons of the Gershonites belonging to Ladan, the heads of the fathers\' houses belonging to Ladan the Gershonite: Jehi\'eli.";
rsv[22] = "The sons of Jehi\'eli, Zetham and Jo\'el his brother, were in charge of the treasuries of the house of the LORD.";
rsv[23] = "Of the Am\'ramites, the Iz\'harites, the He\'bronites, and the Uzzie\'lites--";
rsv[24] = "and Sheb\'uel the son of Gershom, son of Moses, was chief officer in charge of the treasuries.";
rsv[25] = "His brethren: from Elie\'zer were his son Rehabi\'ah, and his son Jeshai\'ah, and his son Joram, and his son Zichri, and his son Shelo\'moth.";
rsv[26] = "This Shelo\'moth and his brethren were in charge of all the treasuries of the dedicated gifts which David the king, and the heads of the fathers\' houses, and the officers of the thousands and the hundreds, and the commanders of the army, had dedicated.";
rsv[27] = "From spoil won in battles they dedicated gifts for the maintenance of the house of the LORD.";
rsv[28] = "Also all that Samuel the seer, and Saul the son of Kish, and Abner the son of Ner, and Jo\'ab the son of Zeru\'iah had dedicated--all dedicated gifts were in the care of Shelo\'moth and his brethren.";
rsv[29] = "Of the Iz\'harites, Chenani\'ah and his sons were appointed to outside duties for Israel, as officers and judges.";
rsv[30] = "Of the He\'bronites, Hashabi\'ah and his brethren, one thousand seven hundred men of ability, had the oversight of Israel westward of the Jordan for all the work of the LORD and for the service of the king.";
rsv[31] = "Of the He\'bronites, Jeri\'jah was chief of the He\'bronites of whatever genealogy or fathers\' houses. (In the fortieth year of David\'s reign search was made and men of great ability among them were found at Jazer in Gilead.)";
rsv[32] = "King David appointed him and his brethren, two thousand seven hundred men of ability, heads of fathers\' houses, to have the oversight of the Reubenites, the Gadites, and the half-tribe of the Manas\'sites for everything pertaining to God and for the affairs of the king.";
vul[1] = "divisiones autem ianitorum de Coritis Mesellemia filius Core de filiis Asaph";
vul[2] = "filii Mesellemiae Zaccharias primogenitus Iadihel secundus Zabadias tertius Iathanahel quartus";
vul[3] = "Ahilam quintus Iohanan sextus Helioenai septimus";
vul[4] = "filii autem Obededom Semeias primogenitus Iozabad secundus Iohaa tertius Sachar quartus Nathanahel quintus";
vul[5] = "Amihel sextus Isachar septimus Phollathi octavus quia benedixit illi Dominus";
vul[6] = "Semeiae autem filio eius nati sunt filii praefecti familiarum suarum erant enim viri fortissimi";
vul[7] = "filii ergo Semeiae Othni et Raphahel et Obedihel Zabad fratres eius viri fortissimi Heliu quoque et Samachias";
vul[8] = "omnes hii de filiis Obededom ipsi et filii et fratres eorum fortissimi ad ministrandum sexaginta duo de Obededom";
vul[9] = "porro Mesellamiae filii et fratres robustissimi decem et octo";
vul[10] = "de Hosa autem id est de filiis Merari Semri princeps non enim habuerat primogenitum et idcirco posuerat eum pater eius in principem";
vul[11] = "Helchias secundus Tabelias tertius Zaccharias quartus omnes hii filii et fratres Hosa tredecim";
vul[12] = "hii divisi sunt in ianitores ut semper principes custodiarum sicut et fratres eorum ministrarent in domo Domini";
vul[13] = "missae sunt autem sortes ex aequo et parvis et magnis per familias suas in unamquamque portarum";
vul[14] = "cecidit igitur sors orientalis Selemiae porro Zacchariae filio eius viro prudentissimo et erudito sortito obtigit plaga septentrionalis";
vul[15] = "Obededom vero et filiis eius ad austrum in qua parte domus erat seniorum concilium";
vul[16] = "Sepphima et Hosa ad occidentem iuxta portam quae ducit ad viam ascensionis custodia contra custodiam";
vul[17] = "ad orientem vero Levitae sex et ad aquilonem quattuor per diem atque ad meridiem similiter in die quattuor et ubi erat concilium bini et bini";
vul[18] = "in cellulis quoque ianitorum ad occidentem quattuor in via binique per cellulas";
vul[19] = "hae sunt divisiones ianitorum filiorum Core et Merari";
vul[20] = "porro Achias erat super thesauros domus Dei ac vasa sanctorum";
vul[21] = "filii Ledan filii Gersonni de Ledan principes familiarum Ledan et Gersonni Ieiheli";
vul[22] = "filii Ieiheli Zathan et Iohel frater eius super thesauros domus Domini";
vul[23] = "Amramitis et Isaaritis et Hebronitis et Ozihelitibus";
vul[24] = "Subahel autem filius Gersom filii Mosi praepositus thesauris";
vul[25] = "fratres quoque eius Eliezer cuius filius Raabia et huius filius Isaias et huius filius Ioram huius quoque filius Zechri sed et huius filius Selemith";
vul[26] = "ipse Selemith et fratres eius super thesauros sanctorum quae sanctificavit David rex et principes familiarum et tribuni et centuriones et duces exercitus";
vul[27] = "de bellis et manubiis proeliorum quae consecraverant ad instaurationem et supellectilem templi Domini";
vul[28] = "haec autem universa sanctificavit Samuhel videns et Saul filius Cis et Abner filius Ner et Ioab filius Sarviae omnes qui sanctificaverunt ea per manum Salemith et fratrum eius";
vul[29] = "Saaritis vero praeerat Chonenias et filii eius ad opera forinsecus super Israhel ad docendum et ad iudicandum eos";
vul[30] = "porro de Hebronitis Asabias et fratres eius viri fortissimi mille septingenti praeerant Israheli trans Iordanem contra occidentem in cunctis operibus Domini et in ministerium regis";
vul[31] = "Hebronitarum autem princeps fuit Hieria secundum familias et cognationes eorum quadragesimo anno regni David recensiti sunt et inventi viri fortissimi in Iazer Galaad";
vul[32] = "fratresque eius robustioris aetatis duo milia septingenti principes familiarum praeposuit autem eos David rex Rubenitis et Gadditis et dimidio tribus Manasse in omne ministerium Dei et regis";
web[1] = "Concerning the divisions of the porters: Of the Korhites [was] Meshelemiah the son of Kore, of the sons of Asaph.";
web[2] = "And the sons of Meshelemiah [were], Zechariah the first-born, Jediael the second, Zebadiah the third, Jathniel the fourth,";
web[3] = "Elam the fifth, Jehohanan the sixth, Elioenai the seventh.";
web[4] = "Moreover the sons of Obed-edom [were], Shemaiah the first-born, Jehozabad the second, Joah the third, and Sacar the fourth, and Nethaneel the fifth,";
web[5] = "Ammiel the sixth, Issachar the seventh, Peulthai the eighth: for God blessed him.";
web[6] = "Also to Shemaiah his son were sons born, that ruled throughout the house of their father: for they [were] mighty men of valor.";
web[7] = "The sons of Shemaiah; Othni, and Rephael, and Obed, Elzabad, whose brethren [were] strong men, Elihu, and Semachiah.";
web[8] = "All these of the sons of Obed-edom: they and their sons and their brethren, able men for strength for the service, [were] sixty and two of Obed-edom.";
web[9] = "And Meshelemiah had sons and brethren, strong men, eighteen.";
web[10] = "Also Hosah of the children of Merari, had sons; Simri the chief, (for [though] he was not the first-born, yet his father made him the chief;)";
web[11] = "Hilkiah the second, Tebaliah the third, Zechariah the fourth: all the sons and brethren of Hosah [were] thirteen.";
web[12] = "Among these [were] the divisions of the porters, [even] among the chief men, having wards one against another, to minister in the house of the LORD.";
web[13] = "And they cast lots, as well the small as the great, according to the house of their fathers, for every gate.";
web[14] = "And the lot eastward fell to Shelemiah. Then for Zechariah his son, a wise counselor, they cast lots; and his lot came out northward.";
web[15] = "To obed-edom southward; and to his sons the house of Asuppim.";
web[16] = "To Shuppim and Hosah [the lot came forth] westward, with the gate Shallecheth, by the way of the ascent, ward against ward.";
web[17] = "Eastward [were] six Levites, northward four a day, southward four a day, and towards Asuppim, two [and] two.";
web[18] = "At Parbar westward, four at the causey, [and] two at Parbar.";
web[19] = "These [are] the divisions of the porters among the sons of Kore, and among the sons of Merari.";
web[20] = "And of the Levites, Ahijah [was] over the treasures of the house of God, and over the treasures of the dedicated things.";
web[21] = "[As concerning] the sons of Laadan; the sons of the Gershonite Laadan, chief fathers, [even] of Laadan the Gershonite, [were] Jehieli.";
web[22] = "The sons of Jehieli; Zetham, and Joel his brother, [who were] over the treasures of the house of the LORD.";
web[23] = "Of the Amramites, [and] the Izharites, the Hebronites, [and] the Uzzielites:";
web[24] = "And Shebuel the son of Gershom, the son of Moses, [was] ruler of the treasures.";
web[25] = "And his brethren by Eliezer; Rehabiah his son, and Jeshaiah his son, and Joram his son, and Zichri his son, and Shelomith his son.";
web[26] = "Which Shelomith and his brethren [were] over all the treasures of the dedicated things, which David the king, and the chief fathers, the captains over thousands and hundreds, and the captains of the host, had dedicated.";
web[27] = "Out of the spoils won in battles did they dedicate to maintain the house of the LORD.";
web[28] = "And all that Samuel the seer, and Saul the son of Kish, and Abner the son of Ner, and Joab the son of Zeruiah, had dedicated; [and] whoever had dedicated [any thing], [it was] under the hand of Shelomith, and of his brethren.";
web[29] = "Of the Izharites, Chenaniah and his sons [were] for the outward business over Israel, for officers and judges.";
web[30] = "[And] of the Hebronites, Hashabiah and his brethren, men of valor, a thousand and seven hundred, [were] officers among them of Israel on this side of Jordan westward in all the business of the LORD, and in the service of the king.";
web[31] = "Among the Hebronites [was] Jerijah the chief, [even] among the Hebronites, according to the generations of his fathers. In the fortieth year of the reign of David they were sought for, and there were found among them mighty men of valor at Jazer of Gilead.";
web[32] = "And his brethren, men of valor, [were] two thousand and seven hundred chief fathers, whom king David made rulers over the Reubenites, the Gadites, and the half-tribe of Manasseh, for every matter pertaining to God, and affairs of the king.";
yng[1] = "For the courses of the gatekeepers: of the Korhites [is] Meshelemiah son of Kore, of the sons of Asaph;";
yng[2] = "and to Meshelemiah [are] sons, Zechariah the first-born, Jediael the second, Zebadiah the third, Jathniel the fourth,";
yng[3] = "Elam the fifth, Jehohanan the sixth, Elioenai the seventh.";
yng[4] = "And to Obed-Edom [are] sons, Shemaiah the first-born, Jehozabad the second, Joah the third, and Sacar the fourth, and Nethaneel the fifth,";
yng[5] = "Ammiel the sixth, Issachar the seventh, Peullethai the eighth, for God hath blessed him.";
yng[6] = "And to Shemaiah his son have sons been born, who are ruling throughout the house of their father, for they [are] mighty of valour.";
yng[7] = "Sons of Shemaiah [are] Othni, and Rephael, and Obed, Elzabad; his brethren [are] sons of valour, Elihu and Semachiah,";
yng[8] = "all these [are] of the sons of Obed-Edom; they, and their sons, and their brethren, men of valour with might for service, [are] sixty and two of Obed-Edom.";
yng[9] = "And to Meshelemiah [are] sons and brethren, sons of valour, eighteen;";
yng[10] = "and to Hosah, of the sons of Merari, [are] sons: Shimri the head (though he was not first-born, yet his father setteth him for head),";
yng[11] = "Hilkiah the second, Tebaliah the third, Zechariah the fourth; all the sons and brethren of Hosah [are] thirteen.";
yng[12] = "According to these [are] the courses of the gatekeepers; to the heads of the mighty ones [are] charges over-against their brethren, to minister in the house of Jehovah,";
yng[13] = "and they cause to fall lots, as well the small as the great, according to the house of their fathers, for gate and gate.";
yng[14] = "And the lot falleth eastward to Shelemiah; and [for] Zechariah his son -- a counsellor with understanding -- they cause to fall lots, and his lot goeth out northward:";
yng[15] = "to Obed-Edom southward, and to his sons, the house of the gatherings;";
yng[16] = "to Shuppim and to Hosah to the west, with the gate Shallecheth, in the highway, the ascent, charge over-against charge;";
yng[17] = "to the east the Levites [are] six; to the north daily four, to the south daily four, and to the gatherings two by two,";
yng[18] = "at Parbar, to the west, [are] four at the highway, two at Parbar.";
yng[19] = "These are the courses of the gatekeepers, of the sons of the Korhite, and of the sons of Merari.";
yng[20] = "And of the Levites, Ahijah [is] over the treasures of the house of God, even for the treasures of the holy things.";
yng[21] = "Sons of Laadan: sons of the Gershonite, of Laadan, heads of the fathers of Laadan the Gershonite: Jehieli.";
yng[22] = "Sons of Jehieli: Zetham, and Joel his brother, over the treasures of the house of Jehovah,";
yng[23] = "for the Amramite, for the Izharite, for the Hebronite, for the Uzzielite.";
yng[24] = "And Shebuel son of Gershom, son of Moses, [is] president over the treasures.";
yng[25] = "And his brethren, of Eliezer, [are] Rehabiah his son, and Jeshaiah his son, and Joram his son, and Zichri his son, and Shelomith his son.";
yng[26] = "This Shelomith and his brethren [are] over all the treasures of the holy things, that David the king, and heads of the fathers, even heads of thousands, and of hundreds, and heads of the host, sanctified;";
yng[27] = "from the battles, even from the spoil they sanctified to strengthen the house of Jehovah;";
yng[28] = "and all that Samuel the seer, and Saul son of Kish, and Abner son of Ner, and Joab son of Zeruiah sanctified, every one sanctifying [any thing -- it is] by the side of Shelomith and his brethren.";
yng[29] = "Of the Izharite, Chenaniah and his sons [are] for the outward work over Israel, for officers and for judges.";
yng[30] = "Of the Hebronite, Hashabiah and his brethren, sons of valour, a thousand and seven hundred, [are] over the inspection of Israel, beyond the Jordan westward, for all the work of Jehovah, and for the service of the king.";
yng[31] = "Of the Hebronite, Jerijah [is] the head, of the Hebronite, according to his generations, for the fathers -- in the fortieth year of the reign of David they have been sought out, and there are found among them mighty ones of valour, in Jazer of Gilead --";
yng[32] = "and his brethren, sons of valour, two thousand and seven hundred, [are] heads of the fathers, and king David appointeth them over the Reubenite, and the Gadite, and the half of the tribe of Manasseh, for every matter of God and matter of the king.";
csb[1] = "The following were the divisions of the gatekeepers: From the Korahites: Meshelemiah son of Kore, one of the sons of Asaph.";
csb[2] = "Meshelemiah had sons: Zechariah the firstborn, Jediael the second, Zebadiah the third, Jathniel the fourth,";
csb[3] = "Elam the fifth, Jehohanan the sixth, and Eliehoenai the seventh.";
csb[4] = "Obed-edom also had sons: Shemaiah the firstborn, Jehozabad the second, Joah the third, Sachar the fourth, Nethanel the fifth,";
csb[5] = "Ammiel the sixth, Issachar the seventh, and Peullethai the eighth, for God blessed him.";
csb[6] = "Also, to his son Shemaiah were born sons who ruled their ancestral families because they were strong, capable men.";
csb[7] = "Shemaiah\'s sons: Othni, Rephael, Obed, and Elzabad; his relatives Elihu and Semachiah were also capable men.";
csb[8] = "All of these were among the sons of Obed-edom with their sons and relatives; they were capable men with strength for the work -- sixty-two from Obed-edom.";
csb[9] = "Meshelemiah also had sons and relatives who were capable men -- eighteen.";
csb[10] = "Hosah, from the Merarites, also had sons: Shimri the first (although he was not the firstborn, his father had appointed him as the first),";
csb[11] = "Hilkiah the second, Tebaliah the third, and Zechariah the fourth. The sons and relatives of Hosah were thirteen in all.";
csb[12] = "These divisions of the gatekeepers, under their leading men, had duties for ministering in the LORD\'s temple, just as their relatives did.";
csb[13] = "They cast lots for each temple gate according to their ancestral families, young and old alike.";
csb[14] = "The lot for the east gate fell to Shelemiah. They also cast lots for his son Zechariah, an insightful counselor, and his lot came out for the north gate.";
csb[15] = "Obed-edom\'s was the south gate, and his sons\' lot was for the storehouses;";
csb[16] = "it was the west gate and the gate of Shallecheth on the ascending highway for Shuppim and Hosah. There were guards stationed at every watch.";
csb[17] = "There were six Levites each day on the east, four each day on the north, four each day on the south, and two pair at the storehouses.";
csb[18] = "As for the court on the west, there were four at the highway and two at the court.";
csb[19] = "Those were the divisions of the gatekeepers from the descendants of the Korahites and Merarites.";
csb[20] = "From the Levites, Ahijah was in charge of the treasuries of God\'s temple and the treasuries of what had been dedicated.";
csb[21] = "From the sons of Ladan, who were the descendants of the Gershonites through Ladan and were the family heads belonging to Ladan the Gershonite: Jehieli.";
csb[22] = "The sons of Jehieli, Zetham and his brother Joel, were in charge of the treasuries of the LORD\'s temple.";
csb[23] = "From the Amramites, the Izharites, the Hebronites, and the Uzzielites:";
csb[24] = "Shebuel, a descendant of Moses\'s son Gershom, was the officer in charge of the treasuries.";
csb[25] = "His relatives through Eliezer: his son Rehabiah, his son Jeshaiah, his son Joram, his son Zichri, and his son Shelomith.";
csb[26] = "This Shelomith and his relatives were in charge of all the treasuries of what had been dedicated by King David, by the family heads who were the commanders of thousands and of hundreds, and by the army commanders.";
csb[27] = "They dedicated part of the plunder from their battles for the repair of the LORD\'s temple.";
csb[28] = "All that the seer Samuel, Saul son of Kish, Abner son of Ner, and Joab son of Zeruiah had dedicated, along with everything else that had been dedicated, were in the care of Shelomith and his relatives.";
csb[29] = "From the Izrahites: Chenaniah and his sons had duties outside the temple as officers and judges over Israel.";
csb[30] = "From the Hebronites: Hashabiah and his relatives, 1,700 capable men, had assigned duties in Israel west of the Jordan for all the work of the LORD and for the service of the king.";
csb[31] = "From the Hebronites: Jerijah was the head of the Hebronites, according to the family records of his ancestors. A search was made in the fortieth year of David\'s reign and strong, capable men were found among them at Jazer in Gilead.";
csb[32] = "There were among Jerijah\'s relatives 2,700 capable men who were family heads. King David appointed them over the Reubenites, the Gadites, and half the tribe of Manasseh as overseers in every matter relating to God and the king.";
