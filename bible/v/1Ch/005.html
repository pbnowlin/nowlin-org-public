asv[1] = "And the sons of Reuben the first-born of Israel (for he was the first-born; but, forasmuch as he defiled his father\'s couch, his birthright was given unto the sons of Joseph the son of Israel; and the genealogy is not to be reckoned after the birthright.";
asv[2] = "For Judah prevailed above his brethren, and of him came the prince; but the birthright was Joseph\'s),";
asv[3] = "the sons of Reuben the first-born of Israel: Hanoch, and Pallu, Hezron, and Carmi.";
asv[4] = "The sons of Joel: Shemaiah his son, Gog his son, Shimei his son,";
asv[5] = "Micah his son, Reaiah his son, Baal his son,";
asv[6] = "Beerah his son, whom Tilgath-pilneser king of Assyria carried away captive: he was prince of the Reubenites.";
asv[7] = "And his brethren by their families, when the genealogy of their generations was reckoned: the chief, Jeiel, and Zechariah,";
asv[8] = "and Bela the son of Azaz, the son of Shema, the son of Joel, who dwelt in Aroer, even unto Nebo and Baal-meon:";
asv[9] = "and eastward he dwelt even unto the entrance of the wilderness from the river Euphrates, because their cattle were multiplied in the land of Gilead.";
asv[10] = "And in the days of Saul, they made war with the Hagrites, who fell by their hand; and they dwelt in their tents throughout all the [land] east of Gilead.";
asv[11] = "And the sons of Gad dwelt over against them, in the land of Bashan unto Salecah:";
asv[12] = "Joel the chief, and Shapham the second, and Janai, and Shaphat in Bashan.";
asv[13] = "And their brethren of their fathers\' houses: Michael, and Meshullam, and Sheba, and Jorai, and Jacan, and Zia, and Eber, seven.";
asv[14] = "These were the sons of Abihail, the son of Huri, the son of Jaroah, the son of Gilead, the son of Michael, the son of Jeshishai, the son of Jahdo, the son of Buz;";
asv[15] = "Ahi the son of Abdiel, the son of Guni, chief of their fathers\' houses.";
asv[16] = "And they dwelt in Gilead in Bashan, and in its towns, and in all the suburbs of Sharon, as far as their borders.";
asv[17] = "All these were reckoned by genealogies in the days of Jotham king of Judah, and in the days of Jeroboam king of Israel.";
asv[18] = "The sons of Reuben, and the Gadites, and the half-tribe of Manasseh, of valiant men, men able to bear buckler and sword, and to shoot with bow, and skilful in war, were forty and four thousand seven hundred and threescore, that were able to go forth to war.";
asv[19] = "And they made war with the Hagrites, with Jetur, and Naphish, and Nodab.";
asv[20] = "And they were helped against them, and the Hagrites were delivered into their hand, and all that were with them; for they cried to God in the battle, and he was entreated of them, because they put their trust in him.";
asv[21] = "And they took away their cattle; of their camels fifty thousand, and of sheep two hundred and fifty thousand, and of asses two thousand, and of men a hundred thousand.";
asv[22] = "For there fell many slain, because the war was of God. And they dwelt in their stead until the captivity.";
asv[23] = "And the children of the half-tribe of Manasseh dwelt in the land: they increased from Bashan unto Baal-hermon and Senir and mount Hermon.";
asv[24] = "And these were the heads of their fathers\' houses: even Epher, and Ishi, and Eliel, and Azriel, and Jeremiah, and Hodaviah, and Jahdiel, mighty men of valor, famous men, heads of their fathers\' houses.";
asv[25] = "And they trespassed against the God of their fathers, and played the harlot after the gods of the peoples of the land, whom God destroyed before them.";
asv[26] = "And the God of Israel stirred up the spirit of Pul king of Assyria, and the spirit of Tilgath-pilneser king of Assyria, and he carried them away, even the Reubenites, and the Gadites, and the half-tribe of Manasseh, and brought them unto Halah, and Habor, and Hara, and to the river of Gozan, unto this day.";

hnv[1] = "The sons of Re\'uven the firstborn of Yisra\'el (for he was the firstborn; but, because he defiled his father\'s couch, his birthright was given to the sons of Yosef the son of Yisra\'el; and the genealogy is not to be reckoned after the birthright.";
hnv[2] = "For Yehudah prevailed above his brothers, and of him came the prince; but the birthright was Yosef\'s:)";
hnv[3] = "the sons of Re\'uven the firstborn of Yisra\'el: Hanokh, and Pallu, Hetzron, and Karmi.";
hnv[4] = "The sons of Yo\'el: Shemayah his son, Gog his son, Shim`i his son,";
hnv[5] = "Mikhah his son, Re\'ayah his son, Ba`al his son,";
hnv[6] = "Be\'erah his son, whom Tilgat-Pilne\'eser king of Ashshur carried away captive: he was prince of the Re\'uveni.";
hnv[7] = " His brothers by their families, when the genealogy of their generations was reckoned: the chief, Ye`i\'el, and Zekharyah,";
hnv[8] = "and Bela the son of Azaz, the son of Shema, the son of Yo\'el, who lived in `Aro`er, even to Nevo and Ba`al-Me`on:";
hnv[9] = "and eastward he lived even to the entrance of the wilderness from the river Perat, because their cattle were multiplied in the land of Gil`ad.";
hnv[10] = "In the days of Sha\'ul, they made war with the Hagrim, who fell by their hand; and they lived in their tents throughout all the [land] east of Gil`ad.";
hnv[11] = "The sons of Gad lived over against them, in the land of Bashan to Salkhah:";
hnv[12] = "Yo\'el the chief, and Shafam the second, and Ya`nai, and Shafat in Bashan.";
hnv[13] = "Their brothers of their fathers\' houses: Mikha\'el, and Meshullam, and Sheva, and Yorai, and Ya`kan, and Zia, and `Ever, seven.";
hnv[14] = "These were the sons of Avichayil, the son of Huri, the son of Yao`ach, the son of Gil`ad, the son of Mikha\'el, the son of Yeshishai, the son of Yachdo, the son of Buz;";
hnv[15] = "Achi the son of `Avdi\'el, the son of Guni, chief of their fathers\' houses.";
hnv[16] = "They lived in Gil`ad in Bashan, and in its towns, and in all the suburbs of Sharon, as far as their borders.";
hnv[17] = "All these were reckoned by genealogies in the days of Yotam king of Yehudah, and in the days of Yarov`am king of Yisra\'el.";
hnv[18] = "The sons of Re\'uven, and the Gadi, and the half-tribe of Menashsheh, of valiant men, men able to bear buckler and sword, and to shoot with bow, and skillful in war, were forty-four thousand seven hundred and sixty, that were able to go forth to war.";
hnv[19] = "They made war with the Hagrim, with Yetur, and Nafish, and Nodav.";
hnv[20] = "They were helped against them, and the Hagrim were delivered into their hand, and all who were with them; for they cried to God in the battle, and he was entreated of them, because they put their trust in him.";
hnv[21] = "They took away their cattle; of their camels fifty thousand, and of sheep two hundred fifty thousand, and of donkeys two thousand, and of men one hundred thousand.";
hnv[22] = "For there fell many slain, because the war was of God. They lived in their place until the captivity.";
hnv[23] = "The children of the half-tribe of Menashsheh lived in the land: they increased from Bashan to Ba`al-Hermon and Senir and Mount Hermon.";
hnv[24] = "These were the heads of their fathers\' houses: even `Efer, and Yish`i, and Eli\'el, and `Azri\'el, and Yirmeyahu, and Hodavyah, and Yachdi\'el, mighty men of valor, famous men, heads of their fathers\' houses.";
hnv[25] = "They trespassed against the God of their fathers, and played the prostitute after the gods of the peoples of the land, whom God destroyed before them.";
hnv[26] = "The God of Yisra\'el stirred up the spirit of Pul king of Ashshur, and the spirit of Tilgat-Pilne\'eser king of Ashshur, and he carried them away, even the Re\'uveni, and the Gadi, and the half-tribe of Menashsheh, and brought them to Halach, and Havor, and Hara, and to the river of Gozan, to this day.";
kjv[1] = "Now the sons of Reuben the firstborn of Israel, (for he [was] the firstborn; but, forasmuch as he defiled his father\'s bed, his birthright was given unto the sons of Joseph the son of Israel: and the genealogy is not to be reckoned after the birthright.";

kjv[3] = "The sons, [I say], of Reuben the firstborn of Israel [were], Hanoch, and Pallu, Hezron, and Carmi.";
kjv[4] = "The sons of Joel; Shemaiah his son, Gog his son, Shimei his son,";
kjv[5] = "Micah his son, Reaia his son, Baal his son,";

kjv[9] = "And eastward he inhabited unto the entering in of the wilderness from the river Euphrates: because their cattle were multiplied in the land of Gilead.";
kjv[10] = "And in the days of Saul they made war with the Hagarites, who fell by their hand: and they dwelt in their tents throughout all the east [land] of Gilead.";

kjv[14] = "These [are] the children of Abihail the son of Huri, the son of Jaroah, the son of Gilead, the son of Michael, the son of Jeshishai, the son of Jahdo, the son of Buz;";
kjv[15] = "Ahi the son of Abdiel, the son of Guni, chief of the house of their fathers.";
kjv[16] = "And they dwelt in Gilead in Bashan, and in her towns, and in all the suburbs of Sharon, upon their borders.";
kjv[17] = "All these were reckoned by genealogies in the days of Jotham king of Judah, and in the days of Jeroboam king of Israel.";
kjv[18] = "The sons of Reuben, and the Gadites, and half the tribe of Manasseh, of valiant men, men able to bear buckler and sword, and to shoot with bow, and skilful in war, [were] four and forty thousand seven hundred and threescore, that went out to the war.";
kjv[19] = "And they made war with the Hagarites, with Jetur, and Nephish, and Nodab.";

kjv[24] = "And these [were] the heads of the house of their fathers, even Epher, and Ishi, and Eliel, and Azriel, and Jeremiah, and Hodaviah, and Jahdiel, mighty men of valour, famous men, [and] heads of the house of their fathers.";

rsv[1] = "The sons of Reuben the first-born of Israel (for he was the first-born; but because he polluted his father\'s couch, his birthright was given to the sons of Joseph the son of Israel, so that he is not enrolled in the genealogy according to the birthright;";
rsv[2] = "though Judah became strong among his brothers and a prince was from him, yet the birthright belonged to Joseph),";
rsv[3] = "the sons of Reuben, the first-born of Israel: Hanoch, Pallu, Hezron, and Carmi.";
rsv[4] = "The sons of Jo\'el: Shemai\'ah his son, Gog his son, Shim\'e-i his son,";
rsv[5] = "Micah his son, Re-ai\'ah his son, Ba\'al his son,";
rsv[6] = "Be-er\'ah his son, whom Til\'gath-pilne\'ser king of Assyria carried away into exile; he was a chieftain of the Reubenites.";
rsv[7] = "And his kinsmen by their families, when the genealogy of their generations was reckoned: the chief, Je-i\'el, and Zechari\'ah,";
rsv[8] = "and Bela the son of Azaz, son of Shema, son of Jo\'el, who dwelt in Aro\'er, as far as Nebo and Ba\'al-me\'on.";
rsv[9] = "He also dwelt to the east as far as the entrance of the desert this side of the Euphra\'tes, because their cattle had multiplied in the land of Gilead.";
rsv[10] = "And in the days of Saul they made war on the Hagrites, who fell by their hand; and they dwelt in their tents throughout all the region east of Gilead.";
rsv[11] = "The sons of Gad dwelt over against them in the land of Bashan as far as Sal\'ecah:";
rsv[12] = "Jo\'el the chief, Shapham the second, Ja\'nai, and Shaphat in Bashan.";
rsv[13] = "And their kinsmen according to their fathers\' houses: Michael, Meshul\'lam, Sheba, Jo\'rai, Jacan, Zi\'a, and Eber, seven.";
rsv[14] = "These were the sons of Ab\'ihail the son of Huri, son of Jaro\'ah, son of Gilead, son of Michael, son of Jeshish\'ai, son of Jahdo, son of Buz;";
rsv[15] = "Ahi the son of Ab\'di-el, son of Guni, was chief in their fathers\' houses;";
rsv[16] = "and they dwelt in Gilead, in Bashan and in its towns, and in all the pasture lands of Sharon to their limits.";
rsv[17] = "All of these were enrolled by genealogies in the days of Jotham king of Judah, and in the days of Jerobo\'am king of Israel.";
rsv[18] = "The Reubenites, the Gadites, and the half-tribe of Manas\'seh had valiant men, who carried shield and sword, and drew the bow, expert in war, forty-four thousand seven hundred and sixty, ready for service.";
rsv[19] = "They made war upon the Hagrites, Jetur, Naphish, and Nodab;";
rsv[20] = "and when they received help against them, the Hagrites and all who were with them were given into their hands, for they cried to God in the battle, and he granted their entreaty because they trusted in him.";
rsv[21] = "They carried off their livestock: fifty thousand of their camels, two hundred and fifty thousand sheep, two thousand asses, and a hundred thousand men alive.";
rsv[22] = "For many fell slain, because the war was of God. And they dwelt in their place until the exile.";
rsv[23] = "The members of the half-tribe of Manas\'seh dwelt in the land; they were very numerous from Bashan to Ba\'al-her\'mon, Senir, and Mount Hermon.";
rsv[24] = "These were the heads of their fathers\' houses: Epher, Ishi, Eli\'el, Az\'ri-el, Jeremiah, Hodavi\'ah, and Jah\'di-el, mighty warriors, famous men, heads of their fathers\' houses.";
rsv[25] = "But they transgressed against the God of their fathers, and played the harlot after the gods of the peoples of the land, whom God had destroyed before them.";
rsv[26] = "So the God of Israel stirred up the spirit of Pul king of Assyria, the spirit of Til\'gath-pilne\'ser king of Assyria, and he carried them away, namely, the Reubenites, the Gadites, and the half-tribe of Manas\'seh, and brought them to Halah, Habor, Hara, and the river Gozan, to this day.";
vul[1] = "filii quoque Ruben primogeniti Israhel ipse quippe fuit primogenitus eius sed cum violasset torum patris sui data sunt primogenita eius filiis Ioseph filii Israhel et non est ille reputatus in primogenitum";
vul[2] = "porro Iudas qui erat fortissimus inter fratres suos de stirpe eius principes germinati sunt primogenita autem reputata sunt Ioseph";
vul[3] = "filii ergo Ruben primogeniti Israhel Enoch et Phallu Esrom et Charmi";
vul[4] = "filii Iohel Samaia filius eius Gog filius eius Semei filius eius";
vul[5] = "Micha filius eius Reeia filius eius Baal filius eius";
vul[6] = "Beera filius eius quem captivum duxit Theglathphalnasar rex Assyriorum et fuit princeps in tribu Ruben";
vul[7] = "fratres autem eius et universa cognatio quando numerabantur per familias suas habuerunt principes Ieihel et Zacchariam";
vul[8] = "porro Bala filius Azaz filii Samma filii Iohel ipse habitavit in Aroer usque ad Nebo et Beelmeon";
vul[9] = "contra orientalem quoque plagam habitavit usque ad introitum heremi et flumen Eufraten multum quippe iumentorum numerum possidebat in terra Galaad";
vul[10] = "in diebus autem Saul proeliati sunt contra Agareos et interfecerunt illos habitaveruntque pro eis in tabernaculis eorum in omni plaga quae respicit ad orientem Galaad";
vul[11] = "filii vero Gad e regione eorum habitaverunt in terra Basan usque Selcha";
vul[12] = "Iohel in capite et Saphan secundus Ianai autem et Saphat in Basan";
vul[13] = "fratres vero eorum secundum domos cognationum suarum Michahel et Mosollam et Sebe et Iori et Iachan et Zie et Heber septem";
vul[14] = "hii filii Abiahil filii Uri filii Iaro filii Galaad filii Michahel filii Iesesi filii Ieddo filii Buz";
vul[15] = "fratres quoque filii Abdihel filii Guni princeps domus in familiis suis";
vul[16] = "et habitaverunt in Galaad et in Basan et in viculis eius et in cunctis suburbanis Saron usque ad terminos";
vul[17] = "omnes hii numerati sunt in diebus Ioatham regis Iuda et in diebus Hieroboam regis Israhel";
vul[18] = "filii Ruben et Gad et dimidiae tribus Manasse viri bellatores scuta portantes et gladios et tendentes arcum eruditique ad proelia quadraginta quattuor milia et septingenti sexaginta procedentes ad pugnam";
vul[19] = "dimicaverunt contra Agarenos Iturei vero et Naphei et Nodab";
vul[20] = "praebuerunt eis auxilium traditique sunt in manus eorum Agareni et universi qui fuerant cum eis quia Deum invocaverunt cum proeliarentur et exaudivit eos eo quod credidissent in eum";
vul[21] = "ceperuntque omnia quae possederant camelorum quinquaginta milia et ovium ducenta quinquaginta milia asinos duo milia et animas hominum centum milia";
vul[22] = "vulnerati autem multi corruerunt fuit enim bellum Domini habitaveruntque pro eis usque ad transmigrationem";
vul[23] = "filii quoque dimidiae tribus Manasse possederunt terram a finibus Basan usque Baalhermon et Sanir et montem Hermon ingens quippe numerus erat";
vul[24] = "et hii fuerunt principes domus cognationis eorum Epher et Iesi et Helihel Ezrihel et Hieremia et Odoia et Iedihel viri fortissimi et potentes et nominati duces in familiis suis";
vul[25] = "reliquerunt autem Deum patrum suorum et fornicati sunt post deos populorum terrae quos abstulit Dominus coram eis";
vul[26] = "et suscitavit Deus Israhel spiritum Ful regis Assyriorum et spiritum Theglathphalnasar regis Assur et transtulit Ruben et Gad et dimidium tribus Manasse et adduxit eos in Alae et Abor et Ara et fluvium Gozan usque ad diem hanc";

web[11] = "And the children of Gad dwelt over against them, in the land of Bashan to Salcah:";
web[12] = "Joel the chief, and Shapham the next, and Jaanai, and Shaphat in Bashan.";
web[13] = "And their brethren of the house of their fathers [were], Michael, and Meshullam, and Sheba, and Jorai, and Jachan, and Zia, and Heber, seven.";
web[14] = "These [are] the children of Abihail the son of Huri, the son of Jaroah, the son of Gilead, the son of Michael, the son of Jeshishai, the son of Jahdo, the son of Buz;";
web[15] = "Ahi the son of Abdiel, the son of Guni, chief of the house of their fathers.";
web[16] = "And they dwelt in Gilead in Bashan, and in its towns, and in all the suburbs of Sharon, upon their borders.";
web[17] = "All these were reckoned by genealogies in the days of Jotham king of Judah, and in the days of Jeroboam king of Israel.";
web[18] = "The sons of Reuben, and the Gadites, and half the tribe of Manasseh, of valiant men, men able to bear buckler and sword, and to shoot with bow, and skillful in war, [were] four and forty thousand seven hundred and sixty, that went out to the war.";
web[19] = "And they made war with the Hagarites, with Jetur, and Nephish, and Nodab.";
web[20] = "And they were helped against them, and the Hagarites were delivered into their hand, and all that [were] with them: for they cried to God in the battle, and he was entreated by them; because they put their trust in him.";
web[21] = "And they took away their cattle; of their camels fifty thousand, and of sheep two hundred and fifty thousand, and of asses two thousand, and of men a hundred thousand.";
web[22] = "For there fell down many slain, because the war [was] of God. And they dwelt in their steads until the captivity.";
web[23] = "And the children of the half tribe of Manasseh dwelt in the land: they increased from Bashan to Baal-hermon and Senir, and to mount Hermon.";
web[24] = "And these [were] the heads of the house of their fathers, even Epher, and Ishi, and Eliel, and Azriel, and Jeremiah, and Hodaviah, and Jahdiel, mighty men of valor, famous men, [and] heads of the house of their fathers.";
web[25] = "And they transgressed against the God of their fathers, and went astray after the gods of the people of the land, whom God destroyed before them.";
web[26] = "And the God of Israel stirred up the spirit of Pul king of Assyria, and the spirit of Tilgath-pilneser king of Assyria, and he carried them away, even the Reubenites, and the Gadites, and the half tribe of Manasseh, and brought them to Halah, and Habor, and Hara, and to the river Gozan, to this day.";
yng[1] = "As to sons of Reuben, first-born of Israel -- for he [is] the first-born, and on account of his profaning the couch of his father hath his birthright been given to the sons of Joseph son of Israel, and [he is] not to be reckoned by genealogy for the birthright,";
yng[2] = "for Judah hath been mighty over his brother, and for leader above him, and the birthright [is] to Joseph.";
yng[3] = "Sons of Reuben, first-born of Israel: Hanoch, and Pallu, Hezron, and Carmi.";
yng[4] = "Sons of Joel: Shemaiah his son, Gog his son, Shimei his son,";
yng[5] = "Micah his son, Reaiah his son, Baal his son,";
yng[6] = "Beerah his son, whom Tilgath-Pilneser king of Asshur removed; he [is] prince of the Reubenite.";
yng[7] = "And his brethren, by their families, in the genealogy of their generations, [are] heads: Jeiel, and Zechariah,";
yng[8] = "and Bela son of Azaz, son of Shema, son of Joel -- he is dwelling in Aroer, even unto Nebo and Baal-Meon;";
yng[9] = "and at the east he dwelt even unto the entering in of the wilderness, even from the river Phrat, for their cattle were multiplied in the land of Gilead.";
yng[10] = "And in the days of Saul they have made war with the Hagarites, who fall by their hand, and they dwell in their tents over all the face of the east of Gilead.";
yng[11] = "And the sons of Gad, over-against them have dwelt in the land of Bashan unto Salcah,";
yng[12] = "Joel the head, and Shapham the second, and Jaanai and Shaphat in Bashan;";
yng[13] = "and their brethren of the house of their fathers [are] Michael, and Meshullam, and Sheba, and Jorai, and Jachan, and Zia, and Heber, seven.";
yng[14] = "These [are] sons of Abihail son of Huri, son of Jaroah, son of Gilead, son of Michael, son of Jeshishai, son of Jahdo, son of Buz;";
yng[15] = "Ahi son of Abdiel, son of Guni, [is] head of the house of their fathers;";
yng[16] = "and they dwell in Gilead in Bashan, and in her small towns, and in all suburbs of Sharon, upon their outskirts;";
yng[17] = "all of them reckoned themselves by genealogy in the days of Jotham king of Judah, and in the days of Jeroboam king of Israel.";
yng[18] = "Sons of Reuben, and the Gadite, and the half of the tribe of Manasseh, of sons of valour, men bearing shield and sword, and treading bow, and taught in battle, [are] forty and four thousand and seven hundred and sixty, going out to the host.";
yng[19] = "And they make war with the Hagarites, and Jetur, and Naphish, and Nodab,";
yng[20] = "and they are helped against them, and the Hagarites are given into their hand, and all who [are] with them, for they cried to God in battle, and He was entreated of them, because they trusted in Him.";
yng[21] = "And they take captive their cattle, of their camels fifty thousand, and of sheep two hundred and fifty thousand, and of asses two thousand, and of human beings a hundred thousand;";
yng[22] = "for many have fallen pierced, for of God [is] the battle; and they dwell in their stead till the removal.";
yng[23] = "And the sons of the half of the tribe of Manasseh dwelt in the land, from Bashan unto Baal-Hermon, and Senir, and mount Hermon, they have multiplied.";
yng[24] = "And these [are] heads of the house of their fathers, even Epher, and Ishi, and Eliel, and Azriel, and Jeremiah, and Hodaviah, and Jahdiel, men mighty in valour, men of name, heads to the house of their fathers.";
yng[25] = "And they trespass against the God of their fathers, and go a-whoring after the gods of the peoples of the land whom God destroyed from their presence;";
yng[26] = "and stir up doth the God of Israel the spirit of Pul king of Asshur, and the spirit of Tilgath-Pilneser king of Asshur, and he removeth them -- even the Reubenite, and the Gadite, and the half of the tribe of Manasseh -- and bringeth them in to Halah, and Habor, and Hara, and the river of Gozan unto this day.";
csb[1] = "These were the sons of Reuben the firstborn of Israel. He was the firstborn, but his birthright was given to the sons of Joseph son of Israel, because Reuben defiled his father\'s bed. He is not listed in the genealogy according to birthright.";
csb[2] = "Although Judah became strong among his brothers and a ruler came from him, the birthright was given to Joseph.";
csb[3] = "The sons of Reuben, Israel\'s firstborn: Hanoch, Pallu, Hezron, and Carmi.";
csb[4] = "Joel\'s sons: his son Shemaiah, his son Gog, his son Shimei,";
csb[5] = "his son Micah, his son Reaiah, his son Baal,";
csb[6] = "and his son Beerah. Beerah was a leader of the Reubenites, and King Tiglath-pileser of Assyria took him into exile.";
csb[7] = "His relatives by their families as they are recorded in their family records: Jeiel the chief, Zechariah,";
csb[8] = "and Bela son of Azaz, son of Shema, son of Joel. They settled in Aroer as far as Nebo and Baal-meon.";
csb[9] = "They also settled in the east as far as the edge of the desert that extends to the Euphrates River, because their herds had increased in the land of Gilead.";
csb[10] = "During Saul\'s reign they waged war against the Hagrites, who were defeated by their power. And they lived in their tents throughout the region east of Gilead.";
csb[11] = "The sons of Gad lived next to them in the land of Bashan as far as Salecah:";
csb[12] = "Joel the chief, Shapham the second in command, Janai, and Shaphat in Bashan.";
csb[13] = "Their relatives according to their ancestral houses: Michael, Meshullam, Sheba, Jorai, Jacan, Zia, and Eber -- seven.";
csb[14] = "These were the sons of Abihail son of Huri, son of Jaroah, son of Gilead, son of Michael, son of Jeshishai, son of Jahdo, son of Buz.";
csb[15] = "Ahi son of Abdiel, son of Guni, was head of their ancestral family.";
csb[16] = "They lived in Gilead, in Bashan and its surrounding villages, and throughout the pasturelands of Sharon.";
csb[17] = "All of them were registered in the genealogies during the reigns of Judah\'s King Jotham and Israel\'s King Jeroboam.";
csb[18] = "The descendants of Reuben and Gad and half the tribe of Manasseh had 44,760 warriors who could serve in the army -- men who carried shield and sword, drew the bow, and were trained for war.";
csb[19] = "They waged war against the Hagrites, Jetur, Naphish, and Nodab.";
csb[20] = "They received help against these enemies because they cried out to God in battle, and the Hagrites and all their allies were handed over to them. He was receptive to their prayer because they trusted in him.";
csb[21] = "They captured the Hagrites\' livestock -- fifty thousand of their camels, two hundred fifty thousand sheep, and two thousand donkeys -- as well as one hundred thousand people.";
csb[22] = "Many of the Hagrites were killed because it was God\'s battle. And they lived there in the Hagrites\' place until the exile.";
csb[23] = "The descendants of half the tribe of Manasseh settled in the land from Bashan to Baal-hermon (that is, Senir or Mount Hermon); they were numerous.";
csb[24] = "These were the heads of their ancestral families: Epher, Ishi, Eliel, Azriel, Jeremiah, Hodaviah, and Jahdiel. They were valiant warriors, famous men, and heads of their ancestral houses.";
csb[25] = "But they were unfaithful to the God of their ancestors. They prostituted themselves with the gods of the nations God had destroyed before them.";
csb[26] = "So the God of Israel roused the spirit of King Pul (that is, Tiglath-pileser) of Assyria, and he took the Reubenites, Gadites, and half the tribe of Manasseh into exile. He took them to Halah, Habor, Hara, and Gozan\'s river, where they are until today.";
