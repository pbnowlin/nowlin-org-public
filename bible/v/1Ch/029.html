asv[1] = "And David the king said unto all the assembly, Solomon my son, whom alone God hath chosen, is yet young and tender, and the work is great; for the palace is not for man, but for Jehovah God.";
asv[2] = "Now I have prepared with all my might for the house of my God the gold for the [things of] gold, and the silver for the [things of] silver, and the brass for the [things of] brass, the iron for the [things of] iron, and wood for the [things of] wood; onyx stones, and [stones] to be set, stones for inlaid work, and of divers colors, and all manner of precious stones, and marble stones in abundance.";
asv[3] = "Moreover also, because I have set my affection on the house of my God, seeing that I have a treasure of mine own of gold and silver, I give it unto the house of my God, over and above all that I have prepared for the holy house,";
asv[4] = "even three thousand talents of gold, of the gold of Ophir, and seven thousand talents of refined silver, wherewith to overlay the walls of the houses;";
asv[5] = "of gold for the [things of] gold, and of silver for the [things of] silver, and for all manner of work [to be made] by the hands of artificers. Who then offereth willingly to consecrate himself this day unto Jehovah?";
asv[6] = "Then the princes of the fathers\' [houses], and the princes of the tribes of Israel, and the captains of thousands and of hundreds, with the rulers over the king\'s work, offered willingly;";
asv[7] = "and they gave for the service of the house of God of gold five thousand talents and ten thousand darics, and of silver ten thousand talents, and of brass eighteen thousand talents, and of iron a hundred thousand talents.";
asv[8] = "And they with whom [precious] stones were found gave them to the treasure of the house of Jehovah, under the hand of Jehiel the Gershonite.";
asv[9] = "Then the people rejoiced, for that they offered willingly, because with a perfect heart they offered willingly to Jehovah: and David the king also rejoiced with great joy.";
asv[10] = "Wherefore David blessed Jehovah before all the assembly; and David said, Blessed be thou, O Jehovah, the God of Israel our father, for ever and ever.";
asv[11] = "Thine, O Jehovah, is the greatness, and the power, and the glory, and the victory, and the majesty: for all that is in the heavens and in the earth [is thine]; thine is the kingdom, O Jehovah, and thou art exalted as head above all.";
asv[12] = "Both riches and honor come of thee, and thou rulest over all; and in thy hand is power and might; and in thy hand it is to make great, and to give strength unto all.";
asv[13] = "Now therefore, our God, we thank thee, and praise thy glorious name.";
asv[14] = "But who am I, and what is my people, that we should be able to offer so willingly after this sort? for all things come of thee, and of thine own have we given thee.";
asv[15] = "For we are strangers before thee, and sojourners, as all our fathers were: our days on the earth are as a shadow, and there is no abiding.";
asv[16] = "O Jehovah our God, all this store that we have prepared to build thee a house for thy holy name cometh of thy hand, and is all thine own.";
asv[17] = "I know also, my God, that thou triest the heart, and hast pleasure in uprightness. As for me, in the uprightness of my heart I have willingly offered all these things: and now have I seen with joy thy people, that are present here, offer willingly unto thee.";
asv[18] = "O Jehovah, the God of Abraham, of Isaac, and of Israel, our fathers, keep this for ever in the imagination of the thoughts of the heart of thy people, and prepare their heart unto thee;";
asv[19] = "and give unto Solomon my son a perfect heart, to keep thy commandments, thy testimonies, and thy statutes, and to do all these things, and to build the palace, for which I have made provision.";
asv[20] = "And David said to all the assembly, Now bless Jehovah your God. And all the assembly blessed Jehovah, the God of their fathers, and bowed down their heads, and worshipped Jehovah, and the king.";
asv[21] = "And they sacrificed sacrifices unto Jehovah, and offered burnt-offerings unto Jehovah, on the morrow after that day, even a thousand bullocks, a thousand rams, and a thousand lambs, with their drink-offerings, and sacrifices in abundance for all Israel,";
asv[22] = "and did eat and drink before Jehovah on that day with great gladness. And they made Solomon the son of David king the second time, and anointed him unto Jehovah to be prince, and Zadok to be priest.";
asv[23] = "Then Solomon sat on the throne of Jehovah as king instead of David his father, and prospered; and all Israel obeyed him.";
asv[24] = "And all the princes, and the mighty men, and all the sons likewise of king David, submitted themselves unto Solomon the king.";
asv[25] = "And Jehovah magnified Solomon exceedingly in the sight of all Israel, and bestowed upon him such royal majesty as had not been on any king before him in Israel.";
asv[26] = "Now David the son of Jesse reigned over all Israel.";
asv[27] = "And the time that he reigned over Israel was forty years; seven years reigned he in Hebron, and thirty and three [years] reigned he in Jerusalem.";
asv[28] = "And he died in a good old age, full of days, riches, and honor: and Solomon his son reigned in his stead.";
asv[29] = "Now the acts of David the king, first and last, behold, they are written in the history of Samuel the seer, and in the history of Nathan the prophet, and in the history of Gad the seer,";
asv[30] = "with all his reign and his might, and the times that went over him, and over Israel, and over all the kingdoms of the countries.";
dby[1] = "And king David said to all the congregation, Solomon my son, the one whom God has chosen, is young and tender, and the work is great; for this palace is not to be for man, but for Jehovah Elohim.";
dby[2] = "And I have prepared according to all my power for the house of my God gold for [things of] gold, and silver for [things of] silver, and brass for [things of] brass, iron for [things of] iron, and wood for [things of] wood; onyx stones, and [stones] to be set, glistering stones, and of divers colours, and all manner of precious stones, and white marble in abundance.";
dby[3] = "And moreover, in my affection for the house of my God I have given of my own property of gold and silver, for the house of my God, over and above all that I have prepared for the house of the sanctuary:";
dby[4] = "three thousand talents of gold, of the gold of Ophir, and seven thousand talents of refined silver, to overlay the walls of the houses;";
dby[5] = "gold for [things of] gold, and silver for [things of] silver, and for all manner of work by the hands of artificers. And who is willing to offer to Jehovah this day?";
dby[6] = "And the chief fathers and princes of the tribes of Israel, and the captains of thousands and of hundreds, and the comptrollers of the king\'s business, offered willingly.";
dby[7] = "And they gave for the service of the house of God five thousand talents and ten thousand darics of gold, and ten thousand talents of silver, and eighteen thousand talents of brass, and one hundred thousand talents of iron.";
dby[8] = "And they with whom stones were found gave [them] to the treasure of the house of Jehovah, into the hand of Jehiel the Gershonite.";
dby[9] = "And the people rejoiced because they offered willingly, for with perfect heart they offered willingly to Jehovah; and David the king also rejoiced with great joy.";
dby[10] = "And David blessed Jehovah in the sight of all the congregation; and David said, Blessed be thou, Jehovah, the God of our father Israel, for ever and ever.";
dby[11] = "Thine, Jehovah, is the greatness, and the power, and the glory, and the splendour, and the majesty; for all that is in the heavens and on the earth is thine: thine, Jehovah, is the kingdom, and thou art exalted as Head above all;";
dby[12] = "and riches and glory are of thee, and thou rulest over everything; and in thy hand is power and might; and in thy hand it is to make all great and strong.";
dby[13] = "And now, our God, we thank thee, and praise thy glorious name.";
dby[14] = "But who am I, and what is my people, that we should be able to offer willingly after this manner? for all is of thee, and of that which is from thy hand have we given thee.";
dby[15] = "For we are strangers before thee, and sojourners, as all our fathers: our days on the earth are as a shadow, and there is no hope [of life].";
dby[16] = "Jehovah our God, all this store that we have prepared to build thee a house to thy holy name, is of thy hand, and is all thine own.";
dby[17] = "And I know, my God, that thou triest the heart, and hast pleasure in uprightness. In the uprightness of my heart have I willingly offered all these things; and now have I seen with joy thy people, which are present here, offer willingly to thee.";
dby[18] = "Jehovah, God of Abraham, of Isaac, and of Israel, our fathers, keep this for ever in the imagination of the thoughts of the heart of thy people, and direct their hearts to thee!";
dby[19] = "And give to Solomon my son a perfect heart, to keep thy commandments, thy testimonies, and thy statutes, and to do all, and to build the palace, for which I have made provision.";
dby[20] = "And David said to all the congregation, Bless now Jehovah your God. And all the congregation blessed Jehovah the God of their fathers, and bowed down their heads, and did homage to Jehovah and the king.";
dby[21] = "And they sacrificed sacrifices to Jehovah, and offered up burnt-offerings to Jehovah, on the morrow after that day: a thousand bullocks, a thousand rams, a thousand lambs, with their drink-offerings, and sacrifices in abundance for all Israel.";
dby[22] = "And they ate and drank before Jehovah on that day with great joy. And they made Solomon the son of David king the second time, and anointed him to Jehovah to be prince, and Zadok to be priest.";
dby[23] = "And Solomon sat on the throne of Jehovah as king instead of David his father, and prospered; and all Israel obeyed him.";
dby[24] = "And all the princes, and the mighty men, and all the sons likewise of king David, submitted themselves to Solomon the king.";
dby[25] = "And Jehovah magnified Solomon exceedingly in the sight of all Israel, and bestowed upon him royal majesty such as had not been on any king before him in Israel.";
dby[26] = "Now David the son of Jesse reigned over all Israel.";
dby[27] = "And the time that he reigned over Israel was forty years: he reigned seven years in Hebron, and he reigned thirty-three years in Jerusalem.";
dby[28] = "And he died in a good old age, full of days, riches, and honour; and Solomon his son reigned in his stead.";
dby[29] = "And the acts of David the king, first and last, behold, they are written in the book of Samuel the seer, and in the book of Nathan the prophet, and in the book of Gad the seer;";
dby[30] = "with all his reign and his might, and the times that passed over him, and over Israel, and over all the kingdoms of the countries.";
hnv[1] = "David the king said to all the assembly, Shlomo my son, whom alone God has chosen, is yet young and tender, and the work is great; for the palace is not for man, but for the LORD God.";
hnv[2] = "Now I have prepared with all my might for the house of my God the gold for the [things of] gold, and the silver for the [things of] silver, and the brass for the [things of] brass, the iron for the [things of] iron, and wood for the [things of] wood; shoham stones, and [stones] to be set, stones for inlaid work, and of various colors, and all manner of precious stones, and marble stones in abundance.";
hnv[3] = "Moreover also, because I have set my affection on the house of my God, seeing that I have a treasure of my own of gold and silver, I give it to the house of my God, over and above all that I have prepared for the holy house,";
hnv[4] = "even three thousand talents of gold, of the gold of Ofir, and seven thousand talents of refined silver, with which to overlay the walls of the houses;";
hnv[5] = "of gold for the [things of] gold, and of silver for the [things of] silver, and for all manner of work [to be made] by the hands of artificers. Who then offers willingly to consecrate himself this day to the LORD?";
hnv[6] = "Then the princes of the fathers\' [houses], and the princes of the tribes of Yisra\'el, and the captains of thousands and of hundreds, with the rulers over the king\'s work, offered willingly;";
hnv[7] = "and they gave for the service of the house of God of gold five thousand talents and ten thousand darics, and of silver ten thousand talents, and of brass eighteen thousand talents, and of iron a hundred thousand talents.";
hnv[8] = "They with whom [precious] stones were found gave them to the treasure of the house of the LORD, under the hand of Yechi\'el the Gershonite.";
hnv[9] = "Then the people rejoiced, because they offered willingly, because with a perfect heart they offered willingly to the LORD: and David the king also rejoiced with great joy.";
hnv[10] = "Therefore David blessed the LORD before all the assembly; and David said, Blessed be you, LORD, the God of Yisra\'el our father, forever and ever.";
hnv[11] = "Yours, LORD, is the greatness, and the power, and the glory, and the victory, and the majesty: for all that is in the heavens and in the eretz [is your]; your is the kingdom, LORD, and you are exalted as head above all.";
hnv[12] = "Both riches and honor come of you, and you rule over all; and in your hand is power and might; and in your hand it is to make great, and to give strength to all.";
hnv[13] = "Now therefore, our God, we thank you, and praise your glorious name.";
hnv[14] = "But who am I, and what is my people, that we should be able to offer so willingly after this sort? for all things come of you, and of your own have we given you.";
hnv[15] = "For we are strangers before you, and foreigners, as all our fathers were: our days on the eretz are as a shadow, and there is no abiding.";
hnv[16] = "LORD our God, all this store that we have prepared to build you a house for your holy name comes of your hand, and is all your own.";
hnv[17] = "I know also, my God, that you try the heart, and have pleasure in uprightness. As for me, in the uprightness of my heart I have willingly offered all these things: and now have I seen with joy your people, that are present here, offer willingly to you.";
hnv[18] = " LORD, the God of Avraham, of Yitzchak, and of Yisra\'el, our fathers, keep this forever in the imagination of the thoughts of the heart of your people, and prepare their heart to you;";
hnv[19] = "and give to Shlomo my son a perfect heart, to keep your mitzvot, your testimonies, and your statutes, and to do all these things, and to build the palace, for which I have made provision.";
hnv[20] = "David said to all the assembly, Now bless the LORD your God. All the assembly blessed the LORD, the God of their fathers, and bowed down their heads, and worshiped the LORD, and the king.";
hnv[21] = "They sacrificed sacrifices to the LORD, and offered burnt offerings to the LORD, on the next day after that day, even one thousand bulls, one thousand rams, and one thousand lambs, with their drink-offerings, and sacrifices in abundance for all Yisra\'el,";
hnv[22] = "and ate and drink before the LORD on that day with great gladness. They made Shlomo the son of David king the second time, and anointed him to the LORD to be prince, and Tzadok to be Kohen.";
hnv[23] = "Then Shlomo sat on the throne of the LORD as king instead of David his father, and prospered; and all Yisra\'el obeyed him.";
hnv[24] = " All the princes, and the mighty men, and all the sons likewise of king David, submitted themselves to Shlomo the king.";
hnv[25] = "The LORD magnified Shlomo exceedingly in the sight of all Yisra\'el, and bestowed on him such royal majesty as had not been on any king before him in Yisra\'el.";
hnv[26] = "Now David the son of Yishai reigned over all Yisra\'el.";
hnv[27] = "The time that he reigned over Yisra\'el was forty years; seven years reigned he in Hevron, and thirty-three [years] reigned he in Yerushalayim.";
hnv[28] = "He died in a good old age, full of days, riches, and honor: and Shlomo his son reigned in his place.";
hnv[29] = "Now the acts of David the king, first and last, behold, they are written in the history of Shemu\'el the seer, and in the history of Natan the prophet, and in the history of Gad the seer,";
hnv[30] = "with all his reign and his might, and the times that went over him, and over Yisra\'el, and over all the kingdoms of the countries.";

rsv[2] = "So I have provided for the house of my God, so far as I was able, the gold for the things of gold, the silver for the things of silver, and the bronze for the things of bronze, the iron for the things of iron, and wood for the things of wood, besides great quantities of onyx and stones for setting, antimony, colored stones, all sorts of precious stones, and marble.";
rsv[3] = "Moreover, in addition to all that I have provided for the holy house, I have a treasure of my own of gold and silver, and because of my devotion to the house of my God I give it to the house of my God:";
rsv[4] = "three thousand talents of gold, of the gold of Ophir, and seven thousand talents of refined silver, for overlaying the walls of the house,";
rsv[5] = "and for all the work to be done by craftsmen, gold for the things of gold and silver for the things of silver. Who then will offer willingly, consecrating himself today to the LORD?&quot;";
rsv[6] = "Then the heads of fathers\' houses made their freewill offerings, as did also the leaders of the tribes, the commanders of thousands and of hundreds, and the officers over the king\'s work.";
rsv[7] = "They gave for the service of the house of God five thousand talents and ten thousand darics of gold, ten thousand talents of silver, eighteen thousand talents of bronze, and a hundred thousand talents of iron.";
rsv[8] = "And whoever had precious stones gave them to the treasury of the house of the LORD, in the care of Jehi\'el the Gershonite.";
rsv[9] = "Then the people rejoiced because these had given willingly, for with a whole heart they had offered freely to the LORD; David the king also rejoiced greatly.";
rsv[10] = "Therefore David blessed the LORD in the presence of all the assembly; and David said: &quot;Blessed art thou, O LORD, the God of Israel our father, for ever and ever.";
rsv[11] = "Thine, O LORD, is the greatness, and the power, and the glory, and the victory, and the majesty; for all that is in the heavens and in the earth is thine; thine is the kingdom, O LORD, and thou art exalted as head above all.";
rsv[12] = "Both riches and honor come from thee, and thou rulest over all. In thy hand are power and might; and in thy hand it is to make great and to give strength to all.";
rsv[13] = "And now we thank thee, our God, and praise thy glorious name.";
rsv[14] = "&quot;But who am I, and what is my people, that we should be able thus to offer willingly? For all things come from thee, and of thy own have we given thee.";
rsv[15] = "For we are strangers before thee, and sojourners, as all our fathers were; our days on the earth are like a shadow, and there is no abiding.";
rsv[16] = "O LORD our God, all this abundance that we have provided for building thee a house for thy holy name comes from thy hand and is all thy own.";
rsv[17] = "I know, my God, that thou triest the heart, and hast pleasure in uprightness; in the uprightness of my heart I have freely offered all these things, and now I have seen thy people, who are present here, offering freely and joyously to thee.";
rsv[18] = "O LORD, the God of Abraham, Isaac, and Israel, our fathers, keep for ever such purposes and thoughts in the hearts of thy people, and direct their hearts toward thee.";
rsv[19] = "Grant to Solomon my son that with a whole heart he may keep thy commandments, thy testimonies, and thy statutes, performing all, and that he may build the palace for which I have made provision.&quot;";
rsv[20] = "Then David said to all the assembly, &quot;Bless the LORD your God.&quot; And all the assembly blessed the LORD, the God of their fathers, and bowed their heads, and worshiped the LORD, and did obeisance to the king.";
rsv[21] = "And they performed sacrifices to the LORD, and on the next day offered burnt offerings to the LORD, a thousand bulls, a thousand rams, and a thousand lambs, with their drink offerings, and sacrifices in abundance for all Israel;";
rsv[22] = "and they ate and drank before the LORD on that day with great gladness. And they made Solomon the son of David king the second time, and they anointed him as prince for the LORD, and Zadok as priest.";
rsv[23] = "Then Solomon sat on the throne of the LORD as king instead of David his father; and he prospered, and all Israel obeyed him.";
rsv[24] = "All the leaders and the mighty men, and also all the sons of King David, pledged their allegiance to King Solomon.";
rsv[25] = "And the LORD gave Solomon great repute in the sight of all Israel, and bestowed upon him such royal majesty as had not been on any king before him in Israel.";
rsv[26] = "Thus David the son of Jesse reigned over all Israel.";
rsv[27] = "The time that he reigned over Israel was forty years; he reigned seven years in Hebron, and thirty-three years in Jerusalem.";
rsv[28] = "Then he died in a good old age, full of days, riches, and honor; and Solomon his son reigned in his stead.";
rsv[29] = "Now the acts of King David, from first to last, are written in the Chronicles of Samuel the seer, and in the Chronicles of Nathan the prophet, and in the Chronicles of Gad the seer,";
rsv[30] = "with accounts of all his rule and his might and of the circumstances that came upon him and upon Israel, and upon all the kingdoms of the countries.";
vul[1] = "locutusque est David rex ad omnem ecclesiam Salomonem filium meum unum elegit Deus adhuc puerum et tenellum opus autem grande est neque enim homini praeparatur habitatio sed Deo";
vul[2] = "ego autem totis viribus meis praeparavi inpensas domus Dei mei aurum ad vasa aurea et argentum in argentea aes in aenea ferrum in ferrea lignum ad lignea lapides onychinos et quasi stibinos et diversorum colorum omnem pretiosum lapidem et marmor parium abundantissime";
vul[3] = "et super haec quae obtuli in domum Dei mei de peculio meo aurum et argentum do in templum Dei mei exceptis his quae paravi in aedem sanctam";
vul[4] = "tria milia talenta auri de auro Ophir et septem milia talentorum argenti probatissimi ad deaurandos parietes templi";
vul[5] = "ut ubicumque opus est aurum de auro et ubicumque opus est argentum argenti opera fiant per manus artificum et si quis sponte offert impleat manum suam hodie et offerat quod voluerit Domino";
vul[6] = "polliciti sunt itaque principes familiarum et proceres tribuum Israhel tribuni quoque et centuriones et principes possessionum regis";
vul[7] = "dederuntque in opera domus Dei auri talenta quinque milia et solidos decem milia argenti talenta decem milia et aeris talenta decem et octo milia ferri quoque centum milia talentorum";
vul[8] = "et apud quemcumque inventi sunt lapides dederunt in thesaurum domus Domini per manum Ieihel Gersonitis";
vul[9] = "laetatusque est populus cum vota sponte promitterent quia corde toto offerebant ea Domino sed et David rex laetatus est gaudio magno";
vul[10] = "et benedixit Domino coram universa multitudine et ait benedictus es Domine Deus Israhel patris nostri ab aeterno in aeternum";
vul[11] = "tua est Domine magnificentia et potentia et gloria atque victoria et tibi laus cuncta enim quae in caelo sunt et in terra tua sunt tuum Domine regnum et tu es super omnes principes";
vul[12] = "tuae divitiae et tua est gloria tu dominaris omnium in manu tua virtus et potentia in manu tua magnitudo et imperium omnium";
vul[13] = "nunc igitur Deus noster confitemur tibi et laudamus nomen tuum inclitum";
vul[14] = "quis ego et quis populus meus ut possimus haec tibi universa promittere tua sunt omnia et quae de manu tua accepimus dedimus tibi";
vul[15] = "peregrini enim sumus coram te et advenae sicut omnes patres nostri dies nostri quasi umbra super terram et nulla est mora";
vul[16] = "Domine Deus noster omnis haec copia quam paravimus ut aedificaretur domus nomini sancto tuo de manu tua est et tua sunt omnia";
vul[17] = "scio Deus meus quod probes corda et simplicitatem diligas unde et ego in simplicitate cordis mei laetus obtuli universa haec et populum tuum qui hic reppertus est vidi cum ingenti gaudio tibi offerre donaria";
vul[18] = "Domine Deus Abraham et Isaac et Israhel patrum nostrorum custodi in aeternum hanc voluntatem cordis eorum et semper in venerationem tui mens ista permaneat";
vul[19] = "Salomoni quoque filio meo da cor perfectum ut custodiat mandata tua testimonia tua caerimonias tuas et faciat universa et aedificet aedem cuius inpensas paravi";
vul[20] = "praecepit autem David universae ecclesiae benedicite Domino Deo nostro et benedixit omnis ecclesia Domino Deo patrum suorum et inclinaverunt se et adoraverunt Deum et deinde regem";
vul[21] = "immolaveruntque victimas Domino et obtulerunt holocausta die sequenti tauros mille arietes mille agnos mille cum libaminibus suis et universo ritu abundantissime in omnem Israhel";
vul[22] = "et comederunt et biberunt coram Domino in die illo cum grandi laetitia et unxerunt secundo Salomonem filium David unxerunt autem Domino in principem et Sadoc in pontificem";
vul[23] = "seditque Salomon super solium Domini in regem pro David patre suo et cunctis placuit et paruit illi omnis Israhel";
vul[24] = "sed et universi principes et potentes et cuncti filii regis David dederunt manum et subiecti fuerunt Salomoni regi";
vul[25] = "magnificavit ergo Dominus Salomonem super omnem Israhel et dedit illi gloriam regni qualem nullus habuit ante eum rex Israhel";
vul[26] = "igitur David filius Isai regnavit super universum Israhel";
vul[27] = "et dies quibus regnavit super Israhel fuerunt quadraginta anni in Hebron regnavit septem annis et in Hierusalem triginta tribus";
vul[28] = "et mortuus est in senectute bona plenus dierum et divitiis et gloria regnavitque Salomon filius eius pro eo";
vul[29] = "gesta autem David regis priora et novissima scripta sunt in libro Samuhel videntis et in libro Nathan prophetae atque in volumine Gad videntis";
vul[30] = "universique regni eius et fortitudinis et temporum quae transierunt sub eo sive in Israhel sive in cunctis regnis terrarum";
web[1] = "Furthermore David the king said to all the congregation, Solomon my son, whom alone God hath chosen, [is yet] young and tender, and the work [is] great: for the palace [is] not for man, but for the LORD God.";
web[2] = "Now I have prepared with all my might for the house of my God the gold for [things to he made] of gold, and the silver for [things] of silver, and the brass for [things] of brass, the iron for [things] of iron, and wood for [things] of wood; onyx-stones, and [stones] to be set, glittering stones, and of divers colors, and all manner of precious stones, and marble stones in abundance.";
web[3] = "Moreover, because I have set my affection to the house of my God, I have of my own possessions, of gold and silver, [which] I have given to the house of my God, over and above all that I have prepared for the holy house,";
web[4] = "[Even] three thousand talents of gold, of the gold of Ophir, and seven thousand talents of refined silver, to overlay the walls of the houses:";
web[5] = "The gold for [things] of gold, and the silver for [things] of silver, and for all manner of work [to be made] by the hands of artificers. And who [then] is willing to consecrate his service this day to the LORD?";
web[6] = "Then the chief of the fathers and princes of the tribes of Israel, and the captains of thousands and of hundreds, with the rulers over the king\'s work, offered willingly,";
web[7] = "And gave for the service of the house of God of gold five thousand talents and ten thousand drams, and of silver ten thousand talents, and of brass eighteen thousand talents, and one hundred thousand talents of iron.";
web[8] = "And they with whom [precious] stones were found gave [them] to the treasure of the house of the LORD, by the hand of Jehiel the Gershonite.";
web[9] = "Then the people rejoiced, for that they offered willingly, because with perfect heart they offered willingly to the LORD: and David the king also rejoiced with great joy.";
web[10] = "Wherefore David blessed the LORD before all the congregation: and David said, Blessed [be] thou, LORD God of Israel our father, for ever and ever.";
web[11] = "Thine, O LORD, [is] the greatness, and the power, and the glory, and the victory, and the majesty: for all [that is] in the heaven and on the earth [is thine]; thine [is] the kingdom, O LORD, and thou art exalted as head above all.";
web[12] = "Both riches and honor [come] from thee, and thou reignest over all; and in thy hand [is] power and might; and in thy hand [it is] to make great, and to give strength to all.";
web[13] = "Now therefore, our God, we thank thee, and praise thy glorious name.";
web[14] = "But who [am] I, and what [is] my people, that we should be able to offer so willingly after this sort? for all things [come] from thee, and of thy own have we given thee.";
web[15] = "For we [are] strangers before thee, and sojourners, as [were] all our fathers: our days on the earth [are] as a shadow, and [there is] no abiding.";
web[16] = "O LORD our God, all this store that we have prepared to build thee a house for thy holy name [cometh] from thy hand, and [is] all thy own.";
web[17] = "I know also, my God, that thou triest the heart, and hast pleasure in uprightness. As for me, in the uprightness of my heart I have willingly offered all these things: and now have I seen with joy thy people, who are present here, to offer willingly to thee.";
web[18] = "O LORD God of Abraham, Isaac, and of Israel, our fathers, keep this for ever in the imagination of the thoughts of the heart of thy people, and prepare their heart to thee:";
web[19] = "And give to Solomon my son a perfect heart, to keep thy commandments, thy testimonies, and thy statutes, and to do all [these things], and to build the palace, [for] which I have made provision.";
web[20] = "And David said to all the congregation, Now bless the LORD your God. And all the congregation blessed the LORD God of their fathers, and bowed their heads, and worshiped the LORD, and the king.";
web[21] = "And they sacrificed sacrifices to the LORD, and offered burnt-offerings to the LORD, on the morrow after that day, [even] a thousand bullocks, a thousand rams, [and] a thousand lambs, with their drink-offerings, and sacrifices in abundance for all Israel:";
web[22] = "And ate and drank before the LORD on that day with great gladness. And they made Solomon the son of David king the second time, and anointed [him] to the LORD [to be] the chief governor, and Zadok [to be] priest.";
web[23] = "Then Solomon sat on the throne of the LORD as king instead of David his father, and prospered; and all Israel obeyed him.";
web[24] = "And all the princes, and the mighty men, and all the sons likewise of king David, submitted themselves to Solomon the king.";
web[25] = "And the LORD magnified Solomon exceedingly in the sight of all Israel, and bestowed upon him [such] royal majesty as had not been on any king before him in Israel.";
web[26] = "Thus David the son of Jesse reigned over all Israel.";
web[27] = "And the time that he reigned over Israel [was] forty years; seven years he reigned in Hebron, and thirty and three [years] he reigned in Jerusalem.";
web[28] = "And he died in a good old age, full of days, riches, and honor: and Solomon his son reigned in his stead.";
web[29] = "Now the acts of David the king, first and last, behold, they [are] written in the book of Samuel the seer, and in the book of Nathan the prophet, and in the book of Gad the seer,";
web[30] = "With all his reign and his might, and the times that went over him, and over Israel, and over all the kingdoms of the countries.";
yng[1] = "And David the king saith to all the assembly, `Solomon my son -- the one on whom God hath fixed -- [is] young and tender, and the work [is] great, for not for man is the palace, but for Jehovah God;";
yng[2] = "and with all my power I have prepared for the house of my God, the gold for [things of] gold, and the silver for [those of] silver, and the brass for [those of] brass, the iron for [those of] iron, and the wood for [those of] wood, shoham stones, and settings, and stones of painting and of diverse colours, and all [kinds of] precious stone, and stones of white marble, in abundance.";
yng[3] = "`And again, because of my delighting in the house of my God, the substance I have -- a peculiar treasure of gold and silver -- I have given for the house of my God, even over and above all I have prepared for the house of the sanctuary:";
yng[4] = "three thousand talents of gold, of the gold of Ophir, and seven thousand talents of refined silver, to overlay the walls of the houses,";
yng[5] = "even gold for [things of] gold, and silver for [those of] silver, and for all the work by the hand of artificers; and who [is] he that is offering willingly to consecrate his hand to-day to Jehovah?\'";
yng[6] = "And the heads of the fathers, and the heads of the tribes of Israel, and the heads of the thousands, and of the hundreds, even to the heads of the work of the king, offer willingly.";
yng[7] = "And they give for the service of the house of God, of gold -- talents five thousand, and drams a myriad; and of silver -- talents ten thousand, and of brass -- a myriad and eight thousand talents; and of iron -- a hundred thousand talents;";
yng[8] = "and he with whom stones are found hath given to the treasury of the house of Jehovah, by the hand of Jehiel the Gershonite.";
yng[9] = "And the people rejoice because of their offering willingly, for with a perfect heart they have offered willingly to Jehovah; and also David the king hath rejoiced -- great joy.";
yng[10] = "And David blesseth Jehovah before the eyes of all the assembly, and David saith, `Blessed [art] Thou, Jehovah, God of Israel our father, from age even unto age.";
yng[11] = "To Thee, O Jehovah, [is] the greatness, and the might, and the beauty, and the victory, and the honour, because of all in the heavens and in the earth; to Thee, O Jehovah, [is] the kingdom, and he who is lifting up himself over all for head;";
yng[12] = "and the riches, and the honour [are] from before Thee, and Thou art ruling over all, and in Thy hand [is] power and might, and in Thy hand, to make great, and to give strength to all.";
yng[13] = "`And now, our God, we are giving thanks to Thee, and giving praise to Thy beauteous name;";
yng[14] = "yea, because, who [am] I, and who [are] my people, that we retain power to offer thus willingly? but of Thee [is] the whole, and out of Thy hand we have given to Thee;";
yng[15] = "for sojourners we [are] before Thee, and settlers, like all our fathers; as a shadow [are] our days on the land, and there is none abiding.";
yng[16] = "`O Jehovah our God, all this store that we have prepared to build to Thee a house, for Thy holy name, [is] out of Thy hand, and of Thee [is] the whole.";
yng[17] = "`And I have known, my God, that Thou art trying the heart, and uprightness dost desire; I, in the uprightness of my heart, have willingly offered all these: and now, Thy people who are found here I have seen with joy to offer willingly to Thee.";
yng[18] = "`O Jehovah, God of Abraham, Isaac, and Israel, our fathers, keep this to the age for the imagination of the thoughts of the heart of Thy people, and prepare their heart unto Thee;";
yng[19] = "and to Solomon my son give a perfect heart, to keep Thy commands, Thy testimonies, and Thy statutes, and to do the whole, even to build the palace [for] which I have prepared.\'";
yng[20] = "And David saith to all the assembly, `Bless, I pray you, Jehovah your God;\' and all the assembly bless Jehovah, God of their fathers, and bow and do obeisance to Jehovah, and to the king.";
yng[21] = "And they sacrifice to Jehovah sacrifices, and cause to ascend burnt-offerings to Jehovah on the morrow of that day, bullocks a thousand, rams a thousand, lambs a thousand, and their oblations, even sacrifices in abundance, for all Israel.";
yng[22] = "And they eat and drink before Jehovah on that day with great joy, and cause Solomon son of David to reign a second time, and anoint [him] before Jehovah for leader, and Zadok for priest.";
yng[23] = "And Solomon sitteth on the throne of Jehovah for king instead of David his father, and prospereth, and all Israel hearken unto him,";
yng[24] = "and all the heads, and the mighty men, and also all the sons of king David have given a hand under Solomon the king;";
yng[25] = "and Jehovah maketh Solomon exceedingly great before the eyes of all Israel, and putteth upon him the honour of the kingdom that hath not been on any king over Israel before him.";
yng[26] = "And David son of Jesse hath reigned over all Israel,";
yng[27] = "and the days that he hath reigned over Israel [are] forty years; in Hebron he reigned seven years, and in Jerusalem he reigned thirty and three;";
yng[28] = "and he dieth in a good old age, satisfied with days, riches, and honour, and reign doth Solomon his son in his stead.";
yng[29] = "And the matters of David the king, the first and the last, lo, they are written beside the matters of Samuel the seer, and beside the matters of Nathan the prophet, and beside the matters of Gad the seer,";
yng[30] = "with all his reign, and his might, and the times that went over him, and over Israel, and over all kingdoms of the lands.";
csb[1] = "Then King David said to all the assembly, &quot;My son Solomon -- God has chosen him alone -- is young and inexperienced. The task is great because the building will not be built for a human but for the LORD God.";
csb[2] = "&quot;So to the best of my ability I\'ve made provision for the house of my God: gold for the gold articles, silver for the silver, bronze for the bronze, iron for the iron, and wood for the wood, as well as onyx, stones for mounting, antimony, stones of various colors, all kinds of precious stones, and a great quantity of marble.";
csb[3] = "&quot;Moreover, because of my delight in the house of my God, I now give my personal treasures of gold and silver for the house of my God over and above all that I\'ve provided for the holy house:";
csb[4] = "&quot;100 tons of gold (gold of Ophir) and 250 tons of refined silver for overlaying the walls of the buildings,";
csb[5] = "&quot;the gold for the gold work and the silver for the silver, for all the work to be done by the craftsmen. Now who will volunteer to consecrate himself to the LORD today? &quot;";
csb[6] = "Then the leaders of the households, the leaders of the tribes of Israel, the commanders of thousands and of hundreds, and the officials in charge of the king\'s work gave willingly.";
csb[7] = "For the service of God\'s house they gave 185 tons of gold and 10,000 gold coins, 375 tons of silver, 675 tons of bronze, and 4,000 tons of iron.";
csb[8] = "Whoever had precious stones gave them to the treasury of the LORD\'s house under the care of Jehiel the Gershonite.";
csb[9] = "Then the people rejoiced because of their leaders\' willingness to give, for they had given to the LORD wholeheartedly. King David also rejoiced greatly.";
csb[10] = "Then David blessed the LORD in the sight of all the assembly. David said, May you be blessed, LORD God of our father Israel, from eternity to eternity.";
csb[11] = "Yours, LORD, is the greatness and the power and the glory and the splendor and the majesty, for everything in the heavens and on earth belongs to you. Yours, LORD, is the kingdom, and you are exalted as head over all.";
csb[12] = "Riches and honor come from you, and you are the ruler of everything. Power and might are in your hand, and it is in your hand to make great and to give strength to all.";
csb[13] = "Now therefore, our God, we give you thanks and praise your glorious name.";
csb[14] = "But who am I, and who are my people, that we should be able to give as generously as this? For everything comes from you, and we have given you only what comes from your own hand.";
csb[15] = "For we are aliens and temporary residents in your presence as were all our ancestors. Our days on earth are like a shadow, without hope.";
csb[16] = "LORD our God, all this wealth that we\'ve provided for building you a house for your holy name comes from your hand; everything belongs to you.";
csb[17] = "I know, my God, that you test the heart and that you are pleased with what is right. I have willingly given all these things with an upright heart, and now I have seen your people who are present here giving joyfully and willingly to you.";
csb[18] = "LORD God of Abraham, Isaac, and Israel, our ancestors, keep this desire forever in the thoughts of the hearts of your people, and confirm their hearts toward you.";
csb[19] = "Give my son Solomon an undivided heart to keep and to carry out all your commands, your decrees, and your statutes, and to build the building for which I have made provision.";
csb[20] = "Then David said to the whole assembly, &quot;Blessed be the LORD your God.&quot; So the whole assembly praised the LORD God of their ancestors. They knelt low and paid homage to the LORD and the king.";
csb[21] = "The following day they offered sacrifices to the LORD and burnt offerings to the LORD: a thousand bulls, a thousand rams, and a thousand lambs, along with their drink offerings, and sacrifices in abundance for all Israel.";
csb[22] = "They ate and drank with great joy in the LORD\'s presence that day. Then, for a second time, they made David\'s son Solomon king; they anointed him as the LORD\'s ruler, and Zadok as the priest.";
csb[23] = "Solomon sat on the LORD\'s throne as king in place of his father David. He prospered, and all Israel obeyed him.";
csb[24] = "All the leaders and the mighty men, and all of King David\'s sons as well, pledged their allegiance to King Solomon.";
csb[25] = "The LORD highly exalted Solomon in the sight of all Israel and bestowed on him such royal majesty as had not been bestowed on any king over Israel before him.";
csb[26] = "David son of Jesse was king over all Israel.";
csb[27] = "The length of his reign over Israel was forty years; he reigned in Hebron for seven years and in Jerusalem for thirty-three.";
csb[28] = "He died at a good old age, full of days, riches, and honor, and his son Solomon became king in his place.";
csb[29] = "As for the events of King David\'s reign, from beginning to end, note that they are written in the Events of the Seer Samuel, the Events of the Prophet Nathan, and the Events of the Seer Gad,";
csb[30] = "along with all his reign, his might, and the incidents that affected him and Israel and all the kingdoms of the surrounding lands.";</script>
