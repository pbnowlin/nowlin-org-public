asv[1] = "These are the sons of Israel: Reuben, Simeon, Levi, and Judah, Issachar, and Zebulun,";
asv[2] = "Dan, Joseph, and Benjamin, Naphtali, Gad, and Asher.";
asv[3] = "The sons of Judah: Er, and Onan, and Shelah; which three were born unto him of Shua\'s daughter the Canaanitess. And Er, Judah\'s first-born, was wicked in the sight of Jehovah; and he slew him.";
asv[4] = "And Tamar his daughter-in-law bare him Perez and Zerah. All the sons of Judah were five.";
asv[5] = "The sons of Perez: Hezron, and Hamul.";
asv[6] = "And the sons of Zerah: Zimri, and Ethan, and Heman, and Calcol, and Dara; five of them in all.";
asv[7] = "And the sons of Carmi: Achar, the troubler of Israel, who committed a trespass in the devoted thing.";
asv[8] = "And the sons of Ethan: Azariah.";
asv[9] = "The sons also of Hezron, that were born unto him: Jerahmeel, and Ram, and Chelubai.";
asv[10] = "And Ram begat Amminadab, and Amminadab begat Nahshon, prince of the children of Judah;";
asv[11] = "and Nahshon begat Salma, and Salma begat Boaz,";
asv[12] = "and Boaz begat Obed, and Obed begat Jesse;";
asv[13] = "and Jesse begat his first-born Eliab, and Abinadab the second, and Shimea the third,";
asv[14] = "Nethanel the fourth, Raddai the fifth,";
asv[15] = "Ozem the sixth, David the seventh;";
asv[16] = "and their sisters were Zeruiah and Abigail. And the sons of Zeruiah: Abishai, and Joab, and Asahel, three.";
asv[17] = "And Abigail bare Amasa; and the father of Amasa was Jether the Ishmaelite.";
asv[18] = "And Caleb the son of Hezron begat [children] of Azubah [his] wife, and of Jerioth; and these were her sons: Jesher, and Shobab, and Ardon.";
asv[19] = "And Azubah died, and Caleb took unto him Ephrath, who bare him Hur.";
asv[20] = "And Hur begat Uri, and Uri begat Bezalel.";
asv[21] = "And afterward Hezron went in to the daughter of Machir the father of Gilead, whom he took [to wife] when he was threescore years old; and she bare him Segub.";
asv[22] = "And Segub begat Jair, who had three and twenty cities in the land of Gilead.";
asv[23] = "And Geshur and Aram took the towns of Jair from them, with Kenath, and the villages thereof, even threescore cities. All these were the sons of Machir the father of Gilead.";
asv[24] = "And after that Hezron was dead in Caleb-ephrathah, then Abijah Hezron\'s wife bare him Ashhur the father of Tekoa.";
asv[25] = "And the sons of Jerahmeel the first-born of Hezron were Ram the first-born, and Bunah, and Oren, and Ozem, Ahijah.";
asv[26] = "And Jerahmeel had another wife, whose name was Atarah; she was the mother of Onam.";
asv[27] = "And the sons of Ram the first-born of Jerahmeel were Maaz, and Jamin, and Eker.";
asv[28] = "And the sons of Onam were Shammai, and Jada. And the sons of Shammai: Nadab, and Abishur.";
asv[29] = "And the name of the wife of Abishur was Abihail; and she bare him Ahban, and Molid.";
asv[30] = "And the sons of Nadab: Seled, and Appaim; but Seled died without children.";
asv[31] = "And the sons of Appaim: Ishi. And the sons of Ishi: Sheshan. And the sons of Sheshan: Ahlai.";
asv[32] = "And the sons of Jada the brother of Shammai: Jether, and Jonathan; and Jether died without children.";
asv[33] = "And the sons of Jonathan: Peleth, and Zaza. These were the sons of Jerahmeel.";
asv[34] = "Now Sheshan had no sons, but daughters. And Sheshan had a servant, an Egyptian, whose name was Jarha.";
asv[35] = "And Sheshan gave his daughter to Jarha his servant to wife; and she bare him Attai.";
asv[36] = "And Attai begat Nathan, and Nathan begat Zabad,";
asv[37] = "and Zabad begat Ephlal, and Ephlal begat Obed,";
asv[38] = "and Obed begat Jehu, and Jehu begat Azariah,";
asv[39] = "and Azariah begat Helez, and Helez begat Eleasah,";
asv[40] = "and Eleasah begat Sismai, and Sismai begat Shallum,";
asv[41] = "and Shallum begat Jekamiah, and Jekamiah begat Elishama.";
asv[42] = "And the sons of Caleb the brother of Jerahmeel were Mesha his first-born, who was the father of Ziph; and the sons of Mareshah the father of Hebron.";
asv[43] = "And the sons of Hebron: Korah, and Tappuah, and Rekem, and Shema.";
asv[44] = "And Shema begat Raham, the father of Jorkeam; and Rekem begat Shammai.";
asv[45] = "And the son of Shammai was Maon; and Maon was the father of Beth-zur.";
asv[46] = "And Ephah, Caleb\'s concubine, bare Haran, and Moza, and Gazez; and Haran begat Gazez.";
asv[47] = "And the sons of Jahdai: Regem, and Jothan, and Geshan, and Pelet, and Ephah, and Shaaph.";
asv[48] = "Maacah, Caleb\'s concubine, bare Sheber and Tirhanah.";
asv[49] = "She bare also Shaaph the father of Madmannah, Sheva the father of Machbena, and the father of Gibea; and the daughter of Caleb was Achsah.";
asv[50] = "These were the sons of Caleb, the son of Hur, the first-born of Ephrathah: Shobal the father of Kiriath-jearim,";
asv[51] = "Salma the father of Beth-lehem, Hareph the father of Beth-gader.";
asv[52] = "And Shobal the father of Kiriath-jearim had sons: Haroeh, half of the Menuhoth.";
asv[53] = "And the families of Kiriath-jearim: The Ithrites, and the Puthites, and the Shumathites, and the Mishraites; of them came the Zorathites and the Eshtaolites.";
asv[54] = "The sons of Salma: Beth-lehem, and the Netophathites, Atroth-beth-joab, and half of the Manahathites, the Zorites.";
asv[55] = "And the families of scribes that dwelt at Jabez: the Tirathites, the Shimeathites, the Sucathites. These are the Kenites that came of Hammath, the father of the house of Rechab.";

hnv[1] = "These are the sons of Yisra\'el: Re\'uven, Shim`on, Levi, and Yehudah, Yissakhar, and Zevulun,";
hnv[2] = "Dan, Yosef, and Binyamin, Naftali, Gad, and Asher.";
hnv[3] = "The sons of Yehudah: `Er, and Onan, and Shelach; which three were born to him of Shu`a\'s daughter the Kana`anite. `Er, Yehudah\'s firstborn, was wicked in the sight of the LORD; and he killed him.";
hnv[4] = "Tamar his daughter-in-law bore him Peretz and Zerach. All the sons of Yehudah were five.";
hnv[5] = "The sons of Peretz: Hetzron, and Hamul.";
hnv[6] = "The sons of Zerach: Zimri, and Etan, and Heman, and Kalkol, and Dara; five of them in all.";
hnv[7] = "The sons of Karmi: `Akar, the troubler of Yisra\'el, who committed a trespass in the devoted thing.";
hnv[8] = "The sons of Etan: `Azaryah.";
hnv[9] = "The sons also of Hetzron, who were born to him: Yerachme\'el, and Ram, and Keluvai.";
hnv[10] = "Ram became the father of `Amminadav, and `Amminadav became the father of Nachshon, prince of the children of Yehudah;";
hnv[11] = "and Nachshon became the father of Salma, and Salma became the father of Bo`az,";
hnv[12] = "and Bo`az became the father of `Oved, and `Oved became the father of Yishai;";
hnv[13] = "and Yishai became the father of his firstborn Eli\'av, and Avinadav the second, and Shim`a the third,";
hnv[14] = " Netan\'el the fourth, Raddai the fifth,";
hnv[15] = "Otzem the sixth, David the seventh;";
hnv[16] = "and their sisters were Tzeru\'yah and Avigayil. The sons of Tzeru\'yah: Avishai, and Yo\'av, and `Asa\'el, three.";
hnv[17] = " Avigayil bore `Amasa; and the father of `Amasa was Yeter the Yishme`elite.";
hnv[18] = "Kalev the son of Hetzron became the father of [children] of `Azuvah [his] wife, and of Yeri`ot; and these were her sons: Yesher, and Shovav, and Ardon.";
hnv[19] = "`Azuvah died, and Kalev took to him Efrat, who bore him Hur.";
hnv[20] = "Hur became the father of Uri, and Uri became the father of Betzal\'el.";
hnv[21] = "Afterward Hetzron went in to the daughter of Makhir the father of Gil`ad, whom he took [as wife] when he was sixty years old; and she bore him Seguv.";
hnv[22] = " Seguv became the father of Ya\'ir, who had twenty-three cities in the land of Gil`ad.";
hnv[23] = "Geshur and Aram took the towns of Ya\'ir from them, with Kenat, and the villages of it, even sixty cities. All these were the sons of Makhir the father of Gil`ad.";
hnv[24] = "After that Hetzron was dead in Kalev-Efratah, then Aviyah Hetzron\'s wife bore him Ashshur the father of Tekoa.";
hnv[25] = "The sons of Yerachme\'el the firstborn of Hetzron were Ram the firstborn, and Bunah, and Oren, and Otzem, Achiyah.";
hnv[26] = "Yerachme\'el had another wife, whose name was `Atarah; she was the mother of Onam.";
hnv[27] = "The sons of Ram the firstborn of Yerachme\'el were Ma`atz, and Yamin, and `Eker.";
hnv[28] = "The sons of Onam were Shammai, and Yada. The sons of Shammai: Nadav, and Avishur.";
hnv[29] = " The name of the wife of Avishur was Avichayil; and she bore him Achban, and Molid.";
hnv[30] = "The sons of Nadav: Seled, and Appayim; but Seled died without children.";
hnv[31] = "The sons of Appayim: Yish`i. The sons of Yish`i: Sheshan. The sons of Sheshan: Achlai.";
hnv[32] = "The sons of Yada the brother of Shammai: Yeter, and Yonatan; and Yeter died without children.";
hnv[33] = "The sons of Yonatan: Pelet, and Zaza. These were the sons of Yerachme\'el.";
hnv[34] = "Now Sheshan had no sons, but daughters. Sheshan had a servant, a Mitzrian, whose name was Yarcha.";
hnv[35] = " Sheshan gave his daughter to Yarcha his servant as wife; and she bore him `Attai.";
hnv[36] = "`Attai became the father of Natan, and Natan became the father of Zavad,";
hnv[37] = "and Zavad became the father of Eflal, and Eflal became the father of `Oved,";
hnv[38] = "and `Oved became the father of Yehu, and Yehu became the father of `Azaryah,";
hnv[39] = "and `Azaryah became the father of Heletz, and Heletz became the father of El`asah,";
hnv[40] = "and El`asah became the father of Sismai, and Sismai became the father of Shallum,";
hnv[41] = "and Shallum became the father of Yekamyah, and Yekamyah became the father of Elishama.";
hnv[42] = "The sons of Kalev the brother of Yerachme\'el were Mesha his firstborn, who was the father of Zif; and the sons of Mareshah the father of Hevron.";
hnv[43] = "The sons of Hevron: Korach, and Tappuach, and Rekem, and Shema.";
hnv[44] = "Shema became the father of Racham, the father of Yorke`am; and Rekem became the father of Shammai.";
hnv[45] = "The son of Shammai was Ma`on; and Ma`on was the father of Beit-Tzur.";
hnv[46] = "`Efah, Kalev\'s concubine, bore Haran, and Motzah, and Gazez; and Haran became the father of Gazez.";
hnv[47] = "The sons of Yohdai: Regem, and Yotam, and Geshan, and Pelet, and `Efah, and Sha`af.";
hnv[48] = "Ma`akhah, Kalev\'s concubine, bore Shever and Tirchanah.";
hnv[49] = "She bore also Sha`af the father of Madmannah, Sheva the father of Makhbena, and the father of Giv\'ah; and the daughter of Kalev was `Akhsah.";
hnv[50] = "These were the sons of Kalev, the son of Hur, the firstborn of Efratah: Shoval the father of Kiryat-Ye`arim,";
hnv[51] = " Salma the father of Beit-Lechem, Haref the father of Beit-Gader.";
hnv[52] = " Shoval the father of Kiryat-Ye`arim had sons: Haro\'e, half of the Menuchot.";
hnv[53] = "The families of Kiryat-Ye`arim: The Yitri, and the Puti, and the Shumati, and the Mishra`i; of them came the Tzor`ati and the Eshta\'uli.";
hnv[54] = "The sons of Salma: Beit-Lechem, and the Netofati, Atrot-Beit-Yo\'av, and half of the Manachati, the Tzor`i.";
hnv[55] = "The families of Sofrim who lived at Ya`betz: the Tir`atim, the Shim`atim, the Sukhatim. These are the Kinim who came of Hammat, the father of the house of Rechav.";
kjv[1] = "And the sons of Jahdai; Regem, and Jotham, and Geshan, and Pelet, and Ephah, and Shaaph.";
kjv[2] = "Maachah, Caleb\'s concubine, bare Sheber, and Tirhanah.";
kjv[3] = "She bare also Shaaph the father of Madmannah, Sheva the father of Machbenah, and the father of Gibea: and the daughter of Caleb [was] Achsah.";
kjv[4] = "These were the sons of Caleb the son of Hur, the firstborn of Ephratah; Shobal the father of Kirjathjearim,";
kjv[5] = "Salma the father of Bethlehem, Hareph the father of Bethgader.";
kjv[6] = "And Shobal the father of Kirjathjearim had sons; Haroeh, [and] half of the Manahethites.";
kjv[7] = "And the families of Kirjathjearim; the Ithrites, and the Puhites, and the Shumathites, and the Mishraites; of them came the Zareathites, and the Eshtaulites.";
kjv[8] = "The sons of Salma; Bethlehem, and the Netophathites, Ataroth, the house of Joab, and half of the Manahethites, the Zorites.";
kjv[9] = "And the families of the scribes which dwelt at Jabez; the Tirathites, the Shimeathites, [and] Suchathites. These [are] the Kenites that came of Hemath, the father of the house of Rechab.";
kjv[10] = "These [are] the sons of Israel; Reuben, Simeon, Levi, and Judah, Issachar, and Zebulun,";
kjv[11] = "Dan, Joseph, and Benjamin, Naphtali, Gad, and Asher.";
kjv[12] = "The sons of Judah; Er, and Onan, and Shelah: [which] three were born unto him of the daughter of Shua the Canaanitess. And Er, the firstborn of Judah, was evil in the sight of the LORD; and he slew him.";
kjv[13] = "And Tamar his daughter in law bare him Pharez and Zerah. All the sons of Judah [were] five.";
kjv[14] = "The sons of Pharez; Hezron, and Hamul.";
kjv[15] = "And the sons of Zerah; Zimri, and Ethan, and Heman, and Calcol, and Dara: five of them in all.";

kjv[17] = "And the sons of Ethan; Azariah.";
kjv[18] = "The sons also of Hezron, that were born unto him; Jerahmeel, and Ram, and Chelubai.";

kjv[24] = "Ozem the sixth, David the seventh:";
kjv[25] = "Whose sisters [were] Zeruiah, and Abigail. And the sons of Zeruiah; Abishai, and Joab, and Asahel, three.";
kjv[26] = "And Abigail bare Amasa: and the father of Amasa [was] Jether the Ishmeelite.";
kjv[27] = "And Caleb the son of Hezron begat [children] of Azubah [his] wife, and of Jerioth: her sons [are] these; Jesher, and Shobab, and Ardon.";

kjv[35] = "Jerahmeel had also another wife, whose name [was] Atarah; she [was] the mother of Onam.";
kjv[36] = "And the sons of Ram the firstborn of Jerahmeel were, Maaz, and Jamin, and Eker.";
kjv[37] = "And the sons of Onam were, Shammai, and Jada. And the sons of Shammai; Nadab, and Abishur.";
kjv[38] = "And the name of the wife of Abishur [was] Abihail, and she bare him Ahban, and Molid.";
kjv[39] = "And the sons of Nadab; Seled, and Appaim: but Seled died without children.";
kjv[40] = "And the sons of Appaim; Ishi. And the sons of Ishi; Sheshan. And the children of Sheshan; Ahlai.";
kjv[41] = "And the sons of Jada the brother of Shammai; Jether, and Jonathan: and Jether died without children.";
kjv[42] = "And the sons of Jonathan; Peleth, and Zaza. These were the sons of Jerahmeel.";
kjv[43] = "Now Sheshan had no sons, but daughters. And Sheshan had a servant, an Egyptian, whose name [was] Jarha.";
kjv[44] = "And Sheshan gave his daughter to Jarha his servant to wife; and she bare him Attai.";
kjv[45] = "And Attai begat Nathan, and Nathan begat Zabad,";
kjv[46] = "And Zabad begat Ephlal, and Ephlal begat Obed,";
kjv[47] = "And Obed begat Jehu, and Jehu begat Azariah,";
kjv[48] = "And Azariah begat Helez, and Helez begat Eleasah,";
kjv[49] = "And Eleasah begat Sisamai, and Sisamai begat Shallum,";
kjv[50] = "And Shallum begat Jekamiah, and Jekamiah begat Elishama.";
kjv[51] = "Now the sons of Caleb the brother of Jerahmeel [were], Mesha his firstborn, which was the father of Ziph; and the sons of Mareshah the father of Hebron.";
kjv[52] = "And the sons of Hebron; Korah, and Tappuah, and Rekem, and Shema.";
kjv[53] = "And Shema begat Raham, the father of Jorkoam: and Rekem begat Shammai.";
kjv[54] = "And the son of Shammai [was] Maon: and Maon [was] the father of Bethzur.";
kjv[55] = "And Ephah, Caleb\'s concubine, bare Haran, and Moza, and Gazez: and Haran begat Gazez.";
rsv[1] = "These are the sons of Israel: Reuben, Simeon, Levi, Judah, Is\'sachar, Zeb\'ulun,";
rsv[2] = "Dan, Joseph, Benjamin, Naph\'tali, Gad, and Asher.";
rsv[3] = "The sons of Judah: Er, Onan, and Shelah; these three Bath-shu\'a the Canaanitess bore to him. Now Er, Judah\'s first-born, was wicked in the sight of the LORD, and he slew him.";
rsv[4] = "His daughter-in-law Tamar also bore him Perez and Zerah. Judah had five sons in all.";
rsv[5] = "The sons of Perez: Hezron and Hamul.";
rsv[6] = "The sons of Zerah: Zimri, Ethan, Heman, Calcol, and Dara, five in all.";
rsv[7] = "The sons of Carmi: Achar, the troubler of Israel, who transgressed in the matter of the devoted thing;";
rsv[8] = "and Ethan\'s son was Azari\'ah.";
rsv[9] = "The sons of Hezron, that were born to him: Jerah\'meel, Ram, and Chelu\'bai.";
rsv[10] = "Ram was the father of Ammin\'adab, and Ammin\'adab was the father of Nahshon, prince of the sons of Judah.";
rsv[11] = "Nahshon was the father of Salma, Salma of Bo\'az,";
rsv[12] = "Bo\'az of Obed, Obed of Jesse.";
rsv[13] = "Jesse was the father of Eli\'ab his first-born, Abin\'adab the second, Shim\'ea the third,";
rsv[14] = "Nethan\'el the fourth, Raddai the fifth,";
rsv[15] = "Ozem the sixth, David the seventh;";
rsv[16] = "and their sisters were Zeru\'iah and Ab\'igail. The sons of Zeru\'iah: Abi\'shai, Jo\'ab, and As\'ahel, three.";
rsv[17] = "Ab\'igail bore Ama\'sa, and the father of Ama\'sa was Jether the Ish\'maelite.";
rsv[18] = "Caleb the son of Hezron had children by his wife Azu\'bah, and by Jer\'ioth; and these were her sons: Jesher, Shobab, and Ardon.";
rsv[19] = "When Azu\'bah died, Caleb married Ephrath, who bore him Hur.";
rsv[20] = "Hur was the father of Uri, and Uri was the father of Bez\'alel.";
rsv[21] = "Afterward Hezron went in to the daughter of Machir the father of Gilead, whom he married when he was sixty years old; and she bore him Segub;";
rsv[22] = "and Segub was the father of Ja\'ir, who had twenty-three cities in the land of Gilead.";
rsv[23] = "But Geshur and Aram took from them Havvoth-ja\'ir, Kenath and its villages, sixty towns. All these were descendants of Machir, the father of Gilead.";
rsv[24] = "After the death of Hezron, Caleb went in to Eph\'rathah, the wife of Hezron his father, and she bore him Ashhur, the father of Teko\'a.";
rsv[25] = "The sons of Jerah\'meel, the first-born of Hezron: Ram, his first-born, Bunah, Oren, Ozem, and Ahi\'jah.";
rsv[26] = "Jerah\'meel also had another wife, whose name was At\'arah; she was the mother of Onam.";
rsv[27] = "The sons of Ram, the first-born of Jerah\'meel: Ma\'az, Jamin, and Eker.";
rsv[28] = "The sons of Onam: Sham\'mai and Jada. The sons of Sham\'mai: Nadab and Abi\'shur.";
rsv[29] = "The name of Abi\'shur\'s wife was Ab\'ihail, and she bore him Ahban and Molid.";
rsv[30] = "The sons of Nadab: Seled and Ap\'pa-im; and Seled died childless.";
rsv[31] = "The sons of Ap\'pa-im: Ishi. The sons of Ishi: Sheshan. The sons of Sheshan: Ahlai.";
rsv[32] = "The sons of Jada, Sham\'mai\'s brother: Jether and Jonathan; and Jether died childless.";
rsv[33] = "The sons of Jonathan: Peleth and Zaza. These were the descendants of Jerah\'meel.";
rsv[34] = "Now Sheshan had no sons, only daughters; but Sheshan had an Egyptian slave, whose name was Jarha.";
rsv[35] = "So Sheshan gave his daughter in marriage to Jarha his slave; and she bore him Attai.";
rsv[36] = "Attai was the father of Nathan and Nathan of Zabad.";
rsv[37] = "Zabad was the father of Ephlal, and Ephlal of Obed.";
rsv[38] = "Obed was the father of Jehu, and Jehu of Azari\'ah.";
rsv[39] = "Azari\'ah was the father of Helez, and Helez of Ele-a\'sah.";
rsv[40] = "Ele-a\'sah was the father of Sismai, and Sismai of Shallum.";
rsv[41] = "Shallum was the father of Jekami\'ah, and Jekami\'ah of Eli\'shama.";
rsv[42] = "The sons of Caleb the brother of Jerah\'meel: Mare\'shah his first-born, who was the father of Ziph. The sons of Mare\'shah: Hebron.";
rsv[43] = "The sons of Hebron: Korah, Tap\'puah, Rekem, and Shema.";
rsv[44] = "Shema was the father of Raham, the father of Jor\'ke-am; and Rekem was the father of Sham\'mai.";
rsv[45] = "The son of Sham\'mai: Ma\'on; and Ma\'on was the father of Bethzur.";
rsv[46] = "Ephah also, Caleb\'s concubine, bore Haran, Moza, and Gazez; and Haran was the father of Gazez.";
rsv[47] = "The sons of Jah\'dai: Regem, Jotham, Geshan, Pelet, Ephah, and Sha\'aph.";
rsv[48] = "Ma\'acah, Caleb\'s concubine, bore Sheber and Tir\'hanah.";
rsv[49] = "She also bore Sha\'aph the father of Madman\'nah, Sheva the father of Machbe\'nah and the father of Gib\'e-a; and the daughter of Caleb was Achsah.";
rsv[50] = "These were the descendants of Caleb. The sons of Hur the first-born of Eph\'rathah: Shobal the father of Kir\'iath-je\'arim,";
rsv[51] = "Salma, the father of Bethelem, and Hareph the father of Beth-gader.";
rsv[52] = "Shobal the father of Kir\'iath-je\'arim had other sons: Haro\'eh, half of the Menu\'hoth.";
rsv[53] = "And the families of Kir\'iath-je\'arim: the Ithrites, the Puthites, the Shu\'mathites, and the Mish\'ra-ites; from these came the Zo\'rathites and the Esh\'taolites.";
rsv[54] = "The sons of Salma: Bethlehem, the Netoph\'athites, At\'roth-beth-jo\'ab, and half of the Man\'aha\'thites, the Zorites.";
rsv[55] = "The families also of the scribes that dwelt at Jabez: the Ti\'rathites, the Shim\'e-athites, and the Su\'cathites. These are the Ken\'ites who came from Hammath, the father of the house of Rechab.";
vul[1] = "filii autem Israhel Ruben Symeon Levi Iuda Isachar et Zabulon";
vul[2] = "Dan Ioseph Beniamin Nepthali Gad Aser";
vul[3] = "filii Iuda Her Aunan Sela tres nati sunt ei de filia Sue Chananitidis fuit autem Her primogenitus Iuda malus coram Domino et occidit eum";
vul[4] = "Thamar autem nurus eius peperit ei Phares et Zara omnes ergo filii Iuda quinque";
vul[5] = "filii autem Phares Esrom et Hamul";
vul[6] = "filii quoque Zarae Zamri et Ethan et Eman Chalchal quoque et Darda simul quinque";
vul[7] = "filii Carmi Achar qui turbavit Israhel et peccavit in furto anathematis";
vul[8] = "filii Ethan Azarias";
vul[9] = "filii autem Esrom qui nati sunt ei Ieremahel et Ram et Chalubi";
vul[10] = "porro Ram genuit Aminadab Aminadab autem genuit Naasson principem filiorum Iuda";
vul[11] = "Naasson quoque genuit Salma de quo ortus est Boez";
vul[12] = "Boez vero genuit Obed qui et ipse genuit Isai";
vul[13] = "Isai autem genuit primogenitum Heliab secundum Abinadab tertium Samaa";
vul[14] = "quartum Nathanahel quintum Raddai";
vul[15] = "sextum Asom septimum David";
vul[16] = "quorum sorores fuerunt Sarvia et Abigail filii Sarviae Abisai Ioab et Asahel tres";
vul[17] = "Abigail autem genuit Amasa cuius pater fuit Iether Ismahelites";
vul[18] = "Chaleb vero filius Esrom accepit uxorem nomine Azuba de qua genuit Ierioth fueruntque filii eius Iesar et Sobab et Ardon";
vul[19] = "cumque mortua fuisset Azuba accepit uxorem Chaleb Ephrath quae peperit ei Ur";
vul[20] = "porro Ur genuit Uri et Uri genuit Beselehel";
vul[21] = "post haec ingressus est Esrom ad filiam Machir patris Galaad et accepit eam cum esset annorum sexaginta quae peperit ei Segub";
vul[22] = "sed et Segub genuit Iair et possedit viginti tres civitates in terra Galaad";
vul[23] = "cepitque Gessur et Aram oppida Iair et Canath et viculos eius sexaginta civitatum omnes isti filii Machir patris Galaad";
vul[24] = "cum autem mortuus esset Esrom ingressus est Chaleb ad Ephrata habuit quoque Esrom uxorem Abia quae peperit ei Assur patrem Thecue";
vul[25] = "nati sunt autem filii Hieramehel primogeniti Esrom Ram primogenitus eius et Buna et Aran et Asom et Ahia";
vul[26] = "duxit quoque uxorem alteram Hieramehel nomine Atara quae fuit mater Onam";
vul[27] = "sed et filii Ram primogeniti Hieramehel fuerunt Moos et Iamin et Achar";
vul[28] = "Onam autem habuit filios Semmei et Iada filii autem Semmei Nadab et Abisur";
vul[29] = "nomen vero uxoris Abisur Abiail quae peperit Ahobban et Molid";
vul[30] = "filii autem Nadab fuerunt Saled et Apphaim mortuus est autem Saled absque liberis";
vul[31] = "filius vero Apphaim Iesi qui Iesi genuit Sesan porro Sesan genuit Oholi";
vul[32] = "filii autem Iada fratris Semmei Iether et Ionathan sed et Iether mortuus est absque liberis";
vul[33] = "porro Ionathan genuit Phaleth et Ziza isti fuerunt filii Hieramehel";
vul[34] = "Sesan autem non habuit filios sed filias et servum aegyptium nomine Ieraa";
vul[35] = "deditque ei filiam suam uxorem quae peperit ei Eththei";
vul[36] = "Eththei autem genuit Nathan et Nathan genuit Zabad";
vul[37] = "Zabad quoque genuit Ophlal et Ophlal genuit Obed";
vul[38] = "Obed genuit Ieu Ieu genuit Azariam";
vul[39] = "Azarias genuit Helles Helles genuit Elasa";
vul[40] = "Elasa genuit Sisamoi Sisamoi genuit Sellum";
vul[41] = "Sellum genuit Icamian Icamian genuit Elisama";
vul[42] = "filii autem Chaleb fratris Hieramehel Mosa primogenitus eius ipse est pater Ziph et filii Maresa patris Hebron";
vul[43] = "porro filii Hebron Core et Thapphu et Recem et Samma";
vul[44] = "Samma autem genuit Raam patrem Iercaam et Recem genuit Semmei";
vul[45] = "filius Semmei Maon et Maon pater Bethsur";
vul[46] = "Epha autem concubina Chaleb peperit Arran et Musa et Gezez porro Arran genuit Gezez";
vul[47] = "filii Iadai Regom et Iotham et Gesum et Phaleth et Epha et Saaph";
vul[48] = "concubina Chaleb Maacha peperit Saber et Tharana";
vul[49] = "genuit autem Saaph pater Madmena Sue patrem Machbena et patrem Gabaa filia vero Chaleb fuit Achsa";
vul[50] = "hii erant filii Chaleb filii Ur primogeniti Ephrata Sobal pater Cariathiarim";
vul[51] = "Salma pater Bethleem Ariph pater Bethgader";
vul[52] = "fuerunt autem filii Sobal patris Cariathiarim qui videbat dimidium requietionum";
vul[53] = "et de cognatione Cariathiarim Iethrei et Apphutei et Semathei et Maserei ex his egressi sunt Saraitae et Esthaolitae";
vul[54] = "filii Salma Bethleem et Netophathi coronae domus Ioab et dimidium requietionis Sarai";
vul[55] = "cognationes quoque scribarum habitantium in Iabis canentes atque resonantes et in tabernaculis commorantes hii sunt Cinei qui venerunt de calore patris domus Rechab";
web[1] = "These [are] the sons of Israel; Reuben, Simeon, Levi, and Judah, Issachar, and Zebulun,";
web[2] = "Dan, Joseph, and Benjamin, Naphtali, Gad, and Asher.";
web[3] = "The sons of Judah; Er, and Onan, and Shelah: [which] three were born to him of the daughter of Shua the Canaanitess. And Er, the first-born of Judah, was evil in the sight of the LORD; and he slew him.";
web[4] = "And Tamar his daughter-in-law bore him Pharez and Zerah. All the sons of Judah [were] five.";
web[5] = "The sons of Pharez; Hezron, and Hamul.";
web[6] = "And the sons of Zerah; Zimri, and Ethan, and Heman, and Calcol, and Dara: five of them in all.";
web[7] = "And the sons of Carmi; Achar, the troubler of Israel, who transgressed in the thing accursed.";
web[8] = "And the sons of Ethan; Azariah.";
web[9] = "The sons also of Hezron, that were born to him; Jerahmeel, and Ram, and Chelubai.";
web[10] = "And Ram begat Amminadab; and Amminadab begat Nahshon, prince of the children of Judah;";
web[11] = "And Nahshon begat Salma, and Salma begat Boaz,";
web[12] = "And Boaz begat Obed, and Obed begat Jesse,";
web[13] = "And Jesse begat his first-born Eliab, and Abinadab the second, and Shimma the third,";
web[14] = "Nethaneel the fourth, Raddai the fifth,";
web[15] = "Ozem the sixth, David the seventh:";
web[16] = "Whose sisters [were] Zeruiah, and Abigail. And the sons of Zeruiah; Abishai, and Joab, and Asahel, three.";
web[17] = "And Abigail bore Amasa: and the father of Amasa [was] Jether the Ishmaelite.";
web[18] = "And Caleb the son of Hezron begat [children] of Azubah [his] wife, and of Jerioth: her sons [are] these; Jesher, and Shobab, and Ardon.";
web[19] = "And when Azubah was dead, Caleb took to him Ephrath, who bore to him Hur,";
web[20] = "And Hur begat Uri, and Uri begat Bezaleel.";
web[21] = "And afterward Hezron went in to the daughter of Machir the father of Gilead, whom he married when he [was] sixty years old; and she bore him Segub.";
web[22] = "And Segub begat Jair, who had three and twenty cities in the land of Gilead.";
web[23] = "And he took Geshur, and Aram, with the towns of Jair, from them, with Kenath and its towns, [even] sixty cities. All these [belonged to] the sons of Machir, the father of Gilead.";
web[24] = "And after that Hezron was dead in Caleb-ephratah, then Abiah Hezron\'s wife bore him Ashur the father of Tekoa.";
web[25] = "And the sons of Jerahmeel the first-born of Hezron were, Ram the first-born, and Bunah, and Oren, and Ozem, [and] Ahijah.";
web[26] = "Jerahmeel had also another wife, whose name [was] Atarah; she [was] the mother of Onam.";
web[27] = "And the sons of Ram the first-born of Jerahmeel were, Maaz, and Jamin, and Eker.";
web[28] = "And the sons of Onam were, Shammai, and Jada. And the sons of Shammai; Nadab, and Abishur.";
web[29] = "And the name of the wife of Abishur [was] Abihail; and she bore him Ahban, and Molid.";
web[30] = "And the sons of Nadab; Seled, and Appaim: but Seled died without children.";
web[31] = "And the sons of Appaim; Ishi. And the sons of Ishi; Sheshan. And the children of Sheshan; Ahlai.";
web[32] = "And the sons of Jada the brother of Shammai; Jether, and Jonathan: and Jether died without children.";
web[33] = "And the sons of Jonathan; Peleth, and Zaza. These were the sons of Jerahmeel.";
web[34] = "Now Sheshan had no sons, but daughters. And Sheshan had a servant, an Egyptian, whose name [was] Jarha.";
web[35] = "And Sheshan gave his daughter to Jarha his servant for a wife; and she bore him Attai.";
web[36] = "And Attai begat Nathan, and Nathan begat Zabad,";
web[37] = "And Zabad begat Ephlal, and Ephlal begat Obed,";
web[38] = "And Obed begat Jehu, and Jehu begat Azariah,";
web[39] = "And Azariah begat Helez, and Helez begat Eleasah,";
web[40] = "And Eleasah begat Sisamai, and Sisamai begat Shallum,";
web[41] = "And Shallum begat Jekamiah, and Jekamiah begat Elishama.";
web[42] = "Now the sons of Caleb the brother of Jerahmeel [were], Mesha his first-born, who [was] the father of Ziph; and the sons of Mareshah the father of Hebron.";
web[43] = "And the sons of Hebron; Korah, and Tappuah, and Rekem, and Shema.";
web[44] = "And Shema begat Raham, the father of Jorkoam: and Rekem begat Shammai.";
web[45] = "And the son of Shammai [was] Maon: and Maon [was] the father of Beth-zur.";
web[46] = "And Ephah, Caleb\'s concubine, bore Haran, and Moza, and Gazez: and Haran begat Gazez.";
web[47] = "And the sons of Jahdai; Regem, and Jotham, and Geshan, and Pelet, and Ephah, and Shaaph.";
web[48] = "Maachah, Caleb\'s concubine, bore Sheber, and Tirhanah.";
web[49] = "She bore also Shaaph the father of Madmannah, Sheva the father of Machbenah, and the father of Gibea: and the daughter of Caleb [was] Achsah.";
web[50] = "These were the sons of Caleb the son of Hur, the first-born of Ephratah; Shobal the father of Kirjath-jearim,";
web[51] = "Salma the father of Beth-lehem, Hareph the father of Beth-gader.";
web[52] = "And Shobal the father of Kirjath-jearim had sons; Haroeh, [and] half of the Manahethites.";
web[53] = "And the families of Kirjath-jearim; the Ithrites, and the Puhites, and the Shumathites, and the Mishraites; of them came the Zereathites, and the Eshtaulites.";
web[54] = "The sons of Salma; Beth-lehem, and the Netophathites, Ataroth, the house of Joab, and half of the Menahethites, the Zorites.";
web[55] = "And the families of the scribes who dwelt at Jabez; the Tirathites, the Shimeathites, [and] Suchathites. These [are] the Kenites that came of Hemath, the father of the house of Rechab.";
yng[1] = "These [are] sons of Israel: Reuben, Simeon, Levi, and Judah, Issachar, and Zebulun,";
yng[2] = "Dan, Joseph, and Benjamin, Naphtali, Gad, and Asher.";
yng[3] = "Sons of Judah: Er, and Onan, and Shelah, three have been born to him of a daughter of Shua the Canaanitess. And Er, first-born of Judah, is evil in the eyes of Jehovah, and He putteth him to death.";
yng[4] = "And Tamar his daughter-in-law hath borne to him Pharez and Zerah. All the sons of Judah [are] five.";
yng[5] = "Sons of Pharez: Hezron, and Hamul.";
yng[6] = "And sons of Zerah: Zimri, and Ethan, and Heman, and Calcol, and Dara; all of them five.";
yng[7] = "And sons of Carmi: Achar, troubler of Israel, who trespassed in the devoted thing.";
yng[8] = "And sons of Ethan: Azariah.";
yng[9] = "And sons of Hezron who were born to him; Jerahmeel, and Ram, and Chelubai.";
yng[10] = "And Ram begat Amminadab, and Amminadab begat Nahshon, prince of the sons of Judah;";
yng[11] = "and Nahshon begat Salma, and Salma begat Boaz,";
yng[12] = "and Boaz begat Obed, and Obed begat Jesse;";
yng[13] = "and Jesse begat his first-born Eliab, and Abinadab the second, and Shimea the third,";
yng[14] = "Nethaneel the fourth, Raddai the fifth,";
yng[15] = "Ozem the sixth, David the seventh,";
yng[16] = "and their sisters Zeruiah and Abigail. And sons of Zeruiah: Abishai, and Joab, and Asah-El -- three.";
yng[17] = "And Abigail hath borne Amasa, and the father of Amasa [is] Jether the Ishmeelite.";
yng[18] = "And Caleb son of Hezron hath begotten Azubah, Isshah, and Jerioth; and these [are] her sons: Jesher, and Shobab, and Ardon.";
yng[19] = "And Azubah dieth, and Caleb taketh to him Ephrath, and she beareth to him Hur.";
yng[20] = "And Hur begat Uri, and Uri begat Bezaleel.";
yng[21] = "And afterwards hath Hezron gone in unto a daughter of Machir father of Gilead, and he hath taken her, and he [is] a son of sixty years, and she beareth to him Segub.";
yng[22] = "And Segub begat Jair, and he hath twenty and three cities in the land of Gilead,";
yng[23] = "and he taketh Geshur and Aram, the small villages of Jair, from them, with Kenath and its small towns, sixty cities -- all these [belonged to] the sons of Machir father of Gilead.";
yng[24] = "And after the death of Hezron in Caleb-Ephratah, then the wife of Hezron, Abijah, even beareth to him Asshur, father of Tekoa.";
yng[25] = "And sons of Jerahmeel, first-born of Hezron, are: the first-born Ram, and Bunah, and Oren, and Ozem, Ahijah.";
yng[26] = "And Jerahmeel hath another wife, and her name [is] Atarah, she [is] mother of Onam.";
yng[27] = "And sons of Ram, first-born of Jerahmeel, are Maaz, and Jamin, and Eker.";
yng[28] = "And sons of Onam are Shammai and Jada. And sons of Shammai: Nadab and Abishur.";
yng[29] = "And the name of the wife of Abishur [is] Abihail, and she beareth to him Ahban and Molid.";
yng[30] = "And sons of Nadab: Seled, and Appaim; and Seled dieth without sons.";
yng[31] = "And sons of Appaim: Ishi. And sons of Ishi: Sheshan. And sons of Sheshan: Ahlai.";
yng[32] = "And sons of Jada, brother of Shammai: Jether, and Jonathan: and Jether dieth without sons.";
yng[33] = "And sons of Jonathan: Peleth, and Zaza. These were sons of Jerahmeel.";
yng[34] = "And Sheshan had no sons, but daughters, and Sheshan hath a servant, an Egyptian, and his name [is] Jarha,";
yng[35] = "and Sheshan giveth his daughter to Jarha his servant for a wife, and she beareth to him Attai;";
yng[36] = "and Attai begat Nathan, and Nathan begat Zabad,";
yng[37] = "and Zabad begat Ephlal, and Ephlal begat Obed,";
yng[38] = "and Obed begat Jehu,";
yng[39] = "and Jehu begat Azariah, and Azariah begat Helez, and Helez begat Eleasah,";
yng[40] = "and Eleasah begat Sismai, and Sismai begat Shallum,";
yng[41] = "and Shallum begat Jekamiah, and Jekamiah begat Elishama.";
yng[42] = "And sons of Caleb brother of Jerahmeel: Mesha his first-born, he [is] father of Ziph; and sons of Mareshah: Abi-Hebron.";
yng[43] = "And sons of Hebron: Korah, and Tappuah, and Rekem, and Shema.";
yng[44] = "And Shema begat Raham father of Jorkoam, and Rekem begat Shammai.";
yng[45] = "And a son of Shammai [is] Maon, and Maon [is] father of Beth-Zur.";
yng[46] = "And Ephah concubine of Caleb bare Haran, and Moza, and Gazez; and Haran begat Gazez.";
yng[47] = "And sons of Jahdai: Regem, and Jotham, and Geshem, and Pelet, and Ephah, and Shaaph.";
yng[48] = "The concubine of Caleb, Maachah, bare Sheber and Tirhanah;";
yng[49] = "and she beareth Shaaph father of Madmannah, Sheva father of Machbenah, and father of Gibea; and a daughter of Caleb [is] Achsa.";
yng[50] = "These were sons of Caleb son of Hur, first-born of Ephrathah: Shobal father of Kirjath-Jearim,";
yng[51] = "Salma father of Beth-Lehem, Hareph father of Beth-Gader.";
yng[52] = "And there are sons to Shobal father of Kirjath-Jearim: Haroeh, half of the Menuhothite;";
yng[53] = "and the families of Kirjath-Jearim: the Ithrite, and the Puhite, and the Shumathite, and the Mishraite: from these went out the Zareathite, and the Eshtaulite.";
yng[54] = "Sons of Salma: Beth-Lehem, and the Netophathite, Atroth, Beth-Joab, and half of the Menuhothite, the Zorite;";
yng[55] = "and the families of the scribes the inhabitants of Jabez: Tirathites, Shimeathites, Suchathites. They [are] the Kenites, those coming of Hammath father of the house of Rechab.";
csb[1] = "These were Israel\'s sons: Reuben, Simeon, Levi, Judah, Issachar, Zebulun,";
csb[2] = "Dan, Joseph, Benjamin, Naphtali, Gad, and Asher.";
csb[3] = "Judah\'s sons: Er, Onan, and Shelah. These three were born to him by Bath-shua the Canaanite woman. Er, Judah\'s firstborn, was evil in the LORD\'s sight, so he put him to death.";
csb[4] = "Judah\'s daughter-in-law Tamar bore Perez and Zerah to him. Judah had five sons in all.";
csb[5] = "Perez\'s sons: Hezron and Hamul.";
csb[6] = "Zerah\'s sons: Zimri, Ethan, Heman, Calcol, and Dara -- five in all.";
csb[7] = "Carmi\'s son: Achar, who brought trouble on Israel when he was unfaithful by taking the things set apart for destruction.";
csb[8] = "Ethan\'s son: Azariah.";
csb[9] = "Hezron\'s sons, who were born to him: Jerahmeel, Ram, and Chelubai.";
csb[10] = "Ram fathered Amminadab, and Amminadab fathered Nahshon, a leader of Judah\'s descendants.";
csb[11] = "Nahshon fathered Salma, and Salma fathered Boaz.";
csb[12] = "Boaz fathered Obed, and Obed fathered Jesse.";
csb[13] = "Jesse fathered Eliab, his firstborn; Abinadab was born second, Shimea third,";
csb[14] = "Nethanel fourth, Raddai fifth,";
csb[15] = "Ozem sixth, and David seventh.";
csb[16] = "Their sisters were Zeruiah and Abigail. Zeruiah\'s three sons: Abishai, Joab, and Asahel.";
csb[17] = "Amasa\'s mother was Abigail, and his father was Jether the Ishmaelite.";
csb[18] = "Caleb son of Hezron had children by his wife Azubah and by Jerioth. These were Azubah\'s sons: Jesher, Shobab, and Ardon.";
csb[19] = "When Azubah died, Caleb married Ephrath, and she bore Hur to him.";
csb[20] = "Hur fathered Uri, and Uri fathered Bezalel.";
csb[21] = "After this, Hezron slept with the daughter of Machir the father of Gilead. Hezron had married her when he was sixty years old, and she bore Segub to him.";
csb[22] = "Segub fathered Jair, who possessed twenty-three towns in the land of Gilead.";
csb[23] = "But Geshur and Aram captured Jair\'s Villages along with Kenath and its surrounding villages -- sixty towns. All these were the descendants of Machir father of Gilead.";
csb[24] = "After Hezron\'s death in Caleb-ephrathah, his wife Abijah bore Ashhur to him. He was the father of Tekoa.";
csb[25] = "The sons of Jerahmeel, Hezron\'s firstborn: Ram, his firstborn, Bunah, Oren, Ozem, and Ahijah.";
csb[26] = "Jerahmeel had another wife named Atarah, who was the mother of Onam.";
csb[27] = "The sons of Ram, Jerahmeel\'s firstborn: Maaz, Jamin, and Eker.";
csb[28] = "Onam\'s sons: Shammai and Jada. Shammai\'s sons: Nadab and Abishur.";
csb[29] = "Abishur\'s wife was named Abihail, who bore Ahban and Molid to him.";
csb[30] = "Nadab\'s sons: Seled and Appaim. Seled died without children.";
csb[31] = "Appaim\'s son: Ishi. Ishi\'s son: Sheshan. Sheshan\'s descendant: Ahlai.";
csb[32] = "The sons of Jada, brother of Shammai: Jether and Jonathan. Jether died without children.";
csb[33] = "Jonathan\'s sons: Peleth and Zaza. These were the descendants of Jerahmeel.";
csb[34] = "Sheshan had no sons, only daughters, but he did have an Egyptian servant whose name was Jarha.";
csb[35] = "Sheshan gave his daughter in marriage to his servant Jarha, and she bore Attai to him.";
csb[36] = "Attai fathered Nathan, and Nathan fathered Zabad.";
csb[37] = "Zabad fathered Ephlal, and Ephlal fathered Obed.";
csb[38] = "Obed fathered Jehu, and Jehu fathered Azariah.";
csb[39] = "Azariah fathered Helez, and Helez fathered Elasah.";
csb[40] = "Elasah fathered Sismai, and Sismai fathered Shallum.";
csb[41] = "Shallum fathered Jekamiah, and Jekamiah fathered Elishama.";
csb[42] = "The sons of Caleb brother of Jerahmeel: Mesha, his firstborn, fathered Ziph, and Mareshah, his second son, fathered Hebron.";
csb[43] = "Hebron\'s sons: Korah, Tappuah, Rekem, and Shema.";
csb[44] = "Shema fathered Raham, who fathered Jorkeam, and Rekem fathered Shammai.";
csb[45] = "Shammai\'s son was Maon, and Maon fathered Beth-zur.";
csb[46] = "Caleb\'s concubine Ephah was the mother of Haran, Moza, and Gazez. Haran fathered Gazez.";
csb[47] = "Jahdai\'s sons: Regem, Jotham, Geshan, Pelet, Ephah, and Shaaph.";
csb[48] = "Caleb\'s concubine Maacah was the mother of Sheber and Tirhanah.";
csb[49] = "She was also the mother of Shaaph, Madmannah\'s father, and of Sheva, the father of Machbenah and Gibea. Caleb\'s daughter was Achsah.";
csb[50] = "These were Caleb\'s descendants. The sons of Hur, Ephrathah\'s firstborn: Shobal fathered Kiriath-jearim;";
csb[51] = "Salma fathered Bethlehem, and Hareph fathered Beth-gader.";
csb[52] = "These were the descendants of Shobal the father of Kiriath-jearim: Haroeh, half of the Manahathites,";
csb[53] = "and the families of Kiriath-jearim -- the Ithrites, Puthites, Shumathites, and Mishraites. The Zorathites and Eshtaolites descended from these.";
csb[54] = "Salma\'s descendants: Bethlehem, the Netophathites, Atroth-beth-joab, and half of the Manahathites, the Zorites,";
csb[55] = "and the families of scribes who lived in Jabez -- the Tirathites, Shimeathites, and Sucathites. These are the Kenites who came from Hammath, the father of Rechab\'s family.";

</script>
