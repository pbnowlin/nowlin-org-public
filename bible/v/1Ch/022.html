asv[1] = "Then David said, This is the house of Jehovah God, and this is the altar of burnt-offering for Israel.";
asv[2] = "And David commanded to gather together the sojourners that were in the land of Israel; and he set masons to hew wrought stones to build the house of God.";
asv[3] = "And David prepared iron in abundance for the nails for the doors of the gates, and for the couplings; and brass in abundance without weight;";
asv[4] = "and cedar-trees without number: for the Sidonians and they of Tyre brought cedar-trees in abundance to David.";
asv[5] = "And David said, Solomon my son is young and tender, and the house that is to be builded for Jehovah must be exceeding magnificent, of fame and of glory throughout all countries: I will therefore make preparation for it. So David prepared abundantly before his death.";
asv[6] = "Then he called for Solomon his son, and charged him to build a house for Jehovah, the God of Israel.";
asv[7] = "And David said to Solomon his son, As for me, it was in my heart to build a house unto the name of Jehovah my God.";
asv[8] = "But the word of Jehovah came to me, saying, Thou hast shed blood abundantly, and hast made great wars: thou shalt not build a house unto my name, because thou hast shed much blood upon the earth in my sight.";
asv[9] = "Behold, a son shall be born to thee, who shall be a man of rest; and I will give him rest from all his enemies round about; for his name shall be Solomon, and I will give peace and quietness unto Israel in his days:";
asv[10] = "he shall build a house for my name; and he shall be my son, and I will be his father; and I will establish the throne of his kingdom over Israel for ever.";
asv[11] = "Now, my son, Jehovah be with thee; and prosper thou, and build the house of Jehovah thy God, as he hath spoken concerning thee.";
asv[12] = "Only Jehovah give thee discretion and understanding, and give thee charge concerning Israel; that so thou mayest keep the law of Jehovah thy God.";
asv[13] = "Then shalt thou prosper, if thou observe to do the statutes and the ordinances which Jehovah charged Moses with concerning Israel: be strong, and of good courage; fear not, neither be dismayed.";
asv[14] = "Now, behold, in my affliction I have prepared for the house of Jehovah a hundred thousand talents of gold, and a thousand thousand talents of silver, and of brass and iron without weight; for it is in abundance: timber also and stone have I prepared; and thou mayest add thereto.";
asv[15] = "Moreover there are workmen with thee in abundance, hewers and workers of stone and timber, and all men that are skilful in every manner of work:";
asv[16] = "of the gold, the silver, and the brass, and the iron, there is no number. Arise and be doing, and Jehovah be with thee.";
asv[17] = "David also commanded all the princes of Israel to help Solomon his son, [saying],";
asv[18] = "Is not Jehovah your God with you? and hath he not given you rest on every side? for he hath delivered the inhabitants of the land into my hand; and the land is subdued before Jehovah, and before his people.";
asv[19] = "Now set your heart and your soul to seek after Jehovah your God; arise therefore, and build ye the sanctuary of Jehovah God, to bring the ark of the covenant of Jehovah, and the holy vessels of God, into the house that is to be built to the name of Jehovah.";

hnv[1] = "Then David said, This is the house of the LORD God, and this is the altar of burnt-offering for Yisra\'el.";
hnv[2] = "David commanded to gather together the foreigners who were in Eretz-Yisra\'el; and he set masons to hew worked stones to build the house of God.";
hnv[3] = "David prepared iron in abundance for the nails for the doors of the gates, and for the couplings; and brass in abundance without weight;";
hnv[4] = " and cedar trees without number: for the Tzidonim and they of Tzor brought cedar trees in abundance to David.";
hnv[5] = "David said, Shlomo my son is young and tender, and the house that is to be built for the LORD must be exceeding magnificent, of fame and of glory throughout all countries: I will therefore make preparation for it. So David prepared abundantly before his death.";
hnv[6] = "Then he called for Shlomo his son, and charged him to build a house for the LORD, the God of Yisra\'el.";
hnv[7] = "David said to Shlomo his son, As for me, it was in my heart to build a house to the name of the LORD my God.";
hnv[8] = "But the word of the LORD came to me, saying, You have shed blood abundantly, and have made great wars: you shall not build a house to my name, because you have shed much blood on the eretz in my sight.";
hnv[9] = "Behold, a son shall be born to you, who shall be a man of rest; and I will give him rest from all his enemies round about; for his name shall be Shlomo, and I will give shalom and quietness to Yisra\'el in his days:";
hnv[10] = " he shall build a house for my name; and he shall be my son, and I will be his father; and I will establish the throne of his kingdom over Yisra\'el for ever.";
hnv[11] = "Now, my son, the LORD be with you; and prosper you, and build the house of the LORD your God, as he has spoken concerning you.";
hnv[12] = "Only the LORD give you discretion and understanding, and give you charge concerning Yisra\'el; that so you may keep the law of the LORD your God.";
hnv[13] = "Then shall you prosper, if you observe to do the statutes and the ordinances which the LORD charged Moshe with concerning Yisra\'el: be strong, and of good courage; don\'t be afraid, neither be dismayed.";
hnv[14] = "Now, behold, in my affliction I have prepared for the house of the LORD one hundred thousand talents of gold, and one thousand thousand talents of silver, and of brass and iron without weight; for it is in abundance: timber also and stone have I prepared; and you may add thereto.";
hnv[15] = " Moreover there are workmen with you in abundance, cutters and workers of stone and timber, and all men who are skillful in every manner of work:";
hnv[16] = "of the gold, the silver, and the brass, and the iron, there is no number. Arise and be doing, and the LORD be with you.";
hnv[17] = "David also commanded all the princes of Yisra\'el to help Shlomo his son, [saying],";
hnv[18] = "Isn\'t the LORD your God with you? and hasn\'t he given you rest on every side? for he has delivered the inhabitants of the land into my hand; and the land is subdued before the LORD, and before his people.";
hnv[19] = "Now set your heart and your soul to seek after the LORD your God; arise therefore, and build you the sanctuary of the LORD God, to bring the ark of the covenant of the LORD, and the holy vessels of God, into the house that is to be built to the name of the LORD.";

rsv[1] = "Then David said, &quot;Here shall be the house of the LORD God and here the altar of burnt offering for Israel.&quot;";
rsv[2] = "David commanded to gather together the aliens who were in the land of Israel, and he set stonecutters to prepare dressed stones for building the house of God.";
rsv[3] = "David also provided great stores of iron for nails for the doors of the gates and for clamps, as well as bronze in quantities beyond weighing,";
rsv[4] = "and cedar timbers without number; for the Sido\'nians and Tyrians brought great quantities of cedar to David.";
rsv[5] = "For David said, &quot;Solomon my son is young and inexperienced, and the house that is to be built for the LORD must be exceedingly magnificent, of fame and glory throughout all lands; I will therefore make preparation for it.&quot; So David provided materials in great quantity before his death.";
rsv[6] = "Then he called for Solomon his son, and charged him to build a house for the LORD, the God of Israel.";
rsv[7] = "David said to Solomon, &quot;My son, I had it in my heart to build a house to the name of the LORD my God.";
rsv[8] = "But the word of the LORD came to me, saying, \'You have shed much blood and have waged great wars; you shall not build a house to my name, because you have shed so much blood before me upon the earth.";
rsv[9] = "Behold, a son shall be born to you; he shall be a man of peace. I will give him peace from all his enemies round about; for his name shall be Solomon, and I will give peace and quiet to Israel in his days.";
rsv[10] = "He shall build a house for my name. He shall be my son, and I will be his father, and I will establish his royal throne in Israel for ever.\'";
rsv[11] = "Now, my son, the LORD be with you, so that you may succeed in building the house of the LORD your God, as he has spoken concerning you.";
rsv[12] = "Only, may the LORD grant you discretion and understanding, that when he gives you charge over Israel you may keep the law of the LORD your God.";
rsv[13] = "Then you will prosper if you are careful to observe the statutes and the ordinances which the LORD commanded Moses for Israel. Be strong, and of good courage. Fear not; be not dismayed.";
rsv[14] = "With great pains I have provided for the house of the LORD a hundred thousand talents of gold, a million talents of silver, and bronze and iron beyond weighing, for there is so much of it; timber and stone too I have provided. To these you must add.";
rsv[15] = "You have an abundance of workmen: stonecutters, masons, carpenters, and all kinds of craftsmen without number, skilled in working";
rsv[16] = "gold, silver, bronze, and iron. Arise and be doing! The LORD be with you!&quot;";
rsv[17] = "David also commanded all the leaders of Israel to help Solomon his son, saying,";
rsv[18] = "&quot;Is not the LORD your God with you? And has he not given you peace on every side? For he has delivered the inhabitants of the land into my hand; and the land is subdued before the LORD and his people.";
rsv[19] = "Now set your mind and heart to seek the LORD your God. Arise and build the sanctuary of the LORD God, so that the ark of the covenant of the LORD and the holy vessels of God may be brought into a house built for the name of the LORD.&quot;";
vul[1] = "dixitque David haec est domus Dei et hoc altare in holocaustum Israhel";
vul[2] = "et praecepit ut congregarentur omnes proselyti de terra Israhel et constituit ex eis latomos ad caedendos lapides et poliendos ut aedificaretur domus Dei";
vul[3] = "ferrum quoque plurimum ad clavos ianuarum et ad commissuras atque iuncturas praeparavit David et aeris pondus innumerabile";
vul[4] = "ligna quoque cedrina non poterant aestimari quae Sidonii et Tyrii deportaverant ad David";
vul[5] = "et dixit David Salomon filius meus puer parvulus est et delicatus domus autem quam aedificari volo Domino talis esse debet ut in cunctis regionibus nominetur praeparabo ergo ei necessaria et ob hanc causam ante mortem suam omnes paravit inpensas";
vul[6] = "vocavitque Salomonem filium suum et praecepit ei ut aedificaret domum Domino Deo Israhel";
vul[7] = "dixitque David ad Salomonem fili mi voluntatis meae fuit ut aedificarem domum nomini Domini Dei mei";
vul[8] = "sed factus est ad me sermo Domini dicens multum sanguinem effudisti et plurima bella bellasti non poteris aedificare domum nomini meo tanto effuso sanguine coram me";
vul[9] = "filius qui nascetur tibi et erit vir quietissimus faciam enim eum requiescere ab omnibus inimicis suis per circuitum et ob hanc causam pacificus vocabitur et pacem et otium dabo in Israhel cunctis diebus eius";
vul[10] = "ipse aedificabit domum nomini meo et ipse erit mihi in filium et ego ero ei in patrem firmaboque solium regni eius super Israhel in aeternum";
vul[11] = "nunc ergo fili mi sit Dominus tecum et prosperare et aedifica domum Domino Deo tuo sicut locutus est de te";
vul[12] = "det quoque tibi Dominus prudentiam et sensum ut regere possis Israhel et custodire legem Domini Dei tui";
vul[13] = "tunc enim proficere poteris si custodieris mandata et iudicia quae praecepit Dominus Mosi ut doceret Israhel confortare viriliter age ne timeas neque paveas";
vul[14] = "ecce ego in paupertatula mea praeparavi inpensas domus Domini auri talenta centum milia et argenti mille milia talentorum aeris vero et ferri non est pondus vincitur enim numerus magnitudine ligna et lapides praeparavi ad universa inpendia";
vul[15] = "habes quoque plurimos artifices latomos et cementarios artificesque lignorum et omnium artium ad faciendum opus prudentissimos";
vul[16] = "in auro et argento aere et ferro cuius non est numerus surge igitur et fac et erit Dominus tecum";
vul[17] = "praecepit quoque David cunctis principibus Israhel ut adiuvarent Salomonem filium suum";
vul[18] = "cernitis inquiens quod Dominus Deus vester vobiscum sit et dederit vobis requiem per circuitum et tradiderit omnes inimicos in manu vestra et subiecta sit terra coram Domino et coram populo eius";
vul[19] = "praebete igitur corda vestra et animas vestras ut quaeratis Dominum Deum vestrum et consurgite et aedificate sanctuarium Domino Deo ut introducatur arca foederis Domini et vasa Domino consecrata in domum quae aedificatur nomini Domini";

yng[1] = "And David saith, `This is the house of Jehovah God, and this the altar for burnt-offering for Israel.\'";
yng[2] = "And David saith to gather the sojourners who [are] in the land of Israel, and appointeth hewers to hew hewn-stones to build a house of God.";
yng[3] = "And iron in abundance for nails for leaves of the gates, and for couplings, hath David prepared, and brass in abundance -- there is no weighing.";
yng[4] = "And cedar-trees even without number, for the Zidonians and the Tyrians brought in cedar-trees in abundance to David.";
yng[5] = "And David saith, `Solomon my son [is] a youth and tender, and the house to be built to Jehovah [is] to be made exceedingly great, for name and for beauty to all the lands; let me prepare, I pray Thee, for it;\' and David prepareth in abundance before his death.";
yng[6] = "And he calleth for Solomon his son, and chargeth him to build a house to Jehovah, God of Israel,";
yng[7] = "and David saith to Solomon his son, `As for me, it hath been with my heart to build a house to the name of Jehovah my God,";
yng[8] = "and the word of Jehovah [is] against me, saying, Blood in abundance thou hast shed, and great wars thou hast made: thou dost not build a house to My name, for much blood thou hast shed to the earth before Me.";
yng[9] = "`Lo, a son is born to thee; he is a man of rest, and I have given rest to him from all his enemies round about, for Solomon is his name, and peace and quietness I give unto Israel in his days;";
yng[10] = "he doth build a house to My name, and he is to Me for a son, and I [am] to him for a father, and I have established the throne of his kingdom over Israel unto the age.";
yng[11] = "`Now, my son, Jehovah is with thee, and thou hast prospered, and hast built the house of Jehovah thy God, as He spake concerning thee.";
yng[12] = "Only, Jehovah give to thee wisdom and understanding, and charge thee concerning Israel, even to keep the law of Jehovah thy God;";
yng[13] = "then thou dost prosper, if thou dost observe to do the statutes and the judgments that Jehovah charged Moses with concerning Israel; be strong and courageous; do not fear, nor be cast down.";
yng[14] = "`And lo, in mine affliction, I have prepared for the house of Jehovah of gold talents a hundred thousand, and of silver a thousand thousand talents; and of brass and of iron there is no weighing, for in abundance it hath been, and wood and stones I have prepared, and to them thou dost add.";
yng[15] = "`And with thee in abundance [are] workmen, hewers and artificers of stone and of wood, and every skilful man for every work.";
yng[16] = "To the gold, to the silver, and to the brass, and to the iron, there is no number; arise and do, and Jehovah is with thee.\'";
yng[17] = "And David giveth charge to all heads of Israel to give help to Solomon his son,";
yng[18] = "`Is not Jehovah your God with you? yea, He hath given rest to you round about, for He hath given into my hand the inhabitants of the land, and subdued hath been the land before His people.";
yng[19] = "`Now, give your heart and your soul to seek to Jehovah your God, and rise and build the sanctuary of Jehovah God, to bring in the ark of the covenant of Jehovah, and the holy vessels of God, to the house that is built to the name of Jehovah.\'";
csb[1] = "Then David said, &quot;This is the house of the LORD God, and this is the altar of burnt offering for Israel.&quot;";
csb[2] = "So David gave orders to gather the resident aliens that were in the land of Israel, and he appointed stonecutters to cut finished stones for building God\'s house.";
csb[3] = "David supplied a great deal of iron to make the nails for the doors of the gates and for the fittings, together with an immeasurable quantity of bronze,";
csb[4] = "and innumerable cedar logs because the Sidonians and Tyrians had brought a large quantity of cedar logs to David.";
csb[5] = "David said, &quot;My son Solomon is young and inexperienced, and the house that is to be built for the LORD must be exceedingly great and famous and glorious in all the lands. Therefore, I will make provision for it.&quot; So David made lavish preparations for it before his death.";
csb[6] = "Then he summoned his son Solomon and charged him to build a house for the LORD God of Israel.";
csb[7] = "&quot;My son,&quot; David said to Solomon, &quot;It was in my heart to build a house for the name of the LORD my God,";
csb[8] = "&quot;but the word of the LORD came to me: \'You have shed much blood and waged great wars. You are not to build a house for my name because you have shed so much blood on the ground before me.";
csb[9] = "&quot;But a son will be born to you; he will be a man of rest. I will give him rest from all his surrounding enemies, for his name will be Solomon, and I will give peace and quiet to Israel during his reign.";
csb[10] = "&quot;He is the one who will build a house for my name. He will be my son, and I will be his father. I will establish the throne of his kingdom over Israel forever.\'";
csb[11] = "&quot;Now, my son, may the LORD be with you, and may you succeed in building the house of the LORD your God, as he said about you.";
csb[12] = "&quot;Above all, may the LORD give you insight and understanding when he puts you in charge of Israel so that you may keep the law of the LORD your God.";
csb[13] = "&quot;Then you will succeed if you carefully follow the statutes and ordinances the LORD commanded Moses for Israel. Be strong and courageous. Don\'t be afraid or discouraged.";
csb[14] = "&quot;Notice I have taken great pains to provide for the house of the LORD -- 3,775 tons of gold, 37,750 tons of silver, and bronze and iron that can\'t be weighed because there is so much of it. I have also provided timber and stone, but you will need to add more to them.";
csb[15] = "&quot;You also have many workers: stonecutters, masons, carpenters, and people skilled in every kind of work";
csb[16] = "&quot;in gold, silver, bronze, and iron -- beyond number. Now begin the work, and may the LORD be with you.&quot;";
csb[17] = "Then David ordered all the leaders of Israel to help his son Solomon:";
csb[18] = "&quot;The LORD your God is with you, isn\'t he? And hasn\'t he given you rest on every side? For he has handed the land\'s inhabitants over to me, and the land has been subdued before the LORD and his people.";
csb[19] = "&quot;Now determine in your mind and heart to seek the LORD your God. Get started building the LORD God\'s sanctuary so that you may bring the ark of the LORD\'s covenant and the holy articles of God to the temple that is to be built for the name of the LORD.&quot;";
</script>
