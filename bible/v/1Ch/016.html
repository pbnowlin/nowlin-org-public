asv[1] = "And they brought in the ark of God, and set it in the midst of the tent that David had pitched for it: and they offered burnt-offerings and peace-offerings before God.";
asv[2] = "And when David had made an end of offering the burnt-offering and the peace-offerings, he blessed the people in the name of Jehovah.";
asv[3] = "And he dealt to every one of Israel, both man and woman, to every one a loaf of bread, and a portion [of flesh], and a cake of raisins.";
asv[4] = "And he appointed certain of the Levites to minister before the ark of Jehovah, and to celebrate and to thank and praise Jehovah, the God of Israel:";
asv[5] = "Asaph the chief, and second to him Zechariah, Jeiel, and Shemiramoth, and Jehiel, and Mattithiah, and Eliab, and Benaiah, and Obed-edom, and Jeiel, with psalteries and with harps; and Asaph with cymbals, sounding aloud;";
asv[6] = "and Benaiah and Jahaziel the priests with trumpets continually, before the ark of the covenant of God.";
asv[7] = "Then on that day did David first ordain to give thanks unto Jehovah, by the hand of Asaph and his brethren.";
asv[8] = "O give thanks unto Jehovah, call upon his name; Make known his doings among the peoples. ";
asv[9] = "Sing unto him, sing praises unto him; Talk ye of all his marvellous works. ";
asv[10] = "Glory ye in his holy name; Let the heart of them rejoice that seek Jehovah. ";
asv[11] = "Seek ye Jehovah and his strength; Seek his face evermore. ";
asv[12] = "Remember his marvellous works that he hath done, His wonders, and the judgments of his mouth, ";
asv[13] = "O ye seed of Israel his servant, Ye children of Jacob, his chosen ones. ";
asv[14] = "He is Jehovah our God; His judgments are in all the earth. ";
asv[15] = "Remember his covenant for ever, The word which he commanded to a thousand generations, ";
asv[16] = " [The covenant] which he made with Abraham, And his oath unto Isaac, ";
asv[17] = "And confirmed the same unto Jacob for a statute, To Israel for an everlasting covenant, ";
asv[18] = "Saying, Unto thee will I give the land of Canaan, The lot of your inheritance; ";
asv[19] = "When ye were but a few men in number, Yea, very few, and sojourners in it; ";
asv[20] = "And they went about from nation to nation, And from one kingdom to another people. ";
asv[21] = "He suffered no man to do them wrong; Yea, he reproved kings for their sakes, ";
asv[22] = " [Saying], Touch not mine anointed ones, And do my prophets no harm. ";
asv[23] = "Sing unto Jehovah, all the earth; Show forth his salvation from day to day. ";
asv[24] = "Declare his glory among the nations, His marvellous works among all the peoples. ";
asv[25] = "For great is Jehovah, and greatly to be praised: He also is to be feared above all gods. ";
asv[26] = "For all the gods of the peoples are idols: But Jehovah made the heavens. ";
asv[27] = "Honor and majesty are before him: Strength and gladness are in his place. ";
asv[28] = "Ascribe unto Jehovah, ye kindreds of the peoples, Ascribe unto Jehovah glory and strength; ";
asv[29] = "Ascribe unto Jehovah the glory due unto his name: Bring an offering, and come before him; Worship Jehovah in holy array. ";
asv[30] = "Tremble before him, all the earth: The world also is established that it cannot be moved. ";
asv[31] = "Let the heavens be glad, and let the earth rejoice; And let them say among the nations, Jehovah reigneth. ";
asv[32] = "Let the sea roar, and the fulness thereof; Let the field exult, and all that is therein; ";
asv[33] = "Then shall the trees of the wood sing for joy before Jehovah; For he cometh to judge the earth. ";
asv[34] = "O give thanks unto Jehovah; for he is good; For his lovingkindness [endureth] for ever. ";
asv[35] = "And say ye, Save us, O God of our salvation, And gather us together and deliver us from the nations, To give thanks unto thy holy name, And to triumph in thy praise. ";
asv[36] = "Blessed be Jehovah, the God of Israel, From everlasting even to everlasting. And all the people said, Amen, and praised Jehovah.";
asv[37] = "So he left there, before the ark of the covenant of Jehovah, Asaph and his brethren, to minister before the ark continually, as every day\'s work required;";
asv[38] = "and Obed-edom with their brethren, threescore and eight; Obed-edom also the son of Jeduthun and Hosah to be doorkeepers;";
asv[39] = "and Zadok the priest, and his brethren the priests, before the tabernacle of Jehovah in the high place that was at Gibeon,";
asv[40] = "to offer burnt-offerings unto Jehovah upon the altar of burnt-offering continually morning and evening, even according to all that is written in the law of Jehovah, which he commanded unto Israel;";
asv[41] = "and with them Heman and Jeduthun, and the rest that were chosen, who were mentioned by name, to give thanks to Jehovah, because his lovingkindness [endureth] for ever;";
asv[42] = "and with them Heman and Jeduthun [with] trumpets and cymbals for those that should sound aloud, and [with] instruments for the songs of God; and the sons of Jeduthun to be at the gate.";
asv[43] = "And all the people departed every man to his house: and David returned to bless his house.";

dby[30] = "Tremble before him, all the earth: The world also is established, it shall not be moved.";

dby[36] = "Blessed be Jehovah the God of Israel, from eternity and to eternity! And all the people said, Amen! and praised Jehovah.";
dby[37] = "And he left there, before the ark of the covenant of Jehovah, Asaph and his brethren, to do the service before the ark continually, as every day\'s duty required;";
dby[38] = "and Obed-Edom, and their brethren, sixty-eight; Obed-Edom also, the son of Jeduthun, and Hosah as doorkeepers.";
dby[39] = "And Zadok the priest, and his brethren the priests, before the tabernacle of Jehovah in the high place that was at Gibeon,";

dby[41] = "and with them Heman and Jeduthun, and the rest that were chosen, who were expressed by name, to give thanks to Jehovah, because his loving-kindness [endureth] for ever;";
dby[42] = "and with them, [with] Heman and Jeduthun, trumpets and cymbals for those that should sound aloud; and the musical instruments of God. And the sons of Jeduthun were at the gate.";

hnv[1] = "They brought in the ark of God, and set it in the midst of the tent that David had pitched for it: and they offered burnt offerings and peace-offerings before God.";
hnv[2] = "When David had made an end of offering the burnt offering and the peace-offerings, he blessed the people in the name of the LORD.";
hnv[3] = "He dealt to everyone of Yisra\'el, both man and woman, to every one a loaf of bread, and a portion [of flesh], and a cake of raisins.";
hnv[4] = "He appointed certain of the Levites to minister before the ark of the LORD, and to celebrate and to thank and praise the LORD, the God of Yisra\'el:";
hnv[5] = "Asaf the chief, and second to him Zekharyah, Ye`i\'el, and Shemiramot, and Yechi\'el, and Mattityah, and Eli\'av, and Benayah, and Obed-edom, and Ye`i\'el, with psalteries and with harps; and Asaf with cymbals, sounding aloud;";
hnv[6] = "and Benayah and Yachazi\'el the Kohanim with trumpets continually, before the ark of the covenant of God.";
hnv[7] = "Then on that day David first ordained to give thanks to the LORD, by the hand of Asaf and his brothers.";
hnv[8] = "Oh give thanks to the LORD, call on his name; Make known his doings among the peoples.";
hnv[9] = "Sing to him, sing praises to him; Talk you of all his marvelous works.";
hnv[10] = "Glory you in his holy name; Let the heart of them rejoice who seek the LORD.";
hnv[11] = "Seek you the LORD and his strength; Seek his face forever more.";
hnv[12] = "Remember his marvelous works that he has done, His wonders, and the judgments of his mouth,";
hnv[13] = "You seed of Yisra\'el his servant, You children of Ya`akov, his chosen ones.";
hnv[14] = "He is the LORD our God; His judgments are in all the eretz.";
hnv[15] = "Remember his covenant forever, The word which he commanded to a thousand generations,";
hnv[16] = "[The covenant] which he made with Avraham, His oath to Yitzchak,";
hnv[17] = "Confirmed the same to Ya`akov for a statute, To Yisra\'el for an everlasting covenant,";
hnv[18] = "Saying, To you will I give the land of Kana`an, The lot of your inheritance;";
hnv[19] = "When you were but a few men in number, Yes, very few, and foreigners in it;";
hnv[20] = "They went about from nation to nation, From one kingdom to another people.";
hnv[21] = "He allowed no man to do them wrong; Yes, he reproved kings for their sakes,";
hnv[22] = "[Saying], Don\'t touch my anointed ones, Do my prophets no harm.";
hnv[23] = "Sing to the LORD, all the eretz; Show forth his salvation from day to day.";
hnv[24] = "Declare his glory among the nations, His marvelous works among all the peoples.";
hnv[25] = "For great is the LORD, and greatly to be praised: He also is to be feared above all gods.";
hnv[26] = "For all the gods of the peoples are idols: But the LORD made the heavens.";
hnv[27] = "Honor and majesty are before him: Strength and gladness are in his place.";
hnv[28] = "Ascribe to the LORD, you relatives of the peoples, Ascribe to the LORD glory and strength;";
hnv[29] = "Ascribe to the LORD the glory due to his name: Bring an offering, and come before him: Worship the LORD in holy array.";
hnv[30] = "Tremble before him, all the eretz: The world also is established that it can\'t be moved.";
hnv[31] = "Let the heavens be glad, and let the eretz rejoice; Let them say among the nations, the LORD reigns.";
hnv[32] = "Let the sea roar, and the fullness of it; Let the field exult, and all that is therein;";
hnv[33] = "Then shall the trees of the wood sing for joy before the LORD; For he comes to judge the eretz.";
hnv[34] = "Oh give thanks to the LORD; for he is good; For his lovingkindness endures forever.";
hnv[35] = "Say you, Save us, God of our salvation, Gather us together and deliver us from the nations, To give thanks to your holy name, To triumph in your praise.";
hnv[36] = "Blessed be the LORD, the God of Yisra\'el, From everlasting even to everlasting. All the people said, Amein, and praised the LORD.";
hnv[37] = "So he left there, before the ark of the covenant of the LORD, Asaf and his brothers, to minister before the ark continually, as every day\'s work required;";
hnv[38] = "and Obed-edom with their brothers, sixty-eight; Obed-edom also the son of Yedutun and Hosah to be doorkeepers;";
hnv[39] = "and Tzadok the Kohen, and his brothers the Kohanim, before the tent of the LORD in the high place that was at Giv`on,";
hnv[40] = "to offer burnt offerings to the LORD on the altar of burnt offering continually morning and evening, even according to all that is written in the law of the LORD, which he commanded to Yisra\'el;";
hnv[41] = "and with them Heman and Yedutun, and the rest who were chosen, who were mentioned by name, to give thanks to the LORD, because his lovingkindness endures forever;";
hnv[42] = "and with them Heman and Yedutun [with] trumpets and cymbals for those that should sound aloud, and [with] instruments for the songs of God; and the sons of Yedutun to be at the gate.";
hnv[43] = "All the people departed every man to his house: and David returned to bless his house.";
kjv[1] = "So they brought the ark of God, and set it in the midst of the tent that David had pitched for it: and they offered burnt sacrifices and peace offerings before God.";
kjv[2] = "And when David had made an end of offering the burnt offerings and the peace offerings, he blessed the people in the name of the LORD.";
kjv[3] = "And he dealt to every one of Israel, both man and woman, to every one a loaf of bread, and a good piece of flesh, and a flagon [of wine].";
kjv[4] = "And he appointed [certain] of the Levites to minister before the ark of the LORD, and to record, and to thank and praise the LORD God of Israel:";
kjv[5] = "Asaph the chief, and next to him Zechariah, Jeiel, and Shemiramoth, and Jehiel, and Mattithiah, and Eliab, and Benaiah, and Obededom: and Jeiel with psalteries and with harps; but Asaph made a sound with cymbals;";
kjv[6] = "Benaiah also and Jahaziel the priests with trumpets continually before the ark of the covenant of God.";
kjv[7] = "Then on that day David delivered first [this psalm] to thank the LORD into the hand of Asaph and his brethren.";
kjv[8] = "Give thanks unto the LORD, call upon his name, make known his deeds among the people.";
kjv[9] = "Sing unto him, sing psalms unto him, talk ye of all his wondrous works.";
kjv[10] = "Glory ye in his holy name: let the heart of them rejoice that seek the LORD.";
kjv[11] = "Seek the LORD and his strength, seek his face continually.";
kjv[12] = "Remember his marvellous works that he hath done, his wonders, and the judgments of his mouth;";
kjv[13] = "O ye seed of Israel his servant, ye children of Jacob, his chosen ones.";
kjv[14] = "He [is] the LORD our God; his judgments [are] in all the earth.";
kjv[15] = "Be ye mindful always of his covenant; the word [which] he commanded to a thousand generations;";
kjv[16] = "[Even of the covenant] which he made with Abraham, and of his oath unto Isaac;";
kjv[17] = "And hath confirmed the same to Jacob for a law, [and] to Israel [for] an everlasting covenant,";
kjv[18] = "Saying, Unto thee will I give the land of Canaan, the lot of your inheritance;";
kjv[19] = "When ye were but few, even a few, and strangers in it.";
kjv[20] = "And [when] they went from nation to nation, and from [one] kingdom to another people;";
kjv[21] = "He suffered no man to do them wrong: yea, he reproved kings for their sakes,";
kjv[22] = "[Saying], Touch not mine anointed, and do my prophets no harm.";
kjv[23] = "Sing unto the LORD, all the earth; shew forth from day to day his salvation.";
kjv[24] = "Declare his glory among the heathen; his marvellous works among all nations.";
kjv[25] = "For great [is] the LORD, and greatly to be praised: he also [is] to be feared above all gods.";
kjv[26] = "For all the gods of the people [are] idols: but the LORD made the heavens.";
kjv[27] = "Glory and honour [are] in his presence; strength and gladness [are] in his place.";
kjv[28] = "Give unto the LORD, ye kindreds of the people, give unto the LORD glory and strength.";
kjv[29] = "Give unto the LORD the glory [due] unto his name: bring an offering, and come before him: worship the LORD in the beauty of holiness.";
kjv[30] = "Fear before him, all the earth: the world also shall be stable, that it be not moved.";
kjv[31] = "Let the heavens be glad, and let the earth rejoice: and let [men] say among the nations, The LORD reigneth.";
kjv[32] = "Let the sea roar, and the fulness thereof: let the fields rejoice, and all that [is] therein.";
kjv[33] = "Then shall the trees of the wood sing out at the presence of the LORD, because he cometh to judge the earth.";
kjv[34] = "O give thanks unto the LORD; for [he is] good; for his mercy [endureth] for ever.";
kjv[35] = "And say ye, Save us, O God of our salvation, and gather us together, and deliver us from the heathen, that we may give thanks to thy holy name, [and] glory in thy praise.";
kjv[36] = "Blessed [be] the LORD God of Israel for ever and ever. And all the people said, Amen, and praised the LORD.";
kjv[37] = "So he left there before the ark of the covenant of the LORD Asaph and his brethren, to minister before the ark continually, as every day\'s work required:";
kjv[38] = "And Obededom with their brethren, threescore and eight; Obededom also the son of Jeduthun and Hosah [to be] porters:";
kjv[39] = "And Zadok the priest, and his brethren the priests, before the tabernacle of the LORD in the high place that [was] at Gibeon,";
kjv[40] = "To offer burnt offerings unto the LORD upon the altar of the burnt offering continually morning and evening, and [to do] according to all that is written in the law of the LORD, which he commanded Israel;";
kjv[41] = "And with them Heman and Jeduthun, and the rest that were chosen, who were expressed by name, to give thanks to the LORD, because his mercy [endureth] for ever;";
kjv[42] = "And with them Heman and Jeduthun with trumpets and cymbals for those that should make a sound, and with musical instruments of God. And the sons of Jeduthun [were] porters.";
kjv[43] = "And all the people departed every man to his house: and David returned to bless his house.";
rsv[1] = "And they brought the ark of God, and set it inside the tent which David had pitched for it; and they offered burnt offerings and peace offerings before God.";
rsv[2] = "And when David had finished offering the burnt offerings and the peace offerings, he blessed the people in the name of the LORD,";
rsv[3] = "and distributed to all Israel, both men and women, to each a loaf of bread, a portion of meat, and a cake of raisins.";
rsv[4] = "Moreover he appointed certain of the Levites as ministers before the ark of the LORD, to invoke, to thank, and to praise the LORD, the God of Israel.";
rsv[5] = "Asaph was the chief, and second to him were Zechari\'ah, Je-i\'el, Shemi\'ramoth, Jehi\'el, Mattithi\'ah, Eli\'ab, Benai\'ah, O\'bed-e\'dom, and Je-i\'el, who were to play harps and lyres; Asaph was to sound the cymbals,";
rsv[6] = "and Benai\'ah and Jaha\'ziel the priests were to blow trumpets continually, before the ark of the covenant of God.";
rsv[7] = "Then on that day David first appointed that thanksgiving be sung to the LORD by Asaph and his brethren.";
rsv[8] = "O give thanks to the LORD, call on his name, make known his deeds among the peoples!";
rsv[9] = "Sing to him, sing praises to him, tell of all his wonderful works!";
rsv[10] = "Glory in his holy name; let the hearts of those who seek the LORD rejoice!";
rsv[11] = "Seek the LORD and his strength, seek his presence continually!";
rsv[12] = "Remember the wonderful works that he has done, the wonders he wrought, the judgments he uttered,";
rsv[13] = "O offspring of Abraham his servant, sons of Jacob, his chosen ones!";
rsv[14] = "He is the LORD our God; his judgments are in all the earth.";
rsv[15] = "He is mindful of his covenant for ever, of the word that he commanded, for a thousand generations,";
rsv[16] = "the covenant which he made with Abraham, his sworn promise to Isaac,";
rsv[17] = "which he confirmed as a statute to Jacob, as an everlasting covenant to Israel,";
rsv[18] = "saying, &quot;To you I will give the land of Canaan, as your portion for an inheritance.&quot;";
rsv[19] = "When they were few in number, and of little account, and sojourners in it,";
rsv[20] = "wandering from nation to nation, from one kingdom to another people,";
rsv[21] = "he allowed no one to oppress them; he rebuked kings on their account,";
rsv[22] = "saying, &quot;Touch not my anointed ones, do my prophets no harm!&quot;";
rsv[23] = "Sing to the Lord, all the earth! Tell of his salvation from day to day.";
rsv[24] = "Declare his glory among the nations, his marvelous works among all the peoples!";
rsv[25] = "For great is the LORD, and greatly to be praised, and he is to be held in awe above all gods.";
rsv[26] = "For all the gods of the peoples are idols; but the LORD made the heavens.";
rsv[27] = "Honor and majesty are before him; strength and joy are in his place.";
rsv[28] = "Ascribe to the LORD, O families of the peoples, ascribe to the LORD glory and strength!";
rsv[29] = "Ascribe to the LORD the glory due his name; bring an offering, and come before him! Worship the LORD in holy array;";
rsv[30] = "tremble before him, all the earth; yea, the world stands firm, never to be moved.";
rsv[31] = "Let the heavens be glad, and let the earth rejoice, and let them say among the nations, &quot;The LORD reigns!&quot;";
rsv[32] = "Let the sea roar, and all that fills it, let the field exult, and everything in it!";
rsv[33] = "Then shall the trees of the wood sing for joy before the LORD, for he comes to judge the earth.";
rsv[34] = "O give thanks to the LORD, for he is good; for his steadfast love endures for ever!";
rsv[35] = "Say also: &quot;Deliver us, O God of our salvation, and gather and save us from among the nations, that we may give thanks to thy holy name, and glory in thy praise.";
rsv[36] = "Blessed be the LORD, the God of Israel, from everlasting to everlasting!&quot; Then all the people said &quot;Amen!&quot; and praised the LORD.";
rsv[37] = "So David left Asaph and his brethren there before the ark of the covenant of the LORD to minister continually before the ark as each day required,";
rsv[38] = "and also O\'bed-e\'dom and his sixty-eight brethren; while O\'bed-e\'dom, the son of Jedu\'thun, and Hosah were to be gatekeepers.";
rsv[39] = "And he left Zadok the priest and his brethren the priests before the tabernacle of the LORD in the high place that was at Gibeon,";
rsv[40] = "to offer burnt offerings to the LORD upon the altar of burnt offering continually morning and evening, according to all that is written in the law of the LORD which he commanded Israel.";
rsv[41] = "With them were Heman and Jedu\'thun, and the rest of those chosen and expressly named to give thanks to the LORD, for his steadfast love endures for ever.";
rsv[42] = "Heman and Jedu\'thun had trumpets and cymbals for the music and instruments for sacred song. The sons of Jedu\'thun were appointed to the gate.";
rsv[43] = "Then all the people departed each to his house, and David went home to bless his household.";
vul[1] = "adtulerunt igitur arcam Dei et constituerunt eam in medio tabernaculi quod tetenderat ei David et obtulerunt holocausta et pacifica coram Deo";
vul[2] = "cumque conplesset David offerens holocausta et pacifica benedixit populo in nomine Domini";
vul[3] = "et divisit universis per singulos a viro usque ad mulierem tortam panis et partem assae carnis bubulae et frixam oleo similam";
vul[4] = "constituitque coram arca Domini de Levitis qui ministrarent et recordarentur operum eius et glorificarent atque laudarent Dominum Deum Israhel";
vul[5] = "Asaph principem et secundum eius Zacchariam porro Iahihel et Semiramoth et Ieihel et Matthathiam et Eliab et Banaiam et Obededom et Ieihel super organa psalterii et lyras Asaph autem ut cymbalis personaret";
vul[6] = "Banaiam vero et Azihel sacerdotes canere tuba iugiter coram arca foederis Domini";
vul[7] = "in illo die fecit David principem ad confitendum Domino Asaph et fratres eius";
vul[8] = "confitemini Domino invocate nomen eius notas facite in populis adinventiones illius";
vul[9] = "canite ei et psallite et narrate omnia mirabilia eius";
vul[10] = "laudate nomen sanctum eius laetetur cor quaerentium Dominum";
vul[11] = "quaerite Dominum et virtutem eius quaerite faciem eius semper";
vul[12] = "recordamini mirabilium eius quae fecit signorum illius et iudiciorum oris eius";
vul[13] = "semen Israhel servi eius filii Iacob electi illius";
vul[14] = "ipse Dominus Deus noster in universa terra iudicia eius";
vul[15] = "recordamini in sempiternum pacti eius sermonis quem praecepit in mille generationes";
vul[16] = "quem pepigit cum Abraham et iuramenti illius cum Isaac";
vul[17] = "et constituit illud Iacob in praeceptum et Israhel in pactum sempiternum";
vul[18] = "dicens tibi dabo terram Chanaan funiculum hereditatis vestrae";
vul[19] = "cum essent pauci numero parvi et coloni eius";
vul[20] = "et transierunt de gente in gentem et de regno ad populum alterum";
vul[21] = "non dimisit quemquam calumniari eos sed increpuit pro eis reges";
vul[22] = "nolite tangere christos meos et in prophetis meis nolite malignari";
vul[23] = "canite Domino omnis terra adnuntiate ex die in diem salutare eius";
vul[24] = "narrate in gentibus gloriam eius in cunctis populis mirabilia illius";
vul[25] = "quia magnus Dominus et laudabilis nimis et horribilis super omnes deos";
vul[26] = "omnes enim dii populorum idola Dominus autem caelos fecit";
vul[27] = "confessio et magnificentia coram eo fortitudo et gaudium in loco eius";
vul[28] = "adferte Domino familiae populorum adferte Domino gloriam et imperium";
vul[29] = "date Domino gloriam nomini eius levate sacrificium et venite in conspectu eius et adorate Dominum in decore sancto";
vul[30] = "commoveatur a facie illius omnis terra ipse enim fundavit orbem inmobilem";
vul[31] = "laetentur caeli et exultet terra et dicant in nationibus Dominus regnavit";
vul[32] = "tonet mare et plenitudo eius exultent agri et omnia quae in eis sunt";
vul[33] = "tunc laudabunt ligna saltus coram Domino quia venit iudicare terram";
vul[34] = "confitemini Domino quoniam bonus quoniam in aeternum misericordia eius";
vul[35] = "et dicite salva nos Deus salvator noster et congrega nos et erue de gentibus ut confiteamur nomini sancto tuo et exultemus in carminibus tuis";
vul[36] = "benedictus Dominus Deus Israhel ab aeterno usque in aeternum et dicat omnis populus amen et hymnus Domino";
vul[37] = "dereliquit itaque ibi coram arca foederis Domini Asaph et fratres eius ut ministrarent in conspectu arcae iugiter per singulos dies et vices suas";
vul[38] = "porro Obededom et fratres eius sexaginta octo et Obededom filium Idithun et Osa constituit ianitores";
vul[39] = "Sadoc autem sacerdotem et fratres illius sacerdotes coram tabernaculo Domini in excelso quod erat in Gabaon";
vul[40] = "ut offerrent holocausta Domino super altare holocaustomatis iugiter mane et vespere iuxta omnia quae scripta sunt in lege Domini quam praecepit Israheli";
vul[41] = "et post eum Heman et Idithun et reliquos electos unumquemque vocabulo suo ad confitendum Domino quoniam in aeternum misericordia eius";
vul[42] = "Heman quoque et Idithun canentes tuba et quatientes cymbala et omnia musicorum organa ad canendum Deo filios autem Idithun fecit esse portarios";
vul[43] = "reversusque est omnis populus in domum suam et David ut benediceret etiam domui suae";
web[1] = "So they brought the ark of God, and set it in the midst of the tent that David had pitched for it: and they offered burnt-sacrifices and peace-offerings before God.";
web[2] = "And when David had made an end of offering the burnt-offerings and the peace-offerings, he blessed the people in the name of the LORD.";
web[3] = "And he dealt to every one of Israel, both man and woman, to every one a loaf of bread, and a good piece of flesh, and a flagon [of wine].";
web[4] = "And he appointed [certain] of the Levites to minister before the ark of the LORD, and to record, and to thank and praise the LORD God of Israel:";
web[5] = "Asaph the chief, and next to him Zechariah, Jeiel, and Shemiramoth, and Jehiel, and Mattithiah, and Eliab, and Benaiah, and Obed-edom: and Jeiel with psalteries and with harps; but Asaph made a sound with cymbals;";
web[6] = "Benaiah also and Jahaziel the priests with trumpets continually before the ark of the covenant of God.";
web[7] = "Then on that day David delivered first [this psalm] to thank the LORD into the hand of Asaph and his brethren.";
web[8] = "Give thanks to the LORD, call upon his name, make known his deeds among the people.";
web[9] = "Sing to him, sing psalms to him, talk ye of all his wonderous works.";
web[10] = "Glory ye in his holy name: let the heart of them rejoice that seek the LORD.";
web[11] = "Seek the LORD and his strength, seek his face continually.";
web[12] = "Remember his wonderful works that he hath done, his wonders, and the judgments of his mouth;";
web[13] = "O ye seed of Israel his servant, ye children of Jacob, his chosen ones.";
web[14] = "He [is] the LORD our God; his judgments [are] in all the earth.";
web[15] = "Be ye mindful always of his covenant; the word [which] he commanded to a thousand generations;";
web[16] = "[Even of the covenant] which he made with Abraham, and of his oath to Isaac;";
web[17] = "And which he confirmed to Jacob for a law, [and] to Israel [for] an everlasting covenant,";
web[18] = "Saying, To thee will I give the land of Canaan, the lot of your inheritance;";
web[19] = "When ye were but few, even a few, and strangers in it.";
web[20] = "And [when] they went from nation to nation, and from [one] kingdom to another people;";
web[21] = "He suffered no man to do them wrong: yea, he reproved kings for their sakes,";
web[22] = "[Saying], Touch not my anointed, and do my prophets no harm.";
web[23] = "Sing to the LORD, all the earth; show forth from day to day his salvation.";
web[24] = "Declare his glory among the heathen; his wonderful works among all nations.";
web[25] = "For great [is] the LORD, and greatly to be praised: he also [is] to be feared above all gods.";
web[26] = "For all the gods of the people [are] idols: but the LORD made the heavens.";
web[27] = "Glory and honor [are] in his presence; strength and gladness [are] in his place.";
web[28] = "Give to the LORD, ye kindreds of the people, give to the LORD glory and strength.";
web[29] = "Give to the LORD the glory [due] to his name: bring an offering, and come before him: worship the LORD in the beauty of holiness.";
web[30] = "Fear before him, all the earth: the world also shall be stable, that it be not moved.";
web[31] = "Let the heavens be glad, and let the earth rejoice: and let [men] say among the nations, The LORD reigneth.";
web[32] = "Let the sea roar, and the fullness thereof: let the fields rejoice, and all that [is] therein.";
web[33] = "Then shall the trees of the wood sing at the presence of the LORD, because he cometh to judge the earth.";
web[34] = "O give thanks to the LORD; for [he is] good; for his mercy [endureth] for ever.";
web[35] = "And say ye, Save us, O God of our salvation, and gather us together, and deliver us from the heathen, that we may give thanks to thy holy name, [and] glory in thy praise.";
web[36] = "Blessed [be] the LORD God of Israel for ever and ever. And all the people said, Amen, and praised the LORD.";
web[37] = "So he left there before the ark of the covenant of the LORD Asaph and his brethren, to minister before the ark continually, as every day\'s work required:";
web[38] = "And Obed-edom with their brethren, sixty and eight; Obed-edom also the son of Jeduthun and Hosah [to be] porters:";
web[39] = "And Zadok the priest, and his brethren the priests, before the tabernacle of the LORD in the high place that [was] at Gibeon,";
web[40] = "To offer burnt-offerings to the LORD upon the altar of the burnt-offering continually morning and evening, and [to do] according to all that is written in the law of the LORD, which he commanded Israel;";
web[41] = "And with them Heman and Jeduthun, and the rest that were chosen, who were expressed by name, to give thanks to the LORD, because his mercy [endureth] for ever;";
web[42] = "And with them Heman and Jeduthun with trumpets and cymbals for those that should make a sound, and with musical instruments of God. And the sons of Jeduthun [were] porters.";
web[43] = "And all the people departed every man to his house: and David returned to bless his house.";
yng[1] = "And they bring in the ark of God, and set it up in the midst of the tent that David hath stretched out for it, and they bring near burnt-offerings and peace-offerings before God;";
yng[2] = "and David ceaseth from offering the burnt-offering and the peace-offerings, and blesseth the people in the name of Jehovah,";
yng[3] = "and giveth a portion to every man of Israel, both man and woman: to each a cake of bread, and a measure of wine, and a grape-cake.";
yng[4] = "And he putteth before the ark of Jehovah, of the Levites, ministers, even to make mention of, and to thank, and to give praise to Jehovah, God of Israel,";
yng[5] = "Asaph the head, and his second Zechariah; Jeiel, and Shemiramoth, and Jehiel, and Mattithiah, and Eliab, and Benaiah, and Obed-Edom, and Jeiel, with instruments of psalteries, and with harps; and Asaph with cymbals is sounding;";
yng[6] = "and Benaiah and Jahaziel the priests [are] with trumpets continually before the ark of the covenant of God.";
yng[7] = "On that day then hath David given at the beginning to give thanks to Jehovah by the hand of Asaph and his brethren: --";
yng[8] = "Give thanks to Jehovah, call in His name, Make known among the peoples His doings.";
yng[9] = "Sing ye to Him, sing psalms to Him, Meditate on all His wonders.";
yng[10] = "Boast yourselves in His holy name, Rejoice doth the heart of those seeking Jehovah.";
yng[11] = "Seek ye Jehovah and His strength, Seek His face continually.";
yng[12] = "Remember His wonders that He did, His signs, and the judgments of His mouth,";
yng[13] = "O seed of Israel, His servant, O sons of Jacob, His chosen ones!";
yng[14] = "He [is] Jehovah our God, In all the earth [are] His judgments.";
yng[15] = "Remember ye to the age His covenant, The word He commanded -- To a thousand generations,";
yng[16] = "Which He hath made with Abraham, And His oath -- to Isaac,";
yng[17] = "And He establisheth it to Jacob for a statute, To Israel -- a covenant age-during.";
yng[18] = "Saying: To thee I give the land of Canaan, The portion of your inheritance,";
yng[19] = "When ye are few of number, As a little thing, and sojourners in it.";
yng[20] = "And they go up and down, From nation unto nation, And from a kingdom unto another people.";
yng[21] = "He hath not suffered any to oppress them, And reproveth on their account kings:";
yng[22] = "Come not against Mine anointed ones, And against My prophets do not evil.";
yng[23] = "Sing to Jehovah, all the earth, Proclaim from day unto day His salvation.";
yng[24] = "Rehearse among nations His glory, Among all the peoples His wonders.";
yng[25] = "For great [is] Jehovah, and praised greatly, And fearful He [is] above all gods.";
yng[26] = "For all gods of the peoples [are] nought, And Jehovah the heavens hath made.";
yng[27] = "Honour and majesty [are] before Him, Strength and joy [are] in His place.";
yng[28] = "Ascribe to Jehovah, ye families of peoples, Ascribe to Jehovah honour and strength.";
yng[29] = "Ascribe to Jehovah the honour of His name, Lift up a present, and come before Him. Bow yourselves to Jehovah, In the beauty of holiness.";
yng[30] = "Be pained before Him, all the earth:";
yng[31] = "Also, established is the world, It is not moved! The heavens rejoice, and the earth is glad, And they say among nations: Jehovah hath reigned.";
yng[32] = "Roar doth the sea, and its fulness, Exult doth the field, and all that [is] in it,";
yng[33] = "Then sing do trees of the forest, From the presence of Jehovah, For He hath come to judge the earth!";
yng[34] = "Give thanks to Jehovah, for good, For to the age, [is] His kindness,";
yng[35] = "And say, Save us, O God of our salvation, And gather us, and deliver us from the nations, To give thanks to Thy holy name, To triumph in Thy praise.";
yng[36] = "Blessed [is] Jehovah, God of Israel, From the age and unto the age;\' And all the people say, `Amen,\' and have given praise to Jehovah.";
yng[37] = "And he leaveth there before the ark of the covenant of Jehovah, for Asaph and for his brethren, to minister before the ark continually, according to the matter of a day in its day,";
yng[38] = "both Obed-Edom and their brethren, sixty and eight, and Obed-Edom son of Jeduthun, and Hosah for gatekeepers,";
yng[39] = "and Zadok the priest, and his brethren the priests, before the tabernacle of Jehovah, in a high place that [is] in Gibeon,";
yng[40] = "to cause to ascend burnt-offerings to Jehovah, on the altar of burnt-offering continually, morning and evening, and for all that is written in the law of Jehovah, that He charged on Israel.";
yng[41] = "And with them [are] Heman and Jeduthun, and the rest of those chosen, who were defined by name, to give thanks to Jehovah, for to the age [is] His kindness,";
yng[42] = "and with them -- Heman and Jeduthun -- [are] trumpets and cymbals for those sounding, and instruments of the song of God, and the sons of Jeduthun [are] at the gate.";
yng[43] = "And all the people go, each to his house, and David turneth round to bless his house.";
csb[1] = "They brought the ark of God and placed it inside the tent David had pitched for it. Then they offered burnt offerings and fellowship offerings in God\'s presence.";
csb[2] = "When David had finished offering the burnt offerings and the fellowship offerings, he blessed the people in the name of the LORD.";
csb[3] = "Then he distributed to each and every Israelite, both men and women, a loaf of bread, a date cake, and a raisin cake.";
csb[4] = "David appointed some of the Levites to be ministers before the ark of the LORD, to celebrate the LORD God of Israel, and to give thanks and praise to him.";
csb[5] = "Asaph was the chief and Zechariah was second to him. Jeiel, Shemiramoth, Jehiel, Mattithiah, Eliab, Benaiah, Obed-edom, and Jeiel played the harps and lyres, while Asaph sounded the cymbals";
csb[6] = "and the priests Benaiah and Jahaziel blew the trumpets regularly before the ark of the covenant of God.";
csb[7] = "On that day David decreed for the first time that thanks be given to the LORD by Asaph and his relatives:";
csb[8] = "Give thanks to the LORD; call on his name; proclaim his deeds among the peoples.";
csb[9] = "Sing to him; sing praise to him; tell about all his wondrous works!";
csb[10] = "Honor his holy name; let the hearts of those who seek the LORD rejoice.";
csb[11] = "Seek the LORD and his strength; seek his face always.";
csb[12] = "Remember the wondrous works he has done, his wonders, and the judgments he has pronounced,";
csb[13] = "you offspring of Israel his servant, Jacob\'s descendants -- his chosen ones.";
csb[14] = "He is the LORD our God; his judgments govern the whole earth.";
csb[15] = "Remember his covenant forever -- the promise he ordained for a thousand generations,";
csb[16] = "the covenant he made with Abraham, swore to Isaac,";
csb[17] = "and confirmed to Jacob as a decree, and to Israel as a permanent covenant:";
csb[18] = "&quot;I will give the land of Canaan to you as your inherited portion.&quot;";
csb[19] = "When they were few in number, very few indeed, and resident aliens in Canaan";
csb[20] = "wandering from nation to nation and from one kingdom to another,";
csb[21] = "he allowed no one to oppress them; he rebuked kings on their behalf:";
csb[22] = "&quot;Do not touch my anointed ones or harm my prophets.&quot;";
csb[23] = "Let the whole earth sing to the LORD. Proclaim his salvation from day to day.";
csb[24] = "Declare his glory among the nations, his wondrous works among all peoples.";
csb[25] = "For the LORD is great and highly praised; he is feared above all gods.";
csb[26] = "For all the gods of the peoples are idols, but the LORD made the heavens.";
csb[27] = "Splendor and majesty are before him; strength and joy are in his place.";
csb[28] = "Ascribe to the LORD, families of the peoples, ascribe to the LORD glory and strength.";
csb[29] = "Ascribe to the LORD the glory of his name; bring an offering and come before him. Worship the LORD in the splendor of his holiness;";
csb[30] = "let the whole earth tremble before him. The world is firmly established; it cannot be shaken.";
csb[31] = "Let the heavens be glad and the earth rejoice, and let them say among the nations, &quot;The LORD reigns! &quot;";
csb[32] = "Let the sea and all that fills it resound; let the fields and everything in them exult.";
csb[33] = "Then the trees of the forest will shout for joy before the LORD, for he is coming to judge the earth.";
csb[34] = "Give thanks to the LORD, for he is good; his faithful love endures forever.";
csb[35] = "And say: &quot;Save us, God of our salvation; gather us and rescue us from the nations so that we may give thanks to your holy name and rejoice in your praise.";
csb[36] = "&quot;Blessed be the LORD God of Israel from everlasting to everlasting.&quot; Then all the people said, &quot;Amen&quot; and &quot;Praise the LORD.&quot;";
csb[37] = "So David left Asaph and his relatives there before the ark of the LORD\'s covenant to minister regularly before the ark according to the daily requirements.";
csb[38] = "He assigned Obed-edom and his sixty-eight relatives. Obed-edom son of Jeduthun and Hosah were to be gatekeepers.";
csb[39] = "David left the priest Zadok and his fellow priests before the tabernacle of the LORD at the high place in Gibeon";
csb[40] = "to offer burnt offerings regularly, morning and evening, to the LORD on the altar of burnt offerings and to do everything that was written in the law of the LORD, which he had commanded Israel to keep.";
csb[41] = "With them were Heman, Jeduthun, and the rest who were chosen and designated by name to give thanks to the LORD -- for his faithful love endures forever.";
csb[42] = "Heman and Jeduthun had with them trumpets and cymbals to play and musical instruments of God. Jeduthun\'s sons were at the city gate.";
csb[43] = "Then all the people went home, and David returned home to bless his household.";
</script>
