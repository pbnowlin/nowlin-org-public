asv[1] = "Moreover David and the captains of the host set apart for the service certain of the sons of Asaph, and of Heman, and of Jeduthun, who should prophesy with harps, with psalteries, and with cymbals: and the number of them that did the work according to their service was:";
asv[2] = "of the sons of Asaph: Zaccur, and Joseph, and Nethaniah, and Asharelah, the sons of Asaph, under the hand of Asaph, who prophesied after the order of the king.";
asv[3] = "Of Jeduthun; the sons of Jeduthun: Gedaliah, and Zeri, and Jeshaiah, Hashabiah, and Mattithiah, six, under the hands of their father Jeduthun with the harp, who prophesied in giving thanks and praising Jehovah.";
asv[4] = "Of Heman; the sons of Heman: Bukkiah, Mattaniah, Uzziel, Shebuel, and Jerimoth, Hananiah, Hanani, Eliathah, Giddalti, and Romamti-ezer, Joshbekashah, Mallothi, Hothir, Mahazioth.";

asv[6] = "All these were under the hands of their father for song in the house of Jehovah, with cymbals, psalteries, and harps, for the service of the house of God; Asaph, Jeduthun, and Heman being under the order of the king.";

dby[1] = "And David and the captains of the host separated for the service those of the sons of Asaph and of Heman and of Jeduthun who were to prophesy with harps and lutes and cymbals; and the number of the men employed according to their service was:";
dby[2] = "of the sons of Asaph: Zaccur, and Joseph, and Nethaniah, and Asharelah, the sons of Asaph under the direction of Asaph, who prophesied at the direction of the king.";
dby[3] = "Of Jeduthun, the sons of Jeduthun: Gedaliah, and Zeri, and Isaiah, Hashabiah, and Mattithiah, [and Shimei] six, under the direction of their father Jeduthun, who prophesied with the harp, to give thanks and to praise Jehovah.";
dby[4] = "Of Heman, the sons of Heman: Bukkijah, Mattaniah, Uzziel, Shebuel, and Jerimoth, Hananiah, Hanani, Eliathah, Giddalti, and Romamti-ezer, Joshbekashah, Mallothi, Hothir, Mahazioth:";
dby[5] = "all these were sons of Heman the king\'s seer in the words of God, to exalt his power; and God had given to Heman fourteen sons and three daughters.";
dby[6] = "All these were under the direction of their fathers Asaph, Jeduthun, and Heman, for song in the house of Jehovah, with cymbals, lutes and harps, for the service of the house of God, under the direction of the king.";
dby[7] = "And the number of them, with their brethren that were instructed in the songs of Jehovah, all of them skilful, was two hundred and eighty-eight.";
dby[8] = "And they cast lots with one another over the charges, the small as well as the great, the teacher with the scholar.";

hnv[1] = "Moreover David and the captains of the host set apart for the service certain of the sons of Asaf, and of Heman, and of Yedutun, who should prophesy with harps, with psalteries, and with cymbals: and the number of those who did the work according to their service was:";

rsv[1] = "David and the chiefs of the service also set apart for the service certain of the sons of Asaph, and of Heman, and of Jedu\'thun, who should prophesy with lyres, with harps, and with cymbals. The list of those who did the work and of their duties was:";
rsv[2] = "Of the sons of Asaph: Zaccur, Joseph, Nethani\'ah, and Ashare\'lah, sons of Asaph, under the direction of Asaph, who prophesied under the direction of the king.";
rsv[3] = "Of Jedu\'thun, the sons of Jedu\'thun: Gedali\'ah, Zeri, Jeshai\'ah, Shim\'e-i, Hashabi\'ah, and Mattithi\'ah, six, under the direction of their father Jedu\'thun, who prophesied with the lyre in thanksgiving and praise to the LORD.";
rsv[4] = "Of Heman, the sons of Heman: Bukki\'ah, Mattani\'ah, Uz\'ziel, Shebu\'el, and Jer\'imoth, Hanani\'ah, Hana\'ni, Eli\'athah, Giddal\'ti, and Romam\'ti-e\'zer, Joshbekash\'ah, Mallo\'thi, Hothir, Maha\'zi-oth.";
rsv[5] = "All these were the sons of Heman the king\'s seer, according to the promise of God to exalt him; for God had given Heman fourteen sons and three daughters.";
rsv[6] = "They were all under the direction of their father in the music in the house of the LORD with cymbals, harps, and lyres for the service of the house of God. Asaph, Jedu\'thun, and Heman were under the order of the king.";
rsv[7] = "The number of them along with their brethren, who were trained in singing to the LORD, all who were skilful, was two hundred and eighty-eight.";
rsv[8] = "And they cast lots for their duties, small and great, teacher and pupil alike.";
rsv[9] = "The first lot fell for Asaph to Joseph; the second to Gedali\'ah, to him and his brethren and his sons, twelve;";

vul[1] = "igitur David et magistratus exercitus secreverunt in ministerium filios Asaph et Heman et Idithun qui prophetarent in citharis et psalteriis et cymbalis secundum numerum suum dedicato sibi officio servientes";
vul[2] = "de filiis Asaph Zacchur et Ioseph et Nathania et Asarela filii Asaph sub manu Asaph prophetantis iuxta regem";
vul[3] = "porro Idithun filii Idithun Godolias Sori Iesaias et Sabias et Matthathias sex sub manu patris sui Idithun qui in cithara prophetabat super confitentes et laudantes Dominum";
vul[4] = "Heman quoque filii Heman Bocciau Matthaniau Ozihel Subuhel et Ierimoth Ananias Anani Elietha Geddelthi et Romemthiezer et Iesbacasa Mellothi Othir Mazioth";
vul[5] = "omnes isti filii Heman videntis regis in sermonibus Dei ut exaltaret cornu deditque Deus Heman filios quattuordecim et filias tres";
vul[6] = "universi sub manu patris sui ad cantandum in templo Domini distributi erant in cymbalis et psalteriis et citharis in ministeria domus Domini iuxta regem Asaph videlicet et Idithun et Heman";
vul[7] = "fuit autem numerus eorum cum fratribus suis qui erudiebant canticum Domini cuncti doctores ducenti octoginta octo";
vul[8] = "miseruntque sortes per vices suas ex aequo tam maior quam minor doctus pariter et indoctus";
vul[9] = "egressaque est sors prima Ioseph qui erat de Asaph secunda Godoliae ipsi et filiis eius et fratribus duodecim";
vul[10] = "tertia Zacchur filiis et fratribus eius duodecim";

yng[1] = "And David and the heads of the host separate for service, of the sons of Asaph, and Heman, and Jeduthun, who are prophesying with harps, with psalteries, and with cymbals, and the number of the workmen is according to their service.";
yng[2] = "Of sons of Asaph: Zaccur, and Joseph, and Nethaniah, and Asharelah, sons of Asaph, [are] by the side of Asaph, who is prophesying by the side of the king.";
yng[3] = "Of Jeduthun: sons of Jeduthun, Gedaliah, and Zeri, and Jeshaiah, Hashabiah, and Mattithiah, Shisshah, [are] by the side of their father Jeduthun; with a harp he is prophesying, for giving of thanks and of praise to Jehovah.";
yng[4] = "Of Heman: sons of Heman: Bukkiah, Mattaniah, Uzziel, Shebuel, and Jerimoth, Hananiah, Hanani, Eliathah, Giddalti, and Romamti-Ezer, Joshbekashah, Mallothi, Hothir, Mahazioth;";
yng[5] = "all these [are] sons of Heman -- seer of the king in the things of God -- to lift up a horn; and God giveth to Heman fourteen sons and three daughters.";
yng[6] = "All these [are] by the side of their father in the song of the house of Jehovah, with cymbals, psalteries, and harps, for the service of the house of God; by the side of the king [are] Asaph, and Jeduthun, and Heman.";
yng[7] = "And their number, with their brethren -- taught in the song of Jehovah, all who are intelligent -- is two hundred, eighty and eight.";
yng[8] = "And they cause to fall lots -- charge over-against [charge], as well the small as the great, the intelligent with the learner.";
yng[9] = "And the first lot goeth out for Asaph to Joseph; [to] Gedaliah the second; he, and his brethren and his sons, twelve;";
yng[10] = "the third [to] Zaccur, his sons and his brethren, twelve;";

csb[1] = "David and the officers of the army also set apart some of the sons of Asaph, Heman, and Jeduthun, who were to prophesy accompanied by lyres, harps, and cymbals. This is the list of the men who performed their service:";
csb[2] = "From Asaph\'s sons: Zaccur, Joseph, Nethaniah, and Asarelah, sons of Asaph, under Asaph\'s authority, who prophesied under the authority of the king.";
csb[3] = "From Jeduthun: Jeduthun\'s sons: Gedaliah, Zeri, Jeshaiah, Shimei, Hashabiah, and Mattithiah -- six -- under the authority of their father Jeduthun, prophesying to the accompaniment of lyres, giving thanks and praise to the LORD.";
csb[4] = "From Heman: Heman\'s sons: Bukkiah, Mattaniah, Uzziel, Shebuel, Jerimoth, Hananiah, Hanani, Eliathah, Giddalti, Romamti-ezer, Joshbekashah, Mallothi, Hothir, and Mahazioth.";
csb[5] = "All these sons of Heman, the king\'s seer, were given by the promises of God to exalt him, for God had given Heman fourteen sons and three daughters.";
csb[6] = "All these men were under their own fathers\' authority for the music in the LORD\'s temple, with cymbals, harps, and lyres for the service of God\'s temple. Asaph, Jeduthun, and Heman were under the king\'s authority.";
csb[7] = "They numbered 288 together with their relatives who were all trained and skillful in music for the LORD.";
csb[8] = "They cast lots for their duties, young and old alike, teacher as well as pupil.";
csb[9] = "The first lot for Asaph fell to Joseph, his sons, and his relatives -- 12 to Gedaliah the second: him, his relatives, and his sons -- 12";
