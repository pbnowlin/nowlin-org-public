asv[29] = "These are their generations: the first-born of Ishmael, Nebaioth; then Kedar, and Adbeel, and Mibsam,";

asv[31] = "Jetur, Naphish, and Kedemah. These are the sons of Ishmael.";
asv[32] = "And the sons of Keturah, Abraham\'s concubine: she bare Zimran, and Jokshan, and Medan, and Midian, and Ishbak, and Shuah. And the sons of Jokshan: Sheba, and Dedan.";
asv[33] = "And the sons of Midian: Ephah, and Epher, and Hanoch, and Abida, and Eldaah. All these were the sons of Keturah.";
asv[34] = "And Abraham begat Isaac. The sons of Isaac: Esau, and Israel.";
asv[35] = "The sons of Esau: Eliphaz, Reuel, and Jeush, and Jalam, and Korah.";
asv[36] = "The sons of Eliphaz: Teman, and Omar, Zephi, and Gatam, Kenaz, and Timna, and Amalek.";
asv[37] = "The sons of Reuel: Nahath, Zerah, Shammah, and Mizzah.";
asv[38] = "And the sons of Seir: Lotan, and Shobal, and Zibeon, and Anah, and Dishon, and Ezer, and Dishan.";
asv[39] = "And the sons of Lotan: Hori, and Homam; and Timna was Lotan\'s sister.";

asv[41] = "The sons of Anah: Dishon. And the sons of Dishon: Hamran, and Eshban, and Ithran, and Cheran.";
asv[42] = "The sons of Ezer: Bilhan, and Zaavan, Jaakan. The sons of Dishan: Uz, and Aran.";
asv[43] = "Now these are the kings that reigned in the land of Edom, before there reigned any king over the children of Israel: Bela the son of Beor; and the name of his city was Dinhabah.";
asv[44] = "And Bela died, and Jobab the son of Zerah of Bozrah reigned in his stead.";
asv[45] = "And Jobab died, and Husham of the land of the Temanites reigned in his stead.";
asv[46] = "And Husham died, and Hadad the son of Bedad, who smote Midian in the field of Moab, reigned in his stead; and the name of his city was Avith.";
asv[47] = "And Hadad died, and Samlah of Masrekah reigned in his stead.";
asv[48] = "And Samlah died, and Shaul of Rehoboth by the River reigned in his stead.";
asv[49] = "And Shaul died, and Baal-hanan the son of Achbor reigned in his stead.";
asv[50] = "And Baal-hanan died, and Hadad reigned in his stead; and the name of his city was Pai: and his wife\'s name was Mehetabel, the daughter of Matred, the daughter of Me-zahab.";
asv[51] = "And Hadad died. And the chiefs of Edom were: chief Timna, chief Aliah, chief Jetheth,";
asv[52] = "chief Oholibamah, chief Elah, chief Pinon,";
asv[53] = "chief Kenaz, chief Teman, chief Mibzar,";
asv[54] = "chief Magdiel, chief Iram. These are the chiefs of Edom.";

hnv[1] = "Adam, Shet, Enosh,";

hnv[4] = "Noach, Shem, Ham, and Yefet.";
hnv[5] = " The sons of Yefet: Gomer, and Magog, and Madai, and Yavan, and Tuval, and Meshekh, and Tiras.";
hnv[6] = "The sons of Gomer: Ashkenaz, and Difat, and Togarmah.";
hnv[7] = "The sons of Yavan: Elishah, and Tarshisha, Kittim, and Rodanim.";
hnv[8] = "The sons of Ham: Kush, and Mitzrayim, Put, and Kana`an.";
hnv[9] = "The sons of Kush: Seva, and Havilah, and Savtah, and Ra`mah, and Savtekha. The sons of Ra`mah: Sheva, and Dedan.";
hnv[10] = "Kush became the father of Nimrod; he began to be a mighty one in the eretz.";
hnv[11] = "Mitzrayim became the father of Ludim, and Anamim, and Lehavim, and Naftuchim,";
hnv[12] = "and Patrusim, and Kasluchim (from whence came the Pelishtim), and Kaftorim.";
hnv[13] = "Kana`an became the father of Tzidon his firstborn, and Het,";
hnv[14] = "and the Yevusi, and the Amori, and the Girgashi,";
hnv[15] = "and the Hivvi, and the `Arki, and the Sini,";
hnv[16] = "and the Arvadi, and the Tzemari, and the Hamati.";
hnv[17] = "The sons of Shem: `Elam, and Ashshur, and Arpakhshad, and Lud, and Aram, and `Utz, and Hul, and Geter, and Meshekh.";
hnv[18] = "Arpakhshad became the father of Shelach, and Shelach became the father of `Ever.";
hnv[19] = "To `Ever were born two sons: the name of the one was Peleg; for in his days the eretz was divided; and his brother\'s name was Yoktan.";
hnv[20] = "Yoktan became the father of Almodad, and Shelef, and Hatzarmavat, and Yerach,";
hnv[21] = " and Hadoram, and Uzal, and Diklah,";
hnv[22] = "and `Eval, and Avima\'el, and Sheva,";
hnv[23] = "and Ofir, and Havilah, and Yovav. All these were the sons of Yoktan.";
hnv[24] = "Shem, Arpakhshad, Shelach,";
hnv[25] = "`Ever, Peleg, Re`u,";
hnv[26] = "Serug, Nachor, Terach,";
hnv[27] = "Avram (the same is Avraham).";
hnv[28] = "The sons of Avraham: Yitzchak, and Yishma\'el.";
hnv[29] = "These are their generations: the firstborn of Yishma\'el, Nevayot; then Kedar, and Adbe\'el, and Mivsam,";
hnv[30] = "Mishma, and Dumah, Massa, Hadad, and Tema,";
hnv[31] = "Yetur, Nafish, and Kedemah. These are the sons of Yishma\'el.";
hnv[32] = "The sons of Keturah, Avraham\'s concubine: she bore Zimran, and Yokshan, and Medan, and Midyan, and Yishbak, and Shuach. The sons of Yokshan: Sheva, and Dedan.";
hnv[33] = "The sons of Midyan: `Efah, and `Efer, and Hanokh, and Avida, and Elda`ah. All these were the sons of Keturah.";
hnv[34] = "Avraham became the father of Yitzchak. The sons of Yitzchak: Esav, and Yisra\'el.";
hnv[35] = "The sons of Esav: Elifaz, Re`u\'el, and Ye`ush, and Ya`lam, and Korach.";
hnv[36] = "The sons of Elifaz: Teman, and Omar, Tzefi, and Ga`tam, Kenaz, and Timna, and `Amalek.";
hnv[37] = "The sons of Re`u\'el: Nachat, Zerach, Shammah, and Mizzah.";
hnv[38] = "The sons of Se`ir: Lotan, and Shoval, and Tziv`on, and `Anah, and Dishon, and Etzer, and Dishan.";
hnv[39] = "The sons of Lotan: Hori, and Homam; and Timna was Lotan\'s sister.";
hnv[40] = "The sons of Shoval: `Alyan, and Manachat, and `Eval, Shefi, and Onam. The sons of Tziv`on: Ayah, and `Anah.";
hnv[41] = "The sons of `Anah: Dishon. The sons of Dishon: Hamran, and Eshban, and Yitran, and Keran.";
hnv[42] = "The sons of Etzer: Bilhan, and Za`avan, Ya`akan. The sons of Dishan: `Utz, and Aran.";
hnv[43] = "Now these are the kings who reigned in the land of Edom, before there resigned any king over the children of Yisra\'el: Bela the son of Be\'or; and the name of his city was Dinhava.";
hnv[44] = "Bela died, and Yovav the son of Zerach of Botzrah reigned in his place.";
hnv[45] = "Yovav died, and Husham of the land of the Temani reigned in his place.";
hnv[46] = "Husham died, and Hadad the son of Bedad, who struck Midyan in the field of Mo\'av, reigned in his place; and the name of his city was `Avit.";
hnv[47] = "Hadad died, and Samlah of Masrekah reigned in his place.";
hnv[48] = "Samlah died, and Sha\'ul of Rechovot by the River reigned in his place.";
hnv[49] = "Sha\'ul died, and Ba`al-Hanan the son of `Akhbor reigned in his place.";
hnv[50] = " Ba`al-Hanan died, and Hadad reigned in his place; and the name of his city was Pai: and his wife\'s name was Mehetav\'el, the daughter of Matred, the daughter of Me-Zahav.";
hnv[51] = "Hadad died. The chiefs of Edom were: chief Timna, chief `Alvah, chief Yetet,";
hnv[52] = "chief Oholivamah, chief Elah, chief Pinon,";
hnv[53] = "chief Kenaz, chief Teman, chief Mivtzar,";
hnv[54] = "chief Magdi\'el, chief `Iram. These are the chiefs of Edom.";

rsv[18] = "Arpach\'shad was the father of Shelah; and Shelah was the father of Eber.";
rsv[19] = "To Eber were born two sons: the name of the one was Peleg (for in his days the earth was divided), and the name of his brother Joktan.";
rsv[20] = "Joktan was the father of Almo\'dad, Sheleph, Hazarma\'veth, Jerah,";
rsv[21] = "Hador\'am, Uzal, Diklah,";
rsv[22] = "Ebal, Abim\'a-el, Sheba,";
rsv[23] = "Ophir, Hav\'ilah, and Jobab; all these were the sons of Joktan.";
rsv[24] = "Shem, Arpach\'shad, Shelah;";
rsv[25] = "Eber, Peleg, Re\'u;";
rsv[26] = "Serug, Nahor, Terah;";
rsv[27] = "Abram, that is, Abraham.";
rsv[28] = "The sons of Abraham: Isaac and Ish\'mael.";
rsv[29] = "These are their genealogies: the first-born of Ish\'mael, Neba\'ioth; and Kedar, Adbeel, Mibsam,";
rsv[30] = "Mishma, Dumah, Massa, Hadad, Tema,";
rsv[31] = "Jetur, Naphish, and Ked\'emah. These are the sons of Ish\'mael.";
rsv[32] = "The sons of Ketu\'rah, Abraham\'s concubine: she bore Zimran, Jokshan, Medan, Mid\'ian, Ishbak, and Shu\'ah. The sons of Jokshan: Sheba and Dedan.";
rsv[33] = "The sons of Mid\'ian: Ephah, Epher, Hanoch, Abida, and Elda\'ah. All these were the descendants of Ketu\'rah.";
rsv[34] = "Abraham was the father of Isaac. The sons of Isaac: Esau and Israel.";
rsv[35] = "The sons of Esau: Eli\'phaz, Reu\'el, Je\'ush, Jalam, and Korah.";
rsv[36] = "The sons of Eli\'phaz: Teman, Omar, Zephi, Gatam, Kenaz, Timna, and Am\'alek.";
rsv[37] = "The sons of Reu\'el: Nahath, Zerah, Shammah, and Mizzah.";
rsv[38] = "The sons of Se\'ir: Lotan, Shobal, Zib\'eon, Anah, Dishon, Ezer, and Dishan.";
rsv[39] = "The sons of Lotan: Hori and Homam; and Lotan\'s sister was Timna.";
rsv[40] = "The sons of Shobal: Al\'ian, Man\'ahath, Ebal, Shephi, and Onam. The sons of Zib\'eon: Ai\'ah and Anah.";
rsv[41] = "The sons of Anah: Dishon. The sons of Dishon: Hamran, Eshban, Ithran, and Cheran.";
rsv[42] = "The sons of Ezer: Bilhan, Za\'avan, and Ja\'akan. The sons of Dishan: Uz and Aran.";
rsv[43] = "These are the kings who reigned in the land of Edom before any king reigned over the Israelites: Bela the son of Be\'or, the name of whose city was Din\'habah.";
rsv[44] = "When Bela died, Jobab the son of Zerah of Bozrah reigned in his stead.";
rsv[45] = "When Jobab died, Husham of the land of the Te\'manites reigned in his stead.";
rsv[46] = "When Husham died, Hadad the son of Bedad, who defeated Mid\'ian in the country of Moab, reigned in his stead; and the name of his city was Avith.";
rsv[47] = "When Hadad died, Samlah of Masre\'kah reigned in his stead.";
rsv[48] = "When Samlah died, Sha\'ul of Reho\'both on the Euphra\'tes reigned in his stead.";
rsv[49] = "When Sha\'ul died, Ba\'al-ha\'nan, the son of Achbor, reigned in his stead.";
rsv[50] = "When Ba\'al-ha\'nan died, Hadad reigned in his stead; and the name of his city was Pa\'i, and his wife\'s name Mehet\'abel the daughter of Matred, the daughter of Me\'zahab.";
rsv[51] = "And Hadad died. The chiefs of Edom were: chiefs Timna, Al\'iah, Jetheth,";
rsv[52] = "Oholiba\'mah, Elah, Pinon,";
rsv[53] = "Kenaz, Teman, Mibzar,";
rsv[54] = "Mag\'di-el, and Iram; these are the chiefs of Edom.";
vul[1] = "Adam Seth Enos";
vul[2] = "Cainan Malelehel Iared";
vul[3] = "Enoch Matusale Lamech";
vul[4] = "Noe Sem Ham et Iafeth";
vul[5] = "filii Iafeth Gomer Magog Madai et Iavan Thubal Mosoch Thiras";
vul[6] = "porro filii Gomer Aschenez et Rifath et Thogorma";
vul[7] = "filii autem Iavan Elisa et Tharsis Cetthim et Dodanim";
vul[8] = "filii Ham Chus et Mesraim Phut et Chanaan";
vul[9] = "filii autem Chus Saba et Evila Sabatha et Rechma et Sabathaca porro filii Rechma Saba et Dadan";
vul[10] = "Chus autem genuit Nemrod iste coepit esse potens in terra";
vul[11] = "Mesraim vero genuit Ludim et Anamim et Laabim et Nepthuim";
vul[12] = "Phethrosim quoque et Chasluim de quibus egressi sunt Philisthim et Capthurim";
vul[13] = "Chanaan vero genuit Sidonem primogenitum et Heth";
vul[14] = "Iebuseum quoque et Amorreum et Gergeseum";
vul[15] = "Evheumque et Aruceum et Asineum";
vul[16] = "Aradium quoque et Samareum et Ematheum";
vul[17] = "filii Sem Aelam et Assur et Arfaxad et Lud et Aram et Us et Hul et Gothor et Mosoch";
vul[18] = "Arfaxad autem genuit Sala qui et ipse genuit Heber";
vul[19] = "porro Heber nati sunt duo filii nomen uni Phaleg quia in diebus eius divisa est terra et nomen fratris eius Iectan";
vul[20] = "Iectan autem genuit Helmodad et Saleph et Asermoth et Iare";
vul[21] = "Aduram quoque et Uzal et Decla";
vul[22] = "Ebal etiam et Abimahel et Saba necnon";
vul[23] = "et Ophir et Evila et Iobab omnes isti filii Iectan";
vul[24] = "Sem Arfaxad Sale";
vul[25] = "Heber Phaleg Raau";
vul[26] = "Serug Nahor Thare";
vul[27] = "Abram iste est Abraham";
vul[28] = "filii autem Abraham Isaac et Ismahel";
vul[29] = "et hae generationes eorum primogenitus Ismahelis Nabaioth et Cedar et Adbeel et Mabsam";
vul[30] = "Masma et Duma Massa Adad et Thema";
vul[31] = "Iathur Naphis Cedma hii sunt filii Ismahelis";
vul[32] = "filii autem Cetthurae concubinae Abraham quos genuit Zamram Iecsan Madan Madian Iesboc Sue porro filii Iecsan Saba et Dadan";
vul[33] = "filii autem Madian Epha et Apher et Enoch et Abida et Eldaa omnes hii filii Cetthurae";
vul[34] = "generavit autem Abraham Isaac cuius fuerunt filii Esau et Israhel";
vul[35] = "filii Esau Eliphaz Rauhel Iaus Ialam Core";
vul[36] = "filii Eliphaz Theman Omer Sepphu Gethem Cenez Thamna Amalech";
vul[37] = "filii Rauhel Naath Zara Samma Maza";
vul[38] = "filii Seir Lothan Sobal Sebeon Ana Dison Eser Disan";
vul[39] = "filii Lothan Horri Humam soror autem Lothan fuit Thamna";
vul[40] = "filii Sobal Alian et Manaath et Ebal et Sepphi et Onam filii Sebeon Aia et Ana filii Ana Dison";
vul[41] = "filii Dison Amaran et Eseban et Iethran et Charan";
vul[42] = "filii Eser Balaan et Zaban et Iacan filii Dison Us et Aran";
vul[43] = "isti sunt reges qui imperaverunt in terra Edom antequam esset rex super filios Israhel Bale filius Beor et nomen civitatis eius Denaba";
vul[44] = "mortuus est autem Bale et regnavit pro eo Iobab filius Zare de Bosra";
vul[45] = "cumque et Iobab fuisset mortuus regnavit pro eo Husam de terra Themanorum";
vul[46] = "obiit quoque et Husam et regnavit pro eo Adad filius Badad qui percussit Madian in terra Moab et nomen civitatis eius Avith";
vul[47] = "cumque et Adad fuisset mortuus regnavit pro eo Semla de Masreca";
vul[48] = "sed et Semla mortuus est et regnavit pro eo Saul de Rooboth quae iuxta amnem sita est";
vul[49] = "mortuo quoque Saul regnavit pro eo Baalanan filius Achobor";
vul[50] = "sed et hic mortuus est et regnavit pro eo Adad cuius urbis fuit nomen Phou et appellata est uxor eius Mehetabel filia Matred filiae Mezaab";
vul[51] = "Adad autem mortuo duces pro regibus in Edom esse coeperunt dux Thamna dux Alva dux Ietheth";
vul[52] = "dux Oolibama dux Hela dux Phinon";
vul[53] = "dux Cenez dux Theman dux Mabsar";
vul[54] = "dux Magdihel dux Iram hii duces Edom";
web[1] = "Adam, Sheth, Enosh,";
web[2] = "Kenan, Mahalaleel, Jered,";
web[3] = "Henoch, Methuselah, Lamech,";
web[4] = "Noah, Shem, Ham, and Japheth.";
web[5] = "The sons of Japheth; Gomer, and Magog, and Madai, and Javan, and Tubal, and Meshech, and Tiras.";
web[6] = "And the sons of Gomer; Ashchenaz, and Riphath, and Togarmah.";
web[7] = "And the sons of Javan; Elisha, and Tarshish, Kittim, and Dodanim.";
web[8] = "The sons of Ham; Cush, and Mizraim, Put, and Canaan.";
web[9] = "And the sons of Cush; Seba, and Havilah, and Sabta, and Raamah, and Sabtecha. And the sons of Raamah; Sheba, and Dedan.";
web[10] = "And Cush begat Nimrod. He began to be mighty upon the earth.";
web[11] = "And Mizraim begat Ludim, and Anamim, and Lehabim, and Naphtuhim,";
web[12] = "And Pathrusim, and Casluhim, (of whom came the Philistines,) and Caphthorim.";
web[13] = "And Canaan begat Zidon his first-born, and Heth,";
web[14] = "The Jebusite also, and the Amorite, and the Girgashite,";
web[15] = "And the Hivite, and the Archite, and the Sinite,";
web[16] = "And the Arvadite, and the Zemarite, and the Hamathite.";
web[17] = "The sons of Shem; Elam, and Asshur, and Arphaxad, and Lud, and Aram, and Uz, and Hul, and Gether, and Meshech.";
web[18] = "And Arphaxad begat Shelah, and Shelah begat Eber.";
web[19] = "And to Eber were born two sons: the name of the one [was] Peleg; because in his days the earth was divided: and his brother\'s name [was] Joktan.";
web[20] = "And Joktan begat Almodad, and Sheleph, and Hazarmaveth, and Jerah,";
web[21] = "Hadoram also, and Uzal, and Diklah,";
web[22] = "And Ebal, and Abimael, and Sheba,";
web[23] = "And Ophir, and Havilah, and Jobab. All these [were] the sons of Joktan.";
web[24] = "Shem, Arphaxad, Shelah,";
web[25] = "Eber, Peleg, Reu,";
web[26] = "Serug, Nahor, Terah,";
web[27] = "Abram; the same [is] Abraham.";
web[28] = "The sons of Abraham; Isaac, and Ishmael.";
web[29] = "These [are] their generations. The first-born of Ishmael, Nebaioth; then Kedar, and Adbeel, and Mibsam,";
web[30] = "Mishma, and Dumah, Massa, Hadad, and Tema,";
web[31] = "Jetur, Naphish, and Kedemah. These are the sons of Ishmael.";
web[32] = "Now the sons of Keturah, Abraham\'s concubine: she bore Zimran, and Jokshan, and Medan, and Midian, and Ishbak, and Shuah. And the sons of Jokshan; Sheba, and Dedan.";
web[33] = "And the sons of Midian; Ephah, and Epher, and Henoch, and Abida, and Eldaah. All these [are] the sons of Keturah,";
web[34] = "And Abraham begat Isaac. The sons of Isaac; Esau and Israel.";
web[35] = "The sons of Esau; Eliphaz, Reuel, and Jeush, and Jaalam, and Korah.";
web[36] = "The sons of Eliphaz; Teman, and Omar, Zephi, and Gatam, Kenaz, and Timna, and Amalek.";
web[37] = "The sons of Reuel; Nahath, Zerah, Shammah, and Mizzah.";
web[38] = "And the sons of Seir; Lotan, and Shobal, and Zibeon, and Anah, and Dishon, and Ezar, and Dishan.";
web[39] = "And the sons of Lotan; Hori, and Homam: and Timna [was] Lotan\'s sister.";
web[40] = "The sons of Shobal; Alian, and Manahath, and Ebal, Shephi, and Onam. And the sons of Zibeon; Aiah, and Anah.";
web[41] = "The sons of Anah; Dishon. And the sons of Dishon; Amram, and Eshban, and Ithran, and Cheran.";
web[42] = "The sons of Ezer; Bilhan, and Zavan, [and] Jakan. The sons of Dishan; Uz, and Aran.";
web[43] = "Now these [are] the kings that reigned in the land of Edom before [any] king reigned over the children of Israel; Bela the son of Beor: and the name of his city [was] Dinhabah.";
web[44] = "And when Bela was dead Jobab the son of Zera of Bozrah reigned in his stead.";
web[45] = "And when Jobab was dead, Husham of the land of the Temanites reigned in his stead.";
web[46] = "And when Husham was dead, Hadad the son of Bedad, who smote Midian in the field of Moab, reigned in his stead: and the name of his city [was] Avith.";
web[47] = "And when Hadad was dead, Samlah of Masrekah reigned in his stead.";
web[48] = "And when Samlah was dead, Shaul of Rehoboth by the river reigned in his stead.";
web[49] = "And when Shaul was dead, Baal-hanan the son of Achbor reigned in his stead.";
web[50] = "And when Baal-hanan was dead, Hadad reigned in his stead: and the name of his city [was] Pai; and his wife\'s name [was] Mehetabel, the daughter of Matred, the daughter of Mezahab.";
web[51] = "Hadad died also. And the dukes of Edom were; duke Timna, duke Aliah, duke Jetheth,";
web[52] = "Duke Aholibamah, duke Elah, duke Pinon,";
web[53] = "Duke Kenaz, duke Teman, duke Mibzar,";
web[54] = "Duke Magdiel, duke Iram. These [are] the dukes of Edom.";

yng[6] = "And sons of Gomer: Ashchenaz, and Riphath, and Togarmah.";
yng[7] = "And sons of Javan: Elisha, and Tarshishah, Kittim, and Dodanim.";

yng[9] = "And sons of Cush: Seba and Havilah, and Sabta, and Raamah, and Sabtecka. And sons of Raamah: Sheba and Dedan.";
yng[10] = "And Cush begat Nimrod: he began to be a mighty one in the land.";
yng[11] = "And Mizraim begat the Ludim, and the Anamim, and the Lehabim, and the Naphtuhim,";
yng[12] = "and the Pathrusim, and the Casluhim (from whom came out the Philistim), and the Caphtorim.";
yng[13] = "And Canaan begat Zidon his first born, and Heth,";
yng[14] = "and the Jebusite, and the Amorite, and the Girgashite,";
yng[15] = "and the Hivite, and the Arkite, and the Sinite,";
yng[16] = "and the Arvadite, and the Zemarite, and the Hamathite.";
yng[17] = "Sons of Shem: Elam and Asshur, and Arphaxad, and Lud, and Aram, and Uz, and Hul, and Gether, and Meshech.";
yng[18] = "And Arphaxad begat Shelah, and Shelah begat Eber.";
yng[19] = "And to Eber have been born two sons, the name of the one [is] Peleg, for in his days hath the land been divided, and the name of his brother is Joktan.";
yng[20] = "And Joktan begat Almodad, and Sheleph, and Hazarmaveth, and Jerah,";
yng[21] = "and Hadoram, and Uzal, and Diklah,";
yng[22] = "and Ebal, and Abimael, and Sheba,";
yng[23] = "and Ophir, and Havilah, and Jobab; all these [are] sons of Joktan.";
yng[24] = "Shem, Arphaxad, Shelah,";
yng[25] = "Eber, Peleg, Reu,";
yng[26] = "Serug, Nahor, Terah,";
yng[27] = "Abram -- he [is] Abraham.";
yng[28] = "Sons of Abraham: Isaac and Ishmael.";
yng[29] = "These [are] their generations: first-born of Ishmael, Nebaioth, and Kedar, and Adheel, and Mibsam,";
yng[30] = "Mishma, and Dumah, Massa, Hadad, and Tema,";
yng[31] = "Jetur, Naphish, and Kedema. These are sons of Ishmael.";
yng[32] = "And sons of Keturah, Abraham\'s concubine: she bare Zimran, and Jokshan, and Medan, and Midian, and Ishbak, and Shuah. And sons of Jokshan: Sheba and Dedan.";
yng[33] = "And sons of Midian: Ephah and Epher, and Henoch, and Abida, and Eldaah; all these [are] sons of Keturah.";
yng[34] = "And Abraham begetteth Isaac. Sons of Isaac: Esau and Israel.";
yng[35] = "Sons of Esau: Eliphaz, Reuel, and Jeush, and Jaalam, and Korah.";
yng[36] = "Sons of Eliphaz: Teman, and Omar, Zephi, and Gatam, Kenaz, and Timna, and Amalek.";
yng[37] = "Sons of Reuel: Nahath, Zerah, Shammah, and Mizzah.";
yng[38] = "And sons of Seir: Lotan, and Shobal, and Zibeon, and Anah, and Dishon, and Ezar, and Dishan.";
yng[39] = "And sons of Lotan: Hori and Homam, and sister of Lotan [is] Timna.";
yng[40] = "Sons of Shobal: Alian, and Manahath, and Ebal, Shephi, and Onam. And sons of Zideon: Aiah and Anah.";
yng[41] = "The sons of Anah: Dishon. and sons of Dishon: Amram, and Eshban, and Ithran, and Cheran.";
yng[42] = "Sons of Ezer: Bilhan, and Zavan, Jakan. Sons of Dishan: Uz and Aran.";
yng[43] = "And these [are] the kings who reigned in the land of Edom before the reigning of a king of the sons of Israel: Bela son of Beor, and the name of his city [is] Dinhabah.";
yng[44] = "And Bela dieth, and reign in his stead doth Jobab son of Zerah from Bozrali;";
yng[45] = "and Jobab dieth, and reign in his stead doth Husham from the land of the Temanite;";
yng[46] = "and Husham dieth, and reign in his stead doth Hadad, son of Bedad (who smiteth Midian in the field of Moab) and the name of his city [is] Avith;";
yng[47] = "and Hadad dieth, and reign in his stead doth Samlah from Masrekah;";
yng[48] = "and Samlah dieth, and reign in his stead doth Shaul from Rehoboth of the River;";
yng[49] = "and Shaul dieth, and reign in his stead doth Baal-Hanan son of Achbor;";
yng[50] = "and Baal-Hanan dieth, and reign in his stead doth Hadad, and the name of his city [is] Pai, and the name of his wife [is] Mehetabel daughter of Matred, daughter of Me-Zahab; Hadad also dieth.";
yng[51] = "And chiefs of Edom are: chief Timnah, chief Aliah, chief Jetheth,";
yng[52] = "chief Aholibamah, chief Elah, chief Pinon,";
yng[53] = "chief Kenaz, chief Teman, chief Mibzar,";
yng[54] = "chief Magdiel, chief Iram. These [are] chiefs of Edom.";
csb[1] = "Adam, Seth, Enosh,";
csb[2] = "Kenan, Mahalalel, Jared,";
csb[3] = "Enoch, Methuselah, Lamech,";
csb[4] = "Noah, Noah\'s sons: Shem, Ham, and Japheth.";
csb[5] = "Japheth\'s sons: Gomer, Magog, Madai, Javan, Tubal, Meshech, and Tiras.";
csb[6] = "Gomer\'s sons: Ashkenaz, Riphath, and Togarmah.";
csb[7] = "Javan\'s sons: Elishah, Tarshish, Kittim, and Rodanim.";
csb[8] = "Ham\'s sons: Cush, Mizraim, Put, and Canaan.";
csb[9] = "Cush\'s sons: Seba, Havilah, Sabta, Raama, and Sabteca. Raama\'s sons: Sheba and Dedan.";
csb[10] = "Cush fathered Nimrod, who was the first to become a great warrior on earth.";
csb[11] = "Mizraim fathered the people of Lud, Anam, Lehab, Naphtuh,";
csb[12] = "Pathrus, Casluh (the Philistines came from them), and Caphtor.";
csb[13] = "Canaan fathered Sidon as his firstborn and Heth,";
csb[14] = "as well as the Jebusites, Amorites, Girgashites,";
csb[15] = "Hivites, Arkites, Sinites,";
csb[16] = "Arvadites, Zemarites, and Hamathites.";
csb[17] = "Shem\'s sons: Elam, Asshur, Arpachshad, Lud, Aram, Uz, Hul, Gether, and Meshech.";
csb[18] = "Arpachshad fathered Shelah, and Shelah fathered Eber.";
csb[19] = "Two sons were born to Eber. One of them was named Peleg because the earth was divided during his lifetime, and the name of his brother was Joktan.";
csb[20] = "Joktan fathered Almodad, Sheleph, Hazarmaveth, Jerah,";
csb[21] = "Hadoram, Uzal, Diklah,";
csb[22] = "Ebal, Abimael, Sheba,";
csb[23] = "Ophir, Havilah, and Jobab. All of these were Joktan\'s sons.";
csb[24] = "Shem, Arpachshad, Shelah,";
csb[25] = "Eber, Peleg, Reu,";
csb[26] = "Serug, Nahor, Terah,";
csb[27] = "and Abram (that is, Abraham).";
csb[28] = "Abraham\'s sons: Isaac and Ishmael.";
csb[29] = "These are their family records: Nebaioth, Ishmael\'s firstborn, Kedar, Adbeel, Mibsam,";
csb[30] = "Mishma, Dumah, Massa, Hadad, Tema,";
csb[31] = "Jetur, Naphish, and Kedemah. These were Ishmael\'s sons.";
csb[32] = "The sons born to Keturah, Abraham\'s concubine: Zimran, Jokshan, Medan, Midian, Ishbak, and Shuah. Jokshan\'s sons: Sheba and Dedan.";
csb[33] = "Midian\'s sons: Ephah, Epher, Hanoch, Abida, and Eldaah. All of these were Keturah\'s descendants.";
csb[34] = "Abraham fathered Isaac. Isaac\'s sons: Esau and Israel.";
csb[35] = "Esau\'s sons: Eliphaz, Reuel, Jeush, Jalam, and Korah.";
csb[36] = "Eliphaz\'s sons: Teman, Omar, Zephi, Gatam, and Kenaz; and by Timna, Amalek.";
csb[37] = "Reuel\'s sons: Nahath, Zerah, Shammah, and Mizzah.";
csb[38] = "Seir\'s sons: Lotan, Shobal, Zibeon, Anah, Dishon, Ezer, and Dishan.";
csb[39] = "Lotan\'s sons: Hori and Homam. Timna was Lotan\'s sister.";
csb[40] = "Shobal\'s sons: Alian, Manahath, Ebal, Shephi, and Onam. Zibeon\'s sons: Aiah and Anah.";
csb[41] = "Anah\'s son: Dishon. Dishon\'s sons: Hamran, Eshban, Ithran, and Cheran.";
csb[42] = "Ezer\'s sons: Bilhan, Zaavan, and Jaakan. Dishan\'s sons: Uz and Aran.";
csb[43] = "These were the kings who reigned in the land of Edom before any king reigned over the Israelites: Bela son of Beor. Bela\'s town was named Dinhabah.";
csb[44] = "When Bela died, Jobab son of Zerah from Bozrah reigned in his place.";
csb[45] = "When Jobab died, Husham from the land of the Temanites reigned in his place.";
csb[46] = "When Husham died, Hadad son of Bedad, who defeated Midian in the territory of Moab, reigned in his place. Hadad\'s town was named Avith.";
csb[47] = "When Hadad died, Samlah from Masrekah reigned in his place.";
csb[48] = "When Samlah died, Shaul from Rehoboth on the Euphrates River reigned in his place.";
csb[49] = "When Shaul died, Baal-hanan son of Achbor reigned in his place.";
csb[50] = "When Baal-hanan died, Hadad reigned in his place. Hadad\'s city was named Pai, and his wife\'s name was Mehetabel daughter of Matred, daughter of Me-zahab.";
csb[51] = "Then Hadad died. Edom\'s chiefs: Timna, Alvah, Jetheth,";
csb[52] = "Oholibamah, Elah, Pinon,";
csb[53] = "Kenaz, Teman, Mibzar,";
csb[54] = "Magdiel, and Iram. These were Edom\'s chiefs.";
