asv[1] = "And [David] made him houses in the city of David; and he prepared a place for the ark of God, and pitched for it a tent.";
asv[2] = "Then David said, None ought to carry the ark of God but the Levites: for them hath Jehovah chosen to carry the ark of God, and to minister unto him for ever.";
asv[3] = "And David assembled all Israel at Jerusalem, to bring up the ark of Jehovah unto its place, which he had prepared for it.";
asv[4] = "And David gathered together the sons of Aaron, and the Levites:";
asv[5] = "of the sons of Kohath, Uriel the chief, and his brethren a hundred and twenty;";
asv[6] = "of the sons of Merari, Asaiah the chief, and his brethren two hundred and twenty;";
asv[7] = "of the sons of Gershom, Joel the chief, and his brethren a hundred and thirty;";
asv[8] = "of the sons of Elizaphan, Shemaiah the chief, and his brethren two hundred;";
asv[9] = "of the sons of Hebron, Eliel the chief, and his brethren fourscore;";
asv[10] = "of the sons of Uzziel, Amminadab the chief, and his brethren a hundred and twelve.";
asv[11] = "And David called for Zadok and Abiathar the priests, and for the Levites, for Uriel, Asaiah, and Joel, Shemaiah, and Eliel, and Amminadab,";
asv[12] = "and said unto them, Ye are the heads of the fathers\' [houses] of the Levites: sanctify yourselves, both ye and your brethren, that ye may bring up the ark of Jehovah, the God of Israel, unto [the place] that I have prepared for it.";
asv[13] = "For because ye [bare it] not at the first, Jehovah our God made a breach upon us, for that we sought him not according to the ordinance.";
asv[14] = "So the priests and the Levites sanctified themselves to bring up the ark of Jehovah, the God of Israel.";
asv[15] = "And the children of the Levites bare the ark of God upon their shoulders with the staves thereon, as Moses commanded according to the word of Jehovah.";
asv[16] = "And David spake to the chief of the Levites to appoint their brethren the singers, with instruments of music, psalteries and harps and cymbals, sounding aloud and lifting up the voice with joy.";
asv[17] = "So the Levites appointed Heman the son of Joel; and of his brethren, Asaph the son of Berechiah; and of the sons of Merari their brethren, Ethan the son of Kushaiah;";
asv[18] = "and with them their brethren of the second degree, Zechariah, Ben, and Jaaziel, and Shemiramoth, and Jehiel, and Unni, Eliab, and Benaiah, and Maaseiah, and Mattithiah, and Eliphelehu, and Mikneiah, and Obed-edom, and Jeiel, the doorkeepers.";
asv[19] = "So the singers, Heman, Asaph, and Ethan, [were appointed,] with cymbals of brass to sound aloud;";
asv[20] = "and Zechariah, and Aziel, and Shemiramoth, and Jehiel, and Unni, and Eliab, and Maaseiah, and Benaiah, with psalteries set to Alamoth;";
asv[21] = "and Mattithiah, and Eliphelehu, and Mikneiah, and Obed-edom, and Jeiel, and Azaziah, with harps set to the Sheminith, to lead.";
asv[22] = "And Chenaniah, chief of the Levites, was over the song: he instructed about the song, because he was skilful.";
asv[23] = "And Berechiah and Elkanah were doorkeepers for the ark.";
asv[24] = "And Shebaniah, and Joshaphat, and Nethanel, and Amasai, and Zechariah, and Benaiah, and Eliezer, the priests, did blow the trumpets before the ark of God; and Obed-edom and Jehiah were doorkeepers for the ark.";
asv[25] = "So David, and the elders of Israel, and the captains over thousands, went to bring up the ark of the covenant of Jehovah out of the house of Obed-edom with joy.";
asv[26] = "And it came to pass, when God helped the Levites that bare the ark of the covenant of Jehovah, that they sacrificed seven bullocks and seven rams.";
asv[27] = "And David was clothed with a robe of fine linen, and all the Levites that bare the ark, and the singers, and Chenaniah the master of the song [with] the singers: and David had upon him an ephod of linen.";
asv[28] = "Thus all Israel brought up the ark of the covenant of Jehovah with shouting, and with sound of the cornet, and with trumpets, and with cymbals, sounding aloud with psalteries and harps.";
asv[29] = "And it came to pass, as the ark of the covenant of Jehovah came to the city of David, that Michal the daughter of Saul looked out at the window, and saw king David dancing and playing; and she despised him in her heart.";

hnv[1] = "[David] made him houses in the city of David; and he prepared a place for the ark of God, and pitched for it a tent.";
hnv[2] = "Then David said, None ought to carry the ark of God but the Levites: for them has the LORD chosen to carry the ark of God, and to minister to him forever.";
hnv[3] = "David assembled all Yisra\'el at Yerushalayim, to bring up the ark of the LORD to its place, which he had prepared for it.";
hnv[4] = "David gathered together the sons of Aharon, and the Levites:";
hnv[5] = "of the sons of Kehat, Uri\'el the chief, and his brothers one hundred twenty;";
hnv[6] = "of the sons of Merari, `Asayah the chief, and his brothers two hundred twenty;";
hnv[7] = "of the sons of Gershom, Yo\'el the chief, and his brothers one hundred thirty;";
hnv[8] = "of the sons of Elitzafan, Shemayah the chief, and his brothers two hundred;";
hnv[9] = "of the sons of Hevron, Eli\'el the chief, and his brothers eighty;";
hnv[10] = " of the sons of `Uzzi\'el, `Amminadav the chief, and his brothers one hundred twelve.";
hnv[11] = "David called for Tzadok and Avyatar the Kohanim, and for the Levites, for Uri\'el, `Asayah, and Yo\'el, Shemayah, and Eli\'el, and `Amminadav,";
hnv[12] = "and said to them, You are the heads of the fathers\' [houses] of the Levites: sanctify yourselves, both you and your brothers, that you may bring up the ark of the LORD, the God of Yisra\'el, to [the place] that I have prepared for it.";
hnv[13] = "For because you didn\'t carry it at the first, the LORD our God made a breach on us, because we didn\'t seek him according to the ordinance.";
hnv[14] = "So the Kohanim and the Levites sanctified themselves to bring up the ark of the LORD, the God of Yisra\'el.";
hnv[15] = "The children of the Levites bore the ark of God on their shoulders with the poles thereon, as Moshe commanded according to the word of the LORD.";
hnv[16] = " David spoke to the chief of the Levites to appoint their brothers the singers, with instruments of music, psalteries and harps and cymbals, sounding aloud and lifting up the voice with joy.";
hnv[17] = "So the Levites appointed Heman the son of Yo\'el; and of his brothers, Asaf the son of Berekhyah; and of the sons of Merari their brothers, Etan the son of Kushayahu;";
hnv[18] = "and with them their brothers of the second degree, Zekharyah, Ben, and Jaaziel, and Shemiramot, and Yechi\'el, and Unni, Eli\'av, and Benayah, and Ma`aseyah, and Mattityah, and Eliflehu, and Mikneyahu, and Obed-edom, and Ye`i\'el, the doorkeepers.";
hnv[19] = "So the singers, Heman, Asaf, and Etan, [were appointed] with cymbals of brass to sound aloud;";
hnv[20] = "and Zekharyah, and Aziel, and Shemiramot, and Yechi\'el, and Unni, and Eli\'av, and Ma`aseyah, and Benayah, with psalteries set to `Alamot;";
hnv[21] = "and Mattityah, and Eliflehu, and Mikneyahu, and Obed-edom, and Ye`i\'el, and `Azazyahu, with harps tuned to the sheminit, to lead.";
hnv[22] = "Kananyah, chief of the Levites, was over the song: he instructed about the song, because he was skillful.";
hnv[23] = "Berekhyah and Elkana were doorkeepers for the ark.";
hnv[24] = " Shevanyah, and Yoshafat, and Netan\'el, and `Amasai, and Zekharyah, and Benayah, and Eli`ezer, the Kohanim, did blow the trumpets before the ark of God: and Obed-edom and Yechiyah were doorkeepers for the ark.";
hnv[25] = "So David, and the Zakenim of Yisra\'el, and the captains over thousands, went to bring up the ark of the covenant of the LORD out of the house of Obed-edom with joy.";
hnv[26] = "It happened, when God helped the Levites who bore the ark of the covenant of the LORD, that they sacrificed seven bulls and seven rams.";
hnv[27] = "David was clothed with a robe of fine linen, and all the Levites who bore the ark, and the singers, and Kananyah the master of the song [with] the singers: and David had on him an efod of linen.";
hnv[28] = "Thus all Yisra\'el brought up the ark of the covenant of the LORD with shouting, and with sound of the cornet, and with trumpets, and with cymbals, sounding aloud with psalteries and harps.";
hnv[29] = "It happened, as the ark of the covenant of the LORD came to the city of David, that Mikhal the daughter of Sha\'ul looked out at the window, and saw king David dancing and playing; and she despised him in her heart.";

rsv[1] = "David built houses for himself in the city of David; and he prepared a place for the ark of God, and pitched a tent for it.";
rsv[2] = "Then David said, &quot;No one but the Levites may carry the ark of God, for the LORD chose them to carry the ark of the LORD and to minister to him for ever.&quot;";
rsv[3] = "And David assembled all Israel at Jerusalem, to bring up the ark of the LORD to its place, which he had prepared for it.";
rsv[4] = "And David gathered together the sons of Aaron and the Levites:";
rsv[5] = "of the sons of Kohath, Uri\'el the chief, with a hundred and twenty of his brethren;";
rsv[6] = "of the sons of Merar\'i, Asai\'ah the chief, with two hundred and twenty of his brethren;";
rsv[7] = "of the sons of Gershom, Jo\'el the chief, with a hundred and thirty of his brethren;";
rsv[8] = "of the sons of Eli-za\'phan, Shemai\'ah the chief, with two hundred of his brethren;";
rsv[9] = "of the sons of Hebron, Eli\'el the chief, with eighty of his brethren;";
rsv[10] = "of the sons of Uz\'ziel, Ammin\'adab the chief, with a hundred and twelve of his brethren.";
rsv[11] = "Then David summoned the priests Zadok and Abi\'athar, and the Levites Uri\'el, Asai\'ah, Jo\'el, Shemai\'ah, Eli\'el, and Ammin\'adab,";
rsv[12] = "and said to them, &quot;You are the heads of the fathers\' houses of the Levites; sanctify yourselves, you and your brethren, so that you may bring up the ark of the LORD, the God of Israel, to the place that I have prepared for it.";
rsv[13] = "Because you did not carry it the first time, the LORD our God broke forth upon us, because we did not care for it in the way that is ordained.&quot;";
rsv[14] = "So the priests and the Levites sanctified themselves to bring up the ark of the LORD, the God of Israel.";
rsv[15] = "And the Levites carried the ark of God upon their shoulders with the poles, as Moses had commanded according to the word of the LORD.";
rsv[16] = "David also commanded the chiefs of the Levites to appoint their brethren as the singers who should play loudly on musical instruments, on harps and lyres and cymbals, to raise sounds of joy.";
rsv[17] = "So the Levites appointed Heman the son of Jo\'el; and of his brethren Asaph the son of Berechi\'ah; and of the sons of Merar\'i, their brethren, Ethan the son of Kusha\'iah;";
rsv[18] = "and with them their brethren of the second order, Zechari\'ah, Ja-a\'ziel, Shemi\'ramoth, Jehi\'el, Unni, Eli\'ab, Benai\'ah, Ma-asei\'ah, Mattithi\'ah, Eliph\'elehu, and Miknei\'ah, and the gatekeepers O\'bed-e\'dom and Je-i\'el.";
rsv[19] = "The singers, Heman, Asaph, and Ethan, were to sound bronze cymbals;";
rsv[20] = "Zechari\'ah, A\'zi-el, Shemi\'ramoth, Jehi\'el, Unni, Eli\'ab, Ma-asei\'ah, and Benai\'ah were to play harps according to Al\'amoth;";
rsv[21] = "but Mattithi\'ah, Eliph\'elehu, Miknei\'ah, O\'bed-e\'dom, Je-i\'el, and Azazi\'ah were to lead with lyres according to the Shem\'inith.";
rsv[22] = "Chenani\'ah, leader of the Levites in music, should direct the music, for he understood it.";
rsv[23] = "Berechi\'ah and Elka\'nah were to be gatekeepers for the ark.";
rsv[24] = "Shebani\'ah, Josh\'aphat, Nethan\'el, Ama\'sai, Zechari\'ah, Benai\'ah, and Elie\'zer, the priests, should blow the trumpets before the ark of God. O\'bed-e\'dom and Jehi\'ah also were to be gatekeepers for the ark.";
rsv[25] = "So David and the elders of Israel, and the commanders of thousands, went to bring up the ark of the covenant of the LORD from the house of O\'bed-e\'dom with rejoicing.";
rsv[26] = "And because God helped the Levites who were carrying the ark of the covenant of the LORD, they sacrificed seven bulls and seven rams.";
rsv[27] = "David was clothed with a robe of fine linen, as also were all the Levites who were carrying the ark, and the singers, and Chenani\'ah the leader of the music of the singers; and David wore a linen ephod.";
rsv[28] = "So all Israel brought up the ark of the covenant of the LORD with shouting, to the sound of the horn, trumpets, and cymbals, and made loud music on harps and lyres.";
rsv[29] = "And as the ark of the covenant of the LORD came to the city of David, Michal the daughter of Saul looked out of the window, and saw King David dancing and making merry; and she despised him in her heart.";
vul[1] = "fecit quoque sibi domos in civitate David et aedificavit locum arcae Dei tetenditque ei tabernaculum";
vul[2] = "tunc dixit David inlicitum est ut a quocumque portetur arca Dei nisi a Levitis quos elegit Dominus ad portandum eam et ad ministrandum sibi usque in aeternum";
vul[3] = "congregavitque universum Israhel in Hierusalem ut adferretur arca Dei in locum suum quem praeparaverat ei";
vul[4] = "necnon et filios Aaron et Levitas";
vul[5] = "de filiis Caath Urihel princeps fuit et fratres eius centum viginti";
vul[6] = "de filiis Merari Asaia princeps et fratres eius ducenti viginti";
vul[7] = "de filiis Gersom Iohel princeps et fratres eius centum triginta";
vul[8] = "de filiis Elisaphan Semeias princeps et fratres eius ducenti";
vul[9] = "de filiis Hebron Elihel princeps et fratres eius octoginta";
vul[10] = "de filiis Ozihel Aminadab princeps et fratres eius centum duodecim";
vul[11] = "vocavitque David Sadoc et Abiathar sacerdotes et Levitas Urihel Asaiam Iohel Semeiam Elihel et Aminadab";
vul[12] = "et dixit ad eos vos qui estis principes familiarum leviticarum sanctificamini cum fratribus vestris et adferte arcam Domini Dei Israhel ad locum qui ei praeparatus est";
vul[13] = "ne ut a principio quia non eratis praesentes percussit nos Dominus sic et nunc fiat inlicitum quid nobis agentibus";
vul[14] = "sanctificati sunt ergo sacerdotes et Levitae ut portarent arcam Domini Dei Israhel";
vul[15] = "et tulerunt filii Levi arcam Dei sicut praeceperat Moses iuxta verbum Domini umeris suis in vectibus";
vul[16] = "dixit quoque David principibus Levitarum ut constituerent de fratribus suis cantores in organis musicorum nablis videlicet et lyris et cymbalis ut resonaret in excelsum sonitus laetitiae";
vul[17] = "constitueruntque Levitas Heman filium Iohel et de fratribus eius Asaph filium Barachiae de filiis vero Merari fratribus eorum Ethan filium Casaiae";
vul[18] = "et cum eis fratres eorum in secundo ordine Zacchariam et Ben et Iazihel et Semiramoth et Iahihel et Ani Eliab et Banaiam et Maasiam et Matthathiam et Eliphalu et Macheniam et Obededom et Ieihel ianitores";
vul[19] = "porro cantores Heman Asaph et Ethan in cymbalis aeneis concrepantes";
vul[20] = "Zaccharias autem et Ozihel et Semiramoth et Iahihel et Ani et Eliab et Maasias et Banaias in nablis arcana cantabant";
vul[21] = "porro Matthathias et Eliphalu et Machenias et Obededom et Ieihel et Ozaziu in citharis pro octava canebant epinikion";
vul[22] = "Chonenias autem princeps Levitarum prophetiae praeerat ad praecinendam melodiam erat quippe valde sapiens";
vul[23] = "et Barachias et Helcana ianitores arcae";
vul[24] = "porro Sebenias et Iosaphat et Nathanahel et Amasai et Zaccharias et Banaias et Eliezer sacerdotes clangebant tubis coram arca Dei et Obededom et Ahias erant ianitores arcae";
vul[25] = "igitur David et maiores natu Israhel et tribuni ierunt ad deportandam arcam foederis Domini de domo Obededom cum laetitia";
vul[26] = "cumque adiuvisset Deus Levitas qui portabant arcam foederis Domini immolabantur septem tauri et septem arietes";
vul[27] = "porro David erat indutus stola byssina et universi Levitae qui portabant arcam cantoresque et Chonenias princeps prophetiae inter cantores David autem indutus erat etiam ephod lineo";
vul[28] = "universusque Israhel deducebant arcam foederis Domini in iubilo et sonitu bucinae et tubis et cymbalis et nablis et citharis concrepantes";
vul[29] = "cumque pervenisset arca foederis Domini usque ad civitatem David Michol filia Saul prospiciens per fenestram vidit regem David saltantem atque ludentem et despexit eum in corde suo";
web[1] = "And [David] made him houses in the city of David, and prepared a place for the ark of God, and pitched for it a tent.";
web[2] = "Then David said, None ought to carry the ark of God but the Levites: for them hath the LORD chosen to carry the ark of God, and to minister to him for ever.";
web[3] = "And David assembled all Israel to Jerusalem, to bring up the ark of the LORD to its place, which he had prepared for it.";
web[4] = "And David assembled the children of Aaron, and the Levites:";
web[5] = "Of the sons of Kohath; Uriel the chief, and his brethren a hundred and twenty:";
web[6] = "Of the sons of Merari; Asaiah the chief, and his brethren two hundred and twenty:";
web[7] = "Of the sons of Gershom; Joel the chief, and his brethren a hundred and thirty:";
web[8] = "Of the sons of Elizaphan; Shemaiah the chief, and his brethren two hundred:";
web[9] = "Of the sons of Hebron; Eliel the chief, and his brethren eighty:";
web[10] = "Of the sons of Uzziel: Amminadab the chief, and his brethren a hundred and twelve.";
web[11] = "And David called for Zadok and Abiathar the priests, and for the Levites, for Uriel, Asaiah, and Joel, Shemaiah, and Eliel, and Amminadab,";
web[12] = "And said to them, Ye [are] the chief of the fathers of the Levites: sanctify yourselves, [both] ye and your brethren, that ye may bring up the ark of the LORD God of Israel to [the place that] I have prepared for it.";
web[13] = "For because ye [did it] not at the first, the LORD our God made a breach upon us, for that we sought him not after the due order.";
web[14] = "So the priests and the Levites sanctified themselves to bring up the ark of the LORD God of Israel.";
web[15] = "And the children of the Levites bore the ark of God upon their shoulders with the staffs on it, as Moses commanded, according to the word of the LORD.";
web[16] = "And David spoke to the chief of the Levites to appoint their brethren [to be] the singers with instruments of music, psalteries, and harps, and cymbals, sounding, by lifting up the voice with joy.";
web[17] = "So the Levites appointed Heman the son of Joel; and of his brethren, Asaph the son of Berechiah; and of the sons of Merari their brethren, Ethan the son of Kushaiah;";
web[18] = "And with them their brethren of the second [degree], Zechariah, Ben, and Jaaziel, and Shemiramoth, and Jehiel, and Unni, Eliab, and Benaiah, and Maaseiah, and Mattithiah, and Elipheleh, and Mikneiah, and Obed-edom, and Jeiel, the porters.";
web[19] = "So the singers, Heman, Asaph, and Ethan, [were appointed] to sound with cymbals of brass;";
web[20] = "And Zechariah, and Aziel, and Shemiramoth, and Jehiel, and Unni, and Eliab, and Maaseiah, and Benaiah, with psalteries on Alamoth;";
web[21] = "And Mattithiah, and Elipheleh, and Mikneiah, and Obed-edom, and Jeiel, and Azaziah, with harps on the Sheminith to excel.";
web[22] = "And Chenaniah, chief of the Levites, [was] for song: he instructed about the song, because he [was] skillful.";
web[23] = "And Berechiah and Elkanah [were] door-keepers for the ark.";
web[24] = "And Shebaniah, and Jehoshaphat, and Nethaneel, and Amasai, and Zechariah, and Benaiah, and Eliezer the priests, did blow with the trumpets before the ark of God: and Obed-edom and Jehiah [were] door-keepers for the ark.";
web[25] = "So David and the elders of Israel, and the captains over thousands, went to bring up the ark of the covenant of the LORD from the house of Obed-edom with joy.";
web[26] = "And it came to pass, when God helped the Levites that bore the ark of the covenant of the LORD, that they offered seven bullocks and seven rams.";
web[27] = "And David [was] clothed with a robe of fine linen, and all the Levites that bore the ark, and the singers, and Chenaniah the master of the song with the singers: David also [had] upon him an ephod of linen.";
web[28] = "Thus all Israel brought up the ark of the covenant of the LORD with shouting, and with sound of the cornet, and with trumpets, and with cymbals, making a noise with psalteries and harps.";
web[29] = "And it came to pass, [as] the ark of the covenant of the LORD came to the city of David, that Michal the daughter of Saul, looking out at a window, saw king David dancing and playing: and she despised him in her heart.";
yng[1] = "And he maketh for himself houses in the city of David, and prepareth a place for the ark of God, and stretcheth out for it a tent.";
yng[2] = "Then said David, `None [are] to carry the ark of God, except the Levites, for on them hath Jehovah fixed to carry the ark of God, and to serve Him -- unto the age.\'";
yng[3] = "And David assembleth all Israel unto Jerusalem, to bring up the ark of Jehovah unto its place that he had prepared for it.";
yng[4] = "And David gathereth the sons of Aaron, and the Levites.";
yng[5] = "Of sons of Kohath: Uriel the chief, and his brethren, a hundred and twenty.";
yng[6] = "Of sons of Merari: Asaiah the chief, and his brethren, two hundred and twenty.";
yng[7] = "Of sons of Gershom: Joel the chief, and his brethren, a hundred and thirty.";
yng[8] = "Of sons of Elizaphan: Shemaiah the chief, and his brethren, two hundred.";
yng[9] = "Of sons of Hebron: Eliel the chief, and his brethren, eighty.";
yng[10] = "Of sons of Uzziel: Amminadab the chief, and his brethren, a hundred and twelve.";
yng[11] = "And David calleth to Zadok and to Abiathar the priests, and to the Levites, to Uriel, Asaiah, and Joel, Shemaiah, and Eliel, and Amminadab,";
yng[12] = "and saith to them, `Ye [are] heads of the fathers of the Levites; sanctify yourselves, ye and your brethren, and ye have brought up the ark of Jehovah, God of Israel, unto [the place] I have prepared for it;";
yng[13] = "because at the first [it was] not ye, Jehovah our God made a breach upon us, because we sought Him not according to the ordinance.\'";
yng[14] = "And the priests and the Levites sanctify themselves, to bring up the ark of Jehovah, God of Israel;";
yng[15] = "and sons of the Levites bear the ark of God, as Moses commanded, according to the word of Jehovah, on their shoulder, with staves, above them.";
yng[16] = "And David saith to the heads of the Levites to appoint their brethren the singers, with instruments of song, psalteries, and harps, and cymbals, sounding, to lift up with the voice for joy.";
yng[17] = "And the Levites appoint Heman son of Joel, and of his brethren, Asaph son of Berechiah, and of the sons of Merari their brethren, Ethan son of Kushaiah;";
yng[18] = "and with them their brethren, the seconds [in rank], Zechariah, Ben, and Jaaziel, and Shemiramoth, and Jehiel, and Unni, Eliab, and Benaiah, and Maaseiah, and Mattithiah, and Elipheleh, and Mikneiah; and Obed-Edom and Jeiel the gatekeepers;";
yng[19] = "and the singers, Heman, Asaph, and Ethan, with cymbals of brass to sound,";
yng[20] = "and Zechariah, and Aziel, and Shemiramoth, and Jeheil, and Unni, and Eliab, and Maaseiah, and Benaiah, with psalteries besides virgins,";
yng[21] = "and Mattithiah, and Elipheleh, and Mikneiah, and Obed-Edom, and Jeiel, and Azaziah, with harps, on the octave, to oversee.";
yng[22] = "And Chenaniah, head of the Levites, [is] over the burden; he instructeth about the burden, for he [is] intelligent.";
yng[23] = "And Berechiah and Elkanah [are] gatekeepers for the ark.";
yng[24] = "And Shebaniah, and Joshaphat, and Nethaneel, and Amasai, and Zechariah, and Benaiah, and Eliezer the priests, are blowing with trumpets before the ark of God; and Obed-Edom and Jehiah [are] gatekeepers for the ark.";
yng[25] = "And it is David, and the elders of Israel, and the heads of the thousands, who are going to bring up the ark of the covenant of Jehovah from the house of Obed-Edom with joy;";
yng[26] = "and it cometh to pass, in God\'s helping the Levites bearing the ark of the covenant of Jehovah, that they sacrifice seven bullocks and seven rams.";
yng[27] = "And David is wrapped in an upper robe of fine linen, and all the Levites who are bearing the ark, and the singers, and Chenaniah head of the burden of the singers; and on David [is] an Ephod of linen.";
yng[28] = "And all Israel are bringing up the ark of the covenant of Jehovah with shouting, and with the sound of a cornet, and with trumpets, and with cymbals, sounding with psalteries and harps,";
yng[29] = "and it cometh to pass, the ark of the covenant of Jehovah is entering in unto the city of David, and Michal daughter of Saul is looking through the window, and seeth king David dancing and playing, and despiseth him in her heart.";
csb[1] = "David built houses for himself in the city of David, and he prepared a place for the ark of God and pitched a tent for it.";
csb[1] = "David built houses for himself in the city of David, and he prepared a place for the ark of God and pitched a tent for it.";
csb[2] = "Then David said, &quot;No one but the Levites may carry the ark of God, because the LORD has chosen them to carry the ark of the LORD and to minister before him forever.&quot;";
csb[3] = "David assembled all Israel at Jerusalem to bring the ark of the LORD to the place he had prepared for it.";
csb[4] = "Then he gathered together the descendants of Aaron and the Levites:";
csb[5] = "From the Kohathites, Uriel the leader and 120 of his relatives;";
csb[6] = "from the Merarites, Asaiah the leader and 220 of his relatives;";
csb[7] = "from the Gershomites, Joel the leader and 130 of his relatives;";
csb[8] = "from the Elizaphanites, Shemaiah the leader and 200 of his relatives;";
csb[9] = "from the Hebronites, Eliel the leader and 80 of his relatives;";
csb[10] = "from the Uzzielites, Amminadab the leader and 112 of his relatives.";
csb[11] = "David summoned the priests Zadok and Abiathar and the Levites Uriel, Asaiah, Joel, Shemaiah, Eliel, and Amminadab.";
csb[12] = "He said to them, &quot;You are the heads of the Levite families. You and your relatives must consecrate yourselves so that you may bring the ark of the LORD God of Israel to the place I have prepared for it.";
csb[13] = "&quot;For the LORD our God burst out in anger against us because you Levites were not with us the first time, for we didn\'t inquire of him about the proper procedures.&quot;";
csb[14] = "So the priests and the Levites consecrated themselves to bring up the ark of the LORD God of Israel.";
csb[15] = "Then the Levites carried the ark of God the way Moses had commanded according to the word of the LORD: on their shoulders with the poles.";
csb[16] = "Then David told the leaders of the Levites to appoint their relatives as singers and to have them raise their voices with joy accompanied by musical instruments -- harps, lyres, and cymbals.";
csb[17] = "So the Levites appointed Heman son of Joel; from his relatives, Asaph son of Berechiah; and from their relatives the Merarites, Ethan son of Kushaiah.";
csb[18] = "With them were their relatives second in rank: Zechariah, Jaaziel, Shemiramoth, Jehiel, Unni, Eliab, Benaiah, Maaseiah, Mattithiah, Eliphelehu, Mikneiah, and the gatekeepers Obed-edom and Jeiel.";
csb[19] = "The singers Heman, Asaph, and Ethan were to sound the bronze cymbals;";
csb[20] = "Zechariah, Aziel, Shemiramoth, Jehiel, Unni, Eliab, Maaseiah, and Benaiah were to play harps according to Alamoth";
csb[21] = "and Mattithiah, Eliphelehu, Mikneiah, Obed-edom, Jeiel, and Azaziah were to lead the music with lyres according to the Sheminith.";
csb[22] = "Chenaniah, the leader of the Levites in music, was to direct the music because he was skillful.";
csb[23] = "Berechiah and Elkanah were to be gatekeepers for the ark.";
csb[24] = "The priests, Shebaniah, Joshaphat, Nethanel, Amasai, Zechariah, Benaiah, and Eliezer, were to blow trumpets before the ark of God. Obed-edom and Jehiah were also to be gatekeepers for the ark.";
csb[25] = "David, the elders of Israel, and the commanders of thousands went with rejoicing to bring the ark of the covenant of the LORD from the house of Obed-edom.";
csb[26] = "Because God helped the Levites who were carrying the ark of the covenant of the LORD, with God\'s help, they sacrificed seven bulls and seven rams.";
csb[27] = "Now David was dressed in a robe of fine linen, as were all the Levites who were carrying the ark, as well as the singers and Chenaniah, the music leader of the singers. David also wore a linen ephod.";
csb[28] = "So all Israel brought up the ark of the covenant of the LORD with shouts, the sound of the ram\'s horn, trumpets, and cymbals, and the playing of harps and lyres.";
csb[29] = "As the ark of the covenant of the LORD was entering the city of David, Saul\'s daughter Michal looked down from the window and saw King David leaping and dancing, and she despised him in her heart.";
