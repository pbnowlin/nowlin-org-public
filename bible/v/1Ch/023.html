asv[1] = "Now David was old and full of days; and he made Solomon his son king over Israel.";
asv[2] = "And he gathered together all the princes of Israel, with the priests and the Levites.";
asv[3] = "And the Levites were numbered from thirty years old and upward: and their number by their polls, man by man, was thirty and eight thousand.";
asv[4] = "Of these, twenty and four thousand were to oversee the work of the house of Jehovah; and six thousand were officers and judges;";
asv[5] = "and four thousand were doorkeepers; and four thousand praised Jehovah with the instruments which I made, [said David], to praise therewith.";
asv[6] = "And David divided them into courses according to the sons of Levi: Gershon, Kohath, and Merari.";
asv[7] = "Of the Gershonites: Ladan and Shimei.";
asv[8] = "The sons of Ladan: Jehiel the chief, and Zetham, and Joel, three.";
asv[9] = "The sons of Shimei: Shelomoth, and Haziel, and Haran, three. These were the heads of the fathers\' [houses] of Ladan.";
asv[10] = "And the sons of Shimei: Jahath, Zina, and Jeush, and Beriah. These four were the sons of Shimei.";
asv[11] = "And Jahath was the chief, and Zizah the second: but Jeush and Beriah had not many sons; therefore they became a fathers\' house in one reckoning.";
asv[12] = "The sons of Kohath: Amram, Izhar, Hebron, and Uzziel, four.";
asv[13] = "The sons of Amram: Aaron and Moses; and Aaron was separated, that he should sanctify the most holy things, he and his sons, for ever, to burn incense before Jehovah, to minister unto him, and to bless in his name, for ever.";
asv[14] = "But as for Moses the man of God, his sons were named among the tribe of Levi.";
asv[15] = "The sons of Moses: Gershom and Eliezer.";
asv[16] = "The sons of Gershom: Shebuel the chief.";
asv[17] = "And the sons of Eliezer were: Rehabiah the chief; and Eliezer had no other sons; but the sons of Rehabiah were very many.";
asv[18] = "The sons of Izhar: Shelomith the chief.";
asv[19] = "The sons of Hebron: Jeriah the chief, Amariah the second, Jahaziel the third, and Jekameam the fourth.";
asv[20] = "The sons of Uzziel: Micah the chief, and Isshiah the second.";
asv[21] = "The sons of Merari: Mahli and Mushi. The sons of Mahli: Eleazar and Kish.";
asv[22] = "And Eleazar died, and had no sons, but daughters only: and their brethren the sons of Kish took them [to wife].";
asv[23] = "The sons of Mushi: Mahli, and Eder, and Jeremoth, three.";
asv[24] = "These were the sons of Levi after their fathers\' houses, even the heads of the fathers\' [houses] of those of them that were counted, in the number of names by their polls, who did the work for the service of the house of Jehovah, from twenty years old and upward.";
asv[25] = "For David said, Jehovah, the God of Israel, hath given rest unto his people; and he dwelleth in Jerusalem for ever:";
asv[26] = "and also the Levites shall no more have need to carry the tabernacle and all the vessels of it for the service thereof.";
asv[27] = "For by the last words of David the sons of Levi were numbered, from twenty years old and upward.";
asv[28] = "For their office was to wait on the sons of Aaron for the service of the house of Jehovah, in the courts, and in the chambers, and in the purifying of all holy things, even the work of the service of the house of God;";
asv[29] = "for the showbread also, and for the fine flour for a meal-offering, whether of unleavened wafers, or of that which is baked in the pan, or of that which is soaked, and for all manner of measure and size;";
asv[30] = "and to stand every morning to thank and praise Jehovah, and likewise at even;";
asv[31] = "and to offer all burnt-offerings unto Jehovah, on the sabbaths, on the new moons, and on the set feasts, in number according to the ordinance concerning them, continually before Jehovah;";
asv[32] = "and that they should keep the charge of the tent of meeting, and the charge of the holy place, and the charge of the sons of Aaron their brethren, for the service of the house of Jehovah.";
dby[1] = "And David was old and full of days; and he made Solomon his son king over Israel.";

dby[5] = "and four thousand were doorkeepers; and four thousand praised Jehovah with the instruments which I made, [said David,] to praise [therewith].";
dby[6] = "And David divided them into courses according to the sons of Levi: Gershon, Kohath, and Merari.";
dby[7] = "Of the Gershonites: Laadan and Shimei.";
dby[8] = "The sons of Laadan: the head was Jehiel, and Zetham, and Joel, three.";
dby[9] = "The sons of Shimei: Shelomith, and Haziel, and Haran, three. These were the chief fathers of Laadan.";
dby[10] = "And the sons of Shimei: Jahath, Ziza, and Jeush, and Beriah. These were the four sons of Shimei.";
dby[11] = "And Jahath was the head, and Ziza the second; and Jeush and Beriah had not many sons: as father\'s house, therefore, they were reckoned as one.";
dby[12] = "The sons of Kohath: Amram, Jizhar, Hebron, and Uzziel, four.";
dby[13] = "The sons of Amram: Aaron and Moses. And Aaron was separated, that he should be hallowed as most holy, he and his sons for ever, to offer before Jehovah, to do service to him, and to bless in his name for ever.";
dby[14] = "-- And as to Moses the man of God, his sons were named of the tribe of Levi.";
dby[15] = "The sons of Moses: Gershom and Eliezer.";
dby[16] = "The sons of Gershom: Shebuel the head.";
dby[17] = "And the sons of Eliezer: Rehabiah the head; and Eliezer had no other sons, but the sons of Rehabiah were very many.";
dby[18] = "-- The sons of Jizhar: Shelomith the head.";
dby[19] = "The sons of Hebron: Jeriah the head, Amariah the second, Jahaziel the third, and Jekameam the fourth.";
dby[20] = "The sons of Uzziel: Micah the head, and Jishijah the second.";
dby[21] = "The sons of Merari: Mahli and Mushi. The sons of Mahli: Eleazar and Kish.";
dby[22] = "And Eleazar died, and had no sons, but daughters; and their brethren the sons of Kish took them.";
dby[23] = "The sons of Mushi: Mahli, and Eder, and Jeremoth, three.";
dby[24] = "These were the sons of Levi according to their fathers\' houses, the chief fathers, as they were reckoned, by number of names by their polls, who did the work of the service of the house of Jehovah, from twenty years old and upward.";
dby[25] = "For David said, Jehovah the God of Israel has given rest to his people, and he will dwell in Jerusalem for ever;";
dby[26] = "and the Levites also have no more to carry the tabernacle, nor any of its vessels for its service.";
dby[27] = "For by the last words of David was this [done], -- the numbering of the sons of Levi from twenty years old and upward.";
dby[28] = "For their place was by the side of the sons of Aaron for the service of the house of Jehovah, over the courts, and over the chambers, and over the purifying of all holy things, and [for] the work of the service of the house of God;";
dby[29] = "and for the loaves to be set in rows, and for the fine flour for the oblation, and for the unleavened cakes, and for [what is baked in] the pan, and for that which is saturated [with oil], and for all measure of capacity and size;";
dby[30] = "and to stand every morning to thank and praise Jehovah, and likewise at even;";
dby[31] = "and for all burnt-offerings offered up to Jehovah on the sabbaths, on the new moons, and on the set feasts, by number, according to the ordinance concerning them, continually, before Jehovah;";
dby[32] = "and they kept the charge of the tent of meeting, and the charge of the sanctuary, and the charge of the sons of Aaron their brethren, in the service of the house of Jehovah.";
hnv[1] = "Now David was old and full of days; and he made Shlomo his son king over Yisra\'el.";
hnv[2] = "He gathered together all the princes of Yisra\'el, with the Kohanim and the Levites.";
hnv[3] = "The Levites were numbered from thirty years old and upward: and their number by their polls, man by man, was thirty-eight thousand.";
hnv[4] = "Of these, twenty-four thousand were to oversee the work of the house of the LORD; and six thousand were officers and judges;";
hnv[5] = "and four thousand were doorkeepers; and four thousand praised the LORD with the instruments which I made, [said David], to praise therewith.";
hnv[6] = " David divided them into courses according to the sons of Levi: Gershon, Kehat, and Merari.";
hnv[7] = "Of the Gershoni: La`dan and Shim`i.";
hnv[8] = " The sons of La`dan: Yechi\'el the chief, and Zetham, and Yo\'el, three.";
hnv[9] = "The sons of Shim`i: Shelomit, and Hazi\'el, and Haran, three. These were the heads of the fathers\' [houses] of La`dan.";
hnv[10] = "The sons of Shim`i: Yachat, Zina, and Ye`ush, and Beri`ah. These four were the sons of Shim`i.";
hnv[11] = "Yachat was the chief, and Zizah the second: but Ye`ush and Beri`ah didn\'t have many sons; therefore they became a fathers\' house in one reckoning.";
hnv[12] = "The sons of Kehat: `Amram, Yitzhar, Hevron, and `Uzzi\'el, four.";
hnv[13] = "The sons of `Amram: Aharon and Moshe; and Aharon was separated, that he should sanctify the most holy things, he and his sons, forever, to burn incense before the LORD, to minister to him, and to bless in his name, forever.";
hnv[14] = "But as for Moshe the man of God, his sons were named among the tribe of Levi.";
hnv[15] = "The sons of Moshe: Gershom and Eli`ezer.";
hnv[16] = "The sons of Gershom: Shevu\'el the chief.";
hnv[17] = "The sons of Eli`ezer were: Rechavyah the chief; and Eli`ezer had no other sons; but the sons of Rechavyah were very many.";
hnv[18] = "The sons of Yitzhar: Shelomit the chief.";
hnv[19] = "The sons of Hevron: Yeriyahu the chief, Amaryah the second, Yachazi\'el the third, and Yekam`am the fourth.";
hnv[20] = "The sons of `Uzzi\'el: Mikhah the chief, and Yishshiyah the second.";
hnv[21] = "The sons of Merari: Machli and Mushi. The sons of Machli: El`azar and Kish.";
hnv[22] = "El`azar died, and had no sons, but daughters only: and their brothers the sons of Kish took them [to wife].";
hnv[23] = "The sons of Mushi: Machli, and `Eder, and Yeremot, three.";
hnv[24] = "These were the sons of Levi after their fathers\' houses, even the heads of the fathers\' [houses] of those of those who were counted, in the number of names by their polls, who did the work for the service of the house of the LORD, from twenty years old and upward.";
hnv[25] = "For David said, the LORD, the God of Yisra\'el, has given rest to his people; and he dwells in Yerushalayim forever:";
hnv[26] = "and also the Levites shall no more have need to carry the tent and all the vessels of it for the service of it.";
hnv[27] = "For by the last words of David the sons of Levi were numbered, from twenty years old and upward.";
hnv[28] = "For their office was to wait on the sons of Aharon for the service of the house of the LORD, in the courts, and in the chambers, and in the purifying of all holy things, even the work of the service of the house of God;";
hnv[29] = " for the show bread also, and for the fine flour for a meal-offering, whether of unleavened wafers, or of that which is baked in the pan, or of that which is soaked, and for all manner of measure and size;";
hnv[30] = "and to stand every morning to thank and praise the LORD, and likewise at even;";
hnv[31] = "and to offer all burnt offerings to the LORD, on the Shabbatot, on the new moons, and on the set feasts, in number according to the ordinance concerning them, continually before the LORD;";
hnv[32] = "and that they should keep the charge of the tent of meeting, and the charge of the holy place, and the charge of the sons of Aharon their brothers, for the service of the house of the LORD.";
kjv[1] = "So when David was old and full of days, he made Solomon his son king over Israel.";
kjv[2] = "And he gathered together all the princes of Israel, with the priests and the Levites.";
kjv[3] = "Now the Levites were numbered from the age of thirty years and upward: and their number by their polls, man by man, was thirty and eight thousand.";
kjv[4] = "Of which, twenty and four thousand [were] to set forward the work of the house of the LORD; and six thousand [were] officers and judges:";
kjv[5] = "Moreover four thousand [were] porters; and four thousand praised the LORD with the instruments which I made, [said David], to praise [therewith].";
kjv[6] = "And David divided them into courses among the sons of Levi, [namely], Gershon, Kohath, and Merari.";
kjv[7] = "Of the Gershonites [were], Laadan, and Shimei.";
kjv[8] = "The sons of Laadan; the chief [was] Jehiel, and Zetham, and Joel, three.";
kjv[9] = "The sons of Shimei; Shelomith, and Haziel, and Haran, three. These [were] the chief of the fathers of Laadan.";
kjv[10] = "And the sons of Shimei [were], Jahath, Zina, and Jeush, and Beriah. These four [were] the sons of Shimei.";
kjv[11] = "And Jahath was the chief, and Zizah the second: but Jeush and Beriah had not many sons; therefore they were in one reckoning, according to [their] father\'s house.";
kjv[12] = "The sons of Kohath; Amram, Izhar, Hebron, and Uzziel, four.";
kjv[13] = "The sons of Amram; Aaron and Moses: and Aaron was separated, that he should sanctify the most holy things, he and his sons for ever, to burn incense before the LORD, to minister unto him, and to bless in his name for ever.";
kjv[14] = "Now [concerning] Moses the man of God, his sons were named of the tribe of Levi.";
kjv[15] = "The sons of Moses [were], Gershom, and Eliezer.";
kjv[16] = "Of the sons of Gershom, Shebuel [was] the chief.";
kjv[17] = "And the sons of Eliezer [were], Rehabiah the chief. And Eliezer had none other sons; but the sons of Rehabiah were very many.";
kjv[18] = "Of the sons of Izhar; Shelomith the chief.";
kjv[19] = "Of the sons of Hebron; Jeriah the first, Amariah the second, Jahaziel the third, and Jekameam the fourth.";
kjv[20] = "Of the sons of Uzziel; Michah the first, and Jesiah the second.";
kjv[21] = "The sons of Merari; Mahli, and Mushi. The sons of Mahli; Eleazar, and Kish.";
kjv[22] = "And Eleazar died, and had no sons, but daughters: and their brethren the sons of Kish took them.";
kjv[23] = "The sons of Mushi; Mahli, and Eder, and Jeremoth, three.";
kjv[24] = "These [were] the sons of Levi after the house of their fathers; [even] the chief of the fathers, as they were counted by number of names by their polls, that did the work for the service of the house of the LORD, from the age of twenty years and upward.";
kjv[25] = "For David said, The LORD God of Israel hath given rest unto his people, that they may dwell in Jerusalem for ever:";
kjv[26] = "And also unto the Levites; they shall no [more] carry the tabernacle, nor any vessels of it for the service thereof.";
kjv[27] = "For by the last words of David the Levites [were] numbered from twenty years old and above:";
kjv[28] = "Because their office [was] to wait on the sons of Aaron for the service of the house of the LORD, in the courts, and in the chambers, and in the purifying of all holy things, and the work of the service of the house of God;";
kjv[29] = "Both for the shewbread, and for the fine flour for meat offering, and for the unleavened cakes, and for [that which is baked in] the pan, and for that which is fried, and for all manner of measure and size;";
kjv[30] = "And to stand every morning to thank and praise the LORD, and likewise at even;";
kjv[31] = "And to offer all burnt sacrifices unto the LORD in the sabbaths, in the new moons, and on the set feasts, by number, according to the order commanded unto them, continually before the LORD:";
kjv[32] = "And that they should keep the charge of the tabernacle of the congregation, and the charge of the holy [place], and the charge of the sons of Aaron their brethren, in the service of the house of the LORD.";
rsv[1] = "When David was old and full of days, he made Solomon his son king over Israel.";
rsv[2] = "David assembled all the leaders of Israel and the priests and the Levites.";
rsv[3] = "The Levites, thirty years old and upward, were numbered, and the total was thirty-eight thousand men.";
rsv[4] = "&quot;Twenty-four thousand of these,&quot; David said, &quot;shall have charge of the work in the house of the LORD, six thousand shall be officers and judges,";
rsv[5] = "four thousand gatekeepers, and four thousand shall offer praises to the LORD with the instruments which I have made for praise.&quot;";
rsv[6] = "And David organized them in divisions corresponding to the sons of Levi: Gershom, Kohath, and Merar\'i.";
rsv[7] = "The sons of Gersham were Ladan and Shim\'e-i.";
rsv[8] = "The sons of Ladan: Jehi\'el the chief, and Zetham, and Jo\'el, three.";
rsv[9] = "The sons of Shim\'e-i: Shelo\'moth, Ha\'zi-el, and Haran, three. These were the heads of the fathers\' houses of Ladan.";
rsv[10] = "And the sons of Shim\'e-i: Jahath, Zina, and Je\'ush, and Beri\'ah. These four were the sons of Shim\'e-i.";
rsv[11] = "Jahath was the chief, and Zizah the second; but Je\'ush and Beri\'ah had not many sons, therefore they became a father\'s house in one reckoning.";
rsv[12] = "The sons of Kohath: Amram, Izhar, Hebron, and Uz\'ziel, four.";
rsv[13] = "The sons of Amram: Aaron and Moses. Aaron was set apart to consecrate the most holy things, that he and his sons for ever should burn incense before the LORD, and minister to him and pronounce blessings in his name for ever.";
rsv[14] = "But the sons of Moses the man of God were named among the tribe of Levi.";
rsv[15] = "The sons of Moses: Gershom and Elie\'zer.";
rsv[16] = "The sons of Gershom: Sheb\'uel the chief.";
rsv[17] = "The sons of Elie\'zer: Rehabi\'ah the chief; Elie\'zer had no other sons, but the sons of Rehabi\'ah were very many.";
rsv[18] = "The sons of Izhar: Shelo\'mith the chief.";
rsv[19] = "The sons of Hebron: Jeri\'ah the chief, Amari\'ah the second, Jaha\'ziel the third, and Jekame\'am the fourth.";
rsv[20] = "The sons of Uz\'ziel: Micah the chief and Isshi\'ah the second.";
rsv[21] = "The sons of Merar\'i: Mahli and Mushi. The sons of Mahli: Elea\'zar and Kish.";
rsv[22] = "Elea\'zar died having no sons, but only daughters; their kinsmen, the sons of Kish, married them.";
rsv[23] = "The sons of Mushi: Mahli, Eder, and Jer\'emoth, three.";
rsv[24] = "These were the sons of Levi by their fathers\' houses, the heads of fathers\' houses as they were registered according to the number of the names of the individuals from twenty years old and upward who were to do the work for the service of the house of the LORD.";
rsv[25] = "For David said, &quot;The LORD, the God of Israel, has given peace to his people; and he dwells in Jerusalem for ever.";
rsv[26] = "And so the Levites no longer need to carry the tabernacle or any of the things for its service&quot;--";
rsv[27] = "for by the last words of David these were the number of the Levites from twenty years old and upward--";
rsv[28] = "&quot;but their duty shall be to assist the sons of Aaron for the service of the house of the LORD, having the care of the courts and the chambers, the cleansing of all that is holy, and any work for the service of the house of God;";
rsv[29] = "to assist also with the showbread, the flour for the cereal offering, the wafers of unleavened bread, the baked offering, the offering mixed with oil, and all measures of quantity or size.";
rsv[30] = "And they shall stand every morning, thanking and praising the LORD, and likewise at evening,";
rsv[31] = "and whenever burnt offerings are offered to the LORD on sabbaths, new moons, and feast days, according to the number required of them, continually before the LORD.";
rsv[32] = "Thus they shall keep charge of the tent of meeting and the sanctuary, and shall attend the sons of Aaron, their brethren, for the service of the house of the LORD.&quot;";
vul[1] = "igitur David senex et plenus dierum regem constituit Salomonem filium suum super Israhel";
vul[2] = "et congregavit omnes principes Israhel et sacerdotes atque Levitas";
vul[3] = "numeratique sunt Levitae a triginta annis et supra et inventa sunt triginta octo milia virorum";
vul[4] = "ex his electi sunt et distributi in ministerium domus Domini viginti quattuor milia praepositorum autem et iudicum sex milia";
vul[5] = "porro quattuor milia ianitores et totidem psaltae canentes Domino in organis quae fecerat ad canendum";
vul[6] = "et distribuit eos David per vices filiorum Levi Gersom videlicet et Caath et Merari";
vul[7] = "Gersom Leedan et Semei";
vul[8] = "filii Leedan princeps Ieihel et Zetham et Iohel tres";
vul[9] = "filii Semei Salomith et Ozihel et Aran tres isti principes familiarum Leedan";
vul[10] = "porro filii Semei Ieeth et Ziza et Iaus et Baria isti filii Semei quattuor";
vul[11] = "erat autem Ieeth prior Ziza secundus porro Iaus et Baria non habuerunt plurimos filios et idcirco in una familia unaque domo conputati sunt";
vul[12] = "filii Caath Amram et Isaar Hebron et Ozihel quattuor";
vul[13] = "filii Amram Aaron et Moses separatusque est Aaron ut ministraret in sancto sanctorum ipse et filii eius in sempiternum et adoleret incensum Domino secundum ritum suum ac benediceret nomini eius in perpetuum";
vul[14] = "Mosi quoque hominis Dei filii adnumerati sunt in tribu Levi";
vul[15] = "filii Mosi Gersom et Eliezer";
vul[16] = "filii Gersom Subuhel primus";
vul[17] = "fuerunt autem filii Eliezer Roobia primus et non erant Eliezer filii alii porro filii Roobia multiplicati sunt nimis";
vul[18] = "filii Isaar Salumith primus";
vul[19] = "filii Hebron Ieriau primus Amarias secundus Iazihel tertius Iecmaam quartus";
vul[20] = "filii Ozihel Micha primus Iesia secundus";
vul[21] = "filii Merari Mooli et Musi filii Mooli Eleazar et Cis";
vul[22] = "mortuus est autem Eleazar et non habuit filios sed filias acceperuntque eas filii Cis fratres earum";
vul[23] = "filii Musi Mooli et Eder et Ierimuth tres";
vul[24] = "hii filii Levi in cognationibus et familiis suis principes per vices et numerum capitum singulorum qui faciebant opera ministerii domus Domini a viginti annis et supra";
vul[25] = "dixit enim David requiem dedit Dominus Deus Israhel populo suo et habitationem Hierusalem usque in aeternum";
vul[26] = "nec erit officii Levitarum ut ultra portent tabernaculum et omnia vasa eius ad ministrandum";
vul[27] = "iuxta praecepta quoque David novissima supputabitur numerus filiorum Levi a viginti annis et supra";
vul[28] = "et erunt sub manu filiorum Aaron in cultum domus Domini in vestibulis et in exedris et in loco purificationis et in sanctuario et in universis operibus ministerii templi Domini";
vul[29] = "sacerdotes autem super panes propositionis et ad similae sacrificium et ad lagana et azyma et sartaginem et ad ferventem similam et super omne pondus atque mensuram";
vul[30] = "Levitae vero ut stent mane ad confitendum et canendum Domino similiterque ad vesperam";
vul[31] = "tam in oblatione holocaustorum Domini quam in sabbatis et kalendis et sollemnitatibus reliquis iuxta numerum et caerimonias uniuscuiusque rei iugiter coram Domino";
vul[32] = "et custodiant observationes tabernaculi foederis et ritum sanctuarii et observationem filiorum Aaron fratrum suorum ut ministrent in domo Domini";

web[12] = "The sons of Kohath; Amram, Izhar, Hebron, and Uzziel, four.";
web[13] = "The sons of Amram; Aaron and Moses: and Aaron was separated, that he should sanctify the most holy things, he and his sons for ever, to burn incense before the LORD, to minister to him, and to bless in his name for ever.";
web[14] = "Now [concerning] Moses the man of God, his sons were named of the tribe of Levi.";
web[15] = "The sons of Moses [were], Gershom, and Eliezer.";
web[16] = "Of the sons of Gershom; Shebuel [was] the chief.";
web[17] = "And the sons of Eliezer [were], Rehabiah the chief. And Eliezer had no other sons; but the sons of Rehabiah were very many.";
web[18] = "Of the sons of Izhar; Shelomith the chief.";
web[19] = "Of the sons of Hebron; Jeriah the first, Amariah the second, Jehaziel the third, and Jekameam the fourth.";
web[20] = "Of the sons of Uzziel; Micah the first, and Jesiah the second.";
web[21] = "The sons of Merari; Mahli, and Mushi. The sons of Mahli; Eleazar, and Kish.";
web[22] = "And Eleazar died, and had no sons, but daughters: and their brethren the sons of Kish took them.";
web[23] = "The sons of Mushi; Mahli, and Eder, and Jeremoth, three.";
web[24] = "These [were] the sons of Levi after the house of their fathers; [even] the chief of the fathers, as they were counted by number of names by their polls, that did the work for the service of the house of the LORD, from the age of twenty years and upward.";
web[25] = "For David said, The LORD God of Israel hath given rest to his people, that they may dwell in Jerusalem for ever;";
web[26] = "And also to the Levites: they shall no [more] carry the tabernacle, nor any vessels of it for its service.";
web[27] = "For by the last words of David the Levites [were] numbered from twenty years old and above:";
web[28] = "Because their office [was] to wait on the sons of Aaron for the service of the house of the LORD, in the courts, and in the chambers, and in the purifying of all holy things, and the work of the service of the house of God;";
web[29] = "Both for the show-bread, and for the fine flour for meat-offering, and for the unleavened cakes, and for [that which is baked in] the pan, and for that which is fried, and for all manner of measure and size;";
web[30] = "And to stand every morning to thank and praise the LORD, and likewise at evening;";
web[31] = "And to offer all burnt-sacrifices to the LORD on the sabbaths, in the new moons, and on the set feasts, by number, according to the order commanded to them, continually before the LORD:";
web[32] = "And that they should keep the charge of the tabernacle of the congregation, and the charge of the holy [place], and the charge of the sons of Aaron their brethren, in the service of the house of the LORD.";
yng[1] = "And David is old, and satisfied with days, and causeth his son Solomon to reign over Israel,";
yng[2] = "and gathereth all the heads of Israel, and the priests, and the Levites;";
yng[3] = "and the Levites are numbered from a son of thirty years and upward, and their number, by their polls, is of mighty men thirty and eight thousand.";
yng[4] = "Of these to preside over the work of the house of Jehovah [are] twenty and four thousand, and officers and judges six thousand,";
yng[5] = "and four thousand gatekeepers, and four thousand giving praise to Jehovah, `with instruments that I made for praising,\' [saith David.]";
yng[6] = "And David distributeth them into courses: Of the sons of Levi: of Gershon, Kohath, and Merari.";
yng[7] = "Of the Gershonite: Laadan and Shimei.";
yng[8] = "Sons of Laadan: the head [is] Jehiel, and Zetham, and Joel, three.";
yng[9] = "Sons of Shimei [are] Shelomith, and Haziel, and Haran, three; these [are] heads of the fathers of Laadan.";
yng[10] = "And sons of Shimei [are] Jahath, Zina, and Jeush, and Beriah; these [are] sons of Shimei, four.";
yng[11] = "And Jahath is the head, and Zizah the second, and Jeush and Beriah have not multiplied sons, and they become the house of a father by one numbering.";
yng[12] = "Sons of Kohath [are] Amram, Izhar, Hebron, and Uzziel, four.";
yng[13] = "Sons of Amram: Aaron and Moses; and Aaron is separated for his sanctifying the holy of holies, he and his sons -- unto the age, to make perfume before Jehovah, to serve Him, and to bless in His name -- unto the age.";
yng[14] = "As to Moses, the man of God, his sons are called after the tribe of Levi.";
yng[15] = "Sons of Moses: Gershom and Eliezer.";
yng[16] = "Sons of Gershom: Shebuel the head.";
yng[17] = "And sons of Eliezer are Rehabiah the head, and Eliezer had no other sons, and the sons of Rehabiah have multiplied exceedingly.";
yng[18] = "Sons of Izhar: Shelomith the head.";
yng[19] = "Sons of Hebron: Jeriah the head, Amariah the second, Jahaziel the third, and Jekameam the fourth.";
yng[20] = "Sons of Uzziel: Micah the head, and Ishshiah, the second.";
yng[21] = "Sons of Merari: Mahli and Mushi; sons of Mahli: Eleazar and Kish.";
yng[22] = "And Eleazar dieth, and he had no sons, but daughters, and sons of Kish their brethren take them.";
yng[23] = "Sons of Mushi: Mahli, and Eder, and Jerimoth, three.";
yng[24] = "These [are] sons of Levi, by the house of their fathers, heads of the fathers, by their appointments, in the number of names, by their polls, doing the work for the service of the house of Jehovah, from a son of twenty years and upward,";
yng[25] = "for David said, `Jehovah, God of Israel, hath given rest to His people, and He doth tabernacle in Jerusalem unto the age;\'";
yng[26] = "and also of the Levites, `None [are] to bear the tabernacle and all its vessels for its service;\'";
yng[27] = "for by the last words of David they [took] the number of the sons of Levi from a son of twenty years and upward,";
yng[28] = "for their station [is] at the side of the sons of Aaron, for the service of the house of Jehovah, over the courts, and over the chambers, and over the cleansing of every holy thing, and the work of the service of the house of God,";
yng[29] = "and for the bread of the arrangement, and for fine flour for present, and for the thin unleavened cakes, and for [the work of] the pan, and for that which is fried, and for all [liquid] measure and [solid] measure;";
yng[30] = "and to stand, morning by morning, to give thanks, and to give praise to Jehovah, and so at evening;";
yng[31] = "and for all the burnt-offerings -- burnt-offerings to Jehovah for sabbaths, for new moons, and for appointed seasons, by number, according to the ordinance upon them continually, before Jehovah.";
yng[32] = "And they have kept the charge of the tent of meeting, and the charge of the sanctuary, and the charge of the sons of Aaron, their brethren, for the service of the house of Jehovah.";
csb[1] = "When David was old and full of days, he installed his son Solomon as king over Israel.";
csb[2] = "Then he gathered all the leaders of Israel, the priests, and the Levites.";
csb[3] = "The Levites thirty years old or more were counted; the total number of men was thirty-eight thousand by headcount.";
csb[4] = "&quot;Of these,&quot; David said, &quot;twenty-four thousand are to be in charge of the work on the LORD\'s temple, six thousand are to be officers and judges,";
csb[5] = "&quot;four thousand are to be gatekeepers, and four thousand are to praise the LORD with the instruments that I have made for worship.&quot;";
csb[6] = "Then David divided them into divisions according to Levi\'s sons: Gershom, Kohath, and Merari.";
csb[7] = "The Gershonites: Ladan and Shimei.";
csb[8] = "Ladan\'s sons: Jehiel was the first, then Zetham, and Joel -- three.";
csb[9] = "Shimei\'s sons: Shelomoth, Haziel, and Haran -- three. Those were the heads of the families of Ladan.";
csb[10] = "Shimei\'s sons: Jahath, Zizah, Jeush, and Beriah. Those were Shimei\'s sons -- four.";
csb[11] = "Jahath was the first and Zizah was the second; however, Jeush and Beriah did not have many sons, so they became one family and received a single assignment.";
csb[12] = "Kohath\'s sons: Amram, Izhar, Hebron, and Uzziel -- four.";
csb[13] = "Amram\'s sons: Aaron and Moses. Aaron, along with his descendants, was set apart forever to consecrate the most holy things, to burn incense in the presence of the LORD, to minister to him, and to pronounce blessings in his name forever.";
csb[14] = "As for Moses the man of God, his sons were named among the tribe of Levi.";
csb[15] = "Moses\'s sons: Gershom and Eliezer.";
csb[16] = "Gershom\'s sons: Shebuel was first.";
csb[17] = "Eliezer\'s sons were Rehabiah, first; Eliezer did not have any other sons, but Rehabiah\'s sons were very numerous.";
csb[18] = "Izhar\'s sons: Shelomith was first.";
csb[19] = "Hebron\'s sons: Jeriah was first, Amariah second, Jahaziel third, and Jekameam fourth.";
csb[20] = "Uzziel\'s sons: Micah was first, and Isshiah second.";
csb[21] = "Merari\'s sons: Mahli and Mushi. Mahli\'s sons: Eleazar and Kish.";
csb[22] = "Eleazar died having no sons, only daughters. Their cousins, the sons of Kish, married them.";
csb[23] = "Mushi\'s sons: Mahli, Eder, and Jeremoth -- three.";
csb[24] = "These were the descendants of Levi by their ancestral families -- the family heads, according to their registration by name in the headcount -- twenty years old or more, who worked in the service of the LORD\'s temple.";
csb[25] = "For David said, &quot;The LORD God of Israel has given rest to his people, and he has come to stay in Jerusalem forever.";
csb[26] = "&quot;Also, the Levites no longer need to carry the tabernacle or any of the equipment for its service&quot; --";
csb[27] = "for according to the last words of David, the Levites twenty years old or more were to be counted --";
csb[28] = "&quot;but their duty will be to assist the descendants of Aaron with the service of the LORD\'s temple, being responsible for the courts and the chambers, the purification of all the holy things, and the work of the service of God\'s temple --";
csb[29] = "&quot;as well as the rows of the Bread of the Presence, the fine flour for the grain offering, the wafers of unleavened bread, the baking, the mixing, and all measurements of volume and length.";
csb[30] = "&quot;They are also to stand every morning to give thanks and praise to the LORD, and likewise in the evening.";
csb[31] = "&quot;Whenever burnt offerings are offered to the LORD on the Sabbaths, New Moons, and appointed festivals, they are to offer them regularly in the LORD\'s presence according to the number prescribed for them.";
csb[32] = "&quot;They are to carry out their responsibilities for the tent of meeting, for the holy place, and for their relatives, the descendants of Aaron, in the service of the LORD\'s temple.&quot;";
</script>
