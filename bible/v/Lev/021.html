csb[1] = "The LORD said to Moses: &quot;Speak to Aaron\'s sons, the priests, and tell them: A priest is not to make himself ceremonially unclean for a dead person among his relatives,";
csb[2] = "&quot;except for his immediate family: his mother, father, son, daughter, or brother.";
csb[3] = "&quot;He may make himself unclean for his unmarried virgin sister in his immediate family.";
csb[4] = "&quot;He is not to make himself unclean for those related to him by marriage and so defile himself.";
csb[5] = "&quot;Priests may not make bald spots on their heads, shave the edge of their beards, or make gashes on their bodies.";
csb[6] = "&quot;They are to be holy to their God and not profane the name of their God. For they present the fire offerings to the LORD, the food of their God, and they must be holy.";
csb[7] = "&quot;They are not to marry a woman defiled by prostitution. They are not to marry one divorced by her husband, for the priest is holy to his God.";
csb[8] = "&quot;You are to consider him holy since he presents the food of your God. He will be holy to you because I, the LORD who sets you apart, am holy.";
csb[9] = "&quot;If a priest\'s daughter defiles herself by promiscuity, she defiles her father; she must be burned to death.";
csb[10] = "&quot;The priest who is highest among his brothers, who has had the anointing oil poured on his head and has been ordained to wear the clothes, must not dishevel his hair or tear his clothes.";
csb[11] = "&quot;He must not go near any dead person or make himself unclean even for his father or mother.";
csb[12] = "&quot;He must not leave the sanctuary or he will desecrate the sanctuary of his God, for the consecration of the anointing oil of his God is on him; I am the LORD.";
csb[13] = "&quot;He is to marry a woman who is a virgin.";
csb[14] = "&quot;He is not to marry a widow, a divorced woman, or one defiled by prostitution. He is to marry a virgin from his own people,";
csb[15] = "&quot;so that he does not corrupt his bloodline among his people, for I am the LORD who sets him apart.&quot;";
csb[16] = "The LORD spoke to Moses:";
csb[17] = "&quot;Tell Aaron: None of your descendants throughout your generations who has a physical defect is to come near to present the food of his God.";
csb[18] = "&quot;No man who has any defect is to come near: no man who is blind, lame, facially disfigured, or deformed;";
csb[19] = "&quot;no man who has a broken foot or hand,";
csb[20] = "&quot;or who is a hunchback or a dwarf, or who has an eye defect, a festering rash, scabs, or a crushed testicle.";
csb[21] = "&quot;No descendant of the priest Aaron who has a defect is to come near to present the fire offerings to the LORD. He has a defect and is not to come near to present the food of his God.";
csb[22] = "&quot;He may eat the food of his God from what is especially holy as well as from what is holy.";
csb[23] = "&quot;But because he has a defect, he must not go near the curtain or approach the altar. He is not to desecrate my holy places, for I am the LORD who sets them apart.&quot;";
csb[24] = "Moses said this to Aaron and his sons and to all the Israelites.";
</script>
