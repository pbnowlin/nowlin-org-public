kjv[1] = "And the LORD spake unto Moses, saying,";
rsv[1] = "And the LORD said to Moses,";
asv[1] = "And Jehovah spake unto Moses, saying,";
yng[1] = "And Jehovah speaketh unto Moses, saying,";
dby[1] = "And Jehovah spoke to Moses, saying,";
web[1] = "And the LORD spoke to Moses, saying,";
hnv[1] = "The LORD spoke to Moshe, saying,";
vul[1] = "locutus quoque est Dominus ad Mosen dicens";
kjv[2] = "Speak unto Aaron and to his sons, that they separate themselves from the holy things of the children of Israel, and that they profane not my holy name [in those things] which they hallow unto me: I [am] the LORD.";
rsv[2] = "&quot;Tell Aaron and his sons to keep away from the holy things of the people of Israel, which they dedicate to me, so that they may not profane my holy name; I am the LORD.";
asv[2] = "Speak unto Aaron and to his sons, that they separate themselves from the holy things of the children of Israel, which they hallow unto me, and that they profane not my holy name: I am Jehovah.";
yng[2] = "`Speak unto Aaron, and unto his sons, and they are separated from the holy things of the sons of Israel, and they pollute not My holy name in what they are hallowing to Me; I [am] Jehovah.";
dby[2] = "Speak unto Aaron, and to his sons, that they separate themselves from the holy things of the children of Israel, and that they profane not my holy name in the things that they hallow unto me: I am Jehovah.";
web[2] = "Speak to Aaron and to his sons, that they separate themselves from the holy things of the children of Israel, and that they profane not my holy name [in those things] which they hallow to me: I [am] the LORD.";
hnv[2] = "&quot;Tell Aharon and his sons to separate themselves from the holy things of the children of Yisra\'el, which they make holy to me, and that they not profane my holy name. I am the LORD.";
vul[2] = "loquere ad Aaron et ad filios eius ut caveant ab his quae consecrata sunt filiorum Israhel et non contaminent nomen sanctificatorum mihi quae ipsi offerunt ego Dominus";
kjv[3] = "Say unto them, Whosoever [he be] of all your seed among your generations, that goeth unto the holy things, which the children of Israel hallow unto the LORD, having his uncleanness upon him, that soul shall be cut off from my presence: I [am] the LORD.";
rsv[3] = "Say to them, \'If any one of all your descendants throughout your generations approaches the holy things, which the people of Israel dedicate to the LORD, while he has an uncleanness, that person shall be cut off from my presence: I am the LORD.";
asv[3] = "Say unto them, Whosoever he be of all your seed throughout your generations, that approacheth unto the holy things, which the children of Israel hallow unto Jehovah, having his uncleanness upon him, that soul shall be cut off from before me: I am Jehovah.";
yng[3] = "`Say unto them, To your generations, any man who draweth near, out of all your seed, unto the holy things which the sons of Israel do sanctify to Jehovah, and his uncleanness on him -- even that person hath been cut off from before Me; I [am] Jehovah.";
dby[3] = "Say unto them, Every one of all your seed, throughout your generations, that approacheth the holy things, which the children of Israel hallow unto Jehovah, having his uncleanness upon him, that soul shall be cut off from before me: I am Jehovah.";
web[3] = "Say to them, Whoever [he may be] of all your seed among your generations, that approacheth the holy things, which the children of Israel hallow to the LORD, having his uncleanness upon him, that soul shall be cut off from my presence: I [am] the LORD.";
hnv[3] = "Tell them, \'If anyone of all your seed throughout your generations approaches the holy things, which the children of Yisra\'el make holy to the LORD, having his uncleanness on him, that soul shall be cut off from before me. I am the LORD.";
vul[3] = "dic ad eos et ad posteros eorum omnis homo qui accesserit de stirpe vestra ad ea quae consecrata sunt et quae obtulerunt filii Israhel Domino in quo est inmunditia peribit coram Domino ego sum Dominus";
kjv[4] = "What man soever of the seed of Aaron [is] a leper, or hath a running issue; he shall not eat of the holy things, until he be clean. And whoso toucheth any thing [that is] unclean [by] the dead, or a man whose seed goeth from him;";
rsv[4] = "None of the line of Aaron who is a leper or suffers a discharge may eat of the holy things until he is clean. Whoever touches anything that is unclean through contact with the dead or a man who has had an emission of semen,";
asv[4] = "What man soever of the seed of Aaron is a leper, or hath an issue; he shall not eat of the holy things, until he be clean. And whoso toucheth anything that is unclean by the dead, or a man whose seed goeth from him;";
yng[4] = "`Any man of the seed of Aaron, and is leprous or hath an issue -- of the holy things he doth not eat till that he is clean; and he who is coming against any uncleanness of a person, or a man whose seed of copulation goeth out from him,";
dby[4] = "Whatsoever man of the seed of Aaron is a leper, or hath a flux, he shall not eat of the holy things, until he is clean. And he that toucheth any one that is unclean by a dead person, or a man whose seed of copulation hath passed from him;";
web[4] = "Whatever man of the seed of Aaron [is] a leper, or hath a running issue; he shall not eat of the holy things, until he is clean. And whoever toucheth any thing [that is] unclean [by] the dead, or a man whose seed goeth from him;";
hnv[4] = "&quot;\'Whoever of the seed of Aharon is a leper or has an issue; he shall not eat of the holy things, until he is clean. Whoever touches anything that is unclean by the dead, or a man whose seed goes from him;";
vul[4] = "homo de semine Aaron qui fuerit leprosus aut patiens fluxum seminis non vescetur de his quae sanctificata sunt mihi donec sanetur qui tetigerit inmundum super mortuo et ex quo egreditur semen quasi coitus";
kjv[5] = "Or whosoever toucheth any creeping thing, whereby he may be made unclean, or a man of whom he may take uncleanness, whatsoever uncleanness he hath;";
rsv[5] = "and whoever touches a creeping thing by which he may be made unclean or a man from whom he may take uncleanness, whatever his uncleanness may be--";
asv[5] = "or whosoever toucheth any creeping thing, whereby he may be made unclean, or a man of whom he may take uncleanness, whatsoever uncleanness he hath;";
yng[5] = "or a man who cometh against any teeming thing which is unclean to him, or against a man who is unclean to him, even any of his uncleanness --";
dby[5] = "or a man that toucheth any crawling thing whereby he becometh unclean, or a man by whom he may become unclean, whatever may be his uncleanness,";
web[5] = "Or whoever toucheth any creeping animal, by which he may be made unclean, or a man of whom he may take uncleanness, whatever uncleanness he hath:";
hnv[5] = "or whoever touches any creeping thing, whereby he may be made unclean, or a man of whom he may take uncleanness, whatever uncleanness he has;";
vul[5] = "et qui tangit reptile et quodlibet inmundum cuius tactus est sordidus";
kjv[6] = "The soul which hath touched any such shall be unclean until even, and shall not eat of the holy things, unless he wash his flesh with water.";
rsv[6] = "the person who touches any such shall be unclean until the evening and shall not eat of the holy things unless he has bathed his body in water.";
asv[6] = "the soul that toucheth any such shall be unclean until the even, and shall not eat of the holy things, unless he bathe his flesh in water.";
yng[6] = "the person who cometh against it -- hath even been unclean till the evening, and doth not eat of the holy things, but hath bathed his flesh with water,";
dby[6] = "-- a person that toucheth any such shall be unclean until even, and shall not eat of the holy things; but he shall bathe his flesh with water,";
web[6] = "The soul which hath touched any such shall be unclean until evening, and shall not eat of the holy things, unless he shall wash his flesh with water.";
hnv[6] = "the person that touches any such shall be unclean until the evening, and shall not eat of the holy things, unless he bathe his body in water.";
vul[6] = "inmundus erit usque ad vesperum et non vescetur his quae sanctificata sunt sed cum laverit carnem suam aqua";
kjv[7] = "And when the sun is down, he shall be clean, and shall afterward eat of the holy things; because it [is] his food.";
rsv[7] = "When the sun is down he shall be clean; and afterward he may eat of the holy things, because such are his food.";
asv[7] = "And when the sun is down, he shall be clean; and afterward he shall eat of the holy things, because it is his bread.";
yng[7] = "and the sun hath gone in, and he hath been clean, and afterwards he doth eat of the holy things, for it [is] his food;";
dby[7] = "and when the sun goeth down, he shall be clean, and may afterwards eat of the holy things; for it is his food.";
web[7] = "And when the sun is set, he shall be clean, and shall afterward eat of the holy things, because it [is] his food.";
hnv[7] = "When the sun is down, he shall be clean; and afterward he shall eat of the holy things, because it is his bread.";
vul[7] = "et occubuerit sol tunc mundatus vescetur de sanctificatis quia cibus illius est";
kjv[8] = "That which dieth of itself, or is torn [with beasts], he shall not eat to defile himself therewith: I [am] the LORD.";
rsv[8] = "That which dies of itself or is torn by beasts he shall not eat, defiling himself by it: I am the LORD.\'";
asv[8] = "That which dieth of itself, or is torn of beasts, he shall not eat, to defile himself therewith: I am Jehovah.";
yng[8] = "a carcase or torn thing he doth not eat, for uncleanness thereby; I [am] Jehovah.";
dby[8] = "Of a dead carcase and what is torn shall he not eat, to make himself unclean therewith: I am Jehovah.";
web[8] = "That which dieth of itself, or is torn [by beasts], he shall not eat to defile himself with it: I [am] the LORD.";
hnv[8] = "That which dies of itself, or is torn by animals, he shall not eat, defiling himself by it. I am the LORD.";
vul[8] = "morticinum et captum a bestia non comedent nec polluentur in eis ego sum Dominus";
kjv[9] = "They shall therefore keep mine ordinance, lest they bear sin for it, and die therefore, if they profane it: I the LORD do sanctify them.";
rsv[9] = "They shall therefore keep my charge, lest they bear sin for it and die thereby when they profane it: I am the LORD who sanctify them.";
asv[9] = "They shall therefore keep my charge, lest they bear sin for it, and die therein, if they profane it: I am Jehovah who sanctifieth them.";
yng[9] = "`And they have kept My charge, and bear no sin for it, that they have died for it when they pollute it; I [am] Jehovah sanctifying them.";
dby[9] = "And they shall keep my charge, lest they bear sin for it, and die by it, if they profane it: I am Jehovah who do hallow them.";
web[9] = "They shall therefore keep my ordinance, lest they bear sin for it, and die therefore, if they profane it: I the LORD do sanctify them.";
hnv[9] = "&quot;\'They shall therefore keep my charge, lest they bear sin for it, and die therein, if they profane it. I am the LORD who sanctifies them.";
vul[9] = "custodient praecepta mea ut non subiaceant peccato et moriantur in sanctuario cum polluerint illud ego Dominus qui sanctifico eos";
kjv[10] = "There shall no stranger eat [of] the holy thing: a sojourner of the priest, or an hired servant, shall not eat [of] the holy thing.";
rsv[10] = "&quot;An outsider shall not eat of a holy thing. A sojourner of the priest\'s or a hired servant shall not eat of a holy thing;";
asv[10] = "There shall no stranger eat of the holy thing: a sojourner of the priest\'s, or a hired servant, shall not eat of the holy thing.";
yng[10] = "`And no stranger doth eat of the holy thing; a settler of a priest and an hireling doth not eat of the holy thing;";
dby[10] = "And no stranger shall eat the holy thing; the sojourner with the priest, and the hired servant, shall not eat of the holy thing.";
web[10] = "There shall no stranger eat [of] the holy thing: a sojourner of the priest, or a hired servant, shall not eat [of] the holy thing.";
hnv[10] = "&quot;\'No stranger shall eat of the holy thing: a foreigner living with the Kohanim, or a hired servant, shall not eat of the holy thing.";
vul[10] = "omnis alienigena non comedet de sanctificatis inquilinus sacerdotis et mercennarius non vescentur ex eis";
kjv[11] = "But if the priest buy [any] soul with his money, he shall eat of it, and he that is born in his house: they shall eat of his meat.";
rsv[11] = "but if a priest buys a slave as his property for money, the slave may eat of it; and those that are born in his house may eat of his food.";
asv[11] = "But if a priest buy any soul, the purchase of his money, he shall eat of it; and such as are born in his house, they shall eat of his bread.";
yng[11] = "and when a priest buyeth a person, the purchase of his money, he doth eat of it, also one born in his house; they do eat of his bread.";
dby[11] = "But if a priest buy any one for money, he may eat of it, and he that is born in his house: they may eat of his food.";
web[11] = "But if the priest shall buy [any] soul with his money, he shall eat of it, and he that is born in his house: they shall eat of his meat.";
hnv[11] = "But if a Kohen buys a slave, purchased by his money, he shall eat of it; and such as are born in his house, they shall eat of his bread.";
vul[11] = "quem autem sacerdos emerit et qui vernaculus domus eius fuerit hii comedent ex eis";
kjv[12] = "If the priest\'s daughter also be [married] unto a stranger, she may not eat of an offering of the holy things.";
rsv[12] = "If a priest\'s daughter is married to an outsider she shall not eat of the offering of the holy things.";
asv[12] = "And if a priest\'s daughter be married unto a stranger, she shall not eat of the heave-offering of the holy things.";
yng[12] = "`And a priest\'s daughter, when she is a strange man\'s, -- she, of the heave-offering of the holy things doth not eat;";
dby[12] = "And a priest\'s daughter who is [married] to a stranger may not eat of the heave-offering of the holy things.";
web[12] = "If the priest\'s daughter also shall be [married] to a stranger, she may not eat of an offering of the holy things.";
hnv[12] = "If a Kohen\'s daughter is married to an outsider, she shall not eat of the heave offering of the holy things.";
vul[12] = "si filia sacerdotis cuilibet ex populo nupta fuerit de his quae sanctificata sunt et de primitiis non vescetur";
kjv[13] = "But if the priest\'s daughter be a widow, or divorced, and have no child, and is returned unto her father\'s house, as in her youth, she shall eat of her father\'s meat: but there shall no stranger eat thereof.";
rsv[13] = "But if a priest\'s daughter is a widow or divorced, and has no child, and returns to her father\'s house, as in her youth, she may eat of her father\'s food; yet no outsider shall eat of it.";
asv[13] = "But if a priest\'s daughter be a widow, or divorced, and have no child, and be returned unto her father\'s house, as in her youth, she shall eat of her father\'s bread: but there shall no stranger eat thereof.";
yng[13] = "and a priest\'s daughter, when she is a widow, or cast out, and hath no seed, and hath turned back unto the house of her father, as [in] her youth, of her father\'s bread she doth eat; but no stranger doth eat of it.";
dby[13] = "But a priest\'s daughter that becometh a widow, or is divorced, and hath no seed, and returneth unto her father\'s house, as in her youth, she may eat of her father\'s food; but no stranger shall eat thereof.";
web[13] = "But if the priest\'s daughter shall be a widow, or divorced, and shall have no child, and have returned to her father\'s house, as in her youth, she shall eat of her father\'s meat; but there shall no stranger eat of it.";
hnv[13] = "But if a Kohen\'s daughter is a widow, or divorced, and has no child, and has returned to her father\'s house, as in her youth, she may eat of her father\'s bread: but no stranger shall eat any of it.";
vul[13] = "sin autem vidua vel repudiata et absque liberis reversa fuerit ad domum patris sui sicut puella consuerat aletur cibis patris sui omnis alienigena comedendi ex eis non habet potestatem";
kjv[14] = "And if a man eat [of] the holy thing unwittingly, then he shall put the fifth [part] thereof unto it, and shall give [it] unto the priest with the holy thing.";
rsv[14] = "And if a man eats of a holy thing unwittingly, he shall add the fifth of its value to it, and give the holy thing to the priest.";
asv[14] = "And if a man eat of the holy thing unwittingly, then he shall put the fifth part thereof unto it, and shall give unto the priest the holy thing.";
yng[14] = "`And when a man doth eat of a holy thing through ignorance, then he hath added its fifth part to it, and hath given [it] to the priest, with the holy thing;";
dby[14] = "And if a man eat of a holy thing through inadvertence, then he shall put the fifth part thereof unto it, and shall give it unto the priest with the holy thing.";
web[14] = "And if a man shall eat [of] the holy thing unknowingly, then he shall put to it the fifth [part], and shall give [it] to the priest, with the holy thing.";
hnv[14] = "&quot;\'If a man eats something holy unwittingly, then he shall add the fifth part of its value to it, and shall give the holy thing to the Kohen.";
vul[14] = "qui comederit de sanctificatis per ignorantiam addet quintam partem cum eo quod comedit et dabit sacerdoti in sanctuarium";
kjv[15] = "And they shall not profane the holy things of the children of Israel, which they offer unto the LORD;";
rsv[15] = "The priests shall not profane the holy things of the people of Israel, which they offer to the LORD,";
asv[15] = "And they shall not profane the holy things of the children of Israel, which they offer unto Jehovah,";
yng[15] = "and they do not pollute the holy things of the sons of Israel -- that which they lift up to Jehovah,";
dby[15] = "And they shall not profane the holy things of the children of Israel which they offer unto Jehovah,";
web[15] = "And they shall not profane the holy things of the children of Israel which they offer to the LORD;";
hnv[15] = "The Kohanim shall not profane the holy things of the children of Yisra\'el, which they offer to the LORD,";
vul[15] = "nec contaminabunt sanctificata filiorum Israhel quae offerunt Domino";
kjv[16] = "Or suffer them to bear the iniquity of trespass, when they eat their holy things: for I the LORD do sanctify them.";
rsv[16] = "and so cause them to bear iniquity and guilt, by eating their holy things: for I am the LORD who sanctify them.&quot;";
asv[16] = "and [so] cause them to bear the iniquity that bringeth guilt, when they eat their holy things: for I am Jehovah who sanctifieth them.";
yng[16] = "nor have caused them to bear the iniquity of the guilt-offering in their eating their holy things; for I [am] Jehovah, sanctifying them.\'";
dby[16] = "and cause them to bear the iniquity of trespass when they eat their holy things; for I am Jehovah who do hallow them.";
web[16] = "Or suffer them to bear the iniquity of trespass, when they eat their holy things: for I the LORD do sanctify them.";
hnv[16] = "and so cause them to bear the iniquity that brings guilt, when they eat their holy things: for I am the LORD who sanctifies them.\'&quot;";
vul[16] = "ne forte sustineant iniquitatem delicti sui cum sanctificata comederint ego Dominus qui sanctifico eos";
kjv[17] = "And the LORD spake unto Moses, saying,";
rsv[17] = "And the LORD said to Moses,";
asv[17] = "And Jehovah spake unto Moses, saying,";
yng[17] = "And Jehovah speaketh unto Moses, saying,";
dby[17] = "And Jehovah spoke to Moses, saying,";
web[17] = "And the LORD spoke to Moses, saying,";
hnv[17] = "The LORD spoke to Moshe, saying,";

kjv[18] = "Speak unto Aaron, and to his sons, and unto all the children of Israel, and say unto them, Whatsoever [he be] of the house of Israel, or of the strangers in Israel, that will offer his oblation for all his vows, and for all his freewill offerings, which they will offer unto the LORD for a burnt offering;";
rsv[18] = "&quot;Say to Aaron and his sons and all the people of Israel, When any one of the house of Israel or of the sojourners in Israel presents his offering, whether in payment of a vow or as a freewill offering which is offered to the LORD as a burnt offering,";
asv[18] = "Speak unto Aaron, and to his sons, and unto all the children of Israel, and say unto them, Whosoever he be of the house of Israel, or of the sojourners in Israel, that offereth his oblation, whether it be any of their vows, or any of their freewill-offerings, which they offer unto Jehovah for a burnt-offering;";
yng[18] = "`Speak unto Aaron, and unto his sons, and unto all the sons of Israel, and thou hast said unto them, Any man of the house of Israel, or of the sojourners in Israel, who bringeth near his offering, of all his vows, or of all his willing offerings which they bring near to Jehovah for a burnt-offering;";
dby[18] = "Speak unto Aaron, and to his sons, and unto all the children of Israel, and say unto them, Whatever man of the house of Israel, or of the sojourners in Israel, that presenteth his offering for any of his vows, and for any of his voluntary offerings, which they present to Jehovah as a burnt-offering,";
web[18] = "Speak to Aaron, and to his sons, and to all the children of Israel, and say to them, Whoever [he may be] of the house of Israel, or of the strangers in Israel, that will offer his oblation for all his vows, and for all his free-will-offerings, which they will offer to the LORD for a burnt-offering:";
hnv[18] = "&quot;Speak to Aharon, and to his sons, and to all the children of Yisra\'el, and say to them, \'Whoever is of the house of Yisra\'el, or of the foreigners in Yisra\'el, who offers his offering, whether it be any of their vows, or any of their freewill offerings, which they offer to the LORD for a burnt offering;";
vul[18] = "loquere ad Aaron et filios eius et ad omnes filios Israhel dicesque ad eos homo de domo Israhel et de advenis qui habitant apud vos qui obtulerit oblationem suam vel vota solvens vel sponte offerens quicquid illud obtulerit in holocaustum Domini";
kjv[19] = "[Ye shall offer] at your own will a male without blemish, of the beeves, of the sheep, or of the goats.";
rsv[19] = "to be accepted you shall offer a male without blemish, of the bulls or the sheep or the goats.";
asv[19] = "that ye may be accepted, [ye shall offer] a male without blemish, of the bullocks, of the sheep, or of the goats.";
yng[19] = "at your pleasure a perfect one, a male of the herd, of the sheep or of the goats;";
dby[19] = "it shall be for your acceptance, without blemish, a male of the oxen, of the sheep, and of the goats.";
web[19] = "[Ye shall offer] at your own will a male without blemish of the beeves, of the sheep, or of the goats.";
hnv[19] = "that you may be accepted, you shall offer a male without blemish, of the bulls, of the sheep, or of the goats.";
vul[19] = "ut offeratur per vos masculus inmaculatus erit ex bubus et ex ovibus et ex capris";
kjv[20] = "[But] whatsoever hath a blemish, [that] shall ye not offer: for it shall not be acceptable for you.";
rsv[20] = "You shall not offer anything that has a blemish, for it will not be acceptable for you.";
asv[20] = "But whatsoever hath a blemish, that shall ye not offer: for it shall not be acceptable for you.";
yng[20] = "nothing in which [is] blemish do ye bring near, for it is not for a pleasing thing for you.";
dby[20] = "Nothing that hath a defect shall ye present; for it shall not be acceptable for you.";
web[20] = "[But] whatever hath a blemish, [that] shall ye not offer: for it shall not be acceptable for you.";
hnv[20] = " But whatever has a blemish, that you shall not offer: for it shall not be acceptable for you.";
vul[20] = "si maculam habuerit non offeretis neque erit acceptabile";
kjv[21] = "And whosoever offereth a sacrifice of peace offerings unto the LORD to accomplish [his] vow, or a freewill offering in beeves or sheep, it shall be perfect to be accepted; there shall be no blemish therein.";
rsv[21] = "And when any one offers a sacrifice of peace offerings to the LORD, to fulfil a vow or as a freewill offering, from the herd or from the flock, to be accepted it must be perfect; there shall be no blemish in it.";
asv[21] = "And whosoever offereth a sacrifice of peace-offerings unto Jehovah to accomplish a vow, or for a freewill-offering, of the herd or of the flock, it shall be perfect to be accepted; there shall be no blemish therein.";
yng[21] = "`And when a man bringeth near a sacrifice of peace-offerings to Jehovah, to complete a vow, or for a willing-offering, of the herd or of the flock, it is perfect for a pleasing thing: no blemish is in it;";
dby[21] = "And if any present a sacrifice of peace-offering to Jehovah to accomplish a vow, or a voluntary offering of oxen or small cattle, it shall be without blemish to be accepted: there shall be no defect therein.";
web[21] = "And whoever offereth a sacrifice of peace-offerings to the LORD to accomplish [his] vow, or a free-will-offering in beeves, or sheep, it shall be perfect to be accepted: there shall be in it no blemish.";
hnv[21] = "Whoever offers a sacrifice of shalom offerings to the LORD to accomplish a vow, or for a freewill offering, of the herd or of the flock, it shall be perfect to be accepted; there shall be no blemish therein.";
vul[21] = "homo qui obtulerit victimam pacificorum Domino vel vota solvens vel sponte offerens tam de bubus quam de ovibus inmaculatum offeret ut acceptabile sit omnis macula non erit in eo";
kjv[22] = "Blind, or broken, or maimed, or having a wen, or scurvy, or scabbed, ye shall not offer these unto the LORD, nor make an offering by fire of them upon the altar unto the LORD.";
rsv[22] = "Animals blind or disabled or mutilated or having a discharge or an itch or scabs, you shall not offer to the LORD or make of them an offering by fire upon the altar to the LORD.";

csb[1] = "The LORD spoke to Moses:";
csb[2] = "&quot;Tell Aaron and his sons to deal respectfully with the holy offerings of the Israelites that they have consecrated to me, so they do not profane my holy name; I am the LORD.";
csb[3] = "&quot;Say to them: If any man from any of your descendants throughout your generations is in a state of uncleanness yet approaches the holy offerings that the Israelites consecrate to the LORD, that person will be cut off from my presence; I am the LORD.";
csb[4] = "&quot;No man of Aaron\'s descendants who has a skin disease or a discharge is to eat from the holy offerings until he is clean. Whoever touches anything made unclean by a dead person or by a man who has an emission of semen,";
csb[5] = "&quot;or whoever touches any swarming creature that makes him unclean or any person who makes him unclean -- whatever his uncleanness --";
csb[6] = "&quot;the man who touches any of these will remain unclean until evening and is not to eat from the holy offerings unless he has bathed his body with water.";
csb[7] = "&quot;When the sun has set, he will become clean, and then he may eat from the holy offerings, for that is his food.";
csb[8] = "&quot;He must not eat an animal that died naturally or was mauled by wild beasts, making himself unclean by it; I am the LORD.";
csb[9] = "&quot;They must keep my instruction, or they will be guilty and die because they profane it; I am the LORD who sets them apart.";
csb[10] = "&quot;No one outside a priest\'s family is to eat the holy offering. A foreigner staying with a priest or a hired worker is not to eat the holy offering.";
csb[11] = "&quot;But if a priest purchases someone with his own silver, that person may eat it, and those born in his house may eat his food.";
csb[12] = "&quot;If the priest\'s daughter is married to a man outside a priest\'s family, she is not to eat from the holy contributions.";
csb[13] = "&quot;But if the priest\'s daughter becomes widowed or divorced, has no children, and returns to her father\'s house as in her youth, she may share her father\'s food. But no outsider may share it.";
csb[14] = "&quot;If anyone eats a holy offering in error, he is to add a fifth to its value and give the holy offering to the priest.";
csb[15] = "&quot;The priests must not profane the holy offerings the Israelites give to the LORD";
csb[16] = "&quot;by letting the people eat their holy offerings and having them bear the penalty of restitution. For I am the LORD who sets them apart.&quot;";
csb[17] = "The LORD spoke to Moses:";
csb[18] = "&quot;Speak to Aaron, his sons, and all the Israelites and tell them: Any man of the house of Israel or of the resident aliens in Israel who presents his offering -- whether they present payment of vows or freewill gifts to the LORD as burnt offerings --";
csb[19] = "&quot;must offer an unblemished male from the cattle, sheep, or goats in order for you to be accepted.";
csb[20] = "&quot;You are not to present anything that has a defect, because it will not be accepted on your behalf.";
csb[21] = "&quot;When a man presents a fellowship sacrifice to the LORD to fulfill a vow or as a freewill offering from the herd or flock, it has to be unblemished to be acceptable; there must be no defect in it.";
csb[22] = "&quot;You are not to present any animal to the LORD that is blind, injured, maimed, or has a running sore, festering rash, or scabs; you may not put any of them on the altar as a fire offering to the LORD.";
csb[23] = "&quot;You may sacrifice as a freewill offering any animal from the herd or flock that has an elongated or stunted limb, but it is not acceptable as a vow offering.";
csb[24] = "&quot;You are not to present to the LORD anything that has bruised, crushed, torn, or severed testicles; you must not sacrifice them in your land.";
csb[25] = "&quot;Neither you nor a foreigner are to present food to your God from any of these animals. They will not be accepted for you because they are deformed and have a defect.&quot;";
csb[26] = "The LORD spoke to Moses:";
csb[27] = "&quot;When an ox, sheep, or goat is born, it is to remain with its mother for seven days; from the eighth day on, it will be acceptable as an offering, a fire offering to the LORD.";
csb[28] = "&quot;But you are not to slaughter an animal from the herd or flock on the same day as its young.";
csb[29] = "&quot;When you sacrifice a thank offering to the LORD, sacrifice it so that you may be accepted.";
csb[30] = "&quot;It is to be eaten on the same day. Do not let any of it remain until morning; I am the LORD.";
csb[31] = "&quot;You are to keep my commands and do them; I am the LORD.";
csb[32] = "&quot;You must not profane my holy name; I must be treated as holy among the Israelites. I am the LORD who sets you apart,";
csb[33] = "&quot;the one who brought you out of the land of Egypt to be your God; I am the LORD.&quot;";
