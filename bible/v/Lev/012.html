csb[1] = "The LORD spoke to Moses:";
csb[2] = "&quot;Tell the Israelites: When a woman becomes pregnant and gives birth to a male child, she will be unclean seven days, as she is during the days of her menstrual impurity.";
csb[3] = "&quot;The flesh of his foreskin must be circumcised on the eighth day.";
csb[4] = "&quot;She will continue in purification from her bleeding for thirty-three days. She must not touch any holy thing or go into the sanctuary until completing her days of purification.";
csb[5] = "&quot;But if she gives birth to a female child, she will be unclean for two weeks as she is during her menstrual impurity. She will continue in purification from her bleeding for sixty-six days.";
csb[6] = "&quot;When her days of purification are complete, whether for a son or daughter, she is to bring to the priest at the entrance to the tent of meeting a year-old male lamb for a burnt offering, and a young pigeon or a turtledove for a sin offering.";
csb[7] = "&quot;He will present them before the LORD and make atonement on her behalf; she will be clean from her discharge of blood. This is the law for a woman giving birth, whether to a male or female.";
csb[8] = "&quot;But if she doesn\'t have sufficient means for a sheep, she may take two turtledoves or two young pigeons, one for a burnt offering and the other for a sin offering. Then the priest will make atonement on her behalf, and she will be clean.&quot;";
