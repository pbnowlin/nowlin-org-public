yng[24] = "and fire cometh out from before Jehovah, and consumeth on the altar the burnt-offering, and the fat; and all the people see, and cry aloud, and fall on their faces.";
dby[24] = "And there went out fire from before Jehovah, and consumed on the altar the burnt-offering, and the pieces of fat; and all the people saw it, and they shouted, and fell on their face.";
web[24] = "And there came out a fire from before the LORD, and consumed upon the altar the burnt-offering and the fat: [which], when all the people saw, they shouted, and fell on their faces.";
hnv[24] = "There came forth fire from before the LORD, and consumed the burnt offering and the fat upon the altar: and when all the people saw it, they shouted, and fell on their faces.";
vul[24] = "et ecce egressus ignis a Domino devoravit holocaustum et adipes qui erant super altare quod cum vidissent turbae laudaverunt Dominum ruentes in facies suas";
csb[1] = "On the eighth day Moses summoned Aaron, his sons, and the elders of Israel.";
csb[2] = "He said to Aaron, &quot;Take a young bull for a sin offering and a ram for a burnt offering, both without blemish, and present them before the LORD.";
csb[3] = "&quot;And tell the Israelites: Take a male goat for a sin offering; a calf and a lamb, male yearlings without blemish, for a burnt offering;";
csb[4] = "&quot;an ox and a ram for a fellowship offering to sacrifice before the LORD; and a grain offering mixed with oil. For today the LORD is going to appear to you.&quot;";
csb[5] = "They brought what Moses had commanded to the front of the tent of meeting, and the whole community came forward and stood before the LORD.";
csb[6] = "Moses said, &quot;This is what the LORD commanded you to do, that the glory of the LORD may appear to you.&quot;";
csb[7] = "Then Moses said to Aaron, &quot;Approach the altar and sacrifice your sin offering and your burnt offering; make atonement for yourself and the people. Sacrifice the people\'s offering and make atonement for them, as the LORD commanded.&quot;";
csb[8] = "So Aaron approached the altar and slaughtered the calf as a sin offering for himself.";
csb[9] = "Aaron\'s sons brought the blood to him, and he dipped his finger in the blood and applied it to the horns of the altar. He poured out the blood at the base of the altar.";
csb[10] = "He burned the fat, the kidneys, and the fatty lobe of the liver from the sin offering on the altar, as the LORD had commanded Moses.";
csb[11] = "He burned the flesh and the hide outside the camp.";
csb[12] = "Then he slaughtered the burnt offering. Aaron\'s sons brought him the blood, and he splattered it on all sides of the altar.";
csb[13] = "They brought him the burnt offering piece by piece, along with the head, and he burned them on the altar.";
csb[14] = "He washed the entrails and the legs and burned them with the burnt offering on the altar.";
csb[15] = "Aaron presented the people\'s offering. He took the male goat for the people\'s sin offering, slaughtered it, and made a sin offering with it as he did before.";
csb[16] = "He presented the burnt offering and sacrificed it according to the regulation.";
csb[17] = "Next he presented the grain offering, took a handful of it, and burned it on the altar in addition to the morning burnt offering.";
csb[18] = "Finally, he slaughtered the ox and the ram as the people\'s fellowship sacrifice. Aaron\'s sons brought him the blood, and he splattered it on all sides of the altar.";
csb[19] = "They also brought the fat portions from the ox and the ram -- the fat tail, the fat surrounding the entrails, the kidneys, and the fatty lobe of the liver --";
csb[20] = "and placed these on the breasts. Aaron burned the fat portions on the altar,";
csb[21] = "but he presented the breasts and the right thigh as a presentation offering before the LORD, as Moses had commanded.";
csb[22] = "Aaron lifted up his hands toward the people and blessed them. He came down after sacrificing the sin offering, the burnt offering, and the fellowship offering.";
csb[23] = "Moses and Aaron then entered the tent of meeting. When they came out, they blessed the people, and the glory of the LORD appeared to all the people.";
csb[24] = "Fire came from the LORD and consumed the burnt offering and the fat portions on the altar. And when all the people saw it, they shouted and fell facedown.";
