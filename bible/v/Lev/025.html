kjv[25] = "If thy brother be waxen poor, and hath sold away [some] of his possession, and if any of his kin come to redeem it, then shall he redeem that which his brother sold.";

asv[25] = "If thy brother be waxed poor, and sell some of his possession, then shall his kinsman that is next unto him come, and shall redeem that which his brother hath sold.";
yng[25] = "`When thy brother becometh poor, and hath sold his possession, then hath his redeemer who is near unto him come, and he hath redeemed the sold thing of his brother;";
dby[25] = "If thy brother grow poor, and sell of his possession, then shall his redeemer, his nearest relation, come and redeem that which his brother sold.";
web[25] = "If thy brother shall have become poor, and have sold [some] of his possession, and if any of his kin shall come to redeem it, then shall he redeem that which his brother sold.";
hnv[25] = "If your brother becomes poor, and sells some of his possession, then his kinsman who is next to him shall come, and shall redeem that which his brother has sold.";
vul[25] = "si adtenuatus frater tuus vendiderit possessiunculam suam et voluerit propinquus eius potest redimere quod ille vendiderat";
kjv[26] = "And if the man have none to redeem it, and himself be able to redeem it;";
rsv[26] = "If a man has no one to redeem it, and then himself becomes prosperous and finds sufficient means to redeem it,";
asv[26] = "And if a man have no one to redeem it, and he be waxed rich and find sufficient to redeem it;";
yng[26] = "and when a man hath no redeemer, and his own hand hath attained, and he hath found as sufficient [for] its redemption,";
dby[26] = "And if the man have no one having right of redemption, and his hand have acquired and found what sufficeth for its redemption,";
web[26] = "And if the man shall have none to redeem it, and himself be able to redeem it;";
hnv[26] = "If a man have no one to redeem it, and he be grew rich and find sufficient to redeem it;";
vul[26] = "sin autem non habuerit proximum et ipse pretium ad redimendum potuerit invenire";
kjv[27] = "Then let him count the years of the sale thereof, and restore the overplus unto the man to whom he sold it; that he may return unto his possession.";
rsv[27] = "let him reckon the years since he sold it and pay back the overpayment to the man to whom he sold it; and he shall return to his property.";
asv[27] = "then let him reckon the years of the sale thereof, and restore the overplus unto the man to whom he sold it; and he shall return unto his possession.";
yng[27] = "then he hath reckoned the years of its sale, and hath given back that which is over to the man to whom he sold [it], and he hath returned to his possession.";
dby[27] = "then shall he reckon the years since the sale thereof, and restore the overplus unto the man to whom he sold it; and so return unto his possession.";
web[27] = "Then let him count the years of the sale of it, and restore the overplus to the man to whom he sold it; that he may return to his possession.";
hnv[27] = "then let him reckon the years of the sale of it, and restore the surplus to the man to whom he sold it; and he shall return to his possession.";
vul[27] = "conputabuntur fructus ex eo tempore quo vendidit et quod reliquum est reddet emptori sicque recipiet possessionem suam";
kjv[28] = "But if he be not able to restore [it] to him, then that which is sold shall remain in the hand of him that hath bought it until the year of jubile: and in the jubile it shall go out, and he shall return unto his possession.";
rsv[28] = "But if he has not sufficient means to get it back for himself, then what he sold shall remain in the hand of him who bought it until the year of jubilee; in the jubilee it shall be released, and he shall return to his property.";
asv[28] = "But if he be not able to get it back for himself, then that which he hath sold shall remain in the hand of him that hath bought it until the year of jubilee: and in the jubilee it shall go out, and he shall return unto his possession.";
yng[28] = "`And if his hand hath not found sufficiency to give back to him, then hath his sold thing been in the hand of him who buyeth it till the year of jubilee; and it hath gone out in the jubilee, and he hath returned to his possession.";
dby[28] = "And if his hand have not found what sufficeth for him to restore it to him, then that which is sold shall remain in the hand of the purchaser, until the year of jubilee; and in the jubilee it shall go out, and he shall return unto his possession.";
web[28] = "But if he shall not be able to restore [it] to him, then that which is sold shall remain in the hand of him that hath bought it until the year of jubilee: and in the jubilee it shall go out, and he shall return to his possession.";
hnv[28] = "But if he isn\'t able to get it back for himself, then that which he has sold shall remain in the hand of him who has bought it until the year of jubilee: and in the jubilee it shall go out, and he shall return to his possession.";
vul[28] = "quod si non invenerit manus eius ut reddat pretium habebit emptor quod emerat usque ad annum iobeleum in ipso enim omnis venditio redit ad dominum et ad possessorem pristinum";
kjv[29] = "And if a man sell a dwelling house in a walled city, then he may redeem it within a whole year after it is sold; [within] a full year may he redeem it.";
rsv[29] = "&quot;If a man sells a dwelling house in a walled city, he may redeem it within a whole year after its sale; for a full year he shall have the right of redemption.";
asv[29] = "And if a man sell a dwelling-house in a walled city, then he may redeem it within a whole year after it is sold; for a full year shall he have the right of redemption.";
yng[29] = "`And when a man selleth a dwelling-house [in] a walled city, then hath his right of redemption been until the completion of a year from its selling; days -- is his right of redemption;";
dby[29] = "And if any one sell a dwelling-house in a walled city, then he shall have the right of redemption up to the end of the year of the sale thereof; for a full year shall he have the right of redemption.";
web[29] = "And if a man shall sell a dwelling-house in a walled city, then he may redeem it within a whole year after it is sold: [within] a full year may he redeem it.";
hnv[29] = " If a man sell a dwelling-house in a walled city, then he may redeem it within a whole year after it is sold; for a full year shall he have the right of redemption.";
vul[29] = "qui vendiderit domum intra urbis muros habebit licentiam redimendi donec unus impleatur annus";
kjv[30] = "And if it be not redeemed within the space of a full year, then the house that [is] in the walled city shall be established for ever to him that bought it throughout his generations: it shall not go out in the jubile.";
rsv[30] = "If it is not redeemed within a full year, then the house that is in the walled city shall be made sure in perpetuity to him who bought it, throughout his generations; it shall not be released in the jubilee.";
asv[30] = "And if it be not redeemed within the space of a full year, then the house that is in the walled city shall be made sure in perpetuity to him that bought it, throughout his generations: it shall not go out in the jubilee.";
yng[30] = "and if it is not redeemed until the fulness to him of a perfect year, then hath the house which [is] in a walled city been established to extinction to the buyer of it, to his generations; it goeth not out in the jubilee;";
dby[30] = "But if it be not redeemed until a whole year is complete, then the house that is in the walled city shall be established for ever to him that bought it, throughout his generations: it shall not go out in the jubilee.";
web[30] = "And if it shall not be redeemed within the space of a full year, then the house that [is] in the walled city shall be established for ever to him that bought it, throughout his generations: it shall not go out in the jubilee,";
hnv[30] = "If it isn\'t redeemed within the space of a full year, then the house that is in the walled city shall be made sure in perpetuity to him who bought it, throughout his generations: it shall not go out in the jubilee.";
vul[30] = "si non redemerit et anni circulus fuerit evolutus emptor possidebit eam et posteri eius in perpetuum et redimi non poterit etiam in iobeleo";
kjv[31] = "But the houses of the villages which have no wall round about them shall be counted as the fields of the country: they may be redeemed, and they shall go out in the jubile.";
rsv[31] = "But the houses of the villages which have no wall around them shall be reckoned with the fields of the country; they may be redeemed, and they shall be released in the jubilee.";
asv[31] = "But the houses of the villages which have no wall round about them shall be reckoned with the fields of the country: they may be redeemed, and they shall go out in the jubilee.";
yng[31] = "and a house of the villages which have no wall round about, on the field of the country is reckoned; redemption is to it, and in the jubilee it goeth out.";
dby[31] = "But the houses in villages that have no wall round about them shall be reckoned as the fields of the country: they may be redeemed, and they shall go out in the jubilee.";
web[31] = "But the houses of the villages which have no walls around them, shall be counted as the fields of the country: they may be redeemed, and they shall go out in the jubilee.";
hnv[31] = "But the houses of the villages which have no wall round about them shall be reckoned with the fields of the country: they may be redeemed, and they shall go out in the jubilee.";
vul[31] = "sin autem in villa fuerit domus quae muros non habet agrorum iure vendetur si ante redempta non fuerit in iobeleo revertetur ad dominum";
kjv[32] = "Notwithstanding the cities of the Levites, [and] the houses of the cities of their possession, may the Levites redeem at any time.";
rsv[32] = "Nevertheless the cities of the Levites, the houses in the cities of their possession, the Levites may redeem at any time.";
asv[32] = "Nevertheless the cities of the Levites, the houses of the cities of their possession, may the Levites redeem at any time.";
yng[32] = "`As to cities of the Levites -- houses of the cities of their possession -- redemption age-during is to the Levites;";
dby[32] = "But as to the cities of the Levites, the houses in the cities of their possession, the Levites shall have a perpetual right of redemption.";
web[32] = "Notwithstanding the cities of the Levites, [and] the houses of the cities of their possession, may the Levites redeem at any time.";
hnv[32] = "Nevertheless the cities of the Levites, the houses of the cities of their possession, may the Levites redeem at any time.";
vul[32] = "aedes Levitarum quae in urbibus sunt semper possunt redimi";
kjv[33] = "And if a man purchase of the Levites, then the house that was sold, and the city of his possession, shall go out in [the year of] jubile: for the houses of the cities of the Levites [are] their possession among the children of Israel.";
rsv[33] = "And if one of the Levites does not exercise his right of redemption, then the house that was sold in a city of their possession shall be released in the jubilee; for the houses in the cities of the Levites are their possession among the people of Israel.";
asv[33] = "And if one of the Levites redeem, then the house that was sold, and the city of his possession, shall go out in the jubilee; for the houses of the cities of the Levites are their possession among the children of Israel.";
yng[33] = "as to him who redeemeth from the Levites, both the sale of a house and the city of his possession have gone out in the jubilee, for the houses of the cities of the Levites are their possession in the midst of the sons of Israel.";
dby[33] = "And if any one redeem from one of the Levites, then the house that was sold, in the city of his possession, shall go out in the jubilee; for the houses of the cities of the Levites are their possession among the children of Israel.";
web[33] = "And if a man shall purchase of the Levites, then the house that was sold, and the city of his possession shall go out in the [year of] jubilee; for the houses of the cities of the Levites [are] their possession among the children of Israel.";
hnv[33] = "If one of the Levites redeem, then the house that was sold, and the city of his possession, shall go out in the jubilee; for the houses of the cities of the Levites are their possession among the children of Yisra\'el.";
vul[33] = "si redemptae non fuerint in iobeleo revertentur ad dominos quia domus urbium leviticarum pro possessionibus sunt inter filios Israhel";
kjv[34] = "But the field of the suburbs of their cities may not be sold; for it [is] their perpetual possession.";
rsv[34] = "But the fields of common land belonging to their cities may not be sold; for that is their perpetual possession.";
asv[34] = "But the field of the suburbs of their cities may not be sold; for it is their perpetual possession.";
yng[34] = "And a field, a suburb of their cities, is not sold; for a possession age-during it [is] to them.";
dby[34] = "And the field of the suburbs of their cities shall not be sold; for it is their perpetual possession.";
web[34] = "But the field of the suburbs of their cities may not be sold, for it [is] their perpetual possession.";
hnv[34] = "But the field of the suburbs of their cities may not be sold; for it is their perpetual possession.";
vul[34] = "suburbana autem eorum non venient quia possessio sempiterna est";
kjv[35] = "And if thy brother be waxen poor, and fallen in decay with thee; then thou shalt relieve him: [yea, though he be] a stranger, or a sojourner; that he may live with thee.";
rsv[35] = "&quot;And if your brother becomes poor, and cannot maintain himself with you, you shall maintain him; as a stranger and a sojourner he shall live with you.";
asv[35] = "And if thy brother be waxed poor, and his hand fail with thee; then thou shalt uphold him: [as] a stranger and a sojourner shall he live with thee.";
yng[35] = "`And when thy brother is become poor, and his hand hath failed with thee, then thou hast kept hold on him, sojourner and settler, and he hath lived with thee;";
dby[35] = "And if thy brother grow poor, and he be fallen into decay beside thee, then thou shalt relieve him, [be he] stranger or sojourner, that he may live beside thee.";
web[35] = "And if thy brother shall have become poor, and fallen in decay with thee; then thou shalt relieve him: [yea, though he] may [be] a stranger, or a sojourner; that he may live with thee.";
hnv[35] = "If your brother has grown poor, and his hand fail with you; then you shall uphold him: [as] a stranger and a foreigner shall he live with you.";
vul[35] = "si adtenuatus fuerit frater tuus et infirmus manu et susceperis eum quasi advenam et peregrinum et vixerit tecum";
kjv[36] = "Take thou no usury of him, or increase: but fear thy God; that thy brother may live with thee.";
rsv[36] = "Take no interest from him or increase, but fear your God; that your brother may live beside you.";
asv[36] = "Take thou no interest of him or increase, but fear thy God; that thy brother may live with thee.";
yng[36] = "thou takest no usury from him, or increase; and thou hast been afraid of thy God; and thy brother hath lived with thee;";
dby[36] = "Thou shalt take no usury nor increase of him; and thou shalt fear thy God; that thy brother may live beside thee.";
web[36] = "Take thou no interest of him, or increase; but fear thy God; that thy brother may live with thee.";
hnv[36] = "Take no interest of him or increase, but fear your God; that your brother may live with you.";
vul[36] = "ne accipias usuras ab eo nec amplius quam dedisti time Deum tuum ut vivere possit frater tuus apud te";
kjv[37] = "Thou shalt not give him thy money upon usury, nor lend him thy victuals for increase.";
rsv[37] = "You shall not lend him your money at interest, nor give him your food for profit.";
asv[37] = "Thou shalt not give him thy money upon interest, nor give him thy victuals for increase.";
yng[37] = "thy money thou givest not to him in usury, and for increase thou givest not thy food;";
dby[37] = "Thy money shalt thou not give him upon usury, nor lend him thy victuals for increase.";
web[37] = "Thou shalt not give him thy money upon interest, nor lend him thy victuals for increase.";
hnv[37] = "You shall not give him your money on interest, nor give him your victuals for increase.";
vul[37] = "pecuniam tuam non dabis ei ad usuram et frugum superabundantiam non exiges";
kjv[38] = "I [am] the LORD your God, which brought you forth out of the land of Egypt, to give you the land of Canaan, [and] to be your God.";
rsv[38] = "I am the LORD your God, who brought you forth out of the land of Egypt to give you the land of Canaan, and to be your God.";
asv[38] = "I am Jehovah your God, who brought you forth out of the land of Egypt, to give you the land of Canaan, [and] to be your God.";
yng[38] = "I [am] Jehovah your God, who hath brought you out of the land of Egypt, to give to you the land of Canaan, to become your God.";
dby[38] = "I am Jehovah your God, who brought you forth out of the land of Egypt, to give you the land of Canaan, to be your God.";
web[38] = "I [am] the LORD your God, who brought you out of the land of Egypt, to give you the land of Canaan, [and] to be your God.";
hnv[38] = "I am the LORD your God, who brought you forth out of the land of Mitzrayim, to give you the land of Kana`an, [and] to be your God.";
vul[38] = "ego Dominus Deus vester qui eduxi vos de terra Aegypti ut darem vobis terram Chanaan et essem vester Deus";
kjv[39] = "And if thy brother [that dwelleth] by thee be waxen poor, and be sold unto thee; thou shalt not compel him to serve as a bondservant:";
rsv[39] = "&quot;And if your brother becomes poor beside you, and sells himself to you, you shall not make him serve as a slave:";
asv[39] = "And if thy brother be waxed poor with thee, and sell himself unto thee; thou shalt not make him to serve as a bond-servant.";
yng[39] = "`And when thy brother becometh poor with thee, and he hath been sold to thee, thou dost not lay on him servile service;";
dby[39] = "And if thy brother grow poor beside thee, and be sold unto thee, thou shalt not compel him to serve as a bondservant:";
web[39] = "And if thy brother [that dwelleth] by thee shall have become poor, and be sold to thee; thou shalt not compel him to serve as a bond servant:";
hnv[39] = "If your brother has grown poor with you, and sell himself to you; you shall not make him to serve as a bond-servant.";
vul[39] = "si paupertate conpulsus vendiderit se tibi frater tuus non eum opprimes servitute famulorum";
kjv[40] = "[But] as an hired servant, [and] as a sojourner, he shall be with thee, [and] shall serve thee unto the year of jubile:";
rsv[40] = "he shall be with you as a hired servant and as a sojourner. He shall serve with you until the year of the jubilee;";
asv[40] = "As a hired servant, and as a sojourner, he shall be with thee; he shall serve with thee unto the year of jubilee:";
yng[40] = "as an hireling, as a settler, he is with thee, till the year of the jubilee he doth serve with thee, --";
dby[40] = "as a hired servant, as a sojourner, shall he be with thee; until the year of jubilee shall he serve thee.";
web[40] = "[But] as a hired servant, [and] as a sojourner he shall be with thee, [and] shall serve thee to the year of jubilee.";
hnv[40] = "As a hired servant, and as a foreigner, he shall be with you; he shall serve with you to the year of jubilee:";
vul[40] = "sed quasi mercennarius et colonus erit usque ad annum iobeleum operabitur apud te";
kjv[41] = "And [then] shall he depart from thee, [both] he and his children with him, and shall return unto his own family, and unto the possession of his fathers shall he return.";
rsv[41] = "then he shall go out from you, he and his children with him, and go back to his own family, and return to the possession of his fathers.";
asv[41] = "then shall he go out from thee, he and his children with him, and shall return unto his own family, and unto the possession of his fathers shall he return.";
yng[41] = "then he hath gone out from thee, he and his sons with him, and hath turned back unto his family; even unto the possession of his fathers he doth turn back.";
dby[41] = "Then shall he depart from thee, he and his children with him, and shall return unto his own family, and unto the possession of his fathers shall he return.";
web[41] = "And [then] shall he depart from thee, [both] he and his children with him, and shall return to his own family, and to the possession of his fathers shall he return.";
hnv[41] = "then shall he go out from you, he and his children with him, and shall return to his own family, and to the possession of his fathers shall he return.";
vul[41] = "et postea egredietur cum liberis suis et revertetur ad cognationem et ad possessionem patrum suorum";
kjv[42] = "For they [are] my servants, which I brought forth out of the land of Egypt: they shall not be sold as bondmen.";
rsv[42] = "For they are my servants, whom I brought forth out of the land of Egypt; they shall not be sold as slaves.";
asv[42] = "For they are my servants, whom I brought forth out of the land of Egypt: they shall not be sold as bondmen.";
yng[42] = "`For they [are] My servants, whom I have brought out from the land of Egypt: they are not sold [with] the sale of a servant;";
dby[42] = "For they are my bondmen, whom I brought forth out of the land of Egypt: they shall not be sold as [men] sell bondmen.";
web[42] = "For they [are] my servants, which I brought out of the land of Egypt; they shall not be sold as bond-men.";
hnv[42] = "For they are my servants, whom I brought forth out of the land of Mitzrayim: they shall not be sold as bondservants.";
vul[42] = "mei enim servi sunt et ego eduxi eos de terra Aegypti non venient condicione servorum";
kjv[43] = "Thou shalt not rule over him with rigour; but shalt fear thy God.";
rsv[43] = "You shall not rule over him with harshness, but shall fear your God.";
asv[43] = "Thou shalt not rule over him with rigor, but shalt fear thy God.";
yng[43] = "thou rulest not over him with rigour, and thou hast been afraid of thy God.";
dby[43] = "Thou shalt not rule over him with rigour; and thou shalt fear thy God.";
web[43] = "Thou shalt not rule over him with rigor, but shalt fear thy God.";
hnv[43] = "You shall not rule over him with rigor, but shall fear your God.";
vul[43] = "ne adfligas eum per potentiam sed metuito Deum tuum";
kjv[44] = "Both thy bondmen, and thy bondmaids, which thou shalt have, [shall be] of the heathen that are round about you; of them shall ye buy bondmen and bondmaids.";
rsv[44] = "As for your male and female slaves whom you may have: you may buy male and female slaves from among the nations that are round about you.";
asv[44] = "And as for thy bondmen, and thy bondmaids, whom thou shalt have; of the nations that are round about you, of them shall ye buy bondmen and bondmaids.";
yng[44] = "`And thy man-servant and thy handmaid whom thou hast [are] of the nations who [are] round about you; of them ye buy man-servant and handmaid,";
dby[44] = "And as for thy bondman and thy handmaid whom thou shalt have -- of the nations that are round about you, of them shall ye buy bondmen and handmaids.";
web[44] = "Both thy bond-men, and thy bond-maids, which thou shalt have, [shall be] of the heathen that are around you; of them shall ye buy bond-men and bond-maids.";
hnv[44] = "As for your bondservants, and your bondmaids, whom you shall have; of the nations that are round about you, of them shall you buy bondservants and bondmaids.";
vul[44] = "servus et ancilla sint vobis de nationibus quae in circuitu vestro sunt";
kjv[45] = "Moreover of the children of the strangers that do sojourn among you, of them shall ye buy, and of their families that [are] with you, which they begat in your land: and they shall be your possession.";
rsv[45] = "You may also buy from among the strangers who sojourn with you and their families that are with you, who have been born in your land; and they may be your property.";
asv[45] = "Moreover of the children of the strangers that sojourn among you, of them shall ye buy, and of their families that are with you, which they have begotten in your land: and they shall be your possession.";
yng[45] = "and also of the sons of the settlers who are sojourning with you, of them ye buy, and of their families who [are] with you, which they have begotten in your land, and they have been to you for a possession;";
dby[45] = "Moreover of the children of them that dwell as sojourners with you, of them may ye buy, and of their family that is with you, which they beget in your land, and they shall be your possession.";
web[45] = "Moreover of the children of the strangers that sojourn among you, of them shall ye buy, and of their families that are with you, which they begat in your land: and they shall be your possession.";
hnv[45] = "Moreover of the children of the strangers who live as foreigners among you, of them may you buy, and of their families who are with you, which they have conceived in your land: and they shall be your possession.";
vul[45] = "et de advenis qui peregrinantur apud vos vel qui ex his nati fuerint in terra vestra hos habebitis famulos";
kjv[46] = "And ye shall take them as an inheritance for your children after you, to inherit [them for] a possession; they shall be your bondmen for ever: but over your brethren the children of Israel, ye shall not rule one over another with rigour.";
rsv[46] = "You may bequeath them to your sons after you, to inherit as a possession for ever; you may make slaves of them, but over your brethren the people of Israel you shall not rule, one over another, with harshness.";
asv[46] = "And ye shall make them an inheritance for your children after you, to hold for a possession; of them shall ye take your bondmen for ever: but over your brethren the children of Israel ye shall not rule, one over another, with rigor.";
yng[46] = "and ye have taken them for inheritance to your sons after you, to occupy [for] a possession; to the age ye lay service upon them, but upon your brethren, the sons of Israel, one with another, thou dost not rule over him with rigour.";
dby[46] = "And ye shall leave them as an inheritance to your children after you, to inherit them as a possession: these may ye make your bondmen for ever; but as for your brethren, the children of Israel, ye shall not rule over one another with rigour.";
web[46] = "And ye shall take them as an inheritance for your children after you, to inherit [them for] a possession, they shall be your bond-men for ever: but over your brethren the children of Israel, ye shall not rule one over another with rigor.";
hnv[46] = "You shall make them an inheritance for your children after you, to hold for a possession; of them shall you take your bondservants forever: but over your brothers the children of Yisra\'el you shall not rule, one over another, with rigor.";
vul[46] = "et hereditario iure transmittetis ad posteros ac possidebitis in aeternum fratres autem vestros filios Israhel ne opprimatis per potentiam";
kjv[47] = "And if a sojourner or stranger wax rich by thee, and thy brother [that dwelleth] by him wax poor, and sell himself unto the stranger [or] sojourner by thee, or to the stock of the stranger\'s family:";
rsv[47] = "&quot;If a stranger or sojourner with you becomes rich, and your brother beside him becomes poor and sells himself to the stranger or sojourner with you, or to a member of the stranger\'s family,";
asv[47] = "And if a stranger or sojourner with thee be waxed rich, and thy brother be waxed poor beside him, and sell himself unto the stranger [or] sojourner with thee, or to the stock of the stranger\'s family;";
yng[47] = "`And when the hand of a sojourner or settler with thee attaineth [riches], and thy brother with him hath become poor, and he hath been sold to a sojourner, a settler with thee, or to the root of the family of a sojourner,";
dby[47] = "And if a stranger or sojourner become wealthy beside thee, and thy brother beside him grow poor, and sell himself unto the stranger, who is settled by thee, or to a scion of the stranger\'s family,";
web[47] = "And if a sojourner or a stranger shall become rich by thee, and thy brother [that dwelleth] by him shall become poor, and sell himself to the stranger [or] sojourner by thee, or to the stock of the stranger\'s family:";
hnv[47] = "If a stranger or foreigner living with you has grown rich, and your brother has grown poor beside him, and sell himself to the stranger or foreigner living with you, or to the stock of the stranger\'s family;";
vul[47] = "si invaluerit apud vos manus advenae atque peregrini et adtenuatus frater tuus vendiderit se ei aut cuiquam de stirpe eius";

asv[48] = "after that he is sold he may be redeemed: one of his brethren may redeem him;";

dby[48] = "after that he is sold there shall be right of redemption for him; one of his brethren may redeem him.";
web[48] = "After that he is sold he may be redeemed again; one of his brethren may redeem him:";
hnv[48] = "after that he is sold he may be redeemed: one of his brothers may redeem him;";

kjv[49] = "And he shall reckon with him that bought him from the year that he was sold to him unto the year of jubile: and the price of his sale shall be according unto the number of years, according to the time of an hired servant shall it be with him.";
rsv[49] = "or his uncle, or his cousin may redeem him, or a near kinsman belonging to his family may redeem him; or if he grows rich he may redeem himself.";
asv[49] = "or his uncle, or his uncle\'s son, may redeem him, or any that is nigh of kin unto him of his family may redeem him; or if he be waxed rich, he may redeem himself.";
yng[49] = "or his uncle, or a son of his uncle, doth redeem him, or any of the relations of his flesh, of his family, doth redeem him, or -- his own hand hath attained -- then he hath been redeemed.";
dby[49] = "Either his uncle or his uncle\'s son may redeem him, or one of his next relations of his family may redeem him; or if his means be sufficient, he may redeem himself.";
web[49] = "Either his uncle, or his uncle\'s son may redeem him, or [any] that is nigh of kin to him of his family, may redeem him; or if he is able, he may redeem himself.";
hnv[49] = "or his uncle, or his uncle\'s son, may redeem him, or any who is a close relative to him of his family may redeem him; or if he has grown rich, he may redeem himself.";

kjv[50] = "If [there be] yet many years [behind], according unto them he shall give again the price of his redemption out of the money that he was bought for.";
rsv[50] = "He shall reckon with him who bought him from the year when he sold himself to him until the year of jubilee, and the price of his release shall be according to the number of years; the time he was with his owner shall be rated as the time of a hired servant.";
asv[50] = "And he shall reckon with him that bought him from the year that he sold himself to him unto the year of jubilee: and the price of his sale shall be according unto the number of years; according to the time of a hired servant shall he be with him.";
yng[50] = "`And he hath reckoned with his buyer from the year of his being sold to him till the year of jubilee, and the money of his sale hath been by the number of years; as the days of an hireling it is with him.";
dby[50] = "And he shall reckon with him that bought him from the year that he was sold to him unto the year of jubilee; and the price of his sale shall be according to the number of the years, according to the days of a hired servant shall he be with him.";
web[50] = "And he shall reckon with him that bought him, from the year that he was sold to him, to the year of jubilee: and the price of his sale shall be according to the number of years, according to the time of a hired servant shall it be with him.";
hnv[50] = "He shall reckon with him who bought him from the year that he sold himself to him to the year of jubilee: and the price of his sale shall be according to the number of years; according to the time of a hired servant shall he be with him.";
vul[50] = "supputatis dumtaxat annis a tempore venditionis suae usque ad annum iobeleum et pecunia qua venditus fuerat iuxta annorum numerum et rationem mercennarii supputata";
kjv[51] = "And if there remain but few years unto the year of jubile, then he shall count with him, [and] according unto his years shall he give him again the price of his redemption.";
rsv[51] = "If there are still many years, according to them he shall refund out of the price paid for him the price for his redemption.";
asv[51] = "If there be yet many years, according unto them he shall give back the price of his redemption out of the money that he was bought for.";
yng[51] = "`If yet many years, according to them he giveth back his redemption [money], from the money of his purchase.";
dby[51] = "If there are yet many years, according unto them shall he return his redemption [money] out of the money that he was bought for;";
web[51] = "If [there shall be] yet many years [behind], according to them he shall give again the price of his redemption out of the money that he was bought for.";
hnv[51] = " If there be yet many years, according to them he shall give back the price of his redemption out of the money that he was bought for.";
vul[51] = "si plures fuerint anni qui remanent usque ad iobeleum secundum hos reddet et pretium";
kjv[52] = "[And] as a yearly hired servant shall he be with him: [and the other] shall not rule with rigour over him in thy sight.";

asv[52] = "And if there remain but few years unto the year of jubilee, then he shall reckon with him; according unto his years shall he give back the price of his redemption.";
yng[52] = "`And if few are left of the years till the year of jubilee, then he hath reckoned with him, according to his years he doth give back his redemption [money];";
dby[52] = "and if there remain but few years unto the year of jubilee, then he shall reckon with him; according unto his [remaining] years [of service] shall he give him back his redemption [money].";
web[52] = "And if there shall remain but few years to the year of jubilee, then he shall count with him, [and] according to his years shall he give him again the price of his redemption.";
hnv[52] = "If there remain but few years to the year of jubilee, then he shall reckon with him; according to his years shall he give back the price of his redemption.";
vul[52] = "si pauci ponet rationem cum eo iuxta annorum numerum et reddet emptori quod reliquum est annorum";
kjv[53] = "And if he be not redeemed in these [years], then he shall go out in the year of jubile, [both] he, and his children with him.";
rsv[53] = "As a servant hired year by year shall he be with him; he shall not rule with harshness over him in your sight.";
asv[53] = "As a servant hired year by year shall he be with him: he shall not rule with rigor over him in thy sight.";
yng[53] = "as an hireling, year by year, he is with him, and he doth not rule him with rigour before thine eyes.";
dby[53] = "As a hired servant shall he be with him year by year; [his master] shall not rule with rigour over him before thine eyes.";
web[53] = "[And] as a yearly hired servant shall he be with him: [and the other] shall not rule with rigor over him in thy sight.";
hnv[53] = "As a servant hired year by year shall he be with him: he shall not rule with rigor over him in your sight.";
vul[53] = "quibus ante servivit mercedibus inputatis non adfliget eum violenter in conspectu tuo";
kjv[54] = "For unto me the children of Israel [are] servants; they [are] my servants whom I brought forth out of the land of Egypt: I [am] the LORD your God.";
rsv[54] = "And if he is not redeemed by these means, then he shall be released in the year of jubilee, he and his children with him.";
asv[54] = "And if he be not redeemed by these [means], then he shall go out in the year of jubilee, he, and his children with him.";
yng[54] = "`And if he is not redeemed in these [years], then he hath gone out in the year of jubilee, he and his sons with him.";
dby[54] = "And if he be not redeemed in this manner, then he shall go out in the year of jubilee, he and his children with him.";
web[54] = "And if he shall not be redeemed in these [years], then he shall go out in the year of jubilee, [both] he, and his children with him.";
hnv[54] = "If he isn\'t redeemed by these [means], then he shall go out in the year of jubilee, he, and his children with him.";
vul[54] = "quod si per haec redimi non potuerit anno iobeleo egredietur cum liberis suis";
kjv[55] = "After that he is sold he may be redeemed again; one of his brethren may redeem him:";
rsv[55] = "For to me the people of Israel are servants, they are my servants whom I brought forth out of the land of Egypt: I am the LORD your God.";
asv[55] = "For unto me the children of Israel are servants; they are my servants whom I brought forth out of the land of Egypt: I am Jehovah your God.";
yng[55] = "For to Me [are] the sons of Israel servants; My servants they [are], whom I have brought out of the land of Egypt; I, Jehovah, [am] your God.";
dby[55] = "For the children of Israel are servants unto me; they are my servants whom I brought forth out of the land of Egypt: I am Jehovah your God.";
web[55] = "For to me the children of Israel [are] servants, they [are] my servants whom I brought out of the land of Egypt: I [am] the LORD your God.";
hnv[55] = "For to me the children of Yisra\'el are servants; they are my servants whom I brought forth out of the land of Mitzrayim: I am the LORD your God.";
vul[55] = "mei sunt enim servi filii Israhel quos eduxi de terra Aegypti";
csb[1] = "The LORD spoke to Moses on Mount Sinai:";
csb[2] = "&quot;Speak to the Israelites and tell them: When you enter the land I am giving you, the land will observe a Sabbath to the LORD.";
csb[3] = "&quot;You may sow your field for six years, and you may prune your vineyard and gather its produce for six years.";
csb[4] = "&quot;But there will be a Sabbath of complete rest for the land in the seventh year, a Sabbath to the LORD: you are not to sow your field or prune your vineyard.";
csb[5] = "&quot;You are not to reap what grows by itself from your crop, or harvest the grapes of your untended vines. It is to be a year of complete rest for the land.";
csb[6] = "&quot;Whatever the land produces during the Sabbath year can be food for you -- for yourself, your male or female slave, and the hired worker or alien who resides with you.";
csb[7] = "&quot;All of its growth may serve as food for your livestock and the wild animals in your land.";
csb[8] = "&quot;You are to count seven sabbatical years, seven times seven years, so that the time period of the seven sabbatical years amounts to forty-nine.";
csb[9] = "&quot;Then you are to sound a trumpet loudly in the seventh month, on the tenth day of the month; you will sound it throughout your land on the Day of Atonement.";
csb[10] = "&quot;You are to consecrate the fiftieth year and proclaim freedom in the land for all its inhabitants. It will be your Jubilee, when each of you is to return to his property and each of you to his clan.";
csb[11] = "&quot;The fiftieth year will be your Jubilee; you are not to sow, reap what grows by itself, or harvest its untended vines.";
csb[12] = "&quot;It is to be holy to you because it is the Jubilee; you may only eat its produce directly from the field.";
csb[13] = "&quot;In this Year of Jubilee, each of you will return to his property.";
csb[14] = "&quot;If you make a sale to your neighbor or a purchase from him, do not cheat one another.";
csb[15] = "&quot;You are to make the purchase from your neighbor based on the number of years since the last Jubilee. He is to sell to you based on the number of remaining harvest years.";
csb[16] = "&quot;You are to increase its price in proportion to a greater amount of years, and decrease its price in proportion to a lesser amount of years, because what he is selling to you is a number of harvests.";
csb[17] = "&quot;You are not to cheat one another, but fear your God, for I am the LORD your God.";
csb[18] = "&quot;You are to keep my statutes and ordinances and carefully observe them, so that you may live securely in the land.";
csb[19] = "&quot;Then the land will yield its fruit, so that you can eat, be satisfied, and live securely in the land.";
csb[20] = "&quot;If you wonder: \'What will we eat in the seventh year if we don\'t sow or gather our produce? \'";
csb[21] = "&quot;I will appoint my blessing for you in the sixth year, so that it will produce a crop sufficient for three years.";
csb[22] = "&quot;When you sow in the eighth year, you will be eating from the previous harvest. You will be eating this until the ninth year when its harvest comes in.";
csb[23] = "&quot;The land is not to be permanently sold because it is mine, and you are only aliens and temporary residents on my land.";
csb[24] = "&quot;You are to allow the redemption of any land you occupy.";
csb[25] = "&quot;If your brother becomes destitute and sells part of his property, his nearest relative may come and redeem what his brother has sold.";
csb[26] = "&quot;If a man has no family redeemer, but he prospers and obtains enough to redeem his land,";
csb[27] = "&quot;he may calculate the years since its sale, repay the balance to the man he sold it to, and return to his property.";
csb[28] = "&quot;But if he cannot obtain enough to repay him, what he sold will remain in the possession of its purchaser until the Year of Jubilee. It is to be released at the Jubilee, so that he may return to his property.";
csb[29] = "&quot;If a man sells a residence in a walled city, his right of redemption will last until a year has passed after its sale; his right of redemption will last a year.";
csb[30] = "&quot;If it is not redeemed by the end of a full year, then the house in the walled city is permanently transferred to its purchaser throughout his generations. It is not to be released on the Jubilee.";
csb[31] = "&quot;But houses in settlements that have no walls around them are to be classified as open fields. The right to redeem such houses stays in effect, and they are to be released at the Jubilee.";
csb[32] = "&quot;Concerning the Levitical cities, the Levites always have the right to redeem houses in the cities they possess.";
csb[33] = "&quot;Whatever property one of the Levites can redeem -- a house sold in a city they possess -- is to be released at the Jubilee, because the houses in the Levitical cities are their possession among the Israelites.";
csb[34] = "&quot;The open pastureland around their cities may not be sold, for it is their permanent possession.";
csb[35] = "&quot;If your brother becomes destitute and cannot sustain himself among you, you are to support him as an alien or temporary resident, so that he can continue to live among you.";
csb[36] = "&quot;Do not profit or take interest from him, but fear your God and let your brother live among you.";
csb[37] = "&quot;You are not to lend him your silver with interest or sell him your food for profit.";
csb[38] = "&quot;I am the LORD your God, who brought you out of the land of Egypt to give you the land of Canaan and to be your God.";
csb[39] = "&quot;If your brother among you becomes destitute and sells himself to you, you must not force him to do slave labor.";
csb[40] = "&quot;Let him stay with you as a hired worker or temporary resident; he may work for you until the Year of Jubilee.";
csb[41] = "&quot;Then he and his children are to be released from you, and he may return to his clan and his ancestral property.";
csb[42] = "&quot;They are not to be sold as slaves, because they are my servants that I brought out of the land of Egypt.";
csb[43] = "&quot;You are not to rule over them harshly but fear your God.";
csb[44] = "&quot;Your male and female slaves are to be from the nations around you; you may purchase male and female slaves.";
csb[45] = "&quot;You may also purchase them from the aliens residing with you, or from their families living among you -- those born in your land. These may become your property.";
csb[46] = "&quot;You may leave them to your sons after you to inherit as property; you can make them slaves for life. But concerning your brothers, the Israelites, you must not rule over one another harshly.";
csb[47] = "&quot;If an alien or temporary resident living among you prospers, but your brother living near him becomes destitute and sells himself to the alien living among you, or to a member of the resident alien\'s clan,";
csb[48] = "&quot;he has the right of redemption after he has been sold. One of his brothers may redeem him.";
csb[49] = "&quot;His uncle or cousin may redeem him, or any of his close relatives from his clan may redeem him. If he prospers, he may redeem himself.";
csb[50] = "&quot;The one who purchased him is to calculate the time from the year he sold himself to him until the Year of Jubilee. The price of his sale will be determined by the number of years. It will be set for him like the daily wages of a hired worker.";
csb[51] = "&quot;If many years are still left, he must pay his redemption price in proportion to them based on his purchase price.";
csb[52] = "&quot;If only a few years remain until the Year of Jubilee, he will calculate and pay the price of his redemption in proportion to his remaining years.";
csb[53] = "&quot;He will stay with him like a man hired year by year. A resident alien is not to rule over him harshly in your sight.";
csb[54] = "&quot;If he is not redeemed in any of these ways, he and his children are to be released at the Year of Jubilee.";
csb[55] = "&quot;For the Israelites are my servants. They are my servants that I brought out of the land of Egypt; I am the LORD your God.";
</script>
