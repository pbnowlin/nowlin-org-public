csb[1] = "The LORD spoke to Moses:";
csb[2] = "&quot;Command the Israelites to bring you pure oil from crushed olives for the light, in order to keep the lamp burning regularly.";
csb[3] = "&quot;Aaron is to tend it continually from evening until morning before the LORD outside the curtain of the testimony in the tent of meeting. This is a permanent statute throughout your generations.";
csb[4] = "&quot;He must continually tend the lamps on the pure gold lampstand in the LORD\'s presence.";
csb[5] = "&quot;Take fine flour and bake it into twelve loaves; each loaf is to be made with four quarts.";
csb[6] = "&quot;Arrange them in two rows, six to a row, on the pure gold table before the LORD.";
csb[7] = "&quot;Place pure frankincense near each row, so that it may serve as a memorial portion for the bread and a fire offering to the LORD.";
csb[8] = "&quot;The bread is to be set out before the LORD every Sabbath day as a permanent covenant obligation on the part of the Israelites.";
csb[9] = "&quot;It belongs to Aaron and his sons, who are to eat it in a holy place, for it is the holiest portion for him from the fire offerings to the LORD; this is a permanent rule.&quot;";
csb[10] = "Now the son of an Israelite mother and an Egyptian father was among the Israelites. A fight broke out in the camp between the Israelite woman\'s son and an Israelite man.";
csb[11] = "Her son cursed and blasphemed the Name, and they brought him to Moses. (His mother\'s name was Shelomith, a daughter of Dibri of the tribe of Dan.)";
csb[12] = "They put him in custody until the LORD\'s decision could be made clear to them.";
csb[13] = "Then the LORD spoke to Moses:";
csb[14] = "&quot;Bring the one who has cursed to the outside of the camp and have all who heard him lay their hands on his head; then have the whole community stone him.";
csb[15] = "&quot;And tell the Israelites: If anyone curses his God, he will bear the consequences of his sin.";
csb[16] = "&quot;Whoever blasphemes the name of the LORD must be put to death; the whole community is to stone him. If he blasphemes the Name, he is to be put to death, whether the resident alien or the native.";
csb[17] = "&quot;If a man kills anyone, he must be put to death.";
csb[18] = "&quot;Whoever kills an animal is to make restitution for it, life for life.";
csb[19] = "&quot;If any man inflicts a permanent injury on his neighbor, whatever he has done is to be done to him:";
csb[20] = "&quot;fracture for fracture, eye for eye, tooth for tooth. Whatever injury he inflicted on the person, the same is to be inflicted on him.";
csb[21] = "&quot;Whoever kills an animal is to make restitution for it, but whoever kills a person is to be put to death.";
csb[22] = "&quot;You are to have the same law for the resident alien and the native, because I am the LORD your God.&quot;";
csb[23] = "After Moses spoke to the Israelites, they brought the one who had cursed to the outside of the camp and stoned him. So the Israelites did as the LORD had commanded Moses.";
