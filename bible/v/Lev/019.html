rsv[24] = "And in the fourth year all their fruit shall be holy, an offering of praise to the LORD.";
asv[24] = "But in the fourth year all the fruit thereof shall be holy, for giving praise unto Jehovah.";
yng[24] = "and in the fourth year all its fruit is holy -- praises for Jehovah.";
dby[24] = "and in the fourth year all the fruit thereof shall be holy for praise to Jehovah;";
web[24] = "But in the fourth year all its fruit shall be holy to praise the LORD [with].";
hnv[24] = " But in the fourth year all its fruit shall be holy, for giving praise to the LORD.";
vul[24] = "quarto anno omnis fructus eorum sanctificabitur laudabilis Domino";
kjv[25] = "And in the fifth year shall ye eat of the fruit thereof, that it may yield unto you the increase thereof: I [am] the LORD your God.";
rsv[25] = "But in the fifth year you may eat of their fruit, that they may yield more richly for you: I am the LORD your God.";
asv[25] = "And in the fifth year shall ye eat of the fruit thereof, that it may yield unto you the increase thereof: I am Jehovah your God.";
yng[25] = "And in the fifth year ye do eat its fruit -- to add to you its increase; I [am] Jehovah your God.";
dby[25] = "and in the fifth year shall ye eat the fruit thereof, that it may increase unto you the produce thereof: I am Jehovah your God.";
web[25] = "And in the fifth year shall ye eat of its fruit, that it may yield to you its increase: I [am] the LORD your God.";
hnv[25] = "In the fifth year you shall eat its fruit, that it may yield its increase to you. I am the LORD your God.";
vul[25] = "quinto autem anno comedetis fructus congregantes poma quae proferunt ego Dominus Deus vester";
kjv[26] = "Ye shall not eat [any thing] with the blood: neither shall ye use enchantment, nor observe times.";
rsv[26] = "&quot;You shall not eat any flesh with the blood in it. You shall not practice augury or witchcraft.";
asv[26] = "Ye shall not eat anything with the blood: neither shall ye use enchantments, nor practise augury.";
yng[26] = "`Ye do not eat with the blood; ye do not enchant, nor observe clouds.";
dby[26] = "Ye shall eat nothing with the blood. -- Ye shall not practise enchantment, nor use auguries.";
web[26] = "Ye shall not eat [any thing] with the blood: neither shall ye use enchantment, nor observe times.";
hnv[26] = "&quot;\'You shall not eat any meat with the blood still in it; neither shall you use enchantments, nor practice sorcery.";
vul[26] = "non comedetis cum sanguine non augurabimini nec observabitis somnia";
kjv[27] = "Ye shall not round the corners of your heads, neither shalt thou mar the corners of thy beard.";
rsv[27] = "You shall not round off the hair on your temples or mar the edges of your beard.";
asv[27] = "Ye shall not round the corners of your heads, neither shalt thou mar the corners of thy beard.";
yng[27] = "`Ye do not round the corner of your head, nor destroy the corner of thy beard.";
dby[27] = "-- Ye shall not shave the corners of your head round, neither shalt thou mutilate the corners of thy beard.";
web[27] = "Ye shall not round the corners of your heads, neither shalt thou mar the corners of thy beard.";
hnv[27] = "You shall not cut the hair on the sides of your heads, neither shall you clip off the edge of your beard.";
vul[27] = "neque in rotundum adtondebitis comam nec radatis barbam";
kjv[28] = "Ye shall not make any cuttings in your flesh for the dead, nor print any marks upon you: I [am] the LORD.";
rsv[28] = "You shall not make any cuttings in your flesh on account of the dead or tattoo any marks upon you: I am the LORD.";
asv[28] = "Ye shall not make any cuttings in your flesh for the dead, nor print any marks upon you: I am Jehovah.";
yng[28] = "`And a cutting for the soul ye do not put in your flesh; and a writing, a cross-mark, ye do not put on you; I [am] Jehovah.";
dby[28] = "And cuttings for a dead person shall ye not make in your flesh, nor put any tattoo writing upon you: I am Jehovah.";
web[28] = "Ye shall not make any cuttings in your flesh for the dead, nor print any marks upon you: I [am] the LORD.";
hnv[28] = "&quot;\'You shall not make any cuttings in your flesh for the dead, nor tattoo any marks on you. I am the LORD.";
vul[28] = "et super mortuo non incidetis carnem vestram neque figuras aliquas et stigmata facietis vobis ego Dominus";
kjv[29] = "Do not prostitute thy daughter, to cause her to be a whore; lest the land fall to whoredom, and the land become full of wickedness.";
rsv[29] = "&quot;Do not profane your daughter by making her a harlot, lest the land fall into harlotry and the land become full of wickedness.";
asv[29] = "Profane not thy daughter, to make her a harlot; lest the land fall to whoredom, and the land become full of wickedness.";
yng[29] = "`Thou dost not pollute thy daughter to cause her to go a-whoring, that the land go not a-whoring, and the land hath been full of wickedness.";
dby[29] = "-- Do not profane thy daughter, to give her up to whoredom; lest the land practise whoredom, and the land become full of infamy.";
web[29] = "Do not prostitute thy daughter to cause her to be a harlot: lest the land should fall to lewdness, and the land become full of wickedness.";
hnv[29] = "Don\'t profane your daughter, to make her a prostitute; lest the land fall to prostitution, and the land become full of wickedness.";
vul[29] = "ne prostituas filiam tuam et contaminetur terra et impleatur piaculo";

rsv[30] = "You shall keep my sabbaths and reverence my sanctuary: I am the LORD.";
asv[30] = "Ye shall keep my sabbaths, and reverence my sanctuary: I am Jehovah.";
yng[30] = "`My sabbaths ye do keep, and My sanctuary ye do reverence; I [am] Jehovah.";
dby[30] = "-- My sabbaths shall ye keep, and my sanctuary shall ye reverence: I am Jehovah.";
web[30] = "Ye shall keep my sabbaths, and reverence my sanctuary: I [am] the LORD.";
hnv[30] = "&quot;\'You shall keep my Shabbatot, and reverence my sanctuary; I am the LORD.";
vul[30] = "sabbata mea custodite et sanctuarium meum metuite ego Dominus";
kjv[31] = "Regard not them that have familiar spirits, neither seek after wizards, to be defiled by them: I [am] the LORD your God.";
rsv[31] = "&quot;Do not turn to mediums or wizards; do not seek them out, to be defiled by them: I am the LORD your God.";
asv[31] = "Turn ye not unto them that have familiar spirits, nor unto the wizards; seek them not out, to be defiled by them: I am Jehovah your God.";
yng[31] = "`Ye do not turn unto those having familiar spirits; and unto wizards ye do not seek, for uncleanness by them; I [am] Jehovah your God.";
dby[31] = "-- Turn not unto necromancers and unto soothsayers; seek not after them to make yourselves unclean: I am Jehovah your God.";
web[31] = "Regard not them that have familiar spirits, neither seek after wizards, to be defiled by them: I [am] the LORD your God.";
hnv[31] = "&quot;\'Don\'t turn to those who are mediums, nor to the wizards. Don\'t seek them out, to be defiled by them. I am the LORD your God.";
vul[31] = "ne declinetis ad magos nec ab ariolis aliquid sciscitemini ut polluamini per eos ego Dominus Deus vester";
kjv[32] = "Thou shalt rise up before the hoary head, and honour the face of the old man, and fear thy God: I [am] the LORD.";
rsv[32] = "&quot;You shall rise up before the hoary head, and honor the face of an old man, and you shall fear your God: I am the LORD.";
asv[32] = "Thou shalt rise up before the hoary head, and honor the face of the old man, and thou shalt fear thy God: I am Jehovah.";
yng[32] = "`At the presence of grey hairs thou dost rise up, and thou hast honoured the presence of an old man, and hast been afraid of thy God; I [am] Jehovah.";
dby[32] = "Before the hoary head thou shalt rise up, and shalt honour the face of an old man; and thou shalt fear thy God: I am Jehovah.";
web[32] = "Thou shalt rise up before the hoary head, and honor the face of the old man, and fear thy God: I [am] the LORD.";
hnv[32] = "You shall rise up before the gray head, and honor the face of an old man, and you shall fear your God. I am the LORD.";
vul[32] = "coram cano capite consurge et honora personam senis et time Deum tuum ego sum Dominus";
kjv[33] = "And if a stranger sojourn with thee in your land, ye shall not vex him.";
rsv[33] = "&quot;When a stranger sojourns with you in your land, you shall not do him wrong.";
asv[33] = "And if a stranger sojourn with thee in your land, ye shall not do him wrong.";
yng[33] = "`And when a sojourner sojourneth with thee in your land, thou dost not oppress him;";
dby[33] = "And if a stranger sojourn with thee in your land, ye shall not molest him.";
web[33] = "And if a stranger shall sojourn with thee in your land, ye shall not oppress him.";
hnv[33] = "&quot;\'If a stranger lives as a foreigner with you in your land, you shall not do him wrong.";
vul[33] = "si habitaverit advena in terra vestra et moratus fuerit inter vos ne exprobretis ei";
kjv[34] = "[But] the stranger that dwelleth with you shall be unto you as one born among you, and thou shalt love him as thyself; for ye were strangers in the land of Egypt: I [am] the LORD your God.";
rsv[34] = "The stranger who sojourns with you shall be to you as the native among you, and you shall love him as yourself; for you were strangers in the land of Egypt: I am the LORD your God.";
asv[34] = "The stranger that sojourneth with you shall be unto you as the home-born among you, and thou shalt love him as thyself; for ye were sojourners in the land of Egypt: I am Jehovah your God.";
yng[34] = "as a native among you is the sojourner to you who is sojourning with you, and thou hast had love to him as to thyself, for sojourners ye have been in the land of Egypt; I [am] Jehovah your God.";
dby[34] = "As one born among you shall the stranger who sojourneth with you be unto you; and thou shalt love him as thyself; for ye were strangers in the land of Egypt: I am Jehovah your God.";
web[34] = "[But] the stranger that dwelleth with you shall be to you as one born among you, and thou shalt love him as thyself; for ye were strangers in the land of Egypt: I [am] the LORD your God.";
hnv[34] = "The stranger who lives as a foreigner with you shall be to you as the native-born among you, and you shall love him as yourself; for you lived as foreigners in the land of Mitzrayim. I am the LORD your God.";

asv[35] = "Ye shall do no unrighteousness in judgment, in measures of length, of weight, or of quantity.";
yng[35] = "`Ye do not do perversity in judgment, in mete-yard, in weight, or in liquid measure;";
dby[35] = "Ye shall do no unrighteousness in judgment, in measure of length, in weight, and in measure of capacity:";

hnv[35] = "&quot;\'You shall do no unrighteousness in judgment, in measures of length, of weight, or of quantity.";
vul[35] = "nolite facere iniquum aliquid in iudicio in regula in pondere in mensura";

rsv[36] = "You shall have just balances, just weights, a just ephah, and a just hin: I am the LORD your God, who brought you out of the land of Egypt.";

rsv[37] = "And you shall observe all my statutes and all my ordinances, and do them: I am the LORD.&quot;";
asv[37] = "And ye shall observe all my statutes, and all mine ordinances, and do them: I am Jehovah.";
yng[37] = "and ye have observed all my statutes, and all my judgments, and have done them; I [am] Jehovah.\'";
dby[37] = "And ye shall observe all my statutes, and all mine ordinances, and do them: I am Jehovah.";
web[37] = "Therefore shall ye observe all my statutes, and all my judgments, and do them: I [am] the LORD.";
hnv[37] = "You shall observe all my statutes, and all my ordinances, and do them. I am the LORD.\'&quot;";

csb[1] = "The LORD spoke to Moses:";
csb[2] = "&quot;Speak to the entire Israelite community and tell them: Be holy because I, the LORD your God, am holy.";
csb[3] = "&quot;Each of you is to respect his mother and father. You are to keep my Sabbaths; I am the LORD your God.";
csb[4] = "&quot;Do not turn to idols or make cast images of gods for yourselves; I am the LORD your God.";
csb[5] = "&quot;When you offer a fellowship sacrifice to the LORD, sacrifice it so that you may be accepted.";
csb[6] = "&quot;It is to be eaten on the day you sacrifice it or on the next day, but what remains on the third day must be burned.";
csb[7] = "&quot;If any is eaten on the third day, it is a repulsive thing; it will not be accepted.";
csb[8] = "&quot;Anyone who eats it will bear his iniquity, for he has profaned what is holy to the LORD. That person is to be cut off from his people.";
csb[9] = "&quot;When you reap the harvest of your land, you are not to reap to the very edge of your field or gather the gleanings of your harvest.";
csb[10] = "&quot;Do not strip your vineyard bare or gather its fallen grapes. Leave them for the poor and the resident alien; I am the LORD your God.";
csb[11] = "&quot;Do not steal. Do not act deceptively or lie to one another.";
csb[12] = "&quot;Do not swear falsely by my name, profaning the name of your God; I am the LORD.";
csb[13] = "&quot;Do not oppress your neighbor or rob him. The wages due a hired worker must not remain with you until morning.";
csb[14] = "&quot;Do not curse the deaf or put a stumbling block in front of the blind, but you are to fear your God; I am the LORD.";
csb[15] = "&quot;Do not act unjustly when deciding a case. Do not be partial to the poor or give preference to the rich; judge your neighbor fairly.";
csb[16] = "&quot;Do not go about spreading slander among your people; do not jeopardize your neighbor\'s life; I am the LORD.";
csb[17] = "&quot;Do not harbor hatred against your brother. Rebuke your neighbor directly, and you will not incur guilt because of him.";
csb[18] = "&quot;Do not take revenge or bear a grudge against members of your community, but love your neighbor as yourself; I am the LORD.";
csb[19] = "&quot;You are to keep my statutes. Do not crossbreed two different kinds of your livestock, sow your fields with two kinds of seed, or put on a garment made of two kinds of material.";
csb[20] = "&quot;If a man has sexual intercourse with a woman who is a slave designated for another man, but she has not been redeemed or given her freedom, there must be punishment. They are not to be put to death, because she had not been freed.";
csb[21] = "&quot;However, he must bring a ram as his guilt offering to the LORD at the entrance to the tent of meeting.";
csb[22] = "&quot;The priest will make atonement on his behalf before the LORD with the ram of the guilt offering for the sin he has committed, and he will be forgiven for the sin he committed.";
csb[23] = "&quot;When you come into the land and plant any kind of tree for food, you are to consider the fruit forbidden. It will be forbidden to you for three years; it is not to be eaten.";
csb[24] = "&quot;In the fourth year all its fruit is to be consecrated as a praise offering to the LORD.";
csb[25] = "&quot;But in the fifth year you may eat its fruit. In this way its yield will increase for you; I am the LORD your God.";
csb[26] = "&quot;You are not to eat anything with blood in it. You are not to practice divination or witchcraft.";
csb[27] = "&quot;You are not to cut off the hair at the sides of your head or mar the edge of your beard.";
csb[28] = "&quot;You are not to make gashes on your bodies for the dead or put tattoo marks on yourselves; I am the LORD.";
csb[29] = "&quot;Do not debase your daughter by making her a prostitute, or the land will be prostituted and filled with depravity.";
csb[30] = "&quot;Keep my Sabbaths and revere my sanctuary; I am the LORD.";
csb[31] = "&quot;Do not turn to mediums or consult spiritists, or you will be defiled by them; I am the LORD your God.";
csb[32] = "&quot;You are to rise in the presence of the elderly and honor the old. Fear your God; I am the LORD.";
csb[33] = "&quot;When an alien resides with you in your land, you must not oppress him.";
csb[34] = "&quot;You will regard the alien who resides with you as the native-born among you. You are to love him as yourself, for you were aliens in the land of Egypt; I am the LORD your God.";
csb[35] = "&quot;Do not be unfair in measurements of length, weight, or volume.";
csb[36] = "&quot;You are to have honest balances, honest weights, an honest dry measure, and an honest liquid measure; I am the LORD your God, who brought you out of the land of Egypt.";
csb[37] = "&quot;Keep all my statutes and all my ordinances and do them; I am the LORD.&quot;";
