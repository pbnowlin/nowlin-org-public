kjv[49] = "And if it spread much abroad in the skin, then the priest shall pronounce him unclean: it [is] a plague.";
rsv[49] = "if the disease shows greenish or reddish in the garment, whether in warp or woof or in skin or in anything made of skin, it is a leprous disease and shall be shown to the priest.";
asv[49] = "if the plague be greenish or reddish in the garment, or in the skin, or in the warp, or in the woof, or in anything of skin; it is the plague of leprosy, and shall be showed unto the priest.";
yng[49] = "and the plague hath been very green or very red in the garment, or in the skin, or in the warp, or in the woof, or in any vessel of skin, it [is] a plague of leprosy, and it hath been shewn the priest.";
dby[49] = "and the sore is greenish or reddish in the garment, or in the skin, or in the warp, or in the woof, or in anything of skin, it is the sore of leprosy, and shall be shewn unto the priest.";
web[49] = "And if the plague is greenish or reddish in the garment, or in the skin, either in the warp, or in the woof, or in any thing of skin: it [is] a plague of leprosy, and shall be shown to the priest:";
hnv[49] = "if the plague is greenish or reddish in the garment, or in the skin, or in the warp, or in the woof, or in anything made of skin; it is the plague of leprosy, and shall be shown to the Kohen.";
vul[49] = "si alba aut rufa macula fuerit infecta lepra reputabitur ostendeturque sacerdoti";
kjv[50] = "But if the bright spot stay in his place, [and] spread not, it [is] a burning boil; and the priest shall pronounce him clean.";
rsv[50] = "And the priest shall examine the disease, and shut up that which has the disease for seven days;";
asv[50] = "And the priest shall look upon the plague, and shut up [that which hath] the plague seven days:";
yng[50] = "`And the priest hath seen the plague, and hath shut up [that which hath] the plague, seven days;";
dby[50] = "And the priest shall look on the sore, and shall shut up [that which hath] the sore seven days.";
web[50] = "And the priest shall look upon the plague, and shut up [that which hath] the plague seven days:";
hnv[50] = "The Kohen shall examine the plague, and isolate the plague seven days.";
vul[50] = "qui consideratam recludet septem diebus";
kjv[51] = "Or if there be [any] flesh, in the skin whereof [there is] a hot burning, and the quick [flesh] that burneth have a white bright spot, somewhat reddish, or white;";
rsv[51] = "then he shall examine the disease on the seventh day. If the disease has spread in the garment, in warp or woof, or in the skin, whatever be the use of the skin, the disease is a malignant leprosy; it is unclean.";
asv[51] = "and he shall look on the plague on the seventh day: if the plague be spread in the garment, either in the warp, or in the woof, or in the skin, whatever service skin is used for; the plague is a fretting leprosy; it is unclean.";
yng[51] = "and he hath seen the plague on the seventh day, and the plague hath spread in the garment, or in the warp, or in the woof, or in the skin, of all that is made of skin for work; the plague [is] a fretting leprosy, it [is] unclean.";
dby[51] = "And he shall see the sore on the seventh day: if the sore have spread in the garment, either in the warp or in the woof, or in a skin, in any work that may be made of skin, the sore is a corroding leprosy: it is unclean.";
web[51] = "And he shall look on the plague on the seventh day: if the plague is spread in the garment, either in the warp, or in the woof, [or] in a skin, [or] in any work that is made of skin: the plague [is] a fretting leprosy; it [is] unclean.";
hnv[51] = "He shall examine the plague on the seventh day. If the plague has spread in the garment, either in the warp, or in the woof, or in the skin, whatever use the skin is used for, the plague is a destructive mildew. It is unclean.";
vul[51] = "et die septimo rursus aspiciens si crevisse deprehenderit lepra perseverans est pollutum iudicabit vestimentum et omne in quo fuerit inventa";
kjv[52] = "Then the priest shall look upon it: and, behold, [if] the hair in the bright spot be turned white, and it [be in] sight deeper than the skin; it [is] a leprosy broken out of the burning: wherefore the priest shall pronounce him unclean: it [is] the plague of leprosy.";
rsv[52] = "And he shall burn the garment, whether diseased in warp or woof, woolen or linen, or anything of skin, for it is a malignant leprosy; it shall be burned in the fire.";
asv[52] = "And he shall burn the garment, whether the warp or the woof, in woollen or in linen, or anything of skin, wherein the plague is: for it is a fretting leprosy; it shall be burnt in the fire.";
yng[52] = "`And he hath burnt the garment, or the warp, or the woof, in wool or in linen, or any vessel of skin in which the plague is; for it [is] a fretting leprosy; with fire it is burnt.";
dby[52] = "And they shall burn the garment, or the warp or the woof, of wool or of linen, or anything of skin, wherein the sore is; for it is a corroding leprosy: it shall be burned with fire.";
web[52] = "He shall therefore burn that garment, whether warp or woof, in woolen or in linen, or any thing of skin, in which the plague is: for it [is] a fretting leprosy; it shall be burnt in the fire.";
hnv[52] = "He shall burn the garment, whether the warp or the woof, in wool or in linen, or anything of skin, in which the plague is: for it is a destructive mildew. It shall be burned in the fire.";
vul[52] = "et idcirco conburetur flammis";
kjv[53] = "But if the priest look on it, and, behold, [there be] no white hair in the bright spot, and it [be] no lower than the [other] skin, but [be] somewhat dark; then the priest shall shut him up seven days:";
rsv[53] = "&quot;And if the priest examines, and the disease has not spread in the garment in warp or woof or in anything of skin,";
asv[53] = "And if the priest shall look, and, behold, the plague be not spread in the garment, either in the warp, or in the woof, or in anything of skin;";
yng[53] = "`And if the priest see, and lo, the plague hath not spread in the garment, or in the warp, or in the woof, or in any vessel of skin,";
dby[53] = "But if the priest look, and behold, the sore hath not spread in the garment, or in the warp, or in the woof, or in anything of skin,";
web[53] = "And if the priest shall look, and behold, the plague is not spread in the garment, either in the warp or in the woof, or in any thing of skin;";
hnv[53] = "&quot;If the Kohen examines it, and, behold, the plague hasn\'t spread in the garment, either in the warp, or in the woof, or in anything of skin;";
vul[53] = "quod si eam viderit non crevisse";
kjv[54] = "And the priest shall look upon him the seventh day: [and] if it be spread much abroad in the skin, then the priest shall pronounce him unclean: it [is] the plague of leprosy.";
rsv[54] = "then the priest shall command that they wash the thing in which is the disease, and he shall shut it up seven days more;";
asv[54] = "then the priest shall command that they wash the thing wherein the plague is, and he shall shut it up seven days more:";
yng[54] = "then hath the priest commanded, and they have washed that in which the plague [is], and he hath shut it up a second seven days.";
dby[54] = "then the priest shall command that they wash the thing wherein the sore is, and he shall shut it up seven days a second time.";
web[54] = "Then the priest shall command that they wash [the thing] in which the plague [is], and he shall shut it up seven days more:";
hnv[54] = "then the Kohen shall command that they wash the thing in which the plague is, and he shall isolate it seven more days.";
vul[54] = "praecipiet et lavabunt id in quo lepra est recludetque illud septem diebus aliis";
kjv[55] = "And if the bright spot stay in his place, [and] spread not in the skin, but it [be] somewhat dark; it [is] a rising of the burning, and the priest shall pronounce him clean: for it [is] an inflammation of the burning.";
rsv[55] = "and the priest shall examine the diseased thing after it has been washed. And if the diseased spot has not changed color, though the disease has not spread, it is unclean; you shall burn it in the fire, whether the leprous spot is on the back or on the front.";
asv[55] = "and the priest shall look, after that the plague is washed; and, behold, if the plague have not changed its color, and the plague be not spread, it is unclean; thou shalt burn it in the fire: it is a fret, whether the bareness be within or without.";
yng[55] = "And the priest hath seen [that which hath] the plague after it hath been washed, and lo, the plague hath not changed its aspect, and the plague hath not spread, -- it [is] unclean; with fire thou dost burn it; it [is] a fretting in its back-part or in its front-part.";
dby[55] = "And the priest shall look on the sore after the washing, and behold, if the sore have not changed its appearance, and the sore have not spread, it is unclean: thou shalt burn it with fire: it is a fretting sore on what is threadbare or where the nap is gone.";
web[55] = "And the priest shall look on the plague after it is washed: and behold, [if] the plague hath not changed its color, and the plague hath not spread; it [is] unclean; thou shalt burn it in the fire; it [is] fret inward, [whether] it [is] bare within or without.";
hnv[55] = "Then the Kohen shall examine it, after the plague is washed; and, behold, if the plague hasn\'t changed its color, and the plague hasn\'t spread, it is unclean; you shall burn it in the fire. It is a mildewed spot, whether the bareness is inside or outside.";
vul[55] = "et cum viderit faciem quidem pristinam non reversam nec tamen crevisse lepram inmundum iudicabit et igne conburet eo quod infusa sit in superficie vestimenti vel per totum lepra";
kjv[56] = "If a man or woman have a plague upon the head or the beard;";
rsv[56] = "&quot;But if the priest examines, and the disease is dim after it is washed, he shall tear the spot out of the garment or the skin or the warp or woof;";
asv[56] = "And if the priest look, and, behold, the plague be dim after the washing thereof, then he shall rend it out of the garment, or out of the skin, or out of the warp, or out of the woof:";
yng[56] = "`And if the priest hath seen, and lo, the plague [is] become weak after it hath been washed, then he hath rent it out of the garment, or out of the skin, or out of the warp, or out of the woof;";
dby[56] = "But if the priest look, and behold, the sore hath become pale after the washing of it, then he shall rend it from the garment, or from the skin, or from the warp, or from the woof.";
web[56] = "And if the priest shall look, and behold, the plague [is] somewhat dark after the washing of it; then he shall rend it out of the garment, or out of the skin, or out of the warp, or out of the woof:";
hnv[56] = " If the Kohen looks, and, behold, the plague has faded after it is washed, then he shall tear it out of the garment, or out of the skin, or out of the warp, or out of the woof:";
vul[56] = "sin autem obscurior fuerit locus leprae postquam vestis est lota abrumpet eum et a solido dividet";
kjv[57] = "Then the priest shall see the plague: and, behold, if it [be] in sight deeper than the skin; [and there be] in it a yellow thin hair; then the priest shall pronounce him unclean: it [is] a dry scall, [even] a leprosy upon the head or beard.";
rsv[57] = "then if it appears again in the garment, in warp or woof, or in anything of skin, it is spreading; you shall burn with fire that in which is the disease.";
asv[57] = "and if it appear still in the garment, either in the warp, or in the woof, or in anything of skin, it is breaking out: thou shalt burn that wherein the plague is with fire.";
yng[57] = "and if it still be seen in the garment, or in the warp, or in the woof, or in any vessel of skin, it [is] a fretting; with fire thou dost burn it -- that in which the plague [is].";
dby[57] = "And if it appear still in the garment, or in the warp, or in the woof, or in anything of skin, it is a [leprosy] breaking out: thou shalt burn with fire that wherein the sore is.";
web[57] = "And if it shall appear still in the garment, either in the warp, or in the woof, or in any thing of skin; it [is] a spreading [plague]: thou shalt burn that in which the plague [is], with fire.";
hnv[57] = "and if it appears again in the garment, either in the warp, or in the woof, or in anything of skin, it is spreading. You shall burn with fire that in which the plague is.";
vul[57] = "quod si ultra apparuerit in his locis quae prius inmaculata erant lepra volatilis et vaga debet igne conburi";
kjv[58] = "And if the priest look on the plague of the scall, and, behold, it [be] not in sight deeper than the skin, and [that there is] no black hair in it; then the priest shall shut up [him that hath] the plague of the scall seven days:";
rsv[58] = "But the garment, warp or woof, or anything of skin from which the disease departs when you have washed it, shall then be washed a second time, and be clean.&quot;";
asv[58] = "And the garment, either the warp, or the woof, or whatsoever thing of skin it be, which thou shalt wash, if the plague be departed from them, then it shall be washed the second time, and shall be clean.";
yng[58] = "`And the garment, or the warp, or the woof, or any vessel of skin which thou dost wash when the plague hath turned aside from them, then it hath been washed a second time, and hath been clean.";
dby[58] = "But the garment, or the warp, or the woof, or whatever thing of skin which thou hast washed, and the sore departeth from them, it shall be washed a second time, and it is clean.";
web[58] = "And the garment, either warp, or woof, or whatever thing of skin [it is], which thou shalt wash, if the plague hath departed from them, then it shall be washed the second time, and shall be clean.";
hnv[58] = "The garment, either the warp, or the woof, or whatever thing of skin it is, which you shall wash, if the plague has departed from them, then it shall be washed the second time, and it will be clean.&quot;";
vul[58] = "si cessaverit lavabit ea quae pura sunt secundo et munda erunt";
kjv[59] = "And in the seventh day the priest shall look on the plague: and, behold, [if] the scall spread not, and there be in it no yellow hair, and the scall [be] not in sight deeper than the skin;";
rsv[59] = "This is the law for a leprous disease in a garment of wool or linen, either in warp or woof, or in anything of skin, to decide whether it is clean or unclean.";
asv[59] = "This is the law of the plague of leprosy in a garment of woollen or linen, either in the warp, or the woof, or anything of skin, to pronounce it clean, or to pronounce it unclean.";
yng[59] = "`This [is] the law of a plague of leprosy [in] a garment of wool or of linen, or of the warp or of the woof, or of any vessel of skin, to pronounce it clean or to pronounce it unclean.\'";
dby[59] = "This is the law of the sore of leprosy in a garment of wool or linen, or in the warp, or in the woof, or in anything of skin, to cleanse it, or to pronounce it unclean.";
web[59] = "This [is] the law of the plague of leprosy in a garment of woolen or linen, either in the warp or woof, or any thing of skins, to pronounce it clean, or to pronounce it unclean.";
hnv[59] = "This is the law of the plague of mildew in a garment of wool or linen, either in the warp, or the woof, or in anything of skin, to pronounce it clean, or to pronounce it unclean.";
vul[59] = "ista est lex leprae vestimenti lanei et linei staminis atque subteminis omnisque supellectilis pelliciae quomodo mundari debeat vel contaminari";
csb[1] = "The LORD spoke to Moses and Aaron:";
csb[2] = "&quot;When a person has a swelling, scab, or spot on the skin of his body, and it may be a serious disease on the skin of his body, he is to be brought to the priest Aaron or to one of his sons, the priests.";
csb[3] = "&quot;The priest will examine the sore on the skin of his body. If the hair in the sore has turned white and the sore appears to be deeper than the skin of his body, it is in fact a serious skin disease. After the priest examines him, he must pronounce him unclean.";
csb[4] = "&quot;But if the spot on the skin of his body is white and does not appear to be deeper than the skin, and the hair in it has not turned white, the priest will quarantine the stricken person for seven days.";
csb[5] = "&quot;The priest will then reexamine him on the seventh day. If he sees that the sore remains unchanged and has not spread on the skin, the priest will quarantine him for another seven days.";
csb[6] = "&quot;The priest will examine him again on the seventh day. If the sore has faded and has not spread on the skin, the priest is to pronounce him clean; it is a scab. The person is to wash his clothes and will become clean.";
csb[7] = "&quot;But if the scab spreads further on his skin after he has presented himself to the priest for his cleansing, he is to present himself again to the priest.";
csb[8] = "&quot;The priest will examine him, and if the scab has spread on the skin, then the priest must pronounce him unclean; he has a serious skin disease.";
csb[9] = "&quot;When a case of serious skin disease may have developed on a person, he is to be brought to the priest.";
csb[10] = "&quot;The priest will examine him. If there is a white swelling on the skin that has turned the hair white, and there is a patch of raw flesh in the swelling,";
csb[11] = "&quot;it is a chronic serious disease on the skin of his body, and the priest must pronounce him unclean. He need not quarantine him, for he is unclean.";
csb[12] = "&quot;But if the skin disease breaks out all over the skin so that it covers all the skin of the stricken person from his head to his feet so far as the priest can see,";
csb[13] = "&quot;the priest will look, and if the skin disease has covered his entire body, he is to pronounce the stricken person clean. Since he has turned totally white, he is clean.";
csb[14] = "&quot;But whenever raw flesh appears on him, he will be unclean.";
csb[15] = "&quot;When the priest examines the raw flesh, he must pronounce him unclean. Raw flesh is unclean; this is a serious skin disease.";
csb[16] = "&quot;But if the raw flesh changes and turns white, he is to go to the priest.";
csb[17] = "&quot;The priest will examine him, and if the sore has turned white, the priest must pronounce the stricken person clean; he is clean.";
csb[18] = "&quot;When a boil appears on the skin of someone\'s body and it heals,";
csb[19] = "&quot;and a white swelling or a reddish-white spot develops where the boil was, the person is to present himself to the priest.";
csb[20] = "&quot;The priest will make an examination, and if the spot seems to be beneath the skin and the hair in it has turned white, the priest must pronounce him unclean; it is a case of serious skin disease that has broken out in the boil.";
csb[21] = "&quot;But when the priest examines it, if there is no white hair in it, and it is not beneath the skin but is faded, the priest will quarantine him seven days.";
csb[22] = "&quot;If it spreads further on the skin, the priest must pronounce him unclean; it is in fact a disease.";
csb[23] = "&quot;But if the spot remains where it is and does not spread, it is only the scar from the boil. The priest is to pronounce him clean.";
csb[24] = "&quot;When there is a burn on the skin of one\'s body produced by fire, and the patch made raw by the burn becomes reddish-white or white,";
csb[25] = "&quot;the priest is to examine it. If the hair in the spot has turned white and the spot appears to be deeper than the skin, it is a serious skin disease that has broken out in the burn. The priest must pronounce him unclean; it is a serious skin disease.";
csb[26] = "&quot;But when the priest examines it, if there is no white hair in the spot and it is not beneath the skin but is faded, the priest will quarantine him seven days.";
csb[27] = "&quot;The priest will reexamine him on the seventh day. If it has spread further on the skin, the priest must pronounce him unclean; it is in fact a case of serious skin disease.";
csb[28] = "&quot;But if the spot has remained where it was and has not spread on the skin but is faded, it is the swelling from the burn. The priest is to pronounce him clean, for it is only the scar from the burn.";
csb[29] = "&quot;When a man or woman has a condition on the head or chin,";
csb[30] = "&quot;the priest is to examine the condition. If it appears to be deeper than the skin, and the hair in it is yellow and sparse, the priest must pronounce the person unclean. It is a scaly outbreak, a serious skin disease of the head or chin.";
csb[31] = "&quot;When the priest examines the scaly condition, if it does not appear to be deeper than the skin, and there is no black hair in it, the priest will quarantine the person with the scaly condition for seven days.";
csb[32] = "&quot;The priest will reexamine the condition on the seventh day. If the scaly outbreak has not spread and there is no yellow hair in it and it does not appear to be deeper than the skin,";
csb[33] = "&quot;the person is to shave himself but not shave the scaly area. Then the priest will quarantine the person who has the scaly outbreak for another seven days.";
csb[34] = "&quot;The priest will examine the scaly outbreak on the seventh day, and if it has not spread on the skin and does not appear to be deeper than the skin, the priest is to pronounce the person clean. He is to wash his clothes, and he will be clean.";
csb[35] = "&quot;But if the scaly outbreak spreads further on the skin after his cleansing,";
csb[36] = "&quot;the priest is to examine the person. If the scaly outbreak has spread on the skin, the priest does not need to look for yellow hair; the person is unclean.";
csb[37] = "&quot;But if as far as he can see, the scaly outbreak remains unchanged and black hair has grown in it, then it has healed; he is clean. The priest is to pronounce the person clean.";
csb[38] = "&quot;When a man or a woman has white spots on the skin of the body,";
csb[39] = "&quot;the priest is to make an examination. If the spots on the skin of the body are dull white, it is only a rash that has broken out on the skin; the person is clean.";
csb[40] = "&quot;If a man loses the hair of his head, he is bald, but he is clean.";
csb[41] = "&quot;Or if he loses the hair at his hairline, he is bald on his forehead, but he is clean.";
csb[42] = "&quot;But if there is a reddish-white condition on the bald head or forehead, it is a serious skin disease breaking out on his head or forehead.";
csb[43] = "&quot;The priest is to examine him, and if the swelling of the condition on his bald head or forehead is reddish-white, like the appearance of a serious skin disease on his body,";
csb[44] = "&quot;the man is afflicted with a serious skin disease; he is unclean. The priest must pronounce him unclean; the infection is on his head.";
csb[45] = "&quot;The person who has a case of serious skin disease is to have his clothes torn and his hair hanging loose, and he must cover his mouth and cry out, \'Unclean, unclean! \'";
csb[46] = "&quot;He will remain unclean as long as he has the disease; he is unclean. He must live alone in a place outside the camp.";
csb[47] = "&quot;If a fabric is contaminated with mildew -- in wool or linen fabric,";
csb[48] = "&quot;in the warp or weft of linen or wool, or in leather or anything made of leather --";
csb[49] = "&quot;and if the contamination is green or red in the fabric, the leather, the warp, the weft, or any leather article, it is a mildew contamination and is to be shown to the priest.";
csb[50] = "&quot;The priest is to examine the contamination and quarantine the contaminated fabric for seven days.";
csb[51] = "&quot;The priest is to reexamine the contamination on the seventh day. If it has spread in the fabric, the warp, the weft, or the leather, regardless of how it is used, the contamination is harmful mildew; it is unclean.";
csb[52] = "&quot;He is to burn the fabric, the warp or weft in wool or linen, or any leather article, which is contaminated. Since it is harmful mildew it must be burned.";
csb[53] = "&quot;When the priest examines it, if the contamination has not spread in the fabric, the warp or weft, or any leather article,";
csb[54] = "&quot;the priest is to order whatever is contaminated to be washed and quarantined for another seven days.";
csb[55] = "&quot;After it has been washed, the priest is to reexamine the contamination. If the appearance of the contaminated article has not changed, it is unclean. Even though the contamination has not spread, you must burn the fabric. It is a fungus on the front or back of the fabric.";
csb[56] = "&quot;If the priest examines it, and the contamination has faded after it has been washed, he is to cut the contaminated section out of the fabric, the leather, or the warp or weft.";
csb[57] = "&quot;But if it reappears in the fabric, the warp or weft, or any leather article, it has broken out again. You must burn whatever is contaminated.";
csb[58] = "&quot;But if the contamination disappears from the fabric, the warp or weft, or any leather article, which have been washed, it is to be washed again, and it will be clean.";
csb[59] = "&quot;This is the law concerning a mildew contamination in wool or linen fabric, warp or weft, or any leather article, in order to pronounce it clean or unclean.&quot;";
kjv[1] = "And the LORD spake unto Moses and Aaron, saying,";
kjv[2] = "When a man shall have in the skin of his flesh a rising, a scab, or bright spot, and it be in the skin of his flesh [like] the plague of leprosy; then he shall be brought unto Aaron the priest, or unto one of his sons the priests:";
kjv[3] = "And the priest shall look on the plague in the skin of the flesh: and [when] the hair in the plague is turned white, and the plague in sight [be] deeper than the skin of his flesh, it [is] a plague of leprosy: and the priest shall look on him, and pronounce him unclean.";
kjv[4] = "If the bright spot [be] white in the skin of his flesh, and in sight [be] not deeper than the skin, and the hair thereof be not turned white; then the priest shall shut up [him that hath] the plague seven days:";
kjv[5] = "And the priest shall look on him the seventh day: and, behold, [if] the plague in his sight be at a stay, [and] the plague spread not in the skin; then the priest shall shut him up seven days more:";
kjv[6] = "And the priest shall look on him again the seventh day: and, behold, [if] the plague [be] somewhat dark, [and] the plague spread not in the skin, the priest shall pronounce him clean: it [is but] a scab: and he shall wash his clothes, and be clean.";
kjv[7] = "But if the scab spread much abroad in the skin, after that he hath been seen of the priest for his cleansing, he shall be seen of the priest again:";
kjv[8] = "And [if] the priest see that, behold, the scab spreadeth in the skin, then the priest shall pronounce him unclean: it [is] a leprosy.";
kjv[9] = "When the plague of leprosy is in a man, then he shall be brought unto the priest;";
kjv[10] = "And the priest shall see [him]: and, behold, [if] the rising [be] white in the skin, and it have turned the hair white, and [there be] quick raw flesh in the rising;";
kjv[11] = "It [is] an old leprosy in the skin of his flesh, and the priest shall pronounce him unclean, and shall not shut him up: for he [is] unclean.";
kjv[12] = "And if a leprosy break out abroad in the skin, and the leprosy cover all the skin of [him that hath] the plague from his head even to his foot, wheresoever the priest looketh;";
kjv[13] = "Then the priest shall consider: and, behold, [if] the leprosy have covered all his flesh, he shall pronounce [him] clean [that hath] the plague: it is all turned white: he [is] clean.";
kjv[14] = "But when raw flesh appeareth in him, he shall be unclean.";
kjv[15] = "And the priest shall see the raw flesh, and pronounce him to be unclean: [for] the raw flesh [is] unclean: it [is] a leprosy.";
kjv[16] = "Or if the raw flesh turn again, and be changed unto white, he shall come unto the priest;";
kjv[17] = "And the priest shall see him: and, behold, [if] the plague be turned into white; then the priest shall pronounce [him] clean [that hath] the plague: he [is] clean.";
kjv[18] = "The flesh also, in which, [even] in the skin thereof, was a boil, and is healed,";
kjv[19] = "And in the place of the boil there be a white rising, or a bright spot, white, and somewhat reddish, and it be shewed to the priest;";
kjv[20] = "And if, when the priest seeth it, behold, it [be] in sight lower than the skin, and the hair thereof be turned white; the priest shall pronounce him unclean: it [is] a plague of leprosy broken out of the boil.";
kjv[21] = "But if the priest look on it, and, behold, [there be] no white hairs therein, and [if] it [be] not lower than the skin, but [be] somewhat dark; then the priest shall shut him up seven days:";
kjv[22] = "And if it spread much abroad in the skin, then the priest shall pronounce him unclean: it [is] a plague.";
kjv[23] = "But if the bright spot stay in his place, [and] spread not, it [is] a burning boil; and the priest shall pronounce him clean.";
kjv[24] = "Or if there be [any] flesh, in the skin whereof [there is] a hot burning, and the quick [flesh] that burneth have a white bright spot, somewhat reddish, or white;";
kjv[25] = "Then the priest shall look upon it: and, behold, [if] the hair in the bright spot be turned white, and it [be in] sight deeper than the skin; it [is] a leprosy broken out of the burning: wherefore the priest shall pronounce him unclean: it [is] the plague of leprosy.";
kjv[26] = "But if the priest look on it, and, behold, [there be] no white hair in the bright spot, and it [be] no lower than the [other] skin, but [be] somewhat dark; then the priest shall shut him up seven days:";
kjv[27] = "And the priest shall look upon him the seventh day: [and] if it be spread much abroad in the skin, then the priest shall pronounce him unclean: it [is] the plague of leprosy.";
kjv[28] = "And if the bright spot stay in his place, [and] spread not in the skin, but it [be] somewhat dark; it [is] a rising of the burning, and the priest shall pronounce him clean: for it [is] an inflammation of the burning.";
kjv[29] = "If a man or woman have a plague upon the head or the beard;";
kjv[30] = "Then the priest shall see the plague: and, behold, if it [be] in sight deeper than the skin; [and there be] in it a yellow thin hair; then the priest shall pronounce him unclean: it [is] a dry scall, [even] a leprosy upon the head or beard.";
kjv[31] = "And if the priest look on the plague of the scall, and, behold, it [be] not in sight deeper than the skin, and [that there is] no black hair in it; then the priest shall shut up [him that hath] the plague of the scall seven days:";
kjv[32] = "And in the seventh day the priest shall look on the plague: and, behold, [if] the scall spread not, and there be in it no yellow hair, and the scall [be] not in sight deeper than the skin;";
kjv[33] = "He shall be shaven, but the scall shall he not shave; and the priest shall shut up [him that hath] the scall seven days more:";
kjv[34] = "And in the seventh day the priest shall look on the scall: and, behold, [if] the scall be not spread in the skin, nor [be] in sight deeper than the skin; then the priest shall pronounce him clean: and he shall wash his clothes, and be clean.";
kjv[35] = "But if the scall spread much in the skin after his cleansing;";
kjv[36] = "Then the priest shall look on him: and, behold, if the scall be spread in the skin, the priest shall not seek for yellow hair; he [is] unclean.";
kjv[37] = "But if the scall be in his sight at a stay, and [that] there is black hair grown up therein; the scall is healed, he [is] clean: and the priest shall pronounce him clean.";
kjv[38] = "If a man also or a woman have in the skin of their flesh bright spots, [even] white bright spots;";
kjv[39] = "Then the priest shall look: and, behold, [if] the bright spots in the skin of their flesh [be] darkish white; it [is] a freckled spot [that] groweth in the skin; he [is] clean.";
kjv[40] = "And the man whose hair is fallen off his head, he [is] bald; [yet is] he clean.";
kjv[41] = "And he that hath his hair fallen off from the part of his head toward his face, he [is] forehead bald: [yet is] he clean.";
kjv[42] = "And if there be in the bald head, or bald forehead, a white reddish sore; it [is] a leprosy sprung up in his bald head, or his bald forehead.";
kjv[43] = "Then the priest shall look upon it: and, behold, [if] the rising of the sore [be] white reddish in his bald head, or in his bald forehead, as the leprosy appeareth in the skin of the flesh;";
kjv[44] = "He is a leprous man, he [is] unclean: the priest shall pronounce him utterly unclean; his plague [is] in his head.";
kjv[45] = "And the leper in whom the plague [is], his clothes shall be rent, and his head bare, and he shall put a covering upon his upper lip, and shall cry, Unclean, unclean.";
kjv[46] = "All the days wherein the plague [shall be] in him he shall be defiled; he [is] unclean: he shall dwell alone; without the camp [shall] his habitation [be].";
kjv[47] = "The garment also that the plague of leprosy is in, [whether it be] a woollen garment, or a linen garment;";
kjv[48] = "Whether [it be] in the warp, or woof; of linen, or of woollen; whether in a skin, or in any thing made of skin;";
kjv[49] = "And if the plague be greenish or reddish in the garment, or in the skin, either in the warp, or in the woof, or in any thing of skin; it [is] a plague of leprosy, and shall be shewed unto the priest:";
kjv[50] = "And the priest shall look upon the plague, and shut up [it that hath] the plague seven days:";
kjv[51] = "And he shall look on the plague on the seventh day: if the plague be spread in the garment, either in the warp, or in the woof, or in a skin, [or] in any work that is made of skin; the plague [is] a fretting leprosy; it [is] unclean.";
kjv[52] = "He shall therefore burn that garment, whether warp or woof, in woollen or in linen, or any thing of skin, wherein the plague is: for it [is] a fretting leprosy; it shall be burnt in the fire.";
kjv[53] = "And if the priest shall look, and, behold, the plague be not spread in the garment, either in the warp, or in the woof, or in any thing of skin;";
kjv[54] = "Then the priest shall command that they wash [the thing] wherein the plague [is], and he shall shut it up seven days more:";
kjv[55] = "And the priest shall look on the plague, after that it is washed: and, behold, [if] the plague have not changed his colour, and the plague be not spread; it [is] unclean; thou shalt burn it in the fire; it [is] fret inward, [whether] it [be] bare within or without.";
kjv[56] = "And if the priest look, and, behold, the plague [be] somewhat dark after the washing of it; then he shall rend it out of the garment, or out of the skin, or out of the warp, or out of the woof:";
kjv[57] = "And if it appear still in the garment, either in the warp, or in the woof, or in any thing of skin; it [is] a spreading [plague]: thou shalt burn that wherein the plague [is] with fire.";
kjv[58] = "And the garment, either warp, or woof, or whatsoever thing of skin [it be], which thou shalt wash, if the plague be departed from them, then it shall be washed the second time, and shall be clean.";
kjv[59] = "This [is] the law of the plague of leprosy in a garment of woollen or linen, either in the warp, or woof, or any thing of skins, to pronounce it clean, or to pronounce it unclean.";
