rsv[1] = "The LORD said to Moses and Aaron,";
asv[1] = "And Jehovah spake unto Moses and unto Aaron, saying,";
yng[1] = "And Jehovah speaketh unto Moses, and unto Aaron, saying,";
dby[1] = "And Jehovah spoke to Moses and to Aaron, saying,";
web[1] = "And the LORD spoke to Moses and Aaron, saying,";
hnv[1] = "The LORD spoke to Moshe and to Aharon, saying,";

kjv[2] = "And in the seventh day the priest shall look on the scall: and, behold, [if] the scall be not spread in the skin, nor [be] in sight deeper than the skin; then the priest shall pronounce him clean: and he shall wash his clothes, and be clean.";
rsv[2] = "&quot;When a man has on the skin of his body a swelling or an eruption or a spot, and it turns into a leprous disease on the skin of his body, then he shall be brought to Aaron the priest or to one of his sons the priests,";
asv[2] = "When a man shall have in the skin of his flesh a rising, or a scab, or a bright spot, and it become in the skin of his flesh the plague of leprosy, then he shall be brought unto Aaron the priest, or unto one of his sons the priests:";
yng[2] = "`When a man hath in the skin of his flesh a rising, or scab, or bright spot, and it hath become in the skin of his flesh a leprous plague, then he hath been brought in unto Aaron the priest, or unto one of his sons the priests;";
dby[2] = "When a man shall have in the skin of his flesh a rising or a scab, or bright spot, and it become in the skin of his flesh a sore [as] of leprosy, then he shall be brought unto Aaron the priest, or unto one of his sons the priests.";
web[2] = "When a man shall have in the skin of his flesh a rising, a scab, or bright spot, and it be in the skin of his flesh [like] the plague of leprosy; then he shall be brought to Aaron the priest, or to one of his sons the priests:";
hnv[2] = "&quot;When a man shall have a rising in his body\'s skin, or a scab, or a bright spot, and it becomes in the skin of his body the plague of leprosy, then he shall be brought to Aharon the Kohen, or to one of his sons the Kohanim:";
vul[2] = "homo in cuius carne et cute ortus fuerit diversus color sive pustula aut quasi lucens quippiam id est plaga leprae adducetur ad Aaron sacerdotem vel ad unum quemlibet filiorum eius";
kjv[3] = "But if the scall spread much in the skin after his cleansing;";
rsv[3] = "and the priest shall examine the diseased spot on the skin of his body; and if the hair in the diseased spot has turned white and the disease appears to be deeper than the skin of his body, it is a leprous disease; when the priest has examined him he shall pronounce him unclean.";
asv[3] = "and the priest shall look on the plague in the skin of the flesh: and if the hair in the plague be turned white, and the appearance of the plague be deeper than the skin of his flesh, it is the plague of leprosy; and the priest shall look on him, and pronounce him unclean.";
yng[3] = "and the priest hath seen the plague in the skin of the flesh, and the hair in the plague hath turned white, and the appearance of the plague [is] deeper than the skin of his flesh -- it [is] a plague of leprosy, and the priest hath seen him, and hath pronounced him unclean.";
dby[3] = "And when the priest looketh on the sore in the skin of the flesh, and the hair in the sore is turned white, and the sore looketh deeper than the skin of his flesh, it is the sore of leprosy; and the priest shall look on him and pronounce him unclean.";
web[3] = "And the priest shall look on the plague in the skin of the flesh: and [when] the hair in the plague is turned white, and the plague in sight [is] deeper than the skin of his flesh, it [is] a plague of leprosy: and the priest shall look on him, and pronounce him unclean.";
hnv[3] = "and the Kohen shall examine the plague in the skin of the body: and if the hair in the plague has turned white, and the appearance of the plague is deeper than the body\'s skin, it is the plague of leprosy; and the Kohen shall examine him, and pronounce him unclean.";
vul[3] = "qui cum viderit lepram in cute et pilos in album mutatos colorem ipsamque speciem leprae humiliorem cute et carne reliqua plaga leprae est et ad arbitrium eius separabitur";
kjv[4] = "Then the priest shall look on him: and, behold, if the scall be spread in the skin, the priest shall not seek for yellow hair; he [is] unclean.";
rsv[4] = "But if the spot is white in the skin of his body, and appears no deeper than the skin, and the hair in it has not turned white, the priest shall shut up the diseased person for seven days;";
asv[4] = "And if the bright spot be white in the skin of his flesh, and the appearance thereof be not deeper than the skin, and the hair thereof be not turned white, then the priest shall shut up [him that hath] the plague seven days:";
yng[4] = "`And if the bright spot is white in the skin of his flesh, and its appearance is not deeper than the skin, and its hair hath not turned white, then hath the priest shut up [him who hath] the plague seven days.";
dby[4] = "But if the bright spot be white in the skin of his flesh, and look not deeper than the skin, and the hair thereof be not turned white, the priest shall shut up [him that hath] the sore seven days.";
web[4] = "If the bright spot [is] white in the skin of his flesh, and in sight, not deeper than the skin, and the hair of it not turned white; then the priest shall shut up [him that hath] the plague seven days:";
hnv[4] = "If the bright spot is white in the skin of his body, and the appearance of it isn\'t deeper than the skin, and the hair of it hasn\'t turned white, then the Kohen shall isolate the infected person for seven days.";
vul[4] = "sin autem lucens candor fuerit in cute nec humilior carne reliqua et pili coloris pristini recludet eum sacerdos septem diebus";
kjv[5] = "But if the scall be in his sight at a stay, and [that] there is black hair grown up therein; the scall is healed, he [is] clean: and the priest shall pronounce him clean.";
rsv[5] = "and the priest shall examine him on the seventh day, and if in his eyes the disease is checked and the disease has not spread in the skin, then the priest shall shut him up seven days more;";
asv[5] = "and the priest shall look on him the seventh day: and, behold, if in his eyes the plague be at a stay, and the plague be not spread in the skin, then the priest shall shut him up seven days more:";
yng[5] = "`And the priest hath seen him on the seventh day, and lo, the plague hath stood in his eyes, the plague hath not spread in the skin, and the priest hath shut him up a second seven days.";
dby[5] = "And the priest shall look on him the seventh day; and behold, in his sight, the sore remaineth as it was, the sore hath not spread in the skin, then the priest shall shut him up seven days a second time.";
web[5] = "And the priest shall look on him the seventh day: and behold, [if] the plague in his sight is at a stay, [and] the plague spreadeth not in the skin; then the priest shall shut him up seven days more:";
hnv[5] = "The Kohen shall examine him on the seventh day, and, behold, if in his eyes the plague is arrested, and the plague hasn\'t spread in the skin, then the Kohen shall isolate him for seven more days.";
vul[5] = "et considerabit die septimo et siquidem lepra ultra non creverit nec transierit in cute priores terminos rursum includet eum septem diebus aliis";
kjv[6] = "If a man also or a woman have in the skin of their flesh bright spots, [even] white bright spots;";
rsv[6] = "and the priest shall examine him again on the seventh day, and if the diseased spot is dim and the disease has not spread in the skin, then the priest shall pronounce him clean; it is only an eruption; and he shall wash his clothes, and be clean.";
asv[6] = "and the priest shall look on him again the seventh day; and, behold, if the plague be dim, and the plague be not spread in the skin, then the priest shall pronounce him clean: it is a scab: and he shall wash his clothes, and be clean.";
yng[6] = "`And the priest hath seen him on the second seventh day, and lo, the plague is become weak, and the plague hath not spread in the skin -- and the priest hath pronounced him clean, it [is] a scab, and he hath washed his garments, and hath been clean.";
dby[6] = "And the priest shall look on him again the seventh day, and behold, the sore is become pale and the sore hath not spread in the skin, then the priest shall pronounce him clean; it is a scab; and he shall wash his garments and be clean.";
web[6] = "And the priest shall look on him again the seventh day: and behold, [if] the plague [is] somewhat dark, [and] the plague spreadeth not in the skin, the priest shall pronounce him clean: it [is but] a scab: and he shall wash his clothes, and be clean.";
hnv[6] = "The Kohen shall examine him again on the seventh day; and, behold, if the plague has faded, and the plague hasn\'t spread in the skin, then the Kohen shall pronounce him clean. It is a scab. He shall wash his clothes, and be clean.";
vul[6] = "et die septimo contemplabitur si obscurior fuerit lepra et non creverit in cute mundabit eum quia scabies est lavabitque homo vestimenta sua et mundus erit";
kjv[7] = "Then the priest shall look: and, behold, [if] the bright spots in the skin of their flesh [be] darkish white; it [is] a freckled spot [that] groweth in the skin; he [is] clean.";
rsv[7] = "But if the eruption spreads in the skin, after he has shown himself to the priest for his cleansing, he shall appear again before the priest;";
asv[7] = "But if the scab spread abroad in the skin, after that he hath showed himself to the priest for his cleansing, he shall show himself to the priest again:";
yng[7] = "`And if the scab spread greatly in the skin, after his being seen by the priest for his cleansing, then he hath been seen a second time by the priest;";
dby[7] = "But if the scab have spread much in the skin, after that he hath been seen by the priest for his cleansing, he shall be seen by the priest again;";
web[7] = "But if the scab shall spread much in the skin, after he hath been seen by the priest for his cleansing, he shall be seen by the priest again:";
hnv[7] = "But if the scab spreads on the skin, after he has shown himself to the Kohen for his cleansing, he shall show himself to the Kohen again.";
vul[7] = "quod si postquam a sacerdote visus est et redditus munditiae iterum lepra creverit adducetur ad eum";
kjv[8] = "And the man whose hair is fallen off his head, he [is] bald; [yet is] he clean.";

asv[8] = "and the priest shall look; and, behold, if the scab be spread in the skin, then the priest shall pronounce him unclean: it is leprosy.";
yng[8] = "and the priest hath seen, and lo, the scab hath spread in the skin, and the priest hath pronounced him unclean; it [is] leprosy.";
dby[8] = "and the priest shall look on him, and behold, the scab hath spread in the skin; then the priest shall pronounce him unclean: it is leprosy.";
web[8] = "And [if] the priest shall see, that behold, the scab spreadeth in the skin, then the priest shall pronounce him unclean: it [is] a leprosy.";
hnv[8] = "The Kohen shall examine him; and, behold, if the scab has spread on the skin, then the Kohen shall pronounce him unclean. It is leprosy.";
vul[8] = "et inmunditiae condemnabitur";

rsv[9] = "&quot;When a man is afflicted with leprosy, he shall be brought to the priest;";
asv[9] = "When the plague of leprosy is in a man, then he shall be brought unto the priest;";
yng[9] = "`When a plague of leprosy is in a man, then he hath been brought in unto the priest,";

web[9] = "When the plague of leprosy is in a man, then he shall be brought to the priest:";

kjv[11] = "Then the priest shall look upon it: and, behold, [if] the rising of the sore [be] white reddish in his bald head, or in his bald forehead, as the leprosy appeareth in the skin of the flesh;";
rsv[11] = "it is a chronic leprosy in the skin of his body, and the priest shall pronounce him unclean; he shall not shut him up, for he is unclean.";

dby[11] = "it is an old leprosy in the skin of his flesh; and the priest shall pronounce him unclean, and he shall not shut him up, for he is unclean.";

dby[12] = "But if the leprosy break out much in the skin, and the leprosy cover all the skin of [him that hath] the sore, from his head even to his foot, wherever the eyes of the priest look,";

yng[13] = "then hath the priest seen, and lo, the leprosy hath covered all his flesh, and he hath pronounced [him who hath] the plague clean; it hath all turned white; he [is] clean.";
dby[13] = "and the priest looketh, and behold, the leprosy covereth all his flesh, he shall pronounce [him] clean [that hath] the sore; it is all turned white; he is clean.";
web[13] = "Then the priest shall consider: and behold, [if] the leprosy hath covered all his flesh, he shall pronounce [him] clean [that hath] the plague: it is all turned white: he [is] clean.";
hnv[13] = "then the Kohen shall examine him; and, behold, if the leprosy has covered all his flesh, he shall pronounce him clean of the plague. It has all turned white: he is clean.";

asv[14] = "But whensoever raw flesh appeareth in him, he shall be unclean.";
yng[14] = "`And in the day of raw flesh being seen in him he is unclean;";
dby[14] = "And on the day when raw flesh appeareth in him, he shall be unclean.";
web[14] = "But when raw flesh appeareth in him, he shall be unclean.";
hnv[14] = "But whenever raw flesh appears in him, he shall be unclean.";
vul[14] = "quando vero caro vivens in eo apparuerit";

rsv[15] = "And the priest shall examine the raw flesh, and pronounce him unclean; raw flesh is unclean, for it is leprosy.";
asv[15] = "And the priest shall look on the raw flesh, and pronounce him unclean: the raw flesh is unclean: it is leprosy.";
yng[15] = "and the priest hath seen the raw flesh, and hath pronounced him unclean; the raw flesh is unclean, it [is] leprosy.";
dby[15] = "And the priest shall look on the raw flesh, and shall pronounce him unclean: the raw flesh is unclean, it is leprosy.";
web[15] = "And the priest shall see the raw flesh, and pronounce him to be unclean: [for] the raw flesh [is] unclean: it [is] a leprosy.";
hnv[15] = "The Kohen shall examine the raw flesh, and pronounce him unclean: the raw flesh is unclean. It is leprosy.";

kjv[16] = "Whether [it be] in the warp, or woof; of linen, or of woollen; whether in a skin, or in any thing made of skin;";

dby[16] = "But if the raw flesh change again, and be turned white, he shall come unto the priest;";
web[16] = "Or if the raw flesh shall turn again, and be changed into white, he shall come to the priest;";
hnv[16] = " Or if the raw flesh turns again, and is changed to white, then he shall come to the Kohen;";
vul[16] = "quod si rursum versa fuerit in alborem et totum hominem operuerit";
kjv[17] = "And if the plague be greenish or reddish in the garment, or in the skin, either in the warp, or in the woof, or in any thing of skin; it [is] a plague of leprosy, and shall be shewed unto the priest:";
rsv[17] = "and the priest shall examine him, and if the disease has turned white, then the priest shall pronounce the diseased person clean; he is clean.";
asv[17] = "and the priest shall look on him; and, behold, if the plague be turned into white, then the priest shall pronounce [him] clean [that hath] the plague: he is clean.";
yng[17] = "and the priest hath seen him, and lo, the plague hath been turned to white, and the priest hath pronounced clean [him who hath] the plague; he [is] clean.";
dby[17] = "and the priest shall look on him, and behold, the sore is turned white; then the priest shall pronounce [him] clean [that hath] the sore: he is clean.";
web[17] = "And the priest shall see him: and behold, [if] the plague is turned into white: then the priest shall pronounce [him] clean [that hath] the plague: he [is] clean.";
hnv[17] = "and the Kohen shall examine him; and, behold, if the plague has turned white, then the Kohen shall pronounce him clean of the plague. He is clean.";

kjv[18] = "And the priest shall look upon the plague, and shut up [it that hath] the plague seven days:";
rsv[18] = "&quot;And when there is in the skin of one\'s body a boil that has healed,";
asv[18] = "And when the flesh hath in the skin thereof a boil, and it is healed,";
yng[18] = "`And when flesh hath in it, in its skin, an ulcer, and it hath been healed,";
dby[18] = "And the flesh -- when in the skin thereof cometh a boil, and it is healed,";
web[18] = "The flesh also, in which, [even] in the skin of it, was a boil, and is healed,";
hnv[18] = "&quot;When the body has a boil on its skin, and it has healed,";
vul[18] = "caro et cutis in qua ulcus natum est et sanatum";
kjv[19] = "And he shall look on the plague on the seventh day: if the plague be spread in the garment, either in the warp, or in the woof, or in a skin, [or] in any work that is made of skin; the plague [is] a fretting leprosy; it [is] unclean.";
rsv[19] = "and in the place of the boil there comes a white swelling or a reddish-white spot, then it shall be shown to the priest;";
asv[19] = "and in the place of the boil there is a white rising, or a bright spot, reddish-white, then is shall be showed to the priest;";
yng[19] = "and there hath been in the place of the ulcer a white rising, or a bright white spot, very red, then it hath been seen by the priest,";
dby[19] = "and there is in the place of the boil a white rising, or a white-reddish bright spot, it shall be shewn to the priest;";
web[19] = "And in the place of the boil there shall be a white rising, or a bright spot, white, and somewhat reddish, and it be showed to the priest;";
hnv[19] = "and in the place of the boil there is a white rising, or a bright spot, reddish-white, then it shall be shown to the Kohen;";
vul[19] = "et in loco ulceris cicatrix apparuerit alba sive subrufa adducetur homo ad sacerdotem";

rsv[20] = "and the priest shall make an examination, and if it appears deeper than the skin and its hair has turned white, then the priest shall pronounce him unclean; it is the disease of leprosy, it has broken out in the boil.";

yng[20] = "and the priest hath seen, and lo, its appearance [is] lower than the skin, and its hair hath turned white, and the priest hath pronounced him unclean; it [is] a plague of leprosy -- in an ulcer it hath broken out.";
dby[20] = "and the priest shall look on it, and behold, it looketh deeper than the skin, and the hair thereof is turned white; then the priest shall pronounce him unclean: it is the sore of leprosy broken out in the boil.";
web[20] = "And if, when the priest seeth it, behold, it [is] in sight lower than the skin, and the hair of it [is] turned white; the priest shall pronounce him unclean: it [is] a plague of leprosy broken out of the boil.";
hnv[20] = "and the Kohen shall examine it; and, behold, if the appearance of it is lower than the skin, and the hair of it has turned white, then the Kohen shall pronounce him unclean. It is the plague of leprosy. It has broken out in the boil.";

rsv[21] = "But if the priest examines it, and the hair on it is not white and it is not deeper than the skin, but is dim, then the priest shall shut him up seven days;";
asv[21] = "But if the priest look on it, and, behold, there be no white hairs therein, and it be not lower than the skin, but be dim; then the priest shall shut him up seven days:";
yng[21] = "`And if the priest see it, and lo, there is no white hair in it, and it is not lower than the skin, and is become weak, then hath the priest shut him up seven days;";
dby[21] = "But if the priest look on it, and behold, there are no white hairs therein, and it is not deeper than the skin, and is pale, the priest shall shut him up seven days;";
web[21] = "But if the priest shall look on it, and behold, [there are] no white hairs in it, and [if] it [is] not lower than the skin, but somewhat dark; then the priest shall shut him up seven days:";

rsv[22] = "and if it spreads in the skin, then the priest shall pronounce him unclean; it is diseased.";
asv[22] = "and if it spread abroad in the skin, then the priest shall pronounce him unclean: it is a plague.";
yng[22] = "and if it spread greatly in the skin, then hath the priest pronounced him unclean, it [is] a plague;";
dby[22] = "and if it spread much in the skin, then the priest shall pronounce him unclean: it is the sore.";
web[22] = "And if it hath spread much in the skin, then the priest shall pronounce him unclean: it [is] a plague.";
hnv[22] = " If it spreads in the skin, then the Kohen shall pronounce him unclean. It is a plague.";
vul[22] = "et siquidem creverit adiudicabit eum leprae";
kjv[23] = "And the priest shall look on the plague, after that it is washed: and, behold, [if] the plague have not changed his colour, and the plague be not spread; it [is] unclean; thou shalt burn it in the fire; it [is] fret inward, [whether] it [be] bare within or without.";
rsv[23] = "But if the spot remains in one place and does not spread, it is the scar of the boil; and the priest shall pronounce him clean.";
asv[23] = "But if the bright spot stay in its place, and be not spread, it is the scar of the boil; and the priest shall pronounce him clean.";
yng[23] = "and if in its place the bright spot stay -- it hath not spread -- it [is] an inflammation of the ulcer; and the priest hath pronounced him clean.";
dby[23] = "But if the bright spot have remained in its place, [and] have not spread, it is the scar of the boil; and the priest shall pronounce him clean.";
web[23] = "But if the bright spot shall stay in its place, [and] not spread, it [is] a burning boil; and the priest shall pronounce him clean.";
hnv[23] = "But if the bright spot stays in its place, and hasn\'t spread, it is the scar from the boil; and the Kohen shall pronounce him clean.";
vul[23] = "sin autem steterit in loco suo ulceris est cicatrix et homo mundus erit";
kjv[24] = "And if the priest look, and, behold, the plague [be] somewhat dark after the washing of it; then he shall rend it out of the garment, or out of the skin, or out of the warp, or out of the woof:";
rsv[24] = "&quot;Or, when the body has a burn on its skin and the raw flesh of the burn becomes a spot, reddish-white or white,";
asv[24] = "Or when the flesh hath in the skin thereof a burning by fire, and the quick [flesh] of the burning become a bright spot, reddish-white, or white;";
yng[24] = "`Or when flesh hath in its skin a fiery burning, and the quickening of the burning, the bright white spot, hath been very red or white,";
dby[24] = "Or if in the flesh, in the skin thereof, there is a burning inflammation, and the place of the inflammation become a bright spot white-reddish or white,";
web[24] = "Or if there [is any] flesh, in the skin of which [there is] a hot burning, and the live [flesh] that burneth hath a white bright spot, somewhat reddish or white;";
hnv[24] = "&quot;Or when the body has a burn from fire on its skin, and the raw flesh of the burn becomes a bright spot, reddish-white, or white,";
vul[24] = "caro et cutis quam ignis exuserit et sanata albam sive rufam habuerit cicatricem";
kjv[25] = "And if it appear still in the garment, either in the warp, or in the woof, or in any thing of skin; it [is] a spreading [plague]: thou shalt burn that wherein the plague [is] with fire.";
rsv[25] = "the priest shall examine it, and if the hair in the spot has turned white and it appears deeper than the skin, then it is leprosy; it has broken out in the burn, and the priest shall pronounce him unclean; it is a leprous disease.";
asv[25] = "then the priest shall look upon it; and, behold, if the hair in the bright spot be turned white, and the appearance thereof be deeper than the skin; it is leprosy, it hath broken out in the burning: and the priest shall pronounce him unclean: it is the plague of leprosy.";
yng[25] = "and the priest hath seen it, and lo, the hair hath turned white in the bright spot, and its appearance [is] deeper than the skin; leprosy it [is], in the burning it hath broken out, and the priest hath pronounced him unclean; it [is] a plague of leprosy.";
dby[25] = "and the priest look on it, and behold, the hair is turned white in the bright spot, and it looketh deeper than the skin, it is a leprosy which is broken out in the inflammation; and the priest shall pronounce him unclean: it is the sore of leprosy.";
web[25] = "Then the priest shall look upon it: and behold, [if] the hair in the bright spot [is] turned white, and it [is in] sight deeper than the skin: it [is] a leprosy broken out of the burning: wherefore the priest shall pronounce him unclean: it [is] the plague of leprosy.";
hnv[25] = "then the Kohen shall examine it; and, behold, if the hair in the bright spot has turned white, and the appearance of it is deeper than the skin; it is leprosy. It has broken out in the burning, and the Kohen shall pronounce him unclean. It is the plague of leprosy.";
vul[25] = "considerabit eam sacerdos et ecce versa est in alborem et locus eius reliqua cute humilior contaminabit eum quia plaga leprae in cicatrice orta est";
kjv[26] = "And the garment, either warp, or woof, or whatsoever thing of skin [it be], which thou shalt wash, if the plague be departed from them, then it shall be washed the second time, and shall be clean.";
rsv[26] = "But if the priest examines it, and the hair in the spot is not white and it is no deeper than the skin, but is dim, the priest shall shut him up seven days,";
asv[26] = "But if the priest look on it, and, behold, there be no white hair in the bright spot, and it be no lower than the skin, but be dim; then the priest shall shut him up seven days:";
yng[26] = "`And if the priest see it, and lo, there is no white hair on the bright spot, and it is not lower than the skin, and it is become weak, then the priest hath shut him up seven days;";
dby[26] = "But if the priest look on it, and behold, there is no white hair in the bright spot, and it is no deeper than the skin, and is pale, the priest shall shut him up seven days.";
web[26] = "But if the priest shall look on it, and behold, [there is] no white hair in the bright spot, and it [is] no lower than the [other] skin, but [is] somewhat dark; then the priest shall shut him up seven days:";
hnv[26] = " But if the Kohen examines it, and, behold, there is no white hair in the bright spot, and it isn\'t lower than the skin, but is faded; then the Kohen shall isolate him seven days.";
vul[26] = "quod si pilorum color non fuerit inmutatus nec humilior plaga carne reliqua et ipsa leprae species fuerit subobscura recludet eum septem diebus";
kjv[27] = "This [is] the law of the plague of leprosy in a garment of woollen or linen, either in the warp, or woof, or any thing of skins, to pronounce it clean, or to pronounce it unclean.";
rsv[27] = "and the priest shall examine him the seventh day; if it is spreading in the skin, then the priest shall pronounce him unclean; it is a leprous disease.";
asv[27] = "and the priest shall look upon him the seventh day: if it spread abroad in the skin, then the priest shall pronounce him unclean: it is the plague of leprosy.";
yng[27] = "and the priest hath seen him on the seventh day, if it spread greatly in the skin, then the priest hath pronounced him unclean; a plague of leprosy it [is].";
dby[27] = "And the priest shall look on him the seventh day, and if it have spread much in the skin, the priest shall pronounce him unclean: it is the sore of leprosy.";
web[27] = "And the priest shall look upon him the seventh day: [and] if it [is] spread much in the skin, then the priest shall pronounce him unclean: it [is] the plague of leprosy,";
hnv[27] = "The Kohen shall examine him on the seventh day. If it has spread in the skin, then the Kohen shall pronounce him unclean. It is the plague of leprosy.";
vul[27] = "et die septimo contemplabitur si creverit in cute lepra contaminabit eum";
kjv[28] = "And the LORD spake unto Moses and Aaron, saying,";
rsv[28] = "But if the spot remains in one place and does not spread in the skin, but is dim, it is a swelling from the burn, and the priest shall pronounce him clean; for it is the scar of the burn.";
asv[28] = "And if the bright spot stay in its place, and be not spread in the skin, but be dim; it is the rising of the burning, and the priest shall pronounce him clean: for it is the scar of the burning.";
yng[28] = "`And if the bright spot stay in its place, it hath not spread in the skin, and is become weak; a rising of the burning it [is], and the priest hath pronounced him clean; for it [is] inflammation of the burning.";
dby[28] = "But if the bright spot have remained in its place, [and] not spread in the skin, and is pale, it is the rising of the inflammation; and the priest shall pronounce him clean; for it is the scar of the inflammation.";
web[28] = "And if the bright spot shall stay in its place, [and] not spread in the skin, but [be] somewhat dark; it [is] a rising of the burning, and the priest shall pronounce him clean: for it [is] an inflammation of the burning.";
hnv[28] = "If the bright spot stays in its place, and hasn\'t spread in the skin, but is faded, it is the swelling from the burn, and the Kohen shall pronounce him clean; for it is the scar from the burn.";
vul[28] = "sin autem in loco suo candor steterit non satis clarus plaga conbustionis est et idcirco mundabitur quia cicatrix est conbusturae";
kjv[29] = "When a man shall have in the skin of his flesh a rising, a scab, or bright spot, and it be in the skin of his flesh [like] the plague of leprosy; then he shall be brought unto Aaron the priest, or unto one of his sons the priests:";
rsv[29] = "&quot;When a man or woman has a disease on the head or the beard,";
asv[29] = "And when a man or woman hath a plague upon the head or upon the beard,";
yng[29] = "`And when a man (or a woman) hath in him a plague in the head or in the beard,";
dby[29] = "And if a man or a woman have a sore on the head or on the beard,";
web[29] = "If a man or woman shall have a plague upon the head or the beard;";
hnv[29] = "&quot;When a man or woman has a plague on the head or on the beard,";
vul[29] = "vir sive mulier in cuius capite vel barba germinarit lepra videbit eos sacerdos";
kjv[30] = "And the priest shall look on the plague in the skin of the flesh: and [when] the hair in the plague is turned white, and the plague in sight [be] deeper than the skin of his flesh, it [is] a plague of leprosy: and the priest shall look on him, and pronounce him unclean.";
rsv[30] = "the priest shall examine the disease; and if it appears deeper than the skin, and the hair in it is yellow and thin, then the priest shall pronounce him unclean; it is an itch, a leprosy of the head or the beard.";
asv[30] = "then the priest shall look on the plague; and, behold, if the appearance thereof be deeper than the skin, and there be in it yellow thin hair, then the priest shall pronounce him unclean: it is a scall, it is leprosy of the head or of the beard.";
yng[30] = "then hath the priest seen the plague, and lo, its appearance is deeper than the skin, and in it a thin shining hair, and the priest hath pronounced him unclean; it [is] a scall -- it [is] a leprosy of the head or of the beard.";
dby[30] = "and the priest look on the sore, and behold, it looketh deeper than the skin, and there is in it yellow thin hair, then the priest shall pronounce him unclean; it is a scall, the leprosy of the head or the beard.";
web[30] = "Then the priest shall see the plague: and behold, if it [is] in sight deeper than the skin, [and there is] in it a yellow thin hair; then the priest shall pronounce him unclean: it [is] a dry scall, [even] a leprosy upon the head or beard.";
hnv[30] = "then the Kohen shall examine the plague; and, behold, if the appearance of it is deeper than the skin, and the hair in it is yellow and thin, then the Kohen shall pronounce him unclean: it is an itch, it is leprosy of the head or of the beard.";
vul[30] = "et siquidem humilior fuerit locus carne reliqua et capillus flavus solitoque subtilior contaminabit eos quia lepra capitis ac barbae est";
kjv[31] = "If the bright spot [be] white in the skin of his flesh, and in sight [be] not deeper than the skin, and the hair thereof be not turned white; then the priest shall shut up [him that hath] the plague seven days:";
rsv[31] = "And if the priest examines the itching disease, and it appears no deeper than the skin and there is no black hair in it, then the priest shall shut up the person with the itching disease for seven days,";
asv[31] = "And if the priest look on the plague of the scall, and, behold, the appearance thereof be not deeper than the skin, and there be no black hair in it, then the priest shall shut up [him that hath] the plague of the scall seven days:";
yng[31] = "`And when the priest seeth the plague of the scall, and lo, its appearance is not deeper than the skin, and there is no black hair in it, then hath the priest shut up [him who hath] the plague of the scall seven days.";
dby[31] = "And if the priest look on the sore of the scall, and behold, it is not in sight deeper than the skin, and there is no black hair in it, the priest shall shut up [him that hath] the sore of the scall seven days.";
web[31] = "And if the priest shall look on the plague of the scall, and behold, it [is] not in sight deeper than the skin, and no black hair in it; then the priest shall shut up [him that hath] the plague of the scall seven days:";
hnv[31] = "If the Kohen examines the plague of itching, and, behold, its appearance isn\'t deeper than the skin, and there is no black hair in it, then the Kohen shall isolate him the person infected with itching seven days.";
vul[31] = "sin autem viderit et locum maculae aequalem vicinae carni et capillum nigrum recludet eos septem diebus";
kjv[32] = "And the priest shall look on him the seventh day: and, behold, [if] the plague in his sight be at a stay, [and] the plague spread not in the skin; then the priest shall shut him up seven days more:";
rsv[32] = "and on the seventh day the priest shall examine the disease; and if the itch has not spread, and there is in it no yellow hair, and the itch appears to be no deeper than the skin,";
asv[32] = "and in the seventh day the priest shall look on the plague; and, behold, if the scall be not spread, and there be in it no yellow hair, and the appearance of the scall be not deeper than the skin,";
yng[32] = "`And the priest hath seen the plague on the seventh day, and lo, the scall hath not spread, and a shining hair hath not been in it, and the appearance of the scall is not deeper than the skin,";
dby[32] = "And when the priest looketh on the sore on the seventh day, and behold, the scall hath not spread, and there is in it no yellow hair, and the scall doth not look deeper than the skin,";
web[32] = "And in the seventh day the priest shall look on the plague: and behold, [if] the scall spreadeth not, and there is in it no yellow hair, and the scall [is] not in sight deeper than the skin;";
hnv[32] = " On the seventh day the Kohen shall examine the plague; and, behold, if the itch hasn\'t spread, and there is no yellow hair in it, and the appearance of the itch isn\'t deeper than the skin,";
vul[32] = "et die septimo intuebitur si non creverit macula et capillus sui coloris est et locus plagae carni reliquae aequalis";
kjv[33] = "And the priest shall look on him again the seventh day: and, behold, [if] the plague [be] somewhat dark, [and] the plague spread not in the skin, the priest shall pronounce him clean: it [is but] a scab: and he shall wash his clothes, and be clean.";
rsv[33] = "then he shall shave himself, but the itch he shall not shave; and the priest shall shut up the person with the itching disease for seven days more;";
asv[33] = "then he shall be shaven, but the scall shall he not shave; and the priest shall shut up [him that hath] the scall seven days more:";
yng[33] = "then he hath shaved himself, but the scall he doth not shave; and the priest hath shut up [him who hath] the scall a second seven days.";
dby[33] = "he [that hath the sore] shall shave himself; but the scall shall he not shave; and the priest shall shut up [him that hath] the scall seven days a second time.";
web[33] = "He shall be shaven, but the scall shall he not shave; and the priest shall shut up [him that hath] the scall seven days more:";
hnv[33] = "then he shall be shaved, but he shall not shave the itch; and the Kohen shall shut him up who has the itch seven more days.";
vul[33] = "radetur homo absque loco maculae et includetur septem diebus aliis";
kjv[34] = "But if the scab spread much abroad in the skin, after that he hath been seen of the priest for his cleansing, he shall be seen of the priest again:";
rsv[34] = "and on the seventh day the priest shall examine the itch, and if the itch has not spread in the skin and it appears to be no deeper than the skin, then the priest shall pronounce him clean; and he shall wash his clothes, and be clean.";
asv[34] = "and in the seventh day the priest shall look on the scall; and, behold, if the scall be not spread in the skin, and the appearance thereof be not deeper than the skin; then the priest shall pronounce him clean: and he shall wash his clothes, and be clean.";
yng[34] = "And the priest hath seen the scall on the seventh day, and lo, the scall hath not spread in the skin, and its appearance is not deeper than the skin, and the priest hath pronounced him clean, and he hath washed his garments, and hath been clean.";
dby[34] = "And the priest shall look on the scall on the seventh day, and behold, the scall hath not spread in the skin, nor is in sight deeper than the skin, then the priest shall pronounce him clean; and he shall wash his garments, and be clean.";
web[34] = "And in the seventh day the priest shall look on the scall: and behold, [if] the scall is not spread in the skin, nor [is] in sight deeper than the skin; then the priest shall pronounce him clean: and he shall wash his clothes, and be clean.";
hnv[34] = "On the seventh day, the Kohen shall examine the itch; and, behold, if the itch hasn\'t spread in the skin, and its appearance isn\'t deeper than the skin, then the Kohen shall pronounce him clean. He shall wash his clothes, and be clean.";
vul[34] = "si die septimo visa fuerit stetisse plaga in loco suo nec humilior carne reliqua mundabit eum lotisque vestibus mundus erit";
kjv[35] = "And [if] the priest see that, behold, the scab spreadeth in the skin, then the priest shall pronounce him unclean: it [is] a leprosy.";
rsv[35] = "But if the itch spreads in the skin after his cleansing,";
asv[35] = "But if the scall spread abroad in the skin after his cleansing,";
yng[35] = "`And if the scall spread greatly in the skin after his cleansing,";
dby[35] = "But if the scall have spread much in the skin after his cleansing,";
web[35] = "But if the scall shall spread much in the skin after his cleansing;";
hnv[35] = "But if the itch spreads in the skin after his cleansing,";
vul[35] = "sin autem post emundationem rursus creverit macula in cute";
kjv[36] = "When the plague of leprosy is in a man, then he shall be brought unto the priest;";
rsv[36] = "then the priest shall examine him, and if the itch has spread in the skin, the priest need not seek for the yellow hair; he is unclean.";
asv[36] = "then the priest shall look on him; and, behold, if the scall be spread in the skin, the priest shall not seek for the yellow hair; he is unclean.";
yng[36] = "and the priest hath seen him, and lo, the scall hath spread in the skin, the priest seeketh not for the shining hair, he is unclean;";
dby[36] = "and the priest shall look on him, and behold, the scall hath spread in the skin, the priest shall not seek for yellow hair: he is unclean.";
web[36] = "Then the priest shall look on him: and behold, if the scall is spread in the skin, the priest shall not seek for yellow hair; he [is] unclean.";
hnv[36] = "then the Kohen shall examine him; and, behold, if the itch has spread in the skin, the Kohen shall not look for the yellow hair; he is unclean.";
vul[36] = "non quaeret amplius utrum capillus in flavum colorem sit commutatus quia aperte inmundus est";
kjv[37] = "And the priest shall see [him]: and, behold, [if] the rising [be] white in the skin, and it have turned the hair white, and [there be] quick raw flesh in the rising;";
rsv[37] = "But if in his eyes the itch is checked, and black hair has grown in it, the itch is healed, he is clean; and the priest shall pronounce him clean.";
asv[37] = "But if in his eyes the scall be at a stay, and black hair be grown up therein; the scall is healed, he is clean: and the priest shall pronounce him clean.";
yng[37] = "and if in his eyes the scall hath stayed, and black hair hath sprung up in it, the scall hath been healed -- he [is] clean -- and the priest hath pronounced him clean.";
dby[37] = "But if the scall have in his sight remained as it was, and there is black hair grown up therein, the scall is healed: he is clean; and the priest shall pronounce him clean.";
web[37] = "But if the scall shall be in his sight at a stay, and there is black hair grown in it; the scall is healed, he [is] clean: and the priest shall pronounce him clean.";
hnv[37] = "But if in his eyes the itch is arrested, and black hair has grown in it; the itch is healed, he is clean. The Kohen shall pronounce him clean.";
vul[37] = "porro si steterit macula et capilli nigri fuerint noverit hominem esse sanatum et confidenter eum pronuntiet mundum";
kjv[38] = "It [is] an old leprosy in the skin of his flesh, and the priest shall pronounce him unclean, and shall not shut him up: for he [is] unclean.";
rsv[38] = "&quot;When a man or a woman has spots on the skin of the body, white spots,";
asv[38] = "And when a man or a woman hath in the skin of the flesh bright spots, even white bright spots;";
yng[38] = "`And when a man or woman hath in the skin of their flesh bright spots, white bright spots,";
dby[38] = "And if a man or a woman have in the skin of their flesh bright spots, white bright spots,";
web[38] = "If a man also or a woman shall have in the skin of their flesh bright spots, [even] white bright spots;";
hnv[38] = "&quot;When a man or a woman has bright spots in the skin of the body, even white bright spots;";
vul[38] = "vir et mulier in cuius cute candor apparuerit";
kjv[39] = "And if a leprosy break out abroad in the skin, and the leprosy cover all the skin of [him that hath] the plague from his head even to his foot, wheresoever the priest looketh;";
rsv[39] = "the priest shall make an examination, and if the spots on the skin of the body are of a dull white, it is tetter that has broken out in the skin; he is clean.";
asv[39] = "then the priest shall look; and, behold, if the bright spots in the skin of their flesh be of a dull white, it is a tetter, it hath broken out in the skin; he is clean.";
yng[39] = "and the priest hath seen, and lo, in the skin of their flesh white weak bright spots, it [is] a freckled spot broken out in the skin; he [is] clean.";
dby[39] = "and the priest look, and behold, there are in the skin of their flesh pale white spots, it is an eruption which is broken out in the skin: he is clean.";
web[39] = "Then the priest shall look: and behold, [if] the bright spots in the skin of their flesh [are] darkish white; it [is] a freckled spot [that] groweth in the skin; he [is] clean.";
hnv[39] = "then the Kohen shall examine them; and, behold, if the bright spots on the skin of their body are a dull white, it is a harmless rash, it has broken out in the skin; he is clean.";
vul[39] = "intuebitur eos sacerdos si deprehenderit subobscurum alborem lucere in cute sciat non esse lepram sed maculam coloris candidi et hominem mundum";
kjv[40] = "Then the priest shall consider: and, behold, [if] the leprosy have covered all his flesh, he shall pronounce [him] clean [that hath] the plague: it is all turned white: he [is] clean.";
rsv[40] = "&quot;If a man\'s hair has fallen from his head, he is bald but he is clean.";
asv[40] = "And if a man\'s hair be fallen off his head, he is bald; [yet] is he clean.";
yng[40] = "`And when a man\'s head [is] polished, he [is] bald, he [is] clean;";
dby[40] = "And if a man\'s hair have fallen off his head, he is bald: he is clean;";
web[40] = "And the man whose hair hath fallen off his head, he [is] bald; [yet is] he clean.";
hnv[40] = "&quot;If a man\'s hair has fallen from his head, he is bald. He is clean.";
vul[40] = "vir de cuius capite capilli fluunt calvus ac mundus est";
kjv[41] = "But when raw flesh appeareth in him, he shall be unclean.";
rsv[41] = "And if a man\'s hair has fallen from his forehead and temples, he has baldness of the forehead but he is clean.";
asv[41] = "And if his hair be fallen off from the front part of his head, he is forehead bald; [yet] is he clean.";
yng[41] = "and if from the corner of his face his head is polished, he [is] bald of the forehead; he [is] clean.";
dby[41] = "and if he have the hair fallen off from the part of the head towards his face, he is forehead-bald: he is clean.";
web[41] = "And he that hath his hair fallen off from the part of his head towards his face, he [is] forehead-bald; [yet is] he clean.";
hnv[41] = "If his hair has fallen off from the front part of his head, he is forehead bald. He is clean.";
vul[41] = "et si a fronte ceciderint pili recalvaster et mundus est";
kjv[42] = "And the priest shall see the raw flesh, and pronounce him to be unclean: [for] the raw flesh [is] unclean: it [is] a leprosy.";
rsv[42] = "But if there is on the bald head or the bald forehead a reddish-white diseased spot, it is leprosy breaking out on his bald head or his bald forehead.";
asv[42] = "But if there be in the bald head, or the bald forehead, a reddish-white plague; it is leprosy breaking out in his bald head, or his bald forehead.";
yng[42] = "`And when there is in the bald back of the head, or in the bald forehead, a very red white plague, it [is] a leprosy breaking out in the bald back of the head, or in the bald forehead;";
dby[42] = "And if there be in the bald head, or bald forehead, a white-reddish sore, it is a leprosy which hath broken out in his bald head, or his bald forehead.";
web[42] = "And if there is in the bald head, or bald forehead, a white reddish sore; [it is] a leprosy sprung up on his bald head, or his bald forehead.";
hnv[42] = "But if there is in the bald head, or the bald forehead, a reddish-white plague; it is leprosy breaking out in his bald head, or his bald forehead.";
vul[42] = "sin autem in calvitio sive in recalvatione albus vel rufus color fuerit exortus";
kjv[43] = "Or if the raw flesh turn again, and be changed unto white, he shall come unto the priest;";
rsv[43] = "Then the priest shall examine him, and if the diseased swelling is reddish-white on his bald head or on his bald forehead, like the appearance of leprosy in the skin of the body,";
asv[43] = "Then the priest shall look upon him; and, behold, if the rising of the plague be reddish-white in his bald head, or in his bald forehead, as the appearance of leprosy in the skin of the flesh;";
yng[43] = "and the priest hath seen him, and lo, the rising of the very red white plague in the bald back of the head, or in the bald forehead, [is] as the appearance of leprosy, in the skin of the flesh,";
dby[43] = "And the priest shall look on it, and behold, the rising of the sore is white-reddish in his bald head, or in his bald forehead, like the appearance of the leprosy in the skin of the flesh;";
web[43] = "Then the priest shall look upon it: and behold, [if] the rising of the sore is white reddish on his bald head, or on his bald forehead, as the leprosy appeareth in the skin of the flesh;";
hnv[43] = "Then the Kohen shall examine him; and, behold, if the rising of the plague is reddish-white in his bald head, or in his bald forehead, like the appearance of leprosy in the skin of the flesh,";
vul[43] = "et hoc sacerdos viderit condemnabit eum haut dubiae leprae quae orta est in calvitio";
kjv[44] = "And the priest shall see him: and, behold, [if] the plague be turned into white; then the priest shall pronounce [him] clean [that hath] the plague: he [is] clean.";
rsv[44] = "he is a leprous man, he is unclean; the priest must pronounce him unclean; his disease is on his head.";
asv[44] = "he is a leprous man, he is unclean: the priest shall surely pronounce him unclean; his plague is in his head.";
yng[44] = "he [is] a leprous man, he [is] unclean; the priest doth pronounce him utterly unclean; his plague [is] in his head.";
dby[44] = "he is a leprous man, he is unclean; the priest shall pronounce him utterly unclean; his sore is in his head.";
web[44] = "He is a leprous man, he [is] unclean: the priest shall pronounce him utterly unclean; his plague [is] in his head.";
hnv[44] = "he is a leprous man. He is unclean. The Kohen shall surely pronounce him unclean. His plague is on his head.";
vul[44] = "quicumque ergo maculatus fuerit lepra et separatus ad arbitrium sacerdotis";
kjv[45] = "The flesh also, in which, [even] in the skin thereof, was a boil, and is healed,";
rsv[45] = "&quot;The leper who has the disease shall wear torn clothes and let the hair of his head hang loose, and he shall cover his upper lip and cry, \'Unclean, unclean.\'";
asv[45] = "And the leper in whom the plague is, his clothes shall be rent, and the hair of his head shall go loose, and he shall cover his upper lip, and shall cry, Unclean, unclean.";
yng[45] = "`As to the leper in whom [is] the plague, his garments are rent, and his head is uncovered, and he covereth over the upper lip, and `Unclean! unclean!\' he calleth;";
dby[45] = "And as to the leper in whom the sore is, -- his garments shall be rent, and his head shall be uncovered, and he shall put a covering on his beard, and shall cry, Unclean, unclean!";
web[45] = "And the leper in whom the plague [is], his clothes shall be rent, and his head bare, and he shall put a covering upon his upper lip, and shall cry, Unclean, unclean.";
hnv[45] = "&quot;The leper in whom the plague is shall wear torn clothes, and the hair of his head shall hang loose. He shall cover his upper lip, and shall cry, \'Unclean! Unclean!\'";
vul[45] = "habebit vestimenta dissuta caput nudum os veste contectum contaminatum ac sordidum se clamabit";
kjv[46] = "And in the place of the boil there be a white rising, or a bright spot, white, and somewhat reddish, and it be shewed to the priest;";
rsv[46] = "He shall remain unclean as long as he has the disease; he is unclean; he shall dwell alone in a habitation outside the camp.";
asv[46] = "All the days wherein the plague is in him he shall be unclean; he is unclean: he shall dwell alone; without the camp shall his dwelling be.";
yng[46] = "all the days that the plague [is] in him he is unclean; he [is] unclean, alone he doth dwell, at the outside of the camp [is] his dwelling.";
dby[46] = "All the days that the sore shall be in him he shall be unclean: he is unclean; he shall dwell apart; outside the camp shall his dwelling be.";
web[46] = "All the days in which the plague [shall be] in him he shall be defiled; he [is] unclean: he shall dwell alone, without the camp [shall] his habitation [be].";
hnv[46] = "All the days in which the plague is in him he shall be unclean. He is unclean. He shall dwell alone. Outside of the camp shall be his dwelling.";
vul[46] = "omni tempore quo leprosus est et inmundus solus habitabit extra castra";
kjv[47] = "And if, when the priest seeth it, behold, it [be] in sight lower than the skin, and the hair thereof be turned white; the priest shall pronounce him unclean: it [is] a plague of leprosy broken out of the boil.";
rsv[47] = "&quot;When there is a leprous disease in a garment, whether a woolen or a linen garment,";
asv[47] = "The garment also that the plague of leprosy is in, whether it be a woollen garment, or a linen garment;";
yng[47] = "`And when there is in any garment a plague of leprosy, -- in a garment of wool, or in a garment of linen,";
dby[47] = "And if a sore of leprosy is in a garment, in a woollen garment, or a linen garment,";
web[47] = "The garment also that the plague of leprosy is in, [whether] a woolen garment, or a linen garment;";
hnv[47] = "&quot;The garment also that the plague of leprosy is in, whether it is a woolen garment, or a linen garment;";
vul[47] = "vestis lanea sive linea quae lepram habuerit";
