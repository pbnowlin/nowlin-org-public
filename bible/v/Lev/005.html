kjv[1] = "And if a soul sin, and hear the voice of swearing, and [is] a witness, whether he hath seen or known [of it]; if he do not utter [it], then he shall bear his iniquity.";
rsv[1] = "&quot;If any one sins in that he hears a public adjuration to testify and though he is a witness, whether he has seen or come to know the matter, yet does not speak, he shall bear his iniquity.";
asv[1] = "And if any one sin, in that he heareth the voice of adjuration, he being a witness, whether he hath seen or known, if he do not utter [it], then he shall bear his iniquity.";
yng[1] = "`And when a person doth sin, and hath heard the voice of an oath, and he [is] witness, or hath seen, or hath known -- if he declare not, then he hath borne his iniquity:";
dby[1] = "And if any one sin, and hear the voice of adjuration, and he is a witness whether he hath seen or known [it], if he do not give information, then he shall bear his iniquity.";
web[1] = "And if a soul shall sin, and hear the voice of swearing, and be a witness, whether he hath seen or known [of it]; if he doth not utter [it], then he shall bear his iniquity.";
hnv[1] = "&quot;\'If anyone sins, in that he hears the voice of adjuration, he being a witness, whether he has seen or known, if he doesn\'t report it, then he shall bear his iniquity.";
vul[1] = "si peccaverit anima et audierit vocem iurantis testisque fuerit quod aut ipse vidit aut conscius est nisi indicaverit portabit iniquitatem suam";
kjv[2] = "Or if a soul touch any unclean thing, whether [it be] a carcase of an unclean beast, or a carcase of unclean cattle, or the carcase of unclean creeping things, and [if] it be hidden from him; he also shall be unclean, and guilty.";
rsv[2] = "Or if any one touches an unclean thing, whether the carcass of an unclean beast or a carcass of unclean cattle or a carcass of unclean swarming things, and it is hidden from him, and he has become unclean, he shall be guilty.";
asv[2] = "Or if any one touch any unclean thing, whether it be the carcass of an unclean beast, or the carcass of unclean cattle, or the carcass of unclean creeping things, and it be hidden from him, and he be unclean, then he shall be guilty.";
yng[2] = "`Or when a person cometh against any thing unclean, or against a carcase of an unclean beast, or against a carcase of unclean cattle, or against a carcase of an unclean teeming creature, and it hath been hidden from him, and he unclean, and guilty;";
dby[2] = "Or if any one touch any unclean thing, whether it be the carcase of an unclean beast, or the carcase of unclean cattle, or the carcase of an unclean crawling thing, and it be hid from him, -- he also is unclean and guilty;";
web[2] = "Or if a soul shall touch any unclean thing, whether a carcass of an unclean beast, or a carcass of unclean cattle, or the carcass of unclean creeping animals, and it shall be hidden from him; he also shall be unclean, and guilty.";
hnv[2] = "&quot;\'Or if anyone touches any unclean thing, whether it is the carcass of an unclean animal, or the carcass of unclean cattle, or the carcass of unclean creeping things, and it is hidden from him, and he is unclean, then he shall be guilty.";
vul[2] = "anima quae tetigerit aliquid inmundum sive quod occisum a bestia est aut per se mortuum vel quodlibet aliud reptile et oblita fuerit inmunditiae suae rea est et deliquit";
kjv[3] = "Or if he touch the uncleanness of man, whatsoever uncleanness [it be] that a man shall be defiled withal, and it be hid from him; when he knoweth [of it], then he shall be guilty.";
rsv[3] = "Or if he touches human uncleanness, of whatever sort the uncleanness may be with which one becomes unclean, and it is hidden from him, when he comes to know it he shall be guilty.";
asv[3] = "Or if he touch the uncleanness of man, whatsoever his uncleanness be wherewith he is unclean, and it be hid from him; when he knoweth of it, then he shall be guilty.";
yng[3] = "`Or when he cometh against uncleanness of man, even any of his uncleanness whereby he is unclean, and it hath been hidden from him, and he hath known, and hath been guilty:";
dby[3] = "or if he touch the uncleanness of man, any uncleanness of him by which he is defiled, and it be hid from him, when he knoweth [it], then he is guilty.";
web[3] = "Or if he shall touch the uncleanness of man, whatever uncleanness [it may be] that a man shall be defiled with, and it be hid from him; when he knoweth [of it], then he shall be guilty.";
hnv[3] = "&quot;\'Or if he touches the uncleanness of man, whatever his uncleanness is with which he is unclean, and it is hidden from him; when he knows of it, then he shall be guilty.";
vul[3] = "et si tetigerit quicquam de inmunditia hominis iuxta omnem inpuritatem qua pollui solet oblitaque cognoverit postea subiacebit delicto";
kjv[4] = "Or if a soul swear, pronouncing with [his] lips to do evil, or to do good, whatsoever [it be] that a man shall pronounce with an oath, and it be hid from him; when he knoweth [of it], then he shall be guilty in one of these.";
rsv[4] = "Or if any one utters with his lips a rash oath to do evil or to do good, any sort of rash oath that men swear, and it is hidden from him, when he comes to know it he shall in any of these be guilty.";
asv[4] = "Or if any one swear rashly with his lips to do evil, or to do good, whatsoever it be that a man shall utter rashly with an oath, and it be hid from him; when he knoweth of it, then he shall be guilty in one of these [things].";
yng[4] = "`Or when a person sweareth, speaking wrongfully with the lips to do evil, or to do good, even anything which man speaketh wrongfully with an oath, and it hath been hid from him; -- when he hath known then he hath been guilty of one of these;";
dby[4] = "Or if any one swear, talking rashly with the lips, to do evil or to do good, in everything that a man shall say rashly with an oath, and it be hid from him, when he knoweth [it], then is he guilty in one of these.";
web[4] = "Or if a soul shall swear, pronouncing with [his] lips to do evil, or to do good, whatever [it may be], that a man shall pronounce with an oath, and it be hid from him; when he knoweth [of it], then he shall be guilty in one of these.";
hnv[4] = "&quot;\'Or if anyone swears rashly with his lips to do evil, or to do good, whatever it is that a man might utter rashly with an oath, and it is hidden from him; when he knows of it, then he shall be guilty of one of these.";
vul[4] = "anima quae iuraverit et protulerit labiis suis ut vel male quid faceret vel bene et id ipsum iuramento et sermone firmaverit oblitaque postea intellexerit delictum suum";
kjv[5] = "And it shall be, when he shall be guilty in one of these [things], that he shall confess that he hath sinned in that [thing]:";
rsv[5] = "When a man is guilty in any of these, he shall confess the sin he has committed,";
asv[5] = "And it shall be, when he shall be guilty in one of these [things], that he shall confess that wherein he hath sinned:";
yng[5] = "`And it hath been when he is guilty of one of these, that he hath confessed concerning that which he hath sinned,";
dby[5] = "And it shall be, when he shall be guilty in one of these, that he shall confess wherein he hath sinned;";
web[5] = "And it shall be, when he shall be guilty in one of these [things], that he shall confess that he hath sinned in that [thing]:";
hnv[5] = "It shall be, when he is guilty of one of these, he shall confess that in which he has sinned:";
vul[5] = "agat paenitentiam pro peccato";
kjv[6] = "And he shall bring his trespass offering unto the LORD for his sin which he hath sinned, a female from the flock, a lamb or a kid of the goats, for a sin offering; and the priest shall make an atonement for him concerning his sin.";
rsv[6] = "and he shall bring his guilt offering to the LORD for the sin which he has committed, a female from the flock, a lamb or a goat, for a sin offering; and the priest shall make atonement for him for his sin.";
asv[6] = "and he shall bring his trespass-offering unto Jehovah for his sin which he hath sinned, a female from the flock, a lamb or a goat, for a sin-offering; and the priest shall make atonement for him as concerning his sin.";
yng[6] = "and hath brought in his guilt-offering to Jehovah for his sin which he hath sinned, a female out of the flock, a lamb, or a kid of the goats, for a sin-offering, and the priest hath made atonement for him, because of his sin.";
dby[6] = "and he shall bring his trespass-offering to Jehovah for his sin which he hath sinned, a female from the small cattle, a sheep or doe goat, for a sin-offering; and the priest shall make atonement for him [to cleanse him] from his sin.";
web[6] = "And he shall bring his trespass-offering to the LORD for his sin which he hath sinned, a female from the flock, a lamb or a kid of the goats, for a sin-offering; and the priest shall make an atonement for him concerning his sin.";
hnv[6] = "and he shall bring his trespass offering to the LORD for his sin which he has sinned, a female from the flock, a lamb or a goat, for a sin offering; and the Kohen shall make atonement for him concerning his sin.";
vul[6] = "et offerat agnam de gregibus sive capram orabitque pro eo sacerdos et pro peccato eius";
kjv[7] = "And if he be not able to bring a lamb, then he shall bring for his trespass, which he hath committed, two turtledoves, or two young pigeons, unto the LORD; one for a sin offering, and the other for a burnt offering.";
rsv[7] = "&quot;But if he cannot afford a lamb, then he shall bring, as his guilt offering to the LORD for the sin which he has committed, two turtledoves or two young pigeons, one for a sin offering and the other for a burnt offering.";
asv[7] = "And if his means suffice not for a lamb, then he shall bring his trespass-offering for that wherein he hath sinned, two turtle-doves, or two young pigeons, unto Jehovah; one for a sin-offering, and the other for a burnt-offering.";
yng[7] = "`And if his hand reach not to the sufficiency of a lamb, then he hath brought in his guilt-offering -- he who hath sinned -- two turtle-doves or two young pigeons to Jehovah, one for a sin-offering, and one for a burnt-offering;";
dby[7] = "And if his hand be not able to bring what is so much as a sheep, then he shall bring for his trespass which he hath sinned two turtle-doves or two young pigeons, to Jehovah; one for a sin-offering, and the other for a burnt-offering.";
web[7] = "And if he shall not be able to bring a lamb, then he shall bring for his trespass which he hath committed, two turtle-doves, or two young pigeons, to the LORD; one for a sin-offering, and the other for a burnt-offering.";
hnv[7] = "&quot;\'If he can\'t afford a lamb, then he shall bring his trespass offering for that in which he has sinned, two turtledoves, or two young pigeons, to the LORD; one for a sin offering, and the other for a burnt offering.";
vul[7] = "sin autem non potuerit offerre pecus offerat duos turtures vel duos pullos columbarum Domino unum pro peccato et alterum in holocaustum";
kjv[8] = "And he shall bring them unto the priest, who shall offer [that] which [is] for the sin offering first, and wring off his head from his neck, but shall not divide [it] asunder:";
rsv[8] = "He shall bring them to the priest, who shall offer first the one for the sin offering; he shall wring its head from its neck, but shall not sever it,";
asv[8] = "And he shall bring them unto the priest, who shall offer that which is for the sin-offering first, and wring off its head from its neck, but shall not divide it asunder:";
yng[8] = "and he hath brought them in unto the priest, and hath brought near that which [is] for a sin-offering first, and hath wrung off its head from its neck, and doth not separate [it],";
dby[8] = "And he shall bring them unto the priest, who shall present that which is for the sin-offering first, and pinch off his head at the neck, but shall not divide it;";
web[8] = "And he shall bring them to the priest, who shall offer [that] which [is] for the sin-offering first, and wring off his head from his neck, but shall not divide [it] asunder:";
hnv[8] = "He shall bring them to the Kohen, who shall first offer the one which is for the sin offering, and wring off its head from its neck, but shall not sever it completely.";
vul[8] = "dabitque eos sacerdoti qui primum offerens pro peccato retorquebit caput eius ad pinnulas ita ut collo hereat et non penitus abrumpatur";
kjv[9] = "And he shall sprinkle of the blood of the sin offering upon the side of the altar; and the rest of the blood shall be wrung out at the bottom of the altar: it [is] a sin offering.";
rsv[9] = "and he shall sprinkle some of the blood of the sin offering on the side of the altar, while the rest of the blood shall be drained out at the base of the altar; it is a sin offering.";
asv[9] = "and he shall sprinkle of the blood of the sin-offering upon the side of the altar; and the rest of the blood shall be drained out at the base of the altar: it is a sin-offering.";
yng[9] = "and he hath sprinkled of the blood of the sin-offering on the side of the altar, and that which is left of the blood is wrung out at the foundation of the altar; it [is] a sin-offering.";
dby[9] = "and he shall sprinkle of the blood of the sin-offering on the wall of the altar; and the rest of the blood shall be wrung out at the bottom of the altar: it is a sin-offering.";
web[9] = "And he shall sprinkle of the blood of the sin-offering upon the side of the altar; and the rest of the blood shall be wrung out at the bottom of the altar: it [is] a sin-offering.";
hnv[9] = "He shall sprinkle some of the blood of the sin offering on the side of the altar; and the rest of the blood shall be drained out at the base of the altar. It is a sin offering.";
vul[9] = "et asperget de sanguine eius parietem altaris quicquid autem reliquum fuerit faciet destillare ad fundamentum eius quia pro peccato est";
kjv[10] = "And he shall offer the second [for] a burnt offering, according to the manner: and the priest shall make an atonement for him for his sin which he hath sinned, and it shall be forgiven him.";
rsv[10] = "Then he shall offer the second for a burnt offering according to the ordinance; and the priest shall make atonement for him for the sin which he has committed, and he shall be forgiven.";
asv[10] = "And he shall offer the second for a burnt-offering, according to the ordinance; and the priest shall make atonement for him as concerning his sin which he hath sinned, and he shall be forgiven.";
yng[10] = "`And the second he maketh a burnt-offering, according to the ordinance, and the priest hath made atonement for him, because of his sin which he hath sinned, and it hath been forgiven him.";
dby[10] = "And he shall offer the other for a burnt-offering, according to the ordinance. And the priest shall make atonement for him [to cleanse him] from his sin which he hath sinned, and it shall be forgiven him.";
web[10] = "And he shall offer the second [for] a burnt-offering, according to the manner: and the priest shall make an atonement for him for his sin which he hath sinned, and it shall be forgiven him.";
hnv[10] = "He shall offer the second for a burnt offering, according to the ordinance; and the Kohen shall make atonement for him concerning his sin which he has sinned, and he shall be forgiven.";
vul[10] = "alterum vero adolebit holocaustum ut fieri solet rogabitque pro eo sacerdos et pro peccato eius et dimittetur ei";
kjv[11] = "But if he be not able to bring two turtledoves, or two young pigeons, then he that sinned shall bring for his offering the tenth part of an ephah of fine flour for a sin offering; he shall put no oil upon it, neither shall he put [any] frankincense thereon: for it [is] a sin offering.";
rsv[11] = "&quot;But if he cannot afford two turtledoves or two young pigeons, then he shall bring, as his offering for the sin which he has committed, a tenth of an ephah of fine flour for a sin offering; he shall put no oil upon it, and shall put no frankincense on it, for it is a sin offering.";
asv[11] = "But if his means suffice not for two turtle-doves, or two young pigeons, then he shall bring his oblation for that wherein he hath sinned, the tenth part of an ephah of fine flour for a sin-offering: he shall put no oil upon it, neither shall he put any frankincense thereon; for it is a sin-offering.";
yng[11] = "`And if his hand reach not to two turtle-doves, or to two young pigeons, then he hath brought in his offering -- he who hath sinned -- a tenth of an ephah of flour for a sin-offering; he putteth no oil on it, nor doth he put on it frankincense, for it [is] a sin-offering,";
dby[11] = "But if his hand cannot attain to two turtle-doves, or two young pigeons, then he that sinned shall bring for his offering the tenth part of an ephah of fine flour for a sin-offering: he shall put no oil on it, neither shall he put frankincense thereon; for it is a sin-offering.";
web[11] = "But if he shall not be able to bring two turtle-doves, or two young pigeons; then he that sinned shall bring for his offering the tenth part of an ephah of fine flour for a sin-offering; he shall put no oil upon it, neither shall he put [any] frankincense upon it: for it [is] a sin-offering.";
hnv[11] = "&quot;\'But if he can\'t afford two turtledoves, or two young pigeons, then he shall bring his offering for that in which he has sinned, the tenth part of an efah of fine flour for a sin offering. He shall put no oil on it, neither shall he put any frankincense on it, for it is a sin offering.";
vul[11] = "quod si non quiverit manus eius offerre duos turtures vel duos pullos columbae offeret pro peccato similam partem oephi decimam non mittet in eam oleum nec turis aliquid inponet quia pro peccato est";
kjv[12] = "Then shall he bring it to the priest, and the priest shall take his handful of it, [even] a memorial thereof, and burn [it] on the altar, according to the offerings made by fire unto the LORD: it [is] a sin offering.";
rsv[12] = "And he shall bring it to the priest, and the priest shall take a handful of it as its memorial portion and burn this on the altar, upon the offerings by fire to the LORD; it is a sin offering.";
asv[12] = "And he shall bring it to the priest, and the priest shall take his handful of it as the memorial thereof, and burn it on the altar, upon the offerings of Jehovah made by fire: it is a sin-offering.";
yng[12] = "and he hath brought it in unto the priest, and the priest hath taken a handful from it -- the fulness of his hand -- its memorial -- and hath made perfume on the altar, according to the fire-offerings of Jehovah; it [is] a sin-offering.";
dby[12] = "And he shall bring it to the priest, and the priest shall take his handful of it, the memorial thereof, and burn it on the altar, with Jehovah\'s offerings by fire: it is a sin-offering.";
web[12] = "Then shall he bring it to the priest, and the priest shall take his handful of it, [even] a memorial of it, and burn [it] on the altar, according to the offerings made by fire to the LORD: it [is] a sin-offering.";
hnv[12] = "He shall bring it to the Kohen, and the Kohen shall take his handful of it as the memorial portion, and burn it on the altar, on the offerings of the LORD made by fire. It is a sin offering.";
vul[12] = "tradetque eam sacerdoti qui plenum ex toto pugillum hauriens cremabit super altare in monumentum eius qui obtulit";
kjv[13] = "And the priest shall make an atonement for him as touching his sin that he hath sinned in one of these, and it shall be forgiven him: and [the remnant] shall be the priest\'s, as a meat offering.";
rsv[13] = "Thus the priest shall make atonement for him for the sin which he has committed in any one of these things, and he shall be forgiven. And the remainder shall be for the priest, as in the cereal offering.&quot;";
asv[13] = "And the priest shall make atonement for him as touching his sin that he hath sinned in any of these things, and he shall be forgiven: and [the remnant] shall be the priest\'s, as the meal-offering.";
yng[13] = "`And the priest hath made atonement for him, for his sin which he hath sinned against one of these, and it hath been forgiven him, and [the remnant] hath been to the priest, like the present.\'";
dby[13] = "And the priest shall make atonement for him concerning his sin which he hath sinned in one of these, and it shall be forgiven him; and it shall be the priest\'s, as the oblation.";
web[13] = "And the priest shall make an atonement for him as concerning his sin that he hath sinned in one of these, and it shall be forgiven him: and [the remnant] shall be the priest\'s, as a meat-offering.";
hnv[13] = "The Kohen shall make atonement for him concerning his sin that he has sinned in any of these things, and he will be forgiven; and the rest shall be the Kohen\'s, as the meal offering.\'&quot;";
vul[13] = "rogans pro illo et expians reliquam vero partem ipse habebit in munere";
kjv[14] = "And the LORD spake unto Moses, saying,";
rsv[14] = "The LORD said to Moses,";
asv[14] = "And Jehovah spake unto Moses, saying,";
yng[14] = "And Jehovah speaketh unto Moses, saying,";
dby[14] = "And Jehovah spoke to Moses, saying,";
web[14] = "And the LORD spoke to Moses, saying,";
hnv[14] = "The LORD spoke to Moshe, saying,";
vul[14] = "locutus est Dominus ad Mosen dicens";
kjv[15] = "If a soul commit a trespass, and sin through ignorance, in the holy things of the LORD; then he shall bring for his trespass unto the LORD a ram without blemish out of the flocks, with thy estimation by shekels of silver, after the shekel of the sanctuary, for a trespass offering:";
rsv[15] = "&quot;If any one commits a breach of faith and sins unwittingly in any of the holy things of the LORD, he shall bring, as his guilt offering to the LORD, a ram without blemish out of the flock, valued by you in shekels of silver, according to the shekel of the sanctuary; it is a guilt offering.";
asv[15] = "If any one commit a trespass, and sin unwittingly, in the holy things of Jehovah; then he shall bring his trespass-offering unto Jehovah, a ram without blemish out of the flock, according to thy estimation in silver by shekels, after the shekel of the sanctuary, for a trespass-offering:";
yng[15] = "`When a person committeth a trespass, and hath sinned through ignorance against the holy things of Jehovah, then he hath brought in his guilt-offering to Jehovah, a ram, a perfect one, out of the flock, at thy valuation [in] silver -- shekels by the shekel of the sanctuary -- for a guilt-offering.";
dby[15] = "If any one act unfaithfully and sin through inadvertence in the holy things of Jehovah, then he shall bring his trespass-offering to Jehovah, a ram without blemish out of the small cattle, according to thy valuation by shekels of silver, according to the shekel of the sanctuary, for a trespass-offering.";
web[15] = "If a soul shall commit a trespass, and sin through ignorance, in the holy things of the LORD; then he shall bring for his trespass to the LORD a ram without blemish out of the flocks, with thy estimation by shekels of silver, after the shekel of the sanctuary, for a trespass-offering:";
hnv[15] = "&quot;If anyone commits a trespass, and sins unwittingly, in the holy things of the LORD; then he shall bring his trespass offering to the LORD, a ram without blemish from the flock, according to your estimation in silver by shekels, after the shekel of the sanctuary, for a trespass offering.";
vul[15] = "anima si praevaricans caerimonias per errorem in his quae Domino sunt sanctificata peccaverit offeret pro delicto suo arietem inmaculatum de gregibus qui emi potest duobus siclis iuxta pondus sanctuarii";
kjv[16] = "And he shall make amends for the harm that he hath done in the holy thing, and shall add the fifth part thereto, and give it unto the priest: and the priest shall make an atonement for him with the ram of the trespass offering, and it shall be forgiven him.";
rsv[16] = "He shall also make restitution for what he has done amiss in the holy thing, and shall add a fifth to it and give it to the priest; and the priest shall make atonement for him with the ram of the guilt offering, and he shall be forgiven.";
asv[16] = "and he shall make restitution for that which he hath done amiss in the holy thing, and shall add the fifth part thereto, and give it unto the priest; and the priest shall make atonement for him with the ram of the trespass-offering, and he shall be forgiven.";
yng[16] = "`And that which he hath sinned against the holy thing he repayeth, and its fifth is adding to it, and hath given it to the priest, and the priest maketh atonement for him with the ram of the guilt-offering, and it hath been forgiven him.";
dby[16] = "And he shall make restitution for the wrong that he hath done in the holy things, and shall add the fifth part thereto, and shall give it unto the priest; and the priest shall make atonement for him with the ram of the trespass-offering, and it shall be forgiven him.";
web[16] = "And he shall make amends for the harm that he hath done in the holy thing, and shall add to it the fifth part, and give it to the priest: and the priest shall make an atonement for him with the ram of the trespass-offering, and it shall be forgiven him.";
hnv[16] = "He shall make restitution for that which he has done amiss in the holy thing, and shall add a fifth part to it, and give it to the Kohen; and the Kohen shall make atonement for him with the ram of the trespass offering, and he will be forgiven.";
vul[16] = "ipsumque quod intulit damni restituet et quintam partem ponet supra tradens sacerdoti qui rogabit pro eo offerens arietem et dimittetur ei";
kjv[17] = "And if a soul sin, and commit any of these things which are forbidden to be done by the commandments of the LORD; though he wist [it] not, yet is he guilty, and shall bear his iniquity.";
rsv[17] = "&quot;If any one sins, doing any of the things which the LORD has commanded not to be done, though he does not know it, yet he is guilty and shall bear his iniquity.";
asv[17] = "And if any one sin, and do any of the things which Jehovah hath commanded not to be done; though he knew it not, yet is he guilty, and shall bear his iniquity.";
yng[17] = "`And when any person sinneth, and hath done [something against] one of all the commands of Jehovah [regarding things] which are not to be done, and hath not known, and he hath been guilty, and hath borne his iniquity,";
dby[17] = "And if any one sin and do against any of all the commandments of Jehovah what should not be done, and hath not known [it], yet is he guilty, and shall bear his iniquity.";
web[17] = "And if a soul shall sin, and commit any of these things which are forbidden to be done by the commandments of the LORD; though he knew [it] not, yet is he guilty, and shall bear his iniquity.";
hnv[17] = "&quot;If anyone sins, and does any of the things which the LORD has commanded not to be done; though he didn\'t know it, yet he is guilty, and shall bear his iniquity.";
vul[17] = "anima si peccaverit per ignorantiam feceritque unum ex his quae Domini lege prohibentur et peccati rea intellexerit iniquitatem suam";
kjv[18] = "And he shall bring a ram without blemish out of the flock, with thy estimation, for a trespass offering, unto the priest: and the priest shall make an atonement for him concerning his ignorance wherein he erred and wist [it] not, and it shall be forgiven him.";
rsv[18] = "He shall bring to the priest a ram without blemish out of the flock, valued by you at the price for a guilt offering, and the priest shall make atonement for him for the error which he committed unwittingly, and he shall be forgiven.";
asv[18] = "And he shall bring a ram without blemish out of the flock, according to thy estimation, for a trespass-offering, unto the priest; and the priest shall make atonement for him concerning the thing wherein he erred unwittingly and knew it not, and he shall be forgiven.";
yng[18] = "`Then he hath brought in a ram, a perfect one, out of the flock, at thy valuation, for a guilt-offering, unto the priest; and the priest hath made atonement for him, for his ignorance in which he hath erred and he hath not known, and it hath been forgiven him;";
dby[18] = "And he shall bring a ram without blemish out of the small cattle, according to thy valuation, as trespass-offering, unto the priest; and the priest shall make atonement for him concerning his inadvertence wherein he sinned inadvertently, and knew [it] not, and it shall be forgiven him.";
web[18] = "And he shall bring a ram without blemish out of the flock, with thy estimation, for a trespass-offering to the priest; and the priest shall make an atonement for him concerning his ignorance wherein he erred and knew [it] not, and it shall be forgiven him.";
hnv[18] = "He shall bring a ram without blemish from of the flock, according to your estimation, for a trespass offering, to the Kohen; and the Kohen shall make atonement for him concerning the thing in which he sinned and didn\'t know it, and he will be forgiven.";
vul[18] = "offeret arietem inmaculatum de gregibus sacerdoti iuxta mensuram aestimationemque peccati qui orabit pro eo quod nesciens fecerit et dimittetur ei";
kjv[19] = "It [is] a trespass offering: he hath certainly trespassed against the LORD.";
rsv[19] = "It is a guilt offering; he is guilty before the LORD.&quot;";
asv[19] = "It is a trespass-offering: he is certainly guilty before Jehovah.";
yng[19] = "it [is] a guilt-offering; he hath been certainly guilty before Jehovah.\'";
dby[19] = "It is a trespass-offering: he hath certainly trespassed against Jehovah.";
web[19] = "It [is] a trespass-offering: he hath certainly trespassed against the LORD.";
hnv[19] = "It is a trespass offering. He is certainly guilty before the LORD.&quot;";
vul[19] = "quia per errorem deliquit in Dominum";
csb[1] = "&quot;When someone sins in any of these ways: If he has seen, heard, or known about something he has witnessed, and did not respond to a public call to testify, he will bear his iniquity.";
csb[2] = "&quot;Or if someone touches anything unclean -- a carcass of an unclean wild animal, or unclean livestock, or an unclean swarming creature -- without being aware of it, he is unclean and incurs guilt.";
csb[3] = "&quot;Or if he touches human uncleanness -- any uncleanness by which one can become defiled -- without being aware of it, but later recognizes it, he incurs guilt.";
csb[4] = "&quot;Or if someone swears rashly to do what is good or evil -- concerning anything a person may speak rashly in an oath -- without being aware of it, but later recognizes it, he incurs guilt in such an instance.";
csb[5] = "&quot;If someone incurs guilt in one of these cases, he is to confess he has committed that sin.";
csb[6] = "&quot;He must bring his penalty for guilt for the sin he has committed to the LORD: a female lamb or goat from the flock as a sin offering. In this way the priest will make atonement on his behalf for his sin.";
csb[7] = "&quot;But if he cannot afford an animal from the flock, then he may bring to the LORD two turtledoves or two young pigeons as penalty for guilt for his sin -- one as a sin offering and the other as a burnt offering.";
csb[8] = "&quot;He is to bring them to the priest, who will first present the one for the sin offering. He is to twist its head at the back of the neck without severing it.";
csb[9] = "&quot;Then he will sprinkle some of the blood of the sin offering on the side of the altar, while the rest of the blood is to be drained out at the base of the altar; it is a sin offering.";
csb[10] = "&quot;He will prepare the second bird as a burnt offering according to the regulation. In this way the priest will make atonement on his behalf for the sin he has committed, and he will be forgiven.";
csb[11] = "&quot;But if he cannot afford two turtledoves or two young pigeons, he may bring two quarts of fine flour as an offering for his sin. He must not put olive oil or frankincense on it, for it is a sin offering.";
csb[12] = "&quot;He is to bring it to the priest, who will take a handful from it as its memorial portion and burn it on the altar along with the fire offerings to the LORD; it is a sin offering.";
csb[13] = "&quot;In this way the priest will make atonement on his behalf concerning the sin he has committed in any of these cases, and he will be forgiven. The rest will belong to the priest, like the grain offering.&quot;";
csb[14] = "Then the LORD spoke to Moses:";
csb[15] = "&quot;If someone offends by sinning unintentionally in regard to any of the LORD\'s holy things, he must bring his penalty for guilt to the LORD : an unblemished ram from the flock (based on your assessment of its value in silver shekels, according to the sanctuary shekel) as a guilt offering.";
csb[16] = "&quot;He is to make restitution for his sin regarding any holy thing, adding a fifth of its value to it, and give it to the priest. Then the priest will make atonement on his behalf with the ram of the guilt offering, and he will be forgiven.";
csb[17] = "&quot;If someone sins and without knowing it violates any of the LORD\'s commands concerning anything prohibited, he is guilty, and he will bear his iniquity.";
csb[18] = "&quot;He must bring an unblemished ram from the flock according to your assessment of its value as a guilt offering to the priest. Then the priest will make atonement on his behalf for the error he has committed unintentionally, and he will be forgiven.";
csb[19] = "&quot;It is a guilt offering; he is indeed guilty before the LORD.&quot;";
