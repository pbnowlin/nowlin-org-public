csb[1] = "The LORD spoke to Moses and Aaron:";
csb[2] = "&quot;Tell the Israelites: You may eat all these kinds of land animals.";
csb[3] = "&quot;You may eat any animal with divided hooves and that chews the cud.";
csb[4] = "&quot;But among the ones that chew the cud or have divided hooves you are not to eat these: camels, though they chew the cud, do not have divided hooves -- they are unclean for you;";
csb[5] = "&quot;hyraxes, though they chew the cud, do not have hooves -- they are unclean for you;";
csb[6] = "&quot;hares, though they chew the cud, do not have hooves -- they are unclean for you;";
csb[7] = "&quot;pigs, though they have divided hooves, do not chew the cud -- they are unclean for you.";
csb[8] = "&quot;Do not eat any of their meat or touch their carcasses -- they are unclean for you.";
csb[9] = "&quot;This is what you may eat from all that is in the water: You may eat everything in the water that has fins and scales, whether in the seas or streams.";
csb[10] = "&quot;But these are to be abhorrent to you: everything in the seas or streams that does not have fins and scales among all the swarming things and other living creatures in the water.";
csb[11] = "&quot;They are to remain abhorrent to you; you must not eat any of their meat, and you must abhor their carcasses.";
csb[12] = "&quot;Everything in the water that does not have fins and scales will be abhorrent to you.";
csb[13] = "&quot;You are to abhor these birds. They must not be eaten because they are abhorrent: eagles, bearded vultures, Egyptian vultures,";
csb[14] = "&quot;kites, any kind of falcon,";
csb[15] = "&quot;every kind of raven,";
csb[16] = "&quot;ostriches, short-eared owls, gulls, any kind of hawk,";
csb[17] = "&quot;little owls, cormorants, long-eared owls,";
csb[18] = "&quot;barn owls, eagle owls, ospreys,";
csb[19] = "&quot;storks, any kind of heron, hoopoes, and bats.";
csb[20] = "&quot;All winged insects that walk on all fours are to be abhorrent to you.";
csb[21] = "&quot;But you may eat these kinds of all the winged insects that walk on all fours: those that have jointed legs above their feet for hopping on the ground.";
csb[22] = "&quot;You may eat these: any kind of locust, katydid, cricket, and grasshopper.";
csb[23] = "&quot;All other winged insects that have four feet are to be abhorrent to you.";
csb[24] = "&quot;These will make you unclean. Whoever touches their carcasses will be unclean until evening,";
csb[25] = "&quot;and whoever carries any of their carcasses is to wash his clothes and will be unclean until evening.";
csb[26] = "&quot;All animals that have hooves but do not have a divided hoof and do not chew the cud are unclean for you. Whoever touches them becomes unclean.";
csb[27] = "&quot;All the four-footed animals that walk on their paws are unclean for you. Whoever touches their carcasses will be unclean until evening,";
csb[28] = "&quot;and anyone who carries their carcasses is to wash his clothes and will be unclean until evening. They are unclean for you.";
csb[29] = "&quot;These creatures that swarm on the ground are unclean for you: weasels, mice, any kind of large lizard,";
csb[30] = "&quot;geckos, monitor lizards, common lizards, skinks, and chameleons.";
csb[31] = "&quot;These are unclean for you among all the swarming creatures. Whoever touches them when they are dead will be unclean until evening.";
csb[32] = "&quot;When any one of them dies and falls on anything it becomes unclean -- any item of wood, clothing, leather, sackcloth, or any implement used for work. It is to be rinsed with water and will remain unclean until evening; then it will be clean.";
csb[33] = "&quot;If any of them falls into any clay pot, everything in it will become unclean; you are to break it.";
csb[34] = "&quot;Any edible food coming into contact with that unclean water will become unclean, and any drinkable liquid in any container will become unclean.";
csb[35] = "&quot;Anything one of their carcasses falls on will become unclean. If it is an oven or stove, it is to be smashed; it is unclean and will remain unclean for you.";
csb[36] = "&quot;A spring or cistern containing water will remain clean, but someone who touches a carcass in it will become unclean.";
csb[37] = "&quot;If one of their carcasses falls on any seed that is to be sown, it is clean;";
csb[38] = "&quot;but if water has been put on the seed and one of their carcasses falls on it, it is unclean for you.";
csb[39] = "&quot;If one of the animals that you use for food dies, anyone who touches its carcass will be unclean until evening.";
csb[40] = "&quot;Anyone who eats some of its carcass is to wash his clothes and will be unclean until evening. Anyone who carries its carcass must wash his clothes and will be unclean until evening.";
csb[41] = "&quot;All the creatures that swarm on the earth are abhorrent; they must not be eaten.";
csb[42] = "&quot;Do not eat any of the creatures that swarm on the earth, anything that moves on its belly or walks on all fours or on many feet, for they are abhorrent.";
csb[43] = "&quot;Do not become contaminated by any creature that swarms; do not become unclean or defiled by them.";
csb[44] = "&quot;For I am the LORD your God, so you must consecrate yourselves and be holy because I am holy. Do not defile yourselves by any swarming creature that crawls on the ground.";
csb[45] = "&quot;For I am the LORD, who brought you up from the land of Egypt to be your God, so you must be holy because I am holy.";
csb[46] = "&quot;This is the law concerning animals, birds, all living creatures that move in the water, and all creatures that swarm on the ground,";
csb[47] = "&quot;in order to distinguish between the unclean and the clean, between the animals that may be eaten and those that may not be eaten.&quot;";
</script>
