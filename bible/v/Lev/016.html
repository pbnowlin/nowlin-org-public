kjv[21] = "And Aaron shall lay both his hands upon the head of the live goat, and confess over him all the iniquities of the children of Israel, and all their transgressions in all their sins, putting them upon the head of the goat, and shall send [him] away by the hand of a fit man into the wilderness:";

asv[21] = "and Aaron shall lay both his hands upon the head of the live goat, and confess over him all the iniquities of the children of Israel, and all their transgressions, even all their sins; and he shall put them upon the head of the goat, and shall send him away by the hand of a man that is in readiness into the wilderness:";
yng[21] = "and Aaron hath laid his two hands on the head of the living goat, and hath confessed over it all the iniquities of the sons of Israel, and all their transgressions in all their sins, and hath put them on the head of the goat, and hath sent [it] away by the hand of a fit man into the wilderness;";
dby[21] = "and Aaron shall lay both his hands on the head of the living goat, and confess over it all the iniquities of the children of Israel, and all their transgressions in all their sins, and he shall put them on the head of the goat, and shall send him away to the wilderness by the hand of a man standing ready;";
web[21] = "And Aaron shall lay both his hands upon the head of the live goat, and confess over him all the iniquities of the children of Israel, and all their transgressions in all their sins, putting them upon the head of the goat, and shall send [him] away by the hand of a fit man into the wilderness:";

yng[22] = "and the goat hath borne on him all their iniquities unto a land of separation. `And he hath sent the goat away into the wilderness,";

kjv[23] = "And Aaron shall come into the tabernacle of the congregation, and shall put off the linen garments, which he put on when he went into the holy [place], and shall leave them there:";

rsv[24] = "and he shall bathe his body in water in a holy place, and put on his garments, and come forth, and offer his burnt offering and the burnt offering of the people, and make atonement for himself and for the people.";
asv[24] = "and he shall bathe his flesh in water in a holy place, and put on his garments, and come forth, and offer his burnt-offering and the burnt-offering of the people, and make atonement for himself and for the people.";
yng[24] = "and he hath bathed his flesh with water in the holy place, and hath put on his garments, and hath come out, and hath made his burnt-offering, and the burnt-offering of the people, and hath made atonement for himself and for the people;";
dby[24] = "and he shall bathe his flesh with water in a holy place, and put on his garments, and go forth, and offer his burnt-offering, and the burnt-offering of the people, and make atonement for himself, and for the people.";

rsv[27] = "And the bull for the sin offering and the goat for the sin offering, whose blood was brought in to make atonement in the holy place, shall be carried forth outside the camp; their skin and their flesh and their dung shall be burned with fire.";
asv[27] = "And the bullock of the sin-offering, and the goat of the sin-offering, whose blood was brought in to make atonement in the holy place, shall be carried forth without the camp; and they shall burn in the fire their skins, and their flesh, and their dung.";
yng[27] = "`And the bullock of the sin-offering, and the goat of the sin-offering, whose blood hath been brought in to make atonement in the sanctuary, doth [one] bring out unto the outside of the camp, and they have burnt with fire their skins, and their flesh, and their dung;";

kjv[29] = "And [this] shall be a statute for ever unto you: [that] in the seventh month, on the tenth [day] of the month, ye shall afflict your souls, and do no work at all, [whether it be] one of your own country, or a stranger that sojourneth among you:";
rsv[29] = "&quot;And it shall be a statute to you for ever that in the seventh month, on the tenth day of the month, you shall afflict yourselves, and shall do no work, either the native or the stranger who sojourns among you;";
asv[29] = "And it shall be a statute for ever unto you: in the seventh month, on the tenth day of the month, ye shall afflict your souls, and shall do no manner of work, the home-born, or the stranger that sojourneth among you:";
yng[29] = "`And it hath been to you for a statute age-during, in the seventh month, in the tenth of the month, ye humble yourselves, and do no work -- the native, and the sojourner who is sojourning in your midst;";
dby[29] = "And this shall be an everlasting statute unto you. In the seventh month, on the tenth of the month, ye shall afflict your souls, and do no work at all, the home-born, and the stranger that sojourneth among you;";

hnv[29] = "&quot;It shall be a statute to you forever: in the seventh month, on the tenth day of the month, you shall afflict your souls, and shall do no manner of work, the native-born, or the stranger who lives as a foreigner among you:";

asv[31] = "It is a sabbath of solemn rest unto you, and ye shall afflict your souls; it is a statute for ever.";

kjv[32] = "And the priest, whom he shall anoint, and whom he shall consecrate to minister in the priest\'s office in his father\'s stead, shall make the atonement, and shall put on the linen clothes, [even] the holy garments:";

asv[32] = "And the priest, who shall be anointed and who shall be consecrated to be priest in his father\'s stead, shall make the atonement, and shall put on the linen garments, even the holy garments:";
yng[32] = "`And the priest whom he doth anoint, and whose hand he doth consecrate to act as priest instead of his father, hath made atonement, and hath put on the linen garments, the holy garments;";
dby[32] = "And the priest who hath been anointed, and who hath been consecrated, to exercise the priesthood in his father\'s stead, shall make atonement; and he shall put on the linen garments, the holy garments.";

hnv[32] = "The Kohen, who is anointed and who is consecrated to be Kohen in his father\'s place, shall make the atonement, and shall put on the linen garments, even the holy garments.";
vul[32] = "expiabit autem sacerdos qui unctus fuerit et cuius initiatae manus ut sacerdotio fungatur pro patre suo indueturque stola linea et vestibus sanctis";
kjv[33] = "And he shall make an atonement for the holy sanctuary, and he shall make an atonement for the tabernacle of the congregation, and for the altar, and he shall make an atonement for the priests, and for all the people of the congregation.";
rsv[33] = "he shall make atonement for the sanctuary, and he shall make atonement for the tent of meeting and for the altar, and he shall make atonement for the priests and for all the people of the assembly.";
asv[33] = "and he shall make atonement for the holy sanctuary; and he shall make atonement for the tent of meeting and for the altar; and he shall make atonement for the priests and for all the people of the assembly.";
yng[33] = "and he hath made atonement [for] the holy sanctuary; and [for] the tent of meeting, even [for] the altar he doth make atonement; yea, for the priests, and for all the people of the assembly he maketh atonement.";
dby[33] = "And he shall make atonement for the holy sanctuary; and for the tent of meeting, and for the altar shall he make atonement; and for the priests, and for the whole people of the congregation shall he make atonement.";
web[33] = "And he shall make an atonement for the holy sanctuary, and he shall make an atonement for the tabernacle of the congregation, and for the altar: and he shall make an atonement for the priests, and for all the people of the congregation.";
hnv[33] = "Then he shall make atonement for the Holy Sanctuary; and he shall make atonement for the Tent of Meeting and for the altar; and he shall make atonement for the Kohanim and for all the people of the assembly.";
vul[33] = "et expiabit sanctuarium et tabernaculum testimonii atque altare sacerdotes quoque et universum populum";
kjv[34] = "And this shall be an everlasting statute unto you, to make an atonement for the children of Israel for all their sins once a year. And he did as the LORD commanded Moses.";
rsv[34] = "And this shall be an everlasting statute for you, that atonement may be made for the people of Israel once in the year because of all their sins.&quot; And Moses did as the LORD commanded him.";
asv[34] = "And this shall be an everlasting statute unto you, to make atonement for the children of Israel because of all their sins once in the year. And he did as Jehovah commanded Moses.";
yng[34] = "`And this hath been to you for a statute age-during, to make atonement for the sons of Israel, because of all their sins, once in a year;\' and he doth as Jehovah hath commanded Moses.";
dby[34] = "And this shall be an everlasting statute unto you, to make atonement for the children of Israel [to cleanse them] from all their sins once a year. And he did as Jehovah had commanded Moses.";
web[34] = "And this shall be an everlasting statute to you, to make an atonement for the children of Israel for all their sins once a year. And he did as the LORD commanded Moses.";
hnv[34] = "&quot;This shall be an everlasting statute for you, to make atonement for the children of Yisra\'el once in the year because of all their sins.&quot; It was done as the LORD commanded Moshe.";
vul[34] = "eritque hoc vobis legitimum sempiternum ut oretis pro filiis Israhel et pro cunctis peccatis eorum semel in anno fecit igitur sicut praeceperat Dominus Mosi";
csb[1] = "The LORD spoke to Moses after the death of two of Aaron\'s sons when they approached the presence of the LORD and died.";
csb[2] = "The LORD said to Moses: &quot;Tell your brother Aaron that he may not come whenever he wants into the holy place behind the curtain in front of the mercy seat on the ark or else he will die, because I appear in the cloud above the mercy seat.";
csb[3] = "&quot;Aaron is to enter the most holy place in this way: with a young bull for a sin offering and a ram for a burnt offering.";
csb[4] = "&quot;He is to wear a holy linen tunic, and linen undergarments are to be on his body. He is to tie a linen sash around him and wrap his head with a linen turban. These are holy garments; he must bathe his body with water before he wears them.";
csb[5] = "&quot;He is to take from the Israelite community two male goats for a sin offering and one ram for a burnt offering.";
csb[6] = "&quot;Aaron will present the bull for his sin offering and make atonement for himself and his household.";
csb[7] = "&quot;Next he will take the two goats and place them before the LORD at the entrance to the tent of meeting.";
csb[8] = "&quot;After Aaron casts lots for the two goats, one lot for the LORD and the other for an uninhabitable place,";
csb[9] = "&quot;he is to present the goat chosen by lot for the LORD and sacrifice it as a sin offering.";
csb[10] = "&quot;But the goat chosen by lot for an uninhabitable place is to be presented alive before the LORD to make atonement with it by sending it into the wilderness for an uninhabitable place.";
csb[11] = "&quot;When Aaron presents the bull for his sin offering and makes atonement for himself and his household, he will slaughter the bull for his sin offering.";
csb[12] = "&quot;Then he is to take a firepan full of blazing coals from the altar before the LORD and two handfuls of finely ground fragrant incense, and bring them inside the curtain.";
csb[13] = "&quot;He is to put the incense on the fire before the LORD, so that the cloud of incense covers the mercy seat that is over the testimony, or else he will die.";
csb[14] = "&quot;He is to take some of the bull\'s blood and sprinkle it with his finger against the east side of the mercy seat; then he will sprinkle some of the blood with his finger before the mercy seat seven times.";
csb[15] = "&quot;When he slaughters the male goat for the people\'s sin offering and brings its blood inside the curtain, he will do the same with its blood as he did with the bull\'s blood: He is to sprinkle it against the mercy seat and in front of it.";
csb[16] = "&quot;He will make atonement for the most holy place in this way for all their sins because of the Israelites\' impurities and rebellious acts. He will do the same for the tent of meeting that remains among them, because it is surrounded by their impurities.";
csb[17] = "&quot;No one may be in the tent of meeting from the time he enters to make atonement in the most holy place until he leaves after he has made atonement for himself, his household, and the whole assembly of Israel.";
csb[18] = "&quot;Then he will go out to the altar that is before the LORD and make atonement for it. He is to take some of the bull\'s blood and some of the goat\'s blood and put it on the horns on all sides of the altar.";
csb[19] = "&quot;He is to sprinkle some of the blood on it with his finger seven times to cleanse and set it apart from the Israelites\' impurities.";
csb[20] = "&quot;When he has finished making atonement for the most holy place, the tent of meeting, and the altar, he is to present the live male goat.";
csb[21] = "&quot;Aaron will lay both his hands on the head of the live goat and confess over it all the Israelites\' iniquities and rebellious acts -- all their sins. He is to put them on the goat\'s head and send it away into the wilderness by the man appointed for the task.";
csb[22] = "&quot;The goat will carry all their iniquities into a desolate land, and the man will release it there.";
csb[23] = "&quot;Then Aaron is to enter the tent of meeting, take off the linen garments he wore when he entered the most holy place, and leave them there.";
csb[24] = "&quot;He will bathe his body with water in a holy place and put on his clothes. Then he must go out and sacrifice his burnt offering and the people\'s burnt offering; he will make atonement for himself and for the people.";
csb[25] = "&quot;He is to burn the fat of the sin offering on the altar.";
csb[26] = "&quot;The man who released the goat for an uninhabitable place is to wash his clothes and bathe his body with water; afterward he may reenter the camp.";
csb[27] = "&quot;The bull for the sin offering and the goat for the sin offering, whose blood was brought into the most holy place to make atonement, must be brought outside the camp and their hide, flesh, and waste burned.";
csb[28] = "&quot;The one who burns them is to wash his clothes and bathe himself with water; afterward he may reenter the camp.";
csb[29] = "&quot;This is to be a permanent statute for you: In the seventh month, on the tenth day of the month you are to practice self-denial and do no work, both the native and the alien who resides among you.";
csb[30] = "&quot;Atonement will be made for you on this day to cleanse you, and you will be clean from all your sins before the LORD.";
csb[31] = "&quot;It is a Sabbath of complete rest for you, and you must practice self-denial; it is a permanent statute.";
csb[32] = "&quot;The priest who is anointed and ordained to serve as high priest in place of his father will make atonement. He will put on the linen garments, the holy garments,";
csb[33] = "&quot;and make atonement for the most holy place. He will make atonement for the tent of meeting and the altar and will make atonement for the priests and all the people of the assembly.";
csb[34] = "&quot;This is to be a permanent statute for you, to make atonement for the Israelites once a year because of all their sins.&quot; And all this was done as the LORD commanded Moses.";
