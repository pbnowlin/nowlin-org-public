kjv[6] = "And Moses said unto Aaron, and unto Eleazar and unto Ithamar, his sons, Uncover not your heads, neither rend your clothes; lest ye die, and lest wrath come upon all the people: but let your brethren, the whole house of Israel, bewail the burning which the LORD hath kindled.";
rsv[6] = "And Moses said to Aaron and to Elea\'zar and Ith\'amar, his sons, &quot;Do not let the hair of your heads hang loose, and do not rend your clothes, lest you die, and lest wrath come upon all the congregation; but your brethren, the whole house of Israel, may bewail the burning which the LORD has kindled.";
asv[6] = "And Moses said unto Aaron, and unto Eleazar and unto Ithamar, his sons, Let not the hair of your heads go loose, neither rend your clothes; that ye die not, and that he be not wroth with all the congregation: but let your brethren, the whole house of Israel, bewail the burning which Jehovah hath kindled.";
yng[6] = "And Moses saith unto Aaron, and to Eleazar, and to Ithamar his sons, `Your heads ye do not uncover, and your garments ye do not rend, that ye die not, and on all the company He be wroth; as to your brethren, the whole house of Israel, they bewail the burning which Jehovah hath kindled;";
dby[6] = "And Moses said to Aaron, and to Eleazar and to Ithamar his sons, Your heads shall ye not uncover, neither rend your clothes; lest ye die, and lest wrath come on all the assembly; but your brethren, the whole house of Israel, shall bewail the burning which Jehovah hath kindled.";
web[6] = "And Moses said to Aaron, and to Eleazar and to Ithamar, his sons, Uncover not your heads, neither rend your clothes; lest ye die, and lest wrath come upon all the people: but let your brethren, the whole house of Israel, bewail the burning which the LORD hath kindled.";

kjv[19] = "And Aaron said unto Moses, Behold, this day have they offered their sin offering and their burnt offering before the LORD; and such things have befallen me: and [if] I had eaten the sin offering to day, should it have been accepted in the sight of the LORD?";

dby[19] = "And Aaron said to Moses, Behold, to-day have they presented their sin-offering and their burnt-offering before Jehovah; and such things have befallen me; and had I to-day eaten the sin-offering, would it have been good in the sight of Jehovah?";
web[19] = "And Aaron said to Moses, Behold, this day have they offered their sin-offering, and their burnt-offering before the LORD; and such things have befallen me: and [if] I had eaten the sin-offering to day, would it have been accepted in the sight of the LORD?";
hnv[19] = "Aharon spoke to Moshe, &quot;Behold, this day they have offered their sin offering and their burnt offering before the LORD; and such things as these have happend to me: and if I had eaten the sin offering today, would it have been pleasing in the sight of the LORD?&quot;";
vul[19] = "respondit Aaron oblata est hodie victima pro peccato et holocaustum coram Domino mihi autem accidit quod vides quomodo potui comedere eam aut placere Domino in caerimoniis mente lugubri";
kjv[20] = "And when Moses heard [that], he was content.";
rsv[20] = "And when Moses heard that, he was content.";
asv[20] = "And when Moses heard [that], it was well-pleasing in his sight.";
yng[20] = "And Moses hearkeneth, and it is good in his eyes.";
dby[20] = "And Moses heard it; and it was good in his sight.";
web[20] = "And when Moses heard [that], he was content.";
hnv[20] = "When Moshe heard that, it was pleasing in his sight.";
vul[20] = "quod cum audisset Moses recepit satisfactionem";
csb[1] = "Aaron\'s sons Nadab and Abihu each took his own firepan, put fire in it, placed incense on it, and presented unauthorized fire before the LORD, which he had not commanded them to do.";
csb[2] = "Then fire came from the LORD and consumed them, and they died before the LORD.";
csb[3] = "Moses said to Aaron, &quot;This is what the LORD has spoken: I will demonstrate my holiness to those who are near me, and I will reveal my glory before all the people.&quot; And Aaron remained silent.";
csb[4] = "Moses summoned Mishael and Elzaphan, sons of Aaron\'s uncle Uzziel, and said to them, &quot;Come here and carry your relatives away from the front of the sanctuary to a place outside the camp.&quot;";
csb[5] = "So they came forward and carried them in their tunics outside the camp, as Moses had said.";
csb[6] = "Then Moses said to Aaron and his sons Eleazar and Ithamar, &quot;Do not let your hair hang loose and do not tear your clothes, or else you will die, and the LORD will become angry with the whole community. However, your brothers, the whole house of Israel, may weep over the conflagration the LORD ignited.";
csb[7] = "&quot;You must not go outside the entrance to the tent of meeting or you will die, for the LORD\'s anointing oil is on you.&quot; So they did as Moses said.";
csb[8] = "The LORD spoke to Aaron:";
csb[9] = "&quot;You and your sons are not to drink wine or beer when you enter the tent of meeting, or else you will die; this is a permanent statute throughout your generations.";
csb[10] = "&quot;You must distinguish between the holy and the common, and the clean and the unclean,";
csb[11] = "&quot;and teach the Israelites all the statutes that the LORD has given to them through Moses.&quot;";
csb[12] = "Moses spoke to Aaron and his remaining sons, Eleazar and Ithamar: &quot;Take the grain offering that is left over from the fire offerings to the LORD, and eat it prepared without yeast beside the altar, because it is especially holy.";
csb[13] = "&quot;You must eat it in a holy place because it is your portion and your sons\' from the fire offerings to the LORD, for this is what I was commanded.";
csb[14] = "&quot;But you and your sons and your daughters may eat the breast of the presentation offering and the thigh of the contribution in any ceremonially clean place, because these portions have been assigned to you and your children from the Israelites\' fellowship sacrifices.";
csb[15] = "&quot;They are to bring the thigh of the contribution and the breast of the presentation offering, together with the offerings of fat portions made by fire, to present as a presentation offering before the LORD. It will belong permanently to you and your children, as the LORD commanded.&quot;";
csb[16] = "Then Moses inquired carefully about the male goat of the sin offering, but it had already been burned up. He was angry with Eleazar and Ithamar, Aaron\'s surviving sons, and asked,";
csb[17] = "&quot;Why didn\'t you eat the sin offering in the sanctuary area? For it is especially holy, and he has assigned it to you to take away the guilt of the community and make atonement for them before the LORD.";
csb[18] = "&quot;Since its blood was not brought inside the sanctuary, you should have eaten it in the sanctuary area, as I commanded.&quot;";
csb[19] = "But Aaron replied to Moses, &quot;See, today they presented their sin offering and their burnt offering before the LORD. Since these things have happened to me, if I had eaten the sin offering today, would it have been acceptable in the LORD\'s sight? &quot;";
csb[20] = "When Moses heard this, it was acceptable to him.";
