rsv[24] = "In the year of jubilee the field shall return to him from whom it was bought, to whom the land belongs as a possession by inheritance.";
asv[24] = "In the year of jubilee the field shall return unto him of whom it was bought, even to him to whom the possession of the land belongeth.";
yng[24] = "in the year of the jubilee the field returneth to him from whom he bought it, to him whose [is] the possession of the land.";
dby[24] = "In the year of the jubilee the field shall return unto him of whom it was bought -- to him to whom the land belonged.";
web[24] = "In the year of the jubilee, the field shall return to him of whom it was bought, [even] to him to whom the possession of the land [belonged].";
hnv[24] = "In the year of jubilee the field shall return to him of whom it was bought, even to him to whom the possession of the land belongs.";
vul[24] = "in iobeleo autem revertetur ad priorem dominum qui vendiderat eum et habuerat in sortem possessionis suae";
kjv[25] = "And all thy estimations shall be according to the shekel of the sanctuary: twenty gerahs shall be the shekel.";
rsv[25] = "Every valuation shall be according to the shekel of the sanctuary: twenty gerahs shall make a shekel.";
asv[25] = "And all thy estimations shall be according to the shekel of the sanctuary: twenty gerahs shall be the shekel.";
yng[25] = "And all thy valuation is by the shekel of the sanctuary: twenty gerahs is the shekel.";
dby[25] = "And all thy valuation shall be according to the shekel of the sanctuary: twenty gerahs shall be the shekel.";

vul[25] = "omnis aestimatio siclo sanctuarii ponderabitur siclus viginti obolos habet";
kjv[26] = "Only the firstling of the beasts, which should be the LORD\'S firstling, no man shall sanctify it; whether [it be] ox, or sheep: it [is] the LORD\'S.";
rsv[26] = "&quot;But a firstling of animals, which as a firstling belongs to the LORD, no man may dedicate; whether ox or sheep, it is the LORD\'s.";
asv[26] = "Only the firstling among beasts, which is made a firstling to Jehovah, no man shall sanctify it; whether it be ox or sheep, it is Jehovah\'s.";
yng[26] = "`Only, a firstling which is Jehovah\'s firstling among beasts -- no man doth sanctify it, whether ox or sheep; it [is] Jehovah\'s.";
dby[26] = "Only the firstling which is offered as firstling to Jehovah among the cattle, that shall no man hallow, whether it be ox or sheep; it is Jehovah\'s.";
web[26] = "Only the firstling of the beasts, which should be the LORD\'S firstling, no man shall sanctify it; whether ox, or sheep: it [is] the LORD\'S.";
hnv[26] = " Only the firstborn among animals, which is made a firstborn to the LORD, no man shall sanctify it; whether it be ox or sheep, it is the LORD\'s.";
vul[26] = "primogenita quae ad Dominum pertinent nemo sanctificare poterit et vovere sive bos sive ovis fuerit Domini sunt";
kjv[27] = "And if [it be] of an unclean beast, then he shall redeem [it] according to thine estimation, and shall add a fifth [part] of it thereto: or if it be not redeemed, then it shall be sold according to thy estimation.";
rsv[27] = "And if it is an unclean animal, then he shall buy it back at your valuation, and add a fifth to it; or, if it is not redeemed, it shall be sold at your valuation.";
asv[27] = "And if it be of an unclean beast, then he shall ransom it according to thine estimation, and shall add unto it the fifth part thereof: or if it be not redeemed, then it shall be sold according to thy estimation.";
yng[27] = "And if among the unclean beasts, then he hath ransomed [it] at thy valuation, and he hath added its fifth to it; and if it is not redeemed, then it hath been sold at thy valuation.";
dby[27] = "But if it be of an unclean beast, then he shall ransom it according to thy valuation, and shall add a fifth of it thereto; and if it be not redeemed, it shall be sold according to thy valuation.";
web[27] = "And if [it shall be] of an unclean beast, then he shall redeem [it], according to thy estimation, and shall add to it a fifth [part] of it: or if it shall be not redeemed, then it shall be sold according to thy estimation.";
hnv[27] = "If it be of an unclean animal, then he shall ransom it according to your estimation, and shall add to it the fifth part of it: or if it isn\'t redeemed, then it shall be sold according to your estimation.";
vul[27] = "quod si inmundum est animal redimet qui obtulit iuxta aestimationem tuam et addet quintam partem pretii si redimere noluerit vendetur alteri quantocumque a te fuerit aestimatum";
kjv[28] = "Notwithstanding no devoted thing, that a man shall devote unto the LORD of all that he hath, [both] of man and beast, and of the field of his possession, shall be sold or redeemed: every devoted thing [is] most holy unto the LORD.";
rsv[28] = "&quot;But no devoted thing that a man devotes to the LORD, of anything that he has, whether of man or beast, or of his inherited field, shall be sold or redeemed; every devoted thing is most holy to the LORD.";
asv[28] = "Notwithstanding, no devoted thing, that a man shall devote unto Jehovah of all that he hath, whether of man or beast, or of the field of his possession, shall be sold or redeemed: every devoted thing is most holy unto Jehovah.";
yng[28] = "`Only, no devoted thing which a man devoteth to Jehovah, of all that he hath, of man, and beast, and of the field of his possession, is sold or redeemed; every devoted thing is most holy to Jehovah.";
dby[28] = "Notwithstanding, no devoted thing that a man hath devoted to Jehovah of all that he hath, of man or beast, or of the field of his possession, shall be sold or redeemed: every devoted thing is most holy to Jehovah.";
web[28] = "Notwithstanding, no devoted thing that a man shall devote to the LORD of all that he hath, [both] of man and beast, and of the field of his possession, shall be sold or redeemed: every devoted thing is most holy to the LORD.";
hnv[28] = "Notwithstanding, no devoted thing, that a man shall devote to the LORD of all that he has, whether of man or animal, or of the field of his possession, shall be sold or redeemed: every devoted thing is most holy to the LORD.";
vul[28] = "omne quod Domino consecratur sive homo fuerit sive animal sive ager non veniet nec redimi poterit quicquid semel fuerit consecratum sanctum sanctorum erit Domino";
kjv[29] = "None devoted, which shall be devoted of men, shall be redeemed; [but] shall surely be put to death.";
rsv[29] = "No one devoted, who is to be utterly destroyed from among men, shall be ransomed; he shall be put to death.";
asv[29] = "No one devoted, that shall be devoted from among men, shall be ransomed; he shall surely be put to death.";
yng[29] = "`No devoted thing, which is devoted of man, is ransomed, it is surely put to death.";
dby[29] = "Nothing devoted, which shall be devoted from among men, shall be ransomed: it shall certainly be put to death.";
web[29] = "None devoted, which shall be devoted by men, shall be redeemed: [but] shall surely be put to death.";
hnv[29] = "No one devoted, who shall be devoted from among men, shall be ransomed; he shall surely be put to death.";
vul[29] = "et omnis consecratio quae offertur ab homine non redimetur sed morte morietur";

rsv[30] = "&quot;All the tithe of the land, whether of the seed of the land or of the fruit of the trees, is the LORD\'s; it is holy to the LORD.";
asv[30] = "And all the tithe of the land, whether of the seed of the land, or of the fruit of the tree, is Jehovah\'s: it is holy unto Jehovah.";
yng[30] = "And all tithe of the land, of the seed of the land, of the fruit of the tree, is Jehovah\'s -- holy to Jehovah.";
dby[30] = "And as to every tithe of the land, of the seed of the land, and of the fruit of the tree, it is Jehovah\'s: it is holy to Jehovah.";
web[30] = "And all the tithe of the land, [whether] of the seed of the land, [or] of the fruit of the tree, [is] the LORD\'S: [it is] holy to the LORD.";
hnv[30] = "All the tithe of the land, whether of the seed of the land, or of the fruit of the tree, is the LORD\'s: it is holy to the LORD.";

rsv[31] = "If a man wishes to redeem any of his tithe, he shall add a fifth to it.";
asv[31] = "And if a man will redeem aught of his tithe, he shall add unto it the fifth part thereof.";
yng[31] = "`And if a man really redeem [any] of his tithe, its fifth he addeth to it.";
dby[31] = "And if any one will at all redeem of his tithes, he shall add thereto the fifth thereof.";
web[31] = "And if a man will at all redeem [aught] of his tithes, he shall add to it the fifth [part] of it.";
hnv[31] = "If a man will redeem anything of his tithe, he shall add to it the fifth part of it.";
vul[31] = "si quis autem voluerit redimere decimas suas addet quintam partem earum";

rsv[32] = "And all the tithe of herds and flocks, every tenth animal of all that pass under the herdsman\'s staff, shall be holy to the LORD.";
asv[32] = "And all the tithe of the herd or the flock, whatsoever passeth under the rod, the tenth shall be holy unto Jehovah.";
yng[32] = "`And all the tithe of the herd and of the flock -- all that passeth by under the rod -- the tenth is holy to Jehovah;";
dby[32] = "And as to every tithe of the herd, or of the flock, of whatever passeth under the rod, the tenth shall be holy to Jehovah.";
web[32] = "And concerning the tithe of the herd, or of the flock, [even] of whatever passeth under the rod, the tenth shall be holy to the LORD.";
hnv[32] = "All the tithe of the herd or the flock, whatever passes under the rod, the tenth shall be holy to the LORD.";
vul[32] = "omnium decimarum boves et oves et caprae quae sub pastoris virga transeunt quicquid decimum venerit sanctificabitur Domino";

asv[33] = "He shall not search whether it be good or bad, neither shall he change it: and if he change it at all, then both it and that for which it is changed shall be holy; it shall not be redeemed.";
yng[33] = "he enquireth not between good and bad, nor doth he change it; and if he really change it -- then it hath been -- it and its exchange is holy; it is not redeemed.\'";
dby[33] = "He shall not search whether it be good or bad, neither shall he change it; and if he change it at all, then both it and the exchange thereof shall be holy; it shall not be redeemed.";
web[33] = "He shall not search whether it is good or bad, neither shall he change it: and if he shall change it at all, then both it and the change of it shall be holy; it shall not be redeemed.";
hnv[33] = "He shall not search whether it be good or bad, neither shall he change it: and if he change it at all, then both it and that for which it is changed shall be holy; it shall not be redeemed.";

rsv[34] = "These are the commandments which the LORD commanded Moses for the people of Israel on Mount Sinai.";
asv[34] = "These are the commandments, which Jehovah commanded Moses for the children of Israel in mount Sinai.";
yng[34] = "These [are] the commands which Jehovah hath commanded Moses for the sons of Israel, in mount Sinai.";
dby[34] = "These are the commandments which Jehovah commanded Moses for the children of Israel upon mount Sinai.";
web[34] = "These [are] the commandments which the LORD commanded Moses for the children of Israel in mount Sinai.";

vul[34] = "haec sunt praecepta quae mandavit Dominus Mosi ad filios Israhel in monte Sinai";
csb[1] = "The LORD spoke to Moses:";
csb[2] = "&quot;Speak to the Israelites and tell them: When someone makes a special vow to the LORD that involves the assessment of people,";
csb[3] = "&quot;if the assessment concerns a male from twenty to sixty years old, your assessment is fifty silver shekels measured by the standard sanctuary shekel.";
csb[4] = "&quot;If the person is a female, your assessment is thirty shekels.";
csb[5] = "&quot;If the person is from five to twenty years old, your assessment for a male is twenty shekels and for a female ten shekels.";
csb[6] = "&quot;If the person is from one month to five years old, your assessment for a male is five silver shekels, and for a female your assessment is three shekels of silver.";
csb[7] = "&quot;If the person is sixty years or more, your assessment is fifteen shekels for a male and ten shekels for a female.";
csb[8] = "&quot;But if one is too poor to pay the assessment, he is to present the person before the priest and the priest will set a value for him. The priest will set a value for him according to what the one making the vow can afford.";
csb[9] = "&quot;If the vow involves one of the animals that may be brought as an offering to the LORD, any of these he gives to the LORD will be holy.";
csb[10] = "&quot;He may not replace it or make a substitution for it, either good for bad, or bad for good. But if he does substitute one animal for another, both that animal and its substitute will be holy.";
csb[11] = "&quot;If the vow involves any of the unclean animals that may not be brought as an offering to the LORD, the animal must be presented before the priest.";
csb[12] = "&quot;The priest will set its value, whether high or low; the price will be set as the priest makes the assessment for you.";
csb[13] = "&quot;If the one who brought it decides to redeem it, he must add a fifth to the assessed value.";
csb[14] = "&quot;When a man consecrates his house as holy to the LORD, the priest will assess its value, whether high or low. The price will stand just as the priest assesses it.";
csb[15] = "&quot;But if the one who consecrated his house redeems it, he must add a fifth to the assessed value, and it will be his.";
csb[16] = "&quot;If a man consecrates to the LORD any part of a field that he possesses, your assessment of value will be proportional to the seed needed to sow it, at the rate of fifty silver shekels for every five bushels of barley seed.";
csb[17] = "&quot;If he consecrates his field during the Year of Jubilee, the price will stand according to your assessment.";
csb[18] = "&quot;But if he consecrates his field after the Jubilee, the priest will calculate the price for him in proportion to the years left until the next Year of Jubilee, so that your assessment will be reduced.";
csb[19] = "&quot;If the one who consecrated the field decides to redeem it, he must add a fifth to the assessed value, and the field will transfer back to him.";
csb[20] = "&quot;But if he does not redeem the field or if he has sold it to another man, it is no longer redeemable.";
csb[21] = "&quot;When the field is released in the Jubilee, it will be holy to the LORD like a field permanently set apart; it becomes the priest\'s property.";
csb[22] = "&quot;If a person consecrates to the LORD a field he has purchased that is not part of his inherited landholding,";
csb[23] = "&quot;then the priest will calculate for him the amount of the assessment up to the Year of Jubilee, and the person will pay the assessed value on that day as a holy offering to the LORD.";
csb[24] = "&quot;In the Year of Jubilee the field will return to the one he bought it from, the original owner.";
csb[25] = "&quot;All your assessed values will be measured by the standard sanctuary shekel, twenty gerahs to the shekel.";
csb[26] = "&quot;But no one can consecrate a firstborn of the livestock, whether an animal from the herd or flock, to the LORD, because a firstborn already belongs to the LORD.";
csb[27] = "&quot;If it is one of the unclean livestock, it can be ransomed according to your assessment by adding a fifth of its value to it. If it is not redeemed, it can be sold according to your assessment.";
csb[28] = "&quot;Nothing that a man permanently sets apart to the LORD from all he owns, whether a person, an animal, or his inherited landholding, can be sold or redeemed; everything set apart is especially holy to the LORD.";
csb[29] = "&quot;No person who has been set apart for destruction is to be ransomed; he must be put to death.";
csb[30] = "&quot;Every tenth of the land\'s produce, grain from the soil or fruit from the trees, belongs to the LORD; it is holy to the LORD.";
csb[31] = "&quot;If a man decides to redeem any part of this tenth, he must add a fifth to its value.";
csb[32] = "&quot;Every tenth animal from the herd or flock, which passes under the shepherd\'s rod, will be holy to the LORD.";
csb[33] = "&quot;He is not to inspect whether it is good or bad, and he is not to make a substitution for it. But if he does make a substitution, both the animal and its substitute will be holy; they cannot be redeemed.&quot;";
csb[34] = "These are the commands the LORD gave Moses for the Israelites on Mount Sinai.";
