asv[1] = "And Jehovah spake unto Moses, saying,";

kjv[2] = "Again, thou shalt say to the children of Israel, Whosoever [he be] of the children of Israel, or of the strangers that sojourn in Israel, that giveth [any] of his seed unto Molech; he shall surely be put to death: the people of the land shall stone him with stones.";
rsv[2] = "&quot;Say to the people of Israel, Any man of the people of Israel, or of the strangers that sojourn in Israel, who gives any of his children to Molech shall be put to death; the people of the land shall stone him with stones.";
asv[2] = "Moreover, thou shalt say to the children of Israel, Whosoever he be of the children of Israel, or of the strangers that sojourn in Israel, that giveth of his seed unto Molech; he shall surely be put to death: the people of the land shall stone him with stones.";
yng[2] = "`And unto the sons of Israel thou dost say, Any man of the sons of Israel, and of the sojourners who is sojourning in Israel, who giveth of his seed to the Molech, is certainly put to death; the people of the land do stone him with stones;";
dby[2] = "Thou shalt say also to the children of Israel, Every one of the children of Israel, or of the strangers who sojourn in Israel, that giveth of his seed unto Molech, shall certainly be put to death: the people of the land shall stone him with stones.";
web[2] = "Again thou shalt say to the children of Israel, Whoever [he be] of the children of Israel, or of the strangers that sojourn in Israel, that giveth [any] of his seed to Molech, he shall surely be put to death: the people of the land shall stone him with stones.";
hnv[2] = "&quot;Moreover, you shall tell the children of Yisra\'el, \'Anyone of the children of Yisra\'el, or of the strangers who live as foreigners in Yisra\'el, who gives any of his seed to Molekh; he shall surely be put to death. The people of the land shall stone him with stones.";
vul[2] = "haec loqueris filiis Israhel homo de filiis Israhel et de advenis qui habitant in Israhel si quis dederit de semine suo idolo Moloch morte moriatur populus terrae lapidabit eum";
kjv[3] = "And I will set my face against that man, and will cut him off from among his people; because he hath given of his seed unto Molech, to defile my sanctuary, and to profane my holy name.";
rsv[3] = "I myself will set my face against that man, and will cut him off from among his people, because he has given one of his children to Molech, defiling my sanctuary and profaning my holy name.";
asv[3] = "I also will set my face against that man, and will cut him off from among his people; because he hath given of his seed unto Molech, to defile my sanctuary, and to profane my holy name.";
yng[3] = "and I -- I set My face against that man, and have cut him off from the midst of his people, for of his seed he hath given to the Molech, so as to defile My sanctuary, and to pollute My holy name.";
dby[3] = "And I will set my face against that man, and will cut him off from among his people; because he hath given of his seed unto Molech, so as to make my sanctuary unclean, and to profane my holy name.";
web[3] = "And I will set my face against that man, and will cut him off from among his people; because he hath given of his seed to Molech, to defile my sanctuary, and to profane my holy name.";
hnv[3] = "I also will set my face against that person, and will cut him off from among his people because he has given of his seed to Molekh, to defile my sanctuary, and to profane my holy name.";
vul[3] = "et ego ponam faciem meam contra illum succidamque eum de medio populi sui eo quod dederit de semine suo Moloch et contaminaverit sanctuarium meum ac polluerit nomen sanctum meum";
kjv[4] = "And if the people of the land do any ways hide their eyes from the man, when he giveth of his seed unto Molech, and kill him not:";
rsv[4] = "And if the people of the land do at all hide their eyes from that man, when he gives one of his children to Molech, and do not put him to death,";
asv[4] = "And if the people at the land do at all hide their eyes from that man, when he giveth of his seed unto Molech, and put him not to death;";
yng[4] = "`And if the people of the land really hide their eyes from that man, in his giving of his seed to the Molech, so as not to put him to death,";
dby[4] = "And if the people of the land do any ways hide their eyes from that man, when he giveth of his seed unto Molech, that they kill him not,";
web[4] = "And if the people of the land do any ways hide their eyes from the man, when he giveth of his seed to Molech, and kill him not;";
hnv[4] = "If the people of the land all hide their eyes from that person, when he gives of his seed to Molekh, and don\'t put him to death;";
vul[4] = "quod si neglegens populus terrae et quasi parvipendens imperium meum dimiserit hominem qui dederit de semine suo Moloch nec voluerit eum occidere";
kjv[5] = "Then I will set my face against that man, and against his family, and will cut him off, and all that go a whoring after him, to commit whoredom with Molech, from among their people.";
rsv[5] = "then I will set my face against that man and against his family, and will cut them off from among their people, him and all who follow him in playing the harlot after Molech.";
asv[5] = "then I will set my face against that man, and against his family, and will cut him off, and all that play the harlot after him, to play the harlot with Molech, from among their people.";
yng[5] = "then I have set My face against that man, and against his family, and have cut him off, and all who are going a-whoring after him, even going a-whoring after the Molech, from the midst of their people.";
dby[5] = "then I will set my face against that man, and against his family, and will cut him off, and all that go a whoring after him, to commit whoredom with Molech, from among their people.";
web[5] = "Then I will set my face against that man, and against his family, and will cut him off, and all that go astray after him, to commit lewdness with Molech from among their people.";
hnv[5] = "then I will set my face against that man, and against his family, and will cut him off, and all who play the prostitute after him, to play the prostitute with Molekh, from among their people.";
vul[5] = "ponam faciem meam super hominem illum et cognationem eius succidamque et ipsum et omnes qui consenserunt ei ut fornicarentur cum Moloch de medio populi sui";
kjv[6] = "And the soul that turneth after such as have familiar spirits, and after wizards, to go a whoring after them, I will even set my face against that soul, and will cut him off from among his people.";
rsv[6] = "&quot;If a person turns to mediums and wizards, playing the harlot after them, I will set my face against that person, and will cut him off from among his people.";
asv[6] = "And the soul that turneth unto them that have familiar spirits, and unto the wizards, to play the harlot after them, I will even set my face against that soul, and will cut him off from among his people.";
yng[6] = "`And the person who turneth unto those having familiar spirits, and unto the wizards, to go a-whoring after them, I have even set My face against that person, and cut him off from the midst of his people.";
dby[6] = "-- And the soul that turneth unto necromancers and unto soothsayers, to go a whoring after them, I will set my face against that soul, and will cut him off from among his people.";
web[6] = "And the soul that turneth after such as have familiar spirits, and after wizards, to go astray after them, I will even set my face against that soul, and will cut him off from among his people.";
hnv[6] = "&quot;\'The person that turns to those who are mediums, and to the wizards, to play the prostitute after them, I will even set my face against that person, and will cut him off from among his people.";
vul[6] = "anima quae declinaverit ad magos et ariolos et fornicata fuerit cum eis ponam faciem meam contra eam et interficiam illam de medio populi sui";
kjv[7] = "Sanctify yourselves therefore, and be ye holy: for I [am] the LORD your God.";
rsv[7] = "Consecrate yourselves therefore, and be holy; for I am the LORD your God.";
asv[7] = "Sanctify yourselves therefore, and be ye holy; for I am Jehovah your God.";
yng[7] = "`And ye have sanctified yourselves, and ye have been holy, for I [am] Jehovah your God;";
dby[7] = "Hallow yourselves therefore, and be holy; for I am Jehovah your God.";
web[7] = "Sanctify yourselves therefore and be ye holy: for I [am] the LORD your God.";
hnv[7] = "&quot;\'Sanctify yourselves therefore, and be holy; for I am the LORD your God.";
vul[7] = "sanctificamini et estote sancti quia ego Dominus Deus vester";
kjv[8] = "And ye shall keep my statutes, and do them: I [am] the LORD which sanctify you.";
rsv[8] = "Keep my statutes, and do them; I am the LORD who sanctify you.";
asv[8] = "And ye shall keep my statutes, and do them: I am Jehovah who sanctifieth you.";
yng[8] = "and ye have kept My statutes and have done them; I [am] Jehovah, sanctifying you.";
dby[8] = "And ye shall observe my statutes, and do them: I am Jehovah who hallow you.";
web[8] = "And ye shall keep my statutes, and do them: I [am] the LORD who sanctify you.";
hnv[8] = "You shall keep my statutes, and do them. I am the LORD who sanctifies you.";
vul[8] = "custodite praecepta mea et facite ea ego Dominus qui sanctifico vos";
kjv[9] = "For every one that curseth his father or his mother shall be surely put to death: he hath cursed his father or his mother; his blood [shall be] upon him.";
rsv[9] = "For every one who curses his father or his mother shall be put to death; he has cursed his father or his mother, his blood is upon him.";
asv[9] = "For every one that curseth his father or his mother shall surely be put to death: he hath cursed his father or his mother; his blood shall be upon him.";
yng[9] = "`For any man who revileth his father and his mother is certainly put to death; his father and his mother he hath reviled: his blood [is] on him.";
dby[9] = "Whatever man revileth his father and his mother shall certainly be put to death: he hath reviled his father and his mother; his blood is upon him.";
web[9] = "For every one that curseth his father or his mother, shall surely be put to death: he hath cursed his father or his mother; his blood [shall be] upon him.";
hnv[9] = "&quot;\'For everyone who curses his father or his mother shall surely be put to death: he has cursed his father or his mother; his blood shall be upon him.";
vul[9] = "qui maledixerit patri suo et matri morte moriatur patri matrique maledixit sanguis eius sit super eum";
kjv[10] = "And the man that committeth adultery with [another] man\'s wife, [even he] that committeth adultery with his neighbour\'s wife, the adulterer and the adulteress shall surely be put to death.";
rsv[10] = "&quot;If a man commits adultery with the wife of his neighbor, both the adulterer and the adulteress shall be put to death.";
asv[10] = "And the man that committeth adultery with another man\'s wife, even he that committeth adultery with his neighbor\'s wife, the adulterer and the adulteress shall surely be put to death.";
yng[10] = "`And a man who committeth adultery with a man\'s wife -- who committeth adultery with the wife of his neighbour -- the adulterer and the adulteress are surely put to death.";
dby[10] = "And a man that committeth adultery with a man\'s wife, who committeth adultery with his neighbour\'s wife, -- the adulterer and the adulteress shall certainly be put to death.";
web[10] = "And the man that committeth adultery with [another] man\'s wife, [even he] that committeth adultery with his neighbor\'s wife, the adulterer and the adulteress shall surely be put to death.";
hnv[10] = "&quot;\'The man who commits adultery with another man\'s wife, even he who commits adultery with his neighbor\'s wife, the adulterer and the adulteress shall surely be put to death.";
vul[10] = "si moechatus quis fuerit cum uxore alterius et adulterium perpetrarit cum coniuge proximi sui morte moriantur et moechus et adultera";
kjv[11] = "And the man that lieth with his father\'s wife hath uncovered his father\'s nakedness: both of them shall surely be put to death; their blood [shall be] upon them.";
rsv[11] = "The man who lies with his father\'s wife has uncovered his father\'s nakedness; both of them shall be put to death, their blood is upon them.";
asv[11] = "And the man that lieth with his father\'s wife hath uncovered his father\'s nakedness: both of them shall surely be put to death; their blood shall be upon them.";
yng[11] = "`And a man who lieth with his father\'s wife -- the nakedness of his father he hath uncovered -- both of them are certainly put to death; their blood [is] on them.";
dby[11] = "And a man that lieth with his father\'s wife hath uncovered his father\'s nakedness: both of them shall certainly be put to death; their blood is upon them.";
web[11] = "And the man that lieth with his father\'s wife hath uncovered his father\'s nakedness; both of them shall surely be put to death: their blood [shall be] upon them.";
hnv[11] = "The man who lies with his father\'s wife has uncovered his father\'s nakedness: both of them shall surely be put to death; their blood shall be upon them.";
vul[11] = "qui dormierit cum noverca sua et revelaverit ignominiam patris sui morte moriantur ambo sanguis eorum sit super eos";
kjv[12] = "And if a man lie with his daughter in law, both of them shall surely be put to death: they have wrought confusion; their blood [shall be] upon them.";
rsv[12] = "If a man lies with his daughter-in-law, both of them shall be put to death; they have committed incest, their blood is upon them.";
asv[12] = "And if a man lie with his daughter-in-law, both of them shall surely be put to death: they have wrought confusion; their blood shall be upon them.";
yng[12] = "`And a man who lieth with his daughter-in-law -- both of them are certainly put to death; confusion they have made; their blood [is] on them.";
dby[12] = "And if a man lie with his daughter-in-law, both of them shall certainly be put to death: they have wrought confusion; their blood is upon them.";
web[12] = "And if a man shall lie with his daughter-in-law, both of them shall surely be put to death: they have wrought confusion; their blood [shall be] upon them.";
hnv[12] = "&quot;\'If a man lies with his daughter-in-law, both of them shall surely be put to death: they have committed a perversion; their blood shall be upon them.";
vul[12] = "si quis dormierit cum nuru sua uterque moriantur quia scelus operati sunt sanguis eorum sit super eos";
kjv[13] = "If a man also lie with mankind, as he lieth with a woman, both of them have committed an abomination: they shall surely be put to death; their blood [shall be] upon them.";
rsv[13] = "If a man lies with a male as with a woman, both of them have committed an abomination; they shall be put to death, their blood is upon them.";
asv[13] = "And if a man lie with mankind, as with womankind, both of them have committed abomination: they shall surely be put to death; their blood shall be upon them.";
yng[13] = "`And a man who lieth with a male as one lieth with a woman; abomination both of them have done; they are certainly put to death; their blood [is] on them.";
dby[13] = "And if a man lie with mankind, as he lieth with a woman, both of them have committed an abomination: they shall certainly be put to death; their blood is upon them.";
web[13] = "If a man also shall lie with mankind, as he lieth with a woman, both of them have committed an abomination: they shall surely be put to death; their blood [shall be] upon them.";
hnv[13] = "If a man lies with a male, as with a woman, both of them have committed an abomination: they shall surely be put to death; their blood shall be upon them.";
vul[13] = "qui dormierit cum masculo coitu femineo uterque operati sunt nefas morte moriantur sit sanguis eorum super eos";
kjv[14] = "And if a man take a wife and her mother, it [is] wickedness: they shall be burnt with fire, both he and they; that there be no wickedness among you.";
rsv[14] = "If a man takes a wife and her mother also, it is wickedness; they shall be burned with fire, both he and they, that there may be no wickedness among you.";
asv[14] = "And if a man take a wife and her mother, it is wickedness: they shall be burnt with fire, both he and they; that there be no wickedness among you.";
yng[14] = "`And a man who taketh the woman and her mother -- it [is] wickedness; with fire they burn him and them, and there is no wickedness in your midst.";
dby[14] = "And if a man take a wife and her mother, it is infamy: they shall burn him and them with fire, that there be no infamy among you.";
web[14] = "And if a man shall take a wife and her mother, it [is] wickedness: they shall be burnt with fire, both he and they: that there be no wickedness among you.";
hnv[14] = "&quot;\'If a man takes a wife and her mother, it is wickedness: they shall be burned with fire, both he and they; that there may be no wickedness among you.";
vul[14] = "qui supra uxorem filiam duxerit matrem eius scelus operatus est vivus ardebit cum eis nec permanebit tantum nefas in medio vestri";
kjv[15] = "And if a man lie with a beast, he shall surely be put to death: and ye shall slay the beast.";
rsv[15] = "If a man lies with a beast, he shall be put to death; and you shall kill the beast.";
asv[15] = "And if a man lie with a beast, he shall surely be put to death: and ye shall slay the beast.";
yng[15] = "`And a man who giveth his lying with a beast is certainly put to death, and the beast ye do slay.";
dby[15] = "And if a man lie with a beast for copulation, he shall certainly be put to death; and ye shall kill the beast.";
web[15] = "And if a man shall lie with a beast, he shall surely be put to death: and ye shall slay the beast.";
hnv[15] = "&quot;\'If a man lies with an animal, he shall surely be put to death; and you shall kill the animal.";
vul[15] = "qui cum iumento et pecore coierit morte moriatur pecus quoque occidite";
kjv[16] = "And if a woman approach unto any beast, and lie down thereto, thou shalt kill the woman, and the beast: they shall surely be put to death; their blood [shall be] upon them.";
rsv[16] = "If a woman approaches any beast and lies with it, you shall kill the woman and the beast; they shall be put to death, their blood is upon them.";
asv[16] = "And if a woman approach unto any beast, and lie down thereto, thou shalt kill the woman, and the beast: they shall surely be put to death; their blood shall be upon them.";
yng[16] = "`And a woman who draweth near unto any beast to lie with it -- thou hast even slain the woman and the beast; they are certainly put to death; their blood [is] on them.";
dby[16] = "And if a woman approach unto any beast to gender therewith, thou shalt kill the woman and the beast: they shall certainly be put to death; their blood is upon them.";
web[16] = "And if a woman shall approach to any beast, and lie down thereto, thou shalt kill the woman and the beast; they shall surely be put to death; their blood [shall be] upon them.";
hnv[16] = "&quot;\'If a woman approaches any animal, and lies down with it, you shall kill the woman, and the animal: they shall surely be put to death; their blood shall be upon them.";
vul[16] = "mulier quae subcubuerit cuilibet iumento simul interficietur cum eo sanguis eorum sit super eos";
kjv[17] = "And if a man shall take his sister, his father\'s daughter, or his mother\'s daughter, and see her nakedness, and she see his nakedness; it [is] a wicked thing; and they shall be cut off in the sight of their people: he hath uncovered his sister\'s nakedness; he shall bear his iniquity.";
rsv[17] = "&quot;If a man takes his sister, a daughter of his father or a daughter of his mother, and sees her nakedness, and she sees his nakedness, it is a shameful thing, and they shall be cut off in the sight of the children of their people; he has uncovered his sister\'s nakedness, he shall bear his iniquity.";
asv[17] = "And if a man shall take his sister, his father\'s daughter, or his mother\'s daughter, and see her nakedness, and she see his nakedness; it is a shameful thing; and they shall be cut off in the sight of the children of their people: he hath uncovered his sister\'s nakedness; he shall bear his iniquity.";
yng[17] = "`And a man who taketh his sister, a daughter of his father or daughter of his mother, and he hath seen her nakedness, and she seeth his nakedness: it is a shame; and they have been cut off before the eyes of the sons of their people; the nakedness of his sister he hath uncovered; his iniquity he beareth.";
dby[17] = "And if a man take his sister, his father\'s daughter, or his mother\'s daughter, and see her nakedness, and she see his nakedness, that is a disgrace; and they shall be cut off before the eyes of the children of their people: he hath uncovered his sister\'s nakedness; he shall bear his iniquity.";
web[17] = "And if a man shall take his sister, his father\'s daughter, or his mother\'s daughter, and see her nakedness, and she see his nakedness; it [is] a wicked thing; and they shall be cut off in the sight of their people: he hath uncovered his sister\'s nakedness; he shall bear his iniquity.";
hnv[17] = "&quot;\'If a man takes his sister, his father\'s daughter, or his mother\'s daughter, and sees her nakedness, and she sees his nakedness; it is a shameful thing; and they shall be cut off in the sight of the children of their people: he has uncovered his sister\'s nakedness; he shall bear his iniquity.";
vul[17] = "qui acceperit sororem suam filiam patris sui vel filiam matris suae et viderit turpitudinem eius illaque conspexerit fratris ignominiam nefariam rem operati sunt occidentur in conspectu populi sui eo quod turpitudinem suam mutuo revelarint et portabunt iniquitatem suam";
kjv[18] = "And if a man shall lie with a woman having her sickness, and shall uncover her nakedness; he hath discovered her fountain, and she hath uncovered the fountain of her blood: and both of them shall be cut off from among their people.";
rsv[18] = "If a man lies with a woman having her sickness, and uncovers her nakedness, he has made naked her fountain, and she has uncovered the fountain of her blood; both of them shall be cut off from among their people.";
asv[18] = "And if a man shall lie with a woman having her sickness, and shall uncover her nakedness; he hath made naked her fountain, and she hath uncovered the fountain of her blood: and both of them shall be cut off from among their people.";
yng[18] = "`And a man who lieth with a sick woman, and hath uncovered her nakedness, her fountain he hath made bare, and she hath uncovered the fountain of her blood, -- even both of them have been cut off from the midst of their people.";
dby[18] = "And if a man shall lie with a woman in her infirmity, and uncover her nakedness, her flux doth he lay bare, and she hath uncovered the fountain of her blood; and both of them shall be cut off from among their people.";
web[18] = "And if a man shall lie with a woman having her sickness, and shall uncover her nakedness; he hath discovered her fountain, and she hath uncovered the fountain of her blood: and both of them shall be cut off from among their people.";
hnv[18] = "&quot;\'If a man lies with a woman having her monthly period, and uncovers her nakedness; he has made naked her fountain, and she has uncovered the fountain of her blood: and both of them shall be cut off from among their people.";
vul[18] = "qui coierit cum muliere in fluxu menstruo et revelaverit turpitudinem eius ipsaque aperuerit fontem sanguinis sui interficientur ambo de medio populi sui";
kjv[19] = "And thou shalt not uncover the nakedness of thy mother\'s sister, nor of thy father\'s sister: for he uncovereth his near kin: they shall bear their iniquity.";
rsv[19] = "You shall not uncover the nakedness of your mother\'s sister or of your father\'s sister, for that is to make naked one\'s near kin; they shall bear their iniquity.";
asv[19] = "And thou shalt not uncover the nakedness of thy mother\'s sister, nor of thy father\'s sister; for he hath made naked his near kin: they shall bear their iniquity.";
yng[19] = "`And the nakedness of thy mother\'s sister, and of thy father\'s sister, thou dost not uncover; because his relation he hath made bare; their iniquity they bear.";
dby[19] = "And the nakedness of thy mother\'s sister, and of thy father\'s sister shalt thou not uncover; for he hath laid naked his near relation: they shall bear their iniquity.";
web[19] = "And thou shalt not uncover the nakedness of thy mother\'s sister, nor of thy father\'s sister: for he uncovereth his near kin: they shall bear their iniquity.";
hnv[19] = "&quot;\'You shall not uncover the nakedness of your mother\'s sister, nor of your father\'s sister; for he has made naked his close relative: they shall bear their iniquity.";
vul[19] = "turpitudinem materterae tuae et amitae tuae non discoperies qui hoc fecerit ignominiam carnis suae nudavit portabunt ambo iniquitatem suam";
kjv[20] = "And if a man shall lie with his uncle\'s wife, he hath uncovered his uncle\'s nakedness: they shall bear their sin; they shall die childless.";
rsv[20] = "If a man lies with his uncle\'s wife, he has uncovered his uncle\'s nakedness; they shall bear their sin, they shall die childless.";
asv[20] = "And if a man shall lie with his uncle\'s wife, he hath uncovered his uncle\'s nakedness: they shall bear their sin; they shall die childless.";
yng[20] = "`And a man who lieth with his aunt, the nakedness of his uncle he hath uncovered; their sin they bear; childless they die.";
dby[20] = "And if a man lie with his aunt, he hath uncovered his uncle\'s nakedness: their sin shall they bear: they shall die childless.";
web[20] = "And if a man shall lie with his uncle\'s wife, he hath uncovered his uncle\'s nakedness: they shall bear their sin; they shall die childless.";
hnv[20] = "If a man lies with his uncle\'s wife, he has uncovered his uncle\'s nakedness: they shall bear their sin; they shall die childless.";
vul[20] = "qui coierit cum uxore patrui vel avunculi sui et revelaverit ignominiam cognationis suae portabunt ambo peccatum suum absque liberis morientur";
kjv[21] = "And if a man shall take his brother\'s wife, it [is] an unclean thing: he hath uncovered his brother\'s nakedness; they shall be childless.";
rsv[21] = "If a man takes his brother\'s wife, it is impurity; he has uncovered his brother\'s nakedness, they shall be childless.";
asv[21] = "And if a man shall take his brother\'s wife, it is impurity: he hath uncovered his brother\'s nakedness; they shall be childless.";
yng[21] = "`And a man who taketh his brother\'s wife -- it [is] impurity; the nakedness of his brother he hath uncovered; childless they are.";
dby[21] = "And if a man take his brother\'s wife, it is an unclean thing: he hath uncovered his brother\'s nakedness: they shall be childless.";

kjv[24] = "But I have said unto you, Ye shall inherit their land, and I will give it unto you to possess it, a land that floweth with milk and honey: I [am] the LORD your God, which have separated you from [other] people.";
rsv[24] = "But I have said to you, \'You shall inherit their land, and I will give it to you to possess, a land flowing with milk and honey.\' I am the LORD your God, who have separated you from the peoples.";
asv[24] = "But I have said unto you, Ye shall inherit their land, and I will give it unto you to possess it, a land flowing with milk and honey: I am Jehovah your God, who hath separated you from the peoples.";
yng[24] = "and I say to you, Ye -- ye do possess their ground, and I -- I give it to you to possess it, a land flowing with milk and honey; I [am] Jehovah your God, who hath separated you from the peoples.";

kjv[25] = "Ye shall therefore put difference between clean beasts and unclean, and between unclean fowls and clean: and ye shall not make your souls abominable by beast, or by fowl, or by any manner of living thing that creepeth on the ground, which I have separated from you as unclean.";
rsv[25] = "You shall therefore make a distinction between the clean beast and the unclean, and between the unclean bird and the clean; you shall not make yourselves abominable by beast or by bird or by anything with which the ground teems, which I have set apart for you to hold unclean.";
asv[25] = "Ye shall therefore make a distinction between the clean beast and the unclean, and between the unclean fowl and the clean: and ye shall not make your souls abominable by beast, or by bird, or by anything wherewith the ground teemeth, which I have separated from you as unclean.";
yng[25] = "`And ye have made separation between the pure beasts and the unclean, and between the unclean fowl and the pure, and ye do not make yourselves abominable by beast or by fowl, or by anything which creepeth [on] the ground which I have separated to you for unclean;";
dby[25] = "And ye shall make a separation between the clean beast and the unclean, and between the unclean fowl and the clean, and ye shall not make yourselves an abomination by beast, or by fowl, or by anything that creepeth on the ground which I have separated for you, declaring [it] as unclean.";
web[25] = "Ye shall therefore distinguish between clean beasts and unclean, and between unclean fowls and clean: and ye shall not make your souls abominable by beast or by fowl, or by any manner of living animal that creepeth on the ground, which I have separated from you as unclean.";
hnv[25] = "&quot;\'You shall therefore make a distinction between the clean animal and the unclean, and between the unclean fowl and the clean: and you shall not make yourselves abominable by animal, or by bird, or by anything with which the ground teems, which I have separated from you as unclean for you.";

kjv[27] = "A man also or woman that hath a familiar spirit, or that is a wizard, shall surely be put to death: they shall stone them with stones: their blood [shall be] upon them.";
rsv[27] = "&quot;A man or a woman who is a medium or a wizard shall be put to death; they shall be stoned with stones, their blood shall be upon them.&quot;";
asv[27] = "A man also or a woman that hath a familiar spirit, or that is a wizard, shall surely be put to death: they shall stone them with stones; their blood shall be upon them.";
yng[27] = "`And a man or woman -- when there is in them a familiar spirit, or who [are] wizards -- are certainly put to death; with stones they stone them; their blood [is] on them.\'";
dby[27] = "And if there be a man or a woman in whom is a spirit of Python or of divination, they shall certainly be put to death: they shall stone them with stones; their blood is upon them.";
web[27] = "A man also or a woman that hath a familiar spirit, or that is a wizard, shall surely be put to death: they shall stone them with stones: their blood [shall be] upon them.";
hnv[27] = "&quot;\'A man or a woman that is a medium, or is a wizard, shall surely be put to death: they shall stone them with stones; their blood shall be upon them.\'&quot;";

csb[1] = "The LORD spoke to Moses:";
csb[2] = "&quot;Say to the Israelites: Any Israelite or alien residing in Israel who gives any of his children to Molech must be put to death; the people of the country are to stone him.";
csb[3] = "&quot;I will turn against that man and cut him off from his people, because he gave his offspring to Molech, defiling my sanctuary and profaning my holy name.";
csb[4] = "&quot;But if the people of the country look the other way when that man gives any of his children to Molech, and do not put him to death,";
csb[5] = "&quot;then I will turn against that man and his family, and cut off from their people both him and all who follow him in prostituting themselves with Molech.";
csb[6] = "&quot;Whoever turns to mediums or spiritists and prostitutes himself with them, I will turn against that person and cut him off from his people.";
csb[7] = "&quot;Consecrate yourselves and be holy, for I am the LORD your God.";
csb[8] = "&quot;Keep my statutes and do them; I am the LORD who sets you apart.";
csb[9] = "&quot;If anyone curses his father or mother, he must be put to death. He has cursed his father or mother; his death is his own fault.";
csb[10] = "&quot;If a man commits adultery with a married woman -- if he commits adultery with his neighbor\'s wife -- both the adulterer and the adulteress must be put to death.";
csb[11] = "&quot;If a man sleeps with his father\'s wife, he has violated the intimacy that belongs to his father. Both of them must be put to death; their death is their own fault.";
csb[12] = "&quot;If a man sleeps with his daughter-in-law, both of them must be put to death. They have acted perversely; their death is their own fault.";
csb[13] = "&quot;If a man sleeps with a man as with a woman, they have both committed a detestable act. They must be put to death; their death is their own fault.";
csb[14] = "&quot;If a man marries a woman and her mother, it is depraved. Both he and they must be burned, so that there will be no depravity among you.";
csb[15] = "&quot;If a man has sexual intercourse with an animal, he must be put to death; you are also to kill the animal.";
csb[16] = "&quot;If a woman approaches any animal and mates with it, you are to kill the woman and the animal. They must be put to death; their death is their own fault.";
csb[17] = "&quot;If a man marries his sister, whether his father\'s daughter or his mother\'s daughter, and they have sexual relations, it is a disgrace. They are to be cut off publicly from their people. He has had sexual intercourse with his sister; he will bear his iniquity.";
csb[18] = "&quot;If a man sleeps with a menstruating woman and has sexual intercourse with her, he has exposed the source of her flow, and she has uncovered the source of her blood. Both of them are to be cut off from their people.";
csb[19] = "&quot;You must not have sexual intercourse with your mother\'s sister or your father\'s sister, for it is exposing one\'s own blood relative; both people will bear their iniquity.";
csb[20] = "&quot;If a man sleeps with his aunt, he has violated the intimacy that belongs to his uncle; they will bear their guilt and die childless.";
csb[21] = "&quot;If a man marries his brother\'s wife, it is impurity. He has violated the intimacy that belongs to his brother; they will be childless.";
csb[22] = "&quot;You are to keep all my statutes and all my ordinances, and do them, so that the land where I am bringing you to live will not vomit you out.";
csb[23] = "&quot;You must not follow the statutes of the nations I am driving out before you, for they did all these things, and I abhorred them.";
csb[24] = "&quot;And I promised you: You will inherit their land, since I will give it to you to possess, a land flowing with milk and honey. I am the LORD your God who set you apart from the peoples.";
csb[25] = "&quot;Therefore you are to distinguish the clean animal from the unclean one, and the unclean bird from the clean one. Do not become contaminated by any land animal, bird, or whatever crawls on the ground; I have set these apart as unclean for you.";
csb[26] = "&quot;You are to be holy to me because I, the LORD, am holy, and I have set you apart from the nations to be mine.";
csb[27] = "&quot;A man or a woman who is a medium or a spiritist must be put to death. They are to be stoned; their death is their own fault.&quot;";
