csb[1] = "&quot;If his offering is a fellowship sacrifice, and he is presenting an animal from the herd, whether male or female, he is to present one without blemish before the LORD.";
csb[2] = "&quot;He is to lay his hand on the head of his offering and slaughter it at the entrance to the tent of meeting. Then Aaron\'s sons the priests will splatter the blood on all sides of the altar.";
csb[3] = "&quot;He will present part of the fellowship sacrifice as a fire offering to the LORD: the fat surrounding the entrails, all the fat that is on the entrails,";
csb[4] = "&quot;and the two kidneys with the fat on them at the loins; he will also remove the fatty lobe of the liver with the kidneys.";
csb[5] = "&quot;Aaron\'s sons will burn it on the altar along with the burnt offering that is on the burning wood, a fire offering of a pleasing aroma to the LORD.";
csb[6] = "&quot;If his offering as a fellowship sacrifice to the LORD is from the flock, he is to present a male or female without blemish.";
csb[7] = "&quot;If he is presenting a lamb for his offering, he is to present it before the LORD.";
csb[8] = "&quot;He must lay his hand on the head of his offering, then slaughter it before the tent of meeting. Aaron\'s sons will splatter its blood on all sides of the altar.";
csb[9] = "&quot;He will then present part of the fellowship sacrifice as a fire offering to the LORD consisting of its fat and the entire fat tail, which he is to remove close to the backbone. He will also remove the fat surrounding the entrails, all the fat on the entrails,";
csb[10] = "&quot;the two kidneys with the fat on them at the loins, and the fatty lobe of the liver above the kidneys.";
csb[11] = "&quot;Then the priest will burn the food on the altar, as a fire offering to the LORD.";
csb[12] = "&quot;If his offering is a goat, he is to present it before the LORD.";
csb[13] = "&quot;He must lay his hand on its head and slaughter it before the tent of meeting. Aaron\'s sons will splatter its blood on all sides of the altar.";
csb[14] = "&quot;He will present part of his offering as a fire offering to the LORD: the fat surrounding the entrails, all the fat that is on the entrails,";
csb[15] = "&quot;and the two kidneys with the fat on them at the loins; he will also remove the fatty lobe of the liver with the kidneys.";
csb[16] = "&quot;Then the priest will burn the food on the altar, as a fire offering for a pleasing aroma. &quot;All fat belongs to the LORD.";
csb[17] = "&quot;This is a permanent statute throughout your generations, wherever you live: you must not eat any fat or any blood.&quot;";
