csb[1] = "The LORD spoke to Moses:";
csb[2] = "&quot;When someone sins and offends the LORD by deceiving his neighbor in regard to a deposit, a security, or a robbery; or defrauds his neighbor;";
csb[3] = "&quot;or finds something lost and lies about it; or swears falsely about any of the sinful things a person may do --";
csb[4] = "&quot;once he has sinned and acknowledged his guilt -- he must return what he stole or defrauded, or the deposit entrusted to him, or the lost item he found,";
csb[5] = "&quot;or anything else about which he swore falsely. He will make full restitution for it and add a fifth of its value to it. He is to pay it to its owner on the day he acknowledges his guilt.";
csb[6] = "&quot;Then he is to bring his guilt offering to the LORD: an unblemished ram from the flock according to your assessment of its value as a guilt offering to the priest.";
csb[7] = "&quot;In this way the priest will make atonement on his behalf before the LORD, and he will be forgiven for anything he may have done to incur guilt.&quot;";
csb[8] = "The LORD spoke to Moses:";
csb[9] = "&quot;Command Aaron and his sons: This is the law of the burnt offering; the burnt offering itself must remain on the altar\'s hearth all night until morning, while the fire of the altar is kept burning on it.";
csb[10] = "&quot;The priest is to put on his linen robe and linen undergarments. He is to remove the ashes of the burnt offering the fire has consumed on the altar, and place them beside the altar.";
csb[11] = "&quot;Then he will take off his garments, put on other clothes, and bring the ashes outside the camp to a ceremonially clean place.";
csb[12] = "&quot;The fire on the altar is to be kept burning; it must not go out. Every morning the priest will burn wood on the fire. He is to arrange the burnt offering on the fire and burn the fat portions from the fellowship offerings on it.";
csb[13] = "&quot;Fire must be kept burning on the altar continually; it must not go out.";
csb[14] = "&quot;Now this is the law of the grain offering: Aaron\'s sons will present it before the LORD in front of the altar.";
csb[15] = "&quot;The priest is to remove a handful of fine flour and olive oil from the grain offering, with all the frankincense that is on the offering, and burn its memorial portion on the altar as a pleasing aroma to the LORD.";
csb[16] = "&quot;Aaron and his sons may eat the rest of it. It is to be eaten in the form of unleavened bread in a holy place; they are to eat it in the courtyard of the tent of meeting.";
csb[17] = "&quot;It must not be baked with yeast; I have assigned it as their portion from my fire offerings. It is especially holy, like the sin offering and the guilt offering.";
csb[18] = "&quot;Any male among Aaron\'s descendants may eat it. It is a permanent portion throughout your generations from the fire offerings to the LORD. Anything that touches the offerings will become holy.&quot;";
csb[19] = "The LORD spoke to Moses:";
csb[20] = "&quot;This is the offering that Aaron and his sons are to present to the LORD on the day that he is anointed: two quarts of fine flour as a regular grain offering, half of it in the morning and half in the evening.";
csb[21] = "&quot;It is to be prepared with oil on a griddle; you are to bring it well-kneaded. You are to present it as a grain offering of baked pieces, a pleasing aroma to the LORD.";
csb[22] = "&quot;The priest, who is one of Aaron\'s sons and will be anointed to take his place, is to prepare it. It must be completely burned as a permanent portion for the LORD.";
csb[23] = "&quot;Every grain offering for a priest will be a whole burnt offering; it is not to be eaten.&quot;";
csb[24] = "The LORD spoke to Moses:";
csb[25] = "&quot;Tell Aaron and his sons: This is the law of the sin offering. The sin offering is most holy and must be slaughtered before the LORD at the place where the burnt offering is slaughtered.";
csb[26] = "&quot;The priest who offers it as a sin offering will eat it. It is to be eaten in a holy place, in the courtyard of the tent of meeting.";
csb[27] = "&quot;Anything that touches its flesh will become holy, and if any of its blood spatters on a garment, then you must wash that garment in a holy place.";
csb[28] = "&quot;A clay pot in which the sin offering is boiled is to be broken; if it is boiled in a bronze vessel, it is to be scoured and rinsed with water.";
csb[29] = "&quot;Any male among the priests may eat it; it is especially holy.";
csb[30] = "&quot;But no sin offering may be eaten if its blood has been brought into the tent of meeting to make atonement in the holy place; it must be burned.";
</script>
