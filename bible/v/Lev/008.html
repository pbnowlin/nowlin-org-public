csb[1] = "The LORD spoke to Moses:";
csb[2] = "&quot;Take Aaron, his sons with him, the garments, the anointing oil, the bull of the sin offering, the two rams, and the basket of unleavened bread,";
csb[3] = "&quot;and assemble the whole community at the entrance to the tent of meeting.&quot;";
csb[4] = "So Moses did as the LORD commanded him, and the community assembled at the entrance to the tent of meeting.";
csb[5] = "Moses said to them, &quot;This is what the LORD has commanded to be done.&quot;";
csb[6] = "Then Moses presented Aaron and his sons and washed them with water.";
csb[7] = "He put the tunic on Aaron, wrapped the sash around him, clothed him with the robe, and put the ephod on him. He put the woven band of the ephod around him and fastened it to him.";
csb[8] = "Then he put the breastpiece on him and placed the Urim and Thummim into the breastpiece.";
csb[9] = "He also put the turban on his head and placed the gold medallion, the holy diadem, on the front of the turban, as the LORD had commanded Moses.";
csb[10] = "Then Moses took the anointing oil and anointed the tabernacle and everything in it to consecrate them.";
csb[11] = "He sprinkled some of the oil on the altar seven times, anointing the altar with all its utensils, and the basin with its stand, to consecrate them.";
csb[12] = "He poured some of the anointing oil on Aaron\'s head and anointed and consecrated him.";
csb[13] = "Then Moses presented Aaron\'s sons, clothed them with tunics, wrapped sashes around them, and fastened headbands on them, as the LORD had commanded Moses.";
csb[14] = "Then he brought the bull near for the sin offering, and Aaron and his sons laid their hands on the head of the bull for the sin offering.";
csb[15] = "Then Moses slaughtered it, took the blood, and applied it with his finger to the horns of the altar on all sides, purifying the altar. He poured out the blood at the base of the altar and consecrated it so that atonement can be made on it.";
csb[16] = "Moses took all the fat that was on the entrails, the fatty lobe of the liver, and the two kidneys with their fat, and he burned them on the altar.";
csb[17] = "He burned the bull with its hide, flesh, and waste outside the camp, as the LORD had commanded Moses.";
csb[18] = "Then he presented the ram for the burnt offering, and Aaron and his sons laid their hands on the head of the ram.";
csb[19] = "Moses slaughtered it and splattered the blood on all sides of the altar.";
csb[20] = "Moses cut the ram into pieces and burned the head, the pieces, and the fat,";
csb[21] = "but he washed the entrails and legs with water. He then burned the entire ram on the altar. It was a burnt offering for a pleasing aroma, a fire offering to the LORD as he had commanded Moses.";
csb[22] = "Next he presented the second ram, the ram of ordination, and Aaron and his sons laid their hands on the head of the ram.";
csb[23] = "Moses slaughtered it, took some of its blood, and put it on Aaron\'s right earlobe, on the thumb of his right hand, and on the big toe of his right foot.";
csb[24] = "Moses also presented Aaron\'s sons and put some of the blood on their right earlobes, on the thumbs of their right hands, and on the big toes of their right feet. Then Moses splattered the blood on all sides of the altar.";
csb[25] = "He took the fat -- the fat tail, all the fat that was on the entrails, the fatty lobe of the liver, and the two kidneys with their fat -- as well as the right thigh.";
csb[26] = "From the basket of unleavened bread that was before the LORD he took one cake of unleavened bread, one cake of bread made with oil, and one wafer, and placed them on the fat portions and the right thigh.";
csb[27] = "He put all these in the hands of Aaron and his sons and presented them before the LORD as a presentation offering.";
csb[28] = "Then Moses took them from their hands and burned them on the altar with the burnt offering. This was an ordination offering for a pleasing aroma, a fire offering to the LORD.";
csb[29] = "He also took the breast and presented it before the LORD as a presentation offering; it was Moses\'s portion of the ordination ram as the LORD had commanded him.";
csb[30] = "Then Moses took some of the anointing oil and some of the blood that was on the altar and sprinkled them on Aaron and his garments, as well as on his sons and their garments. In this way he consecrated Aaron and his garments, as well as his sons and their garments.";
csb[31] = "Moses said to Aaron and his sons, &quot;Boil the meat at the entrance to the tent of meeting and eat it there with the bread that is in the basket for the ordination offering as I commanded: Aaron and his sons are to eat it.";
csb[32] = "&quot;Burn up what remains of the meat and bread.";
csb[33] = "&quot;Do not go outside the entrance to the tent of meeting for seven days, until the time your days of ordination are completed, because it will take seven days to ordain you.";
csb[34] = "&quot;The LORD commanded what has been done today in order to make atonement for you.";
csb[35] = "&quot;You must remain at the entrance to the tent of meeting day and night for seven days and keep the LORD\'s charge so that you will not die, for this is what I was commanded.&quot;";
csb[36] = "So Aaron and his sons did everything the LORD had commanded through Moses.";
