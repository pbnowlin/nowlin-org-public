csb[1] = "The LORD spoke to Moses:";
csb[2] = "&quot;This is the law concerning the person afflicted with a skin disease on the day of his cleansing. He is to be brought to the priest,";
csb[3] = "&quot;who will go outside the camp and examine him. If the skin disease has disappeared from the afflicted person,";
csb[4] = "&quot;the priest will order that two live clean birds, cedar wood, scarlet yarn, and hyssop be brought for the one who is to be cleansed.";
csb[5] = "&quot;Then the priest will order that one of the birds be slaughtered over fresh water in a clay pot.";
csb[6] = "&quot;He is to take the live bird together with the cedar wood, scarlet yarn, and hyssop, and dip them all into the blood of the bird that was slaughtered over the fresh water.";
csb[7] = "&quot;He will then sprinkle the blood seven times on the one who is to be cleansed from the skin disease. He is to pronounce him clean and release the live bird over the open countryside.";
csb[8] = "&quot;The one who is to be cleansed must wash his clothes, shave off all his hair, and bathe with water; he is clean. Afterward he may enter the camp, but he must remain outside his tent for seven days.";
csb[9] = "&quot;He is to shave off all his hair again on the seventh day: his head, his beard, his eyebrows, and the rest of his hair. He is to wash his clothes and bathe himself with water; he is clean.";
csb[10] = "&quot;On the eighth day he must take two unblemished male lambs, an unblemished year-old ewe lamb, a grain offering of six quarts of fine flour mixed with olive oil, and one-third of a quart of olive oil.";
csb[11] = "&quot;The priest who performs the cleansing will place the person who is to be cleansed, together with these offerings, before the LORD at the entrance to the tent of meeting.";
csb[12] = "&quot;The priest is to take one male lamb and present it as a guilt offering, along with the one-third quart of olive oil, and he will present them as a presentation offering before the LORD.";
csb[13] = "&quot;He is to slaughter the male lamb at the place in the sanctuary area where the sin offering and burnt offering are slaughtered, for like the sin offering, the guilt offering belongs to the priest; it is especially holy.";
csb[14] = "&quot;The priest is to take some of the blood from the guilt offering and put it on the lobe of the right ear of the one to be cleansed, on the thumb of his right hand, and on the big toe of his right foot.";
csb[15] = "&quot;Then the priest will take some of the one-third quart of olive oil and pour it into his left palm.";
csb[16] = "&quot;The priest will dip his right finger into the oil in his left palm and sprinkle some of the oil with his finger seven times before the LORD.";
csb[17] = "&quot;From the oil remaining in his palm the priest will put some on the lobe of the right ear of the one to be cleansed, on the thumb of his right hand, and on the big toe of his right foot, on top of the blood of the guilt offering.";
csb[18] = "&quot;What is left of the oil in the priest\'s palm he is to put on the head of the one to be cleansed. In this way the priest will make atonement for him before the LORD.";
csb[19] = "&quot;The priest is to sacrifice the sin offering and make atonement for the one to be cleansed from his uncleanness. Afterward he will slaughter the burnt offering.";
csb[20] = "&quot;The priest is to offer the burnt offering and the grain offering on the altar. The priest will make atonement for him, and he will be clean.";
csb[21] = "&quot;But if he is poor and cannot afford these, he is to take one male lamb for a guilt offering to be presented in order to make atonement for him, along with two quarts of fine flour mixed with olive oil for a grain offering, one-third of a quart of olive oil,";
csb[22] = "&quot;and two turtledoves or two young pigeons, whatever he can afford, one to be a sin offering and the other a burnt offering.";
csb[23] = "&quot;On the eighth day he is to bring these things for his cleansing to the priest at the entrance to the tent of meeting before the LORD.";
csb[24] = "&quot;The priest will take the male lamb for the guilt offering and the one-third quart of olive oil, and present them as a presentation offering before the LORD.";
csb[25] = "&quot;After he slaughters the male lamb for the guilt offering, the priest is to take some of the blood of the guilt offering and put it on the right earlobe of the one to be cleansed, on the thumb of his right hand, and on the big toe of his right foot.";
csb[26] = "&quot;Then the priest will pour some of the oil into his left palm.";
csb[27] = "&quot;With his right finger the priest will sprinkle some of the oil in his left palm seven times before the LORD.";
csb[28] = "&quot;The priest will also put some of the oil in his palm on the right earlobe of the one to be cleansed, on the thumb of his right hand, and on the big toe of his right foot, on the same place as the blood of the guilt offering.";
csb[29] = "&quot;What is left of the oil in the priest\'s palm he is to put on the head of the one to be cleansed to make atonement for him before the LORD.";
csb[30] = "&quot;He is to then sacrifice one type of what he can afford, either the turtledoves or young pigeons,";
csb[31] = "&quot;one as a sin offering and the other as a burnt offering, sacrificing what he can afford together with the grain offering. In this way the priest will make atonement before the LORD for the one to be cleansed.";
csb[32] = "&quot;This is the law for someone who has a skin disease and cannot afford the cost of his cleansing.&quot;";
csb[33] = "The LORD spoke to Moses and Aaron:";
csb[34] = "&quot;When you enter the land of Canaan that I am giving you as a possession, and I place a mildew contamination in a house in the land you possess,";
csb[35] = "&quot;the owner of the house is to come and tell the priest: Something like mildew contamination has appeared in my house.";
csb[36] = "&quot;The priest must order them to clear the house before he enters to examine the contamination, so that nothing in the house becomes unclean. Afterward the priest will come to examine the house.";
csb[37] = "&quot;He will examine it, and if the contamination in the walls of the house consists of green or red indentations that appear to be beneath the surface of the wall,";
csb[38] = "&quot;the priest is to go outside the house to its doorway and quarantine the house for seven days.";
csb[39] = "&quot;The priest is to return on the seventh day and examine it. If the contamination has spread on the walls of the house,";
csb[40] = "&quot;the priest must order that the stones with the contamination be pulled out and thrown into an unclean place outside the city.";
csb[41] = "&quot;He is to have the inside of the house completely scraped, and have the plaster that is scraped off dumped in an unclean place outside the city.";
csb[42] = "&quot;Then they are to take different stones to replace the former ones and take additional plaster to replaster the house.";
csb[43] = "&quot;If the contamination reappears in the house after the stones have been pulled out, and after the house has been scraped and replastered,";
csb[44] = "&quot;the priest is to come and examine it. If the contamination has spread in the house, it is harmful mildew; the house is unclean.";
csb[45] = "&quot;It must be torn down with its stones, its beams, and all its plaster, and taken outside the city to an unclean place.";
csb[46] = "&quot;Whoever enters the house during any of the days the priest quarantines it will be unclean until evening.";
csb[47] = "&quot;Whoever lies down in the house is to wash his clothes, and whoever eats in it is to wash his clothes.";
csb[48] = "&quot;But when the priest comes and examines it, if the contamination has not spread in the house after it was replastered, he is to pronounce the house clean because the contamination has disappeared.";
csb[49] = "&quot;He is to take two birds, cedar wood, scarlet yarn, and hyssop to purify the house,";
csb[50] = "&quot;and he is to slaughter one of the birds over a clay pot containing fresh water.";
csb[51] = "&quot;He will take the cedar wood, the hyssop, the scarlet yarn, and the live bird, dip them in the blood of the slaughtered bird and the fresh water, and sprinkle the house seven times.";
csb[52] = "&quot;He will purify the house with the blood of the bird, the fresh water, the live bird, the cedar wood, the hyssop, and the scarlet yarn.";
csb[53] = "&quot;Then he is to release the live bird into the open countryside outside the city. In this way he will make atonement for the house, and it will be clean.";
csb[54] = "&quot;This is the law for any skin disease or mildew, for a scaly outbreak,";
csb[55] = "&quot;for mildew in clothing or on a house,";
csb[56] = "&quot;and for a swelling, scab, or spot,";
csb[57] = "&quot;to determine when something is unclean or clean. This is the law regarding skin disease and mildew.&quot;";
</script>
