rsv[2] = "&quot;Say to Aaron and his sons, and to all the people of Israel, This is the thing which the LORD has commanded.";
asv[2] = "Speak unto Aaron, and unto his sons, and unto all the children of Israel, and say unto them: This is the thing which Jehovah hath commanded, saying,";
yng[2] = "`Speak unto Aaron, and unto his sons, and unto all the sons of Israel; and thou hast said unto them, This [is] the thing which Jehovah hath commanded, saying,";
dby[2] = "Speak unto Aaron, and unto his sons, and unto all the children of Israel, and say unto them, This is the thing which Jehovah hath commanded, saying,";
web[2] = "Speak to Aaron, and to his sons, and to all the children of Israel, and say to them, This [is] the thing which the LORD hath commanded, saying,";
hnv[2] = "&quot;Speak to Aharon, and to his sons, and to all the children of Yisra\'el, and say to them: \'This is the thing which the LORD has commanded,";
vul[2] = "loquere Aaron et filiis eius et cunctis filiis Israhel et dices ad eos iste est sermo quem mandavit Dominus dicens";
rsv[3] = "If any man of the house of Israel kills an ox or a lamb or a goat in the camp, or kills it outside the camp,";
asv[3] = "What man soever there be of the house of Israel, that killeth an ox, or lamb, or goat, in the camp, or that killeth it without the camp,";
yng[3] = "Any man of the house of Israel who slaughtereth ox, or lamb, or goat, in the camp, or who slaughtereth at the outside of the camp,";
dby[3] = "Every one of the house of Israel that slaughtereth an ox, or sheep, or goat, in the camp, or that slaughtereth it out of the camp,";
web[3] = "Whatever man [there may be] of the house of Israel, that killeth an ox, or lamb, or goat in the camp, or that killeth [it] out of the camp,";
hnv[3] = "Whatever man there is of the house of Yisra\'el, who kills an ox, or lamb, or goat, in the camp, or who kills it outside the camp,";
vul[3] = "homo quilibet de domo Israhel si occiderit bovem aut ovem sive capram in castris vel extra castra";
rsv[4] = "and does not bring it to the door of the tent of meeting, to offer it as a gift to the LORD before the tabernacle of the LORD, bloodguilt shall be imputed to that man; he has shed blood; and that man shall be cut off from among his people.";
asv[4] = "and hath not brought it unto the door of the tent of meeting, to offer it as an oblation unto Jehovah before the tabernacle of Jehovah: blood shall be imputed unto that man; he hath shed blood; and that man shall be cut off from among his people:";
yng[4] = "and unto the opening of the tent of meeting hath not brought it in to bring near an offering to Jehovah before the tabernacle of Jehovah, blood is reckoned to that man -- blood he hath shed -- and that man hath been cut off from the midst of his people;";
dby[4] = "and doth not bring it to the entrance of the tent of meeting to present it as an offering to Jehovah, before the tabernacle of Jehovah, blood shall be reckoned unto that man: he hath shed blood; and that man shall be cut off from among his people,";
web[4] = "And bringeth it not to the door of the tabernacle of the congregation, to offer an offering to the LORD before the tabernacle of the LORD; blood shall be imputed to that man; he hath shed blood; and that man shall be cut off from among his people:";
hnv[4] = "and hasn\'t brought it to the door of the Tent of Meeting, to offer it as an offering to the LORD before the tabernacle of the LORD: blood shall be imputed to that man. He has shed blood; and that man shall be cut off from among his people.";
vul[4] = "et non obtulerit ad ostium tabernaculi oblationem Domino sanguinis reus erit quasi sanguinem fuderit sic peribit de medio populi sui";
rsv[5] = "This is to the end that the people of Israel may bring their sacrifices which they slay in the open field, that they may bring them to the LORD, to the priest at the door of the tent of meeting, and slay them as sacrifices of peace offerings to the LORD;";
asv[5] = "to the end that the children of Israel may bring their sacrifices, which they sacrifice in the open field, even that they may bring them unto Jehovah, unto the door of the tent of meeting, unto the priest, and sacrifice them for sacrifices of peace-offerings unto Jehovah.";
yng[5] = "so that the sons of Israel do bring in their sacrifices which they are sacrificing on the face of the field, yea, they have brought them in to Jehovah, unto the opening of the tent of meeting, unto the priest, and they have sacrificed sacrifices of peace-offerings to Jehovah with them.";
dby[5] = "to the end that the children of Israel bring their sacrifices, which they sacrifice in the open field, that they bring them to Jehovah, unto the entrance of the tent of meeting, unto the priest, and sacrifice them as sacrifices of peace-offerings to Jehovah.";
web[5] = "To the end that the children of Israel may bring their sacrifices which they offer in the open field, even that they may bring them to the LORD, to the door of the tabernacle of the congregation, to the priest, and offer them [for] peace-offerings to the LORD.";
hnv[5] = "This is to the end that the children of Yisra\'el may bring their sacrifices, which they sacrifice in the open field, that they may bring them to the LORD, to the door of the Tent of Meeting, to the Kohen, and sacrifice them for sacrifices of shalom offerings to the LORD.";
vul[5] = "ideo offerre debent sacerdoti filii Israhel hostias suas quas occidunt in agro ut sanctificentur Domino ante ostium tabernaculi testimonii et immolent eas hostias pacificas Domino";
rsv[6] = "and the priest shall sprinkle the blood on the altar of the LORD at the door of the tent of meeting, and burn the fat for a pleasing odor to the LORD.";
asv[6] = "And the priest shall sprinkle the blood upon the altar of Jehovah at the door of the tent of meeting, and burn the fat for a sweet savor unto Jehovah.";
yng[6] = "`And the priest hath sprinkled the blood upon the altar of Jehovah, at the opening of the tent of meeting, and hath made perfume with the fat for sweet fragrance to Jehovah;";
dby[6] = "And the priest shall sprinkle the blood upon the altar of Jehovah, at the entrance of the tent of meeting, and burn the fat for a sweet odour to Jehovah.";
web[6] = "And the priest shall sprinkle the blood upon the altar of the LORD [at] the door of the tabernacle of the congregation, and burn the fat for a sweet savor to the LORD.";
hnv[6] = "The Kohen shall sprinkle the blood on the altar of the LORD at the door of the Tent of Meeting, and burn the fat for a sweet savor to the LORD.";
vul[6] = "fundetque sacerdos sanguinem super altare Domini ad ostium tabernaculi testimonii et adolebit adipem in odorem suavitatis Domino";
rsv[7] = "So they shall no more slay their sacrifices for satyrs, after whom they play the harlot. This shall be a statute for ever to them throughout their generations.";
asv[7] = "And they shall no more sacrifice their sacrifices unto the he-goats, after which they play the harlot. This shall be a statute forever unto them throughout their generations.";
yng[7] = "and they sacrifice not any more their sacrifices to goats after which they are going a-whoring; a statute age-during is this to them, to their generations.";
dby[7] = "And they shall no more sacrifice their sacrifices unto demons, after whom they go a whoring. This shall be an everlasting statute unto them for their generations.";
web[7] = "And they shall no more offer their sacrifices to idols, with which they have committed idolatry: This shall be a statute for ever to them throughout their generations.";
hnv[7] = "They shall no more sacrifice their sacrifices to the goat idols, after which they play the prostitute. This shall be a statute forever to them throughout their generations.\'";
vul[7] = "et nequaquam ultra immolabunt hostias suas daemonibus cum quibus fornicati sunt legitimum sempiternum erit illis et posteris eorum";
rsv[8] = "&quot;And you shall say to them, Any man of the house of Israel, or of the strangers that sojourn among them, who offers a burnt offering or sacrifice,";
asv[8] = "And thou shalt say unto them, Whatsoever man there be of the house of Israel, or of the strangers that sojourn among them, that offereth a burnt-offering or sacrifice,";
yng[8] = "`And unto them thou sayest: Any man of the house of Israel, or of the sojourners, who sojourneth in your midst, who causeth burnt-offering or sacrifice to ascend,";
dby[8] = "And thou shalt say unto them, Every one of the house of Israel, and of the strangers who sojourn among them, that offereth up a burnt-offering or sacrifice,";
web[8] = "And thou shalt say to them, Whatever man [there may be] of the house of Israel, or of the strangers which sojourn among you, that offereth a burnt-offering or sacrifice,";
hnv[8] = "&quot;You shall say to them, \'Any man there is of the house of Yisra\'el, or of the strangers who live as foreigners among them, who offers a burnt offering or sacrifice,";
vul[8] = "et ad ipsos dices homo de domo Israhel et de advenis qui peregrinantur apud vos qui obtulerit holocaustum sive victimam";
rsv[9] = "and does not bring it to the door of the tent of meeting, to sacrifice it to the LORD; that man shall be cut off from his people.";
asv[9] = "and bringeth it not unto the door of the tent of meeting, to sacrifice it unto Jehovah; that man shall be cut off from his people.";
yng[9] = "and unto the opening of the tent of meeting doth not bring it in to make it to Jehovah -- that man hath been cut off from his people.";
dby[9] = "and bringeth it not to the entrance of the tent of meeting, to offer it up to Jehovah -- that man shall be cut off from his peoples.";
web[9] = "And bringeth it not to the door of the tabernacle of the congregation, to offer it to the LORD; even that man shall be cut off from among his people.";
hnv[9] = "and doesn\'t bring it to the door of the Tent of Meeting, to sacrifice it to the LORD; that man shall be cut off from his people.";
vul[9] = "et ad ostium tabernaculi testimonii non adduxerit eam ut offeratur Domino interibit de populo suo";
rsv[10] = "&quot;If any man of the house of Israel or of the strangers that sojourn among them eats any blood, I will set my face against that person who eats blood, and will cut him off from among his people.";
asv[10] = "And whatsoever man there be of the house of Israel, or of the strangers that sojourn among them, that eateth any manner of blood, I will set my face against that soul that eateth blood, and will cut him off from among his people.";
yng[10] = "`And any man of the house of Israel, or of the sojourners, who is sojourning in your midst, who eateth any blood, I have even set My face against the person who is eating the blood, and have cut him off from the midst of his people;";
dby[10] = "And every one of the house of Israel, or of the strangers who sojourn among them, that eateth any manner of blood, -- I will set my face against the soul that hath eaten blood, and will cut him off from among his people;";
web[10] = "And whatever man [there may be] of the house of Israel, or of the strangers that sojourn among you, that eateth any manner of blood; I will even set my face against that soul that eateth blood, and will cut him off from among his people.";
hnv[10] = "&quot;\'Any man of the house of Yisra\'el, or of the strangers who live as foreigners among them, who eats any kind of blood, I will set my face against that soul who eats blood, and will cut him off from among his people.";
vul[10] = "homo quilibet de domo Israhel et de advenis qui peregrinantur inter eos si comederit sanguinem obfirmabo faciem meam contra animam illius et disperdam eam de populo suo";
rsv[11] = "For the life of the flesh is in the blood; and I have given it for you upon the altar to make atonement for your souls; for it is the blood that makes atonement, by reason of the life.";
asv[11] = "For the life of the flesh is in the blood; and I have given it to you upon the altar to make atonement for your souls: for it is the blood that maketh atonement by reason of the life.";
yng[11] = "for the life of the flesh is in the blood, and I have given it to you on the altar, to make atonement for your souls; for it [is] the blood which maketh atonement for the soul.";
dby[11] = "for the soul of the flesh is in the blood; and I have given it to you upon the altar to make atonement for your souls, for it is the blood that maketh atonement for the soul.";
web[11] = "For the life of the flesh [is] in the blood: and I have given it to you upon the altar, to make an atonement for your souls: for it [is] the blood [that] maketh an atonement for the soul.";
hnv[11] = "For the life of the flesh is in the blood; and I have given it to you on the altar to make atonement for your souls: for it is the blood that makes atonement by reason of the life.";
vul[11] = "quia anima carnis in sanguine est et ego dedi illum vobis ut super altare in eo expietis pro animabus vestris et sanguis pro animae piaculo sit";
rsv[12] = "Therefore I have said to the people of Israel, No person among you shall eat blood, neither shall any stranger who sojourns among you eat blood.";
asv[12] = "Therefore I said unto the children of Israel, No soul of you shall eat blood, neither shall any stranger that sojourneth among you eat blood.";
yng[12] = "`Therefore I have said to the sons of Israel, No person among you doth eat blood, and the sojourner who is sojourning in your midst doth not eat blood;";
dby[12] = "Therefore have I said unto the children of Israel, No soul of you shall eat blood, neither shall the stranger who sojourneth among you eat blood.";
web[12] = "Therefore I said to the children of Israel, No soul of you shall eat blood, neither shall any stranger that sojourneth among you eat blood.";
hnv[12] = "Therefore I have said to the children of Yisra\'el, &quot;No person among you shall eat blood, neither shall any stranger who lives as a foreigner among you eat blood.&quot;";
vul[12] = "idcirco dixi filiis Israhel omnis anima ex vobis non comedet sanguinem nec ex advenis qui peregrinantur inter vos";
rsv[13] = "Any man also of the people of Israel, or of the strangers that sojourn among them, who takes in hunting any beast or bird that may be eaten shall pour out its blood and cover it with dust.";
asv[13] = "And whatsoever man there be of the children of Israel, or of the strangers that sojourn among them, who taketh in hunting any beast or bird that may be eaten; he shall pour out the blood thereof, and cover it with dust.";
yng[13] = "and any man of the sons of Israel, or of the sojourners, who is sojourning in your midst, who hunteth venison, beast or fowl, which is eaten -- hath even poured out its blood, and hath covered it with dust;";
dby[13] = "And every one of the children of Israel, and of the strangers who sojourn among them, that catcheth in the hunt a beast or fowl that may be eaten, he shall pour out the blood thereof, and cover it with earth;";
web[13] = "And whatever man [there may be] of the children of Israel, or of the strangers that sojourn among you, who hunteth and catcheth any beast or fowl that may be eaten; he shall even pour out its blood, and cover it with dust.";
hnv[13] = "&quot;\'Whatever man there is of the children of Yisra\'el, or of the strangers who live as foreigners among them, who takes in hunting any animal or bird that may be eaten; he shall pour out its blood, and cover it with dust.";
vul[13] = "homo quicumque de filiis Israhel et de advenis qui peregrinantur apud vos si venatione atque aucupio ceperit feram vel avem quibus vesci licitum est fundat sanguinem eius et operiat illum terra";
rsv[14] = "&quot;For the life of every creature is the blood of it; therefore I have said to the people of Israel, You shall not eat the blood of any creature, for the life of every creature is its blood; whoever eats it shall be cut off.";
asv[14] = "For as to the life of all flesh, the blood thereof is [all one] with the life thereof: therefore I said unto the children of Israel, Ye shall eat the blood of no manner of flesh; for the life of all flesh is the blood thereof: whosoever eateth it shall be cut off.";
yng[14] = "for [it is] the life of all flesh, its blood is for its life; and I say to the sons of Israel, Blood of any flesh ye do not eat, for the life of all flesh is its blood; any one eating it is cut off.";
dby[14] = "for as to the life of all flesh, its blood is the life in it; and I have said unto the children of Israel, Of the blood of no manner of flesh shall ye eat, for the life of all flesh is its blood: whoever eateth it shall be cut off.";
web[14] = "For [it is] the life of all flesh, the blood of it [is] for the life of it; therefore I said to the children of Israel, Ye shall eat the blood of no manner of flesh: for the life of all flesh [is] its blood: whoever eateth it shall be cut off.";
hnv[14] = "For as to the life of all flesh, its blood is with its life: therefore I said to the children of Yisra\'el, &quot;You shall not eat the blood of any kind of flesh; for the life of all flesh is its blood. Whoever eats it shall be cut off.&quot;";
vul[14] = "anima enim omnis carnis in sanguine est unde dixi filiis Israhel sanguinem universae carnis non comedetis quia anima carnis in sanguine est et quicumque comederit illum interibit";
rsv[15] = "And every person that eats what dies of itself or what is torn by beasts, whether he is a native or a sojourner, shall wash his clothes, and bathe himself in water, and be unclean until the evening; then he shall be clean.";
asv[15] = "And every soul that eateth that which dieth of itself, or that which is torn of beasts, whether he be home-born or a sojourner, he shall wash his clothes, and bathe himself in water, and be unclean until the even: then shall he be clean.";
yng[15] = "`And any person who eateth a carcase or torn thing, among natives or among sojourners -- hath both washed his garments, and hath bathed with water, and hath been unclean until the evening -- then he hath been clean;";
dby[15] = "And every soul that eateth of a dead carcase, or of that which was torn, be it one home-born, or a stranger, he shall wash his clothes, and bathe in water, and be unclean until the even: then he shall be clean.";
web[15] = "And every soul that eateth that which died [of itself], or that which was torn [with beasts], ([whether it is] one of your own country, or a stranger) he shall both wash his clothes, and bathe [himself] in water, and be unclean until the evening; then shall he be clean.";
hnv[15] = "&quot;\'Every person that eats what dies of itself, or that which is torn by animals, whether he is native-born or a foreigner, he shall wash his clothes, and bathe himself in water, and be unclean until the evening: then he shall be clean.";
vul[15] = "anima quae comederit morticinum vel captum a bestia tam de indigenis quam de advenis lavabit vestes suas et semet ipsum aqua et contaminatus erit usque ad vesperum et hoc ordine mundus fiet";
rsv[16] = "But if he does not wash them or bathe his flesh, he shall bear his iniquity.&quot;";
asv[16] = "But if he wash them not, nor bathe his flesh, then he shall bear his iniquity.";
yng[16] = "and if he wash not, and his flesh bathe not -- then he hath borne his iniquity.\'";
dby[16] = "And if he wash them not nor bathe his flesh, then he shall bear his iniquity.";
web[16] = "But if he doth not wash [them], nor bathe his flesh; then he shall bear his iniquity.";
hnv[16] = "But if he doesn\'t wash them, or bathe his flesh, then he shall bear his iniquity.\'&quot;";
vul[16] = "quod si non laverit vestimenta sua nec corpus portabit iniquitatem suam";
csb[1] = "The LORD spoke to Moses:";
csb[2] = "&quot;Speak to Aaron, his sons, and all the Israelites and tell them: This is what the LORD has commanded:";
csb[3] = "&quot;Anyone from the house of Israel who slaughters an ox, sheep, or goat in the camp, or slaughters it outside the camp,";
csb[4] = "&quot;instead of bringing it to the entrance to the tent of meeting to present it as an offering to the LORD before his tabernacle -- that person will be considered guilty. He has shed blood and is to be cut off from his people.";
csb[5] = "&quot;This is so the Israelites will bring to the LORD the sacrifices they have been offering in the open country. They are to bring them to the priest at the entrance to the tent of meeting and offer them as fellowship sacrifices to the LORD.";
csb[6] = "&quot;The priest will then splatter the blood on the LORD\'s altar at the entrance to the tent of meeting and burn the fat as a pleasing aroma to the LORD.";
csb[7] = "&quot;They must no longer offer their sacrifices to the goat-demons that they have prostituted themselves with. This will be a permanent statute for them throughout their generations.";
csb[8] = "&quot;Say to them: Anyone from the house of Israel or from the aliens who reside among them who offers a burnt offering or a sacrifice";
csb[9] = "&quot;but does not bring it to the entrance to the tent of meeting to sacrifice it to the LORD, that person is to be cut off from his people.";
csb[10] = "&quot;Anyone from the house of Israel or from the aliens who reside among them who eats any blood, I will turn against that person who eats blood and cut him off from his people.";
csb[11] = "&quot;For the life of a creature is in the blood, and I have appointed it to you to make atonement on the altar for your lives, since it is the lifeblood that makes atonement.";
csb[12] = "&quot;Therefore I say to the Israelites: None of you and no alien who resides among you may eat blood.";
csb[13] = "&quot;Any Israelite or alien residing among them, who hunts down a wild animal or bird that may be eaten must drain its blood and cover it with dirt.";
csb[14] = "&quot;Since the life of every creature is its blood, I have told the Israelites: You are not to eat the blood of any creature, because the life of every creature is its blood; whoever eats it must be cut off.";
csb[15] = "&quot;Every person, whether the native or the resident alien, who eats an animal that died a natural death or was mauled by wild beasts is to wash his clothes and bathe with water, and he will remain unclean until evening; then he will be clean.";
csb[16] = "&quot;But if he does not wash his clothes and bathe himself, he will bear his iniquity.&quot;";
kjv[1] = "And the LORD spake unto Moses, saying,";
kjv[2] = "Speak unto Aaron, and unto his sons, and unto all the children of Israel, and say unto them; This [is] the thing which the LORD hath commanded, saying,";
kjv[3] = "What man soever [there be] of the house of Israel, that killeth an ox, or lamb, or goat, in the camp, or that killeth [it] out of the camp,";
kjv[4] = "And bringeth it not unto the door of the tabernacle of the congregation, to offer an offering unto the LORD before the tabernacle of the LORD; blood shall be imputed unto that man; he hath shed blood; and that man shall be cut off from among his people:";
kjv[5] = "To the end that the children of Israel may bring their sacrifices, which they offer in the open field, even that they may bring them unto the LORD, unto the door of the tabernacle of the congregation, unto the priest, and offer them [for] peace offerings unto the LORD.";
kjv[6] = "And the priest shall sprinkle the blood upon the altar of the LORD [at] the door of the tabernacle of the congregation, and burn the fat for a sweet savour unto the LORD.";
kjv[7] = "And they shall no more offer their sacrifices unto devils, after whom they have gone a whoring. This shall be a statute for ever unto them throughout their generations.";
kjv[8] = "And thou shalt say unto them, Whatsoever man [there be] of the house of Israel, or of the strangers which sojourn among you, that offereth a burnt offering or sacrifice,";
kjv[9] = "And bringeth it not unto the door of the tabernacle of the congregation, to offer it unto the LORD; even that man shall be cut off from among his people.";
kjv[10] = "And whatsoever man [there be] of the house of Israel, or of the strangers that sojourn among you, that eateth any manner of blood; I will even set my face against that soul that eateth blood, and will cut him off from among his people.";
kjv[11] = "For the life of the flesh [is] in the blood: and I have given it to you upon the altar to make an atonement for your souls: for it [is] the blood [that] maketh an atonement for the soul.";
kjv[12] = "Therefore I said unto the children of Israel, No soul of you shall eat blood, neither shall any stranger that sojourneth among you eat blood.";
kjv[13] = "And whatsoever man [there be] of the children of Israel, or of the strangers that sojourn among you, which hunteth and catcheth any beast or fowl that may be eaten; he shall even pour out the blood thereof, and cover it with dust.";
kjv[14] = "For [it is] the life of all flesh; the blood of it [is] for the life thereof: therefore I said unto the children of Israel, Ye shall eat the blood of no manner of flesh: for the life of all flesh [is] the blood thereof: whosoever eateth it shall be cut off.";
kjv[15] = "And every soul that eateth that which died [of itself], or that which was torn [with beasts, whether it be] one of your own country, or a stranger, he shall both wash his clothes, and bathe [himself] in water, and be unclean until the even: then shall he be clean.";
kjv[16] = "But if he wash [them] not, nor bathe his flesh; then he shall bear his iniquity.";
