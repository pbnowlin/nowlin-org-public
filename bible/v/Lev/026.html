csb[1] = "&quot;Do not make idols for yourselves, set up a carved image or sacred pillar for yourselves, or place a sculpted stone in your land to bow down to it, for I am the LORD your God.";
csb[2] = "&quot;Keep my Sabbaths and revere my sanctuary; I am the LORD.";
csb[3] = "&quot;If you follow my statutes and faithfully observe my commands,";
csb[4] = "&quot;I will give you rain at the right time, and the land will yield its produce, and the trees of the field will bear their fruit.";
csb[5] = "&quot;Your threshing will continue until grape harvest, and the grape harvest will continue until sowing time; you will have plenty of food to eat and live securely in your land.";
csb[6] = "&quot;I will give peace to the land, and you will lie down with nothing to frighten you. I will remove dangerous animals from the land, and no sword will pass through your land.";
csb[7] = "&quot;You will pursue your enemies, and they will fall before you by the sword.";
csb[8] = "&quot;Five of you will pursue a hundred, and a hundred of you will pursue ten thousand; your enemies will fall before you by the sword.";
csb[9] = "&quot;I will turn to you, make you fruitful and multiply you, and confirm my covenant with you.";
csb[10] = "&quot;You will eat the old grain of the previous year and will clear out the old to make room for the new.";
csb[11] = "&quot;I will place my residence among you, and I will not reject you.";
csb[12] = "&quot;I will walk among you and be your God, and you will be my people.";
csb[13] = "&quot;I am the LORD your God, who brought you out of the land of Egypt, so that you would no longer be their slaves. I broke the bars of your yoke and enabled you to live in freedom.";
csb[14] = "&quot;But if you do not obey me and observe all these commands --";
csb[15] = "&quot;if you reject my statutes and despise my ordinances, and do not observe all my commands -- and break my covenant,";
csb[16] = "&quot;then I will do this to you: I will bring terror on you -- wasting disease and fever that will cause your eyes to fail and your life to ebb away. You will sow your seed in vain because your enemies will eat it.";
csb[17] = "&quot;I will turn against you, so that you will be defeated by your enemies. Those who hate you will rule over you, and you will flee even though no one is pursuing you.";
csb[18] = "&quot;But if after these things you will not obey me, I will proceed to discipline you seven times for your sins.";
csb[19] = "&quot;I will break down your strong pride. I will make your sky like iron and your land like bronze,";
csb[20] = "&quot;and your strength will be used up for nothing. Your land will not yield its produce, and the trees of the land will not bear their fruit.";
csb[21] = "&quot;If you act with hostility toward me and are unwilling to obey me, I will multiply your plagues seven times for your sins.";
csb[22] = "&quot;I will send wild animals against you that will deprive you of your children, ravage your livestock, and reduce your numbers until your roads are deserted.";
csb[23] = "&quot;If in spite of these things you do not accept my discipline, but act with hostility toward me,";
csb[24] = "&quot;then I will act with hostility toward you; I also will strike you seven times for your sins.";
csb[25] = "&quot;I will bring a sword against you to execute the vengeance of the covenant. Though you withdraw into your cities, I will send a pestilence among you, and you will be delivered into enemy hands.";
csb[26] = "&quot;When I cut off your supply of bread, ten women will bake your bread in a single oven and ration out your bread by weight, so that you will eat but not be satisfied.";
csb[27] = "&quot;And if in spite of this you do not obey me but act with hostility toward me,";
csb[28] = "&quot;I will act with furious hostility toward you; I will also discipline you seven times for your sins.";
csb[29] = "&quot;You will eat the flesh of your sons; you will eat the flesh of your daughters.";
csb[30] = "&quot;I will destroy your high places, cut down your shrines, and heap your lifeless bodies on the lifeless bodies of your idols; I will reject you.";
csb[31] = "&quot;I will reduce your cities to ruins and devastate your sanctuaries. I will not smell the pleasing aroma of your sacrifices.";
csb[32] = "&quot;I also will devastate the land, so that your enemies who come to live there will be appalled by it.";
csb[33] = "&quot;But I will scatter you among the nations, and I will draw a sword to chase after you. So your land will become desolate, and your cities will become ruins.";
csb[34] = "&quot;Then the land will make up for its Sabbath years during the time it lies desolate, while you are in the land of your enemies. At that time the land will rest and make up for its Sabbaths.";
csb[35] = "&quot;As long as it lies desolate, it will have the rest it did not have during your Sabbaths when you lived there.";
csb[36] = "&quot;I will put anxiety in the hearts of those of you who survive in the lands of their enemies. The sound of a wind-driven leaf will put them to flight, and they will flee as one flees from a sword, and fall though no one is pursuing them.";
csb[37] = "&quot;They will stumble over one another as if fleeing from a sword though no one is pursuing them. You will not be able to stand against your enemies.";
csb[38] = "&quot;You will perish among the nations; the land of your enemies will devour you.";
csb[39] = "&quot;Those who survive in the lands of your enemies will waste away because of their iniquity; they will also waste away because of their fathers\' iniquities along with theirs.";
csb[40] = "&quot;But when they confess their iniquity and the iniquity of their fathers -- their unfaithfulness that they practiced against me, and how they acted with hostility toward me,";
csb[41] = "&quot;and I acted with hostility toward them and brought them into the land of their enemies -- and when their uncircumcised hearts are humbled and they make amends for their iniquity,";
csb[42] = "&quot;then I will remember my covenant with Jacob. I will also remember my covenant with Isaac and my covenant with Abraham, and I will remember the land.";
csb[43] = "&quot;For the land abandoned by them will make up for its Sabbaths by lying desolate without the people, while they make amends for their iniquity, because they rejected my ordinances and abhorred my statutes.";
csb[44] = "&quot;Yet in spite of this, while they are in the land of their enemies, I will not reject or abhor them so as to destroy them and break my covenant with them, since I am the LORD their God.";
csb[45] = "&quot;For their sake I will remember the covenant with their fathers, whom I brought out of the land of Egypt in the sight of the nations to be their God; I am the LORD.&quot;";
csb[46] = "These are the statutes, ordinances, and laws the LORD established between himself and the Israelites through Moses on Mount Sinai.";
</script>
