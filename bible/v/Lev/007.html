kjv[2] = "Speak unto the children of Israel, saying, He that offereth the sacrifice of his peace offerings unto the LORD shall bring his oblation unto the LORD of the sacrifice of his peace offerings.";
rsv[2] = "in the place where they kill the burnt offering they shall kill the guilt offering, and its blood shall be thrown on the altar round about.";

dby[2] = "in the place where they slaughter the burnt-offering shall they slaughter the trespass-offering; and the blood thereof shall he sprinkle on the altar round about.";
web[2] = "In the place where they kill the burnt-offering shall they kill the trespass-offering: and the blood of it shall he sprinkle around upon the altar.";

yng[3] = "and all its fat he bringeth near out of it, the fat tail, and the fat which is covering the inwards,";
dby[3] = "And he shall present of it all the fat thereof; the fat tail and the fat that covereth the inwards,";
web[3] = "And he shall offer of it all its fat; the rump, and the fat that covereth the inwards,";

rsv[4] = "the two kidneys with the fat that is on them at the loins, and the appendage of the liver which he shall take away with the kidneys;";
asv[4] = "and the two kidneys, and the fat that is on them, which is by the loins, and the caul upon the liver, with the kidneys, shall he take away;";
yng[4] = "and the two kidneys, and the fat which [is] on them, which [is] on the flanks, and the redundance above the liver (beside the kidneys he doth turn it aside);";
dby[4] = "and the two kidneys, and the fat that is on them, which is by the flanks, and the net above the liver, which he shall take away as far as the kidneys.";

kjv[5] = "And the right shoulder shall ye give unto the priest [for] an heave offering of the sacrifices of your peace offerings.";
rsv[5] = "the priest shall burn them on the altar as an offering by fire to the LORD; it is a guilt offering.";
asv[5] = "and the priest shall burn them upon the altar for an offering made by fire unto Jehovah: it is a trespass-offering.";
yng[5] = "and the priest hath made them a perfume on the altar, a fire-offering to Jehovah; it [is] a guilt-offering.";
dby[5] = "And the priest shall burn them on the altar, an offering by fire to Jehovah: it is a trespass-offering.";

kjv[6] = "He among the sons of Aaron, that offereth the blood of the peace offerings, and the fat, shall have the right shoulder for [his] part.";
rsv[6] = "Every male among the priests may eat of it; it shall be eaten in a holy place; it is most holy.";
asv[6] = "Every male among the priests shall eat thereof: it shall be eaten in a holy place: it is most holy.";
yng[6] = "`Every male among the priests doth eat it; in the holy place it is eaten -- it [is] most holy;";
dby[6] = "Every male among the priests shall eat thereof; in a holy place shall it be eaten: it is most holy.";
web[6] = "Every male among the priests shall eat of it: it shall be eaten in the holy place: it [is] most holy.";

vul[6] = "omnis masculus de sacerdotali genere in loco sancto vescetur his carnibus quia sanctum sanctorum est";
kjv[7] = "For the wave breast and the heave shoulder have I taken of the children of Israel from off the sacrifices of their peace offerings, and have given them unto Aaron the priest and unto his sons by a statute for ever from among the children of Israel.";
rsv[7] = "The guilt offering is like the sin offering, there is one law for them; the priest who makes atonement with it shall have it.";
asv[7] = "As is the sin-offering, so is the trespass-offering; there is one law for them: the priest that maketh atonement therewith, he shall have it.";
yng[7] = "as [is] a sin-offering, so [is] a guilt-offering; one law [is] for them; the priest who maketh atonement by it -- it is his.";
dby[7] = "As the sin-offering, so is the trespass-offering; [there shall] be one law for them: it shall be the priest\'s who maketh atonement therewith.";
web[7] = "As the sin-offering [is], so [is] the trespass-offering: [there is] one law for them: the priest that maketh atonement with it shall have [it].";
hnv[7] = "&quot;\'As is the sin offering, so is the trespass offering; there is one law for them. Ihe Kohen who makes atonement with them, he shall have it.";

kjv[8] = "This [is the portion] of the anointing of Aaron, and of the anointing of his sons, out of the offerings of the LORD made by fire, in the day [when] he presented them to minister unto the LORD in the priest\'s office;";
rsv[8] = "And the priest who offers any man\'s burnt offering shall have for himself the skin of the burnt offering which he has offered.";
asv[8] = "And the priest that offereth any man\'s burnt-offering, even the priest shall have to himself the skin of the burnt-offering which he hath offered.";
yng[8] = "`And the priest who is bringing near any man\'s burnt-offering, the skin of the burnt-offering which he hath brought near, it is the priest\'s, his own;";
dby[8] = "And [as to] the priest that presenteth any man\'s burnt-offering, the skin of the burnt-offering which he hath presented shall be the priest\'s for himself.";
web[8] = "And the priest that offereth any man\'s burnt-offering, [even] the priest shall have to himself the skin of the burnt-offering which he hath offered.";
hnv[8] = "The Kohen who offers any man\'s burnt offering, even the Kohen shall have for himself the skin of the burnt offering which he has offered.";

kjv[9] = "Which the LORD commanded to be given them of the children of Israel, in the day that he anointed them, [by] a statute for ever throughout their generations.";
rsv[9] = "And every cereal offering baked in the oven and all that is prepared on a pan or a griddle shall belong to the priest who offers it.";
asv[9] = "And every meal-offering that is baken in the oven, and all that is dressed in the frying-pan, and on the baking-pan, shall be the priest\'s that offereth it.";
yng[9] = "and every present which is baked in an oven, and every one done in a frying-pan, and on a girdel, [is] the priest\'s who is bringing it near; it is his;";
dby[9] = "And every oblation that is baken in the oven, and all that is prepared in the cauldron and in the pan, shall be the priest\'s who offereth it; to him it shall belong.";
web[9] = "And all the meat-offering that is baked in the oven, and all that is dressed in the frying-pan, and in the pan, shall be the priest\'s that offereth it.";
hnv[9] = "Every meal offering that is baked in the oven, and all that is dressed in the frying pan, and on the baking pan, shall be the Kohen\'s who offers it.";
vul[9] = "et omne sacrificium similae quod coquitur in clibano et quicquid in craticula vel in sartagine praeparatur eius erit sacerdotis a quo offertur";

rsv[10] = "And every cereal offering, mixed with oil or dry, shall be for all the sons of Aaron, one as well as another.";
asv[10] = "And every meal-offering, mingled with oil, or dry, shall all the sons of Aaron have, one as well as another.";
yng[10] = "and every present, mixed with oil or dry, is for all the sons of Aaron -- one as another.";
dby[10] = "And every oblation, mingled with oil, and dry, shall all the sons of Aaron have, one as the other.";
web[10] = "And every meat-offering mingled with oil, and dry, shall all the sons of Aaron have, one [as much] as another.";
hnv[10] = "Every meal offering, mixed with oil or dry, belongs to all the sons of Aharon, one as well as another.";

kjv[11] = "Which the LORD commanded Moses in mount Sinai, in the day that he commanded the children of Israel to offer their oblations unto the LORD, in the wilderness of Sinai.";

kjv[13] = "In the place where they kill the burnt offering shall they kill the trespass offering: and the blood thereof shall he sprinkle round about upon the altar.";
rsv[13] = "With the sacrifice of his peace offerings for thanksgiving he shall bring his offering with cakes of leavened bread.";

yng[13] = "besides the cakes, fermented bread he doth bring near [with] his offering, besides the sacrifice of thank-offering of his peace-offerings;";

hnv[13] = "With cakes of leavened bread he shall offer his offering with the sacrifice of his shalom offerings for thanksgiving.";

kjv[14] = "And he shall offer of it all the fat thereof; the rump, and the fat that covereth the inwards,";
rsv[14] = "And of such he shall offer one cake from each offering, as an offering to the LORD; it shall belong to the priest who throws the blood of the peace offerings.";

kjv[15] = "And the two kidneys, and the fat that [is] on them, which [is] by the flanks, and the caul [that is] above the liver, with the kidneys, it shall he take away:";

yng[15] = "as to the flesh of the sacrifice of the thank-offering of his peace-offerings, in the day of his offering it is eaten; he doth not leave of it till morning.";

hnv[15] = "The flesh of the sacrifice of his shalom offerings for thanksgiving shall be eaten on the day of his offering. He shall not leave any of it until the morning.";
vul[15] = "cuius carnes eadem comedentur die nec remanebit ex eis quicquam usque mane";
kjv[16] = "And the priest shall burn them upon the altar [for] an offering made by fire unto the LORD: it [is] a trespass offering.";
rsv[16] = "But if the sacrifice of his offering is a votive offering or a freewill offering, it shall be eaten on the day that he offers his sacrifice, and on the morrow what remains of it shall be eaten,";
asv[16] = "But if the sacrifice of his oblation be a vow, or a freewill-offering, it shall be eaten on the day that he offereth his sacrifice; and on the morrow that which remaineth of it shall be eaten:";
yng[16] = "`And if the sacrifice of his offering [is] a vow or free-will offering, in the day of his bringing near his sacrifice it is eaten; and on the morrow also the remnant of it is eaten;";
dby[16] = "And if the sacrifice of his offering be a vow, or voluntary, it shall be eaten the same day that he presented his sacrifice; on the morrow also the remainder of it shall be eaten;";
web[16] = "But if the sacrifice of his offering [shall be] a vow or a voluntary offering, it shall be eaten the same day that he offereth his sacrifice: and on the morrow also the remainder of it shall be eaten:";

kjv[18] = "As the sin offering [is], so [is] the trespass offering: [there is] one law for them: the priest that maketh atonement therewith shall have [it].";
rsv[18] = "If any of the flesh of the sacrifice of his peace offering is eaten on the third day, he who offers it shall not be accepted, neither shall it be credited to him; it shall be an abomination, and he who eats of it shall bear his iniquity.";
asv[18] = "And if any of the flesh of the sacrifice of his peace-offerings be eaten on the third day, it shall not be accepted, neither shall it be imputed unto him that offereth it: it shall be an abomination, and the soul that eateth of it shall bear his iniquity.";
yng[18] = "and if any of the flesh of the sacrifice of his peace-offerings be really eaten on the third day, it is not pleasing; for him who is bringing it near it is not reckoned; it is an abominable thing, and the person who is eating of it his iniquity doth bear.";
dby[18] = "And if [any] of the flesh of the sacrifice of his peace-offering be eaten at all on the third day, it shall not be accepted, it shall not be reckoned to him that hath presented it; it shall be an unclean thing, and the soul that eateth of it shall bear his iniquity.";
web[18] = "And if [any] of the flesh of the sacrifice of his peace-offerings shall be eaten at all on the third day, it shall not be accepted, neither shall it be imputed to him that offereth it; it shall be an abomination, and the soul that eateth of it shall bear his iniquity.";
hnv[18] = "If any of the flesh of the sacrifice of his shalom offerings is eaten on the third day, it will not be accepted, neither shall it be imputed to him who offers it. It will be an abomination, and the soul who eats any of it will bear his iniquity.";
vul[18] = "si quis de carnibus victimae pacificorum die tertio comederit irrita fiet oblatio nec proderit offerenti quin potius quaecumque anima tali se edulio contaminarit praevaricationis rea erit";

rsv[19] = "&quot;Flesh that touches any unclean thing shall not be eaten; it shall be burned with fire. All who are clean may eat flesh,";
asv[19] = "And the flesh that toucheth any unclean thing shall not be eaten; it shall be burnt with fire. And as for the flesh, every one that is clean shall eat thereof:";
yng[19] = "`And the flesh which cometh against any unclean thing is not eaten; with fire it is burnt; as to the flesh, every clean one doth eat of the flesh;";
dby[19] = "And the flesh that toucheth anything unclean shall not be eaten; it shall be burned with fire. And as to the flesh, all that are clean may eat [the] flesh.";
web[19] = "And the flesh that toucheth any unclean [thing] shall not be eaten; it shall be burnt with fire: and as for the flesh, all that shall be clean shall eat of it.";

asv[20] = "but the soul that eateth of the flesh of the sacrifice of peace-offerings, that pertain unto Jehovah, having his uncleanness upon him, that soul shall be cut off from his people.";
yng[20] = "and the person who eateth of the flesh of the sacrifice of the peace-offerings which [are] Jehovah\'s, and his uncleanness upon him, even that person hath been cut off from his people.";
dby[20] = "But the soul that eateth the flesh of the sacrifice of peace-offering which is for Jehovah, having his uncleanness upon him, that soul shall be cut off from his peoples.";
web[20] = "But the soul that eateth [of] the flesh of the sacrifice of peace-offerings that [pertain] to the LORD, having his uncleanness upon him, even that soul shall be cut off from his people.";
hnv[20] = "but the soul who eats of the flesh of the sacrifice of shalom offerings, that belongs to the LORD, having his uncleanness on him, that soul shall be cut off from his people.";

rsv[21] = "And if any one touches an unclean thing, whether the uncleanness of man or an unclean beast or any unclean abomination, and then eats of the flesh of the sacrifice of the LORD\'s peace offerings, that person shall be cut off from his people.&quot;";
asv[21] = "And when any one shall touch any unclean thing, the uncleanness of man, or an unclean beast, or any unclean abomination, and eat of the flesh of the sacrifice of peace-offerings, which pertain unto Jehovah, that soul shall be cut off from his people.";
yng[21] = "`And when a person cometh against any thing unclean, of the uncleanness of man, or of the uncleanness of beasts, or of any unclean teeming creature, and hath eaten of the flesh of the sacrifice of the peace-offerings which [are] Jehovah\'s, even that person hath been cut off from his people.\'";
dby[21] = "And if any one touch anything unclean, the uncleanness of man, or unclean beast, or any unclean abomination, and eat of the flesh of the sacrifice of peace-offering, which is for Jehovah, that soul shall be cut off from his peoples.";
web[21] = "Moreover, the soul that shall touch any unclean [thing], [as] the uncleanness of man, or [any] unclean beast, or any abominable unclean [thing], and eat of the flesh of the sacrifice of peace-offerings which [pertain] to the LORD, even that soul shall be cut off from his people.";
hnv[21] = " When anyone touches any unclean thing, the uncleanness of man, or an unclean animal, or any unclean abomination, and eats some of the flesh of the sacrifice of shalom offerings, which belong to the LORD, that soul shall be cut off from his people.\'&quot;";

csb[1] = "&quot;Now this is the law of the guilt offering; it is especially holy.";
csb[2] = "&quot;The guilt offering is to be slaughtered at the place where the burnt offering is slaughtered, and the priest is to splatter its blood on all sides of the altar.";
csb[3] = "&quot;The offerer is to present all the fat from it: the fat tail, the fat surrounding the entrails,";
csb[4] = "&quot;and the two kidneys with the fat on them at the loins; he will also remove the fatty lobe of the liver with the kidneys.";
csb[5] = "&quot;The priest will burn them on the altar as a fire offering to the LORD; it is a guilt offering.";
csb[6] = "&quot;Any male among the priests may eat it. It is to be eaten in a holy place; it is especially holy.";
csb[7] = "&quot;The guilt offering is like the sin offering; the law is the same for both. It belongs to the priest who makes atonement with it.";
csb[8] = "&quot;As for the priest who presents someone\'s burnt offering, the hide of the burnt offering he has presented belongs to him; it is the priest\'s.";
csb[9] = "&quot;Any grain offering that is baked in an oven or prepared in a pan or on a griddle belongs to the priest who presents it; it is his.";
csb[10] = "&quot;But any grain offering, whether dry or mixed with oil, belongs equally to all of Aaron\'s sons.";
csb[11] = "&quot;Now this is the law of the fellowship sacrifice that someone may present to the LORD:";
csb[12] = "&quot;If he presents it for thanksgiving, in addition to the thanksgiving sacrifice, he is to present unleavened cakes mixed with olive oil, unleavened wafers coated with oil, and well-kneaded cakes of fine flour mixed with oil.";
csb[13] = "&quot;He is to present as his offering cakes of leavened bread with his thanksgiving sacrifice of fellowship.";
csb[14] = "&quot;From the cakes he is to present one portion of each offering as a contribution to the LORD. It will belong to the priest who splatters the blood of the fellowship offering; it is his.";
csb[15] = "&quot;The meat of his thanksgiving sacrifice of fellowship must be eaten on the day he offers it; he may not leave any of it until morning.";
csb[16] = "&quot;If the sacrifice he offers is a vow or a freewill offering, it is to be eaten on the day he presents his sacrifice, and what is left over may be eaten on the next day.";
csb[17] = "&quot;But what remains of the sacrificial meat by the third day must be burned.";
csb[18] = "&quot;If any of the meat of his fellowship sacrifice is eaten on the third day, it will not be accepted. It will not be credited to the one who presents it; it is repulsive. The person who eats any of it will bear his iniquity.";
csb[19] = "&quot;Meat that touches anything unclean must not be eaten; it is to be burned. Everyone who is clean may eat any other meat.";
csb[20] = "&quot;But the one who eats meat from the LORD\'s fellowship sacrifice while he is unclean, that person must be cut off from his people.";
csb[21] = "&quot;If someone touches anything unclean, whether human uncleanness, an unclean animal, or any unclean, abhorrent creature, and eats meat from the LORD\'s fellowship sacrifice, that person is to be cut off from his people.&quot;";
csb[22] = "The LORD spoke to Moses:";
csb[23] = "&quot;Tell the Israelites: You are not to eat any fat of an ox, a sheep, or a goat.";
csb[24] = "&quot;The fat of an animal that dies naturally or is mauled by wild beasts may be used for any other purpose, but you must not eat it.";
csb[25] = "&quot;If anyone eats animal fat from a fire offering presented to the LORD, the person who eats it is to be cut off from his people.";
csb[26] = "&quot;Wherever you live, you must not eat the blood of any bird or animal.";
csb[27] = "&quot;Whoever eats any blood is to be cut off from his people.&quot;";
csb[28] = "The LORD spoke to Moses:";
csb[29] = "&quot;Tell the Israelites: The one who presents a fellowship sacrifice to the LORD is to bring an offering to the LORD from his sacrifice.";
csb[30] = "&quot;His own hands will bring the fire offerings to the LORD. He will bring the fat together with the breast. The breast is to be presented as a presentation offering before the LORD.";
csb[31] = "&quot;The priest is to burn the fat on the altar, but the breast belongs to Aaron and his sons.";
csb[32] = "&quot;You are to give the right thigh to the priest as a contribution from your fellowship sacrifices.";
csb[33] = "&quot;The son of Aaron who presents the blood of the fellowship offering and the fat will have the right thigh as a portion.";
csb[34] = "&quot;I have taken from the Israelites the breast of the presentation offering and the thigh of the contribution from their fellowship sacrifices, and have assigned them to the priest Aaron and to his sons as a permanent portion from the Israelites.&quot;";
csb[35] = "This is the portion from the fire offerings to the LORD for Aaron and his sons since the day they were presented to serve the LORD as priests.";
csb[36] = "The LORD commanded this to be given to them by the Israelites on the day he anointed them. It is a permanent portion throughout their generations.";
csb[37] = "This is the law for the burnt offering, the grain offering, the sin offering, the guilt offering, the ordination offering, and the fellowship sacrifice,";
csb[38] = "which the LORD commanded Moses on Mount Sinai on the day he commanded the Israelites to present their offerings to the LORD in the Wilderness of Sinai.";
kjv[1] = "Likewise this [is] the law of the trespass offering: it [is] most holy.";
kjv[2] = "In the place where they kill the burnt offering shall they kill the trespass offering: and the blood thereof shall he sprinkle round about upon the altar.";
kjv[3] = "And he shall offer of it all the fat thereof; the rump, and the fat that covereth the inwards,";
kjv[4] = "And the two kidneys, and the fat that [is] on them, which [is] by the flanks, and the caul [that is] above the liver, with the kidneys, it shall he take away:";
kjv[5] = "And the priest shall burn them upon the altar [for] an offering made by fire unto the LORD: it [is] a trespass offering.";
kjv[6] = "Every male among the priests shall eat thereof: it shall be eaten in the holy place: it [is] most holy.";
kjv[7] = "As the sin offering [is], so [is] the trespass offering: [there is] one law for them: the priest that maketh atonement therewith shall have [it].";
kjv[8] = "And the priest that offereth any man\'s burnt offering, [even] the priest shall have to himself the skin of the burnt offering which he hath offered.";
kjv[9] = "And all the meat offering that is baken in the oven, and all that is dressed in the fryingpan, and in the pan, shall be the priest\'s that offereth it.";
kjv[10] = "And every meat offering, mingled with oil, and dry, shall all the sons of Aaron have, one [as much] as another.";
kjv[11] = "And this [is] the law of the sacrifice of peace offerings, which he shall offer unto the LORD.";
kjv[12] = "If he offer it for a thanksgiving, then he shall offer with the sacrifice of thanksgiving unleavened cakes mingled with oil, and unleavened wafers anointed with oil, and cakes mingled with oil, of fine flour, fried.";
kjv[13] = "Besides the cakes, he shall offer [for] his offering leavened bread with the sacrifice of thanksgiving of his peace offerings.";
kjv[14] = "And of it he shall offer one out of the whole oblation [for] an heave offering unto the LORD, [and] it shall be the priest\'s that sprinkleth the blood of the peace offerings.";
kjv[15] = "And the flesh of the sacrifice of his peace offerings for thanksgiving shall be eaten the same day that it is offered; he shall not leave any of it until the morning.";
kjv[16] = "But if the sacrifice of his offering [be] a vow, or a voluntary offering, it shall be eaten the same day that he offereth his sacrifice: and on the morrow also the remainder of it shall be eaten:";
kjv[17] = "But the remainder of the flesh of the sacrifice on the third day shall be burnt with fire.";
kjv[18] = "And if [any] of the flesh of the sacrifice of his peace offerings be eaten at all on the third day, it shall not be accepted, neither shall it be imputed unto him that offereth it: it shall be an abomination, and the soul that eateth of it shall bear his iniquity.";
kjv[19] = "And the flesh that toucheth any unclean [thing] shall not be eaten; it shall be burnt with fire: and as for the flesh, all that be clean shall eat thereof.";
kjv[20] = "But the soul that eateth [of] the flesh of the sacrifice of peace offerings, that [pertain] unto the LORD, having his uncleanness upon him, even that soul shall be cut off from his people.";
kjv[21] = "Moreover the soul that shall touch any unclean [thing, as] the uncleanness of man, or [any] unclean beast, or any abominable unclean [thing], and eat of the flesh of the sacrifice of peace offerings, which [pertain] unto the LORD, even that soul shall be cut off from his people.";

kjv[25] = "For whosoever eateth the fat of the beast, of which men offer an offering made by fire unto the LORD, even the soul that eateth [it] shall be cut off from his people.";

kjv[27] = "Whatsoever soul [it be] that eateth any manner of blood, even that soul shall be cut off from his people.";
kjv[28] = "And the LORD spake unto Moses, saying,";
kjv[29] = "Speak unto the children of Israel, saying, He that offereth the sacrifice of his peace offerings unto the LORD shall bring his oblation unto the LORD of the sacrifice of his peace offerings.";
kjv[30] = "His own hands shall bring the offerings of the LORD made by fire, the fat with the breast, it shall he bring, that the breast may be waved [for] a wave offering before the LORD.";
kjv[31] = "And the priest shall burn the fat upon the altar: but the breast shall be Aaron\'s and his sons\'.";
kjv[32] = "And the right shoulder shall ye give unto the priest [for] an heave offering of the sacrifices of your peace offerings.";
kjv[33] = "He among the sons of Aaron, that offereth the blood of the peace offerings, and the fat, shall have the right shoulder for [his] part.";
kjv[34] = "For the wave breast and the heave shoulder have I taken of the children of Israel from off the sacrifices of their peace offerings, and have given them unto Aaron the priest and unto his sons by a statute for ever from among the children of Israel.";
kjv[35] = "This [is the portion] of the anointing of Aaron, and of the anointing of his sons, out of the offerings of the LORD made by fire, in the day [when] he presented them to minister unto the LORD in the priest\'s office;";
kjv[36] = "Which the LORD commanded to be given them of the children of Israel, in the day that he anointed them, [by] a statute for ever throughout their generations.";
kjv[37] = "This [is] the law of the burnt offering, of the meat offering, and of the sin offering, and of the trespass offering, and of the consecrations, and of the sacrifice of the peace offerings;";
kjv[38] = "Which the LORD commanded Moses in mount Sinai, in the day that he commanded the children of Israel to offer their oblations unto the LORD, in the wilderness of Sinai.";
