csb[1] = "&quot;When anyone presents a grain offering as an offering to the LORD, it is to consist of fine flour. He is to pour olive oil on it, put frankincense on it,";
csb[2] = "&quot;and bring it to Aaron\'s sons the priests. The priest will take a handful of fine flour and oil from it, along with all its frankincense, and will burn this memorial portion of it on the altar, a fire offering of a pleasing aroma to the LORD.";
csb[3] = "&quot;But the rest of the grain offering will belong to Aaron and his sons; it is the holiest part of the fire offerings to the LORD.";
csb[4] = "&quot;When you present a grain offering baked in an oven, it is to be made of fine flour, either unleavened cakes mixed with oil or unleavened wafers coated with oil.";
csb[5] = "&quot;If your offering is a grain offering prepared on a griddle, it is to be unleavened bread made of fine flour mixed with oil.";
csb[6] = "&quot;Break it into pieces and pour oil on it; it is a grain offering.";
csb[7] = "&quot;If your offering is a grain offering prepared in a pan, it is to be made of fine flour with oil.";
csb[8] = "&quot;When you bring to the LORD the grain offering made in any of these ways, it is to be presented to the priest, and he will take it to the altar.";
csb[9] = "&quot;The priest will remove the memorial portion from the grain offering and burn it on the altar, a fire offering of a pleasing aroma to the LORD.";
csb[10] = "&quot;But the rest of the grain offering will belong to Aaron and his sons; it is the holiest part of the fire offerings to the LORD.";
csb[11] = "&quot;No grain offering that you present to the LORD is to be made with yeast, for you are not to burn any yeast or honey as a fire offering to the LORD.";
csb[12] = "&quot;You may present them to the LORD as an offering of firstfruits, but they are not to be offered on the altar as a pleasing aroma.";
csb[13] = "&quot;You are to season each of your grain offerings with salt; you must not omit from your grain offering the salt of the covenant with your God. You are to present salt with each of your offerings.";
csb[14] = "&quot;If you present a grain offering of firstfruits to the LORD, you are to present fresh heads of grain, crushed kernels, roasted on the fire, for your grain offering of firstfruits.";
csb[15] = "&quot;You are to put oil and frankincense on it; it is a grain offering.";
csb[16] = "&quot;The priest will then burn some of its crushed kernels and oil with all its frankincense as a fire offering to the LORD.";
