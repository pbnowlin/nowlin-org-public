asv[24] = "And if any man lie with her, and her impurity be upon him, he shall be unclean seven days; and every bed whereon he lieth shall be unclean.";
yng[24] = "`And if a man really lie with her, and her separation is on him, then he hath been unclean seven days, and all the bed on which he lieth is unclean.";
dby[24] = "And if a man lie with her at all, and the uncleanness of her separation come upon him, he shall be unclean seven days; and every bed whereon he lieth shall be unclean.";
web[24] = "And if any man shall lie with her at all, and her flowers be upon him, he shall be unclean seven days: and all the bed on which he lieth shall be unclean.";

kjv[25] = "And if a woman have an issue of her blood many days out of the time of her separation, or if it run beyond the time of her separation; all the days of the issue of her uncleanness shall be as the days of her separation: she [shall be] unclean.";
rsv[25] = "&quot;If a woman has a discharge of blood for many days, not at the time of her impurity, or if she has a discharge beyond the time of her impurity, all the days of the discharge she shall continue in uncleanness; as in the days of her impurity, she shall be unclean.";
asv[25] = "And if a woman have an issue of her blood many days not in the time of her impurity, or if she have an issue beyond the time of her impurity; all the days of the issue of her uncleanness she shall be as in the days of her impurity: she is unclean.";
yng[25] = "`And when a woman\'s issue of blood floweth many days within the time of her separation, or when it floweth over her separation -- all the days of the issue of her uncleanness are as the days of her separation; she [is] unclean.";
dby[25] = "And if a woman have her flux of blood many days out of the time of her separation, or if she have the flux beyond the time of her separation, all the days of the flux of her uncleanness shall she be as [in] the days of her separation: she is unclean.";
web[25] = "And if a woman shall have an issue of her blood many days out of the time of her separation, or if it shall run beyond the time of her separation; all the days of the issue of her uncleanness shall be as the days of her separation: she [shall be] unclean.";
hnv[25] = "&quot;\'If a woman has a discharge of her blood many days not in the time of her period, or if she has a discharge beyond the time of her period; all the days of the discharge of her uncleanness shall be as in the days of her period: she is unclean.";
vul[25] = "mulier quae patitur multis diebus fluxum sanguinis non in tempore menstruali vel quae post menstruum sanguinem fluere non cessat quamdiu huic subiacet passioni inmunda erit quasi sit in tempore menstruo";
kjv[26] = "Every bed whereon she lieth all the days of her issue shall be unto her as the bed of her separation: and whatsoever she sitteth upon shall be unclean, as the uncleanness of her separation.";
rsv[26] = "Every bed on which she lies, all the days of her discharge, shall be to her as the bed of her impurity; and everything on which she sits shall be unclean, as in the uncleanness of her impurity.";
asv[26] = "Every bed whereon she lieth all the days of her issue shall be unto her as the bed of her impurity: and everything whereon she sitteth shall be unclean, as the uncleanness of her impurity.";
yng[26] = "`All the bed on which she lieth all the days of her issue is as the bed of her separation to her, and all the vessel on which she sitteth is unclean as the uncleanness of her separation;";
dby[26] = "Every bed whereon she lieth all the days of her flux shall be unto her as the bed of her separation; and every object on which she sitteth shall be unclean, according to the uncleanness of her separation.";

hnv[26] = "Every bed whereon she lies all the days of her discharge shall be to her as the bed of her period: and everything whereon she sits shall be unclean, as the uncleanness of her period.";

asv[27] = "And whosoever toucheth those things shall be unclean, and shall wash his clothes, and bathe himself in water, and be unclean until the even.";

web[27] = "And whoever toucheth those things shall be unclean, and shall wash his clothes, and bathe [himself] in water, and be unclean until the evening.";
hnv[27] = "Whoever touches these things shall be unclean, and shall wash his clothes, and bathe himself in water, and be unclean until the evening.";

asv[28] = "But if she be cleansed of her issue, then she shall number to herself seven days, and after that she shall be clean.";
yng[28] = "`And if she hath been clean from her issue, then she hath numbered to herself seven days, and afterwards she is clean;";
dby[28] = "And if she be cleansed of her flux then she shall count seven days, and after that she shall be clean.";
web[28] = "But if she shall be cleansed of her issue, then she shall number to herself seven days, and after that she shall be clean.";
hnv[28] = "&quot;\'But if she is cleansed of her discharge, then she shall count to herself seven days, and after that she shall be clean.";

kjv[29] = "And on the eighth day she shall take unto her two turtles, or two young pigeons, and bring them unto the priest, to the door of the tabernacle of the congregation.";
rsv[29] = "And on the eighth day she shall take two turtledoves or two young pigeons, and bring them to the priest, to the door of the tent of meeting.";
asv[29] = "And on the eighth day she shall take unto her two turtle-doves, or two young pigeons, and bring them unto the priest, to the door of the tent of meeting.";
yng[29] = "and on the eighth day she taketh to herself two turtle-doves, or two young pigeons, and hath brought them in unto the priest, unto the opening of the tent of meeting;";

web[29] = "And on the eighth day she shall take to her two turtles, or two young pigeons, and bring them to the priest, to the door of the tabernacle of the congregation.";

asv[30] = "And the priest shall offer the one for a sin-offering, and the other for a burnt-offering; and the priest shall make atonement for her before Jehovah for the issue of her uncleanness.";
yng[30] = "and the priest hath made the one a sin-offering, and the one a burnt-offering, and the priest hath made atonement for her before Jehovah, because of the issue of her uncleanness.";
dby[30] = "And the priest shall offer the one as a sin-offering, and the other as a burnt-offering; and the priest shall make atonement for her before Jehovah for the flux of her uncleanness.";
web[30] = "And the priest shall offer the one [for] a sin-offering, and the other [for] a burnt-offering; and the priest shall make an atonement for her before the LORD for the issue of her uncleanness.";
hnv[30] = "The Kohen shall offer the one for a sin offering, and the other for a burnt offering; and the Kohen shall make atonement for her before the LORD for the uncleanness of her discharge.";

yng[31] = "`And ye have separated the sons of Israel from their uncleanness, and they die not in their uncleanness, in their defiling My tabernacle which [is] in their midst.";
dby[31] = "And ye shall separate the children of Israel from their uncleanness, that they die not in their uncleanness, when they defile my tabernacle that is in their midst.";
web[31] = "Thus shall ye separate the children of Israel from their uncleanness: that they die not in their uncleanness, when they defile my tabernacle that [is] among them.";
hnv[31] = "&quot;\'Thus you shall separate the children of Yisra\'el from their uncleanness, so they will not die in their uncleanness, when they defile my tabernacle that is in their midst.\'&quot;";

yng[32] = "`This [is] the law of him who hath an issue, and of him whose seed of copulation goeth out from him, for uncleanness thereby,";

hnv[32] = "This is the law of him who has a discharge, and of him who has an emission of semen, so that he is unclean thereby;";

rsv[33] = "also for her who is sick with her impurity; that is, for any one, male or female, who has a discharge, and for the man who lies with a woman who is unclean.";
asv[33] = "and of her that is sick with her impurity, and of him that hath an issue, of the man, and of the woman, and of him that lieth with her that is unclean.";
yng[33] = "and of her who is sick in her separation, and of him who hath an issue, the issue of a male or of a female, and of a man who lieth with an unclean woman.\'";
dby[33] = "and for a woman who is sick in her separation, and for him that hath his flux; for the man and for the woman, and for him that lieth with her that is unclean.";
web[33] = "And of her that is sick of her flowers, and of him that hath an issue, of the man and of the woman, and of him that lieth with her that is unclean.";
hnv[33] = "and of her who has her period, and of a man or woman who has a discharge, and of him who lies with her who is unclean.";

csb[1] = "The LORD spoke to Moses and Aaron:";
csb[2] = "&quot;Speak to the Israelites and tell them: When any man has a discharge from his member, he is unclean.";
csb[3] = "&quot;This is uncleanness of his discharge: Whether his member secretes the discharge or retains it, he is unclean. All the days that his member secretes or retains anything because of his discharge, he is unclean.";
csb[4] = "&quot;Any bed the man with the discharge lies on will be unclean, and any furniture he sits on will be unclean.";
csb[5] = "&quot;Anyone who touches his bed is to wash his clothes and bathe with water, and he will remain unclean until evening.";
csb[6] = "&quot;Whoever sits on furniture that the man with the discharge was sitting on is to wash his clothes and bathe with water, and he will remain unclean until evening.";
csb[7] = "&quot;Whoever touches the body of the man with a discharge is to wash his clothes and bathe with water, and he will remain unclean until evening.";
csb[8] = "&quot;If the man with the discharge spits on anyone who is clean, he is to wash his clothes and bathe with water, and he will remain unclean until evening.";
csb[9] = "&quot;Any saddle the man with the discharge rides on will be unclean.";
csb[10] = "&quot;Whoever touches anything that was under him will be unclean until evening, and whoever carries such things is to wash his clothes and bathe with water, and he will remain unclean until evening.";
csb[11] = "&quot;If the man with the discharge touches anyone without first rinsing his hands in water, the person who was touched is to wash his clothes and bathe with water, and he will remain unclean until evening.";
csb[12] = "&quot;Any clay pot that the man with the discharge touches must be broken, while any wooden utensil is to be rinsed with water.";
csb[13] = "&quot;When the man with the discharge has been cured of it, he is to count seven days for his cleansing, wash his clothes, and bathe his body in fresh water; he will be clean.";
csb[14] = "&quot;He must take two turtledoves or two young pigeons on the eighth day, come before the LORD at the entrance to the tent of meeting, and give them to the priest.";
csb[15] = "&quot;The priest is to sacrifice them, one as a sin offering and the other as a burnt offering. In this way the priest will make atonement for him before the LORD because of his discharge.";
csb[16] = "&quot;When a man has an emission of semen, he is to bathe himself completely with water, and he will remain unclean until evening.";
csb[17] = "&quot;Any clothing or leather on which there is an emission of semen is to be washed with water, and it will remain unclean until evening.";
csb[18] = "&quot;If a man sleeps with a woman and has an emission of semen, both of them are to bathe with water, and they will remain unclean until evening.";
csb[19] = "&quot;When a woman has a discharge, and it consists of blood from her body, she will be unclean because of her menstruation for seven days. Everyone who touches her will be unclean until evening.";
csb[20] = "&quot;Anything she lies on during her menstruation will become unclean, and anything she sits on will become unclean.";
csb[21] = "&quot;Everyone who touches her bed is to wash his clothes and bathe with water, and he will remain unclean until evening.";
csb[22] = "&quot;Everyone who touches any furniture she was sitting on is to wash his clothes and bathe with water, and he will remain unclean until evening.";
csb[23] = "&quot;If discharge is on the bed or the furniture she was sitting on, when he touches it he will be unclean until evening.";
csb[24] = "&quot;If a man sleeps with her, and blood from her menstruation gets on him, he will be unclean for seven days, and every bed he lies on will become unclean.";
csb[25] = "&quot;When a woman has a discharge of her blood for many days, though it is not the time of her menstruation, or if she has a discharge beyond her period, she will be unclean all the days of her unclean discharge, as she is during the days of her menstruation.";
csb[26] = "&quot;Any bed she lies on during the days of her discharge will be like her bed during menstrual impurity; any furniture she sits on will be unclean as in her menstrual period.";
csb[27] = "&quot;Everyone who touches them will be unclean; he must wash his clothes and bathe with water, and he will remain unclean until evening.";
csb[28] = "&quot;When she is cured of her discharge, she is to count seven days, and after that she will be clean.";
csb[29] = "&quot;On the eighth day she must take two turtledoves or two young pigeons and bring them to the priest at the entrance to the tent of meeting.";
csb[30] = "&quot;The priest is to sacrifice one as a sin offering and the other as a burnt offering. In this way the priest will make atonement for her before the LORD because of her unclean discharge.";
csb[31] = "&quot;You must keep the Israelites from their uncleanness, so that they do not die by defiling my tabernacle that is among them.";
csb[32] = "&quot;This is the law for someone with a discharge: a man who has an emission of semen, becoming unclean by it;";
csb[33] = "&quot;a woman who is in her menstrual period; anyone who has a discharge, whether male or female; and a man who sleeps with a woman who is unclean.&quot;";
