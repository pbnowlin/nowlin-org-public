asv[26] = "Ye therefore shall keep my statutes and mine ordinances, and shall not do any of these abominations; neither the home-born, nor the stranger that sojourneth among you";
yng[26] = "and ye -- ye have kept My statutes and My judgments, and do not [any] of all these abominations, the native and the sojourner who is sojourning in your midst,";
dby[26] = "But *ye* shall observe my statutes and my judgments, and shall not commit any of all these abominations: the home-born, and the stranger that sojourneth among you;";
web[26] = "Ye shall therefore keep my statutes and my judgments, and shall not commit [any] of these abominations; [neither] any of your own nation, nor any stranger that sojourneth among you.";
hnv[26] = "You therefore shall keep my statutes and my ordinances, and shall not do any of these abominations; neither the native-born, nor the stranger who lives as a foreigner among you;";
vul[26] = "custodite legitima mea atque iudicia et non faciat ex omnibus abominationibus istis tam indigena quam colonus qui peregrinatur apud vos";
kjv[27] = "(For all these abominations have the men of the land done, which [were] before you, and the land is defiled;)";
rsv[27] = "(for all of these abominations the men of the land did, who were before you, so that the land became defiled);";
asv[27] = "(for all these abominations have the men of the land done, that were before you, and the land is defiled);";
yng[27] = "(for all these abominations have the men of the land done who [are] before you, and the land is defiled),";
dby[27] = "(for all these abominations have the men of the land done, who were before you, and the land hath been made unclean);";
web[27] = "(For all these abominations have the men of the land done, who [were] before you, and the land is defiled;)";
hnv[27] = "(for all these abominations have the men of the land done, that were before you, and the land became defiled);";
vul[27] = "omnes enim execrationes istas fecerunt accolae terrae qui fuerunt ante vos et polluerunt eam";
kjv[28] = "That the land spue not you out also, when ye defile it, as it spued out the nations that [were] before you.";
rsv[28] = "lest the land vomit you out, when you defile it, as it vomited out the nation that was before you.";
asv[28] = "that the land vomit not you out also, when ye defile it, as it vomited out the nation that was before you.";
yng[28] = "and the land doth not vomit you out in your defiling it, as it hath vomited out the nation which [is] before you;";
dby[28] = "that the land vomit you not out, when ye make it unclean, as it vomited out the nation that was before you.";
web[28] = "That the land may not vomit you out also, when ye defile it, as it vomited out the nations that [were] before you.";
hnv[28] = "that the land not vomit you out also, when you defile it, as it vomited out the nation that was before you.";

rsv[29] = "For whoever shall do any of these abominations, the persons that do them shall be cut off from among their people.";
asv[29] = "For whosoever shall do any of these abominations, even the souls that do them shall be cut off from among their people.";
yng[29] = "for any one who doth [any] of all these abominations -- even the persons who are doing [so], have been cut off from the midst of their people;";
dby[29] = "For whoever committeth any of these abominations, ... the souls that commit them shall be cut off from among their people.";
web[29] = "For whoever shall commit any of these abominations, even the souls that commit [them] shall be cut off from among their people.";

kjv[30] = "Therefore shall ye keep mine ordinance, that [ye] commit not [any one] of these abominable customs, which were committed before you, and that ye defile not yourselves therein: I [am] the LORD your God.";
rsv[30] = "So keep my charge never to practice any of these abominable customs which were practiced before you, and never to defile yourselves by them: I am the LORD your God.&quot;";
asv[30] = "Therefore shall ye keep my charge, that ye practise not any of these abominable customs, which were practised before you, and that ye defile not yourselves therein: I am Jehovah your God.";
yng[30] = "and ye have kept My charge, so as not to do [any] of the abominable statutes which have been done before you, and ye do not defile yourselves with them; I [am] Jehovah your God.\'";
dby[30] = "And ye shall observe my charge, that ye commit not [any] of the abominable customs which were committed before you; and ye shall not make yourselves unclean therein: I am Jehovah your God.";
web[30] = "Therefore shall ye keep my ordinance, that [ye] commit not [any one] of these abominable customs, which were committed before you, and that ye defile not yourselves in them; I [am] the LORD your God.";
hnv[30] = " Therefore you shall keep my charge, that you do not practice any of these abominable customs, which were practiced before you, and that you do not defile yourselves with them: I am the LORD your God.\'&quot;";

csb[1] = "The LORD spoke to Moses:";
csb[2] = "&quot;Speak to the Israelites and tell them: I am the LORD your God.";
csb[3] = "&quot;Do not follow the practices of the land of Egypt, where you used to live, or follow the practices of the land of Canaan, where I am bringing you. You must not follow their customs.";
csb[4] = "&quot;You are to practice my ordinances and you are to keep my statutes by following them; I am the LORD your God.";
csb[5] = "&quot;Keep my statutes and ordinances; a person will live if he does them. I am the LORD.";
csb[6] = "&quot;You are not to come near any close relative for sexual intercourse; I am the LORD.";
csb[7] = "&quot;You are not to violate the intimacy that belongs to your father and mother. She is your mother; you must not have sexual intercourse with her.";
csb[8] = "&quot;You are not to have sex with your father\'s wife; she is your father\'s family.";
csb[9] = "&quot;You are not to have sexual intercourse with your sister, either your father\'s daughter or your mother\'s, whether born at home or born elsewhere. You are not to have sex with her.";
csb[10] = "&quot;You are not to have sexual intercourse with your son\'s daughter or your daughter\'s daughter, for they are your family.";
csb[11] = "&quot;You are not to have sexual intercourse with your father\'s wife\'s daughter, who is adopted by your father; she is your sister.";
csb[12] = "&quot;You are not to have sexual intercourse with your father\'s sister; she is your father\'s close relative.";
csb[13] = "&quot;You are not to have sexual intercourse with your mother\'s sister, for she is your mother\'s close relative.";
csb[14] = "&quot;You are not to violate the intimacy that belongs to your father\'s brother by approaching his wife to have sexual intercourse; she is your aunt.";
csb[15] = "&quot;You are not to have sexual intercourse with your daughter-in-law. She is your son\'s wife; you are not to have sex with her.";
csb[16] = "&quot;You are not to have sexual intercourse with your brother\'s wife; she is your brother\'s family.";
csb[17] = "&quot;You are not to have sexual intercourse with a woman and her daughter. You are not to marry her son\'s daughter or her daughter\'s daughter and have sex with her. They are close relatives; it is depraved.";
csb[18] = "&quot;You are not to marry a woman as a rival to her sister and have sexual intercourse with her during her sister\'s lifetime.";
csb[19] = "&quot;You are not to approach a woman during her menstrual impurity to have sexual intercourse with her.";
csb[20] = "&quot;You are not to have sexual intercourse with your neighbor\'s wife, defiling yourself with her.";
csb[21] = "&quot;You are not to sacrifice any of your children in the fire to Molech. Do not profane the name of your God; I am the LORD.";
csb[22] = "&quot;You are not to sleep with a man as with a woman; it is detestable.";
csb[23] = "&quot;You are not to have sexual intercourse with any animal, defiling yourself with it; a woman is not to present herself to an animal to mate with it; it is a perversion.";
csb[24] = "&quot;Do not defile yourselves by any of these practices, for the nations I am driving out before you have defiled themselves by all these things.";
csb[25] = "&quot;The land has become defiled, so I am punishing it for its iniquity, and the land will vomit out its inhabitants.";
csb[26] = "&quot;But you are to keep my statutes and ordinances. You must not commit any of these detestable acts -- not the native or the alien who resides among you.";
csb[27] = "&quot;For the people who were in the land prior to you have committed all these detestable acts, and the land has become defiled.";
csb[28] = "&quot;If you defile the land, it will vomit you out as it has vomited out the nations that were before you.";
csb[29] = "&quot;Any person who does any of these detestable practices is to be cut off from his people.";
csb[30] = "&quot;You must keep my instruction to not do any of the detestable customs that were practiced before you, so that you do not defile yourselves by them; I am the LORD your God.&quot;";
