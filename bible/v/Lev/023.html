csb[6] = "&quot;The Festival of Unleavened Bread to the LORD is on the fifteenth day of the same month. For seven days you must eat unleavened bread.";
csb[7] = "&quot;On the first day you are to hold a sacred assembly; you are not to do any daily work.";
csb[8] = "&quot;You are to present a fire offering to the LORD for seven days. On the seventh day there will be a sacred assembly; do not do any daily work.&quot;";
csb[9] = "The LORD spoke to Moses:";
csb[10] = "&quot;Speak to the Israelites and tell them: When you enter the land I am giving you and reap its harvest, you are to bring the first sheaf of your harvest to the priest.";
csb[11] = "&quot;He will present the sheaf before the LORD so that you may be accepted; the priest is to present it on the day after the Sabbath.";
csb[12] = "&quot;On the day you present the sheaf, you are to offer a year-old male lamb without blemish as a burnt offering to the LORD.";
csb[13] = "&quot;Its grain offering is to be four quarts of fine flour mixed with oil as a fire offering to the LORD, a pleasing aroma, and its drink offering will be one quart of wine.";
csb[14] = "&quot;You must not eat bread, roasted grain, or any new grain until this very day, and until you have brought the offering to your God. This is to be a permanent statute throughout your generations wherever you live.";
csb[15] = "&quot;You are to count seven complete weeks starting from the day after the Sabbath, the day you brought the sheaf of the presentation offering.";
csb[16] = "&quot;You are to count fifty days until the day after the seventh Sabbath and then present an offering of new grain to the LORD.";
csb[17] = "&quot;Bring two loaves of bread from your settlements as a presentation offering, each of them made from four quarts of fine flour, baked with yeast, as firstfruits to the LORD.";
csb[18] = "&quot;You are to present with the bread seven unblemished male lambs a year old, one young bull, and two rams. They will be a burnt offering to the LORD, with their grain offerings and drink offerings, a fire offering of a pleasing aroma to the LORD.";
csb[19] = "&quot;You are also to prepare one male goat as a sin offering, and two male lambs a year old as a fellowship sacrifice.";
csb[20] = "&quot;The priest will present the lambs with the bread of firstfruits as a presentation offering before the LORD; the bread and the two lambs will be holy to the LORD for the priest.";
csb[21] = "&quot;On that same day you are to make a proclamation and hold a sacred assembly. You are not to do any daily work. This is to be a permanent statute wherever you live throughout your generations.";
csb[22] = "&quot;When you reap the harvest of your land, you are not to reap all the way to the edge of your field or gather the gleanings of your harvest. Leave them for the poor and the resident alien; I am the LORD your God.&quot;";
csb[23] = "The LORD spoke to Moses:";
csb[24] = "&quot;Tell the Israelites: In the seventh month, on the first day of the month, you are to have a day of complete rest, commemoration, and trumpet blasts -- a sacred assembly.";
csb[25] = "&quot;You must not do any daily work, but you must present a fire offering to the LORD.&quot;";
csb[26] = "The LORD again spoke to Moses:";
csb[27] = "&quot;The tenth day of this seventh month is the Day of Atonement. You are to hold a sacred assembly and practice self-denial; you are to present a fire offering to the LORD.";
csb[28] = "&quot;On this particular day you are not to do any work, for it is a Day of Atonement to make atonement for yourselves before the LORD your God.";
csb[29] = "&quot;If any person does not practice self-denial on this particular day, he is to be cut off from his people.";
csb[30] = "&quot;I will destroy among his people anyone who does any work on this same day.";
csb[31] = "&quot;You are not to do any work. This is a permanent statute throughout your generations wherever you live.";
csb[32] = "&quot;It will be a Sabbath of complete rest for you, and you must practice self-denial. You are to observe your Sabbath from the evening of the ninth day of the month until the following evening.&quot;";
csb[33] = "The LORD spoke to Moses:";
csb[34] = "&quot;Tell the Israelites: The Festival of Shelters to the LORD begins on the fifteenth day of this seventh month and continues for seven days.";
csb[35] = "&quot;There is to be a sacred assembly on the first day; you are not to do any daily work.";
csb[36] = "&quot;You are to present a fire offering to the LORD for seven days. On the eighth day you are to hold a sacred assembly and present a fire offering to the LORD. It is a solemn gathering; you are not to do any daily work.";
csb[37] = "&quot;These are the LORD\'s appointed times that you are to proclaim as sacred assemblies for presenting fire offerings to the LORD, burnt offerings and grain offerings, sacrifices and drink offerings, each on its designated day.";
csb[38] = "&quot;These are in addition to the offerings for the LORD\'s Sabbaths, your gifts, all your vow offerings, and all your freewill offerings that you give to the LORD.";
csb[39] = "&quot;You are to celebrate the LORD\'s festival on the fifteenth day of the seventh month for seven days after you have gathered the produce of the land. There will be complete rest on the first day and complete rest on the eighth day.";
csb[40] = "&quot;On the first day you are to take the product of majestic trees -- palm fronds, boughs of leafy trees, and willows of the brook -- and rejoice before the LORD your God for seven days.";
csb[41] = "&quot;You are to celebrate it as a festival to the LORD seven days each year. This is a permanent statute for you throughout your generations; celebrate it in the seventh month.";
csb[42] = "&quot;You are to live in shelters for seven days. All the native-born of Israel must live in shelters,";
csb[43] = "&quot;so that your generations may know that I made the Israelites live in shelters when I brought them out of the land of Egypt; I am the LORD your God.&quot;";
csb[44] = "So Moses declared the LORD\'s appointed times to the Israelites.";
</script>
