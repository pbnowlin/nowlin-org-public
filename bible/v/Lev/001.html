csb[1] = "Then the LORD summoned Moses and spoke to him from the tent of meeting:";
csb[2] = "&quot;Speak to the Israelites and tell them: When any of you brings an offering to the LORD from the livestock, you may bring your offering from the herd or the flock.";
csb[3] = "&quot;If his offering is a burnt offering from the herd, he is to bring an unblemished male. He will bring it to the entrance to the tent of meeting so that he may be accepted by the LORD.";
csb[4] = "&quot;He is to lay his hand on the head of the burnt offering so it can be accepted on his behalf to make atonement for him.";
csb[5] = "&quot;He is to slaughter the bull before the LORD; Aaron\'s sons the priests are to present the blood and splatter it on all sides of the altar that is at the entrance to the tent of meeting.";
csb[6] = "&quot;Then he is to skin the burnt offering and cut it into pieces.";
csb[7] = "&quot;The sons of Aaron the priest will prepare a fire on the altar and arrange wood on the fire.";
csb[8] = "&quot;Aaron\'s sons the priests are to arrange the pieces, the head, and the fat on top of the burning wood on the altar.";
csb[9] = "&quot;The offerer is to wash its entrails and legs with water. Then the priest will burn all of it on the altar as a burnt offering, a fire offering of a pleasing aroma to the LORD.";
csb[10] = "&quot;But if his offering for a burnt offering is from the flock, from sheep or goats, he is to present an unblemished male.";
csb[11] = "&quot;He will slaughter it on the north side of the altar before the LORD. Aaron\'s sons the priests will splatter its blood against the altar on all sides.";
csb[12] = "&quot;He will cut the animal into pieces with its head and its fat, and the priest will arrange them on top of the burning wood on the altar.";
csb[13] = "&quot;But he is to wash the entrails and legs with water. The priest will then present all of it and burn it on the altar; it is a burnt offering, a fire offering of a pleasing aroma to the LORD.";
csb[14] = "&quot;If his offering to the LORD is a burnt offering of birds, he is to present his offering from the turtledoves or young pigeons.";
csb[15] = "&quot;Then the priest is to bring it to the altar, and will twist off its head and burn it on the altar; its blood should be drained at the side of the altar.";
csb[16] = "&quot;He will remove its digestive tract, cutting off the tail feathers, and throw it on the east side of the altar at the place for ashes.";
csb[17] = "&quot;He will tear it open by its wings without dividing the bird. Then the priest is to burn it on the altar on top of the burning wood. It is a burnt offering, a fire offering of a pleasing aroma to the LORD.";
