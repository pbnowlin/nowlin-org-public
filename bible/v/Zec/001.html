csb[1] = "In the eighth month, in the second year of Darius, the word of the LORD came to the prophet Zechariah son of Berechiah, son of Iddo:";
csb[2] = "&quot;The LORD was extremely angry with your ancestors.";
csb[3] = "&quot;So tell the people, \'This is what the LORD of Armies says: Return to me -- this is the declaration of the LORD of Armies -- and I will return to you, says the LORD of Armies.";
csb[4] = "&quot;Do not be like your ancestors; the earlier prophets proclaimed to them: This is what the LORD of Armies says: Turn from your evil ways and your evil deeds. But they did not listen or pay attention to me -- this is the LORD\'s declaration.";
csb[5] = "&quot;Where are your ancestors now? And do the prophets live forever?";
csb[6] = "&quot;But didn\'t my words and my statutes that I commanded my servants the prophets overtake your ancestors? \' &quot; So the people repented and said, &quot;As the LORD of Armies decided to deal with us for our ways and our deeds, so he has dealt with us.&quot;";
csb[7] = "On the twenty-fourth day of the eleventh month, which is the month of Shebat, in the second year of Darius, the word of the LORD came to the prophet Zechariah son of Berechiah, son of Iddo:";
csb[8] = "I looked out in the night and saw a man riding on a chestnut horse. He was standing among the myrtle trees in the valley. Behind him were chestnut, brown, and white horses.";
csb[9] = "I asked, &quot;What are these, my lord? &quot; The angel who was talking to me replied, &quot;I will show you what they are.&quot;";
csb[10] = "Then the man standing among the myrtle trees explained, &quot;They are the ones the LORD has sent to patrol the earth.&quot;";
csb[11] = "They reported to the angel of the LORD standing among the myrtle trees, &quot;We have patrolled the earth, and right now the whole earth is calm and quiet.&quot;";
csb[12] = "Then the angel of the LORD responded, &quot;How long, LORD of Armies, will you withhold mercy from Jerusalem and the cities of Judah that you have been angry with these seventy years? &quot;";
csb[13] = "The LORD replied with kind and comforting words to the angel who was speaking with me.";
csb[14] = "So the angel who was speaking with me said, &quot;Proclaim: The LORD of Armies says: I am extremely jealous for Jerusalem and Zion.";
csb[15] = "&quot;I am fiercely angry with the nations that are at ease, for I was a little angry, but they made the destruction worse.";
csb[16] = "&quot;Therefore, this is what the LORD says: In mercy, I have returned to Jerusalem; my house will be rebuilt within it -- this is the declaration of the LORD of Armies -- and a measuring line will be stretched out over Jerusalem.";
csb[17] = "&quot;Proclaim further: This is what the LORD of Armies says: My cities will again overflow with prosperity; the LORD will once more comfort Zion and again choose Jerusalem.&quot;";
csb[18] = "Then I looked up and saw four horns.";
csb[19] = "So I asked the angel who was speaking with me, &quot;What are these? &quot; And he said to me, &quot;These are the horns that scattered Judah, Israel, and Jerusalem.&quot;";
csb[20] = "Then the LORD showed me four craftsmen.";
csb[21] = "I asked, &quot;What are they coming to do? &quot; He replied, &quot;These are the horns that scattered Judah so no one could raise his head. These craftsmen have come to terrify them, to cut off the horns of the nations that raised a horn against the land of Judah to scatter it.&quot;";

kjv[21] = "Then said I, What come these to do? And he spake, saying, These [are] the horns which have scattered Judah, so that no man did lift up his head: but these are come to fray them, to cast out the horns of the Gentiles, which lifted up [their] horn over the land of Judah to scatter it.";
