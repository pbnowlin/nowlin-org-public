csb[1] = "The word of the LORD of Armies came:";
csb[2] = "The LORD of Armies says this: &quot;I am extremely jealous for Zion; I am jealous for her with great wrath.&quot;";
csb[3] = "The LORD says this: &quot;I will return to Zion and live in Jerusalem. Then Jerusalem will be called the Faithful City; the mountain of the LORD of Armies will be called the Holy Mountain.&quot;";
csb[4] = "The LORD of Armies says this: &quot;Old men and women will again sit along the streets of Jerusalem, each with a staff in hand because of advanced age.";
csb[5] = "&quot;The streets of the city will be filled with boys and girls playing in them.&quot;";
csb[6] = "The LORD of Armies says this: &quot;Though it may seem impossible to the remnant of this people in those days, should it also seem impossible to me? &quot; -- this is the declaration of the LORD of Armies.";
csb[7] = "The LORD of Armies says this: &quot;I will save my people from the land of the east and the land of the west.";
csb[8] = "&quot;I will bring them back to live in Jerusalem. They will be my people, and I will be their faithful and righteous God.&quot;";
csb[9] = "The LORD of Armies says this: &quot;Let your hands be strong, you who now hear these words that the prophets spoke when the foundations were laid for the rebuilding of the temple, the house of the LORD of Armies.";
csb[10] = "&quot;For prior to those days neither man nor animal had wages. There was no safety from the enemy for anyone who came or went, for I turned everyone against his neighbor.";
csb[11] = "&quot;But now, I will not treat the remnant of this people as in the former days&quot; -- this is the declaration of the LORD of Armies.";
csb[12] = "&quot;For they will sow in peace: the vine will yield its fruit, the land will yield its produce, and the skies will yield their dew. I will give the remnant of this people all these things as an inheritance.";
csb[13] = "&quot;As you have been a curse among the nations, house of Judah and house of Israel, so I will save you, and you will be a blessing. Don\'t be afraid; let your hands be strong.&quot;";
csb[14] = "For the LORD of Armies says this: &quot;As I resolved to treat you badly when your fathers provoked me to anger, and I did not relent,&quot; says the LORD of Armies,";
csb[15] = "&quot;so I have resolved again in these days to do what is good to Jerusalem and the house of Judah. Don\'t be afraid.";
csb[16] = "&quot;These are the things you must do: Speak truth to one another; make true and sound decisions within your city gates.";
csb[17] = "&quot;Do not plot evil in your hearts against your neighbor, and do not love perjury, for I hate all this&quot; -- this is the LORD\'s declaration.";
csb[18] = "Then the word of the LORD of Armies came to me:";
csb[19] = "The LORD of Armies says this: &quot;The fast of the fourth month, the fast of the fifth, the fast of the seventh, and the fast of the tenth will become times of joy, gladness, and cheerful festivals for the house of Judah. Therefore, love truth and peace.&quot;";
csb[20] = "The LORD of Armies says this: &quot;Peoples will yet come, the residents of many cities;";
csb[21] = "&quot;the residents of one city will go to another, saying: Let\'s go at once to plead for the LORD\'s favor and to seek the LORD of Armies. I am also going.";
csb[22] = "&quot;Many peoples and strong nations will come to seek the LORD of Armies in Jerusalem and to plead for the LORD\'s favor.&quot;";
csb[23] = "The LORD of Armies says this: &quot;In those days, ten men from nations of every language will grab the robe of a Jewish man tightly, urging: Let us go with you, for we have heard that God is with you.&quot;";

web[19] = "Thus saith the LORD of hosts; The fast of the fourth [month], and the fast of the fifth, and the fast of the seventh, and the fast of the tenth, shall be to the house of Judah joy and gladness, and cheerful feasts; therefore love the truth and peace.";
