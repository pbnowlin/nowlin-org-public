csb[1] = "A pronouncement: The word of the LORD is against the land of Hadrach, and Damascus is its resting place -- for the eyes of humanity and all the tribes of Israel are on the LORD  --";
csb[2] = "and also against Hamath, which borders it, as well as Tyre and Sidon, though they are very shrewd.";
csb[3] = "Tyre has built herself a fortress; she has heaped up silver like dust and gold like the dirt of the streets.";
csb[4] = "Listen! The Lord will impoverish her and cast her wealth into the sea; she herself will be consumed by fire.";
csb[5] = "Ashkelon will see it and be afraid; Gaza too, and will writhe in great pain, as will Ekron, for her hope will fail. There will cease to be a king in Gaza, and Ashkelon will become uninhabited.";
csb[6] = "A mongrel people will live in Ashdod, and I will destroy the pride of the Philistines.";
csb[7] = "I will remove the blood from their mouths and the abhorrent things from between their teeth. Then they too will become a remnant for our God; they will become like a clan in Judah and Ekron like the Jebusites.";
csb[8] = "I will encamp at my house as a guard, against those who march back and forth, and no oppressor will march against them again, for now I have seen with my own eyes.";
csb[9] = "Rejoice greatly, Daughter Zion! Shout in triumph, Daughter Jerusalem! Look, your King is coming to you; he is righteous and victorious, humble and riding on a donkey, on a colt, the foal of a donkey.";
csb[10] = "I will cut off the chariot from Ephraim and the horse from Jerusalem. The bow of war will be removed, and he will proclaim peace to the nations. His dominion will extend from sea to sea, from the Euphrates River to the ends of the earth.";
csb[11] = "As for you, because of the blood of your covenant, I will release your prisoners from the waterless cistern.";
csb[12] = "Return to a stronghold, you prisoners who have hope; today I declare that I will restore double to you.";
csb[13] = "For I will bend Judah as my bow; I will fill that bow with Ephraim. I will rouse your sons, Zion, against your sons, Greece. I will make you like a warrior\'s sword.";
csb[14] = "Then the LORD will appear over them, and his arrow will fly like lightning. The Lord GOD will sound the trumpet and advance with the southern storms.";
csb[15] = "The LORD of Armies will defend them. They will consume and conquer with slingstones; they will drink and be rowdy as if with wine. They will be as full as the sprinkling basin, like those at the corners of the altar.";
csb[16] = "The LORD their God will save them on that day as the flock of his people; for they are like jewels in a crown, sparkling over his land.";
csb[17] = "How lovely and beautiful! Grain will make the young men flourish, and new wine, the young women.";
kjv[1] = "The burden of the word of the LORD in the land of Hadrach, and Damascus [shall be] the rest thereof: when the eyes of man, as of all the tribes of Israel, [shall be] toward the LORD.";
rsv[1] = "An Oracle The word of the LORD is against the land of Hadrach and will rest upon Damascus. For to the LORD belong the cities of Aram, even as all the tribes of Israel;";
asv[1] = "The burden of the word of Jehovah upon the land of Hadrach, and Damascus [shall be] its resting-place (for the eye of man and of all the tribes of Israel is toward Jehovah);";
yng[1] = "The burden of a word of Jehovah against the land of Hadrach, and Demmeseh -- his place of rest: (When to Jehovah [is] the eye of man, And of all the tribes of Israel.)";
dby[1] = "The burden of the word of Jehovah, in the land of Hadrach, and [on] Damascus shall it rest; (for Jehovah hath an eye upon men, and upon all the tribes of Israel;)";
web[1] = "The burden of the word of the LORD in the land of Hadrach, and Damascus [shall be] the rest of it: when the eyes of man, as of all the tribes of Israel, [shall be] towards the LORD.";
hnv[1] = "An oracle. The word of the LORD is against the land of Hadrakh, And will rest upon Dammesek; For the eye of man And of all the tribes of Yisra\'el is toward the LORD;";
vul[1] = "onus verbi Domini in terra Adrach et Damasci requiei eius quia Domini est oculus hominis et omnium tribuum Israhel";
kjv[2] = "And Hamath also shall border thereby; Tyrus, and Zidon, though it be very wise.";
rsv[2] = "Hamath also, which borders thereon, Tyre and Sidon, though they are very wise.";
asv[2] = "and Hamath, also, which bordereth thereon; Tyre and Sidon, because they are very wise.";
yng[2] = "And also Hamath doth border thereon, Tyre and Zidon, for -- very wise!";
dby[2] = "and also [on] Hamath [which] bordereth thereon; on Tyre and Zidon, though she be very wise.";
web[2] = "And Hamath also shall border by it; Tyre and Zidon, though it be very wise.";
hnv[2] = "And Hamat, also, which borders on it; Tzor and Tzidon, because they are very wise.";
vul[2] = "Emath quoque in terminis eius et Tyrus et Sidon adsumpserunt quippe sibi sapientiam valde";
kjv[3] = "And Tyrus did build herself a strong hold, and heaped up silver as the dust, and fine gold as the mire of the streets.";
rsv[3] = "Tyre has built herself a rampart, and heaped up silver like dust, and gold like the dirt of the streets.";
asv[3] = "And Tyre did build herself a stronghold, and heaped up silver as the dust, and fine gold as the mire of the streets.";
yng[3] = "And Tyre doth build a bulwark to herself, And doth heap silver as dust, And gold as mire of out-places.";
dby[3] = "And Tyre hath built herself a stronghold, and hath heaped up silver as the dust, and fine gold as the mire of the streets.";
web[3] = "And Tyre built herself a strong hold, and amassed silver as the dust, and fine gold as the mire of the streets.";
hnv[3] = "Tzor built herself a stronghold, And heaped up silver like the dust, And fine gold like the mire of the streets.";
vul[3] = "et aedificavit Tyrus munitionem suam et coacervavit argentum quasi humum et aurum ut lutum platearum";
kjv[4] = "Behold, the Lord will cast her out, and he will smite her power in the sea; and she shall be devoured with fire.";
rsv[4] = "But lo, the Lord will strip her of her possessions and hurl her wealth into the sea, and she shall be devoured by fire.";
asv[4] = "Behold, the Lord will dispossess her, and he will smite her power in the sea; and she shall be devoured with fire.";
yng[4] = "Lo, the Lord doth dispossess her, And He hath smitten in the sea her force, And she with fire is consumed.";
dby[4] = "Behold, the Lord will take possession of her, and he will smite her power in the sea; and she shall be devoured with fire.";
web[4] = "Behold, the Lord will cast her out, and he will smite her power in the sea; and she shall be devoured with fire.";
hnv[4] = "Behold, the Lord will dispossess her, And he will strike her power in the sea; And she will be devoured with fire.";
vul[4] = "ecce Dominus possidebit eam et percutiet in mari fortitudinem eius et haec igni devorabitur";
kjv[5] = "Ashkelon shall see [it], and fear; Gaza also [shall see it], and be very sorrowful, and Ekron; for her expectation shall be ashamed; and the king shall perish from Gaza, and Ashkelon shall not be inhabited.";
rsv[5] = "Ash\'kelon shall see it, and be afraid; Gaza too, and shall writhe in anguish; Ekron also, because its hopes are confounded. The king shall perish from Gaza; Ash\'kelon shall be uninhabited;";
asv[5] = "Ashkelon shall see it, and fear; Gaza also, and shall be sore pained; and Ekron, for her expectation shall be put to shame; and the king shall perish from Gaza, and Ashkelon shall not be inhabited.";
yng[5] = "See doth Ashkelon and fear, Also Gaza, and she is exceedingly pained, Also Ekron -- for her expectation dried up, And perished hath a king from Gaza, And Ashkelon doth not remain,";
dby[5] = "Ashkelon shall see [it], and fear; Gazah also, and she shall be greatly pained; Ekron also, for her expectation shall be put to shame: and the king shall perish from Gazah, and Ashkelon shall not be inhabited.";
web[5] = "Ashkelon shall see [it], and fear; Gaza also [shall see it], and be very sorrowful, and Ekron; for her expectation shall be ashamed; and the king shall perish from Gaza, and Ashkelon shall not be inhabited.";
hnv[5] = "Ashkelon will see it, and fear; `Aza also, and will writhe in agony; As will `Ekron, for her expectation will be disappointed; And the king will perish from `Aza, And Ashkelon will not be inhabited.";
vul[5] = "videbit Ascalon et timebit et Gaza et dolebit nimis et Accaron quoniam confusa est spes eius et peribit rex de Gaza et Ascalon non habitabitur";
kjv[6] = "And a bastard shall dwell in Ashdod, and I will cut off the pride of the Philistines.";
rsv[6] = "a mongrel people shall dwell in Ashdod; and I will make an end of the pride of Philistia.";
asv[6] = "And a bastard shall dwell in Ashdod, and I will cut off the pride of the Philistines.";
yng[6] = "And dwelt hath a foreigner in Ashdod, And I have cut off the excellency of the Philistines.";
dby[6] = "And a bastard shall dwell in Ashdod, and I will cut off the pride of the Philistines;";
web[6] = "And a bastard shall dwell in Ashdod, and I will cut off the pride of the Philistines.";
hnv[6] = "Foriegners will dwell in Ashdod, And I will cut off the pride of the Pelishtim.";
vul[6] = "et sedebit separator in Azoto et disperdam superbiam Philisthinorum";
kjv[7] = "And I will take away his blood out of his mouth, and his abominations from between his teeth: but he that remaineth, even he, [shall be] for our God, and he shall be as a governor in Judah, and Ekron as a Jebusite.";
rsv[7] = "I will take away its blood from its mouth, and its abominations from between its teeth; it too shall be a remnant for our God; it shall be like a clan in Judah, and Ekron shall be like the Jeb\'usites.";
asv[7] = "And I will take away his blood out of his mouth, and his abominations from between his teeth; and he also shall be a remnant for our God; and he shall be as a chieftain in Judah, and Ekron as a Jebusite.";
yng[7] = "And turned aside his blood from his mouth, His abominations from between his teeth, And he hath remained, even he, to our God, And he hath been as a leader in Judah, And Ekron as a Jebusite.";
dby[7] = "and I will take away his blood out of his mouth, and his abominations from between his teeth; but he that remaineth, he also shall belong to our God, and shall be as a leader in Judah, and Ekron as a Jebusite.";
web[7] = "And I will take away his blood out of his mouth, and his abominations from between his teeth: but he that remaineth, even he, [shall be] for our God, and he shall be as a governor in Judah, and Ekron as a Jebusite.";
hnv[7] = "I will take away his blood out of his mouth, And his abominations from between his teeth; And he also will be a remnant for our God; And he will be as a chieftain in Yehudah, And `Ekron as a Yevusi.";
vul[7] = "et auferam sanguinem eius de ore eius et abominationes eius de medio dentium eius et relinquetur etiam ipse Deo nostro et erit quasi dux in Iuda et Accaron quasi Iebuseus";
kjv[8] = "And I will encamp about mine house because of the army, because of him that passeth by, and because of him that returneth: and no oppressor shall pass through them any more: for now have I seen with mine eyes.";
rsv[8] = "Then I will encamp at my house as a guard, so that none shall march to and fro; no oppressor shall again overrun them, for now I see with my own eyes.";
asv[8] = "And I will encamp about my house against the army, that none pass through or return; and no oppressor shall pass through them any more: for now have I seen with mine eyes.";
yng[8] = "And I have pitched for My house a camp, Because of the passer through, and of the returner, And pass not through against them again doth an exactor, For, now, I have seen with My eyes.";
dby[8] = "And I will encamp about my house because of the army, because of those that pass by and that return; and the exactor shall not pass through them any more: for now have I seen [it] with mine eyes.";
web[8] = "And I will encamp about my house because of the army, because of him that passeth by, and because of him that returneth: and no oppressor shall pass through them any more: for now have I seen with my eyes.";
hnv[8] = "I will encamp around my house against the army, That none pass through or return; And no oppressor will pass through them any more: For now I have seen with my eyes.";
vul[8] = "et circumdabo domum meam ex his qui militant mihi euntes et revertentes et non transibit super eos ultra exactor quia nunc vidi in oculis meis";
kjv[9] = "Rejoice greatly, O daughter of Zion; shout, O daughter of Jerusalem: behold, thy King cometh unto thee: he [is] just, and having salvation; lowly, and riding upon an ass, and upon a colt the foal of an ass.";
rsv[9] = "Rejoice greatly, O daughter of Zion! Shout aloud, O daughter of Jerusalem! Lo, your king comes to you; triumphant and victorious is he, humble and riding on an ass, on a colt the foal of an ass.";
asv[9] = "Rejoice greatly, O daughter of Zion; shout, O daughter of Jerusalem: behold, thy king cometh unto thee; he is just, and having salvation; lowly, and riding upon an ass, even upon a colt the foal of an ass.";
yng[9] = "Rejoice exceedingly, O daughter of Zion, Shout, O daughter of Jerusalem, Lo, thy King doth come to thee, Righteous -- and saved is He, Afflicted -- and riding on an ass, And on a colt -- a son of she-asses.";
dby[9] = "Rejoice greatly, daughter of Zion; shout, daughter of Jerusalem! Behold, thy King cometh to thee: he is just, and having salvation; lowly and rIding upon an ass, even upon a colt the foal of an ass.";
web[9] = "Rejoice greatly, O daughter of Zion; shout, O daughter of Jerusalem: behold, thy King cometh to thee: he [is] just, and having salvation; lowly, and riding upon an ass, and upon a colt the foal of an ass.";
hnv[9] = "Rejoice greatly, daughter of Tziyon! Shout, daughter of Yerushalayim! Behold, your king comes to you! He is righteous, and having salvation; Lowly, and riding on a donkey, Even on a colt, the foal of a donkey.";
vul[9] = "exulta satis filia Sion iubila filia Hierusalem ecce rex tuus veniet tibi iustus et salvator ipse pauper et ascendens super asinum et super pullum filium asinae";
kjv[10] = "And I will cut off the chariot from Ephraim, and the horse from Jerusalem, and the battle bow shall be cut off: and he shall speak peace unto the heathen: and his dominion [shall be] from sea [even] to sea, and from the river [even] to the ends of the earth.";
rsv[10] = "I will cut off the chariot from E\'phraim and the war horse from Jerusalem; and the battle bow shall be cut off, and he shall command peace to the nations; his dominion shall be from sea to sea, and from the River to the ends of the earth.";
asv[10] = "And I will cut off the chariot from Ephraim, and the horse from Jerusalem; and the battle bow shall be cut off; and he shall speak peace unto the nations: and his dominion shall be from sea to sea, and from the River to the ends of the earth.";
yng[10] = "And I have cut off the chariot from Ephraim, And the horse from Jerusalem, Yea, cut off hath been the bow of battle, And he hath spoken peace to nations, And his rule [is] from sea unto sea, And from the river unto the ends of earth.";
dby[10] = "And I will cut off the chariot from Ephraim, and the horse from Jerusalem; and the battle-bow shall be cut off. And he shall speak peace unto the nations; and his dominion shall be from sea to sea, and from the river to the ends of the earth.";
web[10] = "And I will cut off the chariot from Ephraim, and the horse from Jerusalem, and the battle-bow shall be cut off: and he shall speak peace to the heathen: and his dominion [shall be] from sea to sea, and from the river to the ends of the earth.";
hnv[10] = "I will cut off the chariot from Efrayim, And the horse from Yerushalayim; And the battle bow will be cut off; And he will speak shalom to the nations: And his dominion will be from sea to sea, And from the River to the ends of the eretz.";
vul[10] = "et disperdam quadrigam ex Ephraim et equum de Hierusalem et dissipabitur arcus belli et loquetur pacem gentibus et potestas eius a mari usque ad mare et a fluminibus usque ad fines terrae";
kjv[11] = "As for thee also, by the blood of thy covenant I have sent forth thy prisoners out of the pit wherein [is] no water.";
rsv[11] = "As for you also, because of the blood of my covenant with you, I will set your captives free from the waterless pit.";
asv[11] = "As for thee also, because of the blood of thy covenant I have set free thy prisoners from the pit wherein is no water.";
yng[11] = "Also thou -- by the blood of thy covenant, I have sent thy prisoners out of the pit, There is no water in it.";
dby[11] = "As for thee also, by the blood of thy covenant, I will send forth thy prisoners out of the pit wherein is no water.";
web[11] = "As for thee also, by the blood of thy covenant I have sent forth thy prisoners out of the pit in which [is] no water.";
hnv[11] = "As for you also, Because of the blood of your covenant, I have set free your prisoners from the pit in which is no water.";
vul[11] = "tu quoque in sanguine testamenti tui emisisti vinctos tuos de lacu in quo non est aqua";
kjv[12] = "Turn you to the strong hold, ye prisoners of hope: even to day do I declare [that] I will render double unto thee;";
rsv[12] = "Return to your stronghold, O prisoners of hope; today I declare that I will restore to you double.";
asv[12] = "Turn you to the stronghold, ye prisoners of hope: even to-day do I declare that I will render double unto thee.";
yng[12] = "Turn back to a fenced place, Ye prisoners of the hope, Even to-day a second announcer I restore to thee.";
dby[12] = "Turn again to the stronghold, prisoners of hope! even to-day do I declare I will render double unto thee.";
web[12] = "Turn ye to the strong hold, ye prisoners of hope: even to-day do I declare [that] I will render double to thee;";
hnv[12] = "Turn to the stronghold, you prisoners of hope! Even today I declare that I will restore double to you.";
vul[12] = "convertimini ad munitionem vincti spei hodie quoque adnuntians duplicia reddam tibi";
kjv[13] = "When I have bent Judah for me, filled the bow with Ephraim, and raised up thy sons, O Zion, against thy sons, O Greece, and made thee as the sword of a mighty man.";
rsv[13] = "For I have bent Judah as my bow; I have made E\'phraim its arrow. I will brandish your sons, O Zion, over your sons, O Greece, and wield you like a warrior\'s sword.";
asv[13] = "For I have bent Judah for me, I have filled the bow with Ephraim; and I will stir up thy sons, O Zion, against thy sons, O Greece, and will make thee as the sword of a mighty man.";
yng[13] = "For I have trodden for Me Judah, A bow I have filled [with] Ephraim, And I have stirred up thy sons, O Zion, Against thy sons, O Javan, And I have set thee as the sword of a hero.";
dby[13] = "For I have bent Judah for me, I have filled the bow with Ephraim; and I will raise up thy sons, O Zion, against thy sons, O Greece, and make thee like the sword of a mighty man.";
web[13] = "When I have bent Judah for me, filled the bow with Ephraim, and raised up thy sons, O Zion, against thy sons, O Greece, and made thee as the sword of a mighty man.";
hnv[13] = "For indeed I bend Yehudah as a bow for me. I have filled the bow with Efrayim; And I will stir up your sons, Tziyon, Against your sons, Greece, And will make you like the sword of a mighty man.";
vul[13] = "quoniam extendi mihi Iudam quasi arcum implevi Ephraim et suscitabo filios tuos Sion super filios tuos Graecia et ponam te quasi gladium fortium";
kjv[14] = "And the LORD shall be seen over them, and his arrow shall go forth as the lightning: and the Lord GOD shall blow the trumpet, and shall go with whirlwinds of the south.";
rsv[14] = "Then the LORD will appear over them, and his arrow go forth like lightning; the Lord GOD will sound the trumpet, and march forth in the whirlwinds of the south.";
asv[14] = "And Jehovah shall be seen over them; and his arrow shall go forth as the lightning; and the Lord Jehovah will blow the trumpet, and will go with whirlwinds of the south.";
yng[14] = "And Jehovah doth appear for them, And gone forth as lightning hath His arrow, And the Lord Jehovah with a trumpet bloweth, And He hath gone with whirlwinds of the south.";
dby[14] = "And Jehovah shall be seen over them, and his arrow shall go forth as the lightning; and the Lord Jehovah will blow the trumpet, and will march with whirlwinds of the south.";
web[14] = "And the LORD shall be seen over them, and his arrow shall go forth as the lightning: and the Lord GOD will blow the trumpet, and will go with whirlwinds of the south.";
hnv[14] = "The LORD will be seen over them; And his arrow will go flash like lightning; And the Lord GOD will blow the shofar, And will go with whirlwinds of the south.";
vul[14] = "et Dominus Deus super eos videbitur et exibit ut fulgur iaculum eius et Dominus Deus in tuba canet et vadet in turbine austri";
kjv[15] = "The LORD of hosts shall defend them; and they shall devour, and subdue with sling stones; and they shall drink, [and] make a noise as through wine; and they shall be filled like bowls, [and] as the corners of the altar.";
rsv[15] = "The LORD of hosts will protect them, and they shall devour and tread down the slingers; and they shall drink their blood like wine, and be full like a bowl, drenched like the corners of the altar.";
asv[15] = "Jehovah of hosts will defend them; and they shall devour, and shall tread down the sling-stones; and they shall drink, and make a noise as through wine; and they shall be filled like bowls, like the corners of the altar.";
yng[15] = "Jehovah of Hosts doth cover them over, And they consumed, and subdued sling-stones, Yea, they have drunk, They have made a noise as wine, And they have been full as a bowl, As corners of an altar.";
dby[15] = "Jehovah of hosts will defend them; and they shall devour, and shall tread down the sling-stones; and they shall drink, [and] make a noise as from wine; and they shall be filled like a bowl, like the corners of the altar.";
web[15] = "The LORD of hosts will defend them; and they shall devour, and subdue with sling-stones; and they shall drink, [and] make a noise as through wine; and they shall be filled like bowls, [and] as the corners of the altar.";
hnv[15] = "The LORD of Hosts will defend them; And they will destroy and overcome with sling-stones; And they will drink, and roar as through wine; And they will be filled like bowls, Like the corners of the altar.";
vul[15] = "Dominus exercituum proteget eos et devorabunt et subicient lapidibus fundae et bibentes inebriabuntur quasi vino et replebuntur ut fialae et quasi cornua altaris";
kjv[16] = "And the LORD their God shall save them in that day as the flock of his people: for they [shall be as] the stones of a crown, lifted up as an ensign upon his land.";
rsv[16] = "On that day the LORD their God will save them for they are the flock of his people; for like the jewels of a crown they shall shine on his land.";
asv[16] = "And Jehovah their God will save them in that day as the flock of his people; for [they shall be as] the stones of a crown, lifted on high over his land.";
yng[16] = "And saved them hath Jehovah their God In that day, as a flock of His people, For stones of a crown are displaying themselves over His ground.";
dby[16] = "And Jehovah their God shall save them in that day as the flock of his people; for [they shall be as] the stones of a crown, lifted up upon his land.";
web[16] = "And the LORD their God will save them in that day as the flock of his people: for [they shall be as] the stones of a crown, lifted up as an ensign upon his land.";
hnv[16] = "The LORD their God will save them in that day as the flock of his people; For they are like the jewels of a crown, Lifted on high over his land.";
vul[16] = "et salvabit eos Dominus Deus eorum in die illa ut gregem populi sui quia lapides sancti elevantur super terram eius";
kjv[17] = "For how great [is] his goodness, and how great [is] his beauty! corn shall make the young men cheerful, and new wine the maids.";
rsv[17] = "Yea, how good and how fair it shall be! Grain shall make the young men flourish, and new wine the maidens.";
asv[17] = "For how great is his goodness, and how great is his beauty! grain shall make the young men flourish, and new wine the virgins.";
yng[17] = "For what His goodness! and what His beauty! Corn the young men, And new wine the virgins -- make fruitful!";
dby[17] = "For how great is his goodness, and how great is his beauty! Corn shall make the young men flourish, and new wine the maidens.";
web[17] = "For how great [is] his goodness, and how great [is] his beauty! corn shall make the young men cheerful, and new wine the maids.";
hnv[17] = "For how great is his goodness, And how great is his beauty! Grain will make the young men flourish, And new wine the virgins.";
vul[17] = "quid enim bonum eius est et quid pulchrum eius nisi frumentum electorum et vinum germinans virgines";
