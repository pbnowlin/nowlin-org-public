csb[1] = "I looked up again and saw a flying scroll.";
csb[2] = "&quot;What do you see? &quot; he asked me. &quot;I see a flying scroll,&quot; I replied, &quot;thirty feet long and fifteen feet wide.&quot;";
csb[3] = "Then he said to me, &quot;This is the curse that is going out over the whole land, for everyone who is a thief, contrary to what is written on one side, has gone unpunished, and everyone who swears falsely, contrary to what is written on the other side, has gone unpunished.";
csb[4] = "&quot;I will send it out,&quot; -- this is the declaration of the LORD of Armies -- &quot;and it will enter the house of the thief and the house of the one who swears falsely by my name. It will stay inside his house and destroy it along with its timbers and stones.&quot;";
csb[5] = "Then the angel who was speaking with me came forward and told me, &quot;Look up and see what this is that is approaching.&quot;";
csb[6] = "So I asked, &quot;What is it? &quot; He responded, &quot;It\'s a measuring basket that is approaching.&quot; And he continued, &quot;This is their iniquity in all the land.&quot;";
csb[7] = "Then a lead cover was lifted, and there was a woman sitting inside the basket.";
csb[8] = "&quot;This is Wickedness,&quot; he said. He shoved her down into the basket and pushed the lead weight over its opening.";
csb[9] = "Then I looked up and saw two women approaching with the wind in their wings. Their wings were like those of a stork, and they lifted up the basket between earth and sky.";
csb[10] = "So I asked the angel who was speaking with me, &quot;Where are they taking the basket? &quot;";
csb[11] = "&quot;To build a shrine for it in the land of Shinar,&quot; he told me. &quot;When that is ready, the basket will be placed there on its pedestal.&quot;";
