csb[1] = "Then he showed me the high priest Joshua standing before the angel of the LORD, with Satan standing at his right side to accuse him.";
csb[2] = "The LORD  said to Satan: &quot;The LORD rebuke you, Satan! May the LORD who has chosen Jerusalem rebuke you! Isn\'t this man a burning stick snatched from the fire? &quot;";
csb[3] = "Now Joshua was dressed with filthy clothes as he stood before the angel.";
csb[4] = "So the angel of the LORD  spoke to those standing before him, &quot;Take off his filthy clothes! &quot; Then he said to him, &quot;See, I have removed your iniquity from you, and I will clothe you with festive robes.&quot;";

csb[6] = "Then the angel of the LORD charged Joshua:";
csb[7] = "&quot;This is what the LORD of Armies says: If you walk in my ways and keep my mandates, you will both rule my house and take care of my courts; I will also grant you access among these who are standing here.";
csb[8] = "&quot;Listen, High Priest Joshua, you and your colleagues sitting before you; indeed, these men are a sign that I am about to bring my servant, the Branch.";
csb[9] = "&quot;Notice the stone I have set before Joshua; on that one stone are seven eyes. I will engrave an inscription on it&quot; -- this is the declaration of the LORD of Armies -- &quot;and I will take away the iniquity of this land in a single day.";
csb[10] = "&quot;On that day, each of you will invite his neighbor to sit under his vine and fig tree.&quot; This is the declaration of the LORD of Armies.";
