csb[1] = "Look, a day belonging to the LORD is coming when the plunder taken from you will be divided in your presence.";
csb[2] = "I will gather all the nations against Jerusalem for battle. The city will be captured, the houses looted, and the women raped. Half the city will go into exile, but the rest of the people will not be removed from the city.";
csb[3] = "Then the LORD will go out to fight against those nations as he fights on a day of battle.";
csb[4] = "On that day his feet will stand on the Mount of Olives, which faces Jerusalem on the east. The Mount of Olives will be split in half from east to west, forming a huge valley, so that half the mountain will move to the north and half to the south.";
csb[5] = "You will flee by my mountain valley, for the valley of the mountains will extend to Azal. You will flee as you fled from the earthquake in the days of King Uzziah of Judah. Then the LORD my God will come and all the holy ones with him.";
csb[6] = "On that day there will be no light; the sunlight and moonlight will diminish.";
csb[7] = "It will be a unique day known only to the LORD, without day or night, but there will be light at evening.";
csb[8] = "On that day living water will flow out from Jerusalem, half of it toward the eastern sea and the other half toward the western sea, in summer and winter alike.";
csb[9] = "On that day the LORD will become King over the whole earth -- the LORD alone, and his name alone.";
csb[10] = "All the land from Geba to Rimmon south of Jerusalem will be changed into a plain. But Jerusalem will be raised up and will remain on its site from the Benjamin Gate to the place of the First Gate, to the Corner Gate, and from the Tower of Hananel to the royal winepresses.";
csb[11] = "People will live there, and never again will there be a curse of complete destruction. So Jerusalem will dwell in security.";
csb[12] = "This will be the plague with which the LORD strikes all the people who have warred against Jerusalem: their flesh will rot while they stand on their feet, their eyes will rot in their sockets, and their tongues will rot in their mouths.";
csb[13] = "On that day a great panic from the LORD will be among them, so that each will seize the hand of another, and the hand of one will rise against the other.";
csb[14] = "Judah will also fight at Jerusalem, and the wealth of all the surrounding nations will be collected: gold, silver, and clothing in great abundance.";
csb[15] = "The same plague as the previous one will strike the horses, mules, camels, donkeys, and all the animals that are in those camps.";
csb[16] = "Then all the survivors from the nations that came against Jerusalem will go up year after year to worship the King, the LORD of Armies, and to celebrate the Festival of Shelters.";
csb[17] = "Should any of the families of the earth not go up to Jerusalem to worship the King, the LORD of Armies, rain will not fall on them.";
csb[18] = "And if the people of Egypt will not go up and enter, then rain will not fall on them; this will be the plague the LORD inflicts on the nations who do not go up to celebrate the Festival of Shelters.";
csb[19] = "This will be the punishment of Egypt and all the nations that do not go up to celebrate the Festival of Shelters.";
csb[20] = "On that day, the words HOLY TO THE LORD will be on the bells of the horses. The pots in the house of the LORD will be like the sprinkling basins before the altar.";
csb[21] = "Every pot in Jerusalem and in Judah will be holy to the LORD of Armies. All who sacrifice will come and use the pots to cook in. And on that day there will no longer be a Canaanite in the house of the LORD of Armies.";
kjv[1] = "Behold, the day of the LORD cometh, and thy spoil shall be divided in the midst of thee.";
rsv[1] = "Behold, a day of the LORD is coming, when the spoil taken from you will be divided in the midst of you.";
asv[1] = "Behold, a day of Jehovah cometh, when thy spoil shall be divided in the midst of thee.";
yng[1] = "Lo, a day hath come to Jehovah, And divided hath been thy spoil in thy midst.";
dby[1] = "Behold, the day cometh for Jehovah, and thy spoil shall be divided in the midst of thee.";
web[1] = "Behold, the day of the LORD cometh, and thy spoil shall be divided in the midst of thee.";
hnv[1] = "Behold, a day of the LORD comes, when your spoil will be divided in your midst.";
vul[1] = "ecce dies veniunt Domini et dividentur spolia tua in medio tui";
kjv[2] = "For I will gather all nations against Jerusalem to battle; and the city shall be taken, and the houses rifled, and the women ravished; and half of the city shall go forth into captivity, and the residue of the people shall not be cut off from the city.";
rsv[2] = "For I will gather all the nations against Jerusalem to battle, and the city shall be taken and the houses plundered and the women ravished; half of the city shall go into exile, but the rest of the people shall not be cut off from the city.";
asv[2] = "For I will gather all nations against Jerusalem to battle; and the city shall be taken, and the houses rifled, and the women ravished; and half of the city shall go forth into captivity, and the residue of the people shall not be cut off from the city.";
yng[2] = "And I have gathered all the nations unto Jerusalem to battle, And captured hath been the city, And spoiled have been the houses, And the women are lain with, Gone forth hath half the city in a removal, And the remnant of the people are not cut off from the city.";
dby[2] = "And I will assemble all the nations against Jerusalem to battle; and the city shall be taken, and the houses rifled, and the women ravished; and half of the city shall go forth into captivity; and the rest of the people shall not be cut off from the city.";
web[2] = "For I will gather all nations against Jerusalem to battle; and the city shall be taken, and the houses rifled, and the women ravished; and half of the city shall go forth into captivity, and the residue of the people shall not be cut off from the city.";
hnv[2] = "For I will gather all nations against Yerushalayim to battle; and the city will be taken, the houses rifled, and the women ravished. half of the city will go out into captivity, and the rest of the people will not be cut off from the city.";
vul[2] = "et congregabo omnes gentes ad Hierusalem in proelium et capietur civitas et vastabuntur domus et mulieres violabuntur et egredietur media pars civitatis in captivitatem et reliquum populi non auferetur ex urbe";
kjv[3] = "Then shall the LORD go forth, and fight against those nations, as when he fought in the day of battle.";
rsv[3] = "Then the LORD will go forth and fight against those nations as when he fights on a day of battle.";
asv[3] = "Then shall Jehovah go forth, and fight against those nations, as when he fought in the day of battle.";
yng[3] = "And gone forth hath Jehovah, And He hath fought against those nations, As in the day of His fighting in a day of conflict.";
dby[3] = "And Jehovah will go forth and fight with those nations, as when he fought in the day of battle.";
web[3] = "Then will the LORD go forth, and fight against those nations, as when he fought in the day of battle.";
hnv[3] = " Then the LORD will go out and fight against those nations, as when he fought in the day of battle.";
vul[3] = "et egredietur Dominus et proeliabitur contra gentes illas sicut proeliatus est in die certaminis";
kjv[4] = "And his feet shall stand in that day upon the mount of Olives, which [is] before Jerusalem on the east, and the mount of Olives shall cleave in the midst thereof toward the east and toward the west, [and there shall be] a very great valley; and half of the mountain shall remove toward the north, and half of it toward the south.";
rsv[4] = "On that day his feet shall stand on the Mount of Olives which lies before Jerusalem on the east; and the Mount of Olives shall be split in two from east to west by a very wide valley; so that one half of the Mount shall withdraw northward, and the other half southward.";
asv[4] = "And his feet shall stand in that day upon the mount of Olives, which is before Jerusalem on the east; and the mount of Olives shall be cleft in the midst thereof toward the east and toward the west, [and there shall be] a very great valley; and half of the mountain shall remove toward the north, and half of it toward the south.";
yng[4] = "And stood have His feet, in that day, On the mount of Olives, That [is] before Jerusalem eastward, And cleft hath been the mount of Olives at its midst, To the east, and to the west, a very great valley, And removed hath the half of the mount towards the north. And its half towards the south.";
dby[4] = "And his feet shall stand in that day upon the mount of Olives, which is before Jerusalem toward the east, and the mount of Olives shall cleave in the midst thereof toward the east and toward the west, -- a very great valley; and half of the mountain shall remove toward the north, and half of it toward the south.";
web[4] = "And his feet will stand in that day upon the mount of Olives, which [is] before Jerusalem on the east, and the mount of Olives shall cleave in the midst of it towards the east and towards the west, [and there shall be] a very great valley; and half of the mountain shall remove towards the north, and half of it towards the south.";
hnv[4] = "His feet will stand in that day on the Mount of Olives, which is before Yerushalayim on the east; and the Mount of Olives will be split in two, from east to west, making a very great valley. Half of the mountain will move toward the north, and half of it toward the south.";
vul[4] = "et stabunt pedes eius in die illa super montem Olivarum qui est contra Hierusalem ad orientem et scindetur mons Olivarum ex media parte sui ad orientem et occidentem praerupto grandi valde et separabitur medium montis ad aquilonem et medium eius ad meridiem";
kjv[5] = "And ye shall flee [to] the valley of the mountains; for the valley of the mountains shall reach unto Azal: yea, ye shall flee, like as ye fled from before the earthquake in the days of Uzziah king of Judah: and the LORD my God shall come, [and] all the saints with thee.";
rsv[5] = "And the valley of my mountains shall be stopped up, for the valley of the mountains shall touch the side of it; and you shall flee as you fled from the earthquake in the days of Uzzi\'ah king of Judah. Then the LORD your God will come, and all the holy ones with him.";
asv[5] = "And ye shall flee by the valley of my mountains; for the valley of the mountains shall reach unto Azel; yea, ye shall flee, like as ye fled from before the earthquake in the days of Uzziah king of Judah; and Jehovah my God shall come, and all the holy ones with thee.";
yng[5] = "And ye have fled [to] the valley of My mountains, For join doth the valley of the mountains to Azal, And ye have fled as ye fled before the shaking, In the days of Uzziah king of Judah, And come in hath Jehovah my God, All holy ones [are] with Thee.";
dby[5] = "And ye shall flee [by] the valley of my mountains; for the valley of the mountains shall reach unto Azal: ye shall even flee, like as ye fled from before the earthquake in the days of Uzziah king of Judah. And Jehovah my God shall come, [and] all the holy ones with thee.";
web[5] = "And ye shall flee [to] the valley of the mountains; for the valley of the mountains shall reach to Azal: yes, ye shall flee as ye fled from before the earthquake in the days of Uzziah king of Judah: and the LORD my God shall come, [and] all the saints with thee.";
hnv[5] = "You shall flee by the valley of my mountains; for the valley of the mountains shall reach to Atzel; yes, you shall flee, just like you fled from before the earthquake in the days of `Uzziyah king of Yehudah. The LORD my God will come, and all the holy ones with you.";
vul[5] = "et fugietis ad vallem montium meorum quoniam coniungetur vallis montium usque ad proximum et fugietis sicut fugistis a facie terraemotus in diebus Oziae regis Iuda et veniet Dominus Deus meus omnesque sancti cum eo";
kjv[6] = "And it shall come to pass in that day, [that] the light shall not be clear, [nor] dark:";
rsv[6] = "On that day there shall be neither cold nor frost.";
asv[6] = "And it shall come to pass in that day, that there shall not be light; the bright ones shall withdraw themselves:";
yng[6] = "And it hath come to pass, in that day, The precious light is not, it is dense darkness,";
dby[6] = "And it shall come to pass in that day, [that] there shall not be light; the shining shall be obscured.";
web[6] = "And it shall come to pass in that day, [that] the light shall not be clear, [nor] dark:";
hnv[6] = "It will happen in that day, that there will not be light, cold, or frost.";
vul[6] = "et erit in die illa non erit lux sed frigus et gelu";
kjv[7] = "But it shall be one day which shall be known to the LORD, not day, nor night: but it shall come to pass, [that] at evening time it shall be light.";
rsv[7] = "And there shall be continuous day (it is known to the LORD), not day and not night, for at evening time there shall be light.";
asv[7] = "but it shall be one day which is known unto Jehovah; not day, and not night; but it shall come to pass, that at evening time there shall be light.";
yng[7] = "And there hath been one day, It is known to Jehovah, not day nor night, And it hath been at evening-time -- there is light.";
dby[7] = "And it shall be one day which is known to Jehovah, not day, and not night; and it shall come to pass, at eventide it shall be light.";
web[7] = "But it shall be one day which shall be known to the LORD, not day, nor night: but it shall come to pass, [that] at evening it shall be light.";
hnv[7] = "It will be a unique day which is known to the LORD; not day, and not night; but it will come to pass, that at evening time there will be light.";
vul[7] = "et erit dies una quae nota est Domino non dies neque nox et in tempore vesperae erit lux";
kjv[8] = "And it shall be in that day, [that] living waters shall go out from Jerusalem; half of them toward the former sea, and half of them toward the hinder sea: in summer and in winter shall it be.";
rsv[8] = "On that day living waters shall flow out from Jerusalem, half of them to the eastern sea and half of them to the western sea; it shall continue in summer as in winter.";
asv[8] = "And it shall come to pass in that day, that living waters shall go out from Jerusalem; half of them toward the eastern sea, and half of them toward the western sea: in summer and in winter shall it be.";
yng[8] = "And it hath come to pass, in that day, Go forth do living waters from Jerusalem, Half of them unto the eastern sea, And half of them unto the western sea, In summer and in winter it is.";
dby[8] = "And it shall come to pass in that day [that] living waters shall go out from Jerusalem; half of them toward the eastern sea, and half of them toward the hinder sea: in summer and in winter shall it be.";
web[8] = "And it shall be in that day, [that] living waters shall go out from Jerusalem; half of them towards the former sea, and half of them towards the hinder sea: in summer and in winter shall it be.";
hnv[8] = "It will happen in that day, that living waters will go out from Yerushalayim; half of them toward the eastern sea, and half of them toward the western sea; in summer and in winter will it be.";
vul[8] = "et erit in die illa exibunt aquae vivae de Hierusalem medium earum ad mare orientale et medium earum ad mare novissimum in aestate et in hieme erunt";
kjv[9] = "And the LORD shall be king over all the earth: in that day shall there be one LORD, and his name one.";
rsv[9] = "And the LORD will become king over all the earth; on that day the LORD will be one and his name one.";
asv[9] = "And Jehovah shall be King over all the earth: in that day shall Jehovah be one, and his name one.";
yng[9] = "And Jehovah hath become king over all the land, In that day there is one Jehovah, and His name one.";
dby[9] = "And Jehovah shall be king over all the earth: in that day shall there be one Jehovah, and his name one.";
web[9] = "And the LORD will be king over all the earth: in that day will there be one LORD, and his name one.";
hnv[9] = "The LORD will be King over all the eretz. In that day the LORD will be one, and his name one.";
vul[9] = "et erit Dominus rex super omnem terram in die illa erit Dominus unus et erit nomen eius unum";
kjv[10] = "All the land shall be turned as a plain from Geba to Rimmon south of Jerusalem: and it shall be lifted up, and inhabited in her place, from Benjamin\'s gate unto the place of the first gate, unto the corner gate, and [from] the tower of Hananeel unto the king\'s winepresses.";
rsv[10] = "The whole land shall be turned into a plain from Geba to Rimmon south of Jerusalem. But Jerusalem shall remain aloft upon its site from the Gate of Benjamin to the place of the former gate, to the Corner Gate, and from the Tower of Han\'anel to the king\'s wine presses.";
asv[10] = "All the land shall be made like the Arabah, from Geba to Rimmon south of Jerusalem; and she shall be lifted up, and shall dwell in her place, from Benjamin\'s gate unto the place of the first gate, unto the corner gate, and from the tower of Hananel unto the king\'s wine-presses.";
yng[10] = "Changed is all the land as a plain, From Gebo to Rimmon, south of Jerusalem, And she hath been high, and hath dwelt in her place, Even from the gate of Benjamin To the place of the first gate, unto the front gate, And from the tower of Hananeel, Unto the wine-vats of the king.";
dby[10] = "All the land from Geba to Rimmon south of Jerusalem shall be turned as the Arabah; and [Jerusalem] shall be lifted up, and shall dwell in her own place, from Benjamin\'s gate unto the place of the first gate, unto the corner-gate, and from the tower of Hananeel unto the king\'s winepresses.";
web[10] = "All the land shall be turned as a plain from Geba to Rimmon, south of Jerusalem: and it shall be lifted up, and inhabited in her place, from Benjamin\'s gate to the place of the first gate, to the corner gate, and [from] the tower of Hananeel to the king\'s wine-presses.";
hnv[10] = "All the land will be made like the `Aravah, from Geva to Rimmon south of Yerushalayim; and she will be lifted up, and will dwell in her place, from Binyamin\'s gate to the place of the first gate, to the corner gate, and from the tower of Hanan\'el to the king\'s wine-presses.";
vul[10] = "et revertetur omnis terra usque ad desertum de colle Remmon ad austrum Hierusalem et exaltabitur et habitabit in loco suo a porta Beniamin usque ad locum portae Prioris usque ad portam Angulorum et a turre Ananehel usque ad torcularia regis";
kjv[11] = "And [men] shall dwell in it, and there shall be no more utter destruction; but Jerusalem shall be safely inhabited.";
rsv[11] = "And it shall be inhabited, for there shall be no more curse; Jerusalem shall dwell in security.";
asv[11] = "And men shall dwell therein, and there shall be no more curse; but Jerusalem shall dwell safely.";
yng[11] = "And they have dwelt in her, And destruction is no more, And Jerusalem hath dwelt confidently.";
dby[11] = "And [men] shall dwell in it, and there shall be no more utter destruction; and Jerusalem shall dwell safely.";
web[11] = "And [men] shall dwell in it, and there shall be no more utter destruction; but Jerusalem shall be safely inhabited.";
hnv[11] = "Men will dwell therein, and there will be no more curse; but Yerushalayim will dwell safely.";
vul[11] = "et habitabunt in ea et anathema non erit amplius sed sedebit Hierusalem secura";
kjv[12] = "And this shall be the plague wherewith the LORD will smite all the people that have fought against Jerusalem; Their flesh shall consume away while they stand upon their feet, and their eyes shall consume away in their holes, and their tongue shall consume away in their mouth.";
rsv[12] = "And this shall be the plague with which the LORD will smite all the peoples that wage war against Jerusalem: their flesh shall rot while they are still on their feet, their eyes shall rot in their sockets, and their tongues shall rot in their mouths.";
asv[12] = "And this shall be the plague wherewith Jehovah will smite all the peoples that have warred against Jerusalem: their flesh shall consume away while they stand upon their feet, and their eyes shall consume away in their sockets, and their tongue shall consume away in their mouth.";
yng[12] = "And this is the plague with which Jehovah Doth plague all the peoples who have warred against Jerusalem, He hath consumed away its flesh, And it is standing on its feet, And its eyes are consumed in their holes, And its tongue is consumed in their mouth.";
dby[12] = "And this shall be the plague wherewith Jehovah will smite all the peoples that have warred against Jerusalem: their flesh shall consume away while they stand upon their feet, and their eyes shall consume away in their holes, and their tongue shall consume away in their mouth.";
web[12] = "And this shall be the plague with which the LORD will smite all the people that have fought against Jerusalem; Their flesh shall consume away while they stand upon their feet, and their eyes shall consume away in their holes, and their tongue shall consume away in their mouth.";
hnv[12] = "This will be the plague with which the LORD will strike all the peoples who have warred against Yerushalayim: their flesh will consume away while they stand on their feet, and their eyes will consume away in their sockets, and their tongue will consume away in their mouth.";
vul[12] = "et haec erit plaga qua percutiet Dominus omnes gentes quae pugnaverunt adversus Hierusalem tabescet caro uniuscuiusque stantis super pedes suos et oculi eius contabescent in foraminibus suis et lingua eorum contabescet in ore suo";
kjv[13] = "And it shall come to pass in that day, [that] a great tumult from the LORD shall be among them; and they shall lay hold every one on the hand of his neighbour, and his hand shall rise up against the hand of his neighbour.";
rsv[13] = "And on that day a great panic from the LORD shall fall on them, so that each will lay hold on the hand of his fellow, and the hand of the one will be raised against the hand of the other;";
asv[13] = "And it shall come to pass in that day, that a great tumult from Jehovah shall be among them; and they shall lay hold every one on the hand of his neighbor, and his hand shall rise up against the hand of his neighbor.";
yng[13] = "And it hath come to pass, in that day, A great destruction [from] Jehovah is among them, And they have seized each the hand of his neighbour, And gone up hath his hand against the hand of his neighbour.";
dby[13] = "And it shall come to pass in that day [that] a great panic from Jehovah shall be among them; and they shall lay hold every one on the hand of his neighbour, and his hand shall rise up against the hand of his neighbour.";
web[13] = "And it shall come to pass in that day, [that] a great tumult from the LORD shall be among them; and they shall lay hold every one on the hand of his neighbor, and his hand shall rise up against the hand of his neighbor.";
hnv[13] = "It will happen in that day, that a great panic from the LORD will be among them; and they will lay hold everyone on the hand of his neighbor, and his hand will rise up against the hand of his neighbor.";
vul[13] = "in die illo erit tumultus Domini magnus in eis et adprehendet vir manum proximi sui et conseretur manus eius super manum proximi sui";
kjv[14] = "And Judah also shall fight at Jerusalem; and the wealth of all the heathen round about shall be gathered together, gold, and silver, and apparel, in great abundance.";
rsv[14] = "even Judah will fight against Jerusalem. And the wealth of all the nations round about shall be collected, gold, silver, and garments in great abundance.";
asv[14] = "And Judah also shall fight at Jerusalem; and the wealth of all the nations round about shall be gathered together, gold, and silver, and apparel, in great abundance.";
yng[14] = "And also Judah is fought with in Jerusalem, And gathered hath been the force of all the nations round about, Gold, and silver, and apparel, in great abundance.";
dby[14] = "And Judah also shall fight at Jerusalem; and the wealth of all the nations round about shall be gathered together -- gold, and silver, and garments, in great abundance.";
web[14] = "And Judah also shall fight at Jerusalem; and the wealth of all the heathen around shall be collected, gold, and silver, and apparel, in great abundance.";
hnv[14] = "Yehudah also will fight at Yerushalayim; and the wealth of all the surrounding nations will be gathered together: gold, and silver, and clothing, in great abundance.";
vul[14] = "sed et Iudas pugnabit adversus Hierusalem et congregabuntur divitiae omnium gentium in circuitu aurum et argentum et vestes multae satis";
kjv[15] = "And so shall be the plague of the horse, of the mule, of the camel, and of the ass, and of all the beasts that shall be in these tents, as this plague.";
rsv[15] = "And a plague like this plague shall fall on the horses, the mules, the camels, the asses, and whatever beasts may be in those camps.";
asv[15] = "And so shall be the plague of the horse, of the mule, of the camel, and of the ass, and of all the beasts that shall be in those camps, as that plague.";
yng[15] = "And so is the plague of the horse, of the mule, Of the camel, and of the ass, And of all the cattle that are in these camps, As this plague.";
dby[15] = "And so shall be the plague of the horse, of the mule, of the camel, and of the ass, and of all the beasts that shall be in those camps, as this plague.";
web[15] = "And so shall be the plague of the horse, of the mule, of the camel, and of the ass, and of all the beasts that shall be in these tents, as this plague.";
hnv[15] = "So will be the plague of the horse, of the mule, of the camel, and of the donkey, and of all the animals that will be in those camps, as that plague.";
vul[15] = "et sic erit ruina equi et muli cameli et asini et omnium iumentorum quae fuerint in castris illis sicut ruina haec";
kjv[16] = "And it shall come to pass, [that] every one that is left of all the nations which came against Jerusalem shall even go up from year to year to worship the King, the LORD of hosts, and to keep the feast of tabernacles.";
rsv[16] = "Then every one that survives of all the nations that have come against Jerusalem shall go up year after year to worship the King, the LORD of hosts, and to keep the feast of booths.";
asv[16] = "And it shall come to pass, that every one that is left of all the nations that came against Jerusalem shall go up from year to year to worship the King, Jehovah of hosts, and to keep the feast of tabernacles.";
yng[16] = "And it hath come to pass, Every one who hath been left of all the nations, Who are coming in against Jerusalem, They have also gone up from year to year, To bow themselves to the King, Jehovah of Hosts, And to celebrate the feast of the booths.";
dby[16] = "And it shall come to pass, that all that are left of all the nations which came against Jerusalem shall go up from year to year to worship the King, Jehovah of hosts, and to celebrate the feast of tabernacles.";
web[16] = "And it shall come to pass, [that] every one that is left of all the nations which came against Jerusalem shall even go up from year to year to worship the King, the LORD of hosts, and to keep the feast of tabernacles.";
hnv[16] = "It will happen that everyone who is left of all the nations that came against Yerushalayim will go up from year to year to worship the King, the LORD of Hosts, and to keep the feast of booths.";
vul[16] = "et omnes qui reliqui fuerint de universis gentibus quae venerint contra Hierusalem ascendent ab anno in annum ut adorent regem Dominum exercituum et celebrent festivitatem tabernaculorum";
kjv[17] = "And it shall be, [that] whoso will not come up of [all] the families of the earth unto Jerusalem to worship the King, the LORD of hosts, even upon them shall be no rain.";
rsv[17] = "And if any of the families of the earth do not go up to Jerusalem to worship the King, the LORD of hosts, there will be no rain upon them.";
asv[17] = "And it shall be, that whoso of [all] the families of the earth goeth not up unto Jerusalem to worship the King, Jehovah of hosts, upon them there shall be no rain.";
yng[17] = "And it hath come to pass, That he who doth not go up of the families of the land unto Jerusalem, To bow himself to the King, Jehovah of Hosts, Even on them there is no shower.";
dby[17] = "And it shall be, that whoso goeth not up of the families of the earth unto Jerusalem to worship the King, Jehovah of hosts, upon them shall be no rain.";
web[17] = "And it shall be, [that] whoever will not come up of [all] the families of the earth to Jerusalem to worship the King, the LORD of hosts, even upon them shall be no rain.";
hnv[17] = "It will be, that whoever of all the families of the eretz doesn\'t go up to Yerushalayim to worship the King, the LORD of Hosts, on them there will be no rain.";
vul[17] = "et erit qui non ascenderit de familiis terrae ad Hierusalem ut adoret regem Dominum exercituum non erit super eos imber";
kjv[18] = "And if the family of Egypt go not up, and come not, that [have] no [rain]; there shall be the plague, wherewith the LORD will smite the heathen that come not up to keep the feast of tabernacles.";
rsv[18] = "And if the family of Egypt do not go up and present themselves, then upon them shall come the plague with which the LORD afflicts the nations that do not go up to keep the feast of booths.";
asv[18] = "And if the family of Egypt go not up, and come not, neither [shall it be] upon them; there shall be the plague wherewith Jehovah will smite the nations that go not up to keep the feast of tabernacles.";
yng[18] = "And if the family of Egypt go not up, nor come in, Then not on them is the plague With which Jehovah doth plague the nations That go not up to celebrate the feast of booths.";
dby[18] = "And if the family of Egypt go not up, and come not, neither [shall it be] upon them; [there] shall be the plague, wherewith Jehovah will smite the nations that go not up to celebrate the feast of tabernacles.";
web[18] = "And if the family of Egypt shall not go up, and shall not come, that [have] no [rain]; there shall be the plague, with which the LORD will smite the heathen that come not up to keep the feast of tabernacles.";
hnv[18] = "If the family of Mitzrayim doesn\'t go up, and doesn\'t come, neither will it rain on them. This will be the plague with which the LORD will strike the nations that don\'t go up to keep the feast of booths.";
vul[18] = "quod si et familia Aegypti non ascenderit et non venerit nec super eos erit sed erit ruina qua percutiet Dominus omnes gentes quae non ascenderint ad celebrandam festivitatem tabernaculorum";

rsv[19] = "This shall be the punishment to Egypt and the punishment to all the nations that do not go up to keep the feast of booths.";
asv[19] = "This shall be the punishment of Egypt, and the punishment of all the nations that go not up to keep the feast of tabernacles.";
yng[19] = "This is the punishment of the sin of Egypt, And the punishment of the sin of all the nations, That go not up to celebrate the feast of booths.";
dby[19] = "This shall be the punishment of Egypt, and the punishment of all the nations that go not up to celebrate the feast of tabernacles.";

kjv[20] = "In that day shall there be upon the bells of the horses, HOLINESS UNTO THE LORD; and the pots in the LORD\'S house shall be like the bowls before the altar.";
rsv[20] = "And on that day there shall be inscribed on the bells of the horses, &quot;Holy to the LORD.&quot; And the pots in the house of the LORD shall be as the bowls before the altar;";
asv[20] = "In that day shall there be upon the bells of the horses, HOLY UNTO JEHOVAH; and the pots in Jehovah\'s house shall be like the bowls before the altar.";
yng[20] = "In that day there is on bells of the horse, `Holy to Jehovah,\' And the pots in the house of Jehovah Have been as bowls before the altar.";
dby[20] = "In that day shall there be upon the bells of the horses, HOLINESS UNTO JEHOVAH; and the pots in Jehovah\'s house shall be like the bowls before the altar.";

kjv[21] = "Yea, every pot in Jerusalem and in Judah shall be holiness unto the LORD of hosts: and all they that sacrifice shall come and take of them, and seethe therein: and in that day there shall be no more the Canaanite in the house of the LORD of hosts.";
rsv[21] = "and every pot in Jerusalem and Judah shall be sacred to the LORD of hosts, so that all who sacrifice may come and take of them and boil the flesh of the sacrifice in them. And there shall no longer be a trader in the house of the LORD of hosts on that day.";
asv[21] = "Yea, every pot in Jerusalem and in Judah shall be holy unto Jehovah of hosts; and all they that sacrifice shall come and take of them, and boil therein: and in that day there shall be no more a Canaanite in the house of Jehovah of hosts.";
yng[21] = "And every pot in Jerusalem, and in Judah, Have been holy to Jehovah of Hosts, And all those sacrificing have come in, And have taken of them, and boiled in them, And there is no merchant any more in the house of Jehovah of Hosts in that day!";

hnv[21] = "Yes, every pot in Yerushalayim and in Yehudah will be holy to the LORD of Hosts; and all those who sacrifice will come and take of them, and cook in them. In that day there will no longer be a Kana`ani in the house of the LORD of Hosts.";
