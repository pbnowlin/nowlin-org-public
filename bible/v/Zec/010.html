csb[1] = "Ask the LORD for rain in the season of spring rain. The LORD makes the rain clouds, and he will give them showers of rain and crops in the field for everyone.";
csb[2] = "For the idols speak falsehood, and the diviners see illusions; they relate empty dreams and offer empty comfort. Therefore the people wander like sheep; they suffer affliction because there is no shepherd.";
csb[3] = "My anger burns against the shepherds, so I will punish the leaders. For the LORD of Armies has tended his flock, the house of Judah; he will make them like his majestic steed in battle.";
csb[4] = "The cornerstone will come from Judah. The tent peg will come from them and also the battle bow and every ruler. Together";
csb[5] = "they will be like warriors in battle trampling down the mud of the streets. They will fight because the LORD is with them, and they will put horsemen to shame.";
csb[6] = "I will strengthen the house of Judah and deliver the house of Joseph. I will restore them because I have compassion on them, and they will be as though I had never rejected them. For I am the LORD their God, and I will answer them.";
csb[7] = "Ephraim will be like a warrior, and their hearts will be glad as if with wine. Their children will see it and be glad; their hearts will rejoice in the LORD.";
csb[8] = "I will whistle and gather them because I have redeemed them; they will be as numerous as they once were.";
csb[9] = "Though I sow them among the nations, they will remember me in the distant lands; they and their children will live and return.";
csb[10] = "I will bring them back from the land of Egypt and gather them from Assyria. I will bring them to the land of Gilead and to Lebanon, but it will not be enough for them.";
csb[11] = "The LORD  will pass through the sea of distress and strike the waves of the sea; all the depths of the Nile will dry up. The pride of Assyria will be brought down, and the scepter of Egypt will come to an end.";
csb[12] = "I will strengthen them in the LORD, and they will march in his name -- this is the LORD\'s declaration.";
kjv[1] = "Ask ye of the LORD rain in the time of the latter rain; [so] the LORD shall make bright clouds, and give them showers of rain, to every one grass in the field.";
rsv[1] = "Ask rain from the LORD in the season of the spring rain, from the LORD who makes the storm clouds, who gives men showers of rain, to every one the vegetation in the field.";
asv[1] = "Ask ye of Jehovah rain in the time of the latter rain, [even of] Jehovah that maketh lightnings; and he will give them showers of rain, to every one grass in the field.";
yng[1] = "They asked of Jehovah rain in a time of latter rain, Jehovah is making lightnings, And rain [in] showers He doth give to them. To each -- the herb in the field.";
dby[1] = "Ask of Jehovah rain in the time of the latter rain; Jehovah will make lightnings, and he will give them showers of rain, to every one grass in the field.";
web[1] = "Ask ye of the LORD rain in the time of the latter rain; [so] the LORD will make bright clouds, and give them showers of rain, to every one grass in the field.";
hnv[1] = "Ask of the LORD rain in the spring time, The LORD who makes storm clouds, And he gives rain showers to everyone for the plants in the field.";
vul[1] = "petite a Domino pluviam in tempore serotino et Dominus faciet nives et pluviam imbris dabit eis singulis herbam in agro";
kjv[2] = "For the idols have spoken vanity, and the diviners have seen a lie, and have told false dreams; they comfort in vain: therefore they went their way as a flock, they were troubled, because [there was] no shepherd.";
rsv[2] = "For the teraphim utter nonsense, and the diviners see lies; the dreamers tell false dreams, and give empty consolation. Therefore the people wander like sheep; they are afflicted for want of a shepherd.";
asv[2] = "For the teraphim have spoken vanity, and the diviners have seen a lie; and they have told false dreams, they comfort in vain: therefore they go their way like sheep, they are afflicted, because there is no shepherd.";
yng[2] = "Because the teraphim did speak iniquity, And the diviners have seen a falsehood, And dreams of the vanity they speak, [With] vanity they give comfort, Therefore they have journeyed as a flock, They are afflicted, for there is no shepherd.";
dby[2] = "For the teraphim have spoken vanity, and the diviners have seen a lie, and have told false dreams: they comfort in vain. Therefore they have gone away as a flock, they are in distress, because there is no shepherd.";
web[2] = "For the idols have spoken vanity, and the diviners have seen a lie, and have told false dreams; they comfort in vain: therefore they went their way as a flock, they were troubled because [there was] no shepherd.";
hnv[2] = "For the terafim have spoken vanity, and the diviners have seen a lie; And they have told false dreams. They comfort in vain. Therefore they go their way like sheep. They are oppressed, because there is no shepherd.";
vul[2] = "quia simulacra locuta sunt inutile et divini viderunt mendacium et somniatores frustra locuti sunt vane consolabantur idcirco abducti sunt quasi grex adfligentur quia non est eis pastor";
kjv[3] = "Mine anger was kindled against the shepherds, and I punished the goats: for the LORD of hosts hath visited his flock the house of Judah, and hath made them as his goodly horse in the battle.";
rsv[3] = "&quot;My anger is hot against the shepherds, and I will punish the leaders; for the LORD of hosts cares for his flock, the house of Judah, and will make them like his proud steed in battle.";
asv[3] = "Mine anger is kindled against the shepherds, and I will punish the he-goats; for Jehovah of hosts hath visited his flock, the house of Judah, and will make them as his goodly horse in the battle.";
yng[3] = "Against the shepherds did Mine anger burn, And against the he-goats I lay a charge, For inspected hath Jehovah of Hosts His flock, the house of Judah, And set them as His beauteous horse in battle.";
dby[3] = "Mine anger is kindled against the shepherds, and I will punish the he-goats; for Jehovah of hosts visiteth his flock, the house of Judah, and maketh them as his majestic horse in the battle.";
web[3] = "My anger was kindled against the shepherds, and I punished the goats: for the LORD of hosts hath visited his flock the house of Judah, and hath made them as his goodly horse in the battle.";
hnv[3] = "My anger is kindled against the shepherds, And I will punish the male goats; For the LORD of Hosts has visited his flock, the house of Yehudah, And will make them as his horse in the battle that he is proud of.";
vul[3] = "super pastores iratus est furor meus et super hircos visitabo quia visitavit Dominus exercituum gregem suum domum Iuda et posuit eos quasi equum gloriae suae in bello";
kjv[4] = "Out of him came forth the corner, out of him the nail, out of him the battle bow, out of him every oppressor together.";

kjv[5] = "And they shall be as mighty [men], which tread down [their enemies] in the mire of the streets in the battle: and they shall fight, because the LORD [is] with them, and the riders on horses shall be confounded.";
rsv[5] = "Together they shall be like mighty men in battle, trampling the foe in the mud of the streets; they shall fight because the LORD is with them, and they shall confound the riders on horses.";
asv[5] = "And they shall be as mighty men, treading down [their enemies] in the mire of the streets in the battle; and they shall fight, because Jehovah is with them; and the riders on horses shall be confounded.";
yng[5] = "And they have been as heroes, Treading in mire of out-places in battle, And they have fought, for Jehovah [is] with them, And have put to shame riders of horses.";

kjv[6] = "And I will strengthen the house of Judah, and I will save the house of Joseph, and I will bring them again to place them; for I have mercy upon them: and they shall be as though I had not cast them off: for I [am] the LORD their God, and will hear them.";
rsv[6] = "&quot;I will strengthen the house of Judah, and I will save the house of Joseph. I will bring them back because I have compassion on them, and they shall be as though I had not rejected them; for I am the LORD their God and I will answer them.";
asv[6] = "And I will strengthen the house of Judah, and I will save the house of Joseph, and I will bring them back; for I have mercy upon them; and they shall be as though I had not cast them off: for I am Jehovah their God, and I will hear them.";
yng[6] = "And I have made mighty the house of Judah, And the house of Joseph I do save, And I have caused them to dwell, for I have loved them, And they have been as [if] I had not cast them off, For I [am] Jehovah their God, And I answer them.";
dby[6] = "And I will strengthen the house of Judah, and I will save the house of Joseph, and I will bring them back again; for I will have mercy upon them; and they shall be as though I had not cast them off: for I am Jehovah their God, and I will answer them.";
web[6] = "And I will strengthen the house of Judah, and I will save the house of Joseph, and I will bring them again to place them; for I have mercy upon them: and they shall be as though I had not cast them off: for I [am] the LORD their God, and will hear them.";
hnv[6] = "&quot;I will strengthen the house of Yehudah, And I will save the house of Yosef, And I will bring them back; For I have mercy on them; And they will be as though I had not cast them off: For I am the LORD their God, and I will hear them.";
vul[6] = "et confortabo domum Iuda et domum Ioseph salvabo et convertam eos quia miserebor eorum et erunt sicut fuerunt quando non proieceram eos ego enim Dominus Deus eorum et exaudiam eos";
kjv[7] = "And [they of] Ephraim shall be like a mighty [man], and their heart shall rejoice as through wine: yea, their children shall see [it], and be glad; their heart shall rejoice in the LORD.";
rsv[7] = "Then E\'phraim shall become like a mighty warrior, and their hearts shall be glad as with wine. Their children shall see it and rejoice, their hearts shall exult in the LORD.";

yng[7] = "And Ephraim hath been as a hero, And rejoiced hath their heart as wine, And their sons see, and they have rejoiced, Rejoice doth their heart in Jehovah.";

rsv[8] = "&quot;I will signal for them and gather them in, for I have redeemed them, and they shall be as many as of old.";
asv[8] = "I will hiss for them, and gather them; for I have redeemed them; and they shall increase as they have increased.";
yng[8] = "I hist for them, and I gather them, For I have redeemed them, And they have multiplied as they did multiply.";
dby[8] = "I will hiss for them, and gather them; for I have redeemed them: and they shall multiply as they used to multiply.";
web[8] = "I will hiss for them, and gather them: for I have redeemed them: and they shall increase as they have increased.";
hnv[8] = "I will signal for them, and gather them; For I have redeemed them; And they will increase as they have increased.";

kjv[9] = "And I will sow them among the people: and they shall remember me in far countries; and they shall live with their children, and turn again.";
rsv[9] = "Though I scattered them among the nations, yet in far countries they shall remember me, and with their children they shall live and return.";
asv[9] = "And I will sow them among the peoples; and they shall remember me in far countries; and they shall live with their children, and shall return.";
yng[9] = "And I sow them among peoples, And in far-off places they remember Me, And they have lived with their sons, And they have turned back.";
dby[9] = "And I will sow them among the peoples, and they shall remember me in far countries; and they shall live with their children and return.";

hnv[9] = "I will sow them among the peoples; And they will remember me in far countries; And they will live with their children, and will return.";
vul[9] = "et seminabo eos in populis et de longe recordabuntur mei et vivent cum filiis suis et revertentur";
kjv[10] = "I will bring them again also out of the land of Egypt, and gather them out of Assyria; and I will bring them into the land of Gilead and Lebanon; and [place] shall not be found for them.";

yng[10] = "And I have brought them back from the land of Egypt, And from Asshur I do gather them, And unto the land of Gilead and Lebanon I do bring them in, And there is not found for them [space].";

asv[11] = "And he will pass through the sea of affliction, and will smite the waves in the sea, and all the depths of the Nile shall dry up; and the pride of Assyria shall be brought down, and the sceptre of Egypt shall depart.";
