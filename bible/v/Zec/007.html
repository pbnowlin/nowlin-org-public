csb[1] = "In the fourth year of King Darius, the word of the LORD came to Zechariah on the fourth day of the ninth month, which is Chislev.";
csb[2] = "Now the people of Bethel had sent Sharezer, Regem-melech, and their men to plead for the LORD\'s favor";
csb[3] = "by asking the priests who were at the house of the LORD of Armies as well as the prophets, &quot;Should we mourn and fast in the fifth month as we have done these many years? &quot;";
csb[4] = "Then the word of the LORD of Armies came to me:";
csb[5] = "&quot;Ask all the people of the land and the priests: When you fasted and lamented in the fifth and in the seventh months for these seventy years, did you really fast for me?";
csb[6] = "&quot;When you eat and drink, don\'t you eat and drink simply for yourselves?";
csb[7] = "&quot;Aren\'t these the words that the LORD proclaimed through the earlier prophets when Jerusalem was inhabited and secure, along with its surrounding cities, and when the southern region and the Judean foothills were inhabited? &quot;";
csb[8] = "The word of the LORD came to Zechariah:";
csb[9] = "&quot;The LORD of Armies says this: \'Make fair decisions. Show faithful love and compassion to one another.";
csb[10] = "&quot;Do not oppress the widow or the fatherless, the resident alien or the poor, and do not plot evil in your hearts against one another.\'";
csb[11] = "&quot;But they refused to pay attention and turned a stubborn shoulder; they closed their ears so they could not hear.";
csb[12] = "&quot;They made their hearts like a rock so as not to obey the law or the words that the LORD of Armies had sent by his Spirit through the earlier prophets. Therefore intense anger came from the LORD of Armies.";
csb[13] = "&quot;Just as he had called, and they would not listen, so when they called, I would not listen, says the LORD of Armies.";
csb[14] = "&quot;I scattered them with a windstorm over all the nations that had not known them, and the land was left desolate behind them, with no one coming or going. They turned a pleasant land into a desolation.&quot;";
