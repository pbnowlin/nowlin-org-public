csb[1] = "&quot;On that day a fountain will be opened for the house of David and for the residents of Jerusalem, to wash away sin and impurity.";
csb[2] = "&quot;On that day&quot; -- this is the declaration of the LORD of Armies -- &quot;I will remove the names of the idols from the land, and they will no longer be remembered. I will banish the prophets and the unclean spirit from the land.";
csb[3] = "&quot;If a man still prophesies, his father and his mother who bore him will say to him: You cannot remain alive because you have spoken a lie in the name of the LORD. When he prophesies, his father and his mother who bore him will pierce him through.";
csb[4] = "&quot;On that day every prophet will be ashamed of his vision when he prophesies; they will not put on a hairy cloak in order to deceive.";
