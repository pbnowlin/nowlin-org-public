csb[1] = "A pronouncement: The word of the LORD concerning Israel. A declaration of the LORD, who stretched out the heavens, laid the foundation of the earth, and formed the spirit of man within him.";
csb[2] = "&quot;Look, I will make Jerusalem a cup that causes staggering for the peoples who surround the city. The siege against Jerusalem will also involve Judah.";
csb[3] = "&quot;On that day I will make Jerusalem a heavy stone for all the peoples; all who try to lift it will injure themselves severely when all the nations of the earth gather against her.";
csb[4] = "&quot;On that day&quot; -- this is the LORD\'s declaration -- &quot;I will strike every horse with panic and its rider with madness. I will keep a watchful eye on the house of Judah but strike all the horses of the nations with blindness.";
csb[5] = "&quot;Then each of the leaders of Judah will think to himself: The residents of Jerusalem are my strength through the LORD of Armies, their God.";
csb[6] = "&quot;On that day I will make the leaders of Judah like a firepot in a woodpile, like a flaming torch among sheaves; they will consume all the peoples around them on the right and the left, while Jerusalem continues to be inhabited on its site, in Jerusalem.";
csb[7] = "&quot;The LORD will save the tents of Judah first, so that the glory of David\'s house and the glory of Jerusalem\'s residents may not be greater than that of Judah.";
csb[8] = "&quot;On that day the LORD will defend the inhabitants of Jerusalem, so that on that day the one who is weakest among them will be like David on that day, and the house of David will be like God, like the angel of the LORD, before them.";
csb[9] = "&quot;On that day I will set out to destroy all the nations that come against Jerusalem.";
csb[10] = "&quot;Then I will pour out a spirit of grace and prayer on the house of David and the residents of Jerusalem, and they will look at me whom they pierced. They will mourn for him as one mourns for an only child and weep bitterly for him as one weeps for a firstborn.";
csb[11] = "&quot;On that day the mourning in Jerusalem will be as great as the mourning of Hadad-rimmon in the plain of Megiddo.";
csb[12] = "&quot;The land will mourn, every family by itself: the family of David\'s house by itself and their women by themselves; the family of Nathan\'s house by itself and their women by themselves;";
csb[13] = "&quot;the family of Levi\'s house by itself and their women by themselves; the family of Shimei by itself and their women by themselves;";
csb[14] = "&quot;all the remaining families, every family by itself, and their women by themselves.";
kjv[1] = "The burden of the word of the LORD for Israel, saith the LORD, which stretcheth forth the heavens, and layeth the foundation of the earth, and formeth the spirit of man within him.";
kjv[2] = "Behold, I will make Jerusalem a cup of trembling unto all the people round about, when they shall be in the siege both against Judah [and] against Jerusalem.";
kjv[3] = "And in that day will I make Jerusalem a burdensome stone for all people: all that burden themselves with it shall be cut in pieces, though all the people of the earth be gathered together against it.";
kjv[4] = "In that day, saith the LORD, I will smite every horse with astonishment, and his rider with madness: and I will open mine eyes upon the house of Judah, and will smite every horse of the people with blindness.";
kjv[5] = "And the governors of Judah shall say in their heart, The inhabitants of Jerusalem [shall be] my strength in the LORD of hosts their God.";
kjv[6] = "In that day will I make the governors of Judah like an hearth of fire among the wood, and like a torch of fire in a sheaf; and they shall devour all the people round about, on the right hand and on the left: and Jerusalem shall be inhabited again in her own place, [even] in Jerusalem.";
kjv[7] = "The LORD also shall save the tents of Judah first, that the glory of the house of David and the glory of the inhabitants of Jerusalem do not magnify [themselves] against Judah.";
kjv[8] = "In that day shall the LORD defend the inhabitants of Jerusalem; and he that is feeble among them at that day shall be as David; and the house of David [shall be] as God, as the angel of the LORD before them.";
kjv[9] = "And it shall come to pass in that day, [that] I will seek to destroy all the nations that come against Jerusalem.";
kjv[10] = "And I will pour upon the house of David, and upon the inhabitants of Jerusalem, the spirit of grace and of supplications: and they shall look upon me whom they have pierced, and they shall mourn for him, as one mourneth for [his] only [son], and shall be in bitterness for him, as one that is in bitterness for [his] firstborn.";
kjv[11] = "In that day shall there be a great mourning in Jerusalem, as the mourning of Hadadrimmon in the valley of Megiddon.";
kjv[12] = "And the land shall mourn, every family apart; the family of the house of David apart, and their wives apart; the family of the house of Nathan apart, and their wives apart;";
kjv[13] = "The family of the house of Levi apart, and their wives apart; the family of Shimei apart, and their wives apart;";
kjv[14] = "All the families that remain, every family apart, and their wives apart.";
rsv[1] = "An Oracle The word of the LORD concerning Israel: Thus says the LORD, who stretched out the heavens and founded the earth and formed the spirit of man within him:";

yng[1] = "The burden of a word of Jehovah on Israel. An affirmation of Jehovah, Stretching out heaven, and founding earth, And forming the spirit of man in his midst.";
dby[1] = "The burden of the word of Jehovah concerning Israel. [Thus] saith Jehovah, who stretcheth out the heavens, and layeth the foundation of the earth, and formeth the spirit of man within him:";

hnv[1] = "An oracle. The word of the LORD concerning Yisra\'el. The LORD, who stretches out the heavens, and lays the foundation of the eretz, and forms the spirit of man within him says:";
vul[1] = "onus verbi Domini super Israhel dixit Dominus extendens caelum et fundans terram et fingens spiritum hominis in eo";
rsv[2] = "&quot;Lo, I am about to make Jerusalem a cup of reeling to all the peoples round about; it will be against Judah also in the siege against Jerusalem.";
asv[2] = "Behold, I will make Jerusalem a cup of reeling unto all the peoples round about, and upon Judah also shall it be in the siege against Jerusalem.";
yng[2] = "Lo, I am making Jerusalem a cup of reeling To all the peoples round about, And also against Judah it is, In the siege against Jerusalem.";
dby[2] = "Behold, I will make Jerusalem a cup of bewilderment unto all the peoples round about, and also against Judah shall it be in the siege against Jerusalem.";
web[2] = "Behold, I will make Jerusalem a cup of trembling to all the people around, when they shall be in the siege both against Judah [and] against Jerusalem.";
hnv[2] = "&quot;Behold, I will make Yerushalayim a cup of reeling to all the surrounding peoples, and on Yehudah also will it be in the siege against Yerushalayim.";
vul[2] = "ecce ego ponam Hierusalem superliminare crapulae omnibus populis in circuitu sed et Iuda erit in obsidione contra Hierusalem";
rsv[3] = "On that day I will make Jerusalem a heavy stone for all the peoples; all who lift it shall grievously hurt themselves. And all the nations of the earth will come together against it.";
asv[3] = "And it shall come to pass in that day, that I will make Jerusalem a burdensome stone for all the peoples; all that burden themselves with it shall be sore wounded; and all the nations of the earth shall be gathered together against it.";
yng[3] = "And it hath come to pass, in that day, I make Jerusalem a burdensome stone to all the peoples, All loading it are completely pressed down, And gathered against it have been all nations of the earth.";
dby[3] = "And it shall come to pass in that day [that] I will make Jerusalem a burdensome stone unto all peoples: all that burden themselves with it shall certainly be wounded, and all the nations of the earth shall be assembled together against it.";
web[3] = "And in that day will I make Jerusalem a burdensome stone for all people: all that burden themselves with it shall be cut in pieces, though all the people of the earth be assembled against it.";
hnv[3] = "It will happen in that day, that I will make Yerushalayim a burdensome stone for all the peoples. All who burden themselves with it will be severely wounded, and all the nations of the eretz will be gathered together against it.";
vul[3] = "et erit in die illa ponam Hierusalem lapidem oneris cunctis populis omnes qui levabunt eam concisione lacerabuntur et colligentur adversum eam omnia regna terrae";
rsv[4] = "On that day, says the LORD, I will strike every horse with panic, and its rider with madness. But upon the house of Judah I will open my eyes, when I strike every horse of the peoples with blindness.";
asv[4] = "In that day, saith Jehovah, I will smite every horse with terror, and his rider with madness; and I will open mine eyes upon the house of Judah, and will smite every horse of the peoples with blindness.";
yng[4] = "In that day -- an affirmation of Jehovah, I do smite every horse with astonishment, And its rider with madness, And on the house of Judah I open My eyes, And every horse of the peoples I smite with blindness.";
dby[4] = "In that day, saith Jehovah, I will smite every horse with astonishment, and his rider with madness; but I will open mine eyes upon the house of Judah, and will smite every horse of the peoples with blindness.";
web[4] = "In that day, saith the LORD, I will smite every horse with astonishment, and his rider with madness: and I will open my eyes upon the house of Judah, and will smite every horse of the people with blindness.";
hnv[4] = "In that day,&quot; says the LORD, &quot;I will strike every horse with terror, and his rider with madness; and I will open my eyes on the house of Yehudah, and will strike every horse of the peoples with blindness.";
vul[4] = "in die illa dicit Dominus percutiam omnem equum in stuporem et ascensorem eius in amentiam et super domum Iuda aperiam oculos meos et omnem equum populorum percutiam in caecitate";
rsv[5] = "Then the clans of Judah shall say to themselves, \'The inhabitants of Jerusalem have strength through the LORD of hosts, their God.\'";
asv[5] = "And the chieftains of Judah shall say in their heart, The inhabitants of Jerusalem are my strength in Jehovah of hosts their God.";
yng[5] = "And leaders of Judah have said in their heart, `Strength to me [are] the inhabitants of Jerusalem, In Jehovah of Hosts their God.\'";
dby[5] = "And the leaders of Judah shall say in their heart, The inhabitants of Jerusalem shall be my strength through Jehovah of hosts their God.";
web[5] = "And the governors of Judah shall say in their heart, The inhabitants of Jerusalem [shall be] my strength in the LORD of hosts their God.";
hnv[5] = "The chieftains of Yehudah will say in their heart, \'The inhabitants of Yerushalayim are my strength in the LORD of Hosts their God.\'";
vul[5] = "et dicent duces Iuda in corde suo confortentur mihi habitatores Hierusalem in Domino exercituum Deo eorum";
rsv[6] = "&quot;On that day I will make the clans of Judah like a blazing pot in the midst of wood, like a flaming torch among sheaves; and they shall devour to the right and to the left all the peoples round about, while Jerusalem shall still be inhabited in its place, in Jerusalem.";
asv[6] = "In that day will I make the chieftains of Judah like a pan of fire among wood, and like a flaming torch among sheaves; and they shall devour all the peoples round about, on the right hand and on the left; and [they of] Jerusalem shall yet again dwell in their own place, even in Jerusalem.";
yng[6] = "In that day I make the leaders of Judah As a hearth of fire among trees, And as a torch of fire in a sheaf, And they have consumed -- on the right and on the left -- all the peoples round about, And Jerusalem hath inhabited again her place in Jerusalem.";
dby[6] = "In that day will I make the leaders of Judah like a hearth of fire among wood, and like a torch of fire in a sheaf; and they shall devour all the peoples round about, on the right hand and on the left; and Jerusalem shall dwell again in her own place, in Jerusalem.";
web[6] = "In that day will I make the governors of Judah like a hearth of fire among the wood, and like a torch of fire in a sheaf; and they shall devour all the people around, on the right hand and on the left: and Jerusalem shall be inhabited again in her own place, [even] in Jerusalem.";
hnv[6] = "In that day I will make the chieftains of Yehudah like a pan of fire among wood, and like a flaming torch among sheaves; and they will devour all the surrounding peoples, on the right hand and on the left; and Yerushalayim will yet again dwell in their own place, even in Yerushalayim.";
vul[6] = "in die illo ponam duces Iuda sicut caminum ignis in lignis et sicut facem ignis in faeno et devorabunt ad dextram et ad sinistram omnes populos in circuitu et habitabitur Hierusalem rursum in loco suo in Hierusalem";
rsv[7] = "&quot;And the LORD will give victory to the tents of Judah first, that the glory of the house of David and the glory of the inhabitants of Jerusalem may not be exalted over that of Judah.";
asv[7] = "Jehovah also shall save the tents of Judah first, that the glory of the house of David and the glory of the inhabitants of Jerusalem be not magnified above Judah.";
yng[7] = "And saved hath Jehovah the tents of Judah first, So that become not great against Judah Doth the beauty of the house of David, And the beauty of the inhabitant of Jerusalem.";
dby[7] = "And Jehovah shall save the tents of Judah first, that the glory of the house of David and the glory of the inhabitants of Jerusalem be not magnified over Judah.";
web[7] = "The LORD also will save the tents of Judah first, that the glory of the house of David and the glory of the inhabitants of Jerusalem may not magnify [themselves] against Judah.";
hnv[7] = "The LORD also will save the tents of Yehudah first, that the glory of the house of David and the glory of the inhabitants of Yerushalayim not be magnified above Yehudah.";
vul[7] = "et salvabit Dominus tabernacula Iuda sicut in principio ut non magnifice glorietur domus David et gloria habitantium Hierusalem contra Iudam";
rsv[8] = "On that day the LORD will put a shield about the inhabitants of Jerusalem so that the feeblest among them on that day shall be like David, and the house of David shall be like God, like the angel of the LORD, at their head.";
asv[8] = "In that day shall Jehovah defend the inhabitants of Jerusalem; and he that is feeble among them at that day shall be as David; and the house of David shall be as God, as the angel of Jehovah before them.";
yng[8] = "In that day cover over doth Jehovah the inhabitant of Jerusalem, And the stumbling among them hath been in that day as David, And the house of David as God -- As a messenger of Jehovah -- before them.";
dby[8] = "In that day will Jehovah defend the inhabitants of Jerusalem; and he that stumbleth among them at that day shall be as David; and the house of David as God, as the Angel of Jehovah before them.";
web[8] = "In that day will the LORD defend the inhabitants of Jerusalem; and he that is feeble among them at that day shall be as David; and the house of David [shall be] as God, as the angel of the LORD before them.";
hnv[8] = "In that day the LORD will defend the inhabitants of Yerushalayim. He who is feeble among them at that day will be like David, and the house of David will be like God, like the angel of the LORD before them.";

rsv[10] = "&quot;And I will pour out on the house of David and the inhabitants of Jerusalem a spirit of compassion and supplication, so that, when they look on him whom they have pierced, they shall mourn for him, as one mourns for an only child, and weep bitterly over him, as one weeps over a first-born.";
asv[10] = "And I will pour upon the house of David, and upon the inhabitants of Jerusalem, the spirit of grace and of supplication; and they shall look unto me whom they have pierced; and they shall mourn for him, as one mourneth for his only son, and shall be in bitterness for him, as one that is in bitterness for his first-born.";
yng[10] = "And I have poured on the house of David, And on the inhabitant of Jerusalem, A spirit of grace and supplications, And they have looked unto Me whom they pierced, And they have mourned over it, Like a mourning over the only one, And they have been in bitterness for it, Like a bitterness over the first-born.";
dby[10] = "And I will pour upon the house of David and upon the inhabitants of Jerusalem the spirit of grace and of supplications; and they shall look on me whom they pierced, and they shall mourn for him, as one mourneth for an only [son], and shall be in bitterness for him, as one that is in bitterness for [his] firstborn.";
web[10] = "And I will pour upon the house of David, and upon the inhabitants of Jerusalem, the spirit of grace and of supplications: and they shall look upon me whom they have pierced, and they shall mourn for him, as one mourneth for [his] only [son], and shall be in bitterness for him, as one that is in bitterness for [his] first-born.";
hnv[10] = "I will pour on the house of David, and on the inhabitants of Yerushalayim, the spirit of grace and of supplication; and they will look to me whom they have pierced; and they shall mourn for him, as one mourns for his only son, and will grieve bitterly for him, as one grieves for his firstborn.";
