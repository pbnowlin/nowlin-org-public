csb[1] = "Open your gates, Lebanon, and fire will consume your cedars.";
csb[2] = "Wail, cypress, for the cedar has fallen; the glorious trees are destroyed! Wail, oaks of Bashan, for the stately forest has fallen!";
csb[3] = "Listen to the wail of the shepherds, for their glory is destroyed. Listen to the roar of young lions, for the thickets of the Jordan are destroyed.";
csb[4] = "The LORD my God says this: &quot;Shepherd the flock intended for slaughter.";
csb[5] = "&quot;Those who buy them slaughter them but are not punished. Those who sell them say: Blessed be the LORD because I have become rich! Even their own shepherds have no compassion for them.";
csb[6] = "&quot;Indeed, I will no longer have compassion on the inhabitants of the land&quot; -- this is the LORD\'s declaration. &quot;Instead, I will turn everyone over to his neighbor and his king. They will devastate the land, and I will not rescue it from their hand.&quot;";
csb[7] = "So I shepherded the flock intended for slaughter, the oppressed of the flock. I took two staffs, calling one Favor and the other Union, and I shepherded the flock.";
csb[8] = "In one month I got rid of three shepherds. I became impatient with them, and they also detested me.";
csb[9] = "Then I said, &quot;I will no longer shepherd you. Let what is dying die, and let what is perishing perish; let the rest devour each other\'s flesh.&quot;";
csb[10] = "Next I took my staff called Favor and cut it in two, annulling the covenant I had made with all the peoples.";
csb[11] = "It was annulled on that day, and so the oppressed of the flock who were watching me knew that it was the word of the LORD.";
csb[12] = "Then I said to them, &quot;If it seems right to you, give me my wages; but if not, keep them.&quot; So they weighed my wages, thirty pieces of silver.";
csb[13] = "&quot;Throw it to the potter,&quot; the LORD said to me -- this magnificent price I was valued by them. So I took the thirty pieces of silver and threw it into the house of the LORD, to the potter.";
csb[14] = "Then I cut in two my second staff, Union, annulling the brotherhood between Judah and Israel.";
csb[15] = "The LORD also said to me: &quot;Take the equipment of a foolish shepherd.";
csb[16] = "&quot;I am about to raise up a shepherd in the land who will not care for those who are perishing, and he will not seek the lost or heal the broken. He will not sustain the healthy, but he will devour the flesh of the fat sheep and tear off their hooves.";
csb[17] = "&quot;Woe to the worthless shepherd who deserts the flock! May a sword strike his arm and his right eye! May his arm wither away and his right eye go completely blind! &quot;";
