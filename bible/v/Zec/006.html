csb[1] = "Then I looked up again and saw four chariots coming from between two mountains. The mountains were made of bronze.";
csb[2] = "The first chariot had chestnut horses, the second chariot black horses,";
csb[3] = "the third chariot white horses, and the fourth chariot dappled horses -- all strong horses.";
csb[4] = "So I inquired of the angel who was speaking with me, &quot;What are these, my lord? &quot;";
csb[5] = "The angel told me, &quot;These are the four spirits of heaven going out after presenting themselves to the Lord of the whole earth.";
csb[6] = "&quot;The one with the black horses is going to the land of the north, the white horses are going after them, but the dappled horses are going to the land of the south.&quot;";
csb[7] = "As the strong horses went out, they wanted to go patrol the earth, and the LORD said, &quot;Go, patrol the earth.&quot; So they patrolled the earth.";
csb[8] = "Then he summoned me saying, &quot;See, those going to the land of the north have pacified my Spirit in the northern land.&quot;";
csb[9] = "The word of the LORD came to me:";
csb[10] = "&quot;Take an offering from the exiles, from Heldai, Tobijah, and Jedaiah, who have arrived from Babylon, and go that same day to the house of Josiah son of Zephaniah.";
csb[11] = "&quot;Take silver and gold, make a crown, and place it on the head of Joshua son of Jehozadak, the high priest.";
csb[12] = "&quot;You are to tell him: This is what the LORD of Armies says: Here is a man whose name is Branch; he will branch out from his place and build the LORD\'s temple.";
csb[13] = "&quot;Yes, he will build the LORD\'s temple; he will be clothed in splendor and will sit on his throne and rule. There will also be a priest on his throne, and there will be peaceful counsel between the two of them.";
csb[14] = "&quot;The crown will reside in the LORD\'s temple as a memorial to Heldai, Tobijah, Jedaiah, and Hen son of Zephaniah.";
csb[15] = "&quot;People who are far off will come and build the LORD\'s temple, and you will know that the LORD of Armies has sent me to you. This will happen when you fully obey the LORD your God.&quot;";
