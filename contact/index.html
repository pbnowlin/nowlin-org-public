       covers the inlined Signal QR code, which is the only image on the page.
       See /crypto for why frame-ancestors is absent. -->

  <title>Nowlin</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-deep: #020617;
      --bg-mid: #0a1330;
      --accent: #15803d;
      --accent-2: #f0b429;
      --glass: rgba(255, 255, 255, 0.08);
      --glass-border: rgba(255, 255, 255, 0.22);
      --text: #f5f7fb;
      --dim: #9aa5c0;
      --mono: 'Martian Mono', monospace;
    }

    html, body {
      height: 100%;
    }

    body {
      background:
        radial-gradient(circle at 20% 20%, rgba(21, 128, 61, 0.2), transparent 42%),
        radial-gradient(circle at 80% 78%, rgba(240, 180, 41, 0.18), transparent 42%),
        linear-gradient(160deg, var(--bg-deep), var(--bg-mid) 60%, var(--bg-deep));
      background-attachment: fixed;
      color: var(--text);
      font-family: var(--mono);
      font-weight: 200;
      font-size: 13px;
      line-height: 1;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
      overflow-x: hidden;
      position: relative;
    }

    body::before,
    body::after {
      content: '';
      position: fixed;
      width: 55vmax;
      height: 55vmax;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.35;
      z-index: 0;
      pointer-events: none;
    }

    body::before {
      background: var(--accent);
      top: -20vmax;
      left: -18vmax;
      animation: drift1 20s ease-in-out infinite alternate;
    }

    body::after {
      background: var(--accent-2);
      bottom: -20vmax;
      right: -18vmax;
      animation: drift2 24s ease-in-out infinite alternate;
    }

    @keyframes drift1 {
      from { transform: translate(0, 0); }
      to   { transform: translate(6vmax, 8vmax); }
    }

    @keyframes drift2 {
      from { transform: translate(0, 0); }
      to   { transform: translate(-6vmax, -8vmax); }
    }

    /* glass card */
    section {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 320px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
      padding: 48px 40px;
      border-radius: 28px;
      background: linear-gradient(160deg, rgba(255, 255, 255, 0.09), rgba(255, 255, 255, 0.02));
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      box-shadow:
        0 8px 32px rgba(0, 0, 0, 0.45),
        inset 0 1px 0 rgba(255, 255, 255, 0.14),
        0 0 50px rgba(21, 128, 61, 0.14),
        0 0 70px rgba(240, 180, 41, 0.12);
      opacity: 0;
      animation: in 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes in {
      from { opacity: 0; transform: translateY(16px) scale(0.96); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .label {
      font-size: 11px;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--text);
      text-shadow:
        0 0 14px rgba(21, 128, 61, 0.55),
        0 0 22px rgba(240, 180, 41, 0.45);
    }

    /* qr chip */
    .qr-chip {
      background: #ffffff;
      padding: 16px;
      border-radius: 18px;
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.6) inset,
        0 0 40px rgba(21, 128, 61, 0.22),
        0 0 40px rgba(240, 180, 41, 0.2);
    }

    .qr-chip img {
      display: block;
      width: min(200px, 52vw);
      height: min(200px, 52vw);
      object-fit: contain;
    }

    /* ichthys */
    .ichthys {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 2;
      line-height: 0;
      color: var(--accent);
      filter: drop-shadow(0 0 6px rgba(21, 128, 61, 0.6));
      opacity: 0;
      animation: in 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
      transition: filter 0.2s ease, transform 0.2s ease;
    }

    .ichthys:hover {
      filter: drop-shadow(0 0 12px rgba(21, 128, 61, 0.9));
      transform: scale(1.08);
    }

    .ichthys svg {
      display: block;
      width: 38px;
      height: auto;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
